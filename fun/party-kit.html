    <template id="help">
        <h3>這是什麼</h3>
        <p>六個派對小工具合在一起：真心話大冒險、比手畫腳、腦筋急轉彎、國王遊戲、發牌器、交換禮物抽籤。不用連線，一支手機就夠。</p>
        <h3>什麼時候用</h3>
        <ul><li>朋友聚會、同樂會、尾牙、聖誕節交換禮物。</li><li>需要題目、計時、發牌或隨機配對的時候。</li></ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>真心話：選難度（輕鬆 / 進階 / 辣）與類型後抽題，抽完才會重複。可自訂題目。</li>
        <li>比手畫腳：選分類抽題，設定秒數按「開始倒數」，時間到會響；兩隊或多人計分。倒數期間盡量保持螢幕亮著。</li>
        <li>腦筋急轉彎：抽題、想一想再按「看答案」，看過的題目會標記，不會再抽到。</li>
        <li>國王遊戲、發牌、交換禮物：先在上方輸入參加者名單。按發牌 / 抽籤後，把手機交給被點名的人，他「按住」按鈕看自己的牌或結果，放開就隱藏，再傳給下一位。</li>
        <li>國王遊戲：一人是國王，其餘抽到編號；全員看完後國王亮牌，按「產生指令」讓編號人員執行。</li>
        <li>發牌器：2–10 人，可含 1–2 張鬼牌；填牌堆種子可重現同一副牌。最後一位會看到底牌。</li>
        <li>交換禮物：可填「不可抽到」的配對（如夫妻）；每人只看得到自己要送誰，全部揭曉需確認。若限制太多無解，會提示你減少限制。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">名單「小明、小華、小美、阿強」→ 交換禮物排除「小明,小美」→ 例如：小明送阿強、小美送小華…（每人只看自己的）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>只有「自訂題目 / 自訂指令 / 腦筋急轉彎已看過紀錄」存在這個瀏覽器（自訂題目與指令各最多 200 筆、每筆 80 字；滿了要先刪除才能新增）。單筆可按「刪除」，也可按「清除全部」（會先確認、無法復原）。</li>
        <li>參加者名單、牌局、抽籤結果與分數不會存，重新整理就消失。</li>
        <li>題庫內容以朋友聚會為主，「辣」只是更尷尬而已；請看場合、尊重彼此，不想答可以跳過。內容僅供參考。</li>
        </ul>
    </template>

        const opts = (sel, arr) => sel.replaceChildren(...arr.map(([v, t]) => el('option', { value: v, textContent: t })));
        let S = cleanCustom(store.get('partykit_custom', null));
        const save = () => store.set('partykit_custom', S);
        const newId = () => Util.randomHex(4);

        // ---- 分頁 ----
        function tab(t) {
            [...$('#tabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            ['tod', 'cha', 'brain', 'king', 'deal', 'gift'].forEach(k => { $('#p-' + k).hidden = k !== t; });
            $('#namesCard').hidden = !['cha', 'king', 'deal', 'gift'].includes(t) || (t === 'cha' && $('#chaMode').value !== 'solo');
        }
        $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); };
        const names = () => [...new Set(parseNames($('#names').value).map(s => s.slice(0, 12)))].slice(0, 30);
        $('#names').oninput = () => { $('#nameInfo').textContent = names().length ? `共 ${names().length} 人（最多 30 人，重複名字只算一次）` : ''; if (!$('#p-cha').hidden) renderScore(); };

        // ---- 按住看的傳遞元件 ----
        function runPass(box, items, done) {
            let i = 0;
            const show = () => {
                if (i >= items.length) { box.replaceChildren(el('p', { textContent: '全部看完了！' })); if (done) done(); return; }
                const who = el('p'), secret = el('div', { className: 'secret', textContent: '？？？' });
                const hold = el('button', { className: 'primary hold', textContent: '按住看' });
                const next = el('button', { textContent: i === items.length - 1 ? '完成' : '傳給下一位', disabled: true });
                who.append('輪到 ', el('b', { textContent: items[i].who }), `（${i + 1} / ${items.length}）：拿著手機，按住按鈕看`);
                const on = () => { secret.textContent = items[i].text; secret.classList.add('on'); next.disabled = false; };
                const off = () => { secret.textContent = '？？？'; secret.classList.remove('on'); };
                hold.onpointerdown = (e) => { e.preventDefault(); on(); };
                ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(t => hold.addEventListener(t, off));
                hold.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(); } };
                hold.onkeyup = off;
                hold.oncontextmenu = (e) => e.preventDefault();
                next.onclick = () => { i++; show(); };
                box.replaceChildren(who, secret, hold, next);
            };
            show();
        }

        // ---- 自訂清單（真心話 / 國王共用）----
        function renderCustom(listEl, items, label, onDel) {
            listEl.replaceChildren(...items.map(x => el('div', { className: 'cl' }, el('span', { textContent: label(x) }), el('button', { className: 'sm', textContent: '刪除', onclick: () => onDel(x.id) }))));
        }
        function addCustom(list, item) {
            if (list.length >= MAXC) { alert(`已達上限 ${MAXC} 筆，請先刪除一些再新增。`); return false; }
            list.push(item); save(); return true;
        }

        // ---- 真心話大冒險 ----
        const used = {};
        const todCustomNote = () => { $('#todCnt').textContent = `（${S.tod.length} / ${MAXC}）`; };
        function drawTod() {
            const lv = $('#todLv').value, ty = $('#todTy').value, pool = todPool(lv, ty, S.tod), key = lv + ty;
            if (!pool.length) { $('#todOut').textContent = '這個分類目前沒有題目，請先在下方自訂題目。'; return; }
            const r = pickNew(pool.length, used[key] || []); used[key] = r.used;
            $('#todOut').replaceChildren(el('div', { className: 'tag', textContent: pool[r.i].t === 'T' ? '真心話' : '大冒險' }), el('div', { textContent: pool[r.i].q }));
            $('#todInfo').textContent = r.reset ? '題目抽完了，重新洗牌' : `已抽 ${r.used.length} / ${pool.length}`;
        }
        function renderTodList() {
            todCustomNote();
            renderCustom($('#todList'), S.tod, x => (x.t === 'T' ? '[真心話] ' : '[大冒險] ') + x.q, (id) => { S.tod = S.tod.filter(x => x.id !== id); save(); renderTodList(); });
        }
        $('#todGo').onclick = drawTod;
        $('#todAdd').onclick = () => {
            const q = $('#todNew').value.trim().slice(0, MAXLEN); if (!q) return;
            if (addCustom(S.tod, { id: newId(), t: $('#todNewTy').value, q })) { $('#todNew').value = ''; renderTodList(); }
        };
        $('#todClear').onclick = () => { if (!S.tod.length) return; if (!confirm('清除全部自訂題目？無法復原。')) return; S.tod = []; save(); renderTodList(); };

        // ---- 比手畫腳 ----
        opts($('#chaCat'), Object.keys(CHA).map(k => [k, k]));
        let chaEnd = 0, chaTimer = 0, wl = null;
        const lock = async () => { try { wl = await navigator.wakeLock.request('screen'); } catch (e) { wl = null; } };
        const unlock = () => { try { if (wl) wl.release(); } catch (e) { } wl = null; };
        const secs = () => Math.min(300, Math.max(10, parseInt($('#chaSec').value, 10) || 60));
        function stopCha(ring) {
            clearInterval(chaTimer); chaTimer = 0; unlock();
            $('#chaTimer').textContent = '開始倒數';
            if (ring) { $('#chaTime').textContent = '時間到！'; $('#chaTime').classList.add('end'); Util.beep(3); }
        }
        function tickCha() { const r = remain(chaEnd, Date.now()); if (r <= 0) stopCha(true); else $('#chaTime').textContent = r; }
        $('#chaGo').onclick = () => {
            const cat = $('#chaCat').value, r = pickNew(CHA[cat].length, used['c' + cat] || []); used['c' + cat] = r.used;
            $('#chaWord').textContent = CHA[cat][r.i];
        };
        $('#chaTimer').onclick = () => {
            if (chaTimer) { stopCha(false); $('#chaTime').textContent = secs(); return; }
            chaEnd = Date.now() + secs() * 1000; $('#chaTime').classList.remove('end'); $('#chaTimer').textContent = '停止';
            tickCha(); chaTimer = setInterval(tickCha, 200); lock();
        };
        $('#chaSec').onchange = () => { if (!chaTimer) { $('#chaSec').value = secs(); $('#chaTime').textContent = secs(); $('#chaTime').classList.remove('end'); } };
        document.addEventListener('visibilitychange', () => { if (!document.hidden && chaTimer) lock(); });
        let scores = {};
        function renderScore() {
            const solo = $('#chaMode').value === 'solo', labels = solo ? names() : ['紅隊', '藍隊'];
            $('#namesCard').hidden = !solo || $('#p-cha').hidden;
            const ch = (l, d) => { scores[l] = (scores[l] || 0) + d; renderScore(); };
            $('#chaScore').replaceChildren(...(labels.length ? labels.map(l => el('div', { className: 'sc' }, el('b', { textContent: l }), el('button', { className: 'sm', textContent: '−', onclick: () => ch(l, -1) }), el('span', { textContent: scores[l] || 0 }), el('button', { className: 'sm', textContent: '+', onclick: () => ch(l, 1) }))) : [el('div', { className: 'muted', textContent: '請先在上方輸入參加者' })]));
        }
        $('#chaMode').onchange = renderScore;
        $('#chaReset').onclick = () => { if (!confirm('分數全部歸零？')) return; scores = {}; renderScore(); };

        // ---- 腦筋急轉彎 ----
        opts($('#brCat'), [['', '全部'], ...Object.keys(BRAIN_SRC).map(k => [k, k])]);
        let brCur = -1;
        const brInfo = () => { $('#brInfo').textContent = `已看過 ${S.seen.length} / ${BRAIN.length}`; };
        $('#brGo').onclick = () => {
            const cat = $('#brCat').value, ids = BRAIN.map((q, i) => i).filter(i => (!cat || BRAIN[i].cat === cat) && !S.seen.includes(i));
            $('#brA').hidden = true;
            if (!ids.length) { brCur = -1; $('#brQ').textContent = '這個分類的題目都看過了！可按「清除已看過紀錄」重來。'; $('#brShow').disabled = true; return; }
            brCur = ids[Util.rnd(ids.length)];
            $('#brQ').replaceChildren(el('div', { className: 'tag', textContent: BRAIN[brCur].cat }), el('div', { textContent: BRAIN[brCur].q }));
            $('#brShow').disabled = false;
        };
        $('#brShow').onclick = () => {
            if (brCur < 0) return;
            $('#brA').textContent = '答案：' + BRAIN[brCur].a; $('#brA').hidden = false; $('#brShow').disabled = true;
            if (!S.seen.includes(brCur)) { S.seen.push(brCur); save(); brInfo(); }
        };
        $('#brClear').onclick = () => { if (!S.seen.length) return; if (!confirm('清除全部「已看過」紀錄？無法復原。')) return; S.seen = []; save(); brInfo(); };

        // ---- 國王遊戲 ----
        let kgN = 0;
        const kgList = () => { const lv = $('#kgLv').value; return lv === 'mine' ? S.king.map(x => x.q) : KING[lv]; };
        function renderKingList() {
            $('#kgCnt').textContent = `（${S.king.length} / ${MAXC}）`;
            renderCustom($('#kgList'), S.king, x => x.q, (id) => { S.king = S.king.filter(x => x.id !== id); save(); renderKingList(); });
        }
        $('#kgDeal').onclick = () => {
            const ns = names();
            if (ns.length < 3) { $('#kgPass').textContent = '至少需要 3 人（請在上方輸入參加者名單）'; return; }
            kgN = ns.length; $('#kgAfter').hidden = true; $('#kgOut').textContent = '';
            const cards = shuf(['👑 你是國王', ...Array.from({ length: ns.length - 1 }, (_, i) => `你是 ${i + 1} 號`)]);
            runPass($('#kgPass'), ns.map((who, i) => ({ who, text: cards[i] })), () => { $('#kgAfter').hidden = false; });
        };
        $('#kgCmd').onclick = () => {
            const c = kingGen(kgList(), Array.from({ length: kgN - 1 }, (_, i) => i + 1));
            $('#kgOut').textContent = c || '沒有適合的指令（自訂指令請新增，或換難度）';
        };
        $('#kgAdd').onclick = () => {
            const q = $('#kgNew').value.trim().slice(0, MAXLEN); if (!q) return;
            if (addCustom(S.king, { id: newId(), q })) { $('#kgNew').value = ''; renderKingList(); }
        };
        $('#kgClear').onclick = () => { if (!S.king.length) return; if (!confirm('清除全部自訂指令？無法復原。')) return; S.king = []; save(); renderKingList(); };

        // ---- 發牌器 ----
        $('#dlGo').onclick = () => {
            const ns = names(), per = Math.floor(+$('#dlPer').value), jk = +$('#dlJk').value, info = $('#dlInfo'), seed = $('#dlSeed').value.trim();
            if (ns.length < 2 || ns.length > 10) { info.textContent = '參加者需要 2–10 人（請在上方輸入名單）'; return; }
            const deck = makeDeck(jk), d = per >= 1 ? deal(deck, ns.length, per, rngOf(seed)) : null;
            if (!d) { info.textContent = `牌不夠：${ns.length} 人 × ${per} 張超過 ${deck.length} 張`; return; }
            info.textContent = `共 ${deck.length} 張，發出 ${ns.length * per} 張，剩 ${d.rest.length} 張` + (seed ? `（種子 ${seed}）` : '');
            const items = ns.map((who, i) => ({ who, text: d.hands[i].join('  ') }));
            if (d.rest.length) items.push({ who: '底牌', text: d.rest.join('  ') });
            runPass($('#dlPass'), items);
        };

        // ---- 交換禮物 ----
        let giftRes = null;
        $('#gGo').onclick = () => {
            const ns = names(), { pairs, bad } = parseBanned($('#gbad').value, ns);
            $('#gErr').textContent = ''; $('#gAfter').hidden = true; $('#gTable').replaceChildren(); giftRes = null;
            if (ns.length < 2) { $('#gErr').textContent = '至少需要 2 人（請在上方輸入名單）'; return; }
            if (bad.length) { $('#gErr').textContent = `這些排除配對無效（要兩個不同、且都在名單內的名字）：${bad.join(' / ')}`; return; }
            giftRes = pairUp(ns, pairs);
            if (!giftRes) { $('#gErr').textContent = '無解：排除條件太多，沒有任何人人都不抽到自己的配法。請減少排除配對。'; $('#gPass').replaceChildren(); return; }
            $('#gInfo').textContent = `${ns.length} 人，排除 ${pairs.length} 組`;
            runPass($('#gPass'), ns.map((who, i) => ({ who, text: `你要送禮物給：${giftRes[i]}` })), () => { $('#gAfter').hidden = false; });
        };
        $('#gAll').onclick = () => {
            if (!giftRes || !confirm('全部揭曉會顯示完整配對，確定嗎？')) return;
            const ns = names();
            $('#gTable').replaceChildren(...ns.map((n, i) => el('div', { className: 'li' }, el('span', { textContent: n }), el('b', { textContent: '→ ' + giftRes[i] }))));
        };

        tab('tod'); renderTodList(); renderKingList(); brInfo(); renderScore();
    </script>
</body>

</html>
