    <template id="help">
        <h3>這是什麼</h3>
        <p>成語接龍：用上一個成語的最後一個字開頭，接一個四字成語，不能重複。可以一個人和電腦玩，也能 2–8 人連線。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>通勤、排隊時一個人練成語。</li>
        <li>聚會時開房間，和朋友限時淘汰。</li>
        </ul>
        <h3>怎麼玩</h3>
        <p><b>單機（和電腦）：</b></p>
        <ol>
        <li>選電腦難度與每回合秒數，按「單機開始」。</li>
        <li>看畫面上大字的最後一字，輸入以它開頭的四字成語，按「送出」或 <kbd>Enter</kbd>。</li>
        <li>卡住時按「提示」，會給一個可接的成語，扣 3 分。</li>
        <li>超時扣 1 命（共 3 命，用完就輸）；電腦接不下去就認輸，你贏。</li>
        </ol>
        <p><b>連線：</b>輸入暱稱按「建立房間」，按「複製邀請連結」傳給朋友（或讓對方貼上房號按「加入」）。2–8 人到齊後房主按「開始遊戲」。每人 3 命、每次 30 秒，超時扣命，最後存活者獲勝。詞庫沒收錄的四字詞由房主裁決。</p>
        <h3>難度</h3>
        <ul>
        <li>簡單：隨機接，偶爾想不出來就認輸。</li>
        <li>普通：隨機接，有字可接就不認輸。</li>
        <li>困難：專挑尾字冷門的成語，讓你更難接。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">題目「風花雪月」→ 要用「月」開頭 → 你輸入「月明星稀」→ 電腦接「稀…」若詞庫沒有，電腦認輸，你贏。</div>
        <h3>小提醒</h3>
        <ul>
        <li>單機只收頁面內建詞庫的成語；連線時詞庫外的詞可由房主認可。</li>
        <li>單機完全離線可玩，資料不會上傳。</li>
        <li>手機上輸入完按鍵盤的送出，或按「送出」。</li>
        </ul>
    </template>

        <h1>成語接龍</h1>
        <p class="sub">可單機和電腦接龍，也能多人連線。連線：輪流用上一個成語的最後一個字開頭，接一個四字成語（不能重複）。每人 3 條命，每次限時 30 秒，超時扣一命，最後存活的人獲勝。詞庫沒有收錄的四字詞由房主裁決是否接受。</p>

        <div class="card" id="menu">
            <h2>單人和電腦接龍</h2>
            <div class="row">
                <select id="soloLevel" aria-label="電腦難度"><option value="easy">簡單（電腦偶爾認輸）</option><option value="normal" selected>普通</option><option value="hard">困難（專挑冷門字）</option></select>
                <select id="soloSecs" aria-label="每回合秒數"><option value="15">每回合 15 秒</option><option value="30" selected>每回合 30 秒</option><option value="60">每回合 60 秒</option></select>
            </div>
            <div class="row"><button class="primary" id="soloBtn">單機開始</button></div>
            <h2 style="margin-top:18px">和朋友連線</h2>
            <div class="row"><input id="nick" maxlength="10" placeholder="暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button class="primary" id="hostBtn">建立房間</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="joinBtn">加入</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div class="card" id="lobby" hidden>
            <h2>等待玩家加入（2–8 人）</h2>
            <div class="players" id="lobbyPlayers"></div>
            <div class="row" style="margin-top:12px">
                <button id="copyInvite" hidden>複製邀請連結</button>
                <button class="primary" id="startBtn" hidden disabled>開始遊戲</button>
            </div>
            <p class="note" id="lobbyHint"></p>
        </div>

        <div id="game" hidden>
            <div class="card">
                <div class="players" id="board"></div>
                <div id="last"></div>
                <div id="need"></div>
                <div id="timer"></div>
                <div id="judge" hidden><span id="judgeText"></span><div class="row" style="justify-content:center;margin:8px 0 0"><button class="primary sm" id="accept">接受</button><button class="sm" id="reject">不接受</button></div></div>
                <div id="status" role="status" aria-live="polite"></div>
                <div class="row" id="ansRow"><input id="ans" maxlength="4" placeholder="輸入四字成語" aria-label="你的答案" autocomplete="off"><button class="primary" id="ansBtn">送出</button></div>
                <div class="row" id="soloRow" style="justify-content:center" hidden><button id="hintBtn" class="sm">提示（扣 3 分）</button><span id="soloInfo" class="muted"></span></div>
                <div id="log" aria-label="接龍紀錄"></div>
            </div>
            <div class="row" style="justify-content:center">
                <button class="primary" id="again" hidden>再來一局</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

            S.tm = setTimeout(() => {
                const w = cpuPick(S.last, S.used, $('#soloLevel').value);
                if (!w) { S.cpuOn = false; return soloPush('電腦想不出來，認輸了！'); }
                S.used.add(w); S.chain.push({ n: '電腦', w }); S.last = w; S.turn = 0; S.endsAt = Date.now() + $('#soloSecs').value * 1000;
                soloPush(`電腦接「${w}」`);
            }, 500 + rnd(400));
        }
        $('#soloBtn').onclick = soloStart;
        $('#hintBtn').onclick = () => {
            if (!S.on || S.turn !== 0 || V.phase !== 'play') return;
            const h = hintFor(S.last, S.used); S.hints++; S.score = Math.max(0, S.score - 3);
            flash = h ? `提示：${h}` : '詞庫裡沒有可接的了（扣分不退）'; render();
        };
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
    </script>
</body>

</html>
