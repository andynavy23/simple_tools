<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="網頁鬧鐘：多組鬧鐘、每週重複、貪睡，頁面開著時用聲音與通知提醒。注意：網頁無法在分頁關閉或手機鎖屏後響鈴。">
    <meta property="og:title" content="網頁鬧鐘" />
    <meta property="og:description" content="多組、可重複、可貪睡的網頁鬧鐘（需保持頁面開啟）。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/alarm.html" />
    <title>網頁鬧鐘</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        .warn {
            background: color-mix(in srgb, var(--bad) 14%, var(--card));
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .row input[type=text] {
            flex: 1 1 140px;
        }

        input[type=time] {
            font-size: 18px;
        }

        .days {
            display: flex;
            gap: 4px;
        }

        .days button {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            font-size: 13px;
        }

        .days button[aria-pressed=true] {
            background: var(--blue);
            color: #fff;
        }

        .al {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--fill);
        }

        .al:last-child {
            border-bottom: 0;
        }

        .al .t {
            font-size: 34px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .al.off .t {
            color: var(--muted);
        }

        .al .meta {
            flex: 1;
            min-width: 0;
        }

        .al small {
            display: block;
            color: var(--muted);
        }

        .al input[type=checkbox] {
            width: 26px;
            height: 26px;
            accent-color: var(--blue);
        }

        #ringing {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .85);
            color: #fff;
            display: grid;
            place-content: center;
            text-align: center;
            gap: 16px;
        }

        #ringing .t {
            font-size: 72px;
            font-weight: 800;
        }

        #ringing .row {
            justify-content: center;
        }

        #ringing button {
            font-size: 20px;
            padding: 14px 36px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>網頁鬧鐘</h1>
        <div class="warn"><b>請留意：</b>網頁沒有背景執行的能力。<b>這個頁面必須保持開啟</b>（分頁不能關、手機不能鎖屏或切到別的 App 太久），否則不會響。需要可靠的起床鬧鐘請使用手機內建的鬧鐘。</div>

        <div class="card">
            <div class="row"><input type="time" id="time" value="07:00" aria-label="時間"><input type="text" id="label" maxlength="20" placeholder="名稱（例如：起床）" aria-label="名稱"><button class="primary" id="add">新增鬧鐘</button></div>
            <div class="row"><span class="muted" style="font-size:13px">重複：</span><div class="days" id="days"></div><span class="muted" style="font-size:13px">（不選 = 只響一次）</span></div>
            <div class="row"><label class="muted" style="font-size:14px"><input type="checkbox" id="notif"> 同時用系統通知提醒</label><span class="muted" id="notifMsg" style="font-size:13px"></span></div>
        </div>

        <div class="card"><div id="list"></div><div class="muted" id="empty" style="text-align:center;padding:16px 0">還沒有鬧鐘</div></div>
    </div>
    <div id="ringing" hidden>
        <div class="t" id="rtime"></div><div id="rlabel" style="font-size:24px"></div>
        <div class="row"><button class="primary" id="snooze">貪睡 5 分鐘</button><button id="stop">關閉</button></div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, tone, rnd } = Util;

        // --- pure ---
        const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
        const p2 = (n) => String(n).padStart(2, '0');
        const validAlarm = (a) => !!a && typeof a.id === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(a.time) && typeof a.label === 'string' && a.label.length <= 20 && Array.isArray(a.days) && a.days.every(d => Number.isInteger(d) && d >= 0 && d <= 6) && typeof a.on === 'boolean';
        const hhmm = (d) => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
        const dayKey = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;

        // 這一分鐘該不該響：開啟中、時間相同、（有重複的話）今天是重複日；同一分鐘只響一次（lastKey 記錄上次響的 日期+時間+id）
        function shouldFire(a, now, lastKey) {
            if (!a.on || a.time !== hhmm(now)) return false;
            if (a.days.length && !a.days.includes(now.getDay())) return false;
            return lastKey !== `${a.id}@${dayKey(now)} ${a.time}`;
        }
        const fireKey = (a, now) => `${a.id}@${dayKey(now)} ${a.time}`;

        // 下一次響鈴的時間（Date）；沒有開啟 → null。沒設重複的就是「下一個到這個時間的時刻」（今天已過就是明天）。已經到的這一分鐘不算
        function nextRing(a, now) {
            if (!a.on) return null;
            const [h, m] = a.time.split(':').map(Number);
            for (let add = 0; add < 8; add++) {
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + add, h, m, 0, 0);
                if (d <= now) continue;
                if (!a.days.length || a.days.includes(d.getDay())) return d;
            }
            return null;
        }
        // 「還有 3 小時 20 分」
        function untilText(from, to) {
            if (!to) return '';
            const mins = Math.max(0, Math.ceil((to - from) / 60000)), d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
            return `還有 ${d ? d + ' 天 ' : ''}${h ? h + ' 小時 ' : ''}${m} 分`.replace(/ 0 分$/, '').trim() || '即將響鈴';
        }
        const daysText = (days) => (!days.length ? '只響一次' : days.length === 7 ? '每天' : days.join() === '1,2,3,4,5' ? '平日' : days.join() === '0,6' ? '週末' : '週' + days.map(d => WEEK[d]).join('、'));
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let alarms = store.get('alarms', []).filter(validAlarm), picked = new Set(), lastKey = '', ringTimer = null, ringing = null, titleTimer = null;
        const save = () => store.set('alarms', alarms);

        $('#days').replaceChildren(...WEEK.map((w, i) => { const b = Object.assign(document.createElement('button'), { textContent: w }); b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', '週' + w); b.onclick = () => { picked.has(i) ? picked.delete(i) : picked.add(i); b.setAttribute('aria-pressed', picked.has(i)); }; return b; }));

        function render() {
            const now = new Date();
            $('#empty').hidden = alarms.length > 0;
            $('#list').replaceChildren(...[...alarms].sort((a, b) => a.time.localeCompare(b.time)).map(a => {
                const d = document.createElement('div'); d.className = 'al' + (a.on ? '' : ' off');
                const meta = document.createElement('div'); meta.className = 'meta'; meta.append(Object.assign(document.createElement('div'), { className: 't', textContent: a.time }), Object.assign(document.createElement('small'), { textContent: `${a.label || '鬧鐘'}・${daysText(a.days)}${a.on ? '・' + untilText(now, nextRing(a, now)) : ''}` }));
                const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: a.on }); cb.setAttribute('aria-label', '開關'); cb.onchange = () => { a.on = cb.checked; save(); render(); };
                const del = Object.assign(document.createElement('button'), { className: 'sm', textContent: '刪除' }); del.onclick = () => { alarms = alarms.filter(x => x.id !== a.id); save(); render(); };
                d.append(meta, cb, del); return d;
            }));
        }

        // ---------- 響鈴 ----------
        function ring(a, now) {
            ringing = a; $('#rtime').textContent = a.time; $('#rlabel').textContent = a.label || '鬧鐘時間到'; $('#ringing').hidden = false;
            const beepOnce = () => { tone(880, 180, { type: 'square', vol: 0.3 }); tone(880, 180, { type: 'square', vol: 0.3, delay: 250 }); tone(1100, 300, { type: 'square', vol: 0.3, delay: 500 }); try { navigator.vibrate && navigator.vibrate([300, 100, 300]); } catch (e) { } };
            beepOnce(); clearInterval(ringTimer); ringTimer = setInterval(beepOnce, 1500);
            clearInterval(titleTimer); let on = false; titleTimer = setInterval(() => { document.title = (on = !on) ? '⏰ ' + (a.label || '時間到') : '網頁鬧鐘'; }, 700);
            if ($('#notif').checked && 'Notification' in window && Notification.permission === 'granted') { try { new Notification('⏰ ' + (a.label || '鬧鐘'), { body: a.time }); } catch (e) { } }
            if (!a.days.length) { a.on = false; save(); render(); }                              // 只響一次的響完就關
        }
        function stopRing() { clearInterval(ringTimer); clearInterval(titleTimer); document.title = '網頁鬧鐘'; $('#ringing').hidden = true; ringing = null; }
        $('#stop').onclick = stopRing;
        $('#snooze').onclick = () => {
            if (!ringing) return; const t = new Date(Date.now() + 5 * 60000);
            alarms.push({ id: 'z' + Date.now().toString(36) + rnd(1e6).toString(36), time: hhmm(t), label: (ringing.label || '鬧鐘') + '（貪睡）', days: [], on: true }); save(); stopRing(); render();
        };

        setInterval(() => {
            const now = new Date();
            for (const a of alarms) if (shouldFire(a, now, lastKey)) { lastKey = fireKey(a, now); if (!ringing) ring(a, now); }
        }, 500);
        setInterval(render, 20000);

        $('#add').onclick = () => {
            const a = { id: Date.now().toString(36) + rnd(1e6).toString(36), time: $('#time').value, label: $('#label').value.trim(), days: [...picked].sort(), on: true };
            if (!validAlarm(a) || alarms.length >= 30) return;
            alarms.push(a); save(); $('#label').value = ''; render(); tone(660, 80, { vol: 0.08 });          // 順便解除瀏覽器對聲音的限制（需要使用者操作後才能發聲）
        };
        $('#notif').onchange = async () => {
            if (!$('#notif').checked) return;
            if (!('Notification' in window)) { $('#notif').checked = false; $('#notifMsg').textContent = '這個瀏覽器不支援通知'; return; }
            const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
            if (p !== 'granted') { $('#notif').checked = false; $('#notifMsg').textContent = '沒有通知權限'; } else $('#notifMsg').textContent = '';
        };
        render();
    </script>
</body>

</html>
