<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="計時器：碼表（可分圈）與多組倒數同時進行，並有簡報分段計時，時間到有聲音與振動提醒。">
    <meta property="og:title" content="計時器 / 碼表" />
    <meta property="og:description" content="碼表、多組倒數與簡報分段計時。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/timers.html" />
    <meta name="st-keys" content="timers_plan,timers_defs">
    <title>計時器 / 碼表</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 600px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .time {
            font-size: 56px;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
            margin: 6px 0 14px;
        }

        .btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .laps {
            margin-top: 14px;
            max-height: 280px;
            overflow: auto;
            font-variant-numeric: tabular-nums;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row input[type=text] {
            flex: 1 1 140px;
        }

        .row input[type=number] {
            width: 64px;
        }

        .cd .t {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .cd.done {
            outline: 2px solid var(--ok);
        }

        .cd .name {
            color: var(--muted);
            font-size: 14px;
            word-break: break-all;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }

        .seg {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
            font-variant-numeric: tabular-nums;
        }

        .seg.cur {
            font-weight: 700;
            color: var(--blue);
        }

        .seg.past {
            color: var(--muted);
            text-decoration: line-through;
        }

        progress {
            width: 100%;
            height: 10px;
            accent-color: var(--blue);
            margin: 8px 0;
        }

        .del {
            background: none;
            color: var(--muted);
            padding: 0 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>計時器 / 碼表</h1>
        <p class="sub">以時間戳計算，分頁在背景也不會越跑越慢。有碼表、多組倒數與簡報分段計時。</p>

        <div class="tabs">
            <button data-tab="sw" aria-pressed="true">碼表</button>
            <button data-tab="cd" aria-pressed="false">倒數</button>
            <button data-tab="pr" aria-pressed="false">簡報</button>
        </div>

        <div id="sw">
            <div class="card">
                <div class="time" id="swTime">00:00.00</div>
                <div class="btns">
                    <button class="primary" id="swGo">開始</button>
                    <button id="swLap" disabled>分圈</button>
                    <button id="swReset">重置</button>
                </div>
                <div class="laps" id="laps"></div>
            </div>
        </div>

        <div id="pr" hidden>
            <div class="card">
                <p class="muted" style="margin:0 0 8px;font-size:13px">一行一段：名稱 空白 分鐘數（可小數）。到時間會自動換下一段，每段剩 1 分鐘與結束時都會提醒。</p>
                <textarea id="plan" spellcheck="false" aria-label="簡報流程" placeholder="開場 2&#10;產品介紹 8&#10;示範 6&#10;Q&A 4"></textarea>
                <div class="row" style="margin-top:8px"><button class="primary" id="prGo">開始</button><button id="prSkip" disabled>下一段</button><button id="prReset">重置</button><span class="muted" id="prErr"></span></div>
            </div>
            <div class="card" id="prRun" hidden>
                <div class="name" id="prName" style="color:var(--muted)"></div>
                <div class="time" id="prTime">00:00</div>
                <progress id="prSeg" value="0" max="1" aria-label="目前這一段的進度"></progress>
                <div class="muted" id="prTotal" style="text-align:center"></div>
                <progress id="prAll" value="0" max="1" aria-label="整體進度"></progress>
                <div id="prList"></div>
            </div>
        </div>

        <div id="cd" hidden>
            <div class="card">
                <div class="row">
                    <input type="text" id="cdName" maxlength="20" placeholder="名稱（例如：泡麵）" aria-label="名稱">
                    <input type="number" id="cdH" min="0" max="99" placeholder="時" aria-label="時">
                    <input type="number" id="cdM" min="0" max="59" placeholder="分" aria-label="分" value="5">
                    <input type="number" id="cdS" min="0" max="59" placeholder="秒" aria-label="秒">
                    <button class="primary" id="cdAdd">新增</button>
                </div>
                <p class="muted" id="cdNote" style="margin:8px 0 0"></p>
            </div>
            <div id="cdList"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>三合一計時工具：碼表（可分圈）、多組倒數計時、簡報分段計時。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>跑步、運動計時並記錄每圈成績。</li>
        <li>煮麵、泡茶、烤箱同時倒數好幾個時間。</li>
        <li>演講或會議控制每個段落的時間。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「碼表」：按「開始」，跑步中按「分圈」，「停止」後可「繼續」，「重置」歸零。最快圈顯示綠色、最慢圈紅色（3 圈以上）。</li>
        <li>「倒數」：填名稱與時、分、秒，按「新增」（最多 30 個）；每個倒數可「開始／暫停」「重置」，× 刪除（連同它的計時一起移除）。</li>
        <li>「簡報」：一行一段「名稱 分鐘數」，按「開始」；「下一段」可跳過目前段落。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">簡報流程填「開場 2」「產品介紹 8」「示範 6」「Q&amp;A 4」→ 總長 20 分鐘；超過 1.5 分鐘的段落剩 1 分鐘會響兩聲提醒，換段時響聲。</div>
        <h3>小提醒</h3>
        <ul>
        <li>以時間戳計算，分頁在背景也不會變慢；但<b>頁面需保持開啟</b>，手機鎖屏或關閉分頁可能中斷、不會響。</li>
        <li>簡報最多 30 段、每段上限 600 分鐘；分鐘數可用小數。</li>
        <li>倒數清單與簡報流程存在這個瀏覽器；碼表不會保存。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 毫秒 → "mm:ss.cc"（超過 1 小時為 "h:mm:ss.cc"）；cs=false 時不顯示百分秒
        function fmtMs(ms, cs = true) {
            ms = Math.max(0, Math.floor(ms));
            const c = Math.floor(ms % 1000 / 10), s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
            const p = (n) => String(n).padStart(2, '0');
            return `${h ? h + ':' + p(m) : p(m)}:${p(s)}${cs ? '.' + p(c) : ''}`;
        }

        // 分圈：由「累計時間」陣列算出每圈花費
        const lapTimes = (totals) => totals.map((t, i) => t - (i ? totals[i - 1] : 0));

        // 倒數清單驗證（還原備份可能寫回壞資料）：名稱字串 ≤20 字、總長 > 0 且 ≤ 99 小時；最多 MAX_TIMERS 個
        const MAX_TIMERS = 30;
        const cleanDefs = (a) => Array.isArray(a) ? a.filter(t => !!t && typeof t.name === 'string' && Number.isFinite(t.total) && t.total > 0 && t.total <= 99 * 3600000).map(t => ({ name: t.name.slice(0, 20), total: Math.round(t.total) })).slice(0, MAX_TIMERS) : [];
        const toMs = (h, m, s) => ((+h || 0) * 3600 + (+m || 0) * 60 + (+s || 0)) * 1000;

        // 簡報流程：每行「名稱 分鐘」。回傳 { segs: [{name, ms}], errors: [行號] }；分鐘數需 > 0 且 ≤ 600，最多 30 段
        function parsePlan(text) {
            const segs = [], errors = [];
            String(text).split(/\r?\n/).forEach((raw, i) => {
                const line = raw.trim(); if (!line) return;
                const m = /^(.*?)[\s,，:：]+(\d+(?:\.\d+)?)\s*(?:分鐘|分|min|m)?$/i.exec(line) || /^(\d+(?:\.\d+)?)\s*(?:分鐘|分|min|m)?$/i.exec(line);
                const name = m && m.length === 3 ? m[1].trim() : '', mins = m ? parseFloat(m[m.length === 3 ? 2 : 1]) : NaN;
                if (!(mins > 0 && mins <= 600) || segs.length >= 30) { errors.push(i + 1); return; }
                segs.push({ name: name || `第 ${segs.length + 1} 段`, ms: Math.round(mins * 60000) });
            });
            return { segs, errors };
        }
        const planTotal = (segs) => segs.reduce((a, s) => a + s.ms, 0);
        // 已經過 elapsed 毫秒時，位在哪一段：{ index, into, left, done }（done 時 index = segs.length）
        function locate(segs, elapsed) {
            let acc = 0;
            for (let i = 0; i < segs.length; i++) { if (elapsed < acc + segs[i].ms) return { index: i, into: elapsed - acc, left: acc + segs[i].ms - elapsed, done: false }; acc += segs[i].ms; }
            return { index: segs.length, into: 0, left: 0, done: true };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);

        // ---------- 分頁 ----------
        document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
            document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-pressed', x === b));
            $('#sw').hidden = b.dataset.tab !== 'sw'; $('#cd').hidden = b.dataset.tab !== 'cd'; $('#pr').hidden = b.dataset.tab !== 'pr';
        });

        // ---------- 碼表 ----------
        let swRun = false, swStart = 0, swAcc = 0, swTotals = [], swRaf = 0;
        const swNow = () => swAcc + (swRun ? performance.now() - swStart : 0);

        function swTick() {
            $('#swTime').textContent = fmtMs(swNow());
            if (swRun) swRaf = requestAnimationFrame(swTick);
        }

        function renderLaps() {
            const laps = lapTimes(swTotals);
            const best = Math.min(...laps), worst = Math.max(...laps);
            $('#laps').replaceChildren(...laps.map((l, i) => {
                const row = document.createElement('div'); row.className = 'li';
                const a = document.createElement('span'), b = document.createElement('b');
                a.textContent = `第 ${i + 1} 圈`; a.className = 'muted';
                b.textContent = `${fmtMs(l)}　${fmtMs(swTotals[i])}`;
                if (laps.length > 2) b.style.color = l === best ? 'var(--ok)' : l === worst ? 'var(--bad)' : '';
                row.append(a, b);
                return row;
            }).reverse());
        }

        $('#swGo').onclick = () => {
            if (swRun) { swAcc += performance.now() - swStart; swRun = false; cancelAnimationFrame(swRaf); }
            else { swStart = performance.now(); swRun = true; swTick(); }
            $('#swGo').textContent = swRun ? '停止' : '繼續';
            $('#swGo').classList.toggle('primary', !swRun);
            $('#swLap').disabled = !swRun;
            $('#swTime').textContent = fmtMs(swNow());
        };
        $('#swLap').onclick = () => { swTotals.push(swNow()); renderLaps(); };
        $('#swReset').onclick = () => {
            swRun = false; swAcc = 0; swTotals = []; cancelAnimationFrame(swRaf);
            $('#swGo').textContent = '開始'; $('#swGo').classList.add('primary'); $('#swLap').disabled = true;
            $('#swTime').textContent = fmtMs(0); $('#laps').replaceChildren();
        };

        // ---------- 簡報 ----------
        let pr = { segs: [], run: false, start: 0, acc: 0, warned: -1, ended: -1, timer: 0 };
        $('#plan').value = Util.store.get('timers_plan', '');
        const prElapsed = () => pr.acc + (pr.run ? Date.now() - pr.start : 0);
        function prRender() {
            const t = locate(pr.segs, prElapsed()), total = planTotal(pr.segs);
            $('#prName').textContent = t.done ? '全部結束 🎉' : `${t.index + 1} / ${pr.segs.length}　${pr.segs[t.index].name}`;
            $('#prTime').textContent = t.done ? '00:00' : fmtMs(t.left, false);
            $('#prSeg').value = t.done ? 1 : t.into / pr.segs[t.index].ms; $('#prAll').value = Math.min(1, prElapsed() / total);
            $('#prTotal').textContent = t.done ? `總長 ${fmtMs(total, false)}` : `整體剩 ${fmtMs(total - prElapsed(), false)} / ${fmtMs(total, false)}`;
            $('#prList').replaceChildren(...pr.segs.map((s, i) => Object.assign(document.createElement('div'), { className: 'seg' + (i === t.index ? ' cur' : i < t.index ? ' past' : ''), innerHTML: '<span></span><span></span>' })).map((d, i) => { d.children[0].textContent = pr.segs[i].name; d.children[1].textContent = fmtMs(pr.segs[i].ms, false); return d; }));
            return t;
        }
        function prTick() {
            const t = prRender();
            if (t.done) { if (pr.ended < pr.segs.length) { pr.ended = pr.segs.length; Util.beep(); } pr.run = false; clearInterval(pr.timer); $('#prGo').textContent = '開始'; $('#prSkip').disabled = true; return; }
            if (t.index !== pr.cur) { if (pr.cur !== undefined && pr.cur >= 0) Util.beep(2); pr.cur = t.index; }
            if (pr.segs[t.index].ms > 90000 && t.left <= 60000 && pr.warned !== t.index) { pr.warned = t.index; Util.tone(660, 300); Util.tone(660, 300, { delay: 400 }); }
        }
        $('#prGo').onclick = () => {
            if (pr.run) { pr.acc += Date.now() - pr.start; pr.run = false; clearInterval(pr.timer); $('#prGo').textContent = '繼續'; return; }
            if (!pr.segs.length || prElapsed() === 0) {
                const { segs, errors } = parsePlan($('#plan').value);
                $('#prErr').textContent = errors.length ? `第 ${errors.join('、')} 行看不懂（格式：名稱 分鐘數）` : '';
                if (!segs.length) { $('#prErr').textContent = $('#prErr').textContent || '請輸入至少一段'; return; }
                Util.store.set('timers_plan', $('#plan').value); pr = { segs, run: false, start: 0, acc: 0, warned: -1, ended: -1, timer: 0, cur: -1 };
            }
            pr.run = true; pr.start = Date.now(); $('#prRun').hidden = false; $('#prGo').textContent = '暫停'; $('#prSkip').disabled = false;
            clearInterval(pr.timer); pr.timer = setInterval(prTick, 250); prTick();
        };
        $('#prSkip').onclick = () => { const t = locate(pr.segs, prElapsed()); if (t.done) return; const target = pr.segs.slice(0, t.index + 1).reduce((a, s) => a + s.ms, 0); pr.acc += target - prElapsed(); prTick(); };
        $('#prReset').onclick = () => { clearInterval(pr.timer); pr = { segs: [], run: false, start: 0, acc: 0, warned: -1, ended: -1, timer: 0, cur: -1 }; $('#prRun').hidden = true; $('#prGo').textContent = '開始'; $('#prSkip').disabled = true; $('#prErr').textContent = ''; };

        // ---------- 倒數 ----------
        let timers = cleanDefs(Util.store.get('timers_defs', [])).map(t => ({ ...t, left: t.total, endAt: 0, running: false, done: false }));
        const saveDefs = () => { $('#cdNote').textContent = ''; Util.store.set('timers_defs', timers.map(({ name, total }) => ({ name, total }))); };

        function renderCd() {
            const list = $('#cdList');
            list.replaceChildren(...timers.map((t, i) => {
                const card = document.createElement('div'); card.className = 'card cd' + (t.done ? ' done' : '');
                const row = document.createElement('div'); row.className = 'row'; row.style.justifyContent = 'space-between';
                const left = document.createElement('div'), nm = document.createElement('div'), tm = document.createElement('div');
                nm.className = 'name'; nm.textContent = t.name || '倒數'; tm.className = 't'; tm.textContent = fmtMs(t.left, false); tm.id = 'cd' + i;
                left.append(nm, tm);
                const go = document.createElement('button'); go.className = t.running ? '' : 'primary'; go.textContent = t.running ? '暫停' : (t.left < t.total && !t.done ? '繼續' : '開始');
                go.onclick = () => { if (t.running) { t.left = Math.max(0, t.endAt - Date.now()); t.running = false; } else { if (t.done || t.left <= 0) { t.left = t.total; t.done = false; } t.endAt = Date.now() + t.left; t.running = true; } renderCd(); };
                const rs = document.createElement('button'); rs.textContent = '重置'; rs.onclick = () => { t.left = t.total; t.running = false; t.done = false; renderCd(); };
                const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '刪除'); del.onclick = () => { timers.splice(i, 1); saveDefs(); renderCd(); };
                const btns = document.createElement('div'); btns.className = 'row'; btns.append(go, rs, del);
                row.append(left, btns);
                card.append(row);
                return card;
            }));
        }

        // 每 200ms 更新一次顯示並檢查是否到時間（時間戳計算，背景分頁被降頻也準確）
        setInterval(() => {
            let changed = false;
            timers.forEach((t, i) => {
                if (!t.running) return;
                const left = t.endAt - Date.now();
                if (left <= 0) { t.running = false; t.done = true; t.left = 0; changed = true; Util.beep(); document.title = '⏰ ' + (t.name || '時間到'); setTimeout(() => { document.title = '計時器 / 碼表'; }, 5000); }
                else { const el = $('#cd' + i); if (el) el.textContent = fmtMs(left, false); }
            });
            if (changed) renderCd();
        }, 200);

        $('#cdAdd').onclick = () => {
            const total = toMs($('#cdH').value, $('#cdM').value, $('#cdS').value);
            if (total <= 0) return;
            if (timers.length >= MAX_TIMERS) { $('#cdNote').textContent = `最多 ${MAX_TIMERS} 個倒數，請先刪除不用的`; return; }
            timers.push({ name: $('#cdName').value.trim(), total, left: total, endAt: 0, running: false, done: false });
            $('#cdName').value = '';
            saveDefs(); renderCd();
        };
        renderCd();
    </script>
</body>

</html>
