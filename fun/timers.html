<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="計時器：碼表（可分圈）、多組倒數、簡報分段計時、間歇訓練（HIIT / Tabata / EMOM）與烹飪計時（水煮蛋、義大利麵、多鍋同時），時間到有聲音與振動提醒。">
    <meta property="og:title" content="計時器 / 碼表" />
    <meta property="og:description" content="碼表、多組倒數、簡報分段計時與間歇訓練。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/timers.html" />
    <meta name="st-keys" content="timers_plan,timers_defs,timers_iv,timers_ivopt">
    <title>計時器 / 碼表</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 600px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .time {
            font-size: 56px;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
            margin: 6px 0 14px;
        }

        .btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .laps {
            margin-top: 14px;
            max-height: 280px;
            overflow: auto;
            font-variant-numeric: tabular-nums;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row input[type=text] {
            flex: 1 1 140px;
        }

        .row input[type=number] {
            width: 64px;
        }

        .cd .t {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .cd.done {
            outline: 2px solid var(--ok);
        }

        .cd .name {
            color: var(--muted);
            font-size: 14px;
            word-break: break-all;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }

        .seg {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
            font-variant-numeric: tabular-nums;
        }

        .seg.cur {
            font-weight: 700;
            color: var(--blue);
        }

        .seg.past {
            color: var(--muted);
            text-decoration: line-through;
        }

        progress {
            width: 100%;
            height: 10px;
            accent-color: var(--blue);
            margin: 8px 0;
        }

        .del {
            background: none;
            color: var(--muted);
            padding: 0 8px;
            font-size: 18px;
        }

        /* 間歇訓練 */
        .ivg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            gap: 10px;
            margin: 12px 0 8px;
        }

        .ivg label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .ivg input {
            width: 100%;
        }

        .row label.chk {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
        }

        #ivRun {
            --ph: var(--muted);
            outline: 4px solid var(--ph);
            outline-offset: -4px;
            text-align: center;
        }

        #ivPhase {
            font-size: 28px;
            font-weight: 700;
            color: var(--ph);
        }

        #ivTime {
            font-size: clamp(72px, 26vw, 120px);
            font-weight: 700;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            margin: 4px 0;
        }

        #ivRun .btns {
            margin-top: 12px;
        }

        #ivRun .btns button {
            flex: 1 1 90px;
            min-height: 52px;
        }

        .ivsum {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>計時器 / 碼表</h1>
        <p class="sub">以時間戳計算，分頁在背景也不會越跑越慢。有碼表、多組倒數、簡報分段計時與間歇訓練。</p>

        <div class="tabs">
            <button data-tab="sw" aria-pressed="true">碼表</button>
            <button data-tab="cd" aria-pressed="false">倒數</button>
            <button data-tab="pr" aria-pressed="false">簡報</button>
            <button data-tab="iv" aria-pressed="false">間歇</button>
            <button data-tab="ck" aria-pressed="false">烹飪</button>
        </div>

        <div id="sw">
            <div class="card">
                <div class="time" id="swTime">00:00.00</div>
                <div class="btns">
                    <button class="primary" id="swGo">開始</button>
                    <button id="swLap" disabled>分圈</button>
                    <button id="swReset">重置</button>
                </div>
                <div class="laps" id="laps"></div>
            </div>
        </div>

        <div id="pr" hidden>
            <div class="card">
                <p class="muted" style="margin:0 0 8px;font-size:13px">一行一段：名稱 空白 分鐘數（可小數）。到時間會自動換下一段，每段剩 1 分鐘與結束時都會提醒。</p>
                <textarea id="plan" spellcheck="false" aria-label="簡報流程" placeholder="開場 2&#10;產品介紹 8&#10;示範 6&#10;Q&A 4"></textarea>
                <div class="row" style="margin-top:8px"><button class="primary" id="prGo">開始</button><button id="prSkip" disabled>下一段</button><button id="prReset">重置</button><span class="muted" id="prErr"></span></div>
            </div>
            <div class="card" id="prRun" hidden>
                <div class="name" id="prName" style="color:var(--muted)"></div>
                <div class="time" id="prTime">00:00</div>
                <progress id="prSeg" value="0" max="1" aria-label="目前這一段的進度"></progress>
                <div class="muted" id="prTotal" style="text-align:center"></div>
                <progress id="prAll" value="0" max="1" aria-label="整體進度"></progress>
                <div id="prList"></div>
            </div>
        </div>

        <div id="cd" hidden>
            <div class="card">
                <div class="row">
                    <input type="text" id="cdName" maxlength="20" placeholder="名稱（例如：泡麵）" aria-label="名稱">
                    <input type="number" id="cdH" min="0" max="99" placeholder="時" aria-label="時">
                    <input type="number" id="cdM" min="0" max="59" placeholder="分" aria-label="分" value="5">
                    <input type="number" id="cdS" min="0" max="59" placeholder="秒" aria-label="秒">
                    <button class="primary" id="cdAdd">新增</button>
                </div>
                <p class="muted" id="cdNote" style="margin:8px 0 0"></p>
                <p class="muted" id="cdNext" style="margin:4px 0 0"></p>
            </div>
            <div id="cdList"></div>
        </div>

        <div id="iv" hidden>
            <div class="card" id="ivSetup">
                <div class="row" id="ivPresets">
                    <button class="sm" data-pre="tabata">Tabata 20/10×8</button>
                    <button class="sm" data-pre="emom">EMOM 每分鐘×10</button>
                    <button class="sm" data-pre="custom">自訂 40/20×10</button>
                </div>
                <div class="ivg">
                    <div><label for="ivPrep">預備（秒）</label><input type="number" id="ivPrep" inputmode="numeric" min="0" max="300"></div>
                    <div><label for="ivWork">工作（秒）</label><input type="number" id="ivWork" inputmode="numeric" min="1" max="3600"></div>
                    <div><label for="ivRest">休息（秒）</label><input type="number" id="ivRest" inputmode="numeric" min="0" max="3600"></div>
                    <div><label for="ivRounds">回合數</label><input type="number" id="ivRounds" inputmode="numeric" min="1" max="99"></div>
                    <div><label for="ivSets">組數</label><input type="number" id="ivSets" inputmode="numeric" min="1" max="99"></div>
                    <div><label for="ivSetRest">組間休息（秒）</label><input type="number" id="ivSetRest" inputmode="numeric" min="0" max="3600"></div>
                </div>
                <p class="muted ivsum" id="ivSum" style="margin:0 0 8px"></p>
                <div class="row">
                    <label class="chk"><input type="checkbox" id="ivBeep"> 嗶聲</label>
                    <label class="chk"><input type="checkbox" id="ivVoice"> 語音</label>
                </div>
                <div class="row"><button class="primary" id="ivGo" style="flex:1 1 140px;min-height:52px">開始</button></div>
                <p class="muted" id="ivErr" style="margin:8px 0 0"></p>
            </div>

            <div class="card" id="ivRun" hidden>
                <div id="ivPhase"></div>
                <div id="ivTime">00:00</div>
                <div class="muted" id="ivRound"></div>
                <progress id="ivSeg" value="0" max="1" aria-label="這個階段的進度"></progress>
                <div class="muted" id="ivTotal"></div>
                <progress id="ivAll" value="0" max="1" aria-label="整體進度"></progress>
                <div class="btns">
                    <button class="primary" id="ivPause">暫停</button>
                    <button id="ivSkip">跳過</button>
                    <button id="ivStop">結束</button>
                </div>
            </div>

            <div class="card" id="ivSaved">
                <h2>常用組合</h2>
                <div class="row"><input type="text" id="ivName" maxlength="20" placeholder="名稱（可留空）" aria-label="常用組合名稱"><button class="primary" id="ivSave">儲存目前設定</button></div>
                <div id="ivList"></div>
                <div class="row" style="margin-top:8px"><button class="sm" id="ivClear">清除全部</button><span class="muted" id="ivNote"></span></div>
            </div>
        </div>
        <div id="ck" hidden>
            <div class="card">
                <h2 style="margin-top:0">水煮蛋</h2>
                <div class="fgrid">
                    <div><label for="egSize">蛋大小</label><select id="egSize"><option value="45">小（約 45 g）</option><option value="53">中（約 53 g）</option><option value="60" selected>大（約 60 g）</option><option value="68">特大（約 68 g）</option></select></div>
                    <div><label for="egStart">蛋的起始溫度</label><select id="egStart"><option value="4" selected>冷藏（約 4°C）</option><option value="20">室溫（約 20°C）</option></select></div>
                    <div><label for="egDone">熟度</label><select id="egDone"><option value="soft">溏心（蛋黃流動）</option><option value="jammy" selected>半熟（蛋黃濃稠）</option><option value="hard">全熟（蛋黃全凝固）</option></select></div>
                </div>
                <div class="out" id="egOut"></div>
                <div class="row" style="margin-top:8px"><button class="primary" id="egGo">開始計時（加入倒數）</button></div>
                <p class="muted" style="margin:8px 0 0;font-size:13px">水滾後再放蛋；時間到立刻泡冰水。高海拔沸點較低，請多加時間。</p>
            </div>
            <div class="card">
                <h2 style="margin-top:0">義大利麵</h2>
                <div class="fgrid">
                    <div><label for="paType">麵種</label><select id="paType"><option value="4">天使細麵</option><option value="10" selected>直麵 / 扁麵</option><option value="11">筆管 / 螺旋</option><option value="10">蝴蝶麵</option><option value="8">通心粉</option><option value="3">新鮮生麵</option></select></div>
                    <div><label for="paPkg">包裝標示（分鐘，選填）</label><input type="number" id="paPkg" inputmode="decimal" min="1" max="30" step="0.5" placeholder="依包裝更準"></div>
                    <div><label for="paLevel">口感</label><select id="paLevel"><option value="hard">偏硬</option><option value="aldente" selected>彈牙（al dente）</option><option value="std">依包裝</option><option value="soft">偏軟</option></select></div>
                    <div><label for="paG">麵量（克）</label><input type="number" id="paG" inputmode="numeric" min="10" max="5000" value="200"></div>
                </div>
                <label class="chk" style="margin-top:8px"><input type="checkbox" id="paSauce"> 起鍋後還要在醬汁中續煮</label>
                <div class="out" id="paOut"></div>
                <div class="row" style="margin-top:8px"><button class="primary" id="paGo">開始計時（加入倒數）</button></div>
                <p class="muted" style="margin:8px 0 0;font-size:13px">水滾後加鹽再下麵，偶爾攪拌；時間為一般包裝經驗值，請起鍋前試吃一根。</p>
            </div>
            <div class="card"><p class="muted" style="margin:0">多鍋同時：按上面的「開始計時」會加進「倒數」分頁並立即開始；「倒數」可同時跑多個命名計時，最先結束的排最前面，每個都能單獨關掉提示音。</p></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>五合一計時工具：碼表（可分圈）、多組倒數計時、簡報分段計時、間歇訓練（HIIT / Tabata / EMOM）、烹飪計時（水煮蛋、義大利麵、多鍋同時）。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>跑步、運動計時並記錄每圈成績。</li>
        <li>煮麵、泡茶、烤箱同時倒數好幾個時間。</li>
        <li>演講或會議控制每個段落的時間。</li>
        <li>做 Tabata、HIIT、EMOM 這類「做 N 秒、休息 M 秒」輪替的訓練。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「碼表」：按「開始」，跑步中按「分圈」，「停止」後可「繼續」，「重置」歸零。最快圈顯示綠色、最慢圈紅色（3 圈以上）。分圈最多 500 圈，滿了按鈕會顯示「已達 500 圈上限」並停止新增（碼表仍可繼續跑，按「重置」清空）。</li>
        <li>「倒數」：填名稱與時、分、秒，按「新增」（最多 30 個）；每個倒數可「開始／暫停」「重置」，× 刪除（連同它的計時一起移除）；進行中的會依結束時間排在最前面並顯示結束時刻，🔔／🔕 可單獨關掉或開啟該計時的提示音（設定會記住）。</li>
        <li>「簡報」：一行一段「名稱 分鐘數」，按「開始」；「下一段」可跳過目前段落。</li>
        <li>「間歇」：點「Tabata」「EMOM」或「自訂」套入預設，再調整預備、工作、休息（秒）、回合數、組數、組間休息；按「開始」後畫面以大字倒數，顏色代表階段（預備灰、工作紅、休息綠、組間休息藍）。「暫停／繼續」「跳過」目前階段、「結束」回到設定。每個階段開始會響一聲，最後 3 秒每秒響一聲，可關掉「嗶聲」或「語音」。</li>
        <li>「烹飪」：水煮蛋選蛋大小、起始溫度與熟度，義大利麵選麵種（或直接填包裝標示分鐘）與口感，會算出時間與水 / 鹽量；按「開始計時」會加進「倒數」並立即開始，所以可以同時煮好幾鍋（多鍋同時計時）。</li>
        <li>常用組合：輸入名稱按「儲存目前設定」（最多 30 組，滿了要先刪除）；列表按「載入」套回設定、× 刪除單組，「清除全部」會刪光所有常用組合。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">簡報流程填「開場 2」「產品介紹 8」「示範 6」「Q&amp;A 4」→ 總長 20 分鐘；超過 1.5 分鐘的段落剩 1 分鐘會響兩聲提醒，換段時響聲。<br>間歇：Tabata（預備 10、工作 20、休息 10、8 回合、1 組）→ 總長 4 分鐘＝預備 10 秒 + 8×20 秒工作 + 7×10 秒休息（最後一回合做完就結束，不再休息）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>以時間戳計算，分頁在背景也不會變慢；但<b>頁面需保持開啟</b>，手機鎖屏或關閉分頁可能中斷、不會響。</li>
        <li>簡報最多 30 段、每段上限 600 分鐘；分鐘數可用小數。</li>
        <li>倒數清單、簡報流程、間歇的常用組合與嗶聲／語音開關存在這個瀏覽器；碼表與間歇進行中的進度不會保存。</li>
        <li>間歇：預備 0–300 秒、工作 1–3600 秒、回合與組數 1–99，總長不可超過 12 小時；設定超出範圍會自動修正。</li>
        <li>iPhone / 手機要先按「開始」才能出聲（瀏覽器限制）；可用時會保持螢幕不關，但鎖屏仍可能中斷，不會響。</li>
        <li>烹飪時間是估算：水煮蛋用 Williams 公式（假設球形、水 100°C 沸騰、蛋黃中心 65 / 70 / 80°C 為溏心 / 半熟 / 全熟，誤差約 ±1 分鐘）；義大利麵以包裝標示為準（彈牙 −1、偏硬 −2、偏軟 +1、醬汁續煮 −2 分鐘）。加進倒數的烹飪計時和其他倒數一樣最多 30 個，滿了要先刪除；清單與提示音開關存在 timers_defs。</li>
        <li>備份還原寫回壞掉的常用組合時，會自動修正或略過壞的項目。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 毫秒 → "mm:ss.cc"（超過 1 小時為 "h:mm:ss.cc"）；cs=false 時不顯示百分秒
        function fmtMs(ms, cs = true) {
            ms = Math.max(0, Math.floor(ms));
            const c = Math.floor(ms % 1000 / 10), s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
            const p = (n) => String(n).padStart(2, '0');
            return `${h ? h + ':' + p(m) : p(m)}:${p(s)}${cs ? '.' + p(c) : ''}`;
        }

        // 分圈：由「累計時間」陣列算出每圈花費
        const lapTimes = (totals) => totals.map((t, i) => t - (i ? totals[i - 1] : 0));

        // 碼表最多 500 圈：回傳新的累計陣列（已滿就原樣回傳）
        const MAX_LAPS = 500;
        const addLap = (totals, t) => totals.length >= MAX_LAPS ? totals : [...totals, t];
        const lapsFull = (totals) => totals.length >= MAX_LAPS;

        // 倒數清單驗證（還原備份可能寫回壞資料）：名稱字串 ≤20 字、總長 > 0 且 ≤ 99 小時；最多 MAX_TIMERS 個
        const MAX_TIMERS = 30;
        const cleanDefs = (a) => Array.isArray(a) ? a.filter(t => !!t && typeof t.name === 'string' && Number.isFinite(t.total) && t.total > 0 && t.total <= 99 * 3600000).map(t => ({ name: t.name.slice(0, 20), total: Math.round(t.total), ...(t.mute === true ? { mute: true } : {}) })).slice(0, MAX_TIMERS) : [];
        // 倒數顯示順序：進行中的依結束時間由早到晚排前面，其餘維持原順序（回傳原陣列索引）
        const cdOrder = (ts) => ts.map((t, i) => i).sort((a, b) => { const A = ts[a], B = ts[b]; return A.running && B.running ? A.endAt - B.endAt || a - b : A.running ? -1 : B.running ? 1 : a - b; });
        // 水煮蛋：Williams 公式（分鐘）。g 蛋重、startC 起始溫度、yolkC 蛋黃中心目標、waterC 水溫（簡化：球形、均質）
        const EGG_YOLK = { soft: 65, jammy: 70, hard: 80 };
        function eggMin(g, startC, yolkC, waterC = 100) {
            if (!(g >= 20 && g <= 100) || !(startC >= -5 && startC <= 40) || !(yolkC > startC && yolkC < waterC) || !(waterC > 50 && waterC <= 100)) return NaN;
            return 0.451 * Math.pow(g, 2 / 3) * Math.log(0.76 * (startC - waterC) / (yolkC - waterC));
        }
        // 義大利麵：以包裝標示分鐘 pkg 為基準；偏硬 -2、彈牙 -1、標準 0、偏軟 +1；之後還要在醬汁中續煮再 -2（至少 1 分鐘）
        const PASTA_ADJ = { hard: -2, aldente: -1, std: 0, soft: 1 };

        // 簡報流程：每行「名稱 分鐘」。回傳 { segs: [{name, ms}], errors: [行號] }；分鐘數需 > 0 且 ≤ 600，最多 30 段
        function parsePlan(text) {
            const segs = [], errors = [];
            String(text).split(/\r?\n/).forEach((raw, i) => {
                const line = raw.trim(); if (!line) return;
                const m = /^(.*?)[\s,，:：]+(\d+(?:\.\d+)?)\s*(?:分鐘|分|min|m)?$/i.exec(line) || /^(\d+(?:\.\d+)?)\s*(?:分鐘|分|min|m)?$/i.exec(line);
                const name = m && m.length === 3 ? m[1].trim() : '', mins = m ? parseFloat(m[m.length === 3 ? 2 : 1]) : NaN;
                if (!(mins > 0 && mins <= 600) || segs.length >= 30) { errors.push(i + 1); return; }

        }

        // 已經過 elapsed 毫秒時，位在哪一段：{ index, into, left, done }（done 時 index = segs.length）
        function locate(segs, elapsed) {
            let acc = 0;
            for (let i = 0; i < segs.length; i++) { if (elapsed < acc + segs[i].ms) return { index: i, into: elapsed - acc, left: acc + segs[i].ms - elapsed, done: false }; acc += segs[i].ms; }
            return { index: segs.length, into: 0, left: 0, done: true };
        }

        // ---------- 間歇訓練 ----------
        // 設定 { name, prep, work, rest, rounds, sets, setRest }（秒 / 次數）；一律經 cleanIv 修正到範圍內，壞資料補預設值
        const IV_LIM = { prep: [0, 300], work: [1, 3600], rest: [0, 3600], rounds: [1, 99], sets: [1, 99], setRest: [0, 3600] };
        const IV_DEF = { prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 0 };
        const IV_PRESETS = {
            tabata: { name: 'Tabata', prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 0 },
            emom: { name: 'EMOM', prep: 10, work: 60, rest: 0, rounds: 10, sets: 1, setRest: 0 },
            custom: { name: '自訂', prep: 10, work: 40, rest: 20, rounds: 10, sets: 1, setRest: 0 },

        const IV_MAX = 30, IV_MAX_MS = 12 * 3600000;
        function cleanIv(o) {

            const r = { name: typeof o.name === 'string' ? o.name.trim().slice(0, 20) : '' };
            for (const k in IV_LIM) {
                const v = Math.floor(Number(o[k]));

        }
        // 總長（毫秒）：預備 + 每組（回合 × 工作 + 回合間休息；最後一回合後不休息）+ 組間休息
        const ivTotalMs = (c) => (c.prep + c.sets * (c.rounds * c.work + (c.rounds - 1) * c.rest) + (c.sets - 1) * c.setRest) * 1000;
        // 展開成階段時間軸：[{ type: prep|work|rest|setrest, ms, at（起點毫秒）, round, set }]；0 秒的階段略過
        function ivTimeline(cfg) {
            const c = cleanIv(cfg), tl = []; let at = 0;
            const add = (type, sec, round, set) => { if (sec <= 0) return; tl.push({ type, ms: sec * 1000, at, round, set }); at += sec * 1000; };
            add('prep', c.prep, 0, 0);
            for (let s = 1; s <= c.sets; s++) {
                for (let r = 1; r <= c.rounds; r++) {
                    add('work', c.work, r, s);
                    if (r < c.rounds) add('rest', c.rest, r, s);
                }
                if (s < c.sets) add('setrest', c.setRest, c.rounds, s);
            }

        }
        const ivEnd = (tl) => tl.length ? tl[tl.length - 1].at + tl[tl.length - 1].ms : 0;
        // 已經過 elapsed 毫秒時位在哪個階段（二分搜尋）：{ index, phase, into, left, done }；done 時 index = tl.length
        function ivLocate(tl, elapsed) {
            const end = ivEnd(tl);

            const el = Math.max(0, elapsed); let lo = 0, hi = tl.length - 1;

            const p = tl[lo];

        // 「跳過」：回傳目前階段的結束時間（毫秒）；已結束則回傳總長
        const ivSkipTo = (tl, elapsed) => { const l = ivLocate(tl, elapsed); return l.done ? ivEnd(tl) : l.phase.at + l.phase.ms; };
        // 提示音判斷：換階段 → 'phase'（全部結束 → 'done'）；階段剩 3、2、1 秒 → 'tick'；其他 null。last 是上一次的 next（第一次傳 null）
        // 背景分頁回來時可能一次跳過好幾個階段，只會得到一次提示，不會連響
        function ivCue(last, loc) {

        }
        $('#ivSave').onclick = () => {
            const c = ivRead(); c.name = $('#ivName').value.trim().slice(0, 20);
            const nl = addIv(ivSaved, c, 'iv' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
            if (!nl) { $('#ivNote').textContent = `最多 ${IV_MAX} 組，請先刪除不用的`; return; }
            ivSaved = nl; Util.store.set('timers_iv', ivSaved); $('#ivName').value = ''; $('#ivNote').textContent = '已儲存'; renderIvList();
        };
        $('#ivClear').onclick = () => {
            if (!ivSaved.length || !confirm(`確定清除全部 ${ivSaved.length} 組常用組合？無法復原。`)) return;
            ivSaved = []; Util.store.set('timers_iv', ivSaved); $('#ivNote').textContent = ''; renderIvList();
        };
        renderIvList();

        async function wakeOn() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { } }
        function wakeOff() { try { if (wakeLock) wakeLock.release(); } catch (e) { } wakeLock = null; }
        const ivElapsed = () => Math.min(iv.total, iv.acc + (iv.run ? Date.now() - iv.start : 0));

        function ivCueOut(cue, loc) {
            const p = loc.phase;
            if (ivOpt.beep) {
                if (cue === 'tick') Util.tone(660, 120);
                else if (cue === 'done') Util.beep(3);
                else Util.tone(p.type === 'work' ? 880 : p.type === 'rest' ? 520 : 440, 300);
            }
            if (ivOpt.voice && cue !== 'tick') Util.speak(ivSpeech(p, iv.cfg), { lang: 'zh-TW', rate: 1.1 });
        }
        function ivTick() {
            if (!iv) return;
            const el = ivElapsed(), loc = ivLocate(iv.tl, el), p = loc.phase;
            $('#ivRun').style.setProperty('--ph', loc.done ? 'var(--ok)' : IV_COLOR[p.type]);
            $('#ivPhase').textContent = loc.done ? '完成 🎉' : IV_LABEL[p.type];
            $('#ivTime').textContent = loc.done ? '00:00' : fmtMs(Math.ceil(loc.left / 1000) * 1000, false);
            $('#ivRound').textContent = loc.done ? `共 ${iv.cfg.rounds * iv.cfg.sets} 回合` : p.type === 'prep' ? '準備開始' : `回合 ${p.round} / ${iv.cfg.rounds}` + (iv.cfg.sets > 1 ? `　第 ${p.set} / ${iv.cfg.sets} 組` : '');
            $('#ivSeg').value = loc.done ? 1 : loc.into / p.ms; $('#ivAll').value = el / iv.total;
            $('#ivTotal').textContent = `總剩餘 ${fmtMs(iv.total - el, false)} / ${fmtMs(iv.total, false)}`;
            const c = ivCue(iv.last, loc); iv.last = c.next;
            if (c.cue) ivCueOut(c.cue, loc);
            if (loc.done) { iv.run = false; clearInterval(iv.timer); wakeOff(); $('#ivPause').disabled = true; $('#ivSkip').disabled = true; }
        }
        function ivEndRun() { if (iv) clearInterval(iv.timer); iv = null; wakeOff(); $('#ivRun').hidden = true; $('#ivSetup').hidden = false; $('#ivSaved').hidden = false; ivSum(); }
        $('#ivGo').onclick = () => {
            const cfg = ivRead(); ivFill(cfg);
            if (ivTotalMs(cfg) > IV_MAX_MS) { $('#ivErr').textContent = '總長超過 12 小時，請縮短'; return; }
            const tl = ivTimeline(cfg);
            iv = { cfg, tl, total: ivEnd(tl), run: true, start: Date.now(), acc: 0, last: null, timer: 0 };
            $('#ivSetup').hidden = true; $('#ivSaved').hidden = true; $('#ivRun').hidden = false;
            $('#ivPause').textContent = '暫停'; $('#ivPause').classList.remove('primary'); $('#ivPause').disabled = false; $('#ivSkip').disabled = false;
            iv.timer = setInterval(ivTick, 100); wakeOn(); ivTick();
        };
        $('#ivPause').onclick = () => {
            if (!iv) return;
            if (iv.run) { iv.acc += Date.now() - iv.start; iv.run = false; $('#ivPause').textContent = '繼續'; $('#ivPause').classList.add('primary'); wakeOff(); }
            else { iv.start = Date.now(); iv.run = true; $('#ivPause').textContent = '暫停'; $('#ivPause').classList.remove('primary'); wakeOn(); }
            ivTick();
        };
        $('#ivSkip').onclick = () => { if (!iv) return; iv.acc += ivSkipTo(iv.tl, ivElapsed()) - ivElapsed(); ivTick(); };
        $('#ivStop').onclick = ivEndRun;
        // 切到背景再回來：用時間戳立刻校正畫面，並重新要求螢幕不關
        document.addEventListener('visibilitychange', () => { if (!document.hidden && iv && iv.run) { wakeOn(); ivTick(); } });
    </script>
</body>
