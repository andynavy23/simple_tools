<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="連線賓果：房主叫號，每人一張 5×5 賓果卡，自動標記，連成一線就喊賓果，由房主驗證。1–12 人，一個人也能玩。">
    <meta property="og:title" content="連線賓果" />
    <meta property="og:description" content="房主叫號、自動標記、喊賓果由房主驗證的多人連線賓果。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/bingo.html" />
    <title>連線賓果</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <style>
        :root {
            --wrap-w: 560px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row input {
            flex: 1 1 130px;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        #ball {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 6px auto 10px;
            display: grid;
            place-items: center;
            background: var(--blue);
            color: #fff;
            font-size: 44px;
            font-weight: 800;
            box-shadow: inset 0 -6px 12px rgba(0, 0, 0, .25);
        }

        #ball small {
            display: block;
            font-size: 14px;
            font-weight: 700;
            opacity: .85;
            margin-bottom: -6px;
        }

        #recent {
            text-align: center;
            color: var(--muted);
            min-height: 1.4em;
            margin-bottom: 8px;
        }

        #card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 420px;
            margin: 10px auto;
        }

        #card .h {
            text-align: center;
            font-weight: 800;
            color: var(--blue);
        }

        #card .c {
            aspect-ratio: 1;
            border-radius: 12px;
            background: var(--fill);
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #card .c.hit {
            background: var(--blue);
            color: #fff;
        }

        #card .c.free {
            background: var(--ok);
            color: #fff;
            font-size: 14px;
        }

        #card .c.line {
            background: #ff9f0a;
            color: #000;
        }

        #status {
            text-align: center;
            font-weight: 700;
            min-height: 1.6em;
        }

        #bingoBtn {
            display: block;
            margin: 10px auto 0;
            font-size: 22px;
            padding: 12px 40px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 3px;
            margin-top: 12px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        #board span {
            text-align: center;
            padding: 2px 0;
            border-radius: 4px;
            background: var(--fill);
            color: var(--muted);
        }

        #board span.on {
            background: var(--blue);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>連線賓果</h1>
        <p class="sub">房主負責叫號（1–75），每個人一張 5×5 卡，叫到的號碼會自動標記。橫、直、斜任一線全部標到（中間是免費格）就按「賓果」，由房主驗證，第一個驗證通過的人獲勝。</p>

        <div class="card" id="menu">
            <div class="row"><input id="nick" maxlength="10" placeholder="暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button class="primary" id="hostBtn">建立房間</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="joinBtn">加入</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div class="card" id="lobby" hidden>
            <h2>等待玩家加入（最多 12 人）</h2>
            <div class="players" id="lobbyPlayers"></div>
            <div class="row" style="margin-top:12px">
                <label for="speed" id="l1" hidden>叫號速度</label><select id="speed" hidden><option value="0">手動（房主按鈕）</option><option value="3000">每 3 秒</option><option value="5000" selected>每 5 秒</option><option value="8000">每 8 秒</option></select>
                <button id="copyInvite" hidden>複製邀請連結</button>
                <button class="primary" id="startBtn" hidden>開始（一個人也可以）</button>
            </div>
            <p class="note" id="lobbyHint"></p>
        </div>

        <div id="game" hidden>
            <div class="card">
                <div id="ball" aria-live="polite">–</div>
                <div id="recent"></div>
                <div id="status" role="status"></div>
                <div class="row" style="justify-content:center"><button class="primary" id="callBtn" hidden>叫下一個號碼</button></div>
                <div id="card" aria-label="我的賓果卡"></div>
                <button class="primary" id="bingoBtn">賓果！</button>
                <div id="board" aria-label="已叫過的號碼"></div>
            </div>
            <div class="row" style="justify-content:center">
                <button class="primary" id="again" hidden>再來一局</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

    <script>
        const { shuffle } = Util;

        // --- pure ---
        const MAX_PLAYERS = 12, LETTERS = 'BINGO';
        const letterOf = (n) => LETTERS[Math.floor((n - 1) / 15)];

        // 一張 5×5 卡：第 c 欄從 [15c+1, 15c+15] 抽 5 個不重複的號碼；正中間是免費格（0）。rows[r][c]
        function makeCard(shuf = shuffle) {
            const cols = Array.from({ length: 5 }, (_, c) => shuf(Array.from({ length: 15 }, (_, i) => c * 15 + 1 + i)).slice(0, 5));
            const card = Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => cols[c][r]));
            card[2][2] = 0;
            return card;
        }
        function validCard(card) {
            if (!Array.isArray(card) || card.length !== 5) return false;
            const seen = new Set();
            for (let r = 0; r < 5; r++) {
                if (!Array.isArray(card[r]) || card[r].length !== 5) return false;
                for (let c = 0; c < 5; c++) {
                    const v = card[r][c];
                    if (r === 2 && c === 2) { if (v !== 0) return false; continue; }
                    if (!Number.isInteger(v) || v < c * 15 + 1 || v > c * 15 + 15 || seen.has(v)) return false;
                    seen.add(v);
                }
            }
            return true;
        }
        // 12 條線：5 橫、5 直、2 斜；回傳每條線是否已全部標到（免費格視為已標）
        const LINES = [...Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => [r, c])), ...Array.from({ length: 5 }, (_, c) => Array.from({ length: 5 }, (_, r) => [r, c])), Array.from({ length: 5 }, (_, i) => [i, i]), Array.from({ length: 5 }, (_, i) => [i, 4 - i])];
        const marked = (card, called, r, c) => card[r][c] === 0 || called.has(card[r][c]);
        const doneLines = (card, called) => LINES.filter(line => line.every(([r, c]) => marked(card, called, r, c)));
        const hasBingo = (card, called) => doneLines(card, called).length > 0;

        // 叫號順序：1–75 洗牌
        const drawOrder = (shuf = shuffle) => shuf(Array.from({ length: 75 }, (_, i) => i + 1));

        function validState(s) {
            const arr = (a, f, n) => Array.isArray(a) && a.length <= n && a.every(f);
            return !!s && ['lobby', 'play', 'over'].includes(s.phase) && arr(s.names, n => typeof n === 'string' && n.length <= 12, MAX_PLAYERS) && arr(s.active, b => typeof b === 'boolean', MAX_PLAYERS)
                && arr(s.called, n => Number.isInteger(n) && n >= 1 && n <= 75, 75) && new Set(s.called).size === s.called.length && Number.isInteger(s.winner) && typeof s.note === 'string' && s.note.length <= 80 && Number.isInteger(s.speed);
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let room = null, isHost = false, my = -1, hostId = '', V = null, myCard = null;
        const H = { phase: 'lobby', order: [], called: [], cards: new Map(), winner: -1, note: '', speed: 5000, timer: null };

        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => ['#hostBtn', '#joinBtn', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });
        const show = (id, on) => { $(id).hidden = !on; };
        function readNick() {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        }

        // ---------- 房主 ----------
        const actives = () => room.players.map(p => p.connected);
        function publicState() { return { phase: H.phase, names: room.players.map(p => p.nick), active: actives(), called: H.called.slice(), winner: H.winner, note: H.note, speed: H.speed }; }
        function push() { V = publicState(); render(); room.broadcast({ t: 'STATE', s: V }); }

        function startGame() {
            room.keepSlots = true; H.speed = +$('#speed').value; H.order = drawOrder(); H.called = []; H.winner = -1; H.note = '開始！'; H.phase = 'play'; H.cards = new Map();
            room.players.forEach((p, i) => { if (!p.connected) return; const card = makeCard(); H.cards.set(i, card); if (i === my) myCard = card; else room.sendTo(i, { t: 'CARD', card }); });
            clearInterval(H.timer); if (H.speed) H.timer = setInterval(callNext, H.speed);
            push(); setTimeout(callNext, 600);
        }
        function callNext() {
            if (H.phase !== 'play') return;
            if (H.called.length >= 75) { clearInterval(H.timer); H.phase = 'over'; H.note = '75 個號碼都叫完了，沒有人獲勝'; return push(); }
            H.called.push(H.order[H.called.length]); push();
        }
        function claim(i) {
            if (H.phase !== 'play') return;
            const card = H.cards.get(i); if (!card) return;
            if (hasBingo(card, new Set(H.called))) { clearInterval(H.timer); H.phase = 'over'; H.winner = i; H.note = `${room.players[i].nick} 賓果！`; push(); }
            else { if (i === my) { flash = '還沒有連成一線喔'; render(); } else room.sendTo(i, { t: 'ERR', msg: '還沒有連成一線喔' }); }
        }

        // ---------- 連線 ----------
        let flash = '';
        const onNetError = (err, message) => { if (V || isHost) return; netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } };

        function hostRoom() {
            const nick = readNick(); if (!nick) return;
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: MAX_PLAYERS,
                onReady(r) { isHost = true; my = 0; hostId = r.id; history.replaceState('', document.title, location.pathname + '#' + r.id); push(); },
                canJoin: () => (H.phase === 'play' ? '遊戲已經開始，請等這局結束' : null),
                onJoin: () => push(),
                onLeave(p) { H.cards.delete(p.index); push(); },
                onMessage(p, d) { if (d && d.t === 'CLAIM') claim(p.index); },
                onError: onNetError,
            });
        }

        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…'); hostId = id;
            room = P2PRoom.join(id, {
                nick,
                onRoster(players, me) { my = me; if (!V) { V = { phase: 'lobby', names: players.map(p => p.nick), active: players.map(p => p.connected), called: [], winner: -1, note: '', speed: 0 }; render(); } },
                onMessage(d) {
                    if (!d || typeof d.t !== 'string') return;
                    if (d.t === 'STATE' && validState(d.s)) { if (d.s.phase === 'lobby') myCard = null; V = d.s; flash = ''; render(); }
                    else if (d.t === 'CARD' && validCard(d.card)) { myCard = d.card; render(); }
                    else if (d.t === 'ERR' && typeof d.msg === 'string') { flash = d.msg.slice(0, 30); render(); }
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (V) { alert('房主已離開'); location.reload(); } },
                onError: onNetError,
            });
        }

        // ---------- 畫面 ----------
        function render() {
            if (!V) return;
            if (V.phase === 'lobby') {
                show('#menu', false); show('#lobby', true); show('#game', false);
                $('#lobbyPlayers').replaceChildren(...V.names.map((x, i) => Object.assign(document.createElement('div'), { className: 'pl' + (V.active[i] ? '' : ' off'), textContent: x + (i === 0 ? ' 👑' : '') + (i === my ? '（我）' : '') })));
                ['#copyInvite', '#startBtn', '#speed', '#l1'].forEach(id => show(id, isHost));
                $('#lobbyHint').textContent = isHost ? '把邀請連結傳給朋友，人到齊了就按開始（也可以只有你一個人）' : '等待房主開始…'; return;
            }
            show('#menu', false); show('#lobby', false); show('#game', true);
            const called = new Set(V.called), over = V.phase === 'over', last = V.called[V.called.length - 1];
            $('#ball').replaceChildren(...(last ? [Object.assign(document.createElement('small'), { textContent: letterOf(last) }), document.createTextNode(last)] : [document.createTextNode('–')]));
            $('#recent').textContent = V.called.length ? `已叫 ${V.called.length} 個　前幾個：${V.called.slice(-6, -1).reverse().join('、') || '—'}` : '準備叫號…';
            const lines = myCard ? doneLines(myCard, called) : [], inLine = new Set(lines.flat().map(([r, c]) => r * 5 + c));
            $('#card').replaceChildren(...[...LETTERS].map(l => Object.assign(document.createElement('div'), { className: 'h', textContent: l })), ...(myCard ? myCard.flatMap((row, r) => row.map((v, c) => Object.assign(document.createElement('div'), { className: 'c' + (v === 0 ? ' free' : called.has(v) ? ' hit' : '') + (inLine.has(r * 5 + c) ? ' line' : ''), textContent: v === 0 ? '免費' : v }))) : []));
            $('#board').replaceChildren(...Array.from({ length: 75 }, (_, i) => Object.assign(document.createElement('span'), { className: called.has(i + 1) ? 'on' : '', textContent: i + 1 })));
            $('#status').textContent = flash || (over ? (V.winner >= 0 ? `🏆 ${V.names[V.winner]}${V.winner === my ? '（你）' : ''} 賓果獲勝！` : V.note) : lines.length ? `你有 ${lines.length} 條線了，快按「賓果！」` : V.speed ? `每 ${V.speed / 1000} 秒叫一個號碼` : '等房主叫號');
            show('#bingoBtn', !over && !!myCard); show('#callBtn', isHost && !over && V.speed === 0); show('#again', isHost && over);
        }

        $('#hostBtn').onclick = hostRoom;
        $('#joinBtn').onclick = joinRoom;
        $('#startBtn').onclick = startGame;
        $('#callBtn').onclick = callNext;
        $('#bingoBtn').onclick = () => { if (isHost) claim(my); else room.send({ t: 'CLAIM' }); };
        $('#again').onclick = () => { room.keepSlots = false; room.prune(); H.phase = 'lobby'; H.called = []; H.winner = -1; H.note = ''; myCard = null; push(); };
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
    </script>
</body>

</html>
