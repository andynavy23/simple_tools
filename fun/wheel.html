<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="決策轉盤：輸入選項，轉一下幫你決定。支援權重、自動記住清單。">
    <meta property="og:title" content="決策轉盤" />
    <meta property="og:description" content="輸入選項，轉一下幫你決定。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/wheel.html" />
    <title>決策轉盤</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        .stage {
            position: relative;
            width: min(100%, 360px);
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border: 12px solid transparent;
            border-top: 22px solid var(--text);
            border-bottom: 0;
        }

        #result {
            min-height: 2em;
            margin: 14px 0 10px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        #spin {
            display: block;
            margin: 0 auto;
            font-size: 17px;
            padding: 10px 32px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>決策轉盤</h1>
        <p class="sub">想不出來就交給轉盤，也有午餐、飲料、活動等常用清單。</p>

        <div class="card">
            <div class="stage">
                <canvas id="wheel" width="720" height="720" aria-label="轉盤"></canvas>
                <div class="pointer"></div>
            </div>
            <div id="result" aria-live="polite"></div>
            <button class="primary" id="spin">開始轉</button>
        </div>

        <div class="card">
            <label>常用清單（點一下載入，會取代目前的選項）</label>
            <div class="presets" id="presets"></div>
            <label for="items">選項（一行一個）</label>
            <textarea id="items"></textarea>
            <p class="note">加權重：在名稱後面寫 <b>*數字</b>，例如「燒肉*3」代表被選中機率是其他的 3 倍。清單會自動儲存在這個瀏覽器。</p>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>決策轉盤：把選項放上轉盤，轉一轉讓亂數幫你決定，可設定權重。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>中午吃什麼、飲料喝什麼、週末去哪。</li>
        <li>聚會時抽簽、決定誰請客。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點「常用清單」按鈕可載入午餐、晚餐、飲料等（會取代目前選項）。</li>
        <li>也可直接在「選項」框一行輸入一個，至少 2 個。</li>
        <li>按「開始轉」，轉盤停下後指針（上方）指到的就是結果。</li>
        <li>想讓某項機率較高，在名稱後加 <b>*數字</b>。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">選項寫「拉麵」「便當*2」「燒肉*3」→ 總權重 6，被選中的機率分別為 1/6、2/6、3/6（燒肉 50%）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>轉盤上名稱超過 8 個字會被縮短，結果仍顯示完整名稱。</li>
        <li>先決定結果再讓轉盤停到該格，機率與權重一致。</li>
        <li>清單自動存在這個瀏覽器。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 一行一個選項；名稱後面寫 *數字 代表權重，沒寫就是 1；權重 ≤ 0 的略過
        function parseItems(text) {
            return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
                const m = l.match(/^(.*?)\s*\*\s*(\d+(?:\.\d+)?)$/);
                return m && m[1] ? { name: m[1], w: +m[2] } : { name: l, w: 1 };
            }).filter(i => i.w > 0);
        }

        // 常用清單：名稱 → 選項（可含 *權重）
        const PRESETS = {
            '午餐': ['拉麵', '便當*2', '燒肉', '麥當勞', '水餃', '麵店', '咖哩飯', '壽司', '涼麵', '滷肉飯', '自己煮'],
            '晚餐': ['火鍋', '燒烤', '牛排', '義大利麵', '家常菜', '日式定食', '泰式料理', '韓式炸雞', '港式燒臘', '鍋貼'],
            '飲料': ['珍珠奶茶', '四季春', '多多綠', '黑糖鮮奶', '美式咖啡', '拿鐵', '檸檬綠茶', '仙草', '冬瓜茶'],
            '宵夜': ['鹽酥雞', '滷味', '燒烤', '泡麵', '炒飯', '蚵仔煎', '鹹粥', '豆漿燒餅'],
            '週末活動': ['看電影', '爬山', '逛街', '宅在家', '咖啡廳', '桌遊', '運動', '郊遊', '補眠'],
            '運動': ['慢跑', '游泳', '瑜珈', '重訓', '騎單車', '羽球', '籃球', '健走'],
        };
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const ta = $('#items'), cv = $('#wheel'), ctx = cv.getContext('2d');
        const btn = $('#spin'), out = $('#result');
        const KEY = 'wheel_items', TAU = Math.PI * 2;
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let angle = 0, spinning = false;

        const { store } = Util;
        ta.value = store.get(KEY, '');
        if (!ta.value) ta.value = '拉麵\n便當*2\n燒肉\n麥當勞\n自己煮';

        const parse = () => parseItems(ta.value);

        function draw() {
            const items = parse(), n = items.length, R = cv.width / 2;
            ctx.clearRect(0, 0, cv.width, cv.height);
            if (!n) return;
            const total = items.reduce((s, i) => s + i.w, 0);
            let a = angle;
            items.forEach((it, i) => {
                const span = it.w / total * TAU;
                ctx.beginPath();
                ctx.moveTo(R, R);
                ctx.arc(R, R, R - 4, a, a + span);
                ctx.fillStyle = `hsl(${i * 360 / n}, 70%, 55%)`;
                ctx.fill();
                ctx.save();
                ctx.translate(R, R);
                ctx.rotate(a + span / 2);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 34px sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                const label = it.name.length > 8 ? it.name.slice(0, 7) + '…' : it.name;
                ctx.fillText(label, R - 28, 0);
                ctx.restore();
                a += span;
            });
        }

        function spin() {
            const items = parse();
            if (items.length < 2) { out.textContent = '請至少輸入 2 個選項'; return; }
            const total = items.reduce((s, i) => s + i.w, 0);
            // 先抽出贏家，再讓轉盤停在那一格（落點在該格內隨機，避免永遠停在中線）
            let r = Math.random() * total, k = 0;
            while (k < items.length - 1 && r >= items[k].w) r -= items[k++].w;
            const before = items.slice(0, k).reduce((s, i) => s + i.w, 0);
            const offset = (before + items[k].w * (0.15 + Math.random() * 0.7)) / total * TAU;
            // 指針在正上方 (-90°)：offset 位置轉到那裡所需的角度，再多轉 5 圈
            const base = -Math.PI / 2 - offset;
            const from = angle;
            const to = from + (((base - from) % TAU) + TAU) % TAU + TAU * 5;
            const done = () => {
                angle = to % TAU;
                draw();
                spinning = false;
                btn.disabled = false;
                out.textContent = '🎉 ' + items[k].name;
            };
            spinning = true;
            btn.disabled = true;
            out.textContent = '';
            if (reduceMotion) return done();
            const t0 = performance.now(), dur = 4500;
            (function frame(now) {
                const t = Math.min(1, (now - t0) / dur);
                angle = from + (to - from) * (1 - Math.pow(1 - t, 3));
                draw();
                t < 1 ? requestAnimationFrame(frame) : done();
            })(t0);
        }

        $('#presets').replaceChildren(...Object.entries(PRESETS).map(([name, list]) => Object.assign(document.createElement('button'), {
            className: 'sm', textContent: name, onclick: () => { if (spinning) return; ta.value = list.join('\n'); store.set(KEY, ta.value); out.textContent = ''; draw(); },
        })));
        btn.onclick = spin;
        ta.oninput = () => {
            store.set(KEY, ta.value);
            if (!spinning) { out.textContent = ''; draw(); }
        };
        draw();
    </script>
</body>

</html>
