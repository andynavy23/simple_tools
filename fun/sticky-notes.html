<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="便條紙：快速記下想法，可標色、釘選、搜尋，一鍵複製，資料只存在你的瀏覽器，不會讀取你的剪貼簿。">
    <meta property="og:title" content="便條紙" />
    <meta property="og:description" content="標色、釘選、搜尋的本機便條紙。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/sticky-notes.html" />
    <title>便條紙</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 860px;
            --c-yellow: #fff3a3;
            --c-pink: #ffc9d6;
            --c-green: #c8f0c8;
            --c-blue: #c7e3ff;
            --c-purple: #e3d4ff;
            --c-white: #ffffff;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row input[type=search] {
            flex: 1 1 200px;
        }

        .colors {
            display: flex;
            gap: 2px;
        }

        .colors button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            padding: 0;
            border: 3px solid transparent;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2);
        }

        .colors button[aria-pressed=true] {
            border-color: var(--text);
        }

        @media (pointer: coarse) {
            .colors button {
                width: 44px;
                height: 44px;
                border-width: 8px;
                background-clip: content-box !important;
                box-shadow: none;
            }

            .colors button[aria-pressed=true] {
                border-color: transparent;
                outline: 3px solid var(--text);
                outline-offset: -4px;
            }
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .sticky {
            border-radius: 6px 6px 14px 6px;
            padding: 12px;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .18);
            margin: 0;
        }

        .sticky textarea {
            flex: 1;
            width: 100%;
            min-height: 100px;
            resize: vertical;
            background: transparent;
            border: 0;
            font: 15px/1.5 inherit;
            color: inherit;
            padding: 0;
        }

        .sticky textarea:focus {
            outline: none;
        }

        .sticky .tools {
            display: flex;
            gap: 4px;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .sticky .tools button {
            padding: 3px 10px;
            min-width: 44px;
            font-size: 13px;
            background: rgba(0, 0, 0, .1);
            color: #1d1d1f;
        }

        .sticky small {
            color: rgba(0, 0, 0, .5);
            font-size: 12px;
        }

        .sticky.pin {
            outline: 3px solid #ff9f0a;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>便條紙</h1>
        <p class="sub">想到就記。內容只存在這個瀏覽器，不會讀取你的剪貼簿，也不會上傳。換瀏覽器或清除網站資料會消失，重要的請複製或匯出。</p>

        <div class="card">
            <div class="row"><input type="search" id="q" placeholder="搜尋便條" aria-label="搜尋便條"><div class="colors" id="colors"></div><button class="primary" id="add">新增便條</button></div>
            <div class="row" style="margin-top:8px"><button class="sm" id="export">匯出全部（.txt）</button><button class="sm" id="clear">清除全部</button><span class="muted" id="info"></span></div>
        </div>
        <div id="grid"></div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>彩色便條紙牆：想到什麼就寫一張，可搜尋、釘選、換顏色與匯出。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>臨時記電話、購物清單、靈感。</li>
        <li>工作時的短筆記，重要的釘在最上面。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>先點右側色塊選新便條顏色，按「新增便條」。</li>
        <li>直接在便條裡輸入，內容會自動儲存。</li>
        <li>便條下方：「釘選」放到最前面、「複製」複製內容、「顏色」輪換顏色、✕ 刪除。</li>
        <li>上方搜尋框可用關鍵字篩選。</li>
        <li>「匯出全部（.txt）」下載文字檔，「清除全部」刪光。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">新增黃色便條寫「買牛奶、雞蛋」，按「釘選」→ 它會排在所有便條的最前面，並有橘色外框。</div>
        <h3>小提醒</h3>
        <ul>
        <li>最多 200 張，每張最多 5000 字。</li>
        <li>內容只存在這個瀏覽器，不會上傳；換瀏覽器或清除網站資料會消失，重要的請匯出。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, rnd, download, day } = Util;

        // --- pure ---
        const COLORS = ['yellow', 'pink', 'green', 'blue', 'purple', 'white'];
        const MAX_NOTES = 200, MAX_LEN = 5000;
        const validNote = (n) => !!n && typeof n.id === 'string' && typeof n.text === 'string' && n.text.length <= MAX_LEN && COLORS.includes(n.color) && typeof n.pin === 'boolean' && Number.isFinite(n.at);
        // 排序：釘選的在前，其次最近修改的在前
        const sortNotes = (list) => [...list].sort((a, b) => (b.pin - a.pin) || (b.at - a.at));
        const filterNotes = (list, q) => { q = q.trim().toLowerCase(); return q ? list.filter(n => n.text.toLowerCase().includes(q)) : list; };
        // 匯出文字：每張便條用分隔線隔開，前面標日期與顏色
        function exportText(list) {
            const pad = (n) => String(n).padStart(2, '0'), d = (t) => { const x = new Date(t); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
            return sortNotes(list).map(n => `[${d(n.at)}${n.pin ? '・釘選' : ''}]\n${n.text}`).join('\n\n--------\n\n');
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let notes = store.get('sticky_notes', []).filter(validNote), color = 'yellow', saveT = 0;
        const save = () => store.set('sticky_notes', notes);

        $('#colors').replaceChildren(...COLORS.map(c => { const b = document.createElement('button'); b.style.background = `var(--c-${c})`; b.setAttribute('aria-label', '新便條的顏色：' + c); b.setAttribute('aria-pressed', c === color); b.onclick = () => { color = c; [...$('#colors').children].forEach(x => x.setAttribute('aria-pressed', x === b)); }; return b; }));

        function render() {
            const list = filterNotes(sortNotes(notes), $('#q').value);
            $('#info').textContent = `${notes.length} 張${$('#q').value.trim() ? `，符合 ${list.length} 張` : ''}`;
            $('#grid').replaceChildren(...list.map(n => {
                const d = document.createElement('div'); d.className = 'sticky card' + (n.pin ? ' pin' : ''); d.style.background = `var(--c-${n.color})`;
                const ta = Object.assign(document.createElement('textarea'), { value: n.text, maxLength: MAX_LEN, placeholder: '寫點什麼…' }); ta.setAttribute('aria-label', '便條內容');
                ta.oninput = () => { n.text = ta.value; n.at = Date.now(); clearTimeout(saveT); saveT = setTimeout(save, 300); };
                ta.onblur = save;                                   // 只存檔，不重畫（重畫會讓剛按下的按鈕消失）
                const tools = document.createElement('div'); tools.className = 'tools';
                const btn = (t, label, fn) => { const b = Object.assign(document.createElement('button'), { textContent: t, onclick: fn }); b.setAttribute('aria-label', label); return b; };
                const left = document.createElement('div'); left.className = 'row'; left.style.gap = '4px';
                left.append(btn(n.pin ? '取消釘選' : '📌 釘選', '釘選', () => { n.pin = !n.pin; save(); render(); }), btn('複製', '複製內容', function () { Util.copyWithFeedback(this, n.text); }), btn('顏色', '換顏色', () => { n.color = COLORS[(COLORS.indexOf(n.color) + 1) % COLORS.length]; save(); render(); }));
                tools.append(left, btn('✕', '刪除這張便條', () => { if (!n.text.trim() || confirm('刪除這張便條？')) { notes = notes.filter(x => x.id !== n.id); save(); render(); } }));
                const t = new Date(n.at); d.append(ta, Object.assign(document.createElement('small'), { textContent: `${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` }), tools);
                return d;
            }));
        }

        $('#add').onclick = () => {
            if (notes.length >= MAX_NOTES) { $('#info').textContent = `最多 ${MAX_NOTES} 張，請先刪除一些`; return; }
            $('#q').value = ''; notes.push({ id: Date.now().toString(36) + rnd(1e6).toString(36), text: '', color, pin: false, at: Date.now() }); save(); render();
            const ta = document.querySelector('#grid .sticky textarea'); if (ta) ta.focus();
        };
        $('#q').oninput = render;
        $('#export').onclick = () => { if (notes.length) download(new Blob([exportText(notes)], { type: 'text/plain;charset=utf-8' }), `notes-${day.today()}.txt`); };
        $('#clear').onclick = () => { if (notes.length && confirm(`刪除全部 ${notes.length} 張便條？無法復原。`)) { notes = []; save(); render(); } };
        window.addEventListener('pagehide', save);
        render();
    </script>
</body>

</html>
