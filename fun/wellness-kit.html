    <template id="help">
        <h3>這是什麼</h3>
        <p>四個健康小工具合在一頁：間歇性斷食計時、辦公室伸展引導、呼吸練習、運動計次器。不用連線。</p>
        <h3>什麼時候用</h3>
        <ul><li>想做 16:8 等斷食，需要知道什麼時候達標。</li><li>久坐腰痠脖子僵，想跟著倒數伸展幾分鐘。</li><li>緊張、睡不著，想跟著圓圈慢慢呼吸。</li><li>做伏地挺身、深蹲、跳繩時想記次數與休息時間。</li></ul>
        <h3>怎麼用</h3>
        <ul>
            <li><b>斷食</b>：選模式，按「開始斷食」；想吃東西時按「開始進食」，這次就記進歷史（日期、時長、是否達標）。計時用時間戳，關掉頁面再回來也會繼續。時間以台灣時間（UTC+8）顯示，「連續達標天數」依結束日期計算。</li>
            <li><b>伸展</b>：選部位（或「全套」約 4 分鐘），照畫面說明做，每個動作倒數結束會自動換下一個，可暫停 / 跳過。</li>
            <li><b>呼吸</b>：選方式與回合數按開始。圓圈放大是吸氣、縮小是吐氣。若系統設定「減少動態效果」，圓圈不會動，改看文字倒數與進度條。</li>
            <li><b>運動</b>：點 +1 計數，做完一組按「完成這一組」就記錄並開始組間休息倒數。下方有今天總量與近 7 日長條。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">20:00 開始 16:8 斷食，隔天 12:00 按「開始進食」→ 時長 16 小時，達標，連續天數 +1；進食視窗剩 8 小時。</div>
        <h3>小提醒</h3>
        <ul>
            <li>僅供參考，不是醫療建議。懷孕、糖尿病、服藥、進食障礙或有慢性病者，請先諮詢醫師再斷食；身體不適請立刻停止。</li>
            <li>伸展內容只收通行的溫和動作，有傷痛請先諮詢醫師。</li>
            <li>本機資料：斷食歷史最多 365 筆（滿了要先清除才能開始下一次），運動紀錄最多 1000 筆（滿了拒絕新增）。斷食可單筆刪除或全部清除、運動可單筆刪除或全部清除，清除前會確認、無法復原。呼吸只記住上次選項。</li>
            <li>資料壞掉或被改壞時，載入會自動略過不合格的項目；儲存失敗會提示。可用右上角「💾」備份。</li>
        </ul>
    </template>

    <script>
        const { store } = Util;

        // --- pure ---
        const MAXH = 365, MAXL = 1000, TZ = 8 * 3600e3, H = 3600e3;
        const twDay = (ts) => new Date(ts + TZ).toISOString().slice(0, 10);
        const twTime = (ts) => new Date(ts + TZ).toISOString().slice(5, 16).replace('T', ' ');
        const dayShift = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
        const FAST_H = { '16:8': 16, '18:6': 18, '20:4': 20, '5:2': 24, 'omad': 23, 'custom': 16 };
        const fastHours = (mode, ch) => mode === 'custom' ? Math.min(72, Math.max(1, Math.round(+ch) || 16)) : (FAST_H[mode] || 16);
        const eatHours = (g) => Math.max(0, 24 - g);
        // 時間戳進度：elapsed 由 now - start 算出，不累加
        function fastInfo(start, now, goalH) {
            const el = Math.max(0, now - start), gm = goalH * H;
            return { el, remain: Math.max(0, gm - el), pct: Math.min(1, el / gm), done: el >= gm };
        }
        function fmtDur(ms) {
            const s = Math.floor(Math.max(0, ms) / 1000);
            return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }
        // 連續達標天數：以結束日期（UTC+8）計；今天還沒有就從昨天往回算
        function fastStreak(hist, today) {
            const days = new Set(hist.filter(h => h.ok).map(h => twDay(h.e)));
            let d = days.has(today) ? today : dayShift(today, -1), n = 0;
            while (days.has(d)) { n++; d = dayShift(d, -1); }
            return n;
        }
        const isTs = (v) => Number.isFinite(v) && v > 0 && v < 4e12;
        function cleanFast(o) {
            o = o && typeof o === 'object' ? o : {};
            const mode = FAST_H[o.mode] ? o.mode : '16:8';
            const ch = fastHours('custom', o.ch);
            const cur = o.cur && isTs(o.cur.s) && Number.isFinite(o.cur.g) && o.cur.g >= 1 && o.cur.g <= 72 ? { s: o.cur.s, g: o.cur.g } : null;
            const eat = o.eat && isTs(o.eat.s) && Number.isFinite(o.eat.h) && o.eat.h >= 0 && o.eat.h <= 24 ? { s: o.eat.s, h: o.eat.h } : null;
            const hist = (Array.isArray(o.hist) ? o.hist : []).filter(h => h && typeof h.id === 'string' && isTs(h.s) && isTs(h.e) && h.e >= h.s && Number.isFinite(h.g) && h.g >= 1 && h.g <= 72)
                .map(h => ({ id: h.id.slice(0, 16), s: h.s, e: h.e, g: h.g, ok: (h.e - h.s) >= h.g * H })).slice(-MAXH);
            return { mode, ch, cur, eat: cur ? null : eat, hist };
        }
        // 呼吸：[吸, 閉, 吐, 閉] 秒數；k = 0 吸 1 閉(滿) 2 吐 3 閉(空)
        const BREATH = { '478': [4, 7, 8, 0], 'box': [4, 4, 4, 4], 'res': [5.5, 0, 5.5, 0] };
        const PH = ['吸氣', '閉氣', '吐氣', '閉氣'];
        const breathCycle = (a) => a.reduce((x, y) => x + y, 0);
        function breathAt(a, t, rounds) {
            const cyc = breathCycle(a), total = cyc * rounds;
            if (!(cyc > 0) || t >= total) return { done: true, total };
            const round = Math.floor(t / cyc) + 1;
            let x = t % cyc;
            for (let k = 0; k < 4; k++) {
                if (a[k] <= 0) continue;
                if (x < a[k]) {
                    const frac = x / a[k];
                    const size = k === 0 ? .4 + .6 * frac : k === 1 ? 1 : k === 2 ? 1 - .6 * frac : .4;
                    return { done: false, total, round, k, name: PH[k], rem: a[k] - x, frac, size };
                }
                x -= a[k];
            }
            return { done: true, total };
        }
        function cleanBreath(a) {
            a = Array.isArray(a) ? a.slice(0, 4).map(v => Math.min(20, Math.max(0, Math.round((+v || 0) * 2) / 2))) : [4, 4, 4, 4];
            while (a.length < 4) a.push(0);
            return breathCycle(a) > 0 ? a : [4, 4, 4, 4];
        }
        // 伸展
        const STRETCH = [
            { id: 'neck', n: '頸部', m: [
                { n: '低頭前傾', e: '🙇', s: 20, d: '坐正，慢慢低頭讓下巴靠近胸口，感覺後頸輕輕拉長。雙手放大腿，不要用手壓頭。' },
                { n: '側頸伸展', e: '🙆', s: 20, d: '耳朵慢慢靠向肩膀，另一側肩膀放鬆下沉。前半段一側、後半段換邊。' },
                { n: '轉頭看肩', e: '👀', s: 30, d: '下巴微收，慢慢轉頭看向一側肩膀後方，停住呼吸順暢。前半段一側、後半段換邊。' },
                { n: '後縮下巴', e: '😐', s: 30, d: '眼睛平視，頭部水平往後縮（像做雙下巴），停 3 秒放鬆，重複。矯正頭前傾。' }] },
            { id: 'shoulder', n: '肩部', m: [
                { n: '肩膀畫圈', e: '🔄', s: 20, d: '雙肩往上、往後、往下畫大圓，前半段向後轉、後半段向前轉，動作放慢。' },
                { n: '手臂橫過胸前', e: '🤗', s: 20, d: '一手橫過胸前，另一手托住手肘輕輕往身體拉。前半段一側、後半段換邊。' },
                { n: '背後擴胸', e: '🙌', s: 30, d: '雙手在背後十指交扣，手臂伸直、挺胸、肩胛往中間夾。手扣不到可抓毛巾。' },
                { n: '手肘過頭', e: '💪', s: 30, d: '一手舉過頭彎手肘，另一手輕壓手肘往後，感覺上臂後側伸展。前半段一側、後半段換邊。' }] },
            { id: 'back', n: '腰背', m: [
                { n: '坐姿轉體', e: '🌀', s: 20, d: '坐正，手扶椅背或對側大腿，從胸口帶動慢慢轉身，骨盆朝前。前半段一側、後半段換邊。' },
                { n: '坐姿貓牛式', e: '🐈', s: 20, d: '雙手放膝蓋，吸氣挺胸、背微微後仰；吐氣拱背、肚臍往內收，來回做。' },
                { n: '坐姿前彎', e: '🙇‍♂️', s: 30, d: '雙腳踏穩，身體慢慢前彎讓雙手垂向地面，頭頸放鬆，起身時慢慢捲起。' },
                { n: '站姿側彎', e: '🧍', s: 30, d: '站直，一手上舉往另一側輕輕側彎，身體不要前傾或扭轉。前半段一側、後半段換邊。' }] },
            { id: 'leg', n: '腿部', m: [
                { n: '站姿大腿前側', e: '🦵', s: 20, d: '一手扶牆，另一手抓同側腳踝往臀部靠，膝蓋併攏。前半段一側、後半段換邊；站不穩可跳過。' },
                { n: '大腿後側', e: '🪑', s: 20, d: '坐椅緣，一腳向前伸直腳跟著地，背打直從髖部前傾。前半段一側、後半段換邊。' },
                { n: '小腿伸展', e: '🧱', s: 30, d: '雙手扶牆，一腳向後跨一步、腳跟踩地、膝蓋伸直，前腳微彎。前半段一側、後半段換邊。' },
                { n: '坐姿臀部伸展', e: '🦿', s: 30, d: '坐正，一腳踝放在另一膝上，背挺直輕輕前傾。前半段一側、後半段換邊。膝蓋不舒服就免做。' }] },
            { id: 'wrist', n: '手腕', m: [
                { n: '手腕畫圈', e: '🤲', s: 20, d: '雙手握拳，手腕向內、向外各畫圈，動作放慢。' },
                { n: '手掌向前伸展', e: '✋', s: 20, d: '一手手臂伸直、掌心朝前，另一手握住手指輕輕往身體方向拉。前半段一側、後半段換邊。' },
                { n: '手背向前伸展', e: '🤚', s: 30, d: '一手手臂伸直、手背朝前，另一手握住手背輕輕往身體方向壓。前半段一側、後半段換邊。' },
                { n: '握拳與張開', e: '✊', s: 30, d: '用力握拳 2 秒，再把手指盡量張開，重複，血液循環更好。' }] },
            { id: 'eye', n: '眼睛', m: [
                { n: '遠眺放鬆', e: '🏞️', s: 20, d: '看向 6 公尺（約 20 英尺）以外的物體，讓眼睛放鬆，即 20-20-20 護眼法。' },
                { n: '用力眨眼', e: '😉', s: 20, d: '緩慢而完整地眨眼 10 次，再輕輕閉眼休息，改善乾澀。' },
                { n: '眼球轉動', e: '👁️', s: 30, d: '頭不動，眼睛慢慢看上、右、下、左，再反方向。動作要輕，不用力。' },
                { n: '掌心覆眼', e: '🫶', s: 30, d: '雙手搓熱，掌心輕輕覆在閉上的眼睛上（不要壓眼球），感受溫暖與黑暗。' }] },
        ];
        function stretchPlan(id) {
            if (id === 'all') return STRETCH.flatMap(p => p.m.slice(0, 2).map(m => ({ ...m, part: p.n })));
            const p = STRETCH.find(x => x.id === id);
            return p ? p.m.map(m => ({ ...m, part: p.n })) : [];
        }
        const planSecs = (plan) => plan.reduce((x, m) => x + m.s, 0);
        // 運動紀錄
        const WO_ITEMS = ['伏地挺身', '深蹲', '跳繩', '仰臥起坐'];
        const DATE_RE = /^\d{4}-\d\d-\d\d$/;
        function cleanLog(a) {
            return (Array.isArray(a) ? a : []).filter(r => r && typeof r.id === 'string' && DATE_RE.test(r.d) && typeof r.it === 'string' && r.it.length >= 1 && r.it.length <= 10 && Number.isInteger(r.n) && r.n >= 1 && r.n <= 9999)
                .map(r => ({ id: r.id.slice(0, 16), d: r.d, it: r.it, n: r.n })).slice(-MAXL);
        }
        function dayStats(log, day) {
            const m = {};
            log.filter(r => r.d === day).forEach(r => { const o = m[r.it] || (m[r.it] = { it: r.it, n: 0, sets: 0 }); o.n += r.n; o.sets++; });
            return Object.values(m);
        }
        function last7(log, today, item) {
            return Array.from({ length: 7 }, (_, i) => {
                const d = dayShift(today, i - 6);
                return { d, n: log.filter(r => r.d === d && (!item || r.it === item)).reduce((x, r) => x + r.n, 0) };
            });
        }
        function cleanOpts(o) {
            o = o && typeof o === 'object' ? o : {};
            const bp = ['478', 'box', 'res', 'custom'].includes(o.bp) ? o.bp : '478';
            return {
                bp, br: Math.min(60, Math.max(1, Math.round(+o.br) || 4)), bc: cleanBreath(o.bc),
                snd: !!o.snd, vib: !!o.vib, rest: Number.isFinite(Math.round(+o.rest)) ? Math.min(600, Math.max(0, Math.round(+o.rest))) : 60,
                item: typeof o.item === 'string' && o.item.length <= 10 && o.item ? o.item : WO_ITEMS[0],
                tab: ['fast', 'str', 'br', 'wo'].includes(o.tab) ? o.tab : 'fast'
            };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const nid = () => Util.randomHex(4);
        const esc = Util.esc;
        let F = cleanFast(store.get('wellness_fast', null));
        let O = cleanOpts(store.get('wellness_opts', null));
        let LOG = cleanLog(store.get('wellness_log', null));
        const saveF = () => store.set('wellness_fast', F);
        const saveO = () => store.set('wellness_opts', O);
        const saveL = () => store.set('wellness_log', LOG);
        const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
        const today = () => twDay(Date.now());

        // ---- 分頁 ----
        const TABS = ['fast', 'str', 'br', 'wo'];
        function tab(t) {
            [...$('#tabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            TABS.forEach(k => { $('#p-' + k).hidden = k !== t; });
            if (O.tab !== t) { O.tab = t; saveO(); }
            if (t === 'wo') renderWo();
        }
        $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); };

        // ---- 斷食 ----
        const goalH = () => F.cur ? F.cur.g : fastHours(F.mode, F.ch);
        function warnF(t) { const w = $('#fWarn'); w.hidden = !t; w.textContent = t || ''; }
        function renderFast() {
            const now = Date.now(), C = 326.7;
            $('#fMode').value = F.mode; $('#fCh').value = F.ch;
            $('#fCustomBox').hidden = F.mode !== 'custom';
            $('#fMode').disabled = $('#fCh').disabled = !!F.cur;
            let big, lbl, info, pct = 0, btns = '';
            if (F.cur) {
                const i = fastInfo(F.cur.s, now, F.cur.g);
                pct = i.pct;
                big = i.done ? '+' + fmtDur(i.el - F.cur.g * H) : fmtDur(i.remain);
                lbl = i.done ? '已達標，繼續斷食中' : '距離達標';
                info = `開始 ${twTime(F.cur.s)} · 已斷食 ${fmtDur(i.el)} · 目標 ${F.cur.g} 小時（${twTime(F.cur.s + F.cur.g * H)}）`;
                btns = '<button id="fEat">開始進食（結束斷食）</button><button id="fAbort" class="sm">放棄這次</button>';
            } else {
                const e = F.eat ? fastInfo(F.eat.s, now, F.eat.h || 0.0001) : null;
                if (e && !e.done) { big = fmtDur(e.remain); lbl = '進食視窗剩餘'; pct = 1 - e.pct; info = `進食視窗 ${twTime(F.eat.s)} ～ ${twTime(F.eat.s + F.eat.h * H)}`; }
                else { big = '--:--:--'; lbl = F.eat ? '進食視窗已結束' : '尚未開始'; info = `${F.mode === 'custom' ? '自訂' : F.mode}：斷食 ${fastHours(F.mode, F.ch)} 小時、進食視窗 ${eatHours(fastHours(F.mode, F.ch))} 小時`; }
                btns = '<button id="fStart">開始斷食</button>';
            }
            $('#fBig').textContent = big; $('#fLbl').textContent = lbl; $('#fInfo').textContent = info;
            $('#fBar').style.strokeDashoffset = C * (1 - pct);
            if ($('#fBtns').dataset.s !== btns) { $('#fBtns').innerHTML = btns; $('#fBtns').dataset.s = btns; }
        }
        function renderHist() {
            $('#fStreak').textContent = fastStreak(F.hist, today()) + ' 天';
            $('#fCount').textContent = F.hist.length + ' / ' + MAXH;
            $('#fHist').innerHTML = F.hist.slice().reverse().slice(0, 60).map(h =>
                `<div class="hl"><span>${twDay(h.e)} · ${fmtDur(h.e - h.s)} / 目標 ${h.g} 小時 · ${h.ok ? '達標' : '未達標'}</span><button class="sm" data-del="${esc(h.id)}">刪除</button></div>`).join('') +
                (F.hist.length > 60 ? `<p class="muted">只顯示最近 60 筆，共 ${F.hist.length} 筆。</p>` : '');
        }
        $('#fMode').onchange = () => { F.mode = $('#fMode').value; saveF(); renderFast(); };
        $('#fCh').onchange = () => { F.ch = fastHours('custom', $('#fCh').value); saveF(); renderFast(); };
        $('#fBtns').onclick = (e) => {
            const id = e.target.id; warnF('');
            if (id === 'fStart') {
                if (F.hist.length >= MAXH) { warnF(`斷食歷史已滿 ${MAXH} 筆，請先清除或刪除舊紀錄再開始。`); return; }
                F.cur = { s: Date.now(), g: fastHours(F.mode, F.ch) }; F.eat = null;
            } else if (id === 'fEat') {
                const e2 = Date.now();
                F.hist.push({ id: nid(), s: F.cur.s, e: e2, g: F.cur.g, ok: (e2 - F.cur.s) >= F.cur.g * H });
                F.hist = F.hist.slice(-MAXH);
                F.eat = { s: e2, h: eatHours(F.cur.g) }; F.cur = null;
            } else if (id === 'fAbort') {
                if (!confirm('放棄這次斷食？不會記進歷史，無法復原。')) return;
                F.cur = null;
            } else return;
            saveF(); renderFast(); renderHist();
        };
        $('#fHist').onclick = (e) => {
            const id = e.target.dataset.del; if (!id) return;
            if (!confirm('刪除這筆斷食紀錄？無法復原。')) return;
            F.hist = F.hist.filter(h => h.id !== id); saveF(); renderHist();
        };
        $('#fClear').onclick = () => {
            if (!F.hist.length) return;
            if (!confirm('清除全部斷食歷史？（進行中的斷食不受影響）無法復原。')) return;
            F.hist = []; saveF(); renderHist();
        };

        // ---- 伸展 ----
        let st = null; // { plan, i, end, paused(剩餘 ms), wl }
        $('#sParts').innerHTML = [...STRETCH.map(p => `<button data-p="${p.id}">${p.n}</button>`), '<button data-p="all">全套</button>'].join('');
        const sumTxt = () => '部位：' + STRETCH.map(p => `${p.n} ${Math.round(planSecs(stretchPlan(p.id)) / 10) / 6} 分`).join('、') + `；全套 ${Math.round(planSecs(stretchPlan('all')) / 6) / 10} 分。`;
        $('#sSum').textContent = sumTxt();
        async function wl(on) {
            try {
                if (on && navigator.wakeLock) st.wl = await navigator.wakeLock.request('screen');
                else if (!on && st && st.wl) { st.wl.release(); st.wl = null; }
            } catch (e) { }
        }
        function sShow() {
            const m = st.plan[st.i];
            $('#sEmoji').textContent = m.e; $('#sName').textContent = `${m.part}：${m.n}`; $('#sDesc').textContent = m.d;
            $('#sStep').textContent = `第 ${st.i + 1} / ${st.plan.length} 個動作 · ${m.s} 秒`;
            $('#sPause').textContent = st.paused != null ? '繼續' : '暫停';
        }
        function sStart(id) {
            if (st) sEnd(true);
            const plan = stretchPlan(id); if (!plan.length) return;
            st = { plan, i: 0, end: Date.now() + plan[0].s * 1000, paused: null, wl: null };
            ['#sPause', '#sSkip', '#sStop'].forEach(s => $(s).disabled = false);
            wl(true); sShow();
        }
        function sEnd(quiet) {
            wl(false); st = null;
            ['#sPause', '#sSkip', '#sStop'].forEach(s => $(s).disabled = true);
            $('#sCnt').textContent = ''; $('#sBar').style.width = '0';
            if (!quiet) { $('#sEmoji').textContent = '🎉'; $('#sName').textContent = '完成！'; $('#sDesc').textContent = '辛苦了，記得多喝水。'; $('#sStep').textContent = ''; Util.beep(2); }
        }
        function sNext() {
            if (st.i + 1 >= st.plan.length) return sEnd(false);
            st.i++; st.end = Date.now() + st.plan[st.i].s * 1000; sShow(); Util.tone(660, 120);
        }
        function sTick() {
            if (!st || st.paused != null) return;
            const rem = st.end - Date.now(), m = st.plan[st.i];
            if (rem <= 0) return sNext();
            $('#sCnt').textContent = Math.ceil(rem / 1000);
            $('#sBar').style.width = (100 * (1 - rem / (m.s * 1000))) + '%';
        }
        $('#sParts').onclick = (e) => { const p = e.target.dataset.p; if (p) sStart(p); };
        $('#sPause').onclick = () => {
            if (!st) return;
            if (st.paused == null) st.paused = Math.max(0, st.end - Date.now()); else { st.end = Date.now() + st.paused; st.paused = null; }
            sShow();
        };
        $('#sSkip').onclick = () => { if (st) sNext(); };
        $('#sStop').onclick = () => { if (st) sEnd(true); $('#sEmoji').textContent = '🧘'; $('#sName').textContent = '選一個部位開始'; $('#sDesc').textContent = ''; $('#sStep').textContent = ''; };
        document.addEventListener('visibilitychange', () => { if (st && !document.hidden && !st.wl) wl(true); });

        // ---- 呼吸 ----
        let br = null; // { a, rounds, t0, k }
        const bArr = () => O.bp === 'custom' ? O.bc : BREATH[O.bp];
        function bSum() {
            const a = bArr(), tot = Math.round(breathCycle(a) * O.br);
            $('#bSum').textContent = `一回合 ${breathCycle(a)} 秒（${a.map((v, i) => v ? PH[i] + v : '').filter(Boolean).join(' / ')}）· ${O.br} 回合共 ${Math.floor(tot / 60)} 分 ${tot % 60} 秒`;
        }
        function renderBr() {
            $('#bP').value = O.bp; $('#bRounds').value = O.br; $('#bCustom').hidden = O.bp !== 'custom';
            O.bc.forEach((v, i) => { $('#bc' + i).value = v; });
            $('#bSound').checked = O.snd; $('#bVib').checked = O.vib; bSum();
        }
        function bStop(msg) {
            br = null; $('#bGo').textContent = '開始'; $('#bOrb').style.transform = ''; $('#bOrb').classList.remove('still');
            $('#bCnt').textContent = msg || '準備'; $('#bTxt').textContent = ''; $('#bRound').textContent = ''; $('#bBarBox').hidden = true;
        }
        function bTick() {
            if (!br) return;
            const r = breathAt(br.a, (Date.now() - br.t0) / 1000, br.rounds);
            if (r.done) { if (O.snd) Util.beep(2); bStop('完成'); return; }
            const rd = reduced();
            $('#bOrb').classList.toggle('still', rd); $('#bBarBox').hidden = !rd;
            if (!rd) $('#bOrb').style.transform = `scale(${r.size})`; else $('#bBar').style.width = (r.frac * 100) + '%';
            $('#bCnt').textContent = Math.ceil(r.rem - 1e-6); $('#bTxt').textContent = r.name;
            $('#bRound').textContent = `第 ${r.round} / ${br.rounds} 回合`;
            if (r.k !== br.k || r.round !== br.r) {
                br.k = r.k; br.r = r.round;
                if (O.snd) Util.tone(r.k === 0 ? 660 : r.k === 2 ? 440 : 550, 120);
                if (O.vib) try { navigator.vibrate && navigator.vibrate(40); } catch (e) { }
            }
        }
        $('#bGo').onclick = () => {
            if (br) return bStop();
            br = { a: bArr(), rounds: O.br, t0: Date.now(), k: -1, r: 0 }; $('#bGo').textContent = '停止'; bTick();
        };
        $('#bP').onchange = () => { O.bp = $('#bP').value; saveO(); renderBr(); };
        $('#bRounds').onchange = () => { O.br = cleanOpts({ br: $('#bRounds').value }).br; saveO(); renderBr(); };
        [0, 1, 2, 3].forEach(i => { $('#bc' + i).onchange = () => { O.bc = cleanBreath([0, 1, 2, 3].map(j => $('#bc' + j).value)); saveO(); renderBr(); }; });
        $('#bSound').onchange = () => { O.snd = $('#bSound').checked; saveO(); };
        $('#bVib').onchange = () => { O.vib = $('#bVib').checked; saveO(); };

        // ---- 運動 ----
        let cnt = 0, restEnd = 0;
        const wItems = () => [...WO_ITEMS, '自訂'];
        $('#wItem').innerHTML = wItems().map(x => `<option>${x}</option>`).join('');
        const curItem = () => $('#wItem').value === '自訂' ? ($('#wCustom').value.trim().slice(0, 10) || '自訂') : $('#wItem').value;
        function warnW(t) { const w = $('#wWarn'); w.hidden = !t; w.textContent = t || ''; }
        function renderWo() {
            $('#wN').textContent = cnt; $('#wCustom').hidden = $('#wItem').value !== '自訂';
            const it = curItem(), td = today();
            $('#wSets').textContent = `今天「${it}」已完成 ${LOG.filter(r => r.d === td && r.it === it).length} 組`;
            const stt = dayStats(LOG, td);
            $('#wToday').innerHTML = stt.length ? stt.map(s => `<div class="li stat"><span>今天 ${esc(s.it)}（${s.sets} 組）</span><b>${s.n}</b></div>`).join('') : '<p class="muted">今天還沒有紀錄。</p>';
            const b = last7(LOG, td, it), mx = Math.max(1, ...b.map(x => x.n));
            $('#wBars').innerHTML = b.map(x => `<div title="${x.d}">${x.n || ''}<i style="height:${Math.round(x.n / mx * 90)}%"></i>${x.d.slice(8)}</div>`).join('');
            $('#wBarTitle').textContent = `「${it}」近 7 日次數`;
            $('#wList').innerHTML = LOG.filter(r => r.d === td).reverse().map(r => `<div class="hl"><span>${esc(r.it)} ${r.n} 次</span><button class="sm" data-del="${esc(r.id)}">刪除</button></div>`).join('');
            $('#wRest').value = O.rest;
        }
        function wTick() {
            const b = $('#wRestBig');
            if (!restEnd) return;
            const rem = restEnd - Date.now();
            if (rem <= 0) { restEnd = 0; b.hidden = true; Util.beep(2); return; }
            b.hidden = false; b.textContent = '休息 ' + Math.ceil(rem / 1000) + ' 秒';
        }
        $('#wItem').value = WO_ITEMS.includes(O.item) ? O.item : '自訂';
        if (!WO_ITEMS.includes(O.item)) $('#wCustom').value = O.item;
        const saveItem = () => { O.item = curItem(); saveO(); renderWo(); };
        $('#wItem').onchange = saveItem; $('#wCustom').onchange = saveItem;
        $('#wRest').onchange = () => { O.rest = cleanOpts({ rest: $('#wRest').value }).rest; saveO(); renderWo(); };
        $('#wPlus').onclick = () => { cnt = Math.min(9999, cnt + 1); $('#wN').textContent = cnt; };
        $('#wMinus').onclick = () => { cnt = Math.max(0, cnt - 1); $('#wN').textContent = cnt; };
        $('#wReset').onclick = () => { cnt = 0; $('#wN').textContent = 0; };
        $('#wDone').onclick = () => {
            warnW('');
            if (cnt < 1) return;
            if (LOG.length >= MAXL) { warnW(`運動紀錄已滿 ${MAXL} 筆，請先刪除或清除舊紀錄。`); return; }
            LOG.push({ id: nid(), d: today(), it: curItem(), n: cnt }); saveL(); cnt = 0;
            restEnd = O.rest > 0 ? Date.now() + O.rest * 1000 : 0; wTick(); renderWo();
        };
        $('#wList').onclick = (e) => {
            const id = e.target.dataset.del; if (!id) return;
            if (!confirm('刪除這筆運動紀錄？無法復原。')) return;
            LOG = LOG.filter(r => r.id !== id); saveL(); renderWo();
        };
        $('#wClear').onclick = () => {
            if (!LOG.length) return;
            if (!confirm('清除全部運動紀錄？無法復原。')) return;
            LOG = []; saveL(); renderWo();
        };

        // ---- 啟動 ----
        renderFast(); renderHist(); renderBr(); renderWo(); tab(O.tab);
        setInterval(() => {
            if (!$('#p-fast').hidden) renderFast();
            sTick(); bTick(); wTick();
        }, 200);
    </script>
</body>

</html>
