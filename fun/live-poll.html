<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="投票 / 搶答：房主出題，大家用手機即時作答，長條圖顯示結果；測驗模式有計分與排行榜。">
    <meta property="og:title" content="投票 / 搶答" />
    <meta property="og:description" content="房主出題，大家即時投票或搶答，長條圖顯示結果。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/live-poll.html" />
    <title>投票 / 搶答</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>

    <template id="help">
        <h3>這是什麼</h3>
        <p>投票與搶答小工具：出一題、給幾個選項，看長條圖即時顯示結果；也可以切到「測驗」模式，有正解、有限時、有計分。可以一個人用（不連線），也可以開房間讓朋友用手機加入。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>聚餐前自己先排一排「吃什麼」，順便看模擬投票的熱鬧結果。</li>
        <li>一個人練習問答題、測自己的反應速度。</li>
        <li>聚會、小型課堂時，主持人出題，大家用手機即時作答。</li>
        </ul>
        <h3>怎麼用：單人使用（不連線）</h3>
        <ol>
        <li>在首頁按綠色最上面的「單人使用（不連線）」，什麼都不用連、不用暱稱。</li>
        <li>輸入題目與至少 2 個選項，選「投票」或「測驗」。測驗要點選正解旁的圓點，可設時間。</li>
        <li>投票模式可設「模擬投票者」（0–20 人），他們會依隨機偏好在幾秒內陸續投票，長條圖即時變化。你也可以自己投、隨時改選。</li>
        <li>測驗是單人答題：選完立刻公布對錯，答對得 100 分，限時題剩餘時間越多最高再加 50 分。</li>
        <li>「我的成績」記錄本次累計與歷史最佳（只存在這台裝置）；按「重置分數」可清空本次累計。</li>
        </ol>
        <h3>怎麼用：連線（和朋友）</h3>
        <ol>
        <li>主持人輸入暱稱，按「我要出題（建立房間）」，再按「複製邀請連結」傳給朋友（最多 30 人）。</li>
        <li>朋友打開連結、輸入暱稱，按「加入作答」（或貼房號）。</li>
        <li>主持人出題後按「開始作答」；成員點選項作答。投票可改選並即時看到結果；測驗只能答一次，答對依快慢給分，結束後公布正解與排行榜。</li>
        <li>主持人不能投票；時間到會自動結束，也可按「結束並公布」。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">單人：題目「午餐吃什麼」，選項 拉麵 / 便當 / 漢堡，模擬投票者 5 人 → 約 3 秒內 5 張票陸續落在三個選項，再自己點「便當」，總人數變成 6。
        測驗：「2+3=?」選項 4 / 5 / 6，正解選 5，限時 30 秒；第 6 秒答對 → 100 + 50×(1−6/30) = 140 分。</div>
        <h3>小提醒</h3>
        <ul>
        <li>單人版完全不連線，離線也能用；模擬投票者只用於投票模式。</li>
        <li>連線版需要 P2P 連線，主持人離開房間就結束；手機請保持螢幕開啟。</li>
        <li>測驗進行中不顯示票數，避免被別人影響。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <style>
        :root {
            --wrap-w: 640px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row input[type=text],
        .row input:not([type]) {
            flex: 1 1 140px;
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .opt input[type=text] {
            flex: 1;
        }

        label {
            color: var(--muted);
            font-size: 14px;
        }

        #q {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
            word-break: break-all;
        }

        .choice {
            display: block;
            width: 100%;
            text-align: left;
            position: relative;
            overflow: hidden;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 14px;
            font-size: 17px;
        }

        .choice .bar {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: color-mix(in srgb, var(--blue) 30%, transparent);
            transition: width .3s;
        }

        .choice>span {
            position: relative;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .choice.mine {
            outline: 3px solid var(--blue);
        }

        .choice.right {
            outline: 3px solid var(--ok);
        }

        .choice.right .bar {
            background: color-mix(in srgb, var(--ok) 35%, transparent);
        }

        #status {
            text-align: center;
            color: var(--muted);
            margin: 10px 0;
            min-height: 1.5em;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>投票 / 搶答</h1>
        <p class="sub">房主出題，朋友用房號或邀請連結加入（最多 30 人），手機也能作答。</p>

        <div class="card" id="menu">
            <div class="row"><button class="primary" id="soloBtn">單人使用（不連線）</button></div>
            <p class="note">自己出題、自己投；投票可加「模擬投票者」，測驗限時計分，成績只存在本機。</p>
            <h2>和朋友連線</h2>
            <div class="row"><input id="nick" maxlength="10" placeholder="暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button class="primary" id="hostBtn">我要出題（建立房間）</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="joinBtn">加入作答</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div id="room" hidden>
            <div class="card" id="editor" hidden>
                <div class="row"><input type="text" id="qIn" maxlength="60" placeholder="題目" aria-label="題目"></div>
                <div id="optIn"></div>
                <div class="row">
                    <label for="mode">模式</label>
                    <select id="mode"><option value="poll">投票（可改選，即時顯示結果）</option><option value="quiz">測驗（單選有正解、計分）</option></select>
                    <label for="limit">時間</label>
                    <select id="limit"><option value="0">不限時</option><option value="15">15 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select>
                </div>
                <div class="row" id="simRow" hidden>
                    <label for="simN">模擬投票者（僅投票模式，0–20）</label>
                    <input type="number" id="simN" min="0" max="20" value="5" style="width:80px">
                </div>
                <div class="row">
                    <button class="primary" id="openBtn">開始作答</button>
                    <button id="closeBtn" disabled>結束並公布</button>
                    <button class="sm" id="copyInvite">複製邀請連結</button>
                    <button class="sm" id="resetScores">重置分數</button>
                </div>
            </div>

            <div class="card" id="view">
                <div class="meta"><span id="who"></span><span id="count"></span></div>
                <div id="q"></div>
                <div id="choices"></div>
                <div id="status" role="status" aria-live="polite"></div>
                <div id="board"></div>
            </div>
            <div class="row" style="justify-content:center"><button id="leave">離開</button></div>
        </div>
    </div>

    <script>
        // --- pure ---
        const MAX_OPTS = 6;
        const BASE_POINTS = 100;

        // 各選項票數
        function tally(opts, n) {
            const c = new Array(n).fill(0);
            opts.forEach(o => { if (Number.isInteger(o) && o >= 0 && o < n) c[o]++; });
            return c;
        }

        // 測驗：答對者依作答快慢給分（第 1 名多 50、之後每名少 10，最少 0）
        const quizPoints = (rank) => BASE_POINTS + Math.max(0, 50 - rank * 10);
        const pct = (count, total) => (total ? Math.round(count / total * 100) : 0);

        // 成員送來的投票是否有效
        function validVote(st, m) {
            return !!m && st.phase === 'open' && m.qid === st.qid && Number.isInteger(m.opt) && m.opt >= 0 && m.opt < st.n;
        }

        // 成員端檢查房主傳來的公開狀態
        function validState(s) {
            const a = (x, n) => Array.isArray(x) && x.length <= n;
            return !!s && Number.isInteger(s.qid) && ['idle', 'open', 'closed'].includes(s.phase) && ['poll', 'quiz'].includes(s.mode)
                && typeof s.q === 'string' && s.q.length <= 80 && a(s.opts, MAX_OPTS) && s.opts.every(o => typeof o === 'string' && o.length <= 40)
                && (s.counts === null || (a(s.counts, MAX_OPTS) && s.counts.every(Number.isInteger))) && Number.isInteger(s.answered) && Number.isInteger(s.total)
                && Number.isFinite(s.ms) && Number.isInteger(s.correct) && a(s.board, 10)
                && s.board.every(b => b && typeof b.n === 'string' && b.n.length <= 12 && Number.isFinite(b.p));
        }

        // 單機：測驗得分（答對 100 + 剩餘時間比例 × 50；不限時給 100）
        function soloPoints(ok, elapsed, limit) {
            if (!ok) return 0;
            return BASE_POINTS + (limit > 0 ? Math.round(50 * Math.min(1, Math.max(0, 1 - elapsed / limit))) : 0);
        }
        // 單機：模擬投票者的偏好權重（每個選項隨機，至少 0.1）與依權重抽出 k 張票
        function simWeights(n, rnd = Math.random) { return Array.from({ length: n }, () => 0.1 + rnd()); }
        function simVotes(weights, k, rnd = Math.random) {
            const sum = weights.reduce((a, b) => a + b, 0);
            return Array.from({ length: k }, () => {
                let r = rnd() * sum;
                for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
                return weights.length - 1;
            });
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let room = null, isHost = false, solo = false, simTimers = [], soloTotal = 0, soloBest = +(function () { try { return localStorage.getItem('livepoll_solo_best'); } catch (e) { return 0; } })() || 0, hostId = '', S = null, myVote = -1, myQid = -1;
        const H = { sim: 0, qid: 0, phase: 'idle', mode: 'poll', q: '', opts: [], correct: -1, limit: 0, endsAt: 0, openAt: 0, votes: new Map(), scores: new Map(), timer: null };

        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => ['#hostBtn', '#joinBtn', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });
        function readNick() {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        }

        // ---------- 房主 ----------
        const guests = () => room.players.filter(p => p.index !== 0 && p.connected);

        function publicState() {
            const hidden = H.mode === 'quiz' && H.phase === 'open';
            const counts = tally([...H.votes.values()].map(v => v.opt), H.opts.length);
            const board = solo ? (soloTotal || soloBest ? [{ n: '本次累計', p: soloTotal }, { n: '歷史最佳', p: soloBest }] : []) : [...H.scores.values()].sort((a, b) => b.pts - a.pts).slice(0, 10).map(x => ({ n: x.nick, p: x.pts }));
            return {
                qid: H.qid, phase: H.phase, mode: H.mode, q: H.q, opts: H.opts, counts: hidden ? null : counts, answered: H.votes.size, total: solo ? 1 + H.sim : guests().length,
                ms: H.phase === 'open' && H.limit ? Math.max(0, H.endsAt - Date.now()) : -1, correct: H.phase === 'closed' && H.mode === 'quiz' ? H.correct : -1, board,
            };
        }
        function push() { S = publicState(); S.at = Date.now(); render(); if (room) room.broadcast({ t: 'STATE', s: S }); }

        function openQuestion() {
            const opts = [...document.querySelectorAll('#optIn input[type=text]')].map(i => i.value.trim()).filter(Boolean);
            const q = $('#qIn').value.trim(), mode = $('#mode').value;
            const rad = document.querySelector('#optIn input[type=radio]:checked');
            const filled = [...document.querySelectorAll('#optIn input[type=text]')].map(i => i.value.trim());
            const correct = rad ? filled.slice(0, +rad.value).filter(Boolean).length : -1;       // 正解在「非空選項」中的位置
            if (!q || opts.length < 2) { alert('請輸入題目與至少 2 個選項'); return; }
            if (mode === 'quiz' && (correct < 0 || !filled[+rad.value])) { alert('測驗模式請選一個正解'); return; }
            clearInterval(H.timer); simTimers.forEach(clearTimeout); simTimers = [];
            Object.assign(H, { sim: solo && mode === 'poll' ? Math.max(0, Math.min(20, +$('#simN').value || 0)) : 0, qid: H.qid + 1, phase: 'open', mode, q, opts, correct: mode === 'quiz' ? correct : -1, limit: +$('#limit').value * 1000, openAt: Date.now(), votes: new Map() });
            H.endsAt = H.openAt + H.limit;
            if (solo) { myVote = -1; myQid = H.qid; startSim(); }
            if (H.limit) H.timer = setInterval(() => { if (Date.now() >= H.endsAt) closeQuestion(); else render(); }, 250);
            push();
        }

        function closeQuestion() {
            if (H.phase !== 'open') return;
            clearInterval(H.timer);
            H.phase = 'closed'; simTimers.forEach(clearTimeout); simTimers = [];
            if (solo) {
                const v = H.votes.get('me');
                if (H.mode === 'quiz') {
                    soloTotal += soloPoints(!!v && v.opt === H.correct, v ? v.t : 0, H.limit);
                    if (soloTotal > soloBest) { soloBest = soloTotal; try { localStorage.setItem('livepoll_solo_best', soloBest); } catch (e) { } }
                }
            } else if (H.mode === 'quiz') {
                const right = [...H.votes.entries()].filter(([, v]) => v.opt === H.correct).sort((a, b) => a[1].t - b[1].t);
                right.forEach(([id], rank) => { const p = room.players.find(x => x.peerId === id); const cur = H.scores.get(id) || { nick: p ? p.nick : '?', pts: 0 }; cur.pts += quizPoints(rank); if (p) cur.nick = p.nick; H.scores.set(id, cur); });
            }
            push();
        }

        // 單機：模擬投票者在 0.3–2.5 秒內陸續投票
        function startSim() {
            const votes = simVotes(simWeights(H.opts.length), H.sim), qid = H.qid;
            votes.forEach((opt, i) => simTimers.push(setTimeout(() => {
                if (H.qid !== qid || H.phase !== 'open') return;
                H.votes.set('sim' + i, { opt, t: Date.now() - H.openAt }); push();
            }, 300 + Math.random() * 2200)));
        }
        function soloVote(opt) {
            if (!validVote({ phase: H.phase, qid: H.qid, n: H.opts.length }, { qid: H.qid, opt })) return;
            if (H.mode === 'quiz' && H.votes.has('me')) return;
            H.votes.set('me', { opt, t: Date.now() - H.openAt }); myVote = opt;
            if (H.mode === 'quiz') closeQuestion(); else push();    // 單人測驗：答完立刻公布
        }
        function startSolo() {
            solo = true; $('#menu').hidden = true; $('#room').hidden = false; $('#editor').hidden = false;
            $('#copyInvite').hidden = true; $('#simRow').hidden = false;
            S = publicState(); S.at = Date.now(); render();
        }

        function onVote(p, m) {
            if (!validVote({ phase: H.phase, qid: H.qid, n: H.opts.length }, m)) return;
            if (H.mode === 'quiz' && H.votes.has(p.peerId)) return;          // 測驗：只能答一次
            H.votes.set(p.peerId, { opt: m.opt, t: Date.now() - H.openAt });
            room.sendTo(p.index, { t: 'YOU', qid: H.qid, opt: m.opt });
            push();
        }

        // ---------- 連線 ----------
        function onNetError(err, message) { if (S) return; netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } }

        function hostRoom() {
            const nick = readNick(); if (!nick) return;
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: 30,
                onReady(r) { isHost = true; hostId = r.id; history.replaceState('', document.title, location.pathname + '#' + r.id); S = publicState(); enterRoom(); },
                onJoin(p) { room.sendTo(p.index, { t: 'STATE', s: publicState() }); push(); },
                onLeave() { push(); },
                onMessage(p, d) { if (d && d.t === 'VOTE') onVote(p, d); },
                onError: onNetError,
            });
        }

        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…'); hostId = id;
            room = P2PRoom.join(id, {
                nick,
                onJoined() { S = { qid: 0, phase: 'idle', mode: 'poll', q: '', opts: [], counts: null, answered: 0, total: 0, ms: -1, correct: -1, board: [], at: Date.now() }; enterRoom(); },
                onMessage(d) {
                    if (!d || typeof d.t !== 'string') return;
                    if (d.t === 'STATE' && validState(d.s)) { S = d.s; S.at = Date.now(); if (S.qid !== myQid) { myQid = S.qid; myVote = -1; } render(); }
                    else if (d.t === 'YOU' && Number.isInteger(d.opt) && d.qid === S.qid) { myVote = d.opt; render(); }
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (S) { alert('房主已離開'); location.reload(); } },
                onError: onNetError,
            });
        }

        // ---------- 畫面 ----------
        function enterRoom() { $('#menu').hidden = true; $('#room').hidden = false; $('#editor').hidden = !isHost; render(); }

        function render() {
            if (!S) return;
            const open = S.phase === 'open', closed = S.phase === 'closed';
            $('#who').textContent = solo ? '單人使用（不連線）' : isHost ? '你是主持人' : '作答中';
            $('#count').textContent = solo && S.mode === 'quiz' ? `本次累計 ${soloTotal} 分` : `${S.answered} / ${S.total} 人已作答`;
            $('#q').textContent = S.q || (isHost || solo ? '在上方輸入題目後按「開始作答」' : '等待主持人出題…');
            const showCounts = S.counts !== null;
            const total = S.counts ? S.counts.reduce((a, b) => a + b, 0) : 0;
            $('#choices').replaceChildren(...S.opts.map((o, i) => {
                const b = document.createElement('button');
                b.className = 'choice' + (i === myVote ? ' mine' : '') + (closed && S.correct === i ? ' right' : '');
                b.disabled = !open || isHost || (S.mode === 'quiz' && myVote >= 0);   // 測驗只能答一次
                const bar = document.createElement('div'); bar.className = 'bar'; bar.style.width = showCounts ? pct(S.counts[i], total) + '%' : '0';
                const row = document.createElement('span'), t = document.createElement('span'), n = document.createElement('b');
                t.textContent = `${String.fromCharCode(65 + i)}. ${o}`;
                n.textContent = showCounts ? `${S.counts[i]}（${pct(S.counts[i], total)}%）` : (i === myVote ? '✓' : '');
                row.append(t, n); b.append(bar, row);
                b.onclick = () => { if (S.phase !== 'open' || (S.mode === 'quiz' && myVote >= 0)) return; if (solo) { soloVote(i); return; } myVote = i; room.send({ t: 'VOTE', qid: S.qid, opt: i }); render(); };
                return b;
            }));
            let st = '';
            if (open) {
                const left = S.ms < 0 ? '' : `　剩 ${Math.max(0, Math.ceil((isHost ? H.endsAt - Date.now() : S.ms - (Date.now() - S.at)) / 1000))} 秒`;
                st = (isHost ? '作答中' : myVote >= 0 ? (S.mode === 'poll' ? '已送出，可改選' : '已送出，等待公布') : '請選擇答案') + left;
            } else if (closed) {
                st = S.mode === 'quiz' && !isHost ? (myVote === S.correct ? '🎉 答對了！' : myVote < 0 ? '你沒有作答' : `答錯了，正解是 ${String.fromCharCode(65 + S.correct)}`) : '已結束作答';
            } else st = isHost ? '' : '';
            $('#status').textContent = st;
            $('#board').replaceChildren(...(S.board.length ? [Object.assign(document.createElement('h2'), { textContent: solo ? '我的成績' : '排行榜' }), ...S.board.map((b, i) => { const d = document.createElement('div'); d.className = 'li'; d.append(Object.assign(document.createElement('span'), { textContent: `${i + 1}. ${b.n}` }), Object.assign(document.createElement('b'), { textContent: b.p })); return d; })] : []));
            if (isHost || solo) { $('#openBtn').textContent = open ? '重新出題' : '開始作答'; $('#closeBtn').disabled = !open; }
        }
        setInterval(() => { if (S && S.phase === 'open' && S.ms >= 0) render(); }, 500);

        // 編輯器：6 個選項，測驗模式時才顯示「正解」單選鈕
        function buildEditor() {
            $('#optIn').replaceChildren(...Array.from({ length: MAX_OPTS }, (_, i) => {
                const d = document.createElement('div'); d.className = 'opt';
                const r = document.createElement('input'); r.type = 'radio'; r.name = 'correct'; r.value = i; r.title = '正解'; r.hidden = true;
                const t = document.createElement('input'); t.type = 'text'; t.maxLength = 40; t.placeholder = `選項 ${String.fromCharCode(65 + i)}${i < 2 ? '（必填）' : '（選填）'}`;
                d.append(r, t);
                return d;
            }));
            document.querySelector('#optIn input[type=radio]').checked = true;
        }
        $('#mode').onchange = () => document.querySelectorAll('#optIn input[type=radio]').forEach(r => { r.hidden = $('#mode').value !== 'quiz'; });

        $('#hostBtn').onclick = hostRoom;
        $('#joinBtn').onclick = joinRoom;
        $('#openBtn').onclick = openQuestion;
        $('#closeBtn').onclick = closeQuestion;
        $('#resetScores').onclick = () => { H.scores = new Map(); soloTotal = 0; if (S) push(); };
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        $('#soloBtn').onclick = startSolo;
        buildEditor();
        if (typeof P2PRoom !== 'undefined' && P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
    </script>
</body>

</html>
