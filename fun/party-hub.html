        <h3>這是什麼</h3>
        <p>六種聚會小遊戲放在同一個房間：兩真一假、二選一、頻率猜心、猜價格、禁語猜詞、間諜。選好遊戲開房，朋友用連結加入；只有一支手機時也能「同機傳遞」。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>聚餐、旅行、線上聚會想玩點輕鬆的。</li>
            <li>人在一起：一支手機輪流傳；人不在一起：連線，一人一支手機。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
            <li><b>連線：</b>輸入暱稱、選遊戲與規則，按「建立房間」，把邀請連結傳給朋友。大家按「我準備好了」，房主按「開始遊戲」（人數上限可選 4–12 人）。</li>
            <li><b>同機傳遞：</b>輸入玩家名字（2–12 人，一行一位），按「同機傳遞開始」。輪到誰就把手機交給誰，看到「換人」畫面時先別偷看，交給本人再按鈕。禁語猜詞需要連線（至少 4 人）。</li>
        </ol>
        <h3>規則</h3>
        <ul>
            <li><b>兩真一假：</b>輪流當出題者，寫三句關於自己的話（兩真一假）並標記哪句是假的；其他人猜假的。猜中 +2；出題者每騙到一人 +1、每被猜中一人 -1。</li>
            <li><b>二選一：</b>題庫約 60 題或房主自己出題，大家同時選 A / B。可選「少數派得分」「多數派得分」（人數較少 / 較多的一邊每人 +1，平手不計）或不計分。</li>
            <li><b>頻率猜心：</b>出題者看到 0–100 光譜上的隱藏目標，用一句提示詞讓大家猜位置。誤差 ≤4 得 4 分、≤8 得 3、≤14 得 2、≤22 得 1；出題者得大家的平均分。目標用 SHA-256 加鹽承諾，揭曉時自動驗證沒被更動。</li>
            <li><b>猜價格：</b>輪流有人輸入物品與實際價格，其他人同時猜。「最接近且不超過」：猜的價格不高於實際價、差距最小者得 3 分（全部超過就沒人得分）；「最接近」：不論高低最接近者得 3 分。同差距平分。</li>
            <li><b>禁語猜詞：</b>分兩隊。說明者看到目標詞與禁用詞，限時讓隊友猜出，不能說出禁用詞；說明者按「猜中了」+1、「跳過」每回合最多 3 次；對隊的人看得到卡片，可按「犯規」讓本隊 -1 並換下一張。</li>
            <li><b>間諜：</b>除了間諜每人看到同一個地點與自己的角色，間諜只知道自己是間諜。輪流提問與回答；倒數時間內任何人（每人一次）可以指控某人，其餘人全部同意才成立。間諜可隨時猜地點。時間到大家投票。平民贏每人 +2，間諜贏 +4。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">兩真一假：小美寫「我去過冰島」「我會倒立走路」「我養過三隻貓」，標記第 2 句是假的。小明、小華猜；小明猜第 2 句（+2）、小華猜第 1 句；小美 +1 -1 = 0。</div>
        <h3>小提醒</h3>
        <ul>
            <li>這是一次性的遊戲，不會儲存任何資料，離開頁面就沒了。</li>
            <li>斷線的人用同一個暱稱重新加入就能回到原位；房主離開則遊戲結束。有人還沒操作時，房主可按「不等了」跳過未完成的人。</li>
            <li>內建題庫都是輕鬆話題；兩真一假的內容由玩家自己輸入，請彼此尊重。</li>
            <li>同機傳遞時，記得交給本人再按鈕，看完要蓋起來。</li>
        </ul>
    </template>

        // ---- 抽題 / 隊伍 / 排名 ----

        // 犯規只能由「不同隊、不是說明者、仍在線」的人按

        function rank(scores) {

        }
        // 唯一最高票的座位；平手或沒人投回傳 -1
        function voteTally(votes) {

        const waveScore = (err) => (err <= 4 ? 4 : err <= 8 ? 3 : err <= 14 ? 2 : err <= 22 ? 1 : 0);

        const H = {};

            },
            check(G) {

                    G.res = { actor: G.actor, pair: G.pair, clue: G.clue, target: G.target, secret: String(G.target), salt: G.salt, guesses: { ...G.guesses }, pts: r.pts, giver: r.giver }; setPhase(G, 'reveal');
                }
            },
            view(G, s) { return { actor: G.actor, pair: G.pair, clue: G.clue, target: s === G.actor ? G.target : -1, commit: G.commit, voted: voted(G.guesses), mine: s in G.guesses ? G.guesses[s] : -1 }; },
        };

            if (G.kind === 'spy' && G.phase === 'play' && S.lookRound !== G.round) { S.lookRound = G.round; S.look = live(G); }
            let seat = -1, kind = '';
            if (G.kind === 'spy' && G.phase === 'play' && S.spyGuess) { seat = G.spy; kind = 'spyGuess'; }
            else if (G.kind === 'spy' && G.phase === 'play' && S.look.length) { seat = S.look[0]; kind = 'look'; }
            else { const p = pending(G); if (p.length) { seat = p[0]; kind = 'act'; } }
            const now = Date.now();
            if (seat < 0) { S.seat = -1; return draw(view(G, -1, now), { ctl: true, solo: true }); }
            if (kind === 'spyGuess') {
                const v = view(G, seat, now); screens('game'); cur = null; lastSig = '';
                $('#board').replaceChildren(); $('#status').textContent = '間諜猜地點'; $('#foot').replaceChildren();
                $('#body').replaceChildren(note('選出你認為的地點；猜對間諜獲勝，猜錯平民獲勝。'), h('div', { className: 'locs' }, LOCS.map((l, i) => btn(l.n, () => { S.spyGuess = false; S.shown = false; const e = act(G, seat, { t: 'guess', loc: i }, ctx()); if (e) msg(e); soloDraw(); }))), btn('取消', () => { S.spyGuess = false; S.shown = false; soloDraw(); }));
                return;
            }
            const nm = G.names[seat];
            if (S.seat !== seat || !S.shown) {
                S.seat = seat; S.shown = false; screens('game'); cur = null; lastSig = '';
                $('#board').replaceChildren(); $('#status').textContent = '換人'; $('#foot').replaceChildren();
                $('#body').replaceChildren(h('div', { className: 'cover' }, h('p', { className: 'big', textContent: `請把裝置交給「${nm}」` }), h('p', { className: 'note', textContent: '其他人不要偷看，交給本人再按下面的按鈕。' }), btn(`我是 ${nm}，開始`, () => { S.shown = true; soloDraw(); }, true, { id: 'coverBtn' })));
                return;
            }
            draw(view(G, seat, now), { solo: true, look: kind === 'look', private: true, ctl: false });
        }
        $('#soloBtn').onclick = soloStart;

        // ---------- 連線表單 ----------
        const enableNet = (on) => ['#hostBtn', '#joinBtn', '#joinId', '#nick', '#maxP'].forEach(s => { $(s).disabled = !on; });
        function readNick() { const n = $('#nick').value.trim(); if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; } return n; }
        $('#hostBtn').onclick = hostRoom;
        $('#joinBtn').onclick = joinRoom;
        if (P2PRoom.roomFromUrl() && P2PRoom.roomFromUrl() !== 'a') $('#joinId').value = P2PRoom.roomFromUrl();
    </script>
</body>

</html>
