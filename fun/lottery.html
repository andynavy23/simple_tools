<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="抽獎 / 分組：貼上名單抽出 N 位得獎者，可排除已中獎的人；用刮刮樂揭曉，或把名單隨機分成幾組。">
    <meta property="og:title" content="抽獎 / 分組" />
    <meta property="og:description" content="貼上名單抽獎、刮刮樂或隨機分組。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/lottery.html" />
    <meta name="st-keys" content="lottery_won,lottery_names,groups_names">
    <title>抽獎 / 分組</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .prize {
            position: relative;
            height: 84px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg);
            box-shadow: inset 0 0 0 2px var(--fill);
        }

        .prize b {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 22px;
            word-break: break-all;
            padding: 0 8px;
            text-align: center;
        }

        .prize canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        .prize.win {
            box-shadow: inset 0 0 0 2px var(--ok);
        }

        #out .prize {
            animation: pop .3s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.85);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>抽獎 / 分組</h1>
        <p class="sub">貼上名單（換行、逗號、頓號分隔），用安全亂數抽出得獎者，或隨機分組。</p>

        <div class="card">
            <textarea id="names" aria-label="名單" placeholder="小明&#10;小華&#10;小美&#10;阿強"></textarea>
            <div class="row">
                <label for="n">抽出</label>
                <input id="n" type="number" min="1" value="1" style="width:80px">
                <label for="mode">方式</label>
                <select id="mode"><option value="draw">直接抽出</option><option value="scratch">刮刮樂</option></select>
                <label><input type="checkbox" id="excl" checked> 已中獎者不再抽</label>
            </div>
            <div class="row">
                <button class="primary" id="go">抽！</button>
                <button class="sm" id="resetPool">重置中獎紀錄</button>
                <span class="muted" id="info"></span>
            </div>
        </div>

        <div class="card">
            <h2>本次結果</h2>
            <div class="cards" id="out"></div>
        </div>

        <div class="card">
            <h2>歷次得獎者 <span class="muted" id="cnt" style="font-weight:400;font-size:14px"></span></h2>
            <div id="log"></div>
        </div>

        <div class="card">
            <h2>隨機分組</h2>
            <div class="row" style="margin-top:0">
                <select id="gmode" aria-label="分組方式"><option value="groups">分成 N 組</option><option value="size">每組 M 人</option></select>
                <input id="gnum" type="number" min="1" value="2" style="width:80px" aria-label="數量">
                <button class="primary" id="gsplit">分組</button>
            </div>
            <div id="gout" aria-live="polite"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>貼上名單後用安全亂數抽獎，另外也能把名單隨機分組。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>尾牙、社團、直播互動抽獎。</li>
        <li>分組報告、分隊比賽、排值日。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在名單框貼上名字（換行、逗號、頓號都可分隔）。</li>
        <li>設定「抽出」人數與「方式」：「直接抽出」或「刮刮樂」（用手指或滑鼠刮開）。</li>
        <li>預設勾選「已中獎者不再抽」；要重新開始按「重置中獎紀錄」（會先確認）。中獎紀錄只保留最近 300 次抽獎。</li>
        <li>按「抽！」，結果顯示在「本次結果」，歷次得獎者會累積在下方。</li>
        <li>要分組：下方選「分成 N 組」或「每組 M 人」，填數量按「分組」。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">名單「小明、小華、小美、阿強」，抽出 2 → 例如得到小美、阿強。分成 2 組 → 每組各 2 人。</div>
        <h3>小提醒</h3>
        <ul>
        <li>同名的人會被視為同一個人，請加上區別。</li>
        <li>刮開超過一半面積才會完全揭曉。</li>
        <li>名單與中獎紀錄只存在這個瀏覽器。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { shuffle, store, parseNames } = Util;

        // --- pure ---
        // 從名單抽 n 位；exclude 是已中獎的名字（同名者一併排除）
        const pick = (names, n, exclude = []) => shuffle(names.filter(x => !exclude.includes(x))).slice(0, n);

        // 洗牌後輪流發牌：各組人數最多差 1
        function split(names, n) {
            const groups = Array.from({ length: n }, () => []);
            shuffle(names).forEach((name, i) => groups[i % n].push(name));
            return groups;
        }

        // 已刮開的比例：alpha 是 canvas 的 RGBA 資料；取樣每 step 個像素
        function clearedFraction(rgba, step = 4) {
            let seen = 0, clear = 0;
            for (let i = 3; i < rgba.length; i += 4 * step) { seen++; if (rgba[i] < 128) clear++; }
            return seen ? clear / seen : 0;
        }
        // 中獎紀錄驗證：每次抽獎一組名字（字串）；最多留最近 MAX_DRAWS 次
        const MAX_DRAWS = 300;
        const cleanWon = (w) => Array.isArray(w) ? w.filter(g => Array.isArray(g)).map(g => g.filter(x => typeof x === 'string')).filter(g => g.length).slice(-MAX_DRAWS) : [];
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let won = cleanWon(store.get('lottery_won', []));                         // [[名字,…], …]（每次抽獎一組）
        $('#names').value = store.get('lottery_names', '') || store.get('groups_names', '');      // 舊的「隨機分組」名單一併帶過來

        const flat = () => won.flat();
        function renderLog() {
            const total = flat().length;
            $('#cnt').textContent = `（共 ${total} 位）`;
            $('#log').replaceChildren(...won.map((g, i) => {
                const d = document.createElement('div'); d.className = 'li';
                d.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `第 ${i + 1} 次` }), Object.assign(document.createElement('b'), { textContent: g.join('、') }));
                return d;
            }).reverse());
            const names = parseNames($('#names').value);
            const left = names.length - flat().filter(x => names.includes(x)).length;
            $('#info').textContent = names.length ? `名單 ${names.length} 人，${$('#excl').checked ? '還能抽 ' + Math.max(0, left) + ' 人' : '可重複中獎'}` : '';
        }

        function prizeCard(name, scratch) {
            const box = document.createElement('div'); box.className = 'prize win';
            const b = document.createElement('b'); b.textContent = name; box.append(b);
            if (scratch) attachScratch(box);
            return box;
        }

        function attachScratch(box) {
            const c = document.createElement('canvas'); box.append(c);
            requestAnimationFrame(() => {
                const w = c.width = box.clientWidth, h = c.height = box.clientHeight, g = c.getContext('2d', { willReadFrequently: true });
                const grad = g.createLinearGradient(0, 0, w, h); grad.addColorStop(0, '#9a9aa0'); grad.addColorStop(1, '#c7c7cc');
                g.fillStyle = grad; g.fillRect(0, 0, w, h);
                g.fillStyle = '#6e6e73'; g.font = '14px sans-serif'; g.textAlign = 'center'; g.fillText('刮開', w / 2, h / 2 + 5);
                g.globalCompositeOperation = 'destination-out'; g.lineWidth = 28; g.lineCap = g.lineJoin = 'round';
                let down = false, last = null;
                const at = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * w / r.width, (e.clientY - r.top) * h / r.height]; };
                c.onpointerdown = (e) => { down = true; c.setPointerCapture(e.pointerId); last = at(e); g.beginPath(); g.moveTo(...last); g.lineTo(last[0] + .1, last[1]); g.stroke(); };
                c.onpointermove = (e) => { if (!down) return; const p = at(e); g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last = p; };
                c.onpointerup = c.onpointercancel = () => { if (!down) return; down = false; if (clearedFraction(g.getImageData(0, 0, w, h).data) > 0.5) c.remove(); };
            });
        }

        function go() {
            const names = parseNames($('#names').value), n = Math.max(1, parseInt($('#n').value, 10) || 1);
            store.set('lottery_names', $('#names').value);
            if (!names.length) { $('#info').textContent = '請先輸入名單'; return; }
            const winners = pick(names, n, $('#excl').checked ? flat() : []);
            if (!winners.length) { $('#info').textContent = '名單裡的人都中過獎了，請按「重置中獎紀錄」'; return; }
            won.push(winners); won = cleanWon(won); store.set('lottery_won', won);
            $('#out').replaceChildren(...winners.map(w => prizeCard(w, $('#mode').value === 'scratch')));
            renderLog();
            if (winners.length < n) $('#info').textContent += `（名單不夠，只抽出 ${winners.length} 位）`;
        }

        function groupUp() {
            const names = parseNames($('#names').value), num = Math.floor(+$('#gnum').value), out = $('#gout');
            store.set('lottery_names', $('#names').value);
            if (!names.length) { out.textContent = '請先輸入名單'; return; }
            if (!(num >= 1)) { out.textContent = '數量請輸入 1 以上的整數'; return; }
            const n = $('#gmode').value === 'groups' ? Math.min(num, names.length) : Math.ceil(names.length / num);
            out.replaceChildren(...split(names, n).map((g, i) => {
                const d = document.createElement('div'); d.className = 'li';
                d.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `第 ${i + 1} 組（${g.length} 人）` }), Object.assign(document.createElement('b'), { textContent: g.join('、') }));
                return d;
            }));
        }

        $('#go').onclick = go;
        $('#gsplit').onclick = groupUp;
        $('#resetPool').onclick = () => { if (won.length && !confirm('清除所有中獎紀錄？無法復原。')) return; won = []; store.set('lottery_won', won); $('#out').replaceChildren(); renderLog(); };
        $('#names').oninput = () => { store.set('lottery_names', $('#names').value); renderLog(); };
        $('#excl').onchange = renderLog;
        renderLog();
    </script>
</body>

</html>
