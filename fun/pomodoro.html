<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="番茄鐘：專注、休息、長休息自動輪替，記錄今天完成幾顆番茄，並統計近 7 / 30 天的專注時間。">
    <meta property="og:title" content="番茄鐘" />
    <meta property="og:description" content="專注、休息自動輪替，記錄今天完成幾顆番茄，並統計近 7 / 30 天的專注時間。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/pomodoro.html" />
    <meta name="st-keys" content="pomo_hist,pomo_stats,cfg-work,cfg-short,cfg-long,pomo_tasks,pomo_cur,todo_items">
    <title>番茄鐘</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --mode: #ff453a;
        }

        .ring {
            position: relative;
            width: min(100%, 300px);
            margin: 8px auto 16px;
        }

        svg {
            display: block;
            width: 100%;
            transform: rotate(-90deg);
        }

        circle {
            fill: none;
            stroke-width: 10;
        }

        .track {
            stroke: var(--fill);
        }

        #bar {
            stroke: var(--mode);
            stroke-linecap: round;
            transition: stroke-dashoffset .25s linear;
        }

        .center {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center;
        }

        #time {
            font-size: 56px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
        }

        #label {
            color: var(--muted);
        }

        .btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stats {
            text-align: center;
            color: var(--muted);
            margin-top: 14px;
        }

        .stats b {
            color: var(--text);
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .settings label {
            font-size: 13px;
            color: var(--muted);
            display: block;
        }

        input,
        #task {
            width: 100%;
        }

        .trow {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--fill);
            font-size: 14px;
        }

        .trow span:first-child {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 120px;
            margin: 6px 0 22px;
        }

        .chart div {
            flex: 1;
            background: var(--mode);
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            position: relative;
        }

        .chart div.zero {
            background: var(--fill);
        }

        .chart small {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>番茄鐘</h1>
        <p class="sub">專注一段，休息一下。</p>

        <div class="card">
            <div class="ring">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="track" cx="60" cy="60" r="54" />
                    <circle id="bar" cx="60" cy="60" r="54" />
                </svg>
                <div class="center">
                    <div id="time" role="timer">25:00</div>
                    <div id="label">專注</div>
                </div>
            </div>
            <div style="margin-bottom:12px">
                <label for="task" class="muted" style="font-size:13px">正在做的待辦（完成的番茄會記在它身上）</label>
                <select id="task"></select>
            </div>
            <div class="btns">
                <button class="primary" id="toggle">開始</button>
                <button id="skip">跳過</button>
                <button id="reset">重置</button>
            </div>
            <div class="stats">今天完成 <b id="count">0</b> 顆 ・ 專注 <b id="mins">0</b> 分鐘</div>
        </div>

        <div class="card">
            <h2>專注紀錄</h2>
            <div class="tabs"><button class="sm" data-n="7" aria-pressed="true">近 7 天</button><button class="sm" data-n="30" aria-pressed="false">近 30 天</button></div>
            <div class="chart" id="chart" aria-label="每日專注分鐘"></div>
            <div id="histStats"></div>
            <div class="row" style="margin-top:10px"><button class="sm" id="clearHist">清除專注紀錄</button></div>
            <h2 style="margin-top:16px">待辦的番茄統計</h2>
            <div id="taskStats"></div>
            <div class="row" style="margin-top:10px"><button class="sm" id="clearTasks">清除待辦番茄統計</button></div>
        </div>

        <div class="card">
            <div class="settings">
                <div><label for="cfg-work">專注（分）</label><input id="cfg-work" type="number" min="1" max="180" value="25"></div>
                <div><label for="cfg-short">休息（分）</label><input id="cfg-short" type="number" min="1" max="60" value="5"></div>
                <div><label for="cfg-long">長休息（分）</label><input id="cfg-long" type="number" min="1" max="120" value="15"></div>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>番茄鐘：專注一段、休息一段，每完成 4 顆番茄就來一次長休息，並記錄每日專注時間。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>讀書、寫程式、處理公事時避免分心。</li>
        <li>想知道這週實際專注了多久。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>要記到某個待辦：先在「待辦清單」新增項目，回來在「正在做的待辦」選它；每完成一顆專注，番茄與分鐘就累計到該項目，待辦清單每項會顯示 🍅 數，也可依累計排序。</li>
        <li>下方可調整「專注」「休息」「長休息」分鐘數。</li>
        <li>按「開始」，倒數結束會響聲並自動切到休息。</li>
        <li>「暫停／繼續」可中斷，「跳過」直接換下一段，「重置」回到這段起點。</li>
        <li>「專注紀錄」可看近 7 天或 30 天的圖表與連續天數。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">預設 25／5／15：連續完成 4 顆專注（共 100 分鐘）後，第 4 次休息會自動變成 15 分鐘長休息。</div>
        <h3>小提醒</h3>
        <ul>
        <li>以結束時間計算，分頁在背景也不會變慢；但<b>頁面需保持開啟</b>，手機鎖屏或關閉分頁可能中斷、也聽不到提示音。</li>
        <li>只有「專注」完整結束才會計入紀錄，跳過不算。紀錄只保留最近 400 天；「清除專注紀錄」會清空全部統計，無法復原。</li>
        <li>紀錄只存在這個瀏覽器，保留約 400 天。</li>
        <li>待辦統計最多 500 個項目（滿了就不再為新項目累計，不會刪舊的）；待辦被刪除後，這裡的統計會在下次開啟本頁時自動清掉。「清除待辦番茄統計」只清各待辦的累計，不影響上面的每日紀錄與待辦本身，無法復原。</li>
        <li>統計寫在這一頁自己的資料裡，待辦清單只讀取、不修改。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // hist：{ 'YYYY-MM-DD': { count, minutes } }。回傳截至 today 的最近 n 天（舊 → 新），沒紀錄的日子補 0
        function lastDays(hist, n, today, shift) {
            return Array.from({ length: n }, (_, i) => {
                const d = shift(today, i - (n - 1)), h = hist[d];
                return { d, count: h ? h.count : 0, minutes: h ? h.minutes : 0 };
            });
        }

        // 連續有專注紀錄的天數：今天還沒專注就從昨天往回算（今天還有機會）
        function streak(hist, today, shift) {
            let d = hist[today] && hist[today].count > 0 ? today : shift(today, -1), n = 0;
            while (hist[d] && hist[d].count > 0) { n++; d = shift(d, -1); }
            return n;
        }

        // 只留最近 keep 天，避免 localStorage 無限成長
        function trim(hist, keep, today, between) {
            return Object.fromEntries(Object.entries(hist).filter(([d]) => between(d, today) < keep));
        }

        // 驗證從 localStorage 讀回來的資料（可能被改壞）
        function cleanHist(h) {
            if (!h || typeof h !== 'object' || Array.isArray(h)) return {};
            return Object.fromEntries(Object.entries(h).filter(([d, v]) => /^\d{4}-\d{2}-\d{2}$/.test(d) && v && Number.isFinite(v.count) && Number.isFinite(v.minutes) && v.count >= 0 && v.minutes >= 0));
        }

        // 待辦番茄統計：{ 待辦id: { count, minutes } }；舊資料沒有這個鍵就是空物件，壞資料項目丟掉
        const MAX_TASKS = 500, CAP = 1e6;
        function cleanTasks(raw) {
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
            const out = [];
            for (const [k, v] of Object.entries(raw)) {
                if (out.length >= MAX_TASKS) break;
                if (!k || k.length > 64 || !v || typeof v !== 'object') continue;
                const c = Number(v.count), m = Number(v.minutes);
                if (!Number.isFinite(c) || !Number.isFinite(m) || c < 0 || m < 0) continue;
                out.push([k, { count: Math.min(Math.floor(c), CAP), minutes: Math.min(Math.floor(m), CAP) }]);
            }
            return Object.fromEntries(out);
        }
        // 待辦清單（todo_items）的有效項目
        const todoList = (raw) => (Array.isArray(raw) ? raw : []).filter(i => i && typeof i.id === 'string' && i.id && typeof i.t === 'string' && i.t && typeof i.done === 'boolean');
        // 只留還存在於待辦清單的項目（待辦被刪掉後，孤兒統計在這裡清掉）
        const pruneTasks = (tasks, todos) => Object.fromEntries(Object.entries(tasks).filter(([id]) => todos.some(t => t.id === id)));
        // 記一顆番茄；新項目超過上限就原樣回傳（拒絕新增）
        function addPomo(tasks, id, mins) {
            const t = tasks[id];
            if (!t && Object.keys(tasks).length >= MAX_TASKS) return tasks;
            return { ...tasks, [id]: { count: Math.min((t ? t.count : 0) + 1, CAP), minutes: Math.min((t ? t.minutes : 0) + mins, CAP) } };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const MODES = {
            work: { label: '專注', color: '#ff453a', cfg: 'cfg-work', def: 25 },
            short: { label: '休息', color: '#30d158', cfg: 'cfg-short', def: 5 },
            long: { label: '長休息', color: '#0a84ff', cfg: 'cfg-long', def: 15 },
        };
        const CIRC = 2 * Math.PI * 54, CYCLE = 4; // 每 4 顆番茄一次長休息
        const bar = $('#bar');
        bar.style.strokeDasharray = CIRC;

        let mode = 'work', round = 0, running = false, endAt = 0, left = 0, timer = null;

        const { store } = Util;
        const today = Util.day.today;
        // 歷史紀錄：舊版只存「今天」的 pomo_stats，第一次載入時併入歷史
        let hist = trim(cleanHist(store.get('pomo_hist', {})), 400, today(), Util.day.between);
        const old = store.get('pomo_stats', null);
        if (old && /^\d{4}-\d{2}-\d{2}$/.test(old.date) && !hist[old.date] && old.count > 0) hist[old.date] = { count: old.count, minutes: old.minutes };
        const stats = () => hist[today()] || { count: 0, minutes: 0 };
        let histDays = 7;

        // 待辦番茄統計：寫在自己的鍵 pomo_tasks（待辦頁只讀）；載入時以待辦 id 清單修剪孤兒
        const readTodos = () => { const raw = store.get('todo_items', []); return { ok: Array.isArray(raw), list: todoList(raw) }; };
        let tasks = cleanTasks(store.get('pomo_tasks', {}));
        { const t = readTodos(); if (t.ok) { const p = pruneTasks(tasks, t.list); if (Object.keys(p).length !== Object.keys(tasks).length) { tasks = p; store.set('pomo_tasks', tasks); } } }
        let cur = store.get('pomo_cur', '');
        function renderTasks() {
            const todos = readTodos().list, open = todos.filter(t => !t.done);
            if (!open.some(t => t.id === cur)) cur = '';
            const sel = $('#task');
            sel.replaceChildren(new Option(open.length ? '（不指定）' : '（待辦清單沒有未完成項目）', ''), ...open.map(t => new Option(t.t + (tasks[t.id] ? `　🍅${tasks[t.id].count}` : ''), t.id)));
            sel.value = cur;
            const rows = todos.filter(t => tasks[t.id]).sort((a, b) => tasks[b.id].minutes - tasks[a.id].minutes).slice(0, 20);
            $('#taskStats').replaceChildren(...(rows.length ? rows.map(t => { const r = document.createElement('div'); r.className = 'trow'; r.append(Object.assign(document.createElement('span'), { textContent: t.t }), Object.assign(document.createElement('span'), { textContent: `🍅 ${tasks[t.id].count} ・ ${tasks[t.id].minutes} 分鐘` })); return r; }) : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '還沒有統計：在上方選一個待辦再開始專注。' })]));
        }

        const minutes = (m) => {
            const v = parseInt($('#' + MODES[m].cfg).value, 10);
            return v > 0 ? v : MODES[m].def;
        };

        function render() {
            const total = minutes(mode) * 60, sec = Math.max(0, left);
            const shown = Math.ceil(sec);
            const text = String(Math.floor(shown / 60)).padStart(2, '0') + ':' + String(shown % 60).padStart(2, '0');
            $('#time').textContent = text;
            $('#label').textContent = MODES[mode].label;
            $('#toggle').textContent = running ? '暫停' : (left < total ? '繼續' : '開始');
            bar.style.strokeDashoffset = CIRC * (1 - sec / total);
            document.documentElement.style.setProperty('--mode', MODES[mode].color);
            document.title = running ? `${text} ${MODES[mode].label}` : '番茄鐘';
            $('#count').textContent = stats().count;
            $('#mins').textContent = stats().minutes;
        }

        function renderHist() {
            const days = lastDays(hist, histDays, today(), Util.day.shift), max = Math.max(1, ...days.map(x => x.minutes));
            $('#chart').replaceChildren(...days.map((x, i) => {
                const b = document.createElement('div');
                b.style.height = (x.minutes / max * 100) + '%'; b.className = x.minutes ? '' : 'zero';
                b.title = `${x.d}：${x.count} 顆、${x.minutes} 分鐘`;
                if (histDays <= 7 || i % 5 === 0 || i === days.length - 1) { const l = document.createElement('small'); l.textContent = x.d.slice(5); b.append(l); }
                return b;
            }));
            const tot = days.reduce((a, x) => ({ c: a.c + x.count, m: a.m + x.minutes, act: a.act + (x.count > 0 ? 1 : 0) }), { c: 0, m: 0, act: 0 });
            $('#histStats').replaceChildren(Util.statRow('合計', `${tot.c} 顆・${tot.m} 分鐘`), Util.statRow('有專注的日子平均', tot.act ? `${Math.round(tot.m / tot.act)} 分鐘` : '—'), Util.statRow('連續天數', `${streak(hist, today(), Util.day.shift)} 天`));
        }

        function setMode(m) {
            mode = m;
            left = minutes(m) * 60;
            running = false;
            clearInterval(timer);
            render();
            renderHist();
            renderTasks();                 // 每秒更新的 render 不重畫圖表，只在換模式時更新
        }

        function finish() {
            Util.beep();
            if (mode === 'work') {
                const t = stats();
                hist[today()] = { count: t.count + 1, minutes: t.minutes + minutes('work') };
                hist = trim(hist, 400, today(), Util.day.between);
                store.set('pomo_hist', hist);
                if (cur && readTodos().list.some(t => t.id === cur)) { tasks = addPomo(tasks, cur, minutes('work')); store.set('pomo_tasks', tasks); }
                round++;
                setMode(round % CYCLE === 0 ? 'long' : 'short');
            } else {
                setMode('work');
            }
        }

        // 以結束時間戳計算剩餘秒數：背景分頁 setInterval 會被降頻，不能用「每秒減一」
        function tick() {
            left = (endAt - Date.now()) / 1000;
            if (left <= 0) finish(); else render();
        }

        function toggle() {
            if (running) {
                running = false;
                clearInterval(timer);
            } else {
                running = true;
                endAt = Date.now() + left * 1000;
                timer = setInterval(tick, 250);
            }
            render();
        }

        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { histDays = +b.dataset.n; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderHist(); }; });
        $('#toggle').onclick = toggle;
        $('#task').onchange = () => { cur = $('#task').value; store.set('pomo_cur', cur); };
        $('#clearTasks').onclick = () => { if (!confirm('清除所有待辦的番茄統計？每日紀錄與待辦清單不受影響，無法復原。')) return; tasks = {}; store.set('pomo_tasks', tasks); renderTasks(); };
        // 一併移除舊版的 pomo_stats，否則下次載入會被併回歷史
        $('#clearHist').onclick = () => { if (!confirm('清除所有專注紀錄（圖表、連續天數、今日顆數）？無法復原。')) return; hist = {}; store.set('pomo_hist', hist); try { localStorage.removeItem('pomo_stats'); } catch (e) { } render(); renderHist(); };
        $('#skip').onclick = () => setMode(mode === 'work' ? 'short' : 'work');
        $('#reset').onclick = () => setMode(mode);
        for (const [key, m] of Object.entries(MODES)) {
            const el = $('#' + m.cfg);
            el.value = store.get(m.cfg, m.def);
            el.onchange = () => {
                store.set(m.cfg, minutes(key));
                if (!running) setMode(mode);
            };
        }
        setMode('work');
    </script>
</body>

</html>
