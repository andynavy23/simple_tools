<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="番茄鐘：專注、休息、長休息自動輪替，記錄今天完成幾顆番茄。">
    <meta property="og:title" content="番茄鐘" />
    <meta property="og:description" content="專注、休息自動輪替，記錄今天完成幾顆番茄。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/pomodoro.html" />
    <title>番茄鐘</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #fff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --fill: rgba(118, 118, 128, .12);
            --blue: #0071e3;
            --mode: #ff453a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --muted: #98989d;
                --fill: rgba(118, 118, 128, .24);
                --blue: #2997ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 20px;
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 0 48px;
        }

        a.back {
            color: var(--blue);
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            font-size: 32px;
            margin: 12px 0 4px;
            letter-spacing: -.02em;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .ring {
            position: relative;
            width: min(100%, 300px);
            margin: 8px auto 16px;
        }

        svg {
            display: block;
            width: 100%;
            transform: rotate(-90deg);
        }

        circle {
            fill: none;
            stroke-width: 10;
        }

        .track {
            stroke: var(--fill);
        }

        #bar {
            stroke: var(--mode);
            stroke-linecap: round;
            transition: stroke-dashoffset .25s linear;
        }

        .center {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center;
        }

        #time {
            font-size: 56px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
        }

        #label {
            color: var(--muted);
        }

        .btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font: inherit;
            font-size: 16px;
            border: 0;
            border-radius: 980px;
            padding: 9px 22px;
            background: var(--fill);
            color: var(--text);
            cursor: pointer;
        }

        button.primary {
            background: var(--blue);
            color: #fff;
        }

        .stats {
            text-align: center;
            color: var(--muted);
            margin-top: 14px;
        }

        .stats b {
            color: var(--text);
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .settings label {
            font-size: 13px;
            color: var(--muted);
            display: block;
        }

        input {
            width: 100%;
            font: inherit;
            color: var(--text);
            background: var(--fill);
            border: 0;
            border-radius: 10px;
            padding: 8px 10px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>番茄鐘</h1>
        <p class="sub">專注一段，休息一下。</p>

        <div class="card">
            <div class="ring">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="track" cx="60" cy="60" r="54" />
                    <circle id="bar" cx="60" cy="60" r="54" />
                </svg>
                <div class="center">
                    <div id="time" role="timer">25:00</div>
                    <div id="label">專注</div>
                </div>
            </div>
            <div class="btns">
                <button class="primary" id="toggle">開始</button>
                <button id="skip">跳過</button>
                <button id="reset">重置</button>
            </div>
            <div class="stats">今天完成 <b id="count">0</b> 顆 ・ 專注 <b id="mins">0</b> 分鐘</div>
        </div>

        <div class="card">
            <div class="settings">
                <div><label for="cfg-work">專注（分）</label><input id="cfg-work" type="number" min="1" max="180" value="25"></div>
                <div><label for="cfg-short">休息（分）</label><input id="cfg-short" type="number" min="1" max="60" value="5"></div>
                <div><label for="cfg-long">長休息（分）</label><input id="cfg-long" type="number" min="1" max="120" value="15"></div>
            </div>
        </div>
    </div>

    <script>
        const $ = (s) => document.querySelector(s);
        const MODES = {
            work: { label: '專注', color: '#ff453a', cfg: 'cfg-work', def: 25 },
            short: { label: '休息', color: '#30d158', cfg: 'cfg-short', def: 5 },
            long: { label: '長休息', color: '#0a84ff', cfg: 'cfg-long', def: 15 },
        };
        const CIRC = 2 * Math.PI * 54, CYCLE = 4; // 每 4 顆番茄一次長休息
        const bar = $('#bar');
        bar.style.strokeDasharray = CIRC;

        let mode = 'work', round = 0, running = false, endAt = 0, left = 0, timer = null;

        const store = {
            get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
        };
        const today = () => new Date().toLocaleDateString('sv');
        let stats = store.get('pomo_stats', {});
        if (stats.date !== today()) stats = { date: today(), count: 0, minutes: 0 };

        const minutes = (m) => {
            const v = parseInt($('#' + MODES[m].cfg).value, 10);
            return v > 0 ? v : MODES[m].def;
        };

        function render() {
            const total = minutes(mode) * 60, sec = Math.max(0, left);
            const shown = Math.ceil(sec);
            const text = String(Math.floor(shown / 60)).padStart(2, '0') + ':' + String(shown % 60).padStart(2, '0');
            $('#time').textContent = text;
            $('#label').textContent = MODES[mode].label;
            $('#toggle').textContent = running ? '暫停' : (left < total ? '繼續' : '開始');
            bar.style.strokeDashoffset = CIRC * (1 - sec / total);
            document.documentElement.style.setProperty('--mode', MODES[mode].color);
            document.title = running ? `${text} ${MODES[mode].label}` : '番茄鐘';
            $('#count').textContent = stats.count;
            $('#mins').textContent = stats.minutes;
        }

        function setMode(m) {
            mode = m;
            left = minutes(m) * 60;
            running = false;
            clearInterval(timer);
            render();
        }

        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.25, 0.5].forEach(t => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.connect(g); g.connect(ctx.destination);
                    o.frequency.value = 880;
                    g.gain.setValueAtTime(0.15, ctx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
                    o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
                });
            } catch (e) { }
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        function finish() {
            beep();
            if (mode === 'work') {
                if (stats.date !== today()) stats = { date: today(), count: 0, minutes: 0 };
                stats.count++;
                stats.minutes += minutes('work');
                store.set('pomo_stats', stats);
                round++;
                setMode(round % CYCLE === 0 ? 'long' : 'short');
            } else {
                setMode('work');
            }
        }

        // 以結束時間戳計算剩餘秒數：背景分頁 setInterval 會被降頻，不能用「每秒減一」
        function tick() {
            left = (endAt - Date.now()) / 1000;
            if (left <= 0) finish(); else render();
        }

        function toggle() {
            if (running) {
                running = false;
                clearInterval(timer);
            } else {
                running = true;
                endAt = Date.now() + left * 1000;
                timer = setInterval(tick, 250);
            }
            render();
        }

        $('#toggle').onclick = toggle;
        $('#skip').onclick = () => setMode(mode === 'work' ? 'short' : 'work');
        $('#reset').onclick = () => setMode(mode);
        for (const [key, m] of Object.entries(MODES)) {
            const el = $('#' + m.cfg);
            el.value = store.get(m.cfg, m.def);
            el.onchange = () => {
                store.set(m.cfg, minutes(key));
                if (!running) setMode(mode);
            };
        }
        setMode('work');
    </script>
</body>

</html>
