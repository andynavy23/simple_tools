<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="隨機分組 / 抽籤：貼上名單，一鍵分成 N 組、每組 M 人，或抽出 K 人。">
    <meta property="og:title" content="隨機分組 / 抽籤" />
    <meta property="og:description" content="貼上名單，一鍵隨機分組或抽籤。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/random-groups.html" />
    <title>隨機分組 / 抽籤</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        :root {
            --wrap-w: 640px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 12px;
        }

        input[type=number] {
            width: 80px;
        }

        #out {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .group {
            background: var(--fill);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .group h3 {
            margin: 0 0 6px;
            font-size: 14px;
            color: var(--muted);
        }

        .group ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .group li {
            padding: 2px 0;
        }

        .winner {
            font-size: 20px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>隨機分組 / 抽籤</h1>
        <p class="sub">聚餐、輪值、報告順序，交給運氣。</p>

        <div class="card">
            <label for="names">名單（一行一個，或用逗號分隔）</label>
            <textarea id="names" placeholder="小明&#10;小華&#10;小美"></textarea>
            <div class="controls">
                <select id="mode" aria-label="模式">
                    <option value="groups">分成 N 組</option>
                    <option value="size">每組 M 人</option>
                    <option value="pick">抽出 K 人</option>
                </select>
                <input id="num" type="number" min="1" value="2" aria-label="數量">
                <button class="primary" id="go">開始</button>
            </div>
            <p class="note" id="count"></p>
        </div>

        <div class="card" id="result" hidden>
            <div id="out" aria-live="polite"></div>
        </div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        const { shuffle, store } = Util;

        // --- pure ---
        function parseNames(text) {
            return text.split(/[\n,，、]/).map(s => s.trim()).filter(Boolean);
        }

        // 洗牌後輪流發牌：各組人數最多差 1
        function split(names, n) {
            const groups = Array.from({ length: n }, () => []);
            shuffle(names).forEach((name, i) => groups[i % n].push(name));
            return groups;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'groups_names';
        $('#names').value = store.get(KEY, '');

        function updateCount() {
            const n = parseNames($('#names').value).length;
            $('#count').textContent = n ? `目前 ${n} 人` : '';
            store.set(KEY, $('#names').value);
        }

        function run() {
            const names = parseNames($('#names').value);
            const mode = $('#mode').value;
            const num = Math.floor(+$('#num').value);
            const out = $('#out');
            $('#result').hidden = false;
            out.replaceChildren();
            if (!names.length) { out.textContent = '請先輸入名單'; return; }
            if (!(num >= 1)) { out.textContent = '數量請輸入 1 以上的整數'; return; }

            const box = (title, items, cls) => {
                const g = document.createElement('div');
                g.className = 'group';
                const h = document.createElement('h3');
                h.textContent = title;
                const ul = document.createElement('ul');
                items.forEach(t => {
                    const li = document.createElement('li');
                    li.textContent = t;
                    if (cls) li.className = cls;
                    ul.append(li);
                });
                g.append(h, ul);
                out.append(g);
            };

            if (mode === 'pick') {
                const k = Math.min(num, names.length);
                box(`抽中 ${k} 人`, shuffle(names).slice(0, k), 'winner');
            } else {
                const n = mode === 'groups' ? Math.min(num, names.length) : Math.ceil(names.length / num);
                split(names, n).forEach((g, i) => box(`第 ${i + 1} 組（${g.length} 人）`, g));
            }
        }

        $('#names').oninput = updateCount;
        $('#go').onclick = run;
        updateCount();
    </script>
</body>

</html>
