<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="st-disclaimer" content="pet">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="寵物記錄：多隻寵物的餵食、體重、疫苗、驅蟲、看診與美容紀錄，疫苗驅蟲可設週期自動算下次到期，附體重趨勢圖與年齡換算，可匯出 CSV。資料只存在本機。">
    <meta property="og:title" content="寵物記錄" />
    <meta property="og:description" content="疫苗驅蟲到期提醒、體重曲線、年齡換算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/pet-log.html" />
    <meta name="st-keys" content="pet_log">
    <title>寵物記錄</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 640px;
        }

        [hidden] {
            display: none !important;
        }

        .full {
            grid-column: 1 / -1;
        }

        .fgrid select,
        .fgrid input {
            width: 100%;
        }

        .btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .msg {
            font-size: 13px;
            color: var(--muted);
            margin: 8px 0 0;
            min-height: 1.2em;
            overflow-wrap: anywhere;
        }

        .msg.bad {
            color: var(--bad);
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .due {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
            word-break: break-all;
        }

        .due:last-child {
            border-bottom: 0;
        }

        .badge {
            font-size: 12px;
            font-weight: 700;
            border-radius: 99px;
            padding: 2px 10px;
            white-space: nowrap;
            align-self: flex-start;
            background: var(--fill);
        }

        .badge.over {
            background: var(--bad);
            color: #fff;
        }

        .badge.soon {
            background: var(--blue);
            color: var(--on-blue);
        }

        .ev h3 {
            font-size: 16px;
            margin: 0 0 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ev .meta {
            color: var(--muted);
            font-size: 14px;
            word-break: break-all;
        }

        .chip {
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
            background: var(--fill);
            border-radius: 99px;
            padding: 2px 10px;
        }

        canvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        #poster {
            height: auto;
            aspect-ratio: 3 / 4;
            margin-top: 12px;
            border: 1px solid var(--line);
        }

        @media print {

            body.pp .back,
            body.pp .wrap>:not(#main),
            body.pp #main>:not(#posterCard),
            body.pp #posterCard>:not(#poster) {
                display: none !important;
            }

            body.pp #poster {
                border: 0;
                margin: 0 auto;
                max-height: 100vh;
                width: auto;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>寵物記錄</h1>
        <p class="sub">餵食、體重、疫苗、驅蟲、看診都記下來，到期自動提醒。非獸醫建議。</p>

        <div class="card">
            <div class="chips" id="pets"></div>
            <div class="btns"><button id="addPetBtn">＋ 新增寵物</button></div>
        </div>

        <div class="card" id="petForm" hidden>
            <h2 id="petFormTitle">新增寵物</h2>
            <div class="fgrid">
                <div><label for="p_name">名字</label><input id="p_name" type="text" maxlength="20"></div>
                <div><label for="p_sp">種類</label><select id="p_sp"></select></div>
                <div><label for="p_size">體型（狗用於年齡換算）</label><select id="p_size"></select></div>
                <div><label for="p_birth">生日（可留白）</label><input id="p_birth" type="date"></div>
                <div class="full"><label for="p_note">備註</label><input id="p_note" type="text" maxlength="200" placeholder="品種、晶片號碼、過敏…（可留白）"></div>
            </div>
            <div class="btns"><button class="primary" id="savePet">新增</button><button id="cancelPet">取消</button></div>
            <p class="msg" id="petMsg"></p>
        </div>

        <div id="main" hidden>
            <div class="card" id="petInfo"></div>

            <div class="card" id="dueCard" hidden>
                <h2>到期提醒</h2>
                <div id="dues"></div>
            </div>

            <div class="card">
                <h2 id="formTitle">新增記錄</h2>
                <div class="fgrid">
                    <div><label for="e_date">日期</label><input id="e_date" type="date"></div>
                    <div><label for="e_type">類型</label><select id="e_type"></select></div>
                    <div class="full"><label for="e_name">項目（可留白）</label><input id="e_name" type="text" maxlength="30" placeholder="例如：狂犬病疫苗、體內驅蟲、某某動物醫院"></div>
                    <div><label for="e_val" id="e_valL">數值</label><input id="e_val" type="number" min="0" step="any" inputmode="decimal"></div>
                    <div id="cycWrap"><label for="e_cyc">下次間隔（0 = 不提醒）</label>
                        <div style="display:flex;gap:6px"><input id="e_cyc" type="number" min="0" max="3650" step="1" value="0" inputmode="numeric"><select id="e_cu" style="width:auto"><option value="m">個月</option><option value="d">天</option></select></div>
                    </div>
                    <div class="full"><label for="e_note">備註</label><input id="e_note" type="text" maxlength="200"></div>
                </div>
                <p class="msg" id="duePrev"></p>
                <div class="btns"><button class="primary" id="saveEv">新增</button><button id="cancelEv" hidden>取消編輯</button></div>
                <p class="msg" id="evMsg"></p>
            </div>

            <div class="card" id="wCard" hidden>
                <h2>體重趨勢</h2>
                <canvas id="cv" role="img" aria-label="體重趨勢圖"></canvas>
                <p class="msg" id="wMsg"></p>
            </div>

            <div class="card" id="litCard" hidden>
                <h2>貓砂用量與更換提醒</h2>
                <div class="fgrid">
                    <div><label for="l_cats">貓數</label><input id="l_cats" type="number" min="1" max="20" step="1" inputmode="numeric"></div>
                    <div><label for="l_kind">砂種</label><select id="l_kind"></select></div>
                    <div><label for="l_bag">一包砂重（公斤）</label><input id="l_bag" type="number" min="0.5" max="100" step="any" inputmode="decimal"></div>
                    <div><label for="l_box">貓砂盆一盆砂量（公斤）</label><input id="l_box" type="number" min="0.5" max="30" step="any" inputmode="decimal"></div>
                    <div><label for="l_g">每隻每天耗砂（克，可調）</label><input id="l_g" type="number" min="10" max="1000" step="any" inputmode="numeric"></div>
                    <div><label for="l_cycle">整盆換砂週期（天）</label><input id="l_cycle" type="number" min="1" max="365" step="1" inputmode="numeric"></div>
                    <div><label for="l_buy">這包砂開始用的日期</label><input id="l_buy" type="date"></div>
                    <div><label for="l_chg">上次整盆換砂日期</label><input id="l_chg" type="date"></div>
                </div>
                <div class="btns"><button class="primary" id="litSave">儲存並計算</button><button id="litBuyToday">這包今天開始用</button><button id="litChgToday">今天整盆換砂</button><button id="litClear" style="color:var(--bad)">清除貓砂設定</button></div>
                <div id="litOut"></div>
                <p class="msg" id="litMsg"></p>
            </div>

            <div class="card" id="posterCard">
                <h2>走失協尋海報</h2>
                <p class="msg" style="margin:0 0 8px">照片只在這個瀏覽器處理，不會上傳；海報資料不會儲存，重新整理就沒了。</p>
                <div class="fgrid">
                    <div class="full"><label for="x_photo">照片</label><input id="x_photo" type="file" accept="image/*"></div>
                    <div><label for="x_name">名字</label><input id="x_name" type="text" maxlength="20"></div>
                    <div><label for="x_date">走失日期</label><input id="x_date" type="date"></div>
                    <div class="full"><label for="x_feat">特徵（毛色、體型、項圈、晶片…）</label><input id="x_feat" type="text" maxlength="60"></div>
                    <div class="full"><label for="x_place">走失地點</label><input id="x_place" type="text" maxlength="40"></div>
                    <div><label for="x_who">聯絡人</label><input id="x_who" type="text" maxlength="20"></div>
                    <div><label for="x_tel">聯絡電話</label><input id="x_tel" type="tel" maxlength="30"></div>
                    <div class="full"><label for="x_reward">酬謝或備註（可留白）</label><input id="x_reward" type="text" maxlength="40"></div>
                </div>
                <div class="btns"><button class="primary" id="xMake">產生海報</button><button id="xDl" disabled>下載 PNG</button><button id="xShare" hidden disabled>分享</button><button id="xPrint" disabled>列印</button></div>
                <p class="msg" id="xMsg"></p>
                <canvas id="poster" width="1080" height="1440" role="img" aria-label="協尋海報預覽" hidden></canvas>
            </div>

            <div class="card"><select id="typeFilter" aria-label="類型篩選"></select></div>
            <div id="events"></div>
        </div>

        <div class="card">
            <h2>資料管理</h2>
            <p class="msg" style="margin:0 0 8px">最多 20 隻寵物、3000 筆記錄。單筆刪除在每筆右下角、刪寵物在寵物資訊卡；這裡可匯出或全部清除。</p>
            <div class="btns" style="margin-top:0"><button id="csv">匯出 CSV（全部）</button><button id="clearAll" style="color:var(--bad)">清除全部</button></div>
            <p class="msg" id="dataMsg"></p>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>多隻寵物的健康與生活記錄本：餵食、體重、疫苗、驅蟲、看診、洗澡美容。疫苗 / 驅蟲 / 看診可設「下次間隔」，自動算到期日並提醒；體重畫成趨勢圖，並提供年齡換算。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想記住「疫苗打了沒、下次是哪天」「驅蟲多久一次」。</li>
        <li>看診或換飼料後想追蹤體重變化。</li>
        <li>去動物醫院前，匯出記錄給獸醫參考。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「＋ 新增寵物」填名字、種類、體型（狗）與生日。點上方名字切換寵物。</li>
        <li>填日期、類型、項目與數值（體重填公斤）；疫苗 / 驅蟲 / 看診可填「下次間隔」（如 12 個月、30 天），到期提醒會出現在上方。</li>
        <li>同一寵物、同一類型、同一「項目」只以最新一筆的到期日提醒，所以不同疫苗請填不同項目名稱。</li>
        <li>記錄可編輯 / 刪除；「匯出 CSV」可用試算表開啟。</li>
        <li><b>年度健檢 / 牙齒保健</b>：類型選「年度健檢」或「牙齒保健」，填這次日期，間隔預設 12 個月（可改），到期提醒會出現在上方。</li>
        <li><b>貓砂提醒</b>（貓咪才有）：填貓數、砂種、一包砂重、一盆砂量與整盆換砂週期，再填「這包開始用的日期」，就會估算每天用量、一包可用幾天與預計用完日；換砂日算下次整盆更換。每隻每天耗砂量只是起始估計，請依實際調整。</li>
        <li><b>走失協尋海報</b>：選照片、填名字與聯絡電話，按「產生海報」，可下載 PNG、分享或列印；照片只在你的瀏覽器處理、不會上傳。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">2026-03-01 疫苗「狂犬病」間隔 12 個月 → 到期日 2027-03-01
        2026-03-05 體重 4.2 公斤 → 出現在體重趨勢圖
        小型犬 3 歲 ≈ 人類 28 歲（約略換算）</div>
        <h3>小提醒</h3>
        <ul>
        <li>非獸醫建議：年齡換算只是約略參考（1 歲約 15、2 歲約 24，之後狗依體型每年加 4 / 5 / 6 歲，貓每年加 4 歲），疫苗驅蟲頻率請依獸醫指示。</li>
        <li>資料只存在這個瀏覽器，清除網站資料會消失；右上角「💾」可匯出備份。</li>
        <li>最多 20 隻寵物、3000 筆記錄，滿了要先刪除才能新增，不會默默刪舊的。</li>
        <li>貓砂設定存在每隻寵物底下（同一份備份），按「清除貓砂設定」只清這項；刪寵物時一併刪除。海報內容與照片不會儲存。年度健檢 / 牙齒保健頻率與用砂量只是參考，請依獸醫建議。</li>
        <li>刪除寵物會連同牠的所有記錄一起刪；「清除全部」會刪掉所有寵物與記錄；都會先詢問且無法復原。載入到壞掉的資料會自動略過或補預設值。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day, store, csvStringify } = Util;

        // --- pure ---
        const PL = { PETS: 20, EVENTS: 3000, NAME: 20, ITEM: 30, NOTE: 200, MAX_VAL: 1e7, MAX_CYC: 3650 };
        const SPECIES = ['狗', '貓', '其他'], SIZES = ['小型（約 10 公斤以下）', '中型（約 10–25 公斤）', '大型（約 25 公斤以上）'];
        const ETYPES = ['餵食', '體重', '疫苗', '驅蟲', '看診', '年度健檢', '牙齒保健', '洗澡美容', '其他'];
        const UNIT = { 餵食: '克', 體重: '公斤', 疫苗: '花費（元）', 驅蟲: '花費（元）', 看診: '花費（元）', 年度健檢: '花費（元）', 牙齒保健: '花費（元）', 洗澡美容: '花費（元）', 其他: '數值' };
        const CYC_TYPES = ['疫苗', '驅蟲', '看診', '年度健檢', '牙齒保健'];
        const DEFAULT_CYC = { 年度健檢: 12, 牙齒保健: 12 };      // 只是起始值，可自行改；實際頻率依獸醫建議
        // 貓砂：各砂種「每隻貓每天耗砂（克）」與「整盆換砂週期（天）」只是起始預設（粗略估算），使用者可自行調整
        const LITTER = { 礦砂: { g: 100, cycle: 21 }, 豆腐砂: { g: 120, cycle: 14 }, 松木砂: { g: 100, cycle: 14 }, 水晶砂: { g: 60, cycle: 30 } };
        const LIT_FIELDS = { cats: [1, 20], bag: [0.5, 100], box: [0.5, 30], cycle: [1, 365], g: [10, 1000] };
        const twToday = (ms = Date.now()) => new Date(ms + 8 * 36e5).toISOString().slice(0, 10);
        function validDate(s) {
            if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const p = day.parse(s);
            return p.y >= 1990 && p.y <= 2100 && p.m >= 1 && p.m <= 12 && p.d >= 1 && p.d <= day.daysInMonth(p.y, p.m);
        }
        const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const dueOf = (e) => e.cyc > 0 && CYC_TYPES.includes(e.type) ? (e.cu === 'd' ? day.shift(e.date, e.cyc) : day.addMonths(e.date, e.cyc)) : '';

        function normPet(r) {
            if (!r || typeof r !== 'object') return null;
            const name = str(r.name, PL.NAME);
            if (!name) return null;
            return { id: str(r.id, 40) || newId(), name, sp: SPECIES.includes(r.sp) ? r.sp : '其他', size: SIZES.includes(r.size) ? r.size : SIZES[0], birth: validDate(r.birth) ? r.birth : '', note: str(r.note, PL.NOTE), lit: normLit(r.lit) };
        }
        // 貓砂設定（舊資料沒有 lit → null）：欄位超出範圍回傳 null
        function normLit(r) {
            if (!r || typeof r !== 'object') return null;
            const o = { kind: Object.prototype.hasOwnProperty.call(LITTER, r.kind) ? r.kind : '礦砂', buy: validDate(r.buy) ? r.buy : '', chg: validDate(r.chg) ? r.chg : '' };
            for (const [k, [lo, hi]] of Object.entries(LIT_FIELDS)) { const v = Number(r[k]); if (!(Number.isFinite(v) && v >= lo && v <= hi)) return null; o[k] = k === 'cats' || k === 'cycle' ? Math.round(v) : Math.round(v * 100) / 100; }
            return o;
        }
        function normEvent(r) {
            if (!r || typeof r !== 'object' || !validDate(r.date) || !ETYPES.includes(r.type)) return null;
            const v = r.val === null || r.val === '' || r.val === undefined ? null : Number(r.val), c = Math.round(Number(r.cyc));
            const val = v !== null && Number.isFinite(v) && v >= 0 && v <= PL.MAX_VAL ? Math.round(v * 100) / 100 : null;
            if (r.type === '體重' && !(val >= 0.01 && val <= 200)) return null;
            return {
                id: str(r.id, 40) || newId(), pid: str(r.pid, 40), type: r.type, date: r.date, name: str(r.name, PL.ITEM), val,
                cyc: CYC_TYPES.includes(r.type) && c > 0 && c <= PL.MAX_CYC ? c : 0, cu: r.cu === 'd' ? 'd' : 'm', note: str(r.note, PL.NOTE),
            };
        }
        // 載入驗證：壞資料略過、超過上限截斷、重複 id 去除、沒有對應寵物的記錄丟掉
        function normData(raw) {
            raw = raw && typeof raw === 'object' ? raw : {};
            const seen = new Set(), pets = [];
            for (const r of Array.isArray(raw.pets) ? raw.pets : []) { const p = normPet(r); if (p && !seen.has(p.id)) { seen.add(p.id); pets.push(p); if (pets.length >= PL.PETS) break; } }
            const eids = new Set(), events = [];
            for (const r of Array.isArray(raw.events) ? raw.events : []) { const e = normEvent(r); if (e && seen.has(e.pid) && !eids.has(e.id)) { eids.add(e.id); events.push(e); if (events.length >= PL.EVENTS) break; } }
            return { pets, events };
        }
        function checkPet(r) {
            const s = (v) => String(v ?? '').trim();
            if (!s(r.name)) return '請填寵物名字';
            if (s(r.name).length > PL.NAME) return `名字最長 ${PL.NAME} 字`;
            if (s(r.note).length > PL.NOTE) return `備註最長 ${PL.NOTE} 字`;
            if (s(r.birth) !== '' && (!validDate(s(r.birth)) || s(r.birth) > twToday())) return '生日請選有效且不晚於今天的日期';
            return '';
        }
        function addPet(d, r) {
            const err = checkPet(r);
            if (err) return { d, err };
            if (d.pets.length >= PL.PETS) return { d, err: `最多 ${PL.PETS} 隻寵物，請先刪除不用的` };
            const p = normPet({ ...r, birth: String(r.birth || '').trim(), id: newId() });
            return { d: { ...d, pets: [...d.pets, p] }, err: '', id: p.id };
        }
        function updatePet(d, id, r) {
            const err = checkPet(r);
            if (err) return { d, err };
            if (!d.pets.some(p => p.id === id)) return { d, err: '找不到這隻寵物' };
            return { d: { ...d, pets: d.pets.map(p => p.id === id ? normPet({ ...r, birth: String(r.birth || '').trim(), id, lit: p.lit }) : p) }, err: '' };
        }
        // 刪寵物連帶刪其所有事件
        const removePet = (d, id) => ({ pets: d.pets.filter(p => p.id !== id), events: d.events.filter(e => e.pid !== id) });
        function checkEvent(r) {
            const s = (v) => String(v ?? '').trim();
            if (!ETYPES.includes(r.type)) return '請選類型';

        }
        $('#litSave').onclick = () => saveLit(readLit(), '已儲存（估算值僅供參考）');
        $('#litBuyToday').onclick = () => saveLit({ ...readLit(), buy: twToday() }, '已記下：這包今天開始用');
        $('#litChgToday').onclick = () => saveLit({ ...readLit(), chg: twToday() }, '已記下：今天整盆換砂');
        $('#litClear').onclick = () => {
            const p = data.pets.find(x => x.id === cur);
            if (!p || !p.lit) { say('#litMsg', '目前沒有貓砂設定'); return; }
            if (!confirm(`清除「${p.name}」的貓砂設定與提醒？無法復原。`)) return;
            data = clearLitter(data, cur); save(); render(); say('#litMsg', '已清除');
        };

        // ----- 走失協尋海報（照片只在本機處理，不儲存）-----
        const PX = { photo: null, pet: null };
        function wrapText(g, text, x, y, maxW, lh, maxLines) {
            let line = '', n = 0;
            for (const ch of text) {
                if (g.measureText(line + ch).width > maxW && line) { g.fillText(line, x, y); y += lh; line = ch; if (++n >= maxLines) return y; } else line += ch;
            }
            if (line) { g.fillText(line, x, y); y += lh; }
            return y;
        }
        function drawPoster(v, sp) {
            const cv = $('#poster'), g = cv.getContext('2d'), W = 1080, H = 1440, RED = '#c62828';
            g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
            g.fillStyle = RED; g.fillRect(0, 0, W, 190);
            g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.font = 'bold 120px sans-serif';
            g.fillText('協尋走失' + (sp === '貓' ? '貓咪' : sp === '狗' ? '狗狗' : '寵物'), W / 2, 140);
            const px = 60, py = 220, pw = W - 120, ph = 640;
            g.fillStyle = '#eee'; g.fillRect(px, py, pw, ph);
            if (PX.photo) {
                const iw = PX.photo.width, ih = PX.photo.height, k = Math.max(pw / iw, ph / ih), sw = pw / k, sh = ph / k;
                g.drawImage(PX.photo, (iw - sw) / 2, (ih - sh) / 2, sw, sh, px, py, pw, ph);
            } else { g.fillStyle = '#999'; g.font = '48px sans-serif'; g.fillText('（未選照片）', W / 2, py + ph / 2); }
            g.fillStyle = '#111'; g.textAlign = 'left'; g.font = 'bold 92px sans-serif';
            g.fillText(v.name, px, 960, pw);
            g.font = '48px sans-serif'; let y = 1030;
            const lines = [['特徵', v.feat], ['走失日期', v.date], ['走失地點', v.place], ['酬謝', v.reward]].filter(x => x[1]);
            for (const [k, t] of lines) { g.fillStyle = RED; g.fillText(k + '：', px, y); const w = g.measureText(k + '：').width; g.fillStyle = '#111'; y = wrapText(g, t, px + w, y, pw - w, 60, 2); y += 6; }
            g.fillStyle = RED; g.fillRect(0, H - 170, W, 170);
            g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = 'bold 56px sans-serif';
            g.fillText('請聯絡 ' + (v.who || ''), W / 2, H - 100, pw); g.font = 'bold 84px sans-serif'; g.fillText(v.tel, W / 2, H - 28, pw);
        }
        async function loadPhoto(file) {
            if (!file) { PX.photo = null; return ''; }
            if (!file.type.startsWith('image/')) return '請選圖片檔';
            if (file.size > 20 * 1024 * 1024) return '照片太大（上限 20 MB）';
            try { PX.photo = await createImageBitmap(file); return ''; } catch { PX.photo = null; return '這張照片無法讀取，請換一張'; }
        }
        $('#xMake').onclick = async () => {
            const r = checkPoster({ name: $('#x_name').value, feat: $('#x_feat').value, date: $('#x_date').value, place: $('#x_place').value, who: $('#x_who').value, tel: $('#x_tel').value, reward: $('#x_reward').value });
            if (r.err) { say('#xMsg', r.err, true); return; }
            const e = await loadPhoto($('#x_photo').files[0]); if (e) { say('#xMsg', e, true); return; }
            const p = data.pets.find(x => x.id === cur);
            $('#poster').hidden = false; drawPoster(r.v, p ? p.sp : '');
            $('#xDl').disabled = $('#xPrint').disabled = $('#xShare').disabled = false; say('#xMsg', '已產生，可下載、分享或列印');
        };
        const posterBlob = () => new Promise(res => $('#poster').toBlob(res, 'image/png'));
        $('#xDl').onclick = async () => Util.download(await posterBlob(), `協尋海報_${twToday()}.png`);
        $('#xPrint').onclick = () => { document.body.classList.add('pp'); addEventListener('afterprint', () => document.body.classList.remove('pp'), { once: true }); print(); };
        if (navigator.canShare) $('#xShare').hidden = false;
        $('#xShare').onclick = async () => {
            const f = new File([await posterBlob()], 'poster.png', { type: 'image/png' });
            try { if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: '協尋海報' }); else say('#xMsg', '這個瀏覽器不支援分享，請改用下載', true); } catch { /* 使用者取消 */ }
        };

        resetEv(); render();
    </script>
</body>
