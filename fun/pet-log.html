<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="寵物記錄：多隻寵物的餵食、體重、疫苗、驅蟲、看診與美容紀錄，疫苗驅蟲可設週期自動算下次到期，附體重趨勢圖與年齡換算，可匯出 CSV。資料只存在本機。">
    <meta property="og:title" content="寵物記錄" />
    <meta property="og:description" content="疫苗驅蟲到期提醒、體重曲線、年齡換算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/pet-log.html" />
    <meta name="st-keys" content="pet_log">
    <title>寵物記錄</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 640px;
        }

        [hidden] {
            display: none !important;
        }

        .full {
            grid-column: 1 / -1;
        }

        .fgrid select,
        .fgrid input {
            width: 100%;
        }

        .btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .msg {
            font-size: 13px;
            color: var(--muted);
            margin: 8px 0 0;
            min-height: 1.2em;
            overflow-wrap: anywhere;
        }

        .msg.bad {
            color: var(--bad);
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .due {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
            word-break: break-all;
        }

        .due:last-child {
            border-bottom: 0;
        }

        .badge {
            font-size: 12px;
            font-weight: 700;
            border-radius: 99px;
            padding: 2px 10px;
            white-space: nowrap;
            align-self: flex-start;
            background: var(--fill);
        }

        .badge.over {
            background: var(--bad);
            color: #fff;
        }

        .badge.soon {
            background: var(--blue);
            color: var(--on-blue);
        }

        .ev h3 {
            font-size: 16px;
            margin: 0 0 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ev .meta {
            color: var(--muted);
            font-size: 14px;
            word-break: break-all;
        }

        .chip {
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
            background: var(--fill);
            border-radius: 99px;
            padding: 2px 10px;
        }

        canvas {
            width: 100%;
            height: 200px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>寵物記錄</h1>
        <p class="sub">餵食、體重、疫苗、驅蟲、看診都記下來，到期自動提醒。非獸醫建議。</p>

        <div class="card">
            <div class="chips" id="pets"></div>
            <div class="btns"><button id="addPetBtn">＋ 新增寵物</button></div>
        </div>

        <div class="card" id="petForm" hidden>
            <h2 id="petFormTitle">新增寵物</h2>
            <div class="fgrid">
                <div><label for="p_name">名字</label><input id="p_name" type="text" maxlength="20"></div>
                <div><label for="p_sp">種類</label><select id="p_sp"></select></div>
                <div><label for="p_size">體型（狗用於年齡換算）</label><select id="p_size"></select></div>
                <div><label for="p_birth">生日（可留白）</label><input id="p_birth" type="date"></div>
                <div class="full"><label for="p_note">備註</label><input id="p_note" type="text" maxlength="200" placeholder="品種、晶片號碼、過敏…（可留白）"></div>
            </div>
            <div class="btns"><button class="primary" id="savePet">新增</button><button id="cancelPet">取消</button></div>
            <p class="msg" id="petMsg"></p>
        </div>

        <div id="main" hidden>
            <div class="card" id="petInfo"></div>

            <div class="card" id="dueCard" hidden>
                <h2>到期提醒</h2>
                <div id="dues"></div>
            </div>

            <div class="card">
                <h2 id="formTitle">新增記錄</h2>
                <div class="fgrid">
                    <div><label for="e_date">日期</label><input id="e_date" type="date"></div>
                    <div><label for="e_type">類型</label><select id="e_type"></select></div>
                    <div class="full"><label for="e_name">項目（可留白）</label><input id="e_name" type="text" maxlength="30" placeholder="例如：狂犬病疫苗、體內驅蟲、某某動物醫院"></div>
                    <div><label for="e_val" id="e_valL">數值</label><input id="e_val" type="number" min="0" step="any" inputmode="decimal"></div>
                    <div id="cycWrap"><label for="e_cyc">下次間隔（0 = 不提醒）</label>
                        <div style="display:flex;gap:6px"><input id="e_cyc" type="number" min="0" max="3650" step="1" value="0" inputmode="numeric"><select id="e_cu" style="width:auto"><option value="m">個月</option><option value="d">天</option></select></div>
                    </div>
                    <div class="full"><label for="e_note">備註</label><input id="e_note" type="text" maxlength="200"></div>
                </div>
                <p class="msg" id="duePrev"></p>
                <div class="btns"><button class="primary" id="saveEv">新增</button><button id="cancelEv" hidden>取消編輯</button></div>
                <p class="msg" id="evMsg"></p>
            </div>

            <div class="card" id="wCard" hidden>
                <h2>體重趨勢</h2>
                <canvas id="cv" role="img" aria-label="體重趨勢圖"></canvas>
                <p class="msg" id="wMsg"></p>
            </div>

            <div class="card"><select id="typeFilter" aria-label="類型篩選"></select></div>
            <div id="events"></div>
        </div>

        <div class="card">
            <h2>資料管理</h2>
            <p class="msg" style="margin:0 0 8px">最多 20 隻寵物、3000 筆記錄。單筆刪除在每筆右下角、刪寵物在寵物資訊卡；這裡可匯出或全部清除。</p>
            <div class="btns" style="margin-top:0"><button id="csv">匯出 CSV（全部）</button><button id="clearAll" style="color:var(--bad)">清除全部</button></div>
            <p class="msg" id="dataMsg"></p>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>多隻寵物的健康與生活記錄本：餵食、體重、疫苗、驅蟲、看診、洗澡美容。疫苗 / 驅蟲 / 看診可設「下次間隔」，自動算到期日並提醒；體重畫成趨勢圖，並提供年齡換算。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想記住「疫苗打了沒、下次是哪天」「驅蟲多久一次」。</li>
        <li>看診或換飼料後想追蹤體重變化。</li>
        <li>去動物醫院前，匯出記錄給獸醫參考。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「＋ 新增寵物」填名字、種類、體型（狗）與生日。點上方名字切換寵物。</li>
        <li>填日期、類型、項目與數值（體重填公斤）；疫苗 / 驅蟲 / 看診可填「下次間隔」（如 12 個月、30 天），到期提醒會出現在上方。</li>
        <li>同一寵物、同一類型、同一「項目」只以最新一筆的到期日提醒，所以不同疫苗請填不同項目名稱。</li>
        <li>記錄可編輯 / 刪除；「匯出 CSV」可用試算表開啟。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">2026-03-01 疫苗「狂犬病」間隔 12 個月 → 到期日 2027-03-01
        2026-03-05 體重 4.2 公斤 → 出現在體重趨勢圖
        小型犬 3 歲 ≈ 人類 28 歲（約略換算）</div>
        <h3>小提醒</h3>
        <ul>
        <li>非獸醫建議：年齡換算只是約略參考（1 歲約 15、2 歲約 24，之後狗依體型每年加 4 / 5 / 6 歲，貓每年加 4 歲），疫苗驅蟲頻率請依獸醫指示。</li>
        <li>資料只存在這個瀏覽器，清除網站資料會消失；右上角「💾」可匯出備份。</li>
        <li>最多 20 隻寵物、3000 筆記錄，滿了要先刪除才能新增，不會默默刪舊的。</li>
        <li>刪除寵物會連同牠的所有記錄一起刪；「清除全部」會刪掉所有寵物與記錄；都會先詢問且無法復原。載入到壞掉的資料會自動略過或補預設值。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day, store, csvStringify } = Util;

        // --- pure ---
        const PL = { PETS: 20, EVENTS: 3000, NAME: 20, ITEM: 30, NOTE: 200, MAX_VAL: 1e7, MAX_CYC: 3650 };
        const SPECIES = ['狗', '貓', '其他'], SIZES = ['小型（約 10 公斤以下）', '中型（約 10–25 公斤）', '大型（約 25 公斤以上）'];
        const ETYPES = ['餵食', '體重', '疫苗', '驅蟲', '看診', '洗澡美容', '其他'];
        const UNIT = { 餵食: '克', 體重: '公斤', 疫苗: '花費（元）', 驅蟲: '花費（元）', 看診: '花費（元）', 洗澡美容: '花費（元）', 其他: '數值' };
        const CYC_TYPES = ['疫苗', '驅蟲', '看診'];
        const twToday = (ms = Date.now()) => new Date(ms + 8 * 36e5).toISOString().slice(0, 10);
        function validDate(s) {
            if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const p = day.parse(s);
            return p.y >= 1990 && p.y <= 2100 && p.m >= 1 && p.m <= 12 && p.d >= 1 && p.d <= day.daysInMonth(p.y, p.m);
        }
        const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const dueOf = (e) => e.cyc > 0 && CYC_TYPES.includes(e.type) ? (e.cu === 'd' ? day.shift(e.date, e.cyc) : day.addMonths(e.date, e.cyc)) : '';

        function normPet(r) {
            if (!r || typeof r !== 'object') return null;
            const name = str(r.name, PL.NAME);
            if (!name) return null;
            return { id: str(r.id, 40) || newId(), name, sp: SPECIES.includes(r.sp) ? r.sp : '其他', size: SIZES.includes(r.size) ? r.size : SIZES[0], birth: validDate(r.birth) ? r.birth : '', note: str(r.note, PL.NOTE) };
        }
        function normEvent(r) {
            if (!r || typeof r !== 'object' || !validDate(r.date) || !ETYPES.includes(r.type)) return null;
            const v = r.val === null || r.val === '' || r.val === undefined ? null : Number(r.val), c = Math.round(Number(r.cyc));
            const val = v !== null && Number.isFinite(v) && v >= 0 && v <= PL.MAX_VAL ? Math.round(v * 100) / 100 : null;
            if (r.type === '體重' && !(val >= 0.01 && val <= 200)) return null;
            return {
                id: str(r.id, 40) || newId(), pid: str(r.pid, 40), type: r.type, date: r.date, name: str(r.name, PL.ITEM), val,
                cyc: CYC_TYPES.includes(r.type) && c > 0 && c <= PL.MAX_CYC ? c : 0, cu: r.cu === 'd' ? 'd' : 'm', note: str(r.note, PL.NOTE),
            };
        }
        // 載入驗證：壞資料略過、超過上限截斷、重複 id 去除、沒有對應寵物的記錄丟掉
        function normData(raw) {
            raw = raw && typeof raw === 'object' ? raw : {};
            const seen = new Set(), pets = [];
            for (const r of Array.isArray(raw.pets) ? raw.pets : []) { const p = normPet(r); if (p && !seen.has(p.id)) { seen.add(p.id); pets.push(p); if (pets.length >= PL.PETS) break; } }
            const eids = new Set(), events = [];
            for (const r of Array.isArray(raw.events) ? raw.events : []) { const e = normEvent(r); if (e && seen.has(e.pid) && !eids.has(e.id)) { eids.add(e.id); events.push(e); if (events.length >= PL.EVENTS) break; } }
            return { pets, events };
        }
        function checkPet(r) {
            const s = (v) => String(v ?? '').trim();
            if (!s(r.name)) return '請填寵物名字';
            if (s(r.name).length > PL.NAME) return `名字最長 ${PL.NAME} 字`;
            if (s(r.note).length > PL.NOTE) return `備註最長 ${PL.NOTE} 字`;
            if (s(r.birth) !== '' && (!validDate(s(r.birth)) || s(r.birth) > twToday())) return '生日請選有效且不晚於今天的日期';
            return '';
        }
        function addPet(d, r) {
            const err = checkPet(r);
            if (err) return { d, err };
            if (d.pets.length >= PL.PETS) return { d, err: `最多 ${PL.PETS} 隻寵物，請先刪除不用的` };
            const p = normPet({ ...r, birth: String(r.birth || '').trim(), id: newId() });
            return { d: { ...d, pets: [...d.pets, p] }, err: '', id: p.id };
        }
        function updatePet(d, id, r) {
            const err = checkPet(r);
            if (err) return { d, err };
            if (!d.pets.some(p => p.id === id)) return { d, err: '找不到這隻寵物' };
            return { d: { ...d, pets: d.pets.map(p => p.id === id ? normPet({ ...r, birth: String(r.birth || '').trim(), id }) : p) }, err: '' };
        }
        // 刪寵物連帶刪其所有事件
        const removePet = (d, id) => ({ pets: d.pets.filter(p => p.id !== id), events: d.events.filter(e => e.pid !== id) });
        function checkEvent(r) {
            const s = (v) => String(v ?? '').trim();
            if (!ETYPES.includes(r.type)) return '請選類型';
            if (!validDate(s(r.date))) return '請選有效的日期（1990–2100）';
            if (s(r.name).length > PL.ITEM) return `項目最長 ${PL.ITEM} 字`;
            if (s(r.note).length > PL.NOTE) return `備註最長 ${PL.NOTE} 字`;
            if (s(r.val) !== '') { const v = Number(s(r.val)); if (!(Number.isFinite(v) && v >= 0 && v <= PL.MAX_VAL)) return '數值請填 0 以上的數字'; }
            if (r.type === '體重') { const v = Number(s(r.val)); if (!(s(r.val) !== '' && v >= 0.01 && v <= 200)) return '體重請填 0.01 到 200 公斤'; }
            if (CYC_TYPES.includes(r.type) && s(r.cyc) !== '') {
                const c = Number(s(r.cyc)), max = r.cu === 'd' ? PL.MAX_CYC : 120;
                if (!(Number.isInteger(c) && c >= 0 && c <= max)) return `下次間隔請填 0 到 ${max} 的整數`;
            }
            return '';
        }
        const fromForm = (r, pid, id) => normEvent({ id, pid, type: r.type, date: String(r.date).trim(), name: r.name, val: String(r.val ?? '').trim() === '' ? null : r.val, cyc: String(r.cyc ?? '').trim() === '' ? 0 : r.cyc, cu: r.cu, note: r.note });
        // 新增記錄：滿 3000 筆拒絕
        function addEvent(d, pid, r) {
            const err = checkEvent(r);
            if (err) return { d, err };
            if (!d.pets.some(p => p.id === pid)) return { d, err: '請先選擇寵物' };
            if (d.events.length >= PL.EVENTS) return { d, err: `最多 ${PL.EVENTS} 筆記錄，請先刪除不用的` };
            return { d: { ...d, events: [...d.events, fromForm(r, pid, newId())] }, err: '' };
        }
        function updateEvent(d, id, r) {
            const err = checkEvent(r), old = d.events.find(e => e.id === id);
            if (err) return { d, err };
            if (!old) return { d, err: '找不到這筆記錄' };
            return { d: { ...d, events: d.events.map(e => e.id === id ? fromForm(r, old.pid, id) : e) }, err: '' };
        }
        const removeEvent = (d, id) => ({ ...d, events: d.events.filter(e => e.id !== id) });
        // 到期提醒：同寵物 + 類型 + 項目，只看最新一筆有間隔的記錄；依到期日排序
        function dueList(d, today, pid) {
            const latest = new Map();
            for (const e of d.events) {
                if (!dueOf(e) || (pid && e.pid !== pid)) continue;
                const k = e.pid + '|' + e.type + '|' + e.name, o = latest.get(k);
                if (!o || e.date > o.date || (e.date === o.date && e.id > o.id)) latest.set(k, e);
            }
            return [...latest.values()].map(e => {
                const due = dueOf(e), days = day.between(today, due);
                return { id: e.id, pid: e.pid, type: e.type, name: e.name, due, days, state: days < 0 ? 'over' : days <= 14 ? 'soon' : 'ok' };
            }).sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.id < b.id ? -1 : 1);
        }
        const weightSeries = (d, pid) => d.events.filter(e => e.pid === pid && e.type === '體重').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1).map(e => ({ date: e.date, kg: e.val }));
        // 年齡：{ y, m, d }；人類年齡換算（約略）：1 歲 15、2 歲 24，之後狗依體型每年 +4 / +5 / +6，貓 +4；其他物種不換算
        const ageOf = (birth, today) => validDate(birth) && birth <= today ? day.diffYMD(birth, today) : null;
        function humanAge(sp, size, birth, today) {
            if (sp !== '狗' && sp !== '貓') return null;
            const a = ageOf(birth, today);
            if (!a) return null;
            const yrs = a.y + a.m / 12 + a.d / 365, per = sp === '貓' ? 4 : [4, 5, 6][Math.max(0, SIZES.indexOf(size))] || 4;
            return Math.round(yrs <= 1 ? yrs * 15 : yrs <= 2 ? 15 + (yrs - 1) * 9 : 24 + (yrs - 2) * per);
        }
        // CSV：開頭是 = + - @ 的文字前補單引號，避免試算表當成公式
        const csvGuard = (v) => { const s = String(v ?? ''); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; };
        function toCsv(d) {
            const nm = new Map(d.pets.map(p => [p.id, p.name]));
            const rows = [...d.events].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0).map(e => [csvGuard(nm.get(e.pid) || ''), e.date, e.type, csvGuard(e.name), e.val ?? '', e.val === null ? '' : UNIT[e.type], e.cyc ? e.cyc + (e.cu === 'd' ? ' 天' : ' 個月') : '', dueOf(e), csvGuard(e.note)]);
            return csvStringify(['寵物', '日期', '類型', '項目', '數值', '單位', '下次間隔', '到期日', '備註'], rows);
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'pet_log';
        let data = normData(store.get(KEY, null));
        let cur = data.pets.length ? data.pets[0].id : null, editEv = null, editPet = null, showAll = false;
        const save = () => store.set(KEY, data);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        const say = (id, text, bad) => { const m = $(id); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); };
        const petName = (id) => (data.pets.find(p => p.id === id) || {}).name || '';

        SPECIES.forEach(s => $('#p_sp').append(new Option(s, s))); SIZES.forEach(s => $('#p_size').append(new Option(s, s)));
        ETYPES.forEach(t => $('#e_type').append(new Option(t, t)));
        $('#typeFilter').append(new Option('全部類型', '')); ETYPES.forEach(t => $('#typeFilter').append(new Option(t, t)));

        function typeUi() {
            const t = $('#e_type').value;
            $('#e_valL').textContent = UNIT[t] + (t === '體重' ? '（必填）' : '（可留白）');
            $('#cycWrap').hidden = !CYC_TYPES.includes(t);
            const c = Number($('#e_cyc').value), d = $('#e_date').value;
            $('#duePrev').textContent = CYC_TYPES.includes(t) && validDate(d) && Number.isInteger(c) && c > 0 ? '下次到期日：' + dueOf({ type: t, date: d, cyc: c, cu: $('#e_cu').value }) : '';
        }
        function readEv() { return { type: $('#e_type').value, date: $('#e_date').value, name: $('#e_name').value, val: $('#e_val').value, cyc: $('#e_cyc').value, cu: $('#e_cu').value, note: $('#e_note').value }; }
        function resetEv() {
            editEv = null; ['e_name', 'e_val', 'e_note'].forEach(i => { $('#' + i).value = ''; });
            $('#e_date').value = twToday(); $('#e_cyc').value = '0'; $('#e_cu').value = 'm';
            $('#formTitle').textContent = '新增記錄'; $('#saveEv').textContent = '新增'; $('#cancelEv').hidden = true; typeUi();
        }

        function drawChart(series) {
            const cv = $('#cv'), dpr = window.devicePixelRatio || 1, W = Math.max(200, Math.floor(cv.clientWidth)), H = 200;
            cv.width = W * dpr; cv.height = H * dpr;
            const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
            const s = getComputedStyle(document.documentElement), col = (n, f) => s.getPropertyValue(n).trim() || f;
            const text = col('--muted', '#666'), line = col('--blue', '#36f'), grid = col('--line', '#ddd');
            const ks = series.map(p => p.kg), lo0 = Math.min(...ks), hi0 = Math.max(...ks), pad = (hi0 - lo0) * 0.15 || Math.max(0.2, hi0 * 0.1), lo = Math.max(0, lo0 - pad), hi = hi0 + pad;
            const L = 44, R = 12, T = 12, B = 26, t0 = day.num(series[0].date), t1 = day.num(series[series.length - 1].date);
            const X = (d) => series.length === 1 || t1 === t0 ? (L + W - R) / 2 : L + (day.num(d) - t0) / (t1 - t0) * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
            g.font = '12px sans-serif'; g.fillStyle = text; g.strokeStyle = grid; g.lineWidth = 1;
            for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); g.textAlign = 'right'; g.fillText(v.toFixed(1), L - 6, y + 4); }
            g.textAlign = 'left'; g.fillText(series[0].date.slice(2), L, H - 8); g.textAlign = 'right'; g.fillText(series[series.length - 1].date.slice(2), W - R, H - 8);
            g.strokeStyle = line; g.fillStyle = line; g.lineWidth = 2; g.beginPath();
            series.forEach((p, i) => { const x = X(p.date), y = Y(p.kg); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
            series.forEach(p => { g.beginPath(); g.arc(X(p.date), Y(p.kg), 3.5, 0, 7); g.fill(); });
        }

        function render() {
            if (!data.pets.some(p => p.id === cur)) cur = data.pets.length ? data.pets[0].id : null;
            const chips = $('#pets'); chips.replaceChildren();
            data.pets.forEach(p => { const b = el('button', '', (p.sp === '貓' ? '🐱 ' : p.sp === '狗' ? '🐶 ' : '🐾 ') + p.name); b.setAttribute('aria-pressed', p.id === cur); b.onclick = () => { cur = p.id; resetEv(); render(); }; chips.append(b); });
            $('#main').hidden = !cur;
            if (!cur) return;
            const p = data.pets.find(x => x.id === cur), today = twToday(), info = $('#petInfo'); info.replaceChildren();
            info.append(el('h2', '', p.name));
            const age = ageOf(p.birth, today), ha = humanAge(p.sp, p.size, p.birth, today);
            const line = (t) => info.append(el('p', 'msg', t));
            line(`${p.sp}${p.sp === '狗' ? '・' + p.size : ''}${p.birth ? '・生日 ' + p.birth : ''}`);
            if (age) line(`年齡：${age.y} 歲 ${age.m} 個月${ha !== null ? `（約等於人類 ${ha} 歲，僅供參考）` : ''}`);
            if (p.note) line('備註：' + p.note);
            const b = el('div', 'btns'), eb = el('button', 'sm', '編輯寵物'), db = el('button', 'sm', '刪除寵物');
            db.style.color = 'var(--bad)';
            eb.onclick = () => openPetForm(p.id);
            db.onclick = () => {
                const n = data.events.filter(e => e.pid === p.id).length;
                if (!confirm(`刪除「${p.name}」與牠的 ${n} 筆記錄？無法復原。`)) return;
                data = removePet(data, p.id); save(); resetEv(); render();
            };
            b.append(eb, db); info.append(b);

            const dues = dueList(data, today, p.id), dbox = $('#dues'); dbox.replaceChildren(); $('#dueCard').hidden = !dues.length;
            dues.forEach(x => {
                const r = el('div', 'due'), l = el('div'); l.append(`${x.type}${x.name ? '・' + x.name : ''}`, el('br'), el('small', 'muted', '到期 ' + x.due));
                r.append(l, el('span', 'badge ' + x.state, x.days < 0 ? `已過 ${-x.days} 天` : x.days === 0 ? '今天到期' : `還有 ${x.days} 天`)); dbox.append(r);
            });

            const ws = weightSeries(data, cur); $('#wCard').hidden = !ws.length;
            if (ws.length) {
                drawChart(ws);
                const last = ws[ws.length - 1].kg, first = ws[0].kg;
                say('#wMsg', ws.length === 1 ? `目前 ${last} 公斤（再記幾筆就能看到趨勢）` : `最新 ${last} 公斤，比第一筆（${ws[0].date}）${last >= first ? '增加' : '減少'} ${Math.abs(last - first).toFixed(2)} 公斤；共 ${ws.length} 筆`);
            }

            const f = $('#typeFilter').value, all = data.events.filter(e => e.pid === cur && (!f || e.type === f)).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : a.id < b.id ? 1 : -1);
            const box = $('#events'); box.replaceChildren();
            if (!all.length) box.append(el('div', 'card muted', '還沒有記錄，從上面新增第一筆吧'));
            (showAll ? all : all.slice(0, 50)).forEach(e => {
                const c = el('div', 'card ev'), h = el('h3', '', e.type); h.append(el('span', 'chip', e.date)); if (e.name) h.append(e.name);
                c.append(h);
                const bits = [e.val !== null ? `${e.val} ${UNIT[e.type]}` : '', dueOf(e) ? '下次：' + dueOf(e) : '', e.note].filter(Boolean);
                if (bits.length) c.append(el('div', 'meta', bits.join('　')));
                const bt = el('div', 'btns'), ed = el('button', 'sm', '編輯'), del = el('button', 'sm', '刪除');
                del.style.color = 'var(--bad)'; del.setAttribute('aria-label', `刪除 ${e.date} ${e.type}`);
                ed.onclick = () => startEdit(e.id);
                del.onclick = () => { if (!confirm(`刪除 ${e.date} 的「${e.type}」記錄？無法復原。`)) return; data = removeEvent(data, e.id); if (editEv === e.id) resetEv(); save(); render(); };
                bt.append(ed, del); c.append(bt); box.append(c);
            });
            if (!showAll && all.length > 50) { const m = el('button', '', `顯示全部 ${all.length} 筆`); m.onclick = () => { showAll = true; render(); }; box.append(m); }
        }
        function startEdit(id) {
            const e = data.events.find(x => x.id === id); if (!e) return;
            editEv = id; $('#e_date').value = e.date; $('#e_type').value = e.type; $('#e_name').value = e.name; $('#e_val').value = e.val ?? ''; $('#e_cyc').value = e.cyc; $('#e_cu').value = e.cu; $('#e_note').value = e.note;
            $('#formTitle').textContent = '編輯記錄'; $('#saveEv').textContent = '儲存'; $('#cancelEv').hidden = false; typeUi(); say('#evMsg', '');
            $('#formTitle').scrollIntoView({ block: 'start' });
        }
        function openPetForm(id) {
            editPet = id || null; const p = id ? data.pets.find(x => x.id === id) : null;
            $('#p_name').value = p ? p.name : ''; $('#p_sp').value = p ? p.sp : SPECIES[0]; $('#p_size').value = p ? p.size : SIZES[0]; $('#p_birth').value = p ? p.birth : ''; $('#p_note').value = p ? p.note : '';
            $('#petFormTitle').textContent = p ? '編輯寵物' : '新增寵物'; $('#savePet').textContent = p ? '儲存' : '新增'; $('#petForm').hidden = false; say('#petMsg', '');
            $('#petForm').scrollIntoView({ block: 'start' });
        }
        $('#addPetBtn').onclick = () => openPetForm(null);
        $('#cancelPet').onclick = () => { $('#petForm').hidden = true; };
        $('#savePet').onclick = () => {
            const r = { name: $('#p_name').value, sp: $('#p_sp').value, size: $('#p_size').value, birth: $('#p_birth').value, note: $('#p_note').value };
            const res = editPet ? updatePet(data, editPet, r) : addPet(data, r);
            if (res.err) { say('#petMsg', res.err, true); return; }
            data = res.d; if (res.id) cur = res.id; save(); $('#petForm').hidden = true; render();
        };
        $('#saveEv').onclick = () => {
            const r = readEv(), res = editEv ? updateEvent(data, editEv, r) : addEvent(data, cur, r);
            if (res.err) { say('#evMsg', res.err, true); return; }
            const was = editEv; data = res.d; save(); resetEv(); say('#evMsg', was ? '已儲存' : '已新增'); render();
        };
        $('#cancelEv').onclick = () => { resetEv(); say('#evMsg', ''); };
        ['#e_type', '#e_date', '#e_cyc', '#e_cu'].forEach(q => { $(q).oninput = typeUi; });
        $('#typeFilter').onchange = () => { showAll = false; render(); };
        addEventListener('resize', () => { if (cur && !$('#wCard').hidden) drawChart(weightSeries(data, cur)); });
        new MutationObserver(() => { if (cur && !$('#wCard').hidden) drawChart(weightSeries(data, cur)); }).observe(document.documentElement, { attributes: true });
        $('#csv').onclick = () => {
            if (!data.events.length) { say('#dataMsg', '還沒有記錄可以匯出'); return; }
            Util.download(new Blob(['﻿' + toCsv(data)], { type: 'text/csv;charset=utf-8' }), `寵物記錄_${twToday()}.csv`); say('#dataMsg', '已匯出 CSV');
        };
        $('#clearAll').onclick = () => {
            if (!data.pets.length) { say('#dataMsg', '目前沒有資料'); return; }
            if (!confirm(`清除全部 ${data.pets.length} 隻寵物與 ${data.events.length} 筆記錄？無法復原。`)) return;
            data = { pets: [], events: [] }; save(); resetEv(); $('#petForm').hidden = true; say('#dataMsg', '已清除全部'); render();
        };
        resetEv(); render();
    </script>
</body>

</html>
