<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="計分板：記錄桌遊、撲克、麻將的多人多局分數，輪次表、累計與排名一目了然，資料只存在你的瀏覽器。">
    <meta property="og:title" content="計分板" />
    <meta property="og:description" content="多人多局計分，自動累計與排名。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/scoreboard.html" />
    <meta name="st-keys" content="score_state,score_counter">
    <title>計分板</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 760px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .row input[type=text] {
            flex: 1 1 140px;
        }

        .scroll {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-variant-numeric: tabular-nums;
        }

        th,
        td {
            padding: 6px 8px;
            text-align: center;
            border-bottom: 1px solid var(--fill);
            white-space: nowrap;
        }

        th:first-child,
        td:first-child {
            text-align: left;
            color: var(--muted);
            position: sticky;
            left: 0;
            background: var(--card);
        }

        td input {
            width: 64px;
            text-align: center;
            padding: 6px 4px;
        }

        tfoot td {
            font-weight: 800;
            font-size: 18px;
            border-bottom: 0;
        }

        tfoot .lead {
            color: var(--ok);
        }

        .rank {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .rank div {
            background: var(--fill);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 100px;
            text-align: center;
        }

        .rank b {
            display: block;
            font-size: 24px;
            font-variant-numeric: tabular-nums;
        }

        .rank .first {
            background: color-mix(in srgb, #ffd60a 40%, var(--fill));
        }

        .cgrp {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--fill);
        }

        .cgrp .nm {
            font-weight: 700;
        }

        .cgrp .nm small {
            color: var(--muted);
            font-weight: 400;
        }

        .cgrp .cn {
            font-size: 44px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-align: center;
            min-width: 90px;
        }

        .cgrp .acts {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 2fr auto auto;
            gap: 8px;
        }

        .cgrp .acts button {
            min-height: 56px;
            font-size: 22px;
        }

        .bsc {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .bsc button {
            min-height: 150px;
            font-size: 72px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .bsc button small {
            display: block;
            font-size: 15px;
            font-weight: 600;
        }

        .bsc button.srv {
            outline: 3px solid var(--ok);
        }

        .binfo {
            margin-top: 10px;
            line-height: 1.7;
        }

        .binfo .alert {
            color: var(--ok);
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>計分板</h1>
        <p class="sub">加入玩家、每局輸入分數，自動累計與排名。資料只存在這個瀏覽器。</p>

        <div class="card"><div class="tabs" role="tablist"><button data-m="board" aria-pressed="true">計分板</button><button data-m="count" aria-pressed="false">計數器</button><button data-m="bad" aria-pressed="false">羽球</button></div></div>

        <div id="m-count" hidden>
            <div class="card">
                <h2>計數器</h2>
                <div id="cgroups"></div>
                <div class="row" style="margin-top:12px"><input type="text" id="cname" maxlength="12" placeholder="新組名稱（如：男生、女生）" aria-label="新組名稱"><button id="cadd">新增一組</button></div>
                <div class="row"><label><input type="checkbox" id="csound"> 音效</label><label><input type="checkbox" id="cvib"> 震動</label></div>
                <div class="row"><b>總數 <span id="ctotal">0</span></b><button class="sm" id="creset">全部歸零</button><button class="sm" id="cclear">清除所有組別</button></div>
            </div>
        </div>

        <div id="m-bad" hidden>
            <div class="card">
                <h2>羽球計分</h2>
                <div class="row"><button class="sm" id="bSingle" aria-pressed="true">單打</button><button class="sm" id="bDouble" aria-pressed="false">雙打</button></div>
                <div class="row"><input type="text" id="bn0" maxlength="12" value="甲" aria-label="甲方名稱"><input type="text" id="bn1" maxlength="12" value="乙" aria-label="乙方名稱"></div>
                <div class="row"><label>先發球方 <select id="bfirst"></select></label></div>
                <div class="bsc" id="bsc"><button class="primary" id="bp0"></button><button class="primary" id="bp1"></button></div>
                <div class="binfo" id="binfo"></div>
                <div class="row" style="margin-top:10px"><button class="sm" id="bundo">悔棋一步</button><button class="sm" id="bnew">新比賽</button></div>
            </div>
        </div>

        <div id="m-board">
        <div class="card">
            <h2>排名</h2>
            <div class="rank" id="rank"></div>
        </div>

        <div class="card">
            <div class="scroll"><table id="tbl"></table></div>
            <div class="row" style="margin-top:12px"><button class="primary" id="addRound">新增一局</button><button class="sm" id="delRound">刪除最後一局</button><label><input type="checkbox" id="low"> 分數越低越好（如高爾夫、心臟病）</label></div>
        </div>

        <div class="card">
            <div class="row"><input type="text" id="pname" maxlength="12" placeholder="玩家名稱" aria-label="玩家名稱"><button id="padd">加入玩家</button></div>
            <div id="people" class="row"></div>
            <div class="row"><button class="sm" id="copy">複製成績表</button><button class="sm" id="reset">全部重來</button></div>
        </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>桌遊或比賽用的計分板：加入玩家、每局輸入分數，自動累計總分與排名。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>打麻將、撲克牌、桌遊、保齡球等多局比分。</li>
        <li>高爾夫這類「分數越低越好」的比賽。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在下方輸入「玩家名稱」，按「加入玩家」（最多 20 人）。</li>
        <li>按「新增一局」，在表格中填每位玩家這局的分數。</li>
        <li>「合計」列與上方「排名」會即時更新，第 1 名顯示 🥇。</li>
        <li>分數越低越好的遊戲請勾選對應選項。</li>
        <li>「複製成績表」可貼到聊天室；玩家名稱旁的 ✕ 可移除玩家。</li>
        </ol>
        <h3>計數器（上方切換）</h3>
        <ul>
        <li>人數清點、次數統計用：每組一個大數字，按「＋1」「−1」；「新增一組」可命名（最多 12 組，滿了會拒絕新增）；每組顯示佔總數的百分比，下方是總數。</li>
        <li>可勾「音效」「震動」回饋（預設關閉，手機是否震動視瀏覽器而定）。每組可「歸零」或 ✕ 刪除；「全部歸零」與「清除所有組別」會先確認，無法復原。</li>
        <li>只記住上次的組別與數值（鍵 score_counter，可用右上角備份）；數值範圍 0–99999。</li>
        </ul>
        <h3>羽球（上方切換）</h3>
        <ul>
        <li>單打 / 雙打，21 分制：每球得分（每球得分制），領先 2 分才贏一局，打到 29 平時先拿到 30 分者勝；三戰兩勝。按得分方的大按鈕加分，🏸 外框為發球方（得分者下一球發球）。</li>
        <li>發球區：發球方分數偶數從右半場發、奇數從左半場發（單打、雙打相同；雙打得分時由同一位發球員與同伴換位）。</li>
        <li>換邊提示：每局結束換邊；第 3 局任一方先拿到 11 分也要換邊。「悔棋一步」可回上一分；「新比賽」會先確認。</li>
        <li>羽球比分只存在記憶體，重新整理會消失。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">玩家小明、小華、小美。第 1 局 10、8、5，第 2 局 6、9、7 → 合計 16、17、12，小華第 1 名。勾「分數越低越好」則小美第 1。</div>
        <h3>小提醒</h3>
        <ul>
        <li>表格太寬時可以左右滑動，第一欄（局數）會固定在左側。</li>
        <li>同分同名次（例如 1、1、3）。</li>
        <li>資料只存在這個瀏覽器；玩家最多 20 人、計數器最多 12 組（數值上限 99999），滿了會拒絕新增。「刪除最後一局」「全部重來」「全部歸零」「清除所有組別」都會先確認、無法復原。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store } = Util;

        // --- pure ---
        // state = { players: [名字], rounds: [[每位玩家該局分數 | null]], low: bool }
        const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : 0);
        const totals = (st) => st.players.map((_, i) => st.rounds.reduce((a, r) => a + num(r[i]), 0));

        // 名次（同分同名次，如 1、1、3）；low 時分數低者名次在前
        function ranks(scores, low) {
            const order = scores.map((s, i) => ({ s, i })).sort((a, b) => (low ? a.s - b.s : b.s - a.s));
            const out = new Array(scores.length); let rank = 0, prev = null;
            order.forEach((o, k) => { if (prev === null || o.s !== prev) { rank = k + 1; prev = o.s; } out[o.i] = rank; });
            return out;
        }
        // 玩家增減時，各局的分數陣列要跟著調整（新玩家補 null、移除者刪掉）
        const addPlayer = (st, name) => ({ ...st, players: [...st.players, name], rounds: st.rounds.map(r => [...r, null]) });
        const removePlayer = (st, i) => ({ ...st, players: st.players.filter((_, k) => k !== i), rounds: st.rounds.map(r => r.filter((_, k) => k !== i)) });
        const addRound = (st) => ({ ...st, rounds: [...st.rounds, st.players.map(() => null)] });

        function validState(st) {
            return !!st && Array.isArray(st.players) && st.players.length <= 20 && st.players.every(p => typeof p === 'string' && p.length >= 1 && p.length <= 12) && Array.isArray(st.rounds) && st.rounds.length <= 200
                && st.rounds.every(r => Array.isArray(r) && r.length === st.players.length && r.every(v => v === null || (typeof v === 'number' && Number.isFinite(v) && Math.abs(v) < 1e9))) && typeof st.low === 'boolean';
        }
        // 可貼到聊天室的純文字成績表
        function toText(st) {
            const t = totals(st), rk = ranks(t, st.low), order = t.map((_, i) => i).sort((a, b) => rk[a] - rk[b]);
            return [`共 ${st.rounds.length} 局${st.low ? '（分數低者勝）' : ''}`, ...order.map(i => `${rk[i]}. ${st.players[i]}　${t[i]}`)].join('\n');
        }

        // 計數器：{ groups: [{ id, name, n }], sound, vib }；最多 12 組，數值 0–99999
        const CNT_MAX = 12, CNT_CAP = 99999;
        const defCounter = () => ({ groups: [{ id: 1, name: '計數', n: 0 }], sound: false, vib: false });
        function validCounter(raw) {
            if (!raw || !Array.isArray(raw.groups)) return defCounter();
            const seen = new Set(), groups = [];
            for (const g of raw.groups) {
                if (groups.length >= CNT_MAX || !g || typeof g.name !== 'string') continue;
                let id = Number.isInteger(g.id) && g.id > 0 ? g.id : 0; while (!id || seen.has(id)) id = (id || 0) + 1 + groups.length; seen.add(id);
                const n = Number.isFinite(g.n) ? Math.min(CNT_CAP, Math.max(0, Math.round(g.n))) : 0;
                groups.push({ id, name: g.name.trim().slice(0, 12) || '計數', n });
            }
            return { groups, sound: raw.sound === true, vib: raw.vib === true };
        }
        const cntAdd = (c, id, d) => ({ ...c, groups: c.groups.map(g => g.id === id ? { ...g, n: Math.min(CNT_CAP, Math.max(0, g.n + d)) } : g) });
        const cntTotal = (c) => c.groups.reduce((a, g) => a + g.n, 0);
        const cntPct = (c, g) => { const t = cntTotal(c); return t ? Math.round(g.n / t * 100) : 0; };
        const cntNewGroup = (c, name) => { const nm = (name || '').trim().slice(0, 12); if (!nm || c.groups.length >= CNT_MAX) return c; return { ...c, groups: [...c.groups, { id: Math.max(0, ...c.groups.map(g => g.id)) + 1, name: nm, n: 0 }] }; };

        // 羽球：log = 每一球得分方（0 / 1）的陣列；全部狀態由重播得出。21 分制、領先 2 分、30 分封頂、三戰兩勝
        const badGameDone = (a, b) => { const m = Math.max(a, b); return (m >= 21 && Math.abs(a - b) >= 2) || m >= 30; };
        const badCourt = (score) => (score % 2 === 0 ? '右' : '左');
        function badReplay(log, first = 0) {
            const games = []; let cur = [0, 0], srv = first, note = null, over = false;
            const wins = () => [0, 1].map(s => games.filter(g => g[s] > g[1 - s]).length);
            for (const w of log) {
                if (over) break;
                note = null; cur = cur.slice(); cur[w]++; srv = w;
                if (badGameDone(cur[0], cur[1])) { games.push(cur); cur = [0, 0]; const ws = wins(); over = ws[0] === 2 || ws[1] === 2; note = over ? 'over' : 'game'; }
                else if (games.length === 2 && cur[w] === 11 && cur[1 - w] < 11) note = 'mid';
            }
            return { games, cur, srv, wins: wins(), over, note, court: badCourt(cur[srv]) };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let S = store.get('score_state', null); if (!validState(S)) S = { players: [], rounds: [], low: false };
        const save = () => store.set('score_state', S);

        function render() {
            $('#low').checked = S.low;
            const t = totals(S), rk = ranks(t, S.low);
            renderRank();
            const tb = $('#tbl'); tb.replaceChildren();
            if (S.players.length) {
                const head = document.createElement('tr'); head.append(document.createElement('th'), ...S.players.map(p => Object.assign(document.createElement('th'), { textContent: p }))); const th = document.createElement('thead'); th.append(head);
                const body = document.createElement('tbody');
                S.rounds.forEach((r, ri) => { const tr = document.createElement('tr'); tr.append(Object.assign(document.createElement('td'), { textContent: `第 ${ri + 1} 局` })); S.players.forEach((_, pi) => { const td = document.createElement('td'), inp = Object.assign(document.createElement('input'), { type: 'number', step: 'any', inputMode: 'decimal', value: r[pi] ?? '' }); inp.setAttribute('aria-label', `第 ${ri + 1} 局 ${S.players[pi]} 的分數`); inp.oninput = () => { const v = inp.value === '' ? null : parseFloat(inp.value); r[pi] = Number.isFinite(v) ? v : null; save(); renderTotals(); }; td.append(inp); tr.append(td); }); body.append(tr); });
                const foot = document.createElement('tfoot'), fr = document.createElement('tr'); fr.id = 'totRow'; foot.append(fr);
                tb.append(th, body, foot); renderTotals();
            }
            $('#people').replaceChildren(...S.players.map((p, i) => { const b = Object.assign(document.createElement('button'), { className: 'sm', textContent: p + ' ✕' }); b.setAttribute('aria-label', '移除 ' + p); b.onclick = () => { if (confirm(`移除「${p}」與他的所有分數？`)) { S = removePlayer(S, i); save(); render(); } }; return b; }));
        }
        function renderRank() {
            const t = totals(S), rk = ranks(t, S.low), order = S.players.map((_, i) => i).sort((a, b) => rk[a] - rk[b]);
            $('#rank').replaceChildren(...(order.length ? order.map(i => { const d = document.createElement('div'), first = rk[i] === 1 && S.rounds.length > 0; d.className = first ? 'first' : ''; d.append(Object.assign(document.createElement('span'), { textContent: `${first ? '🥇 ' : rk[i] + '. '}${S.players[i]}` }), Object.assign(document.createElement('b'), { textContent: t[i] })); return d; }) : [Object.assign(document.createElement('span'), { className: 'muted', textContent: '先在下面加入玩家' })]));
        }
        function renderTotals() {
            const t = totals(S), rk = ranks(t, S.low), fr = $('#totRow'); if (!fr) return;
            fr.replaceChildren(Object.assign(document.createElement('td'), { textContent: '合計' }), ...t.map((v, i) => Object.assign(document.createElement('td'), { className: rk[i] === 1 && S.rounds.length ? 'lead' : '', textContent: v })));
            renderRank();
        }

        $('#padd').onclick = () => { const n = $('#pname').value.trim(); if (!n || S.players.length >= 20 || S.players.includes(n)) { $('#pname').focus(); return; } S = addPlayer(S, n); save(); $('#pname').value = ''; render(); };
        $('#pname').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) $('#padd').click(); };
        $('#addRound').onclick = () => { if (!S.players.length || S.rounds.length >= 200) return; S = addRound(S); save(); render(); const last = [...document.querySelectorAll('#tbl tbody tr:last-child input')][0]; if (last) last.focus(); };
        $('#delRound').onclick = () => { if (S.rounds.length && confirm('刪除最後一局的分數？')) { S = { ...S, rounds: S.rounds.slice(0, -1) }; save(); render(); } };
        $('#low').onchange = () => { S = { ...S, low: $('#low').checked }; save(); render(); };
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), toText(S));
        $('#reset').onclick = () => { if (confirm('清除所有玩家與分數？')) { S = { players: [], rounds: [], low: false }; save(); render(); } };
        render();

        // ---------- 模式切換 ----------
        document.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => { document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); ['board', 'count', 'bad'].forEach(m => { $('#m-' + m).hidden = m !== b.dataset.m; }); }; });

        // ---------- 計數器 ----------
        let C = validCounter(store.get('score_counter', null));
        const saveC = () => store.set('score_counter', C);
        function feedback() { if (C.sound) Util.tone(660, 60, { vol: 0.1 }); if (C.vib && navigator.vibrate) { try { navigator.vibrate(20); } catch (e) { } } }
        function renderC() {
            $('#csound').checked = C.sound; $('#cvib').checked = C.vib; $('#ctotal').textContent = cntTotal(C);
            $('#cgroups').replaceChildren(...C.groups.map(g => {
                const d = document.createElement('div'); d.className = 'cgrp';
                const nm = document.createElement('div'); nm.className = 'nm'; nm.append(g.name + ' ', Object.assign(document.createElement('small'), { textContent: cntPct(C, g) + '%' }));
                const cn = Object.assign(document.createElement('div'), { className: 'cn', textContent: g.n });
                const acts = document.createElement('div'); acts.className = 'acts';
                const mk = (t, label, fn, cls = '') => { const b = Object.assign(document.createElement('button'), { textContent: t, className: cls }); b.setAttribute('aria-label', label + ' ' + g.name); b.onclick = fn; return b; };
                acts.append(mk('−1', '減一', () => { C = cntAdd(C, g.id, -1); saveC(); renderC(); feedback(); }), mk('+1', '加一', () => { C = cntAdd(C, g.id, 1); saveC(); renderC(); feedback(); }, 'primary'),
                    mk('歸零', '歸零', () => { C = { ...C, groups: C.groups.map(x => x.id === g.id ? { ...x, n: 0 } : x) }; saveC(); renderC(); }, 'sm'),
                    mk('✕', '刪除', () => { if (confirm(`刪除「${g.name}」這一組？無法復原。`)) { C = { ...C, groups: C.groups.filter(x => x.id !== g.id) }; saveC(); renderC(); } }, 'sm'));
                d.append(nm, cn, acts); return d;
            }));
        }
        $('#cadd').onclick = () => { if (C.groups.length >= CNT_MAX) { alert(`最多 ${CNT_MAX} 組，請先刪除不用的組別`); return; } const n = $('#cname').value.trim(); if (!n) { $('#cname').focus(); return; } C = cntNewGroup(C, n); saveC(); $('#cname').value = ''; renderC(); };
        $('#cname').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) $('#cadd').click(); };
        $('#csound').onchange = () => { C = { ...C, sound: $('#csound').checked }; saveC(); };
        $('#cvib').onchange = () => { C = { ...C, vib: $('#cvib').checked }; saveC(); };
        $('#creset').onclick = () => { if (confirm('所有組別的數字歸零？無法復原。')) { C = { ...C, groups: C.groups.map(g => ({ ...g, n: 0 })) }; saveC(); renderC(); } };
        $('#cclear').onclick = () => { if (confirm('刪除所有組別與數字，回到預設一組？無法復原。')) { C = defCounter(); saveC(); renderC(); } };
        renderC();

        // ---------- 羽球 ----------
        const B = { dbl: false, first: 0, log: [] };
        const bname = (s) => $('#bn' + s).value.trim() || (s ? '乙' : '甲');
        function renderB() {
            const r = badReplay(B.log, B.first);
            $('#bSingle').setAttribute('aria-pressed', !B.dbl); $('#bDouble').setAttribute('aria-pressed', B.dbl);
            $('#bfirst').replaceChildren(...[0, 1].map(s => Object.assign(document.createElement('option'), { value: s, textContent: bname(s), selected: s === B.first }))); $('#bfirst').disabled = B.log.length > 0;
            [0, 1].forEach(s => { const b = $('#bp' + s); b.replaceChildren(String(r.cur[s]), Object.assign(document.createElement('small'), { textContent: (s === r.srv && !r.over ? '🏸 ' : '') + bname(s) + '　贏 ' + r.wins[s] + ' 局' })); b.classList.toggle('srv', s === r.srv && !r.over); b.disabled = r.over; });
            const lines = [];
            if (r.games.length) lines.push('各局：' + r.games.map(g => g.join(':')).join('　'));
            if (r.over) lines.push(`<span class="alert">比賽結束：${Util.esc(bname(r.wins[0] === 2 ? 0 : 1))} 以 ${r.wins[0]}:${r.wins[1]} 獲勝</span>`);
            else {
                lines.push(`第 ${r.games.length + 1} 局　${Util.esc(bname(r.srv))} 發球，從${r.court}半場發（${r.cur[r.srv]} 分，${r.cur[r.srv] % 2 ? '奇' : '偶'}數）${B.dbl ? '；雙打由該隊在該半場的人發球' : ''}`);
                if (r.note === 'game') lines.push('<span class="alert">這局結束：雙方換邊，由剛得分的一方發球</span>');
                if (r.note === 'mid') lines.push('<span class="alert">決勝局到 11 分：雙方換邊</span>');
            }
            $('#binfo').innerHTML = lines.join('<br>');
            $('#bundo').disabled = !B.log.length;
        }
        [0, 1].forEach(s => { $('#bp' + s).onclick = () => { if (B.log.length >= 200) return; B.log.push(s); renderB(); }; $('#bn' + s).oninput = renderB; });
        $('#bSingle').onclick = () => { B.dbl = false; renderB(); }; $('#bDouble').onclick = () => { B.dbl = true; renderB(); };
        $('#bfirst').onchange = () => { B.first = +$('#bfirst').value; renderB(); };
        $('#bundo').onclick = () => { B.log.pop(); renderB(); };
        $('#bnew').onclick = () => { if (!B.log.length || confirm('結束目前比賽並重新開始？')) { B.log = []; renderB(); } };
        renderB();
    </script>
</body>
