<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="寫作工作台：專注寫作（無退格、計時、字數目標）、隨機題目與角色、名言佳句、標語公式、小說設定筆記、劇本排版與列印，資料只存在你的瀏覽器。">
    <meta property="og:title" content="寫作工作台" />
    <meta property="og:description" content="專注寫作、靈感抽題、設定筆記與劇本排版。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/writing-desk.html" />
    <meta name="st-keys" content="wdesk_draft,wdesk_notes,wdesk_opts">
    <title>寫作工作台</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 760px;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.7;
        }

        .tabs,
        .opts,
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tabs {
            margin-bottom: 12px;
        }

        .tabs button {
            flex: 1 1 auto;
        }

        .opts {
            align-items: center;
            gap: 8px 12px;
            margin-top: 10px;
        }

        .opts label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            color: var(--muted);
            font-size: 14px;
        }

        .opts input[type="number"] {
            width: 90px;
        }

        .row {
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .big {
            font-size: 19px;
            line-height: 1.7;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--fill);
            margin: 10px 0;
            white-space: pre-wrap;
        }

        .bar {
            height: 8px;
            border-radius: 4px;
            background: var(--fill);
            overflow: hidden;
            margin: 8px 0;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--blue);
            transition: width .2s;
        }

        .fbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-variant-numeric: tabular-nums;
        }

        #fEnd {
            display: none;
        }

        #editorBox.full {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--bg);
            background-image: var(--bg-image);
            display: flex;
            flex-direction: column;
            padding: max(56px, calc(env(safe-area-inset-top) + 48px)) 14px calc(12px + env(safe-area-inset-bottom));
        }

        #editorBox.full #fEnd {
            display: inline-block;
        }

        #editorBox.full textarea {
            flex: 1;
            min-height: 0;
            font-size: 18px;
        }

        .kv {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
        }

        .kv:last-child {
            border-bottom: 0;
        }

        .kv small {
            color: var(--muted);
            flex: none;
            width: 3em;
        }

        .kv span {
            flex: 1;
        }

        .note {
            padding: 12px;
            border-radius: var(--radius-sm);
            background: var(--fill);
            margin-top: 10px;
        }

        .note h3 {
            margin: 0 0 4px;
            font-size: 16px;
        }

        .note p {
            margin: 4px 0;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .note .tg {
            color: var(--muted);
            font-size: 13px;
        }

        .note.done h3 {
            text-decoration: line-through;
            color: var(--muted);
        }

        .slg {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--line);
        }

        .slg span {
            flex: 1;
        }

        .msg {
            color: var(--bad);
            font-size: 14px;
            min-height: 1.4em;
            margin: 6px 0 0;
        }

        /* 劇本預覽：左側留白依標準劇本格式（角色置中偏右、對白縮排、轉場靠右） */
        #scriptOut {
            font-family: "Courier New", Courier, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", monospace;
            font-size: 15px;
            line-height: 1.7;
            background: var(--card);
            border: var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            min-height: 120px;
        }

        #scriptOut>div {
            margin: 0 0 12px;
            white-space: pre-wrap;
        }

        .sc-scene {
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 18px !important;
        }

        .sc-character {
            margin: 14px 0 0 !important;
            padding-left: 36%;
            text-transform: uppercase;
        }

        .sc-paren {
            padding-left: 30%;
            margin: 0 !important;
        }

        .sc-dialogue {
            padding-left: 18%;
            padding-right: 12%;
        }

        .sc-transition {
            text-align: right;
            text-transform: uppercase;
        }

        @media print {
            body.print-script {
                background: #fff !important;
                color: #000 !important;
            }

            body.print-script .wrap>*:not(#paneScript),
            body.print-script #paneScript>.noprint,
            .st-bar,
            .st-panel,
            .st-toast {
                display: none !important;
            }

            body.print-script #scriptOut {
                background: #fff !important;
                color: #000 !important;
                border: 0;
                padding: 0;
                font-size: 12pt;
            }
        }

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>寫作工作台</h1>
        <p class="sub">專注寫作、找靈感、記設定、排劇本。草稿與筆記只存在這個瀏覽器，不會上傳。</p>

        <div class="tabs" role="tablist">
            <button id="tabWrite" aria-pressed="true">專注寫作</button>
            <button id="tabIdea" aria-pressed="false">靈感</button>
            <button id="tabNotes" aria-pressed="false">設定筆記</button>
            <button id="tabScript" aria-pressed="false">劇本排版</button>
        </div>

        <!-- ===== 專注寫作 ===== -->
        <div id="paneWrite">
            <div class="card">
                <div class="opts" style="margin-top:0">
                    <label><input type="checkbox" id="optNoBack"> 無退格模式</label>
                    <label>字數目標 <input type="number" id="optGoal" min="0" max="1000000" inputmode="numeric"></label>
                    <label>計時（分鐘，0 不計） <input type="number" id="optMins" min="0" max="600" inputmode="numeric"></label>
                </div>
                <p class="note" style="margin-top:10px">無退格模式：不能刪除、不能復原，只能一直往前寫，適合先把初稿寫出來。</p>
                <button class="primary" id="fStart" style="margin-top:10px">進入專注模式</button>
            </div>
            <div class="card" id="editorBox">
                <div class="fbar"><span id="fStat">0 字</span><span id="fTime"></span><button id="fEnd">結束專注</button></div>
                <div class="bar" aria-hidden="true"><i id="fBar"></i></div>
                <textarea id="draft" placeholder="在這裡開始寫…" aria-label="草稿" maxlength="200000"></textarea>
                <p class="msg" id="dMsg"></p>
                <div class="row noprint">
                    <span class="muted" id="dInfo"></span>
                    <span class="opts" style="margin:0">
                        <button class="sm" id="dTxt">匯出 .txt</button>
                        <button class="sm" id="dMd">匯出 .md</button>
                        <button class="sm" id="dCopy">複製</button>
                        <button class="sm" id="dClear">清除草稿</button>
                    </span>
                </div>
            </div>
            <p class="muted" id="fSum"></p>
        </div>

        <!-- ===== 靈感 ===== -->
        <div id="paneIdea" hidden>
            <div class="card">
                <h2>寫作題目</h2>
                <div class="opts" style="margin-top:0">
                    <select id="pCat" aria-label="題目分類"></select>
                    <input type="text" id="pSeed" placeholder="種子（選填，同種子同題）" aria-label="種子" autocomplete="off" style="flex:1 1 160px">
                    <button class="primary" id="pDraw">抽題</button>
                </div>
                <div class="big" id="pOut">按「抽題」開始</div>
                <button class="sm" id="pCopy">複製題目</button>
            </div>

            <div class="card">
                <h2>角色設定</h2>
                <div id="cList"></div>
                <div class="row"><span class="muted">按 🔒 鎖定欄位，重抽時不會變</span><span class="opts" style="margin:0"><button class="sm" id="cCopy">複製</button><button class="primary" id="cRoll">重抽未鎖定</button></span></div>
            </div>

            <div class="card">
                <h2>名言佳句</h2>
                <p class="muted" style="margin:0 0 4px;font-size:13px">每日一句</p>
                <div class="big" id="qDaily"></div>
                <button class="sm" id="qDailyCopy">複製</button>
                <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
                <div class="opts" style="margin-top:0"><select id="qCat" aria-label="名言分類"></select><button class="primary" id="qNext">換一句</button></div>
                <div class="big" id="qOut"></div>
                <button class="sm" id="qCopy">複製</button>
                <p class="note">出處以原典、詩文或廣為流傳的說法為準；沒有可靠出處的俗語標「佚名」。</p>
            </div>

            <div class="card">
                <h2>標語公式</h2>
                <div class="opts" style="margin-top:0">
                    <input type="text" id="sKw" placeholder="關鍵字，例如：咖啡" aria-label="關鍵字" maxlength="20" autocomplete="off" style="flex:1 1 160px">
                    <select id="sFm" aria-label="公式"></select>
                    <button class="primary" id="sGo">產生</button>
                </div>
                <div id="sOut"></div>
            </div>
        </div>

        <!-- ===== 設定筆記 ===== -->
        <div id="paneNotes" hidden>
            <div class="card">
                <h2 id="nFormTitle">新增筆記</h2>
                <div class="opts" style="margin-top:0">
                    <select id="nType" aria-label="類型"></select>
                    <input type="text" id="nTitle" placeholder="標題（人名、地名、事件…）" aria-label="標題" maxlength="100" autocomplete="off" style="flex:1 1 180px">
                </div>
                <textarea id="nBody" placeholder="內容" aria-label="內容" maxlength="20000" style="margin-top:10px;min-height:120px"></textarea>
                <div class="opts"><input type="text" id="nTags" placeholder="標籤（用逗號或空白分隔）" aria-label="標籤" autocomplete="off" style="flex:1 1 200px"></div>
                <div class="row"><span class="msg" id="nMsg"></span><span class="opts" style="margin:0"><button id="nCancel" hidden>取消編輯</button><button class="primary" id="nSave">新增</button></span></div>
            </div>
            <div class="card">
                <div class="opts" style="margin-top:0">
                    <input type="search" id="nQ" placeholder="搜尋標題、內容、標籤" aria-label="搜尋筆記" style="flex:1 1 180px">
                    <select id="nFType" aria-label="類型篩選"></select>
                    <select id="nFTag" aria-label="標籤篩選"></select>
                </div>
                <div class="row"><span class="muted" id="nInfo"></span><button class="sm" id="nClear">清除全部筆記</button></div>
                <div id="nList"></div>
            </div>
        </div>

        <!-- ===== 劇本排版 ===== -->
        <div id="paneScript" hidden>
            <div class="card noprint">
                <textarea id="scriptIn" placeholder="# 內 咖啡店 - 夜&#10;小明坐在角落，盯著手機。&#10;&#10;@小明&#10;（低聲）她還沒回。&#10;&#10;> 切至：" aria-label="劇本標記" style="min-height:220px"></textarea>
                <div class="row"><span class="muted" id="scStat"></span><span class="opts" style="margin:0"><button class="sm" id="scSample">範例</button><button class="sm" id="scCopy">複製排版文字</button><button class="sm" id="scTxt">匯出 .txt</button><button class="primary" id="scPrint">列印 / 存成 PDF</button></span></div>
                <p class="note">標記：<kbd>#</kbd> 場景標題、<kbd>@</kbd> 角色（下面接對白，括號開頭為舞台提示）、<kbd>&gt;</kbd> 轉場，其他行是動作描述；空行分段。</p>
            </div>
            <div id="scriptOut" aria-label="劇本預覽"></div>
        </div>

        <div class="card noprint" style="margin-top:16px">
            <div class="row" style="margin-top:0"><span class="muted">草稿、筆記與設定都只存在這個瀏覽器。</span><button class="sm" id="wipe">清除全部資料</button></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把寫作會用到的東西放在一頁：專注寫作、找靈感（題目、角色、名言、標語）、小說設定筆記、劇本排版。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想不受干擾地寫初稿，或給自己一個字數 / 時間目標。</li>
        <li>卡住時抽一個題目或角色；需要一句名言、一組標語靈感。</li>
        <li>寫小說時記人物、地點、時間線與伏筆，隨時搜尋。</li>
        <li>寫短劇 / 影片腳本，要整理成標準劇本格式並列印。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「專注寫作」：直接在框裡寫，內容自動存成草稿。可設字數目標（上方進度條）、計時（分鐘，0 = 不計時）與「無退格模式」（不能刪除與復原）。按「進入專注模式」會把編輯區放大成全螢幕，按「結束專注」回來並顯示這次寫了多少字、花了多久。寫完用「匯出 .txt / .md」下載或「複製」。</li>
        <li>「靈感」：選分類按「抽題」；填種子則同種子永遠抽到同一題。角色設定按 🔒 鎖住滿意的欄位，再按「重抽未鎖定」。名言可看每日一句或選分類換一句，每則都能複製。標語公式輸入關鍵字、選公式，產生幾組範例，點「複製」帶走。</li>
        <li>「設定筆記」：選類型（人物 / 地點 / 時間線 / 伏筆）、寫標題與內容、加標籤後按「新增」。清單可用搜尋、類型與標籤篩選；每張筆記可編輯、刪除，伏筆可標記「已回收」。</li>
        <li>「劇本排版」：用簡單標記寫，下方即時預覽成劇本格式；「列印 / 存成 PDF」只會印出劇本。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg"># 內 咖啡店 - 夜
        小明坐在角落，盯著手機。

        @小明
        （低聲）她還沒回。

        &gt; 切至：

        → 場景標題粗體，「小明」置中，括號是舞台提示，轉場靠右。</div>
        <h3>小提醒</h3>
        <ul>
        <li>草稿（含劇本）每個最多 200,000 字，到上限就不能再多寫；筆記最多 500 筆、每筆內容最多 20,000 字，滿了會拒絕新增並提示，請先刪除一些。標題最多 100 字、標籤每筆最多 10 個。</li>
        <li>刪除：每張筆記有「刪除」（會先確認）；「清除草稿」只清草稿；「清除全部筆記」清空筆記；頁面最下方「清除全部資料」會一次清掉草稿、劇本、筆記與設定，且無法復原。</li>
        <li>資料只存在這個瀏覽器，不會上傳；換瀏覽器或清除網站資料會消失，重要的請匯出。也可用右上角「💾」備份整份資料。備份壞掉或被改過時，會自動略過不合格的內容。</li>
        <li>字數：中文每字算 1，英文以單字計；進度條用整份草稿的字數。無退格模式下，若手機鍵盤的刪除鍵沒反應是正常的。</li>
        <li>名言只收有把握出處的；詩文與典籍標原作，翻譯的外國名言為意譯，引用時請再查證原文。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, rnd, seeded, download, day } = Util;

        // --- pure ---
        const MAX_DRAFT = 200000, MAX_NOTES = 500, MAX_BODY = 20000, MAX_TITLE = 100, MAX_TAGS = 10, MAX_TAG = 20;
        const NOTE_TYPES = ['人物', '地點', '時間線', '伏筆'];
        const TABS = ['write', 'idea', 'notes', 'script'];
        const rand01 = () => rnd(0x100000000) / 0x100000000;

        // 字數：中日韓字各算 1，英文 / 數字以單字計
        const CJK_RE = /[㐀-䶿一-鿿豈-﫿぀-ヿ가-힯]/g;
        const WORD_RE = /[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g;
        function countText(t) {
            t = String(t);
            const cjk = (t.match(CJK_RE) || []).length, words = (t.match(WORD_RE) || []).length;
            return { cjk, words, total: cjk + words, chars: t.replace(/\s/g, '').length };
        }

        // 草稿 / 設定：載入時驗證（備份還原、手動改壞都不會讓頁面壞掉）
        function normDraft(raw) {
            const o = typeof raw === 'string' ? { text: raw } : (raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {});
            return { text: typeof o.text === 'string' ? o.text.slice(0, MAX_DRAFT) : '', script: typeof o.script === 'string' ? o.script.slice(0, MAX_DRAFT) : '', at: Number.isFinite(o.at) ? o.at : 0 };
        }
        const clampInt = (v, lo, hi, d) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
        function normOpts(raw) {
            const o = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
            return { noBack: o.noBack === true, goal: clampInt(o.goal, 0, 1000000, 500), mins: clampInt(o.mins, 0, 600, 0), tab: TABS.includes(o.tab) ? o.tab : 'write' };
        }

        // 題目、角色、名言、標語（rand 是回傳 [0,1) 的函式；傳 seeded(種子) 就能重現）
        const PROMPTS = {
            '開頭': ['以「那天早上，門鈴響了三聲」開頭，寫一個故事。', '寫一個在天亮前十分鐘發生的場景。', '主角收到一封十年前寄出的信。', '從一句道歉開始寫起，但沒人知道為什麼道歉。', '寫一個人第一次踏進陌生城市的車站。', '以一個壞消息開頭，但讀者會覺得很溫暖。', '主角醒來，發現全世界的時鐘都停在同一刻。', '寫一場以「我本來不想來的」為第一句的聚會。'],

            '數字': ['3 分鐘，愛上{kw}。', '1 個理由，選擇{kw}。', '99% 的人，都離不開{kw}。', '每天 10 分鐘，{kw}變成習慣。', '從 0 到 1，從{kw}開始。'],
        };
        const FORMULA_ALL = Object.values(FORMULAS).flat();

        const pickFrom = (arr, rand = rand01) => arr[Math.floor(rand() * arr.length)];
        const shuffledBy = (arr, rand = rand01) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        // 抽題：cat 為空字串代表全部分類
        function pickPrompt(cat, rand = rand01) {
            const pool = cat && PROMPTS[cat] ? PROMPTS[cat].map(t => ({ cat, text: t })) : Object.entries(PROMPTS).flatMap(([c, a]) => a.map(t => ({ cat: c, text: t })));
            return pickFrom(pool, rand);
        }
        // 角色：locked 的欄位保留 prev 的值；其餘重抽，且盡量與上一次不同
        function genCharacter(rand = rand01, prev = {}, locked = {}) {
            const out = {};
            for (const [f, arr] of Object.entries(CHAR_FIELDS)) {
                if (locked[f] && typeof prev[f] === 'string' && prev[f]) { out[f] = prev[f]; continue; }
                const pool = arr.filter(x => x !== prev[f]);
                out[f] = pickFrom(pool.length ? pool : arr, rand);
            }
            return out;
        }
        const pickQuote = (cat, rand = rand01) => pickFrom(cat ? QUOTES.filter(q => q.cat === cat) : QUOTES, rand);
        const quoteOfDay = (dateStr) => QUOTES[seeded('wdesk-' + dateStr).int(QUOTES.length)];
        const quoteText = (q) => `「${q.text}」—— ${q.by}`;
        function genSlogans(kw, formula, rand = rand01, n = 5) {
            kw = String(kw).trim().slice(0, 20);
            if (!kw) return [];
            const pool = FORMULAS[formula] || FORMULA_ALL;
            return shuffledBy(pool, rand).slice(0, n).map(t => t.replace(/\{kw\}/g, kw));
        }

        // 設定筆記：標籤 / 單筆驗證 / 清單驗證 / 新增（滿了拒絕）/ 刪除（用 id）/ 搜尋
        const parseTags = (s) => [...new Set(String(s).split(/[,，、;；\s]+/).map(t => t.replace(/^[#＃]/, '').trim().slice(0, MAX_TAG)).filter(Boolean))].slice(0, MAX_TAGS);
        function normNote(n) {
            if (!n || typeof n !== 'object' || typeof n.id !== 'string' || !n.id) return null;
            return {
                id: n.id.slice(0, 40), type: NOTE_TYPES.includes(n.type) ? n.type : '人物',
                title: typeof n.title === 'string' ? n.title.slice(0, MAX_TITLE) : '', body: typeof n.body === 'string' ? n.body.slice(0, MAX_BODY) : '',
                tags: Array.isArray(n.tags) ? parseTags(n.tags.filter(x => typeof x === 'string').join(',')) : [], done: n.done === true, at: Number.isFinite(n.at) ? n.at : 0,
            };
        }
        function normNotes(raw) {
            const seen = new Set(), out = [];
            for (const x of Array.isArray(raw) ? raw : []) { const n = normNote(x); if (n && !seen.has(n.id)) { seen.add(n.id); out.push(n); } }
            return out.slice(0, MAX_NOTES);
        }
        function addNote(list, note) {
            if (list.length >= MAX_NOTES) return { ok: false, error: `最多 ${MAX_NOTES} 筆，請先刪除一些`, list };
            const n = normNote(note);
            if (!n) return { ok: false, error: '資料不完整', list };
            if (!n.title.trim() && !n.body.trim()) return { ok: false, error: '標題或內容至少要寫一項', list };
            if (typeof note.body === 'string' && note.body.length > MAX_BODY) return { ok: false, error: `內容最多 ${MAX_BODY} 字`, list };
            return { ok: true, list: [n, ...list] };
        }
        const removeNote = (list, id) => list.filter(n => n.id !== id);
        function filterNotes(list, { q = '', type = '', tag = '' } = {}) {
            q = q.trim().toLowerCase();
            return list.filter(n => (!type || n.type === type) && (!tag || n.tags.includes(tag)) && (!q || (n.title + '\n' + n.body + '\n' + n.tags.join(' ')).toLowerCase().includes(q))).sort((a, b) => b.at - a.at);
        }

        // 劇本：# 場景、@ 角色（接對白，括號開頭為舞台提示）、> 轉場，其餘是動作；空行分段
        function parseScript(text) {
            const out = []; let mode = null, blank = true;
            const push = (type, line) => { const last = out[out.length - 1]; if (!blank && last && last.type === type && (type === 'action' || type === 'dialogue')) last.text += '\n' + line; else out.push({ type, text: line }); blank = false; };
            const dlg = (line) => push(/^[（(].*[）)]$/.test(line) ? 'paren' : 'dialogue', line);
            for (const raw of String(text).split(/\r?\n/)) {
                const line = raw.trim();
                if (!line) { mode = null; blank = true; continue; }
                let m;
                if ((m = line.match(/^#\s*(.+)$/))) { push('scene', m[1]); mode = null; }
                else if ((m = line.match(/^>\s*(.+)$/))) { push('transition', m[1]); mode = null; }
                else if ((m = line.match(/^@\s*([^:：]+?)\s*(?:[:：]\s*(.*))?$/))) { blank = true; push('character', m[1]); mode = 'dialog'; if (m[2]) dlg(m[2]); }
                else if (mode === 'dialog') dlg(line);
                else push('action', line);
            }
            return out;
        }
        function scriptStats(tokens) {
            const chars = new Map();
            let last = null;
            for (const t of tokens) { if (t.type === 'character') { last = t.text; chars.set(last, chars.get(last) || 0); } else if (t.type === 'dialogue' && last) chars.set(last, chars.get(last) + 1); }
            return { scenes: tokens.filter(t => t.type === 'scene').length, dialogues: tokens.filter(t => t.type === 'dialogue').length, characters: [...chars.keys()], words: countText(tokens.map(t => t.text).join('\n')).total };
        }
        // 純文字排版（複製 / 匯出 .txt 用）：以空格縮排
        function scriptPlain(tokens) {
            const pad = (n, s) => s.split('\n').map(l => ' '.repeat(n) + l).join('\n');
            return tokens.map(t => ({ scene: () => t.text.toUpperCase(), action: () => t.text, character: () => pad(20, t.text.toUpperCase()), paren: () => pad(15, t.text), dialogue: () => pad(10, t.text), transition: () => pad(40, t.text.toUpperCase()) }[t.type]())).join('\n\n');
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
        const copyBtn = (btn, get) => { btn.onclick = () => Util.copyWithFeedback(btn, get()); };
        const KEYS = ['wdesk_draft', 'wdesk_notes', 'wdesk_opts'];
        let draft = normDraft(store.get('wdesk_draft', null)), notes = normNotes(store.get('wdesk_notes', [])), opts = normOpts(store.get('wdesk_opts', null));
        let dirty = false;
        const saveDraft = () => { dirty = false; draft.at = Date.now(); store.set('wdesk_draft', draft); };
        const saveNotes = () => store.set('wdesk_notes', notes);
        const saveOpts = () => store.set('wdesk_opts', opts);
        let saveT = 0;
        const later = () => { dirty = true; clearTimeout(saveT); saveT = setTimeout(saveDraft, 400); };

        // ----- 分頁 -----
        function showTab(t) { for (const k of TABS) { $('#pane' + k[0].toUpperCase() + k.slice(1)).hidden = k !== t; $('#tab' + k[0].toUpperCase() + k.slice(1)).setAttribute('aria-pressed', k === t); } if (opts.tab !== t) { opts.tab = t; saveOpts(); } }
        for (const k of TABS) $('#tab' + k[0].toUpperCase() + k.slice(1)).onclick = () => showTab(k);

        // ----- 專注寫作 -----
        const fmtTime = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        let sess = null;
        function stat() {
            const c = countText($('#draft').value).total, g = opts.goal;
            $('#fStat').textContent = g ? `${c} / ${g} 字` : `${c} 字`;
            $('#fBar').style.width = (g ? Math.min(100, c / g * 100) : 0) + '%';
            const len = $('#draft').value.length;
            $('#dMsg').textContent = len >= MAX_DRAFT ? `已達草稿上限 ${MAX_DRAFT} 字，無法再增加（可先匯出，再清除部分內容）` : '';
            $('#dInfo').textContent = draft.at ? '已自動儲存' : '';
        }
        function tick() {
            const el = Math.floor((Date.now() - sess.start) / 1000), left = opts.mins * 60 - el;
            $('#fTime').textContent = opts.mins ? (left > 0 ? '剩 ' + fmtTime(left) : '時間到！') : '已專注 ' + fmtTime(el);
            if (opts.mins && left <= 0 && !sess.done) { sess.done = true; Util.beep(2); }
        }
        function startFocus() {
            if (sess) return;
            sess = { start: Date.now(), base: countText($('#draft').value).total, done: false }; sess.timer = setInterval(tick, 1000); tick();
            $('#editorBox').classList.add('full'); $('#fStart').disabled = true; $('#draft').focus();
        }
        function endFocus() {
            if (!sess) return;
            clearInterval(sess.timer);
            const el = Math.floor((Date.now() - sess.start) / 1000), n = countText($('#draft').value).total - sess.base;
            $('#fSum').textContent = `上次專注：用時 ${fmtTime(el)}，${n >= 0 ? '多寫了 ' + n : '減少了 ' + -n} 字。`;
            sess = null; $('#editorBox').classList.remove('full'); $('#fStart').disabled = false; $('#fTime').textContent = '';
        }
        $('#fStart').onclick = startFocus; $('#fEnd').onclick = endFocus;
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sess) endFocus(); });
        $('#draft').value = draft.text;
        $('#draft').oninput = () => { draft.text = $('#draft').value; later(); stat(); };
        // 無退格：不能刪除 / 復原 / 覆蓋選取範圍（桌機 keydown 與手機 beforeinput 都擋）
        $('#draft').addEventListener('beforeinput', (e) => { if (opts.noBack && (/^(delete|history)/.test(e.inputType) || e.inputType === 'insertFromDrop' || ($('#draft').selectionStart !== $('#draft').selectionEnd))) e.preventDefault(); });
        $('#draft').addEventListener('keydown', (e) => { if (opts.noBack && (e.key === 'Backspace' || e.key === 'Delete' || ((e.ctrlKey || e.metaKey) && /^[zyx]$/i.test(e.key)))) e.preventDefault(); });
        $('#draft').addEventListener('cut', (e) => { if (opts.noBack) e.preventDefault(); });
        $('#optNoBack').checked = opts.noBack; $('#optGoal').value = opts.goal; $('#optMins').value = opts.mins;
        $('#optNoBack').onchange = () => { opts.noBack = $('#optNoBack').checked; saveOpts(); };
        $('#optGoal').oninput = () => { opts.goal = clampInt($('#optGoal').value, 0, 1000000, 0); saveOpts(); stat(); };
        $('#optMins').oninput = () => { opts.mins = clampInt($('#optMins').value, 0, 600, 0); saveOpts(); };
        const fileName = (ext) => `writing-${day.today().replace(/-/g, '')}.${ext}`;
        $('#dTxt').onclick = () => { if (draft.text) download(new Blob([draft.text], { type: 'text/plain;charset=utf-8' }), fileName('txt')); };
        $('#dMd').onclick = () => { if (draft.text) download(new Blob([draft.text], { type: 'text/markdown;charset=utf-8' }), fileName('md')); };
        copyBtn($('#dCopy'), () => $('#draft').value);
        $('#dClear').onclick = () => { if (draft.text && confirm('清除整份草稿？無法復原（建議先匯出）。')) { draft.text = ''; $('#draft').value = ''; saveDraft(); stat(); } };
        stat();

        // ----- 靈感 -----
        const optsOf = (sel, list, all) => sel.replaceChildren(...(all ? [new Option(all, '')] : []), ...list.map(x => new Option(x, x)));
        optsOf($('#pCat'), Object.keys(PROMPTS), '全部分類'); optsOf($('#qCat'), QUOTE_CATS, '全部分類'); optsOf($('#sFm'), Object.keys(FORMULAS), '全部公式');
        const rng = (seed) => (seed.trim() ? seeded(seed.trim()) : rand01);
        let curPrompt = '';
        $('#pDraw').onclick = () => { const p = pickPrompt($('#pCat').value, rng($('#pSeed').value)); curPrompt = `【${p.cat}】${p.text}`; $('#pOut').textContent = curPrompt; };
        copyBtn($('#pCopy'), () => curPrompt);

        let chars = genCharacter(), locked = {};
        function charRender() {
            $('#cList').replaceChildren(...Object.keys(CHAR_FIELDS).map(f => {
                const d = mk('div', undefined, 'kv'), b = mk('button', locked[f] ? '🔒' : '🔓', 'sm'); b.setAttribute('aria-pressed', !!locked[f]); b.setAttribute('aria-label', '鎖定' + f);
                b.onclick = () => { locked[f] = !locked[f]; charRender(); };
                d.append(mk('small', f), mk('span', chars[f]), b); return d;
            }));
        }
        $('#cRoll').onclick = () => { chars = genCharacter(rand01, chars, locked); charRender(); };
        copyBtn($('#cCopy'), () => Object.entries(chars).map(([k, v]) => `${k}：${v}`).join('\n'));
        charRender();

        const daily = quoteOfDay(day.today());
        $('#qDaily').textContent = quoteText(daily); copyBtn($('#qDailyCopy'), () => quoteText(daily));
        let curQuote = pickQuote('');
        const qShow = () => { $('#qOut').textContent = quoteText(curQuote); };
        $('#qNext').onclick = () => { curQuote = pickQuote($('#qCat').value); qShow(); };
        copyBtn($('#qCopy'), () => quoteText(curQuote)); qShow();

        $('#sGo').onclick = () => {
            const list = genSlogans($('#sKw').value, $('#sFm').value);
            $('#sOut').replaceChildren(...(list.length ? list.map(s => { const d = mk('div', undefined, 'slg'), b = mk('button', '複製', 'sm'); copyBtn(b, () => s); d.append(mk('span', s), b); return d; }) : [mk('p', '請先輸入關鍵字', 'muted')]));
        };

        // ----- 設定筆記 -----
        let editing = null;
        optsOf($('#nType'), NOTE_TYPES); optsOf($('#nFType'), NOTE_TYPES, '全部類型');
        function noteForm(n) { $('#nType').value = n ? n.type : NOTE_TYPES[0]; $('#nTitle').value = n ? n.title : ''; $('#nBody').value = n ? n.body : ''; $('#nTags').value = n ? n.tags.join(' ') : ''; $('#nSave').textContent = n ? '儲存' : '新增'; $('#nFormTitle').textContent = n ? '編輯筆記' : '新增筆記'; $('#nCancel').hidden = !n; $('#nMsg').textContent = ''; editing = n ? n.id : null; }
        function notesRender() {
            const allTags = [...new Set(notes.flatMap(n => n.tags))].sort(), cur = $('#nFTag').value;
            optsOf($('#nFTag'), allTags, '全部標籤'); $('#nFTag').value = allTags.includes(cur) ? cur : '';
            const list = filterNotes(notes, { q: $('#nQ').value, type: $('#nFType').value, tag: $('#nFTag').value });
            $('#nInfo').textContent = `${notes.length} / ${MAX_NOTES} 筆` + (list.length !== notes.length ? `，符合 ${list.length} 筆` : '');
            $('#nList').replaceChildren(...list.map(n => {
                const d = mk('div', undefined, 'note' + (n.done ? ' done' : '')), h = mk('h3', `【${n.type}】${n.title || '（無標題）'}`);
                const btns = mk('div', undefined, 'opts'); btns.style.marginTop = '6px';
                const b = (t, fn) => { const x = mk('button', t, 'sm'); x.onclick = fn; return x; };
                if (n.type === '伏筆') btns.append(b(n.done ? '改回未回收' : '標記已回收', () => { n.done = !n.done; saveNotes(); notesRender(); }));
                btns.append(b('編輯', () => { noteForm(n); $('#nTitle').focus(); scrollTo({ top: 0, behavior: 'smooth' }); }), b('刪除', () => { if (confirm(`刪除「${n.title || '（無標題）'}」？無法復原。`)) { notes = removeNote(notes, n.id); if (editing === n.id) noteForm(null); saveNotes(); notesRender(); } }));
                d.append(h, ...(n.body ? [mk('p', n.body)] : []), ...(n.tags.length ? [mk('div', n.tags.map(t => '#' + t).join(' '), 'tg')] : []), btns); return d;
            }), ...(list.length ? [] : [mk('p', notes.length ? '沒有符合的筆記' : '還沒有筆記', 'muted')]));
        }
        $('#nSave').onclick = () => {
            const f = { type: $('#nType').value, title: $('#nTitle').value, body: $('#nBody').value, tags: parseTags($('#nTags').value), done: false, at: Date.now() };
            if (editing) {
                const i = notes.findIndex(n => n.id === editing); if (i < 0) { noteForm(null); return; }
                const n = normNote({ ...notes[i], ...f, id: editing });
                if (!n.title.trim() && !n.body.trim()) { $('#nMsg').textContent = '標題或內容至少要寫一項'; return; }
                notes[i] = n;
            } else {
                const r = addNote(notes, { ...f, id: Date.now().toString(36) + rnd(1e6).toString(36) });
                if (!r.ok) { $('#nMsg').textContent = r.error; return; }
                notes = r.list;
            }
            saveNotes(); noteForm(null); notesRender();
        };
        $('#nCancel').onclick = () => noteForm(null);
        for (const id of ['#nQ', '#nFType', '#nFTag']) $(id).oninput = $(id).onchange = notesRender;
        $('#nClear').onclick = () => { if (notes.length && confirm(`刪除全部 ${notes.length} 筆筆記？無法復原。`)) { notes = []; noteForm(null); saveNotes(); notesRender(); } };
        noteForm(null); notesRender();

        // ----- 劇本排版 -----
        const SAMPLE = '# 內 咖啡店 - 夜\n雨聲敲著玻璃。小明坐在角落，盯著手機。\n\n@小明\n（低聲）她還沒回。\n\n@店員\n要不要再來一杯？\n\n@小明\n不用了，我在等人。\n\n> 切至：\n\n# 外 街道 - 夜\n小明撐著傘走進雨裡。';
        let scTokens = [];
        function scRender() {
            const v = $('#scriptIn').value;
            scTokens = parseScript(v);
            $('#scriptOut').replaceChildren(...scTokens.map(t => mk('div', t.text, 'sc-' + t.type)));
            const s = scriptStats(scTokens);
            $('#scStat').textContent = scTokens.length ? `${s.scenes} 場景、${s.dialogues} 段對白、${s.characters.length} 個角色${s.characters.length ? '（' + s.characters.join('、') + '）' : ''}` : '';
            if (v.length >= MAX_DRAFT) $('#scStat').textContent += `　已達上限 ${MAX_DRAFT} 字`;
        }
        $('#scriptIn').maxLength = MAX_DRAFT; $('#scriptIn').value = draft.script; $('#scriptIn').oninput = () => { draft.script = $('#scriptIn').value; later(); scRender(); };
        $('#scSample').onclick = () => { if (!$('#scriptIn').value.trim() || confirm('用範例取代目前的劇本內容？無法復原。')) { $('#scriptIn').value = SAMPLE; draft.script = SAMPLE; later(); scRender(); } };
        copyBtn($('#scCopy'), () => scriptPlain(scTokens));
        $('#scTxt').onclick = () => { if (scTokens.length) download(new Blob([scriptPlain(scTokens)], { type: 'text/plain;charset=utf-8' }), fileName('txt').replace('writing-', 'script-')); };
        $('#scPrint').onclick = () => { if (!scTokens.length) return; document.body.classList.add('print-script'); window.print(); };
        window.addEventListener('afterprint', () => document.body.classList.remove('print-script'));
        scRender();

        // ----- 清除全部 -----
        $('#wipe').onclick = () => {
            if (!confirm('清除寫作工作台的全部資料（草稿、劇本、筆記、設定）？無法復原，頁面會重新載入、進行中的專注會結束。')) return;
            clearTimeout(saveT); window.removeEventListener('pagehide', flush);
            for (const k of KEYS) { try { localStorage.removeItem(k); } catch (e) { window.Chrome && Chrome.storageFailed && Chrome.storageFailed(); } }
            location.reload();
        };
        const flush = () => { clearTimeout(saveT); if (dirty) saveDraft(); };
        window.addEventListener('pagehide', flush);
        showTab(opts.tab);
    </script>
</body>

</html>
