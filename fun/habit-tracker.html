<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="習慣打卡表：勾選型與數量型（喝水）習慣，連續天數、月曆、週圖表與定時提醒，資料只存在你的瀏覽器。">
    <meta name="st-keys" content="habits,habit_remind">
    <meta property="og:title" content="習慣打卡表" />
    <meta property="og:description" content="每天一鍵打卡，看連續天數與月曆。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/fun/habit-tracker.html" />
    <title>習慣打卡表</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 640px;
        }

        .add {
            display: flex;
            gap: 8px;
        }

        .add input {
            flex: 1;
        }

        .head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .head h2 {
            margin: 0;
            flex: 1 1 140px;
            word-break: break-all;
        }

        .streak {
            color: var(--muted);
            font-size: 14px;
        }

        .streak b {
            color: var(--text);
            font-size: 18px;
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 12px;
        }

        .cal .dow {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .d {
            aspect-ratio: 1;
            padding: 0;
            border-radius: 8px;
            font-size: 13px;
            background: var(--fill);
            color: var(--muted);
        }

        .d.blank {
            visibility: hidden;
        }

        .d.on {
            background: var(--ok);
            color: #fff;
            font-weight: 700;
        }

        .d.today {
            outline: 2px solid var(--blue);
            outline-offset: 1px;
        }

        .d:disabled {
            opacity: .35;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .nav span {
            flex: 1;
            text-align: center;
            font-weight: 600;
        }

        .d.selday {
            box-shadow: inset 0 0 0 2px var(--text);
        }

        .opts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
        }

        .opts input[type=number] {
            width: 7.5em;
        }

        .opts input[type=time] {
            width: 10.5em;
        }

        .opts input[type=text] {
            width: 6em;
        }

        .qty {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .ring {
            --p: 0;
            width: 88px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--fill) 0);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .ring span {
            width: 76%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--card);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 15px;
        }

        .qctl {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .qctl .line {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .qctl input {
            width: 6em;
        }

        .week {
            display: flex;
            gap: 6px;
            height: 90px;
            margin-top: 12px;
        }

        .week .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            font-size: 11px;
            color: var(--muted);
        }

        .week .bar {
            width: 100%;
            max-width: 34px;
            background: var(--blue);
            border-radius: 4px 4px 0 0;
            min-height: 2px;
        }

        .week .bar.ok {
            background: var(--ok);
        }

        .warn {
            font-size: 13px;
            color: var(--muted);
            margin: 8px 0 0;
        }

        #banner {
            display: none;
            border: 2px solid var(--blue);
            cursor: pointer;
        }

        #banner.on {
            display: block;
        }

        .del {
            background: none;
            color: var(--muted);
            padding: 0 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>習慣打卡表</h1>
        <p class="sub">每天一鍵打卡，連續天數一目了然。資料只存在這個瀏覽器。</p>

        <div class="card">
            <div class="add">
                <input type="text" id="name" maxlength="30" placeholder="新的習慣（例如：運動 30 分鐘）" aria-label="新的習慣">
                <button class="primary" id="add">新增</button>
            </div>
            <div class="opts">
                <select id="kind" aria-label="習慣類型">
                    <option value="check">勾選型（每天打卡）</option>
                    <option value="count">數量型（累計到目標）</option>
                </select>
                <span id="countOpts" hidden>目標 <input type="number" id="goal" min="1" value="2000" aria-label="目標值"> <input type="text" id="unit" maxlength="6" value="ml" aria-label="單位"></span>
            </div>
        </div>
        <div class="card" id="banner" role="alert"></div>
        <div class="card" id="remind">
            <h2 style="margin:0 0 6px;font-size:16px">⏰ 提醒</h2>
            <div class="opts" style="margin-top:0">
                <label><input type="checkbox" id="rOn"> 開啟提醒</label>
                <label>每 <select id="rEvery" aria-label="提醒間隔"><option value="30">30</option><option value="60">60</option><option value="90">90</option><option value="120">120</option></select> 分鐘</label>
                <label>從 <input type="time" id="rFrom" value="08:00"></label>
                <label>到 <input type="time" id="rTo" value="22:00"></label>
            </div>
            <p class="warn" id="rStatus"></p>
            <p class="warn"><b>注意：</b>網頁關閉或手機鎖屏時無法提醒，這是瀏覽器的限制；請讓這個分頁保持開著。只在上面設定的時段內、且還有未完成的習慣時才會提醒。</p>
        </div>
        <div id="list"></div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>習慣打卡表：每個習慣一張月曆，自動計算連續天數、最長紀錄與總天數。習慣分兩種：「勾選型」點一下打卡；「數量型」設定目標值與單位（例如 2000 ml），一鍵累加，達標才算完成。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>養成運動、閱讀等每日習慣，或每天喝水 2000 ml 這類要累計數量的習慣。</li>
        <li>想要看到「已經連續幾天」的成就感。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在上方輸入習慣名稱，按「新增」。</li>
        <li>按「今天打卡」，或直接點月曆上的日期（綠色＝已打卡）。</li>
        <li>點已打卡的日期可取消；未來的日期不能打卡。</li>
        <li>用 ‹ › 切換月份補打過去的日子。</li>
        <li>右上角的 × 會刪除這個習慣與紀錄。</li>
        <li>要記數量：新增前把類型選「數量型」，填目標與單位；卡片上按 +250 / +500，或輸入數字按「加入」（負數可更正）。圓環是當日進度，累計達目標就算完成並計入連續天數；點月曆日期可改看／補記那一天，下方長條圖是最近 7 天。</li>
        <li>提醒：勾「開啟提醒」，選間隔（30 / 60 / 90 / 120 分鐘）與起訖時段，瀏覽器詢問時允許通知。時段內仍有未完成習慣就會提醒；可隨時取消勾選關閉。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">喝水習慣目標 2000 ml：按 +500 四次 → 2000 / 2000 ml，圓環滿、當天算完成。</div>
        <div class="eg">連續三天（昨天、前天、大前天）都打卡，今天還沒打 → 顯示「連續 3 天」；今天打卡後變成「連續 4 天」。</div>
        <h3>小提醒</h3>
        <ul>
        <li>今天還沒打卡時，連續天數會先從昨天往回算，不會馬上歸零。</li>
        <li><b>網頁關閉或鎖屏時無法提醒</b>，這是瀏覽器的限制，不是 bug。</li>
        <li>若拒絕了通知權限，改用頁內提示聲與標題閃爍（要分頁開著才有）。</li>
        <li>舊的勾選型資料完全相容。數量型之後改目標，會以新目標重新判斷每天是否達標。</li>
        <li>資料只存在這個瀏覽器，清除網站資料會消失。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day } = Util;

        // --- pure ---
        const ymd = day.ymd, dayNum = day.num, shiftDay = day.shift;

        // 連續打卡：current 以今天（或昨天，若今天還沒打）往回算；longest 為歷史最長
        function streaks(dates, today) {
            const set = new Set(dates);
            let cur = 0, day = set.has(today) ? today : shiftDay(today, -1);
            while (set.has(day)) { cur++; day = shiftDay(day, -1); }
            const sorted = [...set].map(dayNum).sort((a, b) => a - b);
            let longest = 0, run = 0;
            sorted.forEach((n, i) => { run = i && n === sorted[i - 1] + 1 ? run + 1 : 1; if (run > longest) longest = run; });
            return { current: cur, longest, total: set.size };
        }

        // 某月的月曆格子：週日開頭；前面的空格為 null
        function monthCells(y, m) {
            const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
            return [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => ymd(y, m, i + 1))];
        }

        // 習慣資料驗證與補預設值：舊資料（只有 id/name/dates）原樣當勾選型；壞資料回 null
        const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
        function normHabit(h) {
            if (!h || typeof h !== 'object' || typeof h.name !== 'string') return null;
            const dates = Array.isArray(h.dates) ? h.dates.filter(d => typeof d === 'string' && DAY_RE.test(d)) : [];
            const id = typeof h.id === 'string' && h.id ? h.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            if (h.type !== 'count') return { id, name: h.name, dates };
            const logs = {};
            if (h.logs && typeof h.logs === 'object') for (const [d, v] of Object.entries(h.logs)) if (DAY_RE.test(d) && Number.isFinite(+v) && +v > 0) logs[d] = +v;
            const goal = Number.isFinite(+h.goal) && +h.goal > 0 ? +h.goal : 1;
            return { id, name: h.name, type: 'count', goal, unit: typeof h.unit === 'string' ? h.unit : '', logs, dates: [] };
        }
        // 已完成的日期：勾選型 = dates；數量型 = 當日累計 ≥ 目標
        function doneDates(h) {
            if (h.type !== 'count') return h.dates || [];
            return Object.keys(h.logs || {}).filter(d => h.logs[d] >= h.goal).sort();
        }
        // 某日累計加減 delta（不低於 0；歸 0 就移除）；回傳新的 logs
        function addAmount(logs, d, delta) {
            const out = { ...logs }, v = Math.max(0, Math.round(((out[d] || 0) + delta) * 1000) / 1000);
            if (v) out[d] = v; else delete out[d];
            return out;
        }
        // 最近 7 天（舊 → 新，含今天）：{ day, v, done }
        function weekSeries(h, today) {
            return Array.from({ length: 7 }, (_, i) => {
                const d = shiftDay(today, i - 6), v = h.type === 'count' ? (h.logs[d] || 0) : (h.dates.includes(d) ? 1 : 0);
                return { day: d, v, done: h.type === 'count' ? v >= h.goal : v > 0 };
            });
        }
        // 一鍵累加的量：依目標大小決定
        const quickSteps = (goal) => goal >= 1000 ? [250, 500] : goal >= 100 ? [10, 50] : [1, 5];
        // 'HH:MM' → 當天第幾分鐘；壞資料回 NaN
        function toMin(s) { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : NaN; }
        // 是否在起訖時段內（from > to 視為跨午夜）；時間壞掉當作不限制
        function inWindow(nowMin, from, to) {
            const a = toMin(from), b = toMin(to);
            if (isNaN(a) || isNaN(b)) return true;
            return a <= b ? nowMin >= a && nowMin <= b : nowMin >= a || nowMin <= b;
        }
        // 此刻該不該提醒：開啟、在時段內、距上次 ≥ 間隔
        const shouldRemind = (cfg, nowMin, lastMs, nowMs) => !!(cfg && cfg.on && inWindow(nowMin, cfg.from, cfg.to) && nowMs - lastMs >= (+cfg.every || 60) * 60000);
        // --- /pure ---

        const { store } = Util;
        const $ = (s) => document.querySelector(s);
        const KEY = 'habits';
        const RKEY = 'habit_remind';
// 勾選型 { id, name, dates }；數量型 { id, name, type:'count', goal, unit, logs:{ 日期: 累計 }, dates:[] }
const raw0 = store.get(KEY, []);
let habits = (Array.isArray(raw0) ? raw0 : []).map(normHabit).filter(Boolean);
const sel = {};                                      // 數量型：目前操作的日期 { id: 'YYYY-MM-DD' }
        const today = day.today;
        const view = {};                                     // 每個習慣目前看的月份 { id: [y, m] }

        const save = () => store.set(KEY, habits);

        function render() {
            const list = $('#list'), t = today();
            list.replaceChildren();
            if (!habits.length) { const p = document.createElement('div'); p.className = 'card muted'; p.textContent = '還沒有習慣，從上面新增一個吧'; list.append(p); return; }
            habits.forEach(h => {
                const [ty, tm] = t.split('-').map(Number);
                const [vy, vm] = view[h.id] || (view[h.id] = [ty, tm]);
                const dd = doneDates(h), st = streaks(dd, t), done = dd.includes(t), isCount = h.type === 'count';
                const card = document.createElement('div'); card.className = 'card';

                const head = document.createElement('div'); head.className = 'head';
                const title = document.createElement('h2'); title.textContent = h.name;
                const info = document.createElement('div'); info.className = 'streak';
                info.innerHTML = '連續 <b></b> 天 ・ 最長 <b></b> ・ 共 <b></b> 天';
                [st.current, st.longest, st.total].forEach((v, i) => { info.querySelectorAll('b')[i].textContent = v; });
                const btn = document.createElement('button'); btn.className = done ? '' : 'primary';
                btn.textContent = done ? '✓ 今天已打卡' : '今天打卡';
                btn.onclick = () => { toggle(h, t); };
                if (isCount) btn.hidden = true;
                const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '刪除 ' + h.name);
                del.onclick = () => { if (confirm(`刪除「${h.name}」與它的所有紀錄？`)) { habits = habits.filter(x => x !== h); save(); render(); } };
                head.append(title, btn, del);
                const extra = isCount ? qtyBlock(h, t) : null;

                const nav = document.createElement('div'); nav.className = 'nav';
                const prev = document.createElement('button'); prev.className = 'sm'; prev.textContent = '‹'; prev.setAttribute('aria-label', '上個月');
                const next = document.createElement('button'); next.className = 'sm'; next.textContent = '›'; next.setAttribute('aria-label', '下個月');
                const label = document.createElement('span'); label.textContent = `${vy} 年 ${vm} 月`;
                const go = (dm) => { const d = new Date(Date.UTC(vy, vm - 1 + dm, 1)); view[h.id] = [d.getUTCFullYear(), d.getUTCMonth() + 1]; render(); };
                prev.onclick = () => go(-1); next.onclick = () => go(1);
                nav.append(prev, label, next);

                const cal = document.createElement('div'); cal.className = 'cal';
                '日一二三四五六'.split('').forEach(w => { const e = document.createElement('div'); e.className = 'dow'; e.textContent = w; cal.append(e); });
                monthCells(vy, vm).forEach(day => {
                    const b = document.createElement('button');
                    if (!day) { b.className = 'd blank'; b.disabled = true; cal.append(b); return; }
                    b.className = 'd' + (dd.includes(day) ? ' on' : '') + (day === t ? ' today' : '') + (isCount && day === (sel[h.id] || t) ? ' selday' : '');
                    b.textContent = +day.slice(8);
                    b.disabled = day > t;                      // 不能替未來打卡
                    b.setAttribute('aria-pressed', dd.includes(day));
                    b.setAttribute('aria-label', day);
                    if (isCount) b.title = (h.logs[day] || 0) + ' ' + h.unit;
                    b.onclick = () => isCount ? (sel[h.id] = day, render()) : toggle(h, day);
                    cal.append(b);
                });
                card.append(head, info, ...(extra || []), nav, cal);
                list.append(card);
            });
        }

        // 數量型：圓環 + 一鍵累加 + 週圖表（作用在選取的日期，預設今天）
        function qtyBlock(h, t) {
            const d = sel[h.id] || t, v = h.logs[d] || 0, pct = Math.min(100, Math.round(v / h.goal * 100));
            const q = document.createElement('div'); q.className = 'qty';
            const ring = document.createElement('div'); ring.className = 'ring'; ring.style.setProperty('--p', pct);
            const rs = document.createElement('span'); rs.textContent = pct + '%'; ring.append(rs);
            const ctl = document.createElement('div'); ctl.className = 'qctl';
            const lab = document.createElement('div'); lab.className = 'qlabel';
            lab.textContent = (d === t ? '今日' : d) + ' ' + v + ' / ' + h.goal + ' ' + h.unit + (v >= h.goal ? ' ✓ 達標' : '');
            const line = document.createElement('div'); line.className = 'line';
            const add = (n) => { h.logs = addAmount(h.logs, d, n); save(); render(); };
            quickSteps(h.goal).forEach(n => { const b = document.createElement('button'); b.className = 'primary quick'; b.textContent = '+' + n; b.onclick = () => add(n); line.append(b); });
            const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'amt'; inp.placeholder = '自訂'; inp.setAttribute('aria-label', '自訂數量');
            const go = document.createElement('button'); go.className = 'custom'; go.textContent = '加入';
            go.onclick = () => { const n = +inp.value; if (Number.isFinite(n) && n) add(n); };
            const clr = document.createElement('button'); clr.className = 'clear'; clr.textContent = '清零'; clr.onclick = () => add(-v);
            line.append(inp, go, clr);
            ctl.append(lab, line); q.append(ring, ctl);
            const wk = document.createElement('div'); wk.className = 'week';
            weekSeries(h, t).forEach(x => {
                const c = document.createElement('div'); c.className = 'col'; c.title = x.day;
                const bar = document.createElement('div'); bar.className = 'bar' + (x.done ? ' ok' : ''); bar.style.height = Math.min(100, x.v / h.goal * 100) * 0.7 + '%';
                const n = document.createElement('div'); n.textContent = x.v || '';
                const w = document.createElement('div'); w.textContent = '日一二三四五六'[new Date(x.day + 'T00:00:00Z').getUTCDay()];
                c.append(n, bar, w); wk.append(c);
            });
            return [q, wk];
        }

        function toggle(h, day) {
            h.dates = h.dates.includes(day) ? h.dates.filter(d => d !== day) : [...h.dates, day].sort();
            save(); render();
        }

        function add() {
            const name = $('#name').value.trim();
            if (!name) return;
            const raw = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, dates: [] };
            if ($('#kind').value === 'count') {
                const goal = +$('#goal').value;
                if (!(goal > 0)) { $('#goal').focus(); return; }
                Object.assign(raw, { type: 'count', goal, unit: $('#unit').value.trim(), logs: {} });
            }
            habits.push(normHabit(raw));
            $('#name').value = '';
            save(); render();
        }

        $('#kind').onchange = () => { $('#countOpts').hidden = $('#kind').value !== 'count'; };

        // ===== 提醒（只在分頁開著時有效；瀏覽器關閉或鎖屏時無法提醒）=====
        const rsaved = store.get(RKEY, {});
        let rcfg = Object.assign({ on: false, every: 60, from: '08:00', to: '22:00' }, rsaved && typeof rsaved === 'object' ? rsaved : {});
        let lastRemind = Date.now(), flashTimer = 0;
        const hasN = () => typeof Notification !== 'undefined';
        function rStatus() {
            const n = hasN() ? Notification.permission : 'unsupported';
            $('#rStatus').textContent = !rcfg.on ? '提醒已關閉。' : n === 'granted' ? '系統通知已啟用（分頁開著時，到時間會跳通知）。' : '沒有通知權限（' + (n === 'denied' ? '已被拒絕' : n === 'unsupported' ? '瀏覽器不支援' : '尚未允許') + '），改用頁內提示聲與標題閃爍。';
        }
        function remindNow() {
            const names = habits.filter(h => !doneDates(h).includes(today())).map(h => h.name);
            if (!names.length) return false;
            lastRemind = Date.now();
            const msg = '還沒完成：' + names.join('、');
            const bn = $('#banner'); bn.textContent = '⏰ ' + msg + '（點此關閉）'; bn.classList.add('on'); bn.onclick = () => bn.classList.remove('on');
            if (hasN() && Notification.permission === 'granted') { try { new Notification('習慣提醒', { body: msg }); } catch (e) { } }
            else {
                Util.beep(2);
                clearInterval(flashTimer); const t0 = document.title; let k = 0;
                flashTimer = setInterval(() => { document.title = k++ % 2 ? t0 : '⏰ ' + msg; if (k > 10) { clearInterval(flashTimer); document.title = t0; } }, 800);
            }
            return true;
        }
        function tick() { const d = new Date(); if (shouldRemind(rcfg, d.getHours() * 60 + d.getMinutes(), lastRemind, d.getTime())) remindNow(); }
        function readR() {
            const was = rcfg.on;
            rcfg = { on: $('#rOn').checked, every: +$('#rEvery').value, from: $('#rFrom').value || '08:00', to: $('#rTo').value || '22:00' };
            if (rcfg.on && !was) { lastRemind = Date.now(); if (hasN() && Notification.permission === 'default') Notification.requestPermission().then(rStatus).catch(() => { }); }
            store.set(RKEY, rcfg); rStatus();
        }
        $('#rOn').checked = !!rcfg.on; $('#rEvery').value = String(rcfg.every); $('#rFrom').value = rcfg.from; $('#rTo').value = rcfg.to; rStatus();
        ['#rOn', '#rEvery', '#rFrom', '#rTo'].forEach(q => $(q).onchange = readR);
        setInterval(tick, 20000);

        $('#add').onclick = add;
        $('#name').onkeydown = (e) => { if (e.key === 'Enter') add(); };
        render();
    </script>
</body>

</html>
