    <template id="help">
        <h3>這是什麼</h3>
        <p>九種經典單人益智小謎題放在同一頁，分頁切換，每種有不同關卡 / 難度。全部單機，不用連線。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>想動動腦、等車的零碎時間。</li>
            <li>挑戰「最少步數」，或看看自己能不能解開經典謎題。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
            <li><b>河內塔</b>：把所有盤子從第 1 柱搬到第 3 柱，一次一個，大盤不能壓小盤。點柱子選起、再點目標柱放下。n 層最少 2<sup>n</sup>−1 步。</li>
            <li><b>華容道</b>：滑動方塊，把大方塊（曹操）移到底部中央出口。點方塊，只有一個方向能動就直接動；有多個方向時先選取，再點旁邊的空格或下方箭頭。<b>一格算一步</b>（橫刀立馬以此算法最少 116 步，由程式 BFS 算出；若把同一塊連續滑動算一步則為 81 步）。</li>
            <li><b>孔明棋</b>：跳過相鄰的棋子到空位並吃掉它，目標只剩一子（剩在正中央最完美）。點棋子選取，點亮起的空位跳過去。英式 33 洞、歐式 37 洞。</li>
            <li><b>倒水排序</b>：每管最多 4 格，把同色的水全倒進同一管。點一管再點另一管倒水（只能倒到空管或頂色相同的管）。「加空管」每局可用 1 次；「新局」會隨機出題，且都保證有解。</li>
            <li><b>N 皇后</b>：在 N×N 棋盤放 N 個皇后，互不攻擊（同行、列、斜線）。點格子放置 / 移除，互相攻擊的會變紅。「回溯動畫」會示範電腦怎麼找第一組解。</li>
            <li><b>騎士巡邏</b>：騎士以「日」字走法走遍每一格各一次。第一次點的格子是起點，之後點騎士能到達的格子。提示用 Warnsdorff 規則（優先走「之後出路最少」的格子）。</li>
            <li><b>幻方</b>：把 1 到 N² 填進格子，每行、每列、兩條對角線的和都相同。點格子，再點下方的數字填入；邊上的小字是各行列的和，湊到目標和會變綠。</li>
            <li><b>倒水問題</b>：用不同容量的壺量出指定水量。點一個壺，再點「裝滿 / 倒空」，或點另一個壺把水倒過去（倒到對方滿或自己空為止）。後兩關只能互倒。</li>
            <li><b>過河問題</b>：農夫帶狼、羊、菜過河；傳教士與食人族過河（任一岸食人族不能比傳教士多，除非那岸沒有傳教士）。點船所在岸的角色上船，再按「划過河」。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">河內塔 3 層：最少 7 步。倒水問題「3 升 + 5 升量出 4 升」：最少 6 步。狼羊菜：最少 7 次過河。傳教士食人族 3+3：最少 11 次。</div>
        <h3>共通功能</h3>
        <ul>
            <li>↶ 悔棋、重來（回到這一局開頭）、💡 提示（說明下一步並標出位置）。</li>
            <li>▶ 自動解答會一步步示範到完成，過程可再按停止；用過自動解答的這一局不計進度與最佳紀錄。</li>
            <li>過關的關卡會出現 ✓；步數（孔明棋是剩餘子數）比以前少就更新「最佳紀錄」。</li>
        </ul>
        <h3>小提醒</h3>
        <ul>
            <li>進度與最佳紀錄存在這台裝置，關卡數固定，不會無限增長；壞掉或不認得的資料會被忽略。</li>
            <li>頁面下方「重置進度」只清過關標記、「清除最佳紀錄」只清最佳紀錄，各自先確認，無法復原，只影響這個頁面。</li>
            <li>倒水排序、騎士巡邏、N 皇后、幻方等沒有唯一解的謎題，提示可能要你先悔棋退回正確的路。</li>
            <li>幻方的提示只比對常見的標準解（旋轉鏡射），不保證涵蓋所有幻方。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd, store } = Util;

        // --- pure ---
        const D4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        const shuf = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };

        // ===== 河內塔：state = 三根柱子，每根由下而上的盤子大小（1 最小）=====
        const hanoiStart = (n) => [Array.from({ length: n }, (_, i) => n - i), [], []];
        function hanoiMove(s, f, t) {
            const a = s[f], b = s[t];
            if (f === t || !a || !b || !a.length) return null;
            const d = a[a.length - 1];
            if (b.length && b[b.length - 1] < d) return null;
            const ns = s.map(x => x.slice()); ns[f].pop(); ns[t].push(d); return ns;
        }
        const hanoiWon = (s) => s[0].length === 0 && s[1].length === 0;
        // 從任何合法局面搬到第 to 柱的最少步數走法 [[from,to],...]
        function hanoiPlan(s, to = 2) {
            const n = s[0].length + s[1].length + s[2].length, pos = {};
            s.forEach((p, i) => p.forEach(d => { pos[d] = i; }));
            const out = [];
            const go = (k, t) => {
                if (!k) return;
                if (pos[k] === t) { go(k - 1, t); return; }
                const o = 3 - pos[k] - t;
                go(k - 1, o); out.push([pos[k], t]); pos[k] = t; go(k - 1, t);
            };
            go(n, to); return out;
        }

        // ===== 華容道：5 列 × 4 欄；piece = {r,c,w,h} =====
        const KW = 4, KH = 5;
        // 關卡：5 列字串，同一字母是同一塊，「.」是空格；曹操是 2×2
        const KLEVELS = [
            { id: '1', name: '橫刀立馬', g: ['abbc', 'abbc', 'deef', 'dghf', 'i..j'] },
            { id: '2', name: '指揮若定', g: ['abbc', 'abbc', 'deef', 'ghhi', 'j..k'] },
            { id: '3', name: '左右布兵', g: ['abbc', 'abbc', 'deef', 'g..h', 'ijjk'] },
            { id: '4', name: '四路進兵', g: ['abbc', 'abbc', 'defg', 'h..i', 'jkkl'] },
            { id: '5', name: '近在咫尺', g: ['abbc', 'abbc', 'deef', 'ghii', 'j..k'] },
            { id: '6', name: '插翅難飛', g: ['abbc', 'abbc', 'deff', 'dghi', 'j..k'] },
            { id: '7', name: '守口如瓶', g: ['abbc', 'abbc', 'd..e', 'dffe', 'ghij'] },
            { id: '8', name: '圍而不殲', g: ['abbc', 'abbc', '..dd', 'efgh', 'eijh'] },
        ];
        function kParse(rows) {
            const m = {};
            rows.forEach((row, r) => [...row].forEach((ch, c) => {
                if (ch === '.') return;
                const p = m[ch] || (m[ch] = { r, c, r2: r, c2: c }); p.r2 = r; p.c2 = c;
            }));
            return Object.values(m).map(p => ({ r: p.r, c: p.c, w: p.c2 - p.c + 1, h: p.r2 - p.r + 1 }));
        }
        function kOcc(ps) {
            const o = Array(KW * KH).fill(-1);
            ps.forEach((p, i) => { for (let r = 0; r < p.h; r++) for (let c = 0; c < p.w; c++) o[(p.r + r) * KW + p.c + c] = i; });
            return o;
        }
        function kCan(ps, occ, i, dr, dc) {
            const p = ps[i], nr = p.r + dr, nc = p.c + dc;
            if (nr < 0 || nc < 0 || nr + p.h > KH || nc + p.w > KW) return false;
            for (let r = 0; r < p.h; r++) for (let c = 0; c < p.w; c++) { const v = occ[(nr + r) * KW + nc + c]; if (v !== -1 && v !== i) return false; }
            return true;
        }
        const kDirs = (ps, i) => { const o = kOcc(ps); return D4.filter(([dr, dc]) => kCan(ps, o, i, dr, dc)); };
        function kMove(ps, i, dr, dc) {
            if (!ps[i] || !kCan(ps, kOcc(ps), i, dr, dc)) return null;
            return ps.map((p, j) => j === i ? { ...p, r: p.r + dr, c: p.c + dc } : p);
        }
        const kWon = (ps) => ps.some(p => p.w === 2 && p.h === 2 && p.r === 3 && p.c === 1);
        const kKey = (ps) => { const g = Array(KW * KH).fill('.'); ps.forEach(p => { const t = p.w === 2 ? (p.h === 2 ? 'k' : 'h') : (p.h === 2 ? 'v' : 'a'); for (let r = 0; r < p.h; r++) for (let c = 0; c < p.w; c++) g[(p.r + r) * KW + p.c + c] = t; }); return g.join(''); };
        // BFS：回傳最少步（一格算一步）的走法 [[i,dr,dc],...]，無解回 null
        function kSolve(ps0) {
            const seen = new Set([kKey(ps0)]);
            let q = [{ ps: ps0, par: null, mv: null }];
            for (let h = 0; h < q.length; h++) {
                const nd = q[h];
                if (kWon(nd.ps)) { const out = []; for (let x = nd; x.par; x = x.par) out.push(x.mv); return out.reverse(); }
                const occ = kOcc(nd.ps);
                for (let i = 0; i < nd.ps.length; i++) for (const [dr, dc] of D4) {
                    if (!kCan(nd.ps, occ, i, dr, dc)) continue;
                    const ps = nd.ps.map((p, j) => j === i ? { ...p, r: p.r + dr, c: p.c + dc } : p), k = kKey(ps);
                    if (seen.has(k)) continue;
                    seen.add(k); q.push({ ps, par: nd, mv: [i, dr, dc] });
                }
            }
            return null;
        }

        // ===== 孔明棋：7×7 陣列，-1 非棋盤、1 有棋子、0 空洞 =====
        const PEGB = { eng: (r, c) => Math.abs(r - 3) <= 1 || Math.abs(c - 3) <= 1, eu: (r, c) => Math.abs(r - 3) + Math.abs(c - 3) <= 4 };
        const pegStart = (k) => Array.from({ length: 49 }, (_, i) => PEGB[k](i / 7 | 0, i % 7) ? (i === 24 ? 0 : 1) : -1);
        const pegCount = (s) => s.filter(v => v === 1).length;
        function pegMoves(s) {
            const o = [];
            s.forEach((v, i) => {
                if (v !== 1) return;
                const r = i / 7 | 0, c = i % 7;
                for (const [dr, dc] of D4) {
                    const r2 = r + 2 * dr, c2 = c + 2 * dc;
                    if (r2 < 0 || r2 > 6 || c2 < 0 || c2 > 6) continue;
                    if (s[(r + dr) * 7 + c + dc] === 1 && s[r2 * 7 + c2] === 0) o.push([i, r2 * 7 + c2]);
                }
            });
            return o;
        }
        function pegApply(s, f, t) {
            if (!pegMoves(s).some(m => m[0] === f && m[1] === t)) return null;
            const ns = s.slice(); ns[f] = 0; ns[(f + t) / 2] = 0; ns[t] = 1; return ns;
        }
        // 殘局：從中央一子倒推 steps 步（反向跳），保證有解
        function pegGen(kind, steps = 14) {
            const s = pegStart(kind).map(v => v < 0 ? -1 : 0); s[24] = 1;
            const ok = (i) => s[i] === 0;
            for (let k = 0; k < steps; k++) {
                const mv = [];
                s.forEach((v, i) => { if (v !== 1) return; const r = i / 7 | 0, c = i % 7; for (const [dr, dc] of D4) { const r1 = r - dr, c1 = c - dc, r2 = r - 2 * dr, c2 = c - 2 * dc; if (r2 < 0 || r2 > 6 || c2 < 0 || c2 > 6) continue; if (ok(r1 * 7 + c1) && ok(r2 * 7 + c2)) mv.push([i, r1 * 7 + c1, r2 * 7 + c2]); } });
                if (!mv.length) break;
                const [t, m, f] = mv[rnd(mv.length)]; s[t] = 0; s[m] = 1; s[f] = 1;
            }
            return s;
        }
        // DFS + 失敗局面記憶；回傳 [[from,to],...] 或 null（無解或超過節點上限）
        function pegSolve(s0, limit = 2e5) {
            const dead = new Set(); let n = 0; const path = [];
            const go = (s) => {
                if (pegCount(s) === 1) return true;
                const k = s.join(''); if (dead.has(k) || ++n > limit) return false;
                for (const [f, t] of pegMoves(s)) { path.push([f, t]); if (go(pegApply(s, f, t))) return true; path.pop(); }
                dead.add(k); return false;
            };

        // ----- 進度與最佳紀錄（lower is better）-----
        const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
        function readMaps() {
            const pr = store.get('classicp_progress', {}), be = store.get('classicp_best', {}), P = {}, B = {};
            for (const [k, p] of Object.entries(PZ)) {
                const ids = p.levels().map(l => l.id); P[k] = {}; B[k] = {};
                if (isObj(pr) && isObj(pr[k])) ids.forEach(id => { if (pr[k][id] === 1) P[k][id] = 1; });
                if (isObj(be) && isObj(be[k])) ids.forEach(id => { const v = be[k][id]; if (Number.isInteger(v) && v > 0 && v < 1e7) B[k][id] = v; });
            }
            return { P, B };
        }
        const saveMaps = (P, B) => { store.set('classicp_progress', P); store.set('classicp_best', B); };

        // ----- 外殼 -----
        let cur = 'hanoi', lvl = '3', S, init, hist = [], V = {}, hl = [], autoUsed = false, ended = null, autoT = null;
        const P_ = () => PZ[cur];
        const say = (t) => { $('#msg').textContent = t || ''; };
        const ctx = { get V() { return V; }, get hl() { return hl; }, get lvl() { return lvl; }, say, draw: () => draw(), commit, play };

        function stopAuto() { clearInterval(autoT); autoT = null; $('#auto').textContent = '▶ 自動解答'; }
        function commit(ns) {
            if (!ns) return;
            hist.push(S); S = ns; hl = []; V.sel = null; say('');
            check(); draw();
        }
        function check() {
            const e = P_().end(S, lvl); if (!e || ended) return;
            ended = e; stopAuto();
            const p = P_(), score = p.score(S, hist.length), { P, B } = readMaps();
            let extra = '';
            if (autoUsed) extra = '（用過自動解答，不計進度與紀錄）';
            else {
                if (e.win) P[cur][lvl] = 1;
                if (score != null && (!B[cur][lvl] || score < B[cur][lvl])) { B[cur][lvl] = score; extra = '（新紀錄）'; }
                saveMaps(P, B);
            }
            say((e.win ? '🎉 ' : '😵 ') + e.msg + (score != null ? ` ${score} ${p.unit}` : '') + extra);
        }
        function play(list, ms) {
            stopAuto(); autoUsed = true; hist = []; ended = null; hl = []; V = {}; let i = 0;
            const stride = Math.max(1, Math.ceil(list.length / 150));
            $('#auto').textContent = '■ 停止';
            autoT = setInterval(() => { i = Math.min(list.length - 1, i + stride); S = list[i]; draw(); if (i >= list.length - 1) { stopAuto(); check(); draw(); } }, ms);
        }
        function newGame() {
            stopAuto(); S = P_().start(lvl); init = clone(S); hist = []; V = {}; hl = []; ended = null; autoUsed = false; say(''); draw();
        }
        function draw() {
            const { P, B } = readMaps(), p = P_();
            $('#tabs').innerHTML = Object.entries(PZ).map(([k, q]) => `<button class="sm" data-p="${k}" aria-pressed="${k === cur}">${q.icon} ${q.name}</button>`).join('');
            $('#lvls').innerHTML = p.levels().map(l => `<button class="sm" data-l="${l.id}" aria-pressed="${l.id === lvl}">${P[cur][l.id] ? '✓ ' : ''}${l.name}</button>`).join('');
            $('#stage').innerHTML = p.view(S, ctx); $('#stage').classList.toggle('win', !!(ended && ended.win));
            const min = p.min ? p.min(lvl) : null, inf = p.info ? p.info(S, lvl) : '';
            $('#info').textContent = [p.score(S, hist.length) != null || min != null ? `${hist.length} 步` : '', min != null ? `最少 ${min} ${p.unit}` : '', inf].filter(Boolean).join(' ・ ');
            const b = B[cur][lvl]; $('#best').textContent = b ? `最佳紀錄：${b} ${p.unit}` : '';
            $('#undo').disabled = !hist.length; $('#newg').hidden = !(typeof p.random === 'function' ? p.random(lvl) : p.random); $('#hint').disabled = !!ended; $('#auto').disabled = !!ended && !autoT;
            $('#extra').replaceChildren(...(p.extras ? p.extras(S, ctx) : []).map(x => { const bt = document.createElement('button'); bt.textContent = x.label; bt.onclick = () => { if (!ended) x.run(); }; return bt; }));
        }

        $('#tabs').onclick = (e) => { const b = e.target.closest('[data-p]'); if (!b) return; cur = b.dataset.p; lvl = P_().levels()[0].id; newGame(); };
        $('#lvls').onclick = (e) => { const b = e.target.closest('[data-l]'); if (!b) return; lvl = b.dataset.l; newGame(); };
        $('#stage').onclick = (e) => { const t = e.target.closest('[data-a]'); if (!t || ended || autoT) return; P_().click(S, t.dataset, ctx); };
        $('#undo').onclick = () => { if (!hist.length) return; stopAuto(); S = hist.pop(); ended = null; hl = []; V.sel = null; say(''); draw(); };
        $('#reset').onclick = () => { stopAuto(); S = clone(init); hist = []; V = {}; hl = []; ended = null; autoUsed = false; say(''); draw(); };
        $('#newg').onclick = newGame;
        $('#hint').onclick = () => {
            const h = P_().hint(S, ctx);
            if (!h) { say('已經完成，沒有提示了'); return; }
            hl = h.hl || []; say('💡 ' + h.msg); draw();
        };
        $('#auto').onclick = () => {
            if (autoT) { stopAuto(); return; }
            if (ended) return;
            autoUsed = true; $('#auto').textContent = '■ 停止';
            autoT = setInterval(() => {
                const h = P_().hint(S, ctx);
                if (!h || !h.ns) { stopAuto(); say(h ? h.msg : ''); return; }
                commit(h.ns);
            }, P_().speed(lvl));
        };
        document.addEventListener('keydown', (e) => {
            const d = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
            if (d && cur === 'klotski' && V.sel != null && !ended && !autoT) { e.preventDefault(); P_().click(S, { a: 'dir', d }, ctx); }
        });
        $('#clearProg').onclick = () => {
            if (!confirm('重置所有關卡的過關進度（✓ 標記）？最佳紀錄不受影響，無法復原。')) return;
            const { B } = readMaps(); const P = {}; Object.keys(PZ).forEach(k => { P[k] = {}; }); saveMaps(P, B); draw();
        };
        $('#clearBest').onclick = () => {
            if (!confirm('清除這個頁面所有最佳紀錄？過關進度不受影響，無法復原。')) return;
            const { P } = readMaps(); const B = {}; Object.keys(PZ).forEach(k => { B[k] = {}; }); saveMaps(P, B); draw();
        };
        newGame();
    </script>
</body>

</html>
