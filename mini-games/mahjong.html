    <template id="help">
        <h3>這是什麼</h3>
        <p>台灣 16 張麻將：144 張牌（含 8 張花），每人 16 張，胡牌時 17 張 = 5 組面子 + 1 對將。兩個分頁：<b>對局</b>（單機對 3 位電腦，或最多 4 位真人連線）與<b>算台計算機</b>（輸入手牌自動算最高台與金額，也可以純勾選）。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>想打一局台灣麻將：單機不用連網；和朋友則房主建房傳連結，空位電腦補。</li>
            <li>實體牌桌上吵台數：用計算機輸入手牌，看每一台怎麼來；或勾選牌型直接加總。</li>
        </ul>
        <h3>單機怎麼玩</h3>
        <ol>
            <li>選電腦程度與圈數，按「開始單機」。簡單：打孤張、能胡就胡，不吃不碰。普通：以向聽數（離聽牌還差幾步）最小化出牌，會吃碰、避開明顯危險的牌（對手已碰吃兩組以上時），不偷看你的牌。</li>
            <li>輪到你時<b>點一張牌選起來，再點一次（或按「打出」）出牌</b>。別人打出牌時，下方會出現「胡 / 槓 / 碰 / 吃 / 過」按鈕，只有真的能做的才會出現。</li>
            <li>可自摸、暗槓（手上 4 張）、加槓（已碰的牌又摸到第 4 張）。</li>
            <li>補花全自動：摸到花牌會亮出並從牌尾補一張。每局結束顯示台數明細與輸贏金額，莊家贏或流局連莊，否則換下家當莊。</li>
        </ol>
        <h3>連線怎麼玩</h3>
        <ol>
            <li>輸入暱稱，按「建立房間」，複製邀請連結給朋友；朋友開連結、輸入暱稱、按「加入」。最多 4 位真人，房主隨時可開始，空位由電腦補。</li>
            <li>牌牆與每個人的暗牌只在房主端，手牌只會私下傳給本人；房主負責驗證每個動作是否合法，多人同時想要同一張時依「胡 &gt; 碰 / 槓 &gt; 吃」，多人同時胡由離放槍者最近的一位（逆時針）取得。</li>
            <li>開局時房主會公布牌牆的 SHA-256 加鹽承諾，局末公開牌牆與鹽，大家的畫面會自動核對「與開局一致」。</li>
            <li>可設定每手倒數（逾時自動打出剛摸的牌 / 過牌）；斷線的座位由電腦託管，用同暱稱重新加入可拿回手牌。房主離開則牌局結束。</li>
        </ol>
        <h3>規則重點</h3>
        <ul>
            <li><b>吃</b>只能吃上家（上一位出牌的人）的牌，且只能吃萬 / 筒 / 條的順子；<b>碰、明槓</b>任何人的牌都可以。</li>
            <li>流局：牌牆剩 16 張（牌尾保留）時沒人胡就流局，莊家連莊。</li>
            <li>結算：自摸＝三家各付 底 + 台數×每台；點炮＝只有放槍者付。莊家贏、或輸家是莊家時，該筆再加「莊家 + 連莊」的台數。</li>
            <li>其餘特殊：搶槓、槓上開花、海底撈月、河底撈魚、天胡 / 地胡 / 人胡、八仙過海（集滿 8 張花直接胡）、七搶一（別人有 7 張花、你補到第 8 張，由 7 張那位胡）。沒有七對子。</li>
        </ul>
        <h3>算台計算機</h3>
        <ol>
            <li>「手牌自動判斷」：輸入牌，例如 <code>123m 456p 789s 11z</code>（m 萬、p 筒、s 條、z 字：1–7 = 東南西北中發白，h 花：1–8 = 春夏秋冬梅蘭菊竹）。吃 / 碰 / 明槓用方括號 <code>[123p] [444m] [1111s]</code>，暗槓用圓括號 <code>(1111z)</code>。手上要湊滿「17 張 − 3×副露組數」張，並選好胡的那張；程式窮舉所有面子拆法，取台數最高的一種。</li>
            <li>「手動勾選」：不輸入牌，直接勾選牌型，數量類（花牌、連莊）填數字。</li>
            <li>「金額與台數表」可改底、每台金額，也可逐項修改台數；各地規則不同，<b>數值可調</b>。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">清一色自摸：<code>123m 456m 789m 234m 567m 55m</code>，勾「自摸」→ 不求人 3 + 清一色 8（+ 平胡 / 獨聽依聽法），每家付「底 + 台×每台」。<br>已碰兩組：<code>11m 234p 567p 789s [444m] [555s]</code>，胡的那張在下拉選單挑（預設是最後輸入的那張）。</div>
        <h3>算台說明（預設值）</h3>
        <ul>
            <li>疊加：除下列「包含」外，各項相加。不求人 = 門清 + 自摸（不再另計）；大 / 小三元已含三元牌；大 / 小四喜已含門風 / 圈風；清一色不再計混一色；四暗刻、五暗刻、三暗刻只取最高一種。</li>
            <li>平胡：全順子、將牌不是字牌、無花、兩面聽。獨聽：只聽一張牌（單吊、嵌張、邊張）。全求：5 組都吃碰槓出去（沒有暗槓），只靠最後一張胡將牌。點炮胡進來的刻子算明刻，不算暗刻。</li>
            <li>嚦咕各地定義不同，只在計算機提供手動勾選，對局不自動計。</li>
        </ul>
        <h3>小提醒</h3>
        <ul>
            <li>台數規則因地區而異，數值可調；本頁僅供參考，實際以你們牌桌的規則為準。</li>
            <li>本機資料：<code>mj_opts</code>（底 / 台 / 圈數 / 電腦程度 / 倒數）、<code>mj_tai</code>（自訂台數表）、<code>mj_stats</code>（戰績，只有固定幾筆數字，不會越存越多）。「重設設定」「還原台數表」「清除戰績」都會先確認、無法復原；右上角「💾」可備份。壞掉或被改過的資料載入時會自動補回預設 / 夾回合理範圍。</li>
            <li>連線對局不存牌局內容；關掉頁面進行中的局就消失。</li>
        </ul>
    </template>

    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>麻將（台灣 16 張）</h1>
        <p class="sub">單機對電腦或連線 4 人，含算台計算機。台數規則因地區而異，數值可調。</p>

        <div class="tabs" id="mainTabs"><button data-t="play" aria-pressed="true">對局</button><button data-t="calc" aria-pressed="false">算台計算機</button></div>

        <div class="card" id="setCard">
            <details id="setBox">
                <summary>金額與台數表（對局與計算機共用）</summary>
                <div class="row">
                    <label>底 <input type="number" id="oBase" min="0" max="9999" inputmode="numeric"></label>
                    <label>每台 <input type="number" id="oUnit" min="0" max="999" inputmode="numeric"></label>
                </div>
                <div class="row"><button class="sm" data-preset="50,20">50 / 20</button><button class="sm" data-preset="30,10">30 / 10</button></div>
                <p class="note">台數表：改完立即生效（0 = 不計這一項）。</p>
                <div class="taiEd" id="taiEd"></div>
                <div class="row"><button class="sm" id="taiReset">還原台數表預設</button><button class="sm" id="optReset">重設全部設定</button></div>
            </details>
        </div>

        <section id="pPlay">
            <div class="card" id="menu">
                <h2>單機：和電腦玩</h2>
                <div class="row">
                    <label>電腦 <select id="soloLevel"><option value="0">簡單</option><option value="1">普通</option></select></label>
                    <label>圈數 <select id="rRounds"><option value="1">東風圈（4 莊）</option><option value="2">東南兩圈</option><option value="4">全莊（4 圈）</option></select></label>
                </div>
                <div class="row"><button class="primary" id="soloBtn">開始單機</button></div>
                <h2 style="margin-top:18px">和朋友連線</h2>
                <div class="row"><input id="nick" maxlength="10" placeholder="暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
                <div class="row">
                    <label>每手倒數 <select id="rTimer"><option value="0">不限時</option><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
                </div>
                <div class="row">
                    <button class="primary" id="hostBtn">建立房間</button>
                    <input id="joinId" placeholder="貼上房號" aria-label="房號">
                    <button id="joinBtn">加入</button>
                </div>
                <p class="note" id="netMsg"></p>
                <div id="stats"></div>
                <div class="row" style="justify-content:center"><button class="sm" id="statsClear">清除戰績</button></div>
            </div>

            <div class="card" id="lobby" hidden>
                <h2>等待玩家</h2>
                <div id="lobbyPlayers"></div>
                <div class="row" style="margin-top:12px">
                    <button id="copyInvite" hidden>複製邀請連結</button>
                    <button class="primary" id="startBtn" hidden>開始（空位由電腦補）</button>
                    <button id="lobbyLeave">離開</button>
                </div>
                <p class="note" id="lobbyHint"></p>
            </div>

            <div class="card" id="game" hidden>
                <div id="info"></div>
                <div id="opps"></div>
                <div id="rivers"></div>
                <div class="status" id="status" role="status"></div>
                <div id="logline"></div>
                <div id="timer"></div>
                <div id="mine"></div>
                <div id="hand" aria-label="我的手牌"></div>
                <div class="acts" id="acts"></div>
                <div id="score"></div>
                <div id="result" hidden></div>
                <div class="row" style="justify-content:center;margin-top:10px">
                    <button class="primary" id="nextBtn" hidden>下一局</button>
                    <button id="leave">離開</button>
                </div>
            </div>
        </section>

        <section id="pCalc" hidden>
            <div class="card">
                <h2>算台計算機</h2>
                <div class="tabs" id="calcTabs"><button data-m="auto" aria-pressed="true">手牌自動判斷</button><button data-m="manual" aria-pressed="false">手動勾選</button></div>
                <div id="cAuto">
                    <input id="cHand" placeholder="例：123m 456m 789m 345s 55p 234p" aria-label="手牌" autocomplete="off" autocapitalize="off" spellcheck="false">
                    <p class="eg2">m 萬、p 筒、s 條、z 字（1–7 東南西北中發白）、h 花（1–8）；吃碰明槓 [123p] [444m] [1111s]、暗槓 (1111z)。<br>範例：<button class="chip sm" data-ex="123m456m789m345s55p234p">平胡</button> <button class="chip sm" data-ex="222m555p888s44z[777s][111z]">碰碰胡</button> <button class="chip sm" data-ex="111m234m567m99m[123m][789m]12h">清一色</button> <button class="chip sm" data-ex="111z222z333z444z55m[123p]3h">大四喜</button></p>
                    <div class="row">
                        <label>胡的那張 <select id="cWin"></select></label>
                        <label><input type="checkbox" id="cZimo"> 自摸</label>
                        <label><input type="checkbox" id="cDealer"> 莊家</label>
                    </div>
                    <div class="row">
                        <label>連莊 <input type="number" id="cStreak" min="0" max="99" value="0" inputmode="numeric"></label>
                        <label>圈風 <select id="cRound"><option value="0">東</option><option value="1">南</option><option value="2">西</option><option value="3">北</option></select></label>
                        <label>門風 <select id="cSeat"><option value="0">東</option><option value="1">南</option><option value="2">西</option><option value="3">北</option></select></label>
                    </div>
                    <div class="grid" id="cFlags"></div>
                </div>
                <div id="cManual" hidden>
                    <div class="mrows" id="mRows"></div>
                    <div class="row" style="margin-top:8px"><label><input type="checkbox" id="mZimo"> 自摸（付款方式）</label></div>
                </div>
            </div>
            <div class="card out" id="cOutCard">
                <h2>結果</h2>
                <div id="cOut"></div>
            </div>
        </section>
    </div>

    <script>
        // --- pure ---
        // 牌 = 種類編號 0..41：0–8 萬、9–17 筒、18–26 條、27–30 東南西北、31–33 中發白、34–41 花（春夏秋冬梅蘭菊竹）。一副 144 張（0..33 各 4 張 + 8 張花）
        const NUMC = ['一', '二', '三', '四', '五', '六', '七', '八', '九'], HON = ['東', '南', '西', '北', '中', '發', '白'], FLW = ['春', '夏', '秋', '冬', '梅', '蘭', '菊', '竹'];
        const tileName = (k) => k < 9 ? NUMC[k] + '萬' : k < 18 ? (k - 8) + '筒' : k < 27 ? (k - 17) + '條' : k < 34 ? HON[k - 27] : FLW[k - 34];
        const validKind = (k) => Number.isInteger(k) && k >= 0 && k < 42;
        const isFlower = (k) => k >= 34, isHonor = (k) => k >= 27 && k < 34;
        const suitOf = (k) => k < 27 ? (k / 9 | 0) : 3;
        const WINDS = ['東', '南', '西', '北'];
        const newWall = (shuf) => shuf(Array.from({ length: 144 }, (_, i) => i < 136 ? i >> 2 : 34 + i - 136));
        const toCounts = (arr) => { const c = new Array(34).fill(0); for (const k of arr) if (k < 34) c[k]++; return c; };

        // 胡牌拆解：c = 34 種牌的張數（只含手上的牌）、nSets = 還需要幾組面子（5 - 已吃碰槓的組數）。回傳所有「1 對將 + nSets 組面子」的拆法 [{ pair, sets:[{t:'seq'|'tri',k}] }]
        function decompose(c, nSets) {
            const out = [], a = c.slice();
            if (a.reduce((s, x) => s + x, 0) !== 3 * nSets + 2) return out;
            const cur = [];
            const go = (i, pair) => {
                while (i < 34 && !a[i]) i++;
                if (i >= 34) { out.push({ pair, sets: cur.slice() }); return; }
                if (a[i] >= 3) { a[i] -= 3; cur.push({ t: 'tri', k: i }); go(i, pair); cur.pop(); a[i] += 3; }
                if (i < 27 && i % 9 <= 6 && a[i + 1] && a[i + 2]) { a[i]--; a[i + 1]--; a[i + 2]--; cur.push({ t: 'seq', k: i }); go(i, pair); cur.pop(); a[i]++; a[i + 1]++; a[i + 2]++; }
            };
            for (let p = 0; p < 34; p++) if (a[p] >= 2) { a[p] -= 2; go(0, p); a[p] += 2; }
            return out;
        }
        const isWin = (c, nSets) => decompose(c, nSets).length > 0;
        // 聽牌：手上 3n+1 張時，再摸到哪些牌就胡
        function waitsOf(c, nSets) {
            const w = [], a = c.slice();
            for (let k = 0; k < 34; k++) { if (a[k] >= 4) continue; a[k]++; if (isWin(a, nSets)) w.push(k); a[k]--; }
            return w;
        }
        // 向聽數：c = 手上的牌張數、melds = 已吃碰槓的組數。-1 = 已胡；0 = 聽牌。標準算法：2×需要面子數 − 2×完成面子 − 搭子 − 將牌
        function shanten(c, melds = 0) {
            const a = c.slice(), need = 5 - melds; let best = 99;
            const go = (i, m, t, p) => {
                while (i < 34 && !a[i]) i++;
                if (i >= 34) { const s = 2 * need - 2 * m - Math.min(t, need - m) - p; if (s < best) best = s; return; }
                if (a[i] >= 3) { a[i] -= 3; go(i, m + 1, t, p); a[i] += 3; }
                if (i < 27 && i % 9 <= 6 && a[i + 1] && a[i + 2]) { a[i]--; a[i + 1]--; a[i + 2]--; go(i, m + 1, t, p); a[i]++; a[i + 1]++; a[i + 2]++; }
                if (a[i] >= 2) { a[i] -= 2; if (!p) go(i, m, t, 1); go(i, m, t + 1, p); a[i] += 2; }
                if (i < 27 && i % 9 <= 7 && a[i + 1]) { a[i]--; a[i + 1]--; go(i, m, t + 1, p); a[i]++; a[i + 1]++; }
                if (i < 27 && i % 9 <= 6 && a[i + 2]) { a[i]--; a[i + 2]--; go(i, m, t + 1, p); a[i]++; a[i + 2]++; }
                a[i]--; go(i, m, t, p); a[i]++;
            };
            go(0, 0, 0, 0);
            return best;
        }

        // ---------- 台數表（數值可調）----------
        const TAI_DEF = [
            ['dealer', '莊家', 1], ['lian', '連莊（連 N 拉 N，每次）', 2],
            ['zimo', '自摸', 1], ['menqing', '門清', 1], ['buqiuren', '不求人（門清自摸，不另計門清、自摸）', 3],
            ['pinghu', '平胡（全順子、無字無花、兩面聽）', 2], ['pengpeng', '碰碰胡', 4],
            ['hunyise', '混一色', 4], ['qingyise', '清一色', 8], ['ziyise', '字一色', 16],
            ['xsy', '小三元', 4], ['dsy', '大三元', 8], ['xsx', '小四喜', 8], ['dsx', '大四喜', 16],
            ['sananke', '三暗刻', 2], ['sianke', '四暗刻', 5], ['wuanke', '五暗刻', 8],
            ['quanqiu', '全求', 2], ['duanyao', '斷么', 1], ['dutin', '獨聽（只聽一張）', 1],
            ['menfeng', '門風牌', 1], ['quanfeng', '圈風牌', 1], ['sanyuan', '三元牌（每副）', 1],
            ['hua', '花牌（本位花，每張）', 1], ['huagang', '花槓（春夏秋冬或梅蘭菊竹集滿）', 2], ['baxian', '八仙過海（集滿 8 張花）', 8], ['qiqiang', '七搶一', 8],
            ['haidi', '海底撈月', 1], ['hedi', '河底撈魚', 1], ['gangshang', '槓上開花', 1], ['qianggang', '搶槓', 1],
            ['lili', '嚦咕（依各地定義，手動勾選）', 1],
            ['tianhu', '天胡', 16], ['dihu', '地胡', 16], ['renhu', '人胡', 8],
        ].map(([id, name, tai]) => ({ id, name, tai }));
        const TAI_NAME = Object.fromEntries(TAI_DEF.map(x => [x.id, x.name]));
        const defaultTai = () => Object.fromEntries(TAI_DEF.map(x => [x.id, x.tai]));
        // 載入驗證：缺欄位 / 型別不對 / 超出 0–99 都補回預設
        const cleanTai = (o) => {
            const t = defaultTai();
            if (o && typeof o === 'object' && !Array.isArray(o)) for (const id of Object.keys(t)) { const v = o[id]; if (Number.isInteger(v) && v >= 0 && v <= 99) t[id] = v; }
            return t;
        };
        const cleanOpts = (o) => {
            o = o && typeof o === 'object' ? o : {};
            const int = (v, lo, hi, d) => Number.isInteger(v) && v >= lo && v <= hi ? v : d;
            return { base: int(o.base, 0, 9999, 50), unit: int(o.unit, 0, 999, 20), rounds: [1, 2, 4].includes(o.rounds) ? o.rounds : 1, timer: [0, 30, 60].includes(o.timer) ? o.timer : 0, level: o.level === 0 ? 0 : 1 };
        };
        const STAT_KEYS = ['matches', 'rounds', 'wins', 'zimo', 'lose', 'best', 'money'];
        const cleanStats = (o) => {
            o = o && typeof o === 'object' ? o : {}; const r = {};
            STAT_KEYS.forEach(k => { const v = o[k]; r[k] = Number.isInteger(v) ? Math.max(k === 'money' ? -1e9 : 0, Math.min(1e9, v)) : 0; });
            return r;
        };

        // ---------- 手牌輸入記法：123m 456p 789s 11z（z：1–7 = 東南西北中發白）、5h（花 1–8）；[444m] 碰、[123p] 吃、[1111s] 明槓、(1111z) 暗槓 ----------
        function parseTiles(s) {
            const out = []; let ds = [];
            for (const ch of s) {
                if (/\s/.test(ch)) continue;
                if (ch >= '1' && ch <= '9') ds.push(+ch);
                else if (ch === 'm' || ch === 'p' || ch === 's') { if (!ds.length) return null; ds.forEach(d => out.push((ch === 'm' ? 0 : ch === 'p' ? 9 : 18) + d - 1)); ds = []; }
                else if (ch === 'z') { if (!ds.length || ds.some(d => d > 7)) return null; ds.forEach(d => out.push(27 + d - 1)); ds = []; }
                else if (ch === 'h') { if (!ds.length) return null; ds.forEach(d => out.push(34 + d - 1)); ds = []; }
                else return null;
            }
            return ds.length ? null : out;
        }
        function parseHand(str) {
            const res = { concealed: [], melds: [], flowers: [], error: '' }, re = /\[([^\]]*)\]|\(([^)]*)\)|([^[\]()]+)/g;
            let m;
            while ((m = re.exec(String(str || '').slice(0, 200)))) {
                const src = m[1] ?? m[2] ?? m[3], ts = parseTiles(src);
                if (!ts) { res.error = `看不懂「${src.trim()}」`; return res; }
                if (m[3] !== undefined) { ts.forEach(k => (isFlower(k) ? res.flowers : res.concealed).push(k)); continue; }
                const s = ts.slice().sort((a, b) => a - b);
                if (ts.some(isFlower)) { res.error = '花牌不能放在括號裡'; return res; }
                if (s.length === 4 && s.every(k => k === s[0])) res.melds.push({ t: m[2] !== undefined ? 'ankan' : 'kan', k: s[0] });
                else if (m[2] !== undefined) { res.error = '暗槓要寫 4 張相同的牌：(1111z)'; return res; }
                else if (s.length === 3 && s.every(k => k === s[0])) res.melds.push({ t: 'pon', k: s[0] });
                else if (s.length === 3 && s[0] < 27 && s[1] === s[0] + 1 && s[2] === s[0] + 2 && suitOf(s[0]) === suitOf(s[2])) res.melds.push({ t: 'chi', k: s[0] });
                else { res.error = `「${src.trim()}」不是合法的吃 / 碰 / 槓`; return res; }
            }
            return res;
        }

        // ---------- 算台 ----------
        // ctx = { concealed:[種類…]（手上的牌，含胡的那張）, melds:[{t:'chi'|'pon'|'kan'|'ankan',k}], flowers:[花…], win:胡的那張種類 / -1, zimo, seat:0–3（東南西北）, round:0–3, dealer, streak, flags:{haidi,hedi,gangshang,qianggang,tianhu,dihu,renhu,lili,qiqiang} }
        function flowerItems(ctx, add) {
            const fl = [...new Set((ctx.flowers || []).filter(f => Number.isInteger(f) && f >= 34 && f < 42))], seat = (ctx.seat | 0) & 3;
            add('hua', fl.filter(f => f === 34 + seat || f === 38 + seat).length);
            if (fl.length === 8) add('baxian');
            else { if ([34, 35, 36, 37].every(f => fl.includes(f))) add('huagang'); if ([38, 39, 40, 41].every(f => fl.includes(f))) add('huagang'); }
            return fl;
        }
        const FLAG_IDS = ['haidi', 'hedi', 'gangshang', 'qianggang', 'tianhu', 'dihu', 'renhu', 'lili', 'qiqiang'];
        function scoreDecomp(ctx, d, T, wc) {
            const items = [], melds = ctx.melds || [], seat = (ctx.seat | 0) & 3, round = (ctx.round | 0) & 3;
            const add = (id, n = 1) => { if (T[id] > 0 && n > 0) items.push({ id, name: TAI_NAME[id], tai: T[id] * n }); };
            const sets = melds.map(m => ({ t: m.t === 'chi' ? 'seq' : 'tri', k: m.k, open: m.t !== 'ankan' })).concat(d.sets.map(s => ({ t: s.t, k: s.k, open: false })));
            if (!ctx.zimo && ctx.win >= 0) { const s = sets.slice(melds.length).find(x => x.t === 'tri' && x.k === ctx.win); if (s) s.open = true; }   // 點炮胡進來的刻子算明刻
            const menqing = melds.every(m => m.t === 'ankan');
            if (menqing && ctx.zimo) add('buqiuren'); else { if (menqing) add('menqing'); if (ctx.zimo) add('zimo'); }
            const tri = sets.filter(s => s.t === 'tri'), ank = tri.filter(s => !s.open).length;
            if (ank === 5) add('wuanke'); else if (ank === 4) add('sianke'); else if (ank === 3) add('sananke');
            if (tri.length === 5) add('pengpeng');
            if (sets.every(s => s.t === 'seq') && d.pair < 27 && !(ctx.flowers || []).length && d.sets.some(s => (s.k === ctx.win && s.k % 9 <= 5) || (s.k + 2 === ctx.win && s.k % 9 >= 1))) add('pinghu');
            if (melds.length === 5 && melds.every(m => m.t !== 'ankan')) add('quanqiu');
            const tiles = [d.pair, ...sets.flatMap(s => s.t === 'seq' ? [s.k, s.k + 2] : [s.k])];
            if (tiles.every(k => k < 27 && k % 9 >= 1 && k % 9 <= 7)) add('duanyao');
            const suits = new Set(tiles.map(suitOf)), hasH = suits.has(3); suits.delete(3);
            if (suits.size === 0) add('ziyise'); else if (suits.size === 1) add(hasH ? 'hunyise' : 'qingyise');
            const dr = tri.filter(s => s.k >= 31 && s.k <= 33).length;
            if (dr === 3) add('dsy'); else if (dr === 2 && d.pair >= 31 && d.pair <= 33) add('xsy'); else add('sanyuan', dr);
            const ws = tri.filter(s => s.k >= 27 && s.k <= 30);
            if (ws.length === 4) add('dsx'); else if (ws.length === 3 && d.pair >= 27 && d.pair <= 30) add('xsx');
            else ws.forEach(s => { if (s.k === 27 + seat) add('menfeng'); if (s.k === 27 + round) add('quanfeng'); });
            flowerItems(ctx, add);
            FLAG_IDS.forEach(id => { if (ctx.flags && ctx.flags[id]) add(id); });
            if (wc === 1) add('dutin');
            if (ctx.dealer) { add('dealer'); add('lian', Math.max(0, ctx.streak | 0)); }
            return { tai: items.reduce((s, x) => s + x.tai, 0), items, d };
        }
        // 回傳最高台的算法 { tai, items, d } ；不是胡牌 / 張數或牌數不對回傳 null
        function analyze(ctx, T = defaultTai()) {
            const melds = ctx.melds || [], n = 5 - melds.length, cs = ctx.concealed || [];
            if (n < 0 || cs.length !== 3 * n + 2 || !cs.every(k => Number.isInteger(k) && k >= 0 && k < 34)) return null;
            const c = toCounts(cs), u = c.slice();
            for (const m of melds) { if (!(m.k >= 0 && m.k < 34)) return null; if (m.t === 'chi') { if (m.k >= 27 || m.k % 9 > 6) return null; u[m.k]++; u[m.k + 1]++; u[m.k + 2]++; } else u[m.k] += m.t === 'pon' ? 3 : 4; }
            if (u.some(x => x > 4)) return null;
            const ds = decompose(c, n); if (!ds.length) return null;
            let wc = -1;
            if (ctx.win >= 0 && c[ctx.win] > 0) { const c2 = c.slice(); c2[ctx.win]--; wc = waitsOf(c2, n).length; }
            let best = null;
            for (const d of ds) { const r = scoreDecomp(ctx, d, T, wc); if (!best || r.tai > best.tai) best = r; }
            return best;
        }
        // 花牌直接胡（八仙過海 / 七搶一）：不看手牌
        function analyzeFlowerWin(ctx, T = defaultTai()) {
            const items = [], add = (id, n = 1) => { if (T[id] > 0 && n > 0) items.push({ id, name: TAI_NAME[id], tai: T[id] * n }); };
            const fl = flowerItems(ctx, add); if (ctx.flags && ctx.flags.qiqiang && fl.length === 7) add('qiqiang');
            if (ctx.dealer) { add('dealer'); add('lian', Math.max(0, ctx.streak | 0)); }
            return { tai: items.reduce((s, x) => s + x.tai, 0), items, d: null };
        }
        // 結算：w 胡牌者、from 放槍者（-1 = 自摸，三家都付）、tai 不含莊家 / 連莊的台數；輸家若是莊家（或贏家是莊家）再加「莊 + 連莊」台
        function settle(w, from, tai, dealer, streak, o, T) {
            const dt = T.dealer + T.lian * streak, out = [0, 0, 0, 0];
            for (let q = 0; q < 4; q++) {
                if (q === w || (from >= 0 && q !== from)) continue;
                const amt = o.base + (tai + (w === dealer || q === dealer ? dt : 0)) * o.unit;
                out[q] -= amt; out[w] += amt;
            }
            return out;
        }

        // ---------- 牌局規則引擎 ----------
        // 牌局 g：wall（牌牆，前端摸牌、後端補牌）、hands / melds / flowers / rivers 各 4 家、phase（discard 等出牌 | claim 等吃碰槓胡 | qiang 等搶槓 | over）、turn、drawn（剛摸的牌，無 = -1）、last（最後打出的牌 {p,k}）、claims（各家回應）
        const seatWind = (g, p) => (p - g.dealer + 4) & 3, roundWind = (g) => (g.rot >> 2) & 3;
        const sortHand = (g, p) => g.hands[p].sort((a, b) => a - b);
        const removeOne = (arr, k) => { const i = arr.indexOf(k); if (i < 0) return false; arr.splice(i, 1); return true; };
        function newMatch(o) { return { o: cleanOpts(o), dealer: 0, streak: 0, rot: 0, scores: [0, 0, 0, 0], over: false }; }
        function newRound(m, T, shuf = Util.shuffle) {
            const wall = newWall(shuf);
            const g = { wall, wall0: wall.slice(), dealer: m.dealer, streak: m.streak, rot: m.rot, o: m.o, T, hands: [[], [], [], []], melds: [[], [], [], []], flowers: [[], [], [], []], rivers: [[], [], [], []], phase: 'discard', turn: m.dealer, drawn: -1, last: null, claims: null, qiang: null, noCall: true, draws: [0, 0, 0, 0], discards: 0, afterKan: false, result: null, log: '' };
            for (let p = 0; p < 4; p++) g.hands[p] = wall.splice(0, 16);
            for (let i = 0; i < 4 && !g.result; i++) replaceFlowers(g, (g.dealer + i) & 3);
            if (!g.result) drawFor(g, g.dealer, false);
            return g;
        }
        function replaceFlowers(g, p) {
            let f;
            while (!g.result && (f = g.hands[p].find(isFlower)) !== undefined) {
                removeOne(g.hands[p], f); revealFlower(g, p, f);
                if (g.result) return;
                const t = g.wall.pop(); if (t === undefined) { endDraw(g); return; }
                g.hands[p].push(t);
            }
            sortHand(g, p);
        }
        const endDraw = (g) => { g.phase = 'over'; g.claims = null; g.qiang = null; g.result = { type: 'draw' }; g.log = '流局'; };
        // 補花後立刻判斷：集滿 8 張花（八仙過海）或別人已有 7 張而你補到第 8 張（七搶一，由 7 張那位胡牌、補花的人放槍）
        function revealFlower(g, p, f) {
            g.flowers[p].push(f);
            if (g.flowers[p].length === 8) return finishFlowerWin(g, p, -1);
            for (let q = 0; q < 4; q++) if (q !== p && g.flowers[q].length === 7 && !g.flowers[q].includes(f)) return finishFlowerWin(g, q, p, true);
        }
        function finishFlowerWin(g, w, from, qi = false) {
            const ctx = { flowers: g.flowers[w], seat: seatWind(g, w), flags: { qiqiang: qi } }, a = analyzeFlowerWin(ctx, g.T);
            g.phase = 'over'; g.claims = null; g.qiang = null; g.log = qi ? '七搶一' : '八仙過海';
            g.result = { type: 'win', w, from, k: -1, tai: a.tai, items: a.items, deltas: settle(w, from, a.tai, g.dealer, g.streak, g.o, g.T), how: g.log };
        }
        // 摸一張（back = 從牌尾補牌）；遇到花牌就亮出再補。牌摸完回傳 -1 並流局
        function drawFor(g, p, back) {
            let t = back ? g.wall.pop() : g.wall.shift();
            while (t !== undefined && isFlower(t)) { revealFlower(g, p, t); if (g.result) return -1; t = g.wall.pop(); }
            if (t === undefined) { endDraw(g); return -1; }
            g.hands[p].push(t); sortHand(g, p);
            g.drawn = t; g.turn = p; g.phase = 'discard'; g.afterKan = !!back; if (!back) g.draws[p]++;
            return t;
        }
        // 輪到下一家摸牌：牌牆只剩 16 張（牌尾保留）就流局
        function advance(g, p) { g.claims = null; if (g.wall.length <= 16) { endDraw(g); return; } drawFor(g, p, false); }

        const nSetsOf = (g, p) => 5 - g.melds[p].length;
        const canZimo = (g, p) => g.phase === 'discard' && g.turn === p && g.drawn >= 0 && isWin(toCounts(g.hands[p]), nSetsOf(g, p));
        // 輪到我時能暗槓 / 加槓的牌
        function selfKans(g, p) {
            if (g.phase !== 'discard' || g.turn !== p || g.drawn < 0 || g.wall.length < 1) return { ankan: [], jia: [] };
            const c = toCounts(g.hands[p]);
            return { ankan: c.map((x, k) => x === 4 ? k : -1).filter(k => k >= 0), jia: g.melds[p].filter(m => m.t === 'pon' && c[m.k] > 0).map(m => m.k) };
        }
        function doDiscard(g, p, k) {
            if (g.phase !== 'discard' || g.turn !== p || g.hands[p].length % 3 !== 2 || !Number.isInteger(k) || !removeOne(g.hands[p], k)) return false;
            g.rivers[p].push(k); g.last = { p, k }; g.drawn = -1; g.afterKan = false; g.discards++; g.log = '打出 ' + tileName(k);
            g.phase = 'claim'; g.claims = [null, null, null, null];
            for (let q = 0; q < 4; q++) { const o = claimOpts(g, q); if (q === p || !(o.hu || o.pon || o.kan || o.chi.length)) g.claims[q] = { t: 'pass' }; }
            if (g.claims.every(Boolean)) resolveClaims(g);

            const dl = document.createElement('div'); dl.className = 'hands';
            V.names.forEach((n, i) => { const d = document.createElement('div'); d.append(Object.assign(document.createElement('b'), { textContent: `${i === my ? '你' : n} ${r.deltas[i] > 0 ? '+' : ''}${r.deltas[i]}　` })); const row = tilesRow(r.hands[i], 'sm'); row.style.display = 'inline-flex'; d.append(row, ...meldsEl(V.melds[i], 'sm')); dl.append(d); });
            const v = document.createElement('p'); v.id = 'verify'; box.append(dl, v); verifyWall();
        }
        function countRound() {
            if (!V || V.phase !== 'over' || !V.result || lastCounted === V.no) return;
            lastCounted = V.no; const r = V.result; stats.rounds++;
            if (r.type === 'win') { if (r.w === my) { stats.wins++; if (r.from < 0) stats.zimo++; stats.best = Math.max(stats.best, r.tai); } if (r.from === my) stats.lose++; stats.money += r.deltas[my]; }
            if (V.mo) stats.matches++;
            stats = cleanStats(stats); saveStats(); renderStats();
        }
        function tick() {
            const t = $('#timer'); if (!V || V.phase !== 'play' || !V.tl) { t.textContent = ''; t.className = ''; return; }
            const left = Math.max(0, V.tl - Math.floor((Date.now() - V.tt) / 1000));
            t.textContent = `⏱ 剩 ${left} 秒（逾時自動${V.gphase === 'discard' ? '打出剛摸的牌' : '過'}）`; t.className = left <= 10 ? 'hot' : '';
        }
        setInterval(tick, 500);

        $('#soloBtn').onclick = startSolo; $('#hostBtn').onclick = hostRoom; $('#joinBtn').onclick = () => joinRoom(); $('#startBtn').onclick = startMatch;
        $('#nextBtn').onclick = () => { if (M.over) startMatch(); else startRound(); };
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        const leave = () => { clearConn(); location.reload(); };
        $('#leave').onclick = leave; $('#lobbyLeave').onclick = leave;

        fillOpts(); renderTaiEditor(); renderManual(); renderStats();
        if (P2PRoom.roomFromUrl()) {
            $('#joinId').value = P2PRoom.roomFromUrl();
            try { const c = JSON.parse(sessionStorage.getItem(connKey) || 'null'); if (c && c.id === P2PRoom.roomFromUrl() && P2PRoom.validNick(c.nick)) { $('#nick').value = c.nick; joinRoom({ n: 6 }); } } catch (e) { }
        }
    </script>
</body>
