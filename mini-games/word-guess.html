    <template id="help">
        <h3>這是什麼</h3>
        <p>Wordle 類的猜字遊戲：6 次機會，猜出電腦想的<b>四字成語</b>或 <b>5 個字母的英文單字</b>。每猜一次，每個字會變色告訴你離答案多近。完全離線、單機，不連線。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>通勤、排隊時動動腦，每天一題。</li>
        <li>和朋友比「誰猜得比較少次」：每日挑戰全部人同一題，結果可複製貼到群組。</li>
        <li>想練成語或英文單字。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>上方選「成語」或「英文單字」，再選「每日挑戰」（每天一題，以台灣時間換日）或「自由練習」（隨機，可無限玩）。</li>
        <li>英文：用畫面鍵盤（或電腦鍵盤）打滿 5 個字母，按 <kbd>Enter</kbd> 送出。成語：在輸入框打四個字，按「送出」。</li>
        <li>顏色：<b>綠</b>＝字對、位置也對；<b>黃</b>＝答案裡有這個字、但位置不對；<b>灰</b>＝答案裡沒有（重複的字會依出現次數計算）。</li>
        <li>6 次內猜中就贏；每日挑戰完成後會顯示結果與可複製的方塊分享文字。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">答案是 CRANE，你猜 CARES：C 綠；A 黃（CRANE 有 A，但在第 3 個）；R 黃；E 黃；S 灰。<br>成語答案「一心一意」，猜「一帆風順」：第 1 個「一」綠，其餘灰；猜「三心二意」：「心」「意」綠，其餘灰。</div>
        <h3>小提醒</h3>
        <ul>
        <li>成語只接受內建詞庫裡的成語（不是每個成語都有收錄）；英文只接受內建單字庫的字。不在庫內不會扣次數，會提示你換一個。</li>
        <li>統計（勝率、連勝、猜中次數分布）和每日進度存在這台裝置，成語與英文分開計算；自由練習也會計入統計。每日進度只保留最近 30 天。</li>
        <li>頁面下方「清除紀錄」會刪除這個遊戲的所有統計與每日進度（無法復原；頁面會重新載入，進行中的這一局會結束）。存放資料壞掉或被改過時，會自動當成沒有紀錄。</li>
        <li>每日挑戰已完成就不能重玩，想繼續玩請用「自由練習」。</li>
        <li>翻牌有小動畫；系統開啟「減少動態效果」或畫面在背景時會直接顯示結果。</li>
        </ul>
    </template>

        const loadDaily = () => cleanDaily(store.get(DAILY_PREFIX + date, null));
        function saveDaily() {
            const o = loadDaily(); o[mode] = guesses.slice();
            store.set(DAILY_PREFIX + date, o); pruneDaily();
        }

        // ---------- 畫面 ----------
        function buildBoard() {
            const b = $('#board'); b.style.setProperty('--n', N());
            b.replaceChildren(...Array.from({ length: TRIES }, () => {
                const r = document.createElement('div'); r.className = 'r'; r.setAttribute('role', 'row');
                for (let i = 0; i < N(); i++) { const t = document.createElement('div'); t.className = 't' + (mode === 'zh' ? ' zh' : ''); r.append(t); }
                return r;
            }));
            guesses.forEach((w, r) => paintRow(r, w, scoreGuess(w, answer)));
            paintCur();
        }
        function paintRow(r, w, states) {
            const ts = $('#board').children[r].children;
            chars(w).forEach((ch, i) => { ts[i].textContent = ch; ts[i].className = 't' + (mode === 'zh' ? ' zh ' : ' ') + (states ? states[i] : 'filled'); });
        }
        function paintCur() {
            const r = guesses.length; if (r >= TRIES) return;
            const ts = $('#board').children[r].children, cs = chars(cur);
            for (let i = 0; i < N(); i++) { ts[i].textContent = cs[i] || ''; ts[i].className = 't' + (mode === 'zh' ? ' zh' : '') + (cs[i] ? ' filled' : ''); }
        }
        const KB = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'];
        function buildKeys() {
            $('#kb').replaceChildren(...KB.map(row => {
                const d = document.createElement('div'); d.className = 'kr';
                chars(row).forEach(k => {
                    const b = document.createElement('button'); b.dataset.k = k;
                    if (k === '+') { b.textContent = '⏎'; b.className = 'wide'; b.setAttribute('aria-label', '送出'); } else if (k === '-') { b.textContent = '⌫'; b.className = 'wide'; b.setAttribute('aria-label', '刪除'); } else b.textContent = k;
                    b.onclick = () => press(k); d.append(b);
                });
                return d;
            }));
        }
        function paintKeys() {
            const st = keyStates(guesses, answer);
            document.querySelectorAll('#kb button').forEach(b => { b.className = (b.className.replace(/\bk-\w\b/g, '') + (st[b.dataset.k] ? ' k-' + st[b.dataset.k] : '')).trim(); });
            $('#zhChars').replaceChildren(...Object.keys(st).map(ch => {
                const b = document.createElement('button'); b.textContent = ch; b.className = 'sm k-' + st[ch]; b.setAttribute('aria-label', '加入 ' + ch);
                b.onclick = () => { if (chars(cur).length < 4 && !isDone(guesses, answer)) { cur += ch; $('#zh').value = cur; paintCur(); } };
                return b;
            }));
        }
        const say = (t) => { $('#msg').textContent = t; };

        function renderStats() {
            const s = stats[mode];
            $('#stTitle').textContent = `統計（${mode === 'zh' ? '成語' : '英文單字'}）`;
            $('#sgrid').innerHTML = [['玩過', s.p], ['勝率 %', winRate(s)], ['連勝', s.s], ['最長連勝', s.m]].map(([l, v]) => `<div><b>${v}</b><small>${l}</small></div>`).join('');
            const mx = Math.max(1, ...s.d), hit = isWon(guesses, answer) ? guesses.length - 1 : -1;
            $('#dist').replaceChildren(...s.d.flatMap((v, i) => {
                const l = Object.assign(document.createElement('span'), { textContent: i + 1 }), bar = document.createElement('i');
                bar.textContent = v; bar.style.width = Math.max(8, Math.round(v / mx * 100)) + '%'; if (i === hit) bar.className = 'hit';
                return [l, bar];
            }));
        }
        function showResult() {
            const done = isDone(guesses, answer), won = isWon(guesses, answer);
            $('#result').hidden = !done;
            $('#zhBox').hidden = done || mode !== 'zh'; $('#kb').hidden = done || mode !== 'en'; $('#zhChars').hidden = mode !== 'zh';
            if (!done) return;
            $('#resTitle').textContent = won ? `🎉 第 ${guesses.length} 次猜中：${answer.toUpperCase()}` : `答案是「${mode === 'en' ? answer.toUpperCase() : answer}」`;
            $('#share').textContent = shareText(mode, kind === 'daily', date, guesses, answer);
            $('#next').textContent = kind === 'daily' ? '改玩自由練習' : '再玩一題';
        }

        // ---------- 流程 ----------
        function newGame() {
            tok++; cur = ''; $('#zh').value = ''; say(''); date = twDate();
            if (kind === 'daily') { answer = pickDaily(mode, date); guesses = trimGuesses(loadDaily()[mode], answer, mode); } else { const l = MODES[mode].answers; answer = l[rnd(l.length)]; guesses = []; }
            $('#info').textContent = kind === 'daily' ? `${date}（台灣時間）每日挑戰：今天大家同一題` : '自由練習：隨機出題，可無限玩';
            document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
            document.querySelectorAll('#kindSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === kind));
            buildBoard(); paintKeys(); showResult(); renderStats();
            if (isDone(guesses, answer) && kind === 'daily') say('今天已經完成囉，明天再來！');
        }
        function press(k) {
            if (isDone(guesses, answer)) return;
            if (mode === 'zh') return;
            if (k === '+') return submit();
            if (k === '-') cur = cur.slice(0, -1); else if (/^[a-z]$/.test(k) && cur.length < 5) cur += k; else return;
            say(''); paintCur();
        }
        function flipRow(r, w, done) {
            const my = tok, st = scoreGuess(w, answer), ts = $('#board').children[r].children, p = flipPlan(N());
            if (reduced()) { paintRow(r, w, st); return done(); }
            chars(w).forEach((_, i) => setTimeout(() => {
                if (my !== tok) return;
                ts[i].animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(90deg)', offset: .5 }, { transform: 'rotateX(0deg)' }], { duration: FLIP_MS, easing: 'ease-in-out' });
                setTimeout(() => { if (my === tok) ts[i].className = 't' + (mode === 'zh' ? ' zh ' : ' ') + st[i]; }, p.half);
            }, p.starts[i]));
            setTimeout(() => { if (my === tok) done(); }, p.total + 30);
        }
        function submit() {
            if (isDone(guesses, answer)) return;
            const w = cur;
            if (chars(w).length !== N()) return say(mode === 'zh' ? '請輸入四個字' : '字母不夠 5 個');
            if (!validWord(mode, w)) return say(mode === 'zh' ? '詞庫裡沒有這個成語，換一個試試' : '單字庫裡沒有這個字');
            if (guesses.includes(w)) return say('這個已經猜過了');
            const r = guesses.length; guesses.push(w); cur = ''; $('#zh').value = ''; say('');
            if (kind === 'daily') saveDaily();
            const done = isDone(guesses, answer);
            if (done) { stats[mode] = applyResult(stats[mode], isWon(guesses, answer), isWon(guesses, answer) ? guesses.length : 0); store.set(KEY_STATS, stats); }
            paintCur();
            flipRow(r, w, () => { paintKeys(); showResult(); renderStats(); if (done) say(isWon(guesses, answer) ? '太棒了！' : '下次加油'); });
        }

        // ---------- 事件 ----------
        $('#zh').addEventListener('input', (e) => {
            cur = chars($('#zh').value).slice(0, 4).join('');
            if (!e.isComposing) $('#zh').value = cur;
            say(''); paintCur();
        });
        $('#zh').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); } });
        $('#zhGo').onclick = submit;
        addEventListener('keydown', (e) => {
            if (mode !== 'en' || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || '')) return;
            if (e.key === 'Enter') press('+'); else if (e.key === 'Backspace') press('-'); else if (/^[a-z]$/i.test(e.key)) press(e.key.toLowerCase());
        });
        document.querySelectorAll('#modeSeg button').forEach(b => { b.onclick = () => { mode = b.dataset.m; newGame(); }; });
        document.querySelectorAll('#kindSeg button').forEach(b => { b.onclick = () => { kind = b.dataset.k; newGame(); }; });
        $('#next').onclick = () => { kind = 'free'; newGame(); };
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#share').textContent, () => prompt('請手動複製：', $('#share').textContent));
        $('#clearAll').onclick = () => {
            if (!confirm('清除這個遊戲的所有統計與每日進度？無法復原。頁面會重新載入，正在進行的這一局會結束。')) return;
            try { Object.keys(localStorage).filter(k => k === KEY_STATS || k.startsWith(DAILY_PREFIX)).forEach(k => localStorage.removeItem(k)); } catch (e) { }
            location.reload();
        };

        buildKeys(); pruneDaily(); newGame();
    </script>
</body>

</html>
