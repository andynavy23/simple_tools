    <meta property="og:title" content="終極井字棋" />
    <meta property="og:description" content="9 個小棋盤組成的井字棋，本機雙人或連線對戰。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />

    <title>終極井字棋</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <template id="help">
        <h3>這是什麼</h3>
        <p>終極井字棋：大棋盤由 9 個小井字棋組成。你下在小棋盤的哪一格，對手下一步就必須下在大棋盤的對應位置。可和電腦、同一台裝置的朋友，或連線的朋友對戰。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>普通井字棋太容易平手，想要有策略的版本</li>
        <li>一個人想練習、或和朋友同機輪流下</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li><b>和電腦下</b>：選難度（簡單＝亂下合法步；普通＝能贏就贏、會擋你的連線、避免送你去好位置；困難＝向前搜尋數步），按「和電腦下」。你是 X，電腦是 O，之後每局輪流先手</li>
        <li><b>本機雙人</b>：同一台輪流點</li>
        <li><b>連線</b>：輸入暱稱按「建立房間」，傳邀請連結；朋友輸入暱稱按「加入」。房主是 X、朋友是 O</li>
        <li>發亮的綠框小棋盤就是這一步可以下的地方；點空格落子</li>
        <li><b>手機</b>：總覽下方有放大的「焦點面板」，就是目前要下的小棋盤，在那裡點格子落子；若可任選小棋盤，先點上方總覽的某個小棋盤，再到面板落子</li>
        </ol>
        <h3>規則</h3>
        <ul>
        <li>在小棋盤連成一線就佔領那一區；小棋盤填滿沒人連線算平手區</li>
        <li>如果對應的小棋盤已經結束，對手可以任選一個小棋盤</li>
        <li>先在大棋盤連成一線的人獲勝；全部分出勝負仍沒連線則平手</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">你（X）下在第 1 區的右下格（第 9 格），電腦就必須下在第 9 區（大棋盤的右下）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>困難模式電腦會想一下，在手機上也只需要不到一秒</li>
        <li>單機與本機雙人完全不連網</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <style>
        :root {
            --wrap-w: 560px;
            --x: #0a84ff;
            --o: #ff9f0a;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row input {
            flex: 1 1 130px;
        }

        #soloBtn {
            flex: 1 1 160px;
        }

        .status {
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 12px;
            min-height: 1.6em;
        }

        .sb {
            position: relative;
            display: grid;

        }

            opacity: 1;

        }

        .sb.done {

        }

        .c {
            aspect-ratio: 1;
            padding: 0;
            font-size: clamp(14px, 5vw, 24px);
            font-weight: 800;
            border-radius: 8px;
            background: var(--card, #fff);
            min-width: 0;

        }

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>終極井字棋</h1>
        <p class="sub">你下在小棋盤的哪一格，對手就必須下在大棋盤的對應位置。先在大棋盤連成一線的人獲勝。</p>

        <div class="card" id="menu">
            <h2>單機</h2>
            <div class="row">
                <button class="primary" id="soloBtn">和電腦下</button>
                <label for="cpuLevel" class="muted">難度</label>
                <select id="cpuLevel"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select>
            </div>
            <div class="row"><button id="local">本機雙人（同一台輪流）</button></div>
            <h2 style="margin-top:18px">和朋友連線</h2>
            <div class="row"><input id="nick" maxlength="10" placeholder="連線暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button id="host">建立房間</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="join">加入</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div class="card" id="game" hidden>
            <div class="status" id="status" role="status"></div>
            <div id="board"></div>
            <div id="focus"><div id="focusTitle"></div><div id="focusGrid"></div></div>
            <div class="row" style="justify-content:center;margin-top:14px">
                <button class="primary" id="again" hidden>再來一局</button>
                <button id="copy" hidden>複製邀請連結</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

    <script>
        // --- pure ---
        const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
        // 9 格中誰連成一線（只看 1 / 2；3 = 平手的小棋盤，不算任何一方）
        const lineWinner = (a) => { for (const [x, y, z] of LINES) if (a[x] && a[x] <= 2 && a[x] === a[y] && a[x] === a[z]) return a[x]; return 0; };

        // state：cells[b][c]（b = 小棋盤、c = 小棋盤內的格），small[b]（0 進行中 / 1 / 2 / 3 平手），next（必須下的小棋盤，-1 = 任選）
        function newGame(first = 1) { return { cells: Array.from({ length: 9 }, () => new Array(9).fill(0)), small: new Array(9).fill(0), turn: first, next: -1, winner: 0, draw: false, last: null }; }

        function canPlay(s, who, b, c) {
            return !s.winner && !s.draw && who === s.turn && Number.isInteger(b) && Number.isInteger(c) && b >= 0 && b < 9 && c >= 0 && c < 9
                && s.small[b] === 0 && s.cells[b][c] === 0 && (s.next === -1 || s.next === b);
        }
        // 合法就落子並回傳 true
        function play(s, who, b, c) {
            if (!canPlay(s, who, b, c)) return false;
            s.cells[b][c] = who; s.last = [b, c];
            const w = lineWinner(s.cells[b]);
            if (w) s.small[b] = w; else if (s.cells[b].every(v => v)) s.small[b] = 3;
            const big = lineWinner(s.small);
            if (big) s.winner = big;
            else if (s.small.every(v => v)) s.draw = true;                  // 全部分出勝負仍沒有連線：平手
            s.next = s.small[c] === 0 ? c : -1;                            // 對應的小棋盤已結束：對手任選
            if (!s.winner && !s.draw) s.turn = who === 1 ? 2 : 1;
            return true;
        }

        function validState(s) {
            const okCell = (v) => v === 0 || v === 1 || v === 2;
            return !!s && Array.isArray(s.cells) && s.cells.length === 9 && s.cells.every(r => Array.isArray(r) && r.length === 9 && r.every(okCell))
                && Array.isArray(s.small) && s.small.length === 9 && s.small.every(v => Number.isInteger(v) && v >= 0 && v <= 3)
                && (s.turn === 1 || s.turn === 2) && Number.isInteger(s.next) && s.next >= -1 && s.next <= 8 && (s.winner === 0 || s.winner === 1 || s.winner === 2) && typeof s.draw === 'boolean'
                && (s.last === null || (Array.isArray(s.last) && s.last.length === 2 && s.last.every(v => Number.isInteger(v) && v >= 0 && v < 9)));
        }

        // 焦點面板要放大的小棋盤：必須下的（next）優先；任選時用玩家點選的 sel（須仍在進行中）；否則 -1
        const focusBoard = (s, sel) => (s.next >= 0 ? s.next : (sel >= 0 && sel < 9 && s.small[sel] === 0 ? sel : -1));

        // ---------- 電腦對手（單機）----------
        const cloneG = (s) => ({ cells: s.cells.map(r => r.slice()), small: s.small.slice(), turn: s.turn, next: s.next, winner: s.winner, draw: s.draw, last: s.last });
        // 目前輪到的人所有合法步 [b, c]（和 canPlay 一致）
        function legalMoves(s) {
            const out = [];
            if (s.winner || s.draw) return out;
            for (let b = 0; b < 9; b++) {
                if (s.small[b] !== 0 || (s.next !== -1 && s.next !== b)) continue;
                for (let c = 0; c < 9; c++) if (s.cells[b][c] === 0) out.push([b, c]);
            }
            return out;
        }
        // who 在這個 9 格上「再下一格就連線」的空格
        const winCells = (a, who) => { const r = []; for (const l of LINES) { const m = l.filter(i => a[i] === who).length, e = l.filter(i => a[i] === 0); if (m === 2 && e.length === 1) r.push(e[0]); } return r; };
        const pickOne = (arr, rand) => arr[Math.floor(rand() * arr.length)];

        // 普通：能贏就贏；贏小棋盤 > 擋對手在這個小棋盤的連線 > 其他；並避免把對手送到他能贏小棋盤（或贏整局）的棋盤、或送去「任選」
        function scoreMove(s, b, c, rand) {
            const who = s.turn, opp = 3 - who, t = cloneG(s);
            play(t, who, b, c);
            if (t.winner === who) return 1e6;
            let sc = rand() * 4;
            if (t.small[b] === who) sc += 100 + (b === 4 ? 20 : 0);
            else if (winCells(s.cells[b], opp).includes(c)) sc += 60;
            sc += c === 4 ? 3 : [0, 2, 6, 8].includes(c) ? 2 : 0;
            if (!t.winner && !t.draw) {
                if (t.next === -1) sc -= 40;
                else {
                    const oc = winCells(t.cells[t.next], opp);
                    if (oc.length) sc -= 80;
                    for (const k of oc) { const u = cloneG(t); play(u, opp, t.next, k); if (u.winner === opp) sc -= 1000; }
                }
            }
            return sc;
        }

        // 困難：靜態評分（小棋盤勝負 + 小棋盤內的威脅 + 大棋盤的連線潛力），從 me 的角度
        function evalPos(s, me) {
            const BW = [3, 2, 3, 2, 4, 2, 3, 2, 3], opp = 3 - me; let v = 0;
            for (let b = 0; b < 9; b++) {
                if (s.small[b] === me) v += BW[b] * 10; else if (s.small[b] === opp) v -= BW[b] * 10;
                else if (s.small[b] === 0) for (const l of LINES) {
                    const m = l.filter(i => s.cells[b][i] === me).length, o = l.filter(i => s.cells[b][i] === opp).length;
                    if (m && !o) v += m === 2 ? 3 : 0.5; else if (o && !m) v -= o === 2 ? 3 : 0.5;
                }
            }
            for (const l of LINES) {
                const m = l.filter(i => s.small[i] === me).length, o = l.filter(i => s.small[i] === opp).length, d = l.filter(i => s.small[i] === 3).length;
                if (d) continue;
                if (m && !o) v += m === 2 ? 25 : 4; else if (o && !m) v -= o === 2 ? 25 : 4;
            }
            return v;
        }
        function search(s, depth, alpha, beta, me, ctr) {
            if (s.winner) return s.winner === me ? 1e5 + depth : -1e5 - depth;
            if (s.draw) return 0;
            if (depth === 0 || ctr.n++ > ctr.max) return evalPos(s, me);
            const max = s.turn === me; let best = max ? -Infinity : Infinity;
            for (const [b, c] of legalMoves(s)) {
                const t = cloneG(s); play(t, s.turn, b, c);
                const v = search(t, depth - 1, alpha, beta, me, ctr);
                if (max) { if (v > best) best = v; if (v > alpha) alpha = v; } else { if (v < best) best = v; if (v < beta) beta = v; }
                if (alpha >= beta) break;
            }
            return best;
        }

        // 電腦替「目前輪到的人」選一步 [b, c]；level：easy 隨機合法步 / normal 規則評分 / hard 限深 alpha-beta（depth 層、最多約 max 個節點）
        // ponytail: hard 只搜 5 層 + 節點上限，沒有置換表；要更強可加深度與走法排序
        function cpuMove(s, level = 'normal', rand = Math.random, depth = 5, max = 120000) {
            const mv = legalMoves(s);
            if (!mv.length) return null;
            if (level === 'easy') return pickOne(mv, rand);
            if (level === 'normal') { const sc = mv.map(([b, c]) => scoreMove(s, b, c, rand)), top = Math.max(...sc); return mv[sc.indexOf(top)]; }
            const ctr = { n: 0, max }; let bestV = -Infinity, best = null;
            for (const i of mv.map((m, i) => [rand(), i]).sort((x, y) => x[0] - y[0]).map(x => x[1])) {
                const [b, c] = mv[i], t = cloneG(s); play(t, s.turn, b, c);
                const v = search(t, depth - 1, bestV, Infinity, s.turn, ctr);
                if (v > bestV || !best) { bestV = v; best = [b, c]; }
            }
            return best;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let mode = 'menu', S = null, room = null, myPlayer = 0, names = ['', ''], firstNext = 1, hostId = '';
        const MARK = ['', 'X', 'O'];
        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => ['#soloBtn', '#local', '#host', '#join', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });

        function build() {
            $('#board').replaceChildren(...Array.from({ length: 9 }, (_, b) => {
                const sb = document.createElement('div'); sb.className = 'sb';
                for (let c = 0; c < 9; c++) { const k = document.createElement('button'); k.className = 'c'; k.setAttribute('aria-label', `第 ${b + 1} 區第 ${c + 1} 格`); k.onclick = () => onCell(b, c); sb.append(k); }
                return sb;
            }));
        }

        const mq = matchMedia('(max-width:600px), (pointer:coarse)');
        let focusSel = -1, lastKey = '';
        function render() {
            if (!S) return;
            const key = String(S.last);
            if (key !== lastKey) { lastKey = key; focusSel = -1; }       // 每下一步就清掉手選的焦點
            const myTurn = mode === 'local' || S.turn === myPlayer, over = S.winner || S.draw;
            const fb = focusBoard(S, focusSel);
            $('#game').classList.toggle('focus-on', mq.matches);
            [...$('#board').children].forEach((sb, b) => {
                const active = !over && myTurn && S.small[b] === 0 && (S.next === -1 || S.next === b);
                sb.className = 'sb' + (active ? ' active' : '') + (S.small[b] ? ' done' : '') + (b === fb ? ' focused' : '');
                sb.querySelector('.big')?.remove();
                [...sb.querySelectorAll('.c')].forEach((k, c) => {
                    const v = S.cells[b][c];
                    k.textContent = MARK[v]; k.className = 'c' + (v ? ' ' + 'xo'[v - 1] : '') + (S.last && S.last[0] === b && S.last[1] === c ? ' last' : '');
                    k.disabled = !active || v !== 0 || (mode === 'host' && (!room || room.players.length < 2));
                });
                if (S.small[b]) { const big = document.createElement('div'); big.className = 'big' + (S.small[b] <= 2 ? ' ' + 'xo'[S.small[b] - 1] : ''); big.textContent = S.small[b] === 3 ? '＝' : MARK[S.small[b]]; sb.append(big); }
            });
            renderFocus(fb, myTurn, over);
            const who = (p) => (mode === 'local' ? MARK[p] : (names[p - 1] || MARK[p]));
            const mk = (p) => `<b class="${'xo'[p - 1]}">${MARK[p]}</b>`;
            let text;
            if (S.winner) text = `${mk(S.winner)} ${who(S.winner)} 獲勝！`;
            else if (S.draw) text = '平手';
            else if (mode === 'host' && room && room.players.length < 2) text = '等待玩家加入…';
            else if (mode === 'cpu' && S.turn === 2) text = `${mk(2)} 電腦思考中…`;
            else text = mode === 'local' ? `輪到 ${mk(S.turn)}${S.next === -1 ? '（任選小棋盤）' : `（第 ${S.next + 1} 區）`}` : (S.turn === myPlayer ? `${mk(S.turn)} 輪到你了${S.next === -1 ? '（任選小棋盤）' : `（第 ${S.next + 1} 區）`}` : `${mk(S.turn)} 輪到 ${who(S.turn)}`);
            $('#status').innerHTML = text;
            $('#again').hidden = !((S.winner || S.draw) && (mode === 'local' || mode === 'host' || mode === 'cpu'));
            $('#copy').hidden = mode !== 'host';
        }
        function renderFocus(fb, myTurn, over) {
            const g = $('#focusGrid');
            $('#focusTitle').textContent = fb < 0 ? '請先點上方一個小棋盤' : `第 ${fb + 1} 區`;
            if (g.children.length !== 9) g.replaceChildren(...Array.from({ length: 9 }, (_, c) => { const k = document.createElement('button'); k.className = 'fc'; k.onclick = () => onCell(+g.dataset.b, c); return k; }));
            g.dataset.b = fb;
            [...g.children].forEach((k, c) => {
                const v = fb < 0 ? 0 : S.cells[fb][c];
                k.textContent = MARK[v]; k.setAttribute('aria-label', `焦點第 ${c + 1} 格`);
                k.className = 'fc' + (v ? ' ' + 'xo'[v - 1] : '') + (S.last && S.last[0] === fb && S.last[1] === c ? ' last' : '');
                k.disabled = fb < 0 || over || !myTurn || S.small[fb] !== 0 || v !== 0 || (mode === 'host' && (!room || room.players.length < 2));
            });
        }
        const show = (screen) => { $('#menu').hidden = screen !== 'menu'; $('#game').hidden = screen !== 'game'; };

        let cpuTimer = 0;
        // 單機：你是 X（1），電腦是 O（2）；輪到電腦時稍等一下再下
        function cpuTurn() {
            clearTimeout(cpuTimer);
            if (mode !== 'cpu' || !S || S.winner || S.draw || S.turn !== 2) return;
            cpuTimer = setTimeout(() => { const m = cpuMove(S, $('#cpuLevel').value); if (m && play(S, 2, m[0], m[1])) render(); }, 600 + Util.rnd(300));
        }
        function startSolo() { mode = 'cpu'; myPlayer = 1; names = ['你', '電腦']; S = newGame(1); firstNext = 2; build(); show('game'); render(); }
        function startLocal() { mode = 'local'; S = newGame(1); firstNext = 2; build(); show('game'); render(); }

        const readNick = () => { const n = $('#nick').value.trim(); if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; } return n; };
        const onNetError = (err, message) => { netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } };
        function publish() { render(); if (mode === 'host' && room) room.broadcast({ type: 'STATE', s: S, names }); }

        function hostRoom() {
            const nick = readNick(); if (!nick) return;
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: 2,
                onReady(r) { mode = 'host'; myPlayer = 1; hostId = r.id; names = [nick, '']; history.replaceState('', document.title, location.pathname + '#' + r.id); S = newGame(1); firstNext = 2; build(); show('game'); render(); },
                onJoin(p) { names = [nick, p.nick]; S = newGame(1); firstNext = 2; publish(); },
                onLeave() { names = [nick, '']; S = newGame(1); firstNext = 2; publish(); },
                // 房主是 X（1）、成員是 O（2）：成員送來的一律當作 O 的一步，由 play() 驗證輪次與位置
                onMessage(p, d) { if (d && d.type === 'MOVE' && play(S, 2, d.b, d.c)) publish(); },
                onError: onNetError,
            });
        }
        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.join(id, {
                nick,
                onJoined() { mode = 'guest'; myPlayer = 2; build(); show('game'); $('#status').textContent = '已加入，等待房主…'; },
                onMessage(d) {
                    if (!d || d.type !== 'STATE' || !validState(d.s)) return;
                    S = d.s;
                    if (Array.isArray(d.names) && d.names.length === 2 && d.names.every(n => typeof n === 'string' && n.length <= 12)) names = d.names;
                    render();
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (mode === 'guest') { alert('房主已離開，遊戲結束'); location.reload(); } },
                onError: onNetError,
            });
        }

        $('#board').addEventListener('click', (e) => {          // 手機：點總覽的小棋盤 = 設為焦點（任選時才有意義）
            const sb = e.target.closest('.sb');
            if (!$('#game').classList.contains('focus-on') || !sb || !S) return;
            const b = [...$('#board').children].indexOf(sb);
            if (S.next === -1 && S.small[b] === 0) { focusSel = b; render(); }
        });

        function onCell(b, c) {
            if (mode === 'local') { if (play(S, S.turn, b, c)) render(); }
            else if (mode === 'cpu') { if (play(S, 1, b, c)) { render(); cpuTurn(); } }
            else if (mode === 'host') { if (play(S, 1, b, c)) publish(); }
            else if (mode === 'guest' && room && S && canPlay(S, myPlayer, b, c)) room.send({ type: 'MOVE', b, c });
        }

        $('#soloBtn').onclick = startSolo;
        $('#local').onclick = startLocal; $('#host').onclick = hostRoom; $('#join').onclick = joinRoom;
        $('#again').onclick = () => { clearTimeout(cpuTimer); S = newGame(firstNext); firstNext = firstNext === 1 ? 2 : 1; if (mode === 'host') publish(); else { render(); cpuTurn(); } };
        $('#copy').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copy'), url, () => prompt('請手動複製邀請連結：', url)); };
        $('#leave').onclick = () => location.reload();
        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
        show('menu');
    </script>
</body>

</html>
