    <template id="help">
        <h3>這是什麼</h3>
        <p>9 路小棋盤的圍棋：黑棋先手，輪流在交叉點下子，圍住的地盤（加上盤面的子）多的人獲勝。支援提子、禁著點（自殺禁著）、劫、虛手、雙方連續虛手後的死子標記與數子。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>一個人練習：「單機對電腦」，不用連線，可選簡單 / 普通。</li>
        <li>兩人共用一支手機：「同機雙人」。</li>
        <li>和遠方朋友對戰：建立房間、傳邀請連結，可計時、悔棋、求和、認輸。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li><b>落子</b>：點棋盤上的交叉點會先出現半透明的「預覽子」，確認位置對了再按「確認落子」（或再點同一點一次）；點別處會改選。這樣手指點歪不會直接下錯。</li>
        <li><b>提子</b>：一塊相連的子，上下左右沒有空點（氣）就會被提走。<b>禁著點</b>：不能下在下完自己那塊沒有氣的位置（自殺），除非這一手同時提掉對方的子。</li>
        <li><b>劫</b>：預設「超劫」（positional superko）：任何一手都不能讓整個盤面回到先前出現過的樣子；選「簡單劫」則只禁止立刻提回、讓盤面回到上一手之前的樣子。換個地方下一手（找劫材）後就可以提回。</li>
        <li><b>虛手</b>：不想下就按「虛手」。雙方連續虛手後進入數子：點選棋盤上的死子（整塊一起標記，再點取消），電腦會先把「只剩一口氣」的子標為死子供你調整。連線時雙方都按「確認結果」才算數；有爭議可按「繼續對局」，之後依輪替繼續下。</li>
        <li><b>數子</b>：「中國數子」＝盤面活子數＋圍住的空點；「日本數目」＝圍住的空點＋提掉的子（含終局標記的死子）。白棋加貼目（可選 0 / 5.5 / 6.5 / 7 / 7.5；中國預設 7.5，日本預設 7）。兩色都鄰接的空點不算地。</li>
        <li><b>悔棋 / 提示</b>：單機可直接悔棋與提示；連線要對手同意。「求和」＝雙方同意和局；「認輸」直接判負。</li>
        <li><b>棋譜</b>：「複製 SGF」或「下載 SGF」取得標準 SGF 文字，可貼到其他圍棋軟體。</li>
        <li><b>連線</b>：輸入暱稱、選執色與計時（每方 5 / 10 / 15 分鐘，每步加 0 / 5 / 10 秒），按「建立房間」再「複製邀請連結」；朋友開連結、輸入暱稱按「加入」。只能 1 對 1。房主端驗證每一手（含禁著與劫），非法的手一律拒絕；逾時判負；對手斷線時計時暫停，同暱稱重連回到原棋局。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">黑 A、白各下數手後，白子在角落只剩一口氣：黑下在它最後一口氣上，白子被提走，黑的「提子」+1。若白想立刻提回、盤面會和上一手前一模一樣，這就是劫，必須先下別處。</div>
        <h3>小提醒</h3>
        <ul>
        <li>難度：簡單帶隨機失誤；普通會看提子、打吃、救子與對手的下一手（每步不到 0.3 秒）。電腦只會自動判斷「單口氣」的死子，複雜的死活請自己標記。</li>
        <li>單局最多 400 手（含虛手），到了自動進入數子，避免無限對局。</li>
        <li>進行中的單機棋局會自動存在這台裝置（鍵 go9_game），下次開啟可「繼續上一局」；結束後自動清除，也可按「放棄」。連線棋局不存，房主關閉頁面棋局就結束。</li>
        <li>勝負統計（go9_stats）依難度與連線記勝 / 負 / 和，只有幾個數字不會變多；「清除勝負紀錄」或「清除全部本機資料」前會先確認，無法復原（頁面會重新載入、進行中的這一局會結束）。選項記在 go9_opts。三個鍵都可用右上角的備份匯出 / 載入；資料壞掉時會自動用預設值或重新開局。</li>
        </ul>
    </template>

        <h1>圍棋 9×9</h1>
        <p class="sub">提子、禁著、劫、虛手與數子的完整小棋盤圍棋，可對電腦、同機雙人或連線。</p>

        <div class="card" id="menu">

    <script>
        // --- pure ---
        // 棋盤：長度 81 的陣列，索引 = 列 * 9 + 行；0 空、1 黑、2 白。手：0–80 落子、-1 虛手、-2 爭議後繼續對局（不換手）。
        const N = 9, NN = 81, MAXMOVES = 400;
        const other = (p) => 3 - p;
        const NB = Array.from({ length: NN }, (_, i) => {
            const r = i / 9 | 0, c = i % 9, o = [];
            if (r > 0) o.push(i - 9); if (r < 8) o.push(i + 9); if (c > 0) o.push(i - 1); if (c < 8) o.push(i + 1);
            return o;
        });
        const KOS = ['super', 'simple'], RULES = ['area', 'terr'], LV = ['easy', 'normal'], KOMIS = [0, 5.5, 6.5, 7, 7.5];
        const defKomi = (rule) => (rule === 'terr' ? 7 : 7.5);

        // i 所在的一塊棋：{ stones, libs(氣) }
        function groupOf(b, i) {
            const col = b[i], st = [i], seen = new Set([i]), libs = new Set();
            for (let k = 0; k < st.length; k++) for (const n of NB[st[k]]) {
                if (b[n] === 0) libs.add(n); else if (b[n] === col && !seen.has(n)) { seen.add(n); st.push(n); }
            }
            return { stones: st, libs: [...libs] };
        }
        // p 下在 i：回傳 { b: 新棋盤, cap: 被提的點 }；已有子或自殺（沒提到子而自己無氣）回傳 null。不檢查劫。
        function place(b, i, p) {
            if (!Number.isInteger(i) || i < 0 || i >= NN || b[i] !== 0) return null;
            const nb = b.slice(), cap = []; nb[i] = p;
            for (const n of NB[i]) if (nb[n] === other(p)) {
                const g = groupOf(nb, n);
                if (!g.libs.length) for (const s of g.stones) { nb[s] = 0; cap.push(s); }
            }
            return groupOf(nb, i).libs.length ? { b: nb, cap } : null;
        }
        const key = (b) => b.join('');

        // 棋局：turn 輪到誰、caps[p] = p 提掉的子數、cur / prev = 目前 / 上一手之前的盤面（簡單劫用）、seen = 出現過的盤面（超劫用）
        function newGame(ko = 'super') {
            const b = new Array(NN).fill(0), k = key(b);
            return { ko, b, turn: 1, moves: [], caps: [0, 0, 0], passes: 0, over: false, last: -1, cur: k, prev: null, seen: new Set([k]) };
        }
        // 合法回傳 ''，否則原因：over | occupied | suicide | ko
        function check(g, i) {
            if (g.over) return 'over';
            if (i === -1) return '';
            const r = place(g.b, i, g.turn);
            if (!r) return Number.isInteger(i) && i >= 0 && i < NN && g.b[i] === 0 ? 'suicide' : 'occupied';
            const k = key(r.b);
            return (g.ko === 'super' ? g.seen.has(k) : k === g.prev) ? 'ko' : '';
        }
        // 下一手（-1 虛手、-2 繼續對局）；非法回傳 false 且不改動棋局
        function play(g, i) {
            if (i === -2) {
                if (g.passes < 2 || g.moves.length >= MAXMOVES) return false;
                g.passes = 0; g.over = false; g.moves.push(-2); return true;
            }
            if (check(g, i)) return false;
            const p = g.turn;
            if (i === -1) { g.passes++; g.prev = null; }
            else {
                const r = place(g.b, i, p);
                g.b = r.b; g.caps[p] += r.cap.length; g.passes = 0; g.prev = g.cur; g.cur = key(r.b); g.seen.add(g.cur);
            }
            g.last = i; g.moves.push(i); g.turn = other(p);
            if (g.passes >= 2 || g.moves.length >= MAXMOVES) g.over = true;
            return true;
        }
        // 重播整串手；任何一手非法（或型別不對）回傳 null
        function gameFrom(ko, moves) {
            if (!KOS.includes(ko) || !Array.isArray(moves) || moves.length > MAXMOVES) return null;
            const g = newGame(ko);
            for (const m of moves) if (!Number.isInteger(m) || !play(g, m)) return null;
            return g;
        }
        const turnAt = (moves) => (moves.filter(m => m !== -2).length % 2 === 0 ? 1 : 2);
        // 悔棋後的手序：who = 0 退一手；who = 1|2 退到「輪到 who」。沒得退回傳 null
        function undoMoves(moves, who) {
            const m = moves.slice();
            if (!m.length) return null;
            m.pop();
            while (who && m.length && turnAt(m) !== who) m.pop();
            return who && turnAt(m) !== who ? null : m;
        }

        // 終局：dead = 被標記的死子；回傳 { s1, s2(含貼目), diff, winner(0 和 / 1 黑 / 2 白), own(每點的地盤歸屬), rs(SGF 結果) }
        function score(g, dead, rule, komi) {
            const b = g.b.slice(), deadN = [0, 0, 0], stones = [0, 0, 0], terr = [0, 0, 0], own = new Array(NN).fill(0), seen = new Set();
            for (const i of dead) if (b[i]) { deadN[b[i]]++; b[i] = 0; }
            for (const v of b) stones[v]++;
            for (let i = 0; i < NN; i++) {
                if (b[i] || seen.has(i)) continue;
                const pts = [i], touch = new Set(); seen.add(i);
                for (let k = 0; k < pts.length; k++) for (const n of NB[pts[k]]) {
                    if (b[n]) touch.add(b[n]); else if (!seen.has(n)) { seen.add(n); pts.push(n); }
                }
                if (touch.size === 1) { const o = [...touch][0]; for (const q of pts) own[q] = o; terr[o] += pts.length; }
            }
            const s = rule === 'terr'
                ? [0, terr[1] + g.caps[1] + deadN[2], terr[2] + g.caps[2] + deadN[1]]
                : [0, stones[1] + terr[1], stones[2] + terr[2]];
            s[2] += komi;
            const diff = s[1] - s[2], winner = diff > 0 ? 1 : diff < 0 ? 2 : 0;
            return { s1: s[1], s2: s[2], diff, winner, own, rs: winner ? (winner === 1 ? 'B+' : 'W+') + Math.abs(diff) : '0' };
        }
        // ponytail: 只自動標「只剩一口氣」的子；兩隻眼、緊氣等複雜死活交給玩家點選
        function suggestDead(b) {
            const out = new Set();
            for (let i = 0; i < NN; i++) if (b[i] && !out.has(i)) { const g = groupOf(b, i); if (g.libs.length === 1) g.stones.forEach(s => out.add(s)); }
            return [...out].sort((a, c) => a - c);
        }
        // 點一顆子：整塊標為死子 / 取消
        function toggleDead(b, dead, i) {
            if (!Number.isInteger(i) || i < 0 || i >= NN || !b[i]) return dead;
            const st = groupOf(b, i).stones, set = new Set(dead);
            if (set.has(i)) st.forEach(x => set.delete(x)); else st.forEach(x => set.add(x));
            return [...set].sort((a, c) => a - c);
        }
        const cleanDead = (b, d) => (Array.isArray(d) ? [...new Set(d.filter(i => Number.isInteger(i) && i >= 0 && i < NN && b[i]))].sort((a, c) => a - c) : []);

        // SGF 文字
        const sgfEsc = (s) => String(s).replace(/[\]\\]/g, '\\$&');
        const sgfPt = (i) => (i < 0 ? '' : 'abcdefghi'[i % 9] + 'abcdefghi'[i / 9 | 0]);
        function sgf(moves, o = {}) {
            let s = `(;GM[1]FF[4]CA[UTF-8]SZ[9]KM[${o.komi || 0}]RU[${o.rule === 'terr' ? 'Japanese' : 'Chinese'}]`;
            if (o.pb) s += `PB[${sgfEsc(o.pb)}]`;
            if (o.pw) s += `PW[${sgfEsc(o.pw)}]`;
            if (o.re) s += `RE[${sgfEsc(o.re)}]`;
            let p = 1;
            for (const m of moves) { if (m === -2) continue; s += `;${p === 1 ? 'B' : 'W'}[${sgfPt(m)}]`; p = other(p); }
            return s + ')';
        }

        // ---------- 電腦對手：啟發式（提子、救子、打吃、自打吃、眼位、位置）+ 看對手一手 ----------
        // 從 g.turn 的角度替落在 i 的一手打分；非法 -Infinity
        function evalMove(g, i) {
            if (check(g, i)) return -Infinity;

            if (!r.cap.length && NB[i].every(n => b[n] === p)) return -50;                 // 填自己的眼

        // 回傳電腦要下的點，-1 = 虛手。easy：加大雜訊與偶爾隨機；normal：再扣掉對手最佳回應的一半。單步遠小於 300ms

            if (g.passes === 1) {                                                          // 對手剛虛手：自己已領先就跟著虛手收官
                const s = score(g, suggestDead(g.b), 'area', komi);
                if ((g.turn === 1 ? s.diff : -s.diff) > 0) return -1;
            }
            if (!sc.length) return -1;
            sc.sort((a, c) => c[1] - a[1]);

            const best = (arr) => arr.reduce((a, c) => (c[1] > a[1] ? c : a))[0];
            if (level === 'easy') {

                const h = cloneAfter(g, i); let o = 0;

        // ---------- 存檔 / 選項 / 連線的驗證 ----------
        const cleanOpts = (o) => {
            o = o && typeof o === 'object' ? o : {};
            const rule = RULES.includes(o.rule) ? o.rule : 'area';
            return { level: LV.includes(o.level) ? o.level : 'normal', side: ['b', 'w', 'r'].includes(o.side) ? o.side : 'b', ko: KOS.includes(o.ko) ? o.ko : 'super', rule, komi: KOMIS.includes(o.komi) ? o.komi : defKomi(rule) };
        };
        const STAT_KEYS = ['easy', 'normal', 'net'];           // 各為 [勝, 負, 和]
        const cleanStats = (raw) => {
            const out = {};
            for (const k of STAT_KEYS) {
                const a = raw && typeof raw === 'object' && Array.isArray(raw[k]) ? raw[k] : [];

        };
        const tally = (stats, k, outcome) => { if (STAT_KEYS.includes(k)) { const a = stats[k], i = outcome === 'w' ? 0 : outcome === 'l' ? 1 : 2; if (a[i] < 99999) a[i]++; } return stats; };
        // 單機存檔：{ v:1, mode, level, me, ko, rule, komi, moves }；壞資料回傳 null
        function cleanSave(raw) {
            if (!raw || typeof raw !== 'object' || raw.v !== 1 || (raw.mode !== 'cpu' && raw.mode !== 'local')) return null;

            if (!g || !g.moves.length) return null;
            return { mode: raw.mode, level: LV.includes(raw.level) ? raw.level : 'normal', me: raw.me === 2 ? 2 : 1, cfg: { ko: g.ko, rule, komi: KOMIS.includes(raw.komi) ? raw.komi : defKomi(rule) }, g };
        }
        const WHYS = ['score', 'resign', 'timeout', 'draw'];
        const cleanRes = (r) => (r && typeof r === 'object' && [0, 1, 2].includes(r.w) && WHYS.includes(r.why) ? { w: r.w, why: r.why, s: typeof r.s === 'string' && /^(?:[BW]\+\d{1,3}(?:\.5)?|0)$/.test(r.s) ? r.s : '' } : null);
        // 成員收到房主的 STATE：重播驗證每一手，其他欄位只接受白名單
        function stateGame(d) {
            if (!d || typeof d !== 'object') return null;
            const g = gameFrom(d.ko, d.moves);

            return { g, res: cleanRes(d.res), dead: cleanDead(g.b, d.dead), conf: [0, 1].map(i => Array.isArray(d.conf) && d.conf[i] === true), cfg: { ko: g.ko, rule: d.rule, komi: d.komi }, hostSide: d.hostSide };

        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const REASON = { occupied: '該點已有棋子', suicide: '禁著點：下在這裡自己會沒有氣（自殺）', ko: '禁著點：劫，不能讓盤面回到先前的樣子，請先下別處', over: '現在不能下棋' };
        const sideName = (p) => (p === 1 ? '黑棋' : '白棋');

        let opts = cleanOpts(null), stats = cleanStats(null);
        const connKey = 'go9_conn';
        addEventListener('pagehide', () => { leaving = true; }); addEventListener('pageshow', () => { leaving = false; });

        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const gameMsg = (t) => { $('#gameMsg').textContent = t || ''; };
        const enableNet = (on) => ['#local', '#cpu', '#host', '#join', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });
        const showScreen = (s) => { $('#menu').hidden = s !== 'menu'; $('#game').hidden = s !== 'game'; };

        // ---------- 存取 ----------
        const loadAll = () => { opts = cleanOpts(Util.store.get('go9_opts', null)); stats = cleanStats(Util.store.get('go9_stats', null)); };

        const readSave = () => { const raw = Util.store.get('go9_game', null), s = cleanSave(raw); if (raw && !s) removeKey('go9_game'); return s; };

        function renderMenu() {
            $('#level').value = opts.level; $('#side').value = opts.side; $('#ko').value = opts.ko; $('#rule').value = opts.rule; $('#komi').value = String(opts.komi);
            $('#stats').innerHTML = [['簡單', 'easy'], ['普通', 'normal'], ['連線', 'net']].map(([n, k]) => `${n}：${stats[k][0]} 勝 ${stats[k][1]} 負 ${stats[k][2]} 和`).join('<br>');

            $('#resume').hidden = $('#giveup').hidden = !s;

        }

            return `${mode !== 'local' && r.w === my ? '你' : nm(r.w)} 獲勝${r.why === 'resign' ? '（對手認輸）' : r.why === 'timeout' ? '（對手逾時）' : r.s ? '：' + r.s.replace('B+', '黑 +').replace('W+', '白 +') : ''}`;
        }
        function statusText() {

            if (G.over) return G.passes >= 2 ? '雙方虛手：請標記死子後確認結果' : '已達步數上限：請標記死子後確認結果';
            const pre = G.last === -1 ? `${nm(other(G.turn))}虛手。` : '';
            return pre + (mode === 'local' ? `輪到 ${sideName(G.turn)}` : G.turn === my ? '輪到你了' : `輪到 ${nm(G.turn)}`) + (thinking ? '（思考中…）' : '');

            }
        }
        function boardSvg() {
            const scoring = G.over && !res, sc = scoring || (res && res.why === 'score') ? score(G, dead, cfg.rule, cfg.komi) : null, dset = new Set(dead);
            const xy = (i) => [10 + 10 * (i % 9), 10 + 10 * (i / 9 | 0)];
            let s = '<rect width="100" height="100" rx="2" fill="#dcb35c"/>', d = '';
            for (let k = 0; k < 9; k++) d += `M10 ${10 + 10 * k}H90M${10 + 10 * k} 10V90`;
            s += `<path d="${d}" stroke="#4a3416" stroke-width=".4" fill="none"/>`;
            for (const [r, c] of [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]]) s += `<circle cx="${10 + 10 * c}" cy="${10 + 10 * r}" r=".9" fill="#4a3416"/>`;
            for (let k = 0; k < 9; k++) s += `<text x="${10 + 10 * k}" y="97" font-size="3" text-anchor="middle" fill="#4a3416">${'ABCDEFGHJ'[k]}</text><text x="4" y="${11 + 10 * k}" font-size="3" text-anchor="middle" fill="#4a3416">${9 - k}</text>`;
            for (let i = 0; i < NN; i++) {
                const v = G.b[i], [x, y] = xy(i);

            }
            if (!sc && G.last >= 0) { const [x, y] = xy(G.last); s += `<circle cx="${x}" cy="${y}" r="1.9" fill="none" stroke="${G.b[G.last] === 1 ? '#fff' : '#d33'}" stroke-width=".7"/>`; }
            if (pend >= 0 && !scoring) { const [x, y] = xy(pend); s += `<circle cx="${x}" cy="${y}" r="4.6" fill="${G.turn === 1 ? '#111' : '#fafafa'}" opacity=".55" stroke="#d33" stroke-width=".5" stroke-dasharray="1.2 1"/>`; }
            if (hintI >= 0) { const [x, y] = xy(hintI); s += `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#1a8a4a" stroke-width=".8" stroke-dasharray="1.5 1"/>`; }

        }
        function scoreHtml() {

            return `${cfg.rule === 'area' ? '中國數子' : '日本數目'}：黑 ${s.s1} ${u}　白 ${s.s2} ${u}（含貼 ${cfg.komi}）<br><b>${s.winner ? (s.winner === 1 ? '黑' : '白') + ' 勝 ' + Math.abs(s.diff) + ' ' + u : '和局'}</b>`;

            $('#hint').hidden = !solo(); $('#hint').disabled = !mt;
            $('#draw').disabled = $('#resign').disabled = !!res || (mode === 'host' && !peerHere);
            $('#scoreBox').hidden = !scoring && !(res && res.why === 'score');
            if (!$('#scoreBox').hidden) {
                $('#scoreText').innerHTML = (scoring ? '點選棋盤上的死子標記（再點取消）。<br>' : '') + scoreHtml();
                $('#confirm').hidden = $('#resumeGame').hidden = !scoring;
                const mine = netMode() && conf[my - 1];
                $('#confirm').disabled = mine; $('#confirm').textContent = mine ? '已確認，等對手' : '確認結果';
                $('#resumeGame').hidden = !scoring || G.passes < 2 || G.moves.length >= MAXMOVES;
            }
            $('#req').hidden = !(net.draw && net.draw !== my) && !(net.undo && net.undo !== my);
            $('#reqText').textContent = net.draw && net.draw !== my ? '對手提出和棋，同意嗎？' : '對手請求悔棋，同意嗎？';
            $('#again').hidden = !res; $('#copy').hidden = mode !== 'host';
        }

        // ---------- 結果 / 統計 ----------

        // ---------- 單機 ----------
        function enter(m) { mode = m; showScreen('game'); gameMsg(''); }
        function startSolo(kind) {
            ++tok; thinking = false; counted = false;
            cfg = { ko: opts.ko, rule: opts.rule, komi: opts.komi }; level = opts.level;
            my = kind === 'local' ? 1 : opts.side === 'r' ? Util.rnd(2) + 1 : opts.side === 'w' ? 2 : 1;
            names = kind === 'cpu' ? { [my]: '你', [other(my)]: '電腦' } : { 1: '黑棋', 2: '白棋' };
            G = newGame(cfg.ko); res = null; dead = []; conf = [false, false]; pend = -1; hintI = -2; net = { draw: 0, undo: 0 }; clk = null;

        }
        function resume() {
            const s = readSave(); if (!s) return renderMenu();

        function afterMove() { pend = -1; hintI = -2; if (G.over) enterScoring(); saveGame(); render(); cpuTurn(); }

        function cpuTurn() {

            }, 450);
        }
        function rebuild(moves) {

            if (G.over) enterScoring();
        }

        // ---------- 連線：房主 ----------
        const readNick = () => {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        };
        const onNetError = (err, message) => { netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } };
        const tcOf = () => ({ min: +$('#tmin').value || 0, inc: +$('#tinc').value || 0 });
        const newClock = () => { clk = tc.min ? { left: { 1: tc.min * 60000, 2: tc.min * 60000 }, inc: tc.inc * 1000, run: 0, at: performance.now() } : null; };
        const clockRunning = () => !!clk && peerHere && !!G && !res && !G.over;
        function tick() {                                           // 房主：結算經過的時間、判逾時

        function publish() { tick(); render(); if (mode === 'host' && room) room.broadcast(stateMsg()); }
        function hostStartGame(swap) {

        }
        // 房主端處理「某一方」的動作（房主自己的按鈕與成員來的訊息走同一條路，一律驗證）
        function hostAct(side, d) {

            const reject = (why) => { publish(); if (side !== hostSide && room) room.sendTo(1, { type: 'REJECT', why }); else gameMsg(why); };
            tick();
            const scoring = G.over && !res;
            switch (d.type) {
                case 'MOVE': {
                    if (res || G.over || !peerHere || side !== G.turn) return reject('現在不能下棋');
                    if (!Number.isInteger(d.i) || d.i < -1 || d.i >= NN) return reject('非法的一手');
                    const why = check(G, d.i); if (why) return reject(REASON[why]);
                    play(G, d.i);
                    if (clk) clk.left[side] += clk.inc;
                    net.draw = net.undo = 0; pend = -1; hintI = -2;
                    if (G.over) enterScoring();
                    return publish();
                }
                case 'DEAD':
                    if (!scoring) return reject('現在不是標記死子的時候');
                    dead = toggleDead(G.b, dead, d.i); conf = [false, false]; return publish();
                case 'CONFIRM':
                    if (!scoring) return;
                    conf[side - 1] = true;
                    if (conf[0] && conf[1]) finalize();
                    return publish();
                case 'RESUME':
                    if (!scoring || !play(G, -2)) return reject('無法繼續對局');
                    dead = []; conf = [false, false]; return publish();
                case 'RESIGN': if (res) return; setRes({ w: other(side), why: 'resign', s: '' }); return publish();
                case 'DRAW_OFFER':
                    if (res) return;
                    if (net.draw === other(side)) setRes({ w: 0, why: 'draw', s: '' }); else net.draw = side;
                    return publish();
                case 'DRAW_REPLY':
                    if (res || net.draw !== other(side)) return;
                    if (d.ok === true) setRes({ w: 0, why: 'draw', s: '' });
                    net.draw = 0; return publish();
                case 'UNDO_REQ': {
                    if (res || !undoMoves(G.moves, side)) return reject('目前沒有可悔的手');
                    net.undo = side; return publish();
                }
                case 'UNDO_REPLY': {
                    if (res || !net.undo || net.undo !== other(side)) return;
                    if (d.ok === true) { const m = undoMoves(G.moves, net.undo); if (m) rebuild(m); }
                    net.undo = 0; return publish();
                }
                case 'AGAIN': if (!res) return; hostStartGame(true); return publish();
                default: return reject('未知的動作');
            }
        }

        // ---------- 連線：成員 ----------
        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.join(id, {
                nick,
                onJoined() {
                    try { sessionStorage.setItem(connKey, JSON.stringify({ id, nick })); } catch (e) { }
                    hostId = id; peerHere = true; G = null; enter('guest'); $('#status').textContent = '已加入，等待房主…';
                },
                onMessage(d) {
                    if (!d || typeof d !== 'object') return;
                    if (d.type === 'REJECT') { gameMsg(String(d.why || '').slice(0, 40)); return; }
                    if (d.type !== 'STATE') return;
                    const st = stateGame(d); if (!st) return;
                    const prevRes = res, fresh = !G || st.g.moves.length < G.moves.length;
                    G = st.g; cfg = st.cfg; hostSide = st.hostSide; my = other(hostSide); res = st.res; dead = st.dead; conf = st.conf;
                    if (fresh && !res) counted = false;
                    if (Array.isArray(d.names)) names = { 1: String(d.names[0] || '').slice(0, 12), 2: String(d.names[1] || '').slice(0, 12) };
                    net = { draw: d.draw === 1 || d.draw === 2 ? d.draw : 0, undo: d.undo === 1 || d.undo === 2 ? d.undo : 0 };
                    clk = d.clk && Number.isFinite(d.clk.b) && Number.isFinite(d.clk.w) ? { left: { 1: d.clk.b, 2: d.clk.w }, inc: 0, run: d.clk.run === 1 || d.clk.run === 2 ? d.clk.run : 0, at: performance.now() } : null;
                    pend = -1; hintI = -2; gameMsg('');
                    if (res && !prevRes) onOver();
                    render();
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; try { sessionStorage.removeItem(connKey); } catch (e) { } },
                onClose() {
                    if (mode !== 'guest' || leaving) return;
                    try { sessionStorage.removeItem(connKey); } catch (e) { }
                    alert('房主已離開或連線中斷，遊戲結束'); location.reload();
                },
                onError: (err, message) => { onNetError(err, message); try { sessionStorage.removeItem(connKey); } catch (e) { } },
            });
        }
        $('#host').onclick = hostRoom;
        $('#join').onclick = joinRoom;

        // ---------- 操作 ----------
        const act = (d) => { if (mode === 'host') hostAct(my, d); else if (mode === 'guest' && room) room.send(d); };
        function commitMove(i) {
            if (netMode()) { pend = -1; act({ type: 'MOVE', i }); render(); } else commitSolo(i);
        }
        function onPoint(i) {
            if (!G || res) return;
            if (G.over) {
                if (!G.b[i]) return;
                if (netMode()) act({ type: 'DEAD', i }); else { dead = toggleDead(G.b, dead, i); render(); }
                return;
            }
            if (!myTurnNow()) return;
            if (i === pend) return commitMove(i);
            const why = check(G, i);
            pend = why ? -1 : i; gameMsg(why ? REASON[why] : ''); hintI = -2; render();
        }
        $('#board').addEventListener('click', (e) => {
            const r = e.currentTarget.getBoundingClientRect(), c = Math.round(((e.clientX - r.left) / r.width * 100 - 10) / 10), rw = Math.round(((e.clientY - r.top) / r.height * 100 - 10) / 10);
            if (c >= 0 && c < N && rw >= 0 && rw < N) onPoint(rw * 9 + c);
        });
        $('#ok').onclick = () => { if (pend >= 0 && myTurnNow()) commitMove(pend); };
        $('#pass').onclick = () => { if (myTurnNow()) commitMove(-1); };
        $('#confirm').onclick = () => { if (netMode()) act({ type: 'CONFIRM' }); else { finalize(); saveGame(); render(); } };
        $('#resumeGame').onclick = () => {
            if (netMode()) return act({ type: 'RESUME' });
            if (play(G, -2)) { dead = []; afterMove(); }
        };
        $('#undo').onclick = () => {
            if (netMode()) { act({ type: 'UNDO_REQ' }); gameMsg('已向對手請求悔棋'); return; }
            const m = undoMoves(G.moves, mode === 'cpu' ? my : 0);
            if (m) { rebuild(m); saveGame(); render(); cpuTurn(); }
        };
        $('#hint').onclick = () => {
            if (!myTurnNow()) return;
            const i = cpuMove(G, 'normal', cfg.komi);
            if (i < 0) { gameMsg('電腦建議虛手'); hintI = -2; } else { hintI = i; pend = -1; gameMsg(''); }
            render();
        };
        $('#draw').onclick = () => {
            if (netMode()) { act({ type: 'DRAW_OFFER' }); gameMsg('已向對手提出和棋'); return; }
            if (mode === 'local') { if (confirm('雙方同意和局？')) { setRes({ w: 0, why: 'draw', s: '' }); saveGame(); render(); } return; }
            const s = score(G, suggestDead(G.b), 'area', cfg.komi);
            if (G.moves.length > 40 && (my === 1 ? s.diff : -s.diff) >= 0) { ++tok; thinking = false; setRes({ w: 0, why: 'draw', s: '' }); render(); }       // 電腦只在自己沒有領先時同意
            else gameMsg('電腦拒絕了和棋');
        };
        $('#resign').onclick = () => {
            if (!confirm(mode === 'local' ? `${sideName(G.turn)}認輸？` : '確定認輸？')) return;
            if (netMode()) return act({ type: 'RESIGN' });
            ++tok; thinking = false;
            setRes({ w: other(mode === 'local' ? G.turn : my), why: 'resign', s: '' }); saveGame(); render();
        };
        const reqAns = (ok) => act({ type: net.draw && net.draw !== my ? 'DRAW_REPLY' : 'UNDO_REPLY', ok });
        $('#reqYes').onclick = () => reqAns(true);
        $('#reqNo').onclick = () => reqAns(false);
        $('#again').onclick = () => {
            if (netMode()) return act({ type: 'AGAIN' });
            ++tok; thinking = false; counted = false;
            G = newGame(cfg.ko); res = null; dead = []; conf = [false, false]; pend = -1; hintI = -2;
            if (mode === 'cpu') { my = other(my); names = { [my]: '你', [other(my)]: '電腦' }; }
            enter(mode); saveGame(); render(); cpuTurn();
        };
        const sgfText = () => sgf(G.moves, { komi: cfg.komi, rule: cfg.rule, pb: nm(1), pw: nm(2), re: res ? (res.why === 'score' ? res.s : res.w === 0 ? '0' : (res.w === 1 ? 'B+' : 'W+') + (res.why === 'resign' ? 'R' : 'T')) : '' });
        $('#copySgf').onclick = () => { const t = sgfText(); Util.copyWithFeedback($('#copySgf'), t, () => prompt('請手動複製 SGF：', t)); };
        $('#dlSgf').onclick = () => Util.download(new Blob([sgfText()], { type: 'application/x-go-sgf' }), 'go9.sgf');
        $('#copy').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copy'), url, () => prompt('請手動複製邀請連結：', url)); };
        $('#leave').onclick = () => { try { sessionStorage.removeItem(connKey); } catch (e) { } leaving = true; location.hash = ''; location.reload(); };

        $('#cpu').onclick = () => startSolo('cpu');
        $('#local').onclick = () => startSolo('local');
        $('#resume').onclick = resume;
        $('#giveup').onclick = () => { if (confirm('放棄上一局？這一局會被刪除，無法復原。')) { removeKey('go9_game'); renderMenu(); } };
        $('#clrStats').onclick = () => { if (confirm('清除所有勝負紀錄？無法復原。')) { stats = cleanStats(null); saveStats(); renderMenu(); } };
        $('#clrAll').onclick = () => { if (confirm('清除勝負紀錄、選項與進行中的棋局？無法復原，頁面會重新載入、進行中的這一局會結束。')) { ['go9_stats', 'go9_opts', 'go9_game'].forEach(removeKey); location.reload(); } };

        // ---------- 啟動 ----------
        loadAll();
        if (P2PRoom.roomFromUrl()) {
            $('#joinId').value = P2PRoom.roomFromUrl();
            try { const c = JSON.parse(sessionStorage.getItem(connKey) || 'null'); if (c && c.id === P2PRoom.roomFromUrl() && P2PRoom.validNick(c.nick)) { $('#nick').value = c.nick; joinRoom(); } } catch (e) { }
        }
        renderMenu();
        showScreen('menu');
    </script>
</body>

</html>
