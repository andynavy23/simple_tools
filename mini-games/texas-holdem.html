    <template id="help">
        <h3>這是什麼</h3>
        <p>無限注德州撲克現金桌，<b>只用遊戲籌碼、沒有真錢</b>。2–8 人一桌，真人與電腦可混合，空位由電腦補滿。每人發 2 張手牌，和 5 張公共牌組成最好的 5 張牌比大小。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>一個人想練牌：開單機，1 位真人對 1–7 位電腦，隨時可以重新開局。</li>
        <li>和朋友線上打牌：房主建房、傳連結；只有 2、3 個人也能開，缺的座位電腦補。</li>
        </ul>
        <h3>單機怎麼開始</h3>
        <ol>
        <li>在「牌桌設定」選座位數（含你，2–8）、電腦程度、起始籌碼、盲注與升盲，按「開始單機」。</li>
        <li>簡單：判斷粗略、愛跟注。普通：用手牌勝率與底池賠率決定，偶爾詐唬。困難：另外看位置、勝率更準、會半詐唬。電腦只看自己的牌與公開資訊，<b>不會偷看你的牌</b>。</li>
        <li>牌桌上方的「重新開局」可以隨時重來（要連按兩下確認）；結束後按「再來一局」。</li>
        </ol>
        <h3>連線怎麼玩（怎麼開房、怎麼邀請）</h3>
        <ol>
        <li>輸入暱稱，先在「牌桌設定」選好規則，按「建立房間」，再按「複製邀請連結」傳給朋友。</li>
        <li>朋友開連結、輸入暱稱、按「加入」。最多 8 位；房主隨時可按「開始」，座位數不足的部分由電腦補。</li>
        <li>手牌只會私下傳給本人。房主負責洗牌並驗證每個動作（輪到誰、金額範圍、籌碼夠不夠），違規的動作會被拒絕。</li>
        <li>每手洗牌後房主先公布「牌堆雜湊碼」（SHA-256 + 鹽）。這手結束時才公開牌序與鹽，各人的畫面會自動核對，確認發牌後沒有被動手腳。<b>代價：這手所有人的牌（包含棄牌者）在結束時會被公開。</b></li>
        <li>連線時每手有倒數（30 / 60 秒或不限時），逾時自動過牌（能過牌時）或棄牌。</li>
        <li>斷線或重新整理：這手視為棄牌，之後由電腦託管（顯示「託管」）；用<b>同一個暱稱</b>重新加入就拿回座位與手牌。房主離開則牌局結束。遊戲開始後才加入的人是觀戰者：看得到公共牌與籌碼，看不到任何人的手牌。</li>
        </ol>
        <h3>規則</h3>
        <ul>
        <li><b>流程</b>：翻牌前（每人 2 張）→ 翻牌（3 張）→ 轉牌（1 張）→ 河牌（1 張）→ 攤牌；每一輪下注完成才進下一輪。</li>
        <li><b>盲注</b>：按鈕位左邊第一位下小盲、第二位下大盲。<b>只剩 2 人（單挑）時</b>，按鈕位下小盲並先行動（翻牌後則是大盲先行動）。按鈕每手順時針移到下一位還有籌碼的人（不採「死按鈕」）。</li>
        <li><b>動作</b>：過牌、下注、跟注、加注、棄牌、全下。加注到的金額至少要比目前最高注多出「上一次加注的幅度」（最少一個大盲）；全下可以不足額。</li>
        <li><b>不足額全下不重開下注</b>：有人全下的金額不夠一次完整加注時，已經行動過的人只能跟注或棄牌，不能再加注。</li>
        <li><b>邊池</b>：有人全下時，依各人投入的籌碼分成主池與邊池；每個池只有「投入達到那一層」的人能贏。沒人跟的部分會退還給下注者。</li>
        <li><b>攤牌</b>：每人用 7 張牌（2 張手牌 + 5 張公共牌）選最好的 5 張，牌型大小：同花順 &gt; 四條 &gt; 葫蘆 &gt; 同花 &gt; 順子 &gt; 三條 &gt; 兩對 &gt; 一對 &gt; 高牌；花色不分大小，同牌型比點數。A 可當 1（A2345 是最小的順子）。</li>
        <li><b>平分與餘數</b>：同分的人平分該池；除不盡的零頭籌碼，從「按鈕位左邊第一位贏家」起依順時針每人多拿 1 個。</li>
        <li><b>淘汰</b>：籌碼歸零就淘汰，最後剩一人（或單機的你被淘汰）牌局結束。籌碼不跨局：每次開桌所有人發同樣的起始籌碼。</li>
        <li><b>升盲</b>：可設定每 5 / 10 / 20 手把盲注升一級，或不升。</li>
        </ul>
        <h3>操作</h3>
        <ol>
        <li>輪到你時底部的操作列會亮起：「棄牌」、「過牌 / 跟注」、「加注」。拖動滑桿選加注到多少，或按 ½ 池、底池、全下快速設定。</li>
        <li>座位上顯示名字、剩餘籌碼與本輪下注；金色的 D 是按鈕位。「牌局記錄」可展開看這一桌發生的事。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">盲注 10/20，你在按鈕位拿 A♠K♠：前面的人加注到 60，你可以跟注 60，或加注到至少 100（60 + 上一次加注幅度 40）。<br>A 全下 100、B 全下 300、C 跟注 300：主池 300（A、B、C 都有份）、邊池 400（只有 B、C 有份）。A 牌最大只贏主池，邊池給 B、C 中較大者。</div>
        <h3>小提醒</h3>
        <ul>
        <li>只存「牌桌設定」（鍵 holdem_opts）與「累計統計」（手數、贏的手數、完成局數、奪冠次數，鍵 holdem_stats），籌碼與牌局不存。存檔壞掉會自動換回預設值。</li>
        <li>統計只有四個數字，不會增長；畫面最下方的「清除統計與設定」會一併清掉這兩份資料並重新載入頁面（進行中的這一局會結束），無法復原。</li>
        <li>牌局記錄只留最近 60 行。發牌與籌碼移動有短短的動畫，純視覺；系統設定「減少動態效果」時會自動關閉。</li>
        <li>這是練習與娛樂，沒有任何真錢往來。</li>
        </ul>
    </template>

    <script>
        // --- pure ---
        // 牌 = 0..51：點數 = c % 13（0 = 2 … 12 = A），花色 = floor(c / 13)（0 黑桃 1 紅心 2 方塊 3 梅花）
        const RANKS = '23456789TJQKA', SUITS = ['♠', '♥', '♦', '♣'];
        const CATS = ['高牌', '一對', '兩對', '三條', '順子', '同花', '葫蘆', '四條', '同花順'];
        const cardStr = (c) => (c % 13 === 8 ? '10' : RANKS[c % 13]) + SUITS[(c / 13) | 0];
        const validCard = (c) => Number.isInteger(c) && c >= 0 && c < 52;
        const isRed = (c) => { const s = (c / 13) | 0; return s === 1 || s === 2; };

        // 5–7 張取最強五張牌：回傳整數分數，越大越強；分數 = 牌型 × 13^5 + 5 個比較點數（base 13）
        function evalHand(cs) {
            const rc = new Array(13).fill(0), sc = [0, 0, 0, 0], sm = [0, 0, 0, 0]; let mask = 0;
            for (let i = 0; i < cs.length; i++) { const c = cs[i], r = c % 13, s = (c / 13) | 0; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
            const pack = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * 13 + (ks[i] || 0); return v; };
            const sHigh = (m) => { for (let h = 12; h >= 4; h--) { const w = 31 << (h - 4); if ((m & w) === w) return h; } return (m & 0x100F) === 0x100F ? 3 : -1; };
            const fs = sc.findIndex(x => x >= 5);
            if (fs >= 0) { const h = sHigh(sm[fs]); if (h >= 0) return pack(8, [h]); }
            const quads = [], trips = [], pairs = [];
            for (let r = 12; r >= 0; r--) { if (rc[r] === 4) quads.push(r); else if (rc[r] === 3) trips.push(r); else if (rc[r] === 2) pairs.push(r); }
            const top = (n, ex) => { const o = []; for (let r = 12; r >= 0 && o.length < n; r--) if (rc[r] && !ex.includes(r)) o.push(r); return o; };

        $('#leave').onclick = leave; $('#lobbyLeave').onclick = leave;
        if (P2PRoom.roomFromUrl()) {
            $('#joinId').value = P2PRoom.roomFromUrl();
            try { const c = JSON.parse(sessionStorage.getItem(connKey) || 'null'); if (c && c.id === P2PRoom.roomFromUrl() && P2PRoom.validNick(c.nick)) { $('#nick').value = c.nick; joinRoom({ n: 6 }); } } catch (e) { }
        }
    </script>
</body>
