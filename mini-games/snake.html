<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="貪吃蛇：方向鍵、WASD 或在畫面上滑動操作，吃到食物變長、速度變快，可選牆壁模式，記錄最高分。">
    <meta property="og:title" content="貪吃蛇" />
    <meta property="og:description" content="經典貪吃蛇，可選穿牆或撞牆模式。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/snake.html" />
    <meta name="st-keys" content="snake_best_*">
    <title>貪吃蛇</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 520px;
        }

        .bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .chip {
            background: var(--card);
            border-radius: 980px;
            padding: 6px 14px;
            font-variant-numeric: tabular-nums;
        }

        #pauseBtn {
            display: none;
            min-height: 44px;
            min-width: 44px;
        }

        @media (pointer: coarse) {
            #pauseBtn {
                display: inline-block;
            }
        }

        #cv {
            width: 100%;
            aspect-ratio: 1;
            display: block;
            border-radius: 14px;
            background: var(--card);
            touch-action: none;
        }

        #msg {
            text-align: center;
            font-weight: 700;
            min-height: 1.6em;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>貪吃蛇</h1>
        <p class="sub">方向鍵或 WASD 控制，手機在畫面上滑動。空白鍵暫停。</p>
        <div class="bar">
            <select id="wall" aria-label="牆壁模式"><option value="solid">撞牆會死</option><option value="wrap">可以穿牆</option></select>
            <button class="primary" id="start">開始</button>
            <button id="pauseBtn" aria-label="暫停或繼續">⏸ 暫停</button>
            <span class="chip">分數 <b id="score">0</b></span>
            <span class="chip">最高 <b id="best">0</b></span>
        </div>
        <canvas id="cv" width="600" height="600" aria-label="遊戲畫面"></canvas>
        <div id="msg" role="status"></div>
        <button class="sm" id="clearBest" style="margin-top:12px">清除最佳紀錄</button>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>經典貪吃蛇：控制蛇吃食物變長，不要撞到牆或自己的身體。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想玩一把簡單又上手的小遊戲。</li>
        <li>練手速與預判。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>左上選擇牆壁模式：「撞牆會死」或「可以穿牆」，按「開始」。</li>
        <li>手機在<b>棋盤上往想轉的方向滑動</b>；電腦按方向鍵或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>。蛇不能直接掉頭。</li>
        <li>吃到紅色食物長一格、得 1 分，並越走越快。</li>
        <li>撞牆（撞牆模式）或咬到自己就結束；整個畫面被填滿算通關。</li>
        <li>電腦按<kbd>空白鍵</kbd>可暫停／繼續。</li>
        </ol>
        <h3>計分</h3>
        <div class="eg">每吃一個食物 +1 分。速度從每步 150 毫秒開始，每吃一個快一點，最快每步 60 毫秒。兩種牆壁模式各自記錄最高分。</div>
        <h3>小提醒</h3>
        <ul>
        <li>滑動時畫面不會跟著捲動；要捲動頁面請從棋盤外滑。</li>
        <li>追著自己的尾巴走是安全的，因為尾巴會同時移開。</li>
        <li>蛇的移動是平滑的（速度與規則不變）；吃到食物時食物會縮小消失、蛇身脈動一下，死亡時蛇身會由頭到尾依序變紅。系統開啟「減少動態效果」時會自動關閉這些動畫，切到別的分頁也不會累積。</li>
        <li>手機（觸控裝置）在「開始」旁有「⏸ 暫停」鈕，暫停後變成「▶ 繼續」；電腦用空白鍵。</li>
            <li>最佳紀錄存在這台裝置；想重來可按頁面下方的「清除最佳紀錄」（只清這個遊戲，無法復原；頁面會重新載入，進行中的這一局會結束）。</li>
</ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd, store } = Util;

        // --- pure ---
        const SIZE = 20;
        const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        const isReverse = (a, b) => a[0] + b[0] === 0 && a[1] + b[1] === 0;

        // 在不被蛇占用的格子中隨機選一格；沒有空位回傳 null
        function placeFood(snake, rand, size = SIZE) {
            const used = new Set(snake.map(([x, y]) => y * size + x)), free = [];
            for (let i = 0; i < size * size; i++) if (!used.has(i)) free.push(i);
            if (!free.length) return null;
            const k = free[rand(free.length)];
            return [k % size, Math.floor(k / size)];
        }

        // 前進一步。state = { snake（頭在最前）, dir, food, score, dead, won }。wall: 'solid' | 'wrap'
        // 規則：反方向的轉向被忽略（由呼叫端先處理）；移動後尾巴會移開，所以頭可以追著尾巴走，但撞到身體其他部分就死
        function step(st, wall, rand, size = SIZE) {
            if (st.dead || st.won) return st;
            let [hx, hy] = st.snake[0]; hx += st.dir[0]; hy += st.dir[1];
            if (wall === 'wrap') { hx = (hx + size) % size; hy = (hy + size) % size; }
            else if (hx < 0 || hy < 0 || hx >= size || hy >= size) return { ...st, dead: true };
            const eat = st.food && st.food[0] === hx && st.food[1] === hy;
            const body = eat ? st.snake : st.snake.slice(0, -1);
            if (body.some(([x, y]) => x === hx && y === hy)) return { ...st, dead: true };
            const snake = [[hx, hy], ...body];
            if (!eat) return { ...st, snake };
            const food = placeFood(snake, rand, size);
            return { ...st, snake, food, score: st.score + 1, won: food === null };
        }

        // 速度：每吃一個加快一點，最快 60ms 一步
        const tickMs = (score) => Math.max(60, 150 - score * 4);

        // 動畫內插（視覺層）：每一節從 prev[i] 滑到 next[i]（p = 0..1）；吃到食物時多出的尾節原地不動。
        // 穿牆時實際位移只有 ±1 格：位置會超出盤面一點，並多回傳一份從另一側進來的 [x, y, i]（canvas 會裁掉畫面外的），不會有橫跨盤面的線段
        function lerpSnake(prev, next, p, size = SIZE) {
            const out = [], real = (d) => (d > 1 ? d - size : d < -1 ? d + size : d);
            next.forEach(([bx, by], i) => {
                const [ax, ay] = prev && prev[i] ? prev[i] : [bx, by];
                const x = ax + real(bx - ax) * p, y = ay + real(by - ay) * p;
                const xs = [x], ys = [y];
                if (x < 0) xs.push(x + size); else if (x > size - 1) xs.push(x - size);
                if (y < 0) ys.push(y + size); else if (y > size - 1) ys.push(y - size);
                for (const px of xs) for (const py of ys) out.push([px, py, i]);
            });
            return out;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const cv = $('#cv'), g = cv.getContext('2d'), CELL = cv.width / SIZE;
        let st = null, queue = [], timer = null, paused = false, mov = null, eatFx = null, deathT0 = 0, rafOn = false;
        const FOOD_MS = 160, PULSE_MS = 160, PULSE_STEP = 30, DEATH_STEP = 45;
        const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        const bestKey = () => 'snake_best_' + $('#wall').value;
        const showBest = () => { $('#best').textContent = store.get(bestKey(), 0); };

        function draw() {
            const cs = getComputedStyle(document.documentElement);
            g.fillStyle = cs.getPropertyValue('--card').trim() || '#fff'; g.fillRect(0, 0, cv.width, cv.height);
            if (!st) return;
            const now = performance.now(), rm = reduced();
            const disc = (cx, cy, sc) => { g.fillStyle = '#ff453a'; g.beginPath(); g.arc((cx + .5) * CELL, (cy + .5) * CELL, CELL * .38 * sc, 0, 7); g.fill(); };
            if (eatFx && (rm || now - eatFx.t0 >= PULSE_MS + st.snake.length * PULSE_STEP)) eatFx = null;
            if (eatFx && now - eatFx.t0 < FOOD_MS) disc(eatFx.food[0], eatFx.food[1], 1 - (now - eatFx.t0) / FOOD_MS);          // 被吃掉的食物縮小消失
            if (st.food) disc(st.food[0], st.food[1], eatFx ? Math.min(1, (now - eatFx.t0) / FOOD_MS) : 1);                      // 新食物放大出現
            const p = mov && !rm ? Math.min(1, (now - mov.t0) / mov.dur) : 1;
            for (const [x, y, i] of lerpSnake(mov && !rm ? mov.prev : null, st.snake, p).reverse()) {
                let c = i === 0 ? '#248a3d' : '#30d158', sc = 1;
                if (eatFx) { const u = (now - eatFx.t0 - i * PULSE_STEP) / PULSE_MS; if (u > 0 && u < 1) sc = 1 + .14 * Math.sin(Math.PI * u); }                  // 脈動由頭傳到尾
                if (st.dead && (rm || now - deathT0 >= i * DEATH_STEP)) c = '#ff453a';                                            // 死亡：由頭到尾依序變紅
                const m = 2 + CELL * (1 - sc) / 2;
                g.fillStyle = c; g.beginPath(); g.roundRect(x * CELL + m, y * CELL + m, CELL - 2 * m, CELL - 2 * m, 6); g.fill();
            }
        }
        // 只在「動畫進行中」跑 requestAnimationFrame；頁面隱藏時瀏覽器自動停，回來時依時間戳算進度，不會累積
        function animating() {
            if (!st || reduced()) return false;
            const now = performance.now();
            if (st.dead) return now - deathT0 < st.snake.length * DEATH_STEP + 100;
            return !paused && !st.won || !!eatFx;
        }
        function raf() { if (rafOn) return; rafOn = true; (function f() { draw(); if (animating()) requestAnimationFrame(f); else rafOn = false; })(); }

        function loop() {
            clearTimeout(timer);
            if (paused || !st || st.dead || st.won) return;
            const want = queue.shift();
            if (want && !isReverse(want, st.dir)) st = { ...st, dir: want };
            const prev = st; st = step(st, $('#wall').value, rnd);
            const now = performance.now();
            mov = st.snake !== prev.snake ? { prev: prev.snake, t0: now, dur: tickMs(st.score) } : null;
            if (st.score > prev.score) eatFx = { food: prev.food, t0: now };
            if (st.dead) deathT0 = now;
            $('#score').textContent = st.score; draw(); raf();
            if (st.dead || st.won) {
                const best = store.get(bestKey(), 0);
                if (st.score > best) { store.set(bestKey(), st.score); $('#msg').textContent = `${st.won ? '🏆 填滿整個畫面！' : '💥 遊戲結束'}　🎉 新紀錄 ${st.score}`; } else $('#msg').textContent = `${st.won ? '🏆 填滿整個畫面！' : '💥 遊戲結束'}　得分 ${st.score}`;
                showBest(); $('#start').textContent = '再玩一次'; return;
            }
            timer = setTimeout(loop, tickMs(st.score));
        }

        function start() {
            const mid = SIZE >> 1, snake = [[mid, mid], [mid - 1, mid], [mid - 2, mid]];
            st = { snake, dir: DIRS.right, food: placeFood(snake, rnd), score: 0, dead: false, won: false };
            queue = []; paused = false; mov = null; eatFx = null; $('#pauseBtn').textContent = '⏸ 暫停'; $('#msg').textContent = ''; $('#score').textContent = 0; $('#start').textContent = '重新開始';
            draw(); showBest(); timer = setTimeout(loop, tickMs(0));
        }

        function togglePause() {
            if (!st || st.dead || st.won) return;
            paused = !paused; $('#msg').textContent = paused ? '⏸ 暫停' : ''; $('#pauseBtn').textContent = paused ? '▶ 繼續' : '⏸ 暫停';
            if (!paused) loop();
        }
        $('#pauseBtn').onclick = togglePause;
        const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
        document.addEventListener('keydown', (e) => {
            if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
            if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
            const d = KEYMAP[e.key];
            if (d) { e.preventDefault(); if (queue.length < 3) queue.push(DIRS[d]); }
        });
        let t0 = null;
        cv.addEventListener('pointerdown', (e) => { t0 = [e.clientX, e.clientY]; });
        cv.addEventListener('pointerup', (e) => {
            if (!t0) return; const dx = e.clientX - t0[0], dy = e.clientY - t0[1]; t0 = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
            if (queue.length < 3) queue.push(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
        });
        $('#start').onclick = start; $('#wall').onchange = () => { showBest(); };
        showBest(); draw();
    </script>
<script>document.getElementById('clearBest').onclick=()=>{if(!confirm('清除這個遊戲的所有最佳紀錄？無法復原。頁面會重新載入，正在進行的這一局會結束。'))return;try{const p=['snake_best_'];Object.keys(localStorage).filter(k=>p.some(x=>k.startsWith(x))).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};</script>
</body>

</html>
