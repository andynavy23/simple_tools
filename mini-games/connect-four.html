<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="四子棋：本機雙人、對電腦（簡單 / 普通 / 困難），或建立房間連線與朋友對戰，先連成四顆就贏。">
    <meta property="og:title" content="四子棋" />
    <meta property="og:description" content="本機雙人、對電腦或連線對戰，先連成四顆就贏。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/connect-four.html" />
    <title>四子棋</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <template id="help">
        <h3>這是什麼</h3>
        <p>四子棋：紅、黃兩色輪流把棋子投進直欄，棋子會落到該欄最底下。誰先連成四顆（橫、直、斜都算）就贏；棋盤 7 欄 6 列，下滿沒人連成就是平手。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>一個人想打發時間：直接「單機對電腦」，不用連線。</li>
        <li>兩個人同一支手機輪流下：「本機雙人」。</li>
        <li>和遠方朋友對戰：建立房間，把邀請連結傳給對方。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li><b>單機</b>：選難度（簡單 / 普通 / 困難）與誰先下，按「單機對電腦」。電腦會想一下才下。</li>
        <li>點棋盤上任一欄就會落子。輪到你時才能點。</li>
        <li>「提示」會把建議的那一欄亮起（用普通級電腦算）；「悔棋」會收回你上一步，並一起收回電腦的回應，回到你的回合。</li>
        <li>結束後按「再來一局」，先手會和上一局對調；「離開」回到選單。</li>
        <li><b>連線</b>：輸入暱稱（1–10 字），按「建立房間」，再按「複製邀請連結」傳給朋友；朋友開連結、輸入暱稱按「加入」，也可以貼上房號。房主執紅先手，加入的人執黃，只能兩人。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">你先手、選「簡單」。連下同一欄三顆紅子，電腦沒擋就再下一顆，直向連四獲勝。想收回一步時按「悔棋」。</div>
        <h3>小提醒</h3>
        <ul>
        <li>簡單難度偶爾會亂下，但明顯的一步勝或必擋不會漏；困難會算比較多步。</li>
        <li>悔棋與提示只在單機和本機雙人出現，連線對戰沒有。</li>
        <li>連線時房主離開，遊戲就結束；資料只在你和朋友的瀏覽器之間傳送。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <style>
        :root {
            --wrap-w: 520px;
            --red: #ff453a;
            --yellow: #ffd60a;
            --board: #0a64d8;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row input {
            flex: 1 1 130px;
        }

        .status {
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 12px;
            min-height: 1.6em;
        }

        .dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            vertical-align: -2px;
            margin-right: 4px;
        }

        .p1 {
            background: var(--red);
        }

        .p2 {
            background: var(--yellow);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
            background: var(--board);
            padding: 10px;
            border-radius: 16px;
        }

        .col {
            display: grid;
            gap: 6px;
            padding: 0;
            background: none;
            border-radius: 10px;
        }

        .col:not(:disabled):hover {
            background: rgba(255, 255, 255, .15);
        }

        .col:disabled {
            opacity: 1;
            cursor: default;
        }

        .col.hint {
            background: rgba(255, 255, 255, .35);
            box-shadow: 0 0 0 3px #fff inset;
        }

        .sec {
            font-weight: 700;
            margin: 14px 0 8px;
        }

        .sec:first-child {
            margin-top: 0;
        }

        @media (max-width: 480px) {
            #board {
                gap: 4px;
                padding: 8px;
            }

            .col {
                gap: 4px;
            }
        }

        .slot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--bg);
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, .35);
            transition: background .12s;
        }

        .slot.p1 {
            background: var(--red);
        }

        .slot.p2 {
            background: var(--yellow);
        }

        .slot.win {
            outline: 4px solid #fff;
            outline-offset: -3px;
            animation: blink .8s infinite alternate;
        }

        @keyframes blink {
            to {
                opacity: .55;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>四子棋</h1>
        <p class="sub">先把四顆同色連成一線（橫、直、斜）就贏。</p>

        <div class="card" id="menu">
            <p class="sec">單機（不用連線）</p>
            <div class="row">
                <button class="primary" id="cpu">單機對電腦</button>
                <select id="level" aria-label="電腦難度"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select>
                <select id="first" aria-label="誰先下"><option value="me">我先手（紅）</option><option value="cpu">電腦先手</option></select>
            </div>
            <div class="row"><button id="local">本機雙人（同一支手機輪流）</button></div>
            <p class="sec">和朋友連線</p>
            <div class="row"><input id="nick" maxlength="10" placeholder="連線暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button id="host">建立房間</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="join">加入</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div class="card" id="game" hidden>
            <div class="status" id="status" role="status"></div>
            <div id="board"></div>
            <div class="row" style="justify-content:center;margin-top:14px">
                <button id="undo" hidden>悔棋</button>
                <button id="hint" hidden>提示</button>
                <button class="primary" id="again" hidden>再來一局</button>
                <button id="copy" hidden>複製邀請連結</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

    <script>
        // --- pure ---
        const ROWS = 6, COLS = 7;
        const newBoard = () => Array.from({ length: ROWS }, () => new Array(COLS).fill(0));

        // 在某欄落子：回傳落在的列（0 為最上），欄滿回傳 -1；不改動輸入
        function dropRow(board, col) {
            if (!Number.isInteger(col) || col < 0 || col >= COLS) return -1;
            for (let r = ROWS - 1; r >= 0; r--) if (board[r][col] === 0) return r;
            return -1;
        }

        // 找出連成 4 顆以上的格子；回傳 { player, cells } 或 null
        function findWin(board) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p) continue;
                for (const [dr, dc] of dirs) {
                    const cells = [[r, c]];
                    for (let k = 1; k < 4; k++) {
                        const rr = r + dr * k, cc = c + dc * k;
                        if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || board[rr][cc] !== p) break;
                        cells.push([rr, cc]);
                    }
                    if (cells.length === 4) return { player: p, cells };
                }
            }
            return null;
        }

        const isFull = (board) => board[0].every(v => v !== 0);

        // 遊戲狀態與一步棋：state = { board, turn(1|2), winner(0|1|2), cells, draw, moves }
        function newGame(first = 1) { return { board: newBoard(), turn: first, winner: 0, cells: [], draw: false, moves: 0 }; }

        // 玩家 who 在 col 落子；合法回傳 true 並更新 state，否則回傳 false
        function play(state, who, col) {
            if (state.winner || state.draw || who !== state.turn) return false;
            const r = dropRow(state.board, col);
            if (r < 0) return false;
            state.board[r][col] = who;
            state.moves++;
            const w = findWin(state.board);
            if (w) { state.winner = w.player; state.cells = w.cells; }
            else if (isFull(state.board)) state.draw = true;
            else state.turn = who === 1 ? 2 : 1;
            return true;
        }

        // ---------- 電腦對手 ----------
        // 從 me 的角度評分：連線視窗（每 4 格一組）裡自己或對手的子數，加上中間欄位的位置分
        function evalBoard(board, me) {
            const op = me === 1 ? 2 : 1;
            let score = 0;
            for (let r = 0; r < ROWS; r++) if (board[r][3] === me) score += 3; else if (board[r][3] === op) score -= 3;
            const win = (cells) => {
                let a = 0, b = 0;
                for (const [r, c] of cells) { const v = board[r][c]; if (v === me) a++; else if (v === op) b++; }
                if (a && b) return 0;
                if (a === 4) return 100000; if (b === 4) return -100000;
                return a === 3 ? 5 : a === 2 ? 2 : b === 3 ? -6 : b === 2 ? -2 : 0;
            };
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
                const er = r + dr * 3, ec = c + dc * 3;
                if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
                score += win([0, 1, 2, 3].map(k => [r + dr * k, c + dc * k]));
            }
            return score;
        }

        // 剛下在 (r,c) 的 p 有沒有連成四子
        function winAt(board, r, c, p) {
            for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
                let n = 1;
                for (const sg of [1, -1]) for (let k = 1; k < 4; k++) { const rr = r + dr * k * sg, cc = c + dc * k * sg; if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || board[rr][cc] !== p) break; n++; }
                if (n >= 4) return true;
            }
            return false;
        }

        const COL_ORDER = [3, 2, 4, 1, 5, 0, 6];                   // 先試中間：alpha-beta 剪枝效果最好
        const DEPTH = { easy: 3, normal: 5, hard: 7 };                // 用奇數層：搜尋結束在自己下完之後，實測比偶數層強很多

        // 回傳電腦要下的欄（0–6）。會暫時修改 board 再還原。easy 有 30% 機率亂下；同分的好步隨機選一個
        function cpuChoose(board, me, level = 'normal', rand = Util.rnd) {
            const cols = COL_ORDER.filter(c => board[0][c] === 0);
            if (!cols.length) return -1;
            if (level === 'easy' && rand(100) < 30) return cols[rand(cols.length)];
            const op = me === 1 ? 2 : 1;
            // 先看能不能一步贏、要不要擋（所有難度都會做；簡單難度也不會漏掉明顯的）
            for (const p of [me, op]) for (const c of cols) { const r = dropRow(board, c); board[r][c] = p; const w = winAt(board, r, c, p); board[r][c] = 0; if (w) return c; }
            const search = (turn, depth, alpha, beta) => {
                let best = turn === me ? -Infinity : Infinity, any = false;
                for (const c of COL_ORDER) {
                    if (board[0][c] !== 0) continue;
                    any = true;
                    const r = dropRow(board, c); board[r][c] = turn;
                    let v;
                    if (winAt(board, r, c, turn)) v = (turn === me ? 1 : -1) * (1e6 + depth);
                    else if (depth <= 1) v = evalBoard(board, me);
                    else v = search(turn === 1 ? 2 : 1, depth - 1, alpha, beta);
                    board[r][c] = 0;
                    if (turn === me) { if (v > best) best = v; if (best > alpha) alpha = best; } else { if (v < best) best = v; if (best < beta) beta = best; }
                    if (alpha >= beta) break;
                }
                return any ? best : 0;                               // 棋盤滿了：平手
            };
            const depth = DEPTH[level] || DEPTH.normal, scores = cols.map(c => { const r = dropRow(board, c); board[r][c] = me; const v = winAt(board, r, c, me) ? 1e6 : (depth <= 1 ? evalBoard(board, me) : search(op, depth - 1, -Infinity, Infinity)); board[r][c] = 0; return v; });
            const top = Math.max(...scores), tied = cols.filter((_, i) => scores[i] === top);
            return tied[rand(tied.length)];
        }

        // ---------- 悔棋與提示（歷史快照放在 state 外面，不會被連線同步） ----------
        const snap = (s) => JSON.parse(JSON.stringify(s));
        // 悔棋：who = 0 退一步；who = 1|2 退到「輪到 who 下」的那個時間點（對電腦時回到自己的回合）。回傳要還原的 state，沒得退回傳 null
        function undoTo(hist, who) {
            const i = who ? hist.map(s => s.turn).lastIndexOf(who) : hist.length - 1;
            if (i < 0) return null;
            const s = hist[i]; hist.length = i;
            return s;
        }
        // 提示：目前輪到的人的建議欄（用普通級電腦）；已結束回傳 -1
        const hintCol = (state) => (state.winner || state.draw ? -1 : cpuChoose(state.board, state.turn, 'normal'));

        // 成員端收到房主狀態時的格式檢查
        function validState(s) {
            return !!s && Array.isArray(s.board) && s.board.length === ROWS && s.board.every(r => Array.isArray(r) && r.length === COLS && r.every(v => v === 0 || v === 1 || v === 2))
                && (s.turn === 1 || s.turn === 2) && (s.winner === 0 || s.winner === 1 || s.winner === 2) && typeof s.draw === 'boolean'
                && Array.isArray(s.cells) && s.cells.length <= 4 && s.cells.every(p => Array.isArray(p) && p.length === 2 && Number.isInteger(p[0]) && Number.isInteger(p[1]));
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let mode = 'menu';           // menu | local | host | guest
        let S = null;                // 狀態（本機 / 房主：權威；成員：房主傳來）
        let room = null, myPlayer = 0, names = ['', ''], firstNext = 1, hostId = '', cpuPlayer = 0, cpuLevel = 'normal', cpuTimer = 0, H = [], hint = -1;

        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => ['#local', '#cpu', '#host', '#join', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });

        // ---------- 畫面 ----------
        function build() {
            const b = $('#board');
            b.replaceChildren(...Array.from({ length: COLS }, (_, c) => {
                const col = document.createElement('button');
                col.className = 'col';
                col.setAttribute('aria-label', `第 ${c + 1} 欄`);
                for (let r = 0; r < ROWS; r++) { const s = document.createElement('div'); s.className = 'slot'; col.append(s); }
                col.onclick = () => onColumn(c);
                return col;
            }));
        }

        function render() {
            if (!S) return;
            const cols = $('#board').children;
            const win = new Set(S.cells.map(([r, c]) => r * COLS + c));
            const myTurn = mode === 'local' || S.turn === myPlayer;
            for (let c = 0; c < COLS; c++) {
                const col = cols[c];
                col.classList.toggle('hint', c === hint);
                col.disabled = !!S.winner || S.draw || !myTurn || S.board[0][c] !== 0 || (mode === 'host' && (!room || room.players.length < 2));
                for (let r = 0; r < ROWS; r++) {
                    const v = S.board[r][c], slot = col.children[r];
                    slot.className = 'slot' + (v ? ' p' + v : '') + (win.has(r * COLS + c) ? ' win' : '');
                }
            }
            const dot = (p) => `<span class="dot p${p}"></span>`;
            const who = (p) => (mode === 'local' ? (p === 1 ? '紅' : '黃') : (names[p - 1] || (p === 1 ? '紅' : '黃')));
            let text;
            if (S.winner) text = `${dot(S.winner)}${mode === 'local' ? who(S.winner) + '色' : who(S.winner)} 獲勝！`;
            else if (S.draw) text = '平手';
            else if (mode === 'host' && room && room.players.length < 2) text = '等待玩家加入…';
            else text = mode === 'local' ? `輪到 ${dot(S.turn)}${who(S.turn)}色` : (S.turn === myPlayer ? `${dot(S.turn)}輪到你了` : `${dot(S.turn)}輪到 ${who(S.turn)}`);
            $('#status').innerHTML = text;
            $('#again').hidden = !((S.winner || S.draw) && (mode === 'local' || mode === 'host' || mode === 'cpu'));
            $('#copy').hidden = mode !== 'host';
            const solo = mode === 'local' || mode === 'cpu';
            $('#undo').hidden = $('#hint').hidden = !solo;
            $('#undo').disabled = !H.length || (mode === 'cpu' && !H.some(h => h.turn === myPlayer));
            $('#hint').disabled = !!S.winner || S.draw || (mode === 'cpu' && S.turn !== myPlayer);
        }
        // 單機走一步（先存快照供悔棋）
        function move(who, col) {
            const s = snap(S);
            if (!play(S, who, col)) return false;
            H.push(s); hint = -1;
            return true;
        }

        function show(screen) {
            $('#menu').hidden = screen !== 'menu';
            $('#game').hidden = screen !== 'game';
        }

        // ---------- 本機 ----------
        function startLocal() {
            mode = 'local';
            S = newGame(1); firstNext = 2; H = []; hint = -1;
            build(); show('game'); render();
        }

        // ---------- 對電腦 ----------
        function startCpu() {
            mode = 'cpu'; cpuLevel = $('#level').value; myPlayer = $('#first').value === 'cpu' ? 2 : 1; cpuPlayer = myPlayer === 1 ? 2 : 1;
            names = myPlayer === 1 ? ['你', '電腦'] : ['電腦', '你'];
            S = newGame(1); firstNext = 2; H = []; hint = -1; build(); show('game'); render(); scheduleCpu();
        }
        function scheduleCpu() {
            clearTimeout(cpuTimer);
            if (mode !== 'cpu' || !S || S.winner || S.draw || S.turn !== cpuPlayer) return;
            cpuTimer = setTimeout(() => {
                if (mode !== 'cpu' || !S || S.winner || S.draw || S.turn !== cpuPlayer) return;
                const c = cpuChoose(S.board, cpuPlayer, cpuLevel);
                if (c >= 0) move(cpuPlayer, c);
                render();
            }, 450);
        }

        // ---------- 房主 / 連線 ----------
        const readNick = () => {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        };
        const onNetError = (err, message) => { netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } };

        function publish() {
            render();
            if (mode === 'host' && room) room.broadcast({ type: 'STATE', s: S, names });
        }

        function hostRoom() {
            const nick = readNick();
            if (!nick) return;
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: 2,
                onReady(r) {
                    mode = 'host'; myPlayer = 1; hostId = r.id; names = [nick, ''];
                    history.replaceState('', document.title, location.pathname + '#' + r.id);
                    S = newGame(1); firstNext = 2;
                    build(); show('game'); render();
                },
                onJoin(p) {
                    names = [nick, p.nick];
                    S = newGame(1); firstNext = 2;      // 有新對手加入：重新開始
                    publish();
                },
                onLeave() {
                    names = [nick, ''];
                    S = newGame(1); firstNext = 2;
                    publish();
                },
                onMessage(p, d) {
                    // 只接受「輪到紅色的人以外」= 成員（黃）的落子
                    if (d && d.type === 'DROP' && Number.isInteger(d.col) && play(S, 2, d.col)) publish();
                },
                onError: onNetError,
            });
        }

        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.join(id, {
                nick,
                onJoined() { mode = 'guest'; myPlayer = 2; build(); show('game'); $('#status').textContent = '已加入，等待房主…'; },
                onMessage(d) {
                    if (!d || d.type !== 'STATE' || !validState(d.s)) return;
                    S = d.s;
                    if (Array.isArray(d.names) && d.names.length === 2 && d.names.every(n => typeof n === 'string' && n.length <= 12)) names = d.names;
                    render();
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (mode === 'guest') { alert('房主已離開，遊戲結束'); location.reload(); } },
                onError: onNetError,
            });
        }

        function onColumn(c) {
            if (mode === 'local') { if (move(S.turn, c)) render(); }
            else if (mode === 'cpu') { if (S.turn === myPlayer && move(myPlayer, c)) { render(); scheduleCpu(); } }
            else if (mode === 'host') { if (play(S, 1, c)) publish(); }
            else if (mode === 'guest' && room && S && S.turn === myPlayer) room.send({ type: 'DROP', col: c });
        }

        // ---------- 事件 ----------
        $('#local').onclick = startLocal;
        $('#cpu').onclick = startCpu;
        $('#host').onclick = hostRoom;
        $('#join').onclick = joinRoom;
        $('#again').onclick = () => {
            S = newGame(firstNext); firstNext = firstNext === 1 ? 2 : 1; H = []; hint = -1;   // 輸家 / 對方先手：每局輪流先手
            if (mode === 'host') publish(); else { render(); scheduleCpu(); }
        };
        $('#undo').onclick = () => { const s = undoTo(H, mode === 'cpu' ? myPlayer : 0); if (!s) return; clearTimeout(cpuTimer); S = s; hint = -1; render(); scheduleCpu(); };
        $('#hint').onclick = () => { hint = hintCol(S); render(); };
        $('#copy').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copy'), url, () => prompt('請手動複製邀請連結：', url)); };
        $('#leave').onclick = () => location.reload();

        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
        show('menu');
    </script>
</body>

</html>
