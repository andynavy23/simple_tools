<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="翻牌記憶遊戲：單人挑戰最少步數，或建立房間與朋友（最多 4 人）輪流翻牌比誰配對得多。">
    <meta property="og:title" content="翻牌記憶遊戲" />
    <meta property="og:description" content="單人挑戰最少步數，或連線與朋友輪流翻牌。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/memory-match.html" />
    <meta name="st-keys" content="memory_best_*">
    <title>翻牌記憶遊戲</title>
    <template id="help">
        <h3>這是什麼</h3>
        <p>翻牌記憶遊戲：每次翻兩張，一樣就得分。一個人挑戰最少步數、和電腦比誰配對多，或連線與朋友（最多 4 人）輪流翻。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>訓練記憶力、打發時間</li>
        <li>和小孩或朋友比誰記得牢</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li><b>單人</b>（預設）：選難度（6 / 8 / 12 / 18 對），按「開始」。翻完所有牌，用越少步越好，畫面會顯示步數、時間與你的最佳步數</li>
        <li><b>和電腦比賽</b>：按上方「和電腦比賽」，選難度與電腦記憶力：簡單＝只記最近 4 張、普通＝記最近 10 張、困難＝幾乎全記。按「開始（你先翻）」</li>
        <li><b>連線</b>：按「連線 2–4 人」，輸入暱稱建立房間並傳邀請連結，朋友加入後房主按「開始遊戲」</li>
        <li>配對成功可以繼續翻；失敗則蓋回，換下一位（連線與電腦模式）</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">和電腦比賽、8 對：你翻到 🍎 和 🍌 沒配對，換電腦。電腦如果記得之前看過的 🍎，就會優先翻它，所以記憶力設定越高越難贏。</div>
        <h3>小提醒</h3>
        <ul>
        <li>電腦只記得「已經被翻開過」的牌，包括你翻開的，不會偷看蓋著的牌</li>
        <li>牌多（專家 18 對）時，困難電腦也會漏記一些</li>
        <li>每個難度的最佳步數分開記錄在本機</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --back: #5e5ce6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --back: #7d7aff;
            }
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        #modeBar .seg {
            flex: 1 1 auto;
            padding-left: 10px;
            padding-right: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        input {
            flex: 1 1 140px;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .players {
            margin-bottom: 12px;
        }

        .pl {
            padding: 6px 14px;
            border-radius: 14px;
        }

        .pl.turn {
            border-color: var(--c);
        }

        .pl b {
            color: var(--c);
        }

        #board {
            display: grid;
            gap: 8px;
        }

        .c {
            aspect-ratio: 1;
            padding: 0;
            border-radius: 14px;
            font-size: clamp(22px, 8vw, 40px);
            line-height: 1;
            background: var(--back);
            color: var(--text);
            transition: background .15s, transform .15s;
        }

        .c.up {
            background: var(--card);
            border: 2px solid var(--blue);
            transform: scale(1.04);
        }

        .c.matched {
            background: var(--fill);
            border: 3px solid var(--c, var(--blue));
            opacity: .85;
        }

        .c:disabled {
            opacity: 1;

        .c.down:disabled {

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>翻牌記憶遊戲</h1>
        <p class="sub">翻開兩張一樣的牌就得分。單人比步數，連線比誰配對多。</p>

        <div class="card" id="setup">
            <div class="row" id="modeBar">
                <button class="seg" data-mode="solo" aria-pressed="true">單人</button>
                <button class="seg" data-mode="cpu" aria-pressed="false">和電腦比賽</button>
                <button class="seg" data-mode="online" aria-pressed="false">連線 2–4 人</button>
            </div>
            <div class="row" id="diffRow">
                <label for="diff" class="muted">難度</label>
                <select id="diff">
                    <option value="6">簡單：6 對</option>
                    <option value="8" selected>普通：8 對</option>
                    <option value="12">困難：12 對</option>
                    <option value="18">專家：18 對</option>
                </select>
                <button class="primary" id="soloStart">開始</button>
            </div>
            <div class="row" id="cpuRow" hidden>
                <label for="cpuLevel" class="muted">電腦記憶力</label>
                <select id="cpuLevel">
                    <option value="easy">簡單：只記最近 4 張</option>
                    <option value="normal" selected>普通：記最近 10 張</option>
                    <option value="hard">困難：幾乎全記</option>
                </select>
                <button class="primary" id="cpuStart">開始（你先翻）</button>
            </div>
            <div id="onlineBox" hidden>
                <div class="row"><input id="nick" maxlength="10" placeholder="你的暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
                <div class="row">
                    <button class="primary" id="hostBtn">建立房間</button>
                    <input id="joinId" placeholder="貼上房號" aria-label="房號">
                    <button id="joinBtn">加入</button>
                </div>
                <div class="muted" id="netMsg"></div>
            </div>
        </div>

        <div class="card" id="lobby" hidden>
            <h2>等待玩家加入</h2>
            <div class="players" id="lobbyPlayers"></div>
            <div class="row" id="hostTools" hidden>
                <button id="copyInvite">複製邀請連結</button>
                <button class="primary" id="startOnline" disabled>開始遊戲</button>
            </div>
            <div class="muted" id="lobbyHint"></div>
        </div>

        <div class="card" id="game" hidden>
            <div class="players" id="scoreboard"></div>
            <div id="board"></div>
            <div id="msg" aria-live="polite"></div>
            <div class="row" style="justify-content:center;margin-top:12px">
                <button class="primary" id="again" hidden>再來一局</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

    <script>
        const { shuffle, store } = Util;

        // --- pure ---
        const MAX_PLAYERS = 4;
        const EMOJI = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🥝', '🍋', '🍉', '🥕', '🌽', '🍄', '🌸', '🌻', '🌈', '⭐', '🔥', '💧', '🍀', '🌙', '⚡', '❄️', '🎈', '🎁', '🎵', '🚀', '⚽', '🎲', '🐱', '🐶'];

        const makeDeck = (pairs) => { const p = shuffle(EMOJI).slice(0, pairs); return shuffle([...p, ...p]); };

        // 權威狀態只存在單人 / 房主端；牌面（deck）不會傳給其他人
        function createGame(deck, players) {
            return {
                deck, status: Array(deck.length).fill('down'), owner: Array(deck.length).fill(null),
                up: [], turn: 0, scores: Array(players).fill(0), active: Array(players).fill(true), moves: 0, over: false,
            };
        }

        function advance(g) {
            const n = g.active.length;
            for (let k = 1; k <= n; k++) { const t = (g.turn + k) % n; if (g.active[t]) { g.turn = t; return; } }
        }

        // 翻牌：只有輪到的玩家、未翻開的牌、場上不到 2 張翻開時才有效
        function flip(g, i, who) {
            if (g.over || who !== g.turn || !g.active[who]) return false;
            if (!Number.isInteger(i) || i < 0 || i >= g.deck.length || g.status[i] !== 'down' || g.up.length >= 2) return false;
            g.status[i] = 'up'; g.up.push(i);
            return true;
        }

        // 兩張都翻開後結算：配對成功→得分並繼續；失敗→蓋回並換人
        function resolve(g) {
            if (g.up.length !== 2) return null;
            const [a, b] = g.up;
            let r;
            if (g.deck[a] === g.deck[b]) {
                g.status[a] = g.status[b] = 'matched';
                g.owner[a] = g.owner[b] = g.turn;
                g.scores[g.turn]++;
                r = 'match';
            } else {
                g.status[a] = g.status[b] = 'down';
                advance(g);
                r = 'miss';
            }
            g.up = [];
            g.moves++;
            if (g.status.every(s => s === 'matched')) g.over = true;
            return r;
        }

        // 玩家離線：若正輪到他，翻開的牌蓋回並換人；只剩 1 人時結束
        function drop(g, who) {
            g.active[who] = false;
            if (g.turn === who) { g.up.forEach(i => { g.status[i] = 'down'; }); g.up = []; }
            if (g.active.filter(Boolean).length <= 1) g.over = true;
            else if (g.turn === who) advance(g);
        }

        // 要傳給玩家的畫面：未翻開的牌不含牌面
        const view = (g) => ({
            status: g.status, vals: g.status.map((s, i) => s === 'down' ? null : g.deck[i]), owner: g.owner,
            turn: g.turn, scores: g.scores, active: g.active, moves: g.moves, over: g.over,
        });

        // 成員端收到房主畫面時的格式檢查（房主端雖可信任，仍避免壞資料破壞畫面）
        function validView(v) {
            if (!v || typeof v !== 'object') return false;
            const n = v.status?.length, m = v.scores?.length;
            if (!Number.isInteger(n) || n < 2 || n > 36 || n % 2) return false;
            if (!Number.isInteger(m) || m < 1 || m > MAX_PLAYERS) return false;
            const len = (a, k) => Array.isArray(a) && a.length === k;
            if (!len(v.status, n) || !len(v.vals, n) || !len(v.owner, n) || !len(v.scores, m) || !len(v.active, m) || !len(v.names, m)) return false;
            if (!v.status.every(s => s === 'down' || s === 'up' || s === 'matched')) return false;
            if (!v.vals.every(x => x === null || (typeof x === 'string' && x.length <= 8))) return false;
            if (!v.owner.every(o => o === null || (Number.isInteger(o) && o >= 0 && o < m))) return false;
            if (!v.names.every(x => typeof x === 'string' && x.length <= 12)) return false;
            if (!v.scores.every(Number.isInteger) || !Number.isInteger(v.turn) || v.turn < 0 || v.turn >= m) return false;
            return typeof v.over === 'boolean';
        }

        // ---------- 電腦對手（單機）----------
        // 電腦只記得「翻開過」的牌（mem = [[位置, 牌面], …]，最近看到的在後面），最多記 cap 張，超過就忘掉最舊的。
        // 下面兩個選牌函式只收「牌的狀態」和記憶，看不到蓋著的牌面，所以不會偷看。
        const CPU_CAP = { easy: 4, normal: 10, hard: 30 };   // 困難：30 張，幾乎全記（專家 36 張牌時才會漏掉一點）
        const remember = (mem, i, v, cap) => [...mem.filter(m => m[0] !== i), [i, v]].slice(-Math.max(2, cap));
        const rpick = (a, rand) => a[Math.floor(rand() * a.length)];
        const downIdx = (status) => status.map((s, i) => (s === 'down' ? i : -1)).filter(i => i >= 0);
        // 第一張：記憶裡有「已知的一對」就翻其中一張；否則翻一張沒看過的（沒有就隨便翻）
        function cpuFirst(status, mem, rand = Math.random) {
            const known = mem.filter(([i]) => status[i] === 'down');
            for (let a = 0; a < known.length; a++) for (let b = a + 1; b < known.length; b++) if (known[a][1] === known[b][1]) return known[a][0];
            const seen = new Set(known.map(m => m[0])), fresh = downIdx(status).filter(i => !seen.has(i));
            return rpick(fresh.length ? fresh : downIdx(status), rand);
        }
        // 第二張（第一張 first 已翻開並記進 mem）：記憶裡有同樣牌面的另一張就翻它；否則翻一張沒看過的
        function cpuSecond(status, mem, first, rand = Math.random) {
            const f = mem.find(m => m[0] === first), hit = f && mem.find(m => m[0] !== first && status[m[0]] === 'down' && m[1] === f[1]);
            if (hit) return hit[0];
            const seen = new Set(mem.map(m => m[0])), rest = downIdx(status).filter(i => i !== first), fresh = rest.filter(i => !seen.has(i));
            return rpick(fresh.length ? fresh : rest, rand);
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const COLORS = ['#0a84ff', '#ff453a', '#30d158', '#ff9f0a'];
        const FLIP_BACK_MS = 900;
        let mode = 'solo', screen = 'menu';       // screen: menu | lobby | game
        let G = null, V = null, my = 0;           // G：權威狀態（單人/房主）；V：目前顯示的畫面
        let isHost = false, room = null, hostId = ''; // room：P2PRoom（房主或成員）
        let resolveTimer = null, soloStart = 0, soloTick = null;

        const show = (sel, on) => { $(sel).hidden = !on; };

        function updateScreens() {
            const menu = screen === 'menu', hostLobby = screen === 'lobby' && isHost;
            show('#setup', menu || hostLobby);             // 房主在大廳仍可調整難度
            show('#modeBar', menu);
            show('#diffRow', (menu && (mode === 'solo' || mode === 'cpu')) || hostLobby);
            show('#soloStart', menu && mode === 'solo');
            show('#cpuRow', menu && mode === 'cpu');
            show('#onlineBox', menu && mode === 'online');
            show('#lobby', screen === 'lobby');
            show('#game', screen === 'game');
        }

        // ---------- 畫面 ----------
        function buildBoard(n) {
            const cols = n <= 16 ? 4 : 6, b = $('#board');
            b.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            b.replaceChildren(...Array.from({ length: n }, (_, i) => {
                const c = document.createElement('button');
                c.className = 'c down';
                c.setAttribute('aria-label', `第 ${i + 1} 張牌`);
                c.onclick = () => onCard(i);
                return c;
            }));
        }

        function renderGame() {
            if (!V) return;
            const cards = $('#board').children;
            if (cards.length !== V.status.length) buildBoard(V.status.length);
            const upCount = V.status.filter(s => s === 'up').length;
            const myTurn = mode === 'solo' || V.turn === my;
            [...$('#board').children].forEach((c, i) => {
                const s = V.status[i];
                c.className = 'c ' + s;
                c.textContent = s === 'down' ? '' : V.vals[i];
                c.style.setProperty('--c', V.owner[i] === null ? '' : COLORS[V.owner[i]]);
                c.disabled = V.over || s !== 'down' || !myTurn || upCount >= 2;
            });
            const sb = $('#scoreboard');
            sb.replaceChildren();
            if (mode === 'solo') {
                const p = document.createElement('div');
                p.className = 'pl turn';
                p.style.setProperty('--c', COLORS[0]);
                p.innerHTML = '步數 <b></b> ・ 時間 <b></b> 秒 ・ 最佳 <b></b>';
                p.children[0].textContent = V.moves;
                p.children[1].textContent = soloSeconds();
                p.children[2].textContent = bestMoves() || '—';
                sb.append(p);
            } else {
                V.names.forEach((nm, i) => {
                    const p = document.createElement('div');
                    p.className = 'pl' + (i === V.turn && !V.over ? ' turn' : '') + (V.active[i] ? '' : ' off');
                    p.style.setProperty('--c', COLORS[i]);
                    p.append(nm + (i === my ? '（我）' : '') + ' ');
                    const b = document.createElement('b');
                    b.textContent = V.scores[i];
                    p.append(b);
                    sb.append(p);
                });
            }
            let msg = '';
            if (V.over) {
                if (mode === 'solo') {
                    msg = `🎉 完成！${V.moves} 步，${soloSeconds()} 秒`;
                } else {
                    const top = Math.max(...V.scores), win = V.names.filter((_, i) => V.scores[i] === top);
                    const alone = V.names.length > 1 && V.active.filter(Boolean).length <= 1;
                    msg = alone ? '其他玩家都離開了' : (win.length > 1 ? `平手：${win.join('、')}` : `🏆 ${win[0]} 獲勝`);
                }
            } else if (mode === 'cpu') {
                msg = V.turn === my ? '輪到你了' : '電腦思考中…';
            } else if (mode === 'online') {
                msg = V.turn === my ? '輪到你了' : `輪到 ${V.names[V.turn]}`;
            }
            $('#msg').textContent = msg;
            $('#again').hidden = !(V.over && (mode === 'solo' || mode === 'cpu' || isHost));
        }

        // ---------- 單人 ----------
        const bestKey = () => `memory_best_${$('#diff').value}`;
        const bestMoves = () => store.get(bestKey(), 0);
        const soloSeconds = () => soloStart ? Math.floor(((G && G.over ? soloEnd : Date.now()) - soloStart) / 1000) : 0;
        let soloEnd = 0;

        function startSolo() {
            mode = 'solo'; isHost = false;
            clearTimeout(resolveTimer); clearInterval(soloTick);
            G = createGame(makeDeck(+$('#diff').value), 1);
            soloStart = 0; soloEnd = 0;
            screen = 'game';
            $('#board').replaceChildren();
            publish();
            updateScreens();
        }

        // ---------- 和電腦比賽：你是 0 號、電腦是 1 號 ----------
        let cpuMem = [], cpuTimer = 0;
        function startCpu() {
            mode = 'cpu'; isHost = false; my = 0;
            clearTimeout(resolveTimer); clearTimeout(cpuTimer); clearInterval(soloTick);
            G = createGame(makeDeck(+$('#diff').value), 2); cpuMem = [];
            screen = 'game';
            $('#board').replaceChildren();
            publish();
            updateScreens();
        }
        // 輪到電腦時：稍等 → 翻第一張 → 稍等 → 翻第二張（配對 / 蓋回之後由 applyFlip 的結算計時再呼叫一次）
        function cpuStep() {
            clearTimeout(cpuTimer);
            if (mode !== 'cpu' || !G || G.over || G.turn !== 1 || G.up.length) return;
            cpuTimer = setTimeout(() => {
                applyFlip(cpuFirst(G.status, cpuMem), 1);
                cpuTimer = setTimeout(() => { if (G && mode === 'cpu' && G.up.length === 1) applyFlip(cpuSecond(G.status, cpuMem, G.up[0]), 1); }, 800);
            }, 700);
        }

        // ---------- 共用：翻牌流程（單人 / 電腦 / 房主） ----------
        function publish() {
            V = { ...view(G), names: mode === 'solo' ? ['你'] : mode === 'cpu' ? ['你', '電腦'] : room.players.map(p => p.nick) };
            renderGame();
            if (mode === 'online' && isHost) room.broadcast({ type: 'VIEW', v: V });
        }

        function applyFlip(i, who) {
            if (!flip(G, i, who)) return;
            if (mode === 'cpu') cpuMem = remember(cpuMem, i, G.deck[i], CPU_CAP[$('#cpuLevel').value]);   // 電腦看得到所有「翻開」的牌（含你翻的）
            if (mode === 'solo' && !soloStart) {
                soloStart = Date.now();
                soloTick = setInterval(() => { if (G && !G.over) renderGame(); }, 1000);
            }
            publish();
            if (G.up.length === 2) {
                clearTimeout(resolveTimer);
                resolveTimer = setTimeout(() => {
                    resolve(G);
                    if (G.over && mode === 'solo') {
                        soloEnd = Date.now();
                        clearInterval(soloTick);
                        const best = bestMoves();
                        if (!best || G.moves < best) store.set(bestKey(), G.moves);
                    }
                    publish();
                    cpuStep();
                }, FLIP_BACK_MS);
            }
        }

        function onCard(i) {
            if (mode === 'solo' || mode === 'cpu' || isHost) applyFlip(i, mode === 'solo' ? 0 : my);
            else if (room && V && V.turn === my) room.send({ type: 'FLIP', i });
        }

        // ---------- 連線（共用模組 P2PRoom） ----------
        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => { ['#hostBtn', '#joinBtn', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; }); };
        let lobbyNames = [];

        function readNick() {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        }

        function onNetError(err, message) {
            if (screen !== 'menu') return;
            netMsg(message);
            enableNet(true);
            if (room) { room.destroy(); room = null; }
        }

        // 房主
        function hostRoom() {
            const nick = readNick();
            if (!nick) return;
            enableNet(false);
            netMsg('連線中…');
            room = P2PRoom.host({
                nick,
                maxPlayers: MAX_PLAYERS,
                onReady(r) {
                    mode = 'online'; isHost = true; my = 0; hostId = r.id;
                    history.replaceState('', document.title, location.pathname + '#' + r.id);
                    screen = 'lobby';
                    renderLobby();
                    updateScreens();
                },
                canJoin: () => (screen === 'lobby' ? null : '遊戲已經開始'),
                onJoin: () => renderLobby(),
                onLeave(p) {
                    if (screen === 'lobby') return renderLobby();
                    if (G && !G.over) {
                        const wasTurn = G.turn === p.index;
                        drop(G, p.index);
                        if (wasTurn) clearTimeout(resolveTimer);
                        publish();
                    }
                },
                onMessage(p, d) {
                    if (d && d.type === 'FLIP' && screen === 'game' && G) applyFlip(d.i, p.index);
                },
                onError: onNetError,
            });
        }

        function startOnline() {
            if (!room || room.players.length < 2) return;
            room.prune();                 // 重賽前移除已離線者並重新編號，名單會同步給所有人
            if (room.players.length < 2) { room.keepSlots = false; screen = 'lobby'; renderLobby(); updateScreens(); return; }
            room.keepSlots = true;        // 遊戲中離線只標記，座位編號不變
            clearTimeout(resolveTimer);
            G = createGame(makeDeck(+$('#diff').value), room.players.length);
            screen = 'game';
            $('#board').replaceChildren();
            publish();
            updateScreens();
        }

        function renderLobby() {
            const names = isHost ? room.players.map(p => p.nick) : lobbyNames;
            $('#lobbyPlayers').replaceChildren(...names.map((n, i) => {
                const p = document.createElement('div');
                p.className = 'pl';
                p.style.setProperty('--c', COLORS[i]);
                p.textContent = n + (i === 0 ? ' 👑' : '') + (i === my ? '（我）' : '');
                return p;
            }));
            show('#hostTools', isHost);
            $('#startOnline').disabled = names.length < 2;
            $('#lobbyHint').textContent = isHost
                ? (names.length < 2 ? '把邀請連結傳給朋友，至少 2 人才能開始' : '人到齊了就按「開始遊戲」，也可以先選難度')
                : '等待房主開始遊戲…';
        }

        // 成員
        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false);
            netMsg('連線中…');
            mode = 'online'; isHost = false; hostId = id;
            room = P2PRoom.join(id, {
                nick,
                onRoster(players, me) {
                    lobbyNames = players.map(p => p.nick);
                    my = me; // 重賽前房主會移除離線者，座位編號可能改變
                    if (screen !== 'game') { V = null; screen = 'lobby'; renderLobby(); updateScreens(); }
                },
                onMessage(d) {
                    if (!d || d.type !== 'VIEW' || !validView(d.v)) return;
                    V = d.v;
                    if (screen !== 'game') { screen = 'game'; $('#board').replaceChildren(); updateScreens(); }
                    renderGame();
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (screen !== 'menu') { alert('房主已離開，遊戲結束'); location.reload(); } },
                onError: onNetError,
            });
        }

        // ---------- 事件 ----------
        document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
            mode = b.dataset.mode;
            document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
            updateScreens();
        });
        $('#soloStart').onclick = startSolo;
        $('#cpuStart').onclick = startCpu;
        $('#hostBtn').onclick = hostRoom;
        $('#joinBtn').onclick = joinRoom;
        $('#startOnline').onclick = startOnline;
        $('#again').onclick = () => (mode === 'solo' ? startSolo() : mode === 'cpu' ? startCpu() : startOnline());
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => {
            const url = P2PRoom.inviteLink(hostId);
            Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url));
        };

        if (P2PRoom.roomFromUrl()) {
            $('#joinId').value = P2PRoom.roomFromUrl();
            document.querySelector('[data-mode=online]').click();
        }
        updateScreens();
    </script>
</body>

</html>
