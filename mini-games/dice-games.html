    <template id="help">
        <h3>這是什麼</h3>
        <p>兩種骰子遊戲：<b>大話骰</b>（Liar's Dice，2–6 人，每人 5 顆骰子藏在骰盅裡輪流叫點、吹牛或抓包）與 <b>Yahtzee</b>（五顆骰、每回合最多擲三次、填滿 13 個計分格比總分）。可單機對電腦，也可連線和朋友玩。只想擲幾顆骰子請用「骰子」工具。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想玩有心理戰的派對遊戲（大話骰）。</li>
        <li>想一個人刷分，或和電腦比 Yahtzee。</li>
        </ul>
        <h3>怎麼玩：大話骰</h3>
        <ol>
        <li>每輪每人只看得到自己的骰子。輪到你時，<b>叫點</b>：說「全場至少有 N 個 F 點」，下一位必須提高數量，或同數量但點數更大；也可以選擇<b>開</b>上一位（第一手不能開）。</li>
        <li>開盅：全場所有人的骰子公開，數 F 點的總數。總數 ≥ 叫的數量 → 叫點成立，<b>開的人</b>輸一顆骰子；否則<b>叫的人</b>輸一顆。</li>
        <li>失去全部骰子就淘汰，最後存活的人獲勝。輸的人（還活著）下一輪先叫。</li>
        <li>可選規則「1 點萬用」：1 點可當作任何點數（此時不能叫 1 點）。</li>
        <li>單機選 1–5 個電腦。<b>簡單</b>只粗估全場期望值；<b>普通</b>依自己的骰子與總骰數用二項分布算機率決定叫或開。電腦<b>不會偷看</b>你的骰子。</li>
        </ol>
        <h3>怎麼玩：Yahtzee</h3>
        <ol>
        <li>輪到你按「擲骰」；之後點骰子可「保留」，再擲其餘的，每回合最多擲 3 次。</li>
        <li>擲完後點計分表上亮出的分數格填入（每格只能填一次，不合牌型就填 0）。填滿 13 格結束。</li>
        <li>上段一到六點：該點數總和；上段合計 ≥ 63 加 35 分。下段：三條 / 四條 = 五顆總和；葫蘆 25；小順（四連號）30；大順（五連號）40；Yahtzee（五顆全同）50；機會 = 五顆總和。</li>
        <li>可選規則：<b>Yahtzee 獎勵</b>（Yahtzee 格已得 50 時再擲出 Yahtzee 加 100）與 <b>Joker</b>（此時須先填上段對應格；上段已填則下段葫蘆 / 小順 / 大順可照滿分算）。</li>
        <li>單機可「單人刷分」（電腦 0）或對 1–3 個電腦；電腦會枚舉保留組合，挑期望值最高的。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">大話骰：共 4 人 20 顆骰，上家叫「6 個 3 點」。你手上只有 1 個 3，其餘 15 顆未知，每顆 1/6 → 還要 5 個以上的機率約 10%，可以選「開」。<br>Yahtzee：擲出 4-4-4-2-5，保留三個 4 再擲兩顆，可能得到四條或葫蘆。</div>
        <h3>連線規則與限制</h3>
        <ul>
        <li>選好遊戲與規則，輸入暱稱建立房間，把邀請連結傳給朋友；房主可再加電腦，按「開始」。大話骰最多 6 人、Yahtzee 最多 4 人。</li>
        <li>房主負責驗證：叫點是否合法、輪到誰、擲骰與保留、計分，成員改不了結果。</li>
        <li>大話骰每個人的骰子只傳給本人，房主端保管。每輪開始時房主公布每人「骰面 + 隨機鹽」的 SHA-256 承諾，開盅時公開骰面與鹽，所有人的瀏覽器自動核對，確認沒有中途換骰。<b>房主看得到全部骰子</b>（要由房主計分），請在朋友之間玩。</li>
        <li>有人斷線時他的位置由電腦託管，用同一個暱稱重新加入可接回；房主離開則遊戲結束。</li>
        </ul>
        <h3>小提醒</h3>
        <ul>
        <li>統計（場數、勝場、Yahtzee 單人最高分）與選項存在這台裝置：只有固定幾筆數字，不會無限成長。可按下方「清除統計」刪除統計（無法復原；頁面會重新載入，進行中的這一局會結束）；選項不會被清除。</li>
        <li>資料損壞時載入會忽略並使用預設值。進行中的對局不會儲存。</li>
        <li>純屬娛樂，不涉及金錢。</li>
        </ul>

    <script>
        const { rnd, sha256, randomHex } = Util;
        // --- pure ---
        const FACE = (n) => '⚀⚁⚂⚃⚄⚅'[n - 1] || '▫';
        const isInt = Number.isInteger;

        // ===== 大話骰 =====
        const LD_DICE = 5;
        const ldFaces = (wild) => (wild ? [2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6]);
        // a 比 b 高：數量更多，或同數量點數更大；b 為 null（第一手）時任何叫點都可
        const bidGt = (a, b) => !b || a.n > b.n || (a.n === b.n && a.f > b.f);
        const bidOk = (n, f, prev, total, wild) => isInt(n) && isInt(f) && n >= 1 && n <= total && ldFaces(wild).includes(f) && bidGt({ n, f }, prev);
        // 全場某點數的個數；萬用時 1 點算任何點數（叫的點數不是 1 時）
        const countFace = (hands, f, wild) => hands.reduce((s, h) => s + h.filter(x => x === f || (wild && x === 1 && f !== 1)).length, 0);
        // 開盅結算：bid 成立（count >= n）→ 開的人輸；否則叫的人輸
        const resolveCall = (bid, hands, wild) => { const count = countFace(hands, bid.f, wild); return { count, bidderWins: count >= bid.n }; };
        // 二項分布 P(X >= k)，X ~ B(n, p)
        function binomTail(n, p, k) {
            if (k <= 0) return 1; if (k > n) return 0;
            let pm = Math.pow(1 - p, n), cdf = 0;           // pm = P(X = i)
            for (let i = 0; i < k; i++) { cdf += pm; pm = pm * (n - i) / (i + 1) * p / (1 - p); }
            return Math.max(0, 1 - cdf);
        }
        const nextAlive = (g, i) => { let j = i; do { j = (j + 1) % g.seats.length; } while (!g.seats[j].alive); return j; };
        const totalDice = (g) => g.seats.reduce((s, x) => s + (x.alive ? x.dice : 0), 0);
        function ldDeal(g) {
            g.hands = g.seats.map(s => (s.alive ? Array.from({ length: s.dice }, () => rnd(6) + 1) : []));
            g.turn = g.starter; g.bid = null; g.phase = 'bid'; g.res = null;
        }
        function ldNew(names, humans, opts) {
            const g = { opts, seats: names.map((name, i) => ({ name, ai: i >= humans, human: i < humans, dice: LD_DICE, alive: true })), hands: [], turn: 0, bid: null, phase: 'bid', round: 1, res: null, winner: -1, starter: 0 };
            g.starter = rnd(names.length); ldDeal(g); return g;
        }
        function ldBid(g, i, n, f) {
            if (g.phase !== 'bid' || i !== g.turn) return '還沒輪到你';
            if (!bidOk(n, f, g.bid, totalDice(g), g.opts.wild)) return '叫點必須提高數量或點數，且不超過全場骰子數';
            g.bid = { n, f, by: i }; g.turn = nextAlive(g, i); return null;
        }
        function ldCall(g, i) {
            if (g.phase !== 'bid' || i !== g.turn) return '還沒輪到你';
            if (!g.bid) return '第一手不能開';
            const r = resolveCall(g.bid, g.hands, g.opts.wild), loser = r.bidderWins ? i : g.bid.by;
            g.res = { ...r, bidder: g.bid.by, caller: i, loser, n: g.bid.n, f: g.bid.f };
            const s = g.seats[loser]; s.dice--; if (s.dice <= 0) s.alive = false;
            g.starter = s.alive ? loser : nextAlive(g, loser);
            const alive = g.seats.map((x, k) => (x.alive ? k : -1)).filter(k => k >= 0);
            if (alive.length === 1) { g.phase = 'over'; g.winner = alive[0]; } else g.phase = 'reveal';
            return null;
        }
        function ldNext(g) { if (g.phase !== 'reveal') return '現在不能繼續'; g.round++; ldDeal(g); return null; }

        // 電腦決策：只用自己的骰子、全場總骰數、上一個叫點（不偷看）。回傳 { call:true } 或 { n, f }
        function ldAi(hand, total, bid, wild, lvl, rand = Math.random) {
            const unk = total - hand.length, faces = ldFaces(wild);
            const p = (f) => (wild && f !== 1 ? 1 / 3 : 1 / 6), own = (f) => countFace([hand], f, wild);
            const pr = (n, f) => binomTail(unk, p(f), n - own(f));
            const cands = [];
            for (let n = bid ? bid.n : 1; n <= Math.min(total, (bid ? bid.n : 1) + 1); n++) for (const f of faces) if (bidGt({ n, f }, bid)) cands.push({ n, f });
            if (lvl === 'easy') {
                const exp = total * p(bid ? bid.f : 2);
                if (bid && (bid.n > exp + 1 || !cands.length)) return { call: true };
                if (!bid) { const f = faces[rnd(faces.length)]; return { n: Math.max(1, Math.round(total * p(f) * 0.7)), f }; }
                const small = cands.filter(c => c.n <= exp + 1); const c = (small.length ? small : cands)[Math.floor(rand() * (small.length ? small : cands).length)];
                return c;
            }
            if (!bid) {   // 開局：每個點數叫「自己有的 + 其餘期望值的一部分」，挑機率最高（同分偏好數量大、點數我手上多）
                let best = null;
                for (const f of faces) { const n = Math.max(1, own(f) + Math.floor(unk * p(f) * 0.8)), q = pr(n, f) + own(f) * 1e-3; if (!best || q > best.q) best = { n, f, q }; }
                return { n: best.n, f: best.f };
            }
            if (!cands.length || pr(bid.n, bid.f) < 0.35) return { call: true };
            let best = null; for (const c of cands) { const q = pr(c.n, c.f); if (!best || q > best.q) best = { ...c, q }; }
            return best.q < 0.25 ? { call: true } : { n: best.n, f: best.f };
        }

        // ===== Yahtzee =====
        const YZ_NAMES = ['一點', '二點', '三點', '四點', '五點', '六點', '三條', '四條', '葫蘆', '小順', '大順', 'Yahtzee', '機會'];
        const YZ_BASE = [3, 6, 9, 12, 15, 18, 21, 13, 22, 29, 32, 15, 22];   // 各格的「平均期望」，電腦用來比較得失
        const yzCounts = (d) => { const c = [0, 0, 0, 0, 0, 0, 0]; d.forEach(x => c[x]++); return c; };
        // 單格得分；jk = Joker 規則生效（葫蘆 / 小順 / 大順照滿分算）
        function yzScore(c, d, jk) {
            const cnt = yzCounts(d), sum = d.reduce((a, b) => a + b, 0), mx = Math.max(...cnt), isY = mx === 5;
            const run = (len) => { let r = 0, best = 0; for (let f = 1; f <= 6; f++) { r = cnt[f] ? r + 1 : 0; best = Math.max(best, r); } return best >= len; };
            if (c < 6) return cnt[c + 1] * (c + 1);
            if (c === 6) return mx >= 3 ? sum : 0;
            if (c === 7) return mx >= 4 ? sum : 0;
            if (c === 8) return (cnt.includes(3) && cnt.includes(2)) || (jk && isY) ? 25 : 0;
            if (c === 9) return run(4) || (jk && isY) ? 30 : 0;
            if (c === 10) return run(5) || (jk && isY) ? 40 : 0;
            if (c === 11) return isY ? 50 : 0;
            return sum;
        }
        const yzNewCard = () => ({ s: Array(13).fill(null), yb: 0 });
        // 這手可填哪些格；joker 表示 Joker 規則生效。Joker 規則：擲出 Yahtzee 且 Yahtzee 格已填 → 先填上段對應格，其次下段，最後上段任一格
        function yzLegal(card, d, opts) {
            const open = []; card.s.forEach((v, i) => { if (v === null) open.push(i); });
            const isY = d[0] > 0 && d.every(x => x === d[0]);
            if (!opts.joker || !isY || card.s[11] === null) return { cats: open, joker: false };
            if (card.s[d[0] - 1] === null) return { cats: [d[0] - 1], joker: false };
            const low = open.filter(c => c >= 6);
            return { cats: low.length ? low : open, joker: true };
        }
        // 填格：回傳新的計分卡，不合法回傳 null
        function yzPlace(card, c, d, opts) {
            const L = yzLegal(card, d, opts);
            if (!isInt(c) || !L.cats.includes(c)) return null;
            const s = card.s.slice(), isY = d.every(x => x === d[0]);
            s[c] = yzScore(c, d, L.joker);
            return { s, yb: card.yb + (opts.bonus && isY && card.s[11] === 50 ? 1 : 0) };
        }
        function yzTotal(card) {
            const v = (i) => card.s[i] || 0, upper = [0, 1, 2, 3, 4, 5].reduce((a, i) => a + v(i), 0);
            const lower = [6, 7, 8, 9, 10, 11, 12].reduce((a, i) => a + v(i), 0), bonus = upper >= 63 ? 35 : 0, yb = card.yb * 100;
            return { upper, bonus, lower, yb, total: upper + bonus + lower + yb };
        }
        const yzDone = (card) => card.s.every(v => v !== null);
        // 目前這手最好的填法與其相對價值（得分減平均期望；上段加重，因為關係到 35 分獎勵）
        function yzBest(card, d, opts) {
            const L = yzLegal(card, d, opts); let v = -1e9, c = -1;
            for (const k of L.cats) { const sc = yzScore(k, d, L.joker), x = k < 6 ? (sc - YZ_BASE[k]) * 1.6 : sc - YZ_BASE[k]; if (x > v) { v = x; c = k; } }
            return { v, c };
        }
        // 電腦保留策略：枚舉 32 種保留組合，對重擲後所有結果取「最佳填法價值」的期望，選最大者（同分多保留）
        function yzKeep(card, d, opts) {
            const P6 = [1, 6, 36, 216, 1296, 7776], memo = new Map(); let bm = 31, bv = -1e9;
            const val = (cnt) => {
                let k = 0; for (let f = 0; f < 6; f++) k += cnt[f] * P6[f];
                let v = memo.get(k);
                if (v === undefined) { const dd = []; cnt.forEach((c, f) => { for (let j = 0; j < c; j++) dd.push(f + 1); }); v = yzBest(card, dd, opts).v; memo.set(k, v); }
                return v;
            };
            for (let mask = 31; mask >= 0; mask--) {
                const cnt = [0, 0, 0, 0, 0, 0]; let free = 0, pop = 0;
                for (let i = 0; i < 5; i++) { if (mask >> i & 1) { cnt[d[i] - 1]++; pop++; } else free++; }
                let sum = 0, n = 0;
                (function go(r) { if (!r) { sum += val(cnt); n++; return; } for (let f = 0; f < 6; f++) { cnt[f]++; go(r - 1); cnt[f]--; } })(free);
                const ev = sum / n + pop * 1e-6;
                if (ev > bv) { bv = ev; bm = mask; }
            }

            $('#area').innerHTML = `<div class="dice5" id="dice">${v.dice.map((x, k) => `<button data-k="${k}" aria-pressed="${heldUi[k]}" aria-label="第 ${k + 1} 顆骰子，${x || '未擲'}">${FACE(x)}</button>`).join('')}</div><table class="yz"><thead><tr><th></th>${th}</tr></thead><tbody>${rows}</tbody></table>`;
            if (mine && v.rolls < 3) {
                const r = Object.assign(document.createElement('button'), { id: 'rollBtn', className: 'primary', textContent: v.rolls === 0 ? '擲骰' : `再擲（剩 ${3 - v.rolls} 次）` });
                r.onclick = () => send({ k: 'roll', held: heldUi.slice() }); $('#ctl').append(r);
            }
        }
        $('#area').onclick = (e) => {
            const b = e.target.closest('button'); if (!b || !V || V.game !== 'yz') return;
            if (b.dataset.c !== undefined) return send({ k: 'score', c: +b.dataset.c });
            if (b.dataset.k !== undefined && V.turn === V.my && V.rolls > 0 && V.rolls < 3) { const k = +b.dataset.k; heldUi[k] = !heldUi[k]; b.setAttribute('aria-pressed', heldUi[k]); }
        };

        // ---------- 介面 ----------
        function fillNcomp() {
            const sel = $('#ncomp'), v = sel.value; sel.replaceChildren();
            const lo = tab === 'ld' ? (mode === 'solo' ? 1 : 0) : 0, hi = tab === 'ld' ? (mode === 'solo' ? 5 : 4) : 3;
            for (let i = lo; i <= hi; i++) sel.add(new Option(i === 0 ? '0（單人刷分）' : String(i), i));
            const d = tab === 'ld' ? 2 : 0; sel.value = v !== '' && +v >= lo && +v <= hi ? v : d;
            if (tab === 'yz' && mode === 'net') sel.options[0].textContent = '0';
        }
        function setTab(g) {
            tab = g; [...$('#games').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.g === g));
            $('#optsLd').hidden = g !== 'ld'; $('#optsYz').hidden = g !== 'yz'; $('#lLvl').hidden = g !== 'ld'; fillNcomp();
        }
        $('#games').onclick = (e) => { const b = e.target.closest('button'); if (!b || b.disabled) return; if (GS && !GS.st && isHost) { GS.game = b.dataset.g; setTab(b.dataset.g); push(); } else if (!V) setTab(b.dataset.g); };
        $('#modes').onclick = (e) => {
            const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m;
            [...$('#modes').children].forEach(x => x.setAttribute('aria-pressed', x === b));
            $('#rowSolo').hidden = mode !== 'solo'; $('#rowNet').hidden = mode !== 'net'; fillNcomp();
        };
        $('#soloGo').onclick = () => startGame(['你'], +$('#ncomp').value);
        $('#hostBtn').onclick = hostRoom; $('#joinBtn').onclick = joinRoom;
        $('#startBtn').onclick = () => {
            if (!isHost || !GS || GS.st) return; room.keepSlots = true;
            if (!room.players.every(p => p.connected)) return $('#st').textContent = '有人離線了';
            startGame(room.players.map(p => p.nick), +$('#ncomp').value).then(ok => { if (!ok) room.keepSlots = false; });
        };
        $('#next').onclick = () => send({ k: 'next' });
        $('#again').onclick = () => {
            lastRec = ''; heldKey = '';
            if (room) { room.keepSlots = false; room.prune(); GS = { game: tab, st: null }; push(); }
            else { V = null; GS = null; $('#play').hidden = true; $('#setup').hidden = false; $('#rowSolo').hidden = mode !== 'solo'; $('#games').querySelectorAll('button').forEach(b => { b.disabled = false; }); }
        };
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        ['#oWild', '#oJoker', '#oBonus', '#lvl'].forEach(s => { $(s).onchange = readOpts; });
        $('#clearStats').onclick = () => {
            if (!confirm('清除大話骰與 Yahtzee 的統計（場數、勝場、最高分）？無法復原。頁面會重新載入，進行中的這一局會結束。')) return;
            try { localStorage.removeItem('dice_stats'); } catch (e) { }
            location.reload();
        };
        loadOpts(); showStats(); setTab('ld');
        if (P2PRoom.roomFromUrl()) { $('#joinId').value = P2PRoom.roomFromUrl(); $('#modes button[data-m=net]').click(); }
    </script>
</body>

</html>
