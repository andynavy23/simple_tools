<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="踩地雷：初級、中級、高級三種難度，第一步一定安全，支援右鍵 / 長按 / 旗標模式插旗，記錄最佳時間。">
    <meta property="og:title" content="踩地雷" />
    <meta property="og:description" content="經典踩地雷，三種難度，記錄最佳時間。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/minesweeper.html" />
    <meta name="st-keys" content="mines_best_*,mines_daily_*">
    <title>踩地雷</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 900px;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .stat {
            background: var(--card);
            border-radius: 12px;
            padding: 6px 14px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .spacer {
            margin-left: auto;
        }

        .field {
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .field.zoom {
            overflow: auto;
            max-height: 68vh;
            overscroll-behavior: contain;
        }

        .field.zoom #grid {
            margin: 0;
        }

        #fitBtn[hidden] {
            display: none;
        }

        #grid {
            display: grid;
            gap: 2px;
            width: max-content;
            margin: 0 auto;
            padding: 6px;
            background: rgba(118, 118, 128, .3);
            border-radius: 12px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .c {
            width: max(var(--s), 18px);
            height: max(var(--s), 18px);
            padding: 0;
            min-width: 0;
            min-height: 0;
            border-radius: 5px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: calc(max(var(--s), 18px) * .55);
            line-height: 1;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
        }

        .c.open {
            background: var(--bg);
            cursor: default;
            box-shadow: inset 0 0 0 1px var(--fill);
        }

        .c.boom {
            background: var(--bad);
        }

        .n1 {
            color: #0a84ff;
        }

        .n2 {
            color: #30d158;
        }

        .n3 {
            color: #ff453a;
        }

        .n4 {
            color: #5e5ce6;
        }

        .n5 {
            color: #ff9f0a;
        }

        .n6 {
            color: #64d2ff;
        }

        .n7 {
            color: var(--text);
        }

        .n8 {
            color: var(--muted);
        }

        #msg {
            text-align: center;
            font-weight: 700;
            margin-top: 12px;
            min-height: 1.5em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>踩地雷</h1>
        <p class="sub">左鍵翻開，右鍵或長按插旗；點已翻開的數字，若周圍旗標數吻合會自動翻開其餘格子。</p>

        <div class="bar">
            <select id="level" aria-label="難度">
                <option value="9,9,10">初級 9×9（10 雷）</option>
                <option value="16,16,40">中級 16×16（40 雷）</option>
                <option value="30,16,99">高級 30×16（99 雷）</option>
            </select>
            <span class="stat">💣 <span id="left">0</span></span>
            <span class="stat">⏱ <span id="time">0</span></span>
            <button id="flagMode" aria-pressed="false" title="開啟後，點一下就是插旗（適合手機）">🚩 旗標模式</button>
            <button id="zoomBtn" aria-pressed="false" title="放大格子，可拖動捲動盤面（適合手機）">🔍 放大</button>
            <button id="fitBtn" hidden title="縮回整盤全貌">⤢ 回到全貌</button>
            <button id="daily" aria-pressed="false" title="每天同一個雷區，大家比誰快">每日挑戰</button>
            <button class="primary spacer" id="new">新遊戲</button>
        </div>

        <div class="field"><div id="grid" role="grid" aria-label="地雷區"></div></div>
        <div id="msg" role="status"></div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>經典踩地雷：翻開所有沒有地雷的格子就贏，翻到地雷就輸。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想動腦又不想花太久時。</li>
        <li>用「每日挑戰」和朋友比誰破關快。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>選難度：初級 9×9（10 雷）、中級 16×16（40 雷）、高級 30×16（99 雷）。</li>
        <li>點一格翻開。數字代表周圍 8 格有幾顆地雷；翻到空白會自動連鎖展開。第一下一定安全。</li>
        <li><b>插旗</b>：手機<b>長按</b>格子（約半秒），或先按「旗標模式」再點；電腦按右鍵。再插一次取消。</li>
        <li>點已翻開的數字，如果周圍旗標數剛好等於該數字，會自動翻開其餘格子。</li>
        <li>左上「💣」是剩餘雷數（地雷總數減去旗標數）。</li>
        </ol>
        <h3>勝負與計分</h3>
        <div class="eg">翻完所有安全格即過關，計時以秒計，越短越好，各難度分開記錄最佳。踩到地雷就失敗，會顯示所有地雷與標錯的旗。</div>
        <h3>小提醒</h3>
        <ul>
        <li>手機上中、高級盤會自動「放大」（格子 40px），在盤面上拖動即可捲動，不會誤開格；按「回到全貌」可縮成整盤，「放大」可再切回。</li>
        <li>「每日挑戰」每天固定同一個雷區（第一下點擊附近會略有不同）。</li>
        <li>長按插旗時手指不要移動，否則會被當作捲動。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 狀態：st 0=未翻開 1=已翻開 2=插旗；status: ready | playing | won | lost
        function create(w, h, mines) {
            const n = w * h;
            return { w, h, mines, mine: new Uint8Array(n), adj: new Uint8Array(n), st: new Uint8Array(n), placed: false, opened: 0, status: 'ready', boom: -1 };
        }

        function around(g, i) {
            const r = Math.floor(i / g.w), c = i % g.w, out = [];
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                const rr = r + dr, cc = c + dc;
                if (rr >= 0 && rr < g.h && cc >= 0 && cc < g.w) out.push(rr * g.w + cc);
            }
            return out;
        }

        // 每日挑戰的佈雷：先用種子亂數在全部格子中固定選出雷區，再把落在「第一次點擊的格子與周圍」的雷，
        // 依序搬到編號最小的空位。所以每個人看到的雷區幾乎一樣，只有第一次點擊附近會不同，且第一下一定安全
        function placeMinesFixed(g, first, rand) {
            const n = g.w * g.h, order = Array.from({ length: n }, (_, i) => i);
            for (let k = 0; k < g.mines; k++) { const j = k + rand(n - k); [order[k], order[j]] = [order[j], order[k]]; g.mine[order[k]] = 1; }
            let banned = new Set([first, ...around(g, first)]);
            if (n - banned.size < g.mines) banned = new Set([first]);
            for (const i of [...banned]) if (g.mine[i]) { g.mine[i] = 0; let t = 0; while (g.mine[t] || banned.has(t)) t++; g.mine[t] = 1; }
            for (let i = 0; i < n; i++) g.adj[i] = around(g, i).filter(j => g.mine[j]).length;
            g.placed = true;
        }

        // 第一次翻開時才佈雷：避開被點的格子與它周圍（空間不夠時只避開被點的格子）
        function placeMines(g, first, rand) {
            if (g.fixed) return placeMinesFixed(g, first, rand);
            let banned = new Set([first, ...around(g, first)]);
            if (g.w * g.h - banned.size < g.mines) banned = new Set([first]);
            const pool = [];
            for (let i = 0; i < g.w * g.h; i++) if (!banned.has(i)) pool.push(i);
            for (let k = 0; k < g.mines; k++) {            // 部分洗牌取前 mines 個
                const j = k + rand(pool.length - k);
                [pool[k], pool[j]] = [pool[j], pool[k]];
                g.mine[pool[k]] = 1;
            }
            for (let i = 0; i < g.w * g.h; i++) g.adj[i] = around(g, i).filter(j => g.mine[j]).length;
            g.placed = true;
        }

        function finish(g) {
            if (g.opened === g.w * g.h - g.mines) {
                g.status = 'won';
                for (let i = 0; i < g.mine.length; i++) if (g.mine[i]) g.st[i] = 2;
            }
        }

        // 翻開一格（含連鎖展開）
        function open(g, i, rand) {
            if (g.status === 'won' || g.status === 'lost' || g.st[i] !== 0) return;
            if (!g.placed) { placeMines(g, i, rand); g.status = 'playing'; }
            if (g.mine[i]) { g.status = 'lost'; g.boom = i; return; }
            const stack = [i];
            while (stack.length) {
                const k = stack.pop();
                if (g.st[k] !== 0) continue;
                g.st[k] = 1; g.opened++;
                if (g.adj[k] === 0) around(g, k).forEach(j => { if (g.st[j] === 0) stack.push(j); });
            }
            finish(g);
        }

        function toggleFlag(g, i) {
            if (g.status === 'won' || g.status === 'lost' || g.st[i] === 1) return;
            g.st[i] = g.st[i] === 2 ? 0 : 2;
        }

        // 點已翻開的數字：周圍旗標數 = 數字時，翻開其餘未插旗的格子
        function chord(g, i, rand) {
            if (g.st[i] !== 1 || g.adj[i] === 0 || g.status !== 'playing') return;
            const nb = around(g, i);
            if (nb.filter(j => g.st[j] === 2).length !== g.adj[i]) return;
            nb.forEach(j => { if (g.st[j] === 0) open(g, j, rand); });
        }

        const flagsLeft = (g) => g.mines - g.st.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);

        // 格子邊長（px）：放大模式固定 40；否則塞進寬度 boardW，上限 34、下限 18
        function cellSizeFor(boardW, cols, zoomed) {
            if (zoomed) return 40;
            return Math.max(18, Math.min(34, boardW / cols - 2));
        }
        // 點擊 vs 拖動：位移不超過 10px 且按下不超過 450ms 才算點擊
        function isTap(dx, dy, dt) { return Math.hypot(dx, dy) <= 10 && dt <= 450; }
        // --- /pure ---

        const { rnd, store } = Util;
        const $ = (s) => document.querySelector(s);
        let zoomOn = matchMedia('(pointer:coarse)').matches, down = null;
        let g, start = 0, timer = null, flagMode = false, daily = null, R = rnd;               // daily：日期字串；R：佈雷用的亂數

        const level = () => $('#level').value.split(',').map(Number);
        const bestKey = () => (daily ? `mines_daily_${daily}_` : 'mines_best_') + $('#level').value;

        function newGame(isDaily = false) {
            daily = isDaily === true ? Util.day.today() : null;
            R = daily ? Util.seeded(`mines-${daily}-${$('#level').value}`).int : rnd;
            $('#daily').setAttribute('aria-pressed', !!daily);
            const [w, h, m] = level();
            g = create(w, h, m); g.fixed = !!daily;
            clearInterval(timer); start = 0;
            $('#time').textContent = 0;
            $('#msg').textContent = '';
            const grid = $('#grid');
            grid.style.gridTemplateColumns = `repeat(${w}, auto)`;
            grid.style.setProperty('--cols', w);
            layout();
            grid.replaceChildren(...Array.from({ length: w * h }, (_, i) => {
                const b = document.createElement('button');
                b.className = 'c';
                b.dataset.i = i;
                return b;
            }));
            paint();
        }

        // 放大模式只在寬盤（>= 16 欄）生效
        function layout() {
            const z = zoomOn && g.w >= 16;
            $('.field').classList.toggle('zoom', z);
            $('#zoomBtn').setAttribute('aria-pressed', zoomOn);
            $('#fitBtn').hidden = !z;
            $('#grid').style.setProperty('--s', cellSizeFor(innerWidth - 44, g.w, z) + 'px');
        }

        function paint() {
            const cells = $('#grid').children;
            for (let i = 0; i < g.st.length; i++) {
                const c = cells[i], s = g.st[i];
                let cls = 'c', text = '';
                if (g.status === 'lost' && g.mine[i]) { text = g.st[i] === 2 ? '🚩' : '💣'; cls += i === g.boom ? ' open boom' : ' open'; }
                else if (g.status === 'lost' && s === 2) { text = '❌'; cls += ' open'; }
                else if (s === 1) { cls += ' open'; if (g.adj[i]) { text = g.adj[i]; cls += ' n' + g.adj[i]; } }
                else if (s === 2) text = '🚩';
                c.className = cls; c.textContent = text;
                c.setAttribute('aria-label', s === 1 ? `已翻開 ${g.adj[i]}` : s === 2 ? '旗標' : '未翻開');
            }
            $('#left').textContent = flagsLeft(g);
            if (g.status === 'won' || g.status === 'lost') {
                clearInterval(timer);
                const sec = Math.floor((Date.now() - start) / 1000);
                if (g.status === 'won') {
                    const best = store.get(bestKey(), 0);
                    const rec = !best || sec < best;
                    if (rec) store.set(bestKey(), sec);
                    $('#msg').textContent = `🎉 ${daily ? daily + ' 每日挑戰' : ''}過關！用時 ${sec} 秒${rec ? '（新紀錄）' : `（最佳 ${best} 秒）`}`;
                } else $('#msg').textContent = '💥 踩到地雷了';
            }
        }

        function act(i, flag) {
            if (flag) toggleFlag(g, i);
            else if (g.st[i] === 1) chord(g, i, R);
            else if (g.st[i] === 0) open(g, i, R);
            if (g.status === 'playing' && !start) {
                start = Date.now();
                timer = setInterval(() => { $('#time').textContent = Math.floor((Date.now() - start) / 1000); }, 250);
            }
            paint();
        }

        const grid = $('#grid');
        grid.addEventListener('pointerdown', (e) => { down = e.pointerType === 'touch' ? { x: e.clientX, y: e.clientY, t: Date.now() } : null; });   // 只防觸控拖動誤觸
        grid.addEventListener('click', (e) => { const b = e.target.closest('.c'); if (b && !longFired && (!down || isTap(e.clientX - down.x, e.clientY - down.y, Date.now() - down.t))) act(+b.dataset.i, flagMode); longFired = false; });
        grid.addEventListener('contextmenu', (e) => { e.preventDefault(); const b = e.target.closest('.c'); if (b) act(+b.dataset.i, true); });

        // 長按插旗（手機）
        let pressTimer = null, longFired = false;
        grid.addEventListener('touchstart', (e) => {
            const b = e.target.closest('.c'); if (!b) return;
            longFired = false;
            pressTimer = setTimeout(() => { longFired = true; act(+b.dataset.i, true); if (navigator.vibrate) navigator.vibrate(20); }, 450);
        }, { passive: true });
        ['touchend', 'touchmove', 'touchcancel'].forEach(t => grid.addEventListener(t, () => clearTimeout(pressTimer), { passive: true }));

        $('#flagMode').onclick = () => { flagMode = !flagMode; $('#flagMode').setAttribute('aria-pressed', flagMode); };
        $('#zoomBtn').onclick = () => { zoomOn = !zoomOn; layout(); };
        $('#fitBtn').onclick = () => { zoomOn = false; layout(); };
        addEventListener('resize', layout);
        $('#new').onclick = () => newGame(false);
        $('#daily').onclick = () => newGame(true);
        $('#level').onchange = () => newGame(!!daily);
        newGame(false);
    </script>
</body>

</html>
