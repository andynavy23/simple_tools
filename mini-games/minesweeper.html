<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="踩地雷：初級、中級、高級三種難度，第一步一定安全，支援右鍵 / 長按 / 旗標模式插旗，記錄最佳時間。">
    <meta property="og:title" content="踩地雷" />
    <meta property="og:description" content="經典踩地雷，三種難度，記錄最佳時間。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/minesweeper.html" />
    <title>踩地雷</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        :root {
            --wrap-w: 900px;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .stat {
            background: var(--card);
            border-radius: 12px;
            padding: 6px 14px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .spacer {
            margin-left: auto;
        }

        .field {
            overflow-x: auto;
            padding-bottom: 6px;
        }

        #grid {
            display: grid;
            gap: 2px;
            width: max-content;
            margin: 0 auto;
            padding: 6px;
            background: rgba(118, 118, 128, .3);
            border-radius: 12px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .c {
            --s: min(34px, calc((100vw - 64px) / var(--cols)));
            width: max(var(--s), 22px);
            height: max(var(--s), 22px);
            padding: 0;
            border-radius: 5px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: calc(max(var(--s), 22px) * .55);
            line-height: 1;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
        }

        .c.open {
            background: var(--bg);
            cursor: default;
            box-shadow: inset 0 0 0 1px var(--fill);
        }

        .c.boom {
            background: var(--bad);
        }

        .n1 {
            color: #0a84ff;
        }

        .n2 {
            color: #30d158;
        }

        .n3 {
            color: #ff453a;
        }

        .n4 {
            color: #5e5ce6;
        }

        .n5 {
            color: #ff9f0a;
        }

        .n6 {
            color: #64d2ff;
        }

        .n7 {
            color: var(--text);
        }

        .n8 {
            color: var(--muted);
        }

        #msg {
            text-align: center;
            font-weight: 700;
            margin-top: 12px;
            min-height: 1.5em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>踩地雷</h1>
        <p class="sub">左鍵翻開，右鍵或長按插旗；點已翻開的數字，若周圍旗標數吻合會自動翻開其餘格子。</p>

        <div class="bar">
            <select id="level" aria-label="難度">
                <option value="9,9,10">初級 9×9（10 雷）</option>
                <option value="16,16,40">中級 16×16（40 雷）</option>
                <option value="30,16,99">高級 30×16（99 雷）</option>
            </select>
            <span class="stat">💣 <span id="left">0</span></span>
            <span class="stat">⏱ <span id="time">0</span></span>
            <button id="flagMode" aria-pressed="false" title="開啟後，點一下就是插旗（適合手機）">🚩 旗標模式</button>
            <button class="primary spacer" id="new">新遊戲</button>
        </div>

        <div class="field"><div id="grid" role="grid" aria-label="地雷區"></div></div>
        <div id="msg" role="status"></div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 狀態：st 0=未翻開 1=已翻開 2=插旗；status: ready | playing | won | lost
        function create(w, h, mines) {
            const n = w * h;
            return { w, h, mines, mine: new Uint8Array(n), adj: new Uint8Array(n), st: new Uint8Array(n), placed: false, opened: 0, status: 'ready', boom: -1 };
        }

        function around(g, i) {
            const r = Math.floor(i / g.w), c = i % g.w, out = [];
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                const rr = r + dr, cc = c + dc;
                if (rr >= 0 && rr < g.h && cc >= 0 && cc < g.w) out.push(rr * g.w + cc);
            }
            return out;
        }

        // 第一次翻開時才佈雷：避開被點的格子與它周圍（空間不夠時只避開被點的格子）
        function placeMines(g, first, rand) {
            let banned = new Set([first, ...around(g, first)]);
            if (g.w * g.h - banned.size < g.mines) banned = new Set([first]);
            const pool = [];
            for (let i = 0; i < g.w * g.h; i++) if (!banned.has(i)) pool.push(i);
            for (let k = 0; k < g.mines; k++) {            // 部分洗牌取前 mines 個
                const j = k + rand(pool.length - k);
                [pool[k], pool[j]] = [pool[j], pool[k]];
                g.mine[pool[k]] = 1;
            }
            for (let i = 0; i < g.w * g.h; i++) g.adj[i] = around(g, i).filter(j => g.mine[j]).length;
            g.placed = true;
        }

        function finish(g) {
            if (g.opened === g.w * g.h - g.mines) {
                g.status = 'won';
                for (let i = 0; i < g.mine.length; i++) if (g.mine[i]) g.st[i] = 2;
            }
        }

        // 翻開一格（含連鎖展開）
        function open(g, i, rand) {
            if (g.status === 'won' || g.status === 'lost' || g.st[i] !== 0) return;
            if (!g.placed) { placeMines(g, i, rand); g.status = 'playing'; }
            if (g.mine[i]) { g.status = 'lost'; g.boom = i; return; }
            const stack = [i];
            while (stack.length) {
                const k = stack.pop();
                if (g.st[k] !== 0) continue;
                g.st[k] = 1; g.opened++;
                if (g.adj[k] === 0) around(g, k).forEach(j => { if (g.st[j] === 0) stack.push(j); });
            }
            finish(g);
        }

        function toggleFlag(g, i) {
            if (g.status === 'won' || g.status === 'lost' || g.st[i] === 1) return;
            g.st[i] = g.st[i] === 2 ? 0 : 2;
        }

        // 點已翻開的數字：周圍旗標數 = 數字時，翻開其餘未插旗的格子
        function chord(g, i, rand) {
            if (g.st[i] !== 1 || g.adj[i] === 0 || g.status !== 'playing') return;
            const nb = around(g, i);
            if (nb.filter(j => g.st[j] === 2).length !== g.adj[i]) return;
            nb.forEach(j => { if (g.st[j] === 0) open(g, j, rand); });
        }

        const flagsLeft = (g) => g.mines - g.st.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);
        // --- /pure ---

        const { rnd, store } = Util;
        const $ = (s) => document.querySelector(s);
        let g, start = 0, timer = null, flagMode = false;

        const level = () => $('#level').value.split(',').map(Number);
        const bestKey = () => 'mines_best_' + $('#level').value;

        function newGame() {
            const [w, h, m] = level();
            g = create(w, h, m);
            clearInterval(timer); start = 0;
            $('#time').textContent = 0;
            $('#msg').textContent = '';
            const grid = $('#grid');
            grid.style.gridTemplateColumns = `repeat(${w}, auto)`;
            grid.style.setProperty('--cols', w);
            grid.replaceChildren(...Array.from({ length: w * h }, (_, i) => {
                const b = document.createElement('button');
                b.className = 'c';
                b.dataset.i = i;
                return b;
            }));
            paint();
        }

        function paint() {
            const cells = $('#grid').children;
            for (let i = 0; i < g.st.length; i++) {
                const c = cells[i], s = g.st[i];
                let cls = 'c', text = '';
                if (g.status === 'lost' && g.mine[i]) { text = g.st[i] === 2 ? '🚩' : '💣'; cls += i === g.boom ? ' open boom' : ' open'; }
                else if (g.status === 'lost' && s === 2) { text = '❌'; cls += ' open'; }
                else if (s === 1) { cls += ' open'; if (g.adj[i]) { text = g.adj[i]; cls += ' n' + g.adj[i]; } }
                else if (s === 2) text = '🚩';
                c.className = cls; c.textContent = text;
                c.setAttribute('aria-label', s === 1 ? `已翻開 ${g.adj[i]}` : s === 2 ? '旗標' : '未翻開');
            }
            $('#left').textContent = flagsLeft(g);
            if (g.status === 'won' || g.status === 'lost') {
                clearInterval(timer);
                const sec = Math.floor((Date.now() - start) / 1000);
                if (g.status === 'won') {
                    const best = store.get(bestKey(), 0);
                    const rec = !best || sec < best;
                    if (rec) store.set(bestKey(), sec);
                    $('#msg').textContent = `🎉 過關！用時 ${sec} 秒${rec ? '（新紀錄）' : `（最佳 ${best} 秒）`}`;
                } else $('#msg').textContent = '💥 踩到地雷了';
            }
        }

        function act(i, flag) {
            if (flag) toggleFlag(g, i);
            else if (g.st[i] === 1) chord(g, i, rnd);
            else if (g.st[i] === 0) open(g, i, rnd);
            if (g.status === 'playing' && !start) {
                start = Date.now();
                timer = setInterval(() => { $('#time').textContent = Math.floor((Date.now() - start) / 1000); }, 250);
            }
            paint();
        }

        const grid = $('#grid');
        grid.addEventListener('click', (e) => { const b = e.target.closest('.c'); if (b && !longFired) act(+b.dataset.i, flagMode); longFired = false; });
        grid.addEventListener('contextmenu', (e) => { e.preventDefault(); const b = e.target.closest('.c'); if (b) act(+b.dataset.i, true); });

        // 長按插旗（手機）
        let pressTimer = null, longFired = false;
        grid.addEventListener('touchstart', (e) => {
            const b = e.target.closest('.c'); if (!b) return;
            longFired = false;
            pressTimer = setTimeout(() => { longFired = true; act(+b.dataset.i, true); if (navigator.vibrate) navigator.vibrate(20); }, 450);
        }, { passive: true });
        ['touchend', 'touchmove', 'touchcancel'].forEach(t => grid.addEventListener(t, () => clearTimeout(pressTimer), { passive: true }));

        $('#flagMode').onclick = () => { flagMode = !flagMode; $('#flagMode').setAttribute('aria-pressed', flagMode); };
        $('#new').onclick = newGame;
        $('#level').onchange = newGame;
        newGame();
    </script>
</body>

</html>
