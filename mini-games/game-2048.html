<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="2048：經典滑動合併遊戲，支援鍵盤方向鍵、WASD 與手機滑動，記錄最高分。">
    <meta property="og:title" content="2048" />
    <meta property="og:description" content="經典滑動合併遊戲，記錄最高分。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/game-2048.html" />
    <meta name="st-keys" content="g2048_best,g2048_daily">
    <title>2048</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 440px;
        }

        .top {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-bottom: 14px;
        }

        .score {
            flex: 1;
            background: var(--card);
            border-radius: 14px;
            padding: 8px 14px;
            text-align: center;
        }

        .score small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .score b {
            font-size: 22px;
            font-variant-numeric: tabular-nums;
        }

        #board {
            position: relative;
            background: rgba(118, 118, 128, .32);
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            touch-action: none;
            user-select: none;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 10px;
            background: rgba(255, 255, 255, .25);
        }

        /* 方塊層：絕對定位，只動畫 transform / opacity；位置用百分比，縮放視窗不會錯位 */
        #tiles {
            position: absolute;
            inset: 10px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            left: 0;
            top: 0;
            width: calc((100% - 30px) / 4);
            aspect-ratio: 1;
            transition: transform .12s ease-out;
            will-change: transform;
        }

        .tile i {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-style: normal;
            font-weight: 800;
            font-size: clamp(22px, 8vw, 40px);
            color: #776e65;
        }

        .tile i.spawn {
            animation: spawn .15s ease-out;
        }

        .tile i.merge {
            animation: mpop .15s ease-out;
        }

        @keyframes spawn {
            from {
                transform: scale(.2);
                opacity: 0;
            }
        }

        @keyframes mpop {
            50% {
                transform: scale(1.18);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tile {
                transition: none;
            }

            .tile i {
                animation: none !important;
            }
        }

        .v2 {
            background: #eee4da;
        }

        .v4 {
            background: #ede0c8;
        }

        .v8 {
            background: #f2b179;
            color: #fff;
        }

        .v16 {
            background: #f59563;
            color: #fff;
        }

        .v32 {
            background: #f67c5f;
            color: #fff;
        }

        .v64 {
            background: #f65e3b;
            color: #fff;
        }

        .v128 {
            background: #edcf72;
            color: #fff;
            font-size: clamp(20px, 7vw, 34px);
        }

        .v256 {
            background: #edcc61;
            color: #fff;
            font-size: clamp(20px, 7vw, 34px);
        }

        .v512 {
            background: #edc850;
            color: #fff;
            font-size: clamp(20px, 7vw, 34px);
        }

        .v1024 {
            background: #edc53f;
            color: #fff;
            font-size: clamp(16px, 6vw, 28px);
        }

        .v2048 {
            background: #edc22e;
            color: #fff;
            font-size: clamp(16px, 6vw, 28px);
        }

        .vbig {
            background: #3c3a32;
            color: #fff;
            font-size: clamp(14px, 5vw, 24px);
        }

        #msg {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: color-mix(in srgb, var(--card) 85%, transparent);
            display: grid;
            place-content: center;
            gap: 12px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>2048</h1>
        <p class="sub">方向鍵 / WASD / 手機滑動。相同數字相撞就會合併。可玩「每日挑戰」，每天同一組亂數。</p>

        <div class="top">
            <div class="score"><small>分數</small><b id="score">0</b></div>
            <div class="score"><small>最高分</small><b id="best">0</b></div>
            <button id="new">新遊戲</button>
            <button id="daily" aria-pressed="false" title="每天同一組亂數，大家比同一局">每日挑戰</button>
        </div>
        <p class="muted" id="dailyInfo" style="margin:-6px 0 10px;font-size:13px" hidden></p>

        <div id="board" aria-label="遊戲盤面">
            <div id="tiles"></div>
            <div id="msg" hidden role="status"><span id="msgText"></span><span><button class="primary" id="again">再來一局</button> <button id="keep" hidden>繼續玩</button></span></div>
        </div>
        <button class="sm" id="clearBest" style="margin-top:12px">清除最佳紀錄</button>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>經典 2048：在 4×4 的格子裡滑動合併數字，目標是做出 2048。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>通勤、排隊時消磨幾分鐘。</li>
        <li>和朋友用「每日挑戰」比同一組亂數誰分數高。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>手機在棋盤上<b>往上下左右滑動</b>；電腦按方向鍵或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>。</li>
        <li>所有方塊會一起往該方向滑，兩個相同數字撞在一起就合併成兩倍。</li>
        <li>每次有效移動後，空格會冒出一個新的 2（90%）或 4（10%）。</li>
        <li>出現 2048 就過關（可選「繼續玩」）；整盤塞滿又無法移動就結束。</li>
        <li>「新遊戲」重開；「每日挑戰」每天用同一組亂數，大家比同一局。</li>
        </ol>
        <h3>計分</h3>
        <div class="eg">每次合併，得到「合併後的數字」分數：2+2 合成 4 得 4 分，4+4 合成 8 得 8 分。分數會累加，並記錄最高分。</div>
        <h3>小提醒</h3>
        <ul>
        <li>滑動時畫面不會跟著捲動，請在棋盤區域內滑。</li>
        <li>每日挑戰另外記錄「今日最高」，不影響一般最高分。</li>
        <li>不能移動的方向不會產生新方塊。</li>
        <li>方塊有滑動、合併與新增的小動畫；系統開啟「減少動態效果」時會自動關閉動畫（計分與結果不受影響）。</li>
            <li>最佳紀錄存在這台裝置；想重來可按頁面下方的「清除最佳紀錄」（只清這個遊戲，無法復原；頁面會重新載入，進行中的這一局會結束）。</li>
</ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const N = 4;
        const emptyBoard = () => Array.from({ length: N }, () => new Array(N).fill(0));

        // 把一行（或一列）往「開頭」方向滑動合併；回傳 { line, gained }
        function slideLine(line) {
            const tiles = line.filter(Boolean), out = [];
            let gained = 0;
            for (let i = 0; i < tiles.length; i++) {
                if (tiles[i] === tiles[i + 1]) { out.push(tiles[i] * 2); gained += tiles[i] * 2; i++; }
                else out.push(tiles[i]);
            }
            while (out.length < N) out.push(0);
            return { line: out, gained };
        }

        // dir: 'left' | 'right' | 'up' | 'down'；回傳 { board, moved, gained }（不改動輸入）
        function move(board, dir) {
            const b = board.map(r => [...r]);
            let gained = 0, moved = false;
            for (let k = 0; k < N; k++) {
                // 取出第 k 行 / 列，轉成「往開頭滑」的方向
                const get = (i) => {
                    switch (dir) {
                        case 'left': return b[k][i];
                        case 'right': return b[k][N - 1 - i];
                        case 'up': return b[i][k];
                        default: return b[N - 1 - i][k];
                    }
                };
                const set = (i, v) => {
                    switch (dir) {
                        case 'left': b[k][i] = v; break;
                        case 'right': b[k][N - 1 - i] = v; break;
                        case 'up': b[i][k] = v; break;
                        default: b[N - 1 - i][k] = v;
                    }
                };
                const before = Array.from({ length: N }, (_, i) => get(i));
                const res = slideLine(before);
                gained += res.gained;
                res.line.forEach((v, i) => { if (v !== before[i]) moved = true; set(i, v); });
            }
            return { board: b, moved, gained };
        }

        // 在隨機空格生出 2（90%）或 4（10%）；rand(n) 回傳 [0,n) 整數，rate 是 [0,1) 小數
        function spawn(board, rand, rate) {
            const empty = [];
            board.forEach((r, y) => r.forEach((v, x) => { if (!v) empty.push([y, x]); }));
            if (!empty.length) return null;
            const [y, x] = empty[rand(empty.length)];
            const b = board.map(r => [...r]);
            b[y][x] = rate() < 0.9 ? 2 : 4;
            return { board: b, pos: [y, x] };
        }

        // 動畫用軌跡：每個原有方塊 { from, to, v, merged }（merged 的兩個方塊 to 相同）；board / gained / moved 與 move() 一致
        function moveTrace(board, dir) {
            const pos = (k, i) => dir === 'left' ? [k, i] : dir === 'right' ? [k, N - 1 - i] : dir === 'up' ? [i, k] : [N - 1 - i, k];
            const moves = [], b = emptyBoard();
            let gained = 0;
            for (let k = 0; k < N; k++) {
                const tiles = [];
                for (let i = 0; i < N; i++) { const [y, x] = pos(k, i), v = board[y][x]; if (v) tiles.push({ v, from: [y, x] }); }
                for (let t = 0, j = 0; t < tiles.length; t++, j++) {
                    const a = tiles[t], c = tiles[t + 1], to = pos(k, j);
                    if (c && c.v === a.v) {
                        moves.push({ from: a.from, to, v: a.v, merged: true }, { from: c.from, to, v: c.v, merged: true });
                        b[to[0]][to[1]] = a.v * 2; gained += a.v * 2; t++;
                    } else { moves.push({ from: a.from, to, v: a.v, merged: false }); b[to[0]][to[1]] = a.v; }
                }
            }
            return { moves, board: b, gained, moved: moves.some(m => m.from[0] !== m.to[0] || m.from[1] !== m.to[1]) };
        }

        const canMove = (board) => ['left', 'right', 'up', 'down'].some(d => move(board, d).moved);
        const maxTile = (board) => Math.max(...board.flat());
        // --- /pure ---

        const { rnd, store } = Util;
        const $ = (s) => document.querySelector(s);
        const boardEl = $('#board');
        let board, score, best = store.get('g2048_best', 0), won = false, over = false;
        let daily = null, R = { int: rnd, float: () => rnd(1000) / 1000 };            // daily：{ date, best }；R：目前使用的亂數（每日挑戰用種子亂數）
        const today = () => Util.day.today();
        const dailyBest = () => { const d = store.get('g2048_daily', null); return d && d.date === today() ? d.best : 0; };
        for (let i = 0; i < N * N; i++) { const c = document.createElement('div'); c.className = 'cell'; boardEl.insertBefore(c, $('#msg')); }

        // --- 方塊動畫（純視覺；遊戲邏輯仍由 board / move() 決定）---
        const tilesEl = $('#tiles'), DUR = 120;
        let grid = null, pending = null, timer = 0;            // grid：每格目前的方塊 { v, y, x, el }；pending：滑動結束後要做的事
        const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        const place = (t) => { t.el.style.transform = `translate(calc(${t.x} * (100% + 10px)), calc(${t.y} * (100% + 10px)))`; };
        function mkTile(v, y, x, cls) {
            const t = { v, y, x, el: document.createElement('div') };
            t.el.className = 'tile';
            t.el.innerHTML = `<i class="${v > 2048 ? 'vbig' : 'v' + v}${cls ? ' ' + cls : ''}">${v}</i>`;
            place(t); tilesEl.appendChild(t.el);
            return t;
        }
        function rebuild() {
            clearTimeout(timer); pending = null; tilesEl.textContent = '';
            grid = board.map((r, y) => r.map((v, x) => v ? mkTile(v, y, x) : null));
        }
        // 滑動結束：移除被合併的舊方塊、放上合併後與新生的方塊、顯示過關 / 結束訊息；可被新輸入提前呼叫
        function settle() {
            clearTimeout(timer);
            const p = pending; if (!p) return;
            pending = null;
            p.drop.forEach(t => t.el.remove());
            p.add.forEach(([t, cls]) => { t.el = mkTile(t.v, t.y, t.x, cls).el; });
            if (p.msg) showMsg(...p.msg);
        }
        function animate(oldBoard, dir, spawnPos, msg) {
            const tr = moveTrace(oldBoard, dir), next = board.map(r => r.map(() => null)), drop = [], add = [];
            tr.moves.forEach(m => {
                const t = grid[m.from[0]][m.from[1]]; t.y = m.to[0]; t.x = m.to[1]; place(t);
                if (m.merged) { drop.push(t); if (!next[t.y][t.x]) { next[t.y][t.x] = { v: m.v * 2, y: t.y, x: t.x }; add.push([next[t.y][t.x], 'merge']); } }
                else next[t.y][t.x] = t;
            });
            if (spawnPos) { const [y, x] = spawnPos; next[y][x] = { v: board[y][x], y, x }; add.push([next[y][x], 'spawn']); }
            grid = next; pending = { drop, add, msg };
            if (reduced()) settle(); else timer = setTimeout(settle, DUR + 20);
        }

        function render() {
            $('#score').textContent = score;
            $('#best').textContent = best;
        }

        function showMsg(text, canKeep) {
            $('#msgText').textContent = text;
            $('#keep').hidden = !canKeep;
            $('#msg').hidden = false;
        }

        function start(isDaily = false) {
            daily = isDaily === true ? { date: today() } : null;
            if (daily) { const r = Util.seeded('2048-' + daily.date); R = { int: r.int, float: r }; } else R = { int: rnd, float: () => rnd(1000) / 1000 };
            $('#daily').setAttribute('aria-pressed', !!daily); $('#dailyInfo').hidden = !daily;
            if (daily) $('#dailyInfo').textContent = `${daily.date} 每日挑戰：今天大家的亂數序列相同。今日最高 ${dailyBest()} 分`;
            board = emptyBoard(); score = 0; won = false; over = false;
            for (let i = 0; i < 2; i++) board = spawn(board, R.int, R.float).board;
            $('#msg').hidden = true;
            rebuild(); render();
        }

        function play(dir) {
            settle();                                       // 上一個動畫還沒結束就先完成它，不漏輸入
            if (over || !$('#msg').hidden) return;
            const r = move(board, dir);
            if (!r.moved) return;
            const old = board;
            board = r.board; score += r.gained;
            const s = spawn(board, R.int, R.float);
            if (s) board = s.board;
            if (!daily && score > best) { best = score; store.set('g2048_best', best); }
            if (daily && score > dailyBest()) { store.set('g2048_daily', { date: daily.date, best: score }); $('#dailyInfo').textContent = `${daily.date} 每日挑戰：今天大家的亂數序列相同。今日最高 ${score} 分`; }
            render();
            let msg = null;
            if (!won && maxTile(board) >= 2048) { won = true; msg = ['🎉 達成 2048！', true]; }
            else if (!canMove(board)) { over = true; msg = ['遊戲結束', false]; }
            animate(old, dir, s && s.pos, msg);
        }

        const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
        addEventListener('keydown', (e) => {
            const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
            if (d && !e.ctrlKey && !e.metaKey) { e.preventDefault(); play(d); }
        });

        // 手機滑動
        let t0 = null;
        boardEl.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; t0 = [t.clientX, t.clientY]; }, { passive: true });
        boardEl.addEventListener('touchend', (e) => {
            if (!t0) return;
            const t = e.changedTouches[0], dx = t.clientX - t0[0], dy = t.clientY - t0[1];
            t0 = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            play(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        });

        $('#new').onclick = () => start(false);
        $('#again').onclick = () => start(!!daily);
        $('#daily').onclick = () => start(true);
        $('#keep').onclick = () => { $('#msg').hidden = true; };
        start(false);
    </script>
<script>document.getElementById('clearBest').onclick=()=>{if(!confirm('清除這個遊戲的所有最佳紀錄？無法復原。頁面會重新載入，正在進行的這一局會結束。'))return;try{const p=['g2048_best', 'g2048_daily'];Object.keys(localStorage).filter(k=>p.some(x=>k.startsWith(x))).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};</script>
</body>

</html>
