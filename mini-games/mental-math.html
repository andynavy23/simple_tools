    <div class="wrap">

        <h1>心算練習</h1>
        <p class="sub">選好運算與位數就開始。用下方數字鍵或鍵盤作答，答完立刻出下一題。</p>

        <div class="card" id="setup">

            <div class="seg w" id="types"><button data-t="arith" aria-pressed="true">四則運算</button><button data-t="frac" aria-pressed="false">分數</button><button data-t="pct" aria-pressed="false">百分比</button><button data-t="unit" aria-pressed="false">單位換算</button><button data-t="time" aria-pressed="false">時間計算</button><button data-t="match" aria-pressed="false">算式配對</button></div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>心算練習：四則運算，加上分數比大小、百分比、單位換算、時間計算與算式配對。電腦出題、你作答，結束後看正確率、平均每題秒數與錯題回顧，並記錄各種模式的最佳成績。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>通勤、排隊時花一分鐘動動腦。</li>
        <li>小朋友練習九九乘法、分數、折扣與時間。</li>
        <li>購物算折扣、算出門時間、換算食譜單位。</li>
        <li>想測試自己的心算速度是否進步。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>先選「題型」：四則運算、分數、百分比、單位換算、時間計算、算式配對。只有四則運算與算式配對有位數與運算選項。</li>
        <li>四則運算與算式配對可選「難度預設」（簡單 / 普通 / 困難）快速設定，或自己選運算（可複選）、位數（1–3 位）、模式。</li>
        <li>模式有 10 題、20 題、50 題，或「限時 60 秒」（時間內盡量多答）。</li>
        <li>「減法不出負數」打勾時，減法一定是大數減小數。</li>
        <li>按「開始」。用畫面上的數字鍵作答（± 切換負號、⌫ 刪一位），按「送出」；電腦鍵盤可直接按數字、Backspace 與 <kbd>Enter</kbd>。</li>
        <li>答完立刻出下一題，不能重答。結束後顯示正確率、平均每題秒數與錯題回顧。</li>
        </ol>
        <h3>題目規則</h3>
        <div class="eg">加減：兩個數都是所選位數（1 位為 2–9）。乘法：被乘數是所選位數，乘數 1 位（選 3 位時為 2 位）。除法：一定整除，除數同乘數規則，商為所選位數（選 3 位時商為 2 位）。</div>
        <h3>其他題型的規則</h3>
        <div class="eg">分數：比大小（輸入 1＝左邊大、2＝右邊大、3＝一樣大）、通分（輸入最小公分母）、約分（輸入最簡分數的分母）。分母在 2–12。
百分比：折扣（打幾折）、漲價 / 降價、占幾 %、求某數的幾 %。答案一律「最多一位小數」，出題時保證剛好除得盡，不用四捨五入；用 . 鍵輸入小數點（8.5 折＝85%）。
單位換算：公釐 / 公分 / 公尺 / 公里、公克 / 公斤 / 公噸、毫升 / 公升，以及秒 / 分鐘 / 小時 / 天 / 週；答案最多一位小數。
時間計算：經過幾分鐘、再過多久、多久以前，24 小時制與 12 小時制混合出現，跨過午夜也算。答案輸入時分數字：24 小時制 08:05 輸入 805；12 小時制 4:35 輸入 435（不用管上午下午）。
算式配對：6 個算式配 6 個答案，左邊點算式、右邊點答案；限時 90 秒，成績 = 用時 + 每次失誤 3 秒，越低越好；全部配對才計入最佳。算式難度吃上方位數與運算設定。</div>
        <h3>範例與計分</h3>
        <div class="eg">設定：加法 + 乘法、2 位數、20 題。
題目：47 + 36 → 輸入 83，按 Enter；下一題 12 × 7 → 輸入 84。
結束：答對 18 題、總共用 64 秒 → 正確率 90%、平均每題 3.2 秒；錯的 2 題會列出你的答案與正確答案。</div>
        <p>最佳成績依「題數或限時、位數、運算組合」分開記錄：題數模式先比正確率、再比總用時，限時模式比答對題數；中途按「結束」不計入最佳。</p>
        <h3>小提醒</h3>
        <ul>
        <li>最佳成績依「模式 + 位數 + 運算組合」分開記錄：題數模式比正確率（同分比總用時），限時模式比答對題數。中途按「結束」的題數模式不計入最佳。</li>
        <li>每種題型 / 組合各有最佳紀錄（鍵名 mentalmath_best_ 開頭）；算式配對另外依位數與運算分開。</li>
        <li>最佳紀錄存在這台裝置；想重來可按頁面下方的「清除最佳紀錄」（只清這個遊戲，無法復原；頁面會重新載入，進行中的這一局會結束）。</li>
        <li>手機上用自訂的數字鍵盤，不會跳出系統鍵盤。</li>
        <li>備份資料的鍵：mentalmath_best_ 開頭（最多約幾百個組合，不會無限增加）。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 出題與判分。rand 是回傳 [0,1) 的函式（測試可注入）；ops 用 + - * /
        const MM = { TIMED_MS: 60000, COUNTS: [10, 20, 50] };
        const ri = (rand, lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
        // n 位數的範圍：1 位 = 2..9（避開 0 和 1 的送分題）、2 位 = 10..99、3 位 = 100..999
        const rng = (n) => (n <= 1 ? [2, 9] : [Math.pow(10, n - 1), Math.pow(10, n) - 1]);
        const cleanDigits = (d) => { d = Math.floor(Number(d)); return d >= 1 && d <= 3 ? d : 2; };
        const OPS = ['+', '-', '*', '/'];
        const cleanOps = (ops) => { const o = Array.isArray(ops) ? OPS.filter(x => ops.includes(x)) : []; return o.length ? o : ['+']; };

        // 乘：被乘數 d 位、乘數 d ≥ 3 為 2 位，否則 1 位；除：除數同乘數規則，商 d 位（d = 3 時商 2 位），被除數 = 除數 × 商（一定整除）
        // 減：noNeg 時大的在前（答案不會是負數）；不限制時可能出現負數
        function genQuestion(rand, { ops = ['+'], digits = 2, noNeg = true } = {}) {
            ops = cleanOps(ops); digits = cleanDigits(digits);
            const op = ops[ri(rand, 0, ops.length - 1)], [lo, hi] = rng(digits);
            let a, b, ans;
            if (op === '*') { const [l2, h2] = rng(digits >= 3 ? 2 : 1); a = ri(rand, lo, hi); b = ri(rand, l2, h2); ans = a * b; }
            else if (op === '/') { const [l2, h2] = rng(digits >= 3 ? 2 : 1), [lq, hq] = rng(digits >= 3 ? 2 : digits); b = ri(rand, l2, h2); ans = ri(rand, lq, hq); a = b * ans; }
            else {
                a = ri(rand, lo, hi); b = ri(rand, lo, hi);
                if (op === '-' && noNeg && a < b) [a, b] = [b, a];
                ans = op === '+' ? a + b : a - b;
            }
            return { a, b, op, ans };
        }
        const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        const qText = (q) => (q.kind ? q.text : `${q.a} ${SYM[q.op]} ${q.b}`);
        // 作答字串 → 整數；空字串、只有負號、非數字回傳 NaN
        const parseAnswer = (s) => (/^-?\d{1,9}$/.test(String(s).trim()) ? parseInt(s, 10) : NaN);
        // 小數作答：最多 7 位整數 + 1 位小數，不收負數；其他回傳 NaN
const parseDec = (s) => { s = String(s).trim().replace(/\.$/, ''); return /^\d{1,7}(\.\d)?$/.test(s) ? Number(s) : NaN; };
// 一般題比整數；小數題（q.dec）比「十分位整數」q.t，避免浮點誤差
const judge = (q, s) => (q.dec ? Math.round(parseDec(s) * 10) === q.t : parseAnswer(s) === q.ans);

        // 一局結果：results = [{ q, user, ok, ms }]
        function summarize(results) {
            const total = results.length, correct = results.filter(r => r.ok).length, ms = results.reduce((a, r) => a + r.ms, 0);
            return { total, correct, acc: total ? Math.round(correct / total * 1000) / 10 : 0, avgSec: total ? Math.round(ms / total / 100) / 10 : 0, totalSec: Math.round(ms / 100) / 10, wrong: results.filter(r => !r.ok) };
        }
        // 模式 key：mentalmath_best_<n10|n20|n50|t60>_d<位數>_<運算字母 a s m d>[_neg（減法可出負數）]
        // 其他題型（frac / pct / unit / time）：mentalmath_best_<模式>_<題型>；算式配對：mentalmath_best_match_d<位數>_<運算>[_neg]
        function modeKey(mode, ops, digits, noNeg, type = 'arith') {
            ops = cleanOps(ops);
            mode = mode === 't60' ? 't60' : 'n' + String(mode).replace(/^n/, '');
            const sfx = `d${cleanDigits(digits)}_${ops.map(o => ({ '+': 'a', '-': 's', '*': 'm', '/': 'd' }[o])).join('')}${ops.includes('-') && !noNeg ? '_neg' : ''}`;
            if (type === 'match') return `mentalmath_best_match_${sfx}`;
            if (['frac', 'pct', 'unit', 'time'].includes(type)) return `mentalmath_best_${mode}_${type}`;
            return `mentalmath_best_${mode}_${sfx}`;
        }
        // 最佳成績 { acc, correct, sec }：題數模式比正確率（高）再比總秒數（短）；限時模式比答對題數（多）再比正確率
        const cleanBest = (b) => (b && typeof b === 'object' && Number.isFinite(b.acc) && Number.isFinite(b.correct) && Number.isFinite(b.sec) ? { acc: b.acc, correct: b.correct, sec: b.sec } : null);
        function isBetter(mode, old, cur) {
            old = cleanBest(old); if (!old) return true;
            if (mode === 't60') return cur.correct > old.correct || (cur.correct === old.correct && cur.acc > old.acc);
            return cur.acc > old.acc || (cur.acc === old.acc && cur.sec < old.sec);
        }
        // 鍵盤輸入：數字加到尾端（最多 9 字元）、neg 切換負號、del 刪一位
        function pressKey(cur, k) {
            if (/^\d$/.test(k)) return cur.replace('-', '').length >= 8 || /\.\d/.test(cur) ? cur : (cur === '0' ? k : cur === '-0' ? '-' + k : cur + k);
            if (k === 'dot') return cur.includes('.') || cur.startsWith('-') || cur.length >= 8 ? cur : (cur === '' ? '0.' : cur + '.');
            if (k === 'del') return cur.slice(0, -1);
            if (k === 'neg') return cur.startsWith('-') ? cur.slice(1) : '-' + cur;
            return cur;
        }

        // ---- 其他題型 ----
        const TYPES = ['arith', 'frac', 'pct', 'unit', 'time', 'match'];
        const cleanType = (t) => (TYPES.includes(t) ? t : 'arith');
        const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
        const lcm = (a, b) => (a / gcd(a, b)) * b;
        const simplify = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };
        const cmpFrac = (a, b) => Math.sign(a[0] * b[1] - b[0] * a[1]); // -1 左小、0 一樣、1 左大（分母皆為正）
        const pick = (rand, arr) => arr[ri(rand, 0, arr.length - 1)];
        const fmtTenths = (t) => (t % 10 === 0 ? String(t / 10) : (t / 10).toFixed(1)); // 十分位整數 → 文字（85 → 8.5、80 → 8）
        const coprimeFrac = (rand, dlo, dhi) => { for (let i = 0; i < 30; i++) { const d = ri(rand, dlo, dhi), n = ri(rand, 1, d - 1); if (gcd(n, d) === 1) return [n, d]; } return [1, dhi]; };
        const randFrac = (rand) => { const d = ri(rand, 2, 12); return [ri(rand, 1, d - 1), d]; };

        // 分數：比大小（答 1 左大 / 2 右大 / 3 一樣大）、通分（最小公分母）、約分（最簡分母）
        const CMP_LABEL = ['', '左邊大', '右邊大', '一樣大'];
        function genFrac(rand) {
            const r = rand();
            if (r < 0.6) {
                let a, b;
                if (rand() < 0.15) { // 等值分數（k1 ≠ k2，所以寫法不同）
                    const [n, d] = coprimeFrac(rand, 2, 6), k1 = ri(rand, 1, 4); let k2 = ri(rand, 1, 4); if (k2 === k1) k2 = (k1 % 4) + 1;
                    a = [n * k1, d * k1]; b = [n * k2, d * k2];
                } else {
                    a = randFrac(rand); b = randFrac(rand);
                    for (let i = 0; i < 50 && cmpFrac(a, b) === 0; i++) b = randFrac(rand);
                    if (cmpFrac(a, b) === 0) { a = [1, 2]; b = [1, 3]; }
                }
                const c = cmpFrac(a, b), ans = c > 0 ? 1 : c < 0 ? 2 : 3;
                return { kind: 'frac', text: `${a[0]}/${a[1]}　？　${b[0]}/${b[1]}`, ans, ansText: `${ans}（${CMP_LABEL[ans]}）`, hint: '輸入 1＝左邊大　2＝右邊大　3＝一樣大' };
            }
            if (r < 0.85) {
                const a = randFrac(rand); let b = randFrac(rand);
                for (let i = 0; i < 50 && b[1] === a[1]; i++) b = randFrac(rand);
                if (b[1] === a[1]) b = [1, a[1] === 2 ? 3 : 2];
                const ans = lcm(a[1], b[1]);
                return { kind: 'frac', text: `${a[0]}/${a[1]} 與 ${b[0]}/${b[1]} 通分，最小公分母是多少？`, ans, ansText: String(ans), hint: '輸入最小公分母（兩個分母的最小公倍數）' };
            }
            const [n, d] = coprimeFrac(rand, 2, 9), k = ri(rand, 2, 6);
            return { kind: 'frac', text: `${n * k}/${d * k} 約分成最簡分數，分母是多少？`, ans: d, ansText: String(d), hint: '輸入約分後的分母' };
        }

        // 百分比：答案一律「最多一位小數」（出題時保證不用四捨五入）。t = 答案 × 10（整數）
        // 折扣：原價為 10 的倍數 → 價錢 × 折數；增減：原值 ×（100 ± r）%；占比：分母取 1000 的因數；求部分：基數 × r%
        const SHARE_BASE = [8, 20, 25, 40, 50, 100, 125, 200, 250];
        function genPct(rand) {
            const kind = ri(rand, 0, 3);
            let text, t;
            if (kind === 0) {
                const m = ri(rand, 3, 100), p = ri(rand, 10, 19) * 5; // 5 到 9.5 折
                text = `原價 ${m * 10} 元，打 ${fmtTenths(p)} 折，要付多少元？`; t = m * p;
            } else if (kind === 1) {
                const m = ri(rand, 5, 100), r = ri(rand, 1, 10) * 5, up = rand() < 0.5;
                text = `一件商品 ${m * 10} 元，${up ? '漲價' : '降價'} ${r}%，新價格是多少元？`; t = m * (up ? 100 + r : 100 - r);
            } else if (kind === 2) {
                const b = pick(rand, SHARE_BASE), a = ri(rand, 1, b - 1);
                text = `全班 ${b} 人，其中 ${a} 人戴眼鏡，占全班幾 %？`; t = (1000 * a) / b;
            } else {
                const m = ri(rand, 2, 50), r = ri(rand, 1, 19) * 5;
                text = `${m * 10} 的 ${r}% 是多少？`; t = m * r;
            }
            return { kind: 'pct', dec: true, t, ans: t / 10, text, ansText: fmtTenths(t), hint: '答案最多一位小數（用 . 鍵），不用四捨五入' };
        }

        // 單位換算：公制長度 / 重量 / 容量 + 常見時間單位；f = 換成最小單位的倍數
        const UNITS = {
            len: [['公釐', 1], ['公分', 10], ['公尺', 1000], ['公里', 1e6]],
            wt: [['公克', 1], ['公斤', 1000], ['公噸', 1e6]],
            vol: [['毫升', 1], ['公升', 1000]],
            time: [['秒', 1], ['分鐘', 60], ['小時', 3600], ['天', 86400], ['週', 604800]],
        };
        function genUnit(rand) {
            const cats = Object.keys(UNITS);
            for (let i = 0; i < 200; i++) {
                const list = UNITS[pick(rand, cats)], x = ri(rand, 0, list.length - 1), y = ri(rand, 0, list.length - 1);
                if (x === y) continue;
                const [nx, fx] = list[x], [ny, fy] = list[y], ratio = fx / fy;
                if (ratio > 1000 || ratio < 1 / 1000) continue;
                const vt = rand() < 0.5 ? 10 * ri(rand, 1, 60) : ri(rand, 11, 99); // 數值（十分位整數）：整數或一位小數
                if ((vt * fx) % fy !== 0) continue;
                const t = (vt * fx) / fy; // 結果的十分位整數
                return { kind: 'unit', dec: true, t, ans: t / 10, text: `${fmtTenths(vt)} ${nx} = ? ${ny}`, ansText: `${fmtTenths(t)} ${ny}`, hint: '答案最多一位小數（用 . 鍵）' };
            }
            return { kind: 'unit', dec: true, t: 1000, ans: 100, text: '1 公尺 = ? 公分', ansText: '100 公分', hint: '答案最多一位小數（用 . 鍵）' };
        }

        // 時間計算：分鐘數 0..1439 為一天內的時刻；跨午夜用 mod 1440
        const pad2 = (n) => String(n).padStart(2, '0');
        const hhmm = (m) => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
        const clock12 = (m) => { const h = Math.floor(m / 60), h12 = h % 12 || 12; return { txt: `${h < 12 ? '上午' : '下午'} ${h12}:${pad2(m % 60)}`, num: h12 * 100 + (m % 60) }; };
        const elapsedMin = (s, e) => (((e - s) % 1440) + 1440) % 1440; // 從 s 到 e（不超過 24 小時，跨午夜也算）
        const addMin = (s, d) => (((s + d) % 1440) + 1440) % 1440;
        const fmtDur = (d) => (d >= 60 ? `${Math.floor(d / 60)} 小時${d % 60 ? ` ${d % 60} 分鐘` : ''}` : `${d} 分鐘`);
        function genTime(rand) {
            const h24 = rand() < 0.5, kind = ri(rand, 0, 2), s = ri(rand, 0, 287) * 5;
            const fmt = (m) => (h24 ? hhmm(m) : clock12(m).txt);
            if (kind === 0) {
                const d = ri(rand, 3, 120) * 5, e = addMin(s, d);
                return { kind: 'time', text: `${fmt(s)} 到 ${fmt(e)}，經過幾分鐘？`, ans: elapsedMin(s, e), ansText: `${d} 分鐘`, hint: '答案以分鐘計；跨過午夜也算（不超過 24 小時）' };
            }
            const d = ri(rand, 3, 72) * 5, e = kind === 1 ? addMin(s, d) : addMin(s, -d), c = clock12(e);
            return {
                kind: 'time', text: `${fmt(s)} ${kind === 1 ? '再過' : '的'} ${fmtDur(d)}${kind === 1 ? '' : '前'}是幾點幾分？`,
                ans: h24 ? Math.floor(e / 60) * 100 + (e % 60) : c.num, ansText: h24 ? hhmm(e) : c.txt,
                hint: h24 ? '24 小時制：輸入時分數字，08:05 輸入 805' : '12 小時制：輸入時分數字，4:35 輸入 435（不用管上午下午）',
            };
        }

        function genByType(rand, cfg = {}) {
            switch (cleanType(cfg.type)) {
                case 'frac': return genFrac(rand);
                case 'pct': return genPct(rand);
                case 'unit': return genUnit(rand);
                case 'time': return genTime(rand);
                default: return genQuestion(rand, cfg);
            }
        }
        const ansText = (q) => (q.kind ? q.ansText : String(q.ans));

        // 算式配對：n 對，答案互不相同（湊不齊才容許重複）；order[k] = 右欄第 k 格放的是第幾個算式的答案
        const shufR = (arr, rand) => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
        function genMatch(rand, cfg = {}, n = 6) {
            const items = [], seen = new Set();
            for (let i = 0; i < 300 && items.length < n; i++) { const q = genQuestion(rand, cfg); if (!seen.has(q.ans)) { seen.add(q.ans); items.push({ text: qText(q), ans: q.ans }); } }
            while (items.length < n) { const q = genQuestion(rand, cfg); items.push({ text: qText(q), ans: q.ans }); }
            return { items, order: shufR(items.map((_, i) => i), rand) };
        }
        const isMatch = (m, li, rk) => !!m && !!m.items[li] && m.items[m.order[rk]] !== undefined && m.items[li].ans === m.items[m.order[rk]].ans;
        const MATCH = { LIMIT_SEC: 90, PENALTY: 3 };
        const matchScore = (sec, miss) => Math.round((sec + MATCH.PENALTY * miss) * 10) / 10; // 越低越好：用時 + 每次失誤加 3 秒
        const cleanMatchBest = (b) => (b && typeof b === 'object' && Number.isFinite(b.score) && b.score >= 0 && Number.isFinite(b.miss) ? { score: b.score, miss: b.miss } : null);
        const isBetterMatch = (old, cur) => { old = cleanMatchBest(old); return !old || cur.score < old.score; };
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const PRESETS = { easy: { ops: ['+', '-'], digits: 1, mode: '10' }, normal: { ops: ['+', '-', '*'], digits: 2, mode: '20' }, hard: { ops: ['+', '-', '*', '/'], digits: 3, mode: '20' } };
        let cfg = { ops: ['+', '-'], digits: 2, mode: '10', noNeg: true, type: 'arith' };
        let cur = null, qs = null, results = [], ans = '', startedAt = 0, qStart = 0, deadline = 0, timer = 0, playing = false;

        const show = (id) => { for (const x of ['setup', 'play', 'matchPlay', 'result']) $('#' + x).hidden = x !== id; };
        const fmtBest = (b, mode) => { b = cleanBest(b); return b ? (mode === 't60' ? `${b.correct} 題・${b.acc}%` : `${b.acc}%・${b.sec} 秒`) : '—'; };
        const fmtMatchBest = (b) => { b = cleanMatchBest(b); return b ? `${b.score} 秒（失誤 ${b.miss}）` : '—'; };
        const isMatchType = () => cfg.type === 'match';
        const keyNow = () => modeKey(cfg.mode, cfg.ops, cfg.digits, cfg.noNeg, cfg.type);
        function syncSetup() {
            for (const b of $('#ops').children) b.setAttribute('aria-pressed', cfg.ops.includes(b.dataset.op));
            for (const b of $('#digits').children) b.setAttribute('aria-pressed', +b.dataset.d === cfg.digits);
            for (const b of $('#modes').children) b.setAttribute('aria-pressed', b.dataset.m === cfg.mode);
            $('#noNeg').checked = cfg.noNeg;
            for (const b of $('#types').children) b.setAttribute('aria-pressed', b.dataset.t === cfg.type);
            $('#optArith').hidden = !(cfg.type === 'arith' || cfg.type === 'match'); $('#optMode').hidden = isMatchType();
            const b = Util.store.get(keyNow(), null);
            $('#bestNow').textContent = isMatchType() ? fmtMatchBest(b) : fmtBest(b, cfg.mode);
        }
        $('#types').onclick = (e) => { const b = e.target.closest('button'); if (b) { cfg.type = cleanType(b.dataset.t); syncSetup(); } };
        $('#presets').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; Object.assign(cfg, PRESETS[b.dataset.p]); syncSetup(); };
        $('#ops').onclick = (e) => {
            const b = e.target.closest('button'); if (!b) return;
            const o = b.dataset.op, on = cfg.ops.includes(o);
            if (on && cfg.ops.length === 1) return; // 至少留一個
            cfg.ops = OPS.filter(x => (x === o ? !on : cfg.ops.includes(x))); syncSetup();
        };
        $('#digits').onclick = (e) => { const b = e.target.closest('button'); if (b) { cfg.digits = +b.dataset.d; syncSetup(); } };
        $('#modes').onclick = (e) => { const b = e.target.closest('button'); if (b) { cfg.mode = b.dataset.m; syncSetup(); } };
        $('#noNeg').onchange = () => { cfg.noNeg = $('#noNeg').checked; syncSetup(); };

        function next() {
            cur = genByType(Math.random, cfg); ans = ''; qStart = Date.now();
            $('#q').textContent = qText(cur); $('#q').classList.toggle('txt', !!cur.kind); $('#hint').textContent = cur.hint || '';
            const px = $('#padx'); // 四則運算用 ±；小數題用 .；其他題型不需要
            const pk = !cur.kind ? 'neg' : cur.dec ? 'dot' : ''; px.dataset.k = pk; px.disabled = !pk; px.textContent = pk === 'neg' ? '±' : pk === 'dot' ? '.' : ''; px.setAttribute('aria-label', pk === 'neg' ? '正負號' : pk === 'dot' ? '小數點' : '不用');
            drawAns();
            const n = results.length + 1;
            $('#prog').textContent = cfg.mode === 't60' ? `第 ${n} 題` : `${n} / ${cfg.mode}`;
        }
        function drawAns() { $('#ans').textContent = ans; }
        function tick() {
            if (cfg.mode !== 't60') return;
            const left = Math.max(0, deadline - Date.now());
            $('#prog').textContent = `剩 ${Math.ceil(left / 1000)} 秒・第 ${results.length + 1} 題`;
            if (left <= 0) finish();
        }
        function start() {
            if (isMatchType()) return startMatch();
            results = []; $('#okN').textContent = '0'; $('#last').textContent = ''; $('#last').className = '';
            show('play'); playing = true; startedAt = Date.now(); deadline = startedAt + MM.TIMED_MS;
            clearInterval(timer); timer = setInterval(tick, 200);
            next(); tick();
        }
        function submit() {
            if (!playing || ans === '' || ans === '-') return;
            const ok = judge(cur, ans), ms = Date.now() - qStart;
            results.push({ q: cur, user: cur.dec ? ans : parseAnswer(ans), ok, ms });
            $('#okN').textContent = results.filter(r => r.ok).length;
            $('#last').className = ok ? 'ok' : 'bad';
            $('#last').textContent = ok ? '✔ 答對了' : cur.kind ? `✘ 正確答案：${ansText(cur)}` : `✘ ${qText(cur)} = ${cur.ans}`;
            if (cfg.mode !== 't60' && results.length >= +cfg.mode) { finish(); return; }
            if (cfg.mode === 't60' && Date.now() >= deadline) { finish(); return; }
            next();
        }
        function finish() {
            if (!playing) return; playing = false; clearInterval(timer);
            const s = summarize(results), elapsed = Math.round((Date.now() - startedAt) / 100) / 10;
            show('result');
            if (!s.total) { $('#msg').textContent = '還沒有作答。'; $('#stats').innerHTML = ''; $('#wrongBox').innerHTML = ''; return; }
            const key = keyNow(), cur2 = { acc: s.acc, correct: s.correct, sec: cfg.mode === 't60' ? 60 : s.totalSec };
            const old = Util.store.get(key, null), partial = cfg.mode !== 't60' && s.total < +cfg.mode; // 中途結束的題數局不計最佳
            let msgText = '';
            if (!partial && s.correct > 0 && isBetter(cfg.mode, old, cur2)) { Util.store.set(key, cur2); msgText = '新的最佳成績！'; }
            $('#msg').textContent = msgText;
            $('#stats').innerHTML = [['答對', `${s.correct} / ${s.total}`], ['正確率', s.acc + '%'], ['平均每題', s.avgSec + ' 秒'], ['總用時', (cfg.mode === 't60' ? Math.min(60, elapsed) : s.totalSec) + ' 秒'], ['此模式最佳', fmtBest(Util.store.get(key, null), cfg.mode)]].map(([a, b]) => `<div class="li stat"><span>${a}</span><b>${b}</b></div>`).join('');
            $('#wrongBox').innerHTML = s.wrong.length ? `<h2 style="margin-top:12px">錯題回顧（${s.wrong.length}）</h2>` + s.wrong.map(r => `<div class="li"><span>${Util.esc(qText(r.q))}${r.q.kind ? '　→ ' : ' = '}<b>${Util.esc(ansText(r.q))}</b></span><span class="muted">你答 ${Util.esc(r.user)}</span></div>`).join('') : '<p class="muted" style="text-align:center">全對，沒有錯題！</p>';
        }
        function press(k) {
            if (!playing) return;
            if (k === 'enter') submit(); else { if ((k === 'neg' || k === 'dot') && $('#padx').dataset.k !== k) return; ans = pressKey(ans, k); drawAns(); }
        }
        $('#pad').onclick = (e) => { const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k); };
        document.addEventListener('keydown', (e) => {
            if (!playing || e.ctrlKey || e.metaKey || e.altKey) return;
            if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === '-') press('neg'); else if (e.key === '.') press('dot'); else if (e.key === 'Enter') { e.preventDefault(); press('enter'); } else return;
            e.preventDefault();
        });
        // ---- 算式配對 ----
        let mm = null, mDone = null, mDoneR = null, selL = -1, selR = -1, mMiss = 0, mStart = 0, mTimer = 0, mPlaying = false;
        function drawMatch() {
            const n = mm.items.length;
            $('#mgrid').innerHTML = mm.items.map((it, i) => `<button data-l="${i}" ${mDone.has(i) ? 'disabled' : ''} aria-pressed="${selL === i}">${Util.esc(it.text)}</button><button data-r="${i}" ${mDoneR.has(i) ? 'disabled' : ''} aria-pressed="${selR === i}">${mm.items[mm.order[i]].ans}</button>`).join('');
            $('#mprog').textContent = `${mDone.size} / ${n}`; $('#mmiss').textContent = mMiss;
        }
        function mTick() {
            const left = Math.max(0, MATCH.LIMIT_SEC - (Date.now() - mStart) / 1000);
            $('#mtip').textContent = `剩 ${Math.ceil(left)} 秒。左邊點一個算式，再點右邊的答案。`;
            if (left <= 0) finishMatch();
        }
        function startMatch() {
            mm = genMatch(Math.random, cfg); mDone = new Set(); mDoneR = new Set(); selL = selR = -1; mMiss = 0; mStart = Date.now(); mPlaying = true;
            show('matchPlay'); drawMatch(); clearInterval(mTimer); mTimer = setInterval(mTick, 200); mTick();
        }
        function finishMatch() {
            if (!mPlaying) return; mPlaying = false; clearInterval(mTimer);
            const n = mm.items.length, full = mDone.size === n, sec = Math.min(MATCH.LIMIT_SEC, Math.round((Date.now() - mStart) / 100) / 10), score = matchScore(sec, mMiss), key = keyNow();
            let msgText = full ? '' : '時間到或中途結束，不計入最佳。';
            if (full && isBetterMatch(Util.store.get(key, null), { score, miss: mMiss })) { Util.store.set(key, { score, miss: mMiss }); msgText = '新的最佳成績！'; }
            show('result'); $('#msg').textContent = msgText;
            $('#stats').innerHTML = [['配對成功', `${mDone.size} / ${n}`], ['用時', sec + ' 秒'], ['失誤', mMiss + ' 次'], ['成績（用時 + 失誤×' + MATCH.PENALTY + ' 秒）', full ? score + ' 秒' : '—'], ['此組合最佳', fmtMatchBest(Util.store.get(key, null))]].map(([a, b]) => `<div class="li stat"><span>${a}</span><b>${b}</b></div>`).join('');
            const left = mm.items.filter((_, i) => !mDone.has(i));
            $('#wrongBox').innerHTML = left.length ? `<h2 style="margin-top:12px">沒配到的（${left.length}）</h2>` + left.map(it => `<div class="li"><span>${Util.esc(it.text)} = <b>${it.ans}</b></span></div>`).join('') : '<p class="muted" style="text-align:center">全部配對成功！</p>';
        }
        $('#mgrid').onclick = (e) => {
            const b = e.target.closest('button'); if (!b || !mPlaying) return;
            if (b.dataset.l !== undefined) selL = selL === +b.dataset.l ? -1 : +b.dataset.l; else selR = selR === +b.dataset.r ? -1 : +b.dataset.r;
            if (selL >= 0 && selR >= 0) {
                if (isMatch(mm, selL, selR)) { mDone.add(selL); mDoneR.add(selR); } else mMiss++;
                selL = selR = -1;
                if (mDone.size === mm.items.length) { drawMatch(); finishMatch(); return; }
            }
            drawMatch();
        };
        $('#mquit').onclick = finishMatch;

        $('#start').onclick = start; $('#again').onclick = start;
        $('#quit').onclick = finish;
        $('#back').onclick = () => { show('setup'); syncSetup(); };
        syncSetup();
    </script>
<script>document.getElementById('clearBest').onclick=()=>{if(!confirm('清除這個遊戲的所有最佳紀錄？無法復原。頁面會重新載入，正在進行的這一局會結束。'))return;try{const p=['mentalmath_best_'];Object.keys(localStorage).filter(k=>p.some(x=>k.startsWith(x))).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};</script>
</body>
