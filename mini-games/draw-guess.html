<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="你畫我猜：2–8 人輪流畫畫或口述，其他人即時猜答案，猜得越快分數越高。房主可選畫畫或口述（你說我猜）模式。">
    <meta property="og:title" content="你畫我猜" />
    <meta property="og:description" content="輪流畫畫或口述、即時猜題的多人連線遊戲。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/draw-guess.html" />
    <title>你畫我猜</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <template id="help">
        <h3>這是什麼</h3>
        <p>你畫我猜：一個人畫、其他人猜。可以單人練習畫畫，也能 2–8 人連線，猜得越快分數越高。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想練習把東西畫得讓人看得懂。</li>
        <li>聚會時開房間，輪流畫給朋友猜。</li>
        </ul>
        <h3>怎麼玩</h3>
        <p><b>單機（單人練習）：</b></p>
        <ol>
        <li>選每題秒數，按「單機開始」，會隨機給一個題目。</li>
        <li>用手指或滑鼠在畫板上畫；可換顏色、細／中／粗、白色橡皮擦（⌫）、「復原」與「清除」。</li>
        <li>畫完按「畫好了」，或等時間到，會揭曉答案。</li>
        <li>自評「畫得出來」或「畫不出來」（別人看你的畫猜不猜得出），會自動換下一題並累計紀錄。</li>
        </ol>
        <p><b>連線：</b>輸入暱稱按「建立房間」，傳邀請連結給朋友（2–8 人）。房主可選「畫畫」或「口述」模式後按「開始遊戲」，每人輪流畫（說）一次，其他人在右側輸入答案按「猜」，每回合 60 秒。</p>
        <h3>範例</h3>
        <div class="eg">題目「蘋果」：畫一個紅色圓形加上葉子，按「畫好了」，看到答案後覺得別人猜得到，就按「畫得出來」。紀錄會顯示「1 題・畫得出來 1」。</div>
        <h3>小提醒</h3>
        <ul>
        <li>練習紀錄只存在這台裝置的瀏覽器。</li>
        <li>連線計分：猜對 50–100 分（越快越高），畫的人每有一人猜對得 20 分。</li>
        <li>手機畫畫時，畫板上不會捲動頁面。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <style>
        :root {
            --wrap-w: 760px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row input {
            flex: 1 1 130px;
        }

        .pl.drawer {
            border-color: var(--blue);
        }

        .pl.ok {
            background: color-mix(in srgb, var(--ok) 25%, var(--fill));
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        #hint {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .2em;
        }

        #timer {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 12px;
        }

        @media (max-width: 640px) {
            .main {
                grid-template-columns: 1fr;
            }
        }

        #cv {
            width: 100%;
            aspect-ratio: 1000 / 640;
            background: #fff;
            border-radius: 12px;
            touch-action: none;
            display: block;
            box-shadow: inset 0 0 0 1px var(--fill);
        }

        .tools {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
        }

        .sw {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            padding: 0;
            border: 3px solid transparent;
            color: #555;
        }

        @media (pointer: coarse) {
            .sw {
                width: 40px;
                height: 40px;
                min-width: 0;
                min-height: 0;
            }
        }

        .sw[aria-pressed=true] {
            border-color: var(--text);
            background: inherit;
        }

        #chat {
            height: 300px;
            overflow: auto;
            background: var(--fill);
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 14px;
            word-break: break-all;
        }

        #chat div {
            margin-bottom: 3px;
        }

        #chat .sys {
            color: var(--ok);
            font-weight: 600;
        }

        #msg {
            text-align: center;
            font-weight: 700;
            margin-top: 10px;
            min-height: 1.5em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>你畫我猜</h1>
        <p class="sub">可單人練習，也能多人連線。連線：房主建立房間，朋友用房號或邀請連結加入（2–8 人）。每個人輪流畫（或口述）一次。</p>

        <div class="card" id="menu">
            <h2>單人練習</h2>
            <div class="row">
                <select id="soloSecs" aria-label="每題秒數"><option value="30">每題 30 秒</option><option value="60" selected>每題 60 秒</option><option value="90">每題 90 秒</option></select>
                <button class="primary" id="soloBtn">單機開始</button>
            </div>
            <p class="note" id="soloStat"></p>
            <h2 style="margin-top:18px">和朋友連線</h2>
            <div class="row"><input id="nick" maxlength="10" placeholder="暱稱（中英數 1–10 字）" aria-label="暱稱"></div>
            <div class="row">
                <button class="primary" id="hostBtn">建立房間</button>
                <input id="joinId" placeholder="貼上房號" aria-label="房號">
                <button id="joinBtn">加入</button>
            </div>
            <p class="note" id="netMsg"></p>
        </div>

        <div class="card" id="lobby" hidden>
            <h2>等待玩家加入</h2>
            <div class="players" id="lobbyPlayers"></div>
            <div class="row" style="margin-top:12px">
                <select id="modeSel" hidden aria-label="遊戲模式"><option value="draw">畫畫模式</option><option value="talk">口述模式（用說的，不能說出題目的字）</option></select>
                <button id="copyInvite" hidden>複製邀請連結</button>
                <button class="primary" id="startBtn" hidden disabled>開始遊戲</button>
            </div>
            <p class="note" id="lobbyHint"></p>
        </div>

        <div id="game" hidden>
            <div class="card">
                <div class="top">
                    <div><div class="muted" id="roundInfo"></div><div id="hint"></div></div>
                    <div id="timer"></div>
                </div>
                <div class="players" id="scoreboard"></div>
            </div>
            <div class="main" id="mainBox">
                <div class="card" style="margin:0" id="canvasCard">
                    <canvas id="cv" width="1000" height="640" aria-label="畫布"></canvas>
                    <div class="tools" id="tools" hidden>
                        <span id="palette" class="tools" style="margin:0"></span>
                        <button class="sm" data-w="4" aria-pressed="false">細</button>
                        <button class="sm" data-w="10" aria-pressed="true">中</button>
                        <button class="sm" data-w="22" aria-pressed="false">粗</button>
                        <button class="sm" id="undoBtn" hidden>復原</button>
                        <button class="sm" id="clearBtn">清除</button>
                    </div>
                </div>
                <div class="card" style="margin:0" id="chatCard">
                    <div id="chat" aria-live="polite"></div>
                    <div class="row" style="margin-top:8px"><input id="guess" maxlength="20" placeholder="輸入答案" aria-label="答案"><button class="primary" id="guessBtn">猜</button></div>
                </div>
            </div>
            <div id="msg" role="status"></div>
            <div class="row" id="soloBar" style="justify-content:center" hidden>
                <button class="primary" id="doneBtn">畫好了</button>
                <button class="primary" id="canBtn" hidden>畫得出來</button>
                <button id="cantBtn" hidden>畫不出來</button>
            </div>
            <div class="row" style="justify-content:center;margin-top:12px">
                <button class="primary" id="again" hidden>再玩一次</button>
                <button id="leave">離開</button>
            </div>
        </div>
    </div>

    <script>
        const { rnd, shuffle } = Util;

        // --- pure ---
        const WORDS = ['蘋果', '太陽', '月亮', '星星', '房子', '汽車', '腳踏車', '飛機', '魚', '貓', '狗', '兔子', '大象', '長頸鹿', '花', '樹', '雨傘', '眼鏡', '手機', '電腦', '書', '椅子', '桌子', '杯子', '冰淇淋', '蛋糕', '披薩', '漢堡', '香蕉', '西瓜', '鳥', '蝴蝶', '蜘蛛', '蛇', '烏龜', '企鵝', '鯨魚', '彩虹', '雲', '山', '海', '船', '火車', '公車', '時鐘', '鑰匙', '帽子', '襪子', '吉他', '鋼琴', '足球', '籃球', '電視', '冰箱', '燈泡', '皇冠', '愛心', '氣球', '禮物', '雪人', '火箭', '機器人', '恐龍', '城堡', '劍', '盾牌'];
        const COLORS = ['#000000', '#8e8e93', '#ff453a', '#ff9f0a', '#ffd60a', '#30d158', '#0a84ff', '#bf5af2', '#ffffff'];
        const ROUND_MS = 60000, MAX_PTS_PER_MSG = 100, MAX_PTS_PER_ROUND = 20000;

        // 比對答案：忽略空白與英文大小寫
        const norm = (s) => String(s).replace(/\s+/g, '').toLowerCase();
        const isCorrect = (word, guess) => norm(guess) !== '' && norm(guess) === norm(word);

        // 提示：用「＿」表示每個字
        const maskWord = (word) => [...word].map(() => '＿').join(' ');

        // 猜對得分：50 底分 + 剩餘時間比例的 50 分；畫的人每有一人猜對得 20 分
        const guessPoints = (msLeft, total = ROUND_MS) => 50 + Math.round(50 * Math.max(0, Math.min(1, msLeft / total)));
        const DRAWER_POINTS = 20;

        // 從沒用過的字中抽一個（全用過就重來）
        function pickWord(used, rand) {
            const pool = WORDS.filter(w => !used.has(w));
            const list = pool.length ? pool : WORDS;
            return list[rand(list.length)];
        }

        // 螢幕座標 → 畫布座標（畫布以 CSS 縮放，所以要用 getBoundingClientRect 的比例換算；滑鼠與手指共用）
        const canvasPos = (cx, cy, r, W = 1000, H = 640) => [Math.max(0, Math.min(W, Math.round((cx - r.left) / r.width * W))), Math.max(0, Math.min(H, Math.round((cy - r.top) / r.height * H)))];

        // 單機練習紀錄：{ n 練習題數, can 畫得出來, cant 畫不出來 }
        const addPractice = (st, ok) => ({ n: (st.n || 0) + 1, can: (st.can || 0) + (ok ? 1 : 0), cant: (st.cant || 0) + (ok ? 0 : 1) });
        const fmtPractice = (st) => `${st.n || 0} 題・畫得出來 ${st.can || 0}・畫不出來 ${st.cant || 0}` + (st.n ? `（${Math.round(100 * (st.can || 0) / st.n)}%）` : '');

        // 筆跡訊息檢查：{ pts: [[x,y],…], color, w, begin }
        function validStroke(m) {
            if (!m || !Array.isArray(m.pts) || m.pts.length < 1 || m.pts.length > MAX_PTS_PER_MSG) return false;
            if (!m.pts.every(p => Array.isArray(p) && p.length === 2 && p.every(v => Number.isFinite(v) && v >= 0 && v <= 1000))) return false;
            return COLORS.includes(m.color) && Number.isInteger(m.w) && m.w >= 1 && m.w <= 30;
        }

        // 成員端檢查房主傳來的狀態
        function validState(s) {
            const arr = (a, n) => Array.isArray(a) && a.length <= n;
            return !!s && ['lobby', 'draw', 'between', 'over'].includes(s.phase) && (s.mode === 'draw' || s.mode === 'talk') && arr(s.names, 8) && s.names.every(n => typeof n === 'string' && n.length <= 12)
                && arr(s.scores, 8) && s.scores.every(Number.isFinite) && Number.isInteger(s.drawer) && typeof s.hint === 'string' && s.hint.length <= 40
                && Number.isFinite(s.ms) && arr(s.guessed, 8) && typeof s.word === 'string' && s.word.length <= 8 && arr(s.active, 8)
                && Number.isInteger(s.round) && Number.isInteger(s.rounds);
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const cv = $('#cv'), ctx = cv.getContext('2d');
        let room = null, isHost = false, my = -1, hostId = '';
        let phase = 'menu';                                      // menu | lobby | draw | between | over
        let V = null;                                            // 目前顯示的公開狀態
        let myWord = '';                                         // 只有畫的人會收到
        let color = COLORS[0], width = 10, drawing = false, buf = [], lastSend = 0, lastPt = null;

        // ---------- 房主端的遊戲狀態 ----------
        const H = { mode: 'draw', order: [], cur: 0, drawer: -1, word: '', endsAt: 0, guessed: new Set(), scores: [], used: new Set(), pts: 0, timer: null, nextTimer: null, chat: [] };

        const show = (id, on) => { $(id).hidden = !on; };
        const netMsg = (t) => { $('#netMsg').textContent = t; };
        const enableNet = (on) => ['#hostBtn', '#joinBtn', '#joinId', '#nick'].forEach(s => { $(s).disabled = !on; });
        const names = () => (isHost ? room.players.map(p => p.nick) : (V && V.names) || lobbyNames);
        let lobbyNames = [];

        function readNick() {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            return n;
        }

        // ---------- 畫布 ----------
        function clearCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1000, 640); lastPt = null; }

        function drawSeg(m) {
            ctx.strokeStyle = m.color; ctx.fillStyle = m.color; ctx.lineWidth = m.w; ctx.lineCap = ctx.lineJoin = 'round';
            m.pts.forEach(([x, y], i) => {
                if (i === 0 && (m.begin || !lastPt)) { ctx.beginPath(); ctx.arc(x, y, m.w / 2, 0, 7); ctx.fill(); lastPt = [x, y]; return; }
                ctx.beginPath(); ctx.moveTo(lastPt[0], lastPt[1]); ctx.lineTo(x, y); ctx.stroke(); lastPt = [x, y];
            });
        }

        const pos = (e) => canvasPos(e.clientX, e.clientY, cv.getBoundingClientRect());
        const iAmDrawer = () => (SD.on ? SD.phase === 'draw' : phase === 'draw' && V && V.drawer === my);

        // 把累積的點送出（房主直接廣播；成員送給房主）
        function flush(begin) {
            if (!buf.length) return;
            if (SD.on) { buf = []; return; }
            const m = { pts: buf, color, w: width, begin: !!begin };
            buf = [];
            if (isHost) { if (acceptStroke(m, my)) room.broadcast({ t: 'STROKE', m }, my); }
            else room.send({ t: 'STROKE', m });
        }

        let strokeBegin = false;
        cv.addEventListener('pointerdown', (e) => {
            if (!iAmDrawer()) return;
            if (SD.on) { SD.undo.push(ctx.getImageData(0, 0, 1000, 640)); if (SD.undo.length > 20) SD.undo.shift(); }
            cv.setPointerCapture(e.pointerId); drawing = true; strokeBegin = true;
            const p = pos(e); buf = [p]; drawSeg({ pts: [p], color, w: width, begin: true }); flush(true); strokeBegin = false;
        });
        cv.addEventListener('pointermove', (e) => {
            if (!drawing || !iAmDrawer()) return;
            const p = pos(e);
            drawSeg({ pts: [p], color, w: width, begin: false });
            buf.push(p);
            if (buf.length >= 10 || Date.now() - lastSend > 60) { flush(false); lastSend = Date.now(); }
        });
        const up = () => { if (drawing) { drawing = false; flush(false); } };
        cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

        // ---------- 房主：規則與計分 ----------
        function publicState() {
            return {
                phase, mode: H.mode, names: names(), scores: H.scores, drawer: H.drawer, round: H.cur + 1, rounds: H.order.length,
                hint: phase === 'draw' ? maskWord(H.word) : '', ms: Math.max(0, H.endsAt - Date.now()),
                guessed: [...H.guessed], word: phase === 'between' || phase === 'over' ? H.word : '',
                active: room.players.map(p => p.connected),
            };
        }
        function pushState() { V = publicState(); render(); room.broadcast({ t: 'STATE', s: V }); }
        function chat(text, sys) { const m = { text, sys: !!sys }; addChat(m); room.broadcast({ t: 'CHAT', m }); }

        function acceptStroke(m, from) {
            if (phase !== 'draw' || H.mode !== 'draw' || from !== H.drawer || !validStroke(m)) return false;
            H.pts += m.pts.length;
            if (H.pts > MAX_PTS_PER_ROUND) return false;
            if (from !== my) drawSeg(m);
            return true;
        }

        function startGame() {
            const order = room.players.filter(p => p.connected).map(p => p.index);
            if (order.length < 2) return;
            room.keepSlots = true; H.mode = $('#modeSel').value === 'talk' ? 'talk' : 'draw';
            H.order = shuffle(order); H.cur = 0; H.used = new Set(); H.scores = new Array(room.players.length).fill(0);
            startRound();
        }

        function startRound() {
            clearTimeout(H.nextTimer);
            while (H.cur < H.order.length && !room.players[H.order[H.cur]].connected) H.cur++;
            if (H.cur >= H.order.length) return endGame();
            H.drawer = H.order[H.cur]; H.word = pickWord(H.used, rnd); H.used.add(H.word);
            H.guessed = new Set(); H.pts = 0; H.endsAt = Date.now() + ROUND_MS; phase = 'draw';
            clearCanvas(); room.broadcast({ t: 'CLEAR' });
            if (H.drawer === my) myWord = H.word; else { myWord = ''; room.sendTo(H.drawer, { t: 'WORD', word: H.word }); }
            $('#chat').replaceChildren();
            chat(`第 ${H.cur + 1} 回合：${room.players[H.drawer].nick} ${H.mode === 'talk' ? '開始描述' : '開始畫畫'}`, true);
            pushState();
            clearInterval(H.timer);
            H.timer = setInterval(() => { if (Date.now() >= H.endsAt) endRound('時間到'); else if (isHost) { V.ms = H.endsAt - Date.now(); renderTimer(); } }, 250);
        }

        function endRound(why) {
            if (phase !== 'draw') return;
            clearInterval(H.timer); phase = 'between';
            chat(`${why}！答案是「${H.word}」`, true);
            pushState();
            H.nextTimer = setTimeout(() => { H.cur++; if (H.cur >= H.order.length) endGame(); else startRound(); }, 4000);
        }

        function endGame() { clearInterval(H.timer); clearTimeout(H.nextTimer); phase = 'over'; H.drawer = -1; pushState(); }

        function onGuess(from, text) {
            if (phase !== 'draw' || from === H.drawer || H.guessed.has(from) || typeof text !== 'string' || !text.trim() || text.length > 20) return;
            const nick = room.players[from].nick;
            if (isCorrect(H.word, text)) {
                H.guessed.add(from);
                H.scores[from] += guessPoints(H.endsAt - Date.now());
                H.scores[H.drawer] += DRAWER_POINTS;
                chat(`${nick} 猜對了！`, true);
                const need = room.players.filter(p => p.connected && p.index !== H.drawer).length;
                if (H.guessed.size >= need) endRound('大家都猜對了'); else pushState();
            } else chat(`${nick}：${text.trim()}`);
        }

        // ---------- 連線 ----------
        function onNetError(err, message) { if (phase !== 'menu') return; netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } }

        function hostRoom() {
            const nick = readNick(); if (!nick) return;
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: 8,
                onReady(r) { isHost = true; my = 0; hostId = r.id; history.replaceState('', document.title, location.pathname + '#' + r.id); phase = 'lobby'; renderLobby(); },
                canJoin: () => (phase === 'lobby' ? null : '遊戲已經開始'),
                onJoin: () => renderLobby(),
                onLeave(p) {
                    if (phase === 'lobby') return renderLobby();
                    if (phase === 'draw') {
                        if (p.index === H.drawer) return endRound(`${p.nick} 離開了`);
                        const need = room.players.filter(x => x.connected && x.index !== H.drawer).length;
                        if (need === 0 || H.guessed.size >= need) return endRound('其他人都離開或猜對了');
                    }
                    if (room.players.filter(x => x.connected).length < 2 && phase !== 'over') { return endGame(); }
                    pushState();
                },
                onMessage(p, d) {
                    if (!d || typeof d.t !== 'string') return;
                    if (d.t === 'STROKE') { if (acceptStroke(d.m, p.index)) room.broadcast({ t: 'STROKE', m: d.m }, p.index); }
                    else if (d.t === 'CLEAR') { if (phase === 'draw' && p.index === H.drawer) { clearCanvas(); room.broadcast({ t: 'CLEAR' }, p.index); } }
                    else if (d.t === 'GUESS') onGuess(p.index, d.text);
                },
                onError: onNetError,
            });
        }

        function joinRoom() {
            const nick = readNick(), id = $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            enableNet(false); netMsg('連線中…'); hostId = id;
            room = P2PRoom.join(id, {
                nick,
                onRoster(players, me) { my = me; lobbyNames = players.map(p => p.nick); if (phase === 'menu' || phase === 'lobby') { phase = 'lobby'; renderLobby(); } },
                onMessage(d) {
                    if (!d || typeof d.t !== 'string') return;
                    if (d.t === 'STATE' && validState(d.s)) { phase = d.s.phase; V = d.s; V.at = Date.now(); if (phase !== 'draw' || V.drawer !== my) myWord = phase === 'draw' ? '' : myWord; render(); }
                    else if (d.t === 'STROKE' && validStroke(d.m)) drawSeg(d.m);
                    else if (d.t === 'CLEAR') clearCanvas();
                    else if (d.t === 'CHAT' && d.m && typeof d.m.text === 'string' && d.m.text.length <= 80) addChat({ text: d.m.text, sys: !!d.m.sys });
                    else if (d.t === 'WORD' && typeof d.word === 'string' && d.word.length <= 8) { myWord = d.word; render(); }
                },
                onRejected(reason) { netMsg(reason); enableNet(true); room = null; },
                onClose() { if (phase !== 'menu') { alert('房主已離開，遊戲結束'); location.reload(); } },
                onError: onNetError,
            });
        }


        // ---------- 畫面 ----------
        function addChat(m) {
            const d = document.createElement('div');
            if (m.sys) d.className = 'sys';
            d.textContent = m.text;
            $('#chat').append(d); $('#chat').scrollTop = 1e9;
        }

        function renderLobby() {
            const n = names();
            $('#lobbyPlayers').replaceChildren(...n.map((x, i) => Object.assign(document.createElement('div'), { className: 'pl', textContent: x + (i === 0 ? ' 👑' : '') + (i === my ? '（我）' : '') })));
            show('#menu', false); show('#lobby', true); show('#game', false);
            show('#copyInvite', isHost); show('#modeSel', isHost); show('#startBtn', isHost); $('#startBtn').disabled = n.length < 2;
            $('#lobbyHint').textContent = isHost ? (n.length < 2 ? '把邀請連結傳給朋友，至少 2 人才能開始' : '人到齊了就按「開始遊戲」') : '等待房主開始遊戲…';
        }

        function renderTimer() {
            if (SD.on) return;
            const ms = !V ? 0 : isHost ? H.endsAt - Date.now() : V.ms - (Date.now() - (V.at || Date.now()));
            $('#timer').textContent = phase === 'draw' && V ? `⏱ ${Math.max(0, Math.ceil(ms / 1000))}` : '';
        }
        setInterval(renderTimer, 250);

        function render() {
            if (!V) return;
            if (V.phase === 'lobby') return renderLobby();
            show('#menu', false); show('#lobby', false); show('#game', true);
            $('#roundInfo').textContent = V.phase === 'over' ? '遊戲結束' : `第 ${V.round} / ${V.rounds} 回合`;
            const drawer = V.drawer === my, talk = V.mode === 'talk';
            $('#canvasCard').hidden = talk; $('#mainBox').style.gridTemplateColumns = talk ? '1fr' : '';
            $('#hint').textContent = V.phase === 'draw' ? (drawer ? (talk ? `你要說：${myWord}（不能說出題目裡的任何一個字）` : `你要畫：${myWord}`) : V.hint) : V.phase === 'between' ? `答案：${V.word}` : '';
            renderTimer();
            $('#scoreboard').replaceChildren(...V.names.map((nm, i) => {
                const d = document.createElement('div');
                d.className = 'pl' + (i === V.drawer && V.phase === 'draw' ? ' drawer' : '') + (V.guessed.includes(i) ? ' ok' : '') + (V.active[i] ? '' : ' off');
                d.textContent = `${i === V.drawer && V.phase === 'draw' ? (talk ? '🗣 ' : '✏️ ') : ''}${nm}${i === my ? '（我）' : ''}　${V.scores[i] || 0}`;
                return d;
            }));
            show('#tools', iAmDrawer() && !talk);
            const canGuess = V.phase === 'draw' && !drawer && !V.guessed.includes(my);
            $('#guess').disabled = $('#guessBtn').disabled = !canGuess;
            if (V.phase === 'over') {
                const top = Math.max(...V.scores), win = V.names.filter((_, i) => V.scores[i] === top);
                $('#msg').textContent = `🏆 ${win.join('、')} 獲勝（${top} 分）`;
            } else $('#msg').textContent = V.phase === 'between' ? '下一回合即將開始…' : '';
            show('#again', isHost && V.phase === 'over');
        }

        // ---------- 單機練習：隨機題目 + 計時，自己畫；時間到或按「畫好了」揭曉答案，自評畫得出來 / 畫不出來 ----------
        const SD = { on: false, phase: '', word: '', endsAt: 0, used: new Set(), run: { n: 0, can: 0, cant: 0 }, undo: [] };
        const STAT_KEY = 'drawguess-practice';
        const soloStat = () => $('#soloStat').textContent = '累計練習：' + fmtPractice(Util.store.get(STAT_KEY, {}));
        function soloQuestion() {
            SD.word = pickWord(SD.used, rnd); SD.used.add(SD.word); SD.phase = 'draw'; SD.undo = []; SD.endsAt = Date.now() + $('#soloSecs').value * 1000;
            clearCanvas(); soloView();
        }
        function soloFinish(why) { if (SD.phase !== 'draw') return; SD.phase = 'rate'; drawing = false; soloView(why); }
        function soloRate(ok) { if (SD.phase !== 'rate') return; SD.run = addPractice(SD.run, ok); Util.store.set(STAT_KEY, addPractice(Util.store.get(STAT_KEY, {}), ok)); soloQuestion(); }
        function soloView(why = '') {
            show('#menu', false); show('#lobby', false); show('#game', true);
            const d = SD.phase === 'draw';
            $('#chatCard').hidden = true; $('#mainBox').style.gridTemplateColumns = '1fr'; $('#canvasCard').hidden = false;
            $('#roundInfo').textContent = `練習第 ${SD.run.n + 1} 題`;
            $('#hint').textContent = d ? `你要畫：${SD.word}` : `答案：${SD.word}`;
            $('#scoreboard').replaceChildren(Object.assign(document.createElement('div'), { className: 'pl', textContent: '本次：' + fmtPractice(SD.run) }));
            show('#tools', d); show('#undoBtn', true); show('#soloBar', true); show('#doneBtn', d); show('#canBtn', !d); show('#cantBtn', !d);
            $('#msg').textContent = d ? '' : `${why ? why + '！' : ''}你覺得這張畫，別人猜得出「${SD.word}」嗎？`;
            $('#timer').textContent = d ? `⏱ ${Math.max(0, Math.ceil((SD.endsAt - Date.now()) / 1000))}` : '';
        }
        setInterval(() => { if (SD.on && SD.phase === 'draw') { if (Date.now() >= SD.endsAt) soloFinish('時間到'); else $('#timer').textContent = `⏱ ${Math.ceil((SD.endsAt - Date.now()) / 1000)}`; } }, 250);
        $('#soloBtn').onclick = () => { SD.on = true; phase = 'solo'; SD.run = { n: 0, can: 0, cant: 0 }; SD.used = new Set(); soloQuestion(); };
        $('#doneBtn').onclick = () => soloFinish('');
        $('#canBtn').onclick = () => soloRate(true); $('#cantBtn').onclick = () => soloRate(false);
        $('#undoBtn').onclick = () => { if (SD.on && SD.phase === 'draw' && SD.undo.length) { ctx.putImageData(SD.undo.pop(), 0, 0); lastPt = null; } };
        soloStat();

        // ---------- 事件 ----------
        $('#hostBtn').onclick = hostRoom;
        $('#joinBtn').onclick = joinRoom;
        $('#startBtn').onclick = startGame;
        $('#again').onclick = () => { phase = 'lobby'; room.keepSlots = false; room.prune(); V = null; clearCanvas(); $('#chat').replaceChildren(); room.broadcast({ t: 'STATE', s: { phase: 'lobby', mode: 'draw', names: names(), scores: [], drawer: -1, hint: '', ms: 0, guessed: [], word: '', active: [], round: 0, rounds: 0 } }); renderLobby(); };
        $('#leave').onclick = () => location.reload();
        $('#copyInvite').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copyInvite'), url, () => prompt('請手動複製邀請連結：', url)); };
        function sendGuess() { const t = $('#guess').value.trim(); if (!t) return; $('#guess').value = ''; if (isHost) onGuess(my, t); else room.send({ t: 'GUESS', text: t }); }
        $('#guessBtn').onclick = sendGuess;
        $('#guess').onkeydown = (e) => { if (e.key === 'Enter') sendGuess(); };
        $('#palette').replaceChildren(...COLORS.map(c => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', '顏色 ' + c); b.setAttribute('aria-pressed', c === color); if (c === '#ffffff') b.textContent = '⌫'; b.onclick = () => { color = c; [...$('#palette').children].forEach(x => x.setAttribute('aria-pressed', x === b)); }; return b; }));
        document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { width = +b.dataset.w; document.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
        $('#clearBtn').onclick = () => { if (!iAmDrawer()) return; clearCanvas(); if (isHost) room.broadcast({ t: 'CLEAR' }); else room.send({ t: 'CLEAR' }); };

        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
        clearCanvas();
    </script>
</body>
