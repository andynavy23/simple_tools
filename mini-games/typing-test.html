<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="打字速度測試：中英文、程式碼或自訂文章計時，算出每分鐘字數與正確率，並記錄最佳成績。">
    <meta property="og:title" content="打字速度測試" />
    <meta property="og:description" content="中英文打字計時，記錄每分鐘字數與正確率。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/typing-test.html" />
    <meta name="st-keys" content="typing_custom,typing_hist,typing_miss,typing_best_*">
    <title>打字速度測試</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 680px;
        }

        .bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
        }

        .stats {
            display: flex;
            gap: 22px;
            margin-left: auto;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        .stats b {
            color: var(--text);
            font-size: 20px;
        }

        #passage {
            font-size: 22px;
            line-height: 1.9;
            letter-spacing: .02em;
            word-break: break-all;
            padding: 6px 2px 14px;
        }

        #passage span.ok {
            color: var(--ok);
        }

        #passage span.bad {
            color: var(--bad);
            background: rgba(255, 69, 58, .15);
            border-radius: 3px;
        }

        #passage span.cur {
            border-bottom: 3px solid var(--blue);
        }

        textarea {
            min-height: 90px;
            resize: none;
            font-size: 18px;
            line-height: 1.6;
        }

        #result {
            text-align: center;
        }

        #result .big {
            font-size: 44px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>打字速度測試</h1>
        <p class="sub">在輸入框開始打字就會開始計時。可選中文、英文、程式碼，或貼上自己的文章；會記錄歷史成績與最常打錯的字。</p>

        <div class="card">
            <div class="bar">
                <button class="sm" data-lang="zh" aria-pressed="true">中文</button>
                <button class="sm" data-lang="en" aria-pressed="false">English</button>
                <button class="sm" data-lang="code" aria-pressed="false">程式碼</button>
                <button class="sm" data-lang="custom" aria-pressed="false">自訂文章</button>
                <span class="muted">|</span>
                <button class="sm" data-sec="30" aria-pressed="true">30 秒</button>
                <button class="sm" data-sec="60" aria-pressed="false">60 秒</button>
                <div class="stats"><span>剩餘 <b id="left">30</b></span><span>字/分 <b id="cpm">0</b></span></div>
            </div>
            <div id="customBox" hidden>
                <textarea id="customText" maxlength="1000" placeholder="貼上想練習的文章（會把空白與換行整理成單行，最多 300 字）" aria-label="自訂文章" style="min-height:80px;margin-bottom:8px"></textarea>
                <button class="sm" id="customApply">使用這段文字</button>
            </div>
            <div id="passage" aria-live="off"></div>
            <textarea id="input" placeholder="在這裡輸入…" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </div>

        <div class="card" id="history">
            <h2>歷史成績 <span class="muted" id="hLabel" style="font-weight:400;font-size:13px"></span></h2>
            <div id="trend" style="display:flex;align-items:flex-end;gap:4px;height:90px;margin:8px 0 22px"></div>
            <div id="weak"></div>
            <button class="sm" id="hClear" style="margin-top:8px">清除歷史</button>
        </div>

        <div class="card" id="result" hidden>
            <div class="big" id="r-cpm"></div>
            <div class="muted" id="r-detail"></div>
            <div class="muted" id="r-best" style="margin:6px 0 12px"></div>
            <button class="primary" id="again">再來一次</button>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>打字速度測試：在限定時間內照著上面的文字輸入，測你的速度與正確率，並記錄歷史成績與最常打錯的字。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>練習中文、英文或程式碼的輸入速度。</li>
        <li>貼上自己的文章，練習特定內容。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>選文本：中文、English、程式碼或自訂文章；再選 30 秒或 60 秒。</li>
        <li>選「自訂文章」時，在上方貼文章，按「使用這段文字」（會整理成單行，最多 300 字）。</li>
        <li>在下方輸入框開始打字，第一個字出現就開始計時。上面的文字打對變綠色，打錯變紅色。</li>
        <li>時間到、或打完整段，就顯示成績；按「再來一次」。</li>
        </ol>
        <h3>計分</h3>
        <div class="eg">「字/分」= 每分鐘打對的字數。例：30 秒打對 90 字 → 180 字/分，約 36 WPM（5 個字元算 1 個字）。正確率 = 打對字數 ÷ 輸入字數。</div>
        <h3>小提醒</h3>
        <ul>
        <li>注音或拼音還在組字時不會計算，選好字才算。</li>
        <li>成績與歷史趨勢（最近 20 次）、最常打錯的字都存在這個瀏覽器；自訂文章不記錄最佳成績。</li>
        <li>手機上叫出鍵盤後畫面會縮小，可往上捲動找到文字。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // typed 與 target 逐字比較；elapsed 為實際花費秒數
        // cpm = 每分鐘「正確」字數；wpm 以 5 字元 = 1 字 估算（英文慣例）
        function score(target, typed, elapsed) {
            let correct = 0;
            const n = Math.min(typed.length, target.length);
            for (let i = 0; i < n; i++) if (typed[i] === target[i]) correct++;
            const minutes = Math.max(elapsed, 1) / 60;
            return {
                correct,
                typed: typed.length,
                accuracy: typed.length ? Math.round(correct / typed.length * 100) : 100,
                cpm: Math.round(correct / minutes),
                wpm: Math.round(correct / 5 / minutes),
            };
        }

        // 打錯的字：回傳 { 應該打的字: 次數 }（只算已輸入的位置；空白不算）
        function mistakes(target, typed) {
            const m = {}, t = [...target], y = [...typed];
            for (let i = 0; i < y.length && i < t.length; i++) if (y[i] !== t[i] && t[i].trim()) m[t[i]] = (m[t[i]] || 0) + 1;
            return m;
        }
        // 累加到總表；總表最多保留 80 個字（把次數最少的丟掉）
        function addMistakes(total, m, keep = 80) {
            const out = { ...total }; for (const [k, v] of Object.entries(m)) out[k] = (out[k] || 0) + v;
            return Object.fromEntries(Object.entries(out).sort((a, b) => b[1] - a[1]).slice(0, keep));
        }
        const topMistakes = (total, n = 10) => Object.entries(total).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, n);
        // 同一種文本（lang + 秒數）最近 n 次的成績，舊 → 新
        const trendOf = (hist, lang, secs, n = 20) => hist.filter(h => h.lang === lang && h.secs === secs).slice(-n);
        const validRec = (h) => !!h && typeof h.lang === 'string' && Number.isFinite(h.secs) && Number.isFinite(h.cpm) && Number.isFinite(h.acc) && typeof h.d === 'string';

        // 自訂文章：空白與換行整理成單一空格、去頭尾，最多 300 字（以 Unicode 字元計）
        function cleanCustom(text) {
            return [...String(text).replace(/\s+/g, ' ').trim()].slice(0, 300).join('').trim();
        }
        // --- /pure ---

        const PASSAGES = {
            zh: [
                '天行健，君子以自強不息；地勢坤，君子以厚德載物。',
                '學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？',
                '海內存知己，天涯若比鄰。無為在歧路，兒女共沾巾。',
                '春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。',
                '不積跬步，無以至千里；不積小流，無以成江海。',
                '會當凌絕頂，一覽眾山小。欲窮千里目，更上一層樓。',
                '工欲善其事，必先利其器。三人行，必有我師焉。',
                '千里之行，始於足下。合抱之木，生於毫末。九層之臺，起於累土。',
            ],
            code: [
                'const total = items.filter(x => x.done).map(x => x.price).reduce((a, b) => a + b, 0);',
                'for (let i = 0; i < arr.length; i++) { if (arr[i] > max) max = arr[i]; }',
                'def fib(n): return n if n < 2 else fib(n - 1) + fib(n - 2)',
                'SELECT name, COUNT(*) AS n FROM orders WHERE total > 100 GROUP BY name ORDER BY n DESC;',
                'git commit -m "fix: handle empty list" && git push origin main',
                'document.querySelector("#btn").addEventListener("click", () => alert("hi"));',
                'const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));',
                'if (!user || !user.name) { throw new Error("name is required"); }',
            ],
            en: [
                'The quick brown fox jumps over the lazy dog while the sun slowly sets behind the quiet hills.',
                'A small habit repeated every day will take you farther than a big effort made once in a while.',
                'Typing is a skill like any other: slow down, stay accurate, and the speed will come by itself.',
                'When the rain stops, the streets smell fresh, and the whole city seems to take a deep breath.',
                'Good tools do not make a good craftsperson, but a good craftsperson knows how to choose them.',
                'Write the simplest thing that works, then measure it, and only then decide whether it needs more.',
            ],
        };

        const $ = (s) => document.querySelector(s);
        let lang = 'zh', secs = 30, target = '', startAt = 0, timer = null, finished = false, composing = false;
        const bestKey = () => `typing_best_${lang}_${secs}`;
        const { store } = Util;
        const loadBest = () => store.get(bestKey(), 0);
        let custom = cleanCustom(store.get('typing_custom', ''));
        let hist = store.get('typing_hist', []).filter(validRec), weak = store.get('typing_miss', {});
        if (!weak || typeof weak !== 'object' || Array.isArray(weak)) weak = {};

        function renderHist() {
            const tr = trendOf(hist, lang, secs), max = Math.max(1, ...tr.map(h => h.cpm));
            $('#hLabel').textContent = lang === 'custom' ? '（自訂文章不記錄）' : `（${{ zh: '中文', en: 'English', code: '程式碼' }[lang]}・${secs} 秒・最近 ${tr.length} 次）`;
            $('#trend').replaceChildren(...tr.map(h => { const b = document.createElement('div'); b.style.cssText = `flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative;height:${h.cpm / max * 100}%`; b.title = `${h.d}：${h.cpm} 字/分・正確率 ${h.acc}%`; const s = document.createElement('small'); s.textContent = h.cpm; s.style.cssText = 'position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)'; b.append(s); return b; }));
            const top = topMistakes(weak);
            $('#weak').replaceChildren(...(top.length ? [Object.assign(document.createElement('div'), { className: 'muted', textContent: '最常打錯的字（累計）' }), ...top.map(([c, n]) => Util.statRow(c, n + ' 次'))] : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '還沒有資料，完成一次測驗就會開始統計。' })]));
        }

        function pick() {
            if (lang === 'custom') return custom;                        // 自訂文章：固定使用貼上的那一段
            const list = PASSAGES[lang];
            let next;
            do { next = list[Math.floor(Math.random() * list.length)]; } while (next === target && list.length > 1);
            return next;
        }

        function renderPassage() {
            const typed = $('#input').value, box = $('#passage');
            box.replaceChildren(...[...target].map((ch, i) => {
                const s = document.createElement('span');
                s.textContent = ch;
                if (i < typed.length) s.className = typed[i] === ch ? 'ok' : 'bad';
                else if (i === typed.length) s.className = 'cur';
                return s;
            }));
        }

        function reset() {
            renderHist();
            clearInterval(timer);
            finished = false; startAt = 0;
            target = pick();
            $('#customBox').hidden = lang !== 'custom';
            $('#input').value = '';
            $('#input').disabled = !target;                              // 自訂文章還沒貼時不能打字
            $('#left').textContent = secs;
            $('#cpm').textContent = 0;
            $('#result').hidden = true;
            if (target) renderPassage(); else $('#passage').textContent = '請在上方貼上想練習的文章，再按「使用這段文字」。';
            if (target) $('#input').focus();
        }

        function finish() {
            if (finished) return;
            finished = true;
            clearInterval(timer);
            $('#input').disabled = true;
            const elapsed = Math.min(secs, (Date.now() - startAt) / 1000);
            const r = score(target, $('#input').value, elapsed);
            $('#result').hidden = false;
            $('#r-cpm').textContent = `${r.cpm} 字/分`;
            $('#r-detail').textContent = `約 ${r.wpm} WPM ・ 正確率 ${r.accuracy}% ・ 正確 ${r.correct} / 輸入 ${r.typed} 字`;
            const miss = mistakes(target, $('#input').value);
            weak = addMistakes(weak, miss); store.set('typing_miss', weak);
            if (lang !== 'custom') { hist = [...hist, { d: Util.day.today(), lang, secs, cpm: r.cpm, acc: r.accuracy }].slice(-200); store.set('typing_hist', hist); }
            renderHist();
            if (lang === 'custom') { $('#r-best').textContent = '自訂文章不記錄最佳成績'; return; }
            const best = loadBest();
            if (r.cpm > best) {
                store.set(bestKey(), r.cpm);
                $('#r-best').textContent = best ? `🎉 新紀錄！（原本 ${best}）` : '🎉 第一筆紀錄';
            } else {
                $('#r-best').textContent = `最佳紀錄：${best} 字/分`;
            }
        }

        function onInput() {
            if (finished || composing) return; // 注音/拼音組字中不計算，避免把未選字的拼音當成錯字
            if (!startAt) {
                startAt = Date.now();
                timer = setInterval(() => {
                    const left = Math.max(0, secs - (Date.now() - startAt) / 1000);
                    $('#left').textContent = Math.ceil(left);
                    $('#cpm').textContent = score(target, $('#input').value, (Date.now() - startAt) / 1000).cpm;
                    if (left <= 0) finish();
                }, 200);
            }
            renderPassage();
            if ($('#input').value.length >= target.length) finish();
        }

        $('#input').addEventListener('compositionstart', () => { composing = true; });
        $('#input').addEventListener('compositionend', () => { composing = false; onInput(); });
        $('#input').addEventListener('input', onInput);
        $('#again').onclick = reset;
        $('#hClear').onclick = () => { if (confirm('清除所有歷史成績與錯字統計？（最佳紀錄不受影響）')) { hist = []; weak = {}; store.set('typing_hist', hist); store.set('typing_miss', weak); renderHist(); } };
        $('#customText').value = custom;
        $('#customApply').onclick = () => { custom = cleanCustom($('#customText').value); $('#customText').value = custom; store.set('typing_custom', custom); reset(); };
        document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
            lang = b.dataset.lang;
            document.querySelectorAll('[data-lang]').forEach(x => x.setAttribute('aria-pressed', x === b));
            reset();
        });
        document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
            secs = +b.dataset.sec;
            document.querySelectorAll('[data-sec]').forEach(x => x.setAttribute('aria-pressed', x === b));
            reset();
        });
        reset();
    </script>
</body>

</html>
