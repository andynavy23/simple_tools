    <template id="help">
        <h3>這是什麼</h3>
        <p>兩個單機休閒小遊戲：<b>消消樂</b>（Match-3，交換相鄰寶石湊 3 個以上消除、連鎖衝分）與<b>七巧板</b>（用七塊標準板拼出指定剪影）。完全離線，沒有連線功能。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>等車、休息時想玩幾分鐘輕鬆的遊戲。</li>
        <li>想挑戰每天固定盤面的「每日挑戰」，或慢慢解七巧板。</li>
        </ul>
        <h3>怎麼玩：消消樂</h3>
        <ol>
        <li>點一顆寶石，再點它<b>上下左右相鄰</b>的另一顆，兩顆交換；交換後要能形成 3 個以上同色連線才算有效，否則會彈回（不扣步數）。</li>
        <li>消除後上方寶石落下、補進新的；掉下來又連成線就是<b>連鎖</b>，第 N 次連鎖的得分是 N 倍（每顆基本 10 分）。</li>
        <li><b>4 連</b>：產生條紋方塊（橫連 4 → ↔ 清整列；直連 4 → ↕ 清整欄）。<b>5 連以上</b>：產生彩虹方塊 ✦。<b>L / T 形</b>（橫直各 3 顆交會）：產生炸彈 ✸（清周圍 3×3）。特殊方塊被消除時才會發動，且會連鎖引爆範圍內的其他特殊方塊。</li>
        <li><b>彩虹 ✦</b> 與任一顆普通寶石交換：清掉全盤該顏色。<b>兩個特殊方塊互換</b>（簡化規則）：條紋 + 條紋＝清該格整列加整欄；炸彈 + 條紋＝清 3 列加 3 欄；炸彈 + 炸彈＝清 5×5；彩虹 + 任一特殊方塊＝清全盤。</li>
        <li>沒有任何可走的交換時，盤面會自動洗牌（保留特殊方塊）。「提示」會亮出一個可走的交換。</li>
        <li>模式：<b>步數</b>（30 步內衝分）、<b>計時</b>（60 秒內衝分，進行中的連鎖會算完）、<b>每日挑戰</b>（8×8、30 步；以台灣時間日期當種子，當天開局盤面所有人相同；之後補進的方塊也由同一組亂數決定，所以同樣的走法會得到同樣的結果）。盤面大小可選 8×8 或 7×7（每日挑戰固定 8×8）。</li>
        </ol>
        <h3>怎麼玩：七巧板</h3>
        <ol>
        <li>七塊板：2 個大三角、1 個中三角、2 個小三角、1 個正方形、1 個平行四邊形。把它們<b>不重疊</b>地擺滿上方的灰色剪影。</li>
        <li><b>電腦滑鼠</b>：直接拖曳板子。<b>手機</b>預設是「點選模式」（手指可以正常捲動頁面）：點一塊板選取，再點盤面空白處就會把它移過去；要拖曳請按「切到拖曳模式」，拖曳時手指在盤面上無法捲動頁面，要捲動就切回來，或在盤面外的區域滑動。</li>
        <li>選取後按 ↺ ↻ 以 45° 旋轉；平行四邊形可「翻面」（其他板翻面沒有差別）。板子靠近剪影或其他板的角時會自動吸附對齊。</li>
        <li><b>完成判定</b>：在剪影範圍內取格點取樣，被板子蓋住的比例 ≥ 98%，且板子彼此重疊的比例 ≤ 1.5%，就算完成（這個容差是為了吸附後的微小誤差；任何可行的拼法都算，不必和內建解答一樣）。</li>
        <li>「提示」會用虛線顯示一塊還沒擺對的板的正確位置（3 秒）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">消消樂：橫排有 ●●_● ，把下面的 ● 往上換到空格，4 顆連成一線，產生一個 ↔ 條紋方塊；之後它被消掉時整列一起清空。</div>
        <h3>小提醒</h3>
        <ul>
        <li>最佳紀錄（各模式各尺寸的最高分、每日挑戰最近 30 天的分數，超過 30 天最舊的會被淘汰）與七巧板進度（每個剪影的最快完成時間，最多就是剪影數量）存在這台裝置。按下方「清除」按鈕會先確認、刪除後無法復原；不會重新載入頁面，進行中的這一局不受影響。</li>
        <li>資料損壞時載入會忽略壞的部分並使用預設值。進行中的盤面不會儲存。</li>
        <li>內建 24 個剪影是程式用「邊對邊」規則隨機拼出再驗證的（面積與邊長都和標準七巧板一致），所以多半是抽象圖形，不是動物或人物。</li>
        <li>動畫尊重系統的「減少動態效果」設定。</li>
        </ul>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd, store } = Util;
        // --- pure ---
        // ===== 消消樂：盤面是長度 n*n 的整數陣列；值 = 顏色 + 8 * 特殊（0 無、1 橫條紋、2 直條紋、3 炸彈、4 彩虹）；-1 = 空 =====
        const spOf = (v) => v < 0 ? 0 : v >> 3;
        const colOf = (v) => (v < 0 || (v >> 3) === 4) ? -1 : v & 7;   // 彩虹不屬於任何顏色
        const mk = (c, s) => c + 8 * s;
        const adj = (n, i, j) => { const d = Math.abs(i - j); return d === n || (d === 1 && ((i / n) | 0) === ((j / n) | 0)); };
        const ri = (rand, n) => Math.floor(rand() * n);

        function makes3(b, n, i, c) {
            const x = i % n, y = (i / n) | 0;
            return (x >= 2 && colOf(b[i - 1]) === c && colOf(b[i - 2]) === c) || (y >= 2 && colOf(b[i - n]) === c && colOf(b[i - 2 * n]) === c);
        }
        // 產生沒有現成 3 連、且至少有一步可走的盤面（rand 為 () => [0,1)，傳 Util.seeded 即可重現）
        function genBoard(n, k, rand) {
            for (; ;) {
                const b = new Array(n * n);
                for (let i = 0; i < b.length; i++) { let c; do { c = ri(rand, k); } while (makes3(b, n, i, c)); b[i] = c; }
                if (findMove(b, n)) return b;
            }
        }
        // 找出所有 3 連以上；回傳 { clear: Set(要消的格), spawn: Map(格 → 新特殊方塊的值) }；pref 為玩家交換的兩格（優先在那裡生成特殊方塊）
        function findMatches(b, n, pref = []) {
            const H = [], V = [];
            for (let y = 0; y < n; y++) for (let x = 0; x < n;) {
                const c = colOf(b[y * n + x]); let e = x + 1;
                if (c >= 0) while (e < n && colOf(b[y * n + e]) === c) e++;
                if (c >= 0 && e - x >= 3) { const cells = []; for (let q = x; q < e; q++) cells.push(y * n + q); H.push({ cells, c }); }
                x = e;
            }
            for (let x = 0; x < n; x++) for (let y = 0; y < n;) {
                const c = colOf(b[y * n + x]); let e = y + 1;
                if (c >= 0) while (e < n && colOf(b[e * n + x]) === c) e++;
                if (c >= 0 && e - y >= 3) { const cells = []; for (let q = y; q < e; q++) cells.push(q * n + x); V.push({ cells, c }); }
                y = e;
            }
            const clear = new Set(), spawn = new Map();
            [...H, ...V].forEach(r => r.cells.forEach(i => clear.add(i)));
            const pick = (cells) => cells.find(i => pref.includes(i)) ?? cells[cells.length >> 1];
            H.forEach(r => { if (r.cells.length === 4) spawn.set(pick(r.cells), mk(r.c, 1)); });
            V.forEach(r => { if (r.cells.length === 4) spawn.set(pick(r.cells), mk(r.c, 2)); });
            H.forEach(r => V.forEach(q => { const hit = r.cells.find(i => q.cells.includes(i)); if (hit !== undefined) spawn.set(hit, mk(r.c, 3)); }));
            [...H, ...V].forEach(r => { if (r.cells.length >= 5) spawn.set(pick(r.cells), mk(0, 4)); });
            return { clear, spawn };
        }
        // 被消除的格若是特殊方塊就發動：橫 / 直條紋清整列 / 整欄、炸彈清 3×3，連鎖引爆
        function expand(b, n, clear) {
            const out = new Set(clear), q = [...out], add = (j) => { if (!out.has(j)) { out.add(j); q.push(j); } };
            while (q.length) {
                const i = q.pop(), s = spOf(b[i]), x = i % n, y = (i / n) | 0;
                if (s === 1) for (let t = 0; t < n; t++) add(y * n + t);
                else if (s === 2) for (let t = 0; t < n; t++) add(t * n + x);
                else if (s === 3) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (x + dx >= 0 && x + dx < n && y + dy >= 0 && y + dy < n) add((y + dy) * n + x + dx);
            }
            return out;
        }
        // 嘗試交換 i、j：無效回傳 null，有效回傳 { b: 交換後盤面, clear, spawn }
        function tryMove(b, n, i, j) {
            if (!adj(n, i, j) || b[i] < 0 || b[j] < 0) return null;
            const a = b[i], c = b[j], sa = spOf(a), sc = spOf(c), b2 = b.slice();
            b2[i] = c; b2[j] = a;
            const clear = new Set([i, j]), x = j % n, y = (j / n) | 0;
            if (sa && sc) {                                   // 兩個特殊方塊互換（簡化規則）
                if (sa === 4 || sc === 4) { for (let t = 0; t < n * n; t++) clear.add(t); }
                else {
                    const bombs = (sa === 3) + (sc === 3);
                    const r = bombs === 2 ? 2 : bombs === 1 ? 1 : 0;
                    for (let t = 0; t < n; t++) for (let u = 0; u < n; u++) {
                        const dy = Math.abs(t - y), dx = Math.abs(u - x);
                        if (bombs === 2 ? (dy <= 2 && dx <= 2) : (dy <= r || dx <= r)) clear.add(t * n + u);
                    }
                }
                return { b: b2, clear, spawn: new Map() };
            }
            if (sa === 4 || sc === 4) {                       // 彩虹 + 普通寶石：清該顏色
                const col = colOf(sa === 4 ? c : a);
                b.forEach((v, t) => { if (colOf(v) === col) clear.add(t); });
                return { b: b2, clear, spawn: new Map() };
            }
            const m = findMatches(b2, n, [i, j]);
            return m.clear.size ? { b: b2, clear: m.clear, spawn: m.spawn } : null;
        }
        // 重力：每欄往下掉，頂端補新寶石
        function drop(b, n, k, rand) {
            const o = b.slice();
            for (let x = 0; x < n; x++) {
                const col = [];
                for (let y = n - 1; y >= 0; y--) if (b[y * n + x] >= 0) col.push(b[y * n + x]);
                while (col.length < n) col.push(ri(rand, k));
                for (let t = 0; t < n; t++) o[(n - 1 - t) * n + x] = col[t];
            }
            return o;
        }
        // 結算一次有效交換的整串連鎖：第 N 次連鎖得分 × N；frames 供動畫逐步播放
        function resolve(b, n, k, rand, m) {
            let board = b, clear = m.clear, spawn = m.spawn, chain = 1, score = 0;
            const frames = [];
            for (let guard = 0; clear.size && guard < 80; guard++) {
                const all = expand(board, n, clear), o = board.slice();
                all.forEach(i => { o[i] = -1; });
                spawn.forEach((v, i) => { o[i] = v; });
                const cnt = all.size - [...spawn.keys()].filter(i => all.has(i)).length, gain = cnt * 10 * chain;
                score += gain;
                const before = board;
                board = drop(o, n, k, rand);
                frames.push({ cleared: [...all], before, board, gain, chain });
                const nm = findMatches(board, n); clear = nm.clear; spawn = nm.spawn; chain++;
            }
            return { board, score, frames };
        }
        // 找一步可走的交換（優先消最多格的）；沒有回傳 null
        function findMove(b, n) {
            let best = null, bs = 0;
            for (let i = 0; i < n * n; i++) for (const j of [i + 1, i + n]) {
                if (j >= n * n || !adj(n, i, j)) continue;
                const m = tryMove(b, n, i, j);
                if (m && m.clear.size > bs) { bs = m.clear.size; best = [i, j]; }
            }
            return best;
        }
        // 無步可走時洗牌（保留特殊方塊）；洗不出來就整盤重產
        function ensureMoves(b, n, k, rand) {
            if (findMove(b, n)) return { board: b, shuffled: false };
            for (let t = 0; t < 200; t++) {
                const a = b.slice();
                for (let i = a.length - 1; i > 0; i--) { const j = ri(rand, i + 1); [a[i], a[j]] = [a[j], a[i]]; }
                if (!findMatches(a, n).clear.size && findMove(a, n)) return { board: a, shuffled: true };
            }
            return { board: genBoard(n, k, rand), shuffled: true };
        }
        const tw = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
        const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s);
        // 最佳紀錄驗證：m8 m7 t8 t7 為整數，daily 為 {日期: 分數}（只留最近 30 天）
        function cleanBest(o) {
            const r = { daily: {} }; if (!o || typeof o !== 'object' || Array.isArray(o)) return r;
            for (const k of ['m8', 'm7', 't8', 't7']) if (Number.isInteger(o[k]) && o[k] > 0 && o[k] < 1e8) r[k] = o[k];
            if (o.daily && typeof o.daily === 'object' && !Array.isArray(o.daily)) {
                Object.keys(o.daily).filter(d => isDate(d) && Number.isInteger(o.daily[d]) && o.daily[d] > 0 && o.daily[d] < 1e8).sort().slice(-30).forEach(d => { r.daily[d] = o.daily[d]; });
            }
            return r;
        }

        // ===== 七巧板：座標為平面浮點數；板子基本形都是整數座標（小三角腿 1、正方形邊 1、中三角斜邊 2、大三角腿 2、平行四邊形邊 1 與 √2，總面積 8）=====
        const TYPES = 'LLMSSQP';
        const BASE = { L: [0, 0, 2, 0, 0, 2], M: [0, 0, 2, 0, 1, 1], S: [0, 0, 1, 0, 0, 1], Q: [0, 0, 1, 0, 1, 1, 0, 1], P: [0, 0, 1, 0, 2, 1, 1, 1] };

            if (!confirm('要清除所有消消樂最佳紀錄（含每日挑戰）嗎？\n無法復原。不會重新載入頁面，進行中的這一局不受影響。')) return;
            try { localStorage.removeItem('casualp_best'); } catch (e) { }
            best = cleanBest(null); showBest();
        };
        showBest();

        // ---------- 七巧板 ----------
        const K = 1.5, SNAP = 0.4, W = 12, H = 14;
        const PCOL = { L: '#e5484d', M: '#d98a00', S: '#30a46c', Q: '#3e8ef7', P: '#8e4ec6' };
        const START = [[2, 9.6], [5.6, 9.6], [9.4, 9.6], [1.5, 12.6], [3.7, 12.6], [6.2, 12.6], [9.6, 12.6]];
        let T = null, tapMode = matchMedia('(pointer: coarse)').matches, tTimer = 0;
        $('#tSel').innerHTML = PUZ.map((p, i) => `<option value="${i + 1}"></option>`).join('');
        function tgLabels() { [...$('#tSel').options].forEach((o, i) => { o.textContent = (prog[i + 1] ? '✓ ' : '') + PUZ[i].n + (prog[i + 1] ? '（' + fmt(prog[i + 1]) + '）' : ''); }); $('#tDone').textContent = Object.keys(prog).length + ' / ' + PUZ.length; }
        function silPolys(id) {         // 剪影多邊形（平面座標，已縮放置中）
            const raw = PUZ[id - 1].p, xs = raw.flat().filter((_, i) => i % 2 === 0), ys = raw.flat().filter((_, i) => i % 2);
            const ox = W / 2 - (Math.min(...xs) + Math.max(...xs)) * K / 2, oy = 3.7 - (Math.min(...ys) + Math.max(...ys)) * K / 2;
            return raw.map(p => p.map((v, i) => v * K + (i % 2 ? oy : ox)));
        }
        function tgLoad(id) {
            id = Math.min(PUZ.length, Math.max(1, id));
            T = { id, sil: silPolys(id), pcs: TYPES.split('').map((t, i) => ({ t, rot: 0, flip: false, x: START[i][0], y: START[i][1], i })), sel: null, t0: 0, done: false, secs: 0, hint: -1 };
            $('#tSel').value = id; clearInterval(tTimer);
            tgLabels(); tgDraw(); tgInfo(); tgMode();
        }
        const polyOf = (p) => pose(p.t, p.rot, p.flip, p.x, p.y, K);
        const ptsStr = (f) => { let s = ''; for (let i = 0; i < f.length; i += 2) s += f[i].toFixed(3) + ',' + f[i + 1].toFixed(3) + ' '; return s; };
        function tgDraw() {
            let h = T.sil.map(p => `<polygon points="${ptsStr(p)}" fill="var(--fill)" stroke="var(--fill)" stroke-width="0.04"/>`).join('');
            if (T.hint >= 0) h += `<polygon points="${ptsStr(T.sil[T.hint])}" fill="none" stroke="var(--blue)" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>`;
            T.pcs.forEach((p, k) => { h += `<polygon class="pc" data-k="${k}" points="${ptsStr(polyOf(p))}" fill="${PCOL[p.t]}" fill-opacity="0.9" stroke="${T.sel === k ? 'var(--text)' : 'rgba(0,0,0,.45)'}" stroke-width="${T.sel === k ? 0.12 : 0.05}" stroke-linejoin="round"/>`; });
            $('#tsvg').innerHTML = h;
        }
        function tgInfo() {
            if (!T) return;
            $('#tInfo').textContent = T.done ? '完成！用時 ' + fmt(T.secs) + (prog[T.id] === T.secs ? '（本題最佳）' : '') : (T.t0 ? '已用 ' + fmt(Math.floor((Date.now() - T.t0) / 1000)) : '拖曳或點選板子開始');
        }
        function tgMode() {
            $('#tsvg').classList.toggle('drag', !tapMode);
            $('#tMode').textContent = tapMode ? '切到拖曳模式' : '切到捲動模式';
            $('#tTip').textContent = tapMode ? '點選一塊板，再點盤面空白處移過去（手指可捲動頁面）' : '拖曳板子（手指在盤面上無法捲動頁面）';
        }
        function tgStart() { if (!T.t0 && !T.done) { T.t0 = Date.now(); tTimer = setInterval(tgInfo, 1000); } }
        function tgCheck() {
            if (T.done) return;
            if (!solved(T.sil, T.pcs.map(polyOf))) return;
            T.done = true; T.secs = Math.max(1, Math.round((Date.now() - T.t0) / 1000)); clearInterval(tTimer);
            if (!prog[T.id] || T.secs < prog[T.id]) { prog[T.id] = T.secs; store.set('casualp_progress', prog); }
            T.sel = null; tgLabels(); tgDraw(); tgInfo();
        }
        function tgSnap(p) {
            const targets = T.sil.flat(); T.pcs.forEach(o => { if (o !== p) targets.push(...polyOf(o)); });
            const [dx, dy] = snapShift(polyOf(p), targets, SNAP); p.x += dx; p.y += dy;
        }
        const svgPt = (e) => { const r = $('#tsvg').getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
        const clamp = (p) => { p.x = Math.min(W - 0.5, Math.max(0.5, p.x)); p.y = Math.min(H - 0.5, Math.max(0.5, p.y)); };
        let drag = null;
        $('#tsvg').addEventListener('pointerdown', (e) => {
            if (!T || T.done) return;
            const el = e.target.closest('polygon.pc'); if (!el) return;
            const k = +el.dataset.k, p = T.pcs.splice(k, 1)[0]; T.pcs.push(p); T.sel = T.pcs.length - 1; T.hint = -1;
            const [x, y] = svgPt(e); drag = { p, x, y, ox: p.x, oy: p.y, moved: false, id: e.pointerId };
            tgStart(); tgDraw();
            try { $('#tsvg').setPointerCapture(e.pointerId); } catch (er) { }
        });
        $('#tsvg').addEventListener('pointermove', (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            const [x, y] = svgPt(e); if (Math.hypot(x - drag.x, y - drag.y) > 0.1) drag.moved = true;
            drag.p.x = drag.ox + x - drag.x; drag.p.y = drag.oy + y - drag.y; clamp(drag.p);
            const el = $('#tsvg').querySelector(`polygon.pc[data-k="${T.pcs.indexOf(drag.p)}"]`); if (el) el.setAttribute('points', ptsStr(polyOf(drag.p)));
        });
        const endDrag = (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            const d = drag; drag = null;
            if (d.moved) { tgSnap(d.p); tgDraw(); tgCheck(); T.justDragged = true; setTimeout(() => { if (T) T.justDragged = false; }, 50); }
        };
        $('#tsvg').addEventListener('pointerup', endDrag);
        $('#tsvg').addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) { drag = null; tgDraw(); } });
        $('#tsvg').addEventListener('click', (e) => {      // 點盤面空白處：把選取的板移過去（手機點選模式）
            if (!T || T.done || T.justDragged || T.sel === null || e.target.closest('polygon.pc')) return;
            const p = T.pcs[T.sel], [x, y] = svgPt(e); p.x = x; p.y = y; clamp(p); tgStart(); tgSnap(p); tgDraw(); tgCheck();
        });
        const selPiece = () => (T && !T.done && T.sel !== null) ? T.pcs[T.sel] : null;
        const rot = (d) => { const p = selPiece(); if (!p) return $('#tTip').textContent = '請先點選一塊板'; p.rot = (p.rot + d + 8) % 8; tgStart(); tgDraw(); tgCheck(); };
        $('#tL').onclick = () => rot(-1); $('#tR').onclick = () => rot(1);
        $('#tF').onclick = () => {
            const p = selPiece(); if (!p) return $('#tTip').textContent = '請先點選一塊板';
            if (p.t !== 'P') return $('#tTip').textContent = '只有平行四邊形需要翻面（其他板翻面形狀不變）';
            p.flip = !p.flip; tgStart(); tgDraw(); tgCheck();
        };
        $('#tHint').onclick = () => {
            if (!T || T.done) return;
            const j = hintIndex(T.sil, T.pcs.map(p => p.t), T.pcs.map(polyOf), 0.3 * K);
            T.hint = j; tgDraw(); if (j >= 0) setTimeout(() => { if (T && T.hint === j) { T.hint = -1; tgDraw(); } }, 3000);
            $('#tTip').textContent = j >= 0 ? '虛線處是「' + { L: '大三角', M: '中三角', S: '小三角', Q: '正方形', P: '平行四邊形' }[TYPES[j]] + '」的位置' : '每塊都在正確位置了';
        };
        $('#tReset').onclick = () => tgLoad(T.id);
        $('#tMode').onclick = () => { tapMode = !tapMode; tgMode(); };
        $('#tSel').onchange = () => tgLoad(+$('#tSel').value);
        $('#tPrev').onclick = () => tgLoad(T.id - 1); $('#tNext').onclick = () => tgLoad(T.id + 1);
        $('#clearProg').onclick = () => {
            if (!confirm('要清除七巧板的完成進度與最快時間嗎？\n無法復原。不會重新載入頁面，目前擺放的板子不受影響。')) return;
            try { localStorage.removeItem('casualp_progress'); } catch (e) { }
            prog = {}; tgLabels(); tgInfo();
        };
    </script>
</body>

</html>
