    <template id="help">
        <h3>這是什麼</h3>
        <p>語言練習：把常見的語言練習題集中在一個工具。包含英文時態 / 介系詞 / 冠詞 / 不規則動詞，日文助詞 / 形容詞變化 / 動詞變化 / 漢字讀音，西班牙語動詞變位，德語冠詞，韓文字母，以及國字的破音字與錯別字。單機玩，不需要網路。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>準備英檢、日檢（N5～N4）或剛學西 / 德 / 韓語，想快速刷題</li>
        <li>老是記不住不規則動詞、て形、der / die / das，想靠「答錯的更常出現」加強</li>
        <li>通勤或排隊時練幾分鐘，或用限時連擊挑戰自己</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>在「練習」選主題與子分類（可複選），再選題型（選擇題 / 輸入答案，只有不規則動詞、日文變化、漢字讀音、西班牙語支援輸入）、模式與題數</li>
        <li>模式：<b>循序</b>（依題庫順序）、<b>隨機</b>、<b>錯題加強</b>（答錯過的出現機率較高）、<b>限時 60 秒</b>（連擊加分，時間到結算並記錄各主題最佳分數）</li>
        <li>按「開始」。選擇題點選項（鍵盤 <kbd>1</kbd>～<kbd>4</kbd>），輸入題打字後按 <kbd>Enter</kbd>；每題作答後都會顯示正確答案與一句解說，按「下一題」（或 <kbd>Enter</kbd>）繼續</li>
        <li>結束時顯示摘要與答錯的題目；「統計」可看各主題 × 子分類的正確率與最弱 10 個，並一鍵練習最弱的</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">選「日文動詞變化 + 一類（五段）+ 輸入答案」：題目「飲む（のむ）→ て形」，輸入 <b>飲んで</b> 或 <b>のんで</b> 都算對。輸入題會自動忽略大小寫與全形半形，英文的 isn't 與 is not 視為相同，日文片假名會當成平假名。</div>
        <h3>小提醒</h3>
        <ul>
        <li>題庫為內嵌的精選題，非完整教材；解說力求簡短，遇到有爭議的用法（例如美式 / 英式、不同詞典）請以你的教材為準，建議請老師或母語者抽查</li>
        <li>西班牙語輸入題要求重音符號要正確（手機長按字母可輸入 á é í ó ú），韓文字母只有選擇題</li>
        <li>每題的答對 / 答錯次數存在這個瀏覽器（鍵 langd_stats，最多 3000 筆，超過不再新增；題庫約 2,000 題，不會無限增長），選項設定存在 langd_opts，皆可用右上角 💾 備份</li>
        <li>「統計」頁的「清除統計與最佳紀錄」會刪除全部作答紀錄，無法復原（不影響選項設定）；資料損壞或舊版資料會自動忽略錯誤的部分</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const TOPICS = [
            { id: 'tense', name: '英文時態', typ: false, ask: '選出正確的動詞形式' },
            { id: 'prep', name: '英文介系詞', typ: false, ask: '選出適當的介系詞' },
            { id: 'art', name: '英文冠詞', typ: false, ask: '選出正確的冠詞（∅ = 不加冠詞）' },
            { id: 'irv', name: '英文不規則動詞', typ: true, ask: '' },
            { id: 'jpart', name: '日文助詞', typ: false, ask: '選出適當的助詞' },
            { id: 'jadj', name: '日文形容詞變化', typ: true, ask: '' },
            { id: 'jverb', name: '日文動詞變化', typ: true, ask: '' },
            { id: 'kanji', name: '日文漢字讀音', typ: true, ask: '這個詞怎麼讀？（平假名）' },
            { id: 'es', name: '西班牙語動詞變位', typ: true, ask: '' },
            { id: 'de', name: '德語冠詞', typ: false, ask: '' },
            { id: 'ko', name: '韓文字母', typ: false, ask: '這個怎麼念？（羅馬拼音）' },
            { id: 'poyin', name: '破音字', typ: false, ask: '【】內的字怎麼唸？（注音）' },
            { id: 'typo', name: '錯別字', typ: false, ask: '選出寫法正確的一個' },
        ];
        const TOPIC_BY_ID = Object.fromEntries(TOPICS.map(t => [t.id, t]));
        const ITEMS = [];
        function mk(topic, sub, id, q, a, o = {}) {
            const it = { topic, sub, id, key: `${topic}|${sub}|${id}`, q, a: [].concat(a), bad: o.bad || [], strict: !!o.strict, exp: o.exp || '', ask: o.ask || TOPIC_BY_ID[topic].ask, pool: o.pool || 'sub' };
            ITEMS.push(it); return it;
        }
        // 逐行資料：「# 子分類」換分類；其餘「題幹 | 答案 | 錯誤選項（逗號分隔）| 解說」，錯誤選項固定（不會混入別題的答案）
        function fromLines(topic, text, rule = {}) {
            let sub = '';
            for (const raw of text.split('\n')) {
                const line = raw.trim(); if (!line) continue;
                if (line[0] === '#') { sub = line.slice(1).trim(); continue; }
                const [q, a, w, e = ''] = line.split(' | ');
                mk(topic, sub, q, q, a, { bad: w.split(','), strict: true, exp: [rule[sub], e].filter(Boolean).join('　') });
            }
        }

        // ---------- 英文時態 ----------
        const TENSE_RULE = {
            '現在簡單式': '現在簡單式：原形（第三人稱單數加 s）。', '現在進行式': '現在進行式：am / is / are + V-ing。', '現在完成式': '現在完成式：have / has + 過去分詞。',
            '現在完成進行式': '現在完成進行式：have / has been + V-ing。', '過去簡單式': '過去簡單式：動詞過去式。', '過去進行式': '過去進行式：was / were + V-ing。',
            '過去完成式': '過去完成式：had + 過去分詞（比過去某時間點更早）。', '過去完成進行式': '過去完成進行式：had been + V-ing。', '未來簡單式': '未來簡單式：will + 原形。',
            '未來進行式': '未來進行式：will be + V-ing。', '未來完成式': '未來完成式：will have + 過去分詞。', '未來完成進行式': '未來完成進行式：will have been + V-ing。'
        };
        fromLines('tense', `
# 現在簡單式
My sister ___ (play) the piano every Sunday.（現在的習慣） | plays | play,played,is playing | 主詞是第三人稱單數，動詞加 s。
Water ___ (boil) at 100°C.（科學事實） | boils | boiled,is boiling,boil | 事實與真理用現在簡單式。
They ___ (not like) spicy food.（現在的喜好） | do not like | does not like,did not like,are not liking | 複數主詞的否定用 do not + 原形。
The train to Taipei ___ (leave) at 8:15 every morning.（固定時刻表） | leaves | leave,left,has left | 固定時刻表用現在簡單式。
I ___ (be) a student at NTU.（現在的身分） | am | is,are,was | 主詞 I 搭配 am。
# 現在進行式
Listen! The baby ___ (cry) in the next room. | is crying | cries,cried,will cry | Listen! 表示此刻正在發生。
Look at the sky. It ___ (rain) now. | is raining | rains,rained,will rain | now 表示正在進行。
I can't answer the phone. I ___ (take) a shower right now. | am taking | take,took,have taken | right now 表示此刻正在做。
They ___ (build) a new bridge these days.（這陣子正在進行） | are building | build,built,were building | 目前這段期間持續進行。
Tom ___ (not watch) TV at the moment. He is doing homework. | is not watching | does not watch,did not watch,will not watch | at the moment 表示此刻。
# 現在完成式
I ___ (live) in Taipei since 2015. | have lived | lived,live,had lived | since 表示從過去持續到現在。
She ___ (just finish) her homework.（剛剛完成） | has just finished | had just finished,just finishes,is just finishing | just 搭配現在完成式，第三人稱單數用 has。
We ___ (never be) to Japan.（至今從未去過） | have never been | had never been,will never be,did never been | 至今的經驗用現在完成式。
They ___ (know) each other for ten years.（至今仍然認識） | have known | know,knew,are knowing | for + 一段時間，持續到現在。
I ___ (already see) this movie three times.（至今已看過三次） | have already seen | had already seen,will already see,am already seeing | 累積到現在的次數用現在完成式。
# 現在完成進行式
She is tired because she ___ (run) for an hour.（一直在跑，剛結束） | has been running | is running,runs,ran | 強調動作從過去持續到現在。
It ___ (rain) all day, and the streets are still wet.（從早到現在一直下） | has been raining | is raining,rained,rains | all day 表示持續一整天到現在。
I ___ (wait) for you since noon. Where were you? | have been waiting | am waiting,waited,wait | since noon + 持續的動作。
They ___ (study) English for three years now. | have been studying | are studying,studied,study | for three years now，持續到現在的動作。
He ___ (work) here since he graduated.（一直在這工作） | has been working | works,worked,is working | since 引導從過去到現在的持續。
# 過去簡單式
I ___ (visit) my grandmother last weekend. | visited | visit,have visited,will visit | last weekend 是過去的時間點。
She ___ (not go) to school yesterday. | did not go | does not go,did not went,has not gone | did not 後面接原形。
Mozart ___ (write) hundreds of pieces.（已過世的人物） | wrote | writes,has written,is writing | 已結束的過去事實用過去簡單式。
We ___ (watch) a movie two days ago. | watched | have watched,watch,will watch | ago 搭配過去簡單式。
He ___ (buy) this car in 2019. | bought | has bought,buys,buyed | in 2019 是明確過去時間；buy 的過去式是 bought。
# 過去進行式
At 8 p.m. yesterday, I ___ (do) my homework.（當時正在做） | was doing | am doing,have done,do | 過去某時間點正在進行。
When she called me, I ___ (take) a bath.（當時正在洗澡） | was taking | take,have taken,am taking | 過去某一刻正在進行的動作。
They ___ (play) basketball when it started to rain.（開始下雨時正在打） | were playing | are playing,have played,play | 過去正在進行的動作被另一件事打斷。
The children ___ (sleep) when the thief broke in.（小偷闖入時正在睡） | were sleeping | sleep,are sleeping,have slept | 複數主詞用 were。
I ___ (not listen) when the teacher explained it.（當時沒在聽） | was not listening | am not listening,have not listened,do not listen | 過去進行式的否定：was / were not + V-ing。
# 過去完成式
When I arrived at the station, the train ___ (already leave). | had already left | has already left,already leaves,will already leave | 到站前火車就已離開，更早發生用 had + 過去分詞。
She ___ (finish) dinner before her mother came home. | had finished | has finished,finishes,will finish | 在媽媽回家（過去）之前就已完成。
I realized that I ___ (leave) my wallet at home. | had left | have left,leave,will leave | 發現（過去）之前就已經忘在家。
By the time we got there, the movie ___ (start). | had started | has started,starts,will start | by the time 引導過去時間點，之前用過去完成式。
He told me he ___ (never see) such a big dog before. | had never seen | has never seen,never sees,will never see | 轉述過去時，更早的經驗用 had + 過去分詞。
# 過去完成進行式

            stats = { s: {}, best: {} }; saveStats(); $('#sMsg').textContent = '已清除'; renderStats();
        };
        $('#weakGo').onclick = () => { const wk = weakest(stats).map(x => x.item); tab('play'); start(wk, 'weak'); };

        // 練習
        function show3(name) { $('#setup').hidden = name !== 'setup'; $('#game').hidden = name !== 'game'; $('#result').hidden = name !== 'result'; }
        function start(poolOverride, modeOverride, isMain = !poolOverride) {
            const pool = poolOverride || poolItems();
            if (!pool.length) { $('#setupMsg').textContent = '請至少選一個子分類'; return; }
            $('#setupMsg').textContent = '';
            const mode = modeOverride || S.mode;
            lastSetup = { pool, mode, isMain };
            G = { pool, mode, typ: S.typ, timed: mode === 'timed', limit: mode === 'timed' ? Infinity : (S.count || Infinity), idx: 0, score: 0, combo: 0, maxCombo: 0, right: 0, total: 0, q: null, lastKey: null, locked: false, wrong: [], end: Date.now() + TIMED_SEC * 1000, best: isMain };
            if (mode === 'seq') G.limit = Math.min(G.limit, pool.length);
            show3('game'); clearInterval(timerId);
            if (G.timed) timerId = setInterval(tickTime, 250);
            nextQ();
        }
        $('#start').onclick = () => start();
        function tickTime() { if (!G || !G.timed) return; if (G.end - Date.now() <= 0) finish(); else hud(); }
        function hud() {
            $('#hScore').textContent = G.score; $('#hCombo').textContent = G.combo; $('#hRight').textContent = G.right; $('#hTotal').textContent = G.total;
            $('#hTime').textContent = G.timed ? '⏱ ' + Math.max(0, Math.ceil((G.end - Date.now()) / 1000)) + ' 秒' : (G.limit === Infinity ? '不限題數' : `第 ${Math.min(G.total + 1, G.limit)} / ${G.limit} 題`);
        }
        function nextQ() {
            clearTimeout(nextId); if (!G) return;
            if (!G.timed && G.total >= G.limit) return finish();
            const item = G.mode === 'seq' ? G.pool[G.idx++ % G.pool.length] : G.mode === 'rand' || G.mode === 'timed' ? pickRandom(G.pool, Math.random, G.lastKey) : pickWeighted(G.pool, stats, Math.random, G.lastKey);
            const q = G.q = buildQ(item, Math.random, G.typ); G.locked = false;
            $('#ask').textContent = item.ask; $('#stem').textContent = item.q; $('#stem').classList.toggle('big', [...item.q].length <= 4);
            $('#fb').textContent = ''; $('#fb').className = ''; $('#exp').textContent = ''; $('#nextBtn').hidden = true;
            $('#choices').hidden = q.typed; $('#typeRow').hidden = !q.typed;
            if (q.typed) { $('#choices').replaceChildren(); $('#ans').value = ''; $('#ans').disabled = false; $('#ansGo').disabled = false; if (!matchMedia('(pointer:coarse)').matches) $('#ans').focus(); }
            else $('#choices').replaceChildren(...q.choices.map((o, i) => { const b = document.createElement('button'); b.textContent = label(o.label); b.dataset.i = i; b.onclick = () => choose(i); return b; }));
            hud();
        }
        function answer(right) {
            if (!G || G.locked) return; G.locked = true; const it = G.q.item;
            stats = recordAnswer(stats, it.key, right); saveStats(); G.total++; G.lastKey = it.key;
            if (right) { G.right++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.score += scoreFor(G.combo); } else { G.combo = 0; if (G.wrong.length < 10) G.wrong.push(it); }
            $('#fb').className = right ? 'ok' : 'bad'; $('#fb').textContent = right ? '✓ 正確' : `✗ 正確答案：${it.a.map(label).join(' / ')}`;
            $('#exp').textContent = it.exp; hud();
            if (G.timed) nextId = setTimeout(nextQ, right ? 450 : 1200);
            else { $('#nextBtn').hidden = false; $('#nextBtn').textContent = G.total >= G.limit ? '看結果' : '下一題'; }
        }
        function choose(i) {
            if (!G || G.locked || !G.q.choices) return; const o = G.q.choices[i], btns = $$('#choices button');
            btns[i].classList.add(o.ok ? 'ok' : 'bad'); if (!o.ok) btns[G.q.choices.findIndex(x => x.ok)].classList.add('ok');
            answer(o.ok);
        }
        function submitType() {
            if (!G || G.locked || !G.q || !G.q.typed) return; const v = $('#ans').value; if (!norm(v, G.q.item.topic)) return;
            $('#ans').disabled = true; $('#ansGo').disabled = true; answer(accepts(G.q.item, v));
        }
        $('#ansGo').onclick = submitType;
        $('#nextBtn').onclick = nextQ;
        $('#endBtn').onclick = () => finish();
        document.addEventListener('keydown', (e) => {
            if (!G || $('#game').hidden) return;
            if (e.key === 'Enter') { if (G.locked) { if (!$('#nextBtn').hidden) nextQ(); } else if (document.activeElement === $('#ans')) submitType(); }
            else if (/^[1-4]$/.test(e.key) && G.q && G.q.choices && document.activeElement.tagName !== 'INPUT') choose(+e.key - 1);
        });
        function finish() {
            if (!G) return; clearInterval(timerId); clearTimeout(nextId);
            const g = G; G = null; let line = `答對 ${g.right} / ${g.total} 題` + (g.total ? `（${Math.round(g.right / g.total * 100)}%）` : '') + `，最高連擊 ${g.maxCombo}`;
            if (g.timed && g.best) {
                const prev = stats.best[S.topic] || 0, isBest = g.score > prev;
                if (isBest) { stats = { s: stats.s, best: { ...stats.best, [S.topic]: g.score } }; saveStats(); }
                line += `。${TOPIC_BY_ID[S.topic].name}最佳紀錄 ${Math.max(prev, g.score)} 分` + (isBest ? '（新紀錄！）' : '');
            }
            $('#rTitle').textContent = g.timed ? '時間到' : '練習結束'; $('#rScore').textContent = g.timed ? g.score + ' 分' : `${g.right} / ${g.total}`; $('#rLine').textContent = line;
            $('#rWrong').replaceChildren(...(g.wrong.length ? [Object.assign(document.createElement('div'), { className: 'lab', textContent: '答錯的題目' }), ...g.wrong.map(it => Object.assign(document.createElement('div'), { className: 'wl', textContent: `${it.q}　→　${it.a.map(label).join(' / ')}　${it.exp}` }))] : []));
            show3('result');
        }
        $('#again').onclick = () => lastSetup && start(lastSetup.pool, lastSetup.mode, lastSetup.isMain);
        $('#toSetup').onclick = () => show3('setup');

        renderSetup(); show3('setup');
    </script>
</body>

</html>
