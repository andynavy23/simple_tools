<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/artale/maple-leaf.png" />
    <meta property="og:title" content="Artale - 五子棋小遊戲" />
    <meta property="og:description" content="aespaaa 公會製作, 參照楓之谷五子棋" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/gobang.html" />
    <title>Artale - 五子棋小遊戲</title>
    <script src="../shared/js/util.js"></script>
    <script src="../shared/js/p2p-room.js"></script>
    <link rel="stylesheet" href="../shared/css/maple.css">
<style>
        :root {
    --ms-page-bg: #332211;
    --ms-dot: #443322;
    --ms-max-w: 600px;
    --ms-log-h: 80px;
    --ms-content-bg: #f4dcb1;
    /* Wooden background */
            --ms-wz-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    --board-size: 15;
    --cell-size: clamp(20px, 6vw, 32px);
}

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: #8b4513; /* Darker wood border */
            border: 4px solid #5d4037;
            border-radius: 4px;
            box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.5), 2px 2px 5px rgba(0,0,0,0.3);
        }

        #gobang-board {
            display: grid;
            grid-template-columns: repeat(var(--board-size), var(--cell-size));
            grid-template-rows: repeat(var(--board-size), var(--cell-size));
            background-color: #e3c497;
            background-image: 
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 10px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 10px);
            border: 2px solid #5d4037;
            position: relative;
            box-shadow: 2px 2px 0px rgba(255,255,255,0.2), inset 1px 1px 5px rgba(0,0,0,0.2);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Drawing lines on the board */
        .cell::before,
        .cell::after {
            content: "";
            position: absolute;
            background-color: #5d4037;
            z-index: 1;
        }

        /* Horizontal line */
        .cell::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            transform: translateY(-50%);
        }

        /* Vertical line */
        .cell::after {
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
        }

        .piece {
            position: absolute;
            width: calc(var(--cell-size) * 0.85);
            height: calc(var(--cell-size) * 0.85);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: calc(var(--cell-size) * 0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .piece.black {
            background: radial-gradient(circle at 30% 30%, #444 0%, #111 70%, #000 100%);
            color: #ccc;
            border: 1px solid #000;
        }

        .piece.white {
            background: radial-gradient(circle at 30% 30%, #fff 0%, #eee 70%, #bbb 100%);
            color: #666;
            border: 1px solid #ccc;
        }

        /* Last move indicator */
        .piece.last-move::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ff3300;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #ff3300;
            z-index: 3;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        .status-panel {
            margin-top: 10px;
            font-weight: bold;
            color: #443322;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            padding: 5px;
            background: #fff;
            border: 2px solid #bbb;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .score-val {
            color: var(--ms-dark-blue);
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <b id="load-msg" style="color: var(--ms-dark-blue)">系統連線中...</b>
        </div>

        <div class="header">
            <span class="title">MapleStory Gobang - 楓之谷五子棋</span>
            <span class="guild">aespaaa 公會製作</span>
        </div>

        <div class="content">
            <div class="panel">
                <div class="nickname-box" id="nick-box">
                    <input type="text" id="nick-input" maxlength="10" placeholder="輸入暱稱 (中英數)...">
                    <div class="action-group">
                        <button class="ms-btn" onclick="saveNick()" id="btn-save-nick">確定暱稱</button>
                        <button class="ms-btn hidden" onclick="editNick()" id="btn-edit-nick">修改暱稱</button>
                        <button class="ms-btn hidden" onclick="copyInvite()" id="btn-copy">邀請連結</button>
                        <button class="ms-btn hidden" onclick="leaveRoom()" id="btn-leave"
                            style="background: #ffcccc;">離開</button>
                    </div>
                </div>

                <div id="conn-panel" class="hidden">
                    <div id="init-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="ms-btn primary" id="btn-host" onclick="startHost()"
                            style="flex: 1;">建立房間</button>
                        <button class="ms-btn" onclick="startLocalMode()" 
                            style="flex: 1; background: linear-gradient(to bottom, #aadd77 0%, #669933 100%); color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.5);">單機雙人</button>
                        <div style="display: flex; gap: 4px; width: 100%;">
                            <input type="text" id="join-id" placeholder="貼上房號..." style="flex: 1; min-width: 0; padding: 6px;">
                            <button class="ms-btn" id="btn-join" onclick="startJoin()">加入</button>
                        </div>
                    </div>
                </div>

                <div class="participant-list" id="participant-list"></div>

                <div class="scoreboard" id="scoreboard">
                    <div>房主贏: <span class="score-val" id="score-host">0</span></div>
                    <div>訪客贏: <span class="score-val" id="score-guest">0</span></div>
                </div>

                <div class="log-section">
                    <div class="log-header" onclick="toggleLog()">
                        <span>系統日誌</span>
                        <button class="ms-btn" id="btn-log-toggle">顯示</button>
                    </div>
                    <div class="log-panel" id="log-panel">
                        <div class="log-entry">> 請先設定您的暱稱後開始。</div>
                    </div>
                </div>
            </div>

            <div class="game-area">
                <div id="gobang-board"></div>
                <div class="status-panel" id="status-panel">等待玩家連線...</div>
            </div>

            <div class="footer-tools">
                <button class="ms-btn" id="btn-reset-game" style="flex: 1; border-color: #e57373; display: none;"
                    onclick="resetGame()">重開一局</button>
                <button class="ms-btn" id="btn-reconnect" onclick="location.reload()">重新整理</button>
            </div>
        </div>
    </div>

    <script>
        // === 狀態變數 ===
        let room = null; // P2PRoom（房主或成員）
        let myNick = "";
        let isHost = false;
        let p2pId = "";
        let opponentNick = "房主";
        let gameActive = false;
        let turn = "black"; // black starts first
        let myColor = ""; // "black" (host) or "white" (guest)
        let board = Array(15).fill().map(() => Array(15).fill(null));
        let scores = { host: 0, guest: 0 };
        let nextStarter = "black"; // Host is Black and starts first by default
        let isLocalMode = false;
        let lastMovePos = null;

        const els = {
            load: document.getElementById('loading'),
            loadMsg: document.getElementById('load-msg'),
            log: document.getElementById('log-panel'),
            logBtn: document.getElementById('btn-log-toggle'),
            nickInput: document.getElementById('nick-input'),
            btnSaveNick: document.getElementById('btn-save-nick'),
            btnEditNick: document.getElementById('btn-edit-nick'),
            btnCopy: document.getElementById('btn-copy'),
            btnLeave: document.getElementById('btn-leave'),
            connPanel: document.getElementById('conn-panel'),
            board: document.getElementById('gobang-board'),
            status: document.getElementById('status-panel'),
            pList: document.getElementById('participant-list'),
            joinInput: document.getElementById('join-id'),
            btnReset: document.getElementById('btn-reset-game'),
            sHost: document.getElementById('score-host'),
            sGuest: document.getElementById('score-guest')
        };

        // === 工具函式 ===
        const log = (msg, type = "info") => {
            const entry = document.createElement("div");
            entry.className = `log-entry`;
            entry.style.color = type === "error" ? "#ff4444" : (type === "success" ? "#00ff00" : "#00ccff");
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            els.log.prepend(entry);
        };

        const toggleLog = () => {
            const isHidden = els.log.style.display !== 'flex';
            els.log.style.display = isHidden ? 'flex' : 'none';
            els.logBtn.innerText = isHidden ? '隱藏' : '顯示';
        };

        const setLoading = (show, msg = "處理中...") => {
            els.load.style.display = show ? 'flex' : 'none';
            els.loadMsg.innerText = msg;
        };

        // === 渲染棋盤 ===
        function createBoard() {
            els.board.innerHTML = "";
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => handleCellClick(r, c);
                    els.board.appendChild(cell);
                }
            }
        }

        // === 邏輯函式 ===
        function saveNick() {
            let val = els.nickInput.value.trim();
            if (val === "") {
                val = "冒險者" + Math.floor(1000 + Math.random() * 9000);
            }
            if (!P2PRoom.validNick(val)) {
                return alert("請輸入 1-10 位有效的暱稱。");
            }
            myNick = val;
            els.nickInput.value = myNick; // Update UI if random was generated
            els.nickInput.disabled = true;
            els.btnSaveNick.classList.add("hidden");
            els.btnEditNick.classList.remove("hidden");
            els.connPanel.classList.remove("hidden");
            log(`暱稱已設定: ${myNick}`, "success");

            // Check for hash in URL to populate but NOT auto-join
            els.joinInput.value = P2PRoom.roomFromUrl();
        }

        function editNick() {
            location.reload();
        }

        function onNetError(e, message) {
            setLoading(false);
            log(message, "error");
            alert(message);
        }

        function startHost() {
            setLoading(true, "建立房間中...");
            room = P2PRoom.host({
                nick: myNick,
                maxPlayers: 2,
                onReady(r) {
                    p2pId = r.id;
                    isHost = true;
                    myColor = "black";
                    setLoading(false);
                    els.connPanel.classList.add("hidden");
                    els.btnCopy.classList.remove("hidden");
                    els.btnLeave.classList.remove("hidden");
                    window.location.hash = r.id;
                    log(`房號: ${r.id.substring(0, 4)}`, "success");
                    els.status.innerText = "等待玩家加入...";
                    renderNicknameTags();
                },
                onJoin(p) {
                    log(`玩家 ${p.nick} 加入了遊戲`, "success");
                    isLocalMode = false;
                    resetTotalState(); // 新玩家加入：全部重來
                    gameActive = true;
                    els.status.innerText = "遊戲開始！黑子先行";
                    room.sendTo(p.index, { type: 'START', hostNick: myNick });
                    renderNicknameTags(p.nick);
                    els.btnReset.style.display = "inline-flex";
                },
                onLeave() { onOpponentLeft(); },
                onMessage(player, data) { handleData(data); },
                onError: onNetError,
            });
        }

        function startJoin() {
            const id = els.joinInput.value.trim();
            if (!id) return alert("請輸入房號");
            setLoading(true, "連接中...");
            room = P2PRoom.join(id, {
                nick: myNick,
                onJoined() {
                    setLoading(false);
                    log("連線成功！", "success");
                    myColor = "white";
                    els.connPanel.classList.add("hidden");
                    els.btnLeave.classList.remove("hidden");
                },
                onRoster(players) { opponentNick = players[0].nick; },
                onMessage: handleData,
                onRejected(reason) { setLoading(false); alert(reason); location.reload(); },
                onClose() { room = null; onOpponentLeft(); },
                onError: onNetError,
            });
        }

        function onOpponentLeft() {
            log("對方已離線", "error");
            gameActive = false;
            els.status.innerText = "對方已離開";
            resetTotalState();
            renderNicknameTags();
        }

        // 房主 → 成員，或成員 → 房主
        const sendPeer = (msg) => { if (room) { if (isHost) room.broadcast(msg); else room.send(msg); } };

        function startLocalMode() {
            isLocalMode = true;
            myNick = "在地玩家";
            els.nickInput.value = myNick;
            els.nickInput.disabled = true;
            els.btnSaveNick.classList.add("hidden");
            els.btnEditNick.classList.remove("hidden");
            els.connPanel.classList.add("hidden");
            els.btnLeave.classList.remove("hidden");
            els.btnReset.style.display = "inline-flex";

            resetTotalState();
            gameActive = true;
            myColor = "black"; // Not strictly used in local, but for compatibility
            renderNicknameTags("玩家二");
            els.status.innerText = "單機模式：黑子先行";
            log("進入單機雙人模式", "success");
        }

        function resetTotalState() {
            scores = { host: 0, guest: 0 };
            nextStarter = "black";
            turn = "black";
            lastMovePos = null;
            board = Array(15).fill().map(() => Array(15).fill(null));
            createBoard();
            updateScoreUI();
        }

        function handleData(data) {
            // START / RESET / SCORE_SYNC 只有房主能發；房主端收到一律忽略
            if (isHost && ['START', 'RESET', 'SCORE_SYNC'].includes(data.type)) return;
            if (data.type === 'START') {
                isLocalMode = false;
                gameActive = true;
                els.status.innerText = `遊戲開始！房主 (${data.hostNick}) 黑子先行`;
                renderNicknameTags(data.hostNick);
            } else if (data.type === 'MOVE') {
                const { r, c, color } = data;
                const ok = gameActive && Number.isInteger(r) && Number.isInteger(c) && r >= 0 && r < 15 && c >= 0 && c < 15
                    && !board[r][c] && color === turn && color !== myColor;
                if (!ok) return log("忽略非法落子", "error");
                placePiece(data.r, data.c, data.color);
                turn = data.color === "black" ? "white" : "black";
                checkWin(data.r, data.c, data.color);
                updateStatus();
            } else if (data.type === 'RESET') {
                scores = data.scores;
                nextStarter = data.nextStarter;
                resetLocal();
                log("對方重啟了遊戲", "info");
            } else if (data.type === 'SCORE_SYNC') {
                scores = data.scores;
                nextStarter = data.nextStarter;
                updateScoreUI();
            }
        }

        function renderNicknameTags(otherNick = "") {
            els.pList.innerHTML = "";
            const me = document.createElement("span");
            me.className = `participant-tag ${isHost || isLocalMode ? 'host' : ''}`;
            const label = isLocalMode ? "玩家一 (黑)" : `👑 ${myNick} (${myColor === 'black' ? '黑' : '白'})`;
            me.innerText = label;
            els.pList.appendChild(me);

            if (otherNick || (room && !isHost) || isLocalMode) {
                const targetNick = isLocalMode ? "玩家二 (白)" : (otherNick || opponentNick);
                const other = document.createElement("span");
                other.className = `participant-tag ${(!isHost && !isLocalMode) ? 'host' : ''}`;
                other.innerText = isLocalMode ? targetNick : `👤 ${targetNick} (${myColor === 'black' ? '白' : '黑'})`;
                els.pList.appendChild(other);
            }
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c]) return;
            if (!isLocalMode && turn !== myColor) return;

            const currentColor = turn;

            // 黑棋禁手：3-3 / 4-4 / 長連
            if (currentColor === "black" && isForbidden(r, c)) {
                log("禁手！不能下在這裡 (3-3 / 4-4 / 長連)", "error");
                return;
            }

            placePiece(r, c, currentColor);
            
            if (!isLocalMode) sendPeer({ type: 'MOVE', r, c, color: currentColor });
            
            turn = (currentColor === "black") ? "white" : "black";
            
            if (!checkWin(r, c, currentColor)) updateStatus();
        }

        function placePiece(r, c, color) {
            // Remove previous last-move highlight
            if (lastMovePos) {
                const prevCell = document.querySelector(`.cell[data-r="${lastMovePos.r}"][data-c="${lastMovePos.c}"] .piece`);
                if (prevCell) prevCell.classList.remove("last-move");
            }

            board[r][c] = color;
            lastMovePos = { r, c };
            
            const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            const piece = document.createElement("div");
            piece.className = `piece ${color} last-move`;
            piece.innerText = color === "black" ? "●" : "○";
            cell.appendChild(piece);
        }

        function updateScoreUI() {
            els.sHost.innerText = scores.host;
            els.sGuest.innerText = scores.guest;
        }

        function updateStatus() {
            if (!gameActive) return;
            const currentTurnNick = isLocalMode ? "輪到" : (turn === myColor) ? "您的回合" : "對方的回合";
            els.status.innerText = `${currentTurnNick} (${turn === 'black' ? '黑子' : '白子'})`;
        }

        function checkWin(r, c, color) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                // Positive direction
                for (let i = 1; i < 5; i++) {
                    let nr = r + dr * i, nc = c + dc * i;
                    if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === color) count++;
                    else break;
                }
                // Negative direction
                for (let i = 1; i < 5; i++) {
                    let nr = r - dr * i, nc = c - dc * i;
                    if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === color) count++;
                    else break;
                }

                if (count >= 5) {
                    gameActive = false;
                    els.status.innerHTML = `<span style="color:red; font-size:20px;">${color === 'black' ? '黑子' : '白子'} 勝利！</span>`;
                    log(`${color === 'black' ? '黑子' : '白子'} 獲勝！`, "success");

                    // Update scores
                    if (isLocalMode || isHost) {
                        if (color === "black") scores.host++; else scores.guest++;
                        nextStarter = (color === "black") ? "white" : "black";
                        updateScoreUI();
                        // Sync scores to guest if online
                        if (!isLocalMode) sendPeer({ type: 'SCORE_SYNC', scores, nextStarter });
                    }
                    return true;
                }
            }
            // 和局：棋盤下滿且無人五連（雙方各自偵測，不需同步）
            if (board.every(row => row.every(Boolean))) {
                gameActive = false;
                els.status.innerHTML = `<span style="font-size:20px;">和局</span>`;
                log("棋盤已滿，和局。", "info");
                return true;
            }
            return false;
        }

        function isForbidden(r, c) {
            // Simplified check: MS Gobang rules 3-3, 4-4, Long-link are restricted for Black.
            // Temporarily place the piece to check
            board[r][c] = "black";

            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            let threeCount = 0;
            let fourCount = 0;
            let overLine = false;
            let exactFive = false;

            for (let [dr, dc] of directions) {
                const lineInfo = getLineInfo(r, c, dr, dc, "black");

                // Long-link check (Overline: > 5)
                if (lineInfo.count > 5) overLine = true;
                if (lineInfo.count === 5) exactFive = true;

                // Four check (4 in a row)
                // 兩端都被堵死的四不算四；跳四 (XX_XX) 目前未計入
                if (lineInfo.count === 4 && (lineInfo.leftOpen || lineInfo.rightOpen)) fourCount++;

                // Three check (Live Three)
                if (lineInfo.count === 3 && lineInfo.isLive) threeCount++;
            }

            board[r][c] = null; // Revert

            if (exactFive) return false; // 剛好五連即獲勝，優先於禁手
            if (overLine) return true; // Long link is forbidden for black
            if (threeCount >= 2) return true; // 3-3 is forbidden
            if (fourCount >= 2) return true; // 4-4 is forbidden

            return false;
        }

        function getLineInfo(r, c, dr, dc, color) {
            let count = 1;
            let leftOpen = false;
            let rightOpen = false;

            // Check right
            let i = 1;
            while (true) {
                let nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= 15 || nc < 0 || nc >= 15) break;
                if (board[nr][nc] === color) count++;
                else {
                    if (board[nr][nc] === null) rightOpen = true;
                    break;
                }
                i++;
            }

            // Check left
            i = 1;
            while (true) {
                let nr = r - dr * i, nc = c - dc * i;
                if (nr < 0 || nr >= 15 || nc < 0 || nc >= 15) break;
                if (board[nr][nc] === color) count++;
                else {
                    if (board[nr][nc] === null) leftOpen = true;
                    break;
                }
                i++;
            }

            // A "Live Three" needs both ends open AND the ability to become a "Live Four"
            // To simplify, we'll check if it has space to become 5.
            let isLive = leftOpen && rightOpen;

            return { count, isLive, leftOpen, rightOpen };
        }

        function resetGame() {
            if (!isHost && !isLocalMode) return;
            resetLocal();
            if (!isLocalMode) sendPeer({ type: 'RESET', scores, nextStarter });
        }

        function resetLocal() {
            board = Array(15).fill().map(() => Array(15).fill(null));
            lastMovePos = null;
            createBoard();
            gameActive = true;
            turn = nextStarter; // Loser starts first
            updateStatus();
            updateScoreUI();
            log(`遊戲已重置。本局由 ${turn === 'black' ? '黑子' : '白子'} 先手。`, "info");
        }

        function copyInvite() {
            const url = P2PRoom.inviteLink(p2pId);
            Util.copyText(url).then(ok => ok ? alert("邀請連結已複製！") : prompt("請手動複製邀請連結：", url));
        }

        function leaveRoom() {
            location.reload();
        }

        createBoard();
    </script>
</body>

</html>
