    <template id="help">
        <h3>這是什麼</h3>
        <p>楓之谷風格五子棋，15×15 棋盤，黑子先手，先連成五顆（橫、直、斜）就贏，棋盤下滿是和局。黑棋有禁手：三三、四四、長連（超過五顆）不能下；白棋沒有限制。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>自己玩：「單機對電腦」，進頁面就能按，不必先設定暱稱。</li>
        <li>兩人共用一支手機輪流：「單機雙人」。</li>
        <li>和朋友用房號連線。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li><b>單機</b>：選難度（簡單 / 普通 / 困難）與執黑（先手）或執白，按「單機對電腦」。電腦會顯示「思考中」才下。</li>
        <li><b>手機落子</b>：點一下棋盤只是選位置，出現半透明預覽；確認沒點錯，按下方「確認落子」（或再點同一格）才真的下。點別格可改選。電腦版一點就下。</li>
        <li>「提示」會在棋盤上用紅圈標出建議位置；「悔棋」回到你上一次下子之前（對電腦時連電腦的回應一起收回）。</li>
        <li>有人連五後按「再來一局」，上一局輸的一方先手；比數會累計，「重新整理」可回到選單。</li>
        <li><b>連線</b>：輸入暱稱按「確定暱稱」，再按「建立房間」，用「邀請連結」傳給朋友；朋友開連結、設好暱稱後按「加入」。房主執黑先手，訪客執白，限兩人。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">黑棋在同一橫列連下 3、4、5、6、7 欄，五顆連成一線就贏，比數「黑子」加一分。</div>
        <h3>小提醒</h3>
        <ul>
        <li>禁手點下去會提示「禁手」而且不會落子；剛好連成五顆時優先算贏。</li>
        <li>悔棋與提示只在單機模式出現，連線對戰沒有。</li>
        <li>連線資料只在雙方瀏覽器之間傳送，房主離開就結束。</li>
        </ul>

    <script>
        // --- pure ---
        // 電腦對手（五子棋）：以棋型評分挑落點。board[r][c] 為 'black' / 'white' / null，15×15
        const GN = 15, GDIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
        const GINB = (r, c) => r >= 0 && r < GN && c >= 0 && c < GN;
        const GOPP = (color) => (color === 'black' ? 'white' : 'black');

        // 假設 color 下在 (r,c)，四個方向各自的連線棋型分數加總（連子數 + 兩端開放程度）
        function lineScore(board, r, c, color) {
            let total = 0;
            for (const [dr, dc] of GDIRS) {
                let n = 1, open = 0;
                for (const sg of [1, -1]) {
                    let k = 1;
                    while (GINB(r + dr * k * sg, c + dc * k * sg) && board[r + dr * k * sg][c + dc * k * sg] === color) { n++; k++; }
                    if (GINB(r + dr * k * sg, c + dc * k * sg) && board[r + dr * k * sg][c + dc * k * sg] === null) open++;
                }
                if (n >= 5) total += 100000;
                else if (n === 4) total += open === 2 ? 10000 : open === 1 ? 1000 : 0;
                else if (n === 3) total += open === 2 ? 1000 : open === 1 ? 100 : 0;
                else if (n === 2) total += open === 2 ? 100 : open === 1 ? 10 : 0;
                else total += open;
            }
            return total;
        }
        // 候選點：已有棋子周圍 2 格內的空位；空盤只回傳中心
        function candidates(board) {
            const out = []; let any = false;
            for (let r = 0; r < GN; r++) for (let c = 0; c < GN; c++) {
                if (board[r][c]) { any = true; continue; }
                let near = false;
                for (let dr = -2; dr <= 2 && !near; dr++) for (let dc = -2; dc <= 2; dc++) if (GINB(r + dr, c + dc) && board[r + dr][c + dc]) { near = true; break; }
                if (near) out.push([r, c]);
            }
            return any ? out : [[7, 7]];
        }
        // 單點分數 = 自己下的價值 + 擋對手的價值（略低一點，讓自己能贏時優先贏）；越靠近中心略加分
        const cellValue = (board, r, c, me) => lineScore(board, r, c, me) + 0.9 * lineScore(board, r, c, GOPP(me)) - (Math.abs(r - 7) + Math.abs(c - 7)) * 0.1;

        // level: easy / normal / hard。回傳 [r, c]；棋盤滿了回傳 null。forbid(r,c) 為黑棋禁手判斷（電腦執黑時才需要）
        function cpuGomoku(board, me, level = 'normal', rand = Math.random, forbid = null) {
            let cand = candidates(board).filter(([r, c]) => !(forbid && me === 'black' && forbid(r, c)));
            if (!cand.length) return null;
            const scored = cand.map(([r, c]) => ({ r, c, v: cellValue(board, r, c, me) })).sort((a, b) => b.v - a.v);
            const top = scored[0];
            if (top.v >= 100000 || (scored.some(s => lineScore(board, s.r, s.c, GOPP(me)) >= 100000))) return [top.r, top.c];     // 能贏就贏、對手下一手能贏就擋（任何難度）
            if (level === 'easy' && rand() < 0.35) { const s = scored[Math.floor(rand() * Math.min(scored.length, 12))]; return [s.r, s.c]; }
            if (level !== 'hard') { const best = scored.filter(s => s.v >= top.v - 0.5); const s = best[Math.floor(rand() * best.length)]; return [s.r, s.c]; }
            // hard：對前 12 個候選做 4 層 alpha-beta 搜尋（我 → 對手 → 我 → 對手），葉節點用整盤棋型評分
            const SEARCH_W = 12, DEPTH = 4;
            const search = (turn, depth, alpha, beta) => {
                if (depth === 0) return boardScore(board, me);
                const cs = candidates(board).map(([r, c]) => ({ r, c, v: cellValue(board, r, c, turn) })).sort((a, b) => b.v - a.v).slice(0, SEARCH_W);
                let best = turn === me ? -Infinity : Infinity;
                for (const s of cs) {
                    board[s.r][s.c] = turn;
                    const v = gomokuWin(board, s.r, s.c, turn) ? (turn === me ? 1e7 : -1e7) * (depth + 1) : search(GOPP(turn), depth - 1, alpha, beta);
                    board[s.r][s.c] = null;
                    if (turn === me) { if (v > best) best = v; if (best > alpha) alpha = best; } else { if (v < best) best = v; if (best < beta) beta = best; }
                    if (alpha >= beta) break;
                }
                return best === Infinity || best === -Infinity ? 0 : best;
            };
            let best = null;
            for (const s of scored.slice(0, SEARCH_W)) {
                board[s.r][s.c] = me;
                const v = search(GOPP(me), DEPTH - 1, -Infinity, Infinity) + s.v * 0.01;
                board[s.r][s.c] = null;
                if (!best || v > best.v) best = { r: s.r, c: s.c, v };
            }
            return [best.r, best.c];
        }
        // 整盤評分：掃過每一個長度 5 的視窗；只含單一顏色才有分，子數越多越高。我方 − 1.1 × 對手（略偏防守）
        function boardScore(board, me) {
            const W = [0, 1, 10, 100, 1000, 100000]; let mine = 0, theirs = 0;
            for (let r = 0; r < GN; r++) for (let c = 0; c < GN; c++) for (const [dr, dc] of GDIRS) {
                const er = r + dr * 4, ec = c + dc * 4; if (!GINB(er, ec)) continue;
                let a = 0, b = 0;
                for (let k = 0; k < 5; k++) { const v = board[r + dr * k][c + dc * k]; if (v === me) a++; else if (v) b++; }
                if (a && !b) mine += W[a]; else if (b && !a) theirs += W[b];
            }
            return mine - 1.1 * theirs;
        }
        const gomokuWin = (board, r, c, color) => GDIRS.some(([dr, dc]) => { let n = 1; for (const sg of [1, -1]) for (let k = 1; k < 5; k++) { const rr = r + dr * k * sg, cc = c + dc * k * sg; if (!GINB(rr, cc) || board[rr][cc] !== color) break; n++; } return n >= 5; });
        // ---------- 悔棋與提示（歷史快照由頁面保存，不會被連線同步） ----------
        const snap = (s) => JSON.parse(JSON.stringify(s));
        // 悔棋：color 為空退一步；為 'black' / 'white' 則退到「輪到該色下」的那個時間點（對電腦時回到自己的回合）。快照的 .turn 是當時要下的顏色。回傳要還原的快照，沒得退回傳 null
        function undoTo(hist, color) {
            const i = color ? hist.map(s => s.turn).lastIndexOf(color) : hist.length - 1;
            if (i < 0) return null;
            const s = hist[i]; hist.length = i;
            return s;
        }
        // 提示：color 這一手的建議 [r, c]（用普通級電腦）
        const hintGomoku = (board, color, forbid = null) => cpuGomoku(board, color, 'normal', Math.random, forbid);
        // --- /pure ---

        // === 狀態變數 ===
        let room = null; // P2PRoom（房主或成員）
        let myNick = "";
        let isHost = false;
        let p2pId = "";
        let opponentNick = "房主";
        let gameActive = false;
        let turn = "black"; // black starts first
        let myColor = ""; // "black" (host) or "white" (guest)
        let board = Array(15).fill().map(() => Array(15).fill(null));
        let scores = { host: 0, guest: 0 };
        let nextStarter = "black"; // Host is Black and starts first by default
        let isLocalMode = false;
        let cpuMode = false, cpuLevel = 'normal', cpuTimer = 0, cpuColor = 'white'; // 對電腦：玩家 / 電腦各執一色（黑棋有禁手限制）
        let lastMovePos = null, pending = null, H = []; // pending：手機上先點選、再按「確認落子」；H：悔棋快照

        const els = {
            load: document.getElementById('loading'),
            loadMsg: document.getElementById('load-msg'),
            log: document.getElementById('log-panel'),
            logBtn: document.getElementById('btn-log-toggle'),
            nickInput: document.getElementById('nick-input'),
            btnSaveNick: document.getElementById('btn-save-nick'),
            btnEditNick: document.getElementById('btn-edit-nick'),
            btnCopy: document.getElementById('btn-copy'),
            btnLeave: document.getElementById('btn-leave'),
            connPanel: document.getElementById('conn-panel'),
            board: document.getElementById('gobang-board'),
            status: document.getElementById('status-panel'),
            pList: document.getElementById('participant-list'),
            joinInput: document.getElementById('join-id'),
            btnReset: document.getElementById('btn-reset-game'),
            soloPanel: document.getElementById('solo-panel'),
            netSec: document.getElementById('net-sec'),
            confirm: document.getElementById('btn-confirm'),
            btnUndo: document.getElementById('btn-undo'),
            btnHint: document.getElementById('btn-hint'),
            sHost: document.getElementById('score-host'),
            sGuest: document.getElementById('score-guest')
        };

        // === 工具函式 ===
        const log = (msg, type = "info") => {
            const entry = document.createElement("div");
            entry.className = `log-entry`;
            entry.style.color = type === "error" ? "#ff4444" : (type === "success" ? "#00ff00" : "#00ccff");
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            els.log.prepend(entry);
        };

        const toggleLog = () => {
            const isHidden = els.log.style.display !== 'flex';
            els.log.style.display = isHidden ? 'flex' : 'none';
            els.logBtn.innerText = isHidden ? '隱藏' : '顯示';
        };

        const setLoading = (show, msg = "處理中...") => {
            els.load.style.display = show ? 'flex' : 'none';
            els.loadMsg.innerText = msg;
        };

        // === 渲染棋盤 ===
        function createBoard() {
            els.board.innerHTML = "";
            pending = null; els.confirm.classList.add("hidden");
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => handleCellClick(r, c);
                    els.board.appendChild(cell);
                }
            }
        }

        // === 邏輯函式 ===
        function saveNick() {
            let val = els.nickInput.value.trim();
            if (val === "") {
                val = "冒險者" + Math.floor(1000 + Math.random() * 9000);
            }
            if (!P2PRoom.validNick(val)) {
                return alert("請輸入 1-10 位有效的暱稱。");
            }
            myNick = val;
            els.nickInput.value = myNick; // Update UI if random was generated
            els.nickInput.disabled = true;
            els.btnSaveNick.classList.add("hidden");
            els.btnEditNick.classList.remove("hidden");
            els.connPanel.classList.remove("hidden");
            log(`暱稱已設定: ${myNick}`, "success");

            // Check for hash in URL to populate but NOT auto-join
            els.joinInput.value = P2PRoom.roomFromUrl();
        }

        function editNick() {
            location.reload();
        }

        function onNetError(e, message) {
            setLoading(false);
            log(message, "error");
            alert(message);
        }

        function startHost() {
            setLoading(true, "建立房間中...");
            room = P2PRoom.host({
                nick: myNick,
                maxPlayers: 2,
                onReady(r) {
                    p2pId = r.id;
                    isHost = true;
                    myColor = "black";
                    setLoading(false);
                    els.connPanel.classList.add("hidden");
                    hideSolo();
                    els.btnCopy.classList.remove("hidden");
                    els.btnLeave.classList.remove("hidden");
                    window.location.hash = r.id;
                    log(`房號: ${r.id.substring(0, 4)}`, "success");
                    els.status.innerText = "等待玩家加入...";
                    renderNicknameTags();
                },
                onJoin(p) {
                    log(`玩家 ${p.nick} 加入了遊戲`, "success");
                    isLocalMode = false;
                    resetTotalState(); // 新玩家加入：全部重來
                    gameActive = true;
                    els.status.innerText = "遊戲開始！黑子先行";
                    room.sendTo(p.index, { type: 'START', hostNick: myNick });
                    renderNicknameTags(p.nick);
                    els.btnReset.style.display = "inline-flex";
                },
                onLeave() { onOpponentLeft(); },
                onMessage(player, data) { handleData(data); },
                onError: onNetError,
            });
        }

        function startJoin() {
            const id = els.joinInput.value.trim();
            if (!id) return alert("請輸入房號");
            setLoading(true, "連接中...");
            room = P2PRoom.join(id, {
                nick: myNick,
                onJoined() {
                    setLoading(false);
                    log("連線成功！", "success");
                    myColor = "white";
                    els.connPanel.classList.add("hidden");
                    hideSolo();
                    els.btnLeave.classList.remove("hidden");
                },
                onRoster(players) { opponentNick = players[0].nick; },
                onMessage: handleData,
                onRejected(reason) { setLoading(false); alert(reason); location.reload(); },
                onClose() { room = null; onOpponentLeft(); },
                onError: onNetError,
            });
        }

        function onOpponentLeft() {
            log("對方已離線", "error");
            gameActive = false;
            els.status.innerText = "對方已離開";
            resetTotalState();
            renderNicknameTags();
        }

        // 房主 → 成員，或成員 → 房主
        const sendPeer = (msg) => { if (room) { if (isHost) room.broadcast(msg); else room.send(msg); } };

        function hideSolo() { els.soloPanel.classList.add("hidden"); els.netSec.classList.add("hidden"); }

        function startLocalMode() {
            isLocalMode = true;
            hideSolo();
            els.btnUndo.classList.remove("hidden"); els.btnHint.classList.remove("hidden");
            myNick = "在地玩家";
            els.nickInput.value = myNick;
            els.nickInput.disabled = true;
            els.btnSaveNick.classList.add("hidden");
            els.btnEditNick.classList.remove("hidden");
            els.connPanel.classList.add("hidden");
            els.btnLeave.classList.remove("hidden");
            els.btnReset.style.display = "inline-flex";

            resetTotalState();
            gameActive = true;
            myColor = "black"; // Not strictly used in local, but for compatibility
            renderNicknameTags("玩家二");
            els.status.innerText = "單機模式：黑子先行";
            log("進入單機雙人模式", "success");
        }

        function startCpuMode() {
            cpuMode = true; cpuLevel = document.getElementById('cpu-level').value;
            cpuColor = document.getElementById('cpu-first').value === 'cpu' ? 'black' : 'white';
            startLocalMode();
            myNick = "你"; els.nickInput.value = myNick;
            renderNicknameTags("電腦");
            const cpuBlack = cpuColor === 'black';
            els.sHost.parentNode.firstChild.textContent = cpuBlack ? "電腦贏: " : "你贏: "; els.sGuest.parentNode.firstChild.textContent = cpuBlack ? "你贏: " : "電腦贏: ";
            els.status.innerText = cpuBlack ? "對電腦：電腦執黑子先行" : "對電腦：你執黑子先行";
            scheduleCpu();
            log(`進入對電腦模式（${{ easy: '簡單', normal: '普通', hard: '困難' }[cpuLevel]}）`, "success");
        }

        function scheduleCpu() {
            clearTimeout(cpuTimer);
            if (!cpuMode || !gameActive || turn !== cpuColor) return;
            els.status.innerText = "電腦思考中…";
            cpuTimer = setTimeout(() => {
                if (!cpuMode || !gameActive || turn !== cpuColor) return;
                const mv = cpuGomoku(board, cpuColor, cpuLevel, Math.random, cpuColor === 'black' ? isForbidden : null);
                if (!mv) return;
                saveHist();
                placePiece(mv[0], mv[1], cpuColor);
                turn = GOPP(cpuColor);
                if (!checkWin(mv[0], mv[1], cpuColor)) updateStatus();
            }, 600);
        }

        function resetTotalState() {
            scores = { host: 0, guest: 0 };
            nextStarter = "black";
            turn = "black";
            lastMovePos = null; H = [];
            board = Array(15).fill().map(() => Array(15).fill(null));
            createBoard();
            updateScoreUI();
        }

        function handleData(data) {
            // START / RESET / SCORE_SYNC 只有房主能發；房主端收到一律忽略
            if (isHost && ['START', 'RESET', 'SCORE_SYNC'].includes(data.type)) return;
            if (data.type === 'START') {
                isLocalMode = false;
                gameActive = true;
                els.status.innerText = `遊戲開始！房主 (${data.hostNick}) 黑子先行`;
                renderNicknameTags(data.hostNick);
            } else if (data.type === 'MOVE') {
                const { r, c, color } = data;
                const ok = gameActive && Number.isInteger(r) && Number.isInteger(c) && r >= 0 && r < 15 && c >= 0 && c < 15
                    && !board[r][c] && color === turn && color !== myColor;
                if (!ok) return log("忽略非法落子", "error");
                placePiece(data.r, data.c, data.color);
                turn = data.color === "black" ? "white" : "black";
                checkWin(data.r, data.c, data.color);
                updateStatus();
            } else if (data.type === 'RESET') {
                scores = data.scores;
                nextStarter = data.nextStarter;
                resetLocal();
                log("對方重啟了遊戲", "info");
            } else if (data.type === 'SCORE_SYNC') {
                scores = data.scores;
                nextStarter = data.nextStarter;
                updateScoreUI();
            }
        }

        function renderNicknameTags(otherNick = "") {
            els.pList.innerHTML = "";
            const me = document.createElement("span");
            me.className = `participant-tag ${isHost || isLocalMode ? 'host' : ''}`;
            const label = cpuMode ? `你 (${cpuColor === 'black' ? '白' : '黑'})` : isLocalMode ? "玩家一 (黑)" : `👑 ${myNick} (${myColor === 'black' ? '黑' : '白'})`;
            me.innerText = label;
            els.pList.appendChild(me);

            if (otherNick || (room && !isHost) || isLocalMode) {
                const targetNick = cpuMode ? `電腦 (${cpuColor === 'black' ? '黑' : '白'})` : isLocalMode ? "玩家二 (白)" : (otherNick || opponentNick);
                const other = document.createElement("span");
                other.className = `participant-tag ${(!isHost && !isLocalMode) ? 'host' : ''}`;
                other.innerText = isLocalMode ? targetNick : `👤 ${targetNick} (${myColor === 'black' ? '白' : '黑'})`;
                els.pList.appendChild(other);
            }
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c]) return;
            if (!isLocalMode && turn !== myColor) return;
            if (cpuMode && turn === cpuColor) return;     // 輪到電腦時不能下

            const currentColor = turn;

            // 黑棋禁手：3-3 / 4-4 / 長連
            if (currentColor === "black" && isForbidden(r, c)) {
                log("禁手！不能下在這裡 (3-3 / 4-4 / 長連)", "error");
                els.status.innerText = "禁手！不能下在這裡 (3-3 / 4-4 / 長連)";
                return;
            }

            // 觸控裝置：第一下只是選位置（出現半透明預覽），再點同一格或按「確認落子」才真的下，避免手指遮住 / 誤觸
            if (matchMedia('(pointer: coarse)').matches && !(pending && pending.r === r && pending.c === c)) { setPending(r, c, currentColor); return; }
            commitMove(r, c);
        }

        function setPending(r, c, color) {
            clearPending();
            pending = { r, c };
            const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            addPiece(cell, color).classList.add("ghost");
            els.confirm.classList.remove("hidden");
        }
        function clearPending() {
            pending = null;
            document.querySelectorAll(".piece.ghost").forEach(e => e.remove());
            els.confirm.classList.add("hidden");
        }
        function confirmPending() { if (pending) commitMove(pending.r, pending.c); }

        function commitMove(r, c) {
            const currentColor = turn;
            clearPending(); clearHint(); saveHist();
            placePiece(r, c, currentColor);
            
            if (!isLocalMode) sendPeer({ type: 'MOVE', r, c, color: currentColor });
            
            turn = (currentColor === "black") ? "white" : "black";
            
            if (!checkWin(r, c, currentColor)) { updateStatus(); scheduleCpu(); }
        }

        function placePiece(r, c, color) {
            // Remove previous last-move highlight
            if (lastMovePos) {
                const prevCell = document.querySelector(`.cell[data-r="${lastMovePos.r}"][data-c="${lastMovePos.c}"] .piece`);
                if (prevCell) prevCell.classList.remove("last-move");
            }

            board[r][c] = color;
            lastMovePos = { r, c };
            addPiece(document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`), color).classList.add("last-move");
        }

        function addPiece(cell, color) {
            const piece = document.createElement("div");
            piece.className = `piece ${color}`;
            piece.innerText = color === "black" ? "●" : "○";
            cell.appendChild(piece);
            return piece;
        }

        // === 單機：悔棋與提示 ===
        const saveHist = () => { if (isLocalMode) H.push(snap({ board, turn, last: lastMovePos, scores, nextStarter })); };
        const clearHint = () => document.querySelectorAll(".hintmark").forEach(e => e.remove());

        function undoMove() {
            if (!isLocalMode) return;
            clearTimeout(cpuTimer);
            const s = undoTo(H, cpuMode ? GOPP(cpuColor) : null);
            if (!s) return;
            board = s.board; turn = s.turn; scores = s.scores; nextStarter = s.nextStarter; lastMovePos = s.last;
            createBoard();
            for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) if (board[r][c]) addPiece(document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`), board[r][c]);
            if (lastMovePos) { const p = document.querySelector(`.cell[data-r="${lastMovePos.r}"][data-c="${lastMovePos.c}"] .piece`); if (p) p.classList.add("last-move"); }
            gameActive = true; els.btnReset.classList.remove("primary");
            updateScoreUI(); updateStatus(); scheduleCpu();
        }

        function showHint() {
            if (!isLocalMode || !gameActive || (cpuMode && turn === cpuColor)) return;
            clearHint();
            const mv = hintGomoku(board, turn, turn === "black" ? isForbidden : null);
            if (!mv) return;
            const m = document.createElement("div"); m.className = "hintmark";
            document.querySelector(`.cell[data-r="${mv[0]}"][data-c="${mv[1]}"]`).appendChild(m);
        }

        function updateScoreUI() {
            els.sHost.innerText = scores.host;
            els.sGuest.innerText = scores.guest;
        }

        function updateStatus() {
            if (!gameActive) return;
            const currentTurnNick = isLocalMode ? "輪到" : (turn === myColor) ? "您的回合" : "對方的回合";
            els.status.innerText = `${currentTurnNick} (${turn === 'black' ? '黑子' : '白子'})`;
        }

        function checkWin(r, c, color) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                // Positive direction
                for (let i = 1; i < 5; i++) {
                    let nr = r + dr * i, nc = c + dc * i;
                    if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === color) count++;
                    else break;
                }
                // Negative direction
                for (let i = 1; i < 5; i++) {
                    let nr = r - dr * i, nc = c - dc * i;
                    if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === color) count++;
                    else break;
                }

                if (count >= 5) {
                    gameActive = false; els.btnReset.classList.add("primary");
                    els.status.innerHTML = `<span style="color:#ffdd44; font-size:20px;">${color === 'black' ? '黑子' : '白子'} 勝利！</span>`;
                    log(`${color === 'black' ? '黑子' : '白子'} 獲勝！`, "success");

                    // Update scores
                    if (isLocalMode || isHost) {
                        if (color === "black") scores.host++; else scores.guest++;
                        nextStarter = (color === "black") ? "white" : "black";
                        updateScoreUI();
                        // Sync scores to guest if online
                        if (!isLocalMode) sendPeer({ type: 'SCORE_SYNC', scores, nextStarter });
                    }
                    return true;
                }
            }
            // 和局：棋盤下滿且無人五連（雙方各自偵測，不需同步）
            if (board.every(row => row.every(Boolean))) {
                gameActive = false;
                els.status.innerHTML = `<span style="font-size:20px;">和局</span>`;
                log("棋盤已滿，和局。", "info");
                return true;
            }
            return false;
        }

        function isForbidden(r, c) {
            // Simplified check: MS Gobang rules 3-3, 4-4, Long-link are restricted for Black.
            // Temporarily place the piece to check
            board[r][c] = "black";

            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            let threeCount = 0;
            let fourCount = 0;
            let overLine = false;
            let exactFive = false;

            for (let [dr, dc] of directions) {
                const lineInfo = getLineInfo(r, c, dr, dc, "black");

                // Long-link check (Overline: > 5)
                if (lineInfo.count > 5) overLine = true;
                if (lineInfo.count === 5) exactFive = true;

                // Four check (4 in a row)
                // 兩端都被堵死的四不算四；跳四 (XX_XX) 目前未計入
                if (lineInfo.count === 4 && (lineInfo.leftOpen || lineInfo.rightOpen)) fourCount++;

                // Three check (Live Three)
                if (lineInfo.count === 3 && lineInfo.isLive) threeCount++;
            }

            board[r][c] = null; // Revert

            if (exactFive) return false; // 剛好五連即獲勝，優先於禁手
            if (overLine) return true; // Long link is forbidden for black
            if (threeCount >= 2) return true; // 3-3 is forbidden
            if (fourCount >= 2) return true; // 4-4 is forbidden

            return false;
        }

        function getLineInfo(r, c, dr, dc, color) {
            let count = 1;
            let leftOpen = false;
            let rightOpen = false;

            // Check right
            let i = 1;
            while (true) {
                let nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= 15 || nc < 0 || nc >= 15) break;
                if (board[nr][nc] === color) count++;
                else {
                    if (board[nr][nc] === null) rightOpen = true;
                    break;
                }
                i++;
            }

            // Check left
            i = 1;
            while (true) {
                let nr = r - dr * i, nc = c - dc * i;
                if (nr < 0 || nr >= 15 || nc < 0 || nc >= 15) break;
                if (board[nr][nc] === color) count++;
                else {
                    if (board[nr][nc] === null) leftOpen = true;
                    break;
                }
                i++;
            }

            // A "Live Three" needs both ends open AND the ability to become a "Live Four"
            // To simplify, we'll check if it has space to become 5.
            let isLive = leftOpen && rightOpen;

            return { count, isLive, leftOpen, rightOpen };
        }

        function resetGame() {
            if (!isHost && !isLocalMode) return;
            resetLocal();
            if (!isLocalMode) sendPeer({ type: 'RESET', scores, nextStarter });
        }

        function resetLocal() {
            board = Array(15).fill().map(() => Array(15).fill(null));
            lastMovePos = null; H = [];
            createBoard(); els.btnReset.classList.remove("primary");
            gameActive = true;
            turn = nextStarter; // Loser starts first
            updateStatus();
            updateScoreUI();
            log(`遊戲已重置。本局由 ${turn === 'black' ? '黑子' : '白子'} 先手。`, "info");
            scheduleCpu();
        }

        function copyInvite() {
            const url = P2PRoom.inviteLink(p2pId);
            Util.copyText(url).then(ok => ok ? alert("邀請連結已複製！") : prompt("請手動複製邀請連結：", url));
        }

        function leaveRoom() {
            location.reload();
        }

        createBoard();
    </script>
</body>

</html>
