    <template id="help">
        <h3>這是什麼</h3>
        <p>給幼兒到小學低年級的小遊戲合集：找不同、點點連線、著色線稿、形狀拼貼、節奏拍手。按鈕大、答錯不扣分、全程離線、不蒐集任何個資。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>陪小朋友玩、等待時打發時間</li>
        <li>練觀察力、手眼協調、數字順序與節奏感</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li><b>找不同</b>：上下兩張圖有幾個地方不一樣，點任何一張圖上的格子找出來。卡住了按「提示」</li>
        <li><b>點點連線</b>：依 1、2、3… 的順序，用手指連續拖過去，或一個一個點。畫完會出現圖案。拖曳時頁面不會捲動，要捲動請按「捲動頁面」切換</li>
        <li><b>著色</b>：選一張線稿與顏色，點一個區域就上色，再點一次換色。「清除」重來，「存成圖片」下載 PNG</li>
        <li><b>拼貼</b>：按形狀把它放到畫布，手指拖曳移動；選到的形狀可旋轉、放大縮小、換色、刪除，最多 40 個。「存成圖片」下載 PNG</li>
        <li><b>節奏</b>：先聽（看）四拍預備，再跟著圓點到達的時間按下大圓鈕。越準分數越高，太早 / 太晚也有分</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">節奏第 1 級：預備 4 拍後，每拍按一下，共 8 下。按得準 3 分、有點偏 2 分、早或晚 1 分，滿分是 100。</div>
        <h3>小提醒</h3>
        <ul>
        <li>聲音預設關閉，按右上「聲音」開啟；節奏的拍子聲也要開聲音才聽得到</li>
        <li>節奏若覺得總是偏早或偏晚，按「校正」跟著 4 聲拍手，或用 ± 微調延遲</li>
        <li>「家長設定」要先答對一題簡單加法：可設定難度（找不同、節奏）、清除紀錄</li>
        <li>只存進度與最佳紀錄（找不同完成場數與最快時間、節奏最高分、點點連線完成圖案）；著色與拼貼作品<b>不會存在本機</b>，要留住請存成圖片</li>
        <li>紀錄固定只有幾個數字，不會越存越多；「清除紀錄」會清掉全部紀錄與延遲設定，無法復原，不會影響別的工具</li>
        <li>資料壞掉或被改過時會自動用預設值；儲存失敗時頁面會提示，遊戲仍可繼續玩</li>
        <li>有開「減少動態效果」時不會有彈跳動畫</li>
        </ul>

    <script>
        const { rnd, seeded, store, tone } = Util;

        // --- pure ---
        const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
        const PRAISE = ['太棒了！', '好厲害！', '你真聰明！', '做得好！', '好漂亮！'];

        // ===== 找不同：emoji 格子場景；b 是 a 的複本，只有 diffs 內的格子換成「不同」的 emoji =====
        const EM = ['🍎', '🍌', '🍇', '🍓', '🐱', '🐶', '🐸', '🐥', '🚗', '⚽', '🎈', '⭐', '🌻', '🐟', '🍀', '🎁'];
        const SPOT_LV = [{ c: 3, r: 4, n: 3 }, { c: 4, r: 4, n: 4 }, { c: 5, r: 5, n: 5 }];
        function spotScene(seed, lv) {
            const L = SPOT_LV[lv - 1] || SPOT_LV[0], rand = seeded(seed), n = L.c * L.r;
            const a = Array.from({ length: n }, () => EM[rand.int(EM.length)]);
            const idx = [...Array(n).keys()];
            for (let i = n - 1; i > 0; i--) { const j = rand.int(i + 1);[idx[i], idx[j]] = [idx[j], idx[i]]; }
            const diffs = idx.slice(0, L.n).sort((x, y) => x - y), b = [...a];
            for (const i of diffs) { const o = EM.filter(e => e !== a[i]); b[i] = o[rand.int(o.length)]; }
            return { cols: L.c, rows: L.r, a, b, diffs };
        }
        const spotHit = (diffs, found, i) => !diffs.includes(i) ? 'miss' : found.includes(i) ? 'again' : 'hit';
        const spotHint = (diffs, found) => { const i = diffs.find(d => !found.includes(d)); return i === undefined ? -1 : i; };

        // ===== 點點連線（座標 0..100）：點的感應半徑 DOT_TOL，點與點至少相距 2×DOT_TOL 才不會誤觸 =====
        const DOT_TOL = 6, DOT_GAP = 12;
        const pol = (cx, cy, r, deg) => [+(cx + r * Math.cos(deg * Math.PI / 180)).toFixed(1), +(cy + r * Math.sin(deg * Math.PI / 180)).toFixed(1)];
        const ring = (cx, cy, r, n, a0 = -90) => Array.from({ length: n }, (_, i) => pol(cx, cy, r, a0 + 360 * i / n));
        const starPts = (cx, cy, R, r, k = 5) => Array.from({ length: k * 2 }, (_, i) => pol(cx, cy, i % 2 ? r : R, -90 + 180 * i / k));
        const DOTS = [
            { name: '星星', emoji: '⭐', pts: starPts(50, 52, 42, 18) },
            { name: '愛心', emoji: '❤️', pts: [[50, 85], [30, 65], [15, 45], [15, 28], [26, 17], [40, 20], [50, 32], [60, 20], [74, 17], [85, 28], [85, 45], [70, 65]] },
            { name: '房子', emoji: '🏠', pts: [[20, 50], [50, 20], [80, 50], [80, 85], [60, 85], [60, 65], [40, 65], [40, 85], [20, 85]] },
            { name: '太陽', emoji: '☀️', pts: ring(50, 50, 38, 12) },
            { name: '寶石', emoji: '💎', pts: [[30, 25], [70, 25], [88, 42], [50, 88], [12, 42]] },
            { name: '小魚', emoji: '🐟', pts: [[10, 50], [24, 34], [44, 26], [64, 32], [76, 43], [90, 30], [90, 70], [76, 57], [62, 68], [42, 74], [24, 66]] },
            { name: '皇冠', emoji: '👑', pts: [[15, 70], [15, 35], [35, 52], [50, 25], [65, 52], [85, 35], [85, 70]] },
            { name: '小貓', emoji: '🐱', pts: [[20, 82], [14, 40], [22, 14], [40, 32], [60, 32], [78, 14], [86, 40], [80, 82]] },
            { name: '月亮', emoji: '🌙', pts: [[62, 10], [42, 16], [26, 30], [18, 50], [26, 70], [42, 84], [62, 90], [50, 72], [42, 50], [50, 28]] },
            { name: '火箭', emoji: '🚀', pts: [[50, 8], [64, 30], [64, 62], [80, 82], [60, 76], [50, 92], [40, 76], [20, 82], [36, 62], [36, 30]] },
        ];
        function validDots(pts) {
            if (!Array.isArray(pts) || pts.length < 5 || pts.length > 30) return false;
            if (!pts.every(p => Array.isArray(p) && p.length === 2 && p.every(v => Number.isFinite(v) && v >= 0 && v <= 100))) return false;
            for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) if (Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]) < DOT_GAP) return false;
            return true;
        }
        // 目前要連第 cur 個點；游標 / 手指 (x,y) 進入它的感應半徑才算，回傳新的 cur（只前進一格，順序錯的點不算）
        const dotsStep = (pts, cur, x, y, tol = DOT_TOL) => cur < pts.length && Math.hypot(pts[cur][0] - x, pts[cur][1] - y) <= tol ? cur + 1 : cur;

        // ===== 著色線稿：區域資料（矩形 / 圓 / 橢圓 / 多邊形），不用像素洪水填色，所以不會外漏 =====
        const R = (x, y, w, h) => ({ t: 'r', x, y, w, h }), C = (x, y, r) => ({ t: 'c', x, y, r }), E = (x, y, rx, ry) => ({ t: 'e', x, y, rx, ry }), P = (p) => ({ t: 'p', p });
        const TPL = [
            { name: '房子', emoji: '🏠', g: [P([[15, 45], [50, 18], [85, 45]]), R(20, 45, 24, 40), R(44, 45, 14, 15), R(44, 60, 14, 25), R(58, 45, 22, 40), R(0, 85, 100, 15), C(85, 14, 8)] },
            { name: '花', emoji: '🌸', g: [...ring(50, 38, 18, 6, 0).map(([x, y]) => C(x, y, 8)), C(50, 38, 9), R(47, 62, 6, 33), E(35, 80, 10, 5), E(65, 80, 10, 5), R(0, 95, 100, 5)] },
            { name: '小魚', emoji: '🐟', g: [E(45, 50, 28, 17), P([[73, 50], [92, 34], [92, 66]]), C(22, 20, 5), C(34, 10, 3.5), C(14, 32, 3), P([[8, 96], [12, 72], [16, 96]]), P([[78, 96], [82, 78], [86, 96]]), R(0, 96, 100, 4)] },
            { name: '太陽', emoji: '☀️', g: [C(50, 40, 16), ...[0, 45, 90, 135, 180, 225, 270, 315].map(a => P([pol(50, 40, 20, a - 10), pol(50, 40, 34, a), pol(50, 40, 20, a + 10)])), R(0, 80, 100, 20)] },
            { name: '汽車', emoji: '🚗', g: [R(8, 55, 84, 20), P([[26, 55], [36, 33], [64, 33], [74, 55]]), C(28, 84, 9), C(72, 84, 9), R(0, 93, 100, 7), C(86, 16, 9), E(22, 18, 14, 7)] },
            { name: '大樹', emoji: '🌳', g: [C(50, 35, 22), R(44, 57, 12, 30), R(0, 87, 100, 13), C(86, 14, 8), E(16, 16, 12, 6)] },
            { name: '夜空', emoji: '🌟', g: [P(starPts(50, 47, 32, 13)), C(83, 15, 9), C(14, 18, 4), C(18, 74, 3), C(86, 70, 4)] },
            { name: '蝴蝶', emoji: '🦋', g: [E(50, 52, 3.5, 20), C(50, 28.5, 3.5), E(30, 40, 16, 12), E(70, 40, 16, 12), E(34, 66, 12, 9), E(66, 66, 12, 9), R(0, 90, 100, 10)] },
            { name: '雪人', emoji: '⛄', g: [C(50, 72, 22), C(50, 35.5, 14), C(50, 12, 9), R(0, 94, 100, 6), C(15, 30, 3), C(85, 40, 3), C(20, 58, 3), C(82, 72, 3)] },
            { name: '火箭', emoji: '🚀', g: [R(40, 30, 20, 40), P([[40, 30], [50, 10], [60, 30]]), P([[40, 55], [28, 75], [40, 70]]), P([[60, 55], [72, 75], [60, 70]]), P([[43, 70], [50, 90], [57, 70]]), C(15, 20, 3), C(85, 25, 3), C(18, 60, 2.5), C(84, 62, 2.5), C(80, 88, 2.5)] },
        ];
        function inRegion(g, x, y) {
            if (g.t === 'r') return x >= g.x && x < g.x + g.w && y >= g.y && y < g.y + g.h;
            if (g.t === 'c') return (x - g.x) ** 2 + (y - g.y) ** 2 < g.r * g.r;
            if (g.t === 'e') return ((x - g.x) / g.rx) ** 2 + ((y - g.y) / g.ry) ** 2 < 1;
            let ins = false;
            for (let i = 0, j = g.p.length - 1; i < g.p.length; j = i++) {
                const [xi, yi] = g.p[i], [xj, yj] = g.p[j];

            if (CB) { CB.taps.push(ts); beep(520, 40); return; }
            if (!RS || RS.done) return;
            RS.taps.push(ts); beep(520, 40);
            const n = nearest(RS.targets, ts - prog.lat), j = judge(n.dt);
            RS.live = true;
            $('#rMsg').textContent = j ? (j.k === 'early' ? '有點早' : j.k === 'late' ? '有點晚' : j.k === 'perfect' ? '太準了！' : '很好！') : '拍手！';
        }
        $('#pad').addEventListener('pointerdown', e => { e.preventDefault(); rhythmTap(e.timeStamp); });
        addEventListener('keydown', e => { if (e.code === 'Space' && !$('#g-rhythm').hidden && !/BUTTON|INPUT|SELECT/.test(e.target.tagName)) { e.preventDefault(); rhythmTap(e.timeStamp); } });
        $('#rStart').onclick = rhythmStart;
        $('#latM').onclick = () => { prog.lat = clampN(prog.lat - 10, -300, 300); latShow(); save(); };
        $('#latP').onclick = () => { prog.lat = clampN(prog.lat + 10, -300, 300); latShow(); save(); };
        $('#calib').onclick = () => {
            if (!snd) { $('#rMsg').textContent = '校正要聽聲音：請先按上方「聲音」開啟'; return; }
            rhythmStop(); const now = performance.now(), clicks = [0, 1, 2, 3].map(i => now + 800 + i * 800);
            CB = { clicks, taps: [] }; $('#rMsg').textContent = '聽到「嗶」就拍手，共 4 次';
            clicks.forEach(c => tone(880, 70, { type: 'triangle', vol: .15, delay: c - now }));
            setTimeout(() => {
                const l = calibrate(CB.clicks, CB.taps); CB = null;
                if (l === null) $('#rMsg').textContent = '沒有抓到足夠的拍手，請再試一次';
                else { prog.lat = l; save(); latShow(); $('#rMsg').textContent = `校正完成：延遲 ${l} 毫秒`; }
            }, 800 + 3 * 800 + 700);
        };

        // ---------- 分頁 / 聲音 / 家長設定 ----------
        function tab(g) {
            document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === g));
            ['spot', 'dots', 'color', 'shape', 'rhythm'].forEach(k => { $('#g-' + k).hidden = k !== g; });
            if (g !== 'rhythm') { rhythmStop(); CB = null; } else { rInfo(); latShow(); }
        }
        $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.g); };
        $('#snd').onclick = () => { snd = !snd; $('#snd').setAttribute('aria-pressed', snd); $('#snd').textContent = snd ? '🔊 聲音：開' : '🔇 聲音：關'; if (snd) tone(440, 60, { vol: .05 }); };
        let GQ = null;
        const gateNew = () => { GQ = gateQ(rnd); $('#gq').textContent = GQ.text; $('#ga').value = ''; };
        function statsShow() {
            $('#lv').value = prog.lv;
            $('#stats').textContent = `找不同完成 ${prog.spot.map(s => s[0]).join(' / ')} 場（簡單 / 普通 / 困難） ・ 節奏最高 ${prog.rhy.join(' / ')} 分 ・ 點點連線完成 ${prog.dots.filter(Boolean).length} / ${DOTS.length} 個`;
        }
        $('#parentBtn').onclick = () => { $('#parent').hidden = false; $('#gate').hidden = false; $('#pset').hidden = true; $('#gmsg').textContent = '請大人回答這題，才能進入家長設定'; gateNew(); $('#ga').focus(); };
        $('#gok').onclick = () => {
            if (gateOk(GQ, $('#ga').value)) { $('#gate').hidden = true; $('#pset').hidden = false; statsShow(); }
            else { $('#gmsg').textContent = '答案不對，換一題再試'; gateNew(); }
        };
        $('#ga').addEventListener('keydown', e => { if (e.key === 'Enter') $('#gok').click(); });
        $('#pclose').onclick = () => { $('#parent').hidden = true; };
        $('#lv').onchange = () => { prog.lv = +$('#lv').value; save(); spotNew(); rInfo(); rhythmStop(); };
        $('#clr').onclick = () => {
            if (!confirm('清除全部紀錄（找不同完成場數與最快時間、節奏最高分與延遲設定、點點連線完成圖案、難度）？無法復原。不會影響別的工具。')) return;
            try { localStorage.removeItem(KEY); } catch (e) { }
            prog = defProg(); statsShow(); spotNew(); dChips(); rInfo(); latShow();
        };

        spotNew(); dotsOpen(0); colorOpen(0); clRender(); palette($('#cPal'), c => { CS.col = c; });
    </script>
</body>

</html>
