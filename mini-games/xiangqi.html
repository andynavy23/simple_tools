    <template id="help">
        <h3>這是什麼</h3>
        <p>中國象棋：紅、黑雙方輪流走棋，把對方的將（帥）困死、無路可逃就贏。紅方先走。支援完整走法：將帥不可照面、馬腿、象眼、炮要隔一子吃、兵過河才能橫走、將士只能待在九宮。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>一個人想練棋：「單機對電腦」，不用連線。</li>
        <li>兩個人同一支手機輪流走：「同機雙人」。</li>
        <li>和遠方朋友下棋：建立房間，把邀請連結傳給對方。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li><b>單機</b>：選難度（簡單 / 普通 / 困難）與執子（紅先 / 黑後 / 隨機），按「單機對電腦」。電腦想的時候會顯示「電腦思考中」，困難每步最多約 1 秒。</li>
        <li>點自己的棋子，棋盤會標出所有合法落點（小圓點是空位，紅圈是可吃的子），再點落點就走。點別的己方棋子可改選。最後一步會用綠色標出，被將軍時狀態列會寫「將軍！」、將帥會亮紅光。</li>
        <li>「提示」標出建議走法；「悔棋」收回你上一步（對電腦時連電腦的回應一起收回）；「翻轉」把棋盤轉 180 度（執黑時會自動翻轉）。</li>
        <li>「棋譜」用中文縱線記法（例如「炮二平五」、黑方用全形數字「馬８進７」），可按「複製棋譜」。</li>
        <li><b>連線</b>：輸入暱稱（1–10 字）、選計時（不限時或每方 5 / 10 / 15 分鐘），按「建立房間」，再按「複製邀請連結」傳給朋友；朋友開連結、輸入暱稱按「加入」，也可以貼上房號。房主執紅先手，加入的人執黑，只能兩人。</li>
        </ol>
        <h3>規則</h3>
        <ul>
        <li><b>勝負</b>：輪到你但沒有任何合法走法（將死或困斃，沒有「應將以外」的步）就輸；認輸、超時也判負。</li>
        <li><b>和棋</b>：雙方同意（求和）；同一局面出現 3 次；連續 120 步（雙方各 60 步）沒有吃子；全局超過 600 步。</li>
        <li><b>長將（簡化）</b>：同一局面第 3 次出現時，若重複過程中只有一方每一步都在將軍，該方判負（長將違規）；雙方都長將或都沒有則判和。</li>
        <li><b>長捉（簡化）</b>：不另外判定，一律當作一般重複局面，第 3 次出現判和。</li>
        <li>連線時雙方求和 / 悔棋都要對方同意；計時由房主計算，逾時判負。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">紅方走「炮二平五」（二路炮平移到中路），把炮架在中兵前面；黑方回「馬８進７」。炮要打到對面的子，中間必須剛好隔一顆棋子。</div>
        <h3>小提醒</h3>
        <ul>
        <li>單機模式與同機雙人的進行中棋局會自動存在這個瀏覽器，下次可從選單「繼續上一局」；結束的棋局不保留。對電腦的勝負會累計在選單的統計裡，可按「清除統計」（會先確認、無法復原）；「捨棄存檔棋局」「重設選項」也都有確認。資料很小，滿不了；壞掉的存檔會自動丟棄、重新開局。</li>
        <li>連線對戰時，對方斷線期間計時照常走；請對方用同一個暱稱、按邀請連結重新加入就會回到原本的局面，同暱稱以外的人無法在對局中途加入。房主離開，對局就結束。</li>
        <li>房主會檢查每一步是否合法，非法的步一律不算、局面不變。連線對戰沒有提示。</li>
        <li>走子會滑動過去（只動畫位移）。系統開啟「減少動態效果」時會自動關閉動畫。</li>
        <li>棋盤在手機上每格約 40px，請用指尖點棋子中心；也可以在棋盤上用方向鍵移動游標、Enter 選取。</li>
        </ul>
    </template>

    <script id="app">
        // --- pure ---
        const RED = 1, BLK = -1, K_ = 1, A_ = 2, B_ = 3, N_ = 4, R_ = 5, C_ = 6, P_ = 7;
        const START_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w';
        const ORTH = [[-1, 0], [1, 0], [0, -1], [0, 1]], DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
        const KNS = [[-2, -1], [-2, 1], [2, -1], [2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2]];
        const FEN_T = { k: K_, a: A_, b: B_, n: N_, r: R_, c: C_, p: P_ }, T_FEN = ' kabnrcp';
        const MAXPLY = 600, NOCAP_MAX = 120;            // 全局上限 600 步；連續 120 步（雙方各 60）無吃子判和

        // ---------- 局面與 FEN（紅方大寫、黑方小寫；第一段由黑方底線寫到紅方底線；w = 紅走、b = 黑走） ----------
        function fromFen(fen) {
            if (typeof fen !== 'string') return null;
            const parts = fen.trim().split(/\s+/), rows = (parts[0] || '').split('/');
            if (rows.length !== 10) return null;
            const b = new Int8Array(90), kings = { 1: 0, '-1': 0 };
            for (let r = 0; r < 10; r++) {
                let c = 0;
                for (const ch of rows[r]) {
                    if (/[1-9]/.test(ch)) { c += +ch; continue; }
                    const t = FEN_T[ch.toLowerCase()];
                    if (!t || c > 8) return null;
                    const v = ch === ch.toLowerCase() ? -t : t;
                    b[r * 9 + c++] = v;
                    if (t === K_) kings[v > 0 ? 1 : -1]++;
                }
                if (c !== 9) return null;
            }
            if (kings[1] !== 1 || kings[-1] !== 1) return null;
            if (parts[1] && parts[1] !== 'w' && parts[1] !== 'b') return null;
            return { b, turn: parts[1] === 'b' ? BLK : RED };
        }
        function toFen(pos) {
            const b = pos.b; let s = '';
            for (let r = 0; r < 10; r++) {
                let e = 0;
                for (let c = 0; c < 9; c++) {
                    const v = b[r * 9 + c];
                    if (!v) { e++; continue; }
                    if (e) { s += e; e = 0; }
                    const ch = T_FEN[v > 0 ? v : -v];
                    s += v > 0 ? ch.toUpperCase() : ch;
                }
                if (e) s += e;
                if (r < 9) s += '/';
            }
            return s + ' ' + (pos.turn > 0 ? 'w' : 'b');
        }

        // ---------- 走法生成（偽合法：不檢查自己是否被將軍）。move = from * 90 + to，格子編號 = 列 * 9 + 欄，列 0 在黑方底線 ----------
        const inPal = (r, c, side) => c >= 3 && c <= 5 && (side > 0 ? r >= 7 : r <= 2);
        function addMove(b, out, s, r, c, side, caps) {         // 回傳 true = 該格是空的（滑行棋子可繼續）
            if (r < 0 || r > 9 || c < 0 || c > 8) return false;
            const d = b[r * 9 + c];
            if (!d) { if (!caps) out.push(s * 90 + r * 9 + c); return true; }
            if ((d > 0) !== (side > 0)) out.push(s * 90 + r * 9 + c);
            return false;
        }
        function gen(b, side, caps) {
            const out = [];
            for (let s = 0; s < 90; s++) {
                const v = b[s];
                if (!v || (v > 0) !== (side > 0)) continue;
                const t = v > 0 ? v : -v, r = (s / 9) | 0, c = s % 9;
                if (t === R_) {
                    for (const [dr, dc] of ORTH) for (let rr = r + dr, cc = c + dc; addMove(b, out, s, rr, cc, side, caps); rr += dr, cc += dc);
                } else if (t === C_) {
                    for (const [dr, dc] of ORTH) {
                        let rr = r + dr, cc = c + dc;
                        while (rr >= 0 && rr < 10 && cc >= 0 && cc < 9 && !b[rr * 9 + cc]) { if (!caps) out.push(s * 90 + rr * 9 + cc); rr += dr; cc += dc; }
                        rr += dr; cc += dc;                       // 越過炮架
                        while (rr >= 0 && rr < 10 && cc >= 0 && cc < 9 && !b[rr * 9 + cc]) { rr += dr; cc += dc; }
                        if (rr >= 0 && rr < 10 && cc >= 0 && cc < 9 && (b[rr * 9 + cc] > 0) !== (side > 0)) out.push(s * 90 + rr * 9 + cc);
                    }
                } else if (t === N_) {
                    for (const [dr, dc] of KNS) {
                        const lr = r + (dr === 2 || dr === -2 ? dr / 2 : 0), lc = c + (dc === 2 || dc === -2 ? dc / 2 : 0);
                        if (b[lr * 9 + lc]) continue;             // 蹩馬腿（馬腿一定在棋盤內：它在起點與終點之間）
                        addMove(b, out, s, r + dr, c + dc, side, caps);
                    }
                } else if (t === P_) {
                    const f = side > 0 ? -1 : 1, crossed = side > 0 ? r <= 4 : r >= 5;
                    addMove(b, out, s, r + f, c, side, caps);
                    if (crossed) { addMove(b, out, s, r, c - 1, side, caps); addMove(b, out, s, r, c + 1, side, caps); }
                } else if (t === K_) {
                    for (const [dr, dc] of ORTH) if (inPal(r + dr, c + dc, side)) addMove(b, out, s, r + dr, c + dc, side, caps);
                } else if (t === A_) {
                    for (const [dr, dc] of DIAG) if (inPal(r + dr, c + dc, side)) addMove(b, out, s, r + dr, c + dc, side, caps);
                } else {                                             // 象 / 相：田字、塞象眼、不過河
                    for (const [dr, dc] of DIAG) {
                        const rr = r + 2 * dr, cc = c + 2 * dc;
                        if (rr < 0 || rr > 9 || cc < 0 || cc > 8 || (side > 0 ? rr < 5 : rr > 4) || b[(r + dr) * 9 + c + dc]) continue;
                        addMove(b, out, s, rr, cc, side, caps);
                    }
                }
            }
            return out;
        }

        // sq 這格有沒有被 by 方攻擊（用來判斷將軍；兼含將帥照面：把對方的將當成車）
        function attacked(b, sq, by) {
            const r = (sq / 9) | 0, c = sq % 9, fwd = by > 0 ? -1 : 1;
            for (const [dr, dc] of ORTH) {
                let rr = r + dr, cc = c + dc, n = 0;

        }
        const dispRC = (r, c) => (flip ? [9 - r, 8 - c] : [r, c]);        // 邏輯 → 螢幕
        const pct = (r, c) => { const [vr, vc] = dispRC(r, c); return `left:${(vc + .5) / 9 * 100}%;top:${(vr + .5) / 10 * 100}%`; };
        const mkEl = (cls, s, text) => { const e = document.createElement('div'); e.className = cls; e.style.cssText = pct((s / 9) | 0, s % 9); if (text) e.textContent = text; e.dataset.sq = s; return e; };

        function drawBoard() {
            const layer = $('#layer'), kids = [], last = pos.mv.length ? pos.mv[pos.mv.length - 1] : -1;
            const ksq = inChk ? kingSq(pos.b, pos.turn) : -1;
            for (let s = 0; s < 90; s++) {
                const v = pos.b[s];
                if (!v) continue;
                const e = mkEl('pc ' + (v > 0 ? 'r' : 'b') + (s === sel ? ' sel' : '') + (s === ksq ? ' chk' : ''), s, (v > 0 ? CH_R : CH_B)[Math.abs(v) - 1]);
                kids.push(e);
            }
            if (last >= 0) { kids.push(mkEl('mk from', (last / 90) | 0), mkEl('mk to', last % 90)); }
            if (sel >= 0) for (const m of LM) if (((m / 90) | 0) === sel) kids.push(mkEl('mk dest' + (pos.b[m % 90] ? ' cap' : ''), m % 90));
            if (hintM >= 0) kids.push(mkEl('mk hint', (hintM / 90) | 0), mkEl('mk hint', hintM % 90));
            if (cur && document.activeElement === $('#bd')) kids.push(mkEl('mk cur', cur));
            layer.replaceChildren(...kids);
            if (lastAnim != null && last === lastAnim && !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) {
                const el = layer.querySelector(`.pc[data-sq="${last % 90}"]`);
                const fr = (last / 90) | 0, to = last % 90;
                const [r0, c0] = dispRC((fr / 9) | 0, fr % 9), [r1, c1] = dispRC((to / 9) | 0, to % 9), K = 100 / 0.98;       // 棋子寬 = 格寬 × 0.88 → 位移以棋子自身的 % 表示
                if (el && el.animate) el.animate([{ transform: `translate(${-50 + (c0 - c1) * K}%, ${-50 + (r0 - r1) * K}%)` }, { transform: 'translate(-50%, -50%)' }], { duration: 220, easing: 'ease-out' });
            }
            lastAnim = null;
        }

        // ---------- 狀態 / 名稱 ----------
        const colorName = (s) => (s === RED ? '紅' : '黑');
        function sideName(s) {
            if (mode === 'cpu') return (s === me ? '你' : '電腦') + `（${colorName(s)}）`;
            if (mode === 'local') return colorName(s) + '方';
            const n = names[s === hostSide ? 0 : 1];
            return (n || colorName(s) + '方') + `（${colorName(s)}）`;
        }
        const mySide = () => (mode === 'cpu' ? me : mode === 'host' ? hostSide : mode === 'guest' ? -hostSide : pos.turn);
        function canAct() {
            if (!pos || RES || thinking) return false;
            if (mode === 'local') return true;
            if (mode === 'host') return guestOnline && pos.turn === hostSide;
            if (mode === 'guest') return !connLost && pos.turn === -hostSide;
            return pos.turn === me;
        }
        function resultText() {
            const why = RESULT_TEXT[RES.why] || '';
            return RES.w === 0 ? `和棋（${why}）` : `${sideName(RES.w)} 獲勝（${why}）`;
        }
        const remain = (s) => (CLK ? CLK.ms[s === RED ? 0 : 1] - (CLK.run && pos.turn === s ? Date.now() - CLK.at : 0) : 0);
        function updClocks() {
            for (const [id, s] of [['#topClk', flip ? RED : BLK], ['#botClk', flip ? BLK : RED]]) {
                const e = $(id);
                e.hidden = !CLK;
                if (!CLK) continue;
                const ms = remain(s);
                e.textContent = fmtClock(ms);
                e.classList.toggle('on', !RES && pos.turn === s);
                e.classList.toggle('low', ms < 30000);
            }
        }
        function render() {
            if (!pos) return;
            drawBoard();
            const topS = flip ? RED : BLK, botS = -topS;
            for (const [p, s] of [['top', topS], ['bot', botS]]) {
                const chip = $('#' + p + 'Chip');
                chip.className = 'chip ' + (s === RED ? 'r' : 'b'); chip.textContent = s === RED ? '帥' : '將';
                $('#' + p + 'Name').textContent = sideName(s);
            }
            updClocks();
            let t = '', warn = false;
            if (RES) t = resultText();
            else if (mode === 'host' && !guestOnline) t = pos.mv.length ? '對方已斷線，等待重連…' : '等待對手加入…';
            else if (mode === 'guest' && connLost) t = '與房主斷線了';
            else if (thinking) t = '電腦思考中…';
            else { t = `輪到 ${sideName(pos.turn)}`; if (inChk) { t += ' ・將軍！'; warn = true; } }
            $('#status').textContent = t; $('#status').classList.toggle('warn', warn);
            $('#noteLine').textContent = note;
            const net = mode === 'host' || mode === 'guest', ms = mySide();
            const incoming = askS && askS.from !== ms && net;
            $('#askBar').hidden = !incoming || !!RES;
            if (incoming) $('#askTxt').textContent = askS.kind === 'draw' ? '對方請求和棋' : '對方請求悔棋';
            if (askS && askS.from === ms && !RES) $('#noteLine').textContent = askS.kind === 'draw' ? '已請求和棋，等待對方回應…' : '已請求悔棋，等待對方回應…';
            const solo = mode === 'cpu' || mode === 'local';
            const offline = (mode === 'guest' && connLost) || (mode === 'host' && !guestOnline);
            $('#undo').disabled = !!RES || thinking && mode !== 'cpu' || !!askS || offline || (mode === 'local' ? !pos.mv.length : !undoCount(pos, ms)) || (mode === 'cpu' && pos.mv.length < (me === RED ? 1 : 2));
            $('#hint').hidden = !solo;
            $('#hint').disabled = !!RES || thinking || (mode === 'cpu' && pos.turn !== me);
            $('#draw').hidden = $('#resign').hidden = mode === 'local';
            $('#draw').disabled = !!RES || !!askS || offline || (mode === 'cpu' && (thinking || pos.turn !== me));
            $('#resign').disabled = !!RES || offline;
            $('#again').hidden = !(RES && (solo || mode === 'host'));
            $('#copy').hidden = mode !== 'host';
            $('#reconnect').hidden = !(mode === 'guest' && connLost);
            const lg = $('#log'), items = [];
            for (let i = 0; i < pos.nm.length; i += 2) {
                const li = document.createElement('li');
                li.innerHTML = `<span class="n">${i / 2 + 1}.</span><span class="m${i + 1 === pos.nm.length ? ' cur' : ''}">${pos.nm[i]}</span><span class="m${i + 2 === pos.nm.length ? ' cur' : ''}">${pos.nm[i + 1] || ''}</span>`;
                items.push(li);
            }
            lg.replaceChildren(...items); lg.scrollTop = lg.scrollHeight;
        }

        // 任何局面變動後都走這裡：重算合法步 / 結果、統計、存檔、輪到電腦就思考
        function update(anim) {
            lastAnim = anim == null ? null : anim; sel = -1; hintM = -1;
            LM = legalMoves(pos);
            const st = status(pos, LM);
            RES = end || (st.over ? { w: st.winner, why: st.why } : null);
            inChk = !RES && inCheck(pos.b, pos.turn);
            if (!RES) counted = false; else if (!counted) { counted = true; recordStat(); }
            if (RES && CLK) CLK.run = false;
            thinking = mode === 'cpu' && !RES && pos.turn !== me;
            render(); persist(); scheduleCpu();
        }

        // ---------- 輸入：點棋盤 ----------
        function tapSq(r, c) {
            if (!pos) return;
            const s = sqOf(r, c), v = pos.b[s];
            if (!canAct()) { sel = -1; render(); return; }
            if (sel >= 0) {
                const m = sel * 90 + s;
                if (LM.includes(m)) { sel = -1; userMove(m); return; }
            }
            sel = v && (v > 0) === (pos.turn > 0) ? s : -1;
            hintM = -1;
            render();
        }
        function userMove(m) {
            if (mode === 'guest') { room.send({ t: 'MOVE', m }); render(); return; }
            applyMove(m);
            if (mode === 'host') publish();
        }
        function applyMove(m) {
            if (mode === 'host') tickClock();
            if (!doMove(pos, m)) return false;
            askS = null; note = '';
            if (mode === 'host') { tickClock(); }
            update(m);
            return true;
        }
        $('#bd').addEventListener('click', (e) => {
            const rc = $('#bd').getBoundingClientRect();
            const vc = Math.min(8, Math.max(0, Math.floor((e.clientX - rc.left) / rc.width * 9))), vr = Math.min(9, Math.max(0, Math.floor((e.clientY - rc.top) / rc.height * 10)));
            const [r, c] = flip ? [9 - vr, 8 - vc] : [vr, vc];
            cur = [r, c];
            tapSq(r, c);
        });
        $('#bd').addEventListener('keydown', (e) => {
            const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
            if (!cur) cur = [flip ? 0 : 9, 4];
            if (d) { const [dr, dc] = flip ? [-d[0], -d[1]] : d; cur = [Math.min(9, Math.max(0, cur[0] + dr)), Math.min(8, Math.max(0, cur[1] + dc))]; e.preventDefault(); render(); }
            else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapSq(cur[0], cur[1]); }
        });
        $('#bd').addEventListener('focus', () => render());
        $('#bd').addEventListener('blur', () => render());

        // ---------- 電腦（Web Worker 跑搜尋，不卡畫面；建立失敗就退回主執行緒，仍有時間預算） ----------
        function getWorker() {
            if (worker !== null) return worker || null;
            try {
                const src = PURE_SRC + '\nonmessage = (e) => { const d = e.data; let m = -1; try { m = cpuMove({ b: Int8Array.from(d.b), turn: d.turn, keys: d.keys }, d.level, d.o); } catch (_) { } postMessage({ id: d.id, m }); };';
                worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
                worker.onmessage = (e) => { if (workerCb && e.data.id === workerCb.id) { const cb = workerCb.cb; workerCb = null; cb(e.data.m); } };
                worker.onerror = () => { worker = false; const w = workerCb; workerCb = null; if (w) w.fallback(); };
            } catch (e) { worker = false; }
            return worker || null;
        }
        let jobId = 0;
        function think(lv, o, cb) {
            const id = ++jobId, w = getWorker(), data = { id, b: Array.from(pos.b), turn: pos.turn, keys: pos.keys, level: lv, o };
            const fallback = () => setTimeout(() => cb(cpuMove(pos, lv, o)), 30);
            if (w) { workerCb = { id, cb, fallback }; w.postMessage(data); } else fallback();
        }
        function scheduleCpu() {
            clearTimeout(cpuTimer);
            if (!thinking) return;
            const my = token, t0 = Date.now(), len = pos.mv.length;
            think(level, null, (m) => {
                const wait = Math.max(0, 350 - (Date.now() - t0));
                cpuTimer = setTimeout(() => {
                    if (my !== token || mode !== 'cpu' || pos.mv.length !== len || RES) return;
                    thinking = false;
                    if (m < 0 || !applyMove(m)) update();
                }, wait);
            });
        }

        // ---------- 開局 ----------
        function show(screen) { $('#menu').hidden = screen !== 'menu'; $('#game').hidden = screen !== 'game'; if (screen === 'menu') showStats(); }
        function begin(m, moves) {
            token++; clearTimeout(cpuTimer); thinking = false; mode = m; end = null; askS = null; note = ''; sel = -1; hintM = -1; cur = null; counted = false;
            pos = replay(moves || []) || newPos();
            buildGrid(); show('game');
        }
        function startCpu(lv, side, moves) {
            level = lv; me = side;
            begin('cpu', moves);
            flip = me === BLK; CLK = null;
            update();
        }
        function startLocal(moves) { begin('local', moves); flip = false; CLK = null; update(); }
        function pickSide(v) { return v === 'black' ? BLK : v === 'random' ? (Math.random() < .5 ? RED : BLK) : RED; }
        $('#cpu').onclick = () => {
            opts.level = $('#level').value; opts.side = $('#side').value; saveOpts();
            startCpu(opts.level, pickSide(opts.side));
        };
        $('#local').onclick = () => startLocal();
        $('#resume').onclick = () => {
            const g = showStats();
            if (!g) return;
            if (g.mode === 'cpu') startCpu(g.level, g.me, g.moves); else startLocal(g.moves);
        };
        $('#dropSave').onclick = () => { if (confirm('捨棄進行中的存檔棋局？\n這盤棋會被刪除，無法復原。')) { try { localStorage.removeItem('xiangqi_game'); } catch (e) { } showStats(); } };
        $('#clearStats').onclick = () => { if (confirm('清除所有勝負統計？\n只會清掉統計（對電腦與連線的勝負和），無法復原。')) { stats = cleanStats(null); Util.store.set('xiangqi_stats', stats); showStats(); } };
        $('#resetOpts').onclick = () => {
            if (!confirm('重設選項（難度、執子、計時、暱稱）？\n頁面會重新載入，無法復原。')) return;
            try { localStorage.removeItem('xiangqi_opts'); } catch (e) { }
            location.reload();
        };
        $('#again').onclick = () => {
            if (mode === 'host') {
                hostSide = -hostSide; newNetGame(); publish();
            } else if (mode === 'cpu') startCpu(level, -me);
            else startLocal();
        };
        $('#flip').onclick = () => { flip = !flip; render(); };
        $('#hint').onclick = () => {
            if (RES || thinking) return;
            const my = token; thinking = true; render();
            think('normal', { noise: 0, ms: 400 }, (m) => { if (my !== token) return; thinking = false; hintM = m; render(); });
        };
        $('#undo').onclick = () => {
            if (RES) return;
            if (mode === 'local') { undoMove(pos); update(); return; }
            if (mode === 'cpu') {
                token++; clearTimeout(cpuTimer); thinking = false;
                const n = undoCount(pos, me);
                for (let i = 0; i < n; i++) undoMove(pos);
                update();
                return;
            }
            requestAsk('undo');
        };
        $('#draw').onclick = () => {
            if (mode === 'cpu') {
                if (cpuAcceptsDraw(pos, -me)) { end = { w: 0, why: 'agree' }; note = ''; update(); }
                else { note = '電腦拒絕了和棋'; render(); }
                return;
            }
            requestAsk('draw');
        };
        $('#resign').onclick = () => {
            if (RES || !confirm('確定認輸？這一局會判你輸。')) return;
            if (mode === 'guest') { room.send({ t: 'RESIGN' }); return; }
            end = { w: -mySide(), why: 'resign' }; update();
            if (mode === 'host') publish();
        };
        $('#leave').onclick = () => {
            if ((mode === 'host' || mode === 'guest') && pos && !RES && pos.mv.length && !confirm('離開會中斷這局連線對戰（對方會看到你斷線）。確定離開？')) return;
            location.reload();
        };
        $('#copyLog').onclick = () => {
            const head = `中國象棋　紅：${sideName(RED).replace(/（.*/, '')}　黑：${sideName(BLK).replace(/（.*/, '')}` + (RES ? '　結果：' + (RES.w === 0 ? '和棋' : colorName(RES.w) + '勝') : '');
            const txt = logText(pos, head);
            Util.copyWithFeedback($('#copyLog'), txt, () => prompt('請手動複製棋譜：', txt));
        };
        $('#copy').onclick = () => { const url = P2PRoom.inviteLink(hostId); Util.copyWithFeedback($('#copy'), url, () => prompt('請手動複製邀請連結：', url)); };

        // ---------- 連線：房主權威 ----------
        const readNick = () => {
            const n = $('#nick').value.trim();
            if (!P2PRoom.validNick(n)) { netMsg('暱稱請使用 1–10 位中英文或數字'); return null; }
            opts.nick = n; saveOpts();
            return n;
        };
        const onNetError = (err, message) => { netMsg(message); enableNet(true); if (room) { room.destroy(); room = null; } };

        function newNetGame() {                      // 房主：重置棋局（保留房間與對手）
            token++; pos = newPos(); end = null; askS = null; note = ''; sel = -1; hintM = -1; counted = false;
            CLK = clockMin ? { ms: [clockMin * 60000, clockMin * 60000], run: false, at: Date.now() } : null;
            flip = hostSide === BLK; flipSet = true;
        }
        function tickClock() {
            if (!CLK) return;
            const now = Date.now();
            if (CLK.run) CLK.ms[pos.turn === RED ? 0 : 1] -= now - CLK.at;
            CLK.at = now;
            CLK.run = !end && !RES && (guestOnline || pos.mv.length > 0) && !(status(pos).over);
        }
        function stateMsg(n) {
            return { t: 'STATE', moves: pos.mv, end, hs: hostSide, names, clk: CLK ? { ms: CLK.ms, run: CLK.run } : null, ask: askS, online: guestOnline, note: n || '' };
        }
        function publish(n) {                         // 房主：更新自己畫面並廣播完整狀態
            if (n !== undefined) note = n;
            tickClock(); update();
            if (room) room.broadcast(stateMsg(n));
        }
        function requestAsk(kind) {
            if (askS || RES) return;
            if (kind === 'undo' && !undoCount(pos, mySide())) return;
            if (mode === 'guest') { room.send({ t: 'REQ', kind }); return; }
            askS = { kind, from: hostSide }; publish('');
        }
        function resolveAsk(ok) {                     // 房主端：處理對方 / 自己的答覆
            const a = askS;
            if (!a) return;
            askS = null;
            let n = '';
            if (ok) {
                if (a.kind === 'draw') end = { w: 0, why: 'agree' };
                else { const k = undoCount(pos, a.from); for (let i = 0; i < k; i++) undoMove(pos); }
            } else n = (a.kind === 'draw' ? '和棋' : '悔棋') + '請求被拒絕';
            publish(n);
        }
        $('#askYes').onclick = () => { if (mode === 'guest') room.send({ t: 'ANS', ok: true }); else resolveAsk(true); };
        $('#askNo').onclick = () => { if (mode === 'guest') room.send({ t: 'ANS', ok: false }); else resolveAsk(false); };

        function handleGuest(d) {                     // 房主驗證成員送來的一切資料
            if (!d || typeof d !== 'object') return;
            const gs = -hostSide;
            if (d.t === 'MOVE') {
                if (RES || pos.turn !== gs || !Number.isInteger(d.m) || d.m < 0 || d.m >= 8100 || !guestOnline) { room.sendTo(1, stateMsg('非法或不是你的回合')); return; }
                tickClock();
                if (!doMove(pos, d.m)) { room.sendTo(1, stateMsg('這一步不合法')); return; }
                askS = null; publish('');
                lastAnim = null;
            } else if (d.t === 'RESIGN') {
                if (!RES) { end = { w: hostSide, why: 'resign' }; publish(''); }
            } else if (d.t === 'REQ') {
                if (RES || askS || (d.kind !== 'draw' && d.kind !== 'undo')) return;
                if (d.kind === 'undo' && !undoCount(pos, gs)) return;
                askS = { kind: d.kind, from: gs }; publish('');
            } else if (d.t === 'ANS') {
                if (askS && askS.from === hostSide && typeof d.ok === 'boolean') resolveAsk(d.ok);
            }
        }
        function startClockLoop() {
            clearInterval(clkTimer);
            clkTimer = setInterval(() => {
                if (!pos) return;
                if (mode === 'host') {
                    tickClock();
                    if (CLK && CLK.run && !RES && remain(pos.turn) <= 0) { end = { w: -pos.turn, why: 'time' }; publish(''); return; }
                }
                if (CLK) updClocks();
            }, 250);
        }

        function hostRoom() {
            const nick = readNick();
            if (!nick) return;
            clockMin = +$('#clock').value; opts.clock = clockMin; saveOpts();
            enableNet(false); netMsg('連線中…');
            room = P2PRoom.host({
                nick, maxPlayers: 2, keepSlots: true,
                onReady(r) {
                    mode = 'host'; hostId = r.id; myNick = nick; hostSide = RED; names = [nick, ''];
                    history.replaceState('', document.title, location.pathname + '#' + r.id);
                    token++; clearTimeout(cpuTimer); newNetGame(); buildGrid(); show('game'); startClockLoop(); update();
                },
                canJoin(n) { if (names[1] && n !== names[1] && pos.mv.length && !RES) return '對局進行中，只有原本的玩家可以重新連線'; return ''; },
                onJoin(p, info) {
                    guestOnline = true;
                    if (!info.rejoined && p.nick !== names[1]) { names = [nick, p.nick]; newNetGame(); }
                    else if (!info.rejoined && !pos.mv.length) newNetGame();
                    names = [nick, p.nick];
                    publish('');
                },
                onLeave() { guestOnline = false; askS = null; publish(''); },
                onMessage(p, d) { if (p.index === 1) handleGuest(d); },
                onError: onNetError,
            });
        }
        function joinRoom(re) {
            const nick = re ? myNick : readNick(), id = re ? joinId : $('#joinId').value.trim();
            if (!nick) return;
            if (!id) { netMsg('請貼上房號'); return; }
            if (!re) { enableNet(false); netMsg('連線中…'); }
            else { $('#status').textContent = '重新連線中…'; }
            myNick = nick; joinId = id;
            if (room) { try { room.destroy(); } catch (e) { } }
            room = P2PRoom.join(id, {
                nick,
                onJoined() {
                    connLost = false;
                    if (mode !== 'guest') { mode = 'guest'; token++; pos = newPos(); end = null; names = ['', nick]; buildGrid(); show('game'); startClockLoop(); }
                    update();
                },
                onMessage(d) {
                    const s = cleanState(d);
                    if (!s || mode !== 'guest') return;
                    const grew = s.pos.mv.length === pos.mv.length + 1 && pos.mv.every((m, i) => m === s.pos.mv[i]);
                    const sameHs = s.hs === hostSide;
                    pos = s.pos; end = s.end; hostSide = s.hs; names = s.names; askS = s.ask; note = s.note;
                    CLK = s.clk ? { ms: s.clk.ms, run: s.clk.run, at: Date.now() } : null;
                    if (!flipSet || !sameHs) { flip = -hostSide === BLK; flipSet = true; }
                    update(grew ? pos.mv[pos.mv.length - 1] : null);
                },
                onRejected(reason) { if (re) { $('#status').textContent = reason; connLost = true; render(); } else { netMsg(reason); enableNet(true); } room = null; },
                onClose() { if (mode === 'guest') { connLost = true; render(); } },
                onError(err, message) { if (re) { $('#status').textContent = message; connLost = true; render(); } else onNetError(err, message); },
            });
        }
        $('#host').onclick = hostRoom;
        $('#join').onclick = () => joinRoom(false);
        $('#reconnect').onclick = () => joinRoom(true);

        // ---------- 初始化 ----------
        $('#level').value = opts.level; $('#side').value = opts.side; $('#clock').value = String(opts.clock); $('#nick').value = opts.nick;
        if (P2PRoom.roomFromUrl()) $('#joinId').value = P2PRoom.roomFromUrl();
        show('menu');
    </script>
</body>

</html>
