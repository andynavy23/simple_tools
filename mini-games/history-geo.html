        <h1>史地小百科</h1>
        <p class="sub">朝代與大事年表、國旗與首都、台灣地理、歷史閃卡。都在本機運作，不用上網。</p>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把常用的歷史與地理知識收在一起：朝代與大事年表、約 190 個國家的國旗與首都、台灣地理速查，以及歷史重點閃卡。全部離線可用，只有測驗成績與卡片進度存在這台裝置。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>複習歷史課、國中會考、公職或常識測驗前。</li>
            <li>看新聞不確定某國首都或位置時快速查。</li>
            <li>通勤時用卡片或測驗練習。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li><b>朝代年表</b>：上方分成「中國朝代 / 中國事件 / 臺灣 / 世界」，點一列展開說明；搜尋框會搜尋全部分組（可輸入朝代、事件名或年份）。</li>
            <li><b>國旗首都</b>：「對照表」可搜尋、依洲篩選；「測驗」有三種題型（看國旗選國名、看國名選首都、看首都選國名），每輪 10 題、四選一，可限定範圍，也可只練答錯過的國家（錯題加強）。</li>
            <li><b>台灣地理</b>：行政區、山脈地形、河川、島嶼、氣候與區域特色的速查，可搜尋。</li>
            <li><b>歷史卡片</b>：看到題目先想一想，按「翻面」看答案，再選「記得」或「忘記了」。記得的卡片會隔更久才再出現（1、3、7 天），忘記的會很快再出現；今天沒有到期的卡片時，會出新卡。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋「1895」→ 找到「馬關條約，臺灣進入日本統治時期」。
國旗測驗選「看國旗選國名」：畫面出現 🇯🇵，四個選項選「日本」。
卡片：題目「鄭成功攻臺」→ 翻面看到 1661 年的說明 → 按「記得」。</div>
        <h3>小提醒</h3>
        <ul>
            <li><b>年代為通行說法，史家說法略有差異</b>（尤其夏商周與朝代起訖年）；「約」表示年代不精確。內容供學習參考，考試請以教科書或官方資料為準。</li>
            <li>國家以聯合國 193 個會員國加梵蒂岡為主，國名採台灣常用中文譯名；有爭議或多個首都的國家會在備註說明。台灣的內容請看「台灣地理」分頁。</li>
            <li>國旗用 emoji 顯示。Windows 電腦通常不顯示國旗圖案，這時會自動關閉「看國旗選國名」，對照表只顯示文字；手機與 Mac 通常正常。</li>
            <li>資料只存「測驗統計、錯題與卡片進度」，鍵名 histgeo_stats，有固定上限（最多每國一筆錯題、每張卡片一筆進度，不會無限增加）。壞掉或舊版資料載入時會自動修正。</li>
            <li>想重來可按頁面下方「清除統計」（只清這個工具、無法復原）；單題統計沒有逐筆刪除，錯題答對後會自動從錯題清單移除。</li>
        </ul>
    </template>

                ['淡水河', '北部最大河系，由大漢溪、新店溪、基隆河匯成，流經臺北盆地。'],
                ['大甲溪', '位在中部，上游有德基水庫與梨山。'],
                ['曾文溪', '位在臺南，有曾文水庫（臺灣庫容最大的水庫）。'],
                ['蘭陽溪', '位在宜蘭，灌溉蘭陽平原。'],
                ['秀姑巒溪', '位在花蓮，是東部有名的泛舟河段。'],
                ['日月潭', '位在南投，是臺灣最大的天然湖泊。'],
            ]],
            ['島嶼', [
                ['臺灣島', '最大的島，也稱臺灣本島。'],
                ['澎湖群島', '約 90 座島嶼組成，屬澎湖縣，玄武岩地形特色鮮明。'],
                ['金門', '位在福建外海，屬金門縣，有大金門、小金門等島嶼，保有許多戰地史蹟。'],
                ['馬祖', '屬連江縣，主要島嶼有南竿、北竿、莒光、東引。'],
                ['綠島', '位在臺東外海的火山島，屬臺東縣。'],
                ['蘭嶼', '位在臺東外海，是達悟族（雅美族）的家園，屬臺東縣。'],
                ['小琉球', '屬屏東縣琉球鄉，是臺灣唯一的珊瑚礁島嶼，以海龜聞名。'],
                ['龜山島', '位在宜蘭外海的火山島，形狀像烏龜。'],
            ]],
            ['氣候', [
                ['氣候類型', '北回歸線橫越嘉義縣與花蓮縣，北部屬亞熱帶氣候、南部近熱帶氣候。'],
                ['夏季', '炎熱多雨，颱風多在 7 到 9 月侵襲。'],
                ['冬季', '東北季風使北部與東北部濕冷多雨；西南部相對乾燥少雨。'],
                ['梅雨', '約 5 到 6 月，鋒面帶來連續降雨。'],
                ['雨量', '平均年雨量約 2,500 公釐，但分布不均，山區與東北部較多。'],
                ['高山雪景', '玉山、合歡山等高山冬季偶有降雪。'],
            ]],
            ['區域特色', [
                ['北部', '政治、經濟與商業中心，臺北都會區人口稠密；新竹科學園區（1980 年成立）是半導體與資訊產業重鎮。'],
                ['中部', '臺中是中部都會，精密機械與工具機聚集；彰化、雲林為重要農業地區；南投以茶與山區觀光聞名。'],
                ['南部', '高雄港是臺灣最大的港口，重工業與煉油、造船發達；嘉南平原是稻米與蔬果的重要產區；臺南是歷史悠久的古都，古蹟眾多。'],
                ['東部', '人口較少、地形狹長，有太魯閣峽谷、花東縱谷等自然景觀，原住民族文化豐富。'],
                ['離島', '澎湖以海洋觀光為主；金門與馬祖曾是前線，留有戰地風光與聚落。'],
                ['國家公園', '墾丁國家公園（1984 年）是臺灣第一座國家公園，另有陽明山、玉山、太魯閣、雪霸等。'],
            ]],
        ];
        const geoRows = () => GEO.flatMap(([sec, rows]) => rows.map(([k, v]) => ({ sec, k, v })));
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const esc = Util.esc;
        const ALL_CARDS = allCards(), CARD_IDS = ALL_CARDS.map(c => c.id), CODES = new Set(COUNTRIES.map(x => x.c)), IDSET = new Set(CARD_IDS);
        let st = cleanStats(Util.store.get(HG.KEY, null), CODES, IDSET);
        const save = () => Util.store.set(HG.KEY, st);

        function flagSupported() {
            try {
                const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d', { willReadFrequently: true });
                x.font = '24px sans-serif'; x.textBaseline = 'top'; x.fillText(flagOf('JP'), 0, 0);
                const d = x.getImageData(0, 0, 32, 32).data;
                for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200 && Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]) > 80) return true;
            } catch (e) { /* 取不到像素就當作不支援 */ }
            return false;
        }
        let FLAG_OK = flagSupported();

        // ---- 分頁 ----
        let tab = 'time';
        function showTab(t) {
            tab = t;
            for (const b of $('#tabs').children) b.setAttribute('aria-pressed', b.dataset.tab === t);
            for (const x of ['time', 'world', 'geo', 'cards']) $('#p-' + x).hidden = x !== t;
            if (t === 'cards') nextCard(); if (t === 'world') drawWorld();
        }
        $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); };

        // ---- 朝代年表 ----
        let tg = 'dyn';
        $('#tgroups').innerHTML = GROUPS.map(([g, n]) => `<button data-g="${g}" aria-pressed="${g === tg}">${n}</button>`).join('');
        function drawTime() {
            const q = $('#tq').value.trim();
            for (const b of $('#tgroups').children) b.setAttribute('aria-pressed', !q && b.dataset.g === tg);
            const rows = q ? GROUPS.flatMap(([g, n]) => searchBy(groupItems(g), q, itemText).map(it => ({ g, n, it }))) : groupItems(tg).map(it => ({ g: tg, n: '', it }));
            $('#tnote').textContent = q ? `搜尋到 ${rows.length} 筆（搜尋全部分組）` : tg === 'dyn' ? '年代為通行說法，史家說法略有差異；「約」表示年代不精確。點一列看說明。' : `共 ${rows.length} 筆，依時間排列。點一列看說明。`;
            $('#tlist').innerHTML = rows.length ? rows.map(({ n, it }) => `<details class="t"><summary><span class="y">${esc(fmtRange(it))}</span><b>${esc(it.t)}</b>${n ? `<span class="tag">${n}</span>` : ''}${it.par ? '<span class="tag">並存</span>' : ''}</summary><p>${esc(it.d)}</p></details>`).join('') : '<p class="muted">沒有符合的項目。</p>';
        }
        $('#tgroups').onclick = (e) => { const b = e.target.closest('button'); if (b) { tg = b.dataset.g; $('#tq').value = ''; drawTime(); } };
        $('#tq').oninput = drawTime;

        // ---- 國旗與首都 ----
        let cc = '', wsub = 'table';
        $('#conts').innerHTML = ['', ...Object.values(CONT)].map(c => `<button data-c="${c}" aria-pressed="${c === ''}">${c || '全部'}</button>`).join('');
        $('#qcont').innerHTML = ['', ...Object.values(CONT)].map(c => `<option value="${c}">${c || '全部國家'}</option>`).join('');
        function drawTable() {
            for (const b of $('#conts').children) b.setAttribute('aria-pressed', b.dataset.c === cc);
            const rows = searchBy(COUNTRIES.filter(x => !cc || x.cont === cc), $('#cq').value, countryText);
            $('#cnote').textContent = `共 ${rows.length} 國${FLAG_OK ? '' : '（此裝置不顯示國旗圖案）'}。名稱採台灣常用譯名；備註處說明有多個首都或特殊情況的國家。`;
            $('#clist').innerHTML = rows.length ? rows.map(x => `<div class="li cl">${FLAG_OK ? `<span class="fl">${flagOf(x.c)}</span>` : ''}<span class="nm">${esc(x.n)}<small>${esc(x.cont)}${x.note ? '・' + esc(x.note) : ''}</small></span><b class="cp">${esc(x.cap)}</b></div>`).join('') : '<p class="muted">沒有符合的國家。</p>';
        }
        $('#conts').onclick = (e) => { const b = e.target.closest('button'); if (b) { cc = b.dataset.c; drawTable(); } };
        $('#cq').oninput = drawTable;
        $('#wsub').onclick = (e) => { const b = e.target.closest('button'); if (b) { wsub = b.dataset.s; drawWorld(); } };
        function drawWorld() {
            for (const b of $('#wsub').children) b.setAttribute('aria-pressed', b.dataset.s === wsub);
            $('#w-table').hidden = wsub !== 'table'; $('#w-quiz').hidden = wsub !== 'quiz';
            drawTable(); drawQSetup();
        }

        // 測驗
        let qmode = 'flag', round = null, qi = 0, qok = 0, qwrongs = [], answered = false;
        function drawQSetup() {
            if (!FLAG_OK && qmode === 'flag') qmode = 'cap';
            for (const b of $('#qmodes').children) { b.setAttribute('aria-pressed', b.dataset.m === qmode); if (b.dataset.m === 'flag') b.disabled = !FLAG_OK; }
            $('#flagWarn').hidden = FLAG_OK;
            const n = Object.keys(st.wrong).length; $('#wrongN').textContent = n; $('#qwrong').disabled = n === 0; if (!n) $('#qwrong').checked = false;
        }
        $('#qmodes').onclick = (e) => { const b = e.target.closest('button'); if (b && !b.disabled) { qmode = cleanMode(b.dataset.m); drawQSetup(); } };
        function qshow(id) { for (const x of ['qsetup', 'qplay', 'qresult']) $('#' + x).hidden = x !== id; }
        function qstart() {
            const pool = quizPool(COUNTRIES, { cont: $('#qcont').value, wrongOnly: $('#qwrong').checked, wrong: st.wrong, mode: qmode });
            if (!pool.length) { alert('這個範圍可出的題目太少（沒有符合的國家），請換個範圍。'); return; }
            round = makeRound(Math.random, pool, COUNTRIES, qmode); qi = 0; qok = 0; qwrongs = []; qshow('qplay'); drawQ();
        }
        function drawQ() {
            const q = round[qi]; answered = false;
            $('#qprog').textContent = `${qi + 1} / ${round.length}`; $('#qscore').textContent = `答對 ${qok}`;
            $('#qprompt').textContent = q.prompt; $('#qprompt').classList.toggle('flag', q.mode === 'flag');
            $('#qopts').innerHTML = q.options.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join('');
            $('#qfb').textContent = ''; $('#qnext').hidden = true;
        }
        $('#qopts').onclick = (e) => {
            const b = e.target.closest('button'); if (!b || answered) return;
            answered = true; const q = round[qi], i = +b.dataset.i, ok = i === q.correct;
            [...$('#qopts').children].forEach((x, k) => { x.disabled = true; if (k === q.correct) x.classList.add('ok'); else if (k === i) x.classList.add('bad'); });
            if (ok) qok++; else qwrongs.push(q);
            recordAnswer(st, q.mode, q.item.c, ok); save();
            $('#qfb').textContent = ok ? '✔ 答對了' : `✘ 正確答案：${q.options[q.correct]}`; $('#qscore').textContent = `答對 ${qok}`;
            $('#qnext').hidden = false; $('#qnext').textContent = qi + 1 >= round.length ? '看結果' : '下一題';
        };
        $('#qnext').onclick = () => { if (qi + 1 >= round.length) qfinish(); else { qi++; drawQ(); } };
        function qfinish() {
            qshow('qresult'); $('#qres').textContent = `${qok} / ${qok + qwrongs.length}`;
            $('#qwrongList').innerHTML = qwrongs.length ? `<h2 style="margin-top:8px">答錯的（${qwrongs.length}）</h2>` + qwrongs.map(q => `<div class="li cl">${FLAG_OK ? `<span class="fl">${flagOf(q.item.c)}</span>` : ''}<span class="nm">${esc(q.item.n)}</span><b class="cp">${esc(q.item.cap)}</b></div>`).join('') : '<p class="muted" style="text-align:center">全對！</p>';
            drawStats();
        }
        $('#qstart').onclick = qstart; $('#qagain').onclick = qstart; $('#qquit').onclick = () => { if (round && qok + qwrongs.length > 0) qfinish(); else { qshow('qsetup'); drawQSetup(); } };
        $('#qback').onclick = () => { qshow('qsetup'); drawQSetup(); };

        // ---- 台灣地理 ----
        function drawGeo() {
            const rows = searchBy(geoRows(), $('#gq').value, r => r.sec + r.k + r.v);
            $('#gnote').textContent = $('#gq').value.trim() ? `搜尋到 ${rows.length} 筆` : '資料為常見的通行說法，數字為概數。';
            let last = '';
            $('#glist').innerHTML = rows.length ? rows.map(r => { const h = r.sec !== last ? `<h2 style="margin:14px 0 2px">${esc(r.sec)}</h2>` : ''; last = r.sec; return `${h}<div class="li kv"><b>${esc(r.k)}</b><span>${esc(r.v)}</span></div>`; }).join('') : '<p class="muted">沒有符合的項目。</p>';
        }
        $('#gq').oninput = drawGeo;

        // ---- 歷史卡片 ----
        let curCard = null, flipped = false, lastCard = null;
        const today = () => dayNum(Date.now() - new Date().getTimezoneOffset() * 60000);
        function nextCard() {
            const t = today(), id = pickCard(CARD_IDS, st.cards, t, Math.random, lastCard), n = cardCounts(CARD_IDS, st.cards, t);
            $('#cinfo').textContent = `到期 ${n.due}・新卡 ${n.fresh}`; $('#cstat').textContent = `已熟 ${n.mastered} / ${CARD_IDS.length}`;
            flipped = false; $('#cbtns').hidden = false; $('#cans').hidden = true;
            if (!id) { curCard = null; $('#cbox').innerHTML = '<div class="q">今天都複習完了 🎉</div><div class="muted">明天再來，或到其他分頁逛逛。</div>'; $('#cbtns').hidden = true; return; }
            curCard = ALL_CARDS[CARD_IDS.indexOf(id)]; const f = cardFace(curCard);
            $('#cbox').innerHTML = `<div><span class="tag">${esc(f.tag)}</span></div><div class="q" style="white-space:pre-line">${esc(f.q)}</div><div class="a" id="cback" hidden style="white-space:pre-line">${esc(f.a)}</div>`;
        }
        $('#cflip').onclick = () => { if (!curCard) return; flipped = true; $('#cback').hidden = false; $('#cbtns').hidden = true; $('#cans').hidden = false; };
        function rate(ok) { if (!curCard || !flipped) return; recordCard(st, curCard.id, ok, today()); save(); lastCard = curCard.id; nextCard(); drawStats(); }
        $('#cok').onclick = () => rate(true); $('#cng').onclick = () => rate(false);

        // ---- 統計 ----
        const NAMES = { flag: '看國旗選國名', cap: '看國名選首都', rcap: '看首都選國名' };
        function drawStats() {
            const lines = QMODES.map(m => { const q = st.quiz[m]; return `<div class="li stat"><span>${NAMES[m]}</span><b>${q.n ? `${q.ok}/${q.n}（${Math.round(q.ok / q.n * 100)}%）・最長連對 ${q.best}` : '—'}</b></div>`; });
            const n = cardCounts(CARD_IDS, st.cards, today());
            lines.push(`<div class="li stat"><span>錯題國家</span><b>${Object.keys(st.wrong).length} 個</b></div>`);
            lines.push(`<div class="li stat"><span>歷史卡片</span><b>記得 ${st.card.ok}・忘記 ${st.card.ng}・已熟 ${n.mastered}/${CARD_IDS.length}</b></div>`);
            $('#statsBox').innerHTML = lines.join('');
        }
        $('#clearStats').onclick = () => {
            if (!confirm('清除史地小百科的測驗統計、錯題清單與卡片複習進度？無法復原。')) return;
            st = emptyStats(); save(); lastCard = null; drawStats(); drawQSetup(); if (tab === 'cards') nextCard();
        };

        drawTime(); drawGeo(); drawStats(); drawWorld();
    </script>
</body>

</html>
