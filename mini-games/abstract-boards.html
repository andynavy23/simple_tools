    <template id="help">
        <h3>這是什麼</h3>
        <p>七種規則簡單的抽象棋放在同一頁：九子棋、曼卡拉、點格棋、Hex 六角棋、狐狸與鵝、六子棋、連珠（Renju）。全部是單機：對電腦（簡單 / 普通 / 困難）或同一支手機雙人輪流，不連線。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想找一款幾分鐘能玩完的雙人棋，又沒有對手時。</li>
        <li>兩人共用一支手機輪流下（選「同機雙人」）。</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
        <li>上方點選棋類，設定模式、難度、先後手，按「開始」。簡單是隨機合法步；普通是啟發式評分；困難會往後搜尋幾步（時間預算約 0.4 秒）。</li>
        <li><b>落子</b>：小格棋盤（Hex、六子棋、連珠）點一下只是選位置，出現半透明預覽，再點同一格或按「確認」才下，點別格可改選；「放大」可把棋盤放大並在框內捲動。</li>
        <li>「提示」標出建議位置；「悔棋」對電腦時一次退回你上次下子之前（連電腦的回應一起收回）。</li>
        <li>結束時會顯示結果；對電腦的勝負會累計進下方戰績。</li>
        </ol>
        <h3>規則</h3>
        <ul>
        <li><b>九子棋</b>：各 9 子。先輪流擺放，再移動到相鄰空點；某方只剩 3 子時可飛到任何空點。三子連成一條線（成磨）可吃掉對手一子（不在磨中的優先，全在磨中才可吃磨內的）。對手少於 3 子或無步可走就輸；連續 80 手沒有吃子判和。</li>
        <li><b>曼卡拉（Kalah）</b>：每排 6 洞、每洞 4 顆。選自己的洞逆時針逐洞播種，經過自己的庫但跳過對手的庫。最後一顆落在自己的庫再玩一次；落在自己的空洞且對面有子，就吃掉對面全部加這一顆進庫。任一排清空時，另一排剩的歸那排的主人，庫多者勝。下排是玩家 1（由左往右播），上排是玩家 2（由右往左）。</li>
        <li><b>點格棋</b>：5×5 點（4×4 格）或 7×7 點（6×6 格）。輪流畫一條邊；畫完一格的第四邊就得一格並再畫一條。格數多者勝，可能平手。</li>
        <li><b>Hex</b>：紅方連上下、藍方連左右（9×9 或 11×11），沒有和局。可開「換邊規則（pie rule）」：先手下第一子後，後手可選擇換邊，場上那子翻轉成後手的顏色，再由對方下。電腦的換邊判斷只是粗略規則（落在中央區就換）。</li>
        <li><b>狐狸與鵝</b>：33 點十字盤，13 隻鵝在下方、1 隻狐狸在中央；鵝先走，只能往上或左右一步；狐狸可上下左右一步，或跳過相鄰的鵝（吃掉，一次只跳一次、可不跳）。狐狸無路可走鵝勝；鵝被吃到 5 隻以下、鵝無步可走或 300 手仍未困住則狐狸勝 / 和（300 手為和）。你可選執鵝或執狐。</li>
        <li><b>六子棋（Connect6）</b>：15×15，黑先下 1 子，之後雙方每手下 2 子，橫直斜連成 6 子（含以上）獲勝。</li>
        <li><b>連珠（Renju）</b>：15×15，黑先，連 5 子獲勝。黑棋有禁手：長連（6 子以上）、雙四（同時兩個四，含同一線兩個）、雙三（同時兩個活三，且活三變活四的那一步本身不是禁手才算）；黑下禁手點會被拒絕並標示「×」；黑剛好連成恰 5 子時優先算贏，不算禁手。白棋沒有禁手，連 5 子以上都贏。本頁不含開局限制（天元、交換）。</li>
        </ul>
        <h3>範例</h3>
        <div class="eg">曼卡拉：下排 4 顆的第 3 洞（由左數）播 4 顆，剛好最後一顆落進自己的庫，所以再玩一次。</div>
        <div class="eg">連珠：黑棋橫向有兩子、直向也有兩子，再下交會點會同時形成兩個活三，是「雙三」禁手，會被拒絕。</div>
        <h3>小提醒</h3>
        <ul>
        <li>戰績（每種棋 × 難度的勝 / 負 / 和）與選項存在這支瀏覽器；只計「對電腦」。「清除戰績」會先確認、無法復原。資料量固定（7 種 × 3 難度），不會越存越多；壞掉的存檔載入時會補回預設。</li>
        <li>進行中的棋局不會存檔，離開頁面就結束。</li>
        <li>困難電腦手機上每步最多思考約 0.4 秒，思考時分批讓出畫面，不會卡住。</li>
        <li>勝利連線 / 贏家棋子會閃爍；系統開啟「減少動態效果」時不閃。</li>
        </ul>

    <script>
// --- pure ---
const ABG = {};
function mkRng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pickR(a, R) { return a[Math.floor(R() * a.length)]; }
function shufR(a, R) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function evalOf(G, s, pl) { return s.over ? (s.over.w === pl ? 1e5 : s.over.w === -1 ? 0 : -1e5) : G.eval(s, pl); }
function ordEval(G, S) { const ms = G.moves(S); const v = new Map(); for (const m of ms) v.set(m, evalOf(G, G.apply(S, m), S.p)); return ms.sort((a, b) => v.get(b) - v.get(a)); }

// 限深（含時間預算）alpha-beta 迭代加深；每加深一層 yield 一次，讓頁面有機會喘息
function* abRoot(G, S, R, opt) {
    const pl = S.p, deadline = Date.now() + (opt.ms || 300), maxD = opt.depth || 8;
    let nodes = 0, stop = false;
    const T = (s, d, al, be) => {
        if (s.over) return s.over.w === pl ? 1e6 + d : s.over.w === -1 ? 0 : -1e6 - d;
        if (d <= 0) return G.eval(s, pl);
        if ((++nodes & 127) === 0 && Date.now() > deadline) stop = true;
        if (stop) return 0;
        const ms = G.order(s);
        if (!ms.length) return G.eval(s, pl);
        const mx = s.p === pl; let best = mx ? -Infinity : Infinity;
        for (const m of ms) {
            const v = T(G.apply(s, m), d - 1, al, be);
            if (stop) return 0;
            if (mx) { if (v > best) best = v; if (best > al) al = best; } else { if (v < best) best = v; if (best < be) be = best; }
            if (al >= be) break;
        }
        return best;
    };
    let rootMs = G.order(S), best = rootMs[0];
    for (let d = 1; d <= maxD; d++) {
        let bm = null, bv = -Infinity, al = -Infinity;
        for (const m of rootMs) {
            const v = T(G.apply(S, m), d - 1, al, Infinity);
            if (stop) break;
            if (v > bv) { bv = v; bm = m; al = bv; }
        }
        if (stop || bm === null) break;
        best = bm; rootMs = [bm].concat(rootMs.filter(x => x !== bm));
        if (Math.abs(bv) >= 1e6) break;
        yield;
    }
    return best;
}
function oneply(G, S, R) {
    const ms = G.order ? G.order(S) : G.moves(S); let best = [], bv = -Infinity;
    for (const m of ms) { const v = evalOf(G, G.apply(S, m), S.p); if (v > bv + 1e-9) { bv = v; best = [m]; } else if (Math.abs(v - bv) <= 1e-9) best.push(m); }
    return pickR(best, R);
}
function* thinkGen(G, S, level, R, opt) {
    opt = opt || {};
    const ms = G.moves(S); if (!ms.length) return null;
    if (level === 'easy') return G.randomMove ? G.randomMove(S, R) : pickR(ms, R);
    if (level === 'normal') return G.normal ? G.normal(S, R) : oneply(G, S, R);
    if (G.hard) { return yield* G.hard(S, R, opt); }
    return yield* abRoot(G, S, R, opt);
}
function think(G, S, level, R, opt) { const it = thinkGen(G, S, level, R, opt); let r; while (!(r = it.next()).done); return r.value; }

/* ---------- 九子棋 ---------- */
const NMM_ADJ = [], NMM_MILLS = [], NMM_AT = [], NMM_XY = [];
for (let r = 0; r < 3; r++) for (let k = 0; k < 8; k++) {
    const i = r * 8 + k, a = [r * 8 + (k + 1) % 8, r * 8 + (k + 7) % 8];
    if (k % 2) { if (r > 0) a.push(i - 8); if (r < 2) a.push(i + 8); }
    NMM_ADJ[i] = a;
    const o = r, e = 6 - r; NMM_XY[i] = [[o, o], [3, o], [e, o], [e, 3], [e, e], [3, e], [o, e], [o, 3]][k];
    if (k % 2 === 0) NMM_MILLS.push([i, r * 8 + (k + 1) % 8, r * 8 + (k + 2) % 8]); else if (r === 0) NMM_MILLS.push([k, 8 + k, 16 + k]);
}
for (let i = 0; i < 24; i++) NMM_AT[i] = NMM_MILLS.filter(m => m.includes(i));
const nmmIn = (b, i, p) => NMM_AT[i].some(m => b[m[0]] === p && b[m[1]] === p && b[m[2]] === p);
const nmmCnt = (S, p) => { let n = S.h[p]; for (let i = 0; i < 24; i++) if (S.b[i] === p) n++; return n; };
ABG.nmm = {
    init() { return { g: 'nmm', b: new Int8Array(24).fill(-1), h: [9, 9], p: 0, rm: 0, idle: 0, over: null }; },
    moves(S) {
        if (S.over) return [];
        const p = S.p, b = S.b, o = 1 - p, out = [];
        if (S.rm) {
            const free = [], all = [];
            for (let i = 0; i < 24; i++) if (b[i] === o) { all.push(i); if (!nmmIn(b, i, o)) free.push(i); }
            for (const i of (free.length ? free : all)) out.push({ t: 'r', at: i });
            return out;
        }
        if (S.h[p] > 0) { for (let i = 0; i < 24; i++) if (b[i] < 0) out.push({ t: 'p', to: i }); return out; }
        let n = 0; for (let i = 0; i < 24; i++) if (b[i] === p) n++;
        const fly = n === 3;
        for (let i = 0; i < 24; i++) if (b[i] === p) {
            if (fly) { for (let j = 0; j < 24; j++) if (b[j] < 0) out.push({ t: 'm', f: i, to: j }); }
            else for (const j of NMM_ADJ[i]) if (b[j] < 0) out.push({ t: 'm', f: i, to: j });
        }
        return out;
    },
    apply(S, m) {
        const b = S.b.slice(), h = S.h.slice(), p = S.p; let rm = 0, idle = S.idle;
        if (m.t === 'r') { b[m.at] = -1; idle = 0; }
        else { b[m.to] = p; if (m.t === 'p') h[p]--; else { b[m.f] = -1; idle++; } if (nmmIn(b, m.to, p)) rm = 1; }
        const T = { g: 'nmm', b, h, p: rm ? p : 1 - p, rm, idle, over: null };
        if (m.t === 'r' && nmmCnt(T, 1 - p) < 3) { T.over = { w: p, line: [] }; return T; }
        if (!rm) {
            if (idle >= 80) { T.over = { w: -1, line: [] }; return T; }
            if (T.h[T.p] === 0 && !ABG.nmm.moves(T).length) T.over = { w: p, line: [] };
        }
        return T;
    },
    eval(S, pl) {
        const o = 1 - pl, b = S.b; let s = 100 * (nmmCnt(S, pl) - nmmCnt(S, o));
        for (const m of NMM_MILLS) {
            let a = 0, c = 0;
            for (const i of m) { if (b[i] === pl) a++; else if (b[i] === o) c++; }
            if (a === 3) s += 4; else if (c === 3) s -= 4; else if (c === 0 && a === 2) s += 12; else if (a === 0 && c === 2) s -= 12;
        }
        let mp = 0, mo = 0;
        for (let i = 0; i < 24; i++) if (b[i] >= 0) { let f = 0; for (const j of NMM_ADJ[i]) if (b[j] < 0) f = 1; if (b[i] === pl) mp += f; else mo += f; }

        if (lastIds.includes(i) && !win.has(i)) h += '<circle class="lastm" cx="' + x + '" cy="' + y + '" r=".3"/>';
        if (hintIds.includes(i)) h += '<circle class="hn" cx="' + x + '" cy="' + y + '" r=".48"/>';
        if (can && v < 0) hit += '<rect class="hit" data-i="' + i + '" x="' + (x - .5) + '" y="' + (y - .5) + '" width="1" height="1"/>';
    }
    if (cfg.g === 'rj' && can && S.p === 0) for (const i of lnCands(S)) if (rjForbidden(S.b, i)) { const x = i % LN, y = (i / LN) | 0; h += '<path class="forb" d="M' + (x - .25) + ' ' + (y - .25) + 'L' + (x + .25) + ' ' + (y + .25) + 'M' + (x + .25) + ' ' + (y - .25) + 'L' + (x - .25) + ' ' + (y + .25) + '"/>'; }
    $('info').textContent = cfg.g === 'c6' ? '黑先下 1 子，之後每手 2 子，連 6 獲勝' : '黑有禁手（長連、雙三、雙四，以 × 標示），連 5 獲勝';
    return h + hit + '</svg>';
}
function render() {
    if (!S) return;
    const f = { nmm: rNmm, man: rMan, dab: rDab, hex: rHex, fg: rFg, c6: rLine, rj: rLine }[cfg.g];
    $('boardBox').innerHTML = f();
    $('boardBox').classList.toggle('zoom', cfg.zoom && ['hex', 'c6', 'rj'].includes(cfg.g));
    $('status').textContent = statusText(); note = ''; anim = false;
    const small = ['hex', 'c6', 'rj'].includes(cfg.g);
    $('zoom').hidden = !small; $('zoom').textContent = cfg.zoom ? '縮小' : '放大';
    $('ok').hidden = !small; $('ok').disabled = pend === null || !canHuman();
    $('swap').hidden = !(cfg.g === 'hex' && S.swap && canHuman());
    $('undo').disabled = !hist.length || (cfg.mode === 'cpu' && busy === false && !hist.some(h => h.p === human));
    $('hint').disabled = !canHuman();
}

/* ---- 事件 ---- */
$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-g]'); if (!b) return; cfg.g = b.dataset.g; saveOpts(); renderTabs(); epoch++; busy = false; S = null; $('play').hidden = true; });
for (const id of ['mode', 'level', 'first']) $(id).addEventListener('change', e => { cfg[id] = e.target.value; saveOpts(); renderTabs(); });
$('dabN').addEventListener('change', e => { cfg.dabN = +e.target.value === 7 ? 7 : 5; saveOpts(); });
$('hexN').addEventListener('change', e => { cfg.hexN = +e.target.value === 11 ? 11 : 9; saveOpts(); });
$('pie').addEventListener('change', e => { cfg.pie = e.target.checked; saveOpts(); });
$('start').addEventListener('click', start);
$('again').addEventListener('click', start);
$('undo').addEventListener('click', undo);
$('zoom').addEventListener('click', () => { cfg.zoom = !cfg.zoom; saveOpts(); render(); });
$('ok').addEventListener('click', () => { if (pend !== null && canHuman()) commit(pend); });
$('swap').addEventListener('click', () => { if (canHuman() && S.swap) commit(-1); });
$('hint').addEventListener('click', () => {
    if (!canHuman()) return;
    const m = think(G, S, 'hard', R, { ms: 200, sims: 60 });
    if (m === null || m === undefined) return;
    if (m === -1) { note = '提示：建議換邊'; hintIds = []; } else hintIds = G.ids(m);
    render();
});
$('boardBox').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) onCell(+t.dataset.i); });
$('clearStats').addEventListener('click', () => {
    if (!confirm('清除所有棋類的對電腦戰績？無法復原。')) return;
    stats = loadStats(); for (const k in stats) stats[k] = { w: 0, l: 0, d: 0 };
    Util.store.set('abstractb_stats', stats); renderStats();
});
renderTabs(); renderStats();
    </script>
</body>
