    <template id="help">
        <h3>這是什麼</h3>
        <p>給幼兒到小學低年級的認知練習：數數、加減法、九九乘法、形狀顏色、動物、英文單字、星期月份、認時鐘、認錢幣（新臺幣）、ABC、注音符號、看圖拼字、情緒認識，共 13 個單元。單機玩，不需要網路。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>陪孩子玩幾分鐘認知遊戲，或讓孩子自己點著玩</li>
            <li>想複習剛學過的字母、注音、時鐘、錢幣</li>
        </ul>
        <h3>怎麼玩</h3>
        <ol>
            <li>在主選單點一個單元，選難度（初級 / 中級 / 高級），按「開始！」</li>
            <li>每題點選答案；答錯只會提示「再試一次」，不扣分，換一個答案再點即可</li>
            <li>第一次就答對的題目會得到星星；一局結束有星星摘要</li>
            <li>認時鐘的「撥針」題：拖曳時鐘的指針尖端，或用下方按鈕調整。若要在時鐘上捲動頁面，按「📜 捲動頁面」切換</li>
            <li>認錢幣的「湊錢」題：點錢幣或鈔票放進去，湊到指定金額後按「好了」</li>
            <li>「九九乘法」、「注音」、「星期月份」單元頁下方有乘法表、注音表與今天日期可以看</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">選「數數練習 → 初級」：畫面出現 3 顆 🍎，點「3」就答對，得到一顆星。選「認錢幣 → 高級」：「要付 63 元」，點 50、10、1、1、1 後按「好了」。</div>
        <h3>小提醒</h3>
        <ul>
            <li>「家長設定」要先算一題簡單的加法才能進入；可調預設難度、題數、朗讀與提示音（預設都是靜音）</li>
            <li>朗讀用的是裝置內建語音，沒有語音的裝置不會出現朗讀按鈕；「聽音選字母」在沒有語音時改成別的題型</li>
            <li>統計存在這個瀏覽器（鍵 kidsl_stats：13 個單元 × 3 個難度各一組，大小固定，不會無限增長；設定鍵 kidsl_opts），可用右上角 💾 備份；「家長設定」裡的「清除全部統計」會刪除全部統計，無法復原（設定會保留）</li>
            <li>壞掉或缺欄位的備份資料會自動補成預設值，不會讓頁面壞掉；本頁不蒐集個人資料</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const UNITS = [
            { id: 'count', ic: '🔢', name: '數數練習', desc: '看圖數一數，選出正確的數字' },
            { id: 'add', ic: '➕', name: '加減法', desc: '用圖示做一位數到 20 的加減法' },
            { id: 'mul', ic: '✖️', name: '九九乘法', desc: '用排列的圖案理解乘法，再練習乘法表' },
            { id: 'shape', ic: '🔺', name: '形狀與顏色', desc: '認識顏色與形狀，並說出名字' },
            { id: 'animal', ic: '🐶', name: '動物認識', desc: '動物配名稱，還有叫聲的擬聲詞' },
            { id: 'word', ic: '🍎', name: '英文單字卡', desc: '看圖片學英文單字' },
            { id: 'cal', ic: '📆', name: '星期與月份', desc: '星期、月份、昨天、今天、明天' },
            { id: 'clock', ic: '🕒', name: '認時鐘', desc: '讀時鐘，也能自己撥指針' },
            { id: 'money', ic: '🪙', name: '認識錢幣', desc: '新臺幣硬幣與鈔票、湊錢、找錢' },
            { id: 'abc', ic: '🔠', name: 'ABC 字母', desc: '大小寫配對、字母順序、聽音選字' },
            { id: 'zhuyin', ic: 'ㄅ', name: '注音符號', desc: '認注音符號與四個聲調' },
            { id: 'spell', ic: '🔡', name: '看圖拼字', desc: '看圖片，把字母排成英文單字' },
            { id: 'emo', ic: '😊', name: '情緒認識', desc: '表情與心情詞彙配對' },
        ];
        const UNIT_IDS = UNITS.map(u => u.id);
        const LV_NAMES = ['🌱 初級', '🌿 中級', '🌳 高級'];

        const shuf = (a, rand) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const pick = (a, rand) => a[Math.floor(rand() * a.length)];
        const ri = (lo, hi, rand) => lo + Math.floor(rand() * (hi - lo + 1));
        const ckey = (c) => c.t + '|' + (c.c || '') + '|' + (c.d || '');
        // 選項：n 個（預設 4）= 正確答案 + 池中不重複的干擾；洗牌用傳入的 rand，所以同種子結果相同
        function mkChoices(correct, pool, rand, n = 4) {
            const seen = new Set([ckey(correct)]), out = [];
            for (const x of shuf(pool, rand)) { if (out.length >= n - 1) break; if (seen.has(ckey(x))) continue; seen.add(ckey(x)); out.push({ ...x, ok: false }); }
            out.push({ ...correct, ok: true });
            return shuf(out, rand);
        }
        const nearNums = (v, lo, hi, k = 6) => { const o = []; for (let i = lo; i <= hi; i++) if (i !== v) o.push(i); return o.sort((a, b) => Math.abs(a - v) - Math.abs(b - v) || a - b).slice(0, k).map(x => ({ t: String(x) })); };
        const numChoices = (v, rand) => mkChoices({ t: String(v) }, [v - 10, v - 5, v - 2, v - 1, v + 1, v + 2, v + 5, v + 10].filter(x => x > 0).map(x => ({ t: String(x) })), rand);
        const ICONS = ['🍎', '⭐', '🐟', '🚗', '🎈', '🐥', '🍪', '🌸'];

        // 數數
        function genCount(lv, rand) {
            const max = [5, 10, 20][lv - 1], n = ri(1, max, rand), ic = pick(ICONS, rand);
            return { unit: 'count', text: '有幾個？', big: ic.repeat(n), choices: mkChoices({ t: String(n) }, nearNums(n, 1, max), rand), ans: String(n), say: { text: String(n), lang: 'zh-TW' } };
        }
        // 加減法（圖示）
        function genAdd(lv, rand) {
            const max = [5, 10, 20][lv - 1], ic = pick(ICONS, rand), sub = rand() < 0.4;
            let a, b, r;
            if (!sub) { r = ri(2, max, rand); a = ri(1, r - 1, rand); b = r - a; } else { a = ri(2, max, rand); b = ri(1, a - 1, rand); r = a - b; }
            return { unit: 'add', text: `${a} ${sub ? '−' : '＋'} ${b} ＝ ?`, add: { ic, a, b, sub }, choices: mkChoices({ t: String(r) }, nearNums(r, 0, max), rand), ans: String(r) };
        }
        // 九九乘法：1 = 看陣列數總數；2 = a × b；3 = a × ? = p
        function genMul(lv, rand) {
            const [alo, ahi, blo, bhi] = [[2, 5, 1, 5], [2, 9, 2, 9], [2, 9, 2, 9]][lv - 1], a = ri(alo, ahi, rand), b = ri(blo, bhi, rand), p = a * b, ic = pick(ICONS, rand);
            if (lv === 3) {
                const pool = []; for (let i = 1; i <= 9; i++) if (i !== b) pool.push({ t: String(i) });
                return { unit: 'mul', text: `${a} × ? ＝ ${p}`, choices: mkChoices({ t: String(b) }, pool, rand), ans: String(b) };
            }
            const pool = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, p + 1, p - 1, p + 2].filter(x => x > 0 && x !== p).map(x => ({ t: String(x) }));
            return { unit: 'mul', text: lv === 1 ? `${a} 排，每排 ${b} 個，一共幾個？` : `${a} × ${b} ＝ ?`, arr: { ic, rows: a, cols: b }, choices: mkChoices({ t: String(p) }, pool, rand), ans: String(p) };
        }
        // 形狀與顏色（顏色與形狀是這個單元專屬的圖形色，不跟隨風格）
        const COLORS = [['紅色', '#e53935'], ['藍色', '#1e88e5'], ['黃色', '#f9a825'], ['綠色', '#43a047'], ['橘色', '#fb8c00'], ['紫色', '#8e24aa']];
        const SHAPES = [['圓形', '●'], ['正方形', '■'], ['三角形', '▲'], ['星形', '★'], ['愛心', '♥'], ['菱形', '◆']];
        function genShape(lv, rand) {

        function mulArray(ic, rows, cols) {

        // 遊戲流程

        function nextQ() {

        // 時鐘
        const NS = 'http://www.w3.org/2000/svg';
        const sv = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
        function buildClock(h, m) {

            const hh = sv('line', { x1: 100, y1: 100, class: 'hh' }), mh = sv('line', { x1: 100, y1: 100, class: 'mh' }), hd = sv('circle', { r: 13, class: 'hd' }), md = sv('circle', { r: 13, class: 'hd' });
