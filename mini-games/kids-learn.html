<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="兒童遊樂園：學習 13 單元與遊樂 5 遊戲。學習：數數、加減法、九九乘法、形狀顏色、動物、英文單字、星期月份、認時鐘、認錢幣、ABC、注音、看圖拼字、情緒認識；遊樂：找不同、點點連線、著色、拼貼、節奏拍手。大按鈕、溫和鼓勵，單機離線可玩。">
    <meta property="og:title" content="兒童遊樂園" />
    <meta property="og:description" content="13 種認知練習加找不同、點點連線、著色、拼貼、節奏拍手，大按鈕、溫和鼓勵、家長設定。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/mini-games/kids-learn.html" />
    <meta name="st-keys" content="kidsl_stats,kidsl_opts,kidsl_tab,kidsp_progress">
    <title>兒童遊樂園</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 640px;
        }

        .wrap button {
            min-height: 56px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ubtn {
            min-height: 96px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .ubtn .ic {
            font-size: 36px;
            line-height: 1.1;
        }

        .ubtn small {
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
        }

        .lv button {
            flex: 1;
            font-size: 17px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: var(--muted);
        }

        .qtext {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 12px 0 4px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .qbig {
            text-align: center;
            font-size: clamp(34px, 10vw, 46px);
            line-height: 1.3;
            margin: 6px 0;
            overflow-wrap: anywhere;
            word-break: break-all;
        }

        .qbig.huge {
            font-size: clamp(72px, 26vw, 120px);
            line-height: 1.1;
        }

        .qbig .grp {
            display: inline-block;
            margin: 0 6px;
        }

        .qbig .gone {
            opacity: .22;
        }

        .arr {
            display: grid;
            gap: 2px;
            justify-content: center;
            margin: 8px auto;
            font-size: clamp(16px, 5.4vw, 26px);
            line-height: 1.1;
            text-align: center;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .choices button {
            min-height: 72px !important;
            font-size: 26px;
            font-weight: 700;
            padding: 6px;
            overflow-wrap: anywhere;
        }

        .choices button.ok,
        .tile.ok {
            outline: 4px solid var(--ok);
        }

        .choices button.try {
            opacity: .4;
        }

        #fb {
            min-height: 34px;
            text-align: center;
            font-size: 20px;
            margin: 10px 0 4px;
            overflow-wrap: anywhere;
        }

        #fb.ok {
            color: var(--ok);
        }

        #fb.try {
            color: var(--muted);
        }

        @media (prefers-reduced-motion: no-preference) {
            #fb.ok {
                animation: pop .35s ease-out;
            }

            @keyframes pop {
                0% {
                    transform: scale(.6);
                    opacity: 0;
                }

                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
        }

        .coin,
        .bill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid var(--text);
            background: var(--fill);
            color: var(--text);
            flex: none;
        }

        .coin {
            border-radius: 50%;
        }

        .bill {
            border-radius: 6px;
            width: 74px;
            height: 38px;
            font-size: 16px;
        }

        .coin.c1 {
            width: 30px;
            height: 30px;
            font-size: 13px;
        }

        .coin.c5 {
            width: 34px;
            height: 34px;
            font-size: 14px;
        }

        .coin.c10 {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .coin.c50 {
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        .pile {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
            min-height: 44px;
        }

        .den {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .den button {
            padding: 4px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .den .bill {
            width: 100%;
            max-width: 74px;
        }

        .tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }

        .tile {
            min-width: 56px;
            font-size: 28px;
            font-weight: 700;
        }

        .slots {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .slots span {
            width: 44px;
            height: 52px;
            border-bottom: 4px solid var(--line);
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            line-height: 52px;
        }

        .clock {
            display: block;
            width: min(72vw, 300px);
            margin: 6px auto;
        }

        .clock .face {
            fill: var(--card);
            stroke: var(--text);
            stroke-width: 3;
        }

        .clock .num {
            fill: var(--text);
            font-size: 17px;
            font-weight: 700;
        }

        .clock .tk {
            stroke: var(--muted);
            stroke-width: 1;
        }

        .clock .hh {
            stroke: var(--text);
            stroke-width: 7;
            stroke-linecap: round;
        }

        .clock .mh {
            stroke: var(--blue);
            stroke-width: 4;
            stroke-linecap: round;
        }

        .clock .hd {
            fill: var(--blue);
            opacity: .3;
        }

        .clock.drag {
            touch-action: none;
        }

        .readout {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mt {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 2px;
            font-size: 13px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .mt span {
            padding: 4px 0;
            border-radius: 4px;
            background: var(--fill);
        }

        .mt .hd {
            font-weight: 700;
            background: none;
            color: var(--muted);
        }

        .mt .on {
            background: var(--blue);
            color: var(--on-blue);
        }

        .zy {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }

        .zy span {
            min-width: 44px;
            text-align: center;
            font-size: 26px;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            background: var(--fill);
        }

        .res {
            text-align: center;
        }

        .res .stars {
            font-size: 52px;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .tbl td,
        .tbl th {
            padding: 6px 4px;
            border-bottom: 1px solid var(--line);
            text-align: center;
        }

        .tbl td:first-child,
        .tbl th:first-child {
            text-align: left;
        }

        .gate input {
            font-size: 24px;
            width: 7em;
            text-align: center;
            min-height: 56px;
        }

        #pane-play .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        #pane-play .row.c { justify-content: center; }
        #pane-play .muted { color: var(--muted); font-size: 14px; }
        .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
        .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 58px; font-size: 13px; line-height: 1.2; }
        .tabs button i { font-style: normal; font-size: 24px; }
        .msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 1.6em; margin: 8px 0; }
        .big { min-height: 52px; font-size: 18px; padding-left: 18px; padding-right: 18px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .chips button { min-width: 48px; min-height: 48px; padding: 0 8px; font-size: 22px; position: relative; }
        .chips button b { position: absolute; right: 2px; top: -2px; font-size: 14px; color: var(--ok); }

        .grid { display: grid; gap: 4px; margin-bottom: 8px; }
        .grid button { aspect-ratio: 1; padding: 0; line-height: 1; overflow: hidden; border-radius: 12px; font-size: calc(min(100vw - 56px, 440px) / var(--cols) * .5); }
        .grid button.found { outline: 4px solid var(--ok); }
        .grid button.hint { outline: 4px dashed var(--blue); }
        @media (prefers-reduced-motion: no-preference) { .grid button.found { animation: ppop .3s; } }
        @keyframes ppop { 50% { transform: scale(1.12); } }

        .paper { display: block; width: 100%; aspect-ratio: 1; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); }
        #dSvg { touch-action: none; }
        #g-dots.pan #dSvg { touch-action: pan-y; }
        #cSvg { background: #fff; }
        #tSvg { background: #fff; touch-action: pan-y; }
        #tSvg g { touch-action: none; cursor: grab; }
        .pal { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; justify-content: center; }
        .pal button { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; border: 3px solid var(--line); }
        .pal button[aria-pressed=true] { border-color: var(--text); outline: 3px solid var(--blue); }
        #dSvg .ln { stroke: var(--blue); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        #dSvg .dot { fill: var(--fill); stroke: var(--text); stroke-width: .5; }
        #dSvg .dot.on { fill: var(--blue); }
        #dSvg .dot.nx { stroke: var(--blue); stroke-width: 1.2; }
        #dSvg text { font-size: 3.6px; fill: var(--text); text-anchor: middle; pointer-events: none; font-weight: 700; }
        #dSvg .dot.on + text { fill: var(--on-blue); }
        #dSvg .done { fill: var(--ok); opacity: .35; }

        #tl { position: relative; height: 56px; background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--line); margin-bottom: 10px; overflow: hidden; }
        #tl .t { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--fill); border: 3px solid var(--blue); }
        #tl .t.perfect { background: #ffd60a; border-color: #ff9f0a; }
        #tl .t.good { background: var(--ok); border-color: var(--ok); }
        #tl .t.early, #tl .t.late { background: #ff9f0a; border-color: #ff9f0a; }
        #tl .t.miss { background: var(--line); border-color: var(--muted); }
        #head { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--bad); left: 0; }
        #pad { width: 100%; min-height: 150px; border-radius: 50%; max-width: 220px; aspect-ratio: 1; display: block; margin: 0 auto 12px; font-size: 40px; touch-action: manipulation; background: var(--blue); color: var(--on-blue); }
        #pad:active { filter: brightness(1.2); }
        input.num { width: 90px; font-size: 18px; text-align: center; }

        .top { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .top button { font-size: 18px; font-weight: 700; }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>🧸 兒童遊樂園</h1>
        <p class="sub">學習 13 單元、遊樂 5 個遊戲，選一個開始玩吧！</p>
        <div class="top" id="topTabs">
            <button data-t="learn" aria-pressed="true">📚 學習</button>
            <button data-t="play" aria-pressed="false">🎮 遊樂</button>
        </div>

        <div id="pane-learn">

        <section id="home">
            <div class="grid2" id="units"></div>
            <div class="row" style="margin-top:14px"><button id="parentBtn" style="flex:1">👨‍👩‍👧 家長設定</button></div>
        </section>

        <section id="unit" hidden>
            <div class="card">
                <div class="row"><button id="uBack">‹ 回主選單</button></div>
                <h2 id="uTitle"></h2>
                <p class="muted" id="uDesc"></p>
                <div class="row lv" id="lvBtns"></div>
                <p class="note" id="uStat"></p>
                <div class="row" style="margin-top:10px"><button class="primary" id="startBtn" style="flex:1">開始！</button></div>
            </div>
            <div id="extras"></div>
        </section>

        <section id="play" class="card" hidden>
            <div class="hud"><button class="sm" id="quit">‹ 離開</button><span id="prog"></span><span id="starsHud">⭐ 0</span></div>
            <div class="qtext" id="qtext"></div>
            <div class="qbig" id="qbig"></div>
            <div id="qextra"></div>
            <div class="choices" id="choices"></div>
            <div id="fb" role="status"></div>
            <div class="row"><button id="sayBtn" hidden style="flex:1">🔊 聽聽看</button><button class="primary" id="nextBtn" hidden style="flex:1">下一題 ›</button></div>
        </section>

        <section id="result" class="card res" hidden>
            <div class="stars" id="rStars"></div>
            <h2 id="rTitle"></h2>
            <p id="rLine"></p>
            <div class="row" style="justify-content:center"><button class="primary" id="again">再玩一次</button><button id="toHome">回主選單</button></div>
        </section>

        <section id="parent" hidden>
            <div class="card gate" id="gate">
                <div class="row"><button id="gBack">‹ 回主選單</button></div>
                <h2>家長設定</h2>
                <p>給大人的小關卡：請算出答案才能進入。</p>
                <div class="row"><b id="gQ" style="font-size:24px"></b><input id="gA" type="text" inputmode="numeric" autocomplete="off" aria-label="答案"><button class="primary" id="gGo">進入</button></div>
                <p class="note" id="gMsg"></p>
            </div>
            <div id="pPanel" hidden>
                <div class="card">
                    <div class="row"><button id="pBack">‹ 回主選單</button></div>
                    <h2>家長設定</h2>
                    <div class="note" style="margin:6px 0">預設難度</div>
                    <div class="row lv" id="pLv"></div>
                    <div class="note" style="margin:10px 0 6px">每局題數</div>
                    <div class="row lv" id="pQ"></div>
                    <label class="row" style="margin-top:10px;min-height:56px" id="pSpeakRow"><input type="checkbox" id="pSpeak"> 自動朗讀題目（需要裝置有語音）</label>
                    <label class="row" style="min-height:56px"><input type="checkbox" id="pBeep"> 答對時發出提示音</label>
                </div>
                <div class="card">
                    <h2>學習統計</h2>
                    <p class="note" style="margin-top:0">每格是「第一次就答對 / 答題數」，只存在這台裝置，不蒐集任何個資。</p>
                    <div id="pStat"></div>
                    <div class="row" style="margin-top:10px"><button id="pClear">清除全部統計</button></div>
                    <p class="note" id="pMsg"></p>
                </div>
            </div>
        </section>
        </div>

        <div id="pane-play" hidden>
        <div class="row">
            <button id="snd" class="sm" aria-pressed="false">🔇 聲音：關</button>
            <button id="pParentBtn" class="sm">🔒 家長設定</button>
        </div>

        <div class="card" id="pParent" hidden>
            <div id="pGate">
                <div class="row"><b id="gq"></b><input id="ga" class="num" inputmode="numeric" aria-label="答案"><button class="primary" id="gok">確定</button></div>
                <div class="muted" id="gmsg">請大人回答這題，才能進入家長設定</div>
            </div>
            <div id="pset" hidden>
                <div class="row"><label for="lv">難度（找不同、節奏）</label>
                    <select id="lv"><option value="1">簡單</option><option value="2">普通</option><option value="3">困難</option></select></div>
                <div class="muted" id="stats"></div>
                <div class="row" style="margin-top:10px"><button id="clr">清除全部紀錄</button></div>
            </div>
            <div class="row"><button class="sm" id="pclose">關閉</button></div>
        </div>

        <div class="tabs" id="tabs">
            <button data-g="spot" aria-pressed="true"><i>🔍</i>找不同</button>
            <button data-g="dots" aria-pressed="false"><i>🔢</i>點點連線</button>
            <button data-g="color" aria-pressed="false"><i>🖍️</i>著色</button>
            <button data-g="shape" aria-pressed="false"><i>🔷</i>拼貼</button>
            <button data-g="rhythm" aria-pressed="false"><i>👏</i>節奏</button>
        </div>

        <div class="card" id="g-spot">
            <div class="muted" id="spotInfo"></div>
            <div class="grid" id="spA"></div>
            <div class="grid" id="spB"></div>
            <div class="msg" id="spotMsg" role="status" aria-live="polite"></div>
            <div class="row c"><button id="spotHint" class="big">💡 提示</button><button id="spotNew" class="big primary">換一題</button></div>
        </div>

        <div class="card" id="g-dots" hidden>
            <div class="chips" id="dChips"></div>
            <svg id="dSvg" class="paper" viewBox="0 0 100 100" role="img" aria-label="點點連線畫布"></svg>
            <div class="msg" id="dMsg" role="status" aria-live="polite"></div>
            <div class="row c"><button id="dReset" class="big">重畫</button><label class="muted"><input type="checkbox" id="dPan"> 捲動頁面</label></div>
        </div>

        <div class="card" id="g-color" hidden>
            <div class="chips" id="cChips"></div>
            <svg id="cSvg" class="paper" viewBox="0 0 100 100" role="img" aria-label="著色線稿"></svg>
            <div class="pal" id="cPal"></div>
            <div class="row c"><button id="cClear" class="big">清除</button><button id="cSave" class="big primary">存成圖片</button></div>
        </div>

        <div class="card" id="g-shape" hidden>
            <svg id="tSvg" class="paper" viewBox="0 0 100 100" role="img" aria-label="拼貼畫布"></svg>
            <div class="chips" id="tAdd" style="margin-top:10px"></div>
            <div class="row c" id="tTools">
                <button data-a="rl" aria-label="向左轉">↺</button><button data-a="rr" aria-label="向右轉">↻</button>
                <button data-a="big" aria-label="放大">＋</button><button data-a="small" aria-label="縮小">－</button>
                <button data-a="del">刪除</button>
            </div>
            <div class="pal" id="tPal"></div>
            <div class="msg" id="tMsg" role="status" aria-live="polite"></div>
            <div class="row c"><button id="tClear" class="big">全部清空</button><button id="tSave" class="big primary">存成圖片</button></div>
        </div>

        <div class="card" id="g-rhythm" hidden>
            <div class="muted" id="rInfo"></div>
            <div id="tl"><div id="head"></div></div>
            <div class="msg" id="rMsg" role="status" aria-live="polite">按「開始」，預備 4 拍後跟著拍手</div>
            <button id="pad" aria-label="拍手">👏</button>
            <div class="row c"><button id="rStart" class="big primary">開始</button></div>
            <div class="row c"><button id="latM" class="sm">延遲 −10</button><b id="latV">0 ms</b><button id="latP" class="sm">＋10</button><button id="calib" class="sm">校正</button></div>
        </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>給幼兒到小學低年級的小遊戲合集，分兩個分頁：<b>學習</b>（數數、加減法、九九乘法、形狀顏色、動物、英文單字、星期月份、認時鐘、認錢幣（新臺幣）、ABC、注音符號、看圖拼字、情緒認識，共 13 個單元）與<b>遊樂</b>（找不同、點點連線、著色線稿、形狀拼貼、節奏拍手）。按鈕大、答錯不扣分、單機離線、不蒐集任何個資。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>陪孩子玩幾分鐘認知遊戲，或讓孩子自己點著玩、等待時打發時間</li>

        const numChoices = (v, rand) => mkChoices({ t: String(v) }, [v - 10, v - 5, v - 2, v - 1, v + 1, v + 2, v + 5, v + 10].filter(x => x > 0).map(x => ({ t: String(x) })), rand);

        // 時鐘（h = 1..12）
        const pad2 = (n) => String(n).padStart(2, '0');

        const angleToMin = (deg) => (Math.round((((deg % 360) + 360) % 360) / 30) * 5) % 60;                // 吸附到 5 分鐘

        function genClock(lv, rand) {

        }
        $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.g); };
        $('#snd').onclick = () => { snd = !snd; $('#snd').setAttribute('aria-pressed', snd); $('#snd').textContent = snd ? '🔊 聲音：開' : '🔇 聲音：關'; if (snd) tone(440, 60, { vol: .05 }); };
        let GQ = null;
        const gateNew = () => { GQ = gateQ(rnd); $('#gq').textContent = GQ.text; $('#ga').value = ''; };
        function statsShow() {
            $('#lv').value = prog.lv;
            $('#stats').textContent = `找不同完成 ${prog.spot.map(s => s[0]).join(' / ')} 場（簡單 / 普通 / 困難） ・ 節奏最高 ${prog.rhy.join(' / ')} 分 ・ 點點連線完成 ${prog.dots.filter(Boolean).length} / ${DOTS.length} 個`;
        }
        $('#pParentBtn').onclick = () => { $('#pParent').hidden = false; $('#pGate').hidden = false; $('#pset').hidden = true; $('#gmsg').textContent = '請大人回答這題，才能進入家長設定'; gateNew(); $('#ga').focus(); };
        $('#gok').onclick = () => {
            if (gateOk(GQ, $('#ga').value)) { $('#pGate').hidden = true; $('#pset').hidden = false; statsShow(); }
            else { $('#gmsg').textContent = '答案不對，換一題再試'; gateNew(); }
        };
        $('#ga').addEventListener('keydown', e => { if (e.key === 'Enter') $('#gok').click(); });
        $('#pclose').onclick = () => { $('#pParent').hidden = true; };
        $('#lv').onchange = () => { prog.lv = +$('#lv').value; save(); spotNew(); rInfo(); rhythmStop(); };
        $('#clr').onclick = () => {
            if (!confirm('清除全部紀錄（找不同完成場數與最快時間、節奏最高分與延遲設定、點點連線完成圖案、難度）？無法復原。不會影響別的工具。')) return;
            try { localStorage.removeItem(KEY); } catch (e) { }
            prog = defProg(); statsShow(); spotNew(); dChips(); rInfo(); latShow();
        };

        // 第一次切到「遊樂」才建立畫面
        let playReady = false;
        function playInit() { if (playReady) return; playReady = true; spotNew(); dotsOpen(0); colorOpen(0); clRender(); palette($('#cPal'), c => { CS.col = c; }); }

        // ---------- 頂層分頁：學習 / 遊樂（記在 kidsl_tab，壞值回到學習）----------
        const TAB_KEY = 'kidsl_tab', cleanTab = (v) => v === 'play' ? 'play' : 'learn';
        function showTab(t, remember) {
            t = cleanTab(t);
            $$('#topTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            $('#pane-learn').hidden = t !== 'learn'; $('#pane-play').hidden = t !== 'play';
            if (t === 'play') playInit(); else if (playReady) { rhythmStop(); CB = null; }
            if (remember) store.set(TAB_KEY, t);
        }
        $('#topTabs').onclick = (e) => { const b = e.target.closest('button'); if (b) showTab(b.dataset.t, true); };
        showTab(store.get(TAB_KEY, null), false);
    </script>
</body>

</html>
