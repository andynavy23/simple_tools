<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="演算法實驗室：康威生命遊戲（細胞自動機，可編輯規則、圖樣庫）與排序演算法視覺化（泡沫、選擇、插入、合併、快速、堆積、希爾），可暫停與單步。">
    <meta property="og:title" content="演算法實驗室" />
    <meta property="og:description" content="生命遊戲與排序演算法動畫。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/algo-lab.html" />
    <title>演算法實驗室</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 720px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tabs button {
            flex: 1 1 auto;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin: 8px 0;
        }

        .row label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            min-height: 44px;
        }

        .row input[type=range] {
            flex: 1 1 120px;
            min-width: 0;
        }

        .row input[type=text] {
            width: 8em;
        }

        canvas {
            display: block;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: var(--bg);
        }

        #lfc {
            aspect-ratio: 1;
            max-width: 560px;
            margin: 0 auto;
        }

        #soc {
            aspect-ratio: 2 / 1;
        }

        .stats {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--muted);
            margin: 8px 0;
        }

        .stats b {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .err {
            color: var(--bad);
            min-height: 1.3em;
            font-size: 14px;

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>演算法實驗室</h1>
        <p class="sub">用動畫看演算法怎麼跑：生命遊戲、排序演算法。</p>

        <div class="tabs" id="tabs">
            <button data-t="lf" aria-pressed="true">生命遊戲</button>
            <button data-t="so" aria-pressed="false">排序視覺化</button>
        </div>

        <div id="tab-lf">
            <div class="card">
                <canvas id="lfc" aria-label="生命遊戲盤面，點擊或拖曳畫細胞"></canvas>
                <div class="stats"><span>世代 <b id="lfGen">0</b></span><span>人口 <b id="lfPop">0</b></span></div>
                <div class="row">
                    <button class="primary" id="lfPlay">播放</button>
                    <button id="lfStep">單步</button>
                    <button id="lfRand">隨機填充</button>
                    <button id="lfClear">清空</button>
                    <button id="lfScroll" aria-pressed="true">捲動頁面：開</button>
                </div>
                <div class="row">
                    <label>速度 <input type="range" id="lfSpeed" min="1" max="30" value="8" aria-label="速度"></label>
                    <label><input type="checkbox" id="lfWrap"> 環形邊界</label>
                    <label>大小 <select id="lfSize" aria-label="盤面大小"><option value="40">40×40</option><option value="60" selected>60×60</option><option value="90">90×90</option></select></label>
                </div>
                <div class="row">
                    <select id="lfPat" aria-label="圖樣"></select>
                    <button id="lfPlace">放置圖樣</button>
                    <label>規則 <input type="text" id="lfRule" value="B3/S23" spellcheck="false" autocomplete="off" aria-label="規則 B/S 記法"></label>
                </div>
                <div class="err" id="lfErr" role="alert"></div>
            </div>
        </div>

        <div id="tab-so" hidden>
            <div class="card">
                <canvas id="soc" aria-label="排序長條圖"></canvas>
                <div class="stats"><span>比較 <b id="soC">0</b></span><span>交換 <b id="soS">0</b></span><span>寫入 <b id="soW">0</b></span><span id="soInfo"></span></div>
                <div class="row">
                    <select id="soAlgo" aria-label="演算法"></select>
                    <select id="soDist" aria-label="資料分布"><option value="random">隨機</option><option value="nearly">近乎排序</option><option value="reversed">反向</option><option value="dups">大量重複值</option></select>
                </div>
                <div class="row">
                    <label>數量 <b id="soNv">50</b> <input type="range" id="soN" min="10" max="200" value="50" aria-label="資料量"></label>
                    <label>速度 <input type="range" id="soSpeed" min="1" max="100" value="40" aria-label="速度"></label>
                </div>
                <div class="row">
                    <button class="primary" id="soPlay">開始</button>
                    <button id="soStep">單步</button>
                    <button id="soNew">重新產生資料</button>
                </div>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>兩個演算法小實驗：「生命遊戲」是康威的細胞自動機，「排序視覺化」把常見排序一步一步畫成長條圖。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想看懂排序演算法的差別、比較次數與資料分布的關係。</li>
        <li>想玩玩看簡單規則如何長出複雜圖案。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>生命遊戲：點或拖曳盤面畫細胞（從空格開始是畫、從活細胞開始是擦）；「播放 / 單步」演化；可選圖樣庫放到盤面中央；規則用 B/S 記法，例如 <b>B3/S23</b>（標準）、B36/S23（HighLife）、B2/S（Seeds）。</li>
        <li>手機上預設「捲動頁面：開」，手指拖過盤面會捲動頁面（點一下仍可畫單格）；要拖曳畫大片細胞時，先按一下改成「捲動頁面：關」。</li>
        <li>排序視覺化：選演算法、資料量（10–200）與分布，按「開始」或一直按「單步」；紅色是正在比較、綠色是剛寫入 / 交換，完成後全部變綠。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">放「滑翔機」播放，每 4 代它會往右下移 1 格；「閃爍器」週期 2；「高斯珀滑翔機槍」每 30 代射出一隻滑翔機。選「反向」資料比較泡沫與合併排序的比較次數差很多。</div>
        <h3>小提醒</h3>
        <ul>
        <li>這頁不儲存任何資料，重新整理就回到初始狀態。</li>
        <li>系統設定「減少動態效果」時，播放速度會被限制得很慢，建議用單步看。</li>
        <li>穩定排序：泡沫、插入、合併；選擇、快速、堆積、希爾不穩定（相同大小的元素相對順序可能改變）。</li>
        <li>計數單位：交換 = 兩個位置互換；寫入 = 把值寫進某位置（合併排序用）。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // ===== 生命遊戲 =====
        // 規則 'B3/S23' → { b: 長度 9 的布林陣列, s: 同 }；格式錯回傳 null
        function parseRule(str) {
            const m = /^B([0-8]*)\/S([0-8]*)$/i.exec(String(str).trim());
            if (!m) return null;
            const f = (t) => { const a = Array(9).fill(false); for (const c of t) a[+c] = true; return a; };
            return { b: f(m[1]), s: f(m[2]) };
        }
        // 一代：cells 為 n×n 的 Uint8Array
        function lifeStep(cells, n, rule, wrap) {
            const out = new Uint8Array(n * n);
            for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
                let c = 0;
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    if (!dx && !dy) continue;
                    let xx = x + dx, yy = y + dy;
                    if (wrap) { xx = (xx + n) % n; yy = (yy + n) % n; }
                    else if (xx < 0 || yy < 0 || xx >= n || yy >= n) continue;
                    c += cells[yy * n + xx];
                }
                out[y * n + x] = (cells[y * n + x] ? rule.s[c] : rule.b[c]) ? 1 : 0;
            }
            return out;
        }
        const lifePop = (cells) => cells.reduce((a, v) => a + v, 0);
        // 圖樣（O = 活）
        const PATTERNS = {
            '滑翔機': ['.O.', '..O', 'OOO'],
            '輕型太空船': ['.O..O', 'O....', 'O...O', 'OOOO.'],
            '閃爍器': ['OOO'],
            '蟾蜍': ['.OOO', 'OOO.'],
            '燈塔': ['OO..', 'OO..', '..OO', '..OO'],
            '脈衝星': ['..OOO...OOO..', '.............', 'O....O.O....O', 'O....O.O....O', 'O....O.O....O', '..OOO...OOO..', '.............', '..OOO...OOO..', 'O....O.O....O', 'O....O.O....O', 'O....O.O....O', '.............', '..OOO...OOO..'],
            '十五宮（Pentadecathlon）': ['..O....O..', 'OO.OOOO.OO', '..O....O..'],
            'R 五連方（長壽）': ['.OO', 'OO.', '.O.'],
            '橡實（長壽）': ['.O.....', '...O...', 'OO..OOO'],
            '死硬派（130 代後消失）': ['......O.', 'OO......', '.O...OOO'],
            '高斯珀滑翔機槍': ['........................O...........', '......................O.O...........', '............OO......OO............OO', '...........O...O....OO............OO', 'OO........O.....O...OO..............', 'OO........O...O.OO....O.O...........', '..........O.....O.......O...........', '...........O...O....................', '............OO......................'],
        };
        // 把圖樣放進 n×n 盤面（置中）；放不下回傳 null
        function placePattern(n, rows) {
            const h = rows.length, w = Math.max(...rows.map(r => r.length));
            if (h > n || w > n) return null;
            const cells = new Uint8Array(n * n), ox = (n - w) >> 1, oy = (n - h) >> 1;
            rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === 'O') cells[(oy + y) * n + ox + x] = 1; });
            return cells;
        }

        // ===== 排序：產生「步驟事件」的生成器，就地排序陣列 a =====
        // 事件：{t:'c',i,j} 比較；{t:'s',i,j} 交換（已完成）；{t:'w',i} 寫入
        const lt0 = (x, y) => x < y;
        const sw = (a, i, j) => { const t = a[i]; a[i] = a[j]; a[j] = t; return { t: 's', i, j }; };
        const cmp = (i, j) => ({ t: 'c', i, j });
        function* bubble(a, lt = lt0) {
            for (let i = 0; i < a.length - 1; i++) {
                let any = false;
                for (let j = 0; j < a.length - 1 - i; j++) { yield cmp(j, j + 1); if (lt(a[j + 1], a[j])) { yield sw(a, j, j + 1); any = true; } }
                if (!any) return;
            }
        }
        function* selection(a, lt = lt0) {
            for (let i = 0; i < a.length - 1; i++) {
                let m = i;
                for (let j = i + 1; j < a.length; j++) { yield cmp(j, m); if (lt(a[j], a[m])) m = j; }
                if (m !== i) yield sw(a, i, m);
            }
        }
        function* insertion(a, lt = lt0) {
            for (let i = 1; i < a.length; i++)
                for (let j = i; j > 0; j--) { yield cmp(j - 1, j); if (lt(a[j], a[j - 1])) yield sw(a, j, j - 1); else break; }
        }
        function* merge(a, lt = lt0) {
            const b = a.slice();
            function* go(lo, hi) {
                if (hi - lo < 2) return;
                const m = (lo + hi) >> 1;
                yield* go(lo, m); yield* go(m, hi);
                for (let x = lo; x < hi; x++) b[x] = a[x];
                let i = lo, j = m;
                for (let k = lo; k < hi; k++) {
                    let left;
                    if (i < m && j < hi) { yield cmp(i, j); left = !lt(b[j], b[i]); } else left = i < m;
                    a[k] = left ? b[i++] : b[j++];
                    yield { t: 'w', i: k };
                }
            }
            yield* go(0, a.length);
        }
        function* quick(a, lt = lt0) {
            function* go(lo, hi) {
                if (lo >= hi) return;
                const p = a[hi]; let i = lo;
                for (let j = lo; j < hi; j++) { yield cmp(j, hi); if (lt(a[j], p)) { if (i !== j) yield sw(a, i, j); i++; } }
                if (i !== hi) yield sw(a, i, hi);
                yield* go(lo, i - 1); yield* go(i + 1, hi);
            }
            yield* go(0, a.length - 1);
        }
        function* heap(a, lt = lt0) {
            function* sift(i, e) {
                for (; ;) {
                    const l = 2 * i + 1, r = l + 1; let m = i;
                    if (l < e) { yield cmp(l, m); if (lt(a[m], a[l])) m = l; }
                    if (r < e) { yield cmp(r, m); if (lt(a[m], a[r])) m = r; }
                    if (m === i) return;
                    yield sw(a, i, m); i = m;
                }
            }
            for (let i = (a.length >> 1) - 1; i >= 0; i--) yield* sift(i, a.length);
            for (let e = a.length - 1; e > 0; e--) { yield sw(a, 0, e); yield* sift(0, e); }
        }
        function* shell(a, lt = lt0) {
            for (let g = a.length >> 1; g > 0; g >>= 1)
                for (let i = g; i < a.length; i++)
                    for (let j = i; j >= g; j -= g) { yield cmp(j - g, j); if (lt(a[j], a[j - g])) yield sw(a, j, j - g); else break; }
        }
        const SORTS = {
            bubble: { f: bubble, name: '泡沫排序', stable: true, cx: 'O(n²)' },
            selection: { f: selection, name: '選擇排序', stable: false, cx: 'O(n²)' },
            insertion: { f: insertion, name: '插入排序', stable: true, cx: 'O(n²)，近乎排序時 O(n)' },
            merge: { f: merge, name: '合併排序', stable: true, cx: 'O(n log n)' },
            quick: { f: quick, name: '快速排序', stable: false, cx: '平均 O(n log n)，最差 O(n²)' },
            heap: { f: heap, name: '堆積排序', stable: false, cx: 'O(n log n)' },
            shell: { f: shell, name: '希爾排序', stable: false, cx: '約 O(n^1.3)~O(n²)' },
        };
        // 資料：1..n 的值；rand(k) 回傳 0..k-1
        function makeData(n, kind, rand) {
            const a = Array.from({ length: n }, (_, i) => i + 1);
            const shuf = () => { for (let i = n - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } };
            if (kind === 'reversed') a.reverse();
            else if (kind === 'nearly') for (let k = 0; k < Math.max(1, n / 10 | 0); k++) { const i = rand(n), j = rand(n); [a[i], a[j]] = [a[j], a[i]]; }
            else if (kind === 'dups') { const d = Math.max(3, n / 10 | 0); return Array.from({ length: n }, () => (rand(d) + 1) * Math.floor(n / d)); }
            else shuf();
            return a;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const css = (v, d) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || d;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ===== 分頁 =====
        let tab = 'lf';
        $('#tabs').onclick = (e) => {
            const t = e.target.dataset && e.target.dataset.t;
            if (!t || t === tab) return;
            lfPause(); soPause(); tab = t;
            [...$('#tabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            $('#tab-lf').hidden = t !== 'lf'; $('#tab-so').hidden = t !== 'so';
            draw();
        };
        const draw = () => tab === 'lf' ? lfDraw() : soDraw();
        addEventListener('st-themechange', draw);
        addEventListener('resize', draw);
        function fit(cv) {
            const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
            const w = Math.round(r.width * d), h = Math.round(r.height * d);
            if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
            return cv.getContext('2d');
        }

        // ===== 生命遊戲 =====
        let N = 60, cells = new Uint8Array(N * N), gen = 0, rule = parseRule('B3/S23'), lfTimer = null;
        const lfc = $('#lfc');
        function lfDraw() {
            const g = fit(lfc), W = lfc.width, s = W / N;
            g.fillStyle = css('--bg', '#fff'); g.fillRect(0, 0, W, W);
            g.fillStyle = css('--blue', '#c33');
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (cells[y * N + x]) g.fillRect(x * s + .5, y * s + .5, Math.max(1, s - 1), Math.max(1, s - 1));
            $('#lfGen').textContent = gen; $('#lfPop').textContent = lifePop(cells);
        }
        function lfStep() { cells = lifeStep(cells, N, rule, $('#lfWrap').checked); gen++; lfDraw(); }
        function lfPause() { clearInterval(lfTimer); lfTimer = null; $('#lfPlay').textContent = '播放'; }
        function lfPlay() {
            if (lfTimer) return lfPause();
            const gps = Math.min(+$('#lfSpeed').value, reduced ? 3 : 30);
            lfTimer = setInterval(lfStep, 1000 / gps); $('#lfPlay').textContent = '暫停';
        }
        const lfReset = (c) => { lfPause(); cells = c; gen = 0; lfDraw(); };
        $('#lfPlay').onclick = lfPlay;
        $('#lfStep').onclick = () => { lfPause(); lfStep(); };
        $('#lfRand').onclick = () => lfReset(Uint8Array.from({ length: N * N }, () => Util.rnd(4) === 0 ? 1 : 0));
        $('#lfClear').onclick = () => lfReset(new Uint8Array(N * N));
        $('#lfSpeed').oninput = () => { if (lfTimer) { lfPause(); lfPlay(); } };
        $('#lfSize').onchange = () => { N = +$('#lfSize').value; lfReset(new Uint8Array(N * N)); };
        $('#lfPat').innerHTML = Object.keys(PATTERNS).map(k => `<option>${k}</option>`).join('');
        $('#lfPlace').onclick = () => {
            const c = placePattern(N, PATTERNS[$('#lfPat').value]);
            if (!c) { $('#lfErr').textContent = '盤面太小放不下這個圖樣，請選較大的盤面。'; return; }
            $('#lfErr').textContent = ''; lfReset(c);
        };
        $('#lfRule').onchange = () => {
            const r = parseRule($('#lfRule').value);
            if (!r) { $('#lfErr').textContent = '規則格式錯誤，請用 B3/S23 這種寫法（數字 0–8）。'; return; }
            $('#lfErr').textContent = ''; rule = r;
        };
        $('#lfScroll').onclick = () => {
            const on = $('#lfScroll').getAttribute('aria-pressed') !== 'true';
            $('#lfScroll').setAttribute('aria-pressed', on); $('#lfScroll').textContent = '捲動頁面：' + (on ? '開' : '關');
            lfc.style.touchAction = on ? 'auto' : 'none';
        };
        lfc.style.touchAction = 'auto';
        let paint = null;
        const cellAt = (e) => {
            const r = lfc.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
            return x < 0 || y < 0 || x >= N || y >= N ? -1 : y * N + x;
        };
        lfc.onpointerdown = (e) => {
            const i = cellAt(e); if (i < 0) return;
            paint = cells[i] ? 0 : 1; cells[i] = paint; lfDraw();
            try { lfc.setPointerCapture(e.pointerId); } catch (_) { }
        };
        lfc.onpointermove = (e) => { if (paint === null) return; const i = cellAt(e); if (i >= 0 && cells[i] !== paint) { cells[i] = paint; lfDraw(); } };
        lfc.onpointerup = lfc.onpointercancel = () => { paint = null; };

        // ===== 排序視覺化 =====
        let arr = [], gen2 = null, cnt = { c: 0, s: 0, w: 0 }, hot = null, done = false, soRaf = 0, soLast = 0, soAcc = 0;
        $('#soAlgo').innerHTML = Object.entries(SORTS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
        function soDraw() {
            const cv = $('#soc'), g = fit(cv), W = cv.width, H = cv.height, n = arr.length;
            g.fillStyle = css('--bg', '#fff'); g.fillRect(0, 0, W, H);
            if (!n) return;
            const bw = W / n, mx = Math.max(...arr), base = css('--blue', '#38c'), bad = css('--bad', '#c33'), ok = css('--ok', '#3a3');
            for (let i = 0; i < n; i++) {
                g.fillStyle = done ? ok : hot && (hot.i === i || hot.j === i) ? (hot.t === 'c' ? bad : ok) : base;
                const h = arr[i] / mx * (H - 4);
                g.fillRect(i * bw + (bw > 3 ? .5 : 0), H - h, Math.max(1, bw - (bw > 3 ? 1 : 0)), h);
            }
            $('#soC').textContent = cnt.c; $('#soS').textContent = cnt.s; $('#soW').textContent = cnt.w;
        }
        function soNew() {
            soPause();
            arr = makeData(+$('#soN').value, $('#soDist').value, Util.rnd);
            const k = SORTS[$('#soAlgo').value];
            gen2 = k.f(arr); cnt = { c: 0, s: 0, w: 0 }; hot = null; done = false;
            $('#soInfo').innerHTML = `${k.stable ? '穩定' : '不穩定'} · ${k.cx}`;
            soDraw();
        }
        function soStep() {
            if (done) return false;
            const r = gen2.next();
            if (r.done) { done = true; hot = null; soPause(); soDraw(); return false; }
            hot = r.value; cnt[hot.t]++;
            return true;
        }
        function soPause() { cancelAnimationFrame(soRaf); soRaf = 0; $('#soPlay').textContent = '開始'; }
        function soTick(t) {
            const per = Math.min(Math.round(Math.pow(+$('#soSpeed').value, 2) / 2) + 1, reduced ? 5 : 1e9);
            soAcc += Math.min(t - soLast, 100) / 1000 * per; soLast = t;
            while (soAcc >= 1) { soAcc--; if (!soStep()) return; }
            soDraw(); soRaf = requestAnimationFrame(soTick);
        }
        $('#soPlay').onclick = () => {
            if (soRaf) return soPause();
            if (done) soNew();
            $('#soPlay').textContent = '暫停'; soLast = performance.now(); soAcc = 0; soRaf = requestAnimationFrame(soTick);
        };
        $('#soStep').onclick = () => { soPause(); soStep(); soDraw(); };
        $('#soNew').onclick = soNew;
        $('#soAlgo').onchange = $('#soDist').onchange = soNew;
        $('#soN').oninput = () => { $('#soNv').textContent = $('#soN').value; soNew(); };

        soNew(); lfDraw();
    </script>
</body>

</html>
