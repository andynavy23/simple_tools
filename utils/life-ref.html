        <h1>生活百科速查</h1>
        <p class="sub">居家清潔、急救防災、戶外運動、寵物、園藝、嬰幼兒的常用小抄。</p>

        <div class="card">

        <p class="note">一般原則整理，不能取代醫師、獸醫、專業訓練與官方公告。緊急狀況請撥 119 或立即就醫。</p>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把生活中常查的小知識收在一頁：洗衣標識與汙漬處理、黴菌與居家蟲害、急救與防災流程、繩結與野外求生、防曬與運動傷害、寵物毒性食物與植物、犬種特性、室內植物與陽台菜園、副食品與母乳儲存。每個主題是一張可展開的卡片，每一列可以單獨複製。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>衣服標籤看不懂，或沾到油漬、咖啡、血漬、墨水不知道怎麼處理。</li>
        <li>浴室長黴、廚房有蟑螂 / 螞蟻 / 米蟲，想知道怎麼處理與預防。</li>
        <li>想複習急救步驟、準備防災包，或查地震 / 火災時該做什麼。</li>
        <li>出遊前查繩結、紫外線指數怎麼防護、運動拉傷怎麼先處理。</li>
        <li>家裡有貓狗，想確認某種食物或植物能不能碰；考慮養狗時比較犬種。</li>
        <li>想知道陽台種什麼、某種盆栽要多少光、哪個月份播什麼種子。</li>
        <li>寶寶要吃副食品，或要儲存 / 解凍母乳。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用上方分類鈕縮小範圍，或在搜尋欄輸入（可多個詞，空白分隔，須全部符合；會比對標題、關鍵字與每一列內容）。</li>
        <li>點卡片標題展開；每列右邊「複製」帶走該列文字（含說明）。</li>
        <li>分類鈕選「全部」可一次搜尋所有類別。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋 咖啡 → 汙漬處理：咖啡 / 茶漬的處理步驟
搜尋 CPR → 成人 CPR 的流程與按壓深度、速率
搜尋 稱人結 → 繩結的用途與打法
搜尋 巧克力 → 狗 / 貓不能吃的食物與症狀
搜尋 母乳 → 室溫 / 冷藏 / 冷凍的儲存時間</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>急救與防災</b>：只列國際通行的一般原則，不能取代急救訓練課程與就醫；遇到緊急狀況請先撥 119。建議定期參加 CPR / AED 訓練。</li>
        <li><b>寵物</b>：不是獸醫建議。毒性食物與植物只列廣為人知的項目，<b>非完整名單</b>；毒性與份量、體重有關，懷疑誤食請立即聯絡獸醫並帶著包裝或殘留物。犬種描述是一般傾向，個體差異大。</li>
        <li><b>嬰幼兒</b>：副食品與母乳儲存只寫通行衛教建議，不同單位數字略有差異，請以醫師 / 衛教單位為準；寶寶有過敏、早產或特殊狀況請先問醫師。</li>
        <li><b>居家清潔 / 蟲害</b>：清潔劑與藥劑先在不顯眼處測試、依標示使用；不要混用不同清潔劑（尤其含氯漂白水與酸性清潔劑）；使用殺蟲劑要避開兒童與寵物。</li>
        <li><b>戶外 / 運動</b>：繩結用於承重、攀爬或救援時須受專業訓練，這裡只是用途與步驟的文字說明；運動傷害若有明顯變形、無法負重、麻木請就醫。</li>
        <li><b>園藝</b>：播種月份以台灣北部平地為準，南部可提早或延後；發芽天數與深度隨品種、溫度而異。</li>
        <li>不儲存任何資料，也不會連線。</li>
        </ul>
    </template>

                '含酒精、咖啡因的食品 ~~ 不適合嬰幼兒，包含咖啡、茶、能量飲料與含酒料理',
                '嘔吐、腹瀉、皮疹、嘴唇腫脹、呼吸困難 ~~ 疑似食物過敏或哽塞，嚴重時立刻撥 119',
                '餵食時 ~~ 成人全程在旁，坐直，不要在寶寶哭鬧、躺著、跑跳時餵食',
                '餐具與衛生 ~~ 餐具煮沸或熱水燙過，洗手；食物放涼到溫溫的再餵，先試溫度',
            ], { copyAll: true }),
            T('bb-milk', '嬰幼兒', '母乳儲存時間', '母乳 儲存 保存 室溫 冷藏 冷凍 儲奶袋 集乳 擠奶 背奶 解凍後 剩奶 寶寶 嬰兒', [
                '剛擠出的母乳：室溫（約 25°C 以下） ~~ 最佳 4 小時內使用；乾淨環境下最多約 6～8 小時',
                '保冷袋（有冰磚） ~~ 約 24 小時內，抵達後立刻冷藏或冷凍',
                '冷藏（約 4°C 以下） ~~ 最佳 4 天內；乾淨環境下最多約 5～8 天',
                '冷凍（冷凍庫約 -18°C 以下） ~~ 最佳 6 個月內；一般可到約 12 個月',
                '冰箱內的小冷凍格 ~~ 與冷藏共用同一道門、開關頻繁時溫度較不穩，存放時間要縮短（常見建議約 2 週）',
                '解凍後（冷藏室解凍） ~~ 24 小時內用完，不可再冷凍',
                '解凍後（室溫或溫水加熱後） ~~ 1～2 小時內用完，不可再放回冷藏或冷凍',
                '寶寶已經喝過的剩奶 ~~ 約 2 小時內用完，之後丟棄，不要再保存',
                '分裝 ~~ 每份約 60～120 毫升（依寶寶一餐量），少量分裝避免浪費',
                '容器與標示 ~~ 用母乳專用儲奶袋或食品級硬質容器；標日期與時間，冷凍時留約 2.5 公分空間（結凍會膨脹）',
                '新舊奶混合 ~~ 剛擠出的溫奶先冷藏降溫後，才能加入已冷藏的奶；已冷凍的奶不要再加入新擠的溫奶',
                '冷凍位置 ~~ 放冷凍庫內側，不放門邊；先擠的先用（先進先出）',
                '擠奶衛生 ~~ 擠奶前洗手，集乳器與配件每次使用後清洗，並依說明消毒',
            ], { copyAll: true, note: '依 CDC 等通行衛教建議整理，各單位數字略有差異，以醫師 / 衛教單位為準；早產兒、住院寶寶的母乳保存規則較嚴格，請遵照醫院指示。' }),
            T('bb-thaw', '嬰幼兒', '母乳解凍與加熱', '母乳 解凍 加熱 溫奶 微波 隔水 分層 肥皂味 酸味 外出 攜帶 寶寶 嬰兒 溫度', [
                '最推薦的解凍 ~~ 放進冷藏室過夜慢慢解凍；解凍後 24 小時內用完',
                '快速解凍 ~~ 流動的溫水或把奶袋 / 奶瓶泡在溫水中，水溫不要太高（約不超過 40°C）',
                '不要用微波爐 ~~ 加熱不均、局部過燙，可能燙傷寶寶',
                '不要用沸水或直火煮 ~~ 高溫會破壞營養與免疫成分',
                '分層是正常的 ~~ 脂肪浮在上層，輕輕轉動奶瓶混合，不要大力搖晃',
                '試溫度 ~~ 滴幾滴在手腕內側，感覺微溫（接近體溫）即可',
                '解凍後有肥皂味 ~~ 可能是脂肪酵素造成，多半仍可安全飲用；但聞起來酸腐就丟棄',
                '不可再冷凍 ~~ 解凍後的母乳不能再次冷凍',
                '加熱後 ~~ 當次要用完，寶寶沒喝完的剩奶約 2 小時內用完，之後丟棄',
                '外出攜帶 ~~ 保冷袋 + 冰磚，抵達後盡快冷藏 / 冷凍；解凍的奶用保溫瓶溫水另外帶',
            ], { copyAll: true, note: '以醫師 / 衛教單位建議為準。' }),
        ];
        const parseRow = (s) => { const i = s.indexOf(' ~~ '); return i < 0 ? { text: s.trim(), desc: '' } : { text: s.slice(0, i).trim(), desc: s.slice(i + 4).trim() }; };
        // 搜尋：空白分隔的詞須全部符合；標題 / 關鍵字 / 分類符合 → 整張卡，否則只列符合的列
        function searchTopics(topics, q, cat = '') {
            const ws = String(q || '').toLowerCase().split(/\s+/).filter(Boolean), out = [];
            for (const t of topics) {
                if (cat && t.cat !== cat) continue;
                const rows = t.rows.map(parseRow), head = (t.title + ' ' + t.kw + ' ' + t.cat).toLowerCase();
                if (!ws.length) { out.push({ t, rows, byRows: false }); continue; }
                const lo = rows.map(r => (r.text + ' ' + r.desc).toLowerCase());
                const all = head + ' ' + lo.join(' ');
                if (!ws.every(w => all.includes(w))) continue;
                if (ws.every(w => head.includes(w))) { out.push({ t, rows, byRows: false }); continue; }
                const hit = rows.filter((r, i) => ws.every(w => lo[i].includes(w) || head.includes(w)));
                out.push({ t, rows: hit.length ? hit : rows, byRows: true });
            }
            return out;
        }
        // 資料完整性：回傳問題清單（空陣列 = 沒問題）
        function checkData(topics, cats) {
            const bad = [], seen = new Set();
            for (const t of topics) {
                if (!t.id || seen.has(t.id)) bad.push('id 缺少或重複：' + t.id);
                seen.add(t.id);
                if (!t.title) bad.push('缺標題：' + t.id);
                if (!cats.includes(t.cat)) bad.push('分類不存在：' + t.id);
                if (!t.rows || !t.rows.length) bad.push('沒有內容：' + t.id);
                for (const s of t.rows || []) { const r = parseRow(s); if (!r.text) bad.push('空白列：' + t.id); }
            }
            return bad;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        let cat = '';
        function render() {
            const q = $('#q').value, res = searchTopics(TOPICS, q, cat);
            $('#count').textContent = `${res.length} 個主題`;
            $('#list').replaceChildren(...res.map(({ t, rows, byRows }) => {
                const d = el('details', 't'); d.dataset.id = t.id;
                d.open = byRows || (!!q.trim() && res.length <= 3);
                const sm = el('summary'); sm.append(el('span', 'n', t.title), el('span', 'c', `${t.cat} · ${rows.length} 列`));
                d.append(sm);
                if (t.note) d.append(el('p', 'tn', t.note));
                for (const r of rows) {
                    const ln = el('div', 'ln'), tx = el('div', 'tx');
                    tx.append(el('div', 'w', r.text));
                    if (r.desc) tx.append(el('div', 'ds', r.desc));
                    ln.append(tx);
                    const cp = el('button', 'sm', '複製'); cp.onclick = () => copyWithFeedback(cp, t.copyAll && r.desc ? `${r.text}　${r.desc}` : r.text);
                    ln.append(cp);
                    d.append(ln);
                }
                return d;
            }));
            if (!res.length) $('#list').append(el('p', 'muted', '沒有符合的主題'));
        }
        const bar = $('#cats');
        for (const c of ['', ...CATS]) { const b = el('button', 'sm', c || '全部'); b.dataset.c = c; b.setAttribute('aria-pressed', c === ''); bar.append(b); }
        bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; [...bar.children].forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
        $('#q').oninput = render;
        render();
    </script>
</body>
