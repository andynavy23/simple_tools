<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="密碼產生器：使用瀏覽器內建的安全亂數在本機產生密碼，不會傳送到任何地方。">
    <meta property="og:title" content="密碼產生器" />
    <meta property="og:description" content="在本機用安全亂數產生密碼，不會傳送到任何地方。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/password-gen.html" />
    <title>密碼產生器</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #fff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --fill: rgba(118, 118, 128, .12);
            --blue: #0071e3;
            --meter: #ff453a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --muted: #98989d;
                --fill: rgba(118, 118, 128, .24);
                --blue: #2997ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 20px;
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 0 48px;
        }

        a.back {
            color: var(--blue);
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            font-size: 32px;
            margin: 12px 0 4px;
            letter-spacing: -.02em;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        #pw {
            font: 22px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            word-break: break-all;
            background: var(--fill);
            border-radius: 12px;
            padding: 14px;
            min-height: 3.4em;
            user-select: all;
        }

        .meter {
            height: 6px;
            border-radius: 3px;
            background: var(--fill);
            margin: 12px 0 4px;
            overflow: hidden;
        }

        .meter i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--meter);
            transition: width .2s, background .2s;
        }

        .small {
            color: var(--muted);
            font-size: 13px;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            font: inherit;
            border: 0;
            border-radius: 980px;
            padding: 9px 22px;
            background: var(--fill);
            color: var(--text);
            cursor: pointer;
        }

        button.primary {
            background: var(--blue);
            color: #fff;
        }

        .opt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
        }

        .opt:last-child {
            border: 0;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--blue);
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px;
            accent-color: var(--blue);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>密碼產生器</h1>
        <p class="sub">在你的瀏覽器內產生，不會傳送到任何地方。</p>

        <div class="card">
            <div id="pw" aria-live="polite"></div>
            <div class="meter"><i id="bar"></i></div>
            <div class="small" id="strength"></div>
            <div class="btns">
                <button class="primary" id="gen">重新產生</button>
                <button id="copy">複製</button>
            </div>
        </div>

        <div class="card">
            <div class="opt">
                <label for="len">長度</label><b id="lenv">16</b>
            </div>
            <input id="len" type="range" min="8" max="64" value="16">
            <div class="opt"><label for="lower">小寫英文 a-z</label><input id="lower" type="checkbox" checked></div>
            <div class="opt"><label for="upper">大寫英文 A-Z</label><input id="upper" type="checkbox" checked></div>
            <div class="opt"><label for="digit">數字 0-9</label><input id="digit" type="checkbox" checked></div>
            <div class="opt"><label for="symbol">符號 !@#$…</label><input id="symbol" type="checkbox" checked></div>
            <div class="opt"><label for="clear">排除易混淆字元（0 O 1 l I |）</label><input id="clear" type="checkbox"></div>
        </div>
    </div>

    <script>
        // --- pure ---
        const SETS = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            digit: '0123456789',
            symbol: '!@#$%^&*()-_=+[]{};:,.?/~',
        };
        const AMBIGUOUS = '0O1lI|';

        // 取 [0, n) 的均勻亂數（拒絕取樣，避免取餘數偏差）
        function rnd(n) {
            const lim = Math.floor(2 ** 32 / n) * n;
            let x;
            do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while (x >= lim);
            return x % n;
        }

        // 回傳 { password, bits }；每個勾選的類別至少出現一次，最後再洗牌避免固定位置
        function generate(len, kinds, noAmbiguous) {
            const sets = kinds.map(k => [...SETS[k]].filter(c => !(noAmbiguous && AMBIGUOUS.includes(c))).join(''));
            if (!sets.length || len < sets.length) return null;
            const pool = sets.join('');
            const chars = sets.map(s => s[rnd(s.length)]);
            while (chars.length < len) chars.push(pool[rnd(pool.length)]);
            for (let i = chars.length - 1; i > 0; i--) {
                const j = rnd(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return { password: chars.join(''), bits: len * Math.log2(pool.length) };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const LEVELS = [[40, '偏弱', '#ff453a'], [60, '普通', '#ff9f0a'], [80, '強', '#30d158'], [Infinity, '非常強', '#0a84ff']];

        function render() {
            $('#lenv').textContent = $('#len').value;
            const kinds = ['lower', 'upper', 'digit', 'symbol'].filter(k => $('#' + k).checked);
            const r = generate(+$('#len').value, kinds, $('#clear').checked);
            if (!r) {
                $('#pw').textContent = '請至少勾選一種字元類型';
                $('#strength').textContent = '';
                $('#bar').style.width = '0';
                return;
            }
            $('#pw').textContent = r.password;
            const [, name, color] = LEVELS.find(l => r.bits < l[0]);
            $('#bar').style.width = Math.min(100, r.bits / 128 * 100) + '%';
            $('#bar').style.background = color;
            $('#strength').textContent = `強度：${name}（約 ${Math.round(r.bits)} bits）`;
        }

        $('#gen').onclick = render;
        $('#copy').onclick = async () => {
            const b = $('#copy');
            try {
                await navigator.clipboard.writeText($('#pw').textContent);
                b.textContent = '已複製';
            } catch (e) {
                getSelection().selectAllChildren($('#pw'));
                b.textContent = '請按 Ctrl+C';
            }
            setTimeout(() => b.textContent = '複製', 1500);
        };
        document.querySelectorAll('input').forEach(i => i.oninput = render);
        render();
    </script>
</body>

</html>
