<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="密碼產生器：使用瀏覽器內建的安全亂數在本機產生密碼，不會傳送到任何地方。">
    <meta property="og:title" content="密碼產生器" />
    <meta property="og:description" content="在本機用安全亂數產生密碼，不會傳送到任何地方。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/password-gen.html" />
    <title>密碼產生器</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --meter: #ff453a;
        }

        #pw {
            font: 22px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            word-break: break-all;
            background: var(--fill);
            border-radius: 12px;
            padding: 14px;
            min-height: 3.4em;
            user-select: all;
        }

        .meter {
            height: 6px;
            border-radius: 3px;
            background: var(--fill);
            margin: 12px 0 4px;
            overflow: hidden;
        }

        .meter i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--meter);
            transition: width .2s, background .2s;
        }

        .small {
            color: var(--muted);
            font-size: 13px;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--blue);
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tabs button {
            flex: 1 1 auto;
        }

        #totpCode {
            font: 36px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: .12em;
            text-align: center;
            background: var(--fill);
            border-radius: 12px;
            padding: 12px;
            user-select: all;
        }

        .frow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .frow>* {
            flex: 1 1 120px;
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px;
            accent-color: var(--blue);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>密碼產生器</h1>
        <p class="sub">在你的瀏覽器內產生，不會傳送到任何地方；也能檢測現有密碼的強度。</p>

        <div class="tabs" id="tabs">
            <button data-t="gen" aria-pressed="true">產生密碼</button>
            <button data-t="chk" aria-pressed="false">強度評估</button>
            <button data-t="totp" aria-pressed="false">TOTP 驗證碼</button>
        </div>

        <div id="tab-gen">
        <div class="card">
            <div id="pw" aria-live="polite"></div>
            <div class="meter"><i id="bar"></i></div>
            <div class="small" id="strength"></div>
            <div class="btns">
                <button class="primary" id="gen">重新產生</button>
                <button id="copy">複製</button>
            </div>
        </div>

        <div class="card">
            <div class="li opt">
                <label for="len">長度</label><b id="lenv">16</b>
            </div>
            <input id="len" type="range" min="8" max="64" value="16">
            <div class="li opt"><label for="lower">小寫英文 a-z</label><input id="lower" type="checkbox" checked></div>
            <div class="li opt"><label for="upper">大寫英文 A-Z</label><input id="upper" type="checkbox" checked></div>
            <div class="li opt"><label for="digit">數字 0-9</label><input id="digit" type="checkbox" checked></div>
            <div class="li opt"><label for="symbol">符號 !@#$…</label><input id="symbol" type="checkbox" checked></div>
            <div class="li opt"><label for="clear">排除易混淆字元（0 O 1 l I |）</label><input id="clear" type="checkbox"></div>
        </div>
        </div>

        <div id="tab-chk" hidden>
        <div class="card" id="chkCard">
            <h2>強度檢測</h2>
            <p class="small" style="margin:0 0 10px">輸入你現有的密碼來估算強度。只在這個頁面的記憶體內計算，不會儲存、也不會傳到任何地方。</p>
            <input id="chk" type="password" autocomplete="off" spellcheck="false" placeholder="輸入要檢測的密碼" aria-label="要檢測的密碼" style="width:100%">
            <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="showChk"> 顯示內容</label>
            <div class="frow"><label class="small" for="hashAlgo" style="align-self:center;flex:0 0 auto">離線破解時的雜湊演算法</label><select id="hashAlgo" aria-label="雜湊演算法"></select></div>
            <p class="small" id="hashNote" style="margin:8px 0 0"></p>
            <div id="chkOut" style="margin-top:10px"></div>
        </div>
        </div>

        <div id="tab-totp" hidden>
        <div class="card">
            <h2>TOTP 驗證碼</h2>
            <p class="small" style="margin:0 0 10px">依 RFC 6238 在本機計算雙因素驗證碼。secret 不會儲存也不會上傳，關掉頁面就消失。</p>
            <input id="totpSecret" type="password" autocomplete="off" spellcheck="false" placeholder="Base32 secret，或整串 otpauth:// 網址" aria-label="Base32 secret" style="width:100%">
            <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="showTotp"> 顯示內容</label>
            <div class="frow">
                <select id="totpAlgo" aria-label="雜湊演算法"><option>SHA1</option><option>SHA256</option><option>SHA512</option></select>
                <select id="totpDigits" aria-label="位數"><option value="6">6 位</option><option value="8">8 位</option></select>
                <input id="totpPeriod" type="number" min="1" max="300" value="30" aria-label="週期（秒）">
            </div>
            <div id="totpCode" aria-live="off">------</div>
            <div class="meter"><i id="totpBar" style="background:var(--blue)"></i></div>
            <div class="small" id="totpMsg"></div>
            <div class="btns"><button id="totpCopy">複製驗證碼</button><button id="totpClear">清除 secret</button></div>
        </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>在瀏覽器內產生隨機密碼，也能檢測你現有密碼的強度。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>註冊新帳號，需要一組又長又亂的密碼。</li>
        <li>想知道自己常用的密碼夠不夠強。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用「長度」滑桿選 8–64 個字元。</li>
        <li>勾選要包含的字元：小寫、大寫、數字、符號；可勾「排除易混淆字元」避開 0 O 1 l I |。</li>
        <li>按「重新產生」換一組，滿意後按「複製」。上方的強度條會顯示估計強度（bits）。</li>
        <li>「強度評估」分頁：輸入現有密碼，看強度評級、平均破解時間與弱點（常見字根、重複、連號、鍵盤順序、年份）；可選對方用哪種雜湊演算法儲存你的密碼，破解速度差很多。勾「顯示內容」可看到自己打了什麼。</li>
        <li>「TOTP 驗證碼」分頁：貼上 Base32 secret（或 otpauth:// 網址）就會每 30 秒產生一組 6 位動態碼並倒數，可選 SHA1 / SHA256 / SHA512、6 或 8 位、週期。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">長度 16、四種字元都勾
        → 例如 NJ&ge/&t8=He^=@*，強度約 103 bits，評為「非常強」</div>
        <h3>小提醒</h3>
        <ul>
        <li>密碼只在這個頁面的記憶體內產生與計算，不會儲存或傳送。</li>
        <li>建議每個網站用不同密碼，搭配密碼管理員。</li>
        <li>強度只是估算，常見字詞或規律即使很長也可能被猜到。破解速度是數量級的假設值（依硬體與設定而異），僅供比較。</li>
        <li>TOTP 的 secret 等同第二把鑰匙：<b>不會被儲存</b>，請勿貼在別人看得到的畫面；本頁只是方便驗證或備援，不建議取代專用驗證器。電腦時鐘不準時驗證碼會對不上。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd } = Util;

        // --- pure ---
        const SETS = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            digit: '0123456789',
            symbol: '!@#$%^&*()-_=+[]{};:,.?/~',
        };
        const AMBIGUOUS = '0O1lI|';

        // 回傳 { password, bits }；每個勾選的類別至少出現一次，最後再洗牌避免固定位置
        function generate(len, kinds, noAmbiguous) {
            const sets = kinds.map(k => [...SETS[k]].filter(c => !(noAmbiguous && AMBIGUOUS.includes(c))).join(''));
            if (!sets.length || len < sets.length) return null;
            const pool = sets.join('');
            const chars = sets.map(s => s[rnd(s.length)]);
            while (chars.length < len) chars.push(pool[rnd(pool.length)]);
            for (let i = chars.length - 1; i > 0; i--) {
                const j = rnd(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return { password: chars.join(''), bits: len * Math.log2(pool.length) };
        }

        // ---------- 強度檢測 ----------
        // 常見弱密碼（全小寫、已把常見的 leet 替換還原後比對）
        const COMMON = ['password', 'passw0rd', '123456', '12345678', '123456789', '1234567890', '111111', '000000', '123123', '654321', 'qwerty', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm', 'abc123', 'iloveyou', 'admin', 'administrator', 'welcome', 'letmein', 'monkey', 'dragon', 'football', 'baseball', 'master', 'login', 'princess', 'sunshine', 'superman', 'batman', 'trustno1', 'shadow', 'michael', 'jordan', 'hello', 'freedom', 'whatever', 'qazwsx', '1q2w3e4r', '1qaz2wsx', 'zaq12wsx', 'taiwan', 'nextlink', 'a123456', 'aa123456', 'p@ssw0rd', 'root', 'test', 'guest', 'default', 'secret', 'changeme', 'pass', 'user', 'love', 'happy', 'summer', 'winter', 'computer', 'internet'];
        const KEYBOARD_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', '1234567890'];
        const unleet = (s) => s.toLowerCase().replace(/[@4]/g, 'a').replace(/[3]/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[5$]/g, 's').replace(/7/g, 't');

        // 估算密碼強度。bits = 有效長度 × log2(字元池大小)，再扣除可預測的結構：重複、連號、鍵盤順序、常見密碼、年份。回傳 { bits, issues[], pool }
        function assess(pw) {
            const issues = [];
            if (!pw) return { bits: 0, issues, pool: 0 };
            let pool = 0; if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26; if (/\d/.test(pw)) pool += 10; if (/[^A-Za-z0-9]/.test(pw)) pool += 32;
            let eff = [...pw].length;
            const lowered = pw.toLowerCase();
            // 重複字元（aaa、abab）
            const rep = pw.match(/(.)\1{2,}/g); if (rep) { issues.push('有連續重複的字元（' + rep[0].slice(0, 4) + '…）'); eff -= rep.reduce((a, r) => a + r.length - 1, 0); }
            if (/^(.{1,4})\1+$/.test(pw)) { issues.push('整個密碼是同一段內容重複'); eff = Math.min(eff, [...pw].length / 2); }
            // 連號與鍵盤順序（長度 ≥ 4）：每個可預測片段只算 1 個字元
            let runs = 0;
            for (let i = 0; i + 3 < lowered.length; i++) {
                const seg = lowered.slice(i, i + 4), d = [...seg].map((c, k) => (k ? c.charCodeAt(0) - seg.charCodeAt(k - 1) : 0)).slice(1);
                if (d.every(x => x === 1) || d.every(x => x === -1)) { runs++; i += 2; }
                else if (KEYBOARD_ROWS.some(r => r.includes(seg) || [...r].reverse().join('').includes(seg))) { runs++; i += 2; }
            }
            if (runs) { issues.push('含有連號或鍵盤順序（如 abcd、1234、qwer）'); eff -= runs * 3; }
            if (/(19|20)\d{2}/.test(pw)) { issues.push('含有年份'); eff -= 2; }
            let bits = Math.max(0, eff) * Math.log2(Math.max(pool, 2));
            const core = unleet(lowered).replace(/[^a-z0-9]/g, ''), stripped = unleet(lowered.replace(/[\d!@#$%^&*._-]+$/, '')).replace(/[^a-z0-9]/g, '');      // 尾巴的數字 / 符號先去掉再還原 leet
            if (COMMON.includes(lowered) || COMMON.includes(core) || COMMON.includes(stripped)) { issues.push('是常見的弱密碼，很快就會被猜到'); bits = Math.min(bits, Math.log2(COMMON.length * 1000)); }
            const roots = findRoots(pw); if (roots.length && !issues.some(i => i.includes('常見的弱密碼'))) issues.push('含有常見字根（' + roots.slice(0, 3).join('、') + '），攻擊者的字典會優先嘗試');
            if (pw.length < 8) issues.push('太短（建議至少 12 個字元）');
            if (pool && pool <= 36 && pw.length >= 8) issues.push('只用了單一類型的字元，加入大小寫、數字或符號會更強');
            return { bits, issues, pool };
        }
        // 以每秒 100 億次猜測（離線攻擊、快速雜湊）估算平均破解時間（秒）；rate 可換成其他雜湊演算法的猜測速度
        const crackSeconds = (bits, rate = 1e10) => Math.pow(2, bits) / 2 / rate;
        // 各種儲存密碼的雜湊法對「離線暴力破解」速度的影響：單張高階 GPU 的數量級假設，只供比較，實際依硬體與參數而異
        const HASHES = [
            { id: 'md5', name: 'MD5（極快，不該用來存密碼）', rate: 1e11, note: '設計目標就是快，單張 GPU 每秒可試上千億次。' },
            { id: 'sha1', name: 'SHA-1（很快）', rate: 4e10, note: '同樣是快速雜湊，不適合直接存密碼。' },
            { id: 'sha256', name: 'SHA-256（快，預設）', rate: 1e10, note: '快速雜湊，每秒百億次量級。' },
            { id: 'pbkdf2', name: 'PBKDF2（約 60 萬次迭代）', rate: 1e5, note: '用迭代次數拖慢，每次猜測慢上數十萬倍。' },
            { id: 'bcrypt', name: 'bcrypt（cost 12）', rate: 1e4, note: '刻意慢且較不利 GPU，每秒約萬次量級。' },
            { id: 'argon2', name: 'Argon2id（建議參數）', rate: 1e3, note: '同時吃時間與記憶體，GPU 優勢最小，每秒約千次量級。' },
        ];
        // 常見字根（長度 ≥ 5，連在一起出現就提示；不做 leet 還原，避免誤判隨機密碼）
        const ROOTS = ['password', 'admin', 'welcome', 'letmein', 'monkey', 'dragon', 'football', 'baseball', 'master', 'login', 'princess', 'sunshine', 'superman', 'batman', 'shadow', 'michael', 'iloveyou', 'qwerty', 'asdfgh', 'zxcvbn', 'freedom', 'whatever', 'secret', 'changeme', 'taiwan', 'summer', 'winter', 'computer', 'internet', 'hello'];
        const findRoots = (pw) => { const l = pw.toLowerCase(); return ROOTS.filter(r => l.includes(r)); };

        // ---------- TOTP（RFC 6238 / RFC 4226）----------
        function base32Decode(s) {
            const t = String(s).toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
            if (!t) throw new Error('請輸入 secret');
            if (!/^[A-Z2-7]+$/.test(t)) throw new Error('secret 含有不合法的字元（Base32 只有 A-Z 與 2-7）');
            let bits = 0, val = 0; const out = [];
            for (const c of t) { val = ((val << 5) | 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c)) & 0xffff; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
            return Uint8Array.from(out);
        }
        // HOTP：counter 以 8 位元組大端序；回傳補零的數字字串
        async function hotp(keyBytes, counter, digits = 6, algo = 'SHA1') {
            const name = { SHA1: 'SHA-1', SHA256: 'SHA-256', SHA512: 'SHA-512' }[algo];
            if (!name) throw new Error('不支援的演算法');
            const msg = new Uint8Array(8); let c = BigInt(counter); for (let i = 7; i >= 0; i--) { msg[i] = Number(c & 255n); c >>= 8n; }
            const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: name }, false, ['sign']);
            const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg)), o = h[h.length - 1] & 15;
            const bin = ((h[o] & 0x7f) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3];
            return String(bin % Math.pow(10, digits)).padStart(digits, '0');
        }
        const totp = (keyBytes, tSec, { digits = 6, algo = 'SHA1', period = 30 } = {}) => hotp(keyBytes, Math.floor(tSec / period), digits, algo);
        // 接受純 Base32 或 otpauth://totp/...?secret=&algorithm=&digits=&period=
        function parseSecretInput(text) {
            const t = String(text).trim(), r = { secret: t };
            if (/^otpauth:\/\//i.test(t)) {
                let u; try { u = new URL(t); } catch (e) { throw new Error('otpauth 網址格式不對'); }
                r.secret = u.searchParams.get('secret') || '';
                const a = (u.searchParams.get('algorithm') || '').toUpperCase().replace('-', ''); if (['SHA1', 'SHA256', 'SHA512'].includes(a)) r.algo = a;
                const d = +u.searchParams.get('digits'); if (d === 6 || d === 8) r.digits = d;
                const p = +u.searchParams.get('period'); if (p >= 1 && p <= 300) r.period = p;
            }
            return r;
        }
        function humanTime(sec) {
            if (sec < 1) return '不到 1 秒'; const U = [[60, '秒'], [60, '分鐘'], [24, '小時'], [365, '天'], [100, '年'], [10, '世紀'], [Infinity, '千年']]; let v = sec;
            for (const [k, name] of U) { if (v < k || k === Infinity) return (v >= 1e12 ? v.toExponential(1) : Math.floor(v).toLocaleString('en-US')) + ' ' + name; v /= k; }
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const LEVELS = [[40, '偏弱', '#ff453a'], [60, '普通', '#ff9f0a'], [80, '強', '#30d158'], [Infinity, '非常強', '#0a84ff']];

        function render() {
            $('#lenv').textContent = $('#len').value;
            const kinds = ['lower', 'upper', 'digit', 'symbol'].filter(k => $('#' + k).checked);
            const r = generate(+$('#len').value, kinds, $('#clear').checked);
            if (!r) {
                $('#pw').textContent = '請至少勾選一種字元類型';
                $('#strength').textContent = '';
                $('#bar').style.width = '0';
                return;
            }
            $('#pw').textContent = r.password;
            const [, name, color] = LEVELS.find(l => r.bits < l[0]);
            $('#bar').style.width = Math.min(100, r.bits / 128 * 100) + '%';
            $('#bar').style.background = color;
            $('#strength').textContent = `強度：${name}（約 ${Math.round(r.bits)} bits）`;
        }

        // 檢測區：只在本機計算，輸入內容不會被儲存或傳送
        function check() {
            const pw = $('#chk').value, box = $('#chkOut');
            if (!pw) { box.replaceChildren(); return; }
            const r = assess(pw), [, name, color] = LEVELS.find(l => r.bits < l[0]), hs = HASHES[$('#hashAlgo').selectedIndex] || HASHES[2];
            const row = (a, b) => { const d = document.createElement('div'); d.className = 'li stat'; d.append(Object.assign(document.createElement('span'), { textContent: a }), Object.assign(document.createElement('b'), { textContent: b })); return d; };
            const bar = Object.assign(document.createElement('div'), { className: 'meter' }); const fill = document.createElement('i'); fill.style.width = Math.min(100, r.bits / 128 * 100) + '%'; fill.style.background = color; bar.append(fill);
            box.replaceChildren(bar, row('強度', `${name}（約 ${Math.round(r.bits)} bits）`), row('平均破解時間', humanTime(crackSeconds(r.bits, hs.rate))), row('有效熵', `${r.bits.toFixed(1)} bits／字元池 ${r.pool}`), ...r.issues.map(t => Object.assign(document.createElement('p'), { className: 'small', textContent: '⚠ ' + t })));
        }
        $('#hashAlgo').replaceChildren(...HASHES.map((x, i) => Object.assign(document.createElement('option'), { textContent: x.name, selected: x.id === 'sha256' })));
        $('#hashAlgo').onchange = () => { $('#hashNote').textContent = HASHES[$('#hashAlgo').selectedIndex].note + '（假設單張高階 GPU 的數量級，僅供比較）'; check(); };
        $('#hashAlgo').onchange();
        $('#chk').oninput = check;
        $('#showChk').onchange = () => { $('#chk').type = $('#showChk').checked ? 'text' : 'password'; };

        $('#gen').onclick = render;
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#pw').textContent, () => getSelection().selectAllChildren($('#pw')));
        document.querySelectorAll('#tab-gen input').forEach(i => i.oninput = render);
        render();

        // ---------- 分頁 ----------
        const TABS = ['gen', 'chk', 'totp'];
        $('#tabs').onclick = (e) => {
            const t = e.target.dataset.t; if (!t) return;
            TABS.forEach(k => { $('#tab-' + k).hidden = k !== t; });
            [...$('#tabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            if (t === 'totp') tick();
        };

        // ---------- TOTP：secret 只存在輸入框，不寫入 localStorage ----------
        let totpBusy = 0;
        async function tick() {
            if ($('#tab-totp').hidden) return;
            const my = ++totpBusy, raw = $('#totpSecret').value.trim();
            let period = Math.min(300, Math.max(1, Math.floor(+$('#totpPeriod').value) || 30));
            const code = $('#totpCode'), msg = $('#totpMsg');
            if (!raw) { code.textContent = '------'; msg.textContent = ''; $('#totpBar').style.width = '0'; return; }
            try {
                const p = parseSecretInput(raw);
                if (p.algo) $('#totpAlgo').value = p.algo; if (p.digits) $('#totpDigits').value = p.digits; if (p.period) { period = p.period; $('#totpPeriod').value = period; }
                const now = Date.now() / 1000, c = await totp(base32Decode(p.secret), now, { digits: +$('#totpDigits').value, algo: $('#totpAlgo').value, period });
                if (my !== totpBusy) return;
                const left = period - (now % period);
                code.textContent = c; $('#totpBar').style.width = (left / period * 100) + '%'; msg.textContent = `還剩 ${Math.ceil(left)} 秒更新`;
            } catch (e) { code.textContent = '------'; msg.textContent = e.message; $('#totpBar').style.width = '0'; }
        }
        setInterval(tick, 500);
        ['#totpSecret', '#totpAlgo', '#totpDigits', '#totpPeriod'].forEach(s => $(s).oninput = tick);
        $('#showTotp').onchange = () => { $('#totpSecret').type = $('#showTotp').checked ? 'text' : 'password'; };
        $('#totpClear').onclick = () => { $('#totpSecret').value = ''; tick(); };
        $('#totpCopy').onclick = () => { const c = $('#totpCode').textContent; if (/^\d+$/.test(c)) Util.copyWithFeedback($('#totpCopy'), c); };
    </script>
</body>

</html>
