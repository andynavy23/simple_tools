<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="密碼產生器：使用瀏覽器內建的安全亂數在本機產生密碼，不會傳送到任何地方。">
    <meta property="og:title" content="密碼產生器" />
    <meta property="og:description" content="在本機用安全亂數產生密碼，不會傳送到任何地方。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/password-gen.html" />
    <title>密碼產生器</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --meter: #ff453a;
        }

        #pw {
            font: 22px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            word-break: break-all;
            background: var(--fill);
            border-radius: 12px;
            padding: 14px;
            min-height: 3.4em;
            user-select: all;
        }

        .meter {
            height: 6px;
            border-radius: 3px;
            background: var(--fill);
            margin: 12px 0 4px;
            overflow: hidden;
        }

        .meter i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--meter);
            transition: width .2s, background .2s;
        }

        .small {
            color: var(--muted);
            font-size: 13px;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--blue);
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px;
            accent-color: var(--blue);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>密碼產生器</h1>
        <p class="sub">在你的瀏覽器內產生，不會傳送到任何地方；也能檢測現有密碼的強度。</p>

        <div class="card">
            <div id="pw" aria-live="polite"></div>
            <div class="meter"><i id="bar"></i></div>
            <div class="small" id="strength"></div>
            <div class="btns">
                <button class="primary" id="gen">重新產生</button>
                <button id="copy">複製</button>
            </div>
        </div>

        <div class="card">
            <div class="li opt">
                <label for="len">長度</label><b id="lenv">16</b>
            </div>
            <input id="len" type="range" min="8" max="64" value="16">
            <div class="li opt"><label for="lower">小寫英文 a-z</label><input id="lower" type="checkbox" checked></div>
            <div class="li opt"><label for="upper">大寫英文 A-Z</label><input id="upper" type="checkbox" checked></div>
            <div class="li opt"><label for="digit">數字 0-9</label><input id="digit" type="checkbox" checked></div>
            <div class="li opt"><label for="symbol">符號 !@#$…</label><input id="symbol" type="checkbox" checked></div>
            <div class="li opt"><label for="clear">排除易混淆字元（0 O 1 l I |）</label><input id="clear" type="checkbox"></div>
        </div>

        <div class="card" id="chkCard">
            <h2>強度檢測</h2>
            <p class="small" style="margin:0 0 10px">輸入你現有的密碼來估算強度。只在這個頁面的記憶體內計算，不會儲存、也不會傳到任何地方。</p>
            <input id="chk" type="password" autocomplete="off" spellcheck="false" placeholder="輸入要檢測的密碼" aria-label="要檢測的密碼" style="width:100%">
            <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="showChk"> 顯示內容</label>
            <div id="chkOut" style="margin-top:10px"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>在瀏覽器內產生隨機密碼，也能檢測你現有密碼的強度。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>註冊新帳號，需要一組又長又亂的密碼。</li>
        <li>想知道自己常用的密碼夠不夠強。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用「長度」滑桿選 8–64 個字元。</li>
        <li>勾選要包含的字元：小寫、大寫、數字、符號；可勾「排除易混淆字元」避開 0 O 1 l I |。</li>
        <li>按「重新產生」換一組，滿意後按「複製」。上方的強度條會顯示估計強度（bits）。</li>
        <li>強度檢測：在下方輸入現有密碼，看強度評級；勾「顯示內容」可看到自己打了什麼。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">長度 16、四種字元都勾
        → 例如 NJ&ge/&t8=He^=@*，強度約 103 bits，評為「非常強」</div>
        <h3>小提醒</h3>
        <ul>
        <li>密碼只在這個頁面的記憶體內產生與計算，不會儲存或傳送。</li>
        <li>建議每個網站用不同密碼，搭配密碼管理員。</li>
        <li>強度只是估算，常見字詞或規律即使很長也可能被猜到。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd } = Util;

        // --- pure ---
        const SETS = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            digit: '0123456789',
            symbol: '!@#$%^&*()-_=+[]{};:,.?/~',
        };
        const AMBIGUOUS = '0O1lI|';

        // 回傳 { password, bits }；每個勾選的類別至少出現一次，最後再洗牌避免固定位置
        function generate(len, kinds, noAmbiguous) {
            const sets = kinds.map(k => [...SETS[k]].filter(c => !(noAmbiguous && AMBIGUOUS.includes(c))).join(''));
            if (!sets.length || len < sets.length) return null;
            const pool = sets.join('');
            const chars = sets.map(s => s[rnd(s.length)]);
            while (chars.length < len) chars.push(pool[rnd(pool.length)]);
            for (let i = chars.length - 1; i > 0; i--) {
                const j = rnd(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return { password: chars.join(''), bits: len * Math.log2(pool.length) };
        }

        // ---------- 強度檢測 ----------
        // 常見弱密碼（全小寫、已把常見的 leet 替換還原後比對）
        const COMMON = ['password', 'passw0rd', '123456', '12345678', '123456789', '1234567890', '111111', '000000', '123123', '654321', 'qwerty', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm', 'abc123', 'iloveyou', 'admin', 'administrator', 'welcome', 'letmein', 'monkey', 'dragon', 'football', 'baseball', 'master', 'login', 'princess', 'sunshine', 'superman', 'batman', 'trustno1', 'shadow', 'michael', 'jordan', 'hello', 'freedom', 'whatever', 'qazwsx', '1q2w3e4r', '1qaz2wsx', 'zaq12wsx', 'taiwan', 'nextlink', 'a123456', 'aa123456', 'p@ssw0rd', 'root', 'test', 'guest', 'default', 'secret', 'changeme', 'pass', 'user', 'love', 'happy', 'summer', 'winter', 'computer', 'internet'];
        const KEYBOARD_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', '1234567890'];
        const unleet = (s) => s.toLowerCase().replace(/[@4]/g, 'a').replace(/[3]/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[5$]/g, 's').replace(/7/g, 't');

        // 估算密碼強度。bits = 有效長度 × log2(字元池大小)，再扣除可預測的結構：重複、連號、鍵盤順序、常見密碼、年份。回傳 { bits, issues[], pool }
        function assess(pw) {
            const issues = [];
            if (!pw) return { bits: 0, issues, pool: 0 };
            let pool = 0; if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26; if (/\d/.test(pw)) pool += 10; if (/[^A-Za-z0-9]/.test(pw)) pool += 32;
            let eff = [...pw].length;
            const lowered = pw.toLowerCase();
            // 重複字元（aaa、abab）
            const rep = pw.match(/(.)\1{2,}/g); if (rep) { issues.push('有連續重複的字元（' + rep[0].slice(0, 4) + '…）'); eff -= rep.reduce((a, r) => a + r.length - 1, 0); }
            if (/^(.{1,4})\1+$/.test(pw)) { issues.push('整個密碼是同一段內容重複'); eff = Math.min(eff, [...pw].length / 2); }
            // 連號與鍵盤順序（長度 ≥ 4）：每個可預測片段只算 1 個字元
            let runs = 0;
            for (let i = 0; i + 3 < lowered.length; i++) {
                const seg = lowered.slice(i, i + 4), d = [...seg].map((c, k) => (k ? c.charCodeAt(0) - seg.charCodeAt(k - 1) : 0)).slice(1);
                if (d.every(x => x === 1) || d.every(x => x === -1)) { runs++; i += 2; }
                else if (KEYBOARD_ROWS.some(r => r.includes(seg) || [...r].reverse().join('').includes(seg))) { runs++; i += 2; }
            }
            if (runs) { issues.push('含有連號或鍵盤順序（如 abcd、1234、qwer）'); eff -= runs * 3; }
            if (/(19|20)\d{2}/.test(pw)) { issues.push('含有年份'); eff -= 2; }
            let bits = Math.max(0, eff) * Math.log2(Math.max(pool, 2));
            const core = unleet(lowered).replace(/[^a-z0-9]/g, ''), stripped = unleet(lowered.replace(/[\d!@#$%^&*._-]+$/, '')).replace(/[^a-z0-9]/g, '');      // 尾巴的數字 / 符號先去掉再還原 leet
            if (COMMON.includes(lowered) || COMMON.includes(core) || COMMON.includes(stripped)) { issues.push('是常見的弱密碼，很快就會被猜到'); bits = Math.min(bits, Math.log2(COMMON.length * 1000)); }
            if (pw.length < 8) issues.push('太短（建議至少 12 個字元）');
            if (pool && pool <= 36 && pw.length >= 8) issues.push('只用了單一類型的字元，加入大小寫、數字或符號會更強');
            return { bits, issues, pool };
        }
        // 以每秒 100 億次猜測（離線攻擊、快速雜湊）估算平均破解時間（秒）
        const crackSeconds = (bits) => Math.pow(2, bits) / 2 / 1e10;
        function humanTime(sec) {
            if (sec < 1) return '不到 1 秒'; const U = [[60, '秒'], [60, '分鐘'], [24, '小時'], [365, '天'], [100, '年'], [10, '世紀'], [Infinity, '千年']]; let v = sec;
            for (const [k, name] of U) { if (v < k || k === Infinity) return (v >= 1e12 ? v.toExponential(1) : Math.floor(v).toLocaleString('en-US')) + ' ' + name; v /= k; }
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const LEVELS = [[40, '偏弱', '#ff453a'], [60, '普通', '#ff9f0a'], [80, '強', '#30d158'], [Infinity, '非常強', '#0a84ff']];

        function render() {
            $('#lenv').textContent = $('#len').value;
            const kinds = ['lower', 'upper', 'digit', 'symbol'].filter(k => $('#' + k).checked);
            const r = generate(+$('#len').value, kinds, $('#clear').checked);
            if (!r) {
                $('#pw').textContent = '請至少勾選一種字元類型';
                $('#strength').textContent = '';
                $('#bar').style.width = '0';
                return;
            }
            $('#pw').textContent = r.password;
            const [, name, color] = LEVELS.find(l => r.bits < l[0]);
            $('#bar').style.width = Math.min(100, r.bits / 128 * 100) + '%';
            $('#bar').style.background = color;
            $('#strength').textContent = `強度：${name}（約 ${Math.round(r.bits)} bits）`;
        }

        // 檢測區：只在本機計算，輸入內容不會被儲存或傳送
        function check() {
            const pw = $('#chk').value, box = $('#chkOut');
            if (!pw) { box.replaceChildren(); return; }
            const r = assess(pw), [, name, color] = LEVELS.find(l => r.bits < l[0]);
            const row = (a, b) => { const d = document.createElement('div'); d.className = 'li stat'; d.append(Object.assign(document.createElement('span'), { textContent: a }), Object.assign(document.createElement('b'), { textContent: b })); return d; };
            const bar = Object.assign(document.createElement('div'), { className: 'meter' }); const fill = document.createElement('i'); fill.style.width = Math.min(100, r.bits / 128 * 100) + '%'; fill.style.background = color; bar.append(fill);
            box.replaceChildren(bar, row('強度', `${name}（約 ${Math.round(r.bits)} bits）`), row('平均破解時間', humanTime(crackSeconds(r.bits))), ...r.issues.map(t => Object.assign(document.createElement('p'), { className: 'small', textContent: '⚠ ' + t })));
        }
        $('#chk').oninput = check;
        $('#showChk').onchange = () => { $('#chk').type = $('#showChk').checked ? 'text' : 'password'; };

        $('#gen').onclick = render;
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#pw').textContent, () => getSelection().selectAllChildren($('#pw')));
        document.querySelectorAll('.card:not(#chkCard) input').forEach(i => i.oninput = render);
        render();
    </script>
</body>

</html>
