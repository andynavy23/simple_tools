    <template id="help">
        <h3>這是什麼</h3>
        <p>內建 HTTP 狀態碼（1xx–5xx）、常用請求 / 回應 Header 與 MIME 類型的速查表，每筆有白話說明、何時會看到與排查方向。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>API 回了 <kbd>502</kbd> 或 <kbd>429</kbd>，想知道是誰的問題、怎麼查。</li>
        <li>寫後端要設 <kbd>Cache-Control</kbd>、CORS Header，需要範例值。</li>
        <li>不確定檔案該用什麼 <kbd>Content-Type</kbd>。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在搜尋欄輸入狀態碼、英文名稱、中文關鍵字或 Header 名稱。</li>
        <li>用「全部 / 狀態碼 / Header / MIME」縮小範圍，再用分類下拉選單細分（例如 4xx、CORS）。</li>
        <li>點一列展開詳情，按「複製」帶走狀態碼名稱、Header 範例或 MIME 值。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋 429 → Too Many Requests：請求太頻繁，看 Retry-After 等多久再試
搜尋 cors → 列出 Access-Control-* 與 Origin 等 Header 與範例值</div>
        <h3>小提醒</h3>
        <ul>
        <li>「排查方向」是常見情況，不是保證；實際原因仍要看伺服器 log 與回應內容。</li>
        <li>狀態碼只收錄標準（IANA 登記）的；各家服務自訂的碼（如 Cloudflare 52x）不在內。</li>
        <li>不儲存任何資料，也不會連線。</li>
        </ul>
    </template>

            const s = String(q ?? '').trim().toLowerCase();
            const pool = items.filter(x => (!kind || x.kind === kind) && (!cat || x.cat === cat));
