        <h1>股票交易成本與損益試算</h1>
        <p class="sub">臺股買賣的手續費、證交稅、淨損益與損益平衡價。費率與稅率都可以改，預設值僅供參考。</p>

        <div class="card">

    <template id="help">
        <h3>這是什麼</h3>
        <p>試算臺股買賣的交易成本與損益：手續費、證交稅、淨損益、報酬率，並反推「賣在多少才不虧」的損益平衡價。另外可算股利的補充保費，以及分批買進的加權平均成本。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>下單前想知道價差扣掉費用後還賺不賺。</li>
        <li>當沖、零股、ETF 的稅率與最低手續費不同，想比較。</li>
        <li>分批加碼後想知道平均成本。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>選模式（現股、零股、當沖、ETF），會帶入該模式常見的稅率、最低手續費與單位。</li>
        <li>填「買進價」「賣出價」「數量」並選單位（張或股）。</li>
        <li>展開「費率設定」可改手續費率、折扣、最低手續費、證交稅率、進位方式與補充保費；「還原預設」回到預設值。</li>
        <li>「損益試算」立即顯示結果；「股利試算」與「分批買進」各自獨立。</li>
        <li>最下方「進階試算」可展開：股利與殖利率（填息、除權息參考價、配股）、攤平成本與回本價、融資融券、當沖、ETF 配息扣繳與補充保費、ETF / 基金費用比較、估值（本益比、股價淨值比、股利折現）、加密貨幣損益（買賣手續費、滑價、平均成本、損益平衡價；純計算，非投資建議，稅務請自行確認）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">現股 買 100 元、賣 110 元、1 張，折扣 10、無條件捨去：
        買進手續費 142、賣出手續費 156、證交稅 330
        淨損益 = 10,000 − 142 − 156 − 330 = 9,372 元
        （改成四捨五入則為 143 / 157，淨損益 9,370）</div>
        <div class="eg">進階 例：收盤 100、現金股利 3、股票股利 1（配 0.1 股）→ 除權息參考價 = (100 − 3) ÷ 1.1 = 88.18；
        融資 100 元 1000 股、六成：融資 60,000、自備 40,000 + 手續費，維持率 166.67%，130% 追繳價 = 1.3 × 60,000 ÷ 1000 = 78 元</div>
        <h3>小提醒</h3>
        <ul>
        <li>進階試算的規定與數字：當沖證交稅 0.15% 目前延長至 116 年 12 月 31 日；二代健保補充保費 2.11%、單次股利或利息達 2 萬元起課（單次上限 1,000 萬；主管機關曾討論改制，請自行核對）；融資成數、融券保證金、融資年利率、借券費、追繳維持率（130%）、ETF 利息扣繳率與免扣繳門檻都是「範例值，請自行確認」，以券商與官方公告為準。估值與股利折現高度依賴假設，只能當粗略參考。</li>
        <li>預設費率與稅率（手續費 0.1425%、一般股票稅 0.3%、ETF 0.1%、當沖 0.15%、補充保費 2.11%）以當時法規與券商為準，請自行確認；最低手續費依券商規定。</li>
        <li>損益平衡價是「賣出淨損益剛好不為負」的最低價，實際下單還要符合升降單位。</li>
        <li>只有偏好設定（模式、折扣、費率、最低手續費、進位）存在本機；按「還原預設」即清除。分批買進與股利欄位不存檔，沒有累積資料，也就沒有上限。</li>
        <li>結果僅供試算參考，不構成投資建議。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, statRow } = Util;

        // --- pure ---
        const MAX_BATCH = 20;
        const MODES = {
            stock: { label: '現股', minFee: 20, tax: 0.3, unit: 'lot' },
            odd: { label: '零股', minFee: 1, tax: 0.3, unit: 'share' },
            day: { label: '當沖', minFee: 20, tax: 0.15, unit: 'lot' },
            etf: { label: 'ETF', minFee: 20, tax: 0.1, unit: 'lot' },
        };
        const DEFAULTS = { mode: 'stock', unit: 'lot', discount: 10, feeRate: 0.1425, minFee: 20, taxRate: 0.3, round: 'floor', nhiRate: 2.11, nhiMin: 20000 };
        // 各數值欄位的合法範圍；超出或型別不對就用預設值
        const RANGES = { discount: [0.1, 10], feeRate: [0, 1], minFee: [0, 1000], taxRate: [0, 5], nhiRate: [0, 10], nhiMin: [0, 1e8] };
        function cleanOpts(raw) {
            const r = raw && typeof raw === 'object' ? raw : {}, o = { ...DEFAULTS };
            if (MODES[r.mode]) o.mode = r.mode;
            if (r.unit === 'lot' || r.unit === 'share') o.unit = r.unit;
            if (r.round === 'floor' || r.round === 'round') o.round = r.round;
            for (const k in RANGES) if (typeof r[k] === 'number' && Number.isFinite(r[k]) && r[k] >= RANGES[k][0] && r[k] <= RANGES[k][1]) o[k] = r[k];
            return o;
        }
        // 切換模式時帶入該模式的預設稅率、最低手續費與單位
        const withMode = (o, mode) => ({ ...o, mode, minFee: MODES[mode].minFee, taxRate: MODES[mode].tax, unit: MODES[mode].unit });
        // 進位：先去掉浮點雜訊（142.49999999 → 142.5），再依設定處理
        const roundBy = (x, how) => { const v = Math.round(x * 1e6) / 1e6; return how === 'round' ? Math.round(v) : Math.floor(v); };
        const feeOf = (amount, o) => (amount > 0 ? Math.max(o.minFee, roundBy(amount * o.feeRate * o.discount / 1000, o.round)) : 0);
        const taxOf = (amount, o) => (amount > 0 ? roundBy(amount * o.taxRate / 100, o.round) : 0);
        const sharesOf = (qty, unit) => (unit === 'lot' ? qty * 1000 : qty);
        const amountOf = (price, shares) => Math.round(price * shares + 1e-9); // 成交金額四捨五入為整數元

        // 單次買賣；回傳 null 代表輸入不合法
        function trade(buy, sell, qty, o) {
            const shares = sharesOf(qty, o.unit);
            if (!(buy > 0) || !(sell >= 0) || !(shares > 0) || !Number.isFinite(buy + sell + shares)) return null;
            const buyAmt = amountOf(buy, shares), sellAmt = amountOf(sell, shares);
            const buyFee = feeOf(buyAmt, o), sellFee = feeOf(sellAmt, o), tax = taxOf(sellAmt, o);
            const invested = buyAmt + buyFee, costs = buyFee + sellFee + tax, net = sellAmt - sellFee - tax - invested;
            return { shares, buyAmt, sellAmt, buyFee, sellFee, tax, invested, costs, net, roi: net / invested * 100, bePrice: breakEven(buy, shares, o) };
        }
        // 損益平衡賣價：賣出淨損益 ≥ 0 的最小價格（二分法；淨損益只會在手續費進位處往下跳，所以收斂點必是向上穿越 0 的位置）
        function breakEven(buy, shares, o) {
            const buyAmt = amountOf(buy, shares);
            return breakEvenCost(buyAmt + feeOf(buyAmt, o), shares, o, buy);
        }
        function breakEvenCost(invested, shares, o, start) {
            const net = (p) => { const a = amountOf(p, shares); return a - feeOf(a, o) - taxOf(a, o) - invested; };
            let lo = 0, hi = Math.max(start || invested / shares, 0.01);
            for (let i = 0; i < 60 && net(hi) < 0; i++) hi *= 2;
            if (net(hi) < 0) return null;
            for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (net(mid) >= 0) hi = mid; else lo = mid; }
            return hi;
        }
        // 股利：現金股利（取整數元）、補充保費（單次 ≥ 起徵點才課）、殖利率（以買價）
        function dividend(dps, shares, buy, o) {
            if (!(dps >= 0) || !(shares > 0)) return null;
            const cash = Math.floor(dps * shares + 1e-9), nhi = cash >= o.nhiMin && cash > 0 ? roundBy(cash * o.nhiRate / 100, o.round) : 0;
            return { cash, nhi, net: cash - nhi, yieldPct: buy > 0 ? dps / buy * 100 : null };
        }
        // 分批買進加權平均成本（含各批買進手續費）；batches = [{ price, qty }]，單位沿用 o.unit；無效批次略過
        function avgCost(batches, o) {
            let shares = 0, total = 0, n = 0;
            for (const b of batches.slice(0, MAX_BATCH)) {
                const s = sharesOf(b.qty, o.unit);
                if (!(b.price > 0) || !(s > 0)) continue;
                const amt = amountOf(b.price, s);
                shares += s; total += amt + feeOf(amt, o); n++;
            }
            return n ? { shares, total, avg: total / shares, count: n } : null;
        }

        // ---- 進階試算（皆為估算，費率 / 保證金 / 利率請以券商與官方公告為準） ----
        const pos = (...a) => a.every(x => Number.isFinite(x) && x > 0);
        const ok0 = (...a) => a.every(x => Number.isFinite(x) && x >= 0);
        // 股利：現金殖利率、除權息參考價 =（收盤 − 現金）÷（1 + 股票股利 ÷ 面額 10）、填息所需漲幅、配股後股數與平均成本
        function exDividend(price, cash, stock, shares, avg) {
            if (!pos(price, shares) || !ok0(cash, stock, avg) || cash >= price) return null;
            const ref = (price - cash) / (1 + stock / 10), newShares = shares + Math.floor(shares * stock / 10 + 1e-9);
            const cost = (avg > 0 ? avg : price) * shares, cashGot = Math.floor(cash * shares + 1e-9);
            return { yieldPct: cash / price * 100, ref, fillPct: (price / ref - 1) * 100, newShares, cashGot, newAvg: cost / newShares, newAvgNet: (cost - cashGot) / newShares };
        }
        // 攤平：原持股 + 加碼一批（含手續費）→ 新平均成本與回本價（賣出含手續費與稅）
        function averageDown(hs, avg, price, addShares, o) {
            if (!ok0(hs, avg) || !pos(price, addShares)) return null;
            const amt = amountOf(price, addShares), total = hs * avg + amt + feeOf(amt, o), shares = hs + addShares;
            return { shares, total, avg: total / shares, be: breakEvenCost(Math.round(total), shares, o), drop: hs > 0 && avg > 0 ? (1 - total / shares / avg) * 100 : 0 };
        }
        // 融資：自備款、利息、維持率（市值 ÷ 融資金額）與追繳價
        function marginLong(price, shares, ratio, rate, days, call, sell, o) {
            if (!pos(price, shares, ratio, call) || ratio >= 100 || !ok0(rate, days)) return null;
            const amt = amountOf(price, shares), loan = Math.floor(amt * ratio / 100), fee = feeOf(amt, o), interest = Math.round(loan * rate / 100 * days / 365);
            const r = { amt, loan, own: amt - loan + fee, fee, interest, ratioNow: amt / loan * 100, callPrice: call / 100 * loan / shares, net: null, roi: null };
            if (Number.isFinite(sell) && sell > 0) { const sa = amountOf(sell, shares); r.net = sa - feeOf(sa, o) - taxOf(sa, o) - amt - fee - interest; r.roi = r.net / r.own * 100; }
            return r;
        }
        // 融券：保證金、擔保價款、維持率與追繳價、回補損益（借券費以成交金額 × 費率）
        function marginShort(price, shares, mPct, borrowPct, call, cover, o) {
            if (!pos(price, shares, mPct, call) || !ok0(borrowPct)) return null;
            const amt = amountOf(price, shares), fee = feeOf(amt, o), tax = taxOf(amt, o), borrow = roundBy(amt * borrowPct / 100, o.round);
            const collateral = amt - fee - tax - borrow, margin = Math.round(amt * mPct / 100);
            const r = { amt, fee, tax, borrow, collateral, margin, ratioNow: (collateral + margin) / amt * 100, callPrice: (collateral + margin) / (call / 100 * shares), net: null };
            if (Number.isFinite(cover) && cover > 0) { const ca = amountOf(cover, shares); r.net = collateral - ca - feeOf(ca, o); }
            return r;
        }
        // 當沖 vs 一般現股：同樣價量，只差證交稅率
        function dayTradeCompare(buy, sell, shares, dayTax, o) {
            const day = trade(buy, sell, shares, { ...o, unit: 'share', taxRate: dayTax }), normal = trade(buy, sell, shares, { ...o, unit: 'share', taxRate: 0.3 });
            return day && { day, normal, saved: normal.tax - day.tax };
        }
        // ETF 配息：股利 / 利息兩種所得「各自」單次達起徵點才課補充保費（單次上限 1,000 萬）；利息部分超過免扣繳門檻才扣繳；其餘（資本利得、本金）不課
        function etfDividend(stockPart, intPart, otherPart, o, wRate, wMin) {
            if (!ok0(stockPart, intPart, otherPart, wRate, wMin) || stockPart + intPart + otherPart <= 0) return null;
            const nhiOf = (x) => (x >= o.nhiMin && x > 0 ? roundBy(Math.min(x, 1e7) * o.nhiRate / 100, o.round) : 0);
            const nhi = nhiOf(stockPart) + nhiOf(intPart), wh = intPart > wMin ? roundBy(intPart * wRate / 100, o.round) : 0, gross = stockPart + intPart + otherPart;
            return { gross, nhi, wh, net: gross - nhi - wh };
        }
        // 費用率對長期報酬：一次投入，期初扣申購手續費，每年以（報酬 − 費用率）複利
        function feeImpact(p, years, ret, a, b) {
            const fv = (x) => { const g = 1 + (ret - x.ter) / 100; return g > 0 ? p * (1 - x.load / 100) * Math.pow(g, years) : NaN; };
            if (!pos(p, years) || !Number.isFinite(ret) || ![a.ter, a.load, b.ter, b.load].every(x => Number.isFinite(x) && x >= 0 && x < 100)) return null;
            const A = fv(a), B = fv(b);
            return Number.isFinite(A + B) ? { A, B, diff: A - B } : null;
        }
        // 估值：本益比 / 股價淨值比合理價區間 + 股利折現（Gordon：D0×(1+g)÷(r−g)）
        function valuation(v) {
            const out = { pe: null, pb: null, ddm: null, curPE: null, curPB: null };
            if (pos(v.eps)) { out.pe = [v.eps * v.peLo, v.eps * v.peHi]; if (pos(v.price)) out.curPE = v.price / v.eps; }

        // 加密貨幣：原持有 q0 單位（均價 c0，已含費）+ 加碼 q1 單位於 p1；買賣各有手續費率 fee%（買：成本 × (1+fee)；賣：收入 × (1−fee)）與不利滑價 slip%（買貴、賣便宜）。
