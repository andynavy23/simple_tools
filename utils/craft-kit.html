<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>手作工坊</h1>
        <p class="sub">3D 列印、編織、拼豆、十字繡、裁切、蠟燭、手工皂與針法圖例。結果僅供參考。</p>

        <div class="chips" id="tabs"></div>

        <div class="card" id="formCard">
            <div class="warn" id="warn" hidden>安全第一：處理氫氧化鈉（鹼）務必戴護目鏡與耐鹼手套、長袖，通風良好；永遠把鹼緩緩加入水中，不可把水倒進鹼；工作區域遠離兒童與寵物。</div>
            <div id="form"></div>

            <p class="note">內建為通用範例色板，不對應任何品牌色號；請依你手上的珠 / 線顏色改色、改名、增刪（最多 40 色）。</p>
            <div id="pal"></div>

        <div class="card">

    <template id="help">
        <h3>這是什麼</h3>
        <p>八個手作小工具放在同一頁：3D 列印成本、編織密度與針數、拼豆圖案轉換、十字繡圖案轉換、一維裁切最佳化、蠟燭配比、手工皂皂化、針法圖例速查。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>列印前想知道成本與報價；織圍巾前想算要起幾針。</li>
            <li>想把照片變成拼豆 / 十字繡圖紙與用量表。</li>
            <li>木料、鋁條、管材要裁切，想少買幾支；做蠟燭、手工皂前算配方。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li>點上方分頁，填欄位，結果即時更新；按「複製結果」貼到筆記。</li>
            <li>圖案轉換：載入圖片 → 設格數 → 在「色板」改成你手上有的顏色 → 看格圖與各色用量 → 匯出 PNG 或列印。</li>
            <li>裁切清單與皂的油脂清單每行一筆：<kbd>長度 數量</kbd>、<kbd>油名 克數</kbd>。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">編織：樣片 10 cm 有 20 針 28 段，要 50 cm 寬 → 100 針
裁切：長料 240、切口 0.3、清單「80 3 / 60 4」→ 先大後小排進長料
皂：橄欖油 500 g、鹼折扣 5% → NaOH 63.65 g、水 127.3 g（水鹼比 2）</div>
        <h3>小提醒</h3>
        <ul>
            <li>手工皂：鹼有腐蝕性，請戴護目鏡與耐鹼手套，鹼加入水而非反向，兒童寵物遠離。SAP 值僅收少數常見油脂，且各來源略有差異，<b>請以專業皂化計算機核對</b>；也可在清單第三欄自填 SAP。</li>
            <li>裁切採 first-fit-decreasing 啟發式，結果通常接近最佳但<b>不保證最少根數</b>；下限值僅供對照。</li>
            <li>蠟燭：蠟密度約 0.9 g/mL 為範例值，香精比例 6–10% 請依蠟種建議；燭芯與安全用火請另行確認。</li>
            <li>拼豆 / 十字繡：色板是通用範例，轉換為最近色近似，實際成品色差請自行判斷；圖片上限 20 MB / 1600 萬像素，格數 4–150。</li>
            <li>只存上次分頁與輸入這一份小資料，可用最下方按鈕清除，也能用右上角 💾 備份；壞資料會自動還原預設。清單最多 200 行；圖片 / 色板不儲存。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store } = Util;

        // --- pure ---
        const fmtNum = (n, d = 1) => Number.isFinite(n) ? String(+n.toFixed(d)) : '—';
        const parseNum = (s) => { const t = String(s == null ? '' : s).trim(); return /^\d+(\.\d+)?$|^\.\d+$/.test(t) ? Number(t) : NaN; };

        // 3D 列印成本（耗損率、利潤率為 %）
        function printCost(a) {
            const { grams, pricePerKg, wastePct, hours, watts, kwhPrice, machinePrice, lifeHours, other, marginPct } = a;
            if (![grams, pricePerKg, hours, watts, kwhPrice, machinePrice, lifeHours, other, wastePct, marginPct].every(Number.isFinite) || grams <= 0 || lifeHours <= 0) return { err: '請填入完整且合理的數字（重量 > 0、折舊壽命 > 0）' };
            const material = grams * (1 + wastePct / 100) / 1000 * pricePerKg;
            const energy = watts / 1000 * hours * kwhPrice;
            const dep = machinePrice / lifeHours * hours;
            const cost = material + energy + dep + other;
            return { material, energy, dep, other, cost, quote: cost * (1 + marginPct / 100) };
        }

        // 編織：樣片 sst 針 × srow 段 = sw × sh cm；成品 tw × th cm；針數 = k × mult + extra
        function knitCalc(a) {
            const { sst, srow, sw, sh, tw, th, mult, extra } = a;
            if (![sst, srow, sw, sh, tw, th, mult, extra].every(Number.isFinite) || [sst, srow, sw, sh, tw, th].some(x => x <= 0) || mult < 1 || mult !== Math.floor(mult) || extra !== Math.floor(extra)) return { err: '請填入完整且大於 0 的數字（循環至少 1 的整數、邊針為整數）' };
            const rawSt = tw * sst / sw, rawRow = th * srow / sh;
            const k = Math.max(1, Math.round((rawSt - extra) / mult)), stitches = k * mult + extra, rows = Math.max(1, Math.round(rawRow));
            return { rawSt, rawRow, stitches, rows, perCm: sst / sw, rowPerCm: srow / sh, realW: stitches * sw / sst, realH: rows * sh / srow };
        }

        // 色板量化（決定性：距離相同取編號小者）。px = RGBA 陣列；alpha < 128 視為透明（-1）
        function hex2rgb(h) { const m = /^#([0-9a-f]{6})$/i.exec(String(h)); return m ? [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16)) : null; }
        function cdist(a, b) { const rm = (a[0] + b[0]) / 2, r = a[0] - b[0], g = a[1] - b[1], bl = a[2] - b[2]; return (2 + rm / 256) * r * r + 4 * g * g + (2 + (255 - rm) / 256) * bl * bl; }
        function nearest(rgb, rgbs, allow) {
            let bi = -1, bd = Infinity;
            for (let i = 0; i < rgbs.length; i++) { if (allow && !allow[i]) continue; const d = cdist(rgb, rgbs[i]); if (d < bd) { bd = d; bi = i; } }
            return bi;
        }
        function quantize(px, n, hexes) {
            const rgbs = hexes.map(hex2rgb), out = new Array(n);
            for (let i = 0; i < n; i++) out[i] = px[i * 4 + 3] < 128 ? -1 : nearest([px[i * 4], px[i * 4 + 1], px[i * 4 + 2]], rgbs);
            return out;
        }
        const usage = (idx, k) => { const c = new Array(k).fill(0); idx.forEach(i => { if (i >= 0) c[i]++; }); return c; };
        // 只保留用量最多的 max 色，其餘改成保留色中最近者
        function limitColors(idx, hexes, max) {
            const c = usage(idx, hexes.length), used = c.map((n, i) => [n, i]).filter(x => x[0] > 0);
            if (used.length <= max) return idx;
            const keep = used.sort((a, b) => b[0] - a[0] || a[1] - b[1]).slice(0, max).map(x => x[1]), allow = hexes.map((_, i) => keep.includes(i)), rgbs = hexes.map(hex2rgb);
            const map = hexes.map((h, i) => allow[i] ? i : nearest(rgbs[i], rgbs, allow));
            return idx.map(i => i < 0 ? -1 : map[i]);
        }
        // 圖片寬高 bw × bh 縮成 cols 格寬 → 格高；超過 150 回 null
        function gridSize(bw, bh, cols) { if (!(bw > 0 && bh > 0 && cols >= 4 && cols <= 150)) return null; const r = Math.max(1, Math.round(cols * bh / bw)); return r > 150 ? null : { c: cols, r }; }

        // 一維裁切：切口併入件長，等同標準裝箱（件 = len + kerf，箱 = stock + kerf），first-fit-decreasing
        function cutPlan(stock, kerf, lens) {
            if (!(stock > 0) || !(kerf >= 0) || !lens.length) return { err: '請填入長料長度、切口寬與裁切清單' };
            if (lens.some(l => !(l > 0))) return { err: '裁切長度必須大於 0' };
            if (lens.some(l => l > stock + 1e-9)) return { err: '有零件比長料還長（' + Math.max(...lens) + ' > ' + stock + '）' };
            const E = 1e-9, bars = [];
            [...lens].sort((a, b) => b - a).forEach(l => {
                const w = l + kerf, b = bars.find(x => x.load + w <= stock + kerf + E);
                if (b) { b.load += w; b.cuts.push(l); } else bars.push({ load: w, cuts: [l] });
            });
            bars.forEach(b => { b.used = b.cuts.reduce((s, x) => s + x, 0) + kerf * (b.cuts.length - 1); b.left = stock - b.used; });
            const sum = lens.reduce((s, x) => s + x, 0), lower = Math.ceil((lens.reduce((s, x) => s + x + kerf, 0) - E) / (stock + kerf));
            return { bars, count: bars.length, lower: Math.max(1, lower), sum, waste: 1 - sum / (bars.length * stock) };
        }
        function parseCuts(text) {
            const lens = [], bad = []; let over = false;
            String(text || '').split(/\r?\n/).slice(0, 200).forEach(line => {
                const t = line.trim(); if (!t) return;
                const p = t.split(/[\s,，xX×*]+/), l = parseNum(p[0]), q = p[1] === undefined ? 1 : parseNum(p[1]);
                if (!(l > 0) || !(q >= 1) || q !== Math.floor(q) || p.length > 2) { bad.push(t); return; }
                for (let i = 0; i < q; i++) { if (lens.length >= 500) { over = true; break; } lens.push(l); }
            });
            return { lens, bad, over };
        }

        // 蠟燭：容量 mL × 倒入比例 → 總重；香精比例 6–10%（占總重）
        function candleCalc(ml, fillPct, fragPct, density) {
            if (![ml, fillPct, fragPct, density].every(Number.isFinite) || ml <= 0 || density <= 0 || fillPct <= 0 || fillPct > 100) return { err: '請填入容量、倒入比例（1–100%）與密度' };
            if (fragPct < 6 || fragPct > 10) return { err: '香精比例請設在 6–10%' };
            const total = ml * fillPct / 100 * density, frag = total * fragPct / 100;
            return { total, frag, wax: total - frag };
        }

        // 手工皂（NaOH）：SAP 為每克油脂所需 NaOH 克數。各來源略有差異，僅供參考
        const SAP = { '橄欖油': 0.134, '椰子油': 0.183, '棕櫚油': 0.141, '蓖麻油': 0.128, '乳油木果脂': 0.128, '甜杏仁油': 0.136, '豬油': 0.138, '可可脂': 0.137 };
        function parseOils(text) {
            const items = [], bad = [];
            String(text || '').split(/\r?\n/).slice(0, 20).forEach(line => {
                const t = line.trim(); if (!t) return;
                const p = t.split(/[\s,，]+/), g = parseNum(p[1]), sap = p[2] === undefined ? SAP[p[0]] : parseNum(p[2]);
                if (!(g > 0) || !(sap >= 0.05 && sap <= 0.4) || p.length > 3) bad.push(t); else items.push({ name: p[0], g, sap });
            });
            return { items, bad };
        }
        function soapCalc(items, discountPct, waterRatio) {
            if (!items.length) return { err: '請輸入油脂清單' };
            if (!(discountPct >= 0 && discountPct <= 30)) return { err: '鹼折扣請設在 0–30%' };
            if (!(waterRatio >= 1 && waterRatio <= 4)) return { err: '水鹼比請設在 1–4（常用約 2）' };
            const oil = items.reduce((s, x) => s + x.g, 0), full = items.reduce((s, x) => s + x.g * x.sap, 0), lye = full * (1 - discountPct / 100), water = lye * waterRatio;
            return { oil, full, lye, water, conc: lye / (lye + water), batch: oil + lye + water };
        }

        // 表單定義與設定讀取
        const TABS = [
            ['print', '3D 列印成本', [['grams', '耗材用量（克）', 'n', '50'], ['price', '耗材單價（元 / 公斤）', 'n', '600'], ['waste', '耗損率（支撐、失敗，%）', 'n', '10'], ['hours', '列印時間（小時）', 'n', '4'], ['watts', '平均功率（瓦）', 'n', '120'], ['kwh', '電價（元 / 度）', 'n', '3'], ['mprice', '機台價格（元）', 'n', '10000'], ['life', '機台折舊壽命（小時）', 'n', '2000'], ['other', '其他費用（後處理、包材，元）', 'n', '0'], ['margin', '利潤率（%）', 'n', '30']]],
            ['knit', '編織針數', [['sst', '樣片針數', 'n', '20'], ['sw', '樣片寬度（cm）', 'n', '10'], ['srow', '樣片段數', 'n', '28'], ['sh', '樣片高度（cm）', 'n', '10'], ['tw', '成品寬度（cm）', 'n', '50'], ['th', '成品長度（cm）', 'n', '150'], ['mult', '針數循環（針，1 = 不限）', 'n', '1'], ['extra', '邊針（額外針數）', 'n', '0']]],
            ['bead', '拼豆圖案', [['cols', '橫向格數（4–150）', 'n', '29']]],
            ['cross', '十字繡圖案', [['cols', '橫向格數（4–150）', 'n', '60'], ['max', '色線數量上限', 'n', '12']]],
            ['cut', '裁切最佳化', [['stock', '長料長度', 'n', '240'], ['kerf', '切口寬（鋸片厚度）', 'n', '0.3'], ['list', '裁切清單（每行：長度 數量）', 't', '80 3\n60 4\n45 2']]],
            ['candle', '蠟燭配比', [['ml', '容器容量（mL）', 'n', '200'], ['fill', '倒入比例（%）', 'n', '90'], ['frag', '香精比例（6–10%）', 'n', '8'], ['dens', '蠟密度（g/mL，範例約 0.9）', 'n', '0.9']]],
            ['soap', '手工皂皂化', [['oils', '油脂清單（每行：油名 克數 [自填SAP]）', 't', '橄欖油 300\n椰子油 150\n棕櫚油 50'], ['disc', '鹼折扣（%）', 'n', '5'], ['ratio', '水鹼比（水 ÷ 鹼）', 'n', '2']]],
            ['ref', '針法圖例', []]
        ];
        const TAB_IDS = TABS.map(t => t[0]), DEF = { tab: 'print', v: {} };
        TABS.forEach(([id, , fs]) => fs.forEach(f => { DEF.v[id + '_' + f[0]] = f[3]; }));
        function loadOpts(raw) {
            const o = { tab: DEF.tab, v: Object.assign({}, DEF.v) };
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return o;
            if (TAB_IDS.includes(raw.tab)) o.tab = raw.tab;
            if (raw.v && typeof raw.v === 'object' && !Array.isArray(raw.v)) {
                for (const [id, , fs] of TABS) for (const f of fs) {
                    const x = raw.v[id + '_' + f[0]];
                    if (typeof x === 'string' && x.length <= (f[2] === 't' ? 3000 : 100)) o.v[id + '_' + f[0]] = x;
                }
            }
            return o;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'craftkit_opts';
        let o = loadOpts(store.get(KEY, null));
        const V = (k) => o.v[o.tab + '_' + k];
        const N = (k) => parseNum(V(k));
        const save = () => store.set(KEY, { tab: o.tab, v: o.v });
        const R = (k, v) => [k, v];
        const money = (n) => fmtNum(n, 1) + ' 元';

        const CALC = {
            print() {
                const r = printCost({ grams: N('grams'), pricePerKg: N('price'), wastePct: N('waste'), hours: N('hours'), watts: N('watts'), kwhPrice: N('kwh'), machinePrice: N('mprice'), lifeHours: N('life'), other: N('other'), marginPct: N('margin') }); if (r.err) return r;
                return { rows: [R('耗材', money(r.material)), R('電費', money(r.energy)), R('機台折舊', money(r.dep)), R('其他', money(r.other)), R('成本合計', money(r.cost)), R('建議報價', money(r.quote))], note: '成本 = 耗材 ×（1 + 耗損率）+ 功率 × 時間 × 電價 + 機台價 ÷ 壽命 × 時間 + 其他；報價 = 成本 ×（1 + 利潤率）。未含人工、場地與稅，預設值僅為範例。' };
            },
            knit() {
                const r = knitCalc({ sst: N('sst'), srow: N('srow'), sw: N('sw'), sh: N('sh'), tw: N('tw'), th: N('th'), mult: N('mult'), extra: N('extra') }); if (r.err) return r;
                return { rows: [R('密度', `${fmtNum(r.perCm * 10, 1)} 針 × ${fmtNum(r.rowPerCm * 10, 1)} 段 / 10 cm`), R('起針數', r.stitches + ' 針'), R('總段數', r.rows + ' 段'), R('實際尺寸', `約 ${fmtNum(r.realW, 1)} × ${fmtNum(r.realH, 1)} cm`)], note: '樣片請先水洗 / 整燙定型再量；起針數四捨五入並對齊針數循環（循環 × k + 邊針）。不同人、不同線材密度不同，樣片務必自己織。' };
            },
            cut() {
                const c = parseCuts(V('list')); if (!c.lens.length) return { err: '裁切清單每行寫「長度 數量」，例如 80 3' };
                const p = cutPlan(N('stock'), N('kerf'), c.lens); if (p.err) return p;
                return { rows: [R('零件數', c.lens.length + ' 件'), R('長料根數', p.count + ' 根' + (p.count === p.lower ? '（已達下限）' : `（下限 ${p.lower}）`)), R('耗損率', fmtNum(p.waste * 100, 1) + '%'), ...(c.bad.length ? [R('無法辨識', c.bad.length + ' 行（已略過）')] : []), ...(c.over ? [R('超過上限', '只計前 500 件')] : [])], head: ['#', '裁切', '已用', '餘料'], table: p.bars.map((b, i) => [i + 1, b.cuts.join(' + '), fmtNum(b.used, 2), fmtNum(b.left, 2)]), note: '採 first-fit-decreasing 啟發式，通常接近最佳但不保證最少根數；下限為理論最少值（不一定能達到）。耗損率含切口與餘料；餘料可能可留作他用。' };
            },
            candle() {
                const r = candleCalc(N('ml'), N('fill'), N('frag'), N('dens')); if (r.err) return r;
                return { rows: [R('總重', fmtNum(r.total, 1) + ' g'), R('蠟', fmtNum(r.wax, 1) + ' g'), R('香精', fmtNum(r.frag, 1) + ' g')], note: '蠟密度約 0.9 g/mL 為範例值（大豆蠟、石蠟略有差異）；香精比例 6–10% 請依蠟種與香精建議上限；香精假設密度約與蠟相同。燭芯選擇與安全用火請另行確認，蠟會縮，可能需二次補倒。' };
            },
            soap() {
                const p = parseOils(V('oils')); if (p.bad.length) return { err: '無法辨識：' + p.bad.join('；') + '（油名需在內建清單，或第三欄自填 SAP 0.05–0.4）' };
                const r = soapCalc(p.items, N('disc'), N('ratio')); if (r.err) return r;
                return { rows: [R('油脂總重', fmtNum(r.oil, 1) + ' g'), R('全皂化 NaOH', fmtNum(r.full, 2) + ' g'), R('實際 NaOH（含折扣）', fmtNum(r.lye, 2) + ' g'), R('水', fmtNum(r.water, 2) + ' g'), R('鹼液濃度', fmtNum(r.conc * 100, 1) + '%'), R('總重（不含香料添加物）', fmtNum(r.batch, 1) + ' g')], note: '請以專業皂化計算機核對 SAP 與配方後再操作。內建 SAP（NaOH，g / g 油）：' + Object.entries(SAP).map(([k, v]) => k + ' ' + v).join('、') + '。戴護目鏡與耐鹼手套，鹼加入水而非反向，兒童寵物遠離。僅支援 NaOH（固體皂）。' };
            }
        };

        // 針法圖例（簡化示意）：[類別, 名稱, 說明, svg path, 虛線]
        const REF = [
            ['編織', '下針（平針）', '線在織片後方，右針由前往後穿入線圈，勾出新線圈。連續織正面為光滑的 V 字紋。', 'M12 8 L24 24 L36 8 M12 24 L24 40 L36 24'],
            ['編織', '上針', '線在織片前方，右針由後往前穿入線圈。正面呈橫向小突點，常與下針交替做出羅紋。', 'M10 18 Q24 8 38 18 M10 34 Q24 24 38 34'],
            ['編織', '起針（長尾起針）', '用線尾與主線在針上做出第一排線圈，邊緣有彈性，是最常用的起針法之一。', 'M6 34 H42 M10 22 a4 4 0 1 0 0.1 0 M24 22 a4 4 0 1 0 0.1 0 M38 22 a4 4 0 1 0 0.1 0'],
            ['編織', '繞線加針（yo）', '把線由前往後繞過右針，形成一個新線圈，下一排再織掉，會留下小洞，常用於蕾絲花樣。', 'M24 12 a12 12 0 1 0 0.1 0'],
            ['編織', '右上二併針（k2tog）', '同時對兩針織下針，減 1 針，斜線向右傾。', 'M12 38 L36 10'],
            ['編織', '左上二併針（ssk）', '先將兩針各滑一針（如織下針）再一起織，減 1 針，斜線向左傾，與右上二併針成對稱。', 'M12 10 L36 38'],
            ['編織', '收針（套收）', '織兩針後，把第一針套過第二針，重複至最後一針穿線拉緊，邊緣不宜拉太緊以免失去彈性。', 'M8 34 Q16 12 24 34 Q32 12 40 34'],
            ['鉤針', '鎖針（ch）', '鉤針上的線圈拉出新線圈，連續做出一串，是大多數鉤織的起點。', 'M3 24 a7 4 0 1 0 14 0 a7 4 0 1 0 -14 0 M17 24 a7 4 0 1 0 14 0 a7 4 0 1 0 -14 0 M31 24 a7 4 0 1 0 14 0 a7 4 0 1 0 -14 0'],
            ['鉤針', '短針（sc）', '針穿入前排針目，勾線拉出一個圈，再勾線一次穿過兩個線圈。針目矮而緊密，織片厚實。', 'M24 10 V38 M10 24 H38'],
            ['鉤針', '長針（dc）', '先繞線一圈再穿入針目，分兩次各穿過兩個線圈。比短針高，織片較鬆軟。', 'M12 10 H36 M24 10 V40 M17 28 L31 20'],
            ['縫紉', '平針縫（running stitch）', '針在布料上下穿梭，正反面針距相同，用於假縫、抽皺與簡單接合。', 'M6 24 H42', '6 5'],
            ['縫紉', '回針縫（backstitch）', '每針往回退半針再向前穿出，線連續相接，強度高，接近縫紉機直線縫。', 'M6 24 H18 M18 24 H30 M30 24 H42 M16 24 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0 M28 24 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0'],
            ['縫紉', '捲針縫（whip stitch）', '針沿著布邊斜向繞過邊緣，用於縫合兩片布的邊或收邊。', 'M6 34 H42 M10 14 L16 34 M20 14 L26 34 M30 14 L36 34'],
            ['縫紉', '毛毯邊縫（blanket stitch）', '線在針下形成圈，沿邊緣每隔固定距離縫一針，可裝飾也可防止布邊鬚散。', 'M6 34 H42 M12 14 V34 M24 14 V34 M36 14 V34'],
            ['刺繡', '十字繡針法', '每格由兩條斜線交叉成 X，上層斜線方向要全幅一致，成品才整齊。', 'M12 12 L36 36 M36 12 L12 36'],
            ['刺繡', '法式結粒繡（French knot）', '線在針上繞幾圈，再於起針處旁邊穿回布面，形成一粒小圓點，常用於眼睛、花蕊。', 'M24 42 V30 M17 20 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0']
        ];

        const kind = () => o.tab === 'ref' ? 'ref' : (o.tab === 'bead' || o.tab === 'cross') ? 'img' : 'calc';
        let last = '';
        function render() {
            const k = kind();
            $('#formCard').hidden = k === 'ref'; $('#outCard').hidden = k !== 'calc';
            $('#imgCard').hidden = $('#palCard').hidden = k !== 'img'; $('#refCard').hidden = k !== 'ref';
            $('#warn').hidden = o.tab !== 'soap';
            if (k === 'img') { $('#err').textContent = ''; return drawGrid(); }
            if (k === 'ref') return;
            const r = CALC[o.tab](), res = $('#res'), tb = $('#tbl');
            res.replaceChildren(); tb.replaceChildren(); $('#err').textContent = r.err || ''; $('#note').textContent = '';
            $('#copy').hidden = !!r.err; $('#print').hidden = o.tab !== 'cut' || !!r.err;
            if (r.err) { last = ''; res.append(Util.statRow('請輸入完整資料', '—')); return; }
            r.rows.forEach(([a, b]) => res.append(Util.statRow(a, String(b))));
            if (r.table) {
                const t = document.createElement('table'), h = t.createTHead().insertRow();
                r.head.forEach(x => h.appendChild(Object.assign(document.createElement('th'), { textContent: x })));
                const b = t.createTBody(); r.table.forEach(row => { const tr = b.insertRow(); row.forEach(c => tr.insertCell().textContent = c); });
                tb.append(t);
            }
            $('#note').textContent = r.note || '';
            last = TABS.find(t => t[0] === o.tab)[1] + '\n' + r.rows.map(x => x.join('：')).join('\n') + (r.table ? '\n\n' + [r.head, ...r.table].map(x => x.join('\t')).join('\n') : '') + '\n\n' + (r.note || '');
        }
        function buildForm() {
            $('#tabs').replaceChildren(...TABS.map(([id, name]) => { const b = Object.assign(document.createElement('button'), { className: 'sm', textContent: name }); b.dataset.t = id; b.setAttribute('aria-pressed', String(id === o.tab)); b.onclick = () => { o.tab = id; save(); buildForm(); render(); }; return b; }));
            const f = $('#form'); f.replaceChildren();
            TABS.find(t => t[0] === o.tab)[2].forEach(([k, label, kd]) => {
                const id = 'f_' + k, lb = Object.assign(document.createElement('label'), { className: 'f', textContent: label, htmlFor: id });
                const el = document.createElement(kd === 't' ? 'textarea' : 'input');
                el.id = id; el.className = 'w'; el.setAttribute('aria-label', label);
                if (kd === 'n') { el.inputMode = 'text'; el.autocomplete = 'off'; }
                el.value = V(k);
                el.addEventListener('input', () => { o.v[o.tab + '_' + k] = el.value; save(); render(); });
                f.append(lb, el);
            });
        }

        // ===== 針法圖例 =====
        const NS = 'http://www.w3.org/2000/svg';
        $('#refList').replaceChildren(...REF.map(([cat, name, desc, d, dash]) => {
            const row = document.createElement('div'); row.className = 'ref';
            const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 48 48'); svg.setAttribute('aria-hidden', 'true');
            const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '2.5'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); if (dash) p.setAttribute('stroke-dasharray', dash);
            svg.append(p);
            const b = document.createElement('b'), s = document.createElement('small'), pp = document.createElement('p');
            b.textContent = name; s.textContent = cat; b.append(s); pp.textContent = desc;
            const box = document.createElement('div'); box.append(b, pp); row.append(svg, box); return row;
        }));

        // ===== 圖案轉換 =====
        const SYM = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789#%@&+*=?';
        const PAL0 = [['白', '#FFFFFF'], ['黑', '#222222'], ['灰', '#9E9E9E'], ['紅', '#D32F2F'], ['橘', '#F57C00'], ['黃', '#FDD835'], ['淺綠', '#8BC34A'], ['深綠', '#2E7D32'], ['藍綠', '#00897B'], ['天藍', '#4FC3F7'], ['藍', '#1565C0'], ['深藍', '#1A237E'], ['紫', '#7B1FA2'], ['粉紅', '#F48FB1'], ['咖啡', '#6D4C41'], ['膚色', '#FFCCBC']];
        const MAX_PAL = 40, MAX_FILE = 20 * 1024 * 1024, MAX_PX = 16e6;
        let pal = PAL0.map(([name, hex]) => ({ name, hex })), bmp = null, fileName = 'pattern';
        function buildPal() {
            $('#pal').replaceChildren(...pal.map((c, i) => {
                const row = document.createElement('div'); row.className = 'prow';
                const col = Object.assign(document.createElement('input'), { type: 'color', value: c.hex }); col.setAttribute('aria-label', '顏色 ' + (i + 1));
                col.oninput = () => { c.hex = col.value; drawGrid(); };
                const nm = Object.assign(document.createElement('input'), { type: 'text', value: c.name, maxLength: 20 }); nm.setAttribute('aria-label', '顏色名稱 ' + (i + 1));
                nm.oninput = () => { c.name = nm.value; drawGrid(); };
                const del = Object.assign(document.createElement('button'), { className: 'sm', textContent: '刪除' });
                del.onclick = () => { if (pal.length <= 2) { $('#imgErr').textContent = '色板至少要 2 色'; return; } pal.splice(i, 1); buildPal(); drawGrid(); };
                row.append(col, nm, del); return row;
            }));
        }
        function drawGrid() {
            const cv = $('#cv'), err = $('#imgErr'), tb = $('#usage'); err.textContent = ''; tb.replaceChildren();
            $('#imgTitle').textContent = o.tab === 'bead' ? '拼豆圖紙' : '十字繡圖紙';
            $('#png').hidden = $('#print2').hidden = cv.hidden = true; $('#imgNote').textContent = '';
            if (!bmp) { $('#imgNote').textContent = '請先載入圖片。'; return; }
            const g = gridSize(bmp.width, bmp.height, N('cols'));
            if (!g) { err.textContent = '格數請填 4–150 的數字（且縮放後高度不超過 150 格）'; return; }
            const sc = document.createElement('canvas'); sc.width = g.c; sc.height = g.r;
            const sx = sc.getContext('2d', { willReadFrequently: true }); sx.imageSmoothingQuality = 'high'; sx.drawImage(bmp, 0, 0, g.c, g.r);
            const hexes = pal.map(c => c.hex);
            let idx = quantize(sx.getImageData(0, 0, g.c, g.r).data, g.c * g.r, hexes);
            if (o.tab === 'cross') { const m = N('max'); if (!(m >= 1 && m <= MAX_PAL)) { err.textContent = '色線數量上限請填 1–' + MAX_PAL; return; } idx = limitColors(idx, hexes, Math.floor(m)); }
            const cell = Math.max(10, Math.min(28, Math.floor(1600 / g.c))), x = cv.getContext('2d'), circle = o.tab === 'bead';
            cv.width = g.c * cell; cv.height = g.r * cell; cv.hidden = false;
            x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
            x.font = `bold ${Math.floor(cell * 0.6)}px sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 1; x.strokeStyle = 'rgba(0,0,0,.25)';
            idx.forEach((p, n) => {
                const cx = (n % g.c) * cell, cy = Math.floor(n / g.c) * cell;
                if (p >= 0) {
                    const rgb = hex2rgb(hexes[p]); x.fillStyle = hexes[p];
                    if (circle) { x.beginPath(); x.arc(cx + cell / 2, cy + cell / 2, cell / 2 - 1, 0, 6.2832); x.fill(); } else x.fillRect(cx, cy, cell, cell);
                    x.fillStyle = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 > 140 ? '#000' : '#fff'; x.fillText(SYM[p], cx + cell / 2, cy + cell / 2 + 1);
                }
                x.strokeRect(cx + .5, cy + .5, cell, cell);
            });
            const cnt = usage(idx, pal.length), t = document.createElement('table'), h = t.createTHead().insertRow();
            ['色', '名稱', '用量'].forEach(s => h.appendChild(Object.assign(document.createElement('th'), { textContent: s })));
            const b = t.createTBody(); let total = 0;
            pal.forEach((c, i) => {
                if (!cnt[i]) return; total += cnt[i];
                const tr = b.insertRow(), s = document.createElement('span'); s.className = 'sw'; s.style.background = c.hex;
                tr.insertCell().append(s, SYM[i]); tr.insertCell().textContent = c.name; tr.insertCell().textContent = cnt[i];
            });
            const tr = b.insertRow(); tr.insertCell().textContent = '合計'; tr.insertCell().textContent = g.c + '×' + g.r + ' 格'; tr.insertCell().textContent = total;
            tb.append(t);
            $('#png').hidden = $('#print2').hidden = false;
            $('#imgNote').textContent = (circle ? '圓點為珠子，字母對應色板編號。' : '字母為色線符號。') + '透明區域不計入。以最近色近似，實際色差請自行判斷。';
        }
        $('#file').onchange = async (e) => {
            const f = e.target.files[0], err = $('#imgErr'); if (!f) return; err.textContent = '';
            if (f.size > MAX_FILE) { err.textContent = '檔案超過 20 MB，請先縮小'; return; }
            try {
                const b = await createImageBitmap(f, { imageOrientation: 'from-image' });
                if (b.width * b.height > MAX_PX) { err.textContent = '圖片超過 1600 萬像素，請先縮小'; return; }
                bmp = b; fileName = f.name.replace(/\.[^.]+$/, '').slice(0, 40) || 'pattern'; drawGrid();
            } catch (x) { err.textContent = '無法讀取這張圖片（格式不支援或檔案損毀）'; }
        };
        $('#palAdd').onclick = () => { if (pal.length >= MAX_PAL) { $('#imgErr').textContent = '色板最多 ' + MAX_PAL + ' 色'; return; } pal.push({ name: '新顏色', hex: '#808080' }); buildPal(); drawGrid(); };
        $('#palReset').onclick = () => { if (!confirm('要還原為範例色板嗎？（你的修改會消失，無法復原）')) return; pal = PAL0.map(([name, hex]) => ({ name, hex })); buildPal(); drawGrid(); };
        $('#png').onclick = () => $('#cv').toBlob(bl => bl ? Util.download(bl, `${o.tab}-${fileName}.png`) : ($('#imgErr').textContent = '匯出失敗'), 'image/png');
        $('#print2').onclick = () => window.print();

        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), last);
        $('#print').onclick = () => window.print();
        $('#reset').onclick = () => {
            if (!confirm('要清除記住的輸入並還原預設嗎？（無法復原）')) return;
            try { localStorage.removeItem(KEY); } catch (e) { }
            o = loadOpts(null); buildForm(); render();
        };
        buildPal(); buildForm(); render();
    </script>
</body>
