<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>貸款 / 複利試算</h1>
        <p class="sub">結果僅供參考，實際金額以金融機構的契約與試算為準。</p>

        <div class="tabs">
            <button data-mode="loan" aria-pressed="true">貸款</button>
            <button data-mode="invest" aria-pressed="false">複利成長</button>
            <button data-mode="goal" aria-pressed="false">存款目標</button>
            <button data-mode="buyrent" aria-pressed="false">買房 vs 租房</button>
        </div>

        <div class="card" id="loan">
            <div class="fgrid">
                <div><label for="p">貸款金額</label><input id="p" type="number" min="0" step="any" value="1000000"></div>
                <div><label for="rate">年利率 (%)</label><input id="rate" type="number" min="0" step="any" value="2.2"></div>
                <div><label for="years">年期</label><input id="years" type="number" min="0.1" max="50" step="any" value="20"></div>
                <div><label for="type">還款方式</label>
                    <select id="type" style="width:100%">
                        <option value="annuity">本息平均攤還（每期金額固定）</option>
                        <option value="principal">本金平均攤還（每期遞減）</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card" id="invest" hidden>
            <div class="fgrid">
                <div><label for="pv">起始本金</label><input id="pv" type="number" min="0" step="any" value="100000"></div>
                <div><label for="pmt">每月投入</label><input id="pmt" type="number" min="0" step="any" value="10000"></div>
                <div><label for="irate">年報酬率 (%)</label><input id="irate" type="number" step="any" value="5"></div>
                <div><label for="iyears">年數</label><input id="iyears" type="number" min="1" max="80" step="1" value="20"></div>
            </div>
        </div>

        <div class="card" id="goal" hidden>
            <div class="fgrid">
                <div><label for="gtarget">目標金額</label><input id="gtarget" type="number" min="0" step="any" value="5000000"></div>
                <div><label for="gpv">目前已有</label><input id="gpv" type="number" min="0" step="any" value="300000"></div>
                <div><label for="grate">預期年報酬率 (%)</label><input id="grate" type="number" step="any" value="4"></div>
                <div><label for="ginf">年通膨率 (%)<small style="color:var(--muted)">　0 = 不考慮</small></label><input id="ginf" type="number" step="any" value="0"></div>
                <div><label for="gask">想知道</label><select id="gask" style="width:100%"><option value="time">每月存這麼多，要多久達標</option><option value="pmt">想在這麼多年內達標，每月要存多少</option></select></div>
                <div><label for="gval" id="gvalLabel">每月投入</label><input id="gval" type="number" min="0" step="any" value="20000"></div>
            </div>
            <p class="muted" style="font-size:13px;margin:10px 0 0">目標金額用「現在的購買力」計算；有填通膨率時，會先把報酬率換成扣掉通膨後的實質報酬。每月複利一次，不含稅與手續費，僅供規劃參考。</p>
        </div>

        <div class="card" id="buyrent" hidden>
            <div class="fgrid">
                <div><label for="b_price">房價</label><input id="b_price" type="number" min="0" step="any" value="10000000"></div>
                <div><label for="b_down">頭期款</label><input id="b_down" type="number" min="0" step="any" value="2000000"></div>
                <div><label for="b_rate">貸款年利率 (%)</label><input id="b_rate" type="number" min="0" step="any" value="2.2"></div>
                <div><label for="b_years">貸款年限</label><input id="b_years" type="number" min="1" max="50" step="1" value="30"></div>
                <div><label for="b_grace">寬限期（年，只繳利息）</label><input id="b_grace" type="number" min="0" step="1" value="0"></div>
                <div><label for="b_hold">持有年數</label><input id="b_hold" type="number" min="1" max="50" step="1" value="10"></div>
                <div><label for="b_growth">房價年增率 (%)</label><input id="b_growth" type="number" step="any" value="1"></div>
                <div><label for="b_fee">買房一次性費用 (% 房價)</label><input id="b_fee" type="number" min="0" step="any" value="2"></div>
                <div><label for="b_cost">每年持有成本（稅、管理費、維修）</label><input id="b_cost" type="number" min="0" step="any" value="60000"></div>
                <div><label for="b_rent">每月租金</label><input id="b_rent" type="number" min="0" step="any" value="22000"></div>
                <div><label for="b_rgrow">租金年漲幅 (%)</label><input id="b_rgrow" type="number" step="any" value="1"></div>
                <div><label for="b_inv">不買房的投資報酬率 (%)</label><input id="b_inv" type="number" step="any" value="3"></div>
            </div>
            <p class="muted" style="font-size:13px;margin:10px 0 0">假設租房者把頭期款、買房費用，以及每月「買房支出比租金多出來的錢」都拿去投資（機會成本）。</p>
        </div>

        <div class="card" id="out"></div>
        <div class="card" id="brCard" hidden>
            <h2>累積總成本</h2>
            <canvas id="cv" role="img" aria-label="買房與租房的逐年累積總成本曲線"></canvas>
            <div class="lg"><span><i style="background:var(--blue)"></i>買房</span><span><i style="background:var(--ok)"></i>租房</span><span id="lgBe"></span></div>
        </div>
        <div class="card" id="tblCard" hidden>
            <h2 id="tblTitle">逐期明細</h2>
            <div class="tbl" id="tbl"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>四合一理財試算：貸款每期要繳多少、定期投入的複利成長、要存多久（或每月存多少）才能達到目標金額，以及買房和租房哪個比較划算。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>買房、買車貸款前，比較本息平均與本金平均哪種比較適合。</li>
        <li>想知道每月定期定額投資 20 年後大約有多少。</li>
        <li>設定一個存款目標（頭期款、退休金），反推每月該存多少。</li>
        <li>猶豫要買房還是租房，想知道住幾年以上買房才划算。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>上方分頁選「貸款」「複利成長」「存款目標」或「買房 vs 租房」。</li>
        <li>貸款：填「貸款金額」「年利率」「年期」，選「還款方式」，看每月應繳、總利息與逐期明細表。</li>
        <li>複利成長：填起始本金、每月投入、年報酬率、年數，看每年底的本金與資產。</li>
        <li>存款目標：填目標金額、目前已有、年報酬率與通膨率，選「想知道」是要多久達標，還是每月該存多少。</li>
        <li>買房 vs 租房：填房價、頭期款、貸款利率與年限（可設寬限期）、持有年數、房價年增率、買房費用比例、每年持有成本、月租金與年漲幅，以及「不買房的投資報酬率」。看損益平衡年數、累積總成本曲線（藍線買房、綠線租房、虛線為損益平衡點）與逐年表。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貸款 1,000,000、年利率 2.2%、20 年、本息平均
        → 每月應繳 5,154
        → 總利息 236,983、總還款 1,236,983

        複利：本金 100,000、每月 10,000、年報酬 5%、20 年
        → 約 4,381,601（投入共 2,500,000）

買房 vs 租房：房價 10,000,000、頭期款 2,000,000、利率 2.2%、30 年、持有 10 年、房價年增 1%、費用 2%、每年持有成本 60,000、月租 22,000 年漲 1%、投資報酬 3%
→ 首月月付 30,376
→ 損益平衡約第 3 年 3 個月
→ 持有 10 年後買房淨成本 1,292,484、租房 1,757,275，買房少花 464,791</div>
        <h3>小提醒</h3>
        <ul>
        <li>每月複利一次，不含稅與手續費，結果僅供參考，實際以金融機構為準。</li>
        <li>存款目標以「現在的購買力」計算；填通膨率會自動換成實質報酬。</li>
        <li>報酬率是假設值，投資實際報酬會波動。</li>
        <li>買房 vs 租房是簡化估算：未計賣屋費用、增值稅、利率調整與房價波動；「每年持有成本」固定不隨年數調整；損益平衡是指「從那之後一直」買房都不比租房貴。</li>
        <li>本頁不會儲存任何資料，重新整理就回到預設值。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 貸款攤還。type: 'annuity'（本息平均）| 'principal'（本金平均）；months 為總期數
        // 回傳 { rows: [{ n, payment, interest, principal, balance }], totalInterest, totalPaid }
        function amortize(P, annualRate, months, type = 'annuity') {
            const r = annualRate / 12 / 100;
            const rows = [];
            let bal = P, totalInterest = 0;
            const pay = type === 'annuity' ? (r === 0 ? P / months : P * r / (1 - Math.pow(1 + r, -months))) : 0;
            for (let n = 1; n <= months; n++) {
                const interest = bal * r;
                const principal = type === 'annuity' ? pay - interest : P / months;
                bal = n === months ? 0 : bal - principal;
                rows.push({ n, payment: principal + interest, interest, principal, balance: Math.max(0, bal) });
                totalInterest += interest;
            }
            return { rows, totalInterest, totalPaid: P + totalInterest };
        }

        // 複利：起始本金 + 每月投入，每月複利一次；回傳每年底的 { year, contributed, value }
        function compound(pv, monthly, annualRate, years) {
            const r = annualRate / 12 / 100, out = [];
            let v = pv, put = pv;
            for (let m = 1; m <= years * 12; m++) {
                v = v * (1 + r) + monthly;
                put += monthly;
                if (m % 12 === 0) out.push({ year: m / 12, contributed: put, value: v });
            }
            return out;
        }

        // 存款目標：把名目年報酬與通膨換成「實質」月報酬率（通膨 0 就是原本的報酬率 ÷ 12）
        const monthlyRate = (annualPct, inflationPct = 0) => ((1 + annualPct / 100) / (1 + inflationPct / 100) - 1) / 12;
        // 每月投入 pmt（月底投入），幾個月後資產達到 target；超過 maxMonths 回傳 null；起始就達標回傳 0
        function monthsToGoal(target, pv, pmt, r, maxMonths = 1200) {
            if (pv >= target) return 0;
            let v = pv;
            for (let m = 1; m <= maxMonths; m++) { v = v * (1 + r) + pmt; if (v >= target) return m; }
            return null;
        }
        // m 個月後的資產（月底投入）
        const valueAfter = (pv, pmt, r, m) => { const g = Math.pow(1 + r, m); return pv * g + pmt * (r === 0 ? m : (g - 1) / r); };
        // n 個月內達標，每月需要投入多少（0 以上）
        function requiredMonthly(target, pv, r, n) {
            if (n <= 0) return NaN;
            const g = Math.pow(1 + r, n), annuity = r === 0 ? n : (g - 1) / r, need = target - pv * g;
            return need <= 0 ? 0 : need / annuity;
        }

        // 房貸逐月：寬限期只繳利息，之後本息平均攤還；回傳 [{ payment, balance }]（長度 = 總期數）；貸款 0 回傳 []
        function mortgageSchedule(L, annualRate, years, graceYears = 0) {
            const n = Math.round(years * 12);
            if (!(L > 0) || n < 1) return [];
            const g = Math.min(Math.max(0, Math.round(graceYears * 12)), n - 1), r = annualRate / 1200;
            const head = Array.from({ length: g }, () => ({ payment: L * r, balance: L }));
            return head.concat(amortize(L, annualRate, n - g, 'annuity').rows.map(x => ({ payment: x.payment, balance: x.balance })));
        }

        // 買房 vs 租房（逐月模擬，簡化估算）。
        // 買房淨成本 = 頭期款 + 費用 + 累計月付 + 累計持有成本 − 房屋淨值（房價 − 貸款餘額）；不含賣屋費用與稅
        // 租房淨成本 = 累計租金 − 投資收益（頭期款 + 費用 + 每月「買房支出 − 租金」都拿去投資）
        // 兩者差 = 租房者資產 − 買房者淨值。o: price down rate loanYears grace hold growth feePct holdCost rent rentGrowth invest（% 皆為百分比數字）
        // 回傳 { months: [{ buy, rent }]（第 0 到 hold×12 月）, years: [{ year, buy, rent }], breakevenMonths, monthlyPay, loan, fees }
        // breakevenMonths：買房成本「從此以後一直」不高於租房的第一個月；持有期內做不到回傳 null
        function buyVsRent(o) {
            const D = o.down, F = o.price * o.feePct / 100, L = o.price - D, sched = mortgageSchedule(L, o.rate, o.loanYears, o.grace);
            const N = Math.round(o.hold * 12), im = Math.pow(1 + o.invest / 100, 1 / 12) - 1;
            let outB = D + F, rentSum = 0, port = D + F, contrib = D + F;
            const months = [{ buy: F, rent: 0 }], years = [];
            for (let m = 1; m <= N; m++) {
                const s = sched[m - 1], pay = s ? s.payment : 0, bal = s ? s.balance : 0;
                const rent = o.rent * Math.pow(1 + o.rentGrowth / 100, Math.floor((m - 1) / 12));
                const out = pay + o.holdCost / 12;
                outB += out; rentSum += rent;
                port = port * (1 + im) + (out - rent); contrib += out - rent;
                const value = o.price * Math.pow(1 + o.growth / 100, m / 12);
                const row = { buy: outB - (value - bal), rent: rentSum - (port - contrib) };
                months.push(row);
                if (m % 12 === 0) years.push({ year: m / 12, buy: row.buy, rent: row.rent });
            }
            let lastAbove = -1;
            months.forEach((r, m) => { if (r.buy > r.rent + 1e-6) lastAbove = m; });
            return { months, years, breakevenMonths: lastAbove === N ? null : lastAbove + 1, monthlyPay: sched.length ? sched[0].payment : 0, loan: L, fees: F };
        }

        // 輸入檢查：回傳錯誤訊息，沒問題回傳 ''
        function checkBuyRent(o) {
            if (!Object.values(o).every(Number.isFinite)) return '請填入所有欄位的數字';
            if (!(o.price > 0)) return '房價要大於 0';
            if (o.down < 0 || o.down > o.price) return '頭期款要介於 0 到房價之間';
            if (o.rate < 0) return '利率不可為負';
            if (!(o.loanYears >= 1 && o.loanYears <= 50)) return '貸款年限請填 1 到 50 年';
            if (o.grace < 0 || o.grace >= o.loanYears) return '寬限期要小於貸款年限';
            if (!(o.hold >= 1 && o.hold <= 50)) return '持有年數請填 1 到 50 年';
            if (o.feePct < 0 || o.holdCost < 0 || o.rent < 0) return '費用與租金不可為負';
            if (o.growth <= -100 || o.rentGrowth <= -100 || o.invest <= -100) return '增減率要大於 -100%';
            return '';
        }

        // 月數 → 「N 年 M 個月」
        const fmtYM = (m) => m < 12 ? `${m} 個月` : `${Math.floor(m / 12)} 年${m % 12 ? ' ' + (m % 12) + ' 個月' : ''}`;
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const num = (id) => parseFloat($('#' + id).value);
        const money = (v) => Math.round(v).toLocaleString('zh-TW');
        let mode = 'loan';

        function table(heads, rows) {
            const box = $('#tbl');
            const mk = (cells, cls) => { const d = document.createElement('div'); d.className = 'li ' + (cls || ''); cells.forEach(c => { const s = document.createElement('span'); s.textContent = c; d.append(s); }); return d; };
            box.replaceChildren(mk(heads, 'h'), ...rows.map(r => mk(r)));
            $('#tblCard').hidden = false;
        }

        function render() {
            const out = $('#out');
            out.replaceChildren();
            $('#loan').hidden = mode !== 'loan';
            $('#invest').hidden = mode !== 'invest';
            $('#goal').hidden = mode !== 'goal';
            $('#buyrent').hidden = mode !== 'buyrent';
            $('#brCard').hidden = true;
            if (mode === 'buyrent') { renderBuyRent(out); return; }
            if (mode === 'goal') {
                const target = num('gtarget'), pv = num('gpv') || 0, rate = num('grate'), inf = num('ginf') || 0, val = num('gval'), byTime = $('#gask').value === 'time';
                $('#gvalLabel').textContent = byTime ? '每月投入' : '幾年內達標';
                if (!(target > 0 && pv >= 0 && Number.isFinite(rate) && val >= 0) || (!byTime && !(val > 0))) { out.textContent = '請輸入有效的數字'; $('#tblCard').hidden = true; return; }
                const r = monthlyRate(rate, inf);
                if (byTime) {
                    const m = monthsToGoal(target, pv, val, r);
                    out.append(...(m === null ? [Util.statRow('結果', '100 年內都無法達標，請提高每月投入', 'bad')] : [Util.statRow('需要時間', m === 0 ? '已經達標' : `${Math.floor(m / 12)} 年 ${m % 12} 個月`, 'big'), Util.statRow('累積投入', money(pv + val * m)), Util.statRow('投資收益', money(valueAfter(pv, val, r, m) - pv - val * m))]));
                    const rows = []; let v = pv; for (let k = 1; k <= Math.min(m ?? 0, 1200); k++) { v = v * (1 + r) + val; if (k % 12 === 0 || k === m) rows.push([k % 12 === 0 ? `${k / 12} 年` : `${Math.floor(k / 12)} 年 ${k % 12} 月`, money(pv + val * k), money(v), money(v - pv - val * k), '']); }
                    if (rows.length) { $('#tblTitle').textContent = '資產成長'; table(['時間', '投入', '資產', '收益', ''], rows); } else $('#tblCard').hidden = true;
                } else {
                    const n = Math.round(val * 12), pmt = requiredMonthly(target, pv, r, n);
                    out.append(Util.statRow('每月需要投入', money(pmt), 'big'), Util.statRow('累積投入', money(pv + pmt * n)), Util.statRow('投資收益', money(target - pv - pmt * n)));
                    $('#tblCard').hidden = true;
                }
                return;
            }
            if (mode === 'loan') {
                const P = num('p'), rate = num('rate'), years = num('years');
                if (!(P > 0 && rate >= 0 && years > 0)) { out.textContent = '請輸入大於 0 的金額與年期，利率不可為負'; $('#tblCard').hidden = true; return; }
                const months = Math.round(years * 12), a = amortize(P, rate, months, $('#type').value);
                const first = a.rows[0], last = a.rows[months - 1];
                out.append(
                    Util.statRow($('#type').value === 'annuity' ? '每月應繳' : '首期應繳', money(first.payment), 'big'),
                    ...($('#type').value === 'principal' ? [Util.statRow('末期應繳', money(last.payment))] : []),
                    Util.statRow('總利息', money(a.totalInterest)),
                    Util.statRow('總還款金額', money(a.totalPaid)),
                    Util.statRow('利息佔本金', (a.totalInterest / P * 100).toFixed(1) + ' %'),
                );
                $('#tblTitle').textContent = `逐期明細（共 ${months} 期）`;
                table(['期', '應繳', '利息', '本金', '餘額'], a.rows.map(r => [r.n, money(r.payment), money(r.interest), money(r.principal), money(r.balance)]));
            } else {
                const pv = num('pv') || 0, pmt = num('pmt') || 0, rate = num('irate'), years = Math.round(num('iyears'));
                if (!(pv >= 0 && pmt >= 0 && years >= 1 && Number.isFinite(rate))) { out.textContent = '請輸入有效的數字'; $('#tblCard').hidden = true; return; }
                const rows = compound(pv, pmt, rate, years), end = rows[rows.length - 1];
                out.append(
                    Util.statRow(`${years} 年後資產`, money(end.value), 'big'),
                    Util.statRow('累積投入', money(end.contributed)),
                    Util.statRow('複利收益', money(end.value - end.contributed)),
                    Util.statRow('收益佔最終資產', (end.value ? (end.value - end.contributed) / end.value * 100 : 0).toFixed(1) + ' %'),
                );
                $('#tblTitle').textContent = '每年年底';
                table(['年', '投入', '資產', '收益', ''], rows.map(r => [r.year, money(r.contributed), money(r.value), money(r.value - r.contributed), '']));
            }
        }

        function renderBuyRent(out) {
            $('#tblCard').hidden = true;
            const o = { price: num('b_price'), down: num('b_down'), rate: num('b_rate'), loanYears: num('b_years'), grace: num('b_grace') || 0, hold: num('b_hold'), growth: num('b_growth'), feePct: num('b_fee'), holdCost: num('b_cost'), rent: num('b_rent'), rentGrowth: num('b_rgrow'), invest: num('b_inv') };
            const err = checkBuyRent(o);
            if (err) { out.textContent = err; return; }
            const r = buyVsRent(o), end = r.months[r.months.length - 1], diff = end.rent - end.buy;
            const be = r.breakevenMonths;
            out.append(
                Util.statRow('貸款金額', money(r.loan)),
                Util.statRow(o.grace > 0 ? '寬限期每月只繳利息' : '房貸首月月付', money(r.monthlyPay)),
                Util.statRow('買房一次性費用', money(r.fees)),
                Util.statRow('損益平衡', be === null ? `${o.hold} 年內未達到` : be === 0 ? '一開始就較划算' : '第 ' + fmtYM(be), 'big'),
                Util.statRow(`持有 ${o.hold} 年後買房淨成本`, money(end.buy)),
                Util.statRow(`持有 ${o.hold} 年後租房淨成本`, money(end.rent)),
                Util.statRow(diff >= 0 ? '買房比租房少花' : '買房比租房多花', money(Math.abs(diff)), diff >= 0 ? 'ok' : 'bad'),
            );
            const p = document.createElement('p'); p.className = 'muted'; p.style.fontSize = '13px';
            p.textContent = (be === null ? `以這組假設，持有 ${o.hold} 年內買房的累積成本都還高於租房，租房較划算。` : be === 0 ? '以這組假設，買房從一開始就比租房划算。' : `以這組假設，持有約 ${fmtYM(be)} 之後買房比租房划算；若住不到這麼久，租房比較省。`) + '這是簡化估算：未計賣屋費用、增值稅、貸款利率調整與房價波動，實際請以專業評估為準。';
            out.append(p);
            $('#lgBe').textContent = be ? `虛線 = 損益平衡（第 ${fmtYM(be)}）` : '';
            $('#brCard').hidden = false;
            lastBR = { r, o };
            drawChart();
            $('#tblTitle').textContent = '逐年累積成本';
            table(['年', '買房', '租房', '買−租', ''], r.years.map(y => [y.year, money(y.buy), money(y.rent), money(y.buy - y.rent), '']));
        }

        // 折線圖：寬度隨容器縮放，顏色取自主題變數
        let lastBR = null;
        function drawChart() {
            const cv = $('#cv');
            if (!lastBR || $('#brCard').hidden || !cv.clientWidth) return;
            const { r, o } = lastBR, dpr = window.devicePixelRatio || 1, W = cv.width = Math.round(cv.clientWidth * dpr), H = cv.height = Math.round(cv.clientHeight * dpr), c = cv.getContext('2d');
            const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888';
            const padL = 52 * dpr, padR = 10 * dpr, padT = 10 * dpr, padB = 22 * dpr, N = r.months.length - 1;
            const all = r.months.flatMap(m => [m.buy, m.rent]), lo = Math.min(0, ...all), hi = Math.max(1, ...all);
            const X = (m) => padL + (W - padL - padR) * m / Math.max(1, N), Y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
            c.clearRect(0, 0, W, H);
            c.font = `${11 * dpr}px sans-serif`; c.fillStyle = css('--muted'); c.strokeStyle = css('--line'); c.lineWidth = dpr;
            for (let k = 0; k <= 4; k++) {
                const v = lo + (hi - lo) * k / 4, y = Y(v);
                c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke();
                c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(Math.round(v / 10000).toLocaleString('zh-TW') + '萬', padL - 4 * dpr, y);
            }
            c.textBaseline = 'alphabetic';
            const step = o.hold > 20 ? 10 : o.hold > 10 ? 5 : o.hold > 5 ? 2 : 1;
            for (let yr = 0; yr <= o.hold; yr += step) { c.textAlign = 'center'; c.fillText(yr + '年', X(yr * 12), H - 6 * dpr); }
            const line = (key, col) => { c.beginPath(); r.months.forEach((m, i) => i ? c.lineTo(X(i), Y(m[key])) : c.moveTo(X(i), Y(m[key]))); c.strokeStyle = css(col); c.lineWidth = 2.5 * dpr; c.stroke(); };
            line('rent', '--ok'); line('buy', '--blue');
            if (r.breakevenMonths) { c.setLineDash([5 * dpr, 4 * dpr]); c.strokeStyle = css('--muted'); c.lineWidth = dpr; c.beginPath(); c.moveTo(X(r.breakevenMonths), padT); c.lineTo(X(r.breakevenMonths), H - padB); c.stroke(); c.setLineDash([]); }
        }
        window.addEventListener('resize', drawChart);
        new MutationObserver(drawChart).observe(document.documentElement, { attributes: true });

        document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
            mode = b.dataset.mode;
            document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.querySelectorAll('input, select').forEach(i => { i.oninput = render; });
        render();
    </script>
</body>
