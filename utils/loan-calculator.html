    <template id="help">
        <h3>這是什麼</h3>
        <p>六合一理財試算：貸款每期要繳多少、定期投入的複利成長、存款目標、買房 vs 租房，以及「債務」（信用卡循環、分期實質利率、雪球 / 雪崩、提前還款、轉貸、就學貸款）與「購屋與租屋」（購屋能力、租金投報率、押金與退租結算）。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>買房、買車貸款前，比較本息平均與本金平均哪種比較適合。</li>
        <li>想知道每月定期定額投資 20 年後大約有多少。</li>
        <li>設定一個存款目標（頭期款、退休金），反推每月該存多少。</li>
        <li>猶豫要買房還是租房，想知道住幾年以上買房才划算。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>上方分頁選「貸款」「複利成長」「存款目標」或「買房 vs 租房」。</li>
        <li>貸款：填「貸款金額」「年利率」「年期」，選「還款方式」，看每月應繳、總利息與逐期明細表。</li>
        <li>複利成長：填起始本金、每月投入、年報酬率、年數，看每年底的本金與資產。</li>
        <li>存款目標：填目標金額、目前已有、年報酬率與通膨率，選「想知道」是要多久達標，還是每月該存多少。</li>
        <li>買房 vs 租房：填房價、頭期款、貸款利率與年限（可設寬限期）、持有年數、房價年增率、買房費用比例、每年持有成本、月租金與年漲幅，以及「不買房的投資報酬率」。看損益平衡年數、累積總成本曲線（藍線買房、綠線租房、虛線為損益平衡點）與逐年表。</li>
        <li>債務分頁：上方「試算項目」選一項，填數字即時出結果。信用卡看只繳最低應繳要多久還完；分期看含手續費的實質年利率；雪球 / 雪崩比較還款順序與總利息；提前還款比較縮短年限或降低月付；轉貸看每月省多少、幾個月回本；就學貸款看畢業後每月要繳多少。</li>
        <li>購屋與租屋分頁：購屋能力由月收入、現有負債與可接受負債比反推可貸金額與房價範圍；租金投報率算毛 / 淨投報率；押金與退租結算按日計租並算出押金應退多少。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貸款 1,000,000、年利率 2.2%、20 年、本息平均
        → 每月應繳 5,154
        → 總利息 236,983、總還款 1,236,983

        複利：本金 100,000、每月 10,000、年報酬 5%、20 年
        → 約 4,381,601（投入共 2,500,000）

買房 vs 租房：房價 10,000,000、頭期款 2,000,000、利率 2.2%、30 年、持有 10 年、房價年增 1%、費用 2%、每年持有成本 60,000、月租 22,000 年漲 1%、投資報酬 3%
→ 首月月付 30,376
→ 損益平衡約第 3 年 3 個月
→ 持有 10 年後買房淨成本 1,292,484、租房 1,757,275，買房少花 464,791</div>
        <h3>小提醒</h3>
        <ul>
        <li>每月複利一次，不含稅與手續費，結果僅供參考，實際以金融機構為準。</li>
        <li>存款目標以「現在的購買力」計算；填通膨率會自動換成實質報酬。</li>
        <li>報酬率是假設值，投資實際報酬會波動。</li>
        <li>買房 vs 租房是簡化估算：未計賣屋費用、增值稅、利率調整與房價波動；「每年持有成本」固定不隨年數調整；損益平衡是指「從那之後一直」買房都不比租房貴。</li>
        <li>債務與購屋分頁的利率、最低應繳比例、寬限期、負債比、押金月數上限等都是「範例值」，請依自己的契約與現行法規自行確認；全部為估算，非財務建議。</li>
        <li>本頁不會儲存任何資料，重新整理就回到預設值。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 貸款攤還。type: 'annuity'（本息平均）| 'principal'（本金平均）；months 為總期數
        // 回傳 { rows: [{ n, payment, interest, principal, balance }], totalInterest, totalPaid }
        function amortize(P, annualRate, months, type = 'annuity') {
            const r = annualRate / 12 / 100;
            const rows = [];
            let bal = P, totalInterest = 0;
            const pay = type === 'annuity' ? (r === 0 ? P / months : P * r / (1 - Math.pow(1 + r, -months))) : 0;
            for (let n = 1; n <= months; n++) {
                const interest = bal * r;
                const principal = type === 'annuity' ? pay - interest : P / months;
                bal = n === months ? 0 : bal - principal;
                rows.push({ n, payment: principal + interest, interest, principal, balance: Math.max(0, bal) });
                totalInterest += interest;
            }
            return { rows, totalInterest, totalPaid: P + totalInterest };
        }

        // 複利：起始本金 + 每月投入，每月複利一次；回傳每年底的 { year, contributed, value }
        function compound(pv, monthly, annualRate, years) {
            const r = annualRate / 12 / 100, out = [];
            let v = pv, put = pv;
            for (let m = 1; m <= years * 12; m++) {
                v = v * (1 + r) + monthly;
                put += monthly;
                if (m % 12 === 0) out.push({ year: m / 12, contributed: put, value: v });
            }
            return out;
        }

        // 存款目標：把名目年報酬與通膨換成「實質」月報酬率（通膨 0 就是原本的報酬率 ÷ 12）
        const monthlyRate = (annualPct, inflationPct = 0) => ((1 + annualPct / 100) / (1 + inflationPct / 100) - 1) / 12;
        // 每月投入 pmt（月底投入），幾個月後資產達到 target；超過 maxMonths 回傳 null；起始就達標回傳 0
        function monthsToGoal(target, pv, pmt, r, maxMonths = 1200) {
            if (pv >= target) return 0;
            let v = pv;
            for (let m = 1; m <= maxMonths; m++) { v = v * (1 + r) + pmt; if (v >= target) return m; }
            return null;
        }
        // m 個月後的資產（月底投入）
        const valueAfter = (pv, pmt, r, m) => { const g = Math.pow(1 + r, m); return pv * g + pmt * (r === 0 ? m : (g - 1) / r); };
        // n 個月內達標，每月需要投入多少（0 以上）
        function requiredMonthly(target, pv, r, n) {
            if (n <= 0) return NaN;
            const g = Math.pow(1 + r, n), annuity = r === 0 ? n : (g - 1) / r, need = target - pv * g;
            return need <= 0 ? 0 : need / annuity;
        }

        // 房貸逐月：寬限期只繳利息，之後本息平均攤還；回傳 [{ payment, balance }]（長度 = 總期數）；貸款 0 回傳 []
        function mortgageSchedule(L, annualRate, years, graceYears = 0) {
            const n = Math.round(years * 12);
            if (!(L > 0) || n < 1) return [];
            const g = Math.min(Math.max(0, Math.round(graceYears * 12)), n - 1), r = annualRate / 1200;
            const head = Array.from({ length: g }, () => ({ payment: L * r, balance: L }));
            return head.concat(amortize(L, annualRate, n - g, 'annuity').rows.map(x => ({ payment: x.payment, balance: x.balance })));
        }

        // 買房 vs 租房（逐月模擬，簡化估算）。
        // 買房淨成本 = 頭期款 + 費用 + 累計月付 + 累計持有成本 − 房屋淨值（房價 − 貸款餘額）；不含賣屋費用與稅
        // 租房淨成本 = 累計租金 − 投資收益（頭期款 + 費用 + 每月「買房支出 − 租金」都拿去投資）
        // 兩者差 = 租房者資產 − 買房者淨值。o: price down rate loanYears grace hold growth feePct holdCost rent rentGrowth invest（% 皆為百分比數字）
        // 回傳 { months: [{ buy, rent }]（第 0 到 hold×12 月）, years: [{ year, buy, rent }], breakevenMonths, monthlyPay, loan, fees }
        // breakevenMonths：買房成本「從此以後一直」不高於租房的第一個月；持有期內做不到回傳 null
        function buyVsRent(o) {
            const D = o.down, F = o.price * o.feePct / 100, L = o.price - D, sched = mortgageSchedule(L, o.rate, o.loanYears, o.grace);
            const N = Math.round(o.hold * 12), im = Math.pow(1 + o.invest / 100, 1 / 12) - 1;
            let outB = D + F, rentSum = 0, port = D + F, contrib = D + F;
            const months = [{ buy: F, rent: 0 }], years = [];
            for (let m = 1; m <= N; m++) {
                const s = sched[m - 1], pay = s ? s.payment : 0, bal = s ? s.balance : 0;
                const rent = o.rent * Math.pow(1 + o.rentGrowth / 100, Math.floor((m - 1) / 12));
                const out = pay + o.holdCost / 12;
                outB += out; rentSum += rent;
                port = port * (1 + im) + (out - rent); contrib += out - rent;
                const value = o.price * Math.pow(1 + o.growth / 100, m / 12);
                const row = { buy: outB - (value - bal), rent: rentSum - (port - contrib) };
                months.push(row);
                if (m % 12 === 0) years.push({ year: m / 12, buy: row.buy, rent: row.rent });
            }
            let lastAbove = -1;
            months.forEach((r, m) => { if (r.buy > r.rent + 1e-6) lastAbove = m; });
            return { months, years, breakevenMonths: lastAbove === N ? null : lastAbove + 1, monthlyPay: sched.length ? sched[0].payment : 0, loan: L, fees: F };
        }

        // 輸入檢查：回傳錯誤訊息，沒問題回傳 ''
        function checkBuyRent(o) {
            if (!Object.values(o).every(Number.isFinite)) return '請填入所有欄位的數字';
            if (!(o.price > 0)) return '房價要大於 0';
            if (o.down < 0 || o.down > o.price) return '頭期款要介於 0 到房價之間';
            if (o.rate < 0) return '利率不可為負';
            if (!(o.loanYears >= 1 && o.loanYears <= 50)) return '貸款年限請填 1 到 50 年';
            if (o.grace < 0 || o.grace >= o.loanYears) return '寬限期要小於貸款年限';
            if (!(o.hold >= 1 && o.hold <= 50)) return '持有年數請填 1 到 50 年';
            if (o.feePct < 0 || o.holdCost < 0 || o.rent < 0) return '費用與租金不可為負';
            if (o.growth <= -100 || o.rentGrowth <= -100 || o.invest <= -100) return '增減率要大於 -100%';
            return '';
        }

        // 月數 → 「N 年 M 個月」
        const fmtYM = (m) => m < 12 ? `${m} 個月` : `${Math.floor(m / 12)} 年${m % 12 ? ' ' + (m % 12) + ' 個月' : ''}`;

        // ===== 債務 / 購屋與租屋（估算，非財務建議；皆為純數學，不含任何法規費率） =====
        // 每月應繳（本息平均）；年利率為 %；n 為期數
        const pmtOf = (P, annualPct, n) => { const r = annualPct / 1200; return n > 0 ? (r === 0 ? P / n : P * r / (1 - Math.pow(1 + r, -n))) : NaN; };
        // 固定月付 pay 還清 bal 需要幾期（可為小數）；月付不夠付利息回傳 Infinity
        function nperOf(bal, annualPct, pay) {
            const r = annualPct / 1200;
            if (bal <= 0) return 0;
            if (!(pay > 0)) return Infinity;
            if (r === 0) return bal / pay;
            const x = 1 - bal * r / pay;
            return x > 0 ? -Math.log(x) / Math.log(1 + r) : Infinity;
        }
        // 固定月付逐月模擬：回傳 { months, interest }；超過 maxM 或不夠付利息回傳 months = Infinity
        function simPay(bal, annualPct, pay, maxM = 1200) {
            const r = annualPct / 1200; let m = 0, interest = 0;
            while (bal > 1e-6) {
                if (++m > maxM) return { months: Infinity, interest };
                const it = bal * r; interest += it; bal = bal + it - Math.min(pay, bal + it);
            }
            return { months: m, interest };

        // 已繳 k 期後的貸款餘額（本息平均）
        const balAfter = (P, annualPct, n, k) => { const r = annualPct / 1200, pay = pmtOf(P, annualPct, n); return r === 0 ? P - pay * k : Math.max(0, P * Math.pow(1 + r, k) - pay * (Math.pow(1 + r, k) - 1) / r); };

        // 信用卡循環：每月應繳 = max(下限, 餘額 × 比例)，不超過本月應還總額；1200 期仍未還清視為永遠還不完
        function ccRevolve(bal, aprPct, minPct, floor, maxM = 1200) {
            const r = aprPct / 1200; let m = 0, interest = 0, firstPay = 0;
            const firstInterest = bal * r;
            while (bal > 1e-6) {
                if (++m > maxM) return { never: true, months: Infinity, totalInterest: Infinity, firstPay, firstInterest };
                const it = bal * r, pay = Math.min(bal + it, Math.max(floor, bal * minPct / 100));
                if (m === 1) firstPay = pay;
                interest += it; bal = bal + it - pay;

            return { never: false, months: m, totalInterest: interest, firstPay, firstInterest };
        }

        // 分期實質利率：現金價 cash，每期付 pay、共 n 期，另付一次性手續費 upfront → 月 IRR（二分法）
        // 回傳 { monthly, nominal（月利率×12，%）, effective（年有效利率，%）, extra（總付款 − 現金價）}
        function installmentIRR(cash, pay, n, upfront = 0) {
            const net = cash - upfront, extra = pay * n + upfront - cash;
            const pv = (i) => Math.abs(i) < 1e-12 ? pay * n : pay * (1 - Math.pow(1 + i, -n)) / i;
            let lo = -0.5, hi = 10;
            if (!(net > 0 && pay > 0 && n >= 1)) return { monthly: NaN, nominal: NaN, effective: NaN, extra };
            for (let k = 0; k < 200; k++) { const mid = (lo + hi) / 2; if (pv(mid) > net) lo = mid; else hi = mid; }
            const i = (lo + hi) / 2;
            return { monthly: i, nominal: i * 1200, effective: (Math.pow(1 + i, 12) - 1) * 100, extra };

        // 債務雪球 / 雪崩：debts [{ name, bal, rate（年利率 %）, min }]；每月總預算 = 所有最低還款 + extra（還清的最低還款滾入下一筆）
        // strategy: 'snow'（餘額小的先）| 'aval'（利率高的先）。回傳 { months, totalInterest, order: [{ name, month }], never }
        function snowAvalanche(debts, extra, strategy, maxM = 1200) {
            const ds = debts.filter(d => d.bal > 0).map(d => ({ ...d, b: d.bal }));
            const budget = ds.reduce((s, d) => s + d.min, 0) + extra;
            const prio = ds.slice().sort(strategy === 'snow' ? (a, b) => a.bal - b.bal || b.rate - a.rate : (a, b) => b.rate - a.rate || a.bal - b.bal);
            const order = []; let m = 0, totalInterest = 0;
            while (prio.some(d => d.b > 1e-6)) {
                if (++m > maxM) return { months: Infinity, totalInterest: Infinity, order, never: true };
                let left = budget;
                for (const d of prio) if (d.b > 1e-6) { const it = d.b * d.rate / 1200; d.b += it; totalInterest += it; }
                for (const d of prio) if (d.b > 1e-6) { const p = Math.min(d.min, d.b, left); d.b -= p; left -= p; }
                for (const d of prio) if (d.b > 1e-6 && left > 0) { const p = Math.min(d.b, left); d.b -= p; left -= p; }

        // 提前還款：原貸款 P / 年利率 / 年數，已繳 k 期，一次提前還 X（違約金 feePct %，按提前還款額計）
        // 回傳 { bal, pay, rem, baseInterest（剩餘期間利息）, penalty, shorten: { months, saved }, lower: { pay, saved } }；saved 已扣違約金
        function prepay(P, ratePct, years, k, X, feePct = 0) {
            const n = Math.round(years * 12), pay = pmtOf(P, ratePct, n), bal = balAfter(P, ratePct, n, k), rem = n - k;
            const baseInterest = pay * rem - bal, nb = bal - X, penalty = X * feePct / 100;
            const sh = simPay(nb, ratePct, pay), newPay = nb > 0 ? pmtOf(nb, ratePct, rem) : 0;
            return { bal, pay, rem, baseInterest, penalty, shorten: { months: sh.months, saved: baseInterest - sh.interest - penalty }, lower: { pay: newPay, saved: baseInterest - (newPay * rem - nb) - penalty } };
        }

        // 房貸轉貸：舊貸款剩餘 bal、舊/新年利率、剩餘期數、新貸款期數、轉貸總費用 fees
        // 回傳 { oldPay, newPay, saving（每月）, breakeven（回收期，月；沒省錢 null）, total（整段期間總省，含費用）}
        function refinance(bal, oldRate, remMonths, newRate, newMonths, fees) {
            const oldPay = pmtOf(bal, oldRate, remMonths), newPay = pmtOf(bal, newRate, newMonths), saving = oldPay - newPay;

        // 就學貸款：借款總額 P、年利率、畢業後寬限 g 個月（payInt：寬限期繳利息 true / 利息併入本金 false）、之後分 years 年本息平均

        // 購屋能力：月收入、現有每月負債還款、可接受負債比（% 月收入，含新房貸月付）、年利率、年數、頭期款
        // 回傳 { maxPay, loan, price（貸款 + 頭期款）, ltv（貸款成數 %）}
        function affordability(income, debt, ratioPct, ratePct, years, down) {

        // 租金投報率：毛 = 年租金 / 房價；淨 = (年租金 × (1 − 空置率) × (1 − 管理費率) − 年稅費 − 年維修) / 房價

            const gross = rent * 12, noi = gross * (1 - vacPct / 100) * (1 - mgmtPct / 100) - taxYear - maintYear;

        }

        // 日期字串 YYYY-MM-DD → UTC 毫秒（格式或日期不存在回傳 NaN）
        function parseD(s) {

        function leaseSettle(rent, deposit, paidTo, moveOut, ded) {

        // run(v) 回傳 { err } 或 { rows: [[標籤, 值, 樣式]], note }
        const pct = (v) => v.toFixed(2) + ' %', mths = (m) => fmtYM(Math.ceil(m - 1e-9));
        const SUBS = {

                      if (!(v.cash > 0 && v.pay > 0 && v.n >= 1 && v.fee >= 0)) return { err: '現金價、每期付款、期數要大於 0，手續費不可為負' };
                      const n = Math.round(v.n), r = installmentIRR(v.cash, v.pay, n, v.fee);
                      if (!Number.isFinite(r.nominal)) return { err: '手續費不可大於或等於現金價' };
                      return { rows: [['實質年利率（月 IRR × 12）', pct(r.nominal), 'big'], ['年有效利率', pct(r.effective)], ['總付款比現金價多', money(r.extra)], ['總付款', money(v.pay * n + v.fee)]], note: '「零利率」分期若有手續費，實質利率不是 0。以現金價扣掉手續費為實拿金額，每期付款為現金流出，用 IRR 反推。' };
                  } },
                { k: 'snow', t: '債務雪球 vs 雪崩', f: [['a_n', '債務 A 名稱', '信用卡'], ['a_b', 'A 餘額', 50000], ['a_r', 'A 年利率 (%)', 15], ['a_m', 'A 最低還款', 1500], ['b_n', '債務 B 名稱', '信貸'], ['b_b', 'B 餘額', 200000], ['b_r', 'B 年利率 (%)', 8], ['b_m', 'B 最低還款', 4000], ['c_n', '債務 C 名稱', '分期'], ['c_b', 'C 餘額', 20000], ['c_r', 'C 年利率 (%)', 5], ['c_m', 'C 最低還款', 2000], ['d_n', '債務 D 名稱', '債務 D'], ['d_b', 'D 餘額（不用就留 0）', 0], ['d_r', 'D 年利率 (%)', 0], ['d_m', 'D 最低還款', 0], ['x', '每月額外預算', 5000]],
                  run(v) {
                      const ds = ['a', 'b', 'c', 'd'].map(p => ({ name: v[p + '_n'] || p.toUpperCase(), bal: v[p + '_b'], rate: v[p + '_r'], min: v[p + '_m'] })).filter(d => d.bal > 0);
                      if (!ds.length) return { err: '至少要有一筆餘額大於 0 的債務' };
                      if (ds.some(d => d.rate < 0 || d.min < 0) || v.x < 0) return { err: '利率、最低還款、額外預算不可為負' };
                      const s = snowAvalanche(ds, v.x, 'snow'), a = snowAvalanche(ds, v.x, 'aval');
                      if (s.never || a.never) return { rows: [['結果', '每月預算不足以還清（超過 100 年），請提高最低還款或額外預算', 'bad']] };
                      const ord = (r) => r.order.map(o => `${o.name}（第 ${o.month} 個月）`).join(' → '), diff = s.totalInterest - a.totalInterest;
                      return { rows: [['雪球（小額先清）：期間 / 總利息', `${mths(s.months)} / ${money(s.totalInterest)}`], ['雪球還清順序', ord(s)], ['雪崩（高利先清）：期間 / 總利息', `${mths(a.months)} / ${money(a.totalInterest)}`], ['雪崩還清順序', ord(a)], ['雪崩比雪球少付利息', money(diff), diff > 0.5 ? 'ok' : '']], note: '每月總預算 = 所有最低還款 + 額外預算，還清一筆後它的最低還款會滾入下一筆。雪崩利息通常較少；雪球先清掉小額、較有成就感。' };
                  } },
                { k: 'pre', t: '提前還款', f: [['P', '原貸款金額', 10000000], ['r', '年利率 (%)', 2.2], ['y', '貸款年數', 30], ['k', '已繳期數（月）', 60], ['x', '一次提前還款金額', 1000000], ['fee', '提前還款違約金 (% 還款額，依合約，0 = 無)', 0]],
                  run(v) {
                      if (!(v.P > 0 && v.r >= 0 && v.y >= 1 && v.k >= 0 && v.x > 0 && v.fee >= 0)) return { err: '請填入有效數字（金額與年數大於 0）' };
                      const n = Math.round(v.y * 12), k = Math.round(v.k);
                      if (k >= n) return { err: '已繳期數要小於總期數 ' + n };
                      const r = prepay(v.P, v.r, v.y, k, v.x, v.fee);
                      if (v.x >= r.bal) return { err: '提前還款金額要小於目前餘額 ' + money(r.bal) };
                      return { rows: [['目前餘額', money(r.bal)], ['原每月應繳 / 剩餘期數', `${money(r.pay)} / ${r.rem} 期`], ['A. 月付不變、縮短年限：剩', `${mths(r.shorten.months)}（少 ${mths(r.rem - r.shorten.months)}）`], ['A 節省利息（已扣違約金）', money(r.shorten.saved), 'ok'], ['B. 年限不變、降低月付：新月付', `${money(r.lower.pay)}（每月少 ${money(r.pay - r.lower.pay)}）`], ['B 節省利息（已扣違約金）', money(r.lower.saved), 'ok']], note: '縮短年限通常省更多利息；降低月付則是現金流較寬鬆。僅適用本息平均攤還，不含寬限期。' };
                  } },
                { k: 'refi', t: '房貸轉貸', f: [['bal', '舊貸款剩餘本金', 8000000], ['or', '舊貸款年利率 (%)', 2.6], ['rem', '剩餘期數（月）', 240], ['nr', '新貸款年利率 (%)', 2.2], ['nm', '新貸款期數（月）', 240], ['fee', '轉貸總費用（手續費 + 代書費 + 違約金…）', 30000]],
                  run(v) {
                      if (!(v.bal > 0 && v.or >= 0 && v.rem >= 1 && v.nr >= 0 && v.nm >= 1 && v.fee >= 0)) return { err: '請填入有效數字（金額與期數大於 0）' };
                      const r = refinance(v.bal, v.or, Math.round(v.rem), v.nr, Math.round(v.nm), v.fee);
                      return { rows: [['舊月付 → 新月付', `${money(r.oldPay)} → ${money(r.newPay)}`], ['每月節省', money(r.saving), r.saving > 0 ? 'ok' : 'bad'], ['費用回收期', r.breakeven === null ? '每月沒有省錢，無法回收' : mths(r.breakeven), 'big'], ['整段期間總節省（扣費用）', money(r.total), r.total > 0 ? 'ok' : 'bad']], note: '新舊期數不同時，「總節省」比較的是總還款額，期數拉長會讓總額看起來較高。回收期 = 轉貸費用 ÷ 每月節省。' };
                  } },
                { k: 'stu', t: '就學貸款', f: [['P', '借款總額', 400000], ['r', '年利率 (%)（範例值，請自行確認）', 1.5], ['g', '畢業後寬限期（月）（範例值）', 12], ['y', '寬限後還款年數（範例值）', 8], ['pi', '寬限期利息', [['1', '每月繳利息'], ['0', '併入本金']]]],
                  run(v) {
                      if (!(v.P > 0 && v.r >= 0 && v.g >= 0 && v.y >= 1)) return { err: '借款總額與還款年數要大於 0，利率與寬限期不可為負' };
                      const r = studentLoan(v.P, v.r, Math.round(v.g), v.y, v.pi === 1);
                      return { rows: [['在學期間', '免息（本金不增加）'], v.pi === 1 ? ['寬限期每月利息', money(r.graceMonthly)] : ['寬限期結束時本金', money(r.balAfterGrace)], ['寬限期利息合計', money(r.graceInterest)], ['之後每月應繳', money(r.pay), 'big'], ['總利息', money(r.totalInterest)]], note: '「在學期間免息」依政策與身分而異，利率、寬限期與還款年限為範例值，請以承貸銀行與政府公告為準。' };
                  } },
            ],
            house: [
                { k: 'aff', t: '購屋能力', f: [['inc', '月收入', 80000], ['debt', '現有每月負債還款（信貸、車貸、卡費…）', 5000], ['ratio', '可接受負債比 (%)（預設約 1/3）', 33.3], ['r', '貸款年利率 (%)', 2.2], ['y', '貸款年限', 30], ['down', '頭期款（現金）', 2000000]],
                  run(v) {
                      if (!(v.inc > 0 && v.debt >= 0 && v.ratio > 0 && v.ratio <= 100 && v.r >= 0 && v.y >= 1 && v.down >= 0)) return { err: '請填入有效數字（負債比介於 0–100）' };
                      const hi = affordability(v.inc, v.debt, v.ratio, v.r, v.y, v.down), lo = affordability(v.inc, v.debt, v.ratio * 0.75, v.r, v.y, v.down);
                      return { rows: [['每月可負擔房貸', money(hi.maxPay)], ['可負擔貸款額', money(hi.loan)], ['房價範圍（保守 ~ 上限）', `${money(lo.price)} ~ ${money(hi.price)}`, 'big'], ['上限時的貸款成數', hi.ltv.toFixed(1) + ' %', hi.ltv > 80 ? 'bad' : '']], note: '負債比 = 所有每月還款（含新房貸）÷ 月收入；「月付不超過月收入 1/3」是常見的自我控管參考，銀行實際規定因行庫與政策而異。保守值 = 負債比 × 75%。貸款成數過高可能貸不到；未計購屋稅費、裝修與生活開銷。' };
                  } },
                { k: 'yld', t: '租金投報率與持有成本', f: [['price', '房價', 12000000], ['rent', '每月租金', 30000], ['vac', '空置率 (%)', 8], ['mg', '管理費率 (% 租金，自管填 0)', 0], ['tax', '每年稅費（房屋稅、地價稅、保險…）', 30000], ['mt', '每年維修 / 其他成本', 20000]],
                  run(v) {
                      if (!(v.price > 0 && v.rent >= 0 && v.vac >= 0 && v.vac <= 100 && v.mg >= 0 && v.mg <= 100 && v.tax >= 0 && v.mt >= 0)) return { err: '請填入有效數字（房價大於 0、比率介於 0–100）' };
                      const r = rentalYield(v.price, v.rent, v.vac, v.mg, v.tax, v.mt);
                      return { rows: [['毛投報率', pct(r.grossYield)], ['淨投報率', pct(r.netYield), 'big'], ['年淨收入', money(r.noi), r.noi > 0 ? '' : 'bad'], ['以淨收入回本年數', r.payback === null ? '沒有淨收入，無法回本' : r.payback.toFixed(1) + ' 年']], note: '不含房貸利息與房價漲跌，只看「租金扣掉持有成本」。要比較自住買或租哪個划算，請用「買房 vs 租房」分頁。' };
                  } },
                { k: 'lease', t: '租賃押金與退租結算', f: [['rent', '月租金', 20000], ['dep', '押金', 40000], ['paid', '租金已繳到（含當日）', '2026-03-15'], ['out', '實際退租日', '2026-03-31'], ['ded', '其他應扣款（修繕、水電…）', 0]],
                  run(v) {
                      if (!(v.rent > 0 && v.dep >= 0 && v.ded >= 0)) return { err: '月租金要大於 0，押金與扣款不可為負' };
                      const a = parseD(v.paid), b = parseD(v.out);
                      if (Number.isNaN(a) || Number.isNaN(b)) return { err: '請選擇「已繳到」與「退租日」' };
                      const r = leaseSettle(v.rent, v.dep, a, b, v.ded), mon = v.dep / v.rent;
                      return { rows: [['押金相當於', mon.toFixed(2) + ' 個月租金' + (mon > 2 ? '（超過 2 個月，請對照現行法規與契約）' : ''), mon > 2 ? 'bad' : ''], ['按日計租', r.owed > 0 ? '尚欠租金 ' + money(r.owed) : r.credit > 0 ? '多繳租金可退 ' + money(r.credit) : '剛好繳到退租日'], [r.refund >= 0 ? '房東應退還' : '你需補繳', money(Math.abs(r.refund)), r.refund >= 0 ? 'ok' : 'bad']], note: '住宅租賃押金上限一般認為是 2 個月租金（租賃住宅市場發展及管理條例），法規可能修訂，請自行核對現行條文與契約。按日計租以「該月實際天數」分攤；契約若約定每月以 30 天計，以契約為準。' };
                  } },
            ],
        };
        const subVals = (k) => { const v = {}; document.querySelectorAll(`#sf_${k} [data-f]`).forEach(e => { v[e.dataset.f] = e.type === 'number' || e.tagName === 'SELECT' ? parseFloat(e.value) : e.value; }); return v; };
        const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
        function buildSubs() {
            Object.values(SUBS).flat().forEach(s => {
                const d = document.createElement('div'); d.className = 'fgrid'; d.id = 'sf_' + s.k; d.hidden = true;
                s.f.forEach(([id, label, val]) => {
                    const w = document.createElement('div'), l = document.createElement('label'); let e;
                    if (Array.isArray(val)) { e = document.createElement('select'); e.style.width = '100%'; val.forEach(([x, t]) => e.add(new Option(t, x))); }
                    else { e = document.createElement('input'); e.value = val; e.type = typeof val === 'number' ? 'number' : DATE_RE.test(val) ? 'date' : 'text'; if (e.type === 'number') { e.min = 0; e.step = 'any'; } }
                    e.id = `${s.k}_${id}`; e.dataset.f = id; l.htmlFor = e.id; l.textContent = label; w.append(l, e); d.append(w);
                });
                $('#subForms').append(d);
            });
        }
        function renderSub(out) {
            const g = SUBS[mode], sel = $('#sub');
            if (sel.dataset.g !== mode) { sel.dataset.g = mode; sel.replaceChildren(...g.map(s => new Option(s.t, s.k))); }
            const s = g.find(x => x.k === sel.value);
            document.querySelectorAll('#subForms > div').forEach(d => d.hidden = d.id !== 'sf_' + s.k);
            const v = subVals(s.k);
            if (Object.values(v).some(x => typeof x === 'number' && !Number.isFinite(x))) { out.textContent = '請填入所有欄位的數字'; return; }
            const res = s.run(v);
            if (res.err) { out.textContent = res.err; return; }
            out.append(...res.rows.map(r => Util.statRow(r[0], r[1], r[2])));
            const p = document.createElement('p'); p.className = 'muted'; p.style.fontSize = '13px'; p.textContent = (res.note || '') + '（估算，非財務建議）'; out.append(p);
        }
        buildSubs();

        document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
            mode = b.dataset.mode;
            document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.querySelectorAll('input, select').forEach(i => { i.oninput = render; });
        render();
    </script>
