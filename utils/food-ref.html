    <div class="wrap">

        <h1>飲食與食材速查</h1>
        <p class="sub">營養、食品安全、食材烹調、飲品酒類的整理參考。</p>

        <div class="card">
            <input id="q" type="search" placeholder="搜尋：GI、雞胸、橄欖油、花生、泡麵、尼格羅尼…" aria-label="搜尋" autocomplete="off" spellcheck="false" autocapitalize="off">
            <div class="seg" id="cats"></div>
            <p class="note" id="count"></p>
        </div>
        <div class="card">
            <b>酒精標準杯計算</b>
            <div class="calc" style="margin-top:8px">
                <input id="ml" type="number" inputmode="decimal" min="0" step="any" placeholder="容量 mL" aria-label="容量 mL">
                <input id="abv" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="酒精濃度 %" aria-label="酒精濃度 %">
            </div>
            <p class="note" id="calcOut">輸入容量與濃度，估算純酒精克數與標準杯數。</p>
        </div>
        <div class="card" id="list"></div>
        <p class="note">整理參考，不是醫療或營養處方；個人狀況與疾病請依醫師 / 營養師建議。數值多為「約」，實際以產品標示與官方公告為準。</p>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把飲食與食材常查的資料收在一頁：每日營養素建議量、GI 值、酒精與咖啡因、過敏原、維生素與礦物質、食品標示、料理溫度與熟度、食材與剩菜保存、魚類新鮮度、油品發煙點、米與肉類部位、蔬果產季、替代食材、台灣小吃熱量、醬料比例、餐酒搭配、泡茶、約 26 款經典調酒。每個主題是一張可展開的卡片，每列可單獨複製。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>煮菜時想確認肉要煮到幾度、剩菜能放幾天、缺了食材怎麼替代。</li>
        <li>看標示、查過敏原、算今天的咖啡因與酒精大概多少。</li>
        <li>買菜前看這個月的產季；聚餐前挑酒或查調酒配方。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用上方分類鈕縮小範圍，或在搜尋欄輸入（多個詞用空白分隔，須全部符合）。</li>
        <li>點卡片標題展開；每列右邊「複製」會連同說明一起複製。</li>
        <li>「酒精標準杯計算」輸入容量（mL）與酒精濃度（%），得到純酒精克數、標準杯數（10 g 酒精 = 1 杯）與酒精本身的熱量（每克約 7 kcal，不含糖等其他來源）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋 雞 → 雞肉的安全溫度、部位、保存、替代
搜尋 花生 → 過敏原與交叉反應
搜尋 發煙點 → 各種食用油適合的烹調方式
酒精計算：啤酒 330 mL、5% → 約 13 g、1.3 杯</div>
        <h3>小提醒</h3>
        <ul>
        <li>這是整理參考，不是醫療建議。孕婦、哺乳、嬰幼兒、長者、慢性病、免疫低下與食物過敏者，請依醫師 / 營養師建議；過敏原資料不保證任何食物「安全」，請以產品標示與醫師指示為準。</li>
        <li>食品安全溫度與時間採 USDA 等通行原則，並標示「一般原則」；營養建議量為約略值，官方（衛福部國健署）更新時以官方最新版為準。</li>
        <li>GI、熱量、咖啡因、發煙點、產季都會因品種、做法、份量與產地而不同，頁面一律寫「約」或範圍。</li>
        <li>酒精濃度為約略值。飲酒過量有害健康，未滿 18 歲不得飲酒，飲酒不開車。</li>
        <li>不儲存任何資料，也不會連線。</li>
        </ul>
    </template>

        const parseRow = (s) => { const i = s.indexOf(' ~~ '); return i < 0 ? { text: s.trim(), desc: '' } : { text: s.slice(0, i).trim(), desc: s.slice(i + 4).trim() }; };
        // 搜尋：空白分隔的詞須全部符合；標題 / 關鍵字 / 分類符合 → 整張卡，否則只列符合的列
        function searchTopics(topics, q, cat = '') {
            const ws = String(q || '').toLowerCase().split(/\s+/).filter(Boolean), out = [];
            for (const t of topics) {
                if (cat && t.cat !== cat) continue;
                const rows = t.rows.map(parseRow), head = (t.title + ' ' + t.kw + ' ' + t.cat).toLowerCase();
                if (!ws.length) { out.push({ t, rows, byRows: false }); continue; }
                const lo = rows.map(r => (r.text + ' ' + r.desc).toLowerCase());
                const all = head + ' ' + lo.join(' ');
                if (!ws.every(w => all.includes(w))) continue;
                if (ws.every(w => head.includes(w))) { out.push({ t, rows, byRows: false }); continue; }
                const hit = rows.filter((r, i) => ws.every(w => lo[i].includes(w) || head.includes(w)));
                out.push({ t, rows: hit.length ? hit : rows, byRows: true });
            }
            return out;
        }
        // 資料完整性：回傳問題清單（空陣列 = 沒問題）。每列必須有「 ~~ 說明」；有 must 的主題，每列說明要符合格式
        function checkData(topics, cats) {
            const bad = [], seen = new Set();
            for (const t of topics) {
                if (!t.id || seen.has(t.id)) bad.push('id 缺少或重複：' + t.id);
                seen.add(t.id);
                if (!t.title) bad.push('缺標題：' + t.id);
                if (!t.kw) bad.push('缺關鍵字：' + t.id);
                if (!cats.includes(t.cat)) bad.push('分類不存在：' + t.id);
                if (!t.rows || !t.rows.length) bad.push('沒有內容：' + t.id);
                for (const s of t.rows || []) {
                    const r = parseRow(s);
                    if (!r.text) bad.push('空白列：' + t.id);
                    else if (!r.desc) bad.push('缺說明：' + t.id + '／' + r.text);
                    else if (t.must && !t.must.test(r.desc)) bad.push('格式不符：' + t.id + '／' + r.text);
                }
            }
            return bad;
        }
        // 酒精：純酒精克數（密度 0.789 g/mL）、標準杯（10 g）、酒精本身熱量（7 kcal/g）
        function alcoholCalc(ml, abv) {
            const m = Number(ml), a = Number(abv);
            if (!(m > 0) || !(a > 0) || a > 100) return null;
            const g = m * a / 100 * 0.789;
            return { g, drinks: g / 10, kcal: g * 7 };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        let cat = '';
        function render() {
            const q = $('#q').value, res = searchTopics(TOPICS, q, cat);
            $('#count').textContent = `${res.length} 個主題`;
            $('#list').replaceChildren(...res.map(({ t, rows, byRows }) => {
                const d = el('details', 't'); d.dataset.id = t.id;
                d.open = byRows || (!!q.trim() && res.length <= 3);
                const sm = el('summary'); sm.append(el('span', 'n', t.title), el('span', 'c', `${t.cat} · ${rows.length} 列`));
                d.append(sm);
                if (t.note) d.append(el('p', 'tn', t.note));
                for (const r of rows) {
                    const ln = el('div', 'ln'), tx = el('div', 'tx');
                    tx.append(el('div', 'w', r.text));
                    if (r.desc) tx.append(el('div', 'ds', r.desc));
                    ln.append(tx);
                    const cp = el('button', 'sm', '複製'); cp.onclick = () => copyWithFeedback(cp, t.copyAll && r.desc ? `${r.text}：${r.desc}` : r.text);
                    ln.append(cp);
                    d.append(ln);
                }
                return d;
            }));
            if (!res.length) $('#list').append(el('p', 'muted', '沒有符合的主題'));
        }
        const bar = $('#cats');
        for (const c of ['', ...CATS]) { const b = el('button', 'sm', c || '全部'); b.dataset.c = c; b.setAttribute('aria-pressed', c === ''); bar.append(b); }
        bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; [...bar.children].forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
        $('#q').oninput = render;
        function calc() {
            const r = alcoholCalc($('#ml').value, $('#abv').value);
            $('#calcOut').textContent = r ? `純酒精約 ${r.g.toFixed(1)} g、約 ${r.drinks.toFixed(1)} 標準杯、酒精本身約 ${Math.round(r.kcal)} kcal（不含糖）` : '輸入容量（mL）與酒精濃度（%），估算純酒精克數與標準杯數。';
        }
        $('#ml').oninput = $('#abv').oninput = calc;
        render();
    </script>
</body>

</html>
