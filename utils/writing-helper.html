<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>寫作與文字小幫手</h1>
        <p class="sub">地址英譯、引用格式、常用文字片段。僅供參考，正式文件請以郵局、戶政或學校規定為準。</p>

        <div class="tabs" role="tablist">
            <button data-tab="addr" aria-pressed="true">地址英譯</button>
            <button data-tab="cite" aria-pressed="false">引用格式</button>
            <button data-tab="snip" aria-pressed="false">文字片段</button>
        </div>

        <!-- 地址英譯 -->
        <section id="p-addr">
            <div class="card">
                <label for="addrIn">中文地址（一行一個）</label>
                <textarea id="addrIn" rows="3" maxlength="2000" placeholder="台北市信義區市府路1號3樓"></textarea>
                <div class="acts" style="margin-top:8px">
                    <button id="addrCopy" class="primary">複製全部英文地址</button>
                </div>
            </div>
            <div class="card" id="addrOut"></div>
            <div class="card">
                <h2>規則速查</h2>
                <table>
                    <tr><th>中文</th><th>英文</th><th>中文</th><th>英文</th></tr>
                    <tr><td>路</td><td>Rd.</td><td>街</td><td>St.</td></tr>
                    <tr><td>大道</td><td>Blvd.</td><td>段</td><td>Sec.</td></tr>
                    <tr><td>巷</td><td>Ln.</td><td>弄</td><td>Aly.</td></tr>
                    <tr><td>號</td><td>No.</td><td>樓</td><td>F.</td></tr>
                    <tr><td>室</td><td>Rm.</td><td>之</td><td>-</td></tr>
                    <tr><td>區</td><td>Dist.</td><td>鄉 / 鎮</td><td>Township</td></tr>
                    <tr><td>東西南北</td><td>E. W. S. N.</td><td>市 / 縣</td><td>City / County</td></tr>
                </table>
                <p class="sub">順序由小到大：室、樓、號、弄、巷、段與路、區、縣市與郵遞區號、國名。</p>
            </div>
        </section>

        <!-- 引用格式 -->
        <section id="p-cite" hidden>
            <div class="card">
                <div class="fgrid">
                    <div><label for="cType">資料類型</label><select id="cType">
                            <option value="book">書籍</option>
                            <option value="article">期刊論文</option>
                            <option value="web">網頁</option>
                            <option value="thesis">學位論文</option>
                            <option value="video">影片</option>
                        </select></div>
                    <div><label for="cStyle">格式</label><select id="cStyle">
                            <option value="apa">APA 7</option>
                            <option value="mla">MLA 9</option>
                            <option value="chicago">Chicago 17</option>
                        </select></div>
                    <div class="full"><label for="f_au">作者（一行一位；英文可寫 John A. Smith 或 Smith, John A.）</label><textarea id="f_au" rows="2" maxlength="1000"></textarea></div>
                    <div><label for="f_yr">年份</label><input id="f_yr" maxlength="20" placeholder="2024"></div>
                    <div class="full"><label for="f_ti">標題</label><input id="f_ti" maxlength="300"></div>
                    <div data-for="article web video"><label for="f_ct" id="lCt">期刊 / 網站 / 平台</label><input id="f_ct" maxlength="200"></div>
                    <div data-for="book thesis"><label for="f_pb" id="lPb">出版者 / 學校</label><input id="f_pb" maxlength="200"></div>
                    <div data-for="book"><label for="f_ed">版次（數字）</label><input id="f_ed" maxlength="20" inputmode="numeric" placeholder="2"></div>
                    <div data-for="thesis"><label for="f_dg">學位</label><select id="f_dg"><option>Master's thesis</option><option>Doctoral dissertation</option></select></div>
                    <div data-for="article"><label for="f_vo">卷</label><input id="f_vo" maxlength="20"></div>
                    <div data-for="article"><label for="f_is">期</label><input id="f_is" maxlength="20"></div>
                    <div data-for="article"><label for="f_pg">頁碼</label><input id="f_pg" maxlength="30" placeholder="12-30"></div>
                    <div data-for="article web thesis video" class="full"><label for="f_ur">網址或 DOI</label><input id="f_ur" maxlength="500" inputmode="url"></div>
                    <div data-for="web"><label for="f_ac">存取日期（MLA 用）</label><input id="f_ac" maxlength="40" placeholder="5 Mar. 2024"></div>
                </div>
                <p class="sub" id="cPrev" style="margin-top:12px"></p>
                <div class="acts"><button id="cAdd" class="primary">加入清單</button></div>
                <p class="msg" id="cMsg"></p>
            </div>
            <div class="card">
                <h2>參考文獻清單</h2>
                <div class="fgrid">
                    <div><label for="cSort">排序</label><select id="cSort">
                            <option value="added">加入順序</option>
                            <option value="author">作者</option>
                            <option value="year">年份</option>
                        </select></div>
                </div>
                <div id="cList"></div>
                <div class="acts" style="margin-top:8px">
                    <button id="cCopyAll" class="primary">複製全部</button>
                    <button id="cClear">清除全部</button>
                </div>
            </div>
        </section>

        <!-- 文字片段 -->
        <section id="p-snip" hidden>
            <div class="card">
                <div class="fgrid">
                    <div class="full"><label for="s_ti">標題</label><input id="s_ti" maxlength="100"></div>
                    <div class="full"><label for="s_tx">內容（最多 5000 字）</label><textarea id="s_tx" rows="4" maxlength="5000"></textarea></div>
                    <div class="full"><label for="s_tg">標籤（用逗號分隔，最多 10 個）</label><input id="s_tg" maxlength="200"></div>
                </div>
                <div class="acts" style="margin-top:8px"><button id="sAdd" class="primary">儲存片段</button></div>
                <p class="msg" id="sMsg"></p>
            </div>
            <div class="card">
                <h2>片段庫</h2>
                <input id="sQ" type="search" placeholder="搜尋標題、內容、標籤" maxlength="100" style="width:100%">
                <div class="chips" id="sTags"></div>
                <div id="sList"></div>
                <div class="acts" style="margin-top:8px"><button id="sClear">清除全部</button></div>
            </div>
            <div class="card">
                <h2>匯入 / 匯出</h2>
                <textarea id="sIO" rows="5" placeholder="按「匯出」會把全部片段變成 JSON 文字；貼上 JSON 後按「匯入」可加入片段"></textarea>
                <div class="acts" style="margin-top:8px">
                    <button id="sExp">匯出</button>
                    <button id="sCopyIO">複製文字</button>
                    <button id="sImp">匯入</button>
                </div>
                <p class="msg" id="ioMsg"></p>
            </div>
        </section>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>三個寫作小幫手放在同一頁：把中文地址轉成英文、把書籍論文網頁整理成 APA / MLA / Chicago 引用格式、儲存常用的文字片段。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>填海外網站表單、寄國際包裹時需要英文地址。</li>
        <li>寫報告、論文要整理參考文獻。</li>
        <li>常常重複貼地址、簽名、客服回覆範本。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>地址英譯：貼上中文地址（可多行），下方即時顯示英文，按「複製全部英文地址」。</li>
        <li>引用格式：選資料類型與格式，填欄位，按「加入清單」；清單可依作者或年份排序，單筆複製 / 刪除或複製全部。</li>
        <li>文字片段：填標題與內容（可加標籤），用搜尋或標籤篩選，一鍵複製；可匯出成 JSON 文字備份、貼回匯入。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">台北市信義區市府路1號3樓
        → 3F., No. 1, Shifu Rd., Xinyi Dist., Taipei City 110, Taiwan (R.O.C.)
        John A. Smith，2020，Deep learning，MIT Press（APA）
        → Smith, J. A. (2020). Deep learning. MIT Press.</div>
        <h3>小提醒</h3>
        <ul>
        <li>地址：縣市與主要都會區的區名與三碼郵遞區號為內建；未收錄的區名、路名用字會顯示「請自行核對」，郵遞區號請查中華郵政。里、鄰會略過。路名拼音採漢語拼音（無聲調），實際門牌英文以郵局或戶政為準。</li>
        <li>引用：標題大小寫、斜體需自行確認（複製的純文字不含斜體，頁面上以斜體顯示）；中文作者姓名不倒置，英文作者轉成「姓, 名縮寫」。格式依通行規範簡化，繳交前請對照學校或期刊要求。</li>
        <li>資料：參考文獻存在本機（鍵 writing_refs，最多 200 筆）、文字片段存在本機（鍵 writing_snippets，最多 300 筆、單筆內容 5000 字內）。滿了會拒絕新增並提示，不會自動刪舊資料。</li>
        <li>刪除：每筆都有「刪除」，也有「清除全部」（會先確認、無法復原）。壞掉或舊版資料載入時會自動忽略不合格的項目。</li>
        <li>本機儲存失敗（空間滿、無痕模式）時會顯示提示，可用右上角「💾」備份。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // ===== 台灣地址英譯 =====
        // 縣市 English|區名+三碼郵遞區號（沒收錄的縣市 / 區名會標示「請查中華郵政」）
        const CITY_TXT = `台北市 Taipei City|中正區100 大同區103 中山區104 松山區105 大安區106 萬華區108 信義區110 士林區111 北投區112 內湖區114 南港區115 文山區116
新北市 New Taipei City|萬里區207 金山區208 板橋區220 汐止區221 深坑區222 石碇區223 瑞芳區224 平溪區226 雙溪區227 貢寮區228 新店區231 坪林區232 烏來區233 永和區234 中和區235 土城區236 三峽區237 樹林區238 鶯歌區239 三重區241 新莊區242 泰山區243 林口區244 蘆洲區247 五股區248 八里區249 淡水區251 三芝區252 石門區253
桃園市 Taoyuan City|中壢區320 平鎮區324 龍潭區325 楊梅區326 新屋區327 觀音區328 桃園區330 龜山區333 八德區334 大溪區335 復興區336 大園區337 蘆竹區338
台中市 Taichung City|中區400 東區401 南區402 西區403 北區404 北屯區406 西屯區407 南屯區408 太平區411 大里區412 霧峰區413 烏日區414 豐原區420 后里區421 石岡區422 東勢區423 和平區424 新社區426 潭子區427 大雅區428 神岡區429 大肚區432 沙鹿區433 龍井區434 梧棲區435 清水區436 大甲區437 外埔區438 大安區439
台南市 Tainan City|中西區700 東區701 南區702 北區704 安平區708 安南區709
高雄市 Kaohsiung City|新興區800 前金區801 苓雅區802 鹽埕區803 鼓山區804 旗津區805 前鎮區806 三民區807 楠梓區811 小港區812 左營區813 仁武區814 大社區815 岡山區820
基隆市 Keelung City|仁愛區200 信義區201 中正區202 中山區203 安樂區204 暖暖區205 七堵區206
新竹市 Hsinchu City|東區300 北區300 香山區300
嘉義市 Chiayi City|東區600 西區600
新竹縣 Hsinchu County|
苗栗縣 Miaoli County|
彰化縣 Changhua County|
南投縣 Nantou County|
雲林縣 Yunlin County|
嘉義縣 Chiayi County|
屏東縣 Pingtung County|
宜蘭縣 Yilan County|
花蓮縣 Hualien County|
台東縣 Taitung County|
澎湖縣 Penghu County|
金門縣 Kinmen County|
連江縣 Lienchiang County|`;
        const CITIES = {};
        CITY_TXT.split('\n').forEach((ln) => {
            const [h, d] = ln.split('|'), i = h.indexOf(' ');
            const o = { en: h.slice(i + 1), d: {} };
            for (const m of d.matchAll(/([^\s\d]+)(\d{3})/g)) o.d[m[1]] = m[2];
            CITIES[h.slice(0, i)] = o;
        });
        // 漢語拼音（無聲調）：音節:用字。路名用字不全時未收錄的字原樣保留並提示核對
        const PY_TXT = `a:阿 an:安岸 ai:愛艾 ba:八巴 bai:白百柏 ban:板班 bao:寶保包 bei:北貝碑 bi:碧 bin:濱賓 bo:博波 bu:步布 cai:菜彩 cao:草 chang:長常昌場 chao:朝潮 che:車 chen:陳辰 cheng:成城承誠程埕 chi:池赤恥 chong:崇重 chu:初楚 chuan:川傳 chun:春純 ci:慈 cun:村 da:大達 dan:丹淡 dao:島道 de:德 deng:登 di:地帝第 dian:店 ding:定丁碇 dong:東冬動 du:都杜肚堵 dun:敦 e:峨 er:二 fa:發法 fan:范範 fang:芳方 feng:豐鳳峰楓 fu:福復富府阜輔扶 gang:港岡 gao:高 ge:歌 gong:公工功恭宮貢 gou:溝 gu:古鼓谷股 guan:觀關館 guang:光廣 gui:桂貴龜 guo:國 hai:海 han:漢 hang:航 hao:豪 he:和河禾荷鶴合 heng:橫 hong:宏紅洪鴻 hou:后後 hu:湖虎戶 hua:華花化 huai:懷 huan:環 huang:黃皇 hui:惠匯 ji:基吉集機濟紀 jia:加家嘉甲 jian:建健堅 jiang:江將 jiao:交 jie:介 jin:金進錦晉津 jing:景京靜經精井 jiu:九久舊 ju:居巨菊 jun:軍 kai:開凱 kang:康 ke:科克 keng:坑 kou:口 kuai:快 kun:昆 lai:來 lan:蘭 lang:浪 lao:老 le:樂 li:立里利麗禮理力壢 lian:連廉 liang:良 liao:寮 lin:林臨 ling:苓靈嶺 liu:六柳流 long:龍隆 lu:蘆魯陸祿鹿綠呂 luo:羅洛 ma:馬 mao:茂 mei:美梅 men:門 meng:孟夢 mi:米 min:民閩 ming:明名 mu:木牧母 na:那 nan:南楠 nei:內 ni:泥 nian:年 ning:寧 nong:農 nuan:暖 pai:牌 pan:潘 ping:平坪屏 pu:埔浦普 qi:七旗齊起棲 qian:前千錢 qiang:強 qiao:橋 qin:親勤秦 qing:清青慶 qiu:秋丘 quan:泉全權 ren:仁人 ri:日 rong:榮 ru:如 rui:瑞 sa:薩 san:三 sha:沙 shan:山杉 shang:上 shao:少 she:社 shen:深神 sen:森 sheng:生勝聖昇 shi:十石士市世師史實時勢 shou:壽 shu:樹書舒 shuang:雙 shui:水 si:四思斯 song:松 sui:隨 sun:孫 ta:塔 tai:台臺太泰 tan:潭 tang:唐 tao:桃 ti:體 tian:田天 tie:鐵 ting:亭庭 tong:同通 tou:投 tu:土圖 tun:屯 wai:外 wan:萬灣 wang:王望 wei:偉衛維 wen:文溫 wu:五烏武梧務霧屋 xi:西溪喜希汐 xia:下夏峽 xian:縣先賢 xiang:香祥向 xiao:小孝 xie:謝 xin:新信欣心 xing:興星幸 xiu:秀 xu:旭 xue:學 ya:亞雅 yan:鹽延燕嚴 yang:陽楊洋央 ye:業 yi:義宜益頤一 yin:銀音 ying:鶯英營 yong:永勇 you:友有由 yu:玉育宇雨 yuan:園原元遠 yue:月岳越 yun:雲運 zhan:站 zhang:章張 zhao:昭 zhen:鎮 zheng:正政 zhi:志治止芝 zhong:中忠鐘眾 zhou:洲周 zhu:竹朱住 zhuang:莊 zi:子自資梓 zong:宗縱 zu:族 zuo:左`;
        const PYMAP = {};
        PY_TXT.split(' ').forEach((g) => { const [s, cs] = g.split(':'); for (const c of cs) PYMAP[c] = s; });
        function py(str) {
            const miss = []; let out = '', first = true;
            for (const ch of str) {
                const p = PYMAP[ch];
                if (p) out += (!first && /^[aeo]/.test(p) ? "'" : '') + p; else { out += ch; miss.push(ch); }
                first = false;
            }
            return { t: out.charAt(0).toUpperCase() + out.slice(1), miss };
        }
        const CND = { 零: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
        function cnNum(s) {
            if (/^\d+$/.test(s)) return +s;
            if (!/[十百]/.test(s)) return +[...s].map((c) => CND[c]).join('');
            let n = 0, cur = 0;
            for (const c of s) {
                if (c === '十') { n += (cur || 1) * 10; cur = 0; } else if (c === '百') { n += (cur || 1) * 100; cur = 0; } else cur = CND[c];
            }
            return n + cur;
        }
        const ordn = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
        const DEX = { 中區: 'Central', 東區: 'East', 西區: 'West', 南區: 'South', 北區: 'North', 中西區: 'Central and Western' };
        function distEn(d) {
            const suf = d.slice(-1), p = DEX[d] ? { t: DEX[d], miss: [] } : py(d.slice(0, -1));
            return { t: p.t + ' ' + (suf === '區' ? 'Dist.' : suf === '市' ? 'City' : 'Township'), miss: p.miss };
        }
        function roadEn(stem, type, miss) {
            let ord = '', dir = '', st = stem;
            const nm = st.match(/[一二三四五六七八九十]+$/);
            if (nm && st.length > nm[0].length) { ord = ordn(cnNum(nm[0])); st = st.slice(0, -nm[0].length); }
            if (type !== '大道' && st.length >= 3 && /[東西南北]$/.test(st)) { dir = ' ' + { 東: 'E.', 西: 'W.', 南: 'S.', 北: 'N.' }[st.slice(-1)]; st = st.slice(0, -1); }
            const p = py(st); miss.push(...p.miss);
            return p.t + dir + (ord ? ' ' + ord : '') + ' ' + { 路: 'Rd.', 街: 'St.', 大道: 'Blvd.' }[type];
        }
        const NUM = '[0-9一二三四五六七八九十百零]+';
        const ROAD_RE = new RegExp(`^(?:(.+?)(大道|路|街))?(?:(${NUM})段)?(?:(${NUM})巷)?(?:(${NUM})弄)?(?:(${NUM})號(?:之(${NUM}))?)?(?:((?:B|地下)?${NUM})樓(?:之(${NUM}))?)?(?:(${NUM})室)?(.*)$`);
        // 回傳 { ok, en, zip, warns[], parts[[標籤, 中文, 英文]] }；空字串回傳 null
        function addrParse(raw) {
            let s = String(raw || '').replace(/臺/g, '台').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248)).replace(/\s+/g, '');
            if (!s) return null;
            const warns = [], parts = [], miss = [];
            let zip = '';
            const zm = s.match(/^\d{3,6}/);
            if (zm) { zip = zm[0].slice(0, 3); s = s.slice(zm[0].length); }
            const cn = Object.keys(CITIES).find((k) => s.startsWith(k));
            if (!cn) return { ok: false, en: '', zip: '', warns: ['找不到縣市，請從「台北市」「新竹縣」這樣的縣市名開始寫'], parts };
            const C = CITIES[cn]; s = s.slice(cn.length);
            let dn = Object.keys(C.d).filter((k) => s.startsWith(k)).sort((a, b) => b.length - a.length)[0], dist = '';
            if (dn) { if (!zip) zip = C.d[dn]; } else {
                const m = s.match(/^[^\d路街道巷弄段號]{1,3}?[區鄉鎮市]/);
                if (m) { dn = m[0]; warns.push(`區名「${dn}」未收錄，請自行核對英文與郵遞區號（請查中華郵政）`); }
            }
            if (dn) { const e = distEn(dn); miss.push(...e.miss); dist = e.t; s = s.slice(dn.length); } else warns.push('沒有找到鄉鎮市區');
            const vm = s.match(/^(?:[^\d路街道巷弄段號區鄉鎮市]{1,3}[里村])?(?:\d+鄰)?/);
            if (vm[0] && !/^(路|街|大道|巷|弄|段|號|$)/.test(s.slice(vm[0].length))) { s = s.slice(vm[0].length); warns.push(`已略過「${vm[0]}」（里、鄰不列入英文地址）`); }
            const r = s.match(ROAD_RE);
            const [, stem, type, sec, ln, aly, no, no2, fl, fl2, rm, tail] = r;
            const out = [];
            if (rm) out.push('Rm. ' + cnNum(rm));
            if (fl) { const b = fl.match(/^(?:B|地下)(.+)$/); out.push((b ? 'B' + cnNum(b[1]) : cnNum(fl)) + 'F.' + (fl2 ? '-' + cnNum(fl2) : '')); }
            if (no) out.push('No. ' + cnNum(no) + (no2 ? '-' + cnNum(no2) : ''));
            if (aly) out.push('Aly. ' + cnNum(aly));
            if (ln) out.push('Ln. ' + cnNum(ln));
            if (sec) out.push('Sec. ' + cnNum(sec));
            if (stem) { const re = roadEn(stem, type, miss); out.push(re); parts.push(['路街', stem + type, re]); } else warns.push('沒有找到路名或街名');
            if (tail) warns.push(`無法解析「${tail}」，已略過`);
            if (miss.length) warns.push(`「${[...new Set(miss)].join('')}」不在對照表內，請自行核對拼音`);
            if (!zip) warns.push('郵遞區號未收錄，請查中華郵政');
            if (dist) out.push(dist);
            out.push(C.en + (zip ? ' ' + zip : ''), 'Taiwan (R.O.C.)');
            parts.unshift(['縣市', cn, C.en], ['區', dn || '—', dist || '—']);

        }

        // ===== 引用格式 =====
        const CJK = /[㐀-鿿豈-﫿]/;
        const REF_T = ['book', 'article', 'web', 'thesis', 'video'];
        const REF_F = { au: 1000, yr: 20, ti: 300, ct: 200, pb: 200, ed: 20, vo: 20, is: 20, pg: 30, ur: 500, ac: 40, dg: 40 };
        const MAX_REFS = 200, MAX_SNIPS = 300, MAX_SNIP_TXT = 5000;
        const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        function cleanRef(r) {
            if (!r || typeof r !== 'object') return null;
            const o = { id: typeof r.id === 'string' && r.id && r.id.length <= 40 ? r.id : genId(), type: REF_T.includes(r.type) ? r.type : 'book' };
            for (const k in REF_F) {
                let v = String(r[k] == null ? '' : r[k]).replace(/\*/g, '');
                if (k !== 'au') v = v.replace(/\s+/g, ' ');
                o[k] = v.trim().slice(0, REF_F[k]);
            }
            return o.ti ? o : null;
        }
        function cleanRefs(a) {
            if (!Array.isArray(a)) return [];
            const seen = new Set(), out = [];
            for (const r of a) { const c = cleanRef(r); if (c && !seen.has(c.id)) { seen.add(c.id); out.push(c); } if (out.length >= MAX_REFS) break; }
            return out;
        }
        function parseName(s) {
            s = String(s || '').trim().replace(/\s+/g, ' ');
            if (!s) return null;
            if (CJK.test(s)) return { cjk: true, last: s, first: '' };
            if (s.includes(',')) { const [l, ...f] = s.split(','); return { cjk: false, last: l.trim(), first: f.join(',').trim() }; }
            const p = s.split(' ');
            return { cjk: false, last: p.pop(), first: p.join(' ') };
        }
        const authorList = (raw) => String(raw || '').split('\n').map(parseName).filter(Boolean).slice(0, 50);
        const initials = (f) => f.split(' ').filter(Boolean).map((w) => w.split('-').map((x) => x[0].toUpperCase() + '.').join('-')).join(' ');
        const end = (s) => (!s ? '' : '.?!。'.includes(s.replace(/\*+$/, '').slice(-1)) ? s : s + '.');
        const link = (u) => (/^10\.\d{4,}\//.test(u) ? 'https://doi.org/' + u : u);
        const pages = (p) => p.replace(/(\d)\s*-\s*(\d)/, '$1–$2');
        const edTxt = (e) => (/^\d+$/.test(e) ? (+e > 1 ? ordn(+e) + ' ed.' : '') : e);
        const quoted = (t) => '"' + (/[.?!]$/.test(t) ? t : t + '.') + '"';
        const inv = (n) => (n.cjk || !n.first ? n.last : `${n.last}, ${n.first}`);
        const nat = (n) => (n.cjk || !n.first ? n.last : `${n.first} ${n.last}`);
        function auApa(ns) {
            const f = ns.map((n) => (n.cjk || !n.first ? n.last : `${n.last}, ${initials(n.first)}`));
            if (!f.length) return '';
            if (ns.every((n) => n.cjk)) return f.join('、');
            if (f.length === 1) return f[0];
            if (f.length === 2) return f[0] + ', & ' + f[1];
            if (f.length <= 20) return f.slice(0, -1).join(', ') + ', & ' + f[f.length - 1];
            return f.slice(0, 19).join(', ') + ', . . . ' + f[f.length - 1];
        }
        function auMla(ns) {
            if (!ns.length) return '';
            if (ns.length === 1) return inv(ns[0]);
            if (ns.length === 2) return inv(ns[0]) + ', and ' + nat(ns[1]);
            return inv(ns[0]) + ', et al.';
        }
        function auChi(ns) {
            if (!ns.length) return '';

            const f = ns.map((n, i) => (i ? nat(n) : inv(n)));
            if (f.length === 1) return f[0];
            if (f.length === 2) return f[0] + ', and ' + f[1];
            if (f.length > 10) return f.slice(0, 7).join(', ') + ', et al.';
            return f.slice(0, -1).join(', ') + ', and ' + f[f.length - 1];

        function refFormat(r, style) {
            r = { au: '', yr: '', ti: '', ct: '', pb: '', ed: '', vo: '', is: '', pg: '', ur: '', ac: '', dg: '', ...r };
            const ns = authorList(r.au), yr = r.yr, ti = r.ti, ur = link(r.ur), ed = edTxt(r.ed);
            const t = r.type, pg = pages(r.pg);
            let p;
            if (style === 'apa') {
                const A = end(auApa(ns)), D = `(${yr || 'n.d.'}).`;
                if (t === 'book') p = [A, D, end(`*${ti}*` + (ed ? ` (${ed})` : '')), end(r.pb)];
                else if (t === 'article') p = [A, D, end(ti), end(`*${r.ct}*` + (r.vo ? `, *${r.vo}*` : '') + (r.is ? `(${r.is})` : '') + (pg ? `, ${pg}` : '')), ur];
                else if (t === 'web') p = [A, D, end(`*${ti}*`), end(r.ct), ur];
                else if (t === 'thesis') p = [A, D, end(`*${ti}*` + ` [${r.dg || "Master's thesis"}${r.pb ? ', ' + r.pb : ''}]`), ur];

                else if (t === 'thesis') p = [A, end(`*${ti}*`), yr && end(yr), end([r.pb, /^Doc/.test(r.dg) ? 'PhD dissertation' : 'MA thesis'].filter(Boolean).join(', ')), end(ur)];

        const plain = (s) => s.replace(/\*/g, '');
        function refSort(list, by) {
            const key = (r) => { const n = authorList(r.au)[0]; return (n ? n.last : r.ti).toLowerCase(); };
            const a = list.slice(), cmp = (x, y) => (x < y ? -1 : x > y ? 1 : 0);
            if (by === 'author') a.sort((x, y) => cmp(key(x), key(y)) || cmp(String(x.yr), String(y.yr)));
            else if (by === 'year') a.sort((x, y) => cmp(String(x.yr), String(y.yr)) || cmp(key(x), key(y)));
            return a;
        }

        // ===== 文字片段 =====
        function cleanSnip(r) {
            if (!r || typeof r !== 'object') return null;
            const content = String(r.content == null ? '' : r.content).slice(0, MAX_SNIP_TXT);
            let title = String(r.title == null ? '' : r.title).replace(/\s+/g, ' ').trim().slice(0, 100);
            if (!content.trim()) return null;
            if (!title) title = content.trim().replace(/\s+/g, ' ').slice(0, 20);
            const tags = [...new Set((Array.isArray(r.tags) ? r.tags : []).map((t) => String(t).trim().slice(0, 20)).filter(Boolean))].slice(0, 10);

        }
        function cleanSnips(a) {

        // 匯入：回傳 { list: 合併後, added, skipped } 或 null（不是合法 JSON 陣列）；已存在（標題與內容相同）略過、超過上限拒絕

        // --- /pure ---

        const $ = (id) => document.getElementById(id);
        const esc = Util.esc;

        let tagSel = '';

        // 分頁

        }));

        // 地址
        let addrText = '';
        function renderAddr() {
            const lines = $('addrIn').value.split('\n').slice(0, 30);

            $('addrOut').innerHTML = rs.length ? rs.map((r) => `<div class="row"><div class="en">${esc(r.en || '（無法轉換）')}</div>`

        // 引用

<div class="sm">文中引用：${esc(refInText(r, st))}</div><div class="acts"><button data-cp="${esc(r.id)}">複製</button><button data-del="${esc(r.id)}">刪除</button></div></div>`).join('') : '<p class="sub">還沒有項目。</p>';
        }

        $('cAdd').addEventListener('click', () => {

            const list = snipFilter(snips, $('sQ').value, tagSel);

<pre>${esc(s.content.length > 200 ? s.content.slice(0, 200) + '…' : s.content)}</pre><div class="acts"><button data-cp="${esc(s.id)}">複製</button><button data-del="${esc(s.id)}">刪除</button></div></div>`).join('') : `<p class="sub">${snips.length ? '沒有符合的片段。' : '還沒有片段。'}</p>`;

        $('sImp').addEventListener('click', () => {
            const r = snipImport(snips, $('sIO').value);
            if (!r) { $('ioMsg').textContent = '格式不正確，需要是匯出的 JSON 陣列。'; return; }
            snips = r.list; saveSnips(); renderSnips();
            $('ioMsg').textContent = `匯入 ${r.added} 筆，略過 ${r.skipped} 筆（重複、內容空白或超過 ${MAX_SNIPS} 筆上限）。`;
        });
        renderSnips();
    </script>
</body>

</html>
