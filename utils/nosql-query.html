    <template id="help">
        <h3>這是什麼</h3>
        <p>用表單產生 <b>Redis</b> 指令與 <b>Elasticsearch</b> 查詢。Redis 依資料型別（String / Hash / List / Set / Sorted Set / Stream / 到期與鍵管理）列出常用指令，並顯示每個指令的<b>時間複雜度</b>與注意事項，輸出 redis-cli、Node（ioredis）、Python（redis-py）寫法。Elasticsearch 用條件建構器組出 JSON DSL，並附 Kibana Dev Tools 與 curl 寫法。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>不熟 Redis 指令參數順序，或想先看這個指令會不會拖垮正式環境。</li>
            <li>要寫 Elasticsearch 的 bool 查詢、range、聚合，不想手刻巢狀 JSON。</li>
            <li>同一個查詢要貼在終端機、程式碼與 Kibana。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li><b>Redis</b>：選資料型別與指令，填欄位。「每行一個」的欄位（多個鍵 / 成員）用換行分隔；「欄位=值」類每行一組，以第一個 <kbd>=</kbd> 分開。紅色警告代表在正式環境有風險。</li>
            <li><b>Elasticsearch</b>：填索引名稱，用條件列選欄位、查詢類型與放進 must / filter / should / must_not 哪一組；可加排序、分頁（from/size 或 search_after）、_source 篩選與聚合。</li>
            <li>切換輸出格式後按「複製」。欄位有錯時不會產生輸出。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">Redis：String → SET，鍵 session:1、值 abc、過期 60 秒
        → redis-cli：SET session:1 abc EX 60
        ES：欄位 status、term、200，放 filter；排序 @timestamp 降冪
        → {"query":{"bool":{"filter":[{"term":{"status":200}}]}},"sort":[…]}</div>
        <h3>小提醒</h3>
        <ul>
            <li><b>KEYS</b> 會掃描整個資料庫並阻塞伺服器，正式環境請改用 <b>SCAN</b>；刪除大型 Hash / List / Set 建議用 <b>UNLINK</b>（背景釋放）取代 DEL。</li>
            <li>Elasticsearch 的 from + size 預設不能超過 10000，深分頁請用 search_after（最後一個排序鍵要唯一，建議搭配 PIT 與 _shard_doc）。terms 聚合與精確比對對 text 欄位請改用 <kbd>欄位.keyword</kbd>。</li>
            <li>curl 範例預設 <kbd>http://localhost:9200</kbd>，有帳號時自行加 <kbd>-u 帳號:密碼</kbd>；Windows cmd 的引號規則不同，建議用 Git Bash 或改貼 Kibana。</li>
            <li>只記住「上次的分頁、指令與輸出格式」（本機 nosqlq_opts，壞資料回到預設）；索引、鍵名與條件不會儲存，重新整理就清空。清除瀏覽器網站資料或用右上角備份即可管理這一個鍵。</li>
            <li>產生的指令請先在測試環境確認；DSL 不含子聚合與巢狀（nested）查詢。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, copyWithFeedback } = Util;

        // --- pure ---
        const LIM = { text: 100000, key: 1000, list: 500, conds: 30, sort: 5, aggs: 10, fields: 100 };
        const FMTS = ['cli', 'node', 'python'], EFMTS = ['dsl', 'kibana', 'curl'];
        const GROUPS = [['string', 'String'], ['hash', 'Hash'], ['list', 'List'], ['set', 'Set'], ['zset', 'Sorted Set'], ['stream', 'Stream'], ['keys', '到期與鍵管理']];
        // 參數：t = key 鍵名 / str 字串 / int 整數 / num 數字 / score 分數範圍 / list 每行一個 / pairs 每行 a=b / sel 下拉 / bool 勾選 / lit 固定字
        const key = (n = 'key', l = '鍵名') => ({ n, l, t: 'key', req: 1 });
        const str = (n, l, o = {}) => ({ n, l, t: 'str', req: 1, ...o });
        const opt = (n, l, t, o = {}) => ({ n, l, t, ...o });
        const list = (n, l) => ({ n, l, t: 'list', req: 1 });
        const NXXX = [['NX', 'NX：不存在才設定'], ['XX', 'XX：已存在才設定'], ['GT', 'GT：新值較大才設定'], ['LT', 'LT：新值較小才設定']];
        const SCAN_OPTS = (type) => [opt('cursor', '游標（從 0 開始）', 'int', { req: 1, def: '0' }), opt('match', 'MATCH 樣式', 'str', { flag: 'MATCH' }), opt('count', 'COUNT 每次約掃幾筆', 'int', { flag: 'COUNT', min: 1 }), ...(type ? [opt('type', 'TYPE 型別', 'str', { flag: 'TYPE' })] : [])];
        const C = (g, cx, note, args, sev) => ({ g, cx, note, args, sev });
        const CMDS = {
            GET: C('string', 'O(1)', '', [key()]),
            SET: C('string', 'O(1)', '沒帶 EX 會清掉這個鍵原有的到期時間；用 NX 做簡易鎖時務必加 EX，否則程式當掉會永遠鎖住。', [key(), str('value', '值', { allowEmpty: 1 }), opt('cond', '條件', 'sel', { opts: [['NX', 'NX：不存在才寫入'], ['XX', 'XX：已存在才寫入']] }), opt('ex', '過期秒數 EX', 'int', { flag: 'EX', min: 1 })]),
            MGET: C('string', 'O(N)，N = 鍵數', '', [list('keys', '鍵名（每行一個）')]),
            MSET: C('string', 'O(N)，N = 鍵數', '一次寫入多個鍵，不能個別設定到期時間。', [opt('pairs', '鍵=值（每行一組）', 'pairs', { req: 1 })]),
            INCR: C('string', 'O(1)', '值必須是整數字串，否則會報錯。', [key()]),
            INCRBY: C('string', 'O(1)', '', [key(), opt('n', '增量', 'int', { req: 1 })]),
            APPEND: C('string', 'O(1)（均攤）', '字串上限 512MB，無限 APPEND 會讓單一鍵越來越大。', [key(), str('value', '要附加的字串')]),
            STRLEN: C('string', 'O(1)', '', [key()]),
            HSET: C('hash', 'O(N)，N = 欄位數', '', [key(), opt('pairs', '欄位=值（每行一組）', 'pairs', { req: 1 })]),
            HGET: C('hash', 'O(1)', '', [key(), str('field', '欄位')]),
            HMGET: C('hash', 'O(N)，N = 欄位數', '', [key(), list('fields', '欄位（每行一個）')]),
            HGETALL: C('hash', 'O(N)，N = 欄位數', '大 Hash 會阻塞伺服器；欄位很多時改用 HSCAN 分批取得。', [key()], 'warn'),
            HDEL: C('hash', 'O(N)，N = 刪除的欄位數', '', [key(), list('fields', '欄位（每行一個）')]),
            HINCRBY: C('hash', 'O(1)', '', [key(), str('field', '欄位'), opt('n', '增量', 'int', { req: 1 })]),
            HLEN: C('hash', 'O(1)', '', [key()]),
            HSCAN: C('hash', '每次 O(1)，完整走完 O(N)', '游標回傳 0 代表掃完；同一欄位可能重複出現。', [key(), ...SCAN_OPTS(false)]),
            LPUSH: C('list', 'O(N)，N = 元素數', '', [key(), list('values', '值（每行一個）')]),
            RPUSH: C('list', 'O(N)，N = 元素數', '', [key(), list('values', '值（每行一個）')]),
            LPOP: C('list', 'O(N)，N = 彈出數', '不給數量時彈出 1 個。', [key(), opt('count', '數量（可留空）', 'int', { min: 1 })]),
            LRANGE: C('list', 'O(S+N)，S = 起點偏移、N = 回傳數', '範圍 0 -1 會取出整個 List，大 List 會阻塞並佔用大量頻寬，請分段取。', [key(), opt('start', '起始索引', 'int', { req: 1, def: '0' }), opt('stop', '結束索引（-1 = 最後）', 'int', { req: 1, def: '-1' })]),
            LLEN: C('list', 'O(1)', '', [key()]),
            LTRIM: C('list', 'O(N)，N = 被移除的元素數', '只保留指定範圍，常用來限制 List 長度。', [key(), opt('start', '起始索引', 'int', { req: 1, def: '0' }), opt('stop', '結束索引', 'int', { req: 1, def: '999' })]),
            BLPOP: C('list', 'O(1)', '會阻塞這條連線直到有資料或逾時：不要在共用連線池或 pub/sub 連線上使用；0 = 永遠等待。', [key(), opt('timeout', '逾時秒數', 'num', { req: 1, def: '5' })], 'warn'),
            SADD: C('set', 'O(N)，N = 成員數', '', [key(), list('members', '成員（每行一個）')]),
            SREM: C('set', 'O(N)，N = 成員數', '', [key(), list('members', '成員（每行一個）')]),
            SMEMBERS: C('set', 'O(N)，N = 成員數', '大 Set 會阻塞伺服器；改用 SSCAN 分批取得。', [key()], 'warn'),
            SISMEMBER: C('set', 'O(1)', '', [key(), str('member', '成員')]),
            SCARD: C('set', 'O(1)', '', [key()]),
            SINTER: C('set', 'O(N*M)，N = 最小集合大小、M = 集合數', '大集合交集很慢；可用 SINTERCARD 只取數量。', [list('keys', '鍵名（每行一個）')], 'warn'),
            SUNION: C('set', 'O(N)，N = 所有集合成員總數', '大集合的聯集會佔用大量記憶體與時間；可改用 SUNIONSTORE 存到別的鍵。', [list('keys', '鍵名（每行一個）')], 'warn'),
            SDIFF: C('set', 'O(N)，N = 所有集合成員總數', '大集合的差集會阻塞伺服器；順序有意義：第一個鍵減去其餘。', [list('keys', '鍵名（每行一個，第一個為被減集合）')], 'warn'),
            SSCAN: C('set', '每次 O(1)，完整走完 O(N)', '游標回傳 0 代表掃完；成員可能重複出現。', [key(), ...SCAN_OPTS(false)]),
            ZADD: C('zset', 'O(log N) 每個成員', 'GT / LT 只在分數變大 / 變小時才更新（Redis 6.2+）。', [key(), opt('cond', '條件', 'sel', { opts: NXXX }), opt('ch', '回傳「變動」筆數 (CH)', 'bool', { flag: 'CH' }), opt('pairs', '分數=成員（每行一組）', 'pairs', { req: 1, numFirst: 1 })]),
            ZRANGE: C('zset', 'O(log N + M)，M = 回傳數', '需要 Redis 6.2+（BYSCORE / REV 合併進 ZRANGE）。範圍 0 -1 會取出全部。', [key(), str('min', '起點（索引或分數；-inf / +inf）', { def: '0' }), str('max', '終點', { def: '-1' }), opt('byscore', '依分數 (BYSCORE)', 'bool', { flag: 'BYSCORE' }), opt('rev', '反向 (REV)', 'bool', { flag: 'REV' }), opt('withscores', '同時回傳分數', 'bool', { flag: 'WITHSCORES' })]),
            ZREM: C('zset', 'O(M log N)，M = 成員數', '', [key(), list('members', '成員（每行一個）')]),
            ZSCORE: C('zset', 'O(1)', '', [key(), str('member', '成員')]),
            ZRANK: C('zset', 'O(log N)', '', [key(), str('member', '成員')]),
            ZINCRBY: C('zset', 'O(log N)', '', [key(), opt('incr', '增量', 'num', { req: 1 }), str('member', '成員')]),
            ZCARD: C('zset', 'O(1)', '', [key()]),
            ZCOUNT: C('zset', 'O(log N)', '分數可用 -inf、+inf，前面加 ( 表示不含邊界。', [key(), opt('min', '最小分數', 'score', { req: 1, def: '-inf' }), opt('max', '最大分數', 'score', { req: 1, def: '+inf' })]),
            ZREMRANGEBYSCORE: C('zset', 'O(log N + M)，M = 移除數', '會一次刪除範圍內所有成員，請先用 ZCOUNT 確認筆數。', [key(), opt('min', '最小分數', 'score', { req: 1 }), opt('max', '最大分數', 'score', { req: 1 })], 'warn'),
            XADD: C('stream', 'O(1)；加上 MAXLEN 修剪時另計', '沒有 MAXLEN 的 Stream 會無限成長；~ 為近似修剪，效能較好。', [key(), opt('maxlen', 'MAXLEN 上限（可留空）', 'int', { flag: 'MAXLEN ~', min: 1 }), str('id', '訊息 ID（* = 自動）', { def: '*' }), opt('pairs', '欄位=值（每行一組）', 'pairs', { req: 1 })]),
            XRANGE: C('stream', 'O(N)，N = 回傳數', '- 與 + 代表最小與最大 ID；建議一定帶 COUNT。', [key(), str('start', '起點 ID', { def: '-' }), str('end', '終點 ID', { def: '+' }), opt('count', 'COUNT', 'int', { flag: 'COUNT', min: 1 })]),
            XREAD: C('stream', 'O(N)，N = 回傳數', 'BLOCK 會阻塞連線；ID 用 $ 代表只等新訊息。', [opt('count', 'COUNT', 'int', { flag: 'COUNT', min: 1 }), opt('block', 'BLOCK 毫秒（可留空）', 'int', { flag: 'BLOCK', min: 0 }), { t: 'lit', v: 'STREAMS' }, key(), str('id', '起始 ID', { def: '$' })]),
            XLEN: C('stream', 'O(1)', '', [key()]),
            'XGROUP CREATE': C('stream', 'O(1)', 'ID 用 $ 代表只處理之後的新訊息，0 代表從頭；MKSTREAM 讓不存在的 Stream 一併建立。', [key(), str('group', '群組名稱'), str('id', '起始 ID', { def: '$' }), opt('mk', '不存在就建立 (MKSTREAM)', 'bool', { flag: 'MKSTREAM' })]),
            XREADGROUP: C('stream', 'O(M)，M = 回傳數', 'ID 用 > 代表尚未派送給任何消費者的新訊息；處理完要 XACK。', [{ t: 'lit', v: 'GROUP' }, str('group', '群組名稱'), str('consumer', '消費者名稱'), opt('count', 'COUNT', 'int', { flag: 'COUNT', min: 1 }), opt('block', 'BLOCK 毫秒（可留空）', 'int', { flag: 'BLOCK', min: 0 }), { t: 'lit', v: 'STREAMS' }, key(), str('id', '起始 ID', { def: '>' })]),
            XACK: C('stream', 'O(1) 每個 ID', '', [key(), str('group', '群組名稱'), list('ids', '訊息 ID（每行一個）')]),
            XTRIM: C('stream', 'O(N)，N = 被修剪的筆數', '', [key(), { t: 'lit', v: 'MAXLEN' }, opt('approx', '近似修剪 (~)', 'bool', { flag: '~' }), opt('n', '保留上限', 'int', { req: 1, min: 0 })]),
            EXPIRE: C('keys', 'O(1)', '重新 SET 會清掉到期時間；NX / XX / GT / LT 需要 Redis 7.0+。', [key(), opt('seconds', '秒數', 'int', { req: 1, min: 0 }), opt('cond', '條件', 'sel', { opts: NXXX })]),
            EXPIREAT: C('keys', 'O(1)', '參數是 Unix 秒（不是毫秒）。', [key(), opt('ts', 'Unix 時間（秒）', 'int', { req: 1, min: 0 })]),
            TTL: C('keys', 'O(1)', '回傳 -1 = 沒有到期時間，-2 = 鍵不存在。', [key()]),
            PERSIST: C('keys', 'O(1)', '移除到期時間，鍵會永久保留。', [key()]),

            UNLINK: C('keys', 'O(1) 每個鍵（實際釋放在背景執行緒）', '非阻塞版 DEL，Redis 4.0+。', [list('keys', '鍵名（每行一個）')]),
            EXISTS: C('keys', 'O(N)，N = 鍵數', '', [list('keys', '鍵名（每行一個）')]),
            TYPE: C('keys', 'O(1)', '', [key()]),

                else if (a.t === 'list' || a.t === 'pairs') kids.push(h('label', { for: id }, a.l), h('textarea', { id, spellcheck: 'false', maxlength: LIM.text, oninput: (e) => { v[a.n] = e.target.value; update(); } }, val));
                else kids.push(h('label', { for: id }, a.l + (a.req ? '' : '（選填）')), h('input', { id, type: 'text', value: val, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', inputmode: a.t === 'int' || a.t === 'num' ? 'text' : null, maxlength: a.t === 'key' ? LIM.key : LIM.text, oninput: (e) => { v[a.n] = e.target.value; update(); } }));
            });
            $('#rForm').replaceChildren(...kids);
            $('#rInfo').replaceChildren(h('span', { class: 'cx' }, '時間複雜度 ' + m.cx), ...(m.note ? [' ', m.note] : []));
            update();
        }

        // ---- ES 表單 ----
        const TYPES = [['string', '字串'], ['number', '數字'], ['bool', '布林']];
        const txt = (o, k, ph, p = {}) => h('input', { type: 'text', value: o[k] ?? '', placeholder: ph, 'aria-label': ph, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', maxlength: 2000, oninput: (e) => { o[k] = e.target.value; update(); }, ...p });
        const sel = (o, k, opts, rebuild, label) => { const s = h('select', { 'aria-label': label || k, onchange: (e) => { o[k] = e.target.value; rebuild ? buildEForm() : update(); } }, ...opts.map(([v, l]) => h('option', { value: v }, l))); s.value = o[k]; return s; };
        const chk = (o, k, label, rebuild) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: !!o[k], onchange: (e) => { o[k] = e.target.checked; rebuild ? buildEForm() : update(); } }), label);
        const addTo = (list, item, max, what) => { if (list.length >= max) return msg(`${what}最多 ${max} 個`); msg(''); list.push(item); buildEForm(); };
        $('#eIdx').oninput = () => { E.index = $('#eIdx').value; update(); };
        function buildEForm() {
            $('#eIdx').value = E.index;
            $('#eQ').replaceChildren(h('h2', {}, '查詢條件'), ...E.conds.map((c, i) => h('div', { class: 'crow' }, txt(c, 'field', '欄位（可用 a.b.c）'), sel(c, 'op', ES_OPS, true, '查詢類型'), ...(c.op === 'exists' ? [] : [sel(c, 'type', TYPES, false, '值型別'), txt(c, 'value', c.op === 'terms' ? '多個值，逗號或換行分隔' : '值')]), sel(c, 'occ', ES_OCC, false, '放進哪一組'), btn('✕', () => { E.conds.splice(i, 1); buildEForm(); }, 'sm del', '刪除這個條件'))), btn('＋條件', () => addTo(E.conds, { field: '', op: 'match', type: 'string', value: '', occ: 'must' }, LIM.conds, '條件')), h('label', {}, 'minimum_should_match（有 should 時，可留空）'), txt(E, 'msm', '例如 1 或 75%'));
            $('#eS').replaceChildren(h('h2', {}, '排序與欄位'), ...E.sort.map((r, i) => h('div', { class: 'crow' }, txt(r, 'field', '排序欄位（可用 _score）'), sel(r, 'dir', [['asc', '升冪'], ['desc', '降冪']], false, '方向'), btn('✕', () => { E.sort.splice(i, 1); buildEForm(); }, 'sm del', '刪除這個排序'))), btn('＋排序', () => addTo(E.sort, { field: '', dir: 'asc' }, LIM.sort, '排序')), h('label', {}, '_source（回傳哪些欄位）'), sel(E, 'srcMode', [['all', '全部'], ['none', '不回傳 (false)'], ['sel', '指定欄位']], true, '_source'), ...(E.srcMode === 'sel' ? [txt(E, 'inc', '包含欄位，逗號分隔'), txt(E, 'exc', '排除欄位，逗號分隔')] : []));
            $('#eP').replaceChildren(h('h2', {}, '分頁'), h('div', { class: 'row' }, txt(E, 'size', 'size（每頁筆數，0 = 只要聚合）', { inputmode: 'numeric' }), txt(E, 'from', 'from（跳過筆數）', { inputmode: 'numeric' })), h('label', {}, 'search_after（深分頁，上一頁最後一筆的排序值，JSON 陣列）'), txt(E, 'after', '例如 [1700000000000, "doc-123"]'), chk(E, 'track', '精確計算總筆數 (track_total_hits)'));
            $('#eA').replaceChildren(h('h2', {}, '聚合 aggregations'), ...E.aggs.map((a, i) => h('div', { class: 'crow' }, txt(a, 'name', '結果名稱'), sel(a, 'type', AGG_TYPES, true, '聚合類型'), txt(a, 'field', '欄位'), ...(a.type === 'terms' ? [txt(a, 'size', '分組數量（預設 10）', { inputmode: 'numeric' })] : a.type === 'date_histogram' ? [sel(a, 'interval', INTERVALS.map(x => [x, x]), false, '時間間隔')] : []), btn('✕', () => { E.aggs.splice(i, 1); buildEForm(); }, 'sm del', '刪除這個聚合'))), btn('＋聚合', () => addTo(E.aggs, { name: '', type: 'terms', field: '', size: '', interval: 'day' }, LIM.aggs, '聚合')));
            update();
        }

        // ---- 輸出 ----
        function update() {
            let r;
            if (tab === 'redis') r = buildRedis(cmd, rvals[cmd]); else r = buildEs(E);
            $('#errs').replaceChildren(...r.errs.map(e => h('li', {}, e)));
            $('#warns').replaceChildren(...r.warns.map(w => h('div', { class: 'alert' + (w.level === 'danger' ? '' : w.level === 'warn' ? ' warn' : ' info') }, w.text)));
            text = r.ok ? (tab === 'redis' ? renderRedis(r.argv, fmt) : renderEs(r, efmt)) : '';
            $('#out').textContent = text; $('#out').hidden = !text; $('#copy').hidden = !text;
        }
        $('#copy').onclick = () => copyWithFeedback($('#copy'), text);
        show();
    </script>
</body>

</html>
