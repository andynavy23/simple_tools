    <template id="help">
        <h3>這是什麼</h3>
        <p>內建 2025–2027 年台灣國定假日（農曆節日用瀏覽器內建農曆推算）、補假與補班日，提供月曆、連假清單、下一個連假倒數，以及「請假最佳化」：請最少幾天假，換最長的連續休假。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想知道下一個連假是哪天、還有幾天、共幾天。</li>
        <li>規劃年假：手上有 N 天假，要怎麼請才休得最久。</li>
        <li>想印出年度 / 單月日曆（含放假、補班、農曆與自己的標記日）貼牆或存成 PDF。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「月曆」：切換年份與月份，紅色為放假、藍色為補班，灰色為一般週末。</li>
        <li>「連假清單」：列出該年連續休 3 天以上的區段與天數；按「下載 .ics」把該年每個連假匯成一個全天事件（起訖與清單一致），補班日另成事件並在標題註明「補班」，匯入手機行事曆即可；用「資料編輯」覆蓋的日期也會反映。</li>
        <li>「請假最佳化」：選年度、輸入可請假天數 N（1–10），列出「請假天數 ↔ 連休天數」最划算的方案與要請的日期，可複製。</li>
        <li>「列印日曆」：選年度、範圍（單月 / 整年一頁 / 整年每月一頁）、週首日、紙張方向，可勾選顯示假日與補班、農曆；下方可新增自己的標記日（可設「每年重複」，如生日）；按「列印 / 存成 PDF」用瀏覽器列印功能輸出（建議取消頁首頁尾）。</li>
        <li>「資料編輯」：官方公告和內建資料不同時，可新增「放假」或「補班」日期覆蓋；也可看內建的調整放假 / 補班範例。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">2025 春節：1/25（六）到 2/2（日）連休 9 天（含 1/27 調整放假），2/8（六）要補班。輸入 N = 2，可能得到「請 2 天換 9 天以上」之類的方案。</div>
        <h3>小提醒</h3>
        <ul>
        <li>規則依「紀念日及節日實施條例」推算（週六提前一天補假、週日延後一天補假；春節放除夕前一日到初三，逢週末順延補假）。資料對照行政院人事行政總處「政府行政機關辦公日曆表」（114、115、116 年，查詢日 2026-11-22）：114 年 6 月修正後已取消補班制度，2026、2027 年都沒有補班日，僅 2025 春節有 1/27 調整放假與 2/8 補班。<b>請以人事行政總處公告為準</b>，不同時請在「資料編輯」覆蓋。</li>
        <li>農曆節日用瀏覽器內建農曆推算，並以天文新月（UTC+8）校正已知差一天的日期（例如 2027 春節初一是 2/6，部分瀏覽器會算成 2/7）。</li>
        <li>勞動節、教師節、光復節、行憲紀念日以 2025 年起全民放假計；企業、學校、軍公教實際放假可能不同。</li>
        <li>自訂資料存在這台裝置（鍵 twhol_custom），上限 200 筆，滿了要先刪除才能新增；可單筆刪除或「清除全部自訂資料」（會先確認，無法復原）；列印日曆的標記日存在鍵 twhol_marks，上限 100 筆，同樣可單筆刪除或「清除全部標記」（會先確認，無法復原），資料壞掉時載入會自動略過壞項；壞掉的資料載入時會被略過。</li>
        <li>匯出 .ics 只讀取目前資料，不新增任何儲存資料；再次匯入同一份檔案會依固定 ID 更新而不是重複。</li>
        <li>請假最佳化假設週末與放假日休息、補班日上班，請假日只挑一般上班日；僅供參考。</li>
        </ul>

    <script>
        const { day } = Util;
        // --- pure ---
        const YEARS = [2025, 2026, 2027], MAX_CUSTOM = 200;
        const { TW_ADJ, dow, lunarOf, qingming, lunarEvents, autoHolidays, buildMap, isRest } = TwHol;   // 資料與推算在 shared/js/tw-holiday-data.js
        // 連續休假區段（≥ min 天，且與 [from, to] 有交集）
        function restRuns(map, from, to, min = 3) {
            const out = []; let s = null;
            const a = day.shift(from, -10), b = day.shift(to, 10);
            for (let ds = a; ds <= day.shift(b, 1); ds = day.shift(ds, 1)) {
                const r = ds <= b && isRest(map, ds);
                if (r && !s) s = ds;
                if (!r && s) {
                    const e = day.shift(ds, -1), len = day.between(s, e) + 1;
                    if (len >= min && e >= from && s <= to) {
                        const names = []; for (let x = s; x <= e; x = day.shift(x, 1)) { const v = map.get(x); if (v && v.kind === 'off' && !names.includes(v.name.replace(/補假|初[一二三]/, ''))) names.push(v.name.replace(/補假|初[一二三]/, '')); }
                        out.push({ from: s, to: e, len, names });
                    }
                    s = null;
                }
            }
            return out;
        }
        // ICS：該年每個連假一個全天事件（DTEND = 最後一天 + 1），補班日各一個全天事件（標題註明「補班」）；沿用目前的資料（含自訂覆蓋）
        const icsEsc = (s) => String(s).replace(/[\x00-\x1f\x7f]/g, ' ').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,');
        function icsFold(line) {   // 每行 ≤ 75 octets，以字元為單位切，續行以空白開頭
            const out = []; let cur = '', n = 0;
            for (const ch of line) { const b = new TextEncoder().encode(ch).length; if (n + b > 75) { out.push(cur); cur = ' '; n = 1; } cur += ch; n += b; }
            return [...out, cur].join('\r\n');
        }
        function runsIcs(map, y, now) {
            const d8 = (d) => d.replace(/-/g, ''), stamp = now.toISOString().replace(/[-:]|\.\d+/g, '');
            const ev = (id, from, to, title) => ['BEGIN:VEVENT', `UID:${id}@simple-tools-twhol`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(from)}`, `DTEND;VALUE=DATE:${d8(day.shift(to, 1))}`, `SUMMARY:${icsEsc(title)}`, 'END:VEVENT'];
            const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//simple_tools//TwHolidays//ZH-TW', 'CALSCALE:GREGORIAN'];
            restRuns(map, y + '-01-01', y + '-12-31').forEach(r => L.push(...ev('run-' + d8(r.from), r.from, r.to, `連假：${r.names.join('、') || '週末連假'}（共 ${r.len} 天）`)));
            [...map.entries()].filter(([d, v]) => d.startsWith(y + '-') && v.kind === 'work').sort((a, b) => a[0].localeCompare(b[0])).forEach(([d, v]) => L.push(...ev('work-' + d8(d), d, d, `補班：${v.name}`)));
            L.push('END:VCALENDAR');
            return L.map(icsFold).join('\r\n') + '\r\n';
        }
        // 下一個（或進行中的）連假；today 為 YYYY-MM-DD
        function nextRun(runs, today) {
            const r = runs.find(x => x.to >= today); if (!r) return null;
            return { ...r, ongoing: r.from <= today, until: Math.max(0, day.between(today, r.from)) };
        }
        // 請假最佳化：最多請 N 天（只請一般上班日），回傳「請假天數 ↔ 連休天數」未被支配的方案
        function optimizeLeave(map, year, N, topK = 8) {
            const a = year + '-01-01', n = day.between(a, (year + 1) + '-02-10') + 1, ds = [], rest = [], W = [0];
            for (let i = 0; i < n; i++) { ds[i] = day.shift(a, i); rest[i] = isRest(map, ds[i]); W[i + 1] = W[i] + (rest[i] ? 0 : 1); }
            const before = isRest(map, day.shift(a, -1)), len = day.between(a, (year + 1) + '-01-01');
            const plans = [];
            for (let i = 0; i < len; i++) {
                if (i === 0 ? before : rest[i - 1]) continue;   // 左邊還是休息日就還能免費延伸
                for (let j = i; j < n - 1; j++) {
                    if (rest[j + 1]) continue;               // 右邊是休息日就還能免費延伸
                    const cost = W[j + 1] - W[i];
                    if (cost > N) break;
                    if (cost < 1 || cost === j - i + 1) continue;      // 沒請假，或整段都是請假（沒有休息日）
                    plans.push({ from: ds[i], to: ds[j], len: j - i + 1, cost });
                }
            }
            const best = plans.filter(p => !plans.some(q => q.cost <= p.cost && q.len >= p.len && (q.cost < p.cost || q.len > p.len)));
            best.sort((x, y) => y.len - x.len || x.cost - y.cost || x.from.localeCompare(y.from));
            const seen = {}, out = [];
            best.forEach(p => { const k = p.cost + '|' + p.len; seen[k] = (seen[k] || 0) + 1; if (seen[k] <= 2) out.push(p); });
            return out.slice(0, topK).map(p => {
                const leave = []; for (let x = p.from; x <= p.to; x = day.shift(x, 1)) if (!isRest(map, x)) leave.push(x);
                return { ...p, leave };
            });
        }
        const wd = (ds) => '日一二三四五六'[dow(ds)];
        const md = (ds) => ds.slice(5).replace('-', '/') + '（' + wd(ds) + '）';
        function validCustom(x) {
            return !!x && typeof x.id === 'string' && x.id.length <= 20 && typeof x.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.d) && !isNaN(Date.parse(x.d + 'T00:00:00Z')) && new Date(x.d + 'T00:00:00Z').toISOString().slice(0, 10) === x.d
                && x.d >= '2000-01-01' && x.d <= '2100-12-31' && (x.kind === 'off' || x.kind === 'work') && typeof x.name === 'string' && x.name.length <= 20;
        }
        const cleanCustom = (v) => (Array.isArray(v) ? v.filter(validCustom) : []).slice(0, MAX_CUSTOM);
        // 列印日曆：月曆格（週首日 ws：0 日 / 1 一），前後以 null 補齊成整週
        function monthGrid(y, m, ws) {
            const lead = (dow(day.ymd(y, m, 1)) - ws + 7) % 7, n = day.daysInMonth(y, m), out = Array(lead).fill(null);
            for (let d = 1; d <= n; d++) out.push(day.ymd(y, m, d));
            while (out.length % 7) out.push(null);
            return out;
        }
        const LUNAR_M = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '臘'];
        function lunarDayName(d) { return d === 10 ? '初十' : d === 20 ? '二十' : d === 30 ? '三十' : ['初', '十', '廿'][Math.floor(d / 10)] + '一二三四五六七八九'[d % 10 - 1]; }
        // 農曆標示：初一顯示月名（閏月加「閏」），其餘顯示日名
        function lunarLabel(ds) { const l = lunarOf(ds); return l.d === 1 ? (l.leap ? '閏' : '') + LUNAR_M[l.m - 1] + '月' : lunarDayName(l.d); }
        const MAX_MARKS = 100;
        function validMark(x) {
            return !!x && typeof x.id === 'string' && x.id.length <= 20 && typeof x.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.d) && !isNaN(Date.parse(x.d + 'T00:00:00Z')) && new Date(x.d + 'T00:00:00Z').toISOString().slice(0, 10) === x.d
                && x.d >= '2000-01-01' && x.d <= '2100-12-31' && typeof x.text === 'string' && x.text.length > 0 && x.text.length <= 20 && (x.yearly === undefined || typeof x.yearly === 'boolean');
        }
        const cleanMarks = (v) => (Array.isArray(v) ? v.filter(validMark) : []).slice(0, MAX_MARKS);
        // 某日的標記文字（每年重複者比對月日）
        const marksOn = (marks, ds) => marks.filter(k => k.d === ds || (k.yearly && k.d.slice(5) === ds.slice(5))).map(k => k.text);
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const todayTW = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
        let custom = cleanCustom(Util.store.get('twhol_custom', [])), MAP = null, marks = cleanMarks(Util.store.get('twhol_marks', []));
        const saveMarks = () => Util.store.set('twhol_marks', marks);
        const saveCustom = () => Util.store.set('twhol_custom', custom);
        const yearsAround = (y) => [y - 1, y, y + 1];
        function mapFor(y) { return buildMap(yearsAround(y), custom); }
        const today = todayTW();
        let cy = Math.min(2027, Math.max(2025, +today.slice(0, 4))), cm = +today.slice(5, 7);

        function fillYears() {
            ['#ry', '#oy', '#py'].forEach(s => { $(s).replaceChildren(...YEARS.map(y => Object.assign(document.createElement('option'), { value: y, textContent: y + ' 年' }))); $(s).value = cy; });
        }
        function renderNext() {
            const y = +today.slice(0, 4), map = buildMap([y - 1, y, y + 1, y + 2], custom);
            const r = nextRun(restRuns(map, today, day.shift(today, 400)), today);
            $('#next').textContent = r ? (r.ongoing ? '連假進行中' : `下一個連假：還有 ${r.until} 天`) : '近期沒有連假資料';
            $('#nextSub').textContent = r ? `${r.from} ${md(r.from).slice(-3)} – ${r.to} ${md(r.to).slice(-3)}，共 ${r.len} 天${r.names.length ? '（' + r.names.join('、') + '）' : ''}` : '';
        }
        function renderCal() {
            const map = mapFor(cy);
            $('#ym').textContent = `${cy} 年 ${cm} 月`;
            const first = day.ymd(cy, cm, 1), n = day.daysInMonth(cy, cm), cells = [];
            '日一二三四五六'.split('').forEach(c => cells.push(Object.assign(document.createElement('div'), { className: 'h', textContent: c })));
            for (let i = 0; i < dow(first); i++) cells.push(document.createElement('div'));
            const list = [];
            for (let d = 1; d <= n; d++) {
                const ds = day.ymd(cy, cm, d), e = map.get(ds), w = dow(ds);
                const c = document.createElement('div'), b = document.createElement('b'), s = document.createElement('small');
                c.className = 'd' + (e ? (e.kind === 'off' ? ' off' : ' work') : (w === 0 || w === 6 ? ' wk' : '')) + (ds === today ? ' today' : '');
                b.textContent = d; s.textContent = e ? (e.kind === 'work' ? '補班' : e.name) : ''; c.append(b, s); cells.push(c);
                if (e) list.push(`${md(ds)} ${e.kind === 'work' ? '補班：' : ''}${e.name}`);
            }
            $('#calGrid').replaceChildren(...cells);
            $('#monthList').replaceChildren(...list.map(t => Object.assign(document.createElement('div'), { className: 'li2', textContent: t })));
        }
        function renderRuns() {
            const y = +$('#ry').value, map = mapFor(y);
            const rs = restRuns(map, y + '-01-01', y + '-12-31');
            $('#runList').replaceChildren(...rs.map(r => { const d = document.createElement('div'); d.className = 'li2'; d.textContent = `${r.from.slice(5)} ${wd(r.from)} – ${r.to.slice(5)} ${wd(r.to)}　共 ${r.len} 天`; d.append(Object.assign(document.createElement('small'), { textContent: r.names.join('、') || '週末連假' })); return d; }));
        }
        $('#runIcs').onclick = () => { const y = $('#ry').value; Util.download(new Blob([runsIcs(mapFor(+y), y, new Date())], { type: 'text/calendar;charset=utf-8' }), `tw-holidays-${y}.ics`); };
        let lastText = '';
        function renderOpt() {
            const y = +$('#oy').value, N = Math.max(1, Math.min(10, Math.floor(+$('#on').value) || 1));
            $('#on').value = N;
            const ps = optimizeLeave(mapFor(y), y, N);
            lastText = `${y} 年請 ${N} 天以內的方案：\n` + ps.map((p, i) => `${i + 1}. ${md(p.from)} – ${md(p.to)}：請 ${p.cost} 天（${p.leave.map(x => x.slice(5)).join('、')}）換連休 ${p.len} 天`).join('\n');
            $('#oRes').replaceChildren(...(ps.length ? ps.map((p, i) => { const d = document.createElement('div'); d.className = 'li2'; d.append(Object.assign(document.createElement('b'), { textContent: `${i + 1}. 請 ${p.cost} 天，連休 ${p.len} 天` }), Object.assign(document.createElement('small'), { textContent: `${md(p.from)} – ${md(p.to)}；請假：${p.leave.map(md).join('、')}` })); return d; }) : [Object.assign(document.createElement('div'), { textContent: '沒有找到方案' })]));
            $('#oCopy').hidden = !ps.length;
        }
        function renderData() {
            $('#cN').textContent = custom.length;
            $('#cList').replaceChildren(...custom.slice().sort((a, b) => a.d.localeCompare(b.d)).map(c => {
                const d = document.createElement('div'); d.className = 'li2';
                const x = Object.assign(document.createElement('button'), { className: 'sm x', textContent: '刪除' });
                x.onclick = () => { custom = custom.filter(z => z.id !== c.id); saveCustom(); refresh(); };
                d.append(x, `${c.d}（${wd(c.d)}）${c.kind === 'work' ? '補班' : '放假'}：${c.name || '—'}`); return d;
            }));
            $('#adjList').replaceChildren(...TW_ADJ.map(a => Object.assign(document.createElement('div'), { className: 'li2', textContent: `${a.d}（${wd(a.d)}）${a.kind === 'work' ? '補班' : '放假'}：${a.name}` })));
        }
        function renderMarks() {
            $('#mN').textContent = marks.length;
            $('#mList').replaceChildren(...marks.slice().sort((a, b) => a.d.slice(5).localeCompare(b.d.slice(5)) || a.d.localeCompare(b.d)).map(k => {
                const d = document.createElement('div'); d.className = 'li2';
                const x = Object.assign(document.createElement('button'), { className: 'sm x', textContent: '刪除' });
                x.onclick = () => { marks = marks.filter(z => z.id !== k.id); saveMarks(); renderMarks(); renderPrint(); };
                d.append(x, `${k.d}（${wd(k.d)}）${k.yearly ? '每年 ' : ''}${k.text}`); return d;
            }));
        }
        function renderPrint() {
            const y = +$('#py').value, scope = $('#pscope').value, ws = +$('#pws').value, big = scope !== 'grid';
            const hol = $('#phol').checked, lun = $('#plun').checked, map = mapFor(y), land = $('#por').value === 'landscape';
            const mk = (m) => {
                const box = document.createElement('div'); box.className = 'pm';
                const h = document.createElement('h4'); h.textContent = `${y} 年 ${m} 月`;
                const g = document.createElement('div'); g.className = 'g';
                (ws ? '一二三四五六日' : '日一二三四五六').split('').forEach(c => g.append(Object.assign(document.createElement('div'), { className: 'h', textContent: c })));
                monthGrid(y, m, ws).forEach(ds => {
                    const c = document.createElement('div');
                    if (ds) {
                        const e = hol ? map.get(ds) : null, w = dow(ds), b = document.createElement('b');
                        c.className = 'c' + (e && e.kind === 'off' ? ' off' : '') + (!e && (w === 0 || w === 6) ? ' we' : '');
                        b.textContent = +ds.slice(8); c.append(b);
                        if (big && lun) c.append(Object.assign(document.createElement('i'), { textContent: lunarLabel(ds) }));
                        if (big && e) c.append(Object.assign(document.createElement('i'), { textContent: e.kind === 'work' ? '補班' : e.name }));
                        if (!big && e && e.kind === 'work') c.append(Object.assign(document.createElement('i'), { textContent: '班' }));
                        const ts = marksOn(marks, ds);
                        if (big) ts.forEach(t => c.append(Object.assign(document.createElement('u'), { textContent: t })));
                        else if (ts.length) c.style.textDecoration = 'underline';
                    } else c.className = 'c';
                    g.append(c);
                });
                box.append(h, g); return box;
            };
            const A = $('#pArea');
            A.classList.toggle('small', !big);
            A.style.setProperty('--ph', land ? '188mm' : '275mm'); A.style.setProperty('--pc', land ? 4 : 3);
            $('#pgStyle').textContent = '@media print { @page { size: A4 ' + $('#por').value + '; margin: 10mm; } }';
            if (scope === 'grid') { const w = document.createElement('div'); w.className = 'yr'; for (let m = 1; m <= 12; m++) w.append(mk(m)); A.replaceChildren(w); }
            else if (scope === 'pages') A.replaceChildren(...Array.from({ length: 12 }, (_, i) => mk(i + 1)));
            else A.replaceChildren(mk(+$('#pmo').value));
            $('#pmo').disabled = scope !== 'month';
        }
        function refresh() { renderNext(); renderCal(); renderRuns(); renderData(); renderMarks(); renderPrint(); }

        $('#prev').onclick = () => { if (--cm < 1) { cm = 12; cy--; } renderCal(); };
        $('#nxt').onclick = () => { if (++cm > 12) { cm = 1; cy++; } renderCal(); };
        $('#ry').onchange = renderRuns; $('#oGo').onclick = renderOpt;
        $('#oCopy').onclick = () => Util.copyWithFeedback($('#oCopy'), lastText, () => prompt('請手動複製：', lastText));
        $('#cAdd').onclick = () => {
            const x = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: $('#cDate').value, kind: $('#cKind').value, name: $('#cName').value.trim() };
            if (!validCustom(x)) { alert('日期或名稱不正確（名稱最多 20 字）'); return; }
            if (custom.length >= MAX_CUSTOM) { alert('自訂資料已達上限 ' + MAX_CUSTOM + ' 筆，請先刪除'); return; }
            custom = custom.filter(z => z.d !== x.d); custom.push(x); saveCustom(); $('#cName').value = ''; refresh();
        };
        $('#cClear').onclick = () => { if (!custom.length || !confirm('清除全部自訂資料？無法復原。')) return; custom = []; saveCustom(); refresh(); };
        document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
            document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
            document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== b.dataset.t; });
            $('#pArea').hidden = b.dataset.t !== 'print';
            if (b.dataset.t === 'opt' && !$('#oRes').children.length) renderOpt();
        });
        $('#mAdd').onclick = () => {
            const x = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: $('#mDate').value, text: $('#mText').value.trim(), yearly: $('#mYear').checked };
            if (!validMark(x)) { alert('日期或文字不正確（文字 1–20 字）'); return; }
            if (marks.length >= MAX_MARKS) { alert('標記日已達上限 ' + MAX_MARKS + ' 筆，請先刪除'); return; }
            marks.push(x); saveMarks(); $('#mText').value = ''; renderMarks(); renderPrint();
        };
        $('#mClear').onclick = () => { if (!marks.length || !confirm('清除全部標記日？無法復原。')) return; marks = []; saveMarks(); renderMarks(); renderPrint(); };
        $('#pgo').onclick = () => { renderPrint(); window.print(); };
        ['#py', '#pscope', '#pmo', '#pws', '#por', '#phol', '#plun'].forEach(q => $(q).onchange = renderPrint);
        $('#pmo').replaceChildren(...Array.from({ length: 12 }, (_, i) => Object.assign(document.createElement('option'), { value: i + 1, textContent: (i + 1) + ' 月' })));
        $('#pmo').value = cm;
        $('#mDate').value = today;
        $('#cDate').value = today;
        fillYears(); refresh();
    </script>
</body>

</html>
