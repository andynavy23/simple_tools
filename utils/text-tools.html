<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="純文字整理工具：去重複行、排序、刪空行、全形半形轉換、大小寫，並能產生測試用假文；另有常用符號 / emoji 符號表，全部在本機處理。">
    <meta name="st-keys" content="symbols_recent">
    <meta property="og:title" content="純文字整理工具" />
    <meta property="og:description" content="去重複、排序、刪空行、全半形轉換與假文產生，全部在本機處理。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/text-tools.html" />
    <title>純文字整理工具</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 720px;
        }

        textarea {
            min-height: 260px;
            resize: vertical;
            font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
        }

        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            font-size: 14px;
            padding: 7px 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .cell {
            background: var(--fill);
            border-radius: 14px;
            padding: 10px 14px;
        }

        .cell small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .cell b {
            font-size: 20px;
            font-variant-numeric: tabular-nums;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tabs button {
            flex: 1;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .symgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
            gap: 6px;
            margin-top: 10px;
        }

        .sym {
            font-size: 22px;
            padding: 0;
            min-height: 46px;
            line-height: 1;
        }

        #symPicked {
            min-height: 70px;
            font-size: 20px;
        }

        .fw {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 6px;
            margin-top: 10px;
        }

        .fw button {
            padding: 4px;
            min-height: 44px;
            font-size: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>純文字整理工具</h1>
        <p class="sub">貼上文字，即時統計字數與閱讀時間；點按鈕處理，可連續套用；也能產生測試用的假文。所有處理都在你的瀏覽器內完成。</p>

        <div class="tabs" role="tablist">
            <button id="tabText" aria-pressed="true">文字整理</button>
            <button id="tabSym" aria-pressed="false">符號表</button>
        </div>

        <div id="paneText">
        <div class="card">
            <textarea id="text" placeholder="在這裡貼上文字…" aria-label="文字內容"></textarea>
            <div class="row">
                <span id="stat">0 行 ・ 0 字</span>
                <span><button id="undo">復原</button> <button class="primary" id="copy">複製</button></span>
            </div>
        </div>

        <div class="card">
            <h2>字數統計</h2>
            <div class="grid" id="counts"></div>
        </div>

        <div class="card">
            <div class="btns" id="ops"></div>
        </div>

        <div class="card">
            <h2>假文產生</h2>
            <p class="muted" style="font-size:13px;margin:0 0 10px">產生測試排版用的假文，會放進上方文字框（可以用「復原」回到原本的內容）。</p>
            <div class="btns">
                <select id="lang" aria-label="語言"><option value="zh">中文</option><option value="en">English（lorem ipsum）</option></select>
                <label class="muted" for="paras">段落</label><input id="paras" type="number" min="1" max="20" value="3" style="width:72px">
                <label class="muted" for="sents">每段句數</label><input id="sents" type="number" min="1" max="12" value="4" style="width:72px">
                <button class="primary" id="gen">產生</button>
            </div>
        </div>
        </div>

        <div id="paneSym" hidden>
            <div class="card">
                <input id="symQ" type="search" placeholder="搜尋符號（名稱或關鍵字，例如：箭頭、heart、貨幣）" aria-label="搜尋符號">
                <div class="chips" id="symCats"></div>
                <div id="symRecentBox" hidden>
                    <p class="muted" style="font-size:13px;margin:12px 0 0">最近使用</p>
                    <div class="symgrid" id="symRecent"></div>
                </div>
                <div class="symgrid" id="symGrid"></div>
                <p class="muted" id="symNone" style="display:none">找不到符合的符號</p>
            </div>
            <div class="card">
                <h2>已選</h2>
                <textarea id="symPicked" placeholder="點上面的符號，會一個個累積在這裡" aria-label="已選符號"></textarea>
                <div class="row"><span class="muted" id="symHint">點符號會複製該符號並加進這裡</span><span><button id="symClear">清除</button> <button class="primary" id="symCopy">複製已選</button></span></div>
            </div>
            <div class="card">
                <details>
                    <summary style="cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center">全形 ↔ 半形對照表</summary>
                    <p class="muted" style="font-size:13px;margin:6px 0 0">每格上為半形、下為全形（Unicode 全形 = 半形 + 0xFEE0；空白對應「　」）。點一格複製全形。</p>
                    <div class="fw" id="fwTable"></div>
                </details>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>純文字整理小工具：即時統計字數與閱讀時間，一鍵去重複行、排序、刪空行、全半形轉換、大小寫轉換，也能產生測試排版用的假文。另有「符號表」分頁，收錄常用符號與 emoji，可搜尋、點擊複製。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>整理名單、關鍵字清單，去掉重複與空行。</li>
        <li>寫報告或稿子，想知道字數與大概閱讀時間。</li>
        <li>設計排版時需要一段假文。</li>
        <li>打字時找不到的符號：箭頭、圈號數字、注音符號、貨幣、框線、表情符號。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>把文字貼進上方文字框，下方「字數統計」即時更新。</li>
        <li>點「去除重複行」、「排序 A→Z」、「全形 → 半形」等按鈕處理，可連續套用。</li>
        <li>做錯了按「復原」（最多回到前 50 步）；完成按「複製」。</li>
        <li>「假文產生」選語言、段落與每段句數，按「產生」會放進文字框。</li>
        <li>切到「符號表」分頁：點上方分類或在搜尋框輸入名稱 / 關鍵字（例如「箭頭」「heart」「貨幣」）；點符號會複製它並累積到「已選」框，最後按「複製已選」一次拿走。</li>
        <li>「最近使用」會記住你常點的符號；底部「全形 ↔ 半形對照表」可查全形字元，點一格複製全形。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貼上三行：pear、apple、pear
        按「去除重複行」→ pear、apple
        再按「排序 A→Z」→ apple、pear</div>
        <h3>小提醒</h3>
        <ul>
        <li>符號表的「最近使用」只存在這個瀏覽器；單點複製若被瀏覽器擋下，仍會加進「已選」框，可手動複製。</li>
        <li>假文會覆蓋文字框內容，可用「復原」找回。</li>
        <li>閱讀時間以中文約 400 字 / 分、英文約 230 字 / 分估算。</li>
        <li>文字只在本機處理，不會上傳。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // 每個操作：字串進、字串出
        const lines = (f) => (t) => f(t.split('\n')).join('\n');
        const cmp = (a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true });
        const OPS = {
            '去除重複行': lines(a => [...new Set(a)]),
            '排序 A→Z': lines(a => [...a].sort(cmp)),
            '排序 Z→A': lines(a => [...a].sort((x, y) => cmp(y, x))),
            '反轉行序': lines(a => [...a].reverse()),
            '刪除空白行': lines(a => a.filter(l => l.trim() !== '')),
            '去除行首尾空白': lines(a => a.map(l => l.trim())),
            '全形 → 半形': t => t.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' '),
            '半形 → 全形': t => t.replace(/[!-~]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(/ /g, '　'),
            '轉大寫': t => t.toUpperCase(),
            '轉小寫': t => t.toLowerCase(),
        };

        const CJK = /[㐀-䶿一-鿿豈-﫿]/g;
        const WORD = /\d+(?:[.,]\d+)+|[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g;     // 小數 / 千分位數字算一個字

        // 閱讀速度：中文約 400 字/分、英文約 230 字/分
        function count(text) {
            const cjk = (text.match(CJK) || []).length;
            const words = (text.match(WORD) || []).length;
            const lines = text === '' ? 0 : text.split(/\r?\n/).length;
            const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim()).length;
            const sentences = (text.match(/[^。！？!?.…\n]+[。！？!?.…]*/g) || []).filter(s => /[\p{L}\p{N}]/u.test(s)).length;
            return {
                chars: [...text].length,
                charsNoSpace: [...text.replace(/\s/g, '')].length,
                cjk, words, lines, paragraphs, sentences,
                readMinutes: cjk / 400 + words / 230,
            };
        }

        function fmtRead(min) {
            if (min <= 0) return '—';
            if (min < 1) return `${Math.max(1, Math.round(min * 60))} 秒`;
            const m = Math.floor(min), s = Math.round((min - m) * 60);
            return s ? `${m} 分 ${s} 秒` : `${m} 分`;
        }

        // 假文產生：中文用常見詞句片段隨機組合、英文用 lorem ipsum 字庫。rand(n) 回傳 [0, n) 的整數（預設用安全亂數）
        const ZH_PIECES = ['這是一段用來測試版面的文字', '設計師正在調整字體與行距', '請把這裡換成真正的內容', '清晨的陽光灑在安靜的街道上', '我們需要先確認需求再開始實作', '這個段落只是為了填滿畫面', '好的介面應該讓人一眼就看懂', '每一次修改都要保留紀錄', '週末的市集總是擠滿了人', '把複雜的事情拆成簡單的步驟', '字數與換行會影響閱讀的節奏', '咖啡的香氣讓整個下午變得緩慢', '測試資料不應該包含真實的個人資訊', '長長的句子可以用來檢查自動換行', '文字的重點在於清楚而不是華麗', '雨停之後空氣裡有泥土的味道', '版型確定以後再來細修每個細節', '請檢查標點符號與全形半形是否一致', '一個好的預設值能省下許多麻煩', '安排好優先順序比加班更有效率'];
        const EN_WORDS = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
        function lorem(lang, paragraphs, sentences, rand = Util.rnd) {
            const pick = (arr) => arr[rand(arr.length)];
            const sentence = () => {
                if (lang === 'en') {
                    const n = 6 + rand(9), w = Array.from({ length: n }, () => pick(EN_WORDS)); w[0] = w[0][0].toUpperCase() + w[0].slice(1);
                    return w.join(' ') + '.';
                }
                const n = 1 + rand(3); return Array.from({ length: n }, () => pick(ZH_PIECES)).join('，') + '。';
            };
            return Array.from({ length: paragraphs }, () => Array.from({ length: sentences }, sentence).join(lang === 'en' ? ' ' : '')).join('\n\n');
        }

        // ===== 符號表資料（純資料與函式）=====
        // 每項 [字元, 名稱與關鍵字]；分類 → 清單。字元在整張表中不重複
        const seq = (start, n, name) => Array.from({ length: n }, (_, i) => [String.fromCodePoint(start + i), name(i)]);
        const pairs = (str, names) => [...str].map((c, i) => [c, names[i]]);
        const HIRA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょ';
        const ROMA = 'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n ga gi gu ge go za ji zu ze zo da di du de do ba bi bu be bo pa pi pu pe po small-a small-i small-u small-e small-o small-tsu small-ya small-yu small-yo'.split(' ');
        const SYM_DATA = {
            '標點': pairs('，、。．；：？！…‥・·‧「」『』（）【】〔〕《》〈〉—～﹏※＊†‡§¶“”‘’‹›«»', '逗號 comma|頓號|句號|小數點 句點|分號|冒號|問號|驚嘆號|刪節號 省略號|雙點|日文中點|中點|中點 間隔號|引號 單引號|引號 直角引號|雙引號 引號|雙引號 引號|括號 全形括號|括號 全形括號|粗括號 方頭括號|粗括號 方頭括號|龜甲括號|龜甲括號|書名號 雙書名號|書名號 雙書名號|書名號 單書名號|書名號 單書名號|破折號 長橫線|波浪號 全形波浪|底線 波浪底線|參考號 米字號|星號 全形星號|劍號 腳註|雙劍號|章節號 section|段落號 paragraph|彎引號 雙引號|彎引號 雙引號|彎引號 單引號|彎引號 單引號|單角引號|單角引號|法文引號|法文引號'.split('|')),
            '箭頭': pairs('←↑→↓↔↕↖↗↘↙⇐⇑⇒⇓⇔➔➜➤➡⬅⬆⬇↩↪↺↻⟵⟶↦', '左 箭頭 left|上 箭頭 up|右 箭頭 right|下 箭頭 down|左右 雙向 箭頭|上下 雙向 箭頭|左上 箭頭|右上 箭頭|右下 箭頭|左下 箭頭|雙線 左 箭頭|雙線 上 箭頭|雙線 右 箭頭 推論|雙線 下 箭頭|雙線 左右 等價|粗 右 箭頭|波浪 右 箭頭|三角 右 箭頭|粗 右 箭頭 emoji|粗 左 箭頭 emoji|粗 上 箭頭 emoji|粗 下 箭頭 emoji|返回 轉彎 箭頭|轉彎 箭頭 右|逆時針 重新整理 箭頭|順時針 重新整理 箭頭|長 左 箭頭|長 右 箭頭|映射 箭頭'.split('|')),
            '數學': pairs('±×÷≠≈≡≤≥∞√∑∏∫∂∆∇π°∈∉∩∪⊂⊃∴∵⊕⊗∠⊥∥¼½¾²³¹⁰⁴‰', '正負 plus minus|乘 乘號 multiply|除 除號 divide|不等於 not equal|約等於 approx|恆等 全等 identical|小於等於 less equal|大於等於 greater equal|無限大 infinity|根號 square root|總和 sigma sum|連乘 product|積分 integral|偏微分 partial|增量 delta triangle|梯度 nabla|圓周率 pi|度 degree|千分比 per mille|屬於 element|不屬於|交集 intersection|聯集 union|子集 subset|超集 superset|所以 therefore|因為 because|圓加 xor|圓乘|角 angle|垂直 perpendicular|平行 parallel|四分之一 fraction|二分之一 half fraction|四分之三 fraction|上標 平方 square|上標 立方 cube|上標 一|上標 零|上標 四|千分號 percent'.split('|')),
            '貨幣': pairs('$¢£¥€₩₹₽₿฿₫₪＄￥₱₺¤₴₦', '美元 dollar|分 cent|英鎊 pound|日圓 人民幣 yen yuan|歐元 euro|韓元 won|印度盧比 rupee|俄羅斯盧布 ruble|比特幣 bitcoin|泰銖 baht|越南盾 dong|以色列 新謝克爾 shekel|全形 美元 dollar|全形 日圓 yen|菲律賓披索 peso|土耳其里拉 lira|通用貨幣符號 currency|烏克蘭 格里夫納|奈拉 naira'.split('|')).concat([['元', '新臺幣 元 NT'], ['圓', '圓 台幣']]),
            '單位': pairs('℃℉㎏㎎㎜㎝㎞㎡㎥㏄㎖ℓÅΩµ℅№℡㎳㎐', '攝氏 溫度 celsius|華氏 溫度 fahrenheit|公斤 kg|毫克 mg|公釐 毫米 mm|公分 厘米 cm|公里 km|平方公尺 m2 面積|立方公尺 m3 體積|立方公分 cc|毫升 ml|公升 liter|埃 angstrom|歐姆 ohm|微 micro mu|百分之 care of|編號 number no|電話 tel|毫秒 ms|赫茲 hz'.split('|')),
            '框線': pairs('─│┌┐└┘├┤┬┴┼═║╔╗╚╝╠╣╦╩╬▀▄█░▒▓', '橫線|直線|左上角|右上角|左下角|右下角|左 T|右 T|上 T|下 T|十字|雙橫線|雙直線|雙 左上角|雙 右上角|雙 左下角|雙 右下角|雙 左 T|雙 右 T|雙 上 T|雙 下 T|雙 十字|上半 方塊|下半 方塊|全 方塊|淺 陰影|中 陰影|深 陰影'.split('|')),
            '圖形': pairs('■□▲△▼▽◆◇○●◎★☆♠♥♦♣♪♫☀☁☂✓✔✗✘✦✿❀☎✉☺☻♀♂', '實心 方形|空心 方形|實心 三角 上|空心 三角 上|實心 三角 下|空心 三角 下|實心 菱形|空心 菱形|空心 圓|實心 圓|雙圈 靶心|實心 星 star|空心 星 star|黑桃 spade|愛心 紅心 heart|方塊 diamond|梅花 club|音符 music|雙音符 music|太陽 sun|雲 cloud|雨傘 umbrella|勾 check|粗勾 check|叉 cross|粗叉 cross|四角星 sparkle|花 flower|花 flower|電話 phone|信封 mail|笑臉 smile|黑 笑臉|女性 female|男性 male'.split('|')),
            '注音': pairs('ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ˙ˊˇˋ', 'b|p|m|f|d|t|n|l|g|k|h|j|q|x|zh|ch|sh|r|z|c|s|i yi|u wu|v yu|a|o|e|ê|ai|ei|ao|ou|an|en|ang|eng|er|輕聲 neutral tone|二聲 second tone|三聲 third tone|四聲 fourth tone'.split('|')).map(([c, n]) => [c, '注音符號 ' + n]),
            '圈號數字': [...seq(0x2460, 20, i => `${i + 1} 圈號 圓圈數字`), ...seq(0x2776, 10, i => `${i + 1} 黑底 圈號 實心圓圈數字`), ...seq(0x3220, 10, i => `${'一二三四五六七八九十'[i]} 括號 中文數字`)],
            '羅馬數字': [...seq(0x2160, 12, i => `${i + 1} 大寫 羅馬數字 roman`), ...seq(0x2170, 12, i => `${i + 1} 小寫 羅馬數字 roman`)],
            '日文假名': [...[...HIRA].map((c, i) => [c, '平假名 hiragana ' + ROMA[i]]), ...[...HIRA].map((c, i) => [String.fromCodePoint(c.codePointAt(0) + 0x60), '片假名 katakana ' + ROMA[i]]), ['ー', '長音 片假名 katakana']],
            '表情': pairs('😀😁😂🤣😊😍😘😎🤔😅😭😡😱😴🥰🥺😇🙃😉🤗😢😤🤯🥳', '開心 笑 smile|大笑 grin|笑哭 joy|笑翻 rofl|微笑 blush|愛心眼 love|飛吻 kiss|墨鏡 cool|思考 thinking|苦笑 sweat|大哭 cry|生氣 angry|驚嚇 scream|睡覺 sleep|喜愛 loved|懇求 pleading|天使 angel|倒臉 upside down|眨眼 wink|擁抱 hug|流淚 sad|哼 huff|爆炸頭 mind blown|派對 party').concat(),
            '手勢愛心': pairs('👍👎👏🙌🙏💪👌✌👋🤝❤💔💙💚💛💜🔥✨💯🎉', '讚 good thumbs up|爛 bad thumbs down|鼓掌 clap|舉手 歡呼 raise hands|祈禱 感謝 pray please|肌肉 強 muscle|OK 好 ok|勝利 耶 victory|揮手 hello wave|握手 handshake|紅心 愛 love heart|心碎 broken heart|藍心 heart|綠心 heart|黃心 heart|紫心 heart|火 熱門 fire|閃亮 sparkles|一百分 hundred|慶祝 tada party'.split('|')),
            '動物': pairs('🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🐢🐟🐬🦋', '狗 dog|貓 cat|老鼠 mouse|倉鼠 hamster|兔子 rabbit|狐狸 fox|熊 bear|熊貓 panda|無尾熊 koala|老虎 tiger|獅子 lion|牛 cow|豬 pig|青蛙 frog|猴子 monkey|雞 chicken|企鵝 penguin|鳥 bird|烏龜 turtle|魚 fish|海豚 dolphin|蝴蝶 butterfly'.split('|')),
            '食物': pairs('🍎🍌🍇🍓🍉🍊🍍🥑🍞🧀🍔🍟🍕🌭🍜🍣🍙🍰🍩🍪☕🍺🍵🧋', '蘋果 apple|香蕉 banana|葡萄 grape|草莓 strawberry|西瓜 watermelon|橘子 orange|鳳梨 pineapple|酪梨 avocado|麵包 bread|起司 cheese|漢堡 burger|薯條 fries|披薩 pizza|熱狗 hotdog|拉麵 麵 noodle|壽司 sushi|飯糰 onigiri rice|蛋糕 cake|甜甜圈 donut|餅乾 cookie|咖啡 coffee|啤酒 beer|茶 tea|珍珠奶茶 bubble tea boba'.split('|')),
            '生活': pairs('🏠🚗✈🚆🚲📱💻📷🎁📚⏰💡🔑💰🛒🎵🎮⚽🌈🌙⛅🌸', '家 home|汽車 car|飛機 plane|火車 train|腳踏車 bike|手機 phone|電腦 computer|相機 camera|禮物 gift|書 book|鬧鐘 clock alarm|燈泡 idea light|鑰匙 key|錢 money|購物車 cart shopping|音樂 music|遊戲 game|足球 soccer ball|彩虹 rainbow|月亮 moon|多雲 cloud sun|櫻花 sakura'.split('|')),
        };
        const SYMBOLS = Object.entries(SYM_DATA).flatMap(([g, arr]) => arr.map(([c, n]) => ({ c, n, g })));
        const SYM_CATS = Object.keys(SYM_DATA);
        // 搜尋：空白分隔的關鍵字全部命中（字元 / 名稱 / 分類，不分大小寫）；cat 為空字串表示不限分類
        function searchSymbols(q, cat = '', list = SYMBOLS) {
            const ks = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
            return list.filter(x => (!cat || x.g === cat) && ks.every(k => (x.c + ' ' + x.n + ' ' + x.g).toLowerCase().includes(k)));
        }
        // 最近使用：新的在最前面、不重複、最多 max 個
        const addRecent = (list, c, max = 24) => [c, ...list.filter(x => x !== c)].slice(0, max);
        // 讀取驗證：只留字串且仍存在於符號表的項目
        const normRecent = (raw) => Array.isArray(raw) ? raw.filter(c => typeof c === 'string' && SYMBOLS.some(x => x.c === c)).slice(0, 24) : [];
        // 全形 ↔ 半形對照：! ~ 與空白
        const fwTable = () => [{ h: ' ', f: '　' }, ...Array.from({ length: 94 }, (_, i) => ({ h: String.fromCharCode(0x21 + i), f: String.fromCharCode(0x21 + i + 0xFEE0) }))];

        const $ = (s) => document.querySelector(s);
        const ta = $('#text');
        let history = [];

        const LABELS = [['cjk', '中文字'], ['words', '英文單字 / 數字'], ['chars', '全部字元'], ['charsNoSpace', '字元（不含空白）'], ['lines', '行數'], ['paragraphs', '段落'], ['sentences', '句子']];
        function stat() {
            const c = count(ta.value);
            $('#stat').textContent = `${c.lines} 行 ・ ${c.chars} 字`;
            $('#counts').replaceChildren(...[...LABELS.map(([k, name]) => [name, c[k].toLocaleString('zh-TW')]), ['預估閱讀時間', fmtRead(c.readMinutes)]].map(([name, v]) => {
                const d = document.createElement('div'); d.className = 'cell';
                const s = document.createElement('small'), b = document.createElement('b');
                s.textContent = name; b.textContent = v; d.append(s, b);
                return d;
            }));
        }

        for (const [name, fn] of Object.entries(OPS)) {
            const b = document.createElement('button');
            b.textContent = name;
            b.onclick = () => {
                history.push(ta.value);
                if (history.length > 50) history.shift();
                ta.value = fn(ta.value.replace(/\r\n/g, '\n'));
                stat();
            };
            $('#ops').append(b);
        }

        $('#gen').onclick = () => {
            const clamp = (id, lo, hi, def) => Math.min(hi, Math.max(lo, parseInt($(id).value, 10) || def));
            history.push(ta.value); if (history.length > 50) history.shift();
            ta.value = lorem($('#lang').value, clamp('#paras', 1, 20, 3), clamp('#sents', 1, 12, 4)); stat();
        };
        $('#undo').onclick = () => { if (history.length) { ta.value = history.pop(); stat(); } };
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), ta.value, () => ta.select());
        ta.oninput = stat;
        stat();

        // ===== 符號表分頁 =====
        let recent = normRecent(Util.store.get('symbols_recent', [])), cat = SYM_CATS[0];
        function showTab(t) {
            $('#paneText').hidden = t !== 'text'; $('#paneSym').hidden = t !== 'sym';
            $('#tabText').setAttribute('aria-pressed', t === 'text'); $('#tabSym').setAttribute('aria-pressed', t === 'sym');
        }
        $('#tabText').onclick = () => showTab('text'); $('#tabSym').onclick = () => showTab('sym');
        const symBtn = (c, title) => {
            const b = document.createElement('button'); b.className = 'sym'; b.textContent = c; b.title = title; b.setAttribute('aria-label', title || c);
            b.onclick = () => {
                const p = $('#symPicked'); p.value += c;
                recent = addRecent(recent, c); Util.store.set('symbols_recent', recent);
                Util.copyText(c); symRender(false);
            };
            return b;
        };
        function symRender(full = true) {
            const q = $('#symQ').value, hits = searchSymbols(q, cat);
            if (full) {
                $('#symCats').replaceChildren(...[['', '全部'], ...SYM_CATS.map(g => [g, g])].map(([v, t]) => {
                    const b = document.createElement('button'); b.textContent = t; b.dataset.cat = v; b.setAttribute('aria-pressed', v === cat);
                    b.onclick = () => { cat = v; symRender(); }; return b;
                }));
                $('#symGrid').replaceChildren(...hits.map(x => symBtn(x.c, x.g + ' ' + x.n)));
                $('#symNone').style.display = hits.length ? 'none' : '';
            }
            $('#symRecentBox').hidden = !recent.length;
            $('#symRecent').replaceChildren(...recent.map(c => symBtn(c, '最近使用 ' + c)));
        }
        $('#symQ').oninput = () => symRender();
        $('#symClear').onclick = () => { $('#symPicked').value = ''; };
        $('#symCopy').onclick = () => Util.copyWithFeedback($('#symCopy'), $('#symPicked').value, () => $('#symPicked').select());
        $('#fwTable').replaceChildren(...fwTable().map(x => {
            const b = document.createElement('button'); b.className = 'fw-c'; b.style.whiteSpace = 'pre';
            b.textContent = (x.h === ' ' ? '␣' : x.h) + '\n' + x.f; b.title = '全形 ' + (x.h === ' ' ? '空白' : x.h);
            b.onclick = () => { $('#symPicked').value += x.f; Util.copyText(x.f); }; return b;
        }));
        symRender();
    </script>
</body>
