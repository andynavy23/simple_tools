    <template id="help">
        <h3>這是什麼</h3>
        <p>Excel 常用函式的速查手冊：79 個函式，每個都有語法、白話說明、附範例資料表與計算結果的範例、常見錯誤原因、Google 試算表的差異，以及需要哪個 Excel 版本。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>知道想做什麼（查表、條件加總、去重複）但不知道該用哪個函式</li>
        <li>忘了某個函式的參數順序，想看一個可以照抄的範例</li>
        <li>公式出現 #N/A、#VALUE! 等錯誤，想知道常見原因</li>
        <li>要和用 Google 試算表或舊版 Excel 的同事共用檔案，確認函式能不能用</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在「我想做…」點一個目標，再回答追問，就會列出建議的公式；點公式名稱直接跳到說明。</li>
        <li>或在「函式清單」的搜尋框輸入名稱、用途（例如「去空格」、「排名」、「vlookup」），也可用分類按鈕縮小範圍。</li>
        <li>點開任一函式：看語法、白話說明、範例資料表、公式與結果、常見錯誤、Google 試算表差異與版本需求。</li>
        <li>按範例公式旁的「複製公式」，貼到自己的儲存格再改成自己的範圍。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">在「我想做…」選「查表比對」→「要找的值在表格最左欄，回傳右邊某一欄」→ 推薦 VLOOKUP 與 XLOOKUP。
點 VLOOKUP，範例資料表是編號 / 品名 / 單價，公式 =VLOOKUP("B03",A2:C5,3,FALSE) → 結果 350。
搜尋框輸入「月底」→ 找到 EOMONTH，範例 =EOMONTH(DATE(2024,2,10),0) → 2024-02-29。</div>
        <h3>小提醒</h3>
        <ul>
        <li>範例的計算結果都經過程式驗證；範例資料表從 A1 開始，欄名在第 1 列，所以資料從第 2 列算起。</li>
        <li>臺灣的國定假日與補班日請自己列成清單，丟給 NETWORKDAYS / WORKDAY 的「假日範圍」。</li>
        <li>標示「Excel 2021 以上」的新函式（XLOOKUP、FILTER、UNIQUE、SORT、SEQUENCE、LET）在 Excel 2019 以前會出現 #NAME?；Google 試算表的差異都寫在各函式裡。</li>
        <li>本頁的版本與 Google 試算表差異整理自一般公開說明，微軟與 Google 日後可能調整，重要檔案請以實際軟體為準。</li>
        <li>這個頁面不儲存任何資料，也不連線。</li>
        </ul>

            // ===== 邏輯與錯誤處理 =====
            X('IF', 'logic', 'IF(條件, 成立時, [不成立時])', '依條件回傳不同結果。可以一層套一層，但超過 3 層建議改用 IFS。', [T_SCORE, '=IF(A6>=60,"及格","不及格")', '及格', '', '60 >= 60 成立，所以是「及格」。'], [['#VALUE!', '條件算出來不是 TRUE / FALSE（例如文字）'], ['FALSE', '省略「不成立時」且條件不成立，會顯示 FALSE']], SAME, V_ALL, '如果 判斷 條件 if 及格 分支'),

            X('NOT', 'logic', 'NOT(條件)', '把 TRUE 變 FALSE、FALSE 變 TRUE。', [T_SCORE, '=NOT(A2>90)', true, '', '85 > 90 是 FALSE，反過來就是 TRUE。'], [['#VALUE!', '參數不是邏輯值']], SAME, V_ALL, '不是 反向 相反 not'),
            X('SWITCH', 'logic', 'SWITCH(要比對的值, 值1, 結果1, [值2, 結果2], …, [都不是時])', '拿一個值對照多個選項，比一長串 IF 好讀。最後一個單獨的參數是預設值。', [[['等級'], ['B']], '=SWITCH(A2,"A","優","B","良","C","可","未知")', '良', '', '只能比對「相等」；要比大小請用 IFS。'], [['#N/A', '沒有任何值符合又沒給預設值'], ['#NAME?', 'Excel 2016 以前的買斷版沒有這個函式']], SAME, V19, '對照 代碼轉換 選項 switch 轉換'),

            X('HLOOKUP', 'lookup', 'HLOOKUP(查閱值, 範圍, 列號, [近似比對])', '資料是「橫向」排列時使用：在範圍最上面一列找查閱值，回傳同一欄第 N 列。', [[['項目', '一月', '二月', '三月'], ['營收', 120, 150, 180], ['成本', 80, 90, 100]], '=HLOOKUP("二月",A1:D3,3,FALSE)', 90, '', '在第 1 列找到「二月」，回傳範圍第 3 列（成本）= 90。'], [['#N/A', '找不到查閱值'], ['#REF!', '列號大於範圍的列數']], SAME, V_ALL, '橫向查表 水平查閱 hlookup 橫的'),

            X('MATCH', 'lookup', 'MATCH(查閱值, 範圍, [比對型態])', '回傳查閱值在範圍中是「第幾個」。比對型態填 0 才是精確比對。', [T_PROD, '=MATCH("B03",A2:A5,0)', 3, '', '回傳位置 3，再交給 INDEX 取值。'], [['#N/A', '找不到（多半是空格、文字 vs 數字）'], ['答案錯誤', '省略第三個參數是 1（近似、要由小到大排序），多半要填 0']], SAME, V_ALL, '位置 第幾個 比對 match 找位置'),
            X('INDEXMATCH', 'lookup', 'INDEX(傳回範圍, MATCH(查閱值, 查閱範圍, 0))', 'INDEX + MATCH 組合：可往左查、不怕插入欄、舊版 Excel 也能用。', [T_PROD, '=INDEX(C2:C5,MATCH("訂書機",B2:B5,0))', 350, '', 'MATCH 找出「訂書機」是品名欄的第 3 個，INDEX 取單價欄第 3 個 = 350。查閱欄在傳回欄右邊也沒問題。'], [['#N/A', 'MATCH 找不到查閱值'], ['#REF!', 'INDEX 的列號超出傳回範圍（兩個範圍大小要相同）']], SAME, V_ALL, '查表 往左查 組合 index match indexmatch 反向查詢 比vlookup靈活'),
            X('CHOOSE', 'lookup', 'CHOOSE(第幾個, 值1, 值2, …)', '依數字挑選第幾個值，常用來把星期數字轉成名稱。', [null, '=CHOOSE(WEEKDAY(DATE(2024,3,15),2),"週一","週二","週三","週四","週五","週六","週日")', '週五', '', '2024-03-15 的 WEEKDAY(…,2) 是 5，挑第 5 個「週五」。'], [['#VALUE!', '第一個參數小於 1 或大於選項個數']], SAME, V_ALL, '挑選 星期轉換 選項 choose 對應'),

        const XL_BY_ID = Object.fromEntries(XL.map(x => [x.id, x]));

        function searchFns(q, cat = '') {
            const toks = String(q ?? '').toLowerCase().split(/\s+/).filter(Boolean);
            return XL.map((x, i) => {
                if (cat && x.cat !== cat) return null;
                const id = x.id.toLowerCase(), kw = x.kw.toLowerCase(), desc = (x.desc + x.syn).toLowerCase(); let score = 0;
                for (const t of toks) {
                    const s = id === t ? 100 : id.startsWith(t) ? 60 : id.includes(t) ? 40 : kw.includes(t) ? 30 : XL_CATS[x.cat].includes(t) ? 15 : desc.includes(t) ? 10 : 0;
                    if (!s) return null; score += s;
                }
                return { x, score, i };
            }).filter(Boolean).sort((a, b) => b.score - a.score || a.i - b.i).map(r => r.x);
        }

            { id: 'error', label: '錯誤處理與判斷', q: '你想怎麼處理？', opts: [
                { label: '出現任何錯誤都改顯示別的內容', fns: ['IFERROR'], tip: '會把所有錯誤蓋掉，包括寫錯公式；除錯時先拿掉。' },
                { label: '只處理「查無資料」（#N/A）', fns: ['IFNA'], tip: '其他錯誤仍會顯示，更容易發現公式寫錯。' },
                { label: '先檢查資料再計算', fns: ['IF', 'ISNUMBER', 'ISBLANK'], tip: '例如 =IF(ISBLANK(A2),"",A2*2) 空白時不計算。' },
                { label: '依數值分級或對照多個選項', fns: ['IFS', 'SWITCH'], tip: '區間分級用 IFS，固定代碼對照用 SWITCH。' }] },
        ];
        // 問答結果：goal id + 選項索引 → { opt, fns: 公式資料陣列 }；找不到回傳 null
        function guideFor(goalId, optIdx) {
            const g = GUIDE.find(x => x.id === goalId), o = g && g.opts[optIdx];
            return o ? { opt: o, fns: o.fns.map(id => XL_BY_ID[id]) } : null;
        }
        // 範例的顯示文字（純量 → 字串；溢出的二維結果 → 字串二維陣列）
        const exShow = (r) => isArr(r) ? r.map(row => row.map(toStr)) : toStr(r);
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, attrs); e.append(...kids); return e; };
        const colName = (i) => String.fromCharCode(65 + i);
        const fnName = (x) => x.id === 'INDEXMATCH' ? 'INDEX+MATCH' : x.id;
        function sheet(tbl) {
            const w = Math.max(...tbl.map(r => r.length));
            return el('div', { className: 'tblwrap' }, [el('table', { className: 'sheet' }, [
                el('tr', {}, [el('th'), ...Array.from({ length: w }, (_, i) => el('th', { textContent: colName(i) }))]),
                ...tbl.map((r, i) => el('tr', {}, [el('th', { textContent: i + 1 }), ...Array.from({ length: w }, (_, j) => el('td', { textContent: toStr(r[j]) }))]))])]);
        }
        function detail(x, open) {
            const sec = (h, node) => el('div', {}, [el('h4', { textContent: h }), node]);
            const copy = el('button', { type: 'button', className: 'sm', textContent: '複製公式', onclick() { Util.copyWithFeedback(this, x.ex.f); } });
            const res = isArr(x.ex.r) ? el('div', {}, [el('div', { textContent: '結果（會自動溢出到下方儲存格）：' }), sheet(x.ex.r)]) : el('div', { className: 'res' }, ['結果：', el('b', { textContent: toStr(x.ex.r) })]);
            return el('details', { className: 'fn', open, id: 'fn-' + x.id }, [
                el('summary', {}, [el('b', { textContent: fnName(x) }), el('span', { textContent: XL_CATS[x.cat] + '　' + x.desc.split('。')[0] })]),
                el('div', { className: 'body' }, [
                    sec('語法', el('code', { className: 'code', textContent: x.syn })), sec('白話說明', el('div', { textContent: x.desc })),
                    sec('範例', el('div', { style: 'display:grid;gap:8px' }, [...(x.ex.tbl ? [sheet(x.ex.tbl)] : []), el('div', { className: 'row' }, [el('code', { className: 'code', style: 'flex:1 1 220px', textContent: x.ex.f }), copy]), res, ...(x.ex.note ? [el('div', { className: 'tip', textContent: x.ex.note })] : [])])),
                    sec('常見錯誤', el('ul', { className: 'errs' }, x.errs.map(([c, w]) => el('li', {}, [el('b', { textContent: c }), '：' + w])))),
                    sec('Google 試算表', el('div', { className: 'meta', textContent: x.gs })), sec('Excel 版本需求', el('div', { className: 'meta', textContent: x.ver }))])]);
        }
        let cat = '', openId = '';
        function renderList() {
            const rows = searchFns($('#q').value, cat);
            $('#count').textContent = `${rows.length} 個函式`;
            $('#list').replaceChildren(...(rows.length ? rows.map(x => detail(x, x.id === openId || rows.length === 1)) : [el('div', { className: 'empty', textContent: '找不到符合的函式，換個關鍵字試試（例如用途：去空格、排名、月底）。' })]));
            $('#cats').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === cat)));
        }
        $('#cats').replaceChildren(...[['', '全部'], ...Object.entries(XL_CATS)].map(([k, v]) => { const b = el('button', { type: 'button', textContent: v, onclick() { cat = k; openId = ''; renderList(); } }); b.dataset.c = k; return b; }));
        $('#q').oninput = () => { openId = ''; renderList(); };
        function showFn(id) { cat = ''; $('#q').value = ''; openId = id; renderList(); const n = $('#fn-' + id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

        let goal = '';
        function renderGuide(optIdx = -1) {
            $('#goals').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === goal)));
            const g = GUIDE.find(x => x.id === goal);
            $('#gq').textContent = g ? g.q : '先選一個目標，我幫你找公式。';
            $('#gopts').replaceChildren(...(g ? g.opts.map((o, i) => { const b = el('button', { type: 'button', textContent: o.label, onclick() { renderGuide(i); } }); b.setAttribute('aria-pressed', String(i === optIdx)); return b; }) : []));
            const r = g && optIdx >= 0 ? guideFor(goal, optIdx) : null;
            $('#gres').replaceChildren(...(r ? [el('div', { className: 'tip', textContent: r.opt.tip }), el('div', { className: 'chips' }, r.fns.map(f => el('button', { type: 'button', className: 'primary', textContent: fnName(f) + ' →', onclick() { showFn(f.id); } })))] : []));
        }
        $('#goals').replaceChildren(...GUIDE.map(g => { const b = el('button', { type: 'button', textContent: g.label, onclick() { goal = g.id; renderGuide(); } }); b.dataset.g = g.id; return b; }));
        renderGuide(); renderList();
    </script>
</body>

</html>
