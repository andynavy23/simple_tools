        <h1>外語速查</h1>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把學日文、韓文、英文與出國旅行時常查的東西收在一頁：日文數字 / 日期 / 時間 / 助數詞的唸法與特殊變音、日文敬語（尊敬語、謙讓語、丁寧語）動詞對照與情境例句、韓文子音母音與兩套數字的用法、英文字根字首字尾（約 90 個）、日 / 韓 / 英 / 泰旅行短句。另有：日文問候 / 助詞 / 句型 / 輸入法技巧，韓文助詞與敬語等級，英文句型、數字年份唸法、日期時間與 in / on / at、自我介紹、面試、電話會議、旅遊對話、商業 Email、履歷動詞、學術連接詞、台式英文、自然發音，法語 / 越南語 / 印尼語 / 台語 / 客語基礎、多語自我介紹，中文標點與公文用語。每個主題是一張可展開的卡片。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>忘了日文 4 月、7 點、300 怎麼唸，或 3 個人、6 支筆該用哪個說法。</li>
        <li>寫信 / 打工 / 考試時，要確認「吃」的尊敬與謙讓語。</li>
        <li>出國前想快速複習問路、點餐、結帳的短句，或在現場把句子秀給對方看。</li>
        <li>背英文單字時想拆字根字首字尾猜意思。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用上方分類鈕縮小範圍，或在搜尋欄輸入（可多個詞，空白分隔，須全部符合）。</li>
        <li>點卡片標題展開；每列右邊「複製」帶走該列的外語文字（敬語動詞卡會一併複製對照）。</li>
        <li>列右邊出現「朗讀」代表這台裝置有該語言的語音可用；沒有語音就不會顯示。朗讀品質依系統語音而定，數字與特殊唸法請以標示的讀音為準。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋 食べる → 敬語動詞卡：召し上がる（尊敬）／ いただく（謙讓）
搜尋 4 月 → 日期卡：しがつ（不是 よんがつ）
搜尋 pre → 字首：pre- 之前，例 preview、predict
搜尋 廁所 → 日 / 韓 / 英 / 泰各一句「廁所在哪裡」</div>
        <h3>小提醒</h3>
        <ul>
        <li>內容是個人整理的精簡參考，羅馬拼音是簡化標示、不等於標準發音；泰語聲調沒有標示。正式用途（考試、公文、契約）請以教材與官方資料為準，旅行短句建議出發前請母語者再確認。</li>
        <li>敬語要看對象與場合，例句是常見用法而非唯一說法。</li>
        <li>台語、客語各地腔調與用字略有差異，只收常見說法（客語不標讀音）；公文用語是一般慣例，正式用途請依機關的文書處理手冊。越南語聲調符號不可省略。</li>
        <li>不儲存任何資料，也不會連線。</li>
        </ul>

            T('trip-en-restaurant', '旅行會話', '旅遊英文：餐廳', '旅行 會話 英文 餐廳 點餐 訂位 菜單 過敏 結帳 小費 restaurant order menu 吃飯', [

            T('trip-en-directions', '旅行會話', '旅遊英文：問路與交通', '旅行 會話 英文 問路 路線 交通 地鐵 公車 計程車 directions way subway bus 怎麼走', [
                'Excuse me, how do I get to the train station? ~~ 請問怎麼去火車站？',

                'Can I walk there? ~~ 可以走路到嗎？',

        const parseRow = (s) => { const i = s.indexOf(' ~~ '); return i < 0 ? { text: s.trim(), desc: '' } : { text: s.slice(0, i).trim(), desc: s.slice(i + 4).trim() }; };
        // 朗讀用文字：「・」前的第一個說法
        const speakText = (text) => text.split('・')[0].trim();
        // 搜尋：空白分隔的詞須全部符合；標題 / 關鍵字 / 分類符合 → 整張卡，否則只列符合的列
        function searchTopics(topics, q, cat = '') {
            const ws = String(q || '').toLowerCase().split(/\s+/).filter(Boolean), out = [];
            for (const t of topics) {
                if (cat && t.cat !== cat) continue;
                const rows = t.rows.map((x, i) => ({ ...parseRow(x), i })), head = (t.title + ' ' + t.kw + ' ' + t.cat).toLowerCase();
                if (!ws.length) { out.push({ t, rows, byRows: false }); continue; }
                const lo = rows.map(r => (r.text + ' ' + r.desc).toLowerCase());
                const all = head + ' ' + lo.join(' ');
                if (!ws.every(w => all.includes(w))) continue;
                if (ws.every(w => head.includes(w))) { out.push({ t, rows, byRows: false }); continue; }
                const hit = rows.filter((r, i) => ws.every(w => lo[i].includes(w) || head.includes(w)));
                out.push({ t, rows: hit.length ? hit : rows, byRows: true });
            }
            return out;
        }
        // 該列的朗讀語言：langs（逐列）優先，否則整張卡的 lang
        const rowLang = (t, i) => (t.langs && t.langs[i]) || t.lang || '';
        // 資料完整性：回傳問題清單（空陣列 = 沒問題）
        function checkData(topics, cats) {
            const bad = [], seen = new Set();
            for (const t of topics) {
                if (!t.id || seen.has(t.id)) bad.push('id 缺少或重複：' + t.id);
                seen.add(t.id);
                if (!t.title) bad.push('缺標題：' + t.id);
                if (!cats.includes(t.cat)) bad.push('分類不存在：' + t.id);
                if (!t.rows || !t.rows.length) bad.push('沒有內容：' + t.id);
                if (typeof t.kw !== 'string' || !t.kw.trim()) bad.push('缺關鍵字：' + t.id);
                if (t.langs && t.langs.length !== (t.rows || []).length) bad.push('langs 與列數不符：' + t.id);
                for (const s of t.rows || []) { const r = parseRow(s); if (!r.text) bad.push('空白列：' + t.id); }
            }
            return bad;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        const hasVoice = (lang) => { try { const p = lang.slice(0, 2).toLowerCase(); return speechSynthesis.getVoices().some(v => v.lang.toLowerCase().replace('_', '-').startsWith(p)); } catch (e) { return false; } };
        let cat = '';
        function render() {
            const q = $('#q').value, res = searchTopics(TOPICS, q, cat);
            $('#count').textContent = `${res.length} 個主題`;
            $('#list').replaceChildren(...res.map(({ t, rows, byRows }) => {
                const d = el('details', 't'); d.dataset.id = t.id;
                d.open = byRows || (!!q.trim() && res.length <= 3);
                const sm = el('summary'); sm.append(el('span', 'n', t.title), el('span', 'c', `${t.cat} · ${rows.length} 列`));
                d.append(sm);
                if (t.note) d.append(el('p', 'tn', t.note));
                for (const r of rows) {
                    const lg = rowLang(t, r.i), talk = lg && hasVoice(lg);
                    const ln = el('div', 'ln'), tx = el('div', 'tx');
                    tx.append(el('div', 'w', r.text), el('div', 'ds', r.desc));
                    ln.append(tx);
                    const cp = el('button', 'sm', '複製'); cp.onclick = () => copyWithFeedback(cp, t.copyAll ? `${r.text}　${r.desc}` : r.text);
                    ln.append(cp);
                    if (talk) { const sp = el('button', 'sm', '朗讀'); sp.onclick = () => speak(speakText(r.text), { lang: lg, rate: 0.9 }); ln.append(sp); }
                    d.append(ln);
                }
                return d;
            }));
            if (!res.length) $('#list').append(el('p', 'muted', '沒有符合的主題'));
        }
        const bar = $('#cats');
        for (const c of ['', ...CATS]) { const b = el('button', 'sm', c || '全部'); b.dataset.c = c; b.setAttribute('aria-pressed', c === ''); bar.append(b); }

        $('#q').oninput = render;
        try { speechSynthesis.addEventListener('voiceschanged', render); } catch (e) { }
        render();
    </script>
