<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="計算機：直接輸入算式（括號、百分比、次方、階乘、三角函數、對數），即時顯示結果並保留歷史紀錄。">
    <meta property="og:title" content="計算機" />
    <meta property="og:description" content="輸入算式即時計算，有歷史紀錄與常用函數。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/calculator.html" />
    <meta name="st-keys" content="calc_history,calc_angle">
    <title>計算機</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 440px;
        }

        #expr {
            width: 100%;
            font-size: 24px;
            padding: 12px 14px;
            font-variant-numeric: tabular-nums;
        }

        #result {
            text-align: right;
            font-size: 40px;
            font-weight: 700;
            min-height: 1.3em;
            margin: 8px 4px 2px;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
        }

        #result.err {
            font-size: 16px;
            color: var(--bad);
            font-weight: 400;
            padding-top: 14px;
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .pad button {
            border-radius: 14px;
            padding: 13px 0;
            font-size: 18px;
        }

        .pad button.op {
            background: color-mix(in srgb, var(--blue) 18%, var(--fill));
        }

        .pad button.eq {
            background: var(--primary-bg);
            color: var(--on-blue);
        }

        .bar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .h {
            cursor: pointer;
        }

        .h small {
            color: var(--muted);
            display: block;
            word-break: break-all;
        }

        .h b {
            font-variant-numeric: tabular-nums;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>計算機</h1>
        <p class="sub">直接輸入算式，Enter 記入歷史。支援 + − × ÷ ^ ( ) % ! 與 sqrt、sin、cos、tan、ln、log、abs…，<b>ans</b> 代表上一個結果。</p>

        <div class="card">
            <input id="expr" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例如：2(3+4)^2 / 7" aria-label="算式">
            <div id="result" aria-live="polite"></div>
            <div class="pad" id="pad"></div>
            <div class="bar"><button class="sm" id="angle" aria-pressed="true">角度：度</button><span class="muted">sin / cos / tan 的單位</span></div>
        </div>

        <div class="card">
            <h2>歷史 <button class="sm" id="clearH" style="float:right">清除</button></h2>
            <div id="hist"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>輸入整條算式的計算機，支援括號、次方、階乘、百分比與常用函數，不必一步一步按。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>算含括號的複合算式，想一次看到結果</li>
        <li>需要 sqrt、sin、log 等函數時</li>
        <li>想回頭翻剛剛算過什麼</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在輸入框直接打算式，或用下方按鍵盤；打字時就會即時預覽結果</li>
        <li>按「=」或 <kbd>Enter</kbd> 把這筆記入歷史</li>
        <li><b>ans</b> 代表上一個結果；「C」清除、「⌫」刪一個字</li>
        <li>三角函數的單位用「角度：度 / 弧度」切換</li>
        <li>點歷史裡的一筆，會把結果放回輸入框繼續算</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">輸入 <b>2(3+4)^2 / 7</b> 得到 <b>14</b>（2×49÷7）。<br>輸入 <b>sin(30)</b>（單位為度）得到 <b>0.5</b>。</div>
        <h3>小提醒</h3>
        <ul>
        <li>支援 sqrt、abs、ln、log、sin、cos、tan、asin、acos、atan、floor、ceil、round、常數 pi 與 e</li>
        <li>函數後面一定要接括號，例如 sqrt(16)</li>
        <li>手機按螢幕按鍵不會叫出系統鍵盤；要打英文函數時點輸入框即可</li>
        <li>最多保留 30 筆歷史，只存在你的瀏覽器</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store } = Util;

        // --- pure ---
        // 遞迴下降解析器，不使用 eval。優先順序（低 → 高）：+ −；× ÷（含隱含乘法）；一元正負號；^（右結合）；! %（後綴）
        const FUNCS = {
            sqrt: (x) => { if (x < 0) throw new Error('負數不能開平方根'); return Math.sqrt(x); }, abs: Math.abs, floor: Math.floor, ceil: Math.ceil, round: Math.round, exp: Math.exp,
            ln: (x) => { if (x <= 0) throw new Error('ln 的輸入必須大於 0'); return Math.log(x); }, log: (x) => { if (x <= 0) throw new Error('log 的輸入必須大於 0'); return Math.log10(x); },
            cbrt: Math.cbrt, sign: Math.sign,
        };
        const TRIG = { sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan };
        const INVERSE = new Set(['asin', 'acos', 'atan']);
        const CONSTS = { pi: Math.PI, e: Math.E, π: Math.PI };

        function tokenize(src) {
            const s = String(src).replace(/×/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/，/g, '').replace(/,/g, '');
            const out = []; let i = 0;
            while (i < s.length) {
                const c = s[i];
                if (/\s/.test(c)) { i++; continue; }
                const num = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
                if (num) { out.push({ t: 'num', v: parseFloat(num[0]) }); i += num[0].length; continue; }
                const id = /^[A-Za-zπ]+/.exec(s.slice(i));
                if (id) { out.push({ t: 'id', v: id[0].toLowerCase() }); i += id[0].length; continue; }
                if ('+-*/^()!%'.includes(c)) { out.push({ t: c }); i++; continue; }
                throw new Error(`看不懂的符號：${c}`);
            }
            return out;
        }

        // 字母 x 只在「數字 x 數字」（如 3x4）時當乘號，避免誤傷名稱
        const normalizeX = (s) => s.replace(/(\d|\))\s*[xX]\s*(?=[\d(.])/g, '$1*');

        function evaluate(src, { angle = 'deg', ans = 0 } = {}) {
            const toks = tokenize(normalizeX(String(src))); let p = 0;
            if (!toks.length) throw new Error('請輸入算式');
            const peek = () => toks[p], next = () => toks[p++];
            const toRad = (x) => (angle === 'deg' ? x * Math.PI / 180 : x), fromRad = (x) => (angle === 'deg' ? x * 180 / Math.PI : x);
            const fact = (n) => { if (!Number.isInteger(n) || n < 0) throw new Error('階乘只能用在 0 以上的整數'); if (n > 170) throw new Error('階乘太大'); let r = 1; for (let k = 2; k <= n; k++) r *= k; return r; };

            function expr() {
                let v = term();
                while (peek() && (peek().t === '+' || peek().t === '-')) { const op = next().t; const r = term(); v = op === '+' ? v + r : v - r; }
                return v;
            }
            function term() {
                let v = unary();
                for (; ;) {
                    const t = peek();
                    if (!t) break;
                    if (t.t === '*' || t.t === '/') { next(); const r = unary(); if (t.t === '/' && r === 0) throw new Error('不能除以 0'); v = t.t === '*' ? v * r : v / r; }
                    else if (t.t === '(' || t.t === 'id') v *= unary();                            // 隱含乘法：2(3+4)、2pi
                    else break;
                }
                return v;
            }
            function unary() {
                const t = peek();
                if (t && (t.t === '-' || t.t === '+')) { next(); const v = unary(); return t.t === '-' ? -v : v; }
                return power();
            }
            function power() {
                const base = postfix();
                if (peek() && peek().t === '^') { next(); return Math.pow(base, unary()); }
                return base;
            }
            function postfix() {
                let v = primary();
                while (peek() && (peek().t === '!' || peek().t === '%')) { const op = next().t; v = op === '!' ? fact(v) : v / 100; }
                return v;
            }
            function primary() {
                const t = next();
                if (!t) throw new Error('算式不完整');
                if (t.t === 'num') return t.v;
                if (t.t === '(') { const v = expr(); if (!next() || toks[p - 1].t !== ')') throw new Error('括號沒有成對'); return v; }
                if (t.t === 'id') {
                    if (t.v === 'ans') return ans;
                    if (t.v in CONSTS) return CONSTS[t.v];
                    const f = FUNCS[t.v] || TRIG[t.v];
                    if (!f) throw new Error(`不認得的名稱：${t.v}`);
                    if (!peek() || peek().t !== '(') throw new Error(`${t.v} 後面要接括號，例如 ${t.v}(2)`);
                    next(); const a = expr(); if (!next() || toks[p - 1].t !== ')') throw new Error('括號沒有成對');
                    if (TRIG[t.v]) { const r = INVERSE.has(t.v) ? fromRad(f(a)) : f(toRad(a)); return Math.abs(r) < 1e-12 ? 0 : r; }
                    return f(a);
                }
                throw new Error(`位置不對的符號：${t.t}`);
            }
            const v = expr();
            if (p < toks.length) throw new Error(toks[p].t === ')' ? '括號沒有成對' : '算式有多餘的部分');
            if (!Number.isFinite(v)) throw new Error('結果超出範圍或無意義');
            return v;
        }

        // 顯示：最多 12 位有效數字，去掉浮點誤差（0.1 + 0.2 → 0.3）；太大或太小用科學記號
        function fmt(v) {
            if (v === 0) return '0';
            const a = Math.abs(v);
            if (a >= 1e15 || a < 1e-9) return v.toExponential(8).replace(/\.?0+e/, 'e').replace('e+', 'e');
            const s = String(parseFloat(v.toPrecision(12)));
            return s.includes('e') ? Number(s).toLocaleString('en-US', { maximumFractionDigits: 12, useGrouping: false }) : s;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const coarse = matchMedia('(pointer:coarse)').matches;               // 手機按螢幕按鍵時不叫出系統鍵盤
        let hist = [].concat(store.get('calc_history', [])).filter(h => h && typeof h.e === 'string' && typeof h.r === 'string').slice(-30);
        let angle = store.get('calc_angle', 'deg') === 'rad' ? 'rad' : 'deg', ans = hist.length ? parseFloat(hist[hist.length - 1].r) || 0 : 0;

        function calc(commit) {
            const src = $('#expr').value, box = $('#result');
            box.className = '';
            if (!src.trim()) { box.textContent = ''; return; }
            try {
                const v = evaluate(src, { angle, ans }), r = fmt(v);
                box.textContent = '= ' + r;
                if (commit) { hist.push({ e: src, r }); hist = hist.slice(-30); ans = v; store.set('calc_history', hist); renderHist(); }
            } catch (e) { box.className = 'err'; box.textContent = commit ? e.message : (/不完整|多餘|成對|位置不對/.test(e.message) ? '' : e.message); }
        }

        function renderHist() {
            $('#hist').replaceChildren(...(hist.length ? [...hist].reverse().map(h => {
                const d = document.createElement('div'); d.className = 'li h';
                const l = document.createElement('div'); l.append(Object.assign(document.createElement('small'), { textContent: h.e }), Object.assign(document.createElement('b'), { textContent: '= ' + h.r }));
                d.append(l); d.onclick = () => { $('#expr').value = h.r; $('#expr').focus(); calc(false); }; return d;
            }) : [Object.assign(document.createElement('div'), { className: 'muted', textContent: '還沒有紀錄' })]));
        }

        const KEYS = [['C', 'clr'], ['(', 'ins'], [')', 'ins'], ['⌫', 'del'], ['÷', 'op'], ['7'], ['8'], ['9'], ['ans', 'ins'], ['×', 'op'], ['4'], ['5'], ['6'], ['%', 'ins'], ['−', 'op'], ['1'], ['2'], ['3'], ['^', 'op'], ['+', 'op'], ['0'], ['.'], ['√', 'fn'], ['!', 'ins'], ['=', 'eq']];
        $('#pad').replaceChildren(...KEYS.map(([k, kind]) => {
            const b = document.createElement('button'); b.textContent = k; if (kind === 'op') b.className = 'op'; if (kind === 'eq') b.className = 'eq';
            b.onclick = () => {
                const e = $('#expr');
                if (k === 'C') e.value = ''; else if (k === '⌫') e.value = e.value.slice(0, -1); else if (k === '=') return calc(true);
                else e.value += k === '√' ? 'sqrt(' : k;
                if (!coarse) e.focus(); calc(false);
            };
            return b;
        }));

        $('#expr').oninput = () => calc(false);
        $('#expr').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) { calc(true); } };
        $('#clearH').onclick = () => { hist = []; ans = 0; store.set('calc_history', hist); renderHist(); };
        $('#angle').onclick = () => { angle = angle === 'deg' ? 'rad' : 'deg'; store.set('calc_angle', angle); $('#angle').textContent = '角度：' + (angle === 'deg' ? '度' : '弧度'); $('#angle').setAttribute('aria-pressed', angle === 'deg'); calc(false); };
        $('#angle').textContent = '角度：' + (angle === 'deg' ? '度' : '弧度'); $('#angle').setAttribute('aria-pressed', angle === 'deg');
        renderHist(); if (!coarse) $('#expr').focus();
    </script>
</body>

</html>
