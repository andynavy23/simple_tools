    <template id="help">
        <h3>這是什麼</h3>
        <p>把常見的伺服器、部署設定與指令做成表單：選一個範本、填幾個欄位，就產生設定檔（或指令），並逐行說明每個設定在做什麼，一鍵複製。包含 nginx（反向代理、靜態站、HTTPS 轉址、gzip、快取、CORS）、nginx location 命中測試、Apache / .htaccess、Caddyfile、systemd service / timer、SSH config、logrotate、Kubernetes、Prometheus 告警、Ansible、Terraform、Shell 指令（find / grep / tar / rsync / ssh / scp / rm）、備份腳本 + crontab。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>忘了某個設定檔的語法，想先有個能用的骨架再改。</li>
        <li>想看懂別人給的設定：每行旁邊有簡短說明。</li>
        <li>寫 Kubernetes YAML 怕縮排與引號錯誤；組 find / rsync 指令怕下錯旗標。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>上方選「範本」，下方出現對應欄位（有些範本還有「類型」下拉）。</li>
        <li>填欄位，輸出即時更新；黃字的提醒是缺漏或可疑的地方，不會阻擋輸出。</li>
        <li>按「複製」貼到伺服器；紅色的說明代表危險寫法（如 <kbd>rm -rf</kbd>、<kbd>--delete</kbd>、<kbd>-delete</kbd>），執行前請再確認。</li>
        <li>「nginx location 測試」：每行一條 location 規則（<kbd>location ^~ /static/ {</kbd> 或只寫 <kbd>^~ /static/</kbd>），再輸入請求路徑，會指出命中哪一條並說明為什麼。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">nginx 反向代理：網域 example.com、後端 http://127.0.0.1:3000 → server / location / proxy_pass 與標頭設定
location 測試：規則 = /、/、/api/、^~ /static/、~* \.(png|jpg)$；路徑 /static/a.png
→ 命中 ^~ /static/（^~ 命中後不再看正規式）
find：路徑 /var/log、名稱 *.log、修改超過 30 天、動作「刪除」→ find ... -delete（紅色標示）</div>
        <h3>小提醒</h3>
        <ul>
        <li>產生的是「常見可用」的基本設定；不確定的選項刻意不寫。上線前請依你的環境（版本、路徑、發行版）檢查。YAML 由本頁自行輸出，字串會加引號避免 no、1.10、0755 被誤判型別。</li>
        <li>nginx location 測試只模擬匹配順序（=、^~、~、~*、最長前綴），不處理 rewrite、巢狀 location 與 URI 正規化的全部細節；正規式以 JavaScript 引擎比對，與 nginx 的 PCRE 大致相同但不完全一致。</li>
        <li>指令與腳本會在你的伺服器上執行，請先在測試環境或加上預覽旗標（find 去掉 -delete、rsync -n）確認。</li>
        <li>只會記住上次選的範本與各欄位內容（鍵 cfgen_opts，每個欄位有長度上限），不會累積資料，可用右上角 💾 備份；「重置此範本 / 全部重置」會清掉記住的內容（先確認、無法復原）。壞掉的記憶資料會被忽略。</li>
        </ul>

    <script>
        const { store, copyWithFeedback } = Util;

        // --- pure ---
        const SAFE_SH = /^[A-Za-z0-9_@%+=:,./-]+$/;
        const shq = (s) => { s = String(s); return s === '' ? "''" : SAFE_SH.test(s) || /^~\/[A-Za-z0-9_@%+=:,./-]*$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'"; };
        const n = (x) => String(x ?? '').trim();
        const ls = (x) => String(x ?? '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const kv = (x) => ls(x).map(s => { const i = s.indexOf('='); return i < 0 ? [s, ''] : [s.slice(0, i).trim(), s.slice(i + 1)]; });
        const isPort = (p) => /^\d+$/.test(p) && +p >= 1 && +p <= 65535;
        const isHost = (h) => /^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$/.test(h);
        const isIp = (s) => /^(\d{1,3}\.){3}\d{1,3}(\/\d{1,2})?$/.test(s) && s.split('/')[0].split('.').every(x => +x <= 255) || /^[0-9a-fA-F:]+(\/\d{1,3})?$/.test(s) && s.includes(':');
        const DANGER = /(^|\s)rm\s+-[a-z]*(rf|fr)|--delete\b|\s-delete\b|\bmkfs\b|\bdd\s+if=|chmod\s+-R\s+777|force_destroy\s*=\s*true/;

        // --- YAML（自行輸出，不依賴函式庫）---
        const YAML_RESERVED = /^(true|false|yes|no|on|off|null|y|n|~)$/i;
        const ys = (v) => typeof v === 'number' || typeof v === 'boolean' ? String(v) : v === null ? 'null'
            : /^[A-Za-z_][A-Za-z0-9_.\/-]*$/.test(v) && !YAML_RESERVED.test(v) ? v : JSON.stringify(String(v));
        function toYaml(v, ind = 0) {
            const pad = ' '.repeat(ind), out = [];
            if (Array.isArray(v)) {
                for (const it of v) {
                    if (it && typeof it === 'object' && (Array.isArray(it) ? it.length : Object.keys(it).length)) {
                        const sub = toYaml(it, ind + 2).split('\n'); sub[0] = pad + '- ' + sub[0].slice(ind + 2); out.push(...sub);
                    } else out.push(pad + '- ' + (it && typeof it === 'object' ? (Array.isArray(it) ? '[]' : '{}') : ys(it)));
                }
            } else {
                for (const [k, x] of Object.entries(v)) {
                    if (x === undefined) continue;
                    if (x && typeof x === 'object') {
                        const empty = Array.isArray(x) ? !x.length : !Object.keys(x).length;
                        out.push(pad + ys(k) + ':' + (empty ? (Array.isArray(x) ? ' []' : ' {}') : '\n' + toYaml(x, ind + 2)));
                    } else out.push(pad + ys(k) + ': ' + ys(x));
                }
            }
            return out.join('\n');
        }

        // --- nginx location 匹配（=、^~、~、~*、最長前綴）---
        function parseLoc(text) {
            const rules = [], bad = [];
            for (const raw of String(text ?? '').split(/\r?\n/)) {
                let t = raw.trim();
                if (!t || t[0] === '#' || t[0] === '}') continue;
                t = t.replace(/\s+\{[^{}]*\}?\s*;?$/, '').replace(/^location\s+/, '');
                const m = /^(=|\^~|~\*|~)\s+(.+)$/.exec(t) || /^()(\S.*)$/.exec(t);
                if (!m) continue;
                let pat = m[2].trim().replace(/^(["'])(.*)\1$/, '$2');
                if (pat[0] === '@') { bad.push(`命名 location ${pat} 不參與路徑匹配，已略過`); continue; }
                const r = { mod: m[1], pat, text: (m[1] ? m[1] + ' ' : '') + pat };
                if (m[1] === '~' || m[1] === '~*') { try { r.re = new RegExp(pat, m[1] === '~*' ? 'i' : ''); } catch (e) { bad.push(`正規式無法解析：${pat}`); continue; } }
                rules.push(r);
            }
            return { rules, bad };
        }
        // 回傳 { winner(索引或 -1), path, rules, notes[] }
        function nginxMatch(rulesText, reqPath) {
            const { rules, bad } = parseLoc(rulesText);
            let p = String(reqPath ?? '').trim().replace(/[?#].*$/, '').replace(/\/{2,}/g, '/');
            const notes = [...bad];
            if (!p.startsWith('/')) { p = '/' + p; }
            let winner = -1, reason = '', best = -1;
            const i0 = rules.findIndex(r => r.mod === '=' && r.pat === p);
            if (i0 >= 0) { winner = i0; reason = '精確匹配 = 完全相同，立刻結束，不再看其他規則'; }
            else {
                rules.forEach((r, i) => { if ((r.mod === '' || r.mod === '^~') && p.startsWith(r.pat) && (best < 0 || r.pat.length > rules[best].pat.length)) best = i; });
                if (best >= 0 && rules[best].mod === '^~') { winner = best; reason = '最長前綴帶有 ^~，命中後不再檢查正規式'; }
                else {
                    const ri = rules.findIndex(r => r.re && r.re.test(p));
                    if (ri >= 0) { winner = ri; reason = best >= 0 ? `最長前綴 ${rules[best].text} 沒有 ^~，所以接著依檔案順序檢查正規式，第一條符合的勝出（${rules[ri].mod}）` : '沒有前綴命中，依檔案順序檢查正規式，第一條符合的勝出'; }
                    else if (best >= 0) { winner = best; reason = '沒有正規式符合，採用最長前綴匹配'; }
                    else reason = '沒有任何規則符合（nginx 會回 404 或走 server 預設）';
                }
            }
            rules.forEach((r, i) => {
                r.status = i === winner ? '命中' : r.mod === '=' ? '不符合（路徑不完全相同）' : (r.mod === '' || r.mod === '^~') ? (p.startsWith(r.pat) ? '前綴符合，但不是最長 / 被取代' : '前綴不符合') : (r.re.test(p) ? '正規式符合，但被其他規則優先' : '正規式不符合');
            });
            return { winner, path: p, rules, notes, reason };
        }

        // --- 範本定義 ---
        const T = (k, label, def = '', hint = '', w) => ({ k, label, type: 'text', def, hint, w });

        const is = (k, ...vals) => (v) => vals.includes(v[k]);

        // ---- Kubernetes ----
        const dns1123 = (s) => /^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(s) && s.length <= 63;
        add('k8s', 'Kubernetes（Deployment / Service / Ingress / ConfigMap / CronJob）', [
