<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="油耗 / 行車成本：記錄每次加油的里程、公升數與單價，算出每公升跑幾公里、每百公里耗油與每公里的油錢，資料只存在你的瀏覽器。">
    <meta property="og:title" content="油耗 / 行車成本" />
    <meta property="og:description" content="記錄加油，算油耗與每公里成本。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/fuel-log.html" />
    <title>油耗 / 行車成本</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .row input[type=number] {
            width: 110px;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        .trend {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 100px;
            margin: 10px 0 22px;
        }

        .trend div {
            flex: 1;
            background: var(--blue);
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            position: relative;
        }

        .trend small {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
        }

        .it {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--fill);
            font-variant-numeric: tabular-nums;
            flex-wrap: wrap;
        }

        .it:last-child {
            border-bottom: 0;
        }

        .it .main {
            flex: 1;
            min-width: 180px;
        }

        .it small {
            color: var(--muted);
            display: block;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>油耗 / 行車成本</h1>
        <p class="sub">每次加油記一筆：當時的總里程、加了幾公升、每公升多少錢。勾「加滿」的兩筆之間才會算油耗（沒加滿的會併入下一次加滿）。</p>

        <div class="card">
            <div class="row">
                <label for="date">日期</label><input type="date" id="date">
                <label for="odo">里程（km）</label><input type="number" id="odo" min="0" step="any">
            </div>
            <div class="row">
                <label for="liters">公升</label><input type="number" id="liters" min="0" step="any">
                <label for="price">單價（元/L）</label><input type="number" id="price" min="0" step="any">
                <label><input type="checkbox" id="full" checked> 加滿</label>
                <button class="primary" id="add">新增</button>
            </div>
            <p class="note" id="msg"></p>
        </div>

        <div class="card">
            <h2>統計</h2>
            <div id="stats"></div>
            <div class="trend" id="trend" aria-label="每次加滿的油耗（km/L）"></div>
        </div>

        <div class="card">
            <h2>紀錄</h2>
            <div id="list"></div>
            <div class="row" style="margin-top:10px"><button class="sm" id="export">匯出 CSV</button><button class="sm" id="clear">清除全部</button></div>
        </div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, day, statRow, rnd, download } = Util;

        // --- pure ---
        const validEntry = (e) => !!e && typeof e.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && Number.isFinite(e.odo) && e.odo >= 0 && Number.isFinite(e.l) && e.l > 0 && e.l < 1000 && Number.isFinite(e.p) && e.p >= 0 && e.p < 1000 && typeof e.full === 'boolean';

        // 以「加滿到加滿」計算每一段：依里程排序；每個加滿點和前一個加滿點之間，油量 = 之間（含此次）所有加油量；里程 = 兩點里程差
        // 回傳 [{ d, km, liters, cost, kmPerL, lPer100, costPerKm }]
        function segments(entries) {
            const list = [...entries].sort((a, b) => a.odo - b.odo || a.d.localeCompare(b.d)), out = [];
            let prev = null, liters = 0, cost = 0;
            for (const e of list) {
                if (prev) { liters += e.l; cost += e.l * e.p; }
                if (e.full) {
                    if (prev && e.odo > prev.odo) { const km = e.odo - prev.odo; out.push({ d: e.d, km, liters, cost, kmPerL: km / liters, lPer100: liters / km * 100, costPerKm: cost / km }); }
                    prev = e; liters = 0; cost = 0;
                }
            }
            return out;
        }

        // 總覽：整體平均（總里程 / 總油量，而不是各段平均的平均）；沒有可算的段落回傳 null
        function overall(segs) {
            if (!segs.length) return null;
            const km = segs.reduce((a, s) => a + s.km, 0), l = segs.reduce((a, s) => a + s.liters, 0), c = segs.reduce((a, s) => a + s.cost, 0);
            const best = segs.reduce((a, s) => (s.kmPerL > a.kmPerL ? s : a)), worst = segs.reduce((a, s) => (s.kmPerL < a.kmPerL ? s : a));
            return { km, liters: l, cost: c, kmPerL: km / l, lPer100: l / km * 100, costPerKm: c / km, best: best.kmPerL, worst: worst.kmPerL, count: segs.length };
        }

        // CSV（開頭是 = + - @ 的文字補單引號，避免試算表公式注入）
        const csvCell = (v) => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const toCSV = (entries) => ['日期,里程,公升,單價,金額,加滿', ...[...entries].sort((a, b) => a.odo - b.odo).map(e => [e.d, e.odo, e.l, e.p, Math.round(e.l * e.p * 100) / 100, e.full ? '是' : '否'].map(csvCell).join(','))].join('\r\n');
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let entries = store.get('fuel_entries', []).filter(validEntry);
        const save = () => store.set('fuel_entries', entries);
        $('#date').value = day.today();
        const fmt = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('zh-TW', { maximumFractionDigits: d });

        function render() {
            const segs = segments(entries), o = overall(segs);
            $('#stats').replaceChildren(...(o ? [statRow('平均油耗', `${fmt(o.kmPerL)} km/L（${fmt(o.lPer100)} L/100km）`, 'ok'), statRow('每公里油錢', `${fmt(o.costPerKm)} 元`), statRow('最好 / 最差一段', `${fmt(o.best)} / ${fmt(o.worst)} km/L`), statRow('統計範圍', `${fmt(o.km, 0)} km・${fmt(o.liters, 1)} L・${fmt(o.cost, 0)} 元（${o.count} 段）`)] : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '至少要有兩筆「加滿」的紀錄才能算油耗。' })]));
            const last = segs.slice(-12), max = Math.max(1, ...last.map(s => s.kmPerL));
            $('#trend').replaceChildren(...last.map(s => { const b = document.createElement('div'); b.style.height = s.kmPerL / max * 100 + '%'; b.title = `${s.d}：${fmt(s.kmPerL)} km/L`; b.append(Object.assign(document.createElement('small'), { textContent: s.d.slice(5) })); return b; }));
            const sorted = [...entries].sort((a, b) => b.odo - a.odo);
            $('#list').replaceChildren(...(sorted.length ? sorted.map(e => {
                const r = document.createElement('div'); r.className = 'it'; const m = document.createElement('div'); m.className = 'main';
                m.append(document.createTextNode(`${e.d}　${fmt(e.odo, 0)} km`), Object.assign(document.createElement('small'), { textContent: `${fmt(e.l, 2)} L × ${fmt(e.p)} = ${fmt(e.l * e.p, 0)} 元${e.full ? '' : '（沒加滿）'}` }));
                const del = Object.assign(document.createElement('button'), { className: 'sm', textContent: '刪除' }); del.setAttribute('aria-label', '刪除 ' + e.d + ' 的紀錄'); del.onclick = () => { entries = entries.filter(x => x.id !== e.id); save(); render(); };
                r.append(m, del); return r;
            }) : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '還沒有紀錄' })]));
        }

        $('#add').onclick = () => {
            const e = { id: Date.now().toString(36) + rnd(1e6).toString(36), d: $('#date').value, odo: parseFloat($('#odo').value), l: parseFloat($('#liters').value), p: parseFloat($('#price').value || '0'), full: $('#full').checked };
            if (!validEntry(e)) { $('#msg').textContent = '請填入日期、里程、公升（單價可留空）'; return; }
            if (entries.some(x => x.odo === e.odo)) { $('#msg').textContent = '這個里程已經有一筆紀錄了'; return; }
            $('#msg').textContent = ''; entries.push(e); save(); $('#odo').value = ''; $('#liters').value = ''; render(); $('#odo').focus();
        };
        $('#export').onclick = () => download(new Blob(['﻿' + toCSV(entries)], { type: 'text/csv;charset=utf-8' }), `fuel-${day.today()}.csv`);
        $('#clear').onclick = () => { if (entries.length && confirm(`確定刪除全部 ${entries.length} 筆紀錄？無法復原。`)) { entries = []; save(); render(); } };
        render();
    </script>
</body>

</html>
