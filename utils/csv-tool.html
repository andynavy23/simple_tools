        :root {

            position: sticky;

        td:first-child {

    <template id="help">
        <h3>這是什麼</h3>
        <p>把 CSV / TSV 文字或檔案變成可排序、可篩選的表格，並轉成 JSON、Markdown 表格或 TSV。全部在本機處理，不上傳。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>從 Excel 複製出來的資料，想快速看過、排序</li>
        <li>要把表格轉成 JSON 給程式用，或轉成 Markdown 貼進文件</li>
        <li>大檔 CSV 不想用 Excel 開，只想查幾筆資料</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>把文字貼進上方框，或按「選擇檔案」（上限 5 MB）</li>
        <li>分隔符號預設自動判斷，不對就手動選；取消「第一列是標題」會自動命名欄 1、欄 2…</li>
        <li>點表頭可排序（再點一次反向），框內輸入可篩選任一欄包含的列；表格太寬時可左右滑動，第一欄固定在左側</li>
        <li>最下方選「JSON」「Markdown 表格」「TSV」，按「複製」或「下載」</li>
        <li>Excel：按「Excel（.xlsx）」選檔，會把第一個工作表變成上方的 CSV；按「把目前表格下載成 XLSX」則把目前（已篩選、已排序）的表格存成 .xlsx</li>
        <li>最下方的「進階處理」卡片有四個分頁，結果都會寫回上方的 CSV 文字（等於重新載入），按「復原一步」可退回上一步：
            <br>・<b>資料清理</b>：選操作、勾要處理的欄位，先按「預覽變更筆數」看會動到幾格 / 幾列，再按「套用」。可去前後空白、去除重複列（保留第一筆）、補空值（固定值 / 同欄上一列 / 平均 / 最常出現）、欄位拆分、欄位合併、數字格式統一（去千分位與貨幣符號、可固定小數位）、日期格式統一（YYYY-MM-DD、YYYY/M/D、YYYYMMDD、民國 113/5/2、12/31/2024 都能認）。
            <br>・<b>合併 JOIN</b>：貼上或載入第二份表（右表，第一列是標題），選兩邊的鍵欄與 inner（只留兩邊都有）/ left（保留左表全部），欄名衝突可加 _2 後綴或略過右表同名欄。
            <br>・<b>樞紐分析</b>：選列、欄（可不選）、值欄與彙總（計數 / 加總 / 平均 / 最大 / 最小），產生表格後可複製 CSV、下載，或「載入成目前表格」再轉 JSON / XLSX。
            <br>・<b>HTML 表格擷取</b>：貼網頁原始碼，列出所有 &lt;table&gt;，點一個載入成目前表格。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貼上三行：<br>姓名,部門,年資<br>小明,工程,3<br>"王, 小華",設計,5<br>會得到 2 列 × 3 欄的表格（引號內的逗號不會被切開），JSON 輸出中年資是數字 3 和 5。</div>
        <h3>小提醒</h3>
        <ul>
        <li>支援引號、雙引號跳脫與儲存格內換行</li>
        <li>XLSX 只處理第一個工作表的文字與數字：公式讀取的是已算好的值，日期會是數字序號，格式、顏色、合併儲存格都不保留；上限 10 MB、10 萬列、500 欄。寫出時「007」、超過 15 位的數字會保持文字，其餘數字寫成數字儲存格</li>
        <li>表格最多顯示前 500 列，輸出則包含全部符合篩選的列</li>
        <li>進階處理都是對「完整表格」操作（不含篩選與排序），沒有儲存任何資料，只能復原一步；套用後第一列一定成為標題。拆分一欄最多 10 段；欄數上限 500、JOIN 結果上限 10 萬列；樞紐表的列欄位相異值最多 10000 個、欄欄位最多 200 個，超過會提示換欄而不是截斷。</li>
        <li>日期若是 12/05/2024 這種「月/日」與「日/月」無法分辨的寫法，用「M/D/YYYY 順序」指定；認不出的格子會保持原樣並回報幾格。數字統一只改看起來是數字的格子，「007」這類請不要勾選（會變成 7）。樞紐的加總 / 平均 / 最大 / 最小只計入數字，不是數字的格子略過並提示；計數若選了值欄，只算該欄不是空白的列。</li>
        <li>HTML 擷取只取文字，不執行腳本也不載入圖片；跨欄（colspan）多出的格補空白，跨列（rowspan）不處理；巢狀表格內外會各列成一個表格。</li>
        <li>資料不會被儲存，重新整理就清空</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { download, parseCSV, toObjects, isNum, csvStringify } = Util;

        // --- pure ---
        // 判斷分隔符號：在前幾列中，各候選符號出現次數一致且最多者勝出
        function detectDelimiter(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 10); let best = ',', score = -1;
            for (const d of [',', '\t', ';', '|']) {
                const counts = lines.map(l => { let n = 0, q = false; for (const c of l) { if (c === '"') q = !q; else if (c === d && !q) n++; } return n; });
                const min = Math.min(...counts), consistent = counts.every(c => c === counts[0]);
                const s = (min > 0 ? 1 : 0) * 1000 + (consistent ? 500 : 0) + min;
                if (s > score) { score = s; best = d; }
            }
            return best;
        }

        // 比較：兩邊都是數字就用數值比，否則用字串（含中文）比
        const cmp = (a, b) => (isNum(a) && isNum(b) ? parseFloat(a) - parseFloat(b) : String(a).localeCompare(String(b), 'zh-Hant', { numeric: true }));
        function sortRows(rows, col, dir) { return [...rows].sort((x, y) => dir * cmp(x[col] ?? '', y[col] ?? '')); }
        const filterRows = (rows, q) => { q = q.trim().toLowerCase(); return q ? rows.filter(r => r.some(c => String(c).toLowerCase().includes(q))) : rows; };

        // Markdown 表格：| 與換行要跳脫；數字欄靠右
        function toMarkdown(header, rows) {
            const esc = (v) => String(v ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
            const right = header.map((_, i) => rows.length && rows.every(r => r[i] === undefined || r[i] === '' || isNum(r[i])));
            return [`| ${header.map(esc).join(' | ')} |`, `| ${right.map(r => (r ? '---:' : '---')).join(' | ')} |`, ...rows.map(r => `| ${header.map((_, i) => esc(r[i])).join(' | ')} |`)].join('\n');
        }
        const toTSV = (header, rows) => [header, ...rows].map(r => r.map(c => String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');

        // ---- XLSX：最簡讀寫（zip 不壓縮 + sheet XML；只處理字串與數字、第一個工作表）----
        const XLSX_MAX_BYTES = 10e6, XLSX_MAX_UNZIP = 60e6, XLSX_MAX_ROWS = 100000, XLSX_MAX_COLS = 500, XLSX_MAX_CELLS = 2e6;
        const CRC_T = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
        function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_T[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
        const u8 = (s) => new TextEncoder().encode(s);
        // files: [{ name, data: Uint8Array }] → zip（method 0 = store，不壓縮）
        function zipStore(files) {
            const parts = [], cd = []; let off = 0;
            for (const f of files) {
                const name = u8(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
                h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
                h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
                const c = new DataView(new ArrayBuffer(46));
                c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
                c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
                parts.push(new Uint8Array(h.buffer), name, f.data); cd.push(new Uint8Array(c.buffer), name);
                off += 30 + name.length + f.data.length;
            }
            const cdLen = cd.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
            e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdLen, true); e.setUint32(16, off, true);
            const all = [...parts, ...cd, new Uint8Array(e.buffer)], out = new Uint8Array(off + cdLen + 22); let o = 0;
            for (const a of all) { out.set(a, o); o += a.length; }
            return out;
        }
        // 讀 zip 的中央目錄 → [{ name, method, comp, size }]；結構不對丟 Error（所有位移都檢查邊界）
        function zipEntries(b) {
            const bad = () => new Error('不是有效的 XLSX（ZIP 結構不正確）');
            if (b.length < 22) throw bad();
            const v = new DataView(b.buffer, b.byteOffset, b.length); let e = -1;
            for (let i = b.length - 22; i >= Math.max(0, b.length - 22 - 65535); i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
            if (e < 0) throw bad();
            const n = v.getUint16(e + 10, true); let o = v.getUint32(e + 16, true); const out = [];
            if (n > 5000) throw new Error('ZIP 內的檔案太多');
            for (let k = 0; k < n; k++) {
                if (o + 46 > b.length || v.getUint32(o, true) !== 0x02014b50) throw bad();
                const flags = v.getUint16(o + 8, true), method = v.getUint16(o + 10, true), csize = v.getUint32(o + 20, true), size = v.getUint32(o + 24, true), nl = v.getUint16(o + 28, true), xl = v.getUint16(o + 30, true), cl = v.getUint16(o + 32, true), lo = v.getUint32(o + 42, true);
                if (o + 46 + nl > b.length || lo + 30 > b.length || v.getUint32(lo, true) !== 0x04034b50) throw bad();
                const name = new TextDecoder().decode(b.subarray(o + 46, o + 46 + nl)), start = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
                if (flags & 1) throw new Error('不支援加密的 XLSX');
                if (start + csize > b.length) throw bad();
                out.push({ name, method, comp: b.subarray(start, start + csize), size });
                o += 46 + nl + xl + cl;
            }
            return out;

            let rows = filterRows(body, $('#filter').value); if (sortCol >= 0) rows = sortRows(rows, sortCol, sortDir);
            const t = $('#tbl'); t.replaceChildren();
            if (header.length) {
                const tr = document.createElement('tr');
                header.forEach((h, i) => { const th = document.createElement('th'); th.textContent = h + (i === sortCol ? (sortDir > 0 ? ' ▲' : ' ▼') : ''); th.onclick = () => { if (sortCol === i) sortDir = -sortDir; else { sortCol = i; sortDir = 1; } render(); }; th.title = '點一下排序'; tr.append(th); });
                const thead = document.createElement('thead'); thead.append(tr); t.append(thead);
                const tb = document.createElement('tbody');
                rows.slice(0, 500).forEach(r => { const tr2 = document.createElement('tr'); header.forEach((_, i) => { const td = document.createElement('td'); td.textContent = r[i] ?? ''; if (isNum(r[i] ?? '')) td.className = 'num'; tr2.append(td); }); tb.append(tr2); });
                t.append(tb);
            }
            $('#info').textContent = header.length ? `${rows.length} / ${body.length} 列 × ${header.length} 欄${rows.length > 500 ? '（只顯示前 500 列）' : ''}` : '';
            const out = outKind === 'json' ? JSON.stringify(toObjects(header, rows), null, 2) : outKind === 'md' ? toMarkdown(header, rows) : toTSV(header, rows);
            $('#out').textContent = header.length ? out : '';
            advCols();
        }

        $('#src').oninput = load; $('#delim').onchange = load; $('#hdr').onchange = load; $('#filter').oninput = render;
        $('#file').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 5e6) { $('#err').textContent = '檔案太大（上限 5 MB）'; return; } $('#src').value = await f.text(); load(); };
        document.querySelectorAll('[data-o]').forEach(b => { b.onclick = () => { outKind = b.dataset.o; document.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }; });
        // XLSX：讀取只取第一個工作表的字串與數字；寫出用目前（已篩選、已排序）的表格
        async function inflateRaw(data, maxOut) {
            if (typeof DecompressionStream === 'undefined') throw new Error('這個瀏覽器不支援讀取 XLSX（缺少 DecompressionStream）');
            const rd = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader(), parts = []; let n = 0;
            for (; ;) { const { done, value } = await rd.read(); if (done) break; n += value.length; if (n > maxOut) { rd.cancel(); throw new Error('解壓後太大，無法讀取'); } parts.push(value); }
            const out = new Uint8Array(n); let o = 0; for (const a of parts) { out.set(a, o); o += a.length; } return out;
        }
        $('#xfile').onchange = async (e) => {
            const f = e.target.files[0]; e.target.value = ''; if (!f) return; $('#err').textContent = '';
            if (f.size > XLSX_MAX_BYTES) { $('#err').textContent = '檔案太大（XLSX 上限 10 MB）'; return; }
            try {
                const rows = await xlsxRead(new Uint8Array(await f.arrayBuffer()), inflateRaw);
                if (!rows.length) { $('#err').textContent = '這個工作表是空的'; return; }
                $('#src').value = csvStringify(rows[0], rows.slice(1)); $('#delim').value = ','; load();
            } catch (er) { $('#err').textContent = '讀取失敗：' + er.message; }
        };
        $('#xsave').onclick = () => {
            if (!header.length) { $('#err').textContent = '還沒有表格資料'; return; }
            let rows = filterRows(body, $('#filter').value); if (sortCol >= 0) rows = sortRows(rows, sortCol, sortDir);
            try { download(new Blob([xlsxWrite([...($('#hdr').checked ? [header] : []), ...rows])], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'table.xlsx'); $('#err').textContent = ''; } catch (er) { $('#err').textContent = er.message; }
        };
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#out').textContent);
        $('#save').onclick = () => download(new Blob([$('#out').textContent], { type: 'text/plain;charset=utf-8' }), 'table.' + (outKind === 'json' ? 'json' : outKind === 'md' ? 'md' : 'tsv'));

        // ---- 進階處理 UI：結果一律寫回上方的 CSV 文字（等於重新載入），可復原一步；不存任何資料 ----
        const COPS = {
            trim: { name: '去前後空白', cols: '要處理的欄位（不勾 = 全部欄位）' },
            dedupe: { name: '去除重複列', cols: '依哪幾欄判斷重複（不勾 = 整列完全相同），保留第一筆' },
            fill: { name: '補空值', cols: '要補的欄位（不勾 = 全部欄位）', b: ['方式', [['fixed', '固定值'], ['prev', '同欄上一列'], ['mean', '同欄平均'], ['mode', '同欄最常出現']]], a: ['固定值', ''] },
            split: { name: '欄位拆分', cols: '要拆的欄位（選一欄）', a: ['分隔字元', ','], keep: 1 },
            merge: { name: '欄位合併', cols: '要合併的欄位（至少兩欄）', a: ['分隔字串', ' '], keep: 1 },
            number: { name: '數字格式統一', cols: '要處理的欄位（去千分位 / 貨幣符號）', b: ['小數位', [['keep', '維持原位數'], ['0', '0 位'], ['1', '1 位'], ['2', '2 位'], ['3', '3 位'], ['4', '4 位']]] },
            date: { name: '日期格式統一', cols: '要處理的欄位（含民國年）', b: ['輸出', [['-', 'YYYY-MM-DD'], ['/', 'YYYY/MM/DD']]], b2: ['M/D/YYYY 順序', [['mdy', '月/日/年'], ['dmy', '日/月/年']]] },
        };
        let undoState = null, advSig = null, right = null, pvOut = null;
        const amsg = (t, bad) => { $('#amsg').textContent = t; $('#amsg').style.color = bad ? 'var(--bad)' : ''; };
        const fillSel = (sel, items) => sel.replaceChildren(...items.map(([v, t]) => new Option(t, v)));
        function setTable(h, b, label) {
            undoState = { src: $('#src').value, delim: $('#delim').value, hdr: $('#hdr').checked };
            $('#src').value = csvStringify(h, b); $('#delim').value = ','; $('#hdr').checked = true; $('#filter').value = ''; load();
            $('#undo').disabled = false; amsg(label + '（第一列成為標題；可按「復原一步」）');
        }
        $('#undo').onclick = () => {
            if (!undoState) return; const u = undoState; undoState = null; $('#undo').disabled = true;
            $('#src').value = u.src; $('#delim').value = u.delim; $('#hdr').checked = u.hdr; load(); amsg('已復原上一步');
        };
        document.querySelectorAll('[data-t]').forEach(b => { b.onclick = () => { document.querySelectorAll('[data-t]').forEach(x => { x.setAttribute('aria-pressed', x === b); $('#' + x.dataset.t).hidden = x !== b; }); amsg(''); }; });
        const selCols = () => [...$('#ccols').querySelectorAll('input:checked')].map(x => +x.value);
        // 表格欄位變了才重建欄位勾選與各下拉選單（render 每次篩選都會呼叫，不能每次都重建）
        function advCols() {
            const sig = header.join('\u0001'); if (sig === advSig) return; advSig = sig;
            $('#ccols').replaceChildren(...header.map((h, i) => { const l = document.createElement('label'), c = document.createElement('input'); l.className = 'achk'; c.type = 'checkbox'; c.value = i; l.append(c, document.createTextNode(h || `欄 ${i + 1}`)); return l; }));
            const opts = header.map((h, i) => [i, h || `欄 ${i + 1}`]);
            fillSel($('#jk1'), opts); fillSel($('#pvr'), opts); fillSel($('#pvc'), [[-1, '（無）'], ...opts]); fillSel($('#pvv'), [[-1, '（無，只算列數）'], ...opts]);
            if (header.length > 1) $('#pvv').value = header.length - 1;
        }
        const COP_HINT = () => {
            const o = COPS[$('#cop').value]; $('#ccolsL').textContent = o.cols;
            $('#cAw').hidden = !o.a; $('#cBw').hidden = !o.b; $('#cB2w').hidden = !o.b2; $('#ckeepw').hidden = !o.keep;
            if (o.a) { $('#cAl').textContent = o.a[0]; $('#cA').value = o.a[1]; } if (o.b) { $('#cBl').textContent = o.b[0]; fillSel($('#cB'), o.b[1]); } if (o.b2) { $('#cB2l').textContent = o.b2[0]; fillSel($('#cB2'), o.b2[1]); }
        };
        fillSel($('#cop'), Object.entries(COPS).map(([k, v]) => [k, v.name])); $('#cop').onchange = COP_HINT; COP_HINT();
        function runClean(apply) {
            if (!header.length) return amsg('還沒有表格資料', true);
            try {
                const op = $('#cop').value, r = cleanOp(header, body, op, selCols(), { text: $('#cA').value, mode: $('#cB').value, mode2: $('#cB2').value, keep: $('#ckeep').checked });
                const label = `${COPS[op].name}：${apply ? '已套用，' : '預覽，'}${op === 'dedupe' ? '移除' : '變更'} ${r.changed} ${r.unit}${r.note ? `（${r.note}）` : ''}`;
                if (!apply) return amsg(label); if (!r.changed) return amsg(label + '，沒有需要變更的資料');
                setTable(r.header, r.rows, label);
            } catch (e) { amsg(e.message, true); }
        }
        $('#cprev').onclick = () => runClean(false); $('#capply').onclick = () => runClean(true);

        // JOIN
        function parseRight() {
            const text = $('#j2').value; right = null; fillSel($('#jk2'), []);
            if (!text.trim()) return;
            try {
                const rows = parseCSV(text, detectDelimiter(text)), w = Math.max(0, ...rows.map(r => r.length)), norm = rows.map(r => Object.assign(new Array(w).fill(''), r));
                right = { h: norm[0], r: norm.slice(1) }; fillSel($('#jk2'), right.h.map((h, i) => [i, h || `欄 ${i + 1}`]));
            } catch (e) { amsg('右表讀取失敗：' + e.message, true); }
        }
        $('#j2').oninput = parseRight;
        $('#j2f').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 5e6) { amsg('右表檔案太大（上限 5 MB）', true); return; } $('#j2').value = await f.text(); parseRight(); };
        $('#jgo').onclick = () => {
            if (!header.length) return amsg('還沒有表格資料', true); if (!right) return amsg('請先貼上或載入右表', true);
            try {
                const r = joinTables(header, body, right.h, right.r, +$('#jk1').value, +$('#jk2').value, $('#jt').value, $('#jc').value);
                setTable(r.header, r.rows, `合併完成：${r.matched} 列有配對、${r.unmatched} 列沒有配對${$('#jt').value === 'inner' ? '（已略過）' : '（保留，右表欄位留空）'}；結果 ${r.rows.length} 列${r.dropped ? `；略過 ${r.dropped} 個同名欄` : ''}`);
            } catch (e) { amsg(e.message, true); }
        };

        // 樞紐
        fillSel($('#pva'), Object.entries(AGG_NAMES));
        $('#pgo').onclick = () => {
            if (!header.length) return amsg('還沒有表格資料', true);
            try {
                const r = pivotTable(header, body, { row: +$('#pvr').value, col: +$('#pvc').value, val: +$('#pvv').value, agg: $('#pva').value }); pvOut = r;
                const t = $('#ptbl'), thead = document.createElement('thead'), tb = document.createElement('tbody'), tr = document.createElement('tr');
                r.header.forEach(h => { const th = document.createElement('th'); th.textContent = h; tr.append(th); }); thead.append(tr);
                r.rows.slice(0, 500).forEach(row => { const x = document.createElement('tr'); row.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i && isNum(v)) td.className = 'num'; x.append(td); }); tb.append(x); });
                t.replaceChildren(thead, tb); $('#pres').hidden = $('#pact').hidden = false;
                amsg(`樞紐表 ${r.rows.length} 列 × ${r.header.length} 欄${r.rows.length > 500 ? '（只顯示前 500 列）' : ''}${r.skipped ? `；${r.skipped} 格不是數字已略過` : ''}`);
            } catch (e) { pvOut = null; $('#pres').hidden = $('#pact').hidden = true; amsg(e.message, true); }
        };
        $('#pcopy').onclick = () => pvOut && Util.copyWithFeedback($('#pcopy'), csvStringify(pvOut.header, pvOut.rows));
        $('#psave').onclick = () => pvOut && download(new Blob(['﻿' + csvStringify(pvOut.header, pvOut.rows)], { type: 'text/csv;charset=utf-8' }), 'pivot.csv');
        $('#puse').onclick = () => pvOut && setTable(pvOut.header, pvOut.rows, '已載入樞紐表');

        // HTML 表格
        $('#hgo').onclick = () => {
            $('#hlist').replaceChildren();
            try {
                const ts = htmlTables($('#h1').value); if (!ts.length) return amsg('找不到 <table>', true);
                if (ts.length === 1) return setTable(ts[0].rows[0], ts[0].rows.slice(1), '已載入唯一的表格');
                amsg(`找到 ${ts.length} 個表格，點選要載入的那一個`);
                $('#hlist').replaceChildren(...ts.map((t, i) => { const b = document.createElement('button'); b.className = 'sm'; b.textContent = `表格 ${i + 1}（${t.rows.length} 列 × ${t.rows[0].length} 欄）`; b.onclick = () => setTable(t.rows[0], t.rows.slice(1), `已載入表格 ${i + 1}`); return b; }));
            } catch (e) { amsg(e.message, true); }
        };
        load();
    </script>
</body>

</html>
