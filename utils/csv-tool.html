<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="CSV / TSV 表格工具：貼上或載入檔案，自動判斷分隔符號，表格預覽、點欄位排序、篩選，並轉成 JSON 或 Markdown 表格，也能讀寫簡單的 XLSX。全部在本機處理。">
    <meta property="og:title" content="CSV / TSV 表格工具" />
    <meta property="og:description" content="CSV 預覽、排序、篩選與轉 JSON / Markdown。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/csv-tool.html" />
    <title>CSV / TSV 表格工具</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 900px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin: 10px 0;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        .tbl {
            overflow: auto;
            max-height: 420px;
            border-radius: 10px;
            box-shadow: inset 0 0 0 1px var(--fill);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        th,
        td {
            padding: 6px 10px;
            border-bottom: 1px solid var(--fill);
            text-align: left;
            white-space: nowrap;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--card);
            cursor: pointer;
            user-select: none;
        }

        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            background: var(--card);
            box-shadow: 1px 0 0 var(--fill);
        }

        th:first-child {
            z-index: 2;
        }

        td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        pre {
            max-height: 320px;
            overflow: auto;
            background: var(--fill);
            border-radius: 10px;
            padding: 10px 12px;
            font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .err {
            color: var(--bad);
            min-height: 1.4em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>CSV / TSV 表格工具</h1>
        <p class="sub">貼上文字或選擇檔案（支援引號、雙引號跳脫與儲存格內換行）。處理全在本機，不會上傳。</p>

        <div class="card">
            <textarea id="src" spellcheck="false" placeholder="姓名,部門,年資&#10;小明,工程,3&#10;&quot;王, 小華&quot;,設計,5" aria-label="CSV 內容"></textarea>
            <div class="row">
                <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain">
                <label for="delim">分隔符號</label><select id="delim"><option value="auto">自動判斷</option><option value=",">逗號 ,</option><option value="&#9;">Tab</option><option value=";">分號 ;</option><option value="|">直線 |</option></select>
                <label><input type="checkbox" id="hdr" checked> 第一列是標題</label>
            </div>
            <div class="row"><label for="xfile">Excel（.xlsx）</label><input type="file" id="xfile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button class="sm" id="xsave">把目前表格下載成 XLSX</button></div>
            <div class="err" id="err" role="alert"></div>
        </div>

        <div class="card">
            <div class="row" style="margin-top:0"><input type="search" id="filter" placeholder="篩選（任一欄包含）" aria-label="篩選" style="flex:1 1 200px"><span class="muted" id="info"></span></div>
            <div class="tbl"><table id="tbl"></table></div>
        </div>

        <div class="card">
            <div class="row" style="margin-top:0"><button data-o="json" class="sm" aria-pressed="true">JSON</button><button data-o="md" class="sm" aria-pressed="false">Markdown 表格</button><button data-o="tsv" class="sm" aria-pressed="false">TSV</button><button class="sm" id="copy" style="margin-left:auto">複製</button><button class="sm" id="save">下載</button></div>
            <pre id="out"></pre>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把 CSV / TSV 文字或檔案變成可排序、可篩選的表格，並轉成 JSON、Markdown 表格或 TSV。全部在本機處理，不上傳。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>從 Excel 複製出來的資料，想快速看過、排序</li>
        <li>要把表格轉成 JSON 給程式用，或轉成 Markdown 貼進文件</li>
        <li>大檔 CSV 不想用 Excel 開，只想查幾筆資料</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>把文字貼進上方框，或按「選擇檔案」（上限 5 MB）</li>
        <li>分隔符號預設自動判斷，不對就手動選；取消「第一列是標題」會自動命名欄 1、欄 2…</li>
        <li>點表頭可排序（再點一次反向），框內輸入可篩選任一欄包含的列；表格太寬時可左右滑動，第一欄固定在左側</li>
        <li>最下方選「JSON」「Markdown 表格」「TSV」，按「複製」或「下載」</li>
        <li>Excel：按「Excel（.xlsx）」選檔，會把第一個工作表變成上方的 CSV；按「把目前表格下載成 XLSX」則把目前（已篩選、已排序）的表格存成 .xlsx</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貼上三行：<br>姓名,部門,年資<br>小明,工程,3<br>"王, 小華",設計,5<br>會得到 2 列 × 3 欄的表格（引號內的逗號不會被切開），JSON 輸出中年資是數字 3 和 5。</div>
        <h3>小提醒</h3>
        <ul>
        <li>支援引號、雙引號跳脫與儲存格內換行</li>
        <li>XLSX 只處理第一個工作表的文字與數字：公式讀取的是已算好的值，日期會是數字序號，格式、顏色、合併儲存格都不保留；上限 10 MB、10 萬列、500 欄。寫出時「007」、超過 15 位的數字會保持文字，其餘數字寫成數字儲存格</li>
        <li>表格最多顯示前 500 列，輸出則包含全部符合篩選的列</li>
        <li>資料不會被儲存，重新整理就清空</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { download, parseCSV, toObjects, isNum, csvStringify } = Util;

        // --- pure ---
        // 判斷分隔符號：在前幾列中，各候選符號出現次數一致且最多者勝出
        function detectDelimiter(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 10); let best = ',', score = -1;
            for (const d of [',', '\t', ';', '|']) {
                const counts = lines.map(l => { let n = 0, q = false; for (const c of l) { if (c === '"') q = !q; else if (c === d && !q) n++; } return n; });
                const min = Math.min(...counts), consistent = counts.every(c => c === counts[0]);
                const s = (min > 0 ? 1 : 0) * 1000 + (consistent ? 500 : 0) + min;
                if (s > score) { score = s; best = d; }
            }
            return best;
        }

        // 比較：兩邊都是數字就用數值比，否則用字串（含中文）比
        const cmp = (a, b) => (isNum(a) && isNum(b) ? parseFloat(a) - parseFloat(b) : String(a).localeCompare(String(b), 'zh-Hant', { numeric: true }));
        function sortRows(rows, col, dir) { return [...rows].sort((x, y) => dir * cmp(x[col] ?? '', y[col] ?? '')); }
        const filterRows = (rows, q) => { q = q.trim().toLowerCase(); return q ? rows.filter(r => r.some(c => String(c).toLowerCase().includes(q))) : rows; };

        // Markdown 表格：| 與換行要跳脫；數字欄靠右
        function toMarkdown(header, rows) {
            const esc = (v) => String(v ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
            const right = header.map((_, i) => rows.length && rows.every(r => r[i] === undefined || r[i] === '' || isNum(r[i])));
            return [`| ${header.map(esc).join(' | ')} |`, `| ${right.map(r => (r ? '---:' : '---')).join(' | ')} |`, ...rows.map(r => `| ${header.map((_, i) => esc(r[i])).join(' | ')} |`)].join('\n');
        }
        const toTSV = (header, rows) => [header, ...rows].map(r => r.map(c => String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');

        // ---- XLSX：最簡讀寫（zip 不壓縮 + sheet XML；只處理字串與數字、第一個工作表）----
        const XLSX_MAX_BYTES = 10e6, XLSX_MAX_UNZIP = 60e6, XLSX_MAX_ROWS = 100000, XLSX_MAX_COLS = 500, XLSX_MAX_CELLS = 2e6;
        const CRC_T = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
        function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_T[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
        const u8 = (s) => new TextEncoder().encode(s);
        // files: [{ name, data: Uint8Array }] → zip（method 0 = store，不壓縮）
        function zipStore(files) {
            const parts = [], cd = []; let off = 0;
            for (const f of files) {
                const name = u8(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
                h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
                h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
                const c = new DataView(new ArrayBuffer(46));
                c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
                c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
                parts.push(new Uint8Array(h.buffer), name, f.data); cd.push(new Uint8Array(c.buffer), name);
                off += 30 + name.length + f.data.length;
            }
            const cdLen = cd.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
            e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdLen, true); e.setUint32(16, off, true);
            const all = [...parts, ...cd, new Uint8Array(e.buffer)], out = new Uint8Array(off + cdLen + 22); let o = 0;
            for (const a of all) { out.set(a, o); o += a.length; }
            return out;
        }
        // 讀 zip 的中央目錄 → [{ name, method, comp, size }]；結構不對丟 Error（所有位移都檢查邊界）
        function zipEntries(b) {
            const bad = () => new Error('不是有效的 XLSX（ZIP 結構不正確）');
            if (b.length < 22) throw bad();
            const v = new DataView(b.buffer, b.byteOffset, b.length); let e = -1;
            for (let i = b.length - 22; i >= Math.max(0, b.length - 22 - 65535); i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
            if (e < 0) throw bad();
            const n = v.getUint16(e + 10, true); let o = v.getUint32(e + 16, true); const out = [];
            if (n > 5000) throw new Error('ZIP 內的檔案太多');
            for (let k = 0; k < n; k++) {
                if (o + 46 > b.length || v.getUint32(o, true) !== 0x02014b50) throw bad();
                const flags = v.getUint16(o + 8, true), method = v.getUint16(o + 10, true), csize = v.getUint32(o + 20, true), size = v.getUint32(o + 24, true), nl = v.getUint16(o + 28, true), xl = v.getUint16(o + 30, true), cl = v.getUint16(o + 32, true), lo = v.getUint32(o + 42, true);
                if (o + 46 + nl > b.length || lo + 30 > b.length || v.getUint32(lo, true) !== 0x04034b50) throw bad();
                const name = new TextDecoder().decode(b.subarray(o + 46, o + 46 + nl)), start = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
                if (flags & 1) throw new Error('不支援加密的 XLSX');
                if (start + csize > b.length) throw bad();
                out.push({ name, method, comp: b.subarray(start, start + csize), size });
                o += 46 + nl + xl + cl;
            }
            return out;
        }
        const xmlEsc = (s) => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
        const xmlUnesc = (s) => String(s).replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, (m, g) => { g = g.toLowerCase(); if (g[0] !== '#') return { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" }[g]; const c = g[1] === 'x' ? parseInt(g.slice(2), 16) : +g.slice(1); try { return String.fromCodePoint(c); } catch { return ''; } });
        const colName = (i) => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
        const colIndex = (s) => [...s].reduce((a, c) => a * 26 + c.charCodeAt(0) - 64, 0) - 1;
        // 純十進位數字（不含前導 0、不超過 15 位）才寫成數字儲存格，其餘（電話 007、長數字）保持字串，避免失真
        const xlsxIsNum = (s) => /^-?(0|[1-9]\d*)(\.\d+)?$/.test(s) && s.replace(/[-.]/g, '').length <= 15;
        // rows：二維陣列（字串）→ XLSX 位元組。超過上限丟 Error
        function xlsxWrite(rows) {
            if (rows.length > XLSX_MAX_ROWS) throw new Error('列數太多（上限 ' + XLSX_MAX_ROWS + ' 列）');
            const width = Math.max(0, ...rows.map(r => r.length)); if (width > XLSX_MAX_COLS) throw new Error('欄數太多（上限 ' + XLSX_MAX_COLS + ' 欄）');
            if (rows.length * width > XLSX_MAX_CELLS) throw new Error('儲存格太多（上限 ' + XLSX_MAX_CELLS + ' 格）');
            let sheet = '';
            rows.forEach((r, y) => {
                let cells = '';
                r.forEach((v, x) => {
                    const s = v === null || v === undefined ? '' : String(v); if (s === '') return;
                    const ref = colName(x) + (y + 1);
                    cells += xlsxIsNum(s) ? '<c r="' + ref + '"><v>' + s + '</v></c>' : '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(s) + '</t></is></c>';
                });
                sheet += '<row r="' + (y + 1) + '">' + cells + '</row>';
            });
            const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', M = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
            return zipStore([
                { name: '[Content_Types].xml', data: u8(H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>') },
                { name: '_rels/.rels', data: u8(H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + R + '/officeDocument" Target="xl/workbook.xml"/></Relationships>') },
                { name: 'xl/workbook.xml', data: u8(H + '<workbook xmlns="' + M + '" xmlns:r="' + R + '"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>') },
                { name: 'xl/_rels/workbook.xml.rels', data: u8(H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + R + '/worksheet" Target="worksheets/sheet1.xml"/></Relationships>') },
                { name: 'xl/worksheets/sheet1.xml', data: u8(H + '<worksheet xmlns="' + M + '"><sheetData>' + sheet + '</sheetData></worksheet>') },
            ]);
        }
        // 讀第一個工作表 → 二維字串陣列。inflate(Uint8Array, maxOut) → Promise<Uint8Array> 由呼叫端提供（瀏覽器用 DecompressionStream，測試用 zlib）
        async function xlsxRead(bytes, inflate) {
            if (bytes.length > XLSX_MAX_BYTES) throw new Error('檔案太大（上限 10 MB）');
            const ents = zipEntries(bytes), by = Object.fromEntries(ents.map(e => [e.name.replace(/^\//, ''), e]));
            const text = async (name) => {
                const e = by[name]; if (!e) return null;
                if (e.size > XLSX_MAX_UNZIP) throw new Error('解壓後太大，無法讀取');
                let d = e.method === 0 ? e.comp : e.method === 8 ? await inflate(e.comp, XLSX_MAX_UNZIP) : null;
                if (!d) throw new Error('不支援的壓縮方式');
                return new TextDecoder().decode(d);
            };
            let path = 'xl/worksheets/sheet1.xml';
            const wb = await text('xl/workbook.xml'), rels = await text('xl/_rels/workbook.xml.rels');
            if (wb && rels) {
                const rid = /<sheet\b[^>]*\br:id="([^"]+)"/.exec(wb);
                if (rid) for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
                    if (new RegExp('\\bId="' + rid[1].replace(/[^\w-]/g, '') + '"').test(m[0])) { const t = /\bTarget="([^"]+)"/.exec(m[0]); if (t) path = t[1].replace(/^\//, '').startsWith('xl/') ? t[1].replace(/^\//, '') : 'xl/' + t[1].replace(/^\//, ''); }
                }
            }
            if (!by[path]) { const alt = ents.map(e => e.name).filter(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n)).sort()[0]; if (!alt) throw new Error('找不到工作表'); path = alt; }
            const sstXml = await text('xl/sharedStrings.xml'), sst = [];
            if (sstXml) for (const m of sstXml.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)) sst.push(xmlUnesc([...m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
            const sheet = await text(path), rows = []; let cells = 0, autoRow = 0;
            for (const rm of sheet.matchAll(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g)) {
                const rn = /\br="(\d+)"/.exec(rm[1]), y = rn ? +rn[1] - 1 : autoRow; autoRow = y + 1;
                if (y >= XLSX_MAX_ROWS) throw new Error('列數太多（上限 ' + XLSX_MAX_ROWS + ' 列）');
                let autoCol = 0; const row = rows[y] || (rows[y] = []);
                for (const cm of (rm[2] || '').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
                    const ref = /\br="([A-Za-z]+)\d*"/.exec(cm[1]), x = ref ? colIndex(ref[1].toUpperCase()) : autoCol; autoCol = x + 1;
                    if (x >= XLSX_MAX_COLS) throw new Error('欄數太多（上限 ' + XLSX_MAX_COLS + ' 欄）');
                    if (++cells > XLSX_MAX_CELLS) throw new Error('儲存格太多');
                    const t = (/\bt="([^"]+)"/.exec(cm[1]) || [])[1], inner = cm[2] || '', v = (/<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner) || [])[1];
                    let val = '';
                    if (t === 'inlineStr') val = xmlUnesc([...inner.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join(''));
                    else if (v !== undefined) val = t === 's' ? (sst[+v] ?? '') : t === 'b' ? (v.trim() === '1' ? 'TRUE' : 'FALSE') : xmlUnesc(v);
                    while (row.length < x) row.push(''); row[x] = val;
                }
            }
            const width = Math.max(0, ...Array.from(rows, r => (r ? r.length : 0)));
            const out = Array.from(rows, r => Object.assign(new Array(width).fill(''), r || []));
            while (out.length && out[out.length - 1].every(c => c === '')) out.pop();
            return out;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let header = [], body = [], sortCol = -1, sortDir = 1, outKind = 'json';

        function load() {
            $('#err').textContent = '';
            const text = $('#src').value;
            if (!text.trim()) { header = []; body = []; return render(); }
            try {
                const d = $('#delim').value === 'auto' ? detectDelimiter(text) : $('#delim').value, rows = parseCSV(text, d);
                const width = Math.max(0, ...rows.map(r => r.length));
                const norm = rows.map(r => Object.assign(new Array(width).fill(''), r));
                if ($('#hdr').checked) { header = norm[0] || []; body = norm.slice(1); } else { header = Array.from({ length: width }, (_, i) => `欄 ${i + 1}`); body = norm; }
                sortCol = -1;
            } catch (e) { $('#err').textContent = e.message; header = []; body = []; }
            render();
        }

        function render() {
            let rows = filterRows(body, $('#filter').value); if (sortCol >= 0) rows = sortRows(rows, sortCol, sortDir);
            const t = $('#tbl'); t.replaceChildren();
            if (header.length) {
                const tr = document.createElement('tr');
                header.forEach((h, i) => { const th = document.createElement('th'); th.textContent = h + (i === sortCol ? (sortDir > 0 ? ' ▲' : ' ▼') : ''); th.onclick = () => { if (sortCol === i) sortDir = -sortDir; else { sortCol = i; sortDir = 1; } render(); }; th.title = '點一下排序'; tr.append(th); });
                const thead = document.createElement('thead'); thead.append(tr); t.append(thead);
                const tb = document.createElement('tbody');
                rows.slice(0, 500).forEach(r => { const tr2 = document.createElement('tr'); header.forEach((_, i) => { const td = document.createElement('td'); td.textContent = r[i] ?? ''; if (isNum(r[i] ?? '')) td.className = 'num'; tr2.append(td); }); tb.append(tr2); });
                t.append(tb);
            }
            $('#info').textContent = header.length ? `${rows.length} / ${body.length} 列 × ${header.length} 欄${rows.length > 500 ? '（只顯示前 500 列）' : ''}` : '';
            const out = outKind === 'json' ? JSON.stringify(toObjects(header, rows), null, 2) : outKind === 'md' ? toMarkdown(header, rows) : toTSV(header, rows);
            $('#out').textContent = header.length ? out : '';
        }

        $('#src').oninput = load; $('#delim').onchange = load; $('#hdr').onchange = load; $('#filter').oninput = render;
        $('#file').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 5e6) { $('#err').textContent = '檔案太大（上限 5 MB）'; return; } $('#src').value = await f.text(); load(); };
        document.querySelectorAll('[data-o]').forEach(b => { b.onclick = () => { outKind = b.dataset.o; document.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }; });
        // XLSX：讀取只取第一個工作表的字串與數字；寫出用目前（已篩選、已排序）的表格
        async function inflateRaw(data, maxOut) {
            if (typeof DecompressionStream === 'undefined') throw new Error('這個瀏覽器不支援讀取 XLSX（缺少 DecompressionStream）');
            const rd = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader(), parts = []; let n = 0;
            for (; ;) { const { done, value } = await rd.read(); if (done) break; n += value.length; if (n > maxOut) { rd.cancel(); throw new Error('解壓後太大，無法讀取'); } parts.push(value); }
            const out = new Uint8Array(n); let o = 0; for (const a of parts) { out.set(a, o); o += a.length; } return out;
        }
        $('#xfile').onchange = async (e) => {
            const f = e.target.files[0]; e.target.value = ''; if (!f) return; $('#err').textContent = '';
            if (f.size > XLSX_MAX_BYTES) { $('#err').textContent = '檔案太大（XLSX 上限 10 MB）'; return; }
            try {
                const rows = await xlsxRead(new Uint8Array(await f.arrayBuffer()), inflateRaw);
                if (!rows.length) { $('#err').textContent = '這個工作表是空的'; return; }
                $('#src').value = csvStringify(rows[0], rows.slice(1)); $('#delim').value = ','; load();
            } catch (er) { $('#err').textContent = '讀取失敗：' + er.message; }
        };
        $('#xsave').onclick = () => {
            if (!header.length) { $('#err').textContent = '還沒有表格資料'; return; }
            let rows = filterRows(body, $('#filter').value); if (sortCol >= 0) rows = sortRows(rows, sortCol, sortDir);
            try { download(new Blob([xlsxWrite([...($('#hdr').checked ? [header] : []), ...rows])], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'table.xlsx'); $('#err').textContent = ''; } catch (er) { $('#err').textContent = er.message; }
        };
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#out').textContent);
        $('#save').onclick = () => download(new Blob([$('#out').textContent], { type: 'text/plain;charset=utf-8' }), 'table.' + (outKind === 'json' ? 'json' : outKind === 'md' ? 'md' : 'tsv'));
        load();
    </script>
</body>

</html>
