        <h1>簡繁轉換</h1>
        <p class="sub">字表與詞組表都內建在頁面裡，文字只在本機處理，不會上傳，也不會儲存。</p>

        <div class="card">

    <template id="help">
        <h3>這是什麼</h3>
        <p>簡體與繁體中文互轉的小工具。字表與詞組表都放在頁面裡，離線也能用；一個簡體字對應多個繁體字時，會先看有沒有詞組可以判斷，判斷不了的就標黃色讓你自己挑。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>看簡體的文章、字幕、設定檔，想轉成繁體閱讀。</li>
        <li>要把繁體的文字拿去給只看簡體的人。</li>
        <li>把大陸用語改成台灣用語（軟件 → 軟體、鼠標 → 滑鼠、網絡 → 網路）。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>選方向：「簡 → 繁」或「繁 → 簡」，貼上文字，結果馬上出現。</li>
        <li>勾「台灣用詞」會多做一層詞彙替換（簡 → 繁是換成台灣說法；繁 → 簡是把台灣說法換回大陸說法）。</li>
        <li>結果裡<b>黃色底</b>的字表示有歧義：點一下換成下一個候選（有底線代表你換過），確定後按「複製結果」。</li>
        <li>「結果當輸入並換方向」可以把結果放回輸入框再轉回去，檢查來回轉換有沒有走樣。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">我的头发很长，发展很快。  → 我的頭髮很長，發展很快。
干净的面条、干部、皇后、以后  → 乾淨的麵條、幹部、皇后、以後
软件、内存、鼠标（勾台灣用詞） → 軟體、記憶體、滑鼠</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>不保證完全準確。</b>字表衍生自開源的 OpenCC（Apache-2.0）並調整成台灣字形，再加上人工撰寫的詞組表；詞彙層級只有小型詞組表（約兩千條），多數一對多的字靠詞組判斷，遇到沒收錄的詞組只能取最常見的字並標黃色。</li>
        <li>人名、地名、專有名詞可能不準（如「于 / 於」「余 / 餘」「范 / 範」「朴 / 樸」「台 / 臺」），重要文件請自己再看一遍。</li>
        <li>詞組採「最長匹配優先」由左到右比對，詞組若剛好橫跨兩個詞（例如「头发」後面接「展」）可能被切錯。</li>
        <li>字形採台灣標準（裡、著、為、台灣…）；「着 / 著」簡 → 繁一律成「著」，繁 → 簡的「著」保留不動（著名、著作不能變成「着」）。</li>
        <li>非中文字元、標點、換行與空白一律原樣保留；輸入上限 200,000 字，超過的貼不進去。</li>
        <li>「台灣用詞」只收約三百條常見電腦、生活用詞，繁 → 簡時只換回比較沒有爭議的幾個；它只替換詞彙，不改語氣與句型。</li>
        <li>資料與儲存：輸入的文字與結果都不會存下來，關閉頁面就清空；只用本機的 <kbd>hanzi_opts</kbd> 記住上次的方向與開關（備份可用右上角「💾」），內容固定很小、不會累積，壞資料或存不下時會自動回到預設；「重設選項」可清掉，無法復原。</li>
        </ul>
    </template>

        const MAX = 200000;
        const parseChars = (txt) => new Map(txt.split(' ').map(t => { const a = Array.from(t); return [a[0], a.slice(1)]; }));
        const parsePairs = (txt) => txt ? txt.split(' ').map(t => t.split('>')) : [];

            s2t: { chars: parseChars(S2T_TXT), amb: new Set(Array.from(AMB_S)), ph: new Map(parsePairs(PH_S)), tw: new Map(parsePairs(TW_S)) },
            t2s: { chars: parseChars(T2S_TXT), amb: new Set(Array.from(AMB_T)), ph: new Map(parsePairs(PH_T)), tw: new Map(parsePairs(TW_R)) },
        };
        // 每個方向、有無台灣用詞各一份「詞組合併表」（台灣用詞蓋過一般詞組）+ 首字集合 + 最長 key
        const MERGED = {};
        function merged(dir, tw) {
            const id = dir + (tw ? '+' : '');
            if (MERGED[id]) return MERGED[id];
            const t = TABLE[dir], m = new Map(t.ph);
            if (tw) for (const [k, v] of t.tw) m.set(k, v);
            const starts = new Set(); let max = 1;
            for (const k of m.keys()) { const a = Array.from(k); starts.add(a[0]); if (a.length > max) max = a.length; }
            return (MERGED[id] = { m, starts, max });

            const t = TABLE[dir], { m, starts, max } = merged(dir, tw);

            const out = [], amb = new Map();

            for (let i = 0; i < src.length;) {

                if (starts.has(c)) {
                    let hit = false;
                    for (let L = Math.min(max, src.length - i); L >= 1; L--) {
                        const key = L === 1 ? c : src.slice(i, i + L).join(''), v = m.get(key);

                        if (v !== key) { changed += L; words++; }

            if (!o || typeof o !== 'object' || Array.isArray(o)) return d;

        const $ = (s) => document.querySelector(s);
        const KEY = 'hanzi_opts';

        function syncOpts() {
            $('#dS2t').setAttribute('aria-pressed', opts.dir === 's2t');

            $('#tw').checked = opts.tw;
        }
        const fmt = (n) => n.toLocaleString('en-US');

        function render() {
            const s = $('#src').value;
            $('#cnt').textContent = `${fmt(s.length)} / ${fmt(MAX)}`;
            $('#limit').hidden = s.length < MAX;
            pick = new Map(); $('#info').textContent = '';
            res = convert(s, opts.dir, opts.tw);
            const box = $('#out'), frag = document.createDocumentFragment();
            let buf = '';
            res.out.forEach((c, i) => {
                if (res.amb.has(i)) {
                    if (buf) { frag.append(buf); buf = ''; }
                    const sp = document.createElement('span'); sp.className = 'amb'; sp.dataset.i = i; sp.textContent = c; frag.append(sp);
                } else buf += c;
            });
            if (buf) frag.append(buf);
            box.replaceChildren(frag);
            $('#stat').textContent = s ? `共 ${fmt(res.total)} 字；轉換 ${fmt(res.changed)} 字；用詞／詞組替換 ${fmt(res.words)} 處；可能有歧義 ${fmt(res.amb.size)} 處` : '';
            $('#copy').disabled = !s; $('#swap').disabled = !s;
        }

        $('#out').onclick = (e) => {
            const sp = e.target.closest('.amb'); if (!sp || !res) return;
            const i = +sp.dataset.i, cand = res.amb.get(i);
            if (!cand) return;
            const next = ((pick.get(i) || 0) + 1) % cand.length;
            pick.set(i, next); sp.textContent = cand[next]; sp.classList.add('picked');
            $('#info').textContent = `可選：${cand.join(' / ')}　目前：${cand[next]}（再點一下換下一個）`;
        };
        $('#src').oninput = later;
        const setDir = (d) => { opts.dir = d; saveOpts(); syncOpts(); render(); };
        $('#dS2t').onclick = () => setDir('s2t'); $('#dT2s').onclick = () => setDir('t2s');
        $('#tw').onchange = () => { opts.tw = $('#tw').checked; saveOpts(); render(); };
        $('#demo').onclick = () => { $('#src').value = opts.dir === 's2t' ? '我的头发很长，发展很快。干净的面条、干部、皇后以后会发布软件。' : '我的頭髮很長，發展很快。乾淨的麵條、幹部、皇后以後會發佈軟體。'; render(); };
        $('#clear').onclick = () => { $('#src').value = ''; render(); };
        $('#copy').onclick = () => copyWithFeedback($('#copy'), resultText(res, pick));
        $('#swap').onclick = () => { $('#src').value = resultText(res, pick); opts.dir = opts.dir === 's2t' ? 't2s' : 's2t'; saveOpts(); syncOpts(); render(); };

            try { localStorage.removeItem(KEY); } catch (e) { }
            opts = cleanOpts(null); syncOpts(); render();
