<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="文字差異比對：貼上兩段文字，逐行或逐字詞標出新增與刪除，全部在本機處理。">
    <meta property="og:title" content="文字差異比對" />
    <meta property="og:description" content="貼上兩段文字，逐行或逐字詞標出差異。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/text-diff.html" />
    <title>文字差異比對</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 900px;
        }

        :root {
            --add: rgba(48, 209, 88, .22);
            --del: rgba(255, 69, 58, .22);
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 640px) {
            .two {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            align-items: center;
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .bar label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            margin: 0;
        }

        #sum {
            font-weight: 600;
            margin-bottom: 10px;
        }

        #out {
            font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
            overflow-x: auto;
        }

        .ln {
            display: flex;
            gap: 10px;
            padding: 0 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .ln i {
            flex: none;
            width: 1.2em;
            font-style: normal;
            color: var(--muted);
            user-select: none;
        }

        .ln.add {
            background: var(--add);
        }

        .ln.del {
            background: var(--del);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>文字差異比對</h1>
        <p class="sub">左邊放舊的，右邊放新的，逐行或逐字詞標出差異。</p>

        <div class="card">
            <div class="two">
                <div><label for="a">原始文字</label><textarea id="a" spellcheck="false"></textarea></div>
                <div><label for="b">修改後文字</label><textarea id="b" spellcheck="false"></textarea></div>
            </div>
            <div class="bar">
                <button class="primary" id="go">比對</button>
                <label><input type="checkbox" id="ws"> 忽略行首尾空白</label>
                <label><input type="checkbox" id="ci"> 忽略大小寫</label>
                <label>比對單位 <select id="unit"><option value="line">逐行</option><option value="word">逐字詞（行內標示）</option><option value="json">JSON 結構（依鍵與元素）</option><option value="patch">套用 patch</option></select></label>
                <span id="jsonOpts" class="bar" style="margin:0" hidden>
                    <label>陣列比對 <select id="arrMode"><option value="index">依索引</option><option value="key">依指定鍵</option></select></label>
                    <label id="arrKeyL" hidden>鍵名 <input type="text" id="arrKey" value="id" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:7em" aria-label="用來配對陣列元素的鍵名"></label>
                </span>
            </div>
        </div>

        <div class="card" id="result" hidden>
            <div id="sum"></div>
            <div id="out"></div>
            <div class="bar"><button class="sm" id="pCopy" hidden>複製套用後的文字</button></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>貼上新舊兩段文字，標出哪些行或哪些字詞被新增、刪除。紅色是刪除、綠色是新增。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>比較合約、文章、設定檔改了哪裡。</li>
        <li>確認同事回傳的修改稿到底動了什麼。</li>
        <li>檢查兩份清單的差異。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>左邊（手機在上面）貼「原始文字」，右邊（下面）貼「修改後文字」。</li>
        <li>視需要勾選「忽略行首尾空白」、「忽略大小寫」。</li>
        <li>「比對單位」選「逐行」或「逐字詞（行內標示）」；兩邊都是 JSON 時選「JSON 結構」，會列出新增、刪除、變更的路徑與前後值（鍵的順序不影響結果）。「陣列比對」可選「依索引」（第幾項對第幾項），或「依指定鍵」（例如用 id 配對，項目換位置不算差異）。</li>
        <li>按「比對」，結果在下方，長行會自動換行。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">原始：line2 換行 line3
        修改後：line2 換行 line4
        逐行比對 → 新增 1 行、刪除 1 行（line3 標紅、line4 標綠，line2 不標）
        JSON 結構：{"a":1,"b":[1,2]} 對 {"a":2,"b":[1,2,3]}
        → 變更 $.a（1 → 2）、新增 $.b[2]: 3</div>
        <h3>小提醒</h3>
        <ul>
        <li>兩段文字太長（行數乘積超過 400 萬）會無法比對。</li>
        <li>逐字詞模式中文每字一個單位，英數字連續算一個詞。</li>
        <li>JSON 結構模式：路徑寫法如 <kbd>$.items[id=2].price</kbd>；依指定鍵時，沒有該鍵的元素依出現順序配對、重複的鍵值依出現順序配對（路徑尾端加 #2…）；單純的型別變更（例如 1 變 "1"）算「變更」；差異超過 5000 筆會停止並請你縮小範圍。「忽略空白 / 大小寫」在這個模式不適用。</li>
        <li>全部在本機處理，不會上傳。</li>
        </ul>
        <h3>套用 patch</h3>
        <ol>
        <li>「比對單位」選「套用 patch」：左邊貼原文，右邊貼 unified diff（<kbd>git diff</kbd>、<kbd>diff -u</kbd> 的輸出），按「套用 patch」。</li>
        <li>下方每個 hunk 一行：綠色 ✓ 是套用成功（行號對不上時會標偏移，必要時放寬最多 2 行前後文），紅色 ✗ 是套不上並說明原因與位置；套不上的 hunk 不會動到原文，其餘照常套用。結果文字可按「複製套用後的文字」。</li>
        <li>CRLF 與 LF 混用的原文，每一行原本的換行都保留；新增的行沿用相鄰行的換行。</li>
        <li>限制：一次只處理一個檔案（patch 含多個檔案會列出檔名請你擇一）；「新增檔案 / 刪除檔案 / 二進位」的 patch 不處理並提示；不看檔名，只看內容；patch 被編輯器改過（行數與 @@ 標頭不符）的 hunk 會標為套不上。</li>
        </ol>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 序列 diff（LCS）：a、b 是元素陣列。回傳 [{ t: '=' | '+' | '-', text }]；'=' 的 text 取自 b（保留新版的原樣）
        // key 是「比較用」的轉換（例如忽略空白 / 大小寫），輸出仍保留原文。a、b 長度乘積超過 limit 回傳 null（避免 O(n·m) 記憶體暴增）
        function diffSeq(a, b, key = (x => x), limit = 4e6) {
            const ka = a.map(key), kb = b.map(key);
            // 先去掉共同的開頭與結尾，縮小 DP 範圍
            let s = 0;
            while (s < a.length && s < b.length && ka[s] === kb[s]) s++;
            let ea = a.length, eb = b.length;
            while (ea > s && eb > s && ka[ea - 1] === kb[eb - 1]) { ea--; eb--; }
            const n = ea - s, m = eb - s;
            if (n * m > limit) return null;

            // dp[i][j] = a[s+i..] 與 b[s+j..] 的 LCS 長度
            const w = m + 1, dp = new Uint32Array((n + 1) * w);
            for (let i = n - 1; i >= 0; i--)
                for (let j = m - 1; j >= 0; j--)
                    dp[i * w + j] = ka[s + i] === kb[s + j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);

            const out = [];
            for (let i = 0; i < s; i++) out.push({ t: '=', text: b[i] });
            let i = 0, j = 0;
            while (i < n && j < m) {
                if (ka[s + i] === kb[s + j]) { out.push({ t: '=', text: b[s + j] }); i++; j++; }
                else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) out.push({ t: '-', text: a[s + i++] });
                else out.push({ t: '+', text: b[s + j++] });
            }
            while (i < n) out.push({ t: '-', text: a[s + i++] });
            while (j < m) out.push({ t: '+', text: b[s + j++] });
            for (let k = ea; k < a.length; k++) out.push({ t: '=', text: b[eb + (k - ea)] });
            return out;
        }

        // 逐行 diff。opts.key 可自訂行的比較轉換、opts.limit 為行數乘積上限
        function diffLines(aText, bText, opts = {}) {
            return diffSeq(aText === '' ? [] : aText.split('\n'), bText === '' ? [] : bText.split('\n'), opts.key, opts.limit);
        }

        // 切成字詞：英數字連續算一個詞、每個中文字各算一個、空白連續算一個、其他符號各算一個
        const tokenize = (text) => text.match(/[A-Za-z0-9_]+|[一-鿿]|\s+|[^\sA-Za-z0-9_一-鿿]/g) || [];
        // 逐字詞 diff；連續同類型的片段合併成一段，方便顯示
        function diffWords(aText, bText, opts = {}) {
            const ops = diffSeq(tokenize(aText), tokenize(bText), opts.key, opts.limit);
            if (!ops) return null;
            const out = [];
            for (const o of ops) { const last = out[out.length - 1]; if (last && last.t === o.t) last.text += o.text; else out.push({ ...o }); }
            return out;
        }

        // ---------- JSON 結構 diff ----------
        // 以鍵 / 陣列元素比較（物件鍵順序不影響結果）。回傳 [{ t: 'add' | 'del' | 'chg', path, before?, after? }]
        // opts.arrayKey：陣列元素是物件時，用這個鍵的值配對（順序變動不算差異）；沒有這個鍵的元素依出現順序配對。不指定就依索引比對
        // 差異超過 opts.max（預設 5000）筆或巢狀超過 500 層會丟出錯誤
        const jdPath = (p, k) => typeof k === 'number' ? `${p}[${k}]` : /^[A-Za-z_$][\w$]*$/.test(k) ? `${p}.${k}` : `${p}[${JSON.stringify(k)}]`;
        function diffJSON(a, b, opts = {}) {
            const out = [], key = opts.arrayKey ? String(opts.arrayKey) : '', MAX = opts.max || 5000;
            const isO = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
            const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
            const push = (o) => { if (out.length >= MAX) throw new Error(`差異超過 ${MAX} 筆，請縮小範圍再比對`); out.push(o); };
            // 陣列元素的配對編號：[{ id, label, v }]
            const ids = (arr) => {
                const seen = new Map(); let nokey = 0;
                return arr.map((v) => {
                    let id, label;
                    if (isO(v) && own(v, key) && ['string', 'number', 'boolean'].includes(typeof v[key])) { id = 'k' + JSON.stringify(v[key]); label = key + '=' + String(v[key]); }
                    else { id = 'n' + nokey; label = '?' + nokey++; }
                    const c = (seen.get(id) || 0) + 1; seen.set(id, c);
                    if (c > 1) { id += '#' + c; label += '#' + c; }
                    return { id, label, v };
                });
            };
            const walk = (x, y, p, d) => {
                if (d > 500) throw new Error('巢狀超過 500 層，無法比對');
                if (isO(x) && isO(y)) {
                    for (const k of Object.keys(x)) { if (own(y, k)) walk(x[k], y[k], jdPath(p, k), d + 1); else push({ t: 'del', path: jdPath(p, k), before: x[k] }); }
                    for (const k of Object.keys(y)) if (!own(x, k)) push({ t: 'add', path: jdPath(p, k), after: y[k] });
                } else if (Array.isArray(x) && Array.isArray(y)) {
                    if (key) {
                        const ia = ids(x), ib = ids(y), mb = new Map(ib.map(e => [e.id, e]));
                        for (const e of ia) { const f = mb.get(e.id); if (f) { walk(e.v, f.v, `${p}[${e.label}]`, d + 1); mb.delete(e.id); } else push({ t: 'del', path: `${p}[${e.label}]`, before: e.v }); }
                        for (const e of mb.values()) push({ t: 'add', path: `${p}[${e.label}]`, after: e.v });
                    } else {
                        for (let i = 0; i < Math.max(x.length, y.length); i++) {
                            if (i >= x.length) push({ t: 'add', path: jdPath(p, i), after: y[i] });
                            else if (i >= y.length) push({ t: 'del', path: jdPath(p, i), before: x[i] });
                            else walk(x[i], y[i], jdPath(p, i), d + 1);
                        }
                    }
                } else if (x !== y) push({ t: 'chg', path: p, before: x, after: y });
            };
            walk(a, b, '$', 0);
            return out;
        }
        // 文字版：兩邊都要是有效 JSON。回傳 { ok, diffs } 或 { ok:false, error }
        function diffJSONText(aText, bText, opts = {}) {
            const parse = (t, who) => { if (!t.trim()) throw new Error(`${who}是空的`); try { return JSON.parse(t); } catch (e) { throw new Error(`${who}不是有效的 JSON：${e.message}`); } };
            try { return { ok: true, diffs: diffJSON(parse(aText, '原始文字'), parse(bText, '修改後文字'), opts) }; }
            catch (e) { return { ok: false, error: e instanceof RangeError ? '巢狀太深，無法比對' : e.message }; }
        }
        // ---------- 套用 unified diff ----------
        // 拆行並保留每行自己的換行（'\n' 或 '\r\n'；最後一行可能沒有換行 = ''），這樣 CRLF / LF 混用的原文套用後各行換行不變
        function splitKeepEol(t) {
            const out = []; let i = 0;
            while (i < t.length) {
                const j = t.indexOf('\n', i);
                if (j < 0) { out.push({ t: t.slice(i), e: '' }); break; }
                const cr = j > i && t[j - 1] === '\r';
                out.push({ t: t.slice(i, cr ? j - 1 : j), e: cr ? '\r\n' : '\n' }); i = j + 1;
            }
            return out;
        }
        // 解析 unified diff → [{ oldName, newName, isNew, isDel, binary, hunks:[{ oldStart, oldLen, newStart, newLen, head, lines:[{k:' '|'-'|'+', t, noeol?}], short }] }]
        function parsePatch(text) {
            const L = text.split('\n').map(l => l.endsWith('\r') ? l.slice(0, -1) : l), files = [];
            let cur = null, i = 0;
            const start = () => { cur = { oldName: '', newName: '', isNew: false, isDel: false, binary: false, hunks: [], minus: false }; files.push(cur); };
            const nm = (s) => { s = s.replace(/\t.*$/, '').trim(); return /^"/.test(s) ? s.replace(/^"|"$/g, '') : s; };
            while (i < L.length) {
                const l = L[i];
                if (/^diff --git /.test(l)) { start(); i++; continue; }
                if (/^--- /.test(l) && /^\+\+\+ /.test(L[i + 1] || '')) {
                    if (!cur || cur.hunks.length || cur.minus) start();
                    cur.minus = true; cur.oldName = nm(l.slice(4)); cur.newName = nm(L[i + 1].slice(4));
                    if (cur.oldName === '/dev/null') cur.isNew = true;
                    if (cur.newName === '/dev/null') cur.isDel = true;
                    i += 2; continue;
                }
                if (cur && /^new file mode/.test(l)) cur.isNew = true;
                else if (cur && /^deleted file mode/.test(l)) cur.isDel = true;
                else if (cur && /^(Binary files |GIT binary patch)/.test(l)) cur.binary = true;
                const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(l);
                if (m) {
                    if (!cur) start();
                    const h = { oldStart: +m[1], oldLen: m[2] === undefined ? 1 : +m[2], newStart: +m[3], newLen: m[4] === undefined ? 1 : +m[4], head: l.replace(/^(@@ [^@]+@@).*$/, '$1'), lines: [] };
                    let o = 0, n = 0; i++;
                    const mark = () => { if (h.lines.length) h.lines[h.lines.length - 1].noeol = true; };
                    while (i < L.length && (o < h.oldLen || n < h.newLen)) {
                        const x = L[i], c = x[0];
                        if (c === '\\') { mark(); i++; continue; }
                        if (x.startsWith('@@ ') || /^diff --git /.test(x)) break;
                        if (c === ' ' || x === '') { h.lines.push({ k: ' ', t: x.slice(1) }); o++; n++; }
                        else if (c === '-') { h.lines.push({ k: '-', t: x.slice(1) }); o++; }
                        else if (c === '+') { h.lines.push({ k: '+', t: x.slice(1) }); n++; }
                        else break;
                        i++;
                    }
                    while (i < L.length && L[i][0] === '\\') { mark(); i++; }
                    h.short = o !== h.oldLen || n !== h.newLen;
                    cur.hunks.push(h); continue;
                }
                i++;
            }
            return files;
        }
        // 套用 patch。回傳 { ok, text, results:[{ n, head, ok, line, offset, fuzz, reason }], applied, failed } 或 { ok:false, error }
        // 每個 hunk 先在預期行號找，找不到就往前後找（偏移不限），再依序放寬最多 maxFuzz（預設 2）行頭 / 行尾的前後文；
        // 套不上的 hunk 標示原因，其餘照常套用。新增 / 刪除檔案、二進位 patch、同時含多個檔案不處理
        function applyPatch(src, patchText, opts = {}) {
            const maxFuzz = opts.fuzz ?? 2;
            if (!patchText.trim()) return { ok: false, error: 'patch 是空的' };
            const files = parsePatch(patchText);
            if (!files.length) return { ok: false, error: '找不到 hunk（@@ -x,y +x,y @@）；請貼上 unified diff（git diff / diff -u 的輸出）' };
            if (files.length > 1) return { ok: false, error: `patch 含 ${files.length} 個檔案（${files.map(f => (f.newName || f.oldName || '?').replace(/^[ab]\//, '')).slice(0, 5).join('、')}），這裡一次只能套用一個檔案；請只貼其中一個檔案的部分` };
            const f = files[0];
            if (f.isNew) return { ok: false, error: '這是「新增檔案」的 patch，沒有原文可套用，不處理（新增檔案的內容就是 + 開頭的那些行）' };
            if (f.isDel) return { ok: false, error: '這是「刪除檔案」的 patch，不處理' };
            if (f.binary) return { ok: false, error: '二進位 patch 不支援' };
            if (!f.hunks.length) return { ok: false, error: '這份 patch 沒有 hunk（可能只有改名或權限變更）' };
            const work = splitKeepEol(src);
            const crlf = work.filter(x => x.e === '\r\n').length, lf = work.filter(x => x.e === '\n').length;
            const defEol = crlf > lf ? '\r\n' : '\n';
            let delta = 0, drift = 0, floor = 0;
            const results = [];
            f.hunks.forEach((h, hi) => {
                const res = { n: hi + 1, head: h.head, ok: false };
                results.push(res);
                if (h.short) { res.reason = 'hunk 的行數與標頭 @@ 宣告的不符（patch 可能被截斷或被編輯器改過）'; return; }
                const ol = h.lines.filter(x => x.k !== '+'), nl = h.lines.filter(x => x.k !== '-');
                let lead = 0, trail = 0;
                while (lead < h.lines.length && h.lines[lead].k === ' ') lead++;
                while (trail < h.lines.length - lead && h.lines[h.lines.length - 1 - trail].k === ' ') trail++;
                const base = (h.oldLen === 0 ? h.oldStart : h.oldStart - 1) + delta;
                const center = Math.max(floor, Math.min(work.length - ol.length, base + drift));
                const at = (arr, pos, sl, tl) => { for (let j = sl; j < arr.length - tl; j++) if (!work[pos + j] || work[pos + j].t !== arr[j].t) return false; return true; };
                let pos = -1, fz = 0;
                if (!ol.length) pos = Math.max(floor, Math.min(work.length, base));
                else {
                    let prev = '';
                    for (let z = 0; z <= maxFuzz && pos < 0; z++) {
                        const sl = Math.min(z, lead), tl = Math.min(z, trail), key = sl + ',' + tl;
                        if (key === prev) continue; prev = key;
                        const top = work.length - ol.length;
                        for (let d = 0; d <= work.length && pos < 0; d++) {
                            for (const p of d ? [center + d, center - d] : [center]) if (p >= floor && p <= top && at(ol, p, sl, tl)) { pos = p; fz = z; break; }
                        }
                    }
                }
                if (pos < 0) {
                    const c = Math.max(0, Math.min(work.length, base + drift)); let j = 0;
                    while (j < ol.length && work[c + j] && work[c + j].t === ol[j].t) j++;
                    const clip = (s) => s.length > 50 ? s.slice(0, 50) + '…' : s;
                    let done = 0;                          // 修改後的內容已經在原文裡 → 多半是同一份 patch 套用了兩次
                    if (nl.length && nl.some(x => x.k === '+')) for (let p = 0; p + nl.length <= work.length && !done; p++) if (nl.every((x, k) => work[p + k].t === x.t)) done = p + 1;
                    res.line = h.oldStart;
                    res.reason = done ? `這個 hunk 看起來已經套用過了（修改後的內容已在原文第 ${done} 行）` : j < ol.length ? `前後文對不上：預期第 ${c + j + 1} 行是「${clip(ol[j].t)}」，但原文是「${work[c + j] ? clip(work[c + j].t) : '（檔案已結束）'}」（預期位置附近與整份原文都找不到相符的位置）` : '找不到相符的位置';
                    return;
                }
                let oi = 0;
                const made = [];
                for (const x of h.lines) {
                    if (x.k === ' ') made.push(work[pos + oi++]);
                    else if (x.k === '-') oi++;
                    else made.push({ t: x.t, e: x.noeol ? '' : null });
                }
                work.splice(pos, ol.length, ...made);
                made.forEach((x, k) => {                    // 新增行的換行：沿用前一行（沒有就後一行、再沒有用整份的主要風格）
                    if (x.e !== null) return;
                    let e = '';
                    for (let p = pos + k - 1; p >= 0 && !e; p--) e = work[p].e;
                    for (let p = pos + k + 1; p < work.length && !e; p++) e = work[p].e;
                    x.e = e || defEol;
                });
                res.ok = true; res.line = pos + 1; res.offset = pos - base; res.fuzz = fz;
                drift = pos - base; delta += made.length - ol.length; floor = pos + made.length;
            });
            work.forEach((x, k) => { if (k < work.length - 1 && x.e === '') x.e = defEol; });   // 檔尾沒換行的那行後面又接了新行
            const failed = results.filter(r => !r.ok).length;
            return { ok: true, text: work.map(x => x.t + x.e).join(''), results, applied: results.length - failed, failed };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);

        const syncUnit = () => {
            const json = $('#unit').value === 'json', patch = $('#unit').value === 'patch';
            $('#jsonOpts').hidden = !json; $('#arrKeyL').hidden = !json || $('#arrMode').value !== 'key';
            ['#ws', '#ci'].forEach(x => { $(x).closest('label').hidden = json || patch; });
            $('label[for=a]').textContent = patch ? '原文' : '原始文字'; $('label[for=b]').textContent = patch ? 'patch（unified diff）' : '修改後文字';
            $('#go').textContent = patch ? '套用 patch' : '比對'; $('#pCopy').hidden = true;
        };
        $('#unit').onchange = syncUnit; $('#arrMode').onchange = syncUnit;
        const showV = (v) => { const t = JSON.stringify(v); return t.length > 200 ? t.slice(0, 200) + '…' : t; };
        function runJson() {
            const out = $('#out');
            $('#result').hidden = false; out.replaceChildren();
            if ($('#a').value.length + $('#b').value.length > 4000000) { $('#sum').textContent = '文字太長（超過 400 萬字元），無法比對'; return; }
            const key = $('#arrMode').value === 'key' ? $('#arrKey').value.trim() : '';
            if ($('#arrMode').value === 'key' && !key) { $('#sum').textContent = '請填入用來配對陣列元素的鍵名'; return; }
            const r = diffJSONText($('#a').value, $('#b').value, { arrayKey: key });
            if (!r.ok) { $('#sum').textContent = '✗ ' + r.error; return; }
            const n = (t) => r.diffs.filter(d => d.t === t).length;
            $('#sum').textContent = r.diffs.length ? `新增 ${n('add')} 處、刪除 ${n('del')} 處、變更 ${n('chg')} 處` : '兩份 JSON 的結構與值相同';
            const line = (cls, mark, text) => { const d = document.createElement('div'), m = document.createElement('i'), sp = document.createElement('span'); d.className = 'ln ' + cls; m.textContent = mark; sp.textContent = text; d.append(m, sp); out.append(d); };
            for (const d of r.diffs) {
                if (d.t === 'add') line('add', '+', `${d.path}: ${showV(d.after)}`);
                else if (d.t === 'del') line('del', '-', `${d.path}: ${showV(d.before)}`);
                else { line('del', '-', `${d.path}: ${showV(d.before)}`); line('add', '+', `${d.path}: ${showV(d.after)}`); }
            }
        }

        let pText = '';
        function runPatch() {
            const out = $('#out'), a = $('#a').value, b = $('#b').value;
            $('#result').hidden = false; out.replaceChildren(); pText = ''; $('#pCopy').hidden = true;
            if (a.length + b.length > 4000000) { $('#sum').textContent = '文字太長（超過 400 萬字元），無法處理'; return; }
            const r = applyPatch(a, b);
            if (!r.ok) { $('#sum').textContent = '✗ ' + r.error; return; }
            $('#sum').textContent = r.failed ? `套用 ${r.applied} 個 hunk、${r.failed} 個套不上（原文保留，其餘已套用）` : `✓ ${r.applied} 個 hunk 全部套用`;
            const line = (cls, mark, text) => { const d = document.createElement('div'), m = document.createElement('i'), sp = document.createElement('span'); d.className = 'ln ' + cls; m.textContent = mark; sp.textContent = text; d.append(m, sp); out.append(d); };
            for (const x of r.results) {
                if (x.ok) line('add', '✓', `Hunk ${x.n} ${x.head} → 第 ${x.line} 行${x.offset ? `（偏移 ${x.offset > 0 ? '+' : ''}${x.offset} 行）` : ''}${x.fuzz ? `（放寬 ${x.fuzz} 行前後文）` : ''}`);
                else line('del', '✗', `Hunk ${x.n} ${x.head}（原文第 ${x.line || '?'} 行附近）：${x.reason}`);
            }
            pText = r.text;
            const pre = document.createElement('pre'); pre.className = 'ln'; pre.style.cssText = 'display:block;margin-top:10px;overflow-x:auto;white-space:pre'; pre.textContent = r.text; out.append(pre);
            $('#pCopy').hidden = false;
        }
        $('#pCopy').onclick = () => Util.copyWithFeedback($('#pCopy'), pText, () => { });

        $('#go').onclick = () => {
            if ($('#unit').value === 'patch') return runPatch();
            if ($('#unit').value === 'json') return runJson();
            const ws = $('#ws').checked, ci = $('#ci').checked;
            const key = (x) => { if (ws) x = x.trim(); return ci ? x.toLowerCase() : x; };
            const norm = (t) => t.replace(/\r\n/g, '\n');
            const word = $('#unit').value === 'word', ops = (word ? diffWords : diffLines)(norm($('#a').value), norm($('#b').value), { key: word ? (x => key(x)) : key });
            $('#result').hidden = false;
            const out = $('#out');
            out.replaceChildren();
            if (word && ops) {
                const cnt = (t) => ops.filter(o => o.t === t).reduce((a, o) => a + tokenize(o.text).filter(x => x.trim()).length, 0), add = cnt('+'), del = cnt('-');
                $('#sum').textContent = add || del ? `新增 ${add} 個字詞、刪除 ${del} 個字詞` : '兩段文字相同';
                const p = document.createElement('div'); p.className = 'ln'; p.style.display = 'block';
                p.append(...ops.map(o => { if (o.t === '=') return document.createTextNode(o.text); const e = document.createElement(o.t === '+' ? 'ins' : 'del'); e.textContent = o.text; e.style.background = o.t === '+' ? 'var(--add)' : 'var(--del)'; e.style.textDecoration = o.t === '+' ? 'none' : 'line-through'; return e; }));
                out.append(p); return;
            }
            if (!ops) { $('#sum').textContent = '文字太長，無法比對（長度乘積超過 400 萬）'; return; }
            const add = ops.filter(o => o.t === '+').length, del = ops.filter(o => o.t === '-').length;
            $('#sum').textContent = add || del ? `新增 ${add} 行、刪除 ${del} 行` : '兩段文字相同';
            ops.forEach(o => {
                const d = document.createElement('div'), mark = document.createElement('i');
                d.className = 'ln' + (o.t === '+' ? ' add' : o.t === '-' ? ' del' : '');
                mark.textContent = o.t === '=' ? '' : o.t;
                const span = document.createElement('span');
                span.textContent = o.text === '' ? ' ' : o.text;
                d.append(mark, span);
                out.append(d);
            });
        };
    </script>
</body>
