<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="網址參數解析與組合：把 URL 拆成協定、帳密、主機、埠、路徑、query、hash，可編輯參數並即時重組，移除 utm 等追蹤參數，也能批次抽取某個參數。">
    <meta property="og:title" content="網址參數解析與組合" />
    <meta property="og:description" content="拆解、編輯、重組 URL，一鍵移除追蹤參數。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/url-parser.html" />
    <title>網址參數解析與組合</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 720px;
        }

        .card+.card {
            margin-top: 14px;
        }

        h2 {
            margin: 0 0 8px;
        }

        textarea {
            width: 100%;
            min-height: 96px;
            font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
            word-break: break-all;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin: 10px 0;
        }

        .row label.chk {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
        }

        .fg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }

        .fg label,
        .qrow label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 3px;
        }

        .fg input,
        .fg select,
        .qrow input {
            width: 100%;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .qrow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-end;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 8px;
        }

        .qrow>div {
            flex: 1 1 130px;
            min-width: 0;
        }

        .qrow button {
            min-width: 44px;
            min-height: 44px;
            padding: 6px 12px;
        }

        .tags {
            flex-basis: 100%;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 13px;
            color: var(--muted);
        }

        .tags .t {
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 1px 8px;
        }

        .tags .t.bad {
            color: var(--bad);
            border-color: var(--bad);
        }

        .warn {
            color: var(--bad);
            font-size: 14px;
            margin: 4px 0;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            word-break: break-all;
        }

        .seg {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }

        .seg:last-child {
            border-bottom: 0;
        }

        .seg b {
            color: var(--muted);

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>網址參數解析與組合</h1>
        <p class="sub">貼上網址就拆成各部分，改參數即時組回網址。全部在本機運算，不會上傳。</p>

        <div class="card">
            <label for="uin" class="muted">貼上網址</label>
            <textarea id="uin" spellcheck="false" autocomplete="off" aria-label="網址" placeholder="https://example.com/path?utm_source=x&q=你好#top"></textarea>
            <div class="row"><button id="sample" type="button" class="sm">範例</button><button id="uclear" type="button" class="sm">清空</button></div>
            <div id="uinfo"></div>
        </div>

        <div class="card" id="parts" hidden>
            <h2>各部分</h2>
            <div class="fg">
                <div><label for="fscheme">協定</label><input type="text" id="fscheme" spellcheck="false"></div>
                <div><label for="fuser">帳號</label><input type="text" id="fuser" spellcheck="false" autocomplete="off"></div>
                <div><label for="fpass">密碼</label><input type="text" id="fpass" spellcheck="false" autocomplete="off"></div>
                <div><label for="fhost">主機</label><input type="text" id="fhost" spellcheck="false"></div>
                <div><label for="fport">埠</label><input type="text" id="fport" spellcheck="false" inputmode="numeric"></div>
            </div>
            <div class="fg"><div style="grid-column:1/-1"><label for="fpath">路徑</label><input type="text" id="fpath" spellcheck="false"></div></div>
            <div id="segs"></div>
            <div class="fg"><div style="grid-column:1/-1"><label for="fhash">Hash（# 後面）</label><input type="text" id="fhash" spellcheck="false"></div></div>
            <div id="hashq"></div>
        </div>

        <div class="card" id="qcard" hidden>
            <h2>Query 參數</h2>
            <div id="qrows"></div>
            <div class="row"><button id="qadd" type="button">＋ 新增參數</button><button id="qtrack" type="button">移除追蹤參數</button><span class="muted" id="qcount"></span></div>
        </div>

        <div class="card" id="rcard" hidden>
            <h2>重組結果</h2>
            <div class="fg">
                <div><label for="oenc">編碼方式</label><select id="oenc"><option value="keep">沒改的保持原樣</option><option value="component">全部重新編碼（空白 → %20）</option><option value="form">全部重新編碼（空白 → +）</option></select></div>
                <div><label for="oempty">空值參數</label><select id="oempty"><option value="keep">照原樣</option><option value="drop">移除</option><option value="bare">只留鍵名（不加 =）</option></select></div>
            </div>
            <div class="row"><label class="chk"><input type="checkbox" id="osort"> 參數依鍵名排序</label><label class="chk"><input type="checkbox" id="opuny"> 主機轉成 punycode</label></div>
            <textarea id="uout" readonly spellcheck="false" aria-label="重組後的網址"></textarea>
            <div class="row"><button class="primary" id="ucopy" type="button">複製網址</button><button id="uapply" type="button">套用到上方輸入框</button></div>
            <div id="ustat"></div>
        </div>

        <div class="card">
            <h2>批次抽取參數</h2>
            <p class="muted" style="margin:0 0 8px">貼多個網址（一行一個或以空白分隔），指定參數名稱，抽出每個網址的值。</p>
            <textarea id="bin" spellcheck="false" aria-label="多個網址" placeholder="https://a.com/?id=1&amp;x=2&#10;https://b.com/?id=3"></textarea>
            <div class="row"><input type="text" id="bkey" spellcheck="false" placeholder="參數名稱，例如 id" aria-label="參數名稱" style="flex:1 1 140px"><button id="bcopy" type="button">複製所有值</button></div>
            <div id="bout"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把一條網址拆成協定、帳密、主機、埠、路徑、query 參數、hash，每一部分都能改，改完即時組回完整網址。也能批次抽出多個網址裡的某個參數。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>網址很長，想看清楚每個參數的值（中文、%20 這類編碼都會解開）</li>
        <li>分享連結前，想拿掉 utm_source、fbclid 這些追蹤參數</li>
        <li>要手動改某個參數再貼去測試 API、轉址或廣告連結</li>
        <li>手上有一串網址，要把其中的 id 或 token 全部抽出來</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>貼上網址（沒有協定也可以，會自動補 https://；以 / ? # 開頭的視為相對網址）。</li>
        <li>在「各部分」改協定、主機、埠、路徑、hash；路徑會逐段列出並顯示解碼後的文字。</li>
        <li>在「Query 參數」改鍵與值、按 ✕ 刪除、按「＋ 新增參數」；同鍵重複的參數會標示「重複 ×N」並保留順序。</li>
        <li>按「移除追蹤參數」一次刪掉 utm_*、fbclid、gclid 等。</li>
        <li>「重組結果」可選編碼方式、空值處理、鍵名排序；按「複製網址」或「套用到上方輸入框」。</li>
        <li>最下方「批次抽取參數」貼多個網址並填參數名稱，列出每個網址的值。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貼上 https://shop.example.com/p/1?utm_source=fb&amp;id=42&amp;q=%E4%BD%A0%E5%A5%BD
→ 參數表：utm_source=fb（追蹤）、id=42、q=你好
按「移除追蹤參數」→ https://shop.example.com/p/1?id=42&amp;q=%E4%BD%A0%E5%A5%BD
批次抽取：兩行網址 https://a.com/?id=1 與 https://b.com/?id=3，參數名稱填 id → 1、3</div>
        <h3>小提醒</h3>
        <ul>
        <li>編碼方式「沒改的保持原樣」：你沒動的參數維持原本的寫法，改過的才重新編碼。選「全部重新編碼」會統一格式；空白在 query 裡常寫成 + 或 %20，兩種都可選。</li>
        <li>解碼時 + 當成空白；若原網址的 + 是要代表加號，請用「全部重新編碼」或直接把值改成 %2B。</li>
        <li>空的 ? 或 # 重組時會省略；參數之間多餘的 &amp; 也會整理掉。</li>
        <li>中文網域會同時顯示 punycode（xn-- 開頭）寫法；IPv6 主機要放在 [ ] 內。</li>
        <li>參數值若解碼後還有 %XX（像 %2520），表示可能被編碼了兩次，可按「再解一層」。</li>
        <li>帳密會顯示在畫面上（原本就寫在網址裡），分享前請留意。這個頁面不儲存任何資料。</li>
        <li>「追蹤參數」是依常見名稱判斷（utm_*、fbclid、gclid、msclkid、igshid、mc_cid 等），少數網站可能把同名參數用在正事上，移除前請看一下。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { statRow } = Util;

        // --- pure ---
        const decodeSafe = (s, plus = true) => { try { return decodeURIComponent(plus ? String(s).replace(/\+/g, ' ') : String(s)); } catch (e) { return String(s); } };
        const decodeOk = (s) => { try { decodeURIComponent(s); return true; } catch (e) { return false; } };
        const TRACK_RE = /^(utm_[\w-]*|fbclid|gclid|gbraid|wbraid|dclid|msclkid|yclid|twclid|ttclid|igshid|mc_cid|mc_eid|_ga|_gl|_hsenc|_hsmi|mkt_tok|vero_id|ref_src|li_fat_id)$/i;
        const isTracking = (k) => TRACK_RE.test(String(k));
        // 解碼後還有 %XX 且原文有 %25：可能被編碼兩次
        const doubleEncoded = (raw) => /%25[0-9a-f]{2}/i.test(String(raw));

        // query 字串 → [{ k, v, eq, rk, rv }]；k / v 是解碼後，rk / rv 是原文（沒改的參數重組時用原文，才能原樣往返），eq 表示原本有 =
        function parseQuery(qs, plus = true) {
            return String(qs ?? '').split('&').filter(Boolean).map(seg => {
                const i = seg.indexOf('='), rk = i < 0 ? seg : seg.slice(0, i), rv = i < 0 ? '' : seg.slice(i + 1);
                return { k: decodeSafe(rk, plus), v: decodeSafe(rv, plus), eq: i >= 0, rk, rv };
            });
        }
        // Hash 像 query 時解析：#a=1&b=2 或 #/route?a=1；否則 null
        function hashQuery(h) {
            if (!h) return null;
            if (h[0] === '/' || h[0] === '!') { const q = h.indexOf('?'); return q >= 0 ? { route: h.slice(0, q), pairs: parseQuery(h.slice(q + 1)) } : null; }
            return /^[^=&?#]+=/.test(h) ? { route: '', pairs: parseQuery(h) } : null;
        }
        const pathSegments = (path) => String(path ?? '').split('/').slice(String(path ?? '')[0] === '/' ? 1 : 0).map(raw => ({ raw, dec: decodeSafe(raw, false) }));

        const HOSTISH = /^(?:[^\s@:/]*@)?(?:\[[0-9a-f:.]+\]|[^\s@:/\[\]]+\.[^\s@:/\[\]]+|localhost)(?::\d*)?$/i;
        const URL_RE = /^(?:([a-z][a-z0-9+.-]*):)?(?:\/\/([^/?#]*))?([^?#]*)(?:\?([^#]*))?(?:#([\s\S]*))?$/i;
        // 拆解網址（不經過 URL 物件，才能原樣往返）。回傳 { scheme, user, pass, hasAuth, host, port, path, query: 陣列|null, hash: 字串|null, assumed（補了 https://）, relative, warns }；空字串回傳 null
        function parseUrl(text) {
            let t = String(text ?? '').trim(); if (!t) return null;
            let assumed = false;
            const hasScheme = /^[a-z][a-z0-9+.-]*:/i.test(t);
            if (/^[a-z][a-z0-9+.-]*:\d+(?:[/?#]|$)/i.test(t) || (!hasScheme && !/^[/.?#]/.test(t) && HOSTISH.test(t.split(/[/?#]/)[0]))) { t = 'https://' + t; assumed = true; }
            const m = URL_RE.exec(t); if (!m) return null;
            const [, scheme = '', auth, path = '', qs, hash] = m, hasAuth = auth !== undefined, warns = [];
            let user = '', pass = '', host = '', port = '';
            if (hasAuth) {
                let a = auth; const at = a.lastIndexOf('@');
                if (at >= 0) { const ui = a.slice(0, at), c = ui.indexOf(':'); a = a.slice(at + 1); user = c < 0 ? ui : ui.slice(0, c); pass = c < 0 ? '' : ui.slice(c + 1); }
                const pm = /^(\[[^\]]*\]|[^:]*)(?::([\s\S]*))?$/.exec(a); host = pm[1]; port = pm[2] ?? '';
                if (port !== '' && !(/^\d+$/.test(port) && +port <= 65535)) warns.push('埠號不正確（要 0–65535 的數字）');
                if (!host) warns.push('缺少主機名稱');
            }
            if (/\s/.test(t)) warns.push('網址含空白，URL 物件會把它編成 %20');
            return { scheme, user, pass, hasAuth, host, port, path, query: qs === undefined ? null : parseQuery(qs), hash: hash === undefined ? null : hash, assumed, relative: !scheme && !hasAuth, warns };
        }

        // 主機名稱的 ASCII（punycode）寫法；IPv6 或無法解析時原樣回傳
        function asciiHost(h) { if (!h || h[0] === '[') return h; try { return new URL('http://' + h).hostname; } catch (e) { return h; } }
        // RFC 3492 解碼（不含 xn-- 前綴）
        function punyDecode(s) {
            const out = []; let n = 128, i = 0, bias = 72, b = s.lastIndexOf('-'); if (b < 0) b = 0;
            for (let j = 0; j < b; j++) { if (s.charCodeAt(j) >= 128) throw new RangeError('bad'); out.push(s.charCodeAt(j)); }
            for (let idx = b > 0 ? b + 1 : 0; idx < s.length;) {
                const oldi = i;
                for (let w = 1, k = 36; ; k += 36) {
                    if (idx >= s.length) throw new RangeError('bad');
                    const c = s.charCodeAt(idx++), d = c >= 48 && c < 58 ? c - 22 : c >= 65 && c < 91 ? c - 65 : c >= 97 && c < 123 ? c - 97 : 36;
                    if (d >= 36) throw new RangeError('bad');
                    i += d * w; const t = k <= bias ? 1 : k >= bias + 26 ? 26 : k - bias; if (d < t) break; w *= 36 - t;
                }
                const len = out.length + 1; let delta = i - oldi; delta = oldi === 0 ? Math.floor(delta / 700) : delta >> 1; delta += Math.floor(delta / len);
                let k = 0; while (delta > 455) { delta = Math.floor(delta / 35); k += 36; }
                bias = k + Math.floor(36 * delta / (delta + 38)); n += Math.floor(i / len); i %= len; out.splice(i++, 0, n);
            }
            return String.fromCodePoint(...out);
        }
        const unicodeHost = (a) => String(a).split('.').map(l => { if (!/^xn--/i.test(l)) return l; try { return punyDecode(l.slice(4)); } catch (e) { return l; } }).join('.');
        // 主機資訊 { kind: empty|ipv6|ipv4|domain, ascii, unicode, idn }
        function hostInfo(host) {
            if (!host) return { kind: 'empty', ascii: '', unicode: '', idn: false };
            if (host[0] === '[') return { kind: 'ipv6', ascii: host, unicode: host, idn: false };
            const ascii = asciiHost(host), unicode = unicodeHost(ascii);
            return { kind: /^\d+\.\d+\.\d+\.\d+$/.test(host) ? 'ipv4' : 'domain', ascii, unicode, idn: ascii !== host.toLowerCase() || unicode !== ascii };
        }

        // 重組網址。o：enc（keep 沒改的用原文 / component / form）、empty（keep / drop / bare）、sort、puny
        function buildUrl(m, o = {}) {
            const form = o.enc === 'form', raw = !o.enc || o.enc === 'keep', enc = (s) => { const e = encodeURIComponent(s); return form ? e.replace(/%20/g, '+') : e; };
            let pairs = (m.query || []).slice();
            if (o.empty === 'drop') pairs = pairs.filter(p => p.v !== '');
            if (o.sort) pairs.sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : 0));
            const qs = pairs.map(p => {
                const k = raw && p.rk !== undefined ? p.rk : enc(p.k), v = raw && p.rv !== undefined ? p.rv : enc(p.v);
                return p.v === '' && (o.empty === 'bare' || (o.empty !== 'drop' && p.eq === false)) ? k : k + '=' + v;
            }).join('&');
            let s = m.scheme ? m.scheme + ':' : '';
            if (m.hasAuth) s += '//' + (m.user !== '' || m.pass !== '' ? m.user + (m.pass !== '' ? ':' + m.pass : '') + '@' : '') + (o.puny ? asciiHost(m.host) : m.host) + (m.port !== '' ? ':' + m.port : '');
            return s + m.path + (qs ? '?' + qs : '') + (m.hash ? '#' + m.hash : '');
        }
        const stripTracking = (m) => ({ ...m, query: (m.query || []).filter(p => !isTracking(p.k)) });
        const countTracking = (m) => (m.query || []).filter(p => isTracking(p.k)).length;
        // 用 URL 物件確認網址能不能被瀏覽器接受；相對網址以假的基底解析
        function checkUrl(s, relative) { try { return { ok: true, href: new URL(s, relative ? 'http://relative.invalid' : undefined).href }; } catch (e) { return { ok: false, href: '' }; } }
        // 批次：每個網址（空白分隔）中 query 與 hash 參數裡鍵名等於 key 的所有值
        function extractParam(text, key) {
            return String(text ?? '').split(/\s+/).filter(Boolean).map(url => {
                const m = parseUrl(url), values = [];
                if (m) { for (const p of m.query || []) if (p.k === key) values.push(p.v); const hq = hashQuery(m.hash); if (hq) for (const p of hq.pairs) if (p.k === key) values.push(p.v); }
                return { url, values };
            });
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, attrs); e.append(...kids); return e; };
        const lab = (text, input) => el('div', {}, [el('label', { textContent: text }), input]);
        let M = null;

        function opts() { return { enc: $('#oenc').value, empty: $('#oempty').value, sort: $('#osort').checked, puny: $('#opuny').checked }; }
        function renderOut() {
            if (!M) return;
            const out = buildUrl(M, opts()), c = checkUrl(out, M.relative);
            $('#uout').value = out;
            const rows = [statRow('URL 物件', c.ok ? '可以解析' : '無法解析（網址格式有問題）', c.ok ? 'ok' : 'bad')];
            if (c.ok && c.href !== out) rows.push(statRow('標準化後', c.href, 'mono'));
            $('#ustat').replaceChildren(...rows);
        }
        function renderInfo() {
            const rows = [];
            for (const w of M.warns) rows.push(el('div', { className: 'warn', textContent: '⚠ ' + w }));
            if (M.assumed) rows.push(statRow('協定', '沒有寫協定，已自動補 https://'));
            if (M.relative) rows.push(statRow('類型', '相對網址（沒有協定與主機）'));
            else if (M.hasAuth && !M.scheme) rows.push(statRow('類型', '省略協定的網址（//開頭）'));
            const hi = hostInfo(M.host);
            if (hi.kind === 'ipv6') rows.push(statRow('主機', 'IPv6 位址'));
            else if (hi.kind === 'ipv4') rows.push(statRow('主機', 'IPv4 位址'));
            else if (hi.idn) { rows.push(statRow('網域（punycode）', hi.ascii, 'mono')); if (hi.unicode !== hi.ascii) rows.push(statRow('網域（顯示）', hi.unicode, 'mono')); }
            $('#uinfo').replaceChildren(...rows);
        }
        function renderSegs() {
            const segs = pathSegments(M.path).filter((s, i, a) => !(i === a.length - 1 && s.raw === '' && a.length > 1));
            $('#segs').replaceChildren(...segs.map((s, i) => el('div', { className: 'seg' }, [el('b', { textContent: i + 1 }), el('span', { className: 'mono', textContent: s.dec + (s.dec !== s.raw ? `　（原文 ${s.raw}）` : '') })])));
            const hq = hashQuery(M.hash || '');
            $('#hashq').replaceChildren(...(hq ? [el('div', { className: 'muted', textContent: 'Hash 看起來是參數' + (hq.route ? `（路由 ${hq.route}）` : '') + '：' }), el('table', {}, hq.pairs.map(p => el('tr', {}, [el('td', { className: 'mono', textContent: p.k }), el('td', { className: 'mono', textContent: p.v })])))] : []));
        }
        function renderQuery() {
            const q = M.query || [], cnt = {}; q.forEach(p => { cnt[p.k] = (cnt[p.k] || 0) + 1; });
            $('#qrows').replaceChildren(...q.map((p, i) => {
                const ik = el('input', { type: 'text', value: p.k, spellcheck: false, oninput() { p.k = this.value; delete p.rk; renderOut(); } }), iv = el('input', { type: 'text', value: p.v, spellcheck: false, oninput() { p.v = this.value; delete p.rv; if (p.v !== '') p.eq = true; renderOut(); } });
                ik.setAttribute('aria-label', `第 ${i + 1} 個參數的鍵`); iv.setAttribute('aria-label', `第 ${i + 1} 個參數的值`);
                const rm = el('button', { type: 'button', textContent: '✕', onclick() { q.splice(i, 1); renderQuery(); renderOut(); } }); rm.setAttribute('aria-label', `刪除第 ${i + 1} 個參數`);
                const tags = [];
                if (cnt[p.k] > 1) tags.push(el('span', { className: 't', textContent: `重複 ×${cnt[p.k]}` }));
                if (isTracking(p.k)) tags.push(el('span', { className: 't', textContent: '追蹤參數' }));
                if (p.rv !== undefined && /%[0-9a-f]{2}/i.test(p.rv)) tags.push(el('span', { className: 't', textContent: '含編碼' }));
                if (p.rv !== undefined && !decodeOk(p.rv.replace(/\+/g, ' '))) tags.push(el('span', { className: 't bad', textContent: '無效的 % 編碼' }));
                if (doubleEncoded(p.rv ?? '') || doubleEncoded(p.rk ?? '')) tags.push(el('span', { className: 't bad', textContent: '⚠ 可能被編碼兩次' }), el('button', { type: 'button', className: 'sm', textContent: '再解一層', onclick() { p.v = decodeSafe(p.v, false); p.k = decodeSafe(p.k, false); delete p.rk; delete p.rv; renderQuery(); renderOut(); } }));
                return el('div', { className: 'qrow' }, [lab('鍵', ik), lab('值', iv), rm, ...(tags.length ? [el('div', { className: 'tags' }, tags)] : [])]);
            }));
            const t = countTracking(M); $('#qtrack').disabled = !t; $('#qtrack').textContent = t ? `移除追蹤參數（${t}）` : '移除追蹤參數'; $('#qcount').textContent = `${q.length} 個參數`;
        }
        function load(text) {
            M = parseUrl(text);
            for (const id of ['parts', 'qcard', 'rcard']) $('#' + id).hidden = !M;
            if (!M) { $('#uinfo').replaceChildren(); return; }
            if (!M.query) M.query = [];
            $('#fscheme').value = M.scheme; $('#fuser').value = M.user; $('#fpass').value = M.pass; $('#fhost').value = M.host; $('#fport').value = M.port; $('#fpath').value = M.path; $('#fhash').value = M.hash ?? '';
            for (const id of ['fuser', 'fpass', 'fhost', 'fport']) $('#' + id).disabled = !M.hasAuth;
            renderInfo(); renderSegs(); renderQuery(); renderOut();
        }
        const bind = (id, key) => { $(id).oninput = () => { M[key] = $(id).value; if (key === 'path' || key === 'hash') renderSegs(); if (key === 'host') renderInfo(); renderOut(); }; };
        bind('#fscheme', 'scheme'); bind('#fuser', 'user'); bind('#fpass', 'pass'); bind('#fhost', 'host'); bind('#fport', 'port'); bind('#fpath', 'path'); bind('#fhash', 'hash');
        $('#uin').oninput = () => load($('#uin').value);
        $('#sample').onclick = () => { $('#uin').value = 'https://user:pw@例子.測試:8080/a%20b/c/?utm_source=fb&q=%E4%BD%A0%E5%A5%BD&q=2&tag=a+b&empty=&flag&fbclid=abc#section=2&x=1'; load($('#uin').value); };
        $('#uclear').onclick = () => { $('#uin').value = ''; load(''); };
        $('#qadd').onclick = () => { M.query.push({ k: '', v: '', eq: true }); renderQuery(); renderOut(); };
        $('#qtrack').onclick = () => { M.query = stripTracking(M).query; renderQuery(); renderOut(); };
        for (const id of ['#oenc', '#oempty', '#osort', '#opuny']) $(id).onchange = renderOut;
        $('#ucopy').onclick = () => Util.copyWithFeedback($('#ucopy'), $('#uout').value, () => $('#uout').select());
        $('#uapply').onclick = () => { $('#uin').value = $('#uout').value; load($('#uout').value); };

        function renderBatch() {
            const key = $('#bkey').value, rows = key === '' ? [] : extractParam($('#bin').value, key), vals = rows.flatMap(r => r.values);
            $('#bcopy').disabled = !vals.length;
            $('#bout').replaceChildren(...(rows.length ? [el('div', { className: 'muted', textContent: `${rows.length} 個網址，找到 ${vals.length} 個值` }), el('table', {}, rows.map(r => el('tr', {}, [el('td', { className: 'mono', textContent: r.values.length ? r.values.join(', ') : '（沒有）' }), el('td', { className: 'mono muted', textContent: r.url })])))] : []));
        }
        $('#bin').oninput = $('#bkey').oninput = renderBatch;
        $('#bcopy').onclick = () => Util.copyWithFeedback($('#bcopy'), extractParam($('#bin').value, $('#bkey').value).flatMap(r => r.values).join('\n'));
        renderBatch();
    </script>
</body>

</html>
