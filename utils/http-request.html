    <template id="help">
        <h3>這是什麼</h3>
        <p>四個跟 HTTP 請求有關的小工具：把 curl 指令轉成程式碼、直接在瀏覽器送請求看結果、連 WebSocket 收發訊息、組 / 排版 / 檢查並送出 GraphQL 請求。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>瀏覽器開發者工具「Copy as cURL」複製了一條指令，想改成 fetch、axios、Python 或 Go。</li>
        <li>文件給的是 curl 範例，想放進 VS Code REST Client 的 <kbd>.http</kbd> 檔，或把 Postman 的單一請求轉成 curl。</li>
        <li>想快速打一下自己本機的 API，或確認某個 API 允許瀏覽器跨網域呼叫。</li>
        <li>要測 WebSocket 伺服器收不收得到、回什麼。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li><b>curl 轉換</b>：選「貼 curl」貼上指令（支援引號、<kbd>\</kbd> 續行、<kbd>$'...'</kbd>、<kbd>-H -d --data-raw --data-urlencode -X -u -F -G -I -b -A --json --compressed -k -L</kbd>）；或選「Postman JSON」貼 v2.1 的單一 request（整份 collection 會取第一個請求）；或「用表單」自己填。下方切換 fetch / axios / Python / Go / curl / .http。</li>
        <li>不認得的旗標（例如 <kbd>-o</kbd>、<kbd>--retry</kbd>）會列在上方提示，不會默默消失。</li>
        <li><b>請求測試</b>：填方法、網址、標頭、本體後按「送出」，看狀態碼、回應標頭、內容與耗時。「curl 轉換」頁的「帶到請求測試」可直接帶入。</li>
        <li><b>WebSocket</b>：輸入 <kbd>ws://</kbd> 或 <kbd>wss://</kbd> 網址按「連線」，連上後可送文字訊息；中斷時會顯示關閉碼與白話意義。</li>
        <li><b>GraphQL</b>：填端點網址，用表單（種類、操作名稱、變數宣告、欄位選取）按「組成查詢」，或直接貼完整查詢；按「格式化」自動縮排（保留註解與字串、不改語意）。下方會即時檢查括號是否成對、變數有沒有宣告 / 使用、有沒有操作名稱、變數 JSON 是否合法，並輸出 POST 的 fetch / axios / Python / Go / curl / .http；「送出」會把請求帶到「請求測試」直接發送。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">curl -X POST 'https://api.example.com/items' -H 'Content-Type: application/json' -d '{"name":"demo"}'
→ fetch("https://api.example.com/items", { method: "POST", headers: {…}, body: … })</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>CORS 限制</b>：瀏覽器只允許網頁呼叫「回應了 Access-Control-Allow-Origin」的網址。自己本機的 API（需加 CORS 標頭）和公開的開放 API 通常可以；多數需要登入的商業 API 不行，會顯示 Failed to fetch。這不是本工具的問題，要測那類 API 請用 curl 或 Postman。</li>
        <li>瀏覽器不允許設定 Cookie、Host、Origin、User-Agent 等標頭，填了也不會送出（會提示）。</li>
        <li>用 https 開啟的頁面不能連 <kbd>http://</kbd> 或 <kbd>ws://</kbd>（本機 localhost 除外）。</li>
        <li>curl 的 <kbd>-d @檔案</kbd>、<kbd>-F k=@檔案</kbd> 無法讀取檔案內容，只保留檔名。<kbd>-k</kbd>（略過憑證）在瀏覽器 fetch 無法做到。</li>
        <li>curl 轉換只在本機進行，不會送出任何東西。請求測試會直接連你填的網址，別對不信任的網址送 token。</li>
        <li>WebSocket 記錄最多 500 則，滿了之後新訊息不再記錄（連線不受影響），按「清除記錄」即可繼續。</li>
        <li>GraphQL 請求一律是 POST + JSON 本體（<kbd>query</kbd>、<kbd>operationName</kbd>、<kbd>variables</kbd>），多數服務因此會觸發 CORS 預檢；不帶憑證，需要登入的服務請用 curl 或 Postman。檢查只看常見錯誤，不比對伺服器的 schema。</li>
        <li>只會記住上次選的分頁與語言（<kbd>httpreq_opts</kbd>）；網址、標頭、本體（可能含 token）一律不儲存，重新整理就清空。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, copyWithFeedback } = Util;

        // --- pure ---
        const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];
        const LANGS = { fetch: 'fetch', axios: 'axios', python: 'Python', go: 'Go', curl: 'curl', http: '.http' };
        const TABS = ['a', 'b', 'c', 'd'], SRCS = ['curl', 'postman', 'form'];
        const MAX_LOG = 500;
        const FORBIDDEN = new Set(['accept-charset', 'accept-encoding', 'access-control-request-headers', 'access-control-request-method', 'connection', 'content-length', 'cookie', 'cookie2', 'date', 'dnt', 'expect', 'host', 'keep-alive', 'origin', 'referer', 'set-cookie', 'te', 'trailer', 'transfer-encoding', 'upgrade', 'user-agent', 'via']);

        function loadOpts(o) {
            o = o && typeof o === 'object' ? o : {};
            return {
                tab: TABS.includes(o.tab) ? o.tab : 'a', src: SRCS.includes(o.src) ? o.src : 'curl',
                lang: Object.keys(LANGS).includes(o.lang) ? o.lang : 'fetch', method: METHODS.includes(o.method) ? o.method : 'GET',
            };
        }
        // 瀏覽器不會送出的標頭（forbidden header name；user-agent 在部分瀏覽器可設，但不保證，一併提示）
        function forbiddenHeaders(headers) {
            const out = [];
            for (const [n] of headers) { const l = n.toLowerCase(); if ((FORBIDDEN.has(l) || l.startsWith('proxy-') || l.startsWith('sec-')) && !out.includes(n)) out.push(n); }
            return out;
        }
        const hasHeader = (hs, name) => hs.some(h => h[0].toLowerCase() === name.toLowerCase());
        // 每行「名稱: 值」；# 開頭為註解；名稱不合法或缺冒號的行放 bad
        function parseHeaderLines(text) {
            const headers = [], bad = [];
            for (const raw of String(text ?? '').split(/\r?\n/)) {
                const line = raw.trim(); if (!line || line.startsWith('#')) continue;
                const i = line.indexOf(':'), name = i > 0 ? line.slice(0, i).trim() : '';
                if (!name || !/^[!#$%&'*+.^_`|~0-9A-Za-z-]+$/.test(name)) { bad.push(line); continue; }
                headers.push([name, line.slice(i + 1).trim()]);
            }
            return { headers, bad };
        }

        // ---- curl 解析 ----
        function shellSplit(s) {
            s = String(s ?? ''); const out = []; let cur = '', has = false, i = 0; const n = s.length;
            const push = () => { if (has) out.push(cur); cur = ''; has = false; };
            while (i < n) {
                const c = s[i];
                if (c === "'") { const j = s.indexOf("'", i + 1), e = j < 0 ? n : j; cur += s.slice(i + 1, e); has = true; i = e + 1; }
                else if (c === '$' && s[i + 1] === "'") {
                    i += 2; has = true;
                    while (i < n && s[i] !== "'") {
                        if (s[i] === '\\' && i + 1 < n) {
                            const d = s[i + 1]; i += 2;
                            if (d === 'n') cur += '\n'; else if (d === 'r') cur += '\r'; else if (d === 't') cur += '\t';
                            else if (d === 'x' || d === 'u' || d === 'U') {
                                const m = new RegExp('^[0-9a-fA-F]{1,' + (d === 'x' ? 2 : d === 'u' ? 4 : 8) + '}').exec(s.slice(i));
                                if (m) { cur += String.fromCodePoint(parseInt(m[0], 16)); i += m[0].length; } else cur += d;
                            } else if (/[0-7]/.test(d)) { const m = /^[0-7]{0,2}/.exec(s.slice(i))[0]; cur += String.fromCharCode(parseInt(d + m, 8)); i += m.length; }
                            else cur += d;
                        } else cur += s[i++];
                    }
                    i++;
                }
                else if (c === '"') {
                    i++; has = true;
                    while (i < n && s[i] !== '"') {
                        if (s[i] === '\\' && i + 1 < n && '$`"\\\n'.includes(s[i + 1])) { if (s[i + 1] !== '\n') cur += s[i + 1]; i += 2; }
                        else cur += s[i++];
                    }
                    i++;
                }
                else if (/\s/.test(c)) { push(); i++; }
                else if ((c === '\\' || c === '^') && (s[i + 1] === '\n' || (s[i + 1] === '\r' && s[i + 2] === '\n'))) { i += s[i + 1] === '\r' ? 3 : 2; }
                else if (c === '\\' && i + 1 < n) { cur += s[i + 1]; has = true; i += 2; }
                else { cur += c; has = true; i++; }
            }
            push(); return out;
        }
        const SHORT = { X: 'request', H: 'header', d: 'data', F: 'form', u: 'user', A: 'user-agent', e: 'referer', b: 'cookie', o: 'output', m: 'max-time', x: 'proxy', w: 'write-out', T: 'upload-file', k: 'insecure', L: 'location', I: 'head', G: 'get', s: 'silent', S: 'show-error', v: 'verbose', i: 'include', f: 'fail', N: 'no-buffer', g: 'globoff', O: 'remote-name', '#': 'progress-bar', 4: 'ipv4', 6: 'ipv6', 0: 'http1.0', 1: 'tlsv1', 2: 'sslv2', 3: 'sslv3' };
        const WITH_ARG = new Set(['request', 'header', 'data', 'data-raw', 'data-binary', 'data-ascii', 'data-urlencode', 'form', 'form-string', 'user', 'user-agent', 'referer', 'cookie', 'url', 'output', 'max-time', 'proxy', 'write-out', 'upload-file', 'connect-timeout', 'retry', 'cacert', 'cert', 'key', 'resolve', 'json']);
        const NOOP = new Set(['silent', 'show-error', 'verbose', 'include', 'fail', 'no-buffer', 'globoff', 'progress-bar', 'ipv4', 'ipv6', 'http1.0', 'http1.1', 'http2', 'tlsv1', 'sslv2', 'sslv3', 'no-keepalive', 'fail-with-body', 'location-trusted']);
        function parseCurl(text) {
            const t = shellSplit(String(text ?? '').replace(/^\s*\$\s+/, ''));
            if (!t.length) return { error: '請貼上 curl 指令' };
            if (!/^curl(\.exe)?$/i.test(t[0])) return { error: '指令要以 curl 開頭' };
            const r = { method: '', url: '', headers: [], body: null, form: [], auth: null, flags: {}, unknown: [], ignored: [], notes: [] };
            const data = [], urls = []; let explicitUrl = '', json = false;
            const enc = encodeURIComponent;
            const apply = (name, val, tok) => {

        function wsUi() {
            const on = ws && ws.readyState === 1, busy = ws && ws.readyState === 0;
            $('#wsGo').textContent = ws && ws.readyState < 2 ? '中斷' : '連線'; $('#wsGo').disabled = false;
            $('#wsSend').disabled = !on; $('#wsUrl').disabled = !!busy || !!on;
        }
        function wsConnect() {
            if (ws && ws.readyState < 2) { ws.close(1000, 'bye'); return; }
            const c = checkWsUrl($('#wsUrl').value, location.protocol);
            if (!c.ok) { $('#wsMsg').replaceChildren(h('div', 'box bad', c.error)); return; }
            if (!fullShown) $('#wsMsg').replaceChildren();
            let s; try { s = new WebSocket(c.url); } catch (e) { addLog('err', '無法建立連線：' + e.message); return; }
            ws = s; s.binaryType = 'arraybuffer'; addLog('sys', '連線中… ' + c.url);
            s.onopen = () => { if (ws === s) { addLog('sys', '已連線'); wsUi(); } };
            s.onmessage = (e) => addLog('in', typeof e.data === 'string' ? e.data : `（二進位 ${e.data.byteLength} 位元組）`);
            s.onerror = () => addLog('err', '連線錯誤（瀏覽器不提供細節，請看關閉碼）');
            s.onclose = (e) => { addLog('sys', `已關閉 · 關閉碼 ${e.code}：${wsCloseInfo(e.code)}${e.reason ? '；原因：' + e.reason : ''}`); if (ws === s) wsUi(); };
            wsUi();
        }
        $('#wsGo').onclick = wsConnect;
        $('#wsSend').onclick = () => { const t = $('#wsText').value; if (ws && ws.readyState === 1 && t !== '') { ws.send(t); addLog('out', t); } };
        $('#wsClear').onclick = () => { log = []; fullShown = false; $('#wsMsg').replaceChildren(); renderLog(); };

        // ---- D：GraphQL ----
        const SAMPLE_GQL = { name: 'GetUser', decl: '$id: ID!', sel: 'user(id: $id) { id name posts(first: 3) { title } }', vars: '{"id": "1"}' };
        let gModel = null;
        $('#gLangTabs').replaceChildren(...Object.entries(LANGS).map(([k, v]) => { const b = h('button', 'sm', v); b.dataset.l = k; return b; }));
        function gCompute() {
            const q = $('#gQ').value, opName = $('#gName').value.trim(), msg = $('#gMsg'), out = $('#gOut');
            msg.replaceChildren(); out.replaceChildren(); pressed($('#gLangTabs'), 'l', O.lang);
            const add = (txt, items, bad) => { const b = h('div', 'box' + (bad ? ' bad' : '')); b.append(h('div', '', txt)); const ul = h('ul'); items.forEach(i => ul.append(h('li', '', i))); b.append(ul); msg.append(b); };
            gModel = null;
            if (q.trim()) {
                const c = gqlCheck(q, $('#gVars').value, opName);
                if (c.errors.length) add('發現問題：', c.errors, true);
                if (c.warns.length) add('提醒：', c.warns);
                const r = gqlModel({ url: $('#gUrl').value.trim() || 'https://example.com/graphql', query: q, variables: $('#gVars').value, opName, headers: $('#gHeaders').value });
                if (r.error) { if (!c.errors.some(e => e.includes('JSON'))) add(r.error, [], true); } else gModel = r;
            }
            if (gModel) out.append(h('pre', 'code', GEN[O.lang](gModel))); else out.append(h('p', 'muted', '填好查詢後，這裡會顯示 POST 請求的程式碼'));
            $('#gCopy').disabled = !gModel; $('#gSend').disabled = !gModel || !$('#gUrl').value.trim();
        }
        ['#gUrl', '#gName', '#gDecl', '#gSel', '#gQ', '#gVars', '#gHeaders'].forEach(s => $(s).oninput = gCompute); $('#gType').onchange = gCompute;
        $('#gLangTabs').onclick = (e) => { const l = e.target.dataset.l; if (l) { O.lang = l; persist(); compute(); gCompute(); } };
        $('#gCompose').onclick = () => { if (!$('#gSel').value.trim()) return; $('#gQ').value = gqlCompose({ type: $('#gType').value, name: $('#gName').value, decl: $('#gDecl').value, sel: $('#gSel').value }); gCompute(); };
        $('#gFmt').onclick = () => { $('#gQ').value = gqlFormat($('#gQ').value); gCompute(); };
        $('#gClear').onclick = () => { $('#gQ').value = ''; gCompute(); };
        $('#gSample').onclick = () => { $('#gName').value = SAMPLE_GQL.name; $('#gDecl').value = SAMPLE_GQL.decl; $('#gSel').value = SAMPLE_GQL.sel; $('#gVars').value = SAMPLE_GQL.vars; $('#gCompose').click(); };
        $('#gCopy').onclick = () => gModel && copyWithFeedback($('#gCopy'), GEN[O.lang](gModel));
        $('#gSend').onclick = () => {
            if (!gModel) return;
            $('#bMethod').value = 'POST'; $('#bUrl').value = gModel.url; $('#bHeaders').value = gModel.headers.map(([k, v]) => `${k}: ${v}`).join('\n'); $('#bBody').value = gModel.body; $('#bNoCors').checked = false;
            O.tab = 'b'; showTab(); persist(); send();
        };

        showTab(); showSrc(); compute(); gCompute(); renderLog(); wsUi();
    </script>
</body>

</html>
