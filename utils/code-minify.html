<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="程式碼壓縮與格式化：HTML、CSS、JavaScript、JSON 的安全壓縮（只去註解與多餘空白）與簡易美化，並自動驗證結果。">
    <meta property="og:title" content="程式碼壓縮與格式化" />
    <meta property="og:description" content="HTML / CSS / JS / JSON 安全壓縮與美化，顯示縮減比例並驗證。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />

    <style>
        :root { --wrap-w: 760px; }

        label.lb { font-weight: 600; display: block; margin: 12px 0 6px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .chk input { margin: 0; }

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>程式碼壓縮與格式化</h1>
        <p class="sub">HTML、CSS、JavaScript、JSON：安全壓縮（只去註解與多餘空白）與簡易美化；全部在本機處理。</p>

        <div class="card">
            <div class="chips" id="langs" role="group" aria-label="語言"></div>
            <div class="chips" id="modes" role="group" aria-label="動作"></div>
            <label class="chk"><input type="checkbox" id="keep" checked> 保留條件註解與授權註解</label>
        </div>

        <div class="card">
            <label class="lb" for="src" style="margin-top:0">輸入</label>
            <textarea id="src" class="code" spellcheck="false" placeholder="貼上要處理的程式碼（上限 1MB）"></textarea>
            <div class="row" style="margin-top:8px">
                <button id="sample" class="sm">載入範例</button>
                <button id="clear" class="sm">清空</button>
            </div>
        </div>

        <div class="card">
            <label class="lb" for="dst" style="margin-top:0">結果</label>
            <textarea id="dst" class="code" readonly spellcheck="false" aria-label="處理結果"></textarea>
            <p id="stat" role="status"></p>
            <p id="ver" role="status"></p>
            <p id="err" role="alert"></p>
            <div class="row" style="margin-top:12px">
                <button class="primary" id="copy">複製結果</button>
                <button id="dl">下載</button>
                <button id="swap">結果放回輸入</button>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把 HTML、CSS、JavaScript、JSON 的程式碼壓小（去掉註解與多餘空白），或把擠成一團的程式碼排整齊。壓縮刻意做得保守：<b>只去註解與空白，不改變數名稱、不重寫程式</b>，所以結果的行為和原本一樣。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>要把小小的網頁、樣式或腳本縮小再貼到別處（信件、CMS、書籤腳本）。</li>
        <li>拿到被壓成一行的 CSS / JS，想先排整齊再看。</li>
        <li>想知道一份檔案去掉註解空白後能省多少。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點上方語言（貼上時會自動猜），再選「壓縮」或「美化」。</li>
        <li>把程式碼貼進「輸入」，結果即時出現在「結果」，並顯示「壓縮前後大小與百分比」。</li>
        <li>下方「驗證」會自動檢查結果有沒有被改壞（見下方說明）。</li>
        <li>按「複製結果」或「下載」；「結果放回輸入」可以接著做下一步（例如壓縮後再美化）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">CSS 輸入：
a { color : red ; }
/* 註解 */
.box > p { margin : 0 auto ; width: calc(100% - 10px) }
壓縮結果：
a{color:red}.box>p{margin:0 auto;width:calc(100% - 10px)}
（calc 裡的運算子空白一定保留；88 → 57 位元組，縮小 35.2%）</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>JavaScript</b>：用簡易分詞（能辨認字串、樣板字串、正規表示式與註解），保留換行、只壓縮行內空白與註解，避免換行被拿掉造成「自動補分號（ASI）」出錯，所以結果仍是多行；只有在 <code>{</code>、<code>;</code>、<code>,</code> 後面的換行會併起來。不會改名、不會刪沒用到的程式碼。這不是完整的語法分析器，極少見的寫法（例如在 <code>)</code> 後面直接接正規表示式）可能判斷錯，請以「驗證」為準。</li>
        <li>「保留條件註解與授權註解」預設勾選：保留 <code>/*! … */</code>、含 <code>@license</code> / <code>@preserve</code> 的註解與 HTML 條件註解；取消勾選就全部移除。</li>
        <li><b>CSS</b>：保留字串與 <code>url()</code>、calc 等括號內的運算子空白，去掉最後一個分號；不改數值與色碼。</li>
        <li><b>HTML</b>：<code>pre</code>、<code>textarea</code> 原樣保留，<code>script</code> / <code>style</code> 裡的內容用 JS / CSS 規則壓縮（不是 JS 的 <code>type</code>，如 text/template，原樣保留）；行內元素之間的空白保留成一個空格。條件註解（<code>&lt;!--[if IE]&gt;</code>）可勾選保留。</li>
        <li><b>JSON</b>：會先解析再輸出，格式錯誤會指出位置；超過 15 位的整數會失去精度，重複的鍵只保留最後一個。</li>
        <li><b>美化</b>是簡易版：CSS、HTML 以縮排為主，JS 是 token 層級（換行、大括號、分號）的縮排，不是完整 parser，複雜寫法排出來可能不好看，但不會改變程式內容。</li>
        <li><b>驗證</b>：JS 用瀏覽器 <code>new Function</code> 檢查壓縮前後都能編譯（ES module 的 import / export 無法編譯，會改只比對 token）並比對 token 序列；CSS 比對規則數、選擇器數與宣告數；HTML 比對標籤與屬性序列和文字內容；JSON 比對解析後的內容。</li>
        <li>單檔上限 1MB；不會儲存或上傳你貼的內容。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { download } = Util;

        // --- pure ---
        const MAX_BYTES = 1048576;
        const LANGS = ['html', 'css', 'js', 'json'];
        const LANG_NAMES = { html: 'HTML', css: 'CSS', js: 'JavaScript', json: 'JSON' };
        const byteLen = (s) => new TextEncoder().encode(String(s)).length;
        const pctSaved = (a, b) => (a ? Math.round((1 - b / a) * 1000) / 10 : 0);

        // ===== JavaScript 分詞（簡易：字串、樣板字串、正規表示式、註解、數字、識別字、運算子）=====
        const JS_RE_AFTER = new Set(['return', 'typeof', 'instanceof', 'in', 'of', 'new', 'delete', 'void', 'throw', 'case', 'do', 'else', 'yield', 'await']);
        const RE_WS = /\s+/y, RE_NUM = /0[xXbBoO][\da-fA-F_]+n?|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?n?/y, RE_WORD = /[\p{L}\p{N}_$\\\u200c\u200d]+/uy;
        const RE_OP = /(?:>>>=|\.\.\.|===|!==|\*\*=|<<=|>>=|>>>|&&=|\|\|=|\?\?=|=>|==|!=|<=|>=|&&|\|\||\?\?|\?\.(?!\d)|\+\+|--|\+=|-=|\*=|\/=|%=|&=|\|=|\^=|<<|>>|\*\*)/y;
        function scanString(s, i) {
            const q = s[i]; i++;
            while (i < s.length) { const c = s[i]; if (c === '\\') { i += 2; continue; } if (c === q) return i + 1; if (c === '\n') return i; i++; }
            return s.length;
        }
        function scanBraces(s, i) {   // i 在 "${" 之後；回傳對應 "}" 之後的位置
            let d = 1, last = '(';   // last：上一個非空白字元，用來判斷 / 是正規表示式還是除號
            while (i < s.length) {
                const c = s[i];
                if (c === '"' || c === "'") { i = scanString(s, i); last = 'x'; continue; }
                if (c === '`') { i = scanTemplate(s, i); last = 'x'; continue; }
                if (c === '/' && s[i + 1] === '/') { while (i < s.length && s[i] !== '\n') i++; continue; }
                if (c === '/' && s[i + 1] === '*') { const e = s.indexOf('*/', i + 2); i = e < 0 ? s.length : e + 2; continue; }
                if (c === '/' && /[(,=:[!&|?{};+\-*%<>~^]/.test(last)) { const e = scanRegex(s, i); if (e > 0) { i = e; last = 'x'; continue; } }
                if (c === '{') d++; else if (c === '}' && --d === 0) return i + 1;
                if (!/\s/.test(c)) last = c;
                i++;
            }
            return s.length;
        }
        function scanTemplate(s, i) {
            i++;
            while (i < s.length) {
                const c = s[i];
                if (c === '\\') { i += 2; continue; }
                if (c === '`') return i + 1;
                if (c === '$' && s[i + 1] === '{') { i = scanBraces(s, i + 2); continue; }
                i++;
            }
            return s.length;
        }
        function scanRegex(s, i) {   // 失敗回傳 -1
            let j = i + 1, cls = false;
            while (j < s.length) {
                const c = s[j];
                if (c === '\n' || c === '\r') return -1;
                if (c === '\\') { j += 2; continue; }
                if (cls) { if (c === ']') cls = false; } else if (c === '[') cls = true; else if (c === '/') { j++; while (j < s.length && /[A-Za-z]/.test(s[j])) j++; return j; }
                j++;
            }
            return -1;
        }
        const regexOk = (p) => !p || (p.k === 'p' ? !(p.v === ')' || p.v === ']' || p.v === '++' || p.v === '--') : p.k === 'word' && JS_RE_AFTER.has(p.v));
        // 回傳 [{k: ws|cm|hb|str|tpl|re|num|word|p, v}]；把 v 全部接起來就是原文
        function jsTokens(s) {
            s = String(s);
            const out = [], n = s.length; let i = 0, prev = null;
            const push = (k, v) => { const t = { k, v }; out.push(t); if (k !== 'ws' && k !== 'cm' && k !== 'hb') prev = t; i += v.length; };
            if (s.startsWith('#!')) { const e = s.indexOf('\n'); push('hb', e < 0 ? s : s.slice(0, e)); }
            while (i < n) {
                const c = s[i];
                RE_WS.lastIndex = i; if (RE_WS.test(s)) { push('ws', s.slice(i, RE_WS.lastIndex)); continue; }
                if (c === '/' && s[i + 1] === '/') { let e = i; while (e < n && s[e] !== '\n' && s[e] !== '\r' && s[e] !== '\u2028' && s[e] !== '\u2029') e++; push('cm', s.slice(i, e)); continue; }
                if (c === '/' && s[i + 1] === '*') { const e = s.indexOf('*/', i + 2); push('cm', s.slice(i, e < 0 ? n : e + 2)); continue; }
                if (c === '"' || c === "'") { push('str', s.slice(i, scanString(s, i))); continue; }
                if (c === '`') { push('tpl', s.slice(i, scanTemplate(s, i))); continue; }
                if (c === '/' && regexOk(prev)) { const e = scanRegex(s, i); if (e > 0) { push('re', s.slice(i, e)); continue; } }
                if ((c >= '0' && c <= '9') || (c === '.' && s[i + 1] >= '0' && s[i + 1] <= '9')) { RE_NUM.lastIndex = i; if (RE_NUM.test(s)) { push('num', s.slice(i, RE_NUM.lastIndex)); continue; } }
                RE_WORD.lastIndex = i; if (RE_WORD.test(s)) { push('word', s.slice(i, RE_WORD.lastIndex)); continue; }
                RE_OP.lastIndex = i; if (RE_OP.test(s)) { push('p', s.slice(i, RE_OP.lastIndex)); continue; }
                push('p', String.fromCodePoint(s.codePointAt(i)));
            }
            return out;
        }
        // 去掉空白與註解後的 token 序列（驗證用）
        const jsSig = (s) => jsTokens(s).filter(t => t.k !== 'ws' && t.k !== 'cm' && t.k !== 'hb').map(t => t.v).join('\u0001');
        const NL_RE = /[\n\r\u2028\u2029]/;
        const isWordCh = (c) => /[\p{L}\p{N}_$\\\u200c\u200d]/u.test(c);
        const keepCm = (v) => /^\/\*!|@license|@preserve/.test(v);
        // 兩個運算子接起來會變成別的運算子（+ + → ++、< = → <=、! => → !=）
        function opMerge(a, b) { if (a.k !== 'p' || b.k !== 'p') return false; RE_OP.lastIndex = 0; return RE_OP.test(a.v + b.v) && RE_OP.lastIndex > a.v.length; }
        function needSpace(a, b) {
            const ca = a.v[a.v.length - 1], cb = b.v[0];
            if (opMerge(a, b)) return true;
            return (isWordCh(ca) && isWordCh(cb)) || (ca === '/' && cb === '/') || (a.k === 'num' && cb === '.') || (ca === '.' && b.k === 'num');
        }
        // 保守壓縮：去註解、壓縮行內空白、把空白行與縮排去掉；換行保留（只有 { ; , 之後的換行併起來，這些之後不會觸發自動補分號）
        function minifyJS(src, o = {}) {
            const keepBang = o.keep !== false, toks = jsTokens(src), parts = []; let nl = false, sp = false, last = null, tailNl = true;   // 用陣列接字串並自己記「結尾是不是換行」，避免大檔反覆壓平字串變成 O(n²)
            for (const t of toks) {
                if (t.k === 'ws') { if (NL_RE.test(t.v)) nl = true; else sp = true; continue; }
                if (t.k === 'hb') { parts.push(t.v + '\n'); tailNl = true; continue; }
                if (t.k === 'cm') {
                    if (keepBang && keepCm(t.v)) { if (!tailNl) parts.push('\n'); parts.push(t.v + '\n'); tailNl = true; last = null; nl = false; sp = false; continue; }
                    if (t.v.startsWith('/*') && NL_RE.test(t.v)) nl = true; else sp = true;
                    continue;
                }
                if (!tailNl) {
                    if (nl) { if (!(last && last.k === 'p' && (last.v === '{' || last.v === ';' || last.v === ','))) parts.push('\n'); }
                    else if (sp && last && needSpace(last, t)) parts.push(' ');
                }
                parts.push(t.v); tailNl = false; last = t; nl = false; sp = false;
            }
            return parts.join('').replace(/\n+$/, '');
        }

        // ===== JavaScript 簡易美化（token 層級；不會改動任何 token，只調整空白與換行）=====
        const KW_SP = new Set(['if', 'for', 'while', 'switch', 'catch', 'with', 'return', 'typeof', 'void', 'delete', 'in', 'of', 'instanceof', 'new', 'await', 'yield', 'case', 'else', 'do', 'function', 'async', 'throw', 'var', 'let', 'const', 'import', 'export', 'from', 'default', 'extends']);
        const NOSP_AFTER = new Set(['(', '[', '.', '?.', '!', '~', '#', '@', '...']);
        function beautifyJS(src, ind = '  ') {
            const sig = []; let nlf = false;
            for (const t of jsTokens(src)) { if (t.k === 'ws') { if (NL_RE.test(t.v)) nlf = true; } else { sig.push({ k: t.k, v: t.v, nl: nlf }); nlf = false; } }
            let out = '', line = '', level = 0, lineLevel = 0, pd = 0, bd = 0, tern = 0, pend = false, uPrev = false, caseLbl = false, p = null, pp = null;
            const st = [];
            const add = (s) => { if (!line) lineLevel = level; line += s; };
            const brk = () => { if (line.trim()) out += ind.repeat(lineLevel) + line.trimEnd() + '\n'; line = ''; pend = false; };
            const isOperand = (x) => !!x && ((x.k === 'word' && !JS_RE_AFTER.has(x.v)) || x.k === 'num' || x.k === 'str' || x.k === 'tpl' || x.k === 're' || (x.k === 'p' && (x.v === ')' || x.v === ']')));
            const afterBrace = (nx) => { pend = !!nx && nx.k !== 'p' && nx.k !== 'cm' && !['else', 'catch', 'finally', 'while', 'in', 'of', 'instanceof'].includes(nx.v); };
            for (let i = 0; i < sig.length; i++) {
                const t = sig[i], nx = sig[i + 1], v = t.v, isP = t.k === 'p';
                if (t.k === 'hb') { out += v + '\n'; continue; }
                if (t.k === 'cm') {
                    if (t.nl && line.trim()) brk();
                    add((line ? ' ' : '') + v);
                    if (v.startsWith('//') || NL_RE.test(v) || pend) brk();
                    continue;
                }
                if ((pend || t.nl) && line.trim()) brk();
                const postfix = isP && (v === '++' || v === '--') && isOperand(p) && !t.nl;
                const unary = isP && (((v === '+' || v === '-') && !isOperand(p)) || ((v === '++' || v === '--') && !postfix));
                const afterDot = !!pp && (pp.v === '.' || pp.v === '?.');
                let sp = true;
                if (!p || !line) sp = false;
                else if (isP && [')', ']', ';', ',', '.', '?.'].includes(v)) sp = false;
                else if (isP && v === ':') sp = tern > 0;
                else if (postfix) sp = false;
                else if (p.k === 'p' && NOSP_AFTER.has(p.v)) sp = false;
                else if (uPrev) sp = (v[0] === '+' || v[0] === '-') && p.v[p.v.length - 1] === v[0];
                else if (isP && v === '(') sp = p.k === 'word' ? KW_SP.has(p.v) && !afterDot : p.k === 'p' ? ![')', ']', '}', '++', '--'].includes(p.v) : false;
                else if (isP && v === '[') sp = p.k === 'word' ? KW_SP.has(p.v) && !afterDot : p.k === 'p' ? ![')', ']', '}'].includes(p.v) : false;
                else if (t.k === 'tpl' && p.k === 'word' && !KW_SP.has(p.v)) sp = false;
                if (!sp && p && line && needSpace(p, t)) sp = true;   // 不留空白會讓兩個 token 黏成別的 token 時一定要留
                if (isP && v === '{') {
                    if (nx && nx.k === 'p' && nx.v === '}') { add((sp ? ' ' : '') + '{}'); i++; p = nx; pp = t; uPrev = false; afterBrace(sig[i + 1]); continue; }
                    add((sp ? ' ' : '') + '{'); st.push({ pd, bd, tern, caseLbl }); pd = bd = tern = 0; caseLbl = false; level++; pend = true;
                } else if (isP && v === '}') {
                    if (line.trim()) brk();
                    const s = st.pop(); if (s) { pd = s.pd; bd = s.bd; tern = s.tern; caseLbl = s.caseLbl; }
                    level = Math.max(0, level - 1); add('}'); afterBrace(nx);
                } else {
                    add((sp ? ' ' : '') + v);
                    if (isP) {
                        if (v === ';') { if (pd === 0) pend = true; }
                        else if (v === ',') { if (pd === 0 && bd === 0) pend = true; }
                        else if (v === '(') pd++; else if (v === ')') pd = Math.max(0, pd - 1);
                        else if (v === '[') bd++; else if (v === ']') bd = Math.max(0, bd - 1);
                        else if (v === '?') tern++;
                        else if (v === ':') { if (tern > 0) tern--; else if (caseLbl && pd === 0) { caseLbl = false; pend = true; } }
                    } else if (t.k === 'word' && !afterDot && pd === 0 && (v === 'case' || (v === 'default' && nx && nx.v === ':'))) caseLbl = true;
                }
                uPrev = unary; pp = p; p = t;
            }
            brk();
            return out.replace(/\n+$/, '');
        }

        // ===== CSS =====
        // 分詞：cm 註解、str 字串、url 未加引號的 url(...)、ws 空白、c 單一字元（含 \ 跳脫）
        function cssTokens(s) {
            s = String(s); const out = [], n = s.length; let i = 0;
            while (i < n) {
                const c = s[i]; let e = -1, k = 'c';

        $('#dl').onclick = () => { if (!lastOut) return; download(new Blob([lastOut], { type: 'text/plain;charset=utf-8' }), (mode === 'minify' ? 'min.' : 'pretty.') + ({ html: 'html', css: 'css', js: 'js', json: 'json' })[lang]); };
        renderBtns();
    </script>
</body>

</html>
