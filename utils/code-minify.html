    <template id="help">
        <h3>這是什麼</h3>
        <p>把 HTML、CSS、JavaScript、JSON 的程式碼壓小（去掉註解與多餘空白），或把擠成一團的程式碼排整齊。壓縮刻意做得保守：<b>只去註解與空白，不改變數名稱、不重寫程式</b>，所以結果的行為和原本一樣。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>要把小小的網頁、樣式或腳本縮小再貼到別處（信件、CMS、書籤腳本）。</li>
        <li>拿到被壓成一行的 CSS / JS，想先排整齊再看。</li>
        <li>想知道一份檔案去掉註解空白後能省多少。</li>
        <li>設計工具匯出的 SVG 很肥，想去掉多餘資訊並預覽、轉成 data URI 放進 CSS。</li>
        <li>要把巢狀的 SCSS 攤成純 CSS，或把平的 CSS 整理成巢狀寫法。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點上方語言（貼上時會自動猜），再選「壓縮」或「美化」。</li>
        <li>把程式碼貼進「輸入」，結果即時出現在「結果」，並顯示「壓縮前後大小與百分比」。</li>
        <li>下方「驗證」會自動檢查結果有沒有被改壞（見下方說明）。</li>
        <li>按「複製結果」或「下載」；「結果放回輸入」可以接著做下一步（例如壓縮後再美化）。</li>
        <li>SVG：選「SVG」，貼上程式碼，下方會並排預覽「原始 / 處理後」；「優化」會移除註解、metadata、編輯器專用屬性、預設值與沒用到的 id，並把路徑數字四捨五入到「小數位數」；可複製 data URI 或 CSS background。</li>
        <li>SVG path 視覺化：頁面下方展開「SVG path 視覺化」，貼上 path 的 d 屬性（支援 M L H V C S Q T A Z，大小寫皆可）。會逐條列出每個指令的意思、在畫布上畫出路徑並標出端點（實心圓）與控制點（空心方塊）；拖曳它們會即時改寫 d。按「手勢」可在「拖曳端點」與「捲動頁面」之間切換（手機上拖曳預覽會鎖住該區的捲動）。</li>
        <li>CSS ⇄ SCSS：選「CSS ⇄ SCSS」，「展平」把巢狀規則攤開（&amp; 換成父選擇器，@media 往外冒泡），「巢狀化」把連續、開頭相同的規則收成巢狀。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">CSS 輸入：
a { color : red ; }
/* 註解 */
.box > p { margin : 0 auto ; width: calc(100% - 10px) }
壓縮結果：
a{color:red}.box>p{margin:0 auto;width:calc(100% - 10px)}
（calc 裡的運算子空白一定保留；88 → 57 位元組，縮小 35.2%）</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>JavaScript</b>：用簡易分詞（能辨認字串、樣板字串、正規表示式與註解），保留換行、只壓縮行內空白與註解，避免換行被拿掉造成「自動補分號（ASI）」出錯，所以結果仍是多行；只有在 <code>{</code>、<code>;</code>、<code>,</code> 後面的換行會併起來。不會改名、不會刪沒用到的程式碼。這不是完整的語法分析器，極少見的寫法（例如在 <code>)</code> 後面直接接正規表示式）可能判斷錯，請以「驗證」為準。</li>
        <li>「保留條件註解與授權註解」預設勾選：保留 <code>/*! … */</code>、含 <code>@license</code> / <code>@preserve</code> 的註解與 HTML 條件註解；取消勾選就全部移除。</li>
        <li><b>CSS</b>：保留字串與 <code>url()</code>、calc 等括號內的運算子空白，去掉最後一個分號；不改數值與色碼。</li>
        <li><b>HTML</b>：<code>pre</code>、<code>textarea</code> 原樣保留，<code>script</code> / <code>style</code> 裡的內容用 JS / CSS 規則壓縮（不是 JS 的 <code>type</code>，如 text/template，原樣保留）；行內元素之間的空白保留成一個空格。條件註解（<code>&lt;!--[if IE]&gt;</code>）可勾選保留。</li>
        <li><b>JSON</b>：會先解析再輸出，格式錯誤會指出位置；超過 15 位的整數會失去精度，重複的鍵只保留最後一個。</li>
        <li><b>美化</b>是簡易版：CSS、HTML 以縮排為主，JS 是 token 層級（換行、大括號、分號）的縮排，不是完整 parser，複雜寫法排出來可能不好看，但不會改變程式內容。</li>
        <li><b>驗證</b>：JS 用瀏覽器 <code>new Function</code> 檢查壓縮前後都能編譯（ES module 的 import / export 無法編譯，會改只比對 token）並比對 token 序列；CSS 比對規則數、選擇器數與宣告數；HTML 比對標籤與屬性序列和文字內容；JSON 比對解析後的內容。</li>
        <li><b>SVG 優化</b>：預覽用 <code>&lt;img&gt;</code> 載入 data URI，SVG 裡的腳本不會執行、也不會載入外部資源，內容也不會被插進頁面。圖形不改寫：只移除多餘內容、壓縮路徑（弧線的旗標會正確處理）與數字、縮短色碼；預設值屬性只在整份文件都沒有其他設定、也沒有 style / script 時才移除。小數位數太少會讓細節變粗，請看預覽。保留 title / desc（無障礙用）。驗證只比對繪圖元素數量。</li>
        <li><b>CSS ⇄ SCSS</b> 只處理巢狀規則與 &amp; 選擇器（含 &amp;-suffix、&amp;:hover、@media 冒泡）。變數（$x）、mixin、@include、@if / @each、函式與運算<b>不會被計算</b>，只原樣保留；<code>//</code> 行註解在轉成 CSS 時會被移除。巢狀化只收連續的規則、不改變規則先後順序，逗號選擇器與 @keyframes 不處理。驗證比對所有宣告的內容與數量。</li>
        <li><b>SVG path 視覺化</b>：d 上限 20000 字元、2000 條指令，超過或格式錯誤會顯示原因（錯誤前已解析的部分仍會畫出）；拖曳端點後 d 會改寫成「絕對座標、每條指令都寫出字母、小數 2 位」，H / V 被拖到斜向位置時會改成 L；平滑曲線（S / T）的第一個控制點是由上一段反射出來的，不能直接拖（畫成虛線方塊）。弧線只能拖終點，半徑與旗標請直接改文字。內容只在本機處理。</li>
        <li>單檔上限 1MB；不會儲存或上傳你貼的內容。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { download } = Util;

        // --- pure ---
        const MAX_BYTES = 1048576;
        const LANGS = ['html', 'css', 'js', 'json', 'svg', 'scss'];
        const LANG_NAMES = { html: 'HTML', css: 'CSS', js: 'JavaScript', json: 'JSON', svg: 'SVG', scss: 'CSS ⇄ SCSS' };
        const byteLen = (s) => new TextEncoder().encode(String(s)).length;
        const pctSaved = (a, b) => (a ? Math.round((1 - b / a) * 1000) / 10 : 0);

        // ===== JavaScript 分詞（簡易：字串、樣板字串、正規表示式、註解、數字、識別字、運算子）=====
        const JS_RE_AFTER = new Set(['return', 'typeof', 'instanceof', 'in', 'of', 'new', 'delete', 'void', 'throw', 'case', 'do', 'else', 'yield', 'await']);
        const RE_WS = /\s+/y, RE_NUM = /0[xXbBoO][\da-fA-F_]+n?|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?n?/y, RE_WORD = /[\p{L}\p{N}_$\\\u200c\u200d]+/uy;
        const RE_OP = /(?:>>>=|\.\.\.|===|!==|\*\*=|<<=|>>=|>>>|&&=|\|\|=|\?\?=|=>|==|!=|<=|>=|&&|\|\||\?\?|\?\.(?!\d)|\+\+|--|\+=|-=|\*=|\/=|%=|&=|\|=|\^=|<<|>>|\*\*)/y;
        function scanString(s, i) {
            const q = s[i]; i++;
            while (i < s.length) { const c = s[i]; if (c === '\\') { i += 2; continue; } if (c === q) return i + 1; if (c === '\n') return i; i++; }
            return s.length;
        }
        function scanBraces(s, i) {   // i 在 "${" 之後；回傳對應 "}" 之後的位置
            let d = 1, last = '(';   // last：上一個非空白字元，用來判斷 / 是正規表示式還是除號
            while (i < s.length) {
                const c = s[i];
                if (c === '"' || c === "'") { i = scanString(s, i); last = 'x'; continue; }
                if (c === '`') { i = scanTemplate(s, i); last = 'x'; continue; }
                if (c === '/' && s[i + 1] === '/') { while (i < s.length && s[i] !== '\n') i++; continue; }
                if (c === '/' && s[i + 1] === '*') { const e = s.indexOf('*/', i + 2); i = e < 0 ? s.length : e + 2; continue; }
                if (c === '/' && /[(,=:[!&|?{};+\-*%<>~^]/.test(last)) { const e = scanRegex(s, i); if (e > 0) { i = e; last = 'x'; continue; } }
                if (c === '{') d++; else if (c === '}' && --d === 0) return i + 1;
                if (!/\s/.test(c)) last = c;
                i++;
            }
            return s.length;
        }
        function scanTemplate(s, i) {
            i++;
            while (i < s.length) {
                const c = s[i];
                if (c === '\\') { i += 2; continue; }
                if (c === '`') return i + 1;
                if (c === '$' && s[i + 1] === '{') { i = scanBraces(s, i + 2); continue; }
                i++;
            }
            return s.length;
        }
        function scanRegex(s, i) {   // 失敗回傳 -1
            let j = i + 1, cls = false;
            while (j < s.length) {
                const c = s[j];
                if (c === '\n' || c === '\r') return -1;
                if (c === '\\') { j += 2; continue; }
                if (cls) { if (c === ']') cls = false; } else if (c === '[') cls = true; else if (c === '/') { j++; while (j < s.length && /[A-Za-z]/.test(s[j])) j++; return j; }
                j++;
            }
            return -1;
        }
        const regexOk = (p) => !p || (p.k === 'p' ? !(p.v === ')' || p.v === ']' || p.v === '++' || p.v === '--') : p.k === 'word' && JS_RE_AFTER.has(p.v));
        // 回傳 [{k: ws|cm|hb|str|tpl|re|num|word|p, v}]；把 v 全部接起來就是原文
        function jsTokens(s) {
            s = String(s);
            const out = [], n = s.length; let i = 0, prev = null;
            const push = (k, v) => { const t = { k, v }; out.push(t); if (k !== 'ws' && k !== 'cm' && k !== 'hb') prev = t; i += v.length; };
            if (s.startsWith('#!')) { const e = s.indexOf('\n'); push('hb', e < 0 ? s : s.slice(0, e)); }
            while (i < n) {
                const c = s[i];
                RE_WS.lastIndex = i; if (RE_WS.test(s)) { push('ws', s.slice(i, RE_WS.lastIndex)); continue; }
                if (c === '/' && s[i + 1] === '/') { let e = i; while (e < n && s[e] !== '\n' && s[e] !== '\r' && s[e] !== '\u2028' && s[e] !== '\u2029') e++; push('cm', s.slice(i, e)); continue; }
                if (c === '/' && s[i + 1] === '*') { const e = s.indexOf('*/', i + 2); push('cm', s.slice(i, e < 0 ? n : e + 2)); continue; }
                if (c === '"' || c === "'") { push('str', s.slice(i, scanString(s, i))); continue; }
                if (c === '`') { push('tpl', s.slice(i, scanTemplate(s, i))); continue; }
                if (c === '/' && regexOk(prev)) { const e = scanRegex(s, i); if (e > 0) { push('re', s.slice(i, e)); continue; } }
                if ((c >= '0' && c <= '9') || (c === '.' && s[i + 1] >= '0' && s[i + 1] <= '9')) { RE_NUM.lastIndex = i; if (RE_NUM.test(s)) { push('num', s.slice(i, RE_NUM.lastIndex)); continue; } }
                RE_WORD.lastIndex = i; if (RE_WORD.test(s)) { push('word', s.slice(i, RE_WORD.lastIndex)); continue; }
                RE_OP.lastIndex = i; if (RE_OP.test(s)) { push('p', s.slice(i, RE_OP.lastIndex)); continue; }
                push('p', String.fromCodePoint(s.codePointAt(i)));
            }
            return out;
        }
        // 去掉空白與註解後的 token 序列（驗證用）
        const jsSig = (s) => jsTokens(s).filter(t => t.k !== 'ws' && t.k !== 'cm' && t.k !== 'hb').map(t => t.v).join('\u0001');
        const NL_RE = /[\n\r\u2028\u2029]/;
        const isWordCh = (c) => /[\p{L}\p{N}_$\\\u200c\u200d]/u.test(c);
        const keepCm = (v) => /^\/\*!|@license|@preserve/.test(v);
        // 兩個運算子接起來會變成別的運算子（+ + → ++、< = → <=、! => → !=）
        function opMerge(a, b) { if (a.k !== 'p' || b.k !== 'p') return false; RE_OP.lastIndex = 0; return RE_OP.test(a.v + b.v) && RE_OP.lastIndex > a.v.length; }
        function needSpace(a, b) {
            const ca = a.v[a.v.length - 1], cb = b.v[0];
            if (opMerge(a, b)) return true;
            return (isWordCh(ca) && isWordCh(cb)) || (ca === '/' && cb === '/') || (a.k === 'num' && cb === '.') || (ca === '.' && b.k === 'num');
        }
