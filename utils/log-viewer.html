    <div class="wrap">

        <h1>日誌與錯誤檢視</h1>
        <p class="sub">貼上或載入日誌，篩選、統計、整理錯誤堆疊；檔案只在這個瀏覽器處理，不上傳。</p>

    <template id="help">
        <h3>這是什麼</h3>
        <p>看日誌與錯誤的工具。貼上文字或載入日誌檔，自動辨識格式並篩選、統計；也能把一大段例外堆疊整理成「錯誤鏈 + 你的程式碼行」。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>伺服器日誌太長，想只看 ERROR、某段時間、或含某個關鍵字的行。</li>
            <li>每行一個 JSON 的結構化日誌，想當表格看並依欄位篩選排序。</li>
            <li>貼到 Issue / 聊天室前，想把上百行堆疊縮成幾行重點。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li><b>日誌檢視</b>：貼上文字或「載入檔案」。格式自動辨識（nginx / Apache combined、syslog、Java / Log4j / Logback、Python logging、每行 JSON），也可手動指定。用等級勾選、起訖時間、關鍵字或正則篩選；點一行展開原始內容與多行堆疊；勾「折疊連續重複」把相同訊息合併成 ×N。</li>
            <li><b>JSON Lines</b>：每行一個 JSON 物件，顯示成欄位表。點欄位標題排序，用下拉選欄位與條件篩選；壞行會列出行號。</li>
            <li><b>Stack trace 整理</b>：貼上堆疊，自動辨識 Java、Python、JavaScript（Node 與瀏覽器）、.NET、Go panic。框架庫呼叫會折疊；在「專案前綴」填你的套件名或路徑（例如 <kbd>com.mycorp</kbd>、<kbd>/app/src/</kbd>）可把專案程式碼行標藍。「精簡版」可一鍵複製。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">2024-05-01 10:00:01,123 ERROR [main] c.a.Foo - 連線失敗
        → 等級 ERROR、時間 2024-05-01 10:00:01，其後的 at ... 行會併入這一筆
        Caused by: java.net.ConnectException → 在 Stack trace 分頁顯示成錯誤鏈</div>
        <h3>小提醒</h3>
        <ul>
            <li>檔案上限 20MB、只解析前 200,000 行（會提示）；列表一次最多顯示 500 筆，請用篩選縮小範圍。</li>
            <li>時間一律以日誌上寫的「牆上時鐘」為準，忽略時區；起訖時間格式 <kbd>YYYY-MM-DD HH:mm</kbd>。syslog 沒有年份，以今年計。</li>
            <li>檔案以 UTF-8 讀取；其他編碼可先用「編碼修復」工具轉換。</li>
            <li>不存任何資料：重新整理就清空，沒有 localStorage；日誌內容不會離開你的瀏覽器。</li>
            <li>框架庫與專案程式碼是用常見前綴推測的，結果僅供參考。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { copyWithFeedback, esc } = Util;

        // --- pure ---
        const LEVELS = ['ERROR', 'WARN', 'INFO', 'DEBUG'];
        const LIM = { bytes: 20 * 1024 * 1024, lines: 200000, rows: 500, cols: 60, bad: 100, stack: 300000 };
        const MON = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

        function splitLines(text, max = LIM.lines) {
            text = String(text ?? '');
            const lines = []; let p = 0, truncated = false;
            while (p <= text.length) {
                if (lines.length >= max) { truncated = p < text.length; break; }
                let e = text.indexOf('\n', p); if (e < 0) e = text.length;
                let l = text.slice(p, e); if (l.endsWith('\r')) l = l.slice(0, -1);
                lines.push(l); p = e + 1;
            }
            if (lines.length && lines[lines.length - 1] === '' && !truncated) lines.pop();
            return { lines, truncated };
        }
        function normLevel(s) {
            if (typeof s === 'number') return s <= 20 ? 'DEBUG' : s <= 30 ? 'INFO' : s <= 40 ? 'WARN' : 'ERROR';
            s = String(s ?? '').trim().toUpperCase();
            if (/^\d+$/.test(s)) return normLevel(+s);
            if (/^(ERR|FATAL|SEVERE|CRIT|EMERG|ALERT|PANIC)/.test(s)) return 'ERROR';
            if (/^WARN/.test(s)) return 'WARN';
            if (/^(INFO|NOTICE|LOG)/.test(s)) return 'INFO';
            if (/^(DEBUG|TRACE|VERBOSE|FINE)/.test(s)) return 'DEBUG';
            return '';
        }
        const guessLevel = (s, dflt = '') => /\b(error|fail(ed|ure)?|fatal|exception|panic|denied)\b/i.test(s) ? 'ERROR' : /\bwarn(ing)?\b/i.test(s) ? 'WARN' : dflt;
        const mk = (y, mo, d, h = 0, mi = 0, s = 0, ms = 0) => (mo < 0 || mo > 11 || d < 1 || d > 31 || h > 23 || mi > 59 || s > 59) ? null : Date.UTC(y, mo, d, h, mi, s, ms);
        // 時間一律當作「牆上時鐘」（忽略時區）轉成 UTC 毫秒；無法辨識回傳 null
        function parseTime(s, year = new Date().getUTCFullYear()) {
            if (typeof s === 'number') { if (!Number.isFinite(s) || s <= 0) return null; return s < 1e11 ? Math.round(s * 1000) : s; }
            s = String(s ?? '').trim(); if (!s) return null;
            let m = /^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d)(?::(\d\d)(?:[.,](\d+))?)?)?/.exec(s);
            if (m) return mk(+m[1], +m[2] - 1, +m[3], +m[4] || 0, +m[5] || 0, +m[6] || 0, m[7] ? +m[7].slice(0, 3).padEnd(3, '0') : 0);
            m = /^(\d\d?)\/([A-Za-z]{3})\/(\d{4}):(\d\d):(\d\d):(\d\d)/.exec(s);
            if (m && m[2] in MON) return mk(+m[3], MON[m[2]], +m[1], +m[4], +m[5], +m[6]);
            m = /^([A-Z][a-z]{2})\s+(\d\d?)\s+(\d\d):(\d\d):(\d\d)/.exec(s);
            if (m && m[1] in MON) return mk(year, MON[m[1]], +m[2], +m[3], +m[4], +m[5]);
            if (/^\d{9,13}(\.\d+)?$/.test(s)) return parseTime(+s);
            return null;
        }
        function parseJsonLine(line) {
            const t = line.trim();
            if (t[0] !== '{') return null;
            try { const o = JSON.parse(t); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch { return null; }
        }
        const pick = (o, keys) => { for (const k of keys) if (o[k] !== undefined && o[k] !== null) return o[k]; };
        const RE_TS = '\\d{4}-\\d\\d-\\d\\d[T ]\\d\\d:\\d\\d:\\d\\d(?:[.,]\\d+)?(?:Z|[+-]\\d\\d:?\\d\\d)?';
        const RE_COMBINED = /^(\S+) \S+ \S+ \[([^\]]+)\] "((?:[^"\\]|\\.)*)" (\d{3}) (\S+)/;
        const RE_SYSLOG = /^(?:<\d+>)?([A-Z][a-z]{2}\s+\d\d?\s+\d\d:\d\d:\d\d)\s+(\S+)\s+([^\s:[]+)(?:\[\d+\])?:\s?(.*)$/;
        const RE_JAVA = new RegExp('^(' + RE_TS + ')\\s+(?:\\[[^\\]]*\\]\\s+)?\\[?(TRACE|DEBUG|INFO|NOTICE|WARN(?:ING)?|ERROR|FATAL|SEVERE|CRITICAL)\\]?\\s+(.*)$', 'i');
        const RE_PY1 = new RegExp('^(' + RE_TS + ') - (\\S+) - (DEBUG|INFO|WARNING|ERROR|CRITICAL) - (.*)$');
        const RE_PY2 = /^(DEBUG|INFO|WARNING|ERROR|CRITICAL):([\w.\-]+):(.*)$/;
        // 每種格式：行 → { time, level, msg } 或 null
        const PARSERS = {
            json(line) {
                const o = parseJsonLine(line); if (!o) return null;
                const m = pick(o, ['msg', 'message', 'log', 'event', 'text']);
                return { time: parseTime(pick(o, ['time', 'timestamp', '@timestamp', 'ts', 't', 'datetime', 'date'])), level: normLevel(pick(o, ['level', 'severity', 'lvl', 'levelname'])), msg: m === undefined ? line.trim() : typeof m === 'string' ? m : JSON.stringify(m) };
            },
            combined(line) {
                const m = RE_COMBINED.exec(line); if (!m) return null;
                const st = +m[4];
                return { time: parseTime(m[2]), level: st >= 500 ? 'ERROR' : st >= 400 ? 'WARN' : 'INFO', msg: `${m[1]} "${m[3]}" ${m[4]} ${m[5]}` };
            },
            java(line) {
                const m = RE_JAVA.exec(line); if (!m) return null;
                return { time: parseTime(m[1]), level: normLevel(m[2]), msg: m[3] };
            },
            python(line) {
                let m = RE_PY1.exec(line);
                if (m) return { time: parseTime(m[1]), level: normLevel(m[3]), msg: `${m[2]} - ${m[4]}` };
                m = RE_PY2.exec(line);
                return m ? { time: null, level: normLevel(m[1]), msg: `${m[2]}:${m[3]}` } : null;
            },
            syslog(line, year) {
                const m = RE_SYSLOG.exec(line); if (!m) return null;
                return { time: parseTime(m[1], year), level: guessLevel(m[4], 'INFO'), msg: `${m[2]} ${m[3]}: ${m[4]}` };
            },
        };
        const FMT_ORDER = ['json', 'combined', 'java', 'python', 'syslog'];
        const FMT_LABELS = { auto: '自動辨識', json: '每行 JSON', combined: 'nginx / Apache combined', java: 'Java / Log4j / Logback', python: 'Python logging', syslog: 'syslog', plain: '純文字' };
        function detectFormat(lines) {
            const sample = []; for (let i = 0; i < lines.length && sample.length < 100; i++) if (lines[i].trim()) sample.push(lines[i]);
            if (!sample.length) return 'plain';
            let best = 'plain', bestN = 0;
            for (const f of FMT_ORDER) { let n = 0; for (const l of sample) if (PARSERS[f](l)) n++; if (n > bestN) { best = f; bestN = n; } }
            return bestN >= Math.max(1, sample.length * 0.3) ? best : 'plain';
        }
        // 解析整份日誌 → { fmt, entries, truncated }；entry = { n 行號, time, level, msg, raw, bad }
        function parseLog(text, { fmt = 'auto', max = LIM.lines, year = new Date().getUTCFullYear() } = {}) {
            const { lines, truncated } = splitLines(text, max);
            if (fmt === 'auto' || !(fmt in FMT_LABELS)) fmt = detectFormat(lines);
            const P = PARSERS[fmt], entries = []; let cur = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i]; if (!line.trim()) continue;
                const p = P ? P(line, year) : null;
                if (p) { cur = { n: i + 1, time: p.time, level: p.level, msg: p.msg, raw: line, bad: false }; entries.push(cur); }
                else if (fmt === 'json') { cur = null; entries.push({ n: i + 1, time: null, level: '', msg: line, raw: line, bad: true }); }
                else if (P && cur) cur.raw += '\n' + line;      // 多行訊息 / 堆疊併入上一筆
                else { cur = { n: i + 1, time: fmt === 'plain' ? parseTime(line) : null, level: guessLevel(line), msg: line, raw: line, bad: false }; entries.push(cur); if (fmt !== 'plain') cur = null; }
            }
            return { fmt, entries, truncated };
        }
        function makeMatcher(q, isRe) {
            q = String(q ?? ''); if (!q) return { fn: null };
            if (isRe) { let re; try { re = new RegExp(q, 'i'); } catch (e) { return { err: '正規表示式錯誤：' + e.message }; } return { fn: (s) => re.test(s) }; }
            const l = q.toLowerCase(); return { fn: (s) => s.toLowerCase().includes(l) };
        }
        // levels：要顯示的等級陣列（含 '?' 代表無等級）；from / to 為毫秒或 null
        function filterEntries(entries, { levels = null, from = null, to = null, q = '', isRe = false } = {}) {
            const m = makeMatcher(q, isRe); if (m.err) return { idx: [], err: m.err };
            const lv = levels ? new Set(levels) : null, idx = [];
            for (let i = 0; i < entries.length; i++) {
                const e = entries[i];
                if (lv && !lv.has(e.level || '?')) continue;
                if (from !== null && (e.time === null || e.time < from)) continue;
                if (to !== null && (e.time === null || e.time > to)) continue;

        ['#stk', '#pfx', '#showLib'].forEach(s => { $(s).oninput = $(s).onchange = renderStack; });
        const LANG = { java: 'Java', python: 'Python', js: 'JavaScript', dotnet: '.NET', go: 'Go', unknown: '無法辨識' };
        const ROLE = { main: '例外', cause: 'Caused by', context: '處理時又發生', suppressed: 'Suppressed', goroutine: 'goroutine' };
        function renderStack() {
            const text = $('#stk').value, res = parseStack(text, $('#pfx').value), keepLib = $('#showLib').checked, ri = rootIndex(res);
            $('#sInfo').textContent = !text.trim() ? '貼上堆疊後顯示結果。' : `語言：${LANG[res.lang]}；${res.counts.blocks} 段、${res.counts.frames} 個框架（框架庫 ${res.counts.lib}、專案 ${res.counts.mine}）`;
            $('#sOut').replaceChildren(...res.blocks.map((b, bi) => {
                const box = h('div', { class: 'blk' });
                if (b.sep) box.append(h('p', { class: 'note' }, b.sep));
                box.append(h('div', { class: 'bh' }, h('span', { class: 'role' }, ROLE[b.role] || b.role), ...(bi === ri ? [h('span', { class: 'role' }, '根因')] : []), b.head || '（無訊息行）'));
                let run = [];
                const flush = () => { if (run.length) { box.append(h('details', { class: 'lg' }, h('summary', {}, `${run.length} 個框架庫呼叫`), ...run.map(f => h('div', { class: 'fr lib' }, f.text)))); run = []; } };
                for (const f of b.frames) { if (f.kind === 'lib' && !keepLib) run.push(f); else { flush(); box.append(h('div', { class: 'fr ' + f.kind }, f.text)); } }
                flush();
                b.extra.forEach(x => box.append(h('div', { class: 'fr lib' }, x.trim())));
                if (b.tail) box.append(h('div', { class: 'bh' }, b.tail));
                return box;
            }));
            const c = res.blocks.length ? compactStack(res, { keepLib }) : '';
            $('#sCopy').hidden = !c; $('#sText').textContent = c;
        }
        $('#sBtn').onclick = () => copyWithFeedback($('#sBtn'), $('#sText').textContent);

        showTab(0);
    </script>
</body>

</html>
