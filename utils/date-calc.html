    <template id="help">
        <h3>這是什麼</h3>
        <p>日期計算四合一：兩個日期相差多久、某日期加減一段時間是哪天、某一天的各種資訊，以及依出生日期算年齡、星座、生肖。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>算專案還有幾天、幾個工作日</li>
        <li>合約「30 天後到期」「3 個月後續約」要查正確日期</li>
        <li>想知道某天是星期幾、今年第幾天、第幾週</li>
        <li>算實足年齡、星座、生肖、農曆生日，或還有幾天過生日、哪天活滿 10000 天</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「日期相差」：選「從」與「到」，看天數、週數、年月日與工作日數（起訖日都算）；順序反了會自動對調</li>
        <li>「日期加減」：選起始日、之後 / 之前、數量與單位（天、週、個月、年、個工作日）</li>
        <li>「日期資訊」：選一個日期，看星期、今年第幾天、ISO 週次、該月天數、是否閏年、距今幾天</li>
        <li>「生日 / 星座」下方可建立「家人朋友生日」清單：姓名、國曆或農曆生日、備註，顯示年齡、星座生肖、下次生日倒數（7 / 30 天內會標示），可複製文字或下載 ICS 匯入行事曆</li>
        <li>「生日 / 星座」：選出生日期（會記在本機，下次自動帶入），「計算到」預設今天；顯示年齡（年月日）、活了幾天、出生那天星期幾、星座與元素、農曆生日、天干地支、生肖、下次生日、第 10000 / 20000 天</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">日期加減：起始日 <b>2026-10-03</b>、之後 <b>30</b> 天，結果是 <b>2026-11-02（週一）</b>。<br>日期相差：2026-10-03 到 2027-01-11 共 100 天，約 14 週 2 天，工作日 71 天。<br>生日 / 星座：出生日期 <b>2000-01-01</b>、計算到 <b>2026-10-03</b>，26 歲（26 年 9 個月 2 天）；出生那天是星期六；星座摩羯座；農曆生日 1999 年十一月 25 日，己卯年，屬兔（2000 年春節還沒到，生肖算前一年）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>工作日只排除週六日，不含國定假日與補班</li>
        <li>月份加減遇到月底（例如 1/31 加 1 個月）會取當月最後一天</li>
        <li>生日 / 星座只是日期計算，不做運勢；生肖與天干地支依<b>農曆新年</b>換算，1～2 月出生要特別注意</li>
        <li>2/29 出生的人，非閏年的生日算 2/28；農曆換算靠瀏覽器內建功能，太舊的瀏覽器可能無法顯示</li>
        <li>出生日期只存在你的瀏覽器（可用右上角「💾」備份），不會上傳；清除請把日期欄清空或清除瀏覽器網站資料</li>
        <li>「家人朋友生日」清單最多 200 人，滿了會拒絕新增；每筆可編輯或刪除，「清除全部」會先確認、無法復原（備份可用右上角「💾」）</li>
        <li>農曆生日每年對應的國曆日期不同；該年沒有那個閏月就當平月算，農曆 30 日遇到只有 29 天的月份算月底。ICS 國曆生日每年重複，農曆生日只列之後 5 年</li>
        <li>所有計算都在本機完成</li>
        </ul>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day, statRow, store } = Util;

        // --- pure ---
        const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
        const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
        const daysInMonth = (y, m) => [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
        const weekday = (s) => (((day.num(s) + 4) % 7) + 7) % 7;                 // 0 = 週日（1970-01-01 是週四）
        const isWorkday = (s) => { const w = weekday(s); return w !== 0 && w !== 6; };

        const { addMonths, diffYMD } = day;                                       // 共用（shared/js/util.js）

        // 含起訖日的工作日數（a ≤ b）
        function workdaysBetween(a, b) {
            let n = 0;
            for (let x = a, end = day.num(b); day.num(x) <= end; x = day.shift(x, 1)) if (isWorkday(x)) n++;
            return n;
        }

        // 往後（n > 0）或往前（n < 0）數 n 個工作日；起始日本身不算
        function addWorkdays(s, n) {
            const step = n < 0 ? -1 : 1;
            for (let left = Math.abs(n); left > 0;) { s = day.shift(s, step); if (isWorkday(s)) left--; }
            return s;
        }

        const dayOfYear = (s) => day.between(day.ymd(day.parse(s).y, 1, 1), s) + 1;

        // ISO 8601 週次：該週的週四所在的年，決定週所屬年份
        function isoWeek(s) {
            const thu = day.shift(s, 3 - ((weekday(s) + 6) % 7));
            const y = day.parse(thu).y;
            return { year: y, week: Math.floor(day.between(day.ymd(y, 1, 1), thu) / 7) + 1 };
        }
        const ZODIAC = ['鼠', '牛', '虎', '兔', '龍', '蛇', '馬', '羊', '猴', '雞', '狗', '豬'];
        const STEMS = '甲乙丙丁戊己庚辛壬癸', BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
        // 星座：[開始月, 開始日, 名稱, 元素]；12/22 起是摩羯
        const SIGNS = [[1, 20, '水瓶座', '風'], [2, 19, '雙魚座', '水'], [3, 21, '牡羊座', '火'], [4, 20, '金牛座', '土'], [5, 21, '雙子座', '風'], [6, 21, '巨蟹座', '水'], [7, 23, '獅子座', '火'], [8, 23, '處女座', '土'], [9, 23, '天秤座', '風'], [10, 23, '天蠍座', '水'], [11, 22, '射手座', '火'], [12, 22, '摩羯座', '土']];
        function westernSign(m, d) {
            let cur = SIGNS[11];                                                // 1/1–1/19 屬於前一年 12/22 起的摩羯
            for (const s of SIGNS) if (m > s[0] || (m === s[0] && d >= s[1])) cur = s;
            return { name: cur[2], element: cur[3] };
        }

        // 農曆年（以「相關公曆年」表示，如 2024 年春節前是 2023）。fmt 預設用瀏覽器 / Node 內建的 Intl 農曆；回傳 { year, month, day, leap } 或 null
        function lunarOf(dateStr, Fmt = Intl.DateTimeFormat) {
            try {
                const { y, m, d } = day.parse(dateStr), parts = new Fmt('zh-u-ca-chinese', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date(Date.UTC(y, m - 1, d, 12)));
                const get = (t) => (parts.find(p => p.type === t) || {}).value, ry = +get('relatedYear'), mon = String(get('month')), dd = +get('day');
                if (!Number.isFinite(ry) || !Number.isFinite(dd)) return null;
                return { year: ry, month: mon.replace('闰', '閏').replace('腊', '臘'), day: dd, leap: mon.startsWith('闰') };
            } catch (e) { return null; }
        }
        const zodiacOf = (lunarYear) => ZODIAC[((lunarYear - 4) % 12 + 12) % 12];
        const ganzhiOf = (lunarYear) => STEMS[((lunarYear - 4) % 10 + 10) % 10] + BRANCHES[((lunarYear - 4) % 12 + 12) % 12];

        // 週歲：到 today 為止的 年 / 月 / 天（today 早於 birth 回傳 null）
        const ageOf = (birth, today) => (day.num(today) < day.num(birth) ? null : day.diffYMD(birth, today));
        // 下一次生日（今天算）；2/29 的生日在非閏年算 2/28
        function nextBirthday(birth, today) {
            const b = day.parse(birth), t = day.parse(today);
            const at = (y) => day.ymd(y, b.m, b.m === 2 && b.d === 29 ? day.daysInMonth(y, 2) : b.d);
            let c = at(t.y); if (day.num(c) < day.num(today)) c = at(t.y + 1);
            return { date: c, days: day.between(today, c), turning: day.parse(c).y - b.y };
        }
        // 活到第 n 天的那一天（出生當天算第 0 天）
        const dayNumber = (birth, n) => day.shift(birth, n);

        // ---- 家人朋友生日（國曆 / 農曆）----
        const LM = { 正: 1, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10, 十一: 11, 十二: 12, 冬: 11, 腊: 12, 臘: 12 };
        const lunarMonthNum = (s) => { const t = String(s).replace(/^[闰閏]/, '').replace(/月$/, ''); return LM[t] || parseInt(t, 10) || 0; };
        // 農曆年 ry 的每一天（以公曆日數 n 表示）：[{ n, m, leap, d }]；只掃 ry-01-01 ~ (ry+1)-03-01，涵蓋整個農曆年。有快取
        const _lyCache = {};
        function lunarYearDays(ry) {
            if (_lyCache[ry]) return _lyCache[ry];
            try {
                const f = new Intl.DateTimeFormat('zh-u-ca-chinese', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' }), out = [];
                for (let n = day.num(day.ymd(ry, 1, 1)), end = day.num(day.ymd(ry + 1, 3, 1)); n < end; n++) {
                    const ps = f.formatToParts(new Date(n * 864e5 + 432e5)), g = (t) => (ps.find(p => p.type === t) || {}).value, mon = String(g('month'));
                    if (+g('relatedYear') !== ry) continue;
                    out.push({ n, m: lunarMonthNum(mon), leap: /^[闰閏]/.test(mon), d: +g('day') });
                }
                return out.length ? (_lyCache[ry] = out) : out;
            } catch (e) { return []; }
        }
        // 農曆（年, 月, 日, 閏）→ 國曆日期字串；該年沒有那個閏月就改用平月；該月只有 29 天卻要 30 日就取月底；查不到回傳 null
        function lunarToSolar(ry, m, d, leap) {
            const L = lunarYearDays(ry);
            let es = L.filter(e => e.m === m && e.leap === !!leap);
            if (!es.length) es = L.filter(e => e.m === m && !e.leap);
            if (!es.length) return null;
            const e = es.filter(x => x.d <= d).pop() || es[0];
            return day.shift('1970-01-01', e.n);
        }
        // 下一次農曆生日（今天算）：{ date, days, ry }（ry 為該次的農曆年）
        function nextLunarBirthday(m, d, leap, today) {
            const ty = day.parse(today).y; let best = null;
            for (let ry = ty - 1; ry <= ty + 1; ry++) {
                const s = lunarToSolar(ry, m, d, leap);
                if (s && day.num(s) >= day.num(today) && (!best || day.num(s) < day.num(best.date))) best = { date: s, days: day.between(today, s), ry };
            }
            return best;
        }
        const realDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && day.shift(s, 0) === s;
        const PEOPLE_MAX = 200;
        // 載入驗證：壞資料丟掉、欄位補預設、截斷上限
        function cleanPeople(a) {
            if (!Array.isArray(a)) return [];
            const out = [], seen = new Set();
            for (const p of a) {
                if (!p || typeof p !== 'object') continue;
                const name = typeof p.name === 'string' ? p.name.trim().slice(0, 30) : '';
                if (!name) continue;
                let id = typeof p.id === 'string' && p.id ? p.id.slice(0, 40) : 'p' + out.length + Math.random().toString(36).slice(2, 7);
                if (seen.has(id)) id += out.length; seen.add(id);
                const q = { id, name, cal: p.cal === 'l' ? 'l' : 's', note: typeof p.note === 'string' ? p.note.slice(0, 100) : '' };
                if (q.cal === 's') { if (!realDate(p.date) || day.parse(p.date).y < 1900) continue; q.date = p.date; }
                else {
                    const ly = +p.ly, lm = +p.lm, ld = +p.ld;
                    if (!(Number.isInteger(ly) && ly >= 1900 && ly <= 2100 && Number.isInteger(lm) && lm >= 1 && lm <= 12 && Number.isInteger(ld) && ld >= 1 && ld <= 30)) continue;
                    Object.assign(q, { ly, lm, ld, leap: !!p.leap });
                }
                out.push(q);
                if (out.length >= PEOPLE_MAX) break;
            }
            return out;
        }
        // 單人資訊：{ birth(國曆), age(歲，未出生為 null), sign, zodiac, next, days, turning }
        function personInfo(p, today) {
            let birth, ry, nb;
            if (p.cal === 'l') { birth = lunarToSolar(p.ly, p.lm, p.ld, p.leap); ry = p.ly; nb = nextLunarBirthday(p.lm, p.ld, p.leap, today); if (nb) nb.turning = nb.ry - p.ly; }
            else { birth = p.date; const lu = lunarOf(birth); ry = lu ? lu.year : null; nb = nextBirthday(birth, today); }
            const age = birth && day.num(today) >= day.num(birth) ? ageOf(birth, today).y : null;
            const bp = birth ? day.parse(birth) : null;
            return { birth, age, sign: bp ? westernSign(bp.m, bp.d).name : '', zodiac: ry ? zodiacOf(ry) : '', next: nb ? nb.date : null, days: nb ? nb.days : 99999, turning: nb ? nb.turning : null };
        }
        // 依「下次生日」由近到遠排序；回傳 [{ p, info }]
        const sortPeople = (people, today) => people.map(p => ({ p, info: personInfo(p, today) })).sort((a, b) => a.info.days - b.info.days || a.p.name.localeCompare(b.p.name));
        const soonTag = (days) => days === 0 ? '今天' : days <= 7 ? '7 天內' : days <= 30 ? '30 天內' : '';
        const birthLabel = (p) => p.cal === 'l' ? `農曆 ${p.ly} 年${p.leap ? '閏' : ''}${'正二三四五六七八九十'[p.lm - 1] || (p.lm === 11 ? '十一' : '十二')}月${p.ld}日` : `國曆 ${p.date}`;
        function peopleText(people, today) {
            return sortPeople(people, today).map(({ p, info }) => `${p.name}｜${birthLabel(p)}｜${info.next ? `下次 ${info.next}（${info.days === 0 ? '今天' : info.days + ' 天後'}，滿 ${info.turning} 歲）` : '—'}${info.sign ? `｜${info.sign}` : ''}${info.zodiac ? `屬${info.zodiac}` : ''}${p.note ? `｜${p.note}` : ''}`).join('\n');
        }
        const icsEsc = (s) => String(s).replace(/[\\;,]/g, '\\$&').replace(/\r?\n/g, '\\n');
        // ICS：國曆生日用每年重複；農曆生日列出之後 5 年各一筆（農曆日期每年不同，無法用 RRULE）
        function peopleIcs(people, today, stamp = '20000101T000000Z') {
            const ev = [], ymd = (s) => s.replace(/-/g, ''), push = (id, date, name, note, rr) => ev.push(['BEGIN:VEVENT', `UID:${id}@simple-tools`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(date)}`, `DTEND;VALUE=DATE:${ymd(day.shift(date, 1))}`, `SUMMARY:${icsEsc(name)} 生日`, note ? `DESCRIPTION:${icsEsc(note)}` : null, rr, 'END:VEVENT'].filter(Boolean).join('\r\n'));
            for (const p of people) {
                if (p.cal === 'l') {
                    const ty = day.parse(today).y;
                    for (let ry = ty - 1, k = 0; ry <= ty + 5; ry++) { const s = lunarToSolar(ry, p.lm, p.ld, p.leap); if (s && day.num(s) >= day.num(today) && k < 5) { push(p.id + '-' + ry, s, p.name, p.note); k++; } }
                } else { const nb = nextBirthday(p.date, today); push(p.id, nb.date, p.name, p.note, 'RRULE:FREQ=YEARLY'); }
            }
            return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//simple_tools//date-calc//ZH', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const today = day.today();
        ['#d1', '#d3', '#d4'].forEach(s => { $(s).value = today; });
        $('#d2').value = day.shift(today, 100);
        let tab = store.get('datecalc_tab', 'diff');
        if (!['diff', 'add', 'info', 'zodiac'].includes(tab)) tab = 'diff';
        $('#birth').value = store.get('zodiac_birth', ''); $('#ztoday').value = today;
        const validZ = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(day.num(s));
        const valid = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s);
        const fmt = (s) => `${s}（週${WEEK[weekday(s)]}）`;

        function render() {
            document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tab));
            document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== tab; });
            const out = [];
            if (tab === 'diff') {
                let a = $('#d1').value, b = $('#d2').value;
                if (valid(a) && valid(b)) {
                    const rev = day.num(a) > day.num(b); if (rev) [a, b] = [b, a];
                    const n = day.between(a, b), ymd = diffYMD(a, b);
                    out.push(statRow('相差', `${n} 天`), statRow('約等於', `${Math.floor(n / 7)} 週 ${n % 7} 天`), statRow('年月日', `${ymd.y} 年 ${ymd.m} 個月 ${ymd.d} 天`), statRow('工作日數（含起訖日）', `${workdaysBetween(a, b)} 天`));
                    if (rev) out.push(Object.assign(document.createElement('p'), { className: 'note', textContent: '「到」比「從」早，已自動對調。' }));
                }
            } else if (tab === 'add') {
                const s = $('#d3').value, n = parseInt($('#amt').value, 10), sg = +$('#sign').value, u = $('#unit').value;
                if (valid(s) && Number.isFinite(n) && n >= 0 && n <= 100000) {
                    const r = u === 'd' ? day.shift(s, sg * n) : u === 'w' ? day.shift(s, sg * n * 7) : u === 'm' ? addMonths(s, sg * n) : u === 'y' ? addMonths(s, sg * n * 12) : addWorkdays(s, sg * n);
                    out.push(statRow('起始日', fmt(s)), statRow('結果', fmt(r), 'ok'), statRow('相隔', `${Math.abs(day.between(s, r))} 天`));
                }
            } else if (tab === 'zodiac') {
                const b = $('#birth').value, t = $('#ztoday').value;
                $('#big').textContent = ''; $('#sub').textContent = '';
                if (validZ(b) && validZ(t)) {
                    store.set('zodiac_birth', b);
                    const age = ageOf(b, t);
                    if (!age) $('#sub').textContent = '計算日期要晚於出生日期';
                    else {
                        const p = day.parse(b), sign = westernSign(p.m, p.d), lu = lunarOf(b), wd = (day.num(b) + 4) % 7, lived = day.between(b, t), nb = nextBirthday(b, t);
                        $('#big').textContent = `${age.y} 歲`; $('#sub').textContent = `${age.y} 年 ${age.m} 個月 ${age.d} 天`;
                        out.push(statRow('已經活了', `${lived.toLocaleString('zh-TW')} 天（約 ${(lived / 7).toFixed(0)} 週）`), statRow('出生那天是', `星期${WEEK[((wd % 7) + 7) % 7]}`), statRow('星座', `${sign.name}（${sign.element}象）`));
                        if (lu) out.push(statRow('農曆生日', `${lu.year} 年 ${lu.month}${lu.month.endsWith('月') ? '' : '月'} ${lu.day} 日`), statRow('天干地支', `${ganzhiOf(lu.year)}年`), statRow('生肖', `屬${zodiacOf(lu.year)}`));
                        else out.push(statRow('農曆 / 生肖', '這個瀏覽器不支援農曆，無法換算'));
                        out.push(statRow('下次生日', `${nb.date}（${nb.days === 0 ? '就是今天 🎉' : nb.days + ' 天後'}，滿 ${nb.turning} 歲）`));
                        for (const n of [10000, 20000]) { const d = dayNumber(b, n); out.push(statRow(`第 ${n.toLocaleString('zh-TW')} 天`, `${d}（${day.between(t, d) >= 0 ? day.between(t, d) + ' 天後' : '已過 ' + -day.between(t, d) + ' 天'}）`)); }
                    }
                }
            } else {
                const s = $('#d4').value;
                if (valid(s)) {
                    const p = day.parse(s), w = isoWeek(s);
                    out.push(statRow('星期', `週${WEEK[weekday(s)]}`), statRow('今年第幾天', `第 ${dayOfYear(s)} 天（共 ${isLeap(p.y) ? 366 : 365} 天）`), statRow('ISO 週次', `${w.year} 年第 ${w.week} 週`), statRow('該月天數', `${daysInMonth(p.y, p.m)} 天`), statRow('閏年', isLeap(p.y) ? '是' : '否'), statRow('距今', (d => d === 0 ? '今天' : d > 0 ? `${d} 天後` : `${-d} 天前`)(day.between(today, s))));
                }
            }
            $('#res').replaceChildren(...out);
            renderPeople();
        }

        // ---- 家人朋友生日 UI ----
        let people = cleanPeople(store.get('datecalc_people', [])), editId = null;
        const mk = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
        $('#plm').replaceChildren(...Array.from({ length: 12 }, (_, i) => mk('option', { value: i + 1, textContent: ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '臘'][i] + '月' })));
        $('#pld').replaceChildren(...Array.from({ length: 30 }, (_, i) => mk('option', { value: i + 1, textContent: i + 1 + ' 日' })));
        const savePeople = () => store.set('datecalc_people', people);
        const pmsg = (t) => { $('#pmsg').textContent = t; };
        function formCal() { const l = $('#pc').value === 'l'; $('#ps').hidden = l; $('#pl').hidden = !l; }
        function formReset() { editId = null; $('#pn').value = $('#pd').value = $('#ply').value = $('#pnote').value = ''; $('#pc').value = 's'; $('#plm').value = 1; $('#pld').value = 1; $('#plp').value = '0'; $('#padd').textContent = '新增'; $('#pcancel').hidden = true; formCal(); }
        function renderPeople() {
            $('#people').hidden = tab !== 'zodiac';
            if (tab !== 'zodiac') return;
            const rows = sortPeople(people, today).map(({ p, info }) => {
                const tag = info.next ? soonTag(info.days) : '';
                const line1 = mk('div', {}, mk('b', { textContent: p.name }), tag ? mk('span', { className: 'note', textContent: ' ・' + tag, style: 'color:var(--bad);font-weight:700' }) : '');
                const line2 = mk('div', { className: 'note', textContent: `${birthLabel(p)}${info.birth && p.cal === 'l' ? `（國曆 ${info.birth}）` : ''}｜${info.age === null ? '未出生' : info.age + ' 歲'}｜${info.sign}${info.zodiac ? ' 屬' + info.zodiac : ''}` });
                const line3 = mk('div', { className: 'note', textContent: (info.next ? `下次 ${info.next}（${info.days === 0 ? '就是今天' : info.days + ' 天後'}，滿 ${info.turning} 歲）` : '查無下次日期') + (p.note ? '｜' + p.note : '') });
                const eb = mk('button', { className: 'sm', textContent: '編輯' }), db = mk('button', { className: 'sm', textContent: '刪除' });
                eb.onclick = () => {
                    editId = p.id; $('#pn').value = p.name; $('#pnote').value = p.note; $('#pc').value = p.cal; formCal();
                    if (p.cal === 's') $('#pd').value = p.date; else { $('#ply').value = p.ly; $('#plm').value = p.lm; $('#pld').value = p.ld; $('#plp').value = p.leap ? '1' : '0'; }
                    $('#padd').textContent = '儲存修改'; $('#pcancel').hidden = false; $('#pn').focus();
                };
                db.onclick = () => { if (!confirm(`刪除「${p.name}」？無法復原。`)) return; people = people.filter(x => x.id !== p.id); if (editId === p.id) formReset(); savePeople(); renderPeople(); };
                return mk('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap' }, mk('div', { style: 'min-width:0;flex:1 1 200px' }, line1, line2, line3), mk('div', { style: 'display:flex;gap:6px' }, eb, db));
            });
            $('#plist').replaceChildren(...(rows.length ? rows : [mk('p', { className: 'note', textContent: '還沒有資料' })]));
        }
        $('#pc').onchange = formCal; $('#pcancel').onclick = () => { formReset(); pmsg(''); };
        $('#padd').onclick = () => {
            const q = { id: editId || 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: $('#pn').value.trim(), cal: $('#pc').value, note: $('#pnote').value.trim() };
            if (q.cal === 's') q.date = $('#pd').value; else Object.assign(q, { ly: +$('#ply').value, lm: +$('#plm').value, ld: +$('#pld').value, leap: $('#plp').value === '1' });
            if (!q.name) return pmsg('請輸入姓名');
            const [c] = cleanPeople([q]);
            if (!c) return pmsg(q.cal === 's' ? '請選擇有效的國曆生日（1900 年以後）' : '農曆年請填 1900～2100');
            if (editId) people = people.map(x => x.id === editId ? c : x);
            else { if (people.length >= PEOPLE_MAX) return pmsg(`最多 ${PEOPLE_MAX} 人，請先刪除舊資料`); people.push(c); }
            savePeople(); formReset(); pmsg('已儲存'); renderPeople();
        };
        $('#pclear').onclick = () => { if (people.length && confirm(`清除全部 ${people.length} 位的生日資料？無法復原。`)) { people = []; savePeople(); formReset(); renderPeople(); } };
        $('#ptxt').onclick = () => Util.copyWithFeedback($('#ptxt'), peopleText(people, today));
        $('#pics').onclick = () => { if (people.length) Util.download(new Blob([peopleIcs(people, today, new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z')], { type: 'text/calendar' }), 'birthdays.ics'); };
        formReset();

        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { tab = b.dataset.t; store.set('datecalc_tab', tab); render(); }; });
        document.querySelectorAll('.pane input,.pane select').forEach(e => { e.oninput = e.onchange = render; });
        render();
    </script>
</body>

</html>
