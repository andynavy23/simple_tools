<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="日期計算機：兩日期相差幾天、加減天數 / 月 / 年 / 工作日，以及某天是星期幾、第幾週，還有生日 / 星座 / 生肖。">
    <meta property="og:title" content="日期計算機" />
    <meta property="og:description" content="日期相差、加減、工作日與生日星座計算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/date-calc.html" />
    <meta name="st-keys" content="datecalc_tab,zodiac_birth">
    <title>日期計算機</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        #res {
            margin-top: 6px;
        }

        .fgrid input {
            min-width: 0;
        }

        .big {
            font-size: 44px;
            font-weight: 800;
            text-align: center;
            margin: 10px 0 2px;
        }

        .sub2 {
            text-align: center;
            color: var(--muted);
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>日期計算機</h1>
        <p class="sub">相差幾天、幾天後是哪一天、這天是星期幾。工作日只排除週六日（不含國定假日）。</p>

        <div class="card">
            <div class="tabs" role="tablist">
                <button data-t="diff" aria-pressed="true">日期相差</button>
                <button data-t="add" aria-pressed="false">日期加減</button>
                <button data-t="info" aria-pressed="false">日期資訊</button>
                <button data-t="zodiac" aria-pressed="false">生日 / 星座</button>
            </div>

            <div class="pane" data-t="diff">
                <div class="fgrid" style="margin-bottom:10px"><div><label for="d1">從</label><input type="date" id="d1"></div><div><label for="d2">到</label><input type="date" id="d2"></div></div>
            </div>
            <div class="pane" data-t="add" hidden>
                <div class="row"><label for="d3">起始日</label><input type="date" id="d3"></div>
                <div class="row">
                    <select id="sign" aria-label="方向"><option value="1">之後</option><option value="-1">之前</option></select>
                    <input type="number" id="amt" value="30" min="0" style="width:100px" aria-label="數量">
                    <select id="unit" aria-label="單位"><option value="d">天</option><option value="w">週</option><option value="m">個月</option><option value="y">年</option><option value="wd">個工作日</option></select>
                </div>
            </div>
            <div class="pane" data-t="info" hidden>
                <div class="row"><label for="d4">日期</label><input type="date" id="d4"></div>
            </div>
            <div class="pane" data-t="zodiac" hidden>
                <div class="fgrid"><div><label for="birth">出生日期</label><input type="date" id="birth"></div><div><label for="ztoday">計算到</label><input type="date" id="ztoday"></div></div>
                <div class="big" id="big"></div>
                <div class="sub2" id="sub"></div>
            </div>
            <div id="res" aria-live="polite"></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>日期計算四合一：兩個日期相差多久、某日期加減一段時間是哪天、某一天的各種資訊，以及依出生日期算年齡、星座、生肖。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>算專案還有幾天、幾個工作日</li>
        <li>合約「30 天後到期」「3 個月後續約」要查正確日期</li>
        <li>想知道某天是星期幾、今年第幾天、第幾週</li>
        <li>算實足年齡、星座、生肖、農曆生日，或還有幾天過生日、哪天活滿 10000 天</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「日期相差」：選「從」與「到」，看天數、週數、年月日與工作日數（起訖日都算）；順序反了會自動對調</li>
        <li>「日期加減」：選起始日、之後 / 之前、數量與單位（天、週、個月、年、個工作日）</li>
        <li>「日期資訊」：選一個日期，看星期、今年第幾天、ISO 週次、該月天數、是否閏年、距今幾天</li>
        <li>「生日 / 星座」：選出生日期（會記在本機，下次自動帶入），「計算到」預設今天；顯示年齡（年月日）、活了幾天、出生那天星期幾、星座與元素、農曆生日、天干地支、生肖、下次生日、第 10000 / 20000 天</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">日期加減：起始日 <b>2026-10-03</b>、之後 <b>30</b> 天，結果是 <b>2026-11-02（週一）</b>。<br>日期相差：2026-10-03 到 2027-01-11 共 100 天，約 14 週 2 天，工作日 71 天。<br>生日 / 星座：出生日期 <b>2000-01-01</b>、計算到 <b>2026-10-03</b>，26 歲（26 年 9 個月 2 天）；出生那天是星期六；星座摩羯座；農曆生日 1999 年十一月 25 日，己卯年，屬兔（2000 年春節還沒到，生肖算前一年）。</div>
        <h3>小提醒</h3>
        <ul>
        <li>工作日只排除週六日，不含國定假日與補班</li>
        <li>月份加減遇到月底（例如 1/31 加 1 個月）會取當月最後一天</li>
        <li>生日 / 星座只是日期計算，不做運勢；生肖與天干地支依<b>農曆新年</b>換算，1～2 月出生要特別注意</li>
        <li>2/29 出生的人，非閏年的生日算 2/28；農曆換算靠瀏覽器內建功能，太舊的瀏覽器可能無法顯示</li>
        <li>出生日期只存在你的瀏覽器（可用右上角「💾」備份），不會上傳；清除請把日期欄清空或清除瀏覽器網站資料</li>
        <li>所有計算都在本機完成</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day, statRow, store } = Util;

        // --- pure ---
        const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
        const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
        const daysInMonth = (y, m) => [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
        const weekday = (s) => (((day.num(s) + 4) % 7) + 7) % 7;                 // 0 = 週日（1970-01-01 是週四）
        const isWorkday = (s) => { const w = weekday(s); return w !== 0 && w !== 6; };

        const { addMonths, diffYMD } = day;                                       // 共用（shared/js/util.js）

        // 含起訖日的工作日數（a ≤ b）
        function workdaysBetween(a, b) {
            let n = 0;
            for (let x = a, end = day.num(b); day.num(x) <= end; x = day.shift(x, 1)) if (isWorkday(x)) n++;
            return n;
        }

        // 往後（n > 0）或往前（n < 0）數 n 個工作日；起始日本身不算
        function addWorkdays(s, n) {
            const step = n < 0 ? -1 : 1;
            for (let left = Math.abs(n); left > 0;) { s = day.shift(s, step); if (isWorkday(s)) left--; }
            return s;
        }

        const dayOfYear = (s) => day.between(day.ymd(day.parse(s).y, 1, 1), s) + 1;

        // ISO 8601 週次：該週的週四所在的年，決定週所屬年份
        function isoWeek(s) {
            const thu = day.shift(s, 3 - ((weekday(s) + 6) % 7));
            const y = day.parse(thu).y;
            return { year: y, week: Math.floor(day.between(day.ymd(y, 1, 1), thu) / 7) + 1 };
        }
        const ZODIAC = ['鼠', '牛', '虎', '兔', '龍', '蛇', '馬', '羊', '猴', '雞', '狗', '豬'];
        const STEMS = '甲乙丙丁戊己庚辛壬癸', BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
        // 星座：[開始月, 開始日, 名稱, 元素]；12/22 起是摩羯
        const SIGNS = [[1, 20, '水瓶座', '風'], [2, 19, '雙魚座', '水'], [3, 21, '牡羊座', '火'], [4, 20, '金牛座', '土'], [5, 21, '雙子座', '風'], [6, 21, '巨蟹座', '水'], [7, 23, '獅子座', '火'], [8, 23, '處女座', '土'], [9, 23, '天秤座', '風'], [10, 23, '天蠍座', '水'], [11, 22, '射手座', '火'], [12, 22, '摩羯座', '土']];
        function westernSign(m, d) {
            let cur = SIGNS[11];                                                // 1/1–1/19 屬於前一年 12/22 起的摩羯
            for (const s of SIGNS) if (m > s[0] || (m === s[0] && d >= s[1])) cur = s;
            return { name: cur[2], element: cur[3] };
        }

        // 農曆年（以「相關公曆年」表示，如 2024 年春節前是 2023）。fmt 預設用瀏覽器 / Node 內建的 Intl 農曆；回傳 { year, month, day, leap } 或 null
        function lunarOf(dateStr, Fmt = Intl.DateTimeFormat) {
            try {
                const { y, m, d } = day.parse(dateStr), parts = new Fmt('zh-u-ca-chinese', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date(Date.UTC(y, m - 1, d, 12)));
                const get = (t) => (parts.find(p => p.type === t) || {}).value, ry = +get('relatedYear'), mon = String(get('month')), dd = +get('day');
                if (!Number.isFinite(ry) || !Number.isFinite(dd)) return null;
                return { year: ry, month: mon.replace('闰', '閏').replace('腊', '臘'), day: dd, leap: mon.startsWith('闰') };
            } catch (e) { return null; }
        }
        const zodiacOf = (lunarYear) => ZODIAC[((lunarYear - 4) % 12 + 12) % 12];
        const ganzhiOf = (lunarYear) => STEMS[((lunarYear - 4) % 10 + 10) % 10] + BRANCHES[((lunarYear - 4) % 12 + 12) % 12];

        // 週歲：到 today 為止的 年 / 月 / 天（today 早於 birth 回傳 null）
        const ageOf = (birth, today) => (day.num(today) < day.num(birth) ? null : day.diffYMD(birth, today));
        // 下一次生日（今天算）；2/29 的生日在非閏年算 2/28
        function nextBirthday(birth, today) {
            const b = day.parse(birth), t = day.parse(today);
            const at = (y) => day.ymd(y, b.m, b.m === 2 && b.d === 29 ? day.daysInMonth(y, 2) : b.d);
            let c = at(t.y); if (day.num(c) < day.num(today)) c = at(t.y + 1);
            return { date: c, days: day.between(today, c), turning: day.parse(c).y - b.y };
        }
        // 活到第 n 天的那一天（出生當天算第 0 天）
        const dayNumber = (birth, n) => day.shift(birth, n);
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const today = day.today();
        ['#d1', '#d3', '#d4'].forEach(s => { $(s).value = today; });
        $('#d2').value = day.shift(today, 100);
        let tab = store.get('datecalc_tab', 'diff');
        if (!['diff', 'add', 'info', 'zodiac'].includes(tab)) tab = 'diff';
        $('#birth').value = store.get('zodiac_birth', ''); $('#ztoday').value = today;
        const validZ = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(day.num(s));
        const valid = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s);
        const fmt = (s) => `${s}（週${WEEK[weekday(s)]}）`;

        function render() {
            document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tab));
            document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== tab; });
            const out = [];
            if (tab === 'diff') {
                let a = $('#d1').value, b = $('#d2').value;
                if (valid(a) && valid(b)) {
                    const rev = day.num(a) > day.num(b); if (rev) [a, b] = [b, a];
                    const n = day.between(a, b), ymd = diffYMD(a, b);
                    out.push(statRow('相差', `${n} 天`), statRow('約等於', `${Math.floor(n / 7)} 週 ${n % 7} 天`), statRow('年月日', `${ymd.y} 年 ${ymd.m} 個月 ${ymd.d} 天`), statRow('工作日數（含起訖日）', `${workdaysBetween(a, b)} 天`));
                    if (rev) out.push(Object.assign(document.createElement('p'), { className: 'note', textContent: '「到」比「從」早，已自動對調。' }));
                }
            } else if (tab === 'add') {
                const s = $('#d3').value, n = parseInt($('#amt').value, 10), sg = +$('#sign').value, u = $('#unit').value;
                if (valid(s) && Number.isFinite(n) && n >= 0 && n <= 100000) {
                    const r = u === 'd' ? day.shift(s, sg * n) : u === 'w' ? day.shift(s, sg * n * 7) : u === 'm' ? addMonths(s, sg * n) : u === 'y' ? addMonths(s, sg * n * 12) : addWorkdays(s, sg * n);
                    out.push(statRow('起始日', fmt(s)), statRow('結果', fmt(r), 'ok'), statRow('相隔', `${Math.abs(day.between(s, r))} 天`));
                }
            } else if (tab === 'zodiac') {
                const b = $('#birth').value, t = $('#ztoday').value;
                $('#big').textContent = ''; $('#sub').textContent = '';
                if (validZ(b) && validZ(t)) {
                    store.set('zodiac_birth', b);
                    const age = ageOf(b, t);
                    if (!age) $('#sub').textContent = '計算日期要晚於出生日期';
                    else {
                        const p = day.parse(b), sign = westernSign(p.m, p.d), lu = lunarOf(b), wd = (day.num(b) + 4) % 7, lived = day.between(b, t), nb = nextBirthday(b, t);
                        $('#big').textContent = `${age.y} 歲`; $('#sub').textContent = `${age.y} 年 ${age.m} 個月 ${age.d} 天`;
                        out.push(statRow('已經活了', `${lived.toLocaleString('zh-TW')} 天（約 ${(lived / 7).toFixed(0)} 週）`), statRow('出生那天是', `星期${WEEK[((wd % 7) + 7) % 7]}`), statRow('星座', `${sign.name}（${sign.element}象）`));
                        if (lu) out.push(statRow('農曆生日', `${lu.year} 年 ${lu.month}${lu.month.endsWith('月') ? '' : '月'} ${lu.day} 日`), statRow('天干地支', `${ganzhiOf(lu.year)}年`), statRow('生肖', `屬${zodiacOf(lu.year)}`));
                        else out.push(statRow('農曆 / 生肖', '這個瀏覽器不支援農曆，無法換算'));
                        out.push(statRow('下次生日', `${nb.date}（${nb.days === 0 ? '就是今天 🎉' : nb.days + ' 天後'}，滿 ${nb.turning} 歲）`));
                        for (const n of [10000, 20000]) { const d = dayNumber(b, n); out.push(statRow(`第 ${n.toLocaleString('zh-TW')} 天`, `${d}（${day.between(t, d) >= 0 ? day.between(t, d) + ' 天後' : '已過 ' + -day.between(t, d) + ' 天'}）`)); }
                    }
                }
            } else {
                const s = $('#d4').value;
                if (valid(s)) {
                    const p = day.parse(s), w = isoWeek(s);
                    out.push(statRow('星期', `週${WEEK[weekday(s)]}`), statRow('今年第幾天', `第 ${dayOfYear(s)} 天（共 ${isLeap(p.y) ? 366 : 365} 天）`), statRow('ISO 週次', `${w.year} 年第 ${w.week} 週`), statRow('該月天數', `${daysInMonth(p.y, p.m)} 天`), statRow('閏年', isLeap(p.y) ? '是' : '否'), statRow('距今', (d => d === 0 ? '今天' : d > 0 ? `${d} 天後` : `${-d} 天前`)(day.between(today, s))));
                }
            }
            $('#res').replaceChildren(...out);
        }

        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { tab = b.dataset.t; store.set('datecalc_tab', tab); render(); }; });
        document.querySelectorAll('input,select').forEach(e => { e.oninput = e.onchange = render; });
        render();
    </script>
</body>

</html>
