<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>廚房計算</h1>
        <p class="sub">廚房與飲食的小算式放在一起。數值都是一般經驗值，只存上次的分頁與輸入；食安與營養相關請看每頁的提醒。</p>

        <div class="tabs" id="tabs"></div>
        <div id="panels"></div>
        <button id="reset">重置所有輸入</button>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>十五個廚房與飲食小計算：麵糰發酵時間、聚餐 / 火鍋 / 烤肉份量、啤酒釀造（酒精濃度、水量、IBU）、醃製鹽度、泡菜鹽水、低溫烹調時間、烤箱換氣炸鍋、電鍋水量、調酒酒精濃度、每日水分、運動後補給、電解質飲配方與嬰兒配方奶換算。烘焙克數換算、份量縮放與手沖咖啡請用「食譜換算」。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>揉好麵團想知道大概要發多久、約了朋友聚餐 / 火鍋 / 烤肉要買多少。</li>
        <li>自釀啤酒量完比重想算酒精度；自己調酒想知道成品幾度、幾個標準杯。</li>
        <li>想低溫烹調雞胸、牛排，要查保守的安全時間。</li>
        <li>運動完不知道該補多少、要自己配電解質飲、或沖配方奶需要換算。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點上方分頁，在欄位填數字或選項，結果即時更新；空白欄位視為未填。</li>
        <li>調酒分頁每行「名稱 毫升 酒精度%」，最多 12 行，例如「琴酒 45 40」。</li>
        <li>「重置所有輸入」會清掉記住的輸入並恢復預設值（先確認，無法復原）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">酵母 1%（即溶）、25°C → 約 3 小時（範圍約 2.1–3.9 小時）
        OG 1.050、FG 1.010 → 酒精度約 5.25%
        琴酒 60 mL 40% + 香艾酒 30 mL 15%，稀釋 25% → 成品約 25%，約 2.2 標準杯（10 g 純酒精）
        3 公分厚雞胸、65°C → 加熱約 55 分鐘 + 中心保溫 30 分鐘，共約 1 小時 25 分</div>
        <h3>小提醒</h3>
        <ul>
        <li><b>食品安全</b>：低溫烹調表是保守估算（保溫時間取比一般殺菌表更長），只適用整塊、完整的新鮮肉；絞肉、針刺嫩化肉、整隻禽、生蛋不在範圍，孕婦、幼兒、長者與免疫力低下者請煮到全熟；醃肉一律冷藏 4°C 以下。醃製與泡菜鹽度是一般原則，長期醃漬 / 火腿臘肉需亞硝酸鹽等專業配方，這裡不處理。</li>
        <li><b>營養與補水</b>：水分、運動後補給與電解質飲只是一般參考，不是醫療建議；腎臟、心臟、高血壓、糖尿病或需限水限鈉者請依醫囑。嬰兒配方奶換算以產品包裝與醫師建議為準，不可自行調濃或調淡。</li>
        <li>發酵、份量、烤肉等都是經驗值，麵糰請看體積與手感；氣炸鍋與電鍋各機型不同，請試做後微調。</li>
        <li>只記住上次的分頁與各欄位輸入（鍵 kitchenc_opts），固定大小、沒有成長問題；壞資料或舊版資料會被忽略並使用預設值。存不下時會顯示共用的儲存失敗提示；重置前會先確認。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const RANGE = (x, lo, hi) => Number.isFinite(x) && x >= lo && x <= hi;
        // 麵糰發酵（簡化經驗模型）：基準 = 即溶酵母 1%、25°C 約 3 小時；時間 ∝ 酵母量^-0.7，溫度每 +10°C 速度約 ×2（Q10 = 2）。誤差約 ±30%
        const YEAST_EQ = { instant: 1, dry: 1.33, fresh: 3 };   // 幾克 ≈ 1 克即溶酵母
        function doughTime(yeastPct, tempC, type) {
            const f = YEAST_EQ[type], eq = yeastPct / f;
            if (!f || !RANGE(eq, 0.05, 5) || !RANGE(tempC, 4, 40)) return null;
            const h = 3 * Math.pow(eq, -0.7) * Math.pow(2, (25 - tempC) / 10);
            return { h, lo: h * 0.7, hi: h * 1.3, eq };
        }
        // 聚餐：每人主食（熟飯克）、菜餚 + 肉（克）、飲料（毫升）；食量 ×0.85 / 1 / 1.2。菜色道數約 人數×0.6+2
        const PARTY = { home: [180, 400, 600], friends: [150, 350, 600], light: [80, 250, 700] };
        const APP = { s: 0.85, m: 1, l: 1.2 };
        function partyFood(people, occ, app) {
            const p = PARTY[occ], a = APP[app];
            if (!p || !a || !Number.isInteger(people) || !RANGE(people, 1, 500)) return null;
            return { rice: p[0] * a * people, raw: p[0] * a * people / 2.3, dish: p[1] * a * people, dishes: Math.round(people * 0.6 + 2), drink: p[2] * people };
        }
        // 火鍋（每人，克）：肉 150、蔬菜 250、火鍋料 / 豆腐 / 菇 100、主食 120；湯底 400 mL（至少 1500 mL）
        function hotpot(people, app) {
            const a = APP[app];
            if (!a || !Number.isInteger(people) || !RANGE(people, 1, 300)) return null;
            return { meat: 150 * a * people, veg: 250 * a * people, tofu: 100 * a * people, staple: 120 * a * people, soup: Math.max(1500, 400 * people) };
        }
        // 烤肉（每人）：肉 250 g、配料 150 g、主食 60 g、飲料 800 mL（炎熱 ×1.3）、冰塊 0.3 kg（炎熱 0.5）；木炭 0.4 kg / 人 / 2.5 小時，進位到 0.5 kg
        function bbq(people, app, hours, hot) {
            const a = APP[app];
            if (!a || !Number.isInteger(people) || !RANGE(people, 1, 300) || !RANGE(hours, 0.5, 12)) return null;
            return { meat: 250 * a * people, side: 150 * a * people, staple: 60 * a * people, drink: 800 * (hot ? 1.3 : 1) * people, ice: (hot ? 0.5 : 0.3) * people, charcoal: Math.max(1, Math.ceil(people * 0.4 * hours / 2.5 * 2) / 2) };
        }
        // 啤酒：ABV = (OG − FG) × 131.25；視發酵度 = (OG − FG) / (OG − 1)
        function brewAbv(og, fg) {
            if (!RANGE(og, 1.02, 1.15) || !RANGE(fg, 0.99, og)) return null;
            return { abv: (og - fg) * 131.25, att: (og - fg) / (og - 1) * 100 };
        }
        // Tinseth IBU（單次下啤酒花）：g 克數、alpha % α酸、min 煮沸分鐘、vol 煮後體積（L）、og 煮沸比重
        function tinsethIbu(g, alpha, min, vol, og) {
            if (!(g > 0) || !RANGE(alpha, 1, 30) || !RANGE(min, 0, 180) || !(vol > 0) || !RANGE(og, 1.02, 1.15)) return NaN;
            const util = 1.65 * Math.pow(0.000125, og - 1) * (1 - Math.exp(-0.04 * min)) / 4.15;
            return util * alpha / 100 * g * 1000 / vol;
        }
        // 糖化水量：煮前體積 = 成品 + 蒸發（L/h × 煮沸時間）+ 損耗 1 L；穀物吸水 1 L/kg；糖化水 3 L/kg，其餘為洗糟水
        function brewWater(batchL, grainKg, boilMin, boilOffLh) {
            if (!RANGE(batchL, 1, 500) || !RANGE(grainKg, 0.1, 200) || !RANGE(boilMin, 0, 240) || !RANGE(boilOffLh, 0, 30)) return null;
            const pre = batchL + boilOffLh * boilMin / 60 + 1, total = pre + grainKg, mash = Math.min(grainKg * 3, total);
            return { pre, total, mash, sparge: total - mash };
        }
        // 醃製（一般原則）：veg 蔬菜淺漬（鹽 2%、糖 1% 食材重）；brine 鹽水醃肉（水 = 食材重、鹽 5% 水、糖 2.5% 水）；dry 乾醃肉（鹽 1% 食材重）
        const CURE_TIME = { veg: ['1–4 小時', '1–4 小時', '1–4 小時'], brine: ['30–60 分鐘', '1–4 小時', '8–12 小時'], dry: ['1–4 小時', '8–24 小時', '24–48 小時'] };
        function cure(mode, g, size) {
            if (!(mode in CURE_TIME) || !RANGE(g, 10, 50000) || ![0, 1, 2].includes(size)) return null;
            return { salt: g * { veg: 0.02, brine: 0.05, dry: 0.01 }[mode], sugar: g * { veg: 0.01, brine: 0.025, dry: 0 }[mode], water: mode === 'brine' ? g : 0, time: CURE_TIME[mode][size] };
        }
        // 泡菜鹽水：鹽度 % = 鹽 ÷ (水 + 鹽)；鹽 = 水 × p ÷ (100 − p)
        function brine(vegG, waterMl, pct) {
            if (!RANGE(vegG, 10, 50000) || !RANGE(waterMl, 10, 50000) || !RANGE(pct, 1, 20)) return null;
            const salt = waterMl * pct / (100 - pct);
            return { salt, total: waterMl + salt, vegPct: salt / vegG * 100, flag: pct < 2 ? 'low' : pct > 5 ? 'high' : '' };
        }
        // 低溫烹調：加熱時間（分鐘）= 板狀傳導解，核心升到水溫 −0.5°C；α = 1.4e-7 m²/s。dCm 厚度（公分）
        function sousHeat(dCm, bathC, startC) {
            if (!RANGE(dCm, 0.5, 10) || !RANGE(bathC, 50, 80) || !RANGE(startC, -25, 25) || startC >= bathC - 1) return NaN;
            const d = dCm / 100;
            return -(d * d / (Math.PI * Math.PI * 1.4e-7)) * Math.log(Math.PI / 4 * 0.5 / (bathC - startC)) / 60;
        }
        // 保守的核心保溫分鐘（比一般殺菌表更長）：[水溫°C, 保溫分鐘, 說明]
        const SOUS = {
            poultry: [[63, 45, '偏嫩多汁'], [65, 30, '嫩（一般首選）'], [70, 10, '偏乾']],
            pork: [[60, 60, '粉嫩'], [63, 30, '嫩'], [68, 15, '全熟']],
            beef: [[57, 120, '三分熟'], [60, 60, '五分熟'], [63, 30, '七分熟'], [68, 15, '全熟']],
            fish: [[60, 30, '嫩'], [63, 15, '全熟']]
        };
        function sousTable(type, dCm, frozen) {
            if (!SOUS[type] || !RANGE(dCm, 0.5, 8)) return null;
            return SOUS[type].map(([t, hold, desc]) => { const heat = sousHeat(dCm, t, 4) * (frozen ? 1.5 : 1), total = heat + hold; return { t, hold, desc, heat, total, long: total > 240 }; });
        }
        // 烤箱 → 氣炸鍋：溫度 −20°C（−15 ~ −25），時間 ×0.8（×0.7 ~ ×0.9）
        function airFry(ovenC, min) {
            if (!RANGE(ovenC, 100, 300) || !RANGE(min, 1, 600)) return null;
            return { t: ovenC - 20, tLo: ovenC - 25, tHi: ovenC - 15, min: min * 0.8, lo: min * 0.7, hi: min * 0.9 };
        }
        // 米：1 杯 = 180 mL ≈ 150 g 白米。[米水體積比, 外鍋水（杯）, 浸泡建議]；米 > 4 杯外鍋再加 0.5
        const RICE = { white: [1.1, 1, '洗好可直接煮，或浸 20–30 分鐘'], brown: [1.5, 1.5, '建議浸 2–4 小時'], sticky: [0.9, 1, '建議浸 2–4 小時再瀝乾'], germ: [1.2, 1, '洗好可直接煮'], multi: [1.5, 1.5, '建議浸 1–2 小時'] };
        function riceWater(amount, unit, kind) {
            const r = RICE[kind];
            if (!r || !(unit === 'cup' || unit === 'g') || !RANGE(amount, 0.1, 5000)) return null;
            const cups = unit === 'g' ? amount / 150 : amount;
            if (!RANGE(cups, 0.1, 30)) return null;
            return { cups, g: cups * 150, ml: cups * 180 * r[0], outer: r[1] + (cups > 4 ? 0.5 : 0), soak: r[2] };
        }
        // 調酒：每行「名稱 毫升 酒精度%」，最多 12 行
        function parseDrink(text) {
            const items = [], errors = [];
            String(text).split(/\r?\n/).forEach((raw, i) => {
                const line = raw.trim(); if (!line) return;
                const m = /^(.*?)\s+(\d+(?:\.\d+)?)\s*(?:ml|mL|毫升)?\s+(\d+(?:\.\d+)?)\s*%?$/.exec(line);
                if (m && +m[2] > 0 && +m[2] <= 5000 && +m[3] <= 100 && items.length < 12) items.push({ name: m[1].trim().slice(0, 20), ml: +m[2], abv: +m[3] }); else errors.push(i + 1);
            });
            return { items, errors };
        }
        // 成品酒精度：稀釋 dilutePct = 冰融釋水占原液體積的 %；酒精密度 0.789 g/mL；台灣 1 標準杯 = 10 g 純酒精
        function cocktail(items, dilutePct) {
            if (!items.length || !RANGE(dilutePct, 0, 100)) return null;
            const base = items.reduce((a, x) => a + x.ml, 0), vol = base * (1 + dilutePct / 100), alc = items.reduce((a, x) => a + x.ml * x.abv / 100, 0);
            return { vol, alc, abv: alc / vol * 100, grams: alc * 0.789, drinks: alc * 0.789 / 10 };
        }
        // 每日水分（毫升，含飲食中的水）：體重 × 33 mL × 氣溫係數 + 運動分鐘 × 7 mL；範圍 ±10%
        function hydration(kg, tempC, exMin) {
            if (!RANGE(kg, 10, 300) || !RANGE(tempC, -10, 50) || !RANGE(exMin, 0, 600)) return null;
            const ml = kg * 33 * (tempC < 25 ? 1 : tempC < 30 ? 1.05 : tempC < 35 ? 1.1 : 1.15) + exMin * 7;
            return { ml, lo: ml * 0.9, hi: ml * 1.1 };
        }
        // 運動後補給：碳水 g/kg（低 / 中 / 高強度；少於 30 分鐘一律低）、蛋白質 0.25–0.3 g/kg、水分 = 流失體重 × 1.5（未填則以每小時汗量 0.4 / 0.7 / 1.0 L 估）
        const CARB = { low: [0.3, 0.5], mid: [0.6, 0.9], high: [1, 1.2] }, SWEAT = { low: 0.4, mid: 0.7, high: 1 };
        function recovery(kg, min, level, lossKg) {
            if (!RANGE(kg, 20, 300) || !RANGE(min, 1, 600) || !CARB[level] || !(!Number.isFinite(lossKg) || RANGE(lossKg, 0, 10))) return null;
            const c = min < 30 ? CARB.low : CARB[level], est = !Number.isFinite(lossKg);
            return { cLo: c[0] * kg, cHi: c[1] * kg, pLo: 0.25 * kg, pHi: 0.3 * kg, fluid: (est ? SWEAT[level] * min / 60 : lossKg) * 1500, est };
        }
        // 電解質飲：sport = 鹽 1.5 g / 糖 40 g 每公升；oral = 簡易口服補液（鹽 3 g / 糖 25 g 每公升）
        function electrolyte(kind, ml) {
            const r = { sport: [1.5, 40], oral: [3, 25] }[kind];
            if (!r || !RANGE(ml, 50, 5000)) return null;
            return { salt: r[0] * ml / 1000, sugar: r[1] * ml / 1000 };
        }
        // 嬰兒配方奶（只換算）：每日 120–150 mL/kg、上限 960 mL；餐數依月齡；mlPerScoop = 包裝標示每匙配幾 mL 水（常見 30）
        function formulaCalc(kg, months, mlPerScoop) {
            if (!RANGE(kg, 1.5, 15) || !Number.isInteger(months) || !RANGE(months, 0, 12) || !RANGE(mlPerScoop, 10, 60)) return null;
            const dLo = Math.min(960, 120 * kg), dHi = Math.min(960, 150 * kg), feeds = months < 1 ? 8 : months < 2 ? 7 : months < 4 ? 6 : months < 6 ? 5 : 4;
            return { dLo, dHi, feeds, fLo: dLo / feeds, fHi: dHi / feeds, sLo: dLo / feeds / mlPerScoop, sHi: dHi / feeds / mlPerScoop };
        }
        function normOpts(raw, ids, nTabs) {
            const o = raw && typeof raw === 'object' ? raw : {}, v = {};
            if (o.v && typeof o.v === 'object' && !Array.isArray(o.v)) for (const k of ids) if (typeof o.v[k] === 'string' && o.v[k].length <= 2000) v[k] = o.v[k];
            return { tab: Number.isInteger(o.tab) && o.tab >= 0 && o.tab < nTabs ? o.tab : 0, v };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'kitchenc_opts', { store, statRow } = Util;
        const nf = (x, d = 0) => isFinite(x) ? x.toLocaleString('zh-TW', { maximumFractionDigits: d }) : '—';
        const num = (id) => { const e = document.getElementById(id); return !e || e.value.trim() === '' ? NaN : +e.value; };
        const val = (id) => document.getElementById(id).value;
        const hm = (min) => { const m = Math.round(min); return m >= 60 ? Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分' : m + ' 分'; };
        const wt = (g) => g >= 1000 ? nf(g / 1000, 2) + ' kg' : nf(g) + ' g';
        const vl = (ml) => ml >= 1000 ? nf(ml / 1000, 2) + ' L' : nf(ml) + ' mL';
        const NEED = '請填入有效數字（超出合理範圍也會算不出）';
        const SIZE = [['m', '中等食量'], ['s', '偏小（×0.85）'], ['l', '偏大（×1.2）']];
        const SZ = [[0, '薄片 / 小塊（< 3 cm）'], [1, '厚塊（3–5 cm）'], [2, '整隻 / 大塊']];

        // 每個分頁：n 分頁名、h 標題、f 欄位 [id, 標籤, 預設值, 選項陣列 | 'area']、run 回傳 [標籤, 值, 色調] 陣列或訊息字串、w 提醒
        const TABS = [
            { n: '發酵', h: '麵糰發酵時間', f: [['y_pct', '酵母量（% 麵粉重）', '1'], ['y_type', '酵母種類', 'instant', [['instant', '即溶酵母'], ['dry', '活性乾酵母'], ['fresh', '新鮮酵母']]], ['y_t', '室溫（°C）', '25']],
              run: () => { const r = doughTime(num('y_pct'), num('y_t'), val('y_type')); return !r ? NEED : [['一次發酵（膨脹到約 2 倍）', nf(r.h, 1) + ' 小時', 'ok'], ['可能範圍', nf(r.lo, 1) + ' – ' + nf(r.hi, 1) + ' 小時'], ['換算即溶酵母', nf(r.eq, 2) + '%']]; },
