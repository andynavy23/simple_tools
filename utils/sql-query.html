    <template id="help">
        <h3>這是什麼</h3>
        <p>用表單組出 SQL 指令：SELECT（含 JOIN、聚合、分組、排序、分頁）、INSERT（單筆 / 多筆 / upsert）、UPDATE、DELETE、CREATE TABLE、CREATE INDEX、ALTER TABLE，還有「每組最新一筆」。可選 MySQL、PostgreSQL、SQLite、SQL Server，會自動換成各自的引號、分頁、布林、自增、upsert 與日期函式寫法。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>不確定某個資料庫的語法（LIMIT 還是 TOP？AUTO_INCREMENT 還是 IDENTITY？）。</li>
        <li>要找重複資料、每組最新一筆、最近 N 天這類常見查詢。</li>
        <li>要把同一個查詢改成另一種資料庫的寫法，或轉成 Node.js / Python 程式碼。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>選「資料庫方言」與「操作」，輸入「表名」（可寫 <kbd>schema.table</kbd>）。</li>
        <li>在「條件」每列填：欄位、運算子、值型別與值。可選「全部符合 (AND)」或「任一符合 (OR)」，並加一層群組。「包含 / 開頭 / 結尾」會自動跳脫 <kbd>%</kbd> 與 <kbd>_</kbd>。</li>
        <li>SELECT 可設欄位（含別名與 COUNT / SUM / AVG / MIN / MAX）、最多 4 個 JOIN、GROUP BY / HAVING、排序、limit / offset。</li>
        <li>下方切換「純 SQL」「參數化」「Node.js」「Python」，按「複製」。也可先套用「快速範本」再修改。</li>
        </ol>
        <h3>格式化 SQL</h3>
        <ol>
        <li>上方切到「格式化 SQL」，貼上一段（可含多個以分號分隔的）SQL。</li>
        <li>選關鍵字大小寫、逗號放行尾或行首、縮排（4 空白 / 2 空白 / Tab）。MySQL 的字串若用反斜線跳脫（<kbd>'it\'s'</kbd>）要勾選對應選項。</li>
        <li>按「格式化」：子句（SELECT / FROM / WHERE / GROUP BY …）、JOIN、AND / OR、CASE、子查詢與括號會換行縮排，按「複製」帶走。</li>
        </ol>
        <h3>DDL 工具（解析 CREATE TABLE）</h3>
        <ol>
        <li>上方切到「DDL 工具」，貼上一張或多張 <kbd>CREATE TABLE</kbd>（也認得 <kbd>CREATE INDEX</kbd> 與 <kbd>ALTER TABLE … ADD</kbd> 欄位 / 主鍵 / 唯一 / 外鍵），選方言（預設自動偵測）按「解析」。沒有範例可按「範例」。</li>
        <li>「關聯圖」：每張表一個方塊（主鍵 PK、外鍵 FK、唯一 UQ 標在欄位右邊），外鍵用連線畫到被參照的表（圓點在外鍵欄、箭頭指向被參照的表）；被參照的表排在左邊。「縮放」可選符合寬度 / 100% / 150% / 200%，圖太寬時在圖框內左右捲動；「匯出 PNG」下載 2 倍解析度的圖。</li>
        <li>「轉型別」：選 TypeScript、Go struct、Python dataclass、Java record，可選欄位命名（預設依語言慣例：TS / Java 用 camelCase、Python 用 snake_case、Go 用 PascalCase）與可空欄位的處理，按「複製」。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">貼上 select a,b from t where x=1 and y=2 order by a
        → SELECT
        →     a,
        →     b
        → FROM t
        → WHERE x = 1
        →     AND y = 2
        → ORDER BY a
        方言 PostgreSQL、表 users、條件 age 大於等於 18（數字）、排序 id、limit 10
        → SELECT *
        → FROM "users"
        → WHERE "age" >= 18
        → ORDER BY "id" ASC
        → LIMIT 10;
        同樣設定換成 SQL Server：SELECT TOP 10 * FROM [users] …</div>
        <h3>小提醒</h3>
        <ul>
        <li>「純 SQL」的字面值只適合手動貼到 SQL 工具執行；<b>寫在程式裡請用「參數化」</b>，避免 SQL 注入。字面值已把單引號加倍（MySQL 另處理反斜線）、拒絕空字元，但仍不及參數化安全。</li>
        <li>UPDATE / DELETE 條件為空時會出現紅色警告（會影響整張表），可按「先用 SELECT COUNT(*) 確認」。不提供 DROP / TRUNCATE。</li>
        <li>名稱一律加引號並跳脫；名稱不能含控制字元。欄位有錯時不會產生指令。</li>
        <li>INSERT 的空白儲存格：字串欄位視為空字串，其他型別視為 NULL。「在清單中」用逗號或換行分隔。</li>
        <li>版本：視窗函式（每組最新一筆）需 MySQL 8+ / SQLite 3.25+；SQLite RIGHT / FULL JOIN 需 3.39+；MySQL 不支援 FULL JOIN；SQL Server 的 OFFSET 分頁必須有 ORDER BY。</li>
        <li>格式化只改空白與關鍵字大小寫：字串、註解、引號識別字原封不動，識別字（表名、欄位名）大小寫不動；排版後會自動比對前後的 token 序列，不一致就不輸出。沒結尾的字串 / 註解會報錯；單獨的 <kbd>#</kbd> 要後面接空白才算註解（MySQL 風格）。不做自動換行折行，也不會檢查 SQL 語法對不對。上限 30 萬字元。貼上的 SQL 不會儲存。</li>
        <li>DDL 工具：自寫解析器，認得常見的 MySQL / PostgreSQL / SQLite / SQL Server 語法（欄位型別、NOT NULL、DEFAULT、AUTO_INCREMENT / IDENTITY / SERIAL、PRIMARY KEY、UNIQUE、FOREIGN KEY / REFERENCES、KEY / INDEX、COMMENT）。<b>解析不了的語句或子句不會默默消失</b>，會列在結果上方的「略過或解析不了的語法」（紅色是可能影響結果的，灰色是不影響欄位與關聯的，例如 ENGINE / CHARSET、CHECK 約束、INSERT）。外鍵參照的表不在貼上的內容裡時，圖上不畫那條線並列出提醒。一次最多 100 張資料表、30 萬字元；關聯圖每張表最多畫 25 個欄位（主鍵與外鍵欄位優先，其餘寫「另有 N 欄」）。</li>
        <li>轉型別的對應：先依方言把型別分成整數 / 大整數 / 浮點 / 十進位 / 布林 / 字串 / UUID / 日期 / 時間 / 二進位 / JSON，再對應到各語言。MySQL 的 <kbd>tinyint(1)</kbd> 和 <kbd>bit(1)</kbd> 視為布林、<kbd>int unsigned</kbd> 視為大整數；SQLite 的 <kbd>INTEGER</kbd> 是 64 位元；SQL Server 的 <kbd>timestamp</kbd> 是二進位（rowversion）。十進位在 TypeScript / Go 用字串（避免精度損失）、Python 用 <kbd>Decimal</kbd>、Java 用 <kbd>BigDecimal</kbd>；大整數在 TypeScript 用 <kbd>number</kbd>（超過 2^53 會失真）。陣列欄位（PostgreSQL 的 <kbd>text[]</kbd>）會轉成各語言的陣列 / List。不認得的型別當成 unknown / interface{} / Any / Object 並提醒。類別名稱是表名轉 PascalCase（不做單複數轉換）；欄位名稱與關鍵字衝突時尾端加底線；Go 的 tag 保留原欄位名。「可空欄位」：用型別標示 = TS <kbd>T | null</kbd>、Go 指標、Python <kbd>Optional[T]</kbd>、Java 包裝型別（不可空用基本型別）；可省略 = TS <kbd>?:</kbd>、Go 加 <kbd>omitempty</kbd>、Python 給預設 <kbd>None</kbd>（有預設值的欄位排在最後，因為 dataclass 規定）、Java <kbd>Optional&lt;T&gt;</kbd>。</li>
        <li>只記住「上次的方言、操作與輸出格式」（本機 sqlq_opts，壞資料會回到預設）；表名、條件與值不會儲存，重新整理就清空。用右上角備份即可管理這一個鍵。</li>
        </ul>
    </template>

    <script>
        const { store, copyWithFeedback } = Util;

        // --- pure ---
        const OPS = ['select', 'latest', 'insert', 'update', 'delete', 'createTable', 'createIndex', 'alterTable'];
        const DIALECTS = ['mysql', 'pg', 'sqlite', 'mssql'];
        const FMTS = ['sql', 'param', 'node', 'python'];
        const LIM = { rows: 30, groups: 10, cols: 60, joins: 4, order: 10, insRows: 200, list: 500, text: 100000 };
        const JOINS = { inner: 'INNER JOIN', left: 'LEFT JOIN', right: 'RIGHT JOIN', full: 'FULL JOIN' };
        const VTYPES = ['string', 'number', 'bool', 'null', 'date', 'ref', 'param', 'now', 'daysago'];
        const AGG_FN = { COUNT: 'COUNT', COUNTD: 'COUNT', SUM: 'SUM', AVG: 'AVG', MIN: 'MIN', MAX: 'MAX' };
        const MK = '\0';   // 佔位符標記（使用者文字一律拒絕 NUL，所以不會撞）
        const CMPS = { eq: '=', ne: '<>', gt: '>', gte: '>=', lt: '<', lte: '<=', like: 'LIKE', notlike: 'NOT LIKE' };

        const newRow = (o = {}) => ({ k: 'row', field: '', agg: '', op: 'eq', type: 'string', value: '', value2: '', ...o });
        const newGroup = (mode = 'and', items = []) => ({ k: 'grp', mode, items });
        const newCol = (o = {}) => ({ agg: '', field: '', alias: '', ...o });
        const newCt = (o = {}) => ({ name: '', type: 'int', len: '', pk: false, nn: false, uq: false, ai: false, defType: 'none', def: '', fk: '', ...o });
        function defaultState() {
            return {
                op: 'select', d: 'mysql', table: '',
                sel: { distinct: false, cols: [newCol()], alias: '', joins: [], groupBy: '', having: newGroup('and', []), orderBy: [], limit: '', offset: '' },
                where: newGroup('and', [newRow()]),
                ins: { cols: [{ name: '', type: 'string' }], rows: [['']], upsert: false, keys: '' },
                upd: [{ field: '', type: 'string', value: '' }],
                ct: { ifNot: false, cols: [newCt({ name: 'id', pk: true, ai: true })] },
                ix: { name: '', cols: '', unique: false, ifNot: false },
                alt: { action: 'add', col: newCt(), from: '', to: '', name: '' },
                lat: { group: '', order: '', dir: 'desc' },

            card.hidden = false; dSchema = null; dLayout = null; dCode = '';
            ['#dSkip', '#dTabs', '#dDiag', '#dCode'].forEach(x => { $(x).hidden = true; });
            if (!src.trim()) { st.textContent = '請先貼上 CREATE TABLE'; return; }
            try { dSchema = ddlParse(src); } catch (e) { dSchema = null; st.textContent = '✗ ' + e.message; return; }
            const sk = dSchema.skipped;
            $('#dSkipList').replaceChildren(...sk.map(x => h('li', { style: x.level === 'info' ? 'color:var(--muted)' : '' }, `${x.reason}：${x.text}`)));
            $('#dSkip').hidden = !sk.length; $('#dSkip').open = sk.some(x => x.level === 'warn'); $('#dSkipSum').textContent = `略過或解析不了的語法（${sk.length}）`;
            if (!dSchema.tables.length) { dSchema = null; st.textContent = '✗ 沒有解析到任何 CREATE TABLE'; return; }
            const auto = $('#dDia').value === 'auto'; dDialect = auto ? ddlDetect(src) : $('#dDia').value;
            const T = dSchema.tables;
            st.textContent = `✓ 解析到 ${T.length} 張資料表、${T.reduce((a, t) => a + t.columns.length, 0)} 個欄位、${T.reduce((a, t) => a + t.fks.length, 0)} 條外鍵；方言：${D_LABELS[dDialect]}${auto ? '（自動偵測）' : ''}`;
            dLayout = ddlLayout(dSchema, dMeasure);
            $('#dTabs').hidden = false; dView([...$('#dTabs').children].find(b => b.getAttribute('aria-pressed') === 'true').dataset.v);
        };

        { const o = loadOpts(store.get('sqlq_opts', null)); S.op = o.op; S.d = o.d; fmt = o.fmt; }
        markFmt(); build();
    </script>
</body>

</html>
