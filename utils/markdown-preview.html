<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Markdown 即時預覽：左邊寫、右邊看，支援標題、清單、表格、程式碼、引用與連結，輸出 HTML 前會先消毒。">
    <meta property="og:title" content="Markdown 即時預覽" />
    <meta property="og:description" content="左邊寫 Markdown，右邊即時預覽，可複製 HTML。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/markdown-preview.html" />
    <meta name="st-keys" content="md_src">
    <title>Markdown 即時預覽</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 1100px;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .mtabs {
            display: none;
            gap: 8px;
            margin-bottom: 12px;
        }

        .mtabs button {
            flex: 1;
        }


        @media (max-width: 760px) {
            .two {
                grid-template-columns: 1fr;
            }

            .mtabs {
                display: flex;
            }

            .two.pv>.card:first-child,
            .two:not(.pv)>.card:last-child {
                display: none;
            }

            textarea,
            #preview {
                min-height: 60vh;
            }
        }

        .two .card {
            margin: 0;
        }

        textarea {
            min-height: 520px;
            resize: vertical;
            font: 14px/1.6 var(--mono);
        }

        #preview {
            min-height: 520px;
            overflow-wrap: anywhere;
        }

        .bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .bar .muted {
            margin-right: auto;
            font-size: 13px;
        }

        /* 預覽內容的排版 */
        #preview h1,
        #preview h2,
        #preview h3,
        #preview h4,
        #preview h5,
        #preview h6 {
            margin: 1.2em 0 .5em;
            line-height: 1.3;
        }

        #preview h1 {
            font-size: 1.8em;
            border-bottom: 1px solid var(--fill);
            padding-bottom: .2em;
        }

        #preview h2 {
            font-size: 1.4em;
            border-bottom: 1px solid var(--fill);
            padding-bottom: .2em;
        }

        #preview h3 {
            font-size: 1.2em;
        }

        #preview p {
            margin: .6em 0;
        }

        #preview code {
            font: .9em var(--mono);
            background: var(--fill);
            padding: .1em .35em;
            border-radius: 5px;
        }

        #preview pre {
            background: var(--fill);
            border-radius: 10px;
            padding: 10px 12px;
            overflow-x: auto;
        }

        #preview pre code {
            background: none;
            padding: 0;
        }

        #preview blockquote {
            margin: .6em 0;
            padding: .1em 1em;
            border-left: 4px solid var(--blue);
            color: var(--muted);
        }

        #preview table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
        }

        #preview th,
        #preview td {
            border: 1px solid var(--fill);
            padding: 6px 12px;
        }

        #preview th {
            background: var(--fill);
        }

        #preview img {
            max-width: 100%;
        }

        #preview hr {
            border: 0;
            border-top: 1px solid var(--fill);
            margin: 1.2em 0;
        }

        #preview ul,
        #preview ol {
            padding-left: 1.6em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>Markdown 即時預覽</h1>
        <p class="sub">桌機左邊寫、右邊即時看；手機用「編輯 / 預覽」切換。輸入的 HTML 一律當成文字，不會被執行。</p>

        <div class="mtabs"><button id="tEdit" aria-pressed="true">編輯</button><button id="tPrev" aria-pressed="false">預覽</button></div>
        <div class="two" id="two">
            <div class="card"><textarea id="src" spellcheck="false" aria-label="Markdown 原文"></textarea></div>
            <div class="card">
                <div class="bar"><span class="muted" id="count"></span><button class="sm" id="copy">複製 HTML</button></div>
                <div id="preview" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>一邊寫 Markdown，一邊即時看排版後的樣子。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>寫 README、筆記、公告，想先確認排版。</li>
        <li>要把 Markdown 轉成 HTML 貼到別的地方。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在「編輯」區輸入 Markdown，支援標題、粗體、斜體、刪除線、行內程式碼、連結、圖片、清單、引用、表格與程式碼區塊。</li>
        <li>電腦版左右並排即時預覽；手機請用上方的「編輯 / 預覽」切換。</li>
        <li>預覽區上方會顯示字數，按「複製 HTML」可複製轉出的 HTML。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">輸入 **重點** 與 [連結](https://example.com)
        → 預覽顯示粗體的「重點」與可點擊的「連結」</div>
        <h3>小提醒</h3>
        <ul>
        <li>你輸入的 HTML 標籤一律當文字顯示，不會被執行，所以可以放心貼別人的文字。</li>
        <li>連結只允許 http(s)、mailto 與站內相對路徑；圖片只接受 http(s) 網址。</li>
        <li>內容會自動存在本機瀏覽器，下次開啟還在，不會上傳。內容太大存不下時，字數旁會提示「沒有自動儲存」，請自行複製備份。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { esc } = Util;

        // --- pure ---
        // 精簡 Markdown → HTML。先把整份文字的 < > & " 全部跳脫，之後只由本函式產生標籤，
        // 所以輸入的 HTML 不會被執行；連結 / 圖片網址另外只允許安全的協定。
        const unesc = (u) => u.replace(/&#39;/g, "'").replace(/&amp;/g, '&'); // esc 的反向（網址用）
        const safeHref = (u) => (/^(https?:|mailto:|#|\/|\.\.?\/)/i.test(u.trim()) ? u.trim() : '#');
        const safeSrc = (u) => (/^https?:/i.test(u.trim()) ? u.trim() : '');

        // 行內語法（輸入已跳脫）
        function inline(s) {
            const codes = [];
            s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
            s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, alt, url) => { const u = safeSrc(unesc(url)); return u ? `<img src="${esc(u)}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">` : alt; });
            s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, t, url) => `<a href="${esc(safeHref(unesc(url)))}" target="_blank" rel="noopener noreferrer">${t}</a>`);
            s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`);
            s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_]*)_(?!\w)/g, '$1<em>$2</em>');
            s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
            return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
        }

        function mdToHtml(src) {
            const lines = esc(src.replace(/\r\n?/g, '\n').replace(/[\u0000\u0001]/g, '')).split('\n');
            const out = [];
            let i = 0;
            const isBlank = (l) => /^\s*$/.test(l);
            const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
            const startsBlock = (l) => /^(#{1,6}\s|```|>\s?|\s*([-*_])(\s*\2){2,}\s*$)/.test(l) || listRe.test(l);

            while (i < lines.length) {
                const line = lines[i];
                if (isBlank(line)) { i++; continue; }

                // 程式碼區塊
                const fence = line.match(/^```(\S*)/);
                if (fence) {
                    const buf = [];
                    i++;
                    while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
                    i++;
                    out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
                    continue;
                }
                // 標題
                let m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
                if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
                // 分隔線
                if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
                // 引用
                if (/^&gt;\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/, ''));
                    out.push(`<blockquote>${mdToHtmlRaw(buf.join('\n'))}</blockquote>`);
                    continue;
                }
                // 表格（標題列 + 分隔列）
                if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
                    const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
                    const head = cells(line);
                    const aligns = cells(lines[i + 1]).map(c => (c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : ''));
                    i += 2;
                    let html = '<table><thead><tr>' + head.map((c, k) => `<th${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
                    while (i < lines.length && lines[i].includes('|') && !isBlank(lines[i])) {
                        html += '<tr>' + cells(lines[i++]).map((c, k) => `<td${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</td>`).join('') + '</tr>';
                    }
                    out.push(html + '</tbody></table>');
                    continue;
                }
                // 清單（以縮排做一層巢狀）
                m = line.match(listRe);
                if (m) {
                    const ordered = /\d/.test(m[2]);
                    const items = [];
                    const baseIndent = m[1].length;
                    while (i < lines.length) {
                        const lm = lines[i].match(listRe);
                        if (!lm) break;
                        if (lm[1].length > baseIndent && items.length) {
                            // 子層：收集連續更深縮排的項目
                            const sub = [];
                            while (i < lines.length && listRe.test(lines[i]) && lines[i].match(listRe)[1].length > baseIndent) sub.push(lines[i++].slice(baseIndent + 2));
                            items[items.length - 1].sub = mdToHtmlRaw(sub.join('\n'));
                            continue;
                        }
                        if (lm[1].length < baseIndent) break;
                        items.push({ text: lm[3], sub: '' });
                        i++;
                    }
                    const tag = ordered ? 'ol' : 'ul';
                    out.push(`<${tag}>` + items.map(it => `<li>${inline(it.text)}${it.sub}</li>`).join('') + `</${tag}>`);
                    continue;
                }
                // 段落
                const buf = [];
                while (i < lines.length && !isBlank(lines[i]) && (buf.length === 0 || !startsBlock(lines[i]))) buf.push(lines[i++]);
                out.push(`<p>${buf.map(l => inline(l.replace(/\s+$/, m2 => (m2.length >= 2 ? '\u0001' : '')))).join('\n').replace(/\u0001\n?/g, '<br>')}</p>`);
            }
            return out.join('\n');
        }
        // 巢狀區塊（引用 / 子清單）用的版本：輸入已經跳脫過，直接再解析不可重複跳脫
        function mdToHtmlRaw(escaped) {
            return mdToHtml(escaped.replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&quot;/g, '"').replace(/&amp;/g, '&'));
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const SAMPLE = `# Markdown 預覽

左邊寫，右邊即時看。支援 **粗體**、*斜體*、~~刪除線~~、\`行內程式碼\` 與 [連結](https://example.com)。

## 清單
- 第一項
- 第二項
  - 巢狀項目
1. 步驟一
2. 步驟二

> 引用文字

| 名稱 | 說明 |
| --- | :---: |
| 表格 | 支援對齊 |

\`\`\`js
console.log('hello');
\`\`\`
`;
        const src = $('#src'), prev = $('#preview');
        const saved = Util.store.get('md_src', SAMPLE);
        src.value = typeof saved === 'string' ? saved : SAMPLE;

        function render() {
            prev.innerHTML = mdToHtml(src.value);
            $('#count').textContent = `${src.value.length} 字` + (Util.store.set('md_src', src.value) ? '' : '（太大，瀏覽器存不下，沒有自動儲存）');
        }

        src.oninput = render;
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), prev.innerHTML, () => { });
        render();
        const tab = (pv) => { $('#two').classList.toggle('pv', pv); $('#tEdit').setAttribute('aria-pressed', !pv); $('#tPrev').setAttribute('aria-pressed', pv); };
        $('#tEdit').onclick = () => tab(false); $('#tPrev').onclick = () => tab(true);
    </script>
</body>

</html>
