    <style>
        :root {

                grid-template-columns: 1fr;

            .two.pv>.card:first-child,

                min-height: 60vh;
                min-height: 60dvh;

            display: flex;

            font-size: 14px;

            min-height: 0;
            height: 8em;

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>Markdown 即時預覽</h1>
        <p class="sub">桌機左邊寫、右邊即時看；手機用「編輯 / 預覽」切換。輸入的 HTML 一律當成文字，不會被執行。</p>

        <div class="mtabs"><button id="tEdit" aria-pressed="true">編輯</button><button id="tPrev" aria-pressed="false">預覽</button></div>
        <div class="two" id="two">
            <div class="card"><textarea id="src" spellcheck="false" aria-label="Markdown 原文"></textarea></div>
            <div class="card">
                <div class="bar"><span class="muted" id="count"></span><button class="sm" id="copy">複製 HTML</button></div>
                <div id="preview" aria-live="polite"></div>
            </div>
        </div>

        <div class="card" id="tblCard">
            <details id="tblBox">
                <summary><b>表格工具</b></summary>
                <p class="muted" style="font-size:13px;margin:6px 0 10px">像試算表一樣填格子，產生 Markdown 表格；也能把 CSV / TSV 轉成表格，或把編輯區的表格轉成 CSV。</p>
                <div class="tg"><table id="tblGrid"></table></div>
                <div class="bar">
                    <button class="sm" id="tAddRow">＋ 列</button>
                    <button class="sm" id="tDelRow">－ 列</button>
                    <button class="sm" id="tAddCol">＋ 欄</button>
                    <button class="sm" id="tDelCol">－ 欄</button>
                    <label><input type="checkbox" id="tHead" checked> 第一列為標題</label>
                    <label><input type="checkbox" id="tPad" checked> 對齊欄寬</label>
                </div>
                <textarea id="tblOut" readonly spellcheck="false" aria-label="產生的 Markdown 表格"></textarea>
                <div class="bar" style="margin-top:8px">
                    <button class="primary" id="tblInsert">插入編輯區</button>
                    <button id="tblCopy">複製</button>
                    <button id="tblLoad">從編輯區載入表格</button>
                </div>
                <h3 style="margin:14px 0 6px;font-size:15px">CSV / TSV</h3>
                <textarea id="tblPaste" spellcheck="false" placeholder="貼上 CSV 或從試算表複製的 TSV，按「轉成表格」" aria-label="CSV 或 TSV 內容"></textarea>
                <div class="bar" style="margin-top:8px">
                    <button id="tblFromCsv">轉成表格</button>
                    <button id="tblToCsv">編輯區的表格 → CSV</button>
                    <button id="tblCopyCsv">複製 CSV</button>
                </div>
                <div id="tblMsg" role="status"></div>
            </details>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>一邊寫 Markdown，一邊即時看排版後的樣子。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>寫 README、筆記、公告，想先確認排版。</li>
        <li>要把 Markdown 轉成 HTML 貼到別的地方。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在「編輯」區輸入 Markdown，支援標題、粗體、斜體、刪除線、行內程式碼、連結、圖片、清單、引用、表格與程式碼區塊。</li>
        <li>電腦版左右並排即時預覽；手機請用上方的「編輯 / 預覽」切換。</li>
        <li>預覽區上方會顯示字數，按「複製 HTML」可複製轉出的 HTML。</li>
        </ol>
        <h3>表格工具</h3>
        <ol>
        <li>在格子裡填內容，用「＋ 列 / － 列 / ＋ 欄 / － 欄」調整大小；每欄上方的選單可設對齊（左 / 中 / 右）。</li>
        <li>「第一列為標題」取消勾選時，會產生空白的標題列（Markdown 表格一定要有標題列）。「對齊欄寬」會把每欄補空白對齊，中文以全形（2 格）計算。</li>
        <li>下方文字框即時顯示 Markdown，按「插入編輯區」會放在編輯區游標處（有選取文字就取代），前後自動空一行；也可按「複製」。</li>
        <li>CSV：貼上 CSV 或從 Excel / Google 試算表複製的內容（Tab 分隔），按「轉成表格」填進格子。</li>
        <li>反向：在編輯區選取一個 Markdown 表格（或把游標放在表格裡），按「編輯區的表格 → CSV」；「從編輯區載入表格」則把它載回格子繼續編輯。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">輸入 **重點** 與 [連結](https://example.com)
        → 預覽顯示粗體的「重點」與可點擊的「連結」
        表格工具：貼上三行 CSV
        姓名,城市
        小明,台北
        Amy,Tokyo
        按「轉成表格」
        → | 姓名 | 城市  |
        → | ---- | ----- |
        → | 小明 | 台北  |
        → | Amy  | Tokyo |</div>

        <h3>小提醒</h3>
        <ul>
        <li>表格裡的 | 會自動跳脫成 \|，儲存格內的換行會變成空白；表格工具一次最多 500 列、50 欄，格子內容不會自動儲存（只有編輯區內容會存在本機）。</li>
        <li>你輸入的 HTML 標籤一律當文字顯示，不會被執行，所以可以放心貼別人的文字。</li>
        <li>連結只允許 http(s)、mailto 與站內相對路徑；圖片只接受 http(s) 網址。</li>
        <li>內容會自動存在本機瀏覽器，下次開啟還在，不會上傳。內容太大存不下時，字數旁會提示「沒有自動儲存」，請自行複製備份。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { esc, parseCSV, csvStringify } = Util;

        // --- pure ---
        // 精簡 Markdown → HTML。先把整份文字的 < > & " 全部跳脫，之後只由本函式產生標籤，
        // 所以輸入的 HTML 不會被執行；連結 / 圖片網址另外只允許安全的協定。
        const unesc = (u) => u.replace(/&#39;/g, "'").replace(/&amp;/g, '&'); // esc 的反向（網址用）
        const safeHref = (u) => (/^(https?:|mailto:|#|\/|\.\.?\/)/i.test(u.trim()) ? u.trim() : '#');
        const safeSrc = (u) => (/^https?:/i.test(u.trim()) ? u.trim() : '');

        // 行內語法（輸入已跳脫）
        function inline(s) {
            const codes = [];
            s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
            s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, alt, url) => { const u = safeSrc(unesc(url)); return u ? `<img src="${esc(u)}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">` : alt; });
            s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, t, url) => `<a href="${esc(safeHref(unesc(url)))}" target="_blank" rel="noopener noreferrer">${t}</a>`);
            s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`);
            s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_]*)_(?!\w)/g, '$1<em>$2</em>');
            s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
            return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
        }

        function mdToHtml(src) {
            const lines = esc(src.replace(/\r\n?/g, '\n').replace(/[\u0000\u0001]/g, '')).split('\n');
            const out = [];
            let i = 0;
            const isBlank = (l) => /^\s*$/.test(l);
            const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
            const startsBlock = (l) => /^(#{1,6}\s|```|>\s?|\s*([-*_])(\s*\2){2,}\s*$)/.test(l) || listRe.test(l);

            while (i < lines.length) {
                const line = lines[i];
                if (isBlank(line)) { i++; continue; }

                // 程式碼區塊
                const fence = line.match(/^```(\S*)/);
                if (fence) {
                    const buf = [];
                    i++;
                    while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
                    i++;
                    out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
                    continue;
                }
                // 標題
                let m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
                if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
                // 分隔線
                if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
                // 引用
                if (/^&gt;\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/, ''));
                    out.push(`<blockquote>${mdToHtmlRaw(buf.join('\n'))}</blockquote>`);
                    continue;
                }
                // 表格（標題列 + 分隔列）
                if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
                    const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
                    const head = cells(line);
                    const aligns = cells(lines[i + 1]).map(c => (c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : ''));
                    i += 2;
                    let html = '<table><thead><tr>' + head.map((c, k) => `<th${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
                    while (i < lines.length && lines[i].includes('|') && !isBlank(lines[i])) {
                        html += '<tr>' + cells(lines[i++]).map((c, k) => `<td${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</td>`).join('') + '</tr>';
                    }
                    out.push(html + '</tbody></table>');
                    continue;
                }
                // 清單（以縮排做一層巢狀）
                m = line.match(listRe);
                if (m) {
                    const ordered = /\d/.test(m[2]);
                    const items = [];
                    const baseIndent = m[1].length;
                    while (i < lines.length) {
                        const lm = lines[i].match(listRe);
                        if (!lm) break;
                        if (lm[1].length > baseIndent && items.length) {
                            // 子層：收集連續更深縮排的項目
                            const sub = [];
                            while (i < lines.length && listRe.test(lines[i]) && lines[i].match(listRe)[1].length > baseIndent) sub.push(lines[i++].slice(baseIndent + 2));
                            items[items.length - 1].sub = mdToHtmlRaw(sub.join('\n'));
                            continue;
                        }
                        if (lm[1].length < baseIndent) break;
                        items.push({ text: lm[3], sub: '' });
                        i++;
                    }
                    const tag = ordered ? 'ol' : 'ul';
                    out.push(`<${tag}>` + items.map(it => `<li>${inline(it.text)}${it.sub}</li>`).join('') + `</${tag}>`);
                    continue;
                }
                // 段落
                const buf = [];
                while (i < lines.length && !isBlank(lines[i]) && (buf.length === 0 || !startsBlock(lines[i]))) buf.push(lines[i++]);
                out.push(`<p>${buf.map(l => inline(l.replace(/\s+$/, m2 => (m2.length >= 2 ? '\u0001' : '')))).join('\n').replace(/\u0001\n?/g, '<br>')}</p>`);
            }
            return out.join('\n');
        }
        // 巢狀區塊（引用 / 子清單）用的版本：輸入已經跳脫過，直接再解析不可重複跳脫
        function mdToHtmlRaw(escaped) {
            return mdToHtml(escaped.replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&quot;/g, '"').replace(/&amp;/g, '&'));
        }
        // ---------- 表格輔助 ----------
        const TBL_MAX_ROWS = 500, TBL_MAX_COLS = 50;
        // 顯示寬度：全形（中日韓、全形符號、emoji）算 2，組合字元 / 零寬字元算 0，其餘 1
        const WIDE = /[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹯＀-｠￠-￦\u{1F300}-\u{1FAFF}\u{20000}-\u{3FFFD}]/u;
        const ZERO = /[̀-ͯ​-‏︀-️\u{E0100}-\u{E01EF}]/u;
        function strW(s) { let w = 0; for (const ch of String(s)) w += ZERO.test(ch) ? 0 : WIDE.test(ch) ? 2 : 1; return w; }
        const tblEscCell = (c) => String(c ?? '').replace(/\r?\n|\r/g, ' ').trim().replace(/\|/g, '\\|');

        // rows：二維字串陣列（不齊會補空）；aligns：每欄 ''（預設左）/ 'center' / 'right'；header：第一列是標題；pad：把欄寬對齊
        function mdTableFromRows(rows, { aligns = [], header = true, pad = true } = {}) {
            if (!Array.isArray(rows) || !rows.length) throw new Error('沒有資料');
            const n = Math.max(1, ...rows.map(r => r.length));
            if (rows.length > TBL_MAX_ROWS || n > TBL_MAX_COLS) throw new Error(`表格太大（最多 ${TBL_MAX_ROWS} 列、${TBL_MAX_COLS} 欄）`);
            const g = rows.map(r => Array.from({ length: n }, (_, c) => tblEscCell(r[c])));
            const head = header ? g[0] : Array(n).fill(''), body = header ? g.slice(1) : g;
            const al = Array.from({ length: n }, (_, c) => (aligns[c] === 'center' || aligns[c] === 'right' ? aligns[c] : ''));
            const W = al.map((a, c) => Math.max(a === 'center' ? 4 : 3, ...(pad ? [head, ...body].map(r => strW(r[c])) : []))), w = (c) => W[c];   // 置中分隔列 :--: 至少 4 格（預覽的表格規則要求至少兩個 -）
            const fit = (t, c) => {
                if (!pad) return t;
                const gap = w(c) - strW(t);
                return al[c] === 'right' ? ' '.repeat(gap) + t : al[c] === 'center' ? ' '.repeat(gap >> 1) + t + ' '.repeat(gap - (gap >> 1)) : t + ' '.repeat(gap);
            };
            const line = (r) => '| ' + r.map((t, c) => fit(t, c)).join(' | ') + ' |';
            const sep = '| ' + al.map((a, c) => { const k = w(c); return a === 'center' ? ':' + '-'.repeat(k - 2) + ':' : a === 'right' ? '-'.repeat(k - 1) + ':' : '-'.repeat(k); }).join(' | ') + ' |';
            return [line(head), sep, ...body.map(line)].join('\n');
        }

        // 切一列 Markdown 表格：忽略頭尾的 |，\| 還原成 |
        function tblSplitRow(line) {
            const t = line.trim(), cells = []; let cur = '', endPipe = false;
            for (let i = 0; i < t.length; i++) {
                const c = t[i]; endPipe = false;
                if (c === '\\' && t[i + 1] === '|') { cur += '|'; i++; }
                else if (c === '|') { cells.push(cur); cur = ''; endPipe = true; }
                else cur += c;
            }
            cells.push(cur);
            if (t[0] === '|') cells.shift();
            if (endPipe) cells.pop();
            return cells.map(c => c.trim());
        }
        const TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;   // 解析比預覽寬鬆：GFM 允許只有一個 -（如 :-:）
        // 解析 Markdown 表格文字 → { rows（第一列是標題）, aligns }；找不到表格丟出錯誤
        function mdTableParse(text) {
            const ls = String(text).split(/\r?\n/).filter(l => l.trim());
            if (ls.length < 2 || !ls[0].includes('|') || !TBL_SEP.test(ls[1])) throw new Error('找不到 Markdown 表格（需要「標題列」加上「| --- | --- |」分隔列）');
            const head = tblSplitRow(ls[0]), n = head.length;
            if (n > TBL_MAX_COLS || ls.length - 1 > TBL_MAX_ROWS) throw new Error(`表格太大（最多 ${TBL_MAX_ROWS} 列、${TBL_MAX_COLS} 欄）`);
            const aligns = tblSplitRow(ls[1]).slice(0, n).map(c => (c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : ''));
            while (aligns.length < n) aligns.push('');
            const fix = (r) => Array.from({ length: n }, (_, c) => r[c] ?? '');
            return { rows: [head, ...ls.slice(2).map(l => fix(tblSplitRow(l)))], aligns };
        }
        // CSV / TSV 文字 → 二維陣列。有 Tab 且第一列沒有逗號時當 TSV（從試算表複製貼上）
        function tblFromText(text) {
            const first = String(text).split(/\r?\n/, 1)[0];
            const rows = parseCSV(text, first.includes('\t') && !first.includes(',') ? '\t' : ',');
            if (!rows.length) throw new Error('沒有資料');
            const n = Math.max(...rows.map(r => r.length));
            if (rows.length > TBL_MAX_ROWS || n > TBL_MAX_COLS) throw new Error(`資料太大（最多 ${TBL_MAX_ROWS} 列、${TBL_MAX_COLS} 欄）`);
            return rows.map(r => Array.from({ length: n }, (_, c) => r[c] ?? ''));
        }
        // Markdown 表格文字 → CSV
        function mdTableToCsv(text) {
            const { rows } = mdTableParse(text);
            return csvStringify(rows[0], rows.slice(1)).replace(/\r\n/g, '\n');
        }
        // 在編輯區找要處理的表格文字：有選取就用選取範圍（延伸到整行）；沒選取就取游標所在的那一段連續含 | 的行
        function tblFindText(value, start, end) {
            const lineS = (p) => value.lastIndexOf('\n', p - 1) + 1, lineE = (p) => { const k = value.indexOf('\n', p); return k < 0 ? value.length : k; };
            if (end > start) {   // 選取已含標題列 + 分隔列就照選取；只選到表格的一小段時，改取游標（選取起點）所在的整張表
                const sel = value.slice(lineS(start), lineE(end)), ls = sel.split('\n').filter(l => l.trim());
                if (ls.length >= 2 && TBL_SEP.test(ls[1])) return sel;
            }
            let s = lineS(start), e = lineE(start);
            const isRow = (a, b) => value.slice(a, b).includes('|') && value.slice(a, b).trim() !== '';
            if (!isRow(s, e)) return '';
            while (s > 0 && isRow(lineS(s - 1), s - 1)) s = lineS(s - 1);
            while (e < value.length && isRow(e + 1, lineE(e + 1))) e = lineE(e + 1);
            return value.slice(s, e);
        }
        // 把表格文字插到 [start, end)（取代選取），前後補空行；回傳 { value, caret }
        function tblInsert(value, start, end, md) {
            const before = value.slice(0, start), after = value.slice(end);
            const lead = !before ? '' : before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
            const trail = !after ? '\n' : after.startsWith('\n\n') ? '' : after.startsWith('\n') ? '\n' : '\n\n';
            const head = before + lead + md + trail;
            return { value: head + after, caret: head.length };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const SAMPLE = `# Markdown 預覽

左邊寫，右邊即時看。支援 **粗體**、*斜體*、~~刪除線~~、\`行內程式碼\` 與 [連結](https://example.com)。

## 清單
- 第一項
- 第二項
  - 巢狀項目
1. 步驟一
2. 步驟二

> 引用文字

| 名稱 | 說明 |
| --- | :---: |
| 表格 | 支援對齊 |

\`\`\`js
console.log('hello');
\`\`\`
`;
        const src = $('#src'), prev = $('#preview');
        const saved = Util.store.get('md_src', SAMPLE);
        src.value = typeof saved === 'string' ? saved : SAMPLE;

        function render() {
            prev.innerHTML = mdToHtml(src.value);
            $('#count').textContent = `${src.value.length} 字` + (Util.store.set('md_src', src.value) ? '' : '（太大，瀏覽器存不下，沒有自動儲存）');
        }

        src.oninput = render;
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), prev.innerHTML, () => { });
        render();
        // ---------- 表格工具（格子內容不存檔） ----------
        const tbl = { rows: [['', '', ''], ['', '', ''], ['', '', '']], aligns: ['', '', ''] };
        const tmsg = (t, cls) => { const e = $('#tblMsg'); e.textContent = t; e.className = cls || ''; };
        function tblOutput() {
            try { $('#tblOut').value = mdTableFromRows(tbl.rows, { aligns: tbl.aligns, header: $('#tHead').checked, pad: $('#tPad').checked }); }
            catch (e) { $('#tblOut').value = ''; tmsg('✗ ' + e.message, 'err'); }
        }
        function tblDraw() {
            const g = $('#tblGrid'), n = tbl.rows[0].length;
            g.replaceChildren();
            const hr = g.createTHead().insertRow(), tb = g.createTBody();
            for (let c = 0; c < n; c++) {
                const sel = document.createElement('select'); sel.setAttribute('aria-label', `第 ${c + 1} 欄對齊`);
                [['', '左'], ['center', '中'], ['right', '右']].forEach(([v, t]) => sel.add(new Option(t, v)));
                sel.value = tbl.aligns[c] || '';
                sel.onchange = () => { tbl.aligns[c] = sel.value; tblOutput(); };
                hr.insertCell().append(sel);
            }
            tbl.rows.forEach((row, r) => {
                const tr = tb.insertRow();
                row.forEach((v, c) => {
                    const inp = document.createElement('input'); inp.type = 'text'; inp.value = v; inp.autocomplete = 'off';
                    inp.setAttribute('aria-label', `第 ${r + 1} 列第 ${c + 1} 欄`);
                    inp.oninput = () => { tbl.rows[r][c] = inp.value; tmsg(''); tblOutput(); };
                    tr.insertCell().append(inp);
                });
            });
            tblOutput();
        }
        function tblSet(rows, aligns) { tbl.rows = rows; tbl.aligns = aligns || rows[0].map(() => ''); tmsg(''); tblDraw(); }
        $('#tAddRow').onclick = () => { if (tbl.rows.length >= TBL_MAX_ROWS) return tmsg(`✗ 最多 ${TBL_MAX_ROWS} 列`, 'err'); tbl.rows.push(tbl.rows[0].map(() => '')); tmsg(''); tblDraw(); };
        $('#tDelRow').onclick = () => { if (tbl.rows.length <= 1) return tmsg('✗ 至少要留一列', 'err'); tbl.rows.pop(); tmsg(''); tblDraw(); };
        $('#tAddCol').onclick = () => { if (tbl.rows[0].length >= TBL_MAX_COLS) return tmsg(`✗ 最多 ${TBL_MAX_COLS} 欄`, 'err'); tbl.rows.forEach(r => r.push('')); tbl.aligns.push(''); tmsg(''); tblDraw(); };
        $('#tDelCol').onclick = () => { if (tbl.rows[0].length <= 1) return tmsg('✗ 至少要留一欄', 'err'); tbl.rows.forEach(r => r.pop()); tbl.aligns.pop(); tmsg(''); tblDraw(); };
        $('#tHead').onchange = $('#tPad').onchange = tblOutput;
        $('#tblInsert').onclick = () => {
            const md = $('#tblOut').value; if (!md) return tmsg('✗ 沒有可插入的表格', 'err');
            const r = tblInsert(src.value, src.selectionStart, src.selectionEnd, md);
            src.value = r.value; src.setSelectionRange(r.caret, r.caret); render(); tmsg('✓ 已插入編輯區', 'ok');
        };
        $('#tblCopy').onclick = () => Util.copyWithFeedback($('#tblCopy'), $('#tblOut').value, () => { });
        $('#tblCopyCsv').onclick = () => Util.copyWithFeedback($('#tblCopyCsv'), $('#tblPaste').value, () => { });
        $('#tblFromCsv').onclick = () => {
            try { tblSet(tblFromText($('#tblPaste').value)); tmsg(`✓ 已轉成 ${tbl.rows.length} 列 × ${tbl.rows[0].length} 欄`, 'ok'); }
            catch (e) { tmsg('✗ ' + e.message, 'err'); }
        };
        const editorTable = () => tblFindText(src.value, src.selectionStart, src.selectionEnd);
        $('#tblLoad').onclick = () => {
            try { const t = mdTableParse(editorTable()); $('#tHead').checked = true; tblSet(t.rows, t.aligns); tmsg(`✓ 已載入 ${t.rows.length} 列 × ${t.rows[0].length} 欄`, 'ok'); }
            catch (e) { tmsg('✗ ' + e.message, 'err'); }
        };
        $('#tblToCsv').onclick = () => {
            try { $('#tblPaste').value = mdTableToCsv(editorTable()); tmsg('✓ 已轉成 CSV', 'ok'); }
            catch (e) { tmsg('✗ ' + e.message, 'err'); }
        };
        tblDraw();
        const tab = (pv) => { $('#two').classList.toggle('pv', pv); $('#tEdit').setAttribute('aria-pressed', !pv); $('#tPrev').setAttribute('aria-pressed', pv); };
        $('#tEdit').onclick = () => tab(false); $('#tPrev').onclick = () => tab(true);
    </script>
