    <template id="help">
        <h3>這是什麼</h3>
        <p>一次產生一批 UUID 或測試用的隨機資料：隨機整數、隨機日期、假姓名、假手機號碼、假 Email。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>開發時需要一堆唯一 ID（UUID v4）當資料庫主鍵或測試資料；想要能依時間排序的 ID 就用 UUID v7 或 ULID。</li>
        <li>做表單、報表的假資料，不想用真人姓名電話。</li>
        <li>臨時抽一個範圍內的數字或日期。</li>
        <li>需要一整張假資料表（姓名、手機、信箱、地址、日期…）來測試報表、匯入或資料庫，用下方的「假資料表格」。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在「種類」選你要的資料，種類不同，下方會出現對應選項（例如整數的最小 / 最大、日期的起迄、UUID 的大寫 / 不含連字號）。</li>
        <li>在「數量」填要幾筆（1 到 1000）。</li>
        <li>按「產生」，結果一行一筆列在下面的框裡。</li>
        <li>按「複製全部」把整個結果帶走。</li>
        </ol>
        <h3>假資料表格怎麼用</h3>
        <ol>
        <li>在「假資料表格」卡片設定欄位：每欄有名稱與型別，部分型別有選項（整數 / 小數的範圍、日期起迄、列舉的選項、流水號起始值、文字語言）。用 ↑ ↓ 調順序、✕ 刪除，下拉選單加新欄位（最多 30 欄）。</li>
        <li>填列數（1 到 10000）與輸出格式：CSV、JSON、JSON Lines、SQL INSERT、Markdown 表格。選 SQL 時可填表名並選 MySQL / PostgreSQL / SQLite，字串與識別字會依方言跳脫。</li>
        <li>要重現同一份資料就填「種子」：同欄位、同列數、同種子一定得到完全相同的結果；空白則每次不同。</li>
        <li>按「產生表格」，再用「複製全部」或「下載檔案」帶走；「重設欄位」回到預設欄位。</li>
        </ol>
        <h3>依 JSON Schema 產生怎麼用</h3>
        <ol>
        <li>在「依 JSON Schema 產生」貼上 JSON Schema（按「載入範例 schema」看寫法），或貼一筆範例 JSON：會依範例推論型別與格式（email、uuid、日期、網址），所有鍵都視為必要。</li>
        <li>填筆數（1 到 5000）、輸出格式（JSON 陣列 / JSON Lines）；要重現同一批資料就填種子。按「產生」。</li>
        <li>支援的關鍵字：type（可用陣列，如 ["string","null"]）、properties、required、items（單一 schema）、minItems / maxItems、enum、const、minimum / maximum、minLength / maxLength、pattern、format（email、date-time、date、uuid、uri）。沒列在 required 的欄位約 80% 的機率會出現。</li>
        <li>pattern 只支援簡單寫法：字面字元、.、[a-z0-9]、\d \w \s、群組與 |、* + ? {n,m}（* + 與 {n,} 最多再重複 5 次）；lookaround、反向參照、\b 會直接報錯。</li>
        <li>不支援的關鍵字（例如 anyOf、oneOf、allOf、$ref、multipleOf、exclusiveMinimum、其他 format）會列在結果上方，不會默默忽略；這些條件不會被滿足，資料可能不符合你的完整 schema。</li>
        <li>產生後會用頁內的小型驗證器逐筆檢查支援的關鍵字，顯示「全部符合」或不符合的筆數與第一個原因。</li>
        </ol>
        <h3>依 JSON Schema 產生怎麼用</h3>
        <ol>
        <li>在「依 JSON Schema 產生」貼上 JSON Schema（按「載入範例 schema」看寫法），或貼一筆範例 JSON：會依範例推論型別與格式（email、uuid、日期、網址），所有鍵都視為必要。</li>
        <li>填筆數（1 到 5000）、輸出格式（JSON 陣列 / JSON Lines）；要重現同一批資料就填種子。按「產生」。</li>
        <li>支援的關鍵字：type（可用陣列，如 ["string","null"]）、properties、required、items（單一 schema）、minItems / maxItems、enum、const、minimum / maximum、minLength / maxLength、pattern、format（email、date-time、date、uuid、uri）。沒列在 required 的欄位約 80% 的機率會出現。</li>
        <li>pattern 只支援簡單寫法：字面字元、.、[a-z0-9]、\d \w \s、群組與 |、* + ? {n,m}（* + 與 {n,} 最多再重複 5 次）；lookaround、反向參照、\b 會直接報錯。</li>
        <li>不支援的關鍵字（例如 anyOf、oneOf、allOf、$ref、multipleOf、exclusiveMinimum、其他 format）會列在結果上方，不會默默忽略；這些條件不會被滿足，資料可能不符合你的完整 schema。</li>
        <li>產生後會用頁內的小型驗證器逐筆檢查支援的關鍵字，顯示「全部符合」或不符合的筆數與第一個原因。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">種類選「UUID v4」、數量 3、按「產生」
        → 出現 3 行，格式像 3f2b8c1e-9a4d-4e7b-8c21-5d0a6b7e1f90
        （第三段開頭固定是 4，代表版本 4）
種類選「UUID v7」、時間基準「指定時間」2022-02-23 03:22:22（裝置為臺北時區）、數量 3
→ 3 行都以 017f22e2-79b0-7 開頭（同一毫秒），第三段開頭固定是 7，整批由小到大排列
假資料表格：預設欄位（id / name / phone / email / birthday）、列數 3、種子填 demo、格式 SQL INSERT、表名 users
→ 得到 INSERT INTO `users` (`id`, `name`, `phone`, `email`, `birthday`) VALUES 加 3 列；再按一次結果完全相同</div>
        <h3>小提醒</h3>
        <ul>
        <li>使用瀏覽器的安全亂數，全部在本機產生，不會上傳。</li>
        <li>假姓名、手機、Email 只是隨機組合（Email 一律 example.com），不是真實的人。</li>
        <li>隨機日期的起日不能晚於迄日。</li>
        <li>UUID v7 / ULID 是「可排序」的新式 ID：前段是毫秒時間，所以照文字排序 = 照時間排序，適合當資料庫主鍵。同一毫秒內產生的多筆，隨機部分會逐筆 +1，確保一批結果一定由小到大（產生後會顯示「字典序 = 時間序（已驗證）」）。</li>
        <li>「時間基準」選「現在」是用產生當下的時間；選「指定時間」則整批共用那個時間（以裝置時區解讀），靠遞增的隨機部分維持順序。UUID v7 可用大寫 / 不含連字號；ULID 固定是 26 個大寫字元，沒有這兩個選項。</li>
        <li>假資料表格的身分證與統編只是「格式與檢查碼正確」的隨機號碼（演算法同「身分證 / 統編檢查」），可能剛好與真實號碼相同，只能用在測試，不可用來冒用或登錄。地址、市話也是隨機組合，不一定真的存在。</li>
        <li>整數範圍限制在 ±1,000,000,000；列舉選項用逗號或換行分隔，空白時預設 A、B、C。</li>
        <li>假資料表格只會記住「上次的欄位設定、列數、格式、表名」（本機 rd_cols，最多 30 欄），不保存產生出的資料也不保存種子；按「重設欄位」會清除並回到預設，無法復原。資料壞掉或被備份還原改壞時會自動改用預設值。</li>
        <li>JSON Schema 產生：schema 與結果都不儲存，沒有新增本機資料；內容上限 200 KB，筆數上限 5000，陣列最多 100 個元素、巢狀最多 8 層，超過會提示而不是默默截斷。數字預設範圍 0–1000、字串預設 3–12 個小寫字母；小數固定 2 位。</li>
        <li>JSON Schema 產生：schema 與結果都不儲存，沒有新增本機資料；內容上限 200 KB，筆數上限 5000，陣列最多 100 個元素、巢狀最多 8 層，超過會提示而不是默默截斷。數字預設範圍 0–1000、字串預設 3–12 個小寫字母；小數固定 2 位。</li>
        <li>UUID v7 / ULID 的時間可以被讀出來，不適合當作需要保密建立時間的 ID；要反查時間請到「時間戳轉換」的 ID 分頁。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd, day, store, ids } = Util;

        // --- pure ---
        // RFC 4122 v4：第 13 個 16 進位字元固定 4，第 17 個是 8 / 9 / a / b
        const uuid4 = (r = rnd) => { const h = Array.from({ length: 32 }, () => '0123456789abcdef'[r(16)]); h[12] = '4'; h[16] = '89ab'[r(4)]; const s = h.join(''); return `${s.slice(0, 8)}-${s.slice(8, 12)}-${s.slice(12, 16)}-${s.slice(16, 20)}-${s.slice(20)}`; };
        const validUuid4 = (s) => /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(s);

        const CHARSETS = { alnum: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', lower: 'abcdefghijklmnopqrstuvwxyz0123456789', upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', hex: '0123456789abcdef', digits: '0123456789', base64url: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_' };
        const randStr = (len, set, r = rnd) => { const cs = CHARSETS[set] || CHARSETS.alnum; return Array.from({ length: len }, () => cs[r(cs.length)]).join(''); };

        // lo..hi（含）的均勻隨機整數；支援到 2^53 範圍內
        function randInt(lo, hi, r = rnd) {
            if (!Number.isInteger(lo) || !Number.isInteger(hi) || lo > hi) throw new Error('範圍不正確');
            const span = hi - lo + 1; if (span > 2 ** 32) { return lo + Math.floor(Math.random() * span); }   // ponytail: 超過 2^32 的巨大範圍改用 Math.random，仍均勻但非密碼學安全
            return lo + r(span);
        }

        // 兩個日期（YYYY-MM-DD，含）之間的隨機日期
        function randDate(from, to, r = rnd) { const a = day.num(from), b = day.num(to); if (a > b) throw new Error('起日要早於迄日'); return day.shift(from, r(b - a + 1)); }

        const SURNAMES = '陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴徐周葉蘇莊呂江何蕭羅高潘簡朱鍾游彭詹胡施沈余盧梁顏柯孫魏翁戴范宋方杜傅侯曹薛丁卓阮馬董温唐藍石蔣古紀姚連馮歐程湯黎田趙'.split('');
        const GIVEN = '怡君雅婷欣宜佳穎家豪志明俊傑建宏柏翰承恩宇軒冠廷瑋庭宗翰淑芬美玲惠雯怡萱心怡詩涵靜宜雅雯佩珊嘉慧偉哲彥廷子晴思妤品妍冠宇哲宇育銘柏宇世傑昱廷'.split('');
        const fakeName = (r = rnd) => SURNAMES[r(SURNAMES.length)] + GIVEN[r(GIVEN.length)] + (r(10) < 7 ? GIVEN[r(GIVEN.length)] : '');
        // 台灣手機格式 09 + 8 位數字；用 0900-0999 測試段以外的隨機值，僅供測試
        const fakePhone = (r = rnd) => '09' + Array.from({ length: 8 }, () => r(10)).join('');
        const fakeEmail = (r = rnd) => 'abcdefghijklmnopqrstuvwxyz'[r(26)] + randStr(3 + r(6), 'lower', r) + '@example.com';

        // 可排序 ID（UUID v7 / ULID）批次產生，單調遞增：getMs() 回傳每筆的時間（毫秒）；同一毫秒內隨機部分 +1（v7 74 位元、ULID 80 位元），
        // 時間倒退時沿用上一筆的時間，隨機部分溢位則時間 +1ms 並重新抽隨機。結果的字典序 = 產生順序
        const toBytes = (n, len) => Uint8Array.from({ length: len }, (_, i) => Number((n >> BigInt(8 * (len - 1 - i))) & 255n));
        function monotonic(kind, n, getMs, r = rnd) {
            const bits = kind === 'ulid' ? 80n : 74n, max = (1n << bits) - 1n, fresh = () => { let x = 0n; for (let i = 0n; i < bits; i += 8n) x = (x << 8n) | BigInt(r(256)); return x & max; };
            const out = []; let last = -1, ctr = 0n;
            for (let i = 0; i < n; i++) {
                let ms = Math.max(Math.floor(getMs()), last);
                if (ms === last) { ctr += 1n; if (ctr > max) { ms++; ctr = fresh(); } } else ctr = fresh();

            if (String(text).length > JS_TEXT_MAX) throw new Error('內容太大（上限 200 KB）');
            let v; try { v = JSON.parse(text); } catch (e) { throw new Error('不是有效的 JSON：' + e.message); }
            const isSchema = isObj(v) && ('$schema' in v || 'properties' in v || 'enum' in v || 'const' in v || ('type' in v && [].concat(v.type).every(x => JS_TYPES.includes(x))));
            return isSchema ? { schema: v, inferred: false } : { schema: schemaInfer(v), inferred: true };
        }
        const rf2 = (r) => r(4294967296) / 4294967296;
        function genNode(s, r, st, depth = 0) {
            if (++st.n > JS_NODES) throw new Error('結構太大（單筆節點超過上限），請降低 maxItems 或巢狀層數');
            if (depth > JS_DEPTH) throw new Error(`巢狀超過 ${JS_DEPTH} 層`);
            if (!isObj(s)) return randStr(3 + r(8), 'lower', r);
            if (Array.isArray(s.enum)) { if (!s.enum.length) throw new Error('enum 不能是空陣列'); return s.enum[r(s.enum.length)]; }
            if ('const' in s) return s.const;
            const ts = [].concat(s.type ?? []);
            const t = ts.length ? ts[r(ts.length)] : s.properties || s.required ? 'object' : s.items ? 'array' : s.minimum !== undefined || s.maximum !== undefined ? 'number' : 'string';
            if (!JS_TYPES.includes(t)) throw new Error(`不支援的型別 ${t}`);
            switch (t) {
                case 'null': return null;
                case 'boolean': return r(2) === 1;
                case 'integer': case 'number': {
                    let lo = s.minimum, hi = s.maximum; if (lo === undefined && hi === undefined) { lo = 0; hi = 1000; } else if (lo === undefined) lo = hi - 1000; else if (hi === undefined) hi = lo + 1000;
                    if (!(lo <= hi)) throw new Error('minimum 不能大於 maximum');
                    if (t === 'integer') { lo = Math.ceil(lo); hi = Math.floor(hi); if (lo > hi) throw new Error('範圍內沒有整數'); const span = hi - lo + 1; return lo + (span > 2 ** 32 ? Math.floor(Math.random() * span) : r(span)); }
                    return Math.min(hi, Math.max(lo, Number((lo + rf2(r) * (hi - lo)).toFixed(2))));
                }
                case 'string': {
                    if (s.format !== undefined && JS_FMT_RE[s.format]) {
                        if (s.format === 'email') return randStr(3 + r(6), 'lower', r) + '@example.com';
                        if (s.format === 'uuid') return uuid4(r);
                        if (s.format === 'uri') return 'https://' + randStr(4 + r(6), 'lower', r) + '.example.com/' + randStr(3 + r(5), 'lower', r);
                        const iso = new Date(Date.UTC(2020, 0, 1) + r(3650 * 86400) * 1000).toISOString().replace(/\.\d+Z$/, 'Z'); return s.format === 'date' ? iso.slice(0, 10) : iso;
                    }
                    if (typeof s.pattern === 'string') return patString(s.pattern, r);
                    const lo = Math.max(0, s.minLength ?? 3), hi = s.maxLength ?? Math.max(lo, 12);
                    if (lo > hi) throw new Error('minLength 不能大於 maxLength'); if (hi > 10000) throw new Error('maxLength 太大（上限 10000）');
                    return randStr(lo + r(hi - lo + 1), 'lower', r);
                }
                case 'array': {
                    const lo = Math.max(0, s.minItems ?? 1), hi = Math.min(100, s.maxItems ?? Math.max(lo, 5));
                    if (lo > hi) throw new Error('minItems 不能大於 maxItems（陣列長度上限 100）');
                    return Array.from({ length: lo + r(hi - lo + 1) }, () => genNode(s.items ?? {}, r, st, depth + 1));
                }
                default: {
                    const o = {}, req = [].concat(s.required ?? []), props = isObj(s.properties) ? s.properties : {};
                    for (const [k, sub] of Object.entries(props)) if (req.includes(k) || r(10) < 8) o[k] = genNode(sub, r, st, depth + 1);
                    for (const k of req) if (!(k in o)) o[k] = randStr(3 + r(8), 'lower', r);
                    return o;
                }
            }
        }
        // 產生 n 筆（1–5000）；seed 空 = 安全亂數，非空 = 可重現。回傳 { rows, bad（不符合 schema 的筆數）, first（第一個原因） }
        function genFromSchema(schema, n, seed = '') {
            n = Math.trunc(Number(n)); if (!(n >= 1 && n <= JS_MAX)) throw new Error(`筆數要在 1 到 ${JS_MAX} 之間`);
            const s = String(seed ?? '').trim(), r = s === '' ? rnd : Util.seeded(s).int, rows = [];
            for (let i = 0; i < n; i++) rows.push(genNode(schema, r, { n: 0 }));
            let bad = 0, first = ''; for (const x of rows) { const e = schemaValidate(schema, x); if (e.length) { bad++; first = first || e[0]; } }
            return { rows, bad, first };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const OPTS = {
            int: '<label for="lo">最小</label><input type="number" id="lo" value="1"><label for="hi">最大</label><input type="number" id="hi" value="100">',
            date: '<label for="from">從</label><input type="date" id="from"><label for="to">到</label><input type="date" id="to">',
            uuid: '<label><input type="checkbox" id="upper"> 大寫</label><label><input type="checkbox" id="nodash"> 不含連字號</label>',
        };
        const BASE = '<label for="tbase">時間基準</label><select id="tbase"><option value="now">現在</option><option value="at">指定時間</option></select><input type="datetime-local" id="tat" step="1" aria-label="指定時間（裝置時區）" disabled>';
        OPTS.uuid7 = OPTS.uuid + BASE; OPTS.ulid = BASE;
        function renderOpts() {
            $('#opts').innerHTML = OPTS[$('#kind').value] || ''; $('#opts').hidden = !OPTS[$('#kind').value];
            if ($('#tat')) $('#tat').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
            if ($('#from')) { $('#from').value = day.shift(day.today(), -365); $('#to').value = day.today(); }
        }
        const num = (id, d) => { const v = parseInt($(id).value, 10); return Number.isFinite(v) ? v : d; };

        function generate() {
            const n = Math.max(1, Math.min(1000, num('#count', 10))), k = $('#kind').value, out = [];
            try {
                if (k === 'uuid7' || k === 'ulid') {
                    const at = $('#tbase').value === 'at' ? baseMs($('#tat').value) : null;
                    const raw = monotonic(k, n, at === null ? Date.now : () => at);
                    const fmt = (s) => { if (k === 'ulid') return s; if ($('#upper').checked) s = s.toUpperCase(); return $('#nodash').checked ? s.replace(/-/g, '') : s; };   // ULID 本來就是大寫無連字號，不適用這兩個選項
                    $('#out').value = raw.map(fmt).join('\n');
                    $('#info').textContent = `${n} 筆${isAscending(raw) ? '，字典序 = 時間序（已驗證）' : ''}`; return;
                }
                for (let i = 0; i < n; i++) {
                    if (k === 'uuid') { let s = uuid4(); if ($('#upper').checked) s = s.toUpperCase(); if ($('#nodash').checked) s = s.replace(/-/g, ''); out.push(s); }
                    else if (k === 'int') out.push(randInt(num('#lo', 1), num('#hi', 100)));
                    else if (k === 'date') out.push(randDate($('#from').value, $('#to').value));
                    else if (k === 'name') out.push(fakeName());
                    else if (k === 'phone') out.push(fakePhone());
                    else out.push(fakeEmail());
                }
                $('#out').value = out.join('\n'); $('#info').textContent = `${n} 筆`;
            } catch (e) { $('#out').value = ''; $('#info').textContent = e.message; }
        }
        $('#kind').onchange = () => { renderOpts(); generate(); store.set('rd_kind', $('#kind').value); };
        $('#opts').onchange = (e) => { if (e.target.id === 'tbase') $('#tat').disabled = e.target.value !== 'at'; if (e.target.id === 'tbase' || e.target.id === 'tat') generate(); };
        $('#gen').onclick = generate; $('#count').onchange = generate;
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), $('#out').value, () => $('#out').select());
        const k0 = store.get('rd_kind', 'uuid'); if ([...$('#kind').options].some(o => o.value === k0)) $('#kind').value = k0;
        renderOpts(); generate();

        // ---- 假資料表格 UI ----
        const today = day.today(), OPTDEF = {
            serial: [['a', '起始值', 'number', '1']], int: [['a', '最小', 'number', '1'], ['b', '最大', 'number', '100']],
            float: [['a', '最小', 'number', '0'], ['b', '最大', 'number', '1'], ['c', '小數位', 'number', '2']],
            date: [['a', '從', 'date', day.shift(today, -365)], ['b', '到', 'date', today]], enum: [['a', '選項（逗號、換行分隔）', 'text', '紅,綠,藍']],
            text: [['a', '語言', 'select', 'zh', [['zh', '中文'], ['en', 'English']]]],
        };
        const defOpts = (t) => { const o = { a: '', b: '', c: '' }; (OPTDEF[t] || []).forEach(([k, , , d]) => { o[k] = d; }); return o; };
        const mk = (name, type) => ({ name, type, ...defOpts(type) });
        const DEF = () => ({ cols: [mk('id', 'serial'), mk('name', 'name'), mk('phone', 'mobile'), mk('email', 'email'), mk('birthday', 'date')], fmt: 'csv', n: 10, table: 'users', dialect: 'mysql' });
        function loadT() {
            const d = DEF(), v = store.get('rd_cols', null); if (!v || typeof v !== 'object') return d;
            const cols = cleanCols(v.cols); if (cols && cols.length) d.cols = cols;
            if (TBL_FORMATS.includes(v.fmt)) d.fmt = v.fmt; if (TBL_DIALECTS.includes(v.dialect)) d.dialect = v.dialect;
            const n = Math.trunc(Number(v.n)); if (n >= 1 && n <= TBL_MAX_ROWS) d.n = n;
            if (typeof v.table === 'string') d.table = v.table.slice(0, 60);
            return d;
        }
        let T = loadT(), tOutText = '';
        const saveT = () => store.set('rd_cols', T);
        const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, attrs); e.append(...kids); return e; };
        const lab = (text, input) => el('div', {}, [el('label', { textContent: text }), input]);
        function renderCols() {
            $('#tcols').replaceChildren(...T.cols.map((c, i) => {
                const nm = el('input', { type: 'text', value: c.name, maxLength: 40, spellcheck: false, oninput() { c.name = this.value; saveT(); } }); nm.setAttribute('aria-label', `第 ${i + 1} 欄名稱`);
                const ty = el('select', { onchange() { Object.assign(c, { type: this.value }, defOpts(this.value)); saveT(); renderCols(); } }, Object.entries(TBL_TYPES).map(([k, v]) => new Option(v, k, false, k === c.type))); ty.setAttribute('aria-label', `第 ${i + 1} 欄型別`);
                const opts = (OPTDEF[c.type] || []).map(([k, text, kind, , choices]) => {
                    const inp = kind === 'select' ? el('select', {}, choices.map(([v, t]) => new Option(t, v, false, v === c[k]))) : el('input', { type: kind, value: c[k] ?? '', spellcheck: false });
                    inp.oninput = inp.onchange = () => { c[k] = inp.value; saveT(); }; inp.setAttribute('aria-label', `${c.name} ${text}`); return lab(text, inp);
                });
                const mv = (d) => { const j = i + d; if (j < 0 || j >= T.cols.length) return; [T.cols[i], T.cols[j]] = [T.cols[j], T.cols[i]]; saveT(); renderCols(); };
                const btn = (t, label, fn) => el('button', { type: 'button', textContent: t, title: label, onclick: fn, className: 'sm', disabled: false }, []);
                const up = btn('↑', '上移', () => mv(-1)), dn = btn('↓', '下移', () => mv(1)), rm = btn('✕', '刪除這欄', () => { T.cols.splice(i, 1); saveT(); renderCols(); });
                [up, dn, rm].forEach((b, k) => b.setAttribute('aria-label', ['上移', '下移', '刪除'][k] + `第 ${i + 1} 欄`)); up.disabled = i === 0; dn.disabled = i === T.cols.length - 1;
                return el('div', { className: 'tcol' }, [el('div', { className: 'r' }, [lab('欄位名稱', nm), lab('型別', ty)]), ...(opts.length ? [el('div', { className: 'r' }, opts)] : []), el('div', { className: 'ctl' }, [up, dn, rm])]);
            }));
            $('#tcount').textContent = `${T.cols.length} / ${TBL_MAX_COLS} 欄`;
        }
        function genT(save = true) {
            const sql = $('#tfmt').value === 'sql'; $('#tsqlopt').hidden = !sql;
            T.fmt = $('#tfmt').value; T.table = $('#ttable').value; T.dialect = $('#tdialect').value;
            const n = Math.trunc(Number($('#tn').value)); if (n >= 1 && n <= TBL_MAX_ROWS) T.n = n; if (save !== false) saveT();
            try {
                const t = genTable(cleanCols(T.cols), $('#tn').value, $('#tseed').value);
                tOutText = formatTable(t, T.fmt, T); $('#tout').value = tOutText; $('#tinfo').textContent = `${t.rows.length} 列 × ${t.header.length} 欄`;
            } catch (e) { tOutText = ''; $('#tout').value = ''; $('#tinfo').textContent = e.message; }
        }
        $('#taddType').replaceChildren(...Object.entries(TBL_TYPES).map(([k, v]) => new Option(v, k)));
        $('#taddCol').onclick = () => {
            if (T.cols.length >= TBL_MAX_COLS) { $('#tinfo').textContent = `最多 ${TBL_MAX_COLS} 欄，請先刪除不要的欄位`; return; }
            const ty = $('#taddType').value; T.cols.push(mk(TBL_TYPES[ty].replace(/（.*/, '') + (T.cols.length + 1), ty)); saveT(); renderCols();
        };
        $('#tn').value = T.n; $('#tfmt').value = T.fmt; $('#ttable').value = T.table; $('#tdialect').value = T.dialect;
        $('#tgen').onclick = genT; $('#tfmt').onchange = $('#tdialect').onchange = $('#ttable').oninput = $('#tn').onchange = genT;
        $('#tcopy').onclick = () => Util.copyWithFeedback($('#tcopy'), $('#tout').value, () => $('#tout').select());
        $('#tdl').onclick = () => { if (!tOutText) return; const ext = { csv: 'csv', json: 'json', jsonl: 'jsonl', sql: 'sql', md: 'md' }[T.fmt]; Util.download(new Blob([(T.fmt === 'csv' ? '﻿' : '') + tOutText], { type: 'text/plain;charset=utf-8' }), `fake-data.${ext}`); };
        $('#treset').onclick = () => {
            if (!confirm('重設欄位設定？目前的欄位、列數、輸出格式會回到預設，且無法復原。')) return;
            T = DEF(); store.set('rd_cols', T); $('#tn').value = T.n; $('#tfmt').value = T.fmt; $('#ttable').value = T.table; $('#tdialect').value = T.dialect; $('#tseed').value = ''; renderCols(); genT(false);
        };
        renderCols(); genT(false);

        // ---- 依 JSON Schema 產生 UI ----
        const JS_SAMPLE = { type: 'object', required: ['id', 'name', 'email', 'age', 'tags'], properties: { id: { type: 'string', format: 'uuid' }, name: { type: 'string', minLength: 2, maxLength: 8 }, email: { type: 'string', format: 'email' }, age: { type: 'integer', minimum: 18, maximum: 65 }, role: { enum: ['admin', 'user', 'guest'] }, code: { type: 'string', pattern: '^[A-Z]{2}-\d{4}$' }, createdAt: { type: 'string', format: 'date-time' }, tags: { type: 'array', items: { type: 'string' }, minItems: 1, maxItems: 3 } } };
        const jsSample = () => { $('#jsin').value = JSON.stringify(JS_SAMPLE, null, 2); };
        function jsGen() {
            const msg = (t, bad) => { $('#jsinfo').textContent = t; $('#jsinfo').style.color = bad ? 'var(--bad)' : ''; };
            try {
                const { schema, inferred } = schemaFromText($('#jsin').value), un = schemaUnsupported(schema);
                const { rows, bad, first } = genFromSchema(schema, $('#jsn').value, $('#jsseed').value);
                $('#jsout').value = $('#jsfmt').value === 'jsonl' ? rows.map(x => JSON.stringify(x)).join('\n') : JSON.stringify(rows, null, 2);
                msg(`${rows.length} 筆${inferred ? '（依範例推論結構）' : ''}；` + (bad ? `驗證：${bad} 筆不符合（${first}）` : '驗證：全部符合支援的關鍵字') + (un.length ? `；不支援而未處理：${un.join('、')}` : ''), bad || un.length);
            } catch (e) { $('#jsout').value = ''; msg(e.message, true); }
        }
        $('#jsgen').onclick = jsGen; $('#jssample').onclick = () => { jsSample(); jsGen(); };
        $('#jscopy').onclick = () => Util.copyWithFeedback($('#jscopy'), $('#jsout').value, () => $('#jsout').select());
        jsSample(); jsGen();
    </script>
</body>
