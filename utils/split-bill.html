<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>分帳計算</h1>
        <p class="sub">記下每筆支出，最後一次算清楚；也有單筆帳單的小費快算。資料只存在這個瀏覽器。</p>

        <div class="card">
            <h2>小費快算</h2>
            <p class="muted" style="margin:0 0 10px;font-size:13px">單筆帳單加小費後平均分，不用記成員。</p>
            <div class="row">
                <input id="tbill" type="number" inputmode="decimal" min="0" step="any" placeholder="帳單金額" aria-label="帳單金額" style="flex:1 1 100%">
                <label for="tpct" class="muted">小費 %</label><input id="tpct" type="number" min="0" max="100" step="any" value="10" style="max-width:80px">
                <label for="tn" class="muted">人數</label><input id="tn" type="number" min="1" max="100" value="2" style="max-width:80px">
            </div>
            <label style="display:flex;gap:6px;align-items:center;margin:8px 0;color:var(--muted)"><input type="checkbox" id="tround"> 每人湊整數（進位到元）</label>
            <div id="tout"></div>
        </div>

        <div class="card">
            <h2>成員</h2>
            <div id="people"></div>
            <div class="row">
                <input id="pname" placeholder="輸入名字後按新增" maxlength="12" aria-label="成員名字">
                <button id="padd">新增</button>
            </div>
        </div>

        <div class="card">
            <h2>新增支出</h2>
            <div class="row">
                <input id="desc" placeholder="項目（例如：晚餐）" maxlength="30" aria-label="項目">
                <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="金額" style="max-width:110px" aria-label="金額">
            </div>
            <div class="row" style="margin-top:8px">
                <label for="payer" class="muted">誰先付</label>
                <select id="payer"></select>
            </div>
            <div class="muted" style="margin-top:10px">分攤的人</div>
            <div class="shares" id="shares"></div>
            <button class="primary" id="eadd">加入這筆支出</button>
            <p class="muted" id="msg" style="margin:8px 0 0;font-size:13px"></p>
        </div>

        <div class="card">
            <h2>支出紀錄</h2>

        <details class="card" id="utilBox">
            <summary>租屋水電瓦斯分攤</summary>
            <p class="muted" style="margin:0 0 10px;font-size:13px">室友每月分帳單：電、水、瓦斯可各自選「依人數平均 / 依房間坪數 / 依用電度數」，每月記錄並累計。與上面的成員分開記。</p>
            <div id="u_people"></div>
            <div class="row">
                <input id="u_pname" placeholder="室友名字" maxlength="12" aria-label="室友名字">
                <input id="u_pping" type="number" inputmode="decimal" min="0" step="any" placeholder="房間坪數" style="max-width:110px" aria-label="房間坪數">

                <div><label for="u_water_m">水費分法</label><select id="u_water_m"></select></div>
                <div><label for="u_gas">瓦斯費帳單</label><input id="u_gas" type="number" inputmode="decimal" min="0" step="any" placeholder="可留白"></div>
                <div><label for="u_gas_m">瓦斯分法</label><select id="u_gas_m"></select></div>
            </div>
            <div class="muted" style="font-size:13px">各室友本月用電度數（電費選「依用電度數」或填電價時要填）</div>
            <div class="ugrid" id="u_kwh"></div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>多人 AA 分帳：記下每筆支出、誰先付、誰要分攤，最後算出每個人該收或該付多少，並給出轉帳次數最少的建議。另有單筆帳單加小費的快算。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>旅行、聚餐、合租，每個人輪流先墊錢。</li>
        <li>只是一頓飯想快速算出含小費每人付多少。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>在「成員」輸入名字按「新增」（至少 2 人）。</li>
        <li>在「新增支出」填項目、金額，選「誰先付」，勾選分攤的人，按「加入這筆支出」。</li>
        <li>下方「支出紀錄」可刪除錯誤的一筆；「結算」會列出每人可收回 / 應付，以及怎麼轉帳最省事。</li>
        <li>小費快算：填帳單金額、小費 %、人數，可勾「每人湊整數」。</li>
        <li>租屋水電瓦斯：展開最下面的「租屋水電瓦斯分攤」，新增室友（填房間坪數才能用坪數分法），再「新增月份」：填電、水、瓦斯帳單，各自選分法；選「依用電度數」要填每人度數，電費也可留白只填電價（總額 = 總度數 × 電價）。按「記錄這個月」會存起來並加進累計；記錯就刪掉那個月重記。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">租屋：室友 A 房 8 坪 / B 房 6 坪；電費 1,000，依坪數 → A 571.43、B 428.57（加總剛好 1,000）
        成員：小明、小華、阿美；晚餐 900，小明先付，三人分攤
        → 小明可收回 600，小華應付 300，阿美應付 300
        → 轉帳：小華 → 小明 300、阿美 → 小明 300
        小費快算：帳單 1000、小費 10%、2 人 → 每人付 550</div>
        <h3>小提醒</h3>
        <ul>
        <li>已出現在支出紀錄的成員要先刪掉相關支出才能移除。</li>
        <li>除不盡的零頭會由前面的人多負擔 1 分。</li>
        <li>資料只存在這個瀏覽器；成員最多 30 位、支出最多 500 筆；「全部清除」會刪光成員與支出。</li>
        <li>水電瓦斯：室友最多 10 位、月份記錄最多 60 個月（滿了拒絕新增，請先刪舊月份）；同一個月只能有一筆；已有月份記錄時不能移除室友（會改變過去的分攤），請先刪除月份。按比例分攤除不盡的分，會依「小數餘數最大者優先」每人各多 1 分，加總一定等於帳單。「清除水電瓦斯資料」只刪這一區，不影響上面的成員與支出（備份也包含 bill_util 這個資料）。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 金額一律以「分」為整數運算，避免浮點誤差
        const toCents = (x) => Math.round(parseFloat(x) * 100);

        // 平均分攤，除不盡的零頭由前面的人各多負擔 1 分
        function splitCents(total, n) {
            const base = Math.floor(total / n), rem = total - base * n;
            return Array.from({ length: n }, (_, i) => base + (i < rem ? 1 : 0));
        }

        // people: 名字陣列；expenses: [{ payer, amount(分), shares: [名字] }]
        // 回傳 { net: {名字: 分}（正=別人欠他、負=他欠別人）, transfers: [{ from, to, amount }] }
        function settle(people, expenses) {
            const net = Object.fromEntries(people.map(p => [p, 0]));
            for (const e of expenses) {
                net[e.payer] += e.amount;
                const parts = splitCents(e.amount, e.shares.length);
                e.shares.forEach((p, i) => { net[p] -= parts[i]; });
            }
            // 貪婪配對：最大欠款人 → 最大債權人，轉帳次數最多 n-1 次
            const debtors = [], creditors = [];
            for (const [p, v] of Object.entries(net)) {
                if (v < 0) debtors.push({ p, v: -v }); else if (v > 0) creditors.push({ p, v });
            }
            const transfers = [];
            while (debtors.length && creditors.length) {
                debtors.sort((a, b) => b.v - a.v);
                creditors.sort((a, b) => b.v - a.v);
                const d = debtors[0], c = creditors[0], amt = Math.min(d.v, c.v);
                transfers.push({ from: d.p, to: c.p, amount: amt });
                d.v -= amt; c.v -= amt;
                if (d.v === 0) debtors.shift();
                if (c.v === 0) creditors.shift();
            }
            return { net, transfers };
        }

        // 小費快算（單位：分）：小費 = 帳單 × 百分比，四捨五入到分；每人 = 總額 ÷ 人數。roundUp 時每人無條件進位到整數元
        function tipSplit(bill, pct, n, roundUp) {
            const tip = Math.round(bill * pct / 100), total = bill + tip;
            let per = Math.ceil(total / n);
            if (roundUp) per = Math.ceil(per / 100) * 100;
            return { tip, total, per, paid: per * n, extra: per * n - total };
        }
        // 讀取驗證（還原備份也會走這裡）：壞資料略過；支出的付款人 / 分攤者必須都在成員名單內
        const MAX_PEOPLE = 30, MAX_EXPENSES = 500;
        function normBill(raw) {
            const o = raw && typeof raw === 'object' ? raw : {};
            const people = [...new Set((Array.isArray(o.people) ? o.people : []).filter(p => typeof p === 'string' && p.trim() && p.length <= 30))].slice(0, MAX_PEOPLE);
            const expenses = (Array.isArray(o.expenses) ? o.expenses : []).filter(e => e && people.includes(e.payer) && Number.isSafeInteger(e.amount) && e.amount > 0
                && Array.isArray(e.shares) && e.shares.length && e.shares.every(p => people.includes(p))).slice(0, MAX_EXPENSES)
                .map(e => ({ desc: typeof e.desc === 'string' ? e.desc.slice(0, 40) : '', payer: e.payer, amount: e.amount, shares: [...new Set(e.shares)] }));
            return { people, expenses };
        }
        // ---------- 租屋水電瓦斯 ----------
        // bill_util = { members: [{ id, name, ping }], months: [{ id, ym, items: { elec|water|gas: { total（分）, method } }, kwh: { 室友 id: 度數 } }] }
        const MAX_UMEMBERS = 10, MAX_MONTHS = 60;
        const UKINDS = { elec: '電費', water: '水費', gas: '瓦斯費' };
        const UMETHODS = { equal: '依人數平均', ping: '依房間坪數', kwh: '依用電度數' };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const validYm = (s) => typeof s === 'string' && /^(19|20|21)\d{2}-(0[1-9]|1[0-2])$/.test(s);
        // 比例分攤（單位：分）：各人先取整數部分，剩下的分依「小數餘數大者優先、同分則排前面者」各多 1 分，總和一定等於 total；權重總和為 0 時改平均
        function apportion(total, weights) {
            const n = weights.length, W = weights.reduce((a, b) => a + b, 0), w = W > 0 ? weights : weights.map(() => 1), S = W > 0 ? W : n;
            const q = w.map(x => total * x / S), base = q.map(x => Math.floor(x + 1e-9));
            let rem = total - base.reduce((a, b) => a + b, 0);
            const order = q.map((x, i) => [x - base[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
            for (let k = 0; rem > 0 && k < order.length; k++, rem--) base[order[k][1]]++;
            return base;
        }
        // 這個月每個室友各項金額與合計（分）；回傳 { 室友 id: { elec, water, gas, total } }
        function monthShares(month, members) {
            const out = Object.fromEntries(members.map(m => [m.id, { elec: 0, water: 0, gas: 0, total: 0 }]));
            for (const k of Object.keys(UKINDS)) {
                const it = month.items[k];
                if (!it || !it.total) continue;
                const w = members.map(m => (it.method === 'ping' ? m.ping : it.method === 'kwh' ? (month.kwh[m.id] || 0) : 1));
                apportion(it.total, w).forEach((v, i) => { out[members[i].id][k] = v; out[members[i].id].total += v; });
            }
            return out;
        }
        // 累計：每位室友所有月份的合計（分）、整體合計
        function cumulative(util) {
            const per = Object.fromEntries(util.members.map(m => [m.id, 0])); let all = 0;
            for (const mo of util.months) { const sh = monthShares(mo, util.members); for (const m of util.members) { per[m.id] += sh[m.id].total; all += sh[m.id].total; } }
            return { per, all };
        }
        // 每度電實際單價（元）= 電費 ÷ 總度數；沒填度數或電費為 null
        function elecRate(month) {
            const kw = Object.values(month.kwh).reduce((a, b) => a + b, 0), t = month.items.elec && month.items.elec.total;
            return kw > 0 && t ? t / 100 / kw : null;
        }
        // 電費留白、填了電價：總額（分）= 總度數 × 電價，四捨五入到分
        const elecFromRate = (kwh, rate) => Math.round(Object.values(kwh).reduce((a, b) => a + b, 0) * rate * 100);
        // 這組設定能不能算：坪數法要每人坪數 > 0、度數法要總度數 > 0；回傳錯誤訊息或 ''
        function checkMethods(items, kwh, members) {
            for (const k of Object.keys(UKINDS)) {
                const it = items[k];
                if (!it || !it.total) continue;
                if (it.method === 'ping' && members.some(m => !(m.ping > 0))) return UKINDS[k] + '選依坪數，但有室友沒填房間坪數';
                if (it.method === 'kwh' && !(members.reduce((a, m) => a + (kwh[m.id] || 0), 0) > 0)) return UKINDS[k] + '選依用電度數，但還沒填度數';
            }
            return '';
        }
        // 載入驗證（還原備份也會走這裡）：壞資料略過；月份只留成員內的度數；算不出來的分法降為平均；同月只留第一筆
        function normUtil(raw) {
            const o = raw && typeof raw === 'object' ? raw : {}, seenM = new Set(), members = [];
            for (const m of Array.isArray(o.members) ? o.members : []) {
                if (!m || typeof m.name !== 'string' || !m.name.trim() || m.name.length > 12 || typeof m.id !== 'string' || !m.id || m.id.length > 40 || seenM.has(m.id)) continue;
                const pg = Number(m.ping); seenM.add(m.id);
                members.push({ id: m.id, name: m.name.trim(), ping: Number.isFinite(pg) && pg > 0 && pg < 1e4 ? pg : 0 });
                if (members.length >= MAX_UMEMBERS) break;
            }
            const months = [], seenY = new Set(), seenId = new Set();
            for (const r of Array.isArray(o.months) ? o.months : []) {
                if (!r || typeof r !== 'object' || !validYm(r.ym) || seenY.has(r.ym) || typeof r.id !== 'string' || !r.id || seenId.has(r.id)) continue;
                const kwh = {};
                if (r.kwh && typeof r.kwh === 'object') for (const m of members) { const v = Number(r.kwh[m.id]); if (Number.isFinite(v) && v > 0 && v < 1e7) kwh[m.id] = v; }
                const items = {};
                for (const k of Object.keys(UKINDS)) {
                    const it = r.items && r.items[k], t = it ? Number(it.total) : 0;
                    items[k] = { total: Number.isSafeInteger(t) && t > 0 && t < 1e11 ? t : 0, method: it && it.method in UMETHODS ? it.method : 'equal' };
                }
                for (const k of Object.keys(UKINDS)) if (items[k].method !== 'equal' && checkMethods({ [k]: items[k] }, kwh, members)) items[k].method = 'equal';
                if (!Object.values(items).some(it => it.total)) continue;
                seenY.add(r.ym); seenId.add(r.id); months.push({ id: r.id, ym: r.ym, items, kwh });
                if (months.length >= MAX_MONTHS) break;
            }
            return { members, months };
        }
        function addMember(util, name, ping, id = uid()) {
            const n = String(name || '').trim(), pg = ping === '' || ping == null ? 0 : Number(ping);
            if (!n) return { util, err: '請填室友名字' };
            if (n.length > 12) return { util, err: '名字最長 12 字' };
            if (!Number.isFinite(pg) || pg < 0 || pg >= 1e4) return { util, err: '坪數請填 0 以上的數字（可留白）' };
            if (util.members.some(m => m.name === n)) return { util, err: '名字重複了' };
            if (util.members.length >= MAX_UMEMBERS) return { util, err: `室友最多 ${MAX_UMEMBERS} 位` };
            return { util: { ...util, members: [...util.members, { id, name: n, ping: pg }] }, err: '' };
        }
        // 已有月份記錄時不能移除室友（會改變過去的分攤）
        function removeMember(util, id) {
            if (util.months.length) return { util, err: '已有月份記錄，請先刪除相關月份再移除室友' };
            return { util: { ...util, members: util.members.filter(m => m.id !== id) }, err: '' };
        }
        // 新增一個月：r = { ym, items: { elec|water|gas: { total（分）, method } }, kwh: { 室友 id: 度數 } }；滿 60 個月、同月重複都拒絕
        function addMonth(util, r, id = uid()) {
            if (!util.members.length) return { util, err: '請先新增室友' };
            if (!validYm(r.ym)) return { util, err: '請選擇月份' };
            if (util.months.some(m => m.ym === r.ym)) return { util, err: '這個月已經記錄過，請先刪除再重記' };
            if (util.months.length >= MAX_MONTHS) return { util, err: `最多記錄 ${MAX_MONTHS} 個月，請先刪除舊月份` };
            const items = {};
            for (const k of Object.keys(UKINDS)) {
                const it = r.items[k] || {}, t = it.total;
                if (!(t === 0 || (Number.isSafeInteger(t) && t > 0 && t < 1e11))) return { util, err: UKINDS[k] + '請填 0 到 10 億之間的金額' };
                items[k] = { total: t || 0, method: it.method in UMETHODS ? it.method : 'equal' };
            }
            if (!Object.values(items).some(it => it.total)) return { util, err: '請至少填一項帳單金額' };
            const kwh = {};
            for (const m of util.members) { const v = Number(r.kwh && r.kwh[m.id]); if (Number.isFinite(v) && v > 0 && v < 1e7) kwh[m.id] = v; }
            const err = checkMethods(items, kwh, util.members);
            if (err) return { util, err };
            return { util: { ...util, months: [...util.months, { id, ym: r.ym, items, kwh }] }, err: '' };
        }
        const removeMonth = (util, id) => ({ ...util, months: util.months.filter(m => m.id !== id) });
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'bill_state';
        const money = (c) => (c / 100).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const { store } = Util;
        let S = normBill(store.get(KEY, null));
        const save = () => store.set(KEY, S);
        let U = normUtil(store.get('bill_util', null));
        const saveU = () => store.set('bill_util', U);
        const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

        function render() {
            // 成員
            const pe = $('#people');
            pe.replaceChildren();
            S.people.forEach(p => {
                const chip = el('span', p, 'chip');
                const b = el('button', '×');
                b.setAttribute('aria-label', '移除 ' + p);
                b.onclick = () => {
                    if (S.expenses.some(e => e.payer === p || e.shares.includes(p))) return flash(`${p} 已有支出紀錄，請先刪除相關支出`);
                    S.people = S.people.filter(x => x !== p);
                    save(); render();
                };
                chip.append(b);
                pe.append(chip);
            });
            // 付款人 / 分攤者
            const keep = $('#payer').value;
            $('#payer').replaceChildren(...S.people.map(p => new Option(p, p)));
            if (S.people.includes(keep)) $('#payer').value = keep;
            // 保留目前的勾選；新加入的成員預設勾選
            const checked = new Set([...document.querySelectorAll('#shares input:checked')].map(i => i.value));
            const shown = new Set([...document.querySelectorAll('#shares input')].map(i => i.value));
            $('#shares').replaceChildren(...S.people.map(p => {
                const l = el('label'), i = document.createElement('input');
                i.type = 'checkbox'; i.value = p; i.checked = !shown.has(p) || checked.has(p);
                l.append(i, p);
                return l;
            }));
            // 支出
            const ls = $('#list');
            ls.replaceChildren();
            if (!S.expenses.length) ls.append(el('div', '還沒有支出', 'muted'));
            S.expenses.forEach((e, idx) => {
                const row = el('div', null, 'li'), left = el('div');
                left.append(el('b', e.desc || '支出'), el('small', `${e.payer} 先付 ・ 分攤：${e.shares.length === S.people.length ? '全部人' : e.shares.join('、')}`));
                const right = el('div'), d = el('button', '刪除', 'del');
                d.onclick = () => { S.expenses.splice(idx, 1); save(); render(); };
                right.append(el('b', money(e.amount)), ' ', d);
                right.style.whiteSpace = 'nowrap';
                row.append(left, right);
                ls.append(row);
            });
            // 結算
            const rs = $('#result');
            rs.replaceChildren();
            if (!S.expenses.length) { rs.append(el('div', '新增支出後會在這裡顯示結果', 'muted')); return; }
            const { net, transfers } = settle(S.people, S.expenses);
            const total = S.expenses.reduce((s, e) => s + e.amount, 0);
            rs.append(el('div', `總支出 ${money(total)}`, 'muted'));
            S.people.forEach(p => {
                const row = el('div', null, 'li');
                row.append(el('span', p), el('b', (net[p] > 0 ? '可收回 ' : net[p] < 0 ? '應付 ' : '') + (net[p] === 0 ? '結清' : money(Math.abs(net[p]))), net[p] > 0 ? 'pos' : net[p] < 0 ? 'neg' : 'muted'));
                rs.append(row);
            });
            if (transfers.length) {
                rs.append(el('h2', '怎麼轉帳最省事'));
                transfers.forEach(t => {
                    const row = el('div', null, 'li');
                    row.append(el('span', `${t.from} → ${t.to}`), el('b', money(t.amount)));
                    rs.append(row);
                });
            }
        }

        function flash(t) { $('#msg').textContent = t; }

        function addPerson() {
            const n = $('#pname').value.trim();
            if (!n) return;
            if (S.people.includes(n)) return flash('名字重複了');
            if (S.people.length >= MAX_PEOPLE) return flash(`成員最多 ${MAX_PEOPLE} 位`);
            S.people.push(n);
            $('#pname').value = '';
            flash('');
            save(); render();
        }

        function renderTip() {
            const bill = toCents($('#tbill').value), pct = parseFloat($('#tpct').value) || 0, n = Math.max(1, Math.floor(+$('#tn').value) || 1), box = $('#tout');
            if (!(bill > 0) || pct < 0) { box.replaceChildren(); return; }
            const r = tipSplit(bill, pct, n, $('#tround').checked);
            box.replaceChildren(Util.statRow('小費', money(r.tip)), Util.statRow('含小費總額', money(r.total)), Util.statRow(`每人付（${n} 人）`, money(r.per), 'ok'), ...(r.extra > 0 ? [Util.statRow('多收的零頭', money(r.extra))] : []));
        }
        ['tbill', 'tpct', 'tn', 'tround'].forEach(id => { $('#' + id).oninput = renderTip; });

        $('#padd').onclick = addPerson;
        $('#pname').onkeydown = (e) => { if (e.key === 'Enter') addPerson(); };
        $('#eadd').onclick = () => {
            const amount = toCents($('#amount').value);
            const shares = [...document.querySelectorAll('#shares input:checked')].map(i => i.value);
            if (S.people.length < 2) return flash('請先新增至少 2 位成員');
            if (!(amount > 0) || amount >= 1e11) return flash('請輸入大於 0、小於 10 億的金額');
            if (S.expenses.length >= MAX_EXPENSES) return flash(`支出最多 ${MAX_EXPENSES} 筆，請先清除或刪除舊的`);
            if (!shares.length) return flash('請至少選一位分攤的人');
            S.expenses.push({ desc: $('#desc').value.trim(), payer: $('#payer').value, amount, shares });
            $('#desc').value = ''; $('#amount').value = '';
            flash('');
            save(); render();
        };
        $('#clear').onclick = () => {
            if (!confirm('確定要清除所有成員與支出嗎？')) return;
            S = { people: [], expenses: [] };
            flash(''); save(); render();
        };
        // ---------- 租屋水電瓦斯 ----------
        const kStr = (c) => (c / 100).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const uMsg = (t) => { $('#u_msg').textContent = t; };
        ['elec', 'water', 'gas'].forEach(k => {
            const sel = $('#u_' + k + '_m');
            Object.entries(UMETHODS).forEach(([v, n]) => { if (!(k !== 'elec' && v === 'kwh')) sel.append(new Option(n, v)); });
        });
        $('#u_ym').value = Util.day.today().slice(0, 7);
        function renderUtil() {
            const box = $('#u_people'); box.replaceChildren();
            U.members.forEach(m => {
                const chip = el('span', m.name + (m.ping ? ` ${m.ping} 坪` : ''), 'chip'), b = el('button', '×');
                b.setAttribute('aria-label', '移除 ' + m.name);
                b.onclick = () => { const r = removeMember(U, m.id); if (r.err) return uMsg(r.err); U = r.util; saveU(); uMsg(''); renderUtil(); };
                chip.append(b); box.append(chip);
            });
            if (!U.members.length) box.append(el('div', '還沒有室友', 'muted'));
            const keep = Object.fromEntries([...document.querySelectorAll('#u_kwh input')].map(i => [i.dataset.id, i.value]));
            $('#u_kwh').replaceChildren(...U.members.map(m => {
                const d = el('div'), l = el('label', m.name + ' 度數'), i = document.createElement('input');
                i.type = 'number'; i.min = '0'; i.step = 'any'; i.inputMode = 'decimal'; i.dataset.id = m.id; i.value = keep[m.id] || ''; i.id = 'uk_' + m.id; l.htmlFor = i.id;
                d.append(l, i); return d;
            }));
            const ms = $('#u_months'); ms.replaceChildren();
            if (!U.months.length) ms.append(el('div', '還沒有月份記錄', 'muted'));
            [...U.months].sort((a, b) => b.ym.localeCompare(a.ym)).forEach(mo => {
                const card = el('div', null, 'ucard'), sh = monthShares(mo, U.members), tot = Object.values(mo.items).reduce((a, it) => a + it.total, 0);
                card.append(el('b', `${mo.ym}　共 ${kStr(tot)}`));
                const det = Object.keys(UKINDS).filter(k => mo.items[k].total).map(k => `${UKINDS[k]} ${kStr(mo.items[k].total)}（${UMETHODS[mo.items[k].method]}）`).join('、');
                const small = el('small', det); small.style.display = 'block'; small.className = 'muted'; card.append(small);
                const rt = elecRate(mo); if (rt) { const r = el('small', `實際每度電 ${rt.toFixed(2)} 元`); r.className = 'muted'; r.style.display = 'block'; card.append(r); }
                U.members.forEach(m => { const row = el('div', null, 'li'); row.append(el('span', m.name), el('b', kStr(sh[m.id].total))); card.append(row); });
                const del = el('button', '刪除這個月', 'del'); del.setAttribute('aria-label', '刪除 ' + mo.ym);
                del.onclick = () => { if (!confirm(`刪除 ${mo.ym} 的水電瓦斯記錄？無法復原。`)) return; U = removeMonth(U, mo.id); saveU(); renderUtil(); };
                card.append(del); ms.append(card);
            });
            const cu = cumulative(U), tb = $('#u_total'); tb.replaceChildren();
            if (!U.months.length) { tb.append(el('div', '有記錄後會在這裡累計', 'muted')); return; }
            tb.append(el('div', `共 ${U.months.length} 個月，合計 ${kStr(cu.all)}`, 'muted'));
            U.members.forEach(m => { const row = el('div', null, 'li'); row.append(el('span', m.name), el('b', kStr(cu.per[m.id]))); tb.append(row); });
        }
        $('#u_padd').onclick = () => {
            const r = addMember(U, $('#u_pname').value, $('#u_pping').value);
            if (r.err) return uMsg(r.err);
            U = r.util; $('#u_pname').value = ''; $('#u_pping').value = ''; saveU(); uMsg(''); renderUtil();
        };
        $('#u_pname').onkeydown = (e) => { if (e.key === 'Enter') $('#u_padd').click(); };
        $('#u_madd').onclick = () => {
            const kwh = Object.fromEntries([...document.querySelectorAll('#u_kwh input')].map(i => [i.dataset.id, parseFloat(i.value) || 0]));
            const cents = (id) => { const v = $(id).value.trim(); return v === '' ? 0 : toCents(v); };
            let elec = cents('#u_elec'); const rate = parseFloat($('#u_rate').value);
            if (!elec && rate > 0) elec = elecFromRate(kwh, rate);
            if (Number.isNaN(elec) || Number.isNaN(cents('#u_water')) || Number.isNaN(cents('#u_gas'))) return uMsg('金額請填數字');
            const items = { elec: { total: elec, method: $('#u_elec_m').value }, water: { total: cents('#u_water'), method: $('#u_water_m').value }, gas: { total: cents('#u_gas'), method: $('#u_gas_m').value } };
            const r = addMonth(U, { ym: $('#u_ym').value, items, kwh });
            if (r.err) return uMsg(r.err);
            U = r.util; saveU(); uMsg('已記錄 ' + $('#u_ym').value);
            ['u_elec', 'u_rate', 'u_water', 'u_gas'].forEach(i => { $('#' + i).value = ''; }); document.querySelectorAll('#u_kwh input').forEach(i => { i.value = ''; }); renderUtil();
        };
        $('#u_clear').onclick = () => {
            if (!U.members.length && !U.months.length) return uMsg('目前沒有水電瓦斯資料');
            if (!confirm(`清除全部水電瓦斯資料（${U.members.length} 位室友、${U.months.length} 個月記錄）？無法復原。上面的成員與支出不受影響。`)) return;
            U = { members: [], months: [] }; saveU(); uMsg('已清除'); renderUtil();
        };
        render(); renderUtil();
    </script>
</body>

</html>
