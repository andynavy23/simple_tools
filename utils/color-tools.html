<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="色彩工具：HEX、RGB、HSL 互轉，產生配色、存色票庫、檢查對比度是否符合 WCAG，並模擬色盲者看到的顏色。">
    <meta property="og:title" content="色彩工具" />
    <meta property="og:description" content="色碼互轉、配色產生、WCAG 對比度與色盲模擬。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/color-tools.html" />
    <meta name="st-keys" content="color_lib">
    <title>色彩工具</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .row button {
            white-space: nowrap;
        }

        input[type=text] {
            flex: 1;
        }

        input[type=text].bad {
            outline: 2px solid var(--bad);
        }

        input[type=color] {
            width: 48px;
            height: 40px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: none;
        }

        .swatch {
            height: 72px;
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--fill);
        }

        .val button {
            font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            border: 0;
            background: var(--fill);
            color: var(--text);
            border-radius: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .sample {
            border-radius: 14px;
            padding: 16px;
            margin: 4px 0 12px;
            text-align: center;
        }

        .sample b {
            font-size: 24px;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 980px;
            font-size: 13px;
            margin: 0 6px 6px 0;
            background: var(--fill);
        }

        .badge.ok {
            color: var(--ok);
        }

        .badge.no {
            color: var(--bad);
        }

        .palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .palette button {
            flex: 1 1 70px;
            min-width: 70px;
            height: 76px;
            border-radius: 14px;
            border: 1px solid var(--fill);
            font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 6px;
        }

        #swList button {
            position: relative;
            min-height: 76px;
        }

        #swList .x {
            position: absolute;
            top: 0;
            right: 0;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            font: 16px/1 system-ui, sans-serif;
            opacity: .75;
        }

        .ratio {
            font-size: 28px;
            font-weight: 700;
        }
        .cvdgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
        .cvdgrid figure { margin: 0; }
        .cvdgrid figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .cvdgrid canvas { width: 100%; height: auto; border-radius: var(--radius-sm); border: 1px solid var(--fill); display: block; }
        .cvdchips { display: flex; height: 56px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--fill); }
        .cvdchips i { flex: 1; }
        #cvdText { width: 100%; min-height: 72px; font-size: 16px; }
        .pair { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
        .pair .dots { display: flex; gap: 4px; }
        .pair .dots i { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--fill); }
        .pair.flag b { color: var(--bad); }
        .pair .det { color: var(--muted); font-size: 13px; flex: 1 1 100%; }
        #cvdSev { width: 100%; }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>色彩工具</h1>
        <p class="sub">色碼互轉，並檢查文字與背景是否看得清楚。</p>

        <div class="card">
            <div class="row">
                <input type="color" id="picker" value="#0071e3" aria-label="選色">
                <input type="text" id="color" value="#0071e3" spellcheck="false" aria-label="色碼（HEX / rgb() / hsl()）" placeholder="#0071e3 或 rgb(0,113,227) 或 hsl(210,100%,44%)">
            </div>
            <div class="swatch" id="swatch"></div>
            <div id="vals"></div>
        </div>

        <div class="card">
            <h2>色票庫</h2>
            <div class="row"><input type="text" id="swName" maxlength="20" placeholder="替目前的顏色取個名字" aria-label="色票名稱"><button class="primary" id="swAdd">存到色票庫</button></div>
            <div class="palette" id="swList"></div>
            <div class="row" style="margin-top:10px"><button class="sm" id="swCss">複製成 CSS 變數</button><button class="sm" id="swClear">清空</button><span class="note" id="swMsg" style="margin:0"></span></div>
        </div>

        <div class="card">
            <h2>配色產生</h2>
            <div class="row"><label for="scheme" class="sub" style="margin:0">配色</label><select id="scheme" aria-label="配色方式"></select></div>
            <div class="palette" id="palette"></div>
            <p class="note" id="paletteNote">點色塊複製色碼。</p>
        </div>

        <div class="card">
            <h2>對比度檢查</h2>
            <div class="row">
                <label for="fg" class="sub" style="margin:0">文字</label>
                <input type="color" id="fgp" value="#1d1d1f" aria-label="文字色選色">
                <input type="text" id="fg" value="#1d1d1f" spellcheck="false">
            </div>
            <div class="row">
                <label for="bg" class="sub" style="margin:0">背景</label>
                <input type="color" id="bgp" value="#ffffff" aria-label="背景色選色">
                <input type="text" id="bg" value="#ffffff" spellcheck="false">
            </div>
            <div class="sample" id="sample"><b>範例文字 Aa</b>The quick brown fox</div>
            <div class="ratio" id="ratio"></div>
            <div id="badges"></div>
        </div>

        <div class="card">
            <h2>色覺模擬</h2>
            <p class="note">模擬紅色盲、綠色盲、藍黃色盲與全色盲者眼中的上方「文字 / 背景」組合，以及模擬後的對比度。</p>
            <div id="cvd"></div>
        </div>

        <div class="card" id="cvdLab">
            <h2>色盲模擬（色票 / 圖片）</h2>
            <p class="note">貼上多個色碼，或選一張圖片（只在這台裝置處理，不會上傳；超過 1024px 會先縮小）。</p>
            <textarea id="cvdText" spellcheck="false" aria-label="色票（可多個）" placeholder="#e53935 #43a047&#10;rgb(30,136,229)"></textarea>
            <div class="row" style="margin-top:8px"><button id="cvdLib">帶入色票庫</button><button id="cvdMain">加入主色</button></div>
            <div class="row"><label class="sub" style="margin:0;flex:1 1 100%;min-width:0">圖片 <input type="file" id="cvdFile" accept="image/*" style="max-width:100%"></label></div>
            <div class="row"><label for="cvdKind" class="sub" style="margin:0">弱視</label><select id="cvdKind" aria-label="弱視類型"></select><label for="cvdSev" class="sub" style="margin:0">嚴重度 <b id="cvdSevV">50%</b></label></div>
            <input type="range" id="cvdSev" min="0" max="100" value="50" aria-label="弱視嚴重度">
            <div id="cvdMsg" class="note"></div>
            <div id="cvdOut"></div>
            <h3>配色診斷</h3>
            <div id="cvdDiag" class="note">貼上兩個以上的色碼，會檢查兩兩之間在各種色盲下會不會太接近。</div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>色碼互轉（HEX / RGB / HSL）、色票庫、配色產生、文字與背景的對比度檢查，以及色覺異常者眼中的模擬。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>設計網頁或簡報，要把設計稿的色碼換成另一種格式</li>
        <li>想找一組搭配的顏色（互補、三角、漸層…）</li>
        <li>檢查文字顏色在背景上是否看得清楚，是否符合無障礙標準</li>
        <li>確認色盲使用者能不能分辨你的配色</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用色塊選色，或在框內輸入 #0071e3、rgb(0,113,227)、hsl(210,100%,44%)；下方點任一格式就複製</li>
        <li>「色票庫」：取個名字按「存到色票庫」；點色票載入為主色，點右上角 ✕ 刪除，「複製成 CSS 變數」可一次帶走</li>
        <li>「配色產生」選配色方式，點色塊複製色碼</li>
        <li>「對比度檢查」設定文字與背景，看比值與 AA / AAA 是否通過</li>
        <li>「色覺模擬」顯示四種色覺下的對比，比值太低要換色</li>
        <li>「色盲模擬」貼多個色碼或選圖片，同時看紅 / 綠 / 藍黃 / 全色盲與弱視（可拉嚴重度）；下方「配色診斷」會標出可能難以分辨的色票組合</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">色盲模擬貼上 <b>#e53935 #43a047</b>（紅、綠），診斷會標出這組在紅 / 綠色盲下 ΔE 很小、可能難以分辨。<br>主色 <b>#0071e3</b> = rgb(0, 113, 227) = hsl(210, 100%, 45%)。<br>文字 #1d1d1f、背景 #ffffff 的對比度是 <b>16.83 : 1</b>，四項標準全部通過。</div>
        <h3>小提醒</h3>
        <ul>
        <li>一般文字至少 4.5:1（AA），大字至少 3:1</li>
        <li>色票庫最多存 100 色，滿了要先刪除才能再存；只存在你的瀏覽器</li>
        <li>色覺模擬是近似值，僅供參考（Machado 2009 模型，線性 RGB 空間）；弱視是依嚴重度內插的簡化版</li>
        <li>配色診斷用 CIE76 色差 ΔE：低於 10 視為「可能難以分辨」，色票最多 12 個；圖片與貼上的色碼不會儲存或上傳</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

        // 支援 #rgb、#rrggbb、rgb(r,g,b)、hsl(h,s%,l%)；失敗回傳 null
        function parseColor(str) {
            const s = String(str).trim().toLowerCase();
            let m = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/);
            if (m) {
                const h = m[1].length === 3 ? [...m[1]].map(c => c + c).join('') : m[1];
                return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
            }
            m = s.match(/^rgb\(\s*(\d{1,3})\s*[, ]\s*(\d{1,3})\s*[, ]\s*(\d{1,3})\s*\)$/);
            if (m && [m[1], m[2], m[3]].every(v => +v <= 255)) return { r: +m[1], g: +m[2], b: +m[3] };
            m = s.match(/^hsl\(\s*(\d+(?:\.\d+)?)\s*[, ]\s*(\d+(?:\.\d+)?)%\s*[, ]\s*(\d+(?:\.\d+)?)%\s*\)$/);
            if (m && +m[2] <= 100 && +m[3] <= 100) return hslToRgb(+m[1] % 360, +m[2], +m[3]);
            return null;
        }

        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = (n) => {
                const k = (n + h / 30) % 12;
                return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
            };
            return { r: f(0), g: f(8), b: f(4) };
        }

        function rgbToHsl({ r, g, b }) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
            let h = 0, s = 0;
            if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
                h = (h * 60 + 360) % 360;
            }
            return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        const toHex = ({ r, g, b }) => '#' + [r, g, b].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');

        // WCAG 相對亮度與對比度
        function luminance({ r, g, b }) {
            const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
            return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
        }

        function contrast(c1, c2) {
            const a = luminance(c1), b = luminance(c2);
            return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
        }

        // 色覺缺陷模擬（Machado 2009，嚴重度 100%），在線性 RGB 空間做矩陣轉換
        const CVD = {
            '紅色盲 Protanopia': [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
            '綠色盲 Deuteranopia': [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]],
            '藍黃色盲 Tritanopia': [[1.255528, -0.076749, -0.178779], [-0.078411, 0.930809, 0.147602], [0.004733, 0.691367, 0.303900]],
            '全色盲 Achromatopsia': [[0.2126, 0.7152, 0.0722], [0.2126, 0.7152, 0.0722], [0.2126, 0.7152, 0.0722]],
        };
        function simulate(c, matrix) {
            const lin = [c.r, c.g, c.b].map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
            const [r, g, b] = matrix.map(row => clamp(row[0] * lin[0] + row[1] * lin[1] + row[2] * lin[2], 0, 1))
                .map(v => Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)));
            return { r, g, b };
        }

        // 配色：由主色（hex）依色相環產生一組顏色，回傳 hex 陣列（第一個一定是主色本身）
        const SCHEMES = {
            complementary: ['互補色', [0, 180]],
            analogous: ['類似色', [-30, 0, 30]],
            triadic: ['三角配色', [0, 120, 240]],
            split: ['分裂互補', [0, 150, 210]],
            tetradic: ['四角配色', [0, 90, 180, 270]],
        };
        function palette(hex, scheme) {
            const c = parseColor(hex);
            if (!c) return [];
            const { h, s, l } = rgbToHsl(c);
            if (scheme === 'mono') return [20, 35, 50, 65, 80, 92].map(L => toHex(hslToRgb(h, s, L)));
            if (scheme === 'gradient') {
                const to = hslToRgb((h + 180) % 360, s, l);
                return Array.from({ length: 7 }, (_, i) => toHex({ r: Math.round(c.r + (to.r - c.r) * i / 6), g: Math.round(c.g + (to.g - c.g) * i / 6), b: Math.round(c.b + (to.b - c.b) * i / 6) }));
            }
            const def = SCHEMES[scheme];
            if (!def) return [];
            const out = def[1].map(d => toHex(hslToRgb(((h + d) % 360 + 360) % 360, s, l)));
            out[def[1].indexOf(0)] = toHex(c);                                  // 色相與亮度取整後可能和主色差 1，把「偏移 0」那格固定成主色本身
            return out;
        }

        // 色票庫：驗證本機資料、轉成 CSS 變數（名稱只留英數與連字號，沒有可用字元就用 color-序號）
        const validSwatch = (s) => !!s && typeof s.name === 'string' && s.name.length <= 20 && /^#[0-9a-f]{6}$/.test(s.hex);
        // 加入色票：同名同色不重複；滿了不收（回傳 null），不偷偷刪最舊的
        const MAX_SW = 100;
        const addSwatch = (list, name, hex) => (list.some(s => s.hex === hex && s.name === name) ? list : list.length >= MAX_SW ? null : [...list, { name, hex }]);
        function cssVars(list) {
            const used = new Set();
            const lines = list.map((s, i) => { let k = s.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || `color-${i + 1}`; let n = k, c = 2; while (used.has(n)) n = `${k}-${c++}`; used.add(n); return `  --${n}: ${s.hex};`; });
            return `:root {\n${lines.join('\n')}\n}`;
        }
        // ---- 色盲模擬：色票 / 圖片 ----
        // 矩陣來源：Machado, Oliveira & Fernandes (2009) "A Physiologically-based Model for Simulation of Color Vision Deficiency"，嚴重度 1.0 的表；
        // 「弱視」的嚴重度用「單位矩陣 → 嚴重度 1.0 矩陣」線性內插（論文的 0.1~0.9 各級表本來就近似這條線，這裡取簡化版）。
        const IDENT3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
        const CVD_KINDS = [['protan', '紅色盲 Protanopia', CVD['紅色盲 Protanopia']], ['deutan', '綠色盲 Deuteranopia', CVD['綠色盲 Deuteranopia']], ['tritan', '藍黃色盲 Tritanopia', CVD['藍黃色盲 Tritanopia']], ['achro', '全色盲 Achromatopsia', CVD['全色盲 Achromatopsia']]];
        const ANOMALY = { protan: '紅色弱 Protanomaly', deutan: '綠色弱 Deuteranomaly', tritan: '藍黃色弱 Tritanomaly' };
        const mixMatrix = (m, sev) => { sev = clamp(Number.isFinite(+sev) ? +sev : 1, 0, 1); return m.map((row, i) => row.map((v, j) => IDENT3[i][j] + (v - IDENT3[i][j]) * sev)); };
        const simulateSev = (c, matrix, sev = 1) => simulate(c, mixMatrix(matrix, sev));
        const srgbLin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
        const linSrgb = (v) => { v = clamp(v, 0, 1); return 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
        // 圖片：就地轉換 RGBA 資料 [from, to) 個像素（查表加速；alpha 不動），可分塊呼叫
        const LIN_LUT = Array.from({ length: 256 }, (_, i) => srgbLin(i));
        const OUT_LUT = Array.from({ length: 4096 }, (_, i) => Math.round(linSrgb(i / 4095)));
        function simulateImage(data, matrix, from = 0, to = data.length / 4) {
            const [a, b, c] = matrix;
            for (let p = from; p < to; p++) {
                const i = p * 4, r = LIN_LUT[data[i]], g = LIN_LUT[data[i + 1]], bl = LIN_LUT[data[i + 2]];
                data[i] = OUT_LUT[Math.round(clamp(a[0] * r + a[1] * g + a[2] * bl, 0, 1) * 4095)];
                data[i + 1] = OUT_LUT[Math.round(clamp(b[0] * r + b[1] * g + b[2] * bl, 0, 1) * 4095)];
                data[i + 2] = OUT_LUT[Math.round(clamp(c[0] * r + c[1] * g + c[2] * bl, 0, 1) * 4095)];
            }
            return data;
        }
        // 縮到最長邊 ≤ max（不放大）
        const fitSize = (w, h, max = 1024) => { const k = Math.min(1, max / Math.max(w, h, 1)); return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) }; };
        // CIE L*a*b*（D65）與 ΔE（CIE76，簡易距離：約 2.3 是剛好看得出差別，< 10 通常難分辨）
        function rgbToLab({ r, g, b }) {
            const R = srgbLin(r), G = srgbLin(g), B = srgbLin(b);
            const f = (t) => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
            const x = f((0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047), y = f(0.2126729 * R + 0.7151522 * G + 0.072175 * B), z = f((0.0193339 * R + 0.119192 * G + 0.9503041 * B) / 1.08883);
            return { L: 116 * y - 16, a: 500 * (x - y), b: 200 * (y - z) };
        }
        const deltaE = (c1, c2) => { const p = rgbToLab(c1), q = rgbToLab(c2); return Math.hypot(p.L - q.L, p.a - q.a, p.b - q.b); };
        // 從文字取出色碼（#hex / rgb() / hsl()，任何分隔），去重、最多 max 個
        const MAX_PAL = 12;
        function parsePalette(text, max = MAX_PAL) {
            const out = [], seen = new Set(); let over = false;
            for (const t of String(text).match(/#[0-9a-f]+|rgb\([^)]*\)|hsl\([^)]*\)/gi) || []) {
                const c = parseColor(t); if (!c) continue;
                const hex = toHex(c); if (seen.has(hex)) continue;
                seen.add(hex); if (out.length >= max) { over = true; continue; } out.push(hex);
            }
            return { colors: out, over };
        }
        // 配色診斷：每一對顏色在正常與四種色盲下的 ΔE；任一種色盲 < thr 就標「可能難以分辨」，依最小 ΔE 由小到大
        function diagnose(hexes, thr = 10) {
            const cs = hexes.map(parseColor), pairs = [];
            for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
                if (!cs[i] || !cs[j]) continue;
                const orig = deltaE(cs[i], cs[j]); let min = Infinity, worst = '';
                const sims = CVD_KINDS.map(([k, name, m]) => { const d = deltaE(simulate(cs[i], m), simulate(cs[j], m)); if (d < min) { min = d; worst = name; } return d; });
                pairs.push({ a: hexes[i], b: hexes[j], orig, sims, min, worst, flag: min < thr, already: orig < thr });
            }
            return pairs.sort((p, q) => p.min - q.min);
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);

        function bind(textId, pickId, onChange) {
            const t = $('#' + textId), p = $('#' + pickId);
            t.oninput = () => {
                const c = parseColor(t.value);
                t.classList.toggle('bad', !c);
                if (c) { p.value = toHex(c); onChange(); }
            };
            p.oninput = () => { t.value = p.value; t.classList.remove('bad'); onChange(); };
        }

        function renderMain() {
            const c = parseColor($('#color').value);
            if (!c) return;
            const hsl = rgbToHsl(c);
            $('#swatch').style.background = toHex(c);
            renderPalette();
            const vals = [toHex(c), `rgb(${c.r}, ${c.g}, ${c.b})`, `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`];
            $('#vals').replaceChildren(...vals.map(v => {
                const row = document.createElement('div'), b = document.createElement('button');
                row.className = 'li val';
                b.textContent = v;
                b.title = '點擊複製';
                b.onclick = () => Util.copyWithFeedback(b, v);
                row.append(b);
                return row;
            }));
        }

        function renderContrast() {
            const fg = parseColor($('#fg').value), bg = parseColor($('#bg').value);
            if (!fg || !bg) return;
            $('#sample').style.color = toHex(fg);
            $('#sample').style.background = toHex(bg);
            const r = contrast(fg, bg);
            $('#ratio').textContent = `${r.toFixed(2)} : 1`;
            const tests = [['AA 一般文字 ≥ 4.5', r >= 4.5], ['AA 大字 ≥ 3', r >= 3], ['AAA 一般文字 ≥ 7', r >= 7], ['AAA 大字 ≥ 4.5', r >= 4.5]];
            $('#badges').replaceChildren(...tests.map(([name, ok]) => {
                const s = document.createElement('span');
                s.className = 'badge ' + (ok ? 'ok' : 'no');
                s.textContent = (ok ? '✓ ' : '✗ ') + name;
                return s;
            }));
            renderCvd();
        }

        function renderCvd() {
            const fg = parseColor($('#fg').value), bg = parseColor($('#bg').value);
            if (!fg || !bg) return;
            $('#cvd').replaceChildren(...Object.entries(CVD).map(([name, m]) => {
                const f = simulate(fg, m), b = simulate(bg, m), row = document.createElement('div'), s = document.createElement('div');
                row.className = 'li';
                s.className = 'sample'; s.style.cssText = `color:${toHex(f)};background:${toHex(b)};margin:0;padding:8px 18px;flex:0 0 auto;border:1px solid var(--fill)`;
                s.textContent = 'Aa 範例';
                const label = document.createElement('span');
                label.innerHTML = '<b></b><br><span class="muted"></span>';
                label.firstChild.textContent = name; label.lastChild.textContent = `對比 ${contrast(f, b).toFixed(2)} : 1`;
                row.append(label, s);
                return row;
            }));
        }

        function renderPalette() {
            const c = parseColor($('#color').value);
            if (!c) return;
            const list = palette(toHex(c), $('#scheme').value);
            $('#palette').replaceChildren(...list.map(hex => {
                const b = document.createElement('button'), rgb = parseColor(hex);
                b.style.background = hex; b.style.color = luminance(rgb) > 0.4 ? '#000' : '#fff'; b.textContent = hex; b.title = '點擊複製';
                b.onclick = () => Util.copyWithFeedback(b, hex);
                return b;
            }));
            $('#paletteNote').textContent = $('#scheme').value === 'gradient' ? 'CSS：linear-gradient(90deg, ' + list[0] + ', ' + list[list.length - 1] + ')' : '點色塊複製色碼。';
        }
        $('#scheme').replaceChildren(...Object.entries(SCHEMES).map(([k, v]) => new Option(v[0], k)), new Option('單色深淺', 'mono'), new Option('漸層（主色 → 互補色）', 'gradient'));
        $('#scheme').value = 'triadic';
        $('#scheme').onchange = renderPalette;

        // 色票庫
        let lib = (Array.isArray(Util.store.get('color_lib', [])) ? Util.store.get('color_lib', []) : []).filter(validSwatch).slice(0, MAX_SW);
        const saveLib = () => Util.store.set('color_lib', lib);
        function renderLib() {
            $('#swList').replaceChildren(...(lib.length ? lib.map((s, i) => {
                const b = document.createElement('button'), rgb = parseColor(s.hex);
                b.style.background = s.hex; b.style.color = luminance(rgb) > 0.4 ? '#000' : '#fff'; b.style.flexDirection = 'column'; b.style.alignItems = 'center'; b.style.justifyContent = 'flex-end'; b.title = '點一下載入為主色；右上角 ✕ 刪除';
                b.append(Object.assign(document.createElement('b'), { textContent: s.name || s.hex }), Object.assign(document.createElement('span'), { textContent: s.hex }));
                const x = Object.assign(document.createElement('span'), { className: 'x', textContent: '✕', title: '刪除' }); x.setAttribute('role', 'button'); x.setAttribute('aria-label', '刪除 ' + (s.name || s.hex));
                x.onclick = (e) => { e.stopPropagation(); lib.splice(i, 1); saveLib(); renderLib(); }; b.append(x);
                b.onclick = (e) => { if (e.shiftKey || e.altKey) { lib.splice(i, 1); saveLib(); renderLib(); return; } $('#color').value = s.hex; $('#color').dispatchEvent(new Event('input')); };
                b.oncontextmenu = (e) => { e.preventDefault(); lib.splice(i, 1); saveLib(); renderLib(); };
                return b;
            }) : [Object.assign(document.createElement('span'), { className: 'muted', textContent: '還沒有存任何顏色' })]));
            $('#swMsg').textContent = lib.length ? '點色票載入；點右上角 ✕ 刪除' : '';
        }
        $('#swAdd').onclick = () => { const c = parseColor($('#color').value); if (!c) { $('#swMsg').textContent = '目前的色碼不正確'; return; } const hex = toHex(c); const nl = addSwatch(lib, $('#swName').value.trim(), hex); if (nl === lib) return; if (!nl) { $('#swMsg').textContent = `色票庫已滿（${MAX_SW} 色），請先刪除不用的`; return; } lib = nl; saveLib(); $('#swName').value = ''; renderLib(); };
        $('#swCss').onclick = () => Util.copyWithFeedback($('#swCss'), cssVars(lib));
        $('#swClear').onclick = () => { if (lib.length && confirm('確定清空色票庫？')) { lib = []; saveLib(); renderLib(); } };
        renderLib();

        // 讓主色欄位也能從 rgb()/hsl() 反映到選色器
        bind('color', 'picker', renderMain);
        bind('fg', 'fgp', renderContrast);
        bind('bg', 'bgp', renderContrast);
        renderMain();
        renderContrast();
        // 色盲模擬（色票 / 圖片）
        {
            const kindSel = $('#cvdKind'), out = $('#cvdOut');
            kindSel.replaceChildren(...Object.entries(ANOMALY).map(([k, v]) => new Option(v, k)));
            let img = null, token = 0;
            const MAX_IMG_BYTES = 20 * 1024 * 1024;
            const cap = (text) => Object.assign(document.createElement('figcaption'), { textContent: text });
            const kinds = () => [['原圖 / 原色', null], ...CVD_KINDS.map(([k, n, m]) => [n, m]), [`${ANOMALY[kindSel.value]}（${$('#cvdSev').value}%）`, mixMatrix(CVD_KINDS.find(x => x[0] === kindSel.value)[2], $('#cvdSev').value / 100)]];
            function renderSwatches(cols) {
                const g = document.createElement('div'); g.className = 'cvdgrid';
                for (const [name, m] of kinds()) {
                    const fig = document.createElement('figure'), bar = document.createElement('div'); bar.className = 'cvdchips';
                    for (const hex of cols) { const i = document.createElement('i'); i.style.background = m ? toHex(simulate(parseColor(hex), m)) : hex; i.title = hex; bar.append(i); }
                    fig.append(bar, cap(name)); g.append(fig);
                }
                out.replaceChildren(g);
            }
            // 圖片：每種色盲一張 canvas，一次處理 64 列、讓出主執行緒，大圖也不會卡住畫面
            function renderImage() {
                const my = ++token, { w, h } = fitSize(img.naturalWidth || img.width, img.naturalHeight || img.height, 1024);
                const g = document.createElement('div'); g.className = 'cvdgrid'; out.replaceChildren(g);
                const base = document.createElement('canvas'); base.width = w; base.height = h;
                const bx = base.getContext('2d', { willReadFrequently: true }); bx.drawImage(img, 0, 0, w, h);
                let src; try { src = bx.getImageData(0, 0, w, h); } catch (e) { $('#cvdMsg').textContent = '這張圖片無法讀取'; return; }
                for (const [name, m] of kinds()) {
                    const fig = document.createElement('figure'), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
                    fig.append(cv, cap(name)); g.append(fig);
                    const cx = cv.getContext('2d'), id = new ImageData(new Uint8ClampedArray(src.data), w, h);
                    if (!m) { cx.putImageData(id, 0, 0); continue; }
                    let y = 0;
                    const step = () => { if (my !== token) return; const to = Math.min(h, y + 64); simulateImage(id.data, m, y * w, to * w); y = to; if (y < h) setTimeout(step, 0); else cx.putImageData(id, 0, 0); };
                    setTimeout(step, 0);
                }
            }
            function renderDiag(cols) {
                const box = $('#cvdDiag');
                if (cols.length < 2) { box.className = 'note'; box.textContent = '貼上兩個以上的色碼，會檢查兩兩之間在各種色盲下會不會太接近。'; return; }
                const pairs = diagnose(cols), bad = pairs.filter(p => p.flag), names = CVD_KINDS.map(k => k[1].split(' ')[0]);
                box.className = '';
                const head = document.createElement('p'); head.textContent = bad.length ? `${pairs.length} 組中有 ${bad.length} 組可能難以分辨（ΔE < 10）` : `${pairs.length} 組在四種色盲下都分得開（ΔE ≥ 10）`; head.style.color = bad.length ? 'var(--bad)' : 'var(--ok)';
                box.replaceChildren(head, ...pairs.map(p => {
                    const d = document.createElement('div'); d.className = 'pair' + (p.flag ? ' flag' : '');
                    const dots = document.createElement('span'); dots.className = 'dots';
                    for (const hex of [p.a, p.b]) { const i = document.createElement('i'); i.style.background = hex; dots.append(i); }
                    const t = document.createElement('b'); t.textContent = `${p.a} ↔ ${p.b}　${p.flag ? (p.already ? '本來就接近' : '可能難以分辨') : '分得開'}`;
                    const det = document.createElement('span'); det.className = 'det'; det.textContent = `正常 ΔE ${p.orig.toFixed(1)}；` + p.sims.map((v, i) => `${names[i]} ${v.toFixed(1)}`).join('、') + (p.flag ? `（最接近：${p.worst.split(' ')[0]}）` : '');
                    d.append(dots, t, det); return d;
                }));
            }
            function run() {
                $('#cvdSevV').textContent = $('#cvdSev').value + '%';
                if (img) { renderImage(); renderDiag([]); return; }
                const { colors, over } = parsePalette($('#cvdText').value);
                $('#cvdMsg').textContent = over ? `色票最多 ${MAX_PAL} 個，多的忽略` : '';
                if (!colors.length) { out.replaceChildren(); renderDiag([]); return; }
                renderSwatches(colors); renderDiag(colors);
            }
            $('#cvdText').oninput = () => { img = null; run(); };
            $('#cvdSev').oninput = kindSel.onchange = run;
            const addText = (arr) => { const t = $('#cvdText'); t.value = (t.value.trim() ? t.value.trim() + ' ' : '') + arr.join(' '); img = null; run(); };
            $('#cvdLib').onclick = () => { if (!lib.length) { $('#cvdMsg').textContent = '色票庫是空的'; return; } addText(lib.map(s => s.hex)); };
            $('#cvdMain').onclick = () => { const c = parseColor($('#color').value); if (c) addText([toHex(c)]); };
            $('#cvdFile').onchange = (e) => {
                const f = e.target.files[0]; e.target.value = ''; if (!f) return;
                if (!/^image\//.test(f.type)) { $('#cvdMsg').textContent = '請選圖片檔'; return; }
                if (f.size > MAX_IMG_BYTES) { $('#cvdMsg').textContent = '圖片超過 20MB，請先縮小'; return; }
                const url = URL.createObjectURL(f), im = new Image();
                im.onload = () => { URL.revokeObjectURL(url); img = im; $('#cvdMsg').textContent = `${f.name}（${im.naturalWidth}×${im.naturalHeight}，處理時縮到最長邊 ≤ 1024）`; run(); };
                im.onerror = () => { URL.revokeObjectURL(url); $('#cvdMsg').textContent = '圖片讀取失敗'; };
                im.src = url;
            };
            run();
        }
    </script>
</body>
