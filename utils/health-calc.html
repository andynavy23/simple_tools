    <template id="help">
        <h3>這是什麼</h3>
        <p>輸入身高體重等資料，算出 BMI、基礎代謝、每日熱量需求與心率區間；下方還能每天記體重、看趨勢折線圖。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想知道自己的 BMI 落在哪個等級（採衛福部成人標準）。</li>
        <li>規劃減重或增肌，需要估每天該吃多少熱量。</li>
        <li>運動時想知道燃脂、有氧的目標心率。</li>
        <li>每天量體重，想看一段時間的變化與多久能達到目標。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>填「身高」「體重」「年齡」，選「性別」與「活動量」；有量過靜止心率可填，心率區間會改用儲備心率法。</li>
        <li>上面的結果卡片即時更新：BMI、健康體重範圍、BMR、TDEE、減重 / 增肌熱量、各心率區間。</li>
        <li>體重紀錄：選「日期」、填「體重」，按「記錄」。同一天再記會取代舊的。</li>
        <li>填「目標體重」後，折線圖會畫出目標線，並依近 30 天趨勢估算大約哪天達標。</li>
        <li>飲食記錄：選「日期」「餐別」，用「搜尋食物」找（可輸入別名，例如「珍奶」），在「食物」選單挑一項，填「份數」按「記錄」。當日總熱量會跟上面算出的 TDEE 對照，顯示剩餘或超出，並列出各餐別小計與近 7 天長條圖。</li>
        <li>找不到的食物可在「自訂食物」填名稱與每份大卡新增。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">身高 170、體重 65、30 歲、男、每週運動 1–3 天
        → BMI 22.5（健康體重），健康範圍 53.5 – 69.4 kg
        → BMR 1,568 大卡、TDEE 2,155 大卡
        → 減重約 1,655 大卡、最大心率 190 次/分</div>
        <h3>小提醒</h3>
        <ul>
        <li>都是估算值，不能取代醫師或營養師的建議。</li>
        <li>趨勢預測至少需要兩個不同日期的紀錄；趨勢若沒朝目標走就不會給日期。</li>
        <li>資料只存在本機瀏覽器，不會上傳。體重紀錄最多保留最近 1,000 天；清單只列最近 8 筆，要全部重來請按「清除全部體重紀錄」。</li>
        <li>飲食熱量表是約 170 種臺灣常見食物的「一般估計值」，不同店家差異大，不是醫療建議；實際以包裝標示為準。</li>
        <li>飲食紀錄最多 5,000 筆、自訂食物最多 50 個，滿了會拒絕新增並提示。可刪單筆、清除某天、刪一年前的、或清除全部；刪除自訂食物不影響已記錄的項目（會保留當時的名稱與熱量）。</li>
        </ul>
    </template>

    <script>
        const { day } = Util;

        // --- pure ---
        const bmi = (cm, kg) => kg / Math.pow(cm / 100, 2);

        // 台灣衛福部成人標準
        function bmiLabel(v) {
            if (v < 18.5) return '體重過輕';
            if (v < 24) return '健康體重';
            if (v < 27) return '過重';
            if (v < 30) return '輕度肥胖';
            if (v < 35) return '中度肥胖';
            return '重度肥胖';
        }

        // 基礎代謝率：Mifflin-St Jeor
        const bmr = (sex, kg, cm, age) => 10 * kg + 6.25 * cm - 5 * age + (sex === 'm' ? 5 : -161);

        // 健康體重範圍（BMI 18.5–24）
        const healthyRange = (cm) => [18.5 * Math.pow(cm / 100, 2), 24 * Math.pow(cm / 100, 2)];

        // 心率區間：最大心率 220 − 年齡；有靜止心率時改用儲備心率法（Karvonen）
        function heartZones(age, rhr) {
            const max = 220 - age;
            const at = (p) => (rhr ? Math.round(rhr + (max - rhr) * p) : Math.round(max * p));
            return { max, zones: [['暖身 / 恢復', .5, .6], ['燃脂', .6, .7], ['有氧', .7, .8], ['無氧', .8, .9], ['極限', .9, 1]].map(([n, a, b]) => [n, at(a), at(b)]) };
        }

        // ---------- 體重紀錄 ----------
        const validWeight = (e) => !!e && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && Number.isFinite(e.kg) && e.kg >= 10 && e.kg <= 400;
        // 同一天只留一筆（後記的取代先記的），依日期排序，最多保留 1000 筆
        function addWeight(log, d, kg) {
            const out = log.filter(e => e.d !== d); out.push({ d, kg });
            return out.sort((a, b) => a.d.localeCompare(b.d)).slice(-1000);
        }
        // 最近 days 天內的趨勢（最小平方法，kg / 天）；少於 2 個不同日期回傳 null
        function slopePerDay(log, days, today) {
            const pts = log.filter(e => { const ago = day.between(e.d, today); return ago >= 0 && ago <= days; }).map(e => [day.num(e.d), e.kg]);
            if (pts.length < 2) return null;
            const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
            const sxx = pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
            return sxx ? pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / sxx : null;
        }
        // 照最近 30 天趨勢，大約哪天達到目標：{ reached } | { days, date } | { days: null }（趨勢沒有朝目標走，或要超過 10 年）| null（資料不足）
        function etaGoal(log, goal, today) {
            const slope = slopePerDay(log, 30, today); if (slope === null || !log.length) return null;
            const last = log[log.length - 1], remain = goal - last.kg;
            if (Math.abs(remain) < 0.05) return { reached: true };
            if (slope === 0 || Math.sign(slope) !== Math.sign(remain)) return { days: null };
            const days = Math.ceil(remain / slope);
            return days > 3650 ? { days: null } : { days, date: day.shift(last.d, days) };
        }

                const x = el('button', { className: 'sm', textContent: '刪除' }); x.setAttribute('aria-label', `刪除 ${e.name}`);
                x.onclick = () => { flog = removeById(flog, e.id); put('food_log', flog); renderFood(); };
                return el('div', { className: 'li' }, el('span', { className: 'muted', textContent: MEALS[e.meal] }), el('span', { textContent: `${e.name} × ${e.n}` }), el('b', { textContent: `${nf(e.kcal * e.n)} 大卡` }), x);
            }));
            const w7 = last7(flog, d), mx = Math.max(1, ...w7.days.map(x => x.total), tdee);
            $('#fchart').replaceChildren(...w7.days.map((x, i) => el('div', { className: i === 6 ? 'today' : '' }, el('span', { textContent: x.total ? nf(x.total) : '' }), el('b', { style: `height:${x.total / mx * 100 * 0.78}%` }), el('span', { textContent: x.d.slice(5) }))));
            $('#favg').textContent = w7.recorded ? `近 7 天平均 ${nf(w7.avg)} 大卡／天（${w7.recorded} 天有紀錄）` : '近 7 天還沒有紀錄';
            $('#fcount').textContent = `共 ${nf(flog.length)} / ${nf(FOOD_LOG_MAX)} 筆紀錄`;
            $('#clist').replaceChildren(...fcustom.map(c => {
                const x = el('button', { className: 'sm', textContent: '刪除' }); x.setAttribute('aria-label', `刪除自訂食物 ${c.name}`);
                x.onclick = () => { if (confirm(`刪除自訂食物「${c.name}」？已記錄的項目會保留名稱與熱量。`)) { fcustom = removeById(fcustom, c.id); put('food_custom', fcustom); renderPicker(); renderFood(); } };
                return el('div', { className: 'li' }, el('span', { textContent: c.name }), el('b', { textContent: `${c.kcal} 大卡` }), x);
            }));
        }
        $('#fq').oninput = renderPicker; $('#fd').oninput = renderFood;
        for (const id of ['h', 'w', 'age', 'sex', 'act']) { const prev = $('#' + id).oninput; $('#' + id).oninput = () => { prev(); renderFood(); }; }
        $('#fadd').onclick = () => {
            const f = allFoods().find(x => x.key === $('#fsel').value), n = parseFloat($('#fn').value);
            if (!f) { $('#fmsg').textContent = '請先選一個食物'; return; }
            if (!validServings(n)) { $('#fmsg').textContent = '份數請輸入 0.5 刻度（0.5–20）'; return; }
            if (!isDate($('#fd').value)) { $('#fmsg').textContent = '請選擇日期'; return; }
            const next = addFoodLog(flog, { id: newId(), d: $('#fd').value, meal: $('#fm').value, name: f.name, kcal: f.kcal, n });
            if (!next) { $('#fmsg').textContent = `紀錄已達 ${FOOD_LOG_MAX} 筆上限，請先清除舊紀錄`; return; }
            flog = next; put('food_log', flog); $('#fmsg').textContent = `已記錄 ${f.name} × ${n}`; renderFood();
        };
        $('#cadd').onclick = () => {
            const r = addCustomFood(fcustom, $('#cn').value, $('#ck').value, newId());
            if (r.err) { $('#cmsg').textContent = r.err; return; }
            fcustom = r.list; put('food_custom', fcustom); $('#cn').value = $('#ck').value = ''; $('#cmsg').textContent = '已新增'; renderPicker(); renderFood();
        };
        $('#fclearday').onclick = () => { const d = $('#fd').value, n = flog.filter(e => e.d === d).length; if (n && confirm(`確定刪除 ${d} 的 ${n} 筆飲食紀錄？無法復原。`)) { flog = removeDay(flog, d); put('food_log', flog); renderFood(); } };
        $('#fold').onclick = () => { const next = removeOlderThanYear(flog, Util.day.today()), n = flog.length - next.length; if (!n) { $('#fcount').textContent = '沒有一年前的紀錄'; return; } if (confirm(`確定刪除一年前的 ${n} 筆飲食紀錄？無法復原。`)) { flog = next; put('food_log', flog); renderFood(); } };
        $('#fall').onclick = () => { if (flog.length && confirm(`確定刪除全部 ${flog.length} 筆飲食紀錄？無法復原（自訂食物不受影響）。`)) { flog = []; put('food_log', flog); renderFood(); } };
        renderPicker(); renderFood();
    </script>
</body>

</html>
