<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="BMI、基礎代謝、每日熱量需求與運動心率區間計算，資料不離開你的瀏覽器。">
    <meta property="og:title" content="BMI / 熱量 / 心率計算" />
    <meta property="og:description" content="BMI、基礎代謝、每日熱量與心率區間。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/health-calc.html" />
    <title>BMI / 熱量 / 心率計算</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        .zone {
            height: 10px;
            border-radius: 5px;
            margin: 6px 0 2px;
            background: var(--fill);
            position: relative;
        }

        .zone i {
            position: absolute;
            top: -4px;
            width: 4px;
            height: 18px;
            background: var(--text);
            border-radius: 2px;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>BMI / 熱量 / 心率計算</h1>
        <p class="sub">估算值僅供參考，不能取代專業醫療建議。</p>

        <div class="card">
            <div class="fgrid">
                <div><label for="h">身高 (cm)</label><input id="h" type="number" min="50" max="250" step="any" value="170"></div>
                <div><label for="w">體重 (kg)</label><input id="w" type="number" min="10" max="400" step="any" value="65"></div>
                <div><label for="age">年齡</label><input id="age" type="number" min="10" max="100" step="1" value="30"></div>
                <div><label for="sex">性別</label><select id="sex" style="width:100%"><option value="m">男</option><option value="f">女</option></select></div>
                <div><label for="act">活動量</label>
                    <select id="act" style="width:100%">
                        <option value="1.2">幾乎不運動</option>
                        <option value="1.375" selected>每週運動 1–3 天</option>
                        <option value="1.55">每週運動 3–5 天</option>
                        <option value="1.725">每週運動 6–7 天</option>
                        <option value="1.9">重度勞動或每日訓練</option>
                    </select>
                </div>
                <div><label for="rhr">靜止心率（選填）</label><input id="rhr" type="number" min="30" max="120" step="1" placeholder="例如 60"></div>
            </div>
        </div>

        <div class="card" id="out"></div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const bmi = (cm, kg) => kg / Math.pow(cm / 100, 2);

        // 台灣衛福部成人標準
        function bmiLabel(v) {
            if (v < 18.5) return '體重過輕';
            if (v < 24) return '健康體重';
            if (v < 27) return '過重';
            if (v < 30) return '輕度肥胖';
            if (v < 35) return '中度肥胖';
            return '重度肥胖';
        }

        // 基礎代謝率：Mifflin-St Jeor
        const bmr = (sex, kg, cm, age) => 10 * kg + 6.25 * cm - 5 * age + (sex === 'm' ? 5 : -161);

        // 健康體重範圍（BMI 18.5–24）
        const healthyRange = (cm) => [18.5 * Math.pow(cm / 100, 2), 24 * Math.pow(cm / 100, 2)];

        // 心率區間：最大心率 220 − 年齡；有靜止心率時改用儲備心率法（Karvonen）
        function heartZones(age, rhr) {
            const max = 220 - age;
            const at = (p) => (rhr ? Math.round(rhr + (max - rhr) * p) : Math.round(max * p));
            return { max, zones: [['暖身 / 恢復', .5, .6], ['燃脂', .6, .7], ['有氧', .7, .8], ['無氧', .8, .9], ['極限', .9, 1]].map(([n, a, b]) => [n, at(a), at(b)]) };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const num = (id) => parseFloat($('#' + id).value);
        const nf = (v, d = 0) => v.toLocaleString('zh-TW', { maximumFractionDigits: d });

        function render() {
            const out = $('#out'); out.replaceChildren();
            const h = num('h'), w = num('w'), age = num('age'), rhr = num('rhr') || 0;
            if (!(h >= 50 && w >= 10 && age >= 10)) { out.textContent = '請輸入有效的身高、體重與年齡'; return; }
            const b = bmi(h, w), [lo, hi] = healthyRange(h), base = bmr($('#sex').value, w, h, age), tdee = base * num('act'), hz = heartZones(age, rhr);
            const pos = Math.min(100, Math.max(0, (b - 15) / (40 - 15) * 100));
            const bar = document.createElement('div'); bar.className = 'zone'; bar.style.background = 'linear-gradient(90deg,#64d2ff 0 14%,#30d158 14% 36%,#ffd60a 36% 48%,#ff9f0a 48% 60%,#ff453a 60% 100%)';
            const mark = document.createElement('i'); mark.style.left = pos + '%'; bar.append(mark);
            out.append(Util.statRow('BMI', `${nf(b, 1)}（${bmiLabel(b)}）`, 'big'));
            const wrap = document.createElement('div'); wrap.append(bar); out.append(wrap);
            out.append(
                Util.statRow('健康體重範圍', `${nf(lo, 1)} – ${nf(hi, 1)} kg`),
                Util.statRow('基礎代謝率（BMR）', `${nf(base)} 大卡`),
                Util.statRow('每日熱量需求（TDEE）', `${nf(tdee)} 大卡`),
                Util.statRow('減重（約 −500）', `${nf(tdee - 500)} 大卡`),
                Util.statRow('增肌（約 +300）', `${nf(tdee + 300)} 大卡`),
                Util.statRow(`最大心率${rhr ? '（儲備心率法）' : ''}`, `${hz.max} 次/分`),
                ...hz.zones.map(([n, a, z]) => Util.statRow(n, `${a} – ${z} 次/分`)),
            );
        }

        document.querySelectorAll('input, select').forEach(i => { i.oninput = render; });
        render();
    </script>
</body>

</html>
