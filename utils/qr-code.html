<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="QR Code 產生器：輸入文字或網址即時產生，可選容錯等級與大小，下載 PNG，並能產生 Code 128 與 EAN-13 條碼，全部在本機完成。">
    <meta property="og:title" content="QR Code 產生器" />
    <meta property="og:description" content="QR Code 與 Code 128 / EAN-13 條碼，可下載 PNG。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/qr-code.html" />
    <title>QR Code 產生器</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 12px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .stage {
            display: grid;
            place-items: center;
            padding: 8px;
        }

        canvas {
            width: min(100%, 360px);
            height: auto;
            image-rendering: pixelated;
            background: #fff;
            border-radius: 8px;
        }

        label {
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>QR Code 產生器</h1>
        <p class="sub">輸入文字或網址產生 QR Code，或切到「條碼」產生 Code 128 / EAN-13。全部在你的瀏覽器內完成。</p>

        <div class="tabs" style="display:flex;gap:8px;margin-bottom:12px">
            <button data-t="qr" aria-pressed="true">QR Code</button>
            <button data-t="bar" aria-pressed="false">條碼</button>
        </div>

        <div id="qrPane">
        <div class="card">
            <textarea id="text" placeholder="例如：https://andynavy23.github.io/simple_tools/" aria-label="內容"></textarea>
            <div class="row">
                <label for="ecc">容錯</label>
                <select id="ecc">
                    <option value="L">L・7%（資料最多）</option>
                    <option value="M" selected>M・15%</option>
                    <option value="Q">Q・25%</option>
                    <option value="H">H・30%（最耐髒污）</option>
                </select>
                <label for="scale">大小</label>
                <select id="scale">
                    <option value="4">小</option>
                    <option value="8" selected>中</option>
                    <option value="12">大</option>
                </select>
            </div>
            <p class="note" id="info"></p>
        </div>

        <div class="card stage" id="stage" hidden>
            <canvas id="qr" aria-label="QR Code"></canvas>
            <div class="row"><button class="primary" id="save">下載 PNG</button></div>
        </div>
        </div>

        <div id="barPane" hidden>
            <div class="card">
                <div class="row" style="margin-top:0">
                    <label for="btype">種類</label>
                    <select id="btype"><option value="c128">Code 128（英文、數字、符號）</option><option value="ean13">EAN-13（商品條碼，12 或 13 位數字）</option></select>
                    <label for="bscale">寬度</label>
                    <select id="bscale"><option value="1">細</option><option value="2" selected>中</option><option value="3">粗</option></select>
                    <label><input type="checkbox" id="btext" checked> 顯示文字</label>
                </div>
                <input id="bin" type="text" placeholder="例如：HELLO-123 或 590123412345" autocomplete="off" spellcheck="false" style="width:100%;margin-top:12px" aria-label="條碼內容">
                <p class="note" id="binfo"></p>
            </div>
            <div class="card stage" id="bstage" hidden>
                <canvas id="bc" aria-label="條碼"></canvas>
                <div class="row"><button class="primary" id="bsave">下載 PNG</button></div>
            </div>
        </div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // QR Code 編碼（位元組模式，版本 1–40，容錯 L/M/Q/H）。演算法依 ISO/IEC 18004。
        const ECC_LEVELS = { L: 0, M: 1, Q: 2, H: 3 };
        const ECC_FORMAT_BITS = [1, 0, 3, 2];
        // 索引 0 為佔位；依序為版本 1..40
        const ECC_CODEWORDS_PER_BLOCK = [
            [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
            [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
            [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
            [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        ];
        const NUM_ERROR_CORRECTION_BLOCKS = [
            [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
            [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
            [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
            [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
        ];

        // 該版本可放資料的模組數（扣掉功能圖樣）
        function numRawDataModules(ver) {
            let r = (16 * ver + 128) * ver + 64;
            if (ver >= 2) {
                const na = Math.floor(ver / 7) + 2;
                r -= (25 * na - 10) * na - 55;
                if (ver >= 7) r -= 36;
            }
            return r;
        }
        const numDataCodewords = (ver, e) => Math.floor(numRawDataModules(ver) / 8) - ECC_CODEWORDS_PER_BLOCK[e][ver] * NUM_ERROR_CORRECTION_BLOCKS[e][ver];

        // GF(256) 與 Reed-Solomon
        function rsMultiply(x, y) {
            let z = 0;
            for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
            return z;
        }
        function rsDivisor(degree) {
            const res = new Array(degree).fill(0);
            res[degree - 1] = 1;
            let root = 1;
            for (let i = 0; i < degree; i++) {
                for (let j = 0; j < res.length; j++) { res[j] = rsMultiply(res[j], root); if (j + 1 < res.length) res[j] ^= res[j + 1]; }
                root = rsMultiply(root, 2);
            }
            return res;
        }
        function rsRemainder(data, divisor) {
            const res = divisor.map(() => 0);
            for (const b of data) {
                const f = b ^ res.shift();
                res.push(0);
                divisor.forEach((c, i) => { res[i] ^= rsMultiply(c, f); });
            }
            return res;
        }

        const getBit = (x, i) => ((x >>> i) & 1) !== 0;

        function alignmentPositions(ver) {
            if (ver === 1) return [];
            const n = Math.floor(ver / 7) + 2, size = ver * 4 + 17;
            const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
            const res = [6];
            for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
            return res;
        }

        function addEccAndInterleave(data, ver, e) {
            const nb = NUM_ERROR_CORRECTION_BLOCKS[e][ver], eccLen = ECC_CODEWORDS_PER_BLOCK[e][ver];
            const raw = Math.floor(numRawDataModules(ver) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
            const blocks = [], div = rsDivisor(eccLen);
            for (let i = 0, k = 0; i < nb; i++) {
                const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
                k += dat.length;
                const ecc = rsRemainder(dat, div);
                if (i < nShort) dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            const out = [];
            for (let i = 0; i < blocks[0].length; i++)
                blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) out.push(b[i]); });
            return out;
        }

        // 回傳 { version, size, modules: boolean[y][x] }；內容超過容量時丟出 Error
        function encode(text, eccName = 'M', forceMask = -1) {
            const e = ECC_LEVELS[eccName];
            const bytes = [...new TextEncoder().encode(text)];
            let ver = 1;
            for (; ; ver++) {
                if (ver > 40) throw new Error('內容太長，超過 QR Code 容量');
                const ccBits = ver <= 9 ? 8 : 16;
                if (4 + ccBits + bytes.length * 8 <= numDataCodewords(ver, e) * 8 && (ccBits === 16 || bytes.length < 256)) break;
            }
            const cap = numDataCodewords(ver, e) * 8, ccBits = ver <= 9 ? 8 : 16;
            const bits = [];
            const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
            push(0b0100, 4); push(bytes.length, ccBits); bytes.forEach(b => push(b, 8));
            push(0, Math.min(4, cap - bits.length));
            push(0, (8 - bits.length % 8) % 8);
            for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) push(pad, 8);
            const data = new Array(bits.length / 8).fill(0);
            bits.forEach((b, i) => { data[i >>> 3] |= b << (7 - (i & 7)); });

            const size = ver * 4 + 17;
            const mod = Array.from({ length: size }, () => new Array(size).fill(false));
            const fn = Array.from({ length: size }, () => new Array(size).fill(false));
            const setFn = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };

            const finder = (x, y) => {
                for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
                    if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, dist !== 2 && dist !== 4);
                }
            };
            const alignment = (x, y) => { for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); };
            const formatBits = (mask) => {
                const d = ECC_FORMAT_BITS[e] << 3 | mask;
                let rem = d;
                for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
                const bs = (d << 10 | rem) ^ 0x5412;
                for (let i = 0; i <= 5; i++) setFn(8, i, getBit(bs, i));
                setFn(8, 7, getBit(bs, 6)); setFn(8, 8, getBit(bs, 7)); setFn(7, 8, getBit(bs, 8));
                for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bs, i));
                for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bs, i));
                for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bs, i));
                setFn(8, size - 8, true);
            };

            // 功能圖樣
            for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
            finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
            const ap = alignmentPositions(ver), na = ap.length;
            for (let i = 0; i < na; i++) for (let j = 0; j < na; j++)
                if (!((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0))) alignment(ap[i], ap[j]);
            formatBits(0);
            if (ver >= 7) {
                let rem = ver;
                for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
                const bs = ver << 12 | rem;
                for (let i = 0; i < 18; i++) { const c = getBit(bs, i), a = size - 11 + i % 3, b = Math.floor(i / 3); setFn(a, b, c); setFn(b, a, c); }
            }

            // 放入資料（之字形）
            const all = addEccAndInterleave(data, ver, e);
            let k = 0;
            for (let right = size - 1; right >= 1; right -= 2) {
                if (right === 6) right = 5;
                for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
                    const x = right - j, upward = ((right + 1) & 2) === 0, y = upward ? size - 1 - vert : vert;
                    if (!fn[y][x] && k < all.length * 8) { mod[y][x] = getBit(all[k >>> 3], 7 - (k & 7)); k++; }
                }
            }

            const applyMask = (m) => {
                for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                    let inv;
                    switch (m) {
                        case 0: inv = (x + y) % 2 === 0; break;
                        case 1: inv = y % 2 === 0; break;
                        case 2: inv = x % 3 === 0; break;
                        case 3: inv = (x + y) % 3 === 0; break;
                        case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
                        case 5: inv = x * y % 2 + x * y % 3 === 0; break;
                        case 6: inv = (x * y % 2 + x * y % 3) % 2 === 0; break;
                        default: inv = ((x + y) % 2 + x * y % 3) % 2 === 0;
                    }
                    if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
                }
            };

            // 罰分（ISO 18004 的四條規則）
            const penalty = () => {
                let p = 0;
                const line = (get) => {
                    let run = 1, sc = 0;
                    for (let i = 1; i < size; i++) {
                        if (get(i) === get(i - 1)) { run++; if (run === 5) sc += 3; else if (run > 5) sc++; } else run = 1;
                    }
                    return sc;
                };
                const pat = [true, false, true, true, true, false, true];
                const finderLike = (get) => {
                    let sc = 0;
                    for (let i = 0; i + 7 <= size; i++) {
                        if (!pat.every((v, k) => get(i + k) === v)) continue;
                        const before = [1, 2, 3, 4].every(d => i - d < 0 || !get(i - d));
                        const after = [0, 1, 2, 3].every(d => i + 7 + d >= size || !get(i + 7 + d));
                        const needB = i - 4 >= 0, needA = i + 11 <= size;
                        if ((needB && before) || (needA && after)) sc += 40;
                    }
                    return sc;
                };
                for (let y = 0; y < size; y++) { p += line(i => mod[y][i]); p += finderLike(i => mod[y][i]); }
                for (let x = 0; x < size; x++) { p += line(i => mod[i][x]); p += finderLike(i => mod[i][x]); }
                for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
                    const c = mod[y][x];
                    if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
                }
                let dark = 0;
                mod.forEach(r => r.forEach(c => { if (c) dark++; }));
                p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
                return p;
            };

            let mask = forceMask;
            if (mask < 0) {
                let best = Infinity;
                for (let m = 0; m < 8; m++) {
                    applyMask(m); formatBits(m);
                    const p = penalty();
                    if (p < best) { mask = m; best = p; }
                    applyMask(m); // 還原
                }
            }
            formatBits(mask);
            applyMask(mask);
            return { version: ver, size, modules: mod, capacityBytes: Math.floor((numDataCodewords(ver, e) * 8 - 4 - ccBits) / 8) };
        }

        // Code 128：每個符號 6 個寬度（條、空交錯，總寬 11 模組）；最後的停止符 7 個寬度（13 模組）。索引 = 符號值 0..106
        const C128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232', '2331112'];
        const START_B = 104, START_C = 105, STOP = 106;

        // 選字元集：全是數字且長度為偶數 → C（兩位數一組，條碼最短）；否則 B（ASCII 32–126）
        function code128Set(text) { return /^\d+$/.test(text) && text.length % 2 === 0 ? 'C' : 'B'; }

        // 回傳符號值陣列（含起始、資料、檢查碼、停止）
        function code128Values(text, set = code128Set(text)) {
            if (!text) throw new Error('請輸入要編成條碼的內容');
            const data = [];
            if (set === 'C') {
                if (!/^\d+$/.test(text) || text.length % 2) throw new Error('Code C 只能放偶數個數字');
                for (let i = 0; i < text.length; i += 2) data.push(+text.slice(i, i + 2));
            } else {
                for (const ch of text) {
                    const c = ch.charCodeAt(0);
                    if (ch.length !== 1 || c < 32 || c > 126) throw new Error(`Code 128 只支援英文、數字與半形符號，不能放「${ch}」`);
                    data.push(c - 32);
                }
            }
            const start = set === 'C' ? START_C : START_B;
            const sum = data.reduce((a, v, i) => a + v * (i + 1), start) % 103;
            return [start, ...data, sum, STOP];
        }

        // 符號值 → 由 '1'（條）與 '0'（空）組成的模組字串
        const code128Modules = (text, set) => code128Values(text, set).map(v => [...C128[v]].map((w, i) => (i % 2 ? '0' : '1').repeat(+w)).join('')).join('');

        // EAN-13：左 6 位用 L / G 編碼（由第一碼決定排列），右 6 位用 R 編碼
        const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
        const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'];
        const EAN_R = EAN_L.map(c => [...c].map(b => (b === '1' ? '0' : '1')).join(''));
        const EAN_PARITY = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];

        // 前 12 碼的檢查碼：奇數位 ×1、偶數位 ×3（從左數第 1 碼起）
        const ean13Check = (d12) => (10 - ([...d12].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0) % 10)) % 10;

        // 12 碼 → 補上檢查碼；13 碼 → 驗證檢查碼。回傳 13 碼字串
        function ean13Normalize(text) {
            const t = String(text).replace(/[\s-]/g, '');
            if (!/^\d+$/.test(t) || (t.length !== 12 && t.length !== 13)) throw new Error('EAN-13 需要 12 或 13 位數字');
            const full = t.length === 12 ? t + ean13Check(t) : t;
            if (+full[12] !== ean13Check(full.slice(0, 12))) throw new Error(`檢查碼不正確（第 13 碼應為 ${ean13Check(full.slice(0, 12))}）`);
            return full;
        }

        function ean13Modules(text) {
            const d = ean13Normalize(text), par = EAN_PARITY[+d[0]];
            const left = [...d.slice(1, 7)].map((c, i) => (par[i] === 'L' ? EAN_L : EAN_G)[+c]).join(''), right = [...d.slice(7)].map(c => EAN_R[+c]).join('');
            return '101' + left + '01010' + right + '101';
        }

        // --- /pure ---

        const $ = (s) => document.querySelector(s);

        function render() {
            const text = $('#text').value;
            $('#stage').hidden = !text;
            if (!text) { $('#info').textContent = ''; return; }
            try {
                const qr = encode(text, $('#ecc').value);
                const scale = +$('#scale').value, border = 4, px = (qr.size + border * 2) * scale;
                const cv = $('#qr');
                cv.width = cv.height = px;
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
                ctx.fillStyle = '#000';
                qr.modules.forEach((row, y) => row.forEach((on, x) => { if (on) ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale); }));
                $('#info').textContent = `版本 ${qr.version}（${qr.size}×${qr.size}）・ 這個版本最多可放 ${qr.capacityBytes} 位元組（中文每字約 3 位元組）`;
                $('#stage').hidden = false;
            } catch (e) {
                $('#info').textContent = e.message;
                $('#stage').hidden = true;
            }
        }

        // ---------- 條碼 ----------
        function renderBar() {
            const text = $('#bin').value, type = $('#btype').value;
            $('#bstage').hidden = !text;
            if (!text) { $('#binfo').textContent = ''; return; }
            try {
                const modules = type === 'ean13' ? ean13Modules(text) : code128Modules(text);
                const shown = type === 'ean13' ? ean13Normalize(text) : text;
                const unit = +$('#bscale').value * 2, quiet = 10, h = 110, textH = $('#btext').checked ? 26 : 0, w = (modules.length + quiet * 2) * unit;
                const cv = $('#bc'); cv.width = w; cv.height = h + textH + 20;
                const g = cv.getContext('2d');
                g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
                [...modules].forEach((m, i) => { if (m === '1') g.fillRect((quiet + i) * unit, 10, unit, h); });
                if (textH) {
                    g.font = `${Math.max(14, unit * 5)}px ui-monospace, Menlo, Consolas, monospace`; g.textAlign = 'center'; g.textBaseline = 'top';
                    g.fillText(type === 'ean13' ? `${shown[0]}  ${shown.slice(1, 7)}  ${shown.slice(7)}` : shown, w / 2, h + 16, w - 8);
                }
                $('#binfo').textContent = type === 'ean13' ? `EAN-13：${shown}（檢查碼 ${shown[12]}）` : `Code 128 ${code128Set(text)}：${modules.length / 11 | 0} 個符號`;
            } catch (e) { $('#binfo').textContent = e.message; $('#bstage').hidden = true; }
        }
        ['bin', 'btype', 'bscale', 'btext'].forEach(id => { $('#' + id).oninput = $('#' + id).onchange = renderBar; });
        $('#bsave').onclick = () => $('#bc').toBlob((blob) => Util.download(blob, 'barcode.png'));
        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#qrPane').hidden = b.dataset.t !== 'qr'; $('#barPane').hidden = b.dataset.t !== 'bar'; }; });

        $('#text').oninput = render;
        $('#ecc').onchange = render;
        $('#scale').onchange = render;
        $('#save').onclick = () => {
            $('#qr').toBlob((blob) => Util.download(blob, 'qrcode.png'));
        };
        render();
    </script>
</body>

</html>
