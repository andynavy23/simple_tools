    <template id="help">
        <h3>這是什麼</h3>
        <p>兩個規劃工具放在一頁：「看板」用欄位與卡片管理事情的進度；「時間區塊」把一天排成一塊塊的色塊，看得出哪裡還有空檔。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>專案、讀書、家事想分成「待辦 / 進行中 / 完成」追蹤。</li>
        <li>想先把明天的 6:00–24:00 排好，或套用「工作日」「週末」範本。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>看板：選看板（最多 10 個），欄位可新增、改名、左右移動、刪除（最多 8 欄）；「＋卡片」填標題、備註、標籤色、到期日。手機用卡片上的「← →」換欄、「↑ ↓」調順序，桌面也可直接拖曳卡片。上方色點可依標籤色篩選，可複製或下載 Markdown（每欄一節的 checkbox 清單，最後一欄視為完成）。</li>
        <li>時間區塊：選日期與顯示範圍（起訖小時、每格 15 / 30 / 60 分鐘）。手機先點一格當開始、再點一格當結束，上方表單會帶入時間，填標題與類別後按「新增區塊」；也可直接用表單選起訖。點既有色塊可編輯、刪除、或用「提前 / 延後」微調；桌面可拖曳色塊移動、拖下緣調整長度。</li>
        <li>範本：把今天的排法「另存為範本」，換日期後「套用到此日」。匯出：複製文字，或下載 .ics（時間以台灣 UTC+8 計）。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">看板「讀書」：待辦 → 進行中 → 完成，卡片「統計學第三章」到期日過了還在前兩欄就會標「逾期」。時間區塊：09:00–12:00 工作、12:00–13:00 休息，下方會算出各類別總時數與空檔。</div>
        <h3>小提醒</h3>
        <ul>
        <li>看板上限：10 個看板、每個 8 欄、300 張卡片、備註 1000 字；滿了會拒絕新增並提示。刪除欄位時，可選擇把卡片移到第一欄，或連同卡片一併刪除；最後一欄不能刪。刪除看板、清除全部都會先確認，無法復原。</li>
        <li>時間區塊上限：每天 60 個、範本 20 個；區塊不得重疊，重疊會提示並拒絕。依日期各存一份（鍵 planb_blocks_日期），只保留最近 90 天，更早的日期每次開啟頁面時自動清掉；可選日期為 90 天前到一年後。</li>
        <li>資料只存在這台裝置；壞掉的資料載入時會被略過或補預設值。底部「資料管理」可分別清除看板、範本、全部時間區塊。ICS 匯出為簡版（標題轉義、時間轉成 UTC），僅供參考。</li>
        </ul>

    <script>
        const { day, esc } = Util;
        // --- pure ---
        const MAX_BOARDS = 10, MAX_COLS = 8, MAX_CARDS = 300, MAX_NOTE = 1000, MAX_TITLE = 80;
        const MAX_DAY_BLOCKS = 60, MAX_TPL = 20, KEEP_DAYS = 90, NCOLOR = 6;
        const DEFAULT_COLS = ['待辦', '進行中', '完成'];
        const COL_N = ['紅', '橘', '綠', '藍', '紫', '灰'], CAT_N = ['工作', '學習', '運動', '休息', '生活', '其他'];
        const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
        const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + 'T00:00:00Z')) && new Date(s + 'T00:00:00Z').toISOString().slice(0, 10) === s;
        const colorIdx = (v) => Number.isInteger(v) && v >= 0 && v < NCOLOR ? v : -1;

        function newBoard(name) { return { id: uid(), name: str(name, 20).trim() || '看板', cols: DEFAULT_COLS.map(n => ({ id: uid(), name: n })), cards: [] }; }

        // 載入驗證：補預設、去重 id、截斷到上限、壞卡片丟掉
        function cleanBoards(raw) {
            const r = raw && typeof raw === 'object' ? raw : {}, seen = new Set(), out = [];
            const fresh = (id, set) => { if (typeof id !== 'string' || !id || id.length > 40 || set.has(id)) id = uid(); set.add(id); return id; };
            for (const b of Array.isArray(r.boards) ? r.boards : []) {
                if (!b || typeof b !== 'object' || out.length >= MAX_BOARDS) continue;
                const cols = [], cs = new Set(), cards = [], ks = new Set();
                for (const c of Array.isArray(b.cols) ? b.cols : []) {
                    if (!c || typeof c !== 'object' || cols.length >= MAX_COLS) continue;
                    cols.push({ id: fresh(c.id, cs), name: str(c.name, 20).trim() || '欄位' });
                }
                if (!cols.length) for (const n of DEFAULT_COLS) cols.push({ id: fresh(null, cs), name: n });
                for (const k of Array.isArray(b.cards) ? b.cards : []) {
                    if (!k || typeof k !== 'object' || cards.length >= MAX_CARDS) continue;
                    const title = str(k.title, MAX_TITLE).trim(); if (!title) continue;
                    cards.push({ id: fresh(k.id, ks), col: cs.has(k.col) ? k.col : cols[0].id, title, note: str(k.note, MAX_NOTE), color: colorIdx(k.color), due: isDate(k.due) ? k.due : '' });
                }
                out.push({ id: fresh(b.id, seen), name: str(b.name, 20).trim() || '看板', cols, cards });
            }
            return { boards: out, cur: out.some(b => b.id === r.cur) ? r.cur : (out[0] ? out[0].id : '') };
        }

        // 移動卡片到某欄、插在 beforeId 之前（沒給就放該欄最後）；欄內順序 = 陣列順序
        function moveTo(cards, id, colId, beforeId) {
            const k = cards.find(c => c.id === id);
            if (!k || id === beforeId) return cards;
            const rest = cards.filter(c => c.id !== id);
            let i = beforeId ? rest.findIndex(c => c.id === beforeId) : -1;
            if (i < 0) i = rest.length;
            rest.splice(i, 0, { ...k, col: colId });
            return rest;
        }
        // 欄內上下調整（dir = -1 / 1），與同欄的相鄰卡片交換
        function shiftCard(cards, id, dir) {
            const i = cards.findIndex(c => c.id === id); if (i < 0) return cards;
            let j = i + dir;
            while (j >= 0 && j < cards.length && cards[j].col !== cards[i].col) j += dir;
            if (j < 0 || j >= cards.length) return cards;
            const a = cards.slice(); [a[i], a[j]] = [a[j], a[i]]; return a;
        }
        // 換到左 / 右一欄（放在該欄最後）
        function stepCol(cols, cards, id, dir) {
            const k = cards.find(c => c.id === id); if (!k) return cards;
            const ni = cols.findIndex(c => c.id === k.col) + dir;
            return ni < 0 || ni >= cols.length ? cards : moveTo(cards, id, cols[ni].id, null);
        }
        function moveColumn(cols, id, dir) {
            const i = cols.findIndex(c => c.id === id), j = i + dir;
            if (i < 0 || j < 0 || j >= cols.length) return cols;
            const a = cols.slice(); [a[i], a[j]] = [a[j], a[i]]; return a;
        }
        // 刪欄：mode 'move' 卡片移到剩下的第一欄，'drop' 連卡片一併刪除；最後一欄不能刪
        function removeCol(b, id, mode) {
            if (b.cols.length < 2 || !b.cols.some(c => c.id === id)) return b;
            const cols = b.cols.filter(c => c.id !== id), to = cols[0].id;
            const cards = mode === 'drop' ? b.cards.filter(c => c.col !== id) : b.cards.map(c => c.col === id ? { ...c, col: to } : c);
            return { ...b, cols, cards };
        }
        const isOverdue = (k, lastColId, today) => !!k.due && k.due < today && k.col !== lastColId;
        function kanbanMd(b) {
            const md = ['# ' + b.name];
            b.cols.forEach((c, i) => {
                md.push('', '## ' + c.name);
                for (const k of b.cards.filter(k => k.col === c.id)) {
                    md.push(`- [${i === b.cols.length - 1 ? 'x' : ' '}] ${k.title}${k.due ? ` (到期 ${k.due})` : ''}${k.color >= 0 ? ` [${COL_N[k.color]}]` : ''}`);
                    if (k.note) md.push(...k.note.split('\n').map(l => '  ' + l));
                }
            });
            return md.join('\n') + '\n';
        }

        // ---- 時間區塊 ----
        const toMin = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s)); if (!m) return NaN; const h = +m[1], mi = +m[2]; return h > 24 || mi > 59 || (h === 24 && mi > 0) ? NaN : h * 60 + mi; };
        const toHM = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        const fmtDur = (m) => m >= 60 ? `${Math.floor(m / 60)} 小時${m % 60 ? ' ' + (m % 60) + ' 分' : ''}` : `${m} 分`;
        const cellRange = (start, step, a, b, max = 1440) => ({ s: start + Math.min(a, b) * step, e: Math.min(max, start + (Math.max(a, b) + 1) * step) });
        const validBlock = (b) => !!b && typeof b === 'object' && typeof b.id === 'string' && !!b.id && Number.isInteger(b.s) && Number.isInteger(b.e)
            && b.s % 5 === 0 && b.e % 5 === 0 && b.s >= 0 && b.e <= 1440 && b.s < b.e && Number.isInteger(b.c) && b.c >= 0 && b.c < NCOLOR && typeof b.t === 'string';
        const overlapWith = (blocks, s, e, skipId) => blocks.find(b => b.id !== skipId && b.s < e && s < b.e) || null;
        // 新增或更新（同 id）；回 { blocks } 或 { err }
        function putBlock(blocks, nb) {
            if (!validBlock(nb)) return { err: '時間不正確（5 分鐘的倍數、結束要晚於開始）' };
            const exists = blocks.some(b => b.id === nb.id);
            if (!exists && blocks.length >= MAX_DAY_BLOCKS) return { err: `每天最多 ${MAX_DAY_BLOCKS} 個區塊` };
            const x = overlapWith(blocks, nb.s, nb.e, nb.id);
            if (x) return { err: `與「${x.t || '未命名'}」(${toHM(x.s)}–${toHM(x.e)}) 重疊` };
            return { blocks: (exists ? blocks.map(b => b.id === nb.id ? nb : b) : [...blocks, nb]).sort((a, b) => a.s - b.s) };
        }
        // 載入驗證：壞區塊丟掉、重疊的後者丟掉、截斷到上限
        function cleanDay(raw) {
            let blocks = [];
            for (const b of Array.isArray(raw && raw.blocks) ? raw.blocks : []) {
                if (blocks.length >= MAX_DAY_BLOCKS || !b) continue;
                const nb = { id: b.id, s: b.s, e: b.e, t: str(b.t, 40), c: b.c };
                const r = putBlock(blocks, nb); if (r.blocks) blocks = r.blocks;
            }
            return blocks;
        }
        function freeGaps(blocks, start, end) {
            const gaps = []; let cur = start;
            for (const b of blocks.slice().sort((a, b) => a.s - b.s)) {
                if (b.e <= cur) continue;
                if (b.s >= end) break;
                if (b.s > cur) gaps.push([cur, b.s]);
                cur = Math.max(cur, b.e);
            }
            if (cur < end) gaps.push([cur, end]);
            return gaps;
        }
        function catTotals(blocks) { const t = Array(NCOLOR).fill(0); for (const b of blocks) t[b.c] += b.e - b.s; return t; }
        // 拖曳：mv 整塊移動（長度不變、不出界）、rs 調整結束時間（至少 5 分鐘）
        function dragBlock(b, mode, dm) {
            if (mode === 'rs') return { s: b.s, e: Math.max(b.s + 5, Math.min(1440, b.e + dm)) };
            const dur = b.e - b.s, s = Math.max(0, Math.min(1440 - dur, b.s + dm));
            return { s, e: s + dur };
        }
        const cleanCfg = (c) => {

            const n = prompt('範本名稱（20 字內，例如 工作日）'); if (n === null || !n.trim()) return;
            const name = n.trim().slice(0, 20), old = T.list.find(t => t.name === name);
            if (old) { if (!confirm(`已有範本「${name}」，要覆蓋嗎？`)) return; old.blocks = cloneBlocks(blocks); }
            else { if (T.list.length >= MAX_TPL) return say(`範本最多 ${MAX_TPL} 個，請先刪除`); T.list.push({ id: uid(), name, blocks: cloneBlocks(blocks) }); }
            saveT(); say('範本已儲存', true); renderT();
        };
        $('tplApply').onclick = () => {
            const t = T.list.find(x => x.id === $('tpl').value); if (!t) return;
            if (blocks.length && !confirm(`${date} 已有 ${blocks.length} 個區塊，套用「${t.name}」會取代它們，無法復原。繼續？`)) return;
            blocks = cloneBlocks(t.blocks); selId = null; saveDay(); say('已套用', true); renderT();
        };
        $('tplDel').onclick = () => {
            const t = T.list.find(x => x.id === $('tpl').value); if (!t) return;
            if (!confirm(`刪除範本「${t.name}」？無法復原。`)) return;
            T.list = T.list.filter(x => x.id !== t.id); saveT(); renderT();
        };
        $('txCopy').onclick = (e) => Util.copyWithFeedback(e.target, dayText(date, blocks, T.cfg.start, T.cfg.end));
        $('icsDl').onclick = () => { if (!blocks.length) return say('這天沒有區塊可匯出'); Util.download(new Blob([buildIcs(date, blocks, Date.now())], { type: 'text/calendar' }), `plan-${date}.ics`); };

        // 資料管理
        $('clrB').onclick = () => {
            if (!confirm('清除所有看板與卡片？無法復原。')) return;
            try { localStorage.removeItem(KEY_B); } catch (e) { }
            const nb = newBoard('看板 1'); B = { boards: [nb], cur: nb.id }; fil = -1; renderK();
        };
        $('clrT').onclick = () => {
            if (!confirm('清除所有範本與顯示範圍設定？無法復原。')) return;
            try { localStorage.removeItem(KEY_T); } catch (e) { }
            T = cleanTpl(null); syncCfg(); renderT();
        };
        $('clrD').onclick = () => {
            if (!confirm('清除所有日期的時間區塊？無法復原。')) return;
            const keys = []; try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch (e) { }
            for (const k of keys) if (k.startsWith(KEY_D)) try { localStorage.removeItem(k); } catch (e) { }
            blocks = []; selId = null; renderT();
        };

        pruneOld(); syncCfg(); loadDay(); fillForm(T.cfg.start, T.cfg.start + T.cfg.step, '', 5); renderK(); renderT();
    </script>
</body>

</html>
