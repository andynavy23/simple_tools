    <template id="help">
        <h3>這是什麼</h3>
        <p>進位轉換、位元運算與浮點數 IEEE 754 檢視三合一。用 BigInt 計算，大數也不會失準，負數用二補數表示。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>寫程式時需要在 2 / 8 / 10 / 16 進位之間轉換</li>
        <li>檢查旗標、遮罩（AND / OR / XOR / 位移）的結果</li>
        <li>想知道為什麼 0.1 在電腦裡不精確，看實際存的位元</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「進位轉換」：輸入數值、選它的進位，下方列出各進位結果；點任一結果就複製</li>
        <li>「位元運算」：填 A、B，選輸入進位、位元寬度（8 / 16 / 32 / 64）與運算，看二進位、16 進位、無號與有號結果；NOT 只用 A</li>
        <li>「浮點數 IEEE 754」：輸入十進位小數，看 float32 與 float64 的符號（紅）、指數（綠）、尾數（藍）</li>
        </ol>
        <h3>浮點數視覺化怎麼用</h3>
        <ol>
        <li>在「浮點數視覺化」輸入十進位數（0.1、-0、1e-320、NaN、Infinity），或 0x 開頭的位元樣式：8 位 16 進位視為單精度、9 到 16 位視為雙精度（不足左補 0）。也可點下方快捷鈕。</li>
        <li>單精度（float32）與雙精度（float64）各有一排位元：紅是符號、綠是指數、藍是尾數，實心 = 1。<b>點任一位元就翻轉</b>，輸入框會改成翻轉後的 16 進位樣式，數值同步更新。</li>
        <li>每種精度會列出分類（正規 / 次正規 / 零 / 無限大 / NaN）、指數與偏移、16 進位、實際儲存的精確十進位值，以及與你輸入的誤差。</li>
        <li>最下方「為什麼 0.1 + 0.2 ≠ 0.3」可改 x、y、z：看兩數實際儲存的值、精確的和、捨入成 float64 之後的值，以及它和 z 差多少。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">進位轉換輸入 <b>255</b>（10 進位）：2 進位 11111111、8 進位 377、16 進位 ff、36 進位 73。<br>位元運算（16 進位、32 位元）A=F0、B=3C：AND 得 0x00000030，XOR 得 0x000000CC。<br>浮點數輸入 <b>0.1</b>：float64 的 16 進位是 0x3fb999999999999a，float32 是 0x3dcccccd。<br>浮點數視覺化輸入 <b>0.1</b>：float64 實際儲存 0.1000000000000000055511151231257827021181583404541015625，誤差 +5.55e-18；0.1 + 0.2 的精確和是 0.3000000000000000166533453693773481063544750213623046875，捨入後得 0.30000000000000004，與 0.3 的儲存值 0.299999999999999988897769753748434595763683319091796875 不同。</div>
        <h3>小提醒</h3>
        <ul>
        <li>可輸入 0b、0o、0x 前綴與底線分隔（例如 1111_0000）</li>
        <li>位移量超過位元寬度時結果為 0（算術右移則保留符號）</li>
        <li>浮點數可輸入 NaN、Infinity、1e-3 這類寫法</li>
        <li>視覺化的「精確十進位值」用 BigInt 逐位展開，不是四捨五入；極小的次正規數會有幾百位，過長時只顯示前段。</li>
        <li>單精度的值是先轉成 JavaScript 的 double 再捨入成 float32（跟 Math.fround 一樣），極少數情況和「直接從十進位文字捨入」的結果差 1 個單位。</li>
        <li>NaN 有很多種位元樣式（尾數可帶資訊），輸入文字 NaN 會得到標準樣式 0x7ff8…；想看其他樣式請用位元翻轉。</li>
        <li>視覺化只在頁面內計算；「進位 / 位元運算」分頁的記憶（base_tab）會記住你最後停在哪個分頁。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { statRow, store, copyWithFeedback } = Util;

        // --- pure ---
        const DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';
        const PREFIX = { 2: '0b', 8: '0o', 16: '0x' };

        // 字串 → BigInt；允許正負號、0b / 0o / 0x 前綴與 _ 分隔；不合法回傳 null
        function parseBig(str, base) {
            let s = String(str).trim().toLowerCase().replace(/[_\s]/g, ''), neg = false;
            if (s[0] === '-' || s[0] === '+') { neg = s[0] === '-'; s = s.slice(1); }
            if (PREFIX[base] && s.startsWith(PREFIX[base])) s = s.slice(2);
            if (!s || s.length > 400) return null;
            let v = 0n; const b = BigInt(base);
            for (const c of s) { const d = DIGITS.indexOf(c); if (d < 0 || d >= base) return null; v = v * b + BigInt(d); }
            return neg ? -v : v;
        }

        // w 位元的二補數：BigInt → 無號 / 有號
        const toUnsigned = (v, w) => ((v % (1n << BigInt(w))) + (1n << BigInt(w))) % (1n << BigInt(w));
        const toSigned = (u, w) => (u >= (1n << BigInt(w - 1)) ? u - (1n << BigInt(w)) : u);
        const group4 = (bits) => bits.replace(/(.{4})(?=.)/g, '$1 ');

        const OPS = { AND: 'A AND B', OR: 'A OR B', XOR: 'A XOR B', NAND: 'NOT (A AND B)', NOT: 'NOT A', SHL: 'A << B', SHR: 'A >> B（邏輯）', SAR: 'A >> B（算術）' };
        // 結果以 w 位元無號數回傳；位移量 b 取其無號值，超過 w 時結果為 0（SAR 為符號擴展）
        function bitOp(a, b, op, w) {
            const W = BigInt(w), M = (1n << W) - 1n, ua = toUnsigned(a, w), ub = toUnsigned(b, w), n = ub > W ? W : ub;
            switch (op) {
                case 'AND': return ua & ub;
                case 'OR': return ua | ub;
                case 'XOR': return ua ^ ub;
                case 'NAND': return ~(ua & ub) & M;
                case 'NOT': return ~ua & M;
                case 'SHL': return (ua << n) & M;
                case 'SHR': return ua >> n;
                case 'SAR': return toUnsigned(toSigned(ua, w) >> n, w);
                default: throw new Error('未知運算');
            }
        }

        // IEEE 754：回傳 { bits, sign, exp, mant, hex, back }（back 是存成該精度後實際的數值）
        function floatParts(x, kind) {
            const dv = new DataView(new ArrayBuffer(8)), is32 = kind === 32, n = is32 ? 32 : 64, eb = is32 ? 8 : 11;
            if (is32) dv.setFloat32(0, x); else dv.setFloat64(0, x);
            const u = is32 ? BigInt(dv.getUint32(0)) : dv.getBigUint64(0), bits = u.toString(2).padStart(n, '0');
            return { bits, sign: bits.slice(0, 1), exp: bits.slice(1, 1 + eb), mant: bits.slice(1 + eb), hex: '0x' + u.toString(16).padStart(n / 4, '0'), back: is32 ? dv.getFloat32(0) : dv.getFloat64(0) };
        }

        // 十進位文字 → 數值（接受 NaN / Infinity / 科學記號）；失敗回傳 null
        function parseFloatText(s) {
            const t = String(s).trim();
            if (/^[+-]?(nan)$/i.test(t)) return NaN;
            if (/^[+-]?inf(inity)?$/i.test(t)) return t[0] === '-' ? -Infinity : Infinity;
            return /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t) ? Number(t) : null;
        }

        // ---- 浮點數視覺化：位元拆解、精確十進位展開、翻轉位元 ----
        const FP = { 32: { n: 32, eb: 8, mb: 23, bias: 127 }, 64: { n: 64, eb: 11, mb: 52, bias: 1023 } };
        // 位元字串 → 數值（和 DataView 一致）
        function fpValue(bits, kind) {
            const dv = new DataView(new ArrayBuffer(8)), u = BigInt('0b' + bits);
            if (kind === 32) { dv.setUint32(0, Number(u)); return dv.getFloat32(0); }
            dv.setBigUint64(0, u); return dv.getFloat64(0);
        }
        // 位元拆解：{ sign, expBits, mantBits, e（指數欄的值）, bias, unbiased（真實指數；零 / 無限大 / NaN 為 null）, cls: normal|subnormal|zero|inf|nan, hex, value }
        function fpDecode(bits, kind) {
            const f = FP[kind];
            if (!f || !/^[01]+$/.test(bits) || bits.length !== f.n) throw new Error('位元數不正確');
            const sign = +bits[0], expBits = bits.slice(1, 1 + f.eb), mantBits = bits.slice(1 + f.eb), e = parseInt(expBits, 2), mz = !mantBits.includes('1');
            const cls = e === 0 ? (mz ? 'zero' : 'subnormal') : e === (1 << f.eb) - 1 ? (mz ? 'inf' : 'nan') : 'normal';
            return { kind, sign, expBits, mantBits, e, bias: f.bias, unbiased: cls === 'normal' ? e - f.bias : cls === 'subnormal' ? 1 - f.bias : null, cls, hex: '0x' + BigInt('0b' + bits).toString(16).padStart(f.n / 4, '0'), value: fpValue(bits, kind) };
        }
        const flipBit = (bits, i) => { if (!Number.isInteger(i) || i < 0 || i >= bits.length) throw new Error('位元位置不正確'); return bits.slice(0, i) + (bits[i] === '0' ? '1' : '0') + bits.slice(i + 1); };

        // 精確有理數 { n: 帶號 BigInt, k }：值 = n / 10^k。二進位浮點數的小數展開一定有限，所以可以精確表示
        function ratOfBits(bits, kind) {
            const d = fpDecode(bits, kind), f = FP[kind];
            if (d.cls === 'inf' || d.cls === 'nan') return null;
            const mant = BigInt('0b' + (d.mantBits || '0')), m = d.cls === 'normal' ? (1n << BigInt(f.mb)) | mant : mant, q = (d.cls === 'normal' ? d.e : 1) - f.bias - f.mb;
            const mag = q >= 0 ? { n: m << BigInt(q), k: 0 } : { n: m * 5n ** BigInt(-q), k: -q };
            return d.sign ? { n: -mag.n, k: mag.k } : mag;
        }
        // 十進位文字（可含 e 記號，指數限 ±5000）→ 有理數；不合法回傳 null
        function ratOfDec(text) {
            const m = /^([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?$/i.exec(String(text).trim());
            if (!m || !(m[2] + m[3])) return null;
            const ex = m[4] ? parseInt(m[4], 10) : 0; if (Math.abs(ex) > 5000) return null;
            let n = BigInt(m[2] + m[3]), k = m[3].length - ex; if (k < 0) { n *= 10n ** BigInt(-k); k = 0; }
            return { n: m[1] === '-' ? -n : n, k };
        }
        const ratAdd = (a, b) => { const k = Math.max(a.k, b.k); return { n: a.n * 10n ** BigInt(k - a.k) + b.n * 10n ** BigInt(k - b.k), k }; };
        const ratSub = (a, b) => ratAdd(a, { n: -b.n, k: b.k });
        function ratStr({ n, k }) {
            let s = (n < 0n ? -n : n).toString();
            if (k > 0) { s = s.padStart(k + 1, '0'); s = s.slice(0, -k) + '.' + s.slice(-k); s = s.replace(/0+$/, '').replace(/\.$/, ''); }
            return (n < 0n && s !== '0' ? '-' : '') + s;
        }
        // 位元樣式實際儲存的精確十進位值（NaN / Infinity / -0 用文字）
        function fpExact(bits, kind) {
            const d = fpDecode(bits, kind);
            if (d.cls === 'nan') return 'NaN';
            if (d.cls === 'inf') return d.sign ? '-Infinity' : 'Infinity';
            if (d.cls === 'zero') return d.sign ? '-0' : '0';
            return ratStr(ratOfBits(bits, kind));
        }
        // 儲存值與輸入十進位文字的誤差（儲存值 − 輸入，精確）；輸入不是十進位數或儲存成 NaN / Infinity 回傳 null
        function fpError(text, bits, kind) {
            const a = ratOfBits(bits, kind), b = ratOfDec(text);
            return a && b ? ratStr(ratSub(a, b)) : null;
        }
        // 輸入：十進位數（NaN / Infinity / -0 / 1e-3）或 0x 開頭的位元樣式（≤ 8 位 16 進位 = 單精度，9–16 位 = 雙精度，左補 0）。回傳 { x, kind（位元樣式才有）, bits }；不合法回傳 null
        function fpParse(text) {
            const t = String(text).trim(), m = /^0x([0-9a-f]{1,16})$/i.exec(t);
            if (m) { const kind = m[1].length <= 8 ? 32 : 64, bits = BigInt('0x' + m[1]).toString(2).padStart(kind, '0'); return { kind, bits, x: fpValue(bits, kind) }; }
            const x = parseFloatText(t); return x === null ? null : { kind: null, bits: null, x };
        }
        // 單精度與雙精度的位元字串；位元樣式輸入以它自己的精度為準，另一個精度由數值轉換而來
        function fpBoth(p) {
            const b32 = p.kind === 32 ? p.bits : floatParts(p.x, 32).bits, b64 = p.kind === 64 ? p.bits : floatParts(p.x, 64).bits;
            return { 32: b32, 64: b64 };
        }
        // 為什麼 0.1 + 0.2 ≠ 0.3：用 float64 的儲存值算出精確和，再看捨入成 float64 後的結果與 z 的儲存值
        function fpDemo(x, y, z) {
            const bx = floatParts(x, 64).bits, by = floatParts(y, 64).bits, bz = floatParts(z, 64).bits, sum = x + y, bs = floatParts(sum, 64).bits;
            if (![bx, by, bz, bs].every(b => ratOfBits(b, 64))) return null;
            const exact = ratAdd(ratOfBits(bx, 64), ratOfBits(by, 64));
            return { x: fpExact(bx, 64), y: fpExact(by, 64), exactSum: ratStr(exact), sum: fpExact(bs, 64), sumShort: String(sum), z: fpExact(bz, 64), equal: sum === z, roundErr: ratStr(ratSub(ratOfBits(bs, 64), exact)), gap: ratStr(ratSub(ratOfBits(bs, 64), ratOfBits(bz, 64))), hexSum: floatParts(sum, 64).hex, hexZ: floatParts(z, 64).hex };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const BASES = [[2, '2 進位'], [8, '8 進位'], [10, '10 進位'], [16, '16 進位'], [36, '36 進位']];
        for (const sel of ['#cbase', '#bbase']) $(sel).replaceChildren(...BASES.map(([b, n]) => new Option(n, b)));
        $('#cbase').value = 10; $('#bbase').value = 16;
        $('#bop').replaceChildren(...Object.entries(OPS).map(([k, v]) => new Option(v, k)));
        let tab = 'conv';

        const copyRow = (label, text) => {
            const row = statRow(label, ''), v = row.lastChild, b = document.createElement('button');
            b.className = 'sm'; b.textContent = text; b.classList.add('mono'); b.title = '點擊複製'; b.onclick = () => copyWithFeedback(b, text);
            v.replaceChildren(b); return row;
        };

        function renderConv() {
            const base = +$('#cbase').value, v = parseBig($('#cin').value, base);
            $('#cerr').textContent = v === null ? '輸入含有這個進位不允許的字元' : '';
            if (v === null) return $('#cout').replaceChildren();
            const rows = [2, 8, 10, 16, 36].map(b => copyRow(`${b} 進位`, (v < 0n ? '-' : '') + (v < 0n ? -v : v).toString(b)));
            for (const w of [8, 16, 32, 64]) {
                if (v >= -(1n << BigInt(w - 1)) && v < (1n << BigInt(w))) { rows.push(copyRow(`${w} 位元二補數`, group4(toUnsigned(v, w).toString(2).padStart(w, '0')))); break; }
            }
            $('#cout').replaceChildren(...rows);
        }

        function renderBit() {
            const base = +$('#bbase').value, w = +$('#bw').value, op = $('#bop').value, a = parseBig($('#ba').value, base), b = parseBig($('#bb').value, base);
            const needB = !['NOT'].includes(op);
            $('#bb').disabled = !needB;
            $('#berr').textContent = a === null || (needB && b === null) ? '輸入含有這個進位不允許的字元' : '';
            if (a === null || (needB && b === null)) return $('#bout').replaceChildren();
            const r = bitOp(a, b ?? 0n, op, w);
            $('#bout').replaceChildren(
                copyRow('A（二進位）', group4(toUnsigned(a, w).toString(2).padStart(w, '0'))),
                ...(needB ? [copyRow('B（二進位）', group4(toUnsigned(b, w).toString(2).padStart(w, '0')))] : []),
                copyRow('結果（二進位）', group4(r.toString(2).padStart(w, '0'))),
                copyRow('結果（16 進位）', '0x' + r.toString(16).toUpperCase().padStart(w / 4, '0')),
                copyRow('結果（無號）', r.toString()), copyRow('結果（有號）', toSigned(r, w).toString()));
        }

        function renderFloat() {
            const x = parseFloatText($('#fin').value);
            $('#ferr').textContent = x === null ? '請輸入十進位數值，例如 0.1、-3.5e-2、Infinity' : '';
            if (x === null) return $('#fout').replaceChildren();
            const nodes = [];
            for (const kind of [32, 64]) {
                const p = floatParts(x, kind), h = document.createElement('div');
                h.innerHTML = `<h2>${kind === 32 ? 'float32（單精度）' : 'float64（雙精度，JavaScript 的 Number）'}</h2><div class="bits"><span class="s"></span> <span class="e"></span> <span class="m"></span></div>`;
                const [s, e, m] = h.querySelectorAll('.bits span'); s.textContent = p.sign; e.textContent = p.exp; m.textContent = p.mant;
                nodes.push(h, statRow('分段', `符號 1 位元（紅）・指數 ${p.exp.length} 位元（綠）・尾數 ${p.mant.length} 位元（藍）`), copyRow('16 進位', p.hex), statRow('存入後實際的值', p.back === x || (Number.isNaN(p.back) && Number.isNaN(x)) ? String(p.back) : p.back.toPrecision(kind === 32 ? 12 : 21)));
            }
            $('#fout').replaceChildren(...nodes);
        }

        // ---- 浮點數視覺化 UI ----
        const CLS = { normal: '正規數', subnormal: '次正規數', zero: '零', inf: '無限大', nan: 'NaN' };
        const CLS_NOTE = {
            normal: '正規數：值 = (−1)^符號 × 1.尾數 × 2^(指數 − 偏移)，前面隱含一個 1。',
            subnormal: '次正規數：指數欄全 0，沒有隱含的 1，值 = (−1)^符號 × 0.尾數 × 2^(1 − 偏移)。用來平滑地靠近 0，越小精度越低。',
            zero: '零：指數與尾數全 0，符號位元決定 +0 或 −0；兩者 === 相等，但 1 / −0 是 −Infinity。',
            inf: '無限大：指數欄全 1、尾數全 0。數值溢位或除以 0 會得到它。',
            nan: 'NaN：指數欄全 1、尾數不為 0（尾數可帶額外資訊）。NaN 不等於任何值，包括它自己。',
        };
        const brief = (s) => s.length > 90 ? s.slice(0, 80) + `…（共 ${s.replace(/[-.]/g, '').length} 位）` : s;
        const monoRow = (label, text) => statRow(label, text, 'mono');
        $('#vchips').replaceChildren(...['0.1', '0.5', '100', '-0', '1e-40', '1e-320', '1e39', 'NaN', 'Infinity'].map(t => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sm'; b.textContent = t; b.onclick = () => { $('#vin').value = t; render(); }; return b; }));

        function renderViz() {
            const text = $('#vin').value, p = fpParse(text), nodes = [];
            $('#verr').textContent = p ? '' : '請輸入十進位數（0.1、-0、1e-3、NaN、Infinity）或 0x 開頭的位元樣式（8 位 = 單精度、16 位 = 雙精度）';
            if (p) {
                const both = fpBoth(p);
                for (const kind of [32, 64]) {
                    const bits = both[kind], d = fpDecode(bits, kind), h = document.createElement('h2'), grid = document.createElement('div');
                    h.textContent = kind === 32 ? 'float32（單精度）' : 'float64（雙精度）'; grid.className = 'bitgrid';
                    [...bits].forEach((b, i) => {
                        const f = i === 0 ? 's' : i <= FP[kind].eb ? 'e' : 'm', btn = document.createElement('button');
                        btn.type = 'button'; btn.className = `bit ${f}${b === '1' ? ' on' : ''}`; btn.textContent = b;
                        btn.setAttribute('aria-label', `${{ s: '符號', e: '指數', m: '尾數' }[f]}位元 第 ${i + 1} 位，目前 ${b}，點擊翻轉`);
                        btn.onclick = () => { $('#vin').value = '0x' + BigInt('0b' + flipBit(bits, i)).toString(16).padStart(kind / 4, '0'); render(); };
                        grid.append(btn);
                    });
                    const note = document.createElement('div'); note.className = 'note'; note.textContent = CLS_NOTE[d.cls];
                    const err = p.kind === null ? fpError(text, bits, kind) : null;
                    nodes.push(h, statRow('分段', `符號 1（紅）・指數 ${d.expBits.length}（綠）・尾數 ${d.mantBits.length}（藍）`), grid,
                        statRow('分類', CLS[d.cls]), note, statRow('符號', d.sign ? '1（負）' : '0（正）'),
                        statRow('指數', `${d.expBits}₂ = ${d.e}` + (d.unbiased === null ? '' : `，真實指數 ${d.cls === 'subnormal' ? `1 − ${d.bias}` : `${d.e} − ${d.bias}`} = ${d.unbiased}`)),
                        copyRow('16 進位', d.hex), monoRow('JavaScript 顯示', String(d.value)), monoRow('實際儲存的精確值', brief(fpExact(bits, kind))),
                        ...(err === null ? [] : [monoRow('儲存值 − 輸入值', err === '0' ? '0（剛好能精確表示）' : (err[0] === '-' ? '' : '+') + brief(err))]));
                }
            }
            $('#vout').replaceChildren(...nodes);
            renderDemo();
        }
        function renderDemo() {
            const v = ['#dx', '#dy', '#dz'].map(id => parseFloatText($(id).value)), bad = v.some(x => x === null || !Number.isFinite(x)), r = bad ? null : fpDemo(...v);
            $('#derr').textContent = bad ? '請輸入有限的十進位數，例如 0.1' : r ? '' : 'x + y 超出 float64 範圍';
            if (!r) return $('#dout').replaceChildren();
            const note = document.createElement('div'); note.className = 'note';
            note.textContent = r.equal ? 'x + y 捨入後剛好等於 z 的儲存值，所以 === 為 true。' : `電腦先把 x、y 各自存成最接近的二進位小數（和原本的十進位數有微小誤差），相加的精確結果再捨入回 float64 能表示的值；結果與 z 的儲存值差 ${brief(r.gap)}，所以 x + y === z 是 false。`;
            $('#dout').replaceChildren(monoRow('x 實際儲存', brief(r.x)), monoRow('y 實際儲存', brief(r.y)), monoRow('x + y 精確的和', brief(r.exactSum)),
                monoRow('捨入成 float64', brief(r.sum)), monoRow('JavaScript 顯示', r.sumShort), copyRow('float64 16 進位', r.hexSum), monoRow('捨入造成的誤差', brief(r.roundErr)),
                monoRow('z 實際儲存', brief(r.z)), copyRow('z 的 16 進位', r.hexZ), statRow('x + y === z', r.equal ? 'true' : 'false'), note);
        }

        const render = () => {
            document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tab));
            document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== tab; });
            ({ conv: renderConv, bit: renderBit, float: renderFloat, fviz: renderViz })[tab]();
        };
        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { tab = b.dataset.t; store.set('base_tab', tab); render(); }; });
        document.querySelectorAll('input,select').forEach(e => { e.oninput = e.onchange = render; });
        const saved = store.get('base_tab', 'conv'); if (['conv', 'bit', 'float', 'fviz'].includes(saved)) tab = saved;
        render();
    </script>
</body>

</html>
