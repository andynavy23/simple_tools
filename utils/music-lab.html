    <div class="wrap">

        <h1>作曲與音響小工坊</h1>
        <p class="sub">和弦、旋律、ABC / MIDI / 簡譜播放，與音響常用計算。聲音與檔案都只在本機處理。</p>

        <div class="chips" id="tabs"></div>

        <!-- 和弦進行 -->
        <div class="card pane" data-t="chord">
            <h2>和弦進行產生</h2>
            <div class="grid2">
                <div><label class="f" for="cKey">調（主音）</label><select class="w" id="cKey"></select></div>

            </div>
            <label class="f" for="cStyle">風格</label><select class="w" id="cStyle"></select>
            <label class="f" for="cBpm">速度 BPM（每個和弦 4 拍）</label><input class="w" type="number" id="cBpm" value="90" min="40" max="220" inputmode="numeric">
            <div class="big" id="cOut"></div>
            <div class="muted" id="cRom"></div>
            <div class="chips"><button class="primary play" id="cPlay">▶ 播放</button></div>

        <!-- 隨機旋律 -->
        <div class="card pane" data-t="melody" hidden>
            <h2>隨機旋律</h2>
            <div class="grid2">
                <div><label class="f" for="mKey">調（主音）</label><select class="w" id="mKey"></select></div>
                <div><label class="f" for="mScale">調式</label><select class="w" id="mScale"></select></div>
                <div><label class="f" for="mRhythm">節奏型</label><select class="w" id="mRhythm"></select></div>
                <div><label class="f" for="mBars">小節數（1–16，每小節 4 拍）</label><input class="w" type="number" id="mBars" value="4" min="1" max="16" inputmode="numeric"></div>
            </div>
            <div class="grid2">
                <div><label class="f" for="mSeed">種子（相同種子產生相同旋律）</label><input class="w" type="text" id="mSeed" value="hello" maxlength="40"></div>
                <div><label class="f" for="mBpm">速度 BPM</label><input class="w" type="number" id="mBpm" value="100" min="40" max="220" inputmode="numeric"></div>
            </div>
            <div class="chips"><button id="mDice">🎲 換一個種子</button><button class="primary play" id="mPlay">▶ 播放</button></div>

        <!-- ABC -->

            <label class="f" for="abc">ABC 記譜（支援子集：X T M L Q K 標頭；音符 A–G a–g、升降 ^ _ =、八度 ' ,、時值 2 /2 3/2、休止 z、小節線、> < 附點節奏、- 連結）</label>
            <textarea class="w" id="abc" maxlength="20000" spellcheck="false"></textarea>

        </div>

                <div><label class="f" for="jBpm">速度 BPM（1 拍 = 四分音符）</label><input class="w" type="number" id="jBpm" value="100" min="40" max="220" inputmode="numeric"></div>
            </div>
            <label class="f" for="jText">簡譜（空白分隔：0 休止、1–7、#/b 升降、<code>'</code> 高八度、<code>,</code> 低八度、<code>_</code> 縮短一半、<code>.</code> 附點、單獨 <code>-</code> 延長一拍、<code>|</code> 小節線）</label>
            <textarea class="w" id="jText" maxlength="5000" spellcheck="false"></textarea>
            <div class="chips"><button class="primary play" id="jPlay">▶ 播放</button></div>

        <!-- 延遲 -->

            <div class="tw" id="dTbl"></div>

        </div>

        <!-- 房間共振 -->
        <div class="card pane" data-t="room" hidden>

                <div><label class="f" for="rC">聲速（m/s）</label><input class="w" type="number" id="rC" value="343" min="300" max="400" step="any" inputmode="decimal"></div>
            </div>
            <div class="chips"><button class="sm" id="rT">依氣溫換算聲速（°C）</button></div>

            <div class="grid2">
                <div><label class="f" for="sAmp">擴大機額定功率（W）</label><input class="w" type="number" id="sAmp" value="100" min="0" step="any" inputmode="decimal"></div>
                <div><label class="f" for="sRated">額定負載（Ω）</label><input class="w" type="number" id="sRated" value="8" min="0" step="any" inputmode="decimal"></div>
                <div><label class="f" for="sSens">靈敏度（dB @ 1W / 1m）</label><input class="w" type="number" id="sSens" value="90" step="any" inputmode="decimal"></div>
                <div><label class="f" for="sDist">聆聽距離（m）</label><input class="w" type="number" id="sDist" value="2" min="0.1" step="any" inputmode="decimal"></div>

        <div class="card">

            <p class="note">只記住上次的分頁與各欄位輸入（在這台裝置的瀏覽器）；MIDI 檔不會儲存。一般參考估算，不能取代專業量測。</p>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>作曲與音響的小工具合集：產生和弦進行與隨機旋律、用 ABC 或簡譜寫旋律並播放、檢視與播放 MIDI 檔，以及延遲時間、房間共振、喇叭阻抗與功率的計算。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>想找靈感：選調與風格看常見和弦進行，或用種子隨機生旋律。</li>
        <li>把腦中的旋律用 ABC / 簡譜打出來試聽，並查它在五線譜的位置。</li>
        <li>調 delay / 殘響的拍速、評估房間低頻駐波、接喇叭前算阻抗。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>上方選分頁；有「▶ 播放」的分頁需要按按鈕才會發聲（瀏覽器規定）。</li>
        <li>和弦進行：選調、大小調與風格，按播放；和弦以級數（羅馬數字）定義，轉調自動換算。</li>
        <li>隨機旋律：選調式、節奏型、小節數與種子；同樣的設定與種子一定得到同一段旋律，「換一個種子」重抽。</li>
        <li>ABC：貼上或輸入 ABC，解析失敗會列出行號與原因；成功會顯示簡譜（1 = 調號對應的大調主音，點在數字上下表示高低八度，<code>_</code> 表示時值縮短，後面的 <code>-</code> 表示延長）。</li>
        <li>MIDI：選檔後顯示格式、解析度、速度、拍號、各軌音符數與音域；可用簡易合成器播放（打擊樂聲道略過）。</li>
        <li>簡譜：輸入空白分隔的簡譜，表格列出音名與五線譜（高音譜號）位置文字，也可播放。</li>
        <li>延遲：輸入 BPM 得到各音符（附點、三連音）的 ms 與 Hz。</li>
        <li>房間共振：輸入長寬高與聲速，得到各軸向的共振頻率。</li>
        <li>喇叭：輸入阻抗與串並聯，得到總阻抗；再依擴大機額定功率估算實際功率、電壓與音壓。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">C 大調「流行」進行：C – G – Am – F
5 公尺長的房間：第 1 階軸向共振 = 343 ÷ (2×5) = 34.3 Hz
120 BPM：四分音符 500 ms（2 Hz）；附點八分 375 ms
兩顆 8 Ω 並聯 = 4 Ω；串聯 = 16 Ω</div>
        <h3>小提醒</h3>
        <ul>
        <li>只存「上次的分頁與各欄位輸入」（鍵 musiclab_opts，最多數 KB；ABC 與簡譜欄位各上限 20000 / 5000 字）；按頁尾「清除記住的輸入」會刪除並重新載入頁面（進行中的播放會停止）。資料壞掉或被改過會自動退回預設值；儲存空間不足會跳出共用提示。</li>
        <li>ABC 只支援子集：沒有和弦 [CEG]、連音 (3、反覆記號與多聲部；Q:120 視為每分鐘 120 個四分音符。遇到不支援的符號會報行號。</li>
        <li>MIDI 簡易播放：不分音色，一律用同一種合成波形；超過 20000 個音符只播前 20000 個；檔案上限 2 MB；不支援 SMPTE 時間格式。</li>
        <li>房間共振只算三軸的軸向模態（最強、最重要的一類），不含切向 / 斜向模態與牆面吸音；實際以量測為準。聲速預設 343 m/s（約 20°C），可手動調或依氣溫換算（331.3 + 0.606×°C）。</li>
        <li>音壓估算 = 靈敏度 + 10·log10(功率) − 20·log10(距離)，假設自由場、1 m 為參考點；房間反射會讓實際聽到的音量更大。功率估算把擴大機當理想電壓源（功率與負載阻抗成反比），實際擴大機有電流與保護限制，請以產品規格為準。</li>
        <li>喇叭阻抗為標稱值，實際阻抗隨頻率變動；串並聯接線錯誤或負載低於擴大機最低阻抗可能損壞設備。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, seeded } = Util;

        // --- pure ---
        const NOTE_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const SHARP_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
        const MAJOR = [0, 2, 4, 5, 7, 9, 11];

        // ===== 和弦進行 =====
        // 以大調級數（羅馬數字）定義：大寫 = 大三和弦、小寫 = 小三和弦；b / # 升降根音；尾碼 7 / maj7 / dim
        const PROGS = [
            { id: 'pop', mode: 'maj', name: '流行（I–V–vi–IV）', rom: 'I V vi IV' },
            { id: 'royal', mode: 'maj', name: '王道（IV–V–iii–vi）', rom: 'IV V iii vi' },
            { id: 'canon', mode: 'maj', name: '卡農（I–V–vi–iii–IV–I–IV–V）', rom: 'I V vi iii IV I IV V' },
            { id: '50s', mode: 'maj', name: '50 年代（I–vi–IV–V）', rom: 'I vi IV V' },
            { id: 'jazz', mode: 'maj', name: '爵士（ii7–V7–Imaj7–vi7）', rom: 'ii7 V7 Imaj7 vi7' },
            { id: 'folk', mode: 'maj', name: '民謠（I–IV–V–I）', rom: 'I IV V I' },
            { id: 'blues', mode: 'maj', name: '十二小節藍調', rom: 'I7 I7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7' },
            { id: 'minpop', mode: 'min', name: '小調流行（i–bVI–bIII–bVII）', rom: 'i bVI bIII bVII' },
            { id: 'andal', mode: 'min', name: '安達魯西亞（i–bVII–bVI–V）', rom: 'i bVII bVI V' },
            { id: 'minjazz', mode: 'min', name: '小調爵士（i7–iv7–bVII7–bIIImaj7）', rom: 'i7 iv7 bVII7 bIIImaj7' },
            { id: 'minbasic', mode: 'min', name: '小調基本（i–iv–v–i）', rom: 'i iv v i' },
        ];
        const CHORD_IV = { '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], dim: [0, 3, 6] };
        const ROMANS = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii'];
        // 羅馬數字 → { root: 相對主音半音數, q: 品質 }；格式錯誤回傳 null
        function parseRoman(s) {
            const m = /^([b#]?)(vii|vi|iv|v|iii|ii|i|VII|VI|IV|V|III|II|I)(maj7|7|dim)?$/.exec(String(s));
            if (!m) return null;
            const deg = ROMANS.indexOf(m[2].toLowerCase()), up = m[2] === m[2].toUpperCase();
            let q = up ? '' : 'm';
            if (m[3] === '7') q = up ? '7' : 'm7'; else if (m[3] === 'maj7') { if (!up) return null; q = 'maj7'; } else if (m[3] === 'dim') { if (up) return null; q = 'dim'; }
            return { root: (MAJOR[deg] + (m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0) + 12) % 12, q };
        }
        // 產生和弦：回傳 [{ name, rom, bass, notes }]（MIDI 音高）
        function chordProg(keyPc, progId) {
            const p = PROGS.find(x => x.id === progId); if (!p) return [];
            return p.rom.split(' ').map(r => {
                const c = parseRoman(r), pc = (keyPc + c.root) % 12, base = 60 + pc - (pc >= 6 ? 12 : 0);
                return { name: NOTE_NAMES[pc] + c.q, rom: r, bass: 36 + pc, notes: CHORD_IV[c.q].map(i => base + i) };
            });
        }

        // ===== 隨機旋律 =====
        const SCALES = {
            major: ['大調（Ionian）', [0, 2, 4, 5, 7, 9, 11]], minor: ['自然小調（Aeolian）', [0, 2, 3, 5, 7, 8, 10]],
            dorian: ['Dorian', [0, 2, 3, 5, 7, 9, 10]], phrygian: ['Phrygian', [0, 1, 3, 5, 7, 8, 10]], lydian: ['Lydian', [0, 2, 4, 6, 7, 9, 11]],
            mixolydian: ['Mixolydian', [0, 2, 4, 5, 7, 9, 10]], majpent: ['大調五聲', [0, 2, 4, 7, 9]], minpent: ['小調五聲', [0, 3, 5, 7, 10]], blues: ['藍調', [0, 3, 5, 6, 7, 10]],
        };
        // 節奏型：每小節 4 拍的時值（拍）樣式；mixed 為每小節隨機挑一種
        const RHYTHMS = {
            quarter: ['四分音符', [[1, 1, 1, 1]]], eighth: ['八分音符', [[0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]]],
            synco: ['切分', [[0.5, 1, 0.5, 1, 0.5, 0.5], [1, 0.5, 1, 0.5, 0.5, 0.5]]], dotted: ['附點', [[1.5, 0.5, 1.5, 0.5], [1.5, 0.5, 1, 1]]],

            const o = { tab: TABS[0][0], v: {} };
            if (!raw || typeof raw !== 'object') return o;
            if (TABS.some(t => t[0] === raw.tab)) o.tab = raw.tab;
            if (raw.v && typeof raw.v === 'object') for (const k of PERSIST) if (typeof raw.v[k] === 'string' && raw.v[k].length <= 20000) o.v[k] = raw.v[k];
            return o;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'musiclab_opts';
        const SAMPLE_ABC = 'X:1\nT:小星星\nM:4/4\nL:1/4\nQ:1/4=100\nK:C\nC C G G | A A G2 | F F E E | D D C2 |\nG G F F | E E D2 | G G F F | E E D2 |\nC C G G | A A G2 | F F E E | D D C2 |]';
        const SAMPLE_JP = "1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 - |\n5_ 6_ 5_ 4_ 3 1 | 2 5, 1 -";
        let opts = loadOpts(store.get(KEY, null));

        const keyOpts = () => NOTE_NAMES.map((n, i) => new Option(n, i));
        ['#cKey', '#mKey', '#jKey'].forEach(id => $(id).replaceChildren(...keyOpts()));
        $('#mScale').replaceChildren(...Object.entries(SCALES).map(([k, v]) => new Option(v[0], k)));
        $('#mRhythm').replaceChildren(...Object.entries(RHYTHMS).map(([k, v]) => new Option(v[0], k)));
        $('#abc').value = SAMPLE_ABC; $('#jText').value = SAMPLE_JP;
        for (const [k, v] of Object.entries(opts.v)) { const el = $('#' + k); if (!el) continue; const old = el.value; el.value = v; if (el.tagName === 'SELECT' && el.value !== v) el.value = old; }
        const saveOpts = () => { const v = {}; for (const k of PERSIST) v[k] = $('#' + k).value; store.set(KEY, { tab: opts.tab, v }); };

        // ---- 播放（Web Audio；每 60ms 排未來 0.5 秒內的音，避免一次建立上萬個節點） ----
        const AC = window.AudioContext || window.webkitAudioContext;
        let actx = null, cur = null;
        function stopPlay() {
            if (!cur) return;
            clearInterval(cur.iv); try { cur.master.gain.cancelScheduledValues(0); cur.master.gain.value = 0; setTimeout(() => cur.master.disconnect(), 50); } catch (e) { }
            cur.btn.textContent = '▶ 播放'; cur = null;
        }
        const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
        function startPlay(btn, events, wave = 'triangle') {
            if (cur && cur.btn === btn) { stopPlay(); return; }
            stopPlay();
            if (!AC) { alert('這個瀏覽器不支援 Web Audio，無法發聲。'); return; }
            if (!events.length) return;
            actx = actx || new AC(); actx.resume();
            const master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
            const t0 = actx.currentTime + 0.1; let i = 0; const end = Math.max(...events.map(e => e.t + e.dur));
            const voice = (e) => {
                const g = actx.createGain(), at = t0 + e.t, vol = 0.25 * (e.vel || 0.8) / Math.sqrt(e.notes.length);
                g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(0.05, e.dur));
                g.connect(master);
                for (const n of e.notes) { const o = actx.createOscillator(); o.type = wave; o.frequency.value = midiHz(n); o.connect(g); o.start(at); o.stop(at + Math.max(0.06, e.dur) + 0.02); }
            };
            cur = { btn, master, iv: 0 };
            cur.iv = setInterval(() => {
                while (i < events.length && t0 + events[i].t < actx.currentTime + 0.5) voice(events[i++]);
                if (actx.currentTime > t0 + end + 0.1) stopPlay();
            }, 60);
            btn.textContent = '■ 停止';
        }

        // ---- 分頁 ----
        function showTab(id) {
            opts.tab = id; stopPlay();
            document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== id; });
            document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === id)));
        }
        $('#tabs').replaceChildren(...TABS.map(([id, name]) => { const b = Object.assign(document.createElement('button'), { className: 'sm', textContent: name }); b.dataset.t = id; b.onclick = () => { showTab(id); saveOpts(); }; return b; }));

        // ---- 和弦 ----
        function fillStyles() { const mode = $('#cMode').value, old = $('#cStyle').value; $('#cStyle').replaceChildren(...PROGS.filter(p => p.mode === mode).map(p => new Option(p.name, p.id))); if ([...$('#cStyle').options].some(o => o.value === old)) $('#cStyle').value = old; }
        let chordEv = [];
        function renderChord() {
            const ch = chordProg(+$('#cKey').value, $('#cStyle').value), bpm = Math.min(220, Math.max(40, +$('#cBpm').value || 90)), sp = 60 / bpm * 4;
            $('#cOut').textContent = ch.map(c => c.name).join('  –  '); $('#cRom').textContent = ch.map(c => c.rom).join('  –  ');
            chordEv = ch.map((c, k) => ({ t: k * sp, dur: sp * 0.95, notes: [c.bass, ...c.notes] }));
        }
        $('#cMode').addEventListener('change', () => { fillStyles(); renderChord(); });
        ['#cKey', '#cStyle', '#cBpm'].forEach(id => $(id).addEventListener('input', renderChord));
        $('#cPlay').onclick = () => { renderChord(); startPlay($('#cPlay'), chordEv, 'triangle'); };

        // ---- 旋律 ----
        let melEv = [];
        function renderMelody() {
            const bars = Math.min(16, Math.max(1, Math.round(+$('#mBars').value) || 4)), bpm = Math.min(220, Math.max(40, +$('#mBpm').value || 100));
            const mel = genMelody($('#mSeed').value || 'seed', +$('#mKey').value, $('#mScale').value, $('#mRhythm').value, bars);
            $('#mOut').textContent = mel.map(n => n.midi === null ? '休' : SHARP_NAMES[n.midi % 12] + (Math.floor(n.midi / 12) - 1)).join(' ');
            $('#mMsg').textContent = `共 ${mel.length} 個音、${bars * 4} 拍；種子「${$('#mSeed').value || 'seed'}」。`;
            melEv = notesToEvents(mel, bpm);
        }
        ['#mKey', '#mScale', '#mRhythm', '#mBars', '#mSeed', '#mBpm'].forEach(id => $(id).addEventListener('input', renderMelody));
        $('#mDice').onclick = () => { $('#mSeed').value = Math.random().toString(36).slice(2, 8); renderMelody(); saveOpts(); };
        $('#mPlay').onclick = () => { renderMelody(); startPlay($('#mPlay'), melEv, 'triangle'); };

        // ---- ABC ----
        let abcEv = [];
        function renderAbc() {
            const r = parseABC($('#abc').value);
            $('#aErr').textContent = r.errors.map(e => `第 ${e.line} 行：${e.msg}`).join('\n');
            const nn = r.notes.filter(n => !n.bar);
            abcEv = r.errors.length ? [] : notesToEvents(r.notes, r.qpm);
            const rel = r.key ? r.key.rel : 0;
            $('#aInfo').textContent = (r.title ? `《${r.title}》 ` : '') + `${nn.length} 個音　拍號 ${r.meter.join('/')}　速度 ♩=${Math.round(r.qpm)}` + (r.key ? `　1 = ${NOTE_NAMES[rel]}` : '');
            $('#aJp').textContent = r.errors.length ? '（修正錯誤後顯示）' : r.notes.map(n => n.bar ? '|' : jianpuNote(n.midi, rel, n.beats)).join(' ').replace(/(\| )+/g, '| ');
            $('#aPlay').disabled = !!r.errors.length || !nn.length;
        }
        $('#abc').addEventListener('input', renderAbc);
        $('#aSample').onclick = () => { $('#abc').value = SAMPLE_ABC; renderAbc(); saveOpts(); };
        $('#aPlay').onclick = () => startPlay($('#aPlay'), abcEv, 'triangle');

        // ---- MIDI ----
        let midiEv = [];
        $('#mFile').addEventListener('change', async () => {
            stopPlay(); const f = $('#mFile').files[0]; $('#fErr').textContent = ''; $('#fInfo').textContent = ''; $('#fTbl').replaceChildren(); $('#fPlay').disabled = true; midiEv = [];
            if (!f) return;
            if (f.size > MAX_MIDI_BYTES) { $('#fErr').textContent = `檔案 ${(f.size / 1048576).toFixed(1)} MB 超過 2 MB 上限。`; return; }
            let m;
            try { m = parseMidi(new Uint8Array(await f.arrayBuffer())); } catch (e) { $('#fErr').textContent = '讀取或解析失敗：' + ((e && e.message) || e); return; }
            if (m.error) { $('#fErr').textContent = m.error; return; }
            const ev = midiEvents(m), tempo = m.tempos.length ? Math.round(60000000 / m.tempos[0].us) : 120, nn = m.tracks.reduce((s, t) => s + t.notes.length, 0);
            $('#fErr').textContent = m.errors.join('\n');
            $('#fInfo').textContent = `格式 ${m.format}　音軌 ${m.tracks.length}（檔頭宣告 ${m.ntrks}）　解析度 ${m.division} ticks/四分音符\n速度 ${tempo} BPM${m.tempos.length > 1 ? `（共 ${m.tempos.length} 次變速）` : ''}　拍號 ${m.sig ? m.sig.join('/') : '未標示'}\n音符 ${nn}　長度約 ${Math.floor(ev.seconds / 60)}:${String(Math.round(ev.seconds % 60)).padStart(2, '0')}` + (ev.truncated ? `\n注意：只播放前 ${MAX_PLAY_NOTES} 個音符` : '');
            const t = document.createElement('table'); t.innerHTML = '<tr><th>軌</th><th>名稱</th><th>事件</th><th>音符</th><th>聲道</th><th>音域</th></tr>';
            m.tracks.forEach((tr, i) => {
                const ns = tr.notes.map(n => n.note), r = document.createElement('tr');
                [i + 1, tr.name || '—', tr.events, tr.notes.length, tr.channels.map(c => c + 1).join(',') || '—', ns.length ? SHARP_NAMES[Math.min(...ns) % 12] + (Math.floor(Math.min(...ns) / 12) - 1) + '–' + SHARP_NAMES[Math.max(...ns) % 12] + (Math.floor(Math.max(...ns) / 12) - 1) : '—'].forEach(v => { const td = document.createElement('td'); td.textContent = v; r.appendChild(td); });
                t.appendChild(r);
            });
            $('#fTbl').replaceChildren(t); midiEv = ev.events; $('#fPlay').disabled = !midiEv.length;
        });
        $('#fPlay').onclick = () => startPlay($('#fPlay'), midiEv, 'triangle');

        // ---- 簡譜 ----
        let jpEv = [];
        function renderJp() {
            const r = parseJianpu($('#jText').value, +$('#jKey').value), bpm = Math.min(220, Math.max(40, +$('#jBpm').value || 100));
            $('#jErr').textContent = r.errors.map(e => `第 ${e.line} 行：${e.msg}`).join('\n');
            const t = document.createElement('table'); t.innerHTML = '<tr><th>簡譜</th><th>音名</th><th>五線譜位置（高音譜號）</th></tr>';
            for (const n of r.notes) {
                const tr = document.createElement('tr'), sp = n.midi === null ? null : staffPos(n.midi);
                [n.tok, sp ? sp.name : '休止', sp ? sp.pos : '—'].forEach((v, k) => { const td = document.createElement('td'); td.textContent = v; if (k === 2) td.style.textAlign = 'left'; tr.appendChild(td); });
                t.appendChild(tr);
            }
            $('#jTbl').replaceChildren(r.notes.length ? t : document.createTextNode('')); jpEv = r.errors.length ? [] : notesToEvents(r.notes, bpm);
            $('#jPlay').disabled = !jpEv.length;
        }
        ['#jText', '#jKey', '#jBpm'].forEach(id => $(id).addEventListener('input', renderJp));
        $('#jPlay').onclick = () => startPlay($('#jPlay'), jpEv, 'triangle');

        // ---- 延遲 ----
        function renderDelay() {
            const bpm = +$('#dBpm').value;
            if (!(bpm >= 20 && bpm <= 400)) { $('#dTbl').textContent = 'BPM 請輸入 20 到 400。'; return; }
            const t = document.createElement('table'); t.innerHTML = '<tr><th>音符</th><th>直（ms / Hz）</th><th>附點</th><th>三連音</th></tr>';
            const f = (ms) => `${ms.toFixed(ms < 100 ? 2 : 1)} / ${msToHz(ms).toFixed(2)}`;
            for (const r of delayTable(bpm)) { const tr = document.createElement('tr'); [r.name, f(r.straight), f(r.dotted), f(r.triplet)].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }); t.appendChild(tr); }
            $('#dTbl').replaceChildren(t);
        }
        $('#dBpm').addEventListener('input', renderDelay);

        // ---- 房間 ----
        function renderRoom() {
            const L = +$('#rL').value, W = +$('#rW').value, H = +$('#rH').value, c = +$('#rC').value;
            if (![L, W, H].every(x => x >= 0.5 && x <= 50) || !(c >= 300 && c <= 400)) { $('#rTbl').textContent = '尺寸請輸入 0.5–50 公尺，聲速 300–400 m/s。'; $('#rNote').textContent = ''; return; }
            const t = document.createElement('table'); t.innerHTML = '<tr><th>階</th><th>長（Hz）</th><th>寬（Hz）</th><th>高（Hz）</th></tr>';
            for (let n = 1; n <= 4; n++) { const tr = document.createElement('tr'); [n, n * c / (2 * L), n * c / (2 * W), n * c / (2 * H)].forEach((v, k) => { const td = document.createElement('td'); td.textContent = k ? v.toFixed(1) : v; tr.appendChild(td); }); t.appendChild(tr); }
            $('#rTbl').replaceChildren(t);
            const m = roomModes(L, W, H, c, 4), close = [];
            for (let i = 1; i < m.length; i++) if (m[i].dim !== m[i - 1].dim && m[i].f - m[i - 1].f < Math.max(3, m[i].f * 0.05)) close.push(`${m[i - 1].f.toFixed(1)} 與 ${m[i].f.toFixed(1)} Hz`);
            $('#rNote').textContent = `最低共振 ${m[0].f.toFixed(1)} Hz（${m[0].dim}）。` + (close.length ? `不同方向的共振靠得很近（相差 < 5%）：${close.slice(0, 4).join('、')}，低頻容易特別突出。` : '各方向共振沒有明顯重疊。') + ' 僅軸向模態、不含吸音，實際請以量測為準。';
        }
        ['#rL', '#rW', '#rH', '#rC'].forEach(id => $(id).addEventListener('input', renderRoom));
        $('#rT').onclick = () => { const v = prompt('室溫（°C，-30 到 50）', '20'); const n = parseFloat(v); if (v !== null && n >= -30 && n <= 50) { $('#rC').value = soundSpeed(n).toFixed(1); renderRoom(); saveOpts(); } };

        // ---- 喇叭 ----
        function renderSpk() {
            const zs = parseZs($('#sZ').value);
            if (!zs) { $('#sOut').textContent = '阻抗請輸入正數，用逗號分隔（例：8,8,4）。'; $('#sNote').textContent = ''; return; }
            const z = $('#sCfg').value === 'series' ? zSeries(zs) : zParallel(zs), lines = [`${zs.length} 顆${$('#sCfg').value === 'series' ? '串聯' : '並聯'}：總阻抗 ${+z.toFixed(3)} Ω`];
            const pa = +$('#sAmp').value, zr = +$('#sRated').value, sens = +$('#sSens').value, d = +$('#sDist').value;
            if (pa > 0 && zr > 0) {
                const p = ampPower(pa, zr, z); lines.push(`擴大機 ${pa} W @ ${zr} Ω → 接 ${+z.toFixed(2)} Ω 約 ${+p.toFixed(1)} W（${+voltFromPower(p, z).toFixed(2)} V RMS）`);
                if (isFinite(sens) && d > 0) lines.push(`估算音壓約 ${splEstimate(sens, p, d).toFixed(1)} dB SPL（距離 ${d} m）`);
                if (z < zr * 0.5) lines.push('⚠ 負載阻抗低於額定的一半，擴大機可能過載或保護，請確認規格。');
            } else lines.push('填入擴大機功率與額定負載可估算功率與音壓。');
            $('#sOut').textContent = lines.join('\n');
            $('#sNote').textContent = '理想電壓源估算：功率 ∝ 1/阻抗；每加倍功率約 +3 dB，距離每加倍約 −6 dB。';
        }
        ['#sZ', '#sCfg', '#sAmp', '#sRated', '#sSens', '#sDist'].forEach(id => $(id).addEventListener('input', renderSpk));

        // ---- 初始化 ----
        fillStyles(); if (opts.v.cStyle && [...$('#cStyle').options].some(o => o.value === opts.v.cStyle)) $('#cStyle').value = opts.v.cStyle;
        renderChord(); renderMelody(); renderAbc(); renderJp(); renderDelay(); renderRoom(); renderSpk(); showTab(opts.tab);
        document.querySelector('.wrap').addEventListener('input', saveOpts); document.querySelector('.wrap').addEventListener('change', saveOpts);
        $('#reset').onclick = () => {
            if (!confirm('要清除記住的分頁與輸入嗎？\n（無法復原；頁面會重新載入，進行中的播放會停止）')) return;
            stopPlay(); try { localStorage.removeItem(KEY); } catch (e) { } location.reload();
        };
        addEventListener('pagehide', stopPlay);
        document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlay(); });
    </script>
</body>
