<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>JSON 整理器</h1>
        <p class="sub">貼上 JSON，一鍵美化、壓縮或驗證，也能和 YAML、TOML、CSV 互轉。全部在本機處理。</p>

        <div class="card">

    <template id="help">
        <h3>這是什麼</h3>
        <p>貼上 JSON 就能美化、壓縮、驗證，也可以和 YAML、TOML、CSV 互相轉換，並用樹狀方式瀏覽。另外可以把 JSON 當範例，產生 TypeScript、JSON Schema、Mongoose Schema、Python dataclass、Go struct 的型別定義。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>API 回傳一整行 JSON，看不懂，想排版成易讀的樣子。</li>
        <li>設定檔要在 JSON、YAML、TOML 之間轉換（例如 pyproject.toml、Cargo.toml）。</li>
        <li>把 JSON 陣列轉成 CSV 丟進 Excel，或把 CSV 轉回 JSON。</li>
        <li>JSON 有錯，想知道錯在第幾行。</li>
        <li>拿到 API 回傳範例，想快速產生前端型別、資料庫 Schema 或驗證用的 JSON Schema。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>把內容貼進上方輸入框。</li>
        <li>按「美化」（可選縮排 2 / 4 空白或 Tab、勾「鍵名排序」）、「壓縮」或「只驗證」；有錯會顯示錯誤位置。</li>
        <li>「格式轉換」按 JSON → YAML、JSON → CSV、YAML → JSON、CSV → JSON、JSON → TOML、TOML → JSON、YAML → TOML、TOML → YAML，結果顯示在下方。</li>
        <li>結果可切換「文字」與「樹狀」（點節點可展開收合），按「複製結果」帶走，或「放回輸入」接著再轉。</li>
        <li>往下到「產生型別」：選輸出語言、填「根型別名稱」，按「產生」。TypeScript 可選 interface / type 與 export；JSON Schema 可勾「偵測 format」；Mongoose 可勾 timestamps。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">輸入 name = "app"
        按「TOML → JSON」
        → {"name": "app"}
        輸入 [{"name":"A","n":1},{"name":"B","n":2}]
        按「JSON → CSV」
        → name,n
        → A,1
        → B,2
        輸入 [{"id":1,"name":"A"},{"id":2,"name":"B","note":null}]
        「產生型別」選 TypeScript
        → type Root = RootItem[];
        → interface RootItem { id: number; name: string; note?: null; }</div>
        <h3>小提醒</h3>
        <ul>
        <li>CSV 轉換需要第一列是標題；JSON → CSV 需為物件陣列。</li>
        <li>YAML 只支援常用語法，複雜功能（錨點等）可能無法轉換。</li>
        <li>TOML 支援表格 [a.b]、陣列表格 [[x]]、行內表格、三種字串（基本、字面、多行）、整數（含 0x / 0o / 0b 與底線）、浮點、布林、日期時間與註解；不支援會明確報錯：inf / nan、超過 ±2^53 的整數。TOML 的日期時間轉成 JSON 會變成字串；JSON 的 null 與非物件的最上層無法轉成 TOML（TOML 沒有 null）。轉換後註解會消失。</li>
        <li>全部在本機處理，不會上傳；也不會儲存任何資料。</li>
        <li>型別只是「從範例推論」：陣列有多筆時會合併所有元素，沒有出現在每一筆的欄位視為可選，型別不同的欄位用 union（Go 用 interface{}、Mongoose 用 Mixed）。範例沒涵蓋的情況請自己補上。</li>
        <li>整數與小數同欄位時視為小數（number / float64 / float）；空陣列沒有元素可推論，會是 unknown / Any。物件依鍵名取名（帕斯卡命名，陣列元素會單數化，例如 items → Item）。</li>
        <li>鍵名不是合法識別字時：TypeScript 加引號；Go 轉成大駝峰並保留 json tag；Python 改名並用 <kbd>field(metadata)</kbd> 記下原鍵名。巢狀超過 100 層或範例超過 200 萬字元不處理。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { parseCSV, toObjects, csvStringify } = Util;

        // --- pure ---
        // 遞迴排序鍵名（陣列順序不動）
        function sortKeys(v) {
            if (Array.isArray(v)) return v.map(sortKeys);
            if (v && typeof v === 'object') return Object.fromEntries(Object.keys(v).sort().map(k => [k, sortKeys(v[k])]));
            return v;
        }

        // 新版瀏覽器的 JSON.parse 錯誤訊息不含位置，所以自己掃一遍找出錯誤位置（只在解析失敗時使用）
        // 回傳 { pos, msg }（pos 為字元索引）；文字其實合法則回傳 null
        function jsonErrorPos(text) {
            let i = 0;
            const n = text.length, err = (msg) => { throw { pos: Math.min(i, n), msg }; };
            const ws = () => { while (i < n && ' \t\n\r'.includes(text[i])) i++; };
            function str() {
                i++;
                while (i < n) {
                    const c = text[i];
                    if (c === '"') { i++; return; }
                    if (c === '\\') {
                        const e = text[i + 1];
                        if (e === 'u') {
                            if (!/^[0-9a-fA-F]{4}$/.test(text.slice(i + 2, i + 6))) { i += 2; err('\\u 後面要接 4 位十六進位數字'); }
                            i += 6; continue;
                        }
                        if (e === undefined || !'"\\/bfnrt'.includes(e)) { i += 1; err('不合法的跳脫字元'); }
                        i += 2; continue;
                    }
                    if (c < ' ') err('字串中不能有未跳脫的換行或控制字元');
                    i++;
                }
                err('字串沒有結束');
            }
            function num() {
                const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i));
                if (!m) err('數字格式錯誤');
                i += m[0].length;
            }
            function obj() {
                i++; ws();
                if (text[i] === '}') { i++; return; }
                for (; ;) {
                    ws();
                    if (text[i] !== '"') err('物件的鍵必須是用雙引號包住的字串');
                    str(); ws();
                    if (text[i] !== ':') err('鍵後面缺少冒號 :');
                    i++; value(); ws();
                    if (text[i] === ',') { i++; continue; }
                    if (text[i] === '}') { i++; return; }
                    err('缺少逗號 , 或右大括號 }');
                }
            }
            function arr() {
                i++; ws();
                if (text[i] === ']') { i++; return; }
                for (; ;) {
                    value(); ws();
                    if (text[i] === ',') { i++; continue; }
                    if (text[i] === ']') { i++; return; }
                    err('缺少逗號 , 或右中括號 ]');
                }
            }
            function value() {
                ws();
                const c = text[i];
                if (c === '{') return obj();
                if (c === '[') return arr();
                if (c === '"') return str();
                if (c === '-' || (c >= '0' && c <= '9')) return num();
                for (const lit of ['true', 'false', 'null']) if (text.startsWith(lit, i)) { i += lit.length; return; }
                err(i >= n ? '資料提前結束' : `無法辨識的內容 ${JSON.stringify(c)}`);
            }
            try { value(); ws(); if (i < n) err('資料結尾後還有多餘內容'); return null; }
            catch (e) { if (e && typeof e.pos === 'number') return e; throw e; }
        }

        const posToLineCol = (text, pos) => {
            const before = text.slice(0, pos).split('\n');
            return { line: before.length, col: before[before.length - 1].length + 1 };
        };

        // mode: 'pretty' | 'min' | 'check'；回傳 { ok:true, text, value } 或 { ok:false, message, hint, line, col }
        function formatJSON(text, { indent = 2, sort = false, mode = 'pretty' } = {}) {
            let v;
            try { v = JSON.parse(text); }
            catch (e) {
                const at = jsonErrorPos(text);
                return { ok: false, message: e.message, hint: at ? at.msg : '', ...(at ? posToLineCol(text, at.pos) : {}) };
            }
            if (sort) v = sortKeys(v);
            const out = mode === 'min' ? JSON.stringify(v) : mode === 'check' ? '' : JSON.stringify(v, null, indent);
            return { ok: true, text: out, value: v };
        }

        // ---------- 格式轉換 ----------
        // JSON → YAML。字串只在「會被誤讀」時才加雙引號（空字串、像數字 / 布林 / null / 日期、含 : # 或前後空白、換行…）
        const yamlNeedsQuote = (s) => s === '' || /^\s|\s$|[\n\r\t]/.test(s) || /^[-?:,\[\]{}#&*!|>'"%@`]/.test(s) || /: |:$| #/.test(s)
            || /^(null|~|true|false|yes|no|on|off|y|n)$/i.test(s) || /^[-+]?(\d[\d_.,]*|\.\d+)([eE][-+]?\d+)?$/.test(s) || /^0[xob]/i.test(s) || /^\d{4}-\d{2}-\d{2}/.test(s);
        const yamlStr = (s) => (yamlNeedsQuote(s) ? JSON.stringify(s) : s);
        const yamlScalar = (v) => (v === null ? 'null' : typeof v === 'string' ? yamlStr(v) : String(v));
        const isLeaf = (v) => v === null || typeof v !== 'object' || (Array.isArray(v) ? !v.length : !Object.keys(v).length);
        const yamlInline = (v) => (v !== null && typeof v === 'object' ? (Array.isArray(v) ? '[]' : '{}') : yamlScalar(v));
        function yamlLines(v, ind) {
            const pad = ' '.repeat(ind), out = [];
            if (Array.isArray(v)) {
                for (const x of v) {
                    if (isLeaf(x)) out.push(pad + '- ' + yamlInline(x));
                    else { const sub = yamlLines(x, ind + 2); sub[0] = pad + '- ' + sub[0].slice(ind + 2); out.push(...sub); }
                }
            } else {
                for (const [k, x] of Object.entries(v)) {
                    const key = /[:#]/.test(k) || yamlNeedsQuote(k) ? JSON.stringify(k) : k;
                    if (isLeaf(x)) out.push(`${pad}${key}: ${yamlInline(x)}`);
                    else { out.push(`${pad}${key}:`); out.push(...yamlLines(x, ind + 2)); }
                }
            }
            return out;
        }
        const jsonToYaml = (v) => (isLeaf(v) ? yamlInline(v) : yamlLines(v, 0).join('\n'));

        // YAML → JSON 值。支援常用子集：區塊的 map / list、巢狀、行內 [a, b] / {a: 1}、單雙引號字串、註解、null / 布林 / 數字。
        // 不支援（會明確報錯）：多行文字 | >、錨點 & * 與標籤 !、多份文件
        function parseYaml(text) {
            const lines = [], src = String(text).replace(/\r\n?/g, '\n').split('\n');
            const strip = (l) => { let q = ''; for (let i = 0; i < l.length; i++) { const c = l[i]; if (q) { if (c === '\\' && q === '"') i++; else if (c === q) q = ''; } else if (c === '"' || c === "'") { if (i === 0 || /[\s:\-\[{,]/.test(l[i - 1])) q = c; } else if (c === '#' && (i === 0 || /\s/.test(l[i - 1]))) return l.slice(0, i); } return l; };
            let seenDoc = false;
            src.forEach((l, i) => {
                if (/^---\s*$/.test(l)) { if (seenDoc || lines.length) throw new Error(`第 ${i + 1} 行：不支援多份 YAML 文件（---）`); seenDoc = true; return; }
                if (/^\.\.\.\s*$/.test(l)) return;
                const s = strip(l).replace(/\s+$/, ''); if (!s.trim()) return;
                if (/\t/.test(/^\s*/.exec(s)[0])) throw new Error(`第 ${i + 1} 行：縮排不能使用 Tab`);
                lines.push({ ind: /^ */.exec(s)[0].length, t: s.trim(), n: i + 1 });
            });
            if (!lines.length) return null;
            let pos = 0;
            const fail = (ln, msg) => { throw new Error(`第 ${ln.n} 行：${msg}`); };
            const isSeq = (t) => t === '-' || t.startsWith('- ');

            // 以引號開頭的字串：回傳 [字串, 結束後的索引]
            function quoted(s, i, ln) {
                const q = s[i]; let j = i + 1, out = '';
                if (q === '"') {
                    for (; j < s.length; j++) {
                        if (s[j] === '\\') { j++; if (s[j] === undefined) break; out += '\\' + s[j]; } else if (s[j] === '"') { try { return [JSON.parse('"' + out + '"'), j + 1]; } catch (e) { fail(ln, '雙引號字串裡有不合法的跳脫'); } } else out += s[j];
                    }
                } else {
                    for (; j < s.length; j++) { if (s[j] === "'") { if (s[j + 1] === "'") { out += "'"; j++; } else return [out, j + 1]; } else out += s[j]; }
                }
                return fail(ln, '引號沒有結束');
            }
            function plain(s, ln) {
                if (s === '' || s === '~' || /^null$/i.test(s)) return null;
                if (/^(true|false)$/i.test(s)) return s.toLowerCase() === 'true';
                if (/^[-+]?(0|[1-9]\d*)(\.\d+)?([eE][-+]?\d+)?$/.test(s) || /^[-+]?\.\d+$/.test(s)) return Number(s);   // 0123 這類前導 0 當字串，避免電話號碼被吃掉
                if (/^[&*!]/.test(s)) fail(ln, '不支援錨點、別名與標籤（& * !）');
                if (/^[|>][+-]?\d*$/.test(s)) fail(ln, '不支援多行文字（| 或 >），請改用雙引號與 \\n');
                return s;
            }
            function flow(s, ln) {
                let i = 0;
                const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
                function val() {
                    ws(); const c = s[i];
                    if (c === '[') { i++; const a = []; ws(); if (s[i] === ']') { i++; return a; } for (; ;) { a.push(val()); ws(); if (s[i] === ',') { i++; ws(); if (s[i] === ']') { i++; return a; } continue; } if (s[i] === ']') { i++; return a; } fail(ln, '行內陣列缺少逗號或 ]'); } }
                    if (c === '{') {
                        i++; const o = {}; ws(); if (s[i] === '}') { i++; return o; }
                        for (; ;) {
                            ws(); let k; if (s[i] === '"' || s[i] === "'") { [k, i] = quoted(s, i, ln); } else { const m = /^[^:,{}\[\]]+/.exec(s.slice(i)); if (!m) fail(ln, '行內物件的鍵不合法'); k = m[0].trim(); i += m[0].length; }
                            ws(); if (s[i] !== ':') fail(ln, '行內物件缺少 :'); i++; o[k] = val(); ws();
                            if (s[i] === ',') { i++; ws(); if (s[i] === '}') { i++; return o; } continue; } if (s[i] === '}') { i++; return o; } fail(ln, '行內物件缺少逗號或 }');
                        }
                    }

            const uniq = (base) => { let n = reserved.has(base) ? base + 'Type' : base, i = 2; const b = n; while (used.has(n)) n = b + i++; used.add(n); return n; };
            const walk = (t, base, fromArr) => {
                if (t.obj) { t.obj.name = uniq(fromArr ? singular(base) : base); decls.push(t.obj); for (const [k, f] of t.obj.fields) walk(f.t, pascal(k), false); }
                if (t.arr && t.arr.el) walk(t.arr.el, base, true);
            };
            let R = pascal(rootName || 'Root');
            if (reserved.has(R)) R += 'Type';
            if (!isPureObj(T)) used.add(R);   // 根是別名時先佔位，避免子型別撞名
            walk(T, R, false);
            return { rootName: R, decls };
        }
        const TS_RESERVED = new Set(['Array', 'Date', 'Record', 'Object', 'String', 'Number', 'Boolean', 'Map', 'Set', 'Promise', 'Partial', 'Error', 'Function', 'Symbol']);
        const PY_RESERVED = new Set(['Any', 'Optional', 'Union', 'List', 'Dict', 'dataclass', 'field', 'None', 'True', 'False']);
        const NO_RESERVED = new Set();
        const jsKey = (k) => /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);

        // ---- TypeScript ----
        function toTS(T, o = {}) {
            const { rootName, decls } = nameAll(T, o.name, TS_RESERVED), ex = o.exp ? 'export ' : '';
            const tp = (t) => {
                const p = [];
                if (t.str) p.push('string'); if (t.int || t.num) p.push('number'); if (t.bool) p.push('boolean');
                if (t.obj) p.push(t.obj.name);
                if (t.arr) { if (!t.arr.el) p.push('unknown[]'); else { const e = tp(t.arr.el); p.push(e.length > 1 ? `(${e.join(' | ')})[]` : (e[0] || 'unknown') + '[]'); } }
                if (t.null) p.push('null');
                return p;
            };
            const te = (t) => tp(t).join(' | ') || 'unknown';
            const out = [];
            if (!isPureObj(T)) out.push(`${ex}type ${rootName} = ${te(T)};`);
            for (const d of decls) {
                const body = [...d.fields].map(([k, f]) => `  ${jsKey(k)}${f.c < d.n ? '?' : ''}: ${te(f.t)};`).join('\n');
                out.push(o.kind === 'type' ? `${ex}type ${d.name} = {${body ? '\n' + body + '\n' : ''}};` : `${ex}interface ${d.name} {${body ? '\n' + body + '\n' : ''}}`);
            }
            return out.join('\n\n') + '\n';
        }

        // ---- JSON Schema（draft 2020-12） ----
        function schemaOf(t, fmt) {
            const ty = [];
            if (t.str) ty.push('string'); if (t.num) ty.push('number'); else if (t.int) ty.push('integer');
            if (t.bool) ty.push('boolean'); if (t.obj) ty.push('object'); if (t.arr) ty.push('array'); if (t.null) ty.push('null');
            const s = {};
            if (ty.length) s.type = ty.length === 1 ? ty[0] : ty;
            if (t.str && fmt && ['date-time', 'date', 'email', 'uri', 'uuid'].includes(t.str.fmt)) s.format = t.str.fmt;
            if (t.obj) {
                s.properties = Object.fromEntries([...t.obj.fields].map(([k, f]) => [k, schemaOf(f.t, fmt)]));   // ponytail: fromEntries 遇 __proto__ 鍵會建成自有屬性，沒有原型污染
                const req = [...t.obj.fields].filter(([, f]) => f.c >= t.obj.n).map(([k]) => k);
                if (req.length) s.required = req;
            }
            if (t.arr) s.items = t.arr.el ? schemaOf(t.arr.el, fmt) : {};
            return s;
        }
        function toJSONSchema(T, o = {}) {
            const s = schemaOf(T, !!o.fmt);
            return JSON.stringify({ $schema: 'https://json-schema.org/draft/2020-12/schema', title: pascal(o.name || 'Root'), ...s }, null, 2) + '\n';
        }

        // ---- Mongoose ----
        function toMongoose(T, o = {}) {
            const { rootName, decls } = nameAll(T, o.name, NO_RESERVED);
            const rootObj = isPureObj(T) ? T.obj : T.arr && !T.str && !T.obj && !T.int && !T.num && !T.bool && !T.null && T.arr.el && isPureObj(T.arr.el) ? T.arr.el.obj : null;
            if (!rootObj) return '// 根節點不是物件（或物件陣列），無法產生 Mongoose Schema\n';
            const mt = (t) => {
                const k = kindsOf(t);
                if (k.length !== 1) return 'Schema.Types.Mixed';
                if (t.str) return t.str.oid ? 'Schema.Types.ObjectId' : ['date-time', 'date'].includes(t.str.fmt) ? 'Date' : 'String';
                if (t.int || t.num) return 'Number'; if (t.bool) return 'Boolean';
                if (t.obj) return t.obj.name + 'Schema';
                return `[${t.arr.el ? mt(t.arr.el) : 'Schema.Types.Mixed'}]`;
            };
            const blocks = [];
            for (const d of decls.slice().reverse()) {   // 子文件在前
                const lines = [];
                for (const [k, f] of d.fields) {
                    if (o.timestamps && d === rootObj && (k === 'createdAt' || k === 'updatedAt')) continue;
                    const ty = mt(f.t), req = f.c >= d.n && !f.t.null && !f.t.arr;
                    lines.push(`  ${jsKey(k)}: ${req ? `{ type: ${ty}, required: true }` : ty},`);
                }
                blocks.push(`const ${d.name}Schema = new Schema({${lines.length ? '\n' + lines.join('\n') + '\n' : ''}}${d === rootObj && o.timestamps ? ', { timestamps: true }' : ''});`);
            }
            return `const mongoose = require('mongoose');\nconst { Schema } = mongoose;\n\n${blocks.join('\n\n')}\n\nmodule.exports = mongoose.model(${JSON.stringify(rootObj.name)}, ${rootObj.name}Schema);\n`;
        }

        // ---- Python dataclass ----
        const PY_KW = new Set(['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield', 'match', 'case', 'type']);
        const PY_SHADOW = new Set(['field', 'dataclass', 'str', 'int', 'float', 'bool', 'list', 'Any', 'Optional', 'Union']);
        function toPython(T, o = {}) {
            const { rootName, decls } = nameAll(T, o.name, PY_RESERVED), imp = new Set(['dataclass']);
            const clsNames = new Set(decls.map(d => d.name));
            const pt = (t) => {
                const p = [];
                if (t.str) p.push('str'); if (t.num) p.push('float'); else if (t.int) p.push('int'); if (t.bool) p.push('bool');
                if (t.obj) p.push(t.obj.name);
                if (t.arr) p.push(`list[${t.arr.el ? pt(t.arr.el) : (imp.add('Any'), 'Any')}]`);
                if (!p.length) return t.null ? 'None' : (imp.add('Any'), 'Any');
                if (p.length === 1) return t.null ? (imp.add('Optional'), `Optional[${p[0]}]`) : p[0];
                imp.add('Union'); return `Union[${p.join(', ')}${t.null ? ', None' : ''}]`;
            };
            const blocks = [];
            for (const d of decls.slice().reverse()) {
                const used = new Set(), req = [], opt = [];
                for (const [k, f] of d.fields) {
                    let n = k.replace(/[^\p{L}\p{N}_]/gu, '_') || 'field';
                    if (!/^[\p{L}_]/u.test(n)) n = '_' + n;
                    if (PY_KW.has(n) || PY_SHADOW.has(n) || clsNames.has(n)) n += '_';   // 欄位名稱不能蓋掉 field / int / 類別名稱，否則後面的欄位定義會壞掉
                    const base = n; let i = 2; while (used.has(n)) n = base + '_' + i++;
                    used.add(n);
                    const isOpt = f.c < d.n; let ty = pt(f.t);
                    if (isOpt && !f.t.null) { imp.add('Optional'); ty = `Optional[${ty}]`; }
                    const meta = n !== k ? `metadata={"json": ${JSON.stringify(k)}}` : '';
                    if (meta) imp.add('field');
                    (isOpt ? opt : req).push(`    ${n}: ${ty}${isOpt ? ` = ${meta ? `field(default=None, ${meta})` : 'None'}` : meta ? ` = field(${meta})` : ''}`);
                }
                const body = [...req, ...opt];
                blocks.push(`@dataclass\nclass ${d.name}:\n${body.length ? body.join('\n') : '    pass'}`);
            }
            if (!isPureObj(T)) blocks.push(`${rootName} = ${pt(T)}`);
            const std = ['dataclass', 'field'].filter(x => imp.has(x)), typ = ['Any', 'Optional', 'Union'].filter(x => imp.has(x));
            return `from dataclasses import ${std.join(', ')}\n${typ.length ? `from typing import ${typ.join(', ')}\n` : ''}\n\n${blocks.join('\n\n\n')}\n`;
        }

        // ---- Go struct ----
        const GO_INIT = new Set(['ACL', 'API', 'ASCII', 'CPU', 'CSS', 'DNS', 'EOF', 'GUID', 'HTML', 'HTTP', 'HTTPS', 'ID', 'IP', 'JSON', 'LHS', 'QPS', 'RAM', 'RHS', 'RPC', 'SLA', 'SMTP', 'SQL', 'SSH', 'TCP', 'TLS', 'TTL', 'UDP', 'UI', 'UID', 'UUID', 'URI', 'URL', 'UTF8', 'VM', 'XML', 'XMPP', 'XSRF', 'XSS']);
        // 欄位名稱 → 大駝峰，常見縮寫保持大寫（user_id → UserID、imageUrl → ImageURL）
        function goName(key) {
            const ws = String(key).match(/\p{Lu}+(?!\p{Ll})|\p{Lu}?\p{Ll}+|\p{N}+|\p{L}+/gu) || [];
            let s = ws.map(w => { const u = w.toUpperCase(); return GO_INIT.has(u) ? u : /^\p{Lu}{2,}$/u.test(w) ? w.charAt(0) + w.slice(1).toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1); }).join('');
            if (!s) s = 'Field';
            if (!/^[A-Z]/.test(s)) s = 'X' + s;
            return s;
        }
        const goTag = (key, omit) => {
            if (!key || /[,\u0000-\u001f]/.test(key)) return null;   // 空鍵名或含逗號 / 控制字元：tag 無法表示
            const tag = `json:${JSON.stringify(key + (omit ? ',omitempty' : ''))}`;
            return tag.includes('`') ? JSON.stringify(tag) : '`' + tag + '`';
        };
        function toGo(T, o = {}) {
            const { rootName, decls } = nameAll(T, o.name, NO_RESERVED);
            const gt = (t, ptr) => {
                const k = kindsOf(t);
                if (k.length !== 1) return 'interface{}';
                const b = t.str ? 'string' : t.num ? 'float64' : t.int ? 'int' : t.bool ? 'bool' : t.obj ? t.obj.name : `[]${t.arr.el ? gt(t.arr.el, false) : 'interface{}'}`;
                return (ptr || t.null) && !t.arr ? '*' + b : b;
            };
            const blocks = [];
            if (!isPureObj(T)) blocks.push(`type ${rootName} ${gt(T, false)}`);
            for (const d of decls) {
                const used = new Set(), rows = [];
                for (const [k, f] of d.fields) {
                    let n = goName(k); const base = n; let i = 2; while (used.has(n)) n = base + i++;
                    used.add(n);
                    const omit = f.c < d.n, tag = goTag(k, omit), ty = gt(f.t, omit);
                    rows.push([n, ty, tag ? tag : '', tag ? '' : (k === '' || /,/.test(k) ? '// 鍵名無法寫進 json tag（空字串或含逗號）' : '// 鍵名含控制字元，無法寫進 json tag')]);
                }
                const w0 = Math.max(0, ...rows.map(r => r[0].length)), w1 = Math.max(0, ...rows.map(r => r[1].length));
                const lines = rows.map(r => '\t' + [r[0].padEnd(w0), (r[2] || r[3]) ? r[1].padEnd(w1) : r[1], r[2] || r[3]].join(' ').trimEnd());
                blocks.push(`type ${d.name} struct {${lines.length ? '\n' + lines.join('\n') + '\n' : ''}}`);
            }
            return blocks.join('\n\n') + '\n';
        }

        // 主入口：value 是已解析的 JSON；lang：ts / schema / mongoose / python / go
        function generateTypes(value, lang, opts = {}) {
            const T = inferT(value);
            switch (lang) {
                case 'ts': return toTS(T, opts);
                case 'schema': return toJSONSchema(T, opts);
                case 'mongoose': return toMongoose(T, opts);
                case 'python': return toPython(T, opts);
                case 'go': return toGo(T, opts);
            }
            throw new Error('未知的輸出語言');
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let result = '';

        function setStatus(msg, cls, extra) {
            const s = $('#status');
            s.className = cls; s.textContent = msg;
            if (extra) { const pre = document.createElement('pre'); pre.className = 'errline'; pre.textContent = extra; s.append(pre); }
        }

        function buildTree(v, key, isLast) {
            const wrap = document.createElement('div');
            const label = (k) => { const s = document.createElement('span'); s.className = 'k'; s.textContent = JSON.stringify(k) + ': '; return s; };
            if (v !== null && typeof v === 'object') {
                const arr = Array.isArray(v), entries = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
                const d = document.createElement('details'), sum = document.createElement('summary');
                d.open = true;
                if (key !== undefined) sum.append(arr || typeof key === 'string' ? label(key) : '');
                sum.append(`${arr ? '[' : '{'} ${entries.length} 項 ${arr ? ']' : '}'}`);
                d.append(sum);
                entries.forEach(([k, x]) => d.append(buildTree(x, arr ? undefined : k)));
                return d;
            }
            const row = document.createElement('div'); row.className = 'leaf';
            if (key !== undefined) row.append(label(key));
            const val = document.createElement('span');
            val.className = v === null ? 'null' : typeof v === 'string' ? 's' : typeof v === 'number' ? 'n' : 'b';
            val.textContent = JSON.stringify(v);
            row.append(val);
            return row;
        }

        function run(mode) {
            const text = $('#in').value;
            if (!text.trim()) { setStatus('請先貼上 JSON', 'err'); $('#outCard').hidden = true; return; }
            const ind = $('#indent').value;
            const r = formatJSON(text, { indent: ind === 'tab' ? '\t' : +ind, sort: $('#sort').checked, mode });
            if (!r.ok) {
                $('#outCard').hidden = true;
                let extra = '';
                if (r.line) {
                    const l = text.split('\n')[r.line - 1] || '';
                    extra = `第 ${r.line} 行`.padEnd(8) + l.slice(0, 200) + '\n' + ' '.repeat(8 + Math.max(0, r.col - 1)) + '^';
                }
                setStatus(`✗ 不是有效的 JSON：${r.hint || r.message}${r.line ? `（第 ${r.line} 行、第 ${r.col} 欄）` : ''}`, 'err', extra);
                return;
            }
            const kind = Array.isArray(r.value) ? `陣列（${r.value.length} 項）` : r.value && typeof r.value === 'object' ? `物件（${Object.keys(r.value).length} 個鍵）` : typeof r.value;
            setStatus(`✓ 有效的 JSON・${kind}`, 'ok');
            if (mode === 'check') { $('#outCard').hidden = true; return; }
            result = r.text;
            $('#outCard').hidden = false;
            $('#outText').textContent = result;
            const tree = $('#outTree');
            tree.replaceChildren();
            let count = 0;
            JSON.stringify(r.value, (k, x) => { count++; return x; });
            if (count > 5000) tree.textContent = '資料太大，樹狀檢視已停用（請用文字檢視）';
            else tree.append(buildTree(r.value));
        }

        function view(tree) {
            $('#outText').hidden = tree; $('#outTree').hidden = !tree;
            $('#viewText').setAttribute('aria-pressed', !tree); $('#viewTree').setAttribute('aria-pressed', tree);
        }

        // 轉換：from 讀輸入、to 產生輸出文字；結果當作純文字顯示（轉成 JSON 時另有樹狀）
        function convert(from, to, label) {
            const text = $('#in').value;
            if (!text.trim()) { setStatus('請先貼上要轉換的內容', 'err'); $('#outCard').hidden = true; return; }
            try {
                const value = from(text), out = to(value);
                result = out; $('#outCard').hidden = false; $('#outText').textContent = out;
                const tree = $('#outTree'); tree.replaceChildren();
                if (out.trimStart()[0] === '{' || out.trimStart()[0] === '[') { try { tree.append(buildTree(JSON.parse(out))); } catch (e) { /* 不是 JSON 就不畫樹 */ } }
                view(false); setStatus(`✓ ${label} 完成`, 'ok');
            } catch (e) { $('#outCard').hidden = true; setStatus(`✗ ${label} 失敗：${e.message}`, 'err'); }
        }
        const parseJsonStrict = (t) => { const r = formatJSON(t, { mode: 'check' }); if (!r.ok) throw new Error(`輸入不是有效的 JSON：${r.hint || r.message}${r.line ? `（第 ${r.line} 行）` : ''}`); return r.value; };
        $('#toYaml').onclick = () => convert(parseJsonStrict, jsonToYaml, 'JSON → YAML');
        $('#toCsv').onclick = () => convert(parseJsonStrict, jsonToCsv, 'JSON → CSV');
        $('#yamlToJson').onclick = () => convert(parseYaml, (v) => JSON.stringify(v, null, 2), 'YAML → JSON');
        $('#csvToJson').onclick = () => convert(csvToJson, (v) => JSON.stringify(v, null, 2), 'CSV → JSON');
        $('#toToml').onclick = () => convert(parseJsonStrict, jsonToToml, 'JSON → TOML');
        $('#tomlToJson').onclick = () => convert(parseToml, (v) => JSON.stringify(v, null, 2), 'TOML → JSON');
        $('#yamlToToml').onclick = () => convert(parseYaml, jsonToToml, 'YAML → TOML');
        $('#tomlToYaml').onclick = () => convert(parseToml, jsonToYaml, 'TOML → YAML');

        $('#pretty').onclick = () => run('pretty');
        $('#min').onclick = () => run('min');
        $('#check').onclick = () => run('check');
        $('#viewText').onclick = () => view(false);
        $('#viewTree').onclick = () => view(true);
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), result, () => { });
        $('#toIn').onclick = () => { $('#in').value = result; };

        // ---------- 產生型別 ----------
        let tyText = '';
        const tyStatus = (msg, cls) => { const e = $('#tyStatus'); e.className = cls || ''; e.textContent = msg; };
        const tyOpts = () => { const l = $('#tyLang').value; [...document.querySelectorAll('#tyOpts [data-for]')].forEach(e => { e.hidden = e.dataset.for !== l; }); };
        $('#tyLang').onchange = () => { tyOpts(); if (tyText) $('#tyGo').click(); };
        $('#tyGo').onclick = () => {
            const text = $('#in').value, out = $('#tyOut');
            tyText = ''; out.hidden = true; $('#tyCopy').hidden = true;
            if (!text.trim()) return tyStatus('請先在上方貼上 JSON 範例', 'err');
            if (text.length > 2000000) return tyStatus('✗ 範例太大（超過 200 萬字元），請縮小後再產生', 'err');
            const r = formatJSON(text, { mode: 'check' });
            if (!r.ok) return tyStatus(`✗ 輸入不是有效的 JSON：${r.hint || r.message}${r.line ? `（第 ${r.line} 行、第 ${r.col} 欄）` : ''}`, 'err');
            try {
                tyText = generateTypes(r.value, $('#tyLang').value, { name: $('#tyName').value, kind: $('#tyKind').value, exp: $('#tyExport').checked, fmt: $('#tyFmt').checked, timestamps: $('#tyTs').checked });
            } catch (e) { return tyStatus(`✗ ${e.message}`, 'err'); }
            out.textContent = tyText; out.hidden = false; $('#tyCopy').hidden = false;
            tyStatus('✓ 已產生，推論自你貼上的範例；範例沒出現的情況（例如欄位其實會是別的型別）請自行補上', 'ok');
        };
        $('#tyCopy').onclick = () => Util.copyWithFeedback($('#tyCopy'), tyText, () => { });
        tyOpts();
    </script>
</body>

</html>
