<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="中文數字與金額大寫：阿拉伯數字、中文小寫（一二三）、大寫（壹貳參）互轉，支票金額、民國年與日期的中文寫法。">
    <meta property="og:title" content="中文數字與金額大寫" />
    <meta property="og:description" content="數字 ⇄ 中文小寫 / 大寫、新臺幣金額、民國日期，全部離線計算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/cn-number.html" />
    <title>中文數字與金額大寫</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tabs button {
            flex: 1;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row input {
            flex: 1;
            min-width: 160px;
        }

        .li>:first-child {
            flex: none;
        }

        .li b {
            font-weight: 700;
            word-break: break-all;
            text-align: right;
            flex: 1;
            min-width: 0;
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            min-height: 44px;
        }

        .bad {
            color: var(--bad);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>中文數字與金額大寫</h1>
        <p class="sub">數字、中文小寫、大寫（支票）與民國日期互轉，全部在本機計算。</p>

        <div class="tabs" id="tabs"><button data-t="num" aria-pressed="true">數字 / 金額</button><button data-t="date" aria-pressed="false">日期 / 民國年</button></div>

        <div id="pgNum">
            <div class="card">
                <h2>輸入</h2>
                <div class="row"><input id="n" inputmode="text" autocomplete="off" placeholder="例如 12345.67　或　壹萬貳仟參佰肆拾伍元陸角柒分" aria-label="數字或中文數字"><button id="nClear">清除</button></div>
                <label class="chk"><input type="checkbox" id="tenOmit" checked>10–19 省略開頭的「一」（十一、拾壹；金額與支票大寫一律寫「壹拾」）</label>
                <p class="note" id="nNote"></p>
            </div>
            <div class="card" id="nOutCard" hidden>
                <div id="nOut"></div>
            </div>
        </div>

        <div id="pgDate" hidden>
            <div class="card">
                <h2>輸入日期</h2>
                <div class="row"><input id="d" inputmode="text" autocomplete="off" placeholder="例如 2024-03-05　或　113/3/5　或　民國一一三年三月五日" aria-label="日期"><button id="dToday">今天</button></div>
                <p class="note" id="dNote"></p>
            </div>
            <div class="card" id="dOutCard" hidden>
                <div id="dOut"></div>
            </div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把數字寫成中文（一二三）或支票用的大寫（壹貳參），也能反過來把中文讀回數字；另外處理新臺幣金額大寫，以及西元與民國年的互轉與中文日期寫法。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>開支票、寫收據、合約金額要填「新臺幣○○元整」。</li>
        <li>公文、表單要把「2024-03-05」寫成「民國一一三年三月五日」。</li>
        <li>看到一串中文數字想快速知道是多少。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>「數字 / 金額」分頁：輸入阿拉伯數字（可含逗號、小數、負號）或中文數字，會自動判斷方向，並列出阿拉伯數字、千分位、中文小寫、大寫與金額大寫，每列可複製。</li>
        <li>中文輸入可用小寫（一百二十三）、大寫（壹佰貳拾參）、逐字（二〇二四）或金額（壹萬元整），簡體的「万、亿、两」也能讀。</li>
        <li>「10–19 省略開頭的一」可切換「十一」與「一十一」；金額大寫固定寫「壹拾」。</li>
        <li>「日期 / 民國年」分頁：輸入西元（2024-03-05）、民國（113/3/5）或中文日期；3 位數以下的年份視為民國，也可加「民國」「西元」前綴。按「今天」帶入今天。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">12345.67
→ 小寫 一萬二千三百四十五點六七
→ 大寫 壹萬貳仟參佰肆拾伍點陸柒
→ 金額 新臺幣壹萬貳仟參佰肆拾伍元陸角柒分
10001 → 一萬零一　100000000 → 一億
2024-03-05 → 民國 113 年 3 月 5 日
→ 支票大寫 民國壹佰壹拾參年零參月零伍日</div>
        <h3>小提醒</h3>
        <ul>
        <li>整數最多 16 位（到「兆」，9999 兆以內）；小寫與大寫的小數最多 20 位，金額最多到「分」（2 位小數），超過會提示而不是四捨五入。</li>
        <li>支票日期的「零」慣例（月 / 日為 1–9、10、20、30 前加「零」）只是常見寫法，實際請依銀行或單位規定。</li>
        <li>民國元年是西元 1912 年；1911 年以前顯示「民國前」。</li>
        <li>口語省略單位的寫法（如「一千一」）會被當成不合法，以免讀錯數字。</li>
        <li>不儲存任何輸入，全部在你的瀏覽器計算。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { copyWithFeedback } = Util;

        // --- pure ---
        const CN_SET = {
            lower: { d: '零一二三四五六七八九', u: ['', '十', '百', '千'] },
            upper: { d: '零壹貳參肆伍陸柒捌玖', u: ['', '拾', '佰', '仟'] },
        };
        const CN_BIG = ['', '萬', '億', '兆'];
        const MAX_INT_DIGITS = 16, MAX_FRAC_DIGITS = 20;

        // 阿拉伯數字字串 → { ok, neg, int, frac }（int 無前導零；錯誤回傳 { ok:false, reason }）
        function parseArabic(s) {
            s = String(s ?? '').trim().replace(/[,，_\s]/g, '').replace(/^[−－]/, '-');
            const m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
            if (!m || (!m[2] && !m[3])) return { ok: false, reason: '不是合法的數字' };
            const int = m[2].replace(/^0+(?=\d)/, '') || '0', frac = m[3] || '';
            if (int.length > MAX_INT_DIGITS) return { ok: false, reason: `整數最多 ${MAX_INT_DIGITS} 位（到「兆」）` };
            if (frac.length > MAX_FRAC_DIGITS) return { ok: false, reason: `小數最多 ${MAX_FRAC_DIGITS} 位` };
            const zero = /^0+$/.test(int) && !/[1-9]/.test(frac);
            return { ok: true, neg: m[1] === '-' && !zero, int, frac };
        }
        const numStr = (p) => (p.neg ? '-' : '') + p.int + (p.frac ? '.' + p.frac : '');
        const withCommas = (p) => (p.neg ? '-' : '') + p.int.replace(/\B(?=(\d{3})+$)/g, ',') + (p.frac ? '.' + p.frac : '');

        // 整數字串 → 中文（set = 'lower' | 'upper'）；tenOmit：10–19 開頭省略「一」
        function intToCn(int, set = 'lower', tenOmit = false) {
            const S = CN_SET[set];
            int = String(int).replace(/^0+(?=\d)/, '');
            if (int === '0') return S.d[0];
            const n = int.length, out = [];
            let zero = false, started = false;
            for (let i = 0; i < n; i++) {
                const pos = n - 1 - i, dg = +int[i], u = pos % 4, g = (pos - u) / 4;
                if (dg) {
                    if (zero && started) out.push(S.d[0]);
                    zero = false; started = true;
                    out.push(S.d[dg] + S.u[u]);
                } else if (started) zero = true;
                if (u === 0) {
                    if (/[1-9]/.test(int.slice(Math.max(0, i - 3), i + 1))) { if (g > 0) out.push(CN_BIG[g]); zero = false; }
                    else if (started) zero = true;
                }
            }
            if (tenOmit && out[0] === S.d[1] + S.u[1]) out[0] = S.u[1];
            return out.join('');
        }
        const digitsCn = (s, set = 'lower') => [...s].map(c => c === '0' ? (set === 'lower' ? '〇' : CN_SET.upper.d[0]) : CN_SET[set].d[+c]).join('');
        function numToCn(p, set = 'lower', tenOmit = false) {
            return (p.neg ? '負' : '') + intToCn(p.int, set, tenOmit) + (p.frac ? '點' + [...p.frac].map(c => CN_SET[set].d[+c]).join('') : '');
        }
        // 新臺幣金額大寫；小數超過 2 位回傳 { ok:false }
        function moneyCn(p) {
            const f = p.frac.replace(/0+$/, '');
            if (f.length > 2) return { ok: false, reason: '金額最多到「分」（2 位小數）' };
            const d = CN_SET.upper.d, jiao = +(f[0] || 0), fen = +(f[1] || 0), hasInt = p.int !== '0';
            let s = (p.neg ? '負' : '') + '新臺幣';
            if (hasInt || (!jiao && !fen)) s += intToCn(p.int, 'upper') + '元';
            if (jiao) s += d[jiao] + '角';
            if (fen) s += (jiao || !hasInt ? '' : '零') + d[fen] + '分';
            if (!fen) s += '整';
            return { ok: true, text: s };
        }

        const CN_NORM = { '万': '萬', '亿': '億', '两': '二', '兩': '二', '〇': '零', '○': '零', 'Ｏ': '零', '壹': '一', '貳': '二', '贰': '二', '叁': '三', '參': '三', '肆': '四', '伍': '五', '陸': '六', '陆': '六', '柒': '七', '捌': '八', '玖': '九', '拾': '十', '佰': '百', '仟': '千', '圓': '元', '圆': '元', '点': '點', '负': '負' };
        const DG = '一二三四五六七八九';
        const dv = (c) => DG.indexOf(c) + 1;
        // 0–9999 的中文區段（如「一千零五」「二十」「十五」）；不合法回傳 NaN
        function sectionVal(s) {
            const m = new RegExp(`^零?(?:([${DG}])千)?(?:零?([${DG}])百)?(?:零?(?:([${DG}])?(十)))?(?:(零)?([${DG}]))?$`).exec(s);
            if (!m) return NaN;
            const [, q, h, t, ten, z, o] = m;
            if (o && !ten && !z && (q || h)) return NaN; // 「一千一」這類省略單位的口語
            return (q ? dv(q) * 1000 : 0) + (h ? dv(h) * 100 : 0) + (ten ? (t ? dv(t) : 1) * 10 : 0) + (o ? dv(o) : 0);
        }
        // 中文整數（含逐字）→ 數字字串，不合法回傳 null
        function cnInt(s) {
            if (!s) return null;
            if (/^[零一二三四五六七八九]+$/.test(s)) return [...s].map(c => c === '零' ? 0 : dv(c)).join('').replace(/^0+(?=\d)/, '');
            const m = new RegExp('^(?:([^兆億萬]+)兆)?(?:([^兆億萬]+)億)?(?:([^兆億萬]+)萬)?([^兆億萬]+)?$').exec(s);
            if (!m) return null;
            let total = 0n, any = false;
            for (let i = 1; i <= 4; i++) {
                if (m[i] === undefined) continue;
                const v = m[i] === '零' ? 0 : sectionVal(m[i]);
                if (Number.isNaN(v)) return null;
                total += BigInt(v) * 10n ** BigInt(4 * (4 - i)); any = true;
            }
            return any ? total.toString() : null;
        }
        // 中文（小寫 / 大寫 / 逐字 / 金額）→ { ok, neg, int, frac }
        function parseCn(src) {
            const cur = (x) => x.replace(/^新[臺台]幣|^NT\$?|^[Nn][Tt][Dd]?/, '');
            let s = String(src ?? '').trim().replace(/[,，\s]/g, '').replace(/\d/g, c => '零一二三四五六七八九'[c]);
            s = cur([...s].map(c => CN_NORM[c] || c).join(''));
            let neg = false;
            if (/^[負-]/.test(s)) { neg = true; s = cur(s.slice(1)); } else if (/^[正+]/.test(s)) s = cur(s.slice(1));
            if (!s) return { ok: false, reason: '請輸入數字' };
            let int, frac = '';
            if (/[元角分]/.test(s)) {
                const m = new RegExp(`^(?:(.+?)元)?(?:零?([零${DG}])角)?(?:零?([零${DG}])分)?[整正]?$`).exec(s);
                if (!m || (!m[1] && !m[2] && !m[3])) return { ok: false, reason: '金額格式不對（例：壹萬元整、參佰元伍角）' };
                int = m[1] ? cnInt(m[1]) : '0';
                const f = (m[2] ? dv(m[2]) : 0) + '' + (m[3] ? dv(m[3]) : 0);
                frac = f.replace(/0+$/, '');
            } else {
                const parts = s.split('點');
                if (parts.length > 2) return { ok: false, reason: '只能有一個「點」' };
                int = parts[0] === '' && parts.length === 2 ? '0' : cnInt(parts[0]);
                if (parts.length === 2) {
                    if (!/^[零一二三四五六七八九]+$/.test(parts[1])) return { ok: false, reason: '「點」後面只能是逐字的數字（例：三點一四）' };
                    frac = [...parts[1]].map(c => c === '零' ? 0 : dv(c)).join('');
                }
            }
            if (int === null) return { ok: false, reason: '無法辨識的中文數字（單位順序或用字不對）' };
            if (int.length > MAX_INT_DIGITS) return { ok: false, reason: `整數最多 ${MAX_INT_DIGITS} 位（到「兆」）` };
            if (frac.length > MAX_FRAC_DIGITS) return { ok: false, reason: `小數最多 ${MAX_FRAC_DIGITS} 位` };
            return { ok: true, neg: neg && (/[1-9]/.test(int) || /[1-9]/.test(frac)), int, frac };
        }
        // 自動判斷輸入是阿拉伯數字或中文
        function convert(src) {
            const t = String(src ?? '').trim();
            if (!t) return { ok: false, empty: true };
            if (t.length > 200) return { ok: false, reason: '輸入太長（上限 200 字）' };
            const ar = /^[+\-−－]?[\d,，_\s]*\.?\d*$/.test(t) && /\d/.test(t);
            const p = ar ? parseArabic(t) : parseCn(t);
            if (!p.ok) return p;
            return { ok: true, from: ar ? 'arabic' : 'cn', p };
        }

        // --- 日期 ---
        const dim = (y, m) => [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
        function partInt(s) {
            if (/^\d{1,4}$/.test(s)) return +s;
            const v = cnInt([...s].map(c => CN_NORM[c] || c).join(''));
            return v !== null && v.length <= 4 ? +v : NaN;
        }
        // '2024-03-05' / '113/3/5' / '民國113年3月5日' / '民國一一三年三月五日' → { ok, y(西元), m, d }
        function parseDate(src) {
            let s = String(src ?? '').trim();
            if (!s) return { ok: false, empty: true };
            const pm = /^(中華民國|民國|民国|民前|民國前|西元|公元|AD)\s*/i.exec(s);
            const pre = pm ? pm[1] : ''; if (pm) s = s.slice(pm[0].length);
            const parts = s.split(/[年月日\/.\-\s]+/).filter(Boolean);
            if (parts.length !== 3) return { ok: false, reason: '格式不對，需要 年、月、日（例：2024-03-05、113/3/5）' };
            const [yy, m, d] = parts.map(partInt);
            if (![yy, m, d].every(Number.isInteger)) return { ok: false, reason: '年月日必須是數字' };
            let y;
            if (/前/.test(pre)) y = 1912 - yy;
            else if (/民/.test(pre)) y = yy + 1911;
            else if (/西|公|AD/i.test(pre)) y = yy;
            else y = yy < 1000 ? yy + 1911 : yy;
            if (y < 1 || y > 9999) return { ok: false, reason: '年份超出範圍（西元 1–9999）' };
            if (m < 1 || m > 12) return { ok: false, reason: '月份要在 1–12' };
            if (d < 1 || d > dim(y, m)) return { ok: false, reason: `${y} 年 ${m} 月沒有 ${d} 日` };
            return { ok: true, y, m, d };
        }
        const rocYear = (y) => y >= 1912 ? { before: false, n: y - 1911 } : { before: true, n: 1912 - y };
        // 支票慣例：月 / 日為 1–9、10、20、30 時前面加「零」
        const chequeMD = (n) => (n < 10 || n % 10 === 0 ? '零' : '') + intToCn(String(n), 'upper');
        function dateForms({ y, m, d }) {
            const r = rocYear(y), pre = r.before ? '民國前' : '民國', p2 = (n) => String(n).padStart(2, '0');
            return [
                ['西元', `${y}-${p2(m)}-${p2(d)}`],
                ['民國', `${pre}${r.n}年${m}月${d}日`],
                ['民國（中文）', `${pre}${intToCn(String(r.n), 'lower', true)}年${intToCn(String(m), 'lower', true)}月${intToCn(String(d), 'lower', true)}日`],
                ['民國（逐字）', `${pre}${digitsCn(String(r.n))}年${intToCn(String(m), 'lower', true)}月${intToCn(String(d), 'lower', true)}日`],
                ['西元（逐字）', `${digitsCn(String(y))}年${intToCn(String(m), 'lower', true)}月${intToCn(String(d), 'lower', true)}日`],
                ['支票大寫', `${pre}${intToCn(String(r.n), 'upper')}年${chequeMD(m)}月${chequeMD(d)}日`],
            ];
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const row = (k, v) => {
            const d = document.createElement('div'); d.className = 'li';
            const a = document.createElement('span'); a.className = 'muted'; a.textContent = k;
            const b = document.createElement('b'); b.textContent = v;
            const c = document.createElement('button'); c.className = 'sm'; c.textContent = '複製'; c.onclick = () => copyWithFeedback(c, v);
            d.append(a, b, c); return d;
        };
        function showNum() {
            const out = $('#nOut'), r = convert($('#n').value), note = $('#nNote');
            out.replaceChildren(); $('#nOutCard').hidden = true; note.textContent = ''; note.classList.remove('bad');
            if (r.empty) return;
            if (!r.ok) { note.textContent = r.reason; note.classList.add('bad'); return; }
            const p = r.p, omit = $('#tenOmit').checked;
            note.textContent = r.from === 'arabic' ? '判斷為阿拉伯數字，轉成中文' : '判斷為中文，轉成阿拉伯數字';
            const m = moneyCn(p);
            out.append(row('阿拉伯數字', numStr(p)), row('千分位', withCommas(p)), row('中文小寫', numToCn(p, 'lower', omit)), row('中文大寫', numToCn(p, 'upper', omit)));
            if (m.ok) out.append(row('金額大寫', m.text));
            else { const e = document.createElement('p'); e.className = 'note'; e.textContent = '金額大寫：' + m.reason; out.append(e); }
            $('#nOutCard').hidden = false;
        }
        function showDate() {
            const out = $('#dOut'), r = parseDate($('#d').value), note = $('#dNote');
            out.replaceChildren(); $('#dOutCard').hidden = true; note.textContent = ''; note.classList.remove('bad');
            if (r.empty) return;
            if (!r.ok) { note.textContent = r.reason; note.classList.add('bad'); return; }
            const ro = rocYear(r.y);
            note.textContent = `${r.y} 年 ${r.m} 月 ${r.d} 日 = ${ro.before ? '民國前' : '民國'} ${ro.n} 年`;
            for (const [k, v] of dateForms(r)) out.append(row(k, v));
            $('#dOutCard').hidden = false;
        }
        $('#n').oninput = $('#tenOmit').onchange = showNum;
        $('#nClear').onclick = () => { $('#n').value = ''; showNum(); $('#n').focus(); };
        $('#d').oninput = showDate;
        $('#dToday').onclick = () => { const t = new Date(); $('#d').value = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; showDate(); };
        $('#tabs').onclick = (e) => {
            const t = e.target.dataset.t; if (!t) return;
            [...$('#tabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
            $('#pgNum').hidden = t !== 'num'; $('#pgDate').hidden = t !== 'date';
        };
    </script>
</body>

</html>
