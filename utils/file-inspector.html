<body>
    <div class="wrap">

        <h1>檔案檢視器</h1>
        <p class="sub">看檔案的位元組、真實類型、ZIP 內容與圖片隱藏資料；檔案只在這個瀏覽器處理，不上傳。</p>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把一個檔案拖進來，用四種方式看它「真正」裝了什麼：十六進位 Hexdump、依檔頭判斷真實類型、列出 ZIP 內容、檢查圖片有沒有藏東西。檔案只在你的瀏覽器裡處理，不上傳、不儲存。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>拿到來路不明的檔案，想確認它「真的是」圖片或文件，還是改了副檔名的執行檔。</li>
        <li>想看檔案的原始位元組、查某段字串在哪個位置，或對照檔案格式規格。</li>
        <li>不想解壓縮就先看 ZIP 裡面有什麼檔案、有沒有加密。</li>
        <li>學習或 CTF 練習：檢查圖片尾端有沒有附加資料、LSB 位元平面有沒有圖案。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點上方區塊選檔或拖曳進來（單檔 ≤ 50MB）。</li>
        <li><b>Hexdump</b>：左欄偏移、中間十六進位、右邊 ASCII。可「跳到偏移」（<kbd>0x</kbd> 開頭為十六進位，否則十進位）、搜尋文字或位元組（如 <kbd>50 4B 03 04</kbd>）；大檔只讀目前這一頁，搜尋時分段讀取。</li>
        <li><b>檔案類型</b>：讀檔頭的魔術位元組判斷，內建 50 種左右常見格式，並比對副檔名；不符會警示。</li>
        <li><b>ZIP</b>：解析中央目錄，列出檔名、大小、壓縮率、修改時間；點「預覽」可看文字檔（單檔預覽上限 5MB）。</li>
        <li><b>隱寫</b>：檢查檔尾是否有圖片結束後的附加資料、PNG 文字區塊、JPEG 註解，並可看 PNG / BMP / GIF / WebP 的位元平面（LSB）圖。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">photo.jpg 實際檔頭是 4D 5A（MZ）→ 偵測為「Windows 可執行檔」，警示副檔名不符
        report.docx → 偵測為 ZIP 容器（docx 本質是 ZIP），副檔名相符；到 ZIP 分頁可看到 word/document.xml
        圖片 JPEG 結束標記（FF D9）之後還有 12 KB → 提示有附加資料，並顯示開頭內容</div>
        <h3>小提醒</h3>
        <ul>
        <li>魔術位元組只代表「檔頭長這樣」，不保證檔案安全；偵測為執行檔卻是別的副檔名時請特別小心，不要開啟。</li>
        <li>ZIP 不支援加密與 AES、也不支援 Deflate64 / BZip2 / LZMA 等壓縮方式（會明確提示）；不支援 ZIP64。為防 zip bomb，預覽的單檔解壓後上限 5MB，超過不展開。檔名含 <kbd>../</kbd> 或絕對路徑會標示危險。</li>
        <li>隱寫只做教學用的簡易檢查：JPEG 因為失真壓縮，LSB 沒有意義；找不到不代表沒有，LSB 自動讀字只試「紅綠藍依序、高位元在前」一種排列。圖片 EXIF（相機、GPS）請改用<a href="exif-viewer.html">照片 EXIF 檢視與清除</a>。</li>
        <li>圖片像素超過 2,500 萬點不繪製位元平面。本頁不存任何資料，沒有需要備份或清除的內容。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const MAX_FILE = 50 * 1024 * 1024, PREVIEW_MAX = 5 * 1024 * 1024;
        const hex2 = (n) => n.toString(16).padStart(2, '0');
        // Hexdump：u8 為視窗，base 為視窗第一個位元組在檔案中的偏移
        function hexdump(u8, base, width = 16) {
            const lines = [];
            for (let i = 0; i < u8.length; i += width) {
                const row = u8.subarray(i, i + width);
                const h = Array.from(row, hex2).join(' ').padEnd(width * 3 - 1);
                const a = Array.from(row, b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join('');
                lines.push((base + i).toString(16).padStart(8, '0') + '  ' + h + '  |' + a + '|');
            }
            return lines.join('\n');
        }
        function hexToBytes(s) {
            const t = String(s).replace(/0x/gi, '').replace(/[\s,:\-]/g, '');
            return /^([0-9a-fA-F]{2})+$/.test(t) && t.length <= 512 ? Uint8Array.from(t.match(/../g), x => parseInt(x, 16)) : null;
        }
        function parseOffset(s, size) {
            const t = String(s).trim();
            let n = /^0x[0-9a-f]+$/i.test(t) ? parseInt(t, 16) : /^\d+$/.test(t) ? parseInt(t, 10) : NaN;
            return Number.isFinite(n) ? Math.min(Math.max(0, n), Math.max(0, size - 1)) : null;
        }
        function findBytes(hay, pat, from = 0) {
            if (!pat.length) return -1;
            for (let i = hay.indexOf(pat[0], from); i >= 0 && i <= hay.length - pat.length; i = hay.indexOf(pat[0], i + 1)) {
                let k = 1; while (k < pat.length && hay[i + k] === pat[k]) k++;
                if (k === pat.length) return i;
            }
            return -1;
        }
        // ---- 檔案類型 ----
        const at = (u, off, s) => { for (let i = 0; i < s.length; i++) if (u[off + i] !== s.charCodeAt(i)) return false; return true; };
        const head = (u) => String.fromCharCode(...u.subarray(0, 512)).replace(/^\xef\xbb\xbf/, '').trimStart().toLowerCase();
        const ftyp = (u, ...b) => at(u, 4, 'ftyp') && (!b.length || b.some(x => at(u, 8, x)));
        // [名稱, MIME, 常見副檔名, 判斷函式, 是否可執行]
        const MAGIC = [
            ['PNG 圖片', 'image/png', 'png', u => at(u, 0, '\x89PNG\r\n\x1a\n')],
            ['JPEG 圖片', 'image/jpeg', 'jpg jpeg jpe jfif', u => at(u, 0, '\xff\xd8\xff')],
            ['GIF 圖片', 'image/gif', 'gif', u => at(u, 0, 'GIF8') && (u[4] === 55 || u[4] === 57) && u[5] === 97],
            ['WebP 圖片', 'image/webp', 'webp', u => at(u, 0, 'RIFF') && at(u, 8, 'WEBP')],
            ['AVIF 圖片', 'image/avif', 'avif', u => ftyp(u, 'avif', 'avis')],
            ['HEIC / HEIF 圖片', 'image/heic', 'heic heif', u => ftyp(u, 'heic', 'heix', 'hevc', 'heim', 'heis', 'mif1', 'msf1')],
            ['ICO 圖示', 'image/x-icon', 'ico cur', u => at(u, 0, '\0\0\x01\0') && u[4] > 0 && u[5] === 0],
            ['TIFF 圖片', 'image/tiff', 'tif tiff', u => at(u, 0, 'II*\0') || at(u, 0, 'MM\0*')],
            ['Photoshop 文件', 'image/vnd.adobe.photoshop', 'psd', u => at(u, 0, '8BPS')],
            ['BMP 圖片', 'image/bmp', 'bmp dib', u => at(u, 0, 'BM') && u[6] === 0 && u[7] === 0 && u[8] === 0 && u[9] === 0],
            ['PDF 文件', 'application/pdf', 'pdf', u => at(u, 0, '%PDF-')],
            ['ZIP 壓縮檔（含 docx / xlsx / pptx / jar / apk / epub）', 'application/zip', 'zip docx xlsx pptx odt ods odp jar apk epub xpi kmz', u => at(u, 0, 'PK\x03\x04') || at(u, 0, 'PK\x05\x06')],
            ['RAR 壓縮檔', 'application/vnd.rar', 'rar', u => at(u, 0, 'Rar!\x1a\x07')],
            ['7-Zip 壓縮檔', 'application/x-7z-compressed', '7z', u => at(u, 0, '7z\xbc\xaf\x27\x1c')],
            ['GZIP 壓縮檔', 'application/gzip', 'gz tgz', u => at(u, 0, '\x1f\x8b\x08')],
            ['BZip2 壓縮檔', 'application/x-bzip2', 'bz2', u => at(u, 0, 'BZh')],
            ['XZ 壓縮檔', 'application/x-xz', 'xz txz', u => at(u, 0, '\xfd7zXZ\0')],
            ['Zstandard 壓縮檔', 'application/zstd', 'zst', u => at(u, 0, '\x28\xb5\x2f\xfd')],
            ['TAR 封存檔', 'application/x-tar', 'tar', u => at(u, 257, 'ustar')],
            ['CAB 封存檔', 'application/vnd.ms-cab-compressed', 'cab', u => at(u, 0, 'MSCF')],
            ['ISO 光碟映像', 'application/x-iso9660-image', 'iso', u => at(u, 0x8001, 'CD001')],
            ['MP3 音訊', 'audio/mpeg', 'mp3', u => at(u, 0, 'ID3') || (u[0] === 0xff && (u[1] & 0xe0) === 0xe0 && ((u[1] >> 1) & 3) !== 0)],
            ['WAV 音訊', 'audio/wav', 'wav', u => at(u, 0, 'RIFF') && at(u, 8, 'WAVE')],
            ['AVI 影片', 'video/x-msvideo', 'avi', u => at(u, 0, 'RIFF') && at(u, 8, 'AVI ')],
            ['OGG 容器', 'audio/ogg', 'ogg oga ogv opus', u => at(u, 0, 'OggS')],
            ['FLAC 音訊', 'audio/flac', 'flac', u => at(u, 0, 'fLaC')],
            ['MIDI 音樂', 'audio/midi', 'mid midi', u => at(u, 0, 'MThd')],
            ['M4A 音訊', 'audio/mp4', 'm4a', u => ftyp(u, 'M4A ')],
            ['QuickTime 影片', 'video/quicktime', 'mov qt', u => ftyp(u, 'qt  ')],
            ['3GP 影片', 'video/3gpp', '3gp 3g2', u => ftyp(u, '3gp', '3g2')],
            ['MP4 影片', 'video/mp4', 'mp4 m4v', u => ftyp(u)],
            ['Matroska / WebM 影片', 'video/x-matroska', 'mkv webm mka', u => at(u, 0, '\x1a\x45\xdf\xa3')],
            ['FLV 影片', 'video/x-flv', 'flv', u => at(u, 0, 'FLV\x01')],
            ['Windows 可執行檔（EXE / DLL）', 'application/vnd.microsoft.portable-executable', 'exe dll sys scr ocx', u => at(u, 0, 'MZ'), true],
            ['ELF 可執行檔（Linux）', 'application/x-elf', 'elf so o bin out', u => at(u, 0, '\x7fELF'), true],
            ['Mach-O 可執行檔（macOS）', 'application/x-mach-binary', 'dylib bin', u => at(u, 0, '\xcf\xfa\xed\xfe') || at(u, 0, '\xce\xfa\xed\xfe') || at(u, 0, '\xfe\xed\xfa\xce') || at(u, 0, '\xfe\xed\xfa\xcf'), true],
            ['Java class / Mach-O fat', 'application/java-vm', 'class', u => at(u, 0, '\xca\xfe\xba\xbe'), true],
            ['WebAssembly 模組', 'application/wasm', 'wasm', u => at(u, 0, '\0asm')],
            ['Windows 捷徑（LNK）', 'application/x-ms-shortcut', 'lnk', u => at(u, 0, 'L\0\0\0\x01\x14\x02\0'), true],
            ['SQLite 資料庫', 'application/vnd.sqlite3', 'sqlite db sqlite3', u => at(u, 0, 'SQLite format 3\0')],
            ['OLE2 複合文件（舊版 doc / xls / ppt / msi）', 'application/x-ole-storage', 'doc xls ppt msi msg', u => at(u, 0, '\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1')],
            ['RTF 文件', 'application/rtf', 'rtf', u => at(u, 0, '{\\rtf')],
            ['WOFF 字型', 'font/woff', 'woff', u => at(u, 0, 'wOFF')],
            ['WOFF2 字型', 'font/woff2', 'woff2', u => at(u, 0, 'wOF2')],
            ['TrueType 字型', 'font/ttf', 'ttf', u => at(u, 0, '\0\x01\0\0')],
            ['OpenType 字型', 'font/otf', 'otf', u => at(u, 0, 'OTTO')],
            ['pcap 封包擷取', 'application/vnd.tcpdump.pcap', 'pcap cap', u => at(u, 0, '\xd4\xc3\xb2\xa1') || at(u, 0, '\xa1\xb2\xc3\xd4')],
            ['Apple 二進位 plist', 'application/x-plist', 'plist', u => at(u, 0, 'bplist00')],
            ['PEM 憑證 / 金鑰（文字）', 'application/x-pem-file', 'pem crt cer key', u => head(u).startsWith('-----begin')],
            ['SVG 向量圖', 'image/svg+xml', 'svg', u => { const h = head(u); return h.startsWith('<svg') || (h.startsWith('<?xml') && h.includes('<svg')); }],
            ['XML 文件', 'application/xml', 'xml xhtml rss atom xsl kml gpx plist', u => head(u).startsWith('<?xml')],
            ['HTML 文件', 'text/html', 'html htm', u => /^<(!doctype html|html)/.test(head(u))],
        ].map(([name, mime, exts, test, exec]) => ({ name, mime, exts: exts.split(' '), test, exec: !!exec }));
        const BIN_EXTS = new Set(MAGIC.flatMap(m => m.exts));
        function looksText(u) {
            const s = u.subarray(0, 4096);
            if (!s.length) return false;
            let ctl = 0;
            for (const b of s) { if (b === 0) return false; if ((b < 9 || (b > 13 && b < 32 && b !== 27))) ctl++; }
            return ctl / s.length < 0.02;
        }
        function detectType(u) {
            if (!u.length) return null;
            for (const m of MAGIC) if (m.test(u)) return m;
            if (looksText(u)) {
                let utf8 = true; try { new TextDecoder('utf-8', { fatal: true }).decode(u.subarray(0, 4096), { stream: true }); } catch { utf8 = false; }
                return { name: utf8 ? '純文字（UTF-8 / ASCII）' : '文字（非 UTF-8 編碼，可能是 Big5 等）', mime: 'text/plain', exts: [], exec: false, text: true };
            }
            return null;
        }
        function checkExt(det, filename) {
            const m = /\.([^.\\/]+)$/.exec(String(filename)), ext = m ? m[1].toLowerCase() : '';
            if (!det) return { ext, status: 'unknown' };
            if (det.text) return { ext, status: BIN_EXTS.has(ext) ? 'mismatch' : 'ok' };
            if (!ext) return { ext, status: 'noext' };
            return { ext, status: det.exts.includes(ext) ? 'ok' : 'mismatch' };
        }
        // ---- CRC32 / ZIP ----
        const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
        function crc32(u) { let c = 0xffffffff; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
        const ZIP_METHODS = { 0: '儲存（未壓縮）', 8: 'Deflate', 9: 'Deflate64', 12: 'BZip2', 14: 'LZMA', 93: 'Zstandard', 95: 'XZ', 99: 'AES 加密' };
        const ZIP_MAX_ENTRIES = 20000;
        function decodeName(bytes, utf8Flag) {
            try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch { /* 往下試 */ }
            if (!utf8Flag) { try { return new TextDecoder('big5').decode(bytes); } catch { /* 往下試 */ } }
            return new TextDecoder('latin1').decode(bytes);
        }
        function dosTime(d, t) {

            if (info.chunks.some(c => /EXIF|XMP/.test(c)) || info.chunks.includes('eXIf')) html += '<p class="note">含 EXIF / XMP：請到<a href="exif-viewer.html">照片 EXIF 檢視與清除</a>查看相機與 GPS 資料。</p>';
            html += trail.length
                ? `<div class="alert">圖片結束後還有 ${fmtN(trail.length)} 位元組的附加資料${td ? '，開頭像是「' + esc(td.name) + '」' : ''}。這是常見的藏檔方式（例如圖片後面接 ZIP），也可能只是無害的填充。</div><p class="note">附加資料開頭（可用 Hexdump 跳到 0x${info.end.toString(16)} 看全部）：</p><pre class="code">${esc(hexdump(trail.subarray(0, 256), info.end, 16))}</pre>`
                : '<div class="alert info">圖片結束後沒有附加資料。</div>';
            html += '<h2 style="margin-top:16px">位元平面（LSB）</h2><div id="bp"></div>';
            out.innerHTML = html;
            if (info.kind === 'JPEG') { $('#bp').innerHTML = '<p class="note">JPEG 是失真壓縮，像素的最低位元沒有隱寫意義，不提供位元平面；上方的附加資料與註解檢查仍有效。</p>'; return; }
            try {
                const bmp = await createImageBitmap(new Blob([u]));
                if (g !== gen) return;
                if (bmp.width * bmp.height > 25e6) { $('#bp').innerHTML = '<p class="note">圖片超過 2,500 萬像素，不繪製位元平面。</p>'; return; }
                const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
                const ctx = cv.getContext('2d'); ctx.drawImage(bmp, 0, 0);
                const px = ctx.getImageData(0, 0, cv.width, cv.height), src = px.data;
                $('#bp').innerHTML = '<div class="row"><select id="bpC" aria-label="通道"><option value="4">RGB 三通道</option><option value="0">紅 R</option><option value="1">綠 G</option><option value="2">藍 B</option><option value="3">透明 A</option><option value="9">原圖</option></select><select id="bpB" aria-label="位元">' + [0, 1, 2, 3, 4, 5, 6, 7].map(b => `<option value="${b}">位元 ${b}${b === 0 ? '（最低位 LSB）' : b === 7 ? '（最高位）' : ''}</option>`).join('') + '</select></div><canvas id="bpCv"></canvas><div id="bpTxt"></div>';
                const show = () => {
                    const c = $('#bpCv'), m = +$('#bpC').value; c.width = cv.width; c.height = cv.height;
                    c.getContext('2d').putImageData(m === 9 ? px : new ImageData(bitPlane(src, m, +$('#bpB').value), cv.width, cv.height), 0, 0);
                };
                $('#bpC').onchange = $('#bpB').onchange = show; show();
                const first = lsbExtract(src, 64), r = printableRatio(first), ones = [0, 1, 2].map(c => (lsbOnes(src, c) * 100).toFixed(1) + '%');
                $('#bpTxt').innerHTML = kv([['LSB 為 1 的比例（R / G / B）', ones.join(' / ') + '（天然圖片通常也接近 50%，單看比例不能下結論）'], ['依 R、G、B 讀出的前 64 位元組', `<code>${esc(Array.from(first.subarray(0, 24), hex2).join(' '))} …</code>`],
                ['可讀文字比例', (r * 100).toFixed(0) + '%' + (r > 0.9 ? '：很高，可能藏有文字，試著看看' : '：不像文字')]], 'lbl')
                    + (r > 0.9 ? `<pre class="code wrap">${esc(Array.from(first, b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join(''))}</pre>` : '');
            } catch { $('#bp').innerHTML = '<p class="note">這個瀏覽器無法解碼此圖片，無法繪製位元平面。</p>'; }
        }
    </script>
</body>

</html>
