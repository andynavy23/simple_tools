<!DOCTYPE html>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>文件範本產生器</h1>
        <p class="sub">選範本、照提示填表，即時產生 Markdown。</p>

        <div class="card">
            <label class="f" for="tSel" style="margin-top:0">文件類型</label>
            <select id="tSel" style="width:100%"></select>
            <p class="note" id="tHint"></p>
            <div class="btns">
                <button class="sm" id="tEx">帶入範例</button>
                <button class="sm" id="tClear">清空此範本草稿</button>
            </div>
            <div class="fld" id="tFields"></div>
        </div>
        <div class="card">
            <h2>預覽</h2>
            <div class="btns">
                <button class="sm" id="fMd" aria-pressed="true">Markdown</button>
                <button class="sm" id="fTx" aria-pressed="false">純文字</button>
            </div>
            <div class="code" id="tOut"></div>
            <div class="btns">
                <button class="primary sm" id="tCopy">複製</button>
                <button class="sm" id="tDl">下載檔案</button>
            </div>
            <p class="note bad" id="tErr"></p>
        </div>
        <p class="note"><button class="sm" id="tReset">全部重置</button>　草稿只存在這台裝置，不會上傳。</p>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>13 種常用文件的引導式範本：<b>會議記錄、ADR 決策記錄、PRD、技術設計文件、Bug 報告、事後檢討、API 文件、發版說明、使用者故事、自傳架構、讀後感、簡報大綱、三幕式大綱</b>。填表後即時產生 Markdown，可複製、下載 .md 或轉成純文字。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>開會、寫決策、報 Bug、做檢討時，想要有固定結構、不漏項目。</li>
            <li>不知道自傳、讀後感、劇本該寫什麼，想靠引導問題起頭。</li>
            <li>簡報有固定時間，想檢查每頁分配的分鐘數加起來對不對。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li>上方選文件類型，看「填寫提示」。</li>
            <li>照欄位填；表格式欄位（待辦、方案比較、端點…）可「＋新增一列」與刪除單列。</li>
            <li>下方即時預覽，按「複製」或「下載檔案」。想看輸出長什麼樣，先按「帶入範例」。</li>
            <li>簡報大綱按「依總時間平均分配」可把總分鐘均分到每一頁。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">會議記錄 → # 週會 + 出席 / 議程 / 決議 + 待辦表格（事項 | 負責人 | 期限）
簡報大綱 → 總 20 分鐘、5 頁 → 每頁 4 分鐘；合計不符會標示「差幾分鐘」</div>
        <h3>小提醒</h3>
        <ul>
            <li>表格儲存格內的 <kbd>|</kbd> 會自動逸出、換行會轉成 &lt;br&gt;，不會弄壞表格。</li>
            <li>未填的欄位會輸出「（待補）」，方便之後搜尋補寫。</li>
            <li>資料：自動記住上次選的範本與每個範本的草稿（本機 doct_opts）。每個欄位最多 20000 字、表格最多 100 列，全部草稿合計上限 300KB；超過會提示並停止儲存（內容仍在畫面上，請先複製或清掉別的草稿）。</li>
            <li>清除：「清空此範本草稿」只清目前這個範本；「全部重置」清掉所有草稿與選擇，兩者都先確認、無法復原。「帶入範例」會覆蓋目前草稿（有內容時先確認）。也可用右上角備份。壞資料會自動回到預設。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { copyWithFeedback, store, download } = Util;

        // --- pure ---
        const FIELD_MAX = 20000, ROWS_MAX = 100, TOTAL_MAX = 300 * 1024, PH = '（待補）';
        const T = (s) => String(s == null ? '' : s).trim();
        const escCell = (s) => T(s).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
        const lines = (s) => T(s).split('\n').map(x => x.trim()).filter(Boolean);
        const bl = (s) => lines(s).map(x => '- ' + x.replace(/^[-*•]\s+/, '')).join('\n') || PH;
        const nl = (s) => lines(s).map((x, i) => `${i + 1}. ` + x.replace(/^\d+[.、)]\s*/, '')).join('\n') || PH;
        const cl = (s) => lines(s).map(x => '- [ ] ' + x.replace(/^[-*•]\s+/, '')).join('\n') || PH;
        const para = (s) => T(s) || PH;
        const code = (s, lang = '') => T(s) ? '```' + lang + '\n' + T(s) + '\n```' : PH;
        const trow = (cells) => '| ' + cells.map(escCell).join(' | ') + ' |';
        function tbl(heads, rows) {
            rows = (rows || []).filter(r => Array.isArray(r) && r.some(c => T(c)));
            if (!rows.length) return PH;
            return [trow(heads), trow(heads.map(() => '---')), ...rows.map(r => trow(heads.map((_, i) => r[i])))].join('\n');
        }
        // 標題 + 中繼資料（- 鍵：值）+ 各章節 [標題, 內容]
        function mk(title, def, meta, secs) {
            const m = (meta || []).filter(([, v]) => T(v)).map(([k, v]) => `- ${k}：${T(v)}`).join('\n');
            return `# ${T(title) || def}\n\n` + (m ? m + '\n\n' : '') + secs.map(([h, b]) => `## ${h}\n\n${b}\n`).join('\n');
        }
        // 簡報：平均分配分鐘（餘數從前面幾頁各多 1）與合計檢查
        function allocMinutes(total, n) {
            total = Math.floor(Number(total)); n = Math.floor(n);
            if (!(total > 0) || !(n > 0)) return [];
            const b = Math.floor(total / n), r = total % n;
            return Array.from({ length: n }, (_, i) => b + (i < r ? 1 : 0));
        }
        function slideStats(total, rows) {
            let sum = 0;
            for (const r of rows || []) { const m = Number(T(r && r[1])); if (Number.isFinite(m) && m > 0) sum += m; }
            const t = Number(T(total)) || 0;
            return { sum, total: t, diff: t - sum };
        }
        const slideCheck = (total, rows) => {
            const s = slideStats(total, rows);
            if (!s.total) return '（未填總時間，無法檢查）';
            return s.diff === 0 ? `合計 ${s.sum} 分鐘，與總時間相符。` : `⚠ 合計 ${s.sum} 分鐘，與總時間 ${s.total} 分鐘${s.diff > 0 ? '差少' : '超出'} ${Math.abs(s.diff)} 分鐘。`;
        };

        // 欄位定義：L 單行、A 多行、Sel 下拉、R 表格列（cols 為欄名）
        const L = (k, l, ph = '') => ({ k, l, t: 'line', ph });
        const A = (k, l, ph = '') => ({ k, l, t: 'area', ph });
        const Sel = (k, l, o) => ({ k, l, t: 'sel', o });
        const R = (k, l, cols) => ({ k, l, t: 'rows', cols });

        const TPL = {
            meeting: {
                g: '工作', label: '會議記錄', file: 'meeting-notes',
                hint: '先寫議程與出席，會中記決議；待辦一定要有負責人與期限，否則不會被執行。',
                fields: [L('title', '會議名稱'), L('date', '日期時間'), L('place', '地點 / 連結'), A('attendees', '出席（一行一人）'), A('agenda', '議程（一行一項）'), A('decisions', '決議（一行一項）'), R('actions', '待辦', ['事項', '負責人', '期限'])],
                md: (v) => mk(v.title, '會議記錄', [['日期', v.date], ['地點', v.place]], [['出席', bl(v.attendees)], ['議程', nl(v.agenda)], ['決議', bl(v.decisions)], ['待辦', tbl(['事項', '負責人', '期限'], v.actions)]]),
                ex: { title: '產品週會', date: '2026-10-19 10:00', place: '會議室 A / Meet', attendees: '小明\n小華\n小美', agenda: '上週進度\n發版時程\n風險討論', decisions: '發版延到 10/30\n登入流程改用一次性連結', actions: [['補齊 API 測試', '小明', '10/23'], ['更新發版公告', '小美', '10/25']] },
            },
            adr: {
                g: '工程', label: 'ADR 決策記錄', file: 'adr',
                hint: '一份 ADR 只記一個決策。寫清楚當時的背景與取捨，日後才看得懂「為什麼這樣選」。決策改變時新增一份並把舊的標為 Superseded。',
                fields: [L('title', '決策標題', '例：使用 PostgreSQL 當主資料庫'), L('date', '日期'), Sel('status', 'Status', ['Proposed', 'Accepted', 'Deprecated', 'Superseded']), A('context', 'Context（背景與限制）'), A('decision', 'Decision（決定做什麼）'), A('consequences', 'Consequences（好處、代價、後續）')],
                md: (v) => mk(v.title, 'ADR', [['日期', v.date], ['Status', v.status]], [['Context', para(v.context)], ['Decision', para(v.decision)], ['Consequences', para(v.consequences)]]),
                ex: { title: '使用 PostgreSQL 當主資料庫', date: '2026-10-19', status: 'Accepted', context: '需要交易一致性與 JSON 欄位；團隊已有 PostgreSQL 維運經驗。', decision: '主資料庫採用 PostgreSQL 16，快取用 Redis。', consequences: '好處：生態成熟。代價：水平擴充需額外設計。後續：建立備份與還原演練。' },
            },
            prd: {
                g: '工程', label: 'PRD 產品需求', file: 'prd',
                hint: '先講為什麼做（目標），再講給誰用，需求要能被驗收；「不做項」和需求一樣重要，防止範圍無限膨脹。',
                fields: [L('title', '產品 / 功能名稱'), L('author', '作者'), A('goals', '目標（一行一項）'), A('users', '使用者（誰、在什麼情境）'), R('reqs', '需求', ['需求', '優先級', '說明']), A('accept', '驗收標準（一行一項）'), A('nongoals', '不做項（一行一項）')],
                md: (v) => mk(v.title, 'PRD', [['作者', v.author]], [['目標', bl(v.goals)], ['使用者', para(v.users)], ['需求', tbl(['需求', '優先級', '說明'], v.reqs)], ['驗收標準', cl(v.accept)], ['不做項', bl(v.nongoals)]]),
                ex: { title: '訂單匯出', author: '小明', goals: '客服 1 分鐘內取得對帳資料\n減少人工整理', users: '客服人員：每週對帳時需要整批訂單。', reqs: [['匯出 CSV', 'P0', '可選日期範圍'], ['排程寄送', 'P2', '每週一早上']], accept: '10 萬筆在 30 秒內完成\nCSV 以 Excel 開啟不亂碼', nongoals: '不做 PDF 報表\n不做即時串流' },
            },
            design: {
                g: '工程', label: '技術設計文件', file: 'design-doc',
                hint: '至少比較兩個方案並寫明取捨；風險要有對策；時程用里程碑而不是每日細節。',
                fields: [L('title', '標題'), L('author', '作者'), A('background', '背景與目標'), R('options', '方案比較', ['方案', '優點', '缺點', '結論']), A('chosen', '選定方案與理由'), R('risks', '風險', ['風險', '影響', '對策']), R('timeline', '時程', ['里程碑', '日期', '負責人'])],
                md: (v) => mk(v.title, '技術設計文件', [['作者', v.author]], [['背景', para(v.background)], ['方案比較', tbl(['方案', '優點', '缺點', '結論'], v.options)], ['選定方案', para(v.chosen)], ['風險', tbl(['風險', '影響', '對策'], v.risks)], ['時程', tbl(['里程碑', '日期', '負責人'], v.timeline)]]),
                ex: { title: '通知服務重構', author: '小華', background: '現行通知由主程式同步發送，高峰時拖慢 API。目標：通知延遲 < 5 秒且不影響主流程。', options: [['A 佇列 + worker', '解耦、可重試', '多一個元件', '採用'], ['B 維持同步', '最簡單', '高峰會拖慢', '否決']], chosen: '採方案 A：以訊息佇列非同步發送，失敗重試 3 次。', risks: [['佇列堆積', '通知延遲', '加監控與告警']], timeline: [['原型', '11/05', '小華'], ['上線', '11/30', '小明']] },
            },
            bug: {
                g: '工程', label: 'Bug 報告', file: 'bug-report',
                hint: '重現步驟要讓沒看過的人也能照做；預期與實際分開寫；附上錯誤訊息、截圖檔名或日誌。',
                fields: [L('title', '一句話描述'), Sel('sev', '嚴重度', ['Critical', 'Major', 'Minor', 'Trivial']), A('env', '環境（版本、系統、瀏覽器）'), A('steps', '重現步驟（一行一步）'), A('expected', '預期結果'), A('actual', '實際結果'), A('attach', '附件 / 日誌（一行一項）')],
                md: (v) => mk(v.title, 'Bug 報告', [['嚴重度', v.sev]], [['環境', bl(v.env)], ['重現步驟', nl(v.steps)], ['預期結果', para(v.expected)], ['實際結果', para(v.actual)], ['附件', bl(v.attach)]]),
                ex: { title: '儲存設定後頁面白屏', sev: 'Major', env: 'v2.3.1\nWindows 11\nEdge 130', steps: '開啟設定頁\n把語言改成英文\n按儲存', expected: '顯示「已儲存」並留在設定頁。', actual: '頁面變成全白，Console 出現 TypeError。', attach: 'console.log\nscreenshot-1.png' },
            },
            postmortem: {
                g: '工程', label: '事後檢討 Postmortem', file: 'postmortem',
                hint: '對事不對人。時間線用事實、寫到分鐘；根因問到「為什麼」直到流程或系統層；改善項目要有負責人與期限。',
                fields: [L('title', '事件名稱'), L('date', '發生日期'), A('summary', '摘要'), A('impact', '影響（範圍、時長、客戶、金額）'), R('timeline', '時間線', ['時間', '事件']), A('root', '根因'), A('worked', '做得好的地方（一行一項）'), R('actions', '改善項目', ['項目', '負責人', '期限'])],
                md: (v) => mk(v.title, '事後檢討', [['日期', v.date]], [['摘要', para(v.summary)], ['影響', para(v.impact)], ['時間線', tbl(['時間', '事件'], v.timeline)], ['根因', para(v.root)], ['做得好的地方', bl(v.worked)], ['改善項目', tbl(['項目', '負責人', '期限'], v.actions)]]),
                ex: { title: '資料庫連線耗盡導致服務中斷', date: '2026-10-12', summary: '結帳服務中斷 38 分鐘。', impact: '約 1,200 筆訂單失敗；客服接到 40 通來電。', timeline: [['14:02', '告警：錯誤率上升'], ['14:10', '確認連線池耗盡'], ['14:40', '重啟並調高上限，恢復']], root: '新功能漏關連線，加上連線池上限沒有告警。', worked: '10 分鐘內有人接手\n客服即時公告', actions: [['加入連線洩漏檢查', '小明', '10/26'], ['連線池使用率告警', '小華', '10/20']] },
            },
            api: {
                g: '工程', label: 'API 文件', file: 'api-doc',
                hint: '先列端點總表，再補參數、請求與回應範例（貼 JSON）、錯誤碼。範例要可直接複製使用。',
                fields: [L('title', 'API 名稱'), L('base', 'Base URL'), R('endpoints', '端點', ['方法', '路徑', '說明']), R('params', '參數', ['參數', '型別', '必填', '說明']), A('req', '請求範例（JSON）'), A('res', '回應範例（JSON）'), R('errors', '錯誤碼', ['狀態碼', '代碼', '說明'])],
                md: (v) => mk(v.title, 'API 文件', [['Base URL', v.base]], [['端點', tbl(['方法', '路徑', '說明'], v.endpoints)], ['參數', tbl(['參數', '型別', '必填', '說明'], v.params)], ['請求範例', code(v.req, 'json')], ['回應範例', code(v.res, 'json')], ['錯誤碼', tbl(['狀態碼', '代碼', '說明'], v.errors)]]),
                ex: { title: '訂單 API', base: 'https://api.example.com/v1', endpoints: [['GET', '/orders', '訂單列表'], ['POST', '/orders', '建立訂單']], params: [['status', 'string', '否', 'open | closed | a|b 皆可'], ['limit', 'int', '否', '預設 20，最大 100']], req: '{ "item": "A001", "qty": 2 }', res: '{ "id": 123, "status": "open" }', errors: [['400', 'bad_request', '參數格式錯誤'], ['404', 'not_found', '訂單不存在']] },
            },
            release: {
                g: '工程', label: '發版說明 Release Notes', file: 'release-notes',
                hint: '用使用者看得懂的話，不寫內部代號。升級注意（破壞性變更、需手動動作）要放顯眼處。',
                fields: [L('version', '版本號', '例：v2.4.0'), L('date', '發佈日期'), A('added', '新增（一行一項）'), A('fixed', '修正（一行一項）'), A('known', '已知問題（一行一項）'), A('upgrade', '升級注意（一行一項）')],
                md: (v) => mk('發版說明 ' + T(v.version), '發版說明', [['日期', v.date]], [['新增', bl(v.added)], ['修正', bl(v.fixed)], ['已知問題', bl(v.known)], ['升級注意', bl(v.upgrade)]]),
                ex: { version: 'v2.4.0', date: '2026-10-19', added: '訂單可匯出 CSV\n新增深色模式', fixed: '修正儲存設定後白屏\n修正日期在月底顯示錯誤', known: 'Safari 匯出檔名有時為亂碼', upgrade: '設定檔欄位 timeout 改名為 timeoutMs，升級前請先更新' },
            },
            story: {
                g: '工程', label: '使用者故事', file: 'user-story',
                hint: '一句話說「誰、要什麼、為什麼」；驗收條件用 Given（前提）/ When（動作）/ Then（結果），每條只驗一件事。',
                fields: [L('title', '故事標題'), L('role', 'As a（角色）'), L('want', 'I want（想做什麼）'), L('why', 'So that（為了什麼）'), R('criteria', '驗收條件', ['Given', 'When', 'Then'])],
                md: (v) => {
                    const c = (v.criteria || []).filter(r => Array.isArray(r) && r.some(x => T(x)));
                    return mk(v.title, '使用者故事', [], [['故事', `- As a ${T(v.role) || PH}\n- I want ${T(v.want) || PH}\n- So that ${T(v.why) || PH}`], ['驗收條件', c.length ? c.map((r, i) => `${i + 1}. Given ${T(r[0]) || PH}, When ${T(r[1]) || PH}, Then ${T(r[2]) || PH}`).join('\n') : PH]]);
                },
                ex: { title: '重設密碼', role: '忘記密碼的使用者', want: '用 Email 收到重設連結', why: '不必聯絡客服就能重新登入', criteria: [['使用者在登入頁按「忘記密碼」', '輸入已註冊的 Email 並送出', '收到含一次性連結的信'], ['連結已超過 30 分鐘', '使用者點擊連結', '顯示已過期並可重新申請']] },
            },
            autobio: {
                g: '個人', label: '自傳架構', file: 'autobiography',
                hint: '每段用欄位裡的引導問題起頭，先寫事實與例子，再寫想法。求職自傳建議把重心放在「經歷」與「未來」，並呼應目標職務。',
                fields: [L('name', '姓名'), A('intro', '開場：一句話介紹自己', '你是誰？最想讓人記住的特質？'), A('family', '成長與家庭', '什麼環境塑造了你？對你影響最大的人或事？'), A('school', '求學與學習', '你學了什麼？有哪段學習讓你成長？'), A('work', '經歷與成就', '做過什麼？遇過什麼困難？怎麼解決？成果可量化嗎？'), A('turn', '轉折與反思', '哪次失敗或選擇改變了你？學到什麼？'), A('value', '價值觀與特質', '你重視什麼？朋友怎麼形容你？用一件事證明'), A('future', '未來與目標', '接下來三到五年想做什麼？為什麼是這個領域 / 公司？')],
                md: (v) => mk('自傳｜' + T(v.name), '自傳', [], [['開場', para(v.intro)], ['成長與家庭', para(v.family)], ['求學與學習', para(v.school)], ['經歷與成就', para(v.work)], ['轉折與反思', para(v.turn)], ['價值觀與特質', para(v.value)], ['未來與目標', para(v.future)]]),
                ex: { name: '王小明', intro: '我是一個喜歡把複雜問題拆小的人。', family: '在小店長大，從小看父母記帳，養成對數字的敏感。', school: '資工系畢業，專題做庫存系統，第一次體會需求變更的威力。', work: '三年後端經驗，把報表產生時間從 10 分鐘降到 40 秒。', turn: '一次上線事故讓我學會寫事後檢討與先做監控。', value: '重視可維護性；同事說我「會把話講清楚」。', future: '希望五年內帶領小組，把工程品質制度化。' },
            },
            review: {
                g: '個人', label: '讀後感', file: 'book-review',
                hint: '摘要用自己的話寫、不超過一段；啟發要具體（哪一段、為什麼）；行動要小到明天就能做。',
                fields: [L('book', '書名'), L('author', '作者'), A('summary', '摘要（用自己的話）'), A('insight', '啟發（一行一項）'), A('quotes', '摘錄（一行一句，含頁碼）'), A('actions', '行動（一行一項）')],
                md: (v) => mk(v.book, '讀後感', [['作者', v.author]], [['摘要', para(v.summary)], ['啟發', bl(v.insight)], ['摘錄', bl(v.quotes)], ['行動', cl(v.actions)]]),
                ex: { book: '原子習慣', author: 'James Clear', summary: '把目標縮成極小的習慣，並用環境設計讓它自動發生。', insight: '身分認同比目標更能驅動行為\n兩分鐘法則降低開始的阻力', quotes: '你不會升到目標的高度，只會降到系統的水準。（p.27）', actions: '每天睡前讀 2 頁\n把跑鞋放在門口' },
            },
            slides: {
                g: '寫作', label: '簡報大綱', file: 'slides-outline',
                hint: '先定總時間與聽眾，再切頁。經驗法則：每頁約 1–3 分鐘，開場與結尾各留一頁。合計分鐘會即時檢查；也可「依總時間平均分配」再微調。',
                fields: [L('topic', '主題'), L('audience', '聽眾'), L('total', '總時間（分鐘）'), R('slides', '每頁標題與分鐘', ['標題', '分鐘'])],
                alloc: 'slides',
                md: (v) => {
                    const rows = (v.slides || []).filter(r => Array.isArray(r) && r.some(x => T(x)));
                    const body = rows.length ? rows.map((r, i) => `${i + 1}. ${T(r[0]) || PH}（${T(r[1]) || '?'} 分鐘）`).join('\n') : PH;
                    return mk(v.topic, '簡報大綱', [['聽眾', v.audience], ['總時間', T(v.total) ? T(v.total) + ' 分鐘' : '']], [['大綱', body], ['時間檢查', slideCheck(v.total, rows)]]);
                },
                ex: { topic: '季度成果報告', audience: '部門主管', total: '20', slides: [['開場與重點結論', '2'], ['目標達成情況', '5'], ['重大事件回顧', '5'], ['下季計畫', '5'], ['Q&A', '3']] },
            },
            threeact: {
                g: '寫作', label: '三幕式大綱', file: 'three-act',
                hint: '第一幕建立人物與世界，結尾轉折把主角推進衝突；第二幕對抗與升級，中點改變局勢；第三幕高潮與結局。每個轉折點寫成「發生了什麼事、迫使主角做什麼」。',
                fields: [L('title', '作品名稱'), A('logline', '一句話概要（主角、目標、阻礙）'), A('act1', '第一幕：設定'), A('plot1', '轉折點一（進入第二幕）'), A('act2', '第二幕：對抗'), A('mid', '中點'), A('plot2', '轉折點二（最低點 / 進入第三幕）'), A('act3', '第三幕：結局（高潮與收尾）')],
                md: (v) => mk(v.title, '三幕式大綱', [['概要', v.logline]], [['第一幕：設定', para(v.act1)], ['轉折點一', para(v.plot1)], ['第二幕：對抗', para(v.act2)], ['中點', para(v.mid)], ['轉折點二', para(v.plot2)], ['第三幕：結局', para(v.act3)]]),
                ex: { title: '最後一班車', logline: '末班車司機為了救女兒，必須在天亮前讓全車乘客相信一個謊。', act1: '介紹司機的日常與女兒的病況；收到神秘來電。', plot1: '來電者要求改道，否則女兒有危險。', act2: '司機一邊應付乘客與來電者，一邊暗中求援，局勢逐步升級。', mid: '發現來電者其實是乘客之一。', plot2: '求援失敗，司機決定孤注一擲、放棄原定計畫。', act3: '正面對質、化解危機，天亮抵達終點站。' },
            },
        };
        const GROUPS = ['工作', '工程', '個人', '寫作'];

        const emptyVals = (tpl) => Object.fromEntries(tpl.fields.map(f => [f.k, f.t === 'rows' ? [f.cols.map(() => '')] : f.t === 'sel' ? f.o[0] : '']));
        // 驗證草稿：型別不對回預設；文字截到 20000 字、表格最多 100 列
        function cleanVals(tpl, raw) {
            const out = emptyVals(tpl);
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
            for (const f of tpl.fields) {
                const v = raw[f.k];
                if (f.t === 'sel') { if (typeof v === 'string' && f.o.includes(v)) out[f.k] = v; }
                else if (f.t === 'rows') {
                    if (Array.isArray(v)) {
                        const rows = v.filter(Array.isArray).slice(0, ROWS_MAX).map(r => f.cols.map((_, i) => typeof r[i] === 'string' ? r[i].slice(0, FIELD_MAX) : ''));
                        out[f.k] = rows.length ? rows : out[f.k];
                    }
                } else if (typeof v === 'string') out[f.k] = v.slice(0, FIELD_MAX);
            }
            return out;
        }
        const hasContent = (tpl, vals) => tpl.fields.some(f => f.t === 'rows' ? (vals[f.k] || []).some(r => r.some(c => T(c))) : f.t === 'sel' ? false : T(vals[f.k]));
        // 讀回儲存的狀態：{ type, drafts:{範本: 值} }
        function loadOpts(raw) {
            const out = { type: 'meeting', drafts: {} };
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
            if (typeof raw.type === 'string' && raw.type in TPL) out.type = raw.type;
            const d = raw.drafts && typeof raw.drafts === 'object' && !Array.isArray(raw.drafts) ? raw.drafts : {};
            for (const k of Object.keys(TPL)) if (d[k] && typeof d[k] === 'object') out.drafts[k] = cleanVals(TPL[k], d[k]);
            return out;
        }
        const sizeBytes = (s) => new TextEncoder().encode(JSON.stringify(s)).length;
        const overLimit = (s) => sizeBytes(s) > TOTAL_MAX;

        // 純文字：去掉 Markdown 記號；表格每列用「 / 」串起
        function toPlain(md) {
            return String(md).split('\n').filter(l => !/^\|(\s*-{3}\s*\|)+\s*$/.test(l)).map(l => {
                if (/^\|.*\|$/.test(l)) return l.slice(1, -1).split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|').replace(/<br>/g, ' ')).join(' / ');
                return l.replace(/^#{1,6}\s+/, '').replace(/^- \[ \] /, '□ ').replace(/^```.*$/, '');
            }).join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
        let S0 = loadOpts(store.get('doct_opts', null)), cur = null, fmt = 'md', outText = '';
        const tpl = () => TPL[S0.type];

        function persist() {
            S0.drafts[S0.type] = cur;
            if (overLimit(S0)) { $('#tErr').textContent = '草稿合計超過 300KB 上限，這次變更沒有儲存。請先複製內容，或清掉其他範本的草稿。'; return; }
            $('#tErr').textContent = '';
            store.set('doct_opts', S0);
        }
        function rowsUI(f) {
            const box = el('div'), draw = () => {
                box.replaceChildren();
                cur[f.k].forEach((row, ri) => {
                    const r = el('div', { className: 'row' });
                    r.append(el('div', { className: 'hd' }, `第 ${ri + 1} 列`, el('button', { className: 'sm', textContent: '刪除', onclick: () => { cur[f.k].splice(ri, 1); if (!cur[f.k].length) cur[f.k].push(f.cols.map(() => '')); persist(); draw(); render(); } })));
                    f.cols.forEach((c, ci) => {
                        r.append(el('label', { className: 'f', textContent: c }));
                        const inp = el('input', { type: 'text', value: row[ci], maxLength: FIELD_MAX, autocomplete: 'off', inputMode: 'text' });
                        inp.addEventListener('input', () => { row[ci] = inp.value; persist(); render(); });
                        r.append(inp);
                    });
                    box.append(r);
                });
                const b = el('div', { className: 'btns' }, el('button', { className: 'sm', textContent: '＋新增一列', onclick: () => { if (cur[f.k].length >= ROWS_MAX) { $('#tErr').textContent = `最多 ${ROWS_MAX} 列`; return; } cur[f.k].push(f.cols.map(() => '')); persist(); draw(); } }));
                if (tpl().alloc === 'slides') b.append(el('button', { className: 'sm', textContent: '依總時間平均分配', onclick: () => {
                    const rows = cur[f.k].filter(r => T(r[0])), m = allocMinutes(cur.total, rows.length);
                    if (!m.length) { $('#tErr').textContent = '請先填總時間（正整數分鐘）並至少一頁標題'; return; }
                    rows.forEach((r, i) => r[1] = String(m[i])); persist(); draw(); render();
                } }));
                box.append(b);
            };
            draw(); return box;
        }
        function renderFields() {
            const t = tpl(), box = $('#tFields');
            cur = cleanVals(t, S0.drafts[S0.type]);
            $('#tHint').textContent = '填寫提示：' + t.hint;
            box.replaceChildren();
            for (const f of t.fields) {
                const id = 'f_' + f.k;
                box.append(el('label', { className: 'f', htmlFor: id, textContent: f.l }));
                if (f.t === 'rows') { box.append(rowsUI(f)); continue; }
                let inp;
                if (f.t === 'sel') { inp = el('select', { id }); f.o.forEach(o => inp.append(new Option(o, o))); inp.value = cur[f.k]; }
                else if (f.t === 'area') inp = el('textarea', { id, value: cur[f.k], maxLength: FIELD_MAX, placeholder: f.ph });
                else inp = el('input', { id, type: 'text', value: cur[f.k], maxLength: FIELD_MAX, placeholder: f.ph, autocomplete: 'off' });
                const upd = () => { cur[f.k] = inp.value; persist(); render(); };
                inp.addEventListener('input', upd); inp.addEventListener('change', upd);
                box.append(inp);
            }
            render();
        }
        function render() {
            const md = tpl().md(cur);
            outText = fmt === 'md' ? md : toPlain(md);
            $('#tOut').textContent = outText;
        }
        const setFmt = (f) => { fmt = f; $('#fMd').setAttribute('aria-pressed', f === 'md'); $('#fTx').setAttribute('aria-pressed', f === 'tx'); render(); };
        $('#fMd').onclick = () => setFmt('md'); $('#fTx').onclick = () => setFmt('tx');
        $('#tCopy').onclick = () => copyWithFeedback($('#tCopy'), outText);
        $('#tDl').onclick = () => download(new Blob([outText], { type: 'text/plain;charset=utf-8' }), tpl().file + (fmt === 'md' ? '.md' : '.txt'));

        for (const g of GROUPS) {
            const og = el('optgroup', { label: g });
            for (const [k, t] of Object.entries(TPL)) if (t.g === g) og.append(new Option(t.label, k));
            $('#tSel').append(og);
        }
        $('#tSel').value = S0.type;
        $('#tSel').addEventListener('change', () => { persist(); S0.type = $('#tSel').value; store.set('doct_opts', S0); renderFields(); });
        $('#tEx').onclick = () => {
            if (hasContent(tpl(), cur) && !confirm('帶入範例會覆蓋目前這個範本的草稿，無法復原。要繼續嗎？')) return;
            cur = cleanVals(tpl(), tpl().ex); persist(); renderFields();
        };
        $('#tClear').onclick = () => {
            if (!confirm('要清空「' + tpl().label + '」的草稿嗎？（只清這個範本，無法復原）')) return;
            delete S0.drafts[S0.type]; $('#tErr').textContent = ''; store.set('doct_opts', S0); renderFields();
        };
        $('#tReset').onclick = () => {
            if (!confirm('要清除所有範本的草稿與上次的選擇嗎？（無法復原）')) return;
            try { localStorage.removeItem('doct_opts'); } catch (e) { /* 無痕 */ }
            S0 = loadOpts(null); $('#tSel').value = S0.type; $('#tErr').textContent = ''; renderFields();
        };
        renderFields();
    </script>
</body>

</html>
