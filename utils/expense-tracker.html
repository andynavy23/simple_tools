<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="記帳本：資料只存在你的瀏覽器，記收支、分類、月統計，並可匯出 CSV。">
    <meta property="og:title" content="記帳本" />
    <meta property="og:description" content="離線記帳，月統計與分類佔比，可匯出 CSV。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/expense-tracker.html" />
    <meta name="st-keys" content="expenses,expense_fixed,fx_cache">
    <title>記帳本</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .row input[type=text] {
            flex: 1 1 120px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .nav button {
            min-width: 44px;
        }

        .nav b {
            font-size: 18px;
        }

        .bar {
            height: 8px;
            border-radius: 4px;
            background: var(--fill);
            margin-top: 4px;
            overflow: hidden;
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--blue);
        }

        .cat {
            display: block;
            padding: 6px 0;
        }

        .cat div {
            display: flex;
            justify-content: space-between;
        }

        .amt.in {
            color: var(--ok);
        }

        #fxRow input {
            flex: 0 1 110px;
        }

        .item .main small.fxline {
            color: var(--text);
            white-space: normal;
        }

        .del {
            padding: 2px 10px;
            font-size: 13px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--fill);
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item .main {
            flex: 1;
            min-width: 0;
        }

        .item .main small {
            display: block;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>記帳本</h1>
        <p class="sub">資料只存在這個瀏覽器的 localStorage，不會上傳。換瀏覽器或清除網站資料會消失，請定期匯出。</p>

        <div class="card">
            <div class="row">
                <select id="type" aria-label="收支"><option value="out">支出</option><option value="in">收入</option></select>
                <input type="number" id="amt" min="0" step="any" placeholder="金額" style="width:110px" aria-label="金額">
                <select id="cat" aria-label="分類"></select>
                <select id="cur" aria-label="幣別"></select>
            </div>
            <div class="row" id="fxRow" hidden>
                <label class="muted" for="rate">匯率（1 外幣 = ? 台幣）</label>
                <input type="number" id="rate" min="0" step="any" placeholder="匯率" style="width:110px" aria-label="匯率：1 外幣等於多少台幣">
                <span class="muted" id="fxNote"></span>
            </div>
            <div class="row">
                <input type="date" id="date" aria-label="日期">
                <input type="text" id="note" maxlength="30" placeholder="備註（選填）" aria-label="備註">
                <button class="primary" id="add">新增</button>
            </div>
        </div>

        <div class="card">
            <div class="nav"><button class="sm" id="prev" aria-label="上個月">‹</button><b id="ym"></b><button class="sm" id="next" aria-label="下個月">›</button></div>
            <div id="sum"></div>
        </div>

        <div class="card">
            <h2>固定支出 / 訂閱 <span class="muted" id="fixTotal" style="font-weight:400;font-size:14px"></span></h2>
            <div id="fixList"></div>
            <div class="row" style="margin-top:10px">
                <input type="text" id="fname" maxlength="20" placeholder="名稱，例如 Netflix" style="width:150px" aria-label="固定支出名稱">
                <input type="number" id="famt" min="0" step="any" placeholder="金額" style="width:90px" aria-label="固定支出金額">
                <select id="fcycle" aria-label="週期"><option value="month">每月</option><option value="year">每年</option><option value="week">每週</option></select>
                <input type="date" id="fstart" aria-label="第一次扣款日">
                <button class="primary" id="fadd">新增</button>
            </div>
            <div class="row"><button class="sm" id="fpost">把本月已到期的記入明細</button><span class="muted" id="fmsg"></span></div>
        </div>

        <div class="card">
            <h2>支出分類</h2>
            <div id="cats"></div>
        </div>

        <div class="card">
            <h2>本月明細</h2>
            <div id="list"></div>
            <div class="row" style="margin-top:10px"><button class="sm" id="export">匯出全部 CSV</button><button class="sm" id="prune">刪除一年前的紀錄</button><button class="sm" id="clear">清除全部資料</button></div>
        </div>
    </div>


    <template id="help">
        <h3>這是什麼</h3>
        <p>簡單的記帳本：記每天的收入與支出，按月份看收支結餘與支出分類，也能管理房租、訂閱這類「固定支出」。出國消費可用外幣記帳，記下當下匯率換算成台幣。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>每天隨手記一筆午餐、交通費，月底看錢花去哪。</li>
        <li>旅行時用日圓、美金等外幣刷卡，回國後想看「當時」實際花多少台幣。</li>
        <li>把 Netflix、保險、房租列成清單，一眼看出每月、每年固定要付多少。</li>
        <li>想把資料帶到試算表整理，匯出 CSV。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>最上面選「支出」或「收入」，填金額、選分類與日期，備註可不填，按「新增」。</li>
        <li>外幣：在「幣別」選 USD、JPY…，金額欄就是外幣金額；匯率欄會帶入「匯率換算器」存的最近匯率（1 外幣 = 多少台幣），可手動改。按「新增」後匯率與台幣金額就鎖定，之後統計都用台幣。</li>
        <li>如果顯示「離線無匯率，請手動輸入」，代表沒有匯率快取或超過 7 天：先到「單位換算 → 匯率」開一次（需要網路），或自己在匯率欄填。這一頁本身不連網。</li>
        <li>用「‹ ›」切換月份，看該月收入、支出與結餘，以及「支出分類」比例；外幣明細會多一行「¥1,200 ≈ NT$260（匯率 0.2167）」。</li>
        <li>固定支出：填名稱、金額（台幣）、週期與第一次扣款日，按「新增」；「把本月已到期的記入明細」會自動記成支出。</li>
        <li>「匯出全部 CSV」多出幣別、外幣金額、匯率三欄（台幣明細幣別是 TWD）；「刪除一年前的紀錄」、「清除全部資料」會先確認。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">幣別選 JPY、金額 1200、匯率 0.2167、分類「購物」→ 按「新增」
        → 明細顯示「¥1,200 ≈ NT$260（匯率 0.2167）」，本月支出加 260.04
        → 之後匯率變動，這筆仍然是 260.04 元</div>
        <h3>小提醒</h3>
        <ul>
        <li>資料只存在這個瀏覽器，不會上傳；換瀏覽器或清除網站資料會消失，請定期匯出。明細最多 20,000 筆、固定支出最多 200 項；刪除固定支出不會刪掉已記入的明細。</li>
        <li>匯率範圍 0.0001–100000；外幣金額換算後要至少 0.01 元。舊的只有台幣的明細完全相容，缺外幣欄位的視為 TWD。</li>
        <li>匯率只供記帳參考，不等於信用卡實際請款金額（有手續費與結算日差異）。</li>
        <li>備份會一併包含「匯率快取」這個資料；還原時若外幣資料壞掉，會保留台幣金額、丟掉外幣資訊。</li>
        <li>金額欄或備註欄按 <kbd>Enter</kbd> 可直接新增。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { rnd, store, day, statRow, download } = Util;

        // --- pure ---
        const OUT_CATS = ['餐飲', '交通', '購物', '娛樂', '居住', '醫療', '教育', '其他'];
        const IN_CATS = ['薪資', '獎金', '投資', '其他'];

        const MAX_ENTRIES = 20000, MAX_FIXED = 200;
        const validEntry = (e) => !!e && typeof e.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && Number.isFinite(e.amt) && e.amt > 0 && e.amt < 1e12
            && (e.type === 'in' || e.type === 'out') && typeof e.cat === 'string' && typeof e.note === 'string';

        // 某個月（YYYY-MM）的收支、分類統計與明細（日期新到舊）
        function summarize(entries, ym) {
            const list = entries.filter(e => e.d.startsWith(ym)).sort((a, b) => b.d.localeCompare(a.d) || b.id.localeCompare(a.id));
            const income = list.filter(e => e.type === 'in').reduce((a, e) => a + e.amt, 0);
            const by = {};
            list.filter(e => e.type === 'out').forEach(e => { by[e.cat] = (by[e.cat] || 0) + e.amt; });
            const expense = Object.values(by).reduce((a, b) => a + b, 0);
            return { list, income, expense, balance: income - expense, byCat: Object.entries(by).sort((a, b) => b[1] - a[1]) };
        }

        // 刪除某日（YYYY-MM-DD）以前的明細，保留當天與之後
        const pruneBefore = (entries, cutoff) => entries.filter(e => e.d >= cutoff);

        // CSV（RFC 4180 引號跳脫）；開頭是 = + - @ 的文字前面補單引號，避免在試算表中被當成公式
        // fxCols = true 時多三欄：幣別 / 外幣金額 / 匯率（台幣明細的幣別是 TWD，後兩欄留空）；「金額」一律是台幣
        function toCSV(entries, fxCols = false) {
            const cell = (v) => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
            const fx = (e) => (e.cur && e.fx ? [e.cur, e.fx, e.rate] : ['TWD', '', '']);
            const rows = [['日期', '收支', '分類', '金額', '備註', ...(fxCols ? ['幣別', '外幣金額', '匯率'] : [])], ...[...entries].sort((a, b) => a.d.localeCompare(b.d)).map(e => [e.d, e.type === 'in' ? '收入' : '支出', e.cat, e.amt, e.note, ...(fxCols ? fx(e) : [])])];
            return rows.map(r => r.map(cell).join(',')).join('\r\n');
        }

        // ---------- 外幣記帳 ----------
        // 明細可選帶 cur（幣別）、fx（外幣金額）、rate（記帳當下 1 外幣 = 多少台幣，鎖定不再變）；amt 一律是台幣。舊資料沒有這三欄 = TWD
        const CURRENCIES = { TWD: ['新台幣', 'NT$'], USD: ['美元', 'US$'], JPY: ['日圓', '¥'], EUR: ['歐元', '€'], KRW: ['韓元', '₩'], CNY: ['人民幣', 'CN¥'], HKD: ['港幣', 'HK$'], GBP: ['英鎊', '£'], AUD: ['澳幣', 'A$'], THB: ['泰銖', '฿'], SGD: ['新加坡幣', 'S$'], CAD: ['加幣', 'C$'], NZD: ['紐幣', 'NZ$'], CHF: ['瑞士法郎', 'CHF '], MYR: ['馬來幣', 'RM'], PHP: ['披索', '₱'], VND: ['越南盾', '₫'], IDR: ['印尼盾', 'Rp'] };
        const MAX_AGE = 7 * 86400e3;                                       // 匯率快取超過 7 天就不用，改手動輸入
        const validRate = (r) => typeof r === 'number' && Number.isFinite(r) && r >= 1e-4 && r <= 1e5;
        // 從 unit-converter 的 fx_cache（{ rates: { 幣別: 1 台幣可換多少該幣 }, fetched }）算出「1 外幣 = 多少台幣」；快取壞掉 / 太舊 / 沒這個幣別 → null
        function fxRate(cache, cur, now) {
            if (!(cur in CURRENCIES)) return null;
            if (cur === 'TWD') return 1;
            if (!cache || typeof cache !== 'object' || !cache.rates || typeof cache.rates !== 'object' || !Number.isFinite(cache.fetched)) return null;
            if (now - cache.fetched > MAX_AGE || cache.fetched - now > 864e5) return null;
            const per = cache.rates[cur];
            return typeof per === 'number' && per > 0 && validRate(1 / per) ? 1 / per : null;
        }
        // 外幣金額 × 匯率 → 台幣（四捨五入到分）；金額 / 匯率不合法或換算後不足 0.01 → null
        function toTwd(fx, rate) {
            if (typeof fx !== 'number' || !Number.isFinite(fx) || fx <= 0 || fx >= 1e12 || !validRate(rate)) return null;
            const t = Math.round(fx * rate * 100) / 100;
            return t >= 0.01 && t < 1e12 ? t : null;
        }
        // 讀取舊資料 / 備份還原時：外幣欄位不完整或不合法就丟掉，只留台幣金額（不弄丟帳）
        function cleanFx(e) {
            if (e.cur === undefined && e.fx === undefined && e.rate === undefined) return e;
            const { cur, fx, rate, ...rest } = e;
            return typeof cur === 'string' && cur !== 'TWD' && cur in CURRENCIES && typeof fx === 'number' && Number.isFinite(fx) && fx > 0 && fx < 1e12 && validRate(rate) ? { ...rest, cur, fx, rate } : rest;
        }
        const numFmt = (n, d) => n.toLocaleString('en-US', { maximumFractionDigits: d });
        // 明細列的說明：「¥1,200 ≈ NT$260（匯率 0.2167）」；台幣明細回傳空字串
        const fmtFx = (e) => (e.cur && e.fx ? `${CURRENCIES[e.cur][1]}${numFmt(e.fx, 2)} ≈ NT$${numFmt(e.amt, 1)}（匯率 ${e.rate}）` : '');

        // ---------- 固定支出 / 訂閱 ----------
        // item = { id, name, amt, cycle: 'week' | 'month' | 'year', start: 'YYYY-MM-DD'（第一次扣款日） }
        const CYCLES = { week: '每週', month: '每月', year: '每年' };
        const validFixed = (f) => !!f && typeof f.id === 'string' && typeof f.name === 'string' && f.name.length >= 1 && f.name.length <= 20 && Number.isFinite(f.amt) && f.amt > 0 && f.amt < 1e9
            && f.cycle in CYCLES && /^\d{4}-\d{2}-\d{2}$/.test(f.start);
        // 第 k 次扣款日（k 從 0 起算）；月 / 年週期遇到 31 日這類月底會取該月最後一天
        const dueAt = (f, k) => (f.cycle === 'week' ? day.shift(f.start, 7 * k) : day.addMonths(f.start, (f.cycle === 'year' ? 12 : 1) * k));
        // 從 from（含）起的下一個扣款日
        function nextDue(f, from) {
            let k = 0;
            if (from > f.start) { const approx = f.cycle === 'week' ? Math.floor(day.between(f.start, from) / 7) : Math.floor(day.between(f.start, from) / (f.cycle === 'year' ? 366 : 31)); k = Math.max(0, approx - 1); }
            while (dueAt(f, k) < from) k++;
            return dueAt(f, k);
        }
        // 折合每月金額（週 = 一年 52 週 ÷ 12）
        const monthlyCost = (f) => (f.cycle === 'week' ? f.amt * 52 / 12 : f.cycle === 'year' ? f.amt / 12 : f.amt);
        // 某個月（YYYY-MM）內所有的扣款日
        function dueInMonth(f, ym) {
            const out = [];
            for (let d = nextDue(f, ym + '-01'); d.slice(0, 7) === ym; d = nextDue(f, day.shift(d, 1))) out.push(d);
            return out;
        }

        const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number), t = y * 12 + m - 1 + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; };
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const money = (n) => Math.round(n * 100) / 100 === Math.round(n) ? Math.round(n).toLocaleString('zh-TW') : n.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
        const arr = (v) => (Array.isArray(v) ? v : []);
        const warn = (t) => Chrome.toast(t, 4000, 'bad');
        const put = (k, v) => Util.store.set(k, v);
        let entries = arr(store.get('expenses', [])).filter(validEntry).map(cleanFx);
        let ym = day.today().slice(0, 7);
        $('#date').value = day.today();

        let fixed = arr(store.get('expense_fixed', [])).filter(validFixed);
        $('#fstart').value = day.today();
        const save = () => put('expenses', entries);
        const saveFixed = () => put('expense_fixed', fixed);

        function renderFixed() {
            const today = day.today(), total = fixed.reduce((a, f) => a + monthlyCost(f), 0);
            $('#fixTotal').textContent = fixed.length ? `（每月約 ${money(total)}、每年約 ${money(total * 12)}）` : '';
            $('#fixList').replaceChildren(...(fixed.length ? [...fixed].sort((a, b) => nextDue(a, today).localeCompare(nextDue(b, today))).map(f => {
                const r = document.createElement('div'); r.className = 'li';
                const nd = nextDue(f, today), left = day.between(today, nd);
                const main = document.createElement('div'); main.style.flex = '1';
                main.append(Object.assign(document.createElement('div'), { textContent: f.name }), Object.assign(document.createElement('small'), { className: 'muted', textContent: `${CYCLES[f.cycle]} ${money(f.amt)}　下次 ${nd.slice(5)}（${left === 0 ? '今天' : left + ' 天後'}）` }));
                const x = Object.assign(document.createElement('button'), { className: 'sm', textContent: '刪除' });
                x.setAttribute('aria-label', '刪除固定支出 ' + f.name);
                x.onclick = () => { if (!confirm(`刪除固定支出「${f.name}」？已記入明細的紀錄會保留。`)) return; fixed = fixed.filter(y => y.id !== f.id); saveFixed(); renderFixed(); };
                r.append(main, x); return r;
            }) : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '還沒有固定支出（房租、訂閱、保險…都可以記）' })]));
        }
        // 把本月（目前檢視的月份）已經到期的扣款記進明細；每筆用 rid 去重，重複按不會重複記
        function postFixed() {
            const today = day.today(); let n = 0;
            for (const f of fixed) for (const d of dueInMonth(f, ym)) {
                const rid = `${f.id}:${d}`;
                if (d > today || entries.some(e => e.rid === rid)) continue;
                if (entries.length >= MAX_ENTRIES) { warn(`明細已達 ${MAX_ENTRIES} 筆上限，請先匯出並刪除舊紀錄`); break; }
                entries.push({ id: Date.now().toString(36) + rnd(1e6).toString(36), d, type: 'out', cat: '其他', amt: f.amt, note: f.name, rid }); n++;
            }
            if (n) save();
            $('#fmsg').textContent = n ? `已記入 ${n} 筆` : '沒有需要記入的（還沒到期或都記過了）';
            render();
        }

        function fillCats() { $('#cat').replaceChildren(...($('#type').value === 'in' ? IN_CATS : OUT_CATS).map(c => new Option(c, c))); }

        function render() {
            const s = summarize(entries, ym);
            $('#ym').textContent = ym.replace('-', ' 年 ') + ' 月';
            $('#sum').replaceChildren(statRow('收入', money(s.income), 'ok'), statRow('支出', money(s.expense)), statRow('結餘', money(s.balance), s.balance < 0 ? 'bad' : 'ok'));
            $('#cats').replaceChildren(...(s.byCat.length ? s.byCat.map(([c, v]) => {
                const d = document.createElement('div'); d.className = 'cat';
                const top = document.createElement('div'), bar = document.createElement('div'), fill = document.createElement('i');
                top.append(Object.assign(document.createElement('span'), { textContent: c }), Object.assign(document.createElement('b'), { textContent: `${money(v)}（${Math.round(v / s.expense * 100)}%）` }));
                bar.className = 'bar'; fill.style.width = v / s.expense * 100 + '%'; bar.append(fill); d.append(top, bar);
                return d;
            }) : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '本月還沒有支出' })]));
            $('#list').replaceChildren(...(s.list.length ? s.list.map(e => {
                const r = document.createElement('div'); r.className = 'item';
                const main = document.createElement('div'); main.className = 'main';
                main.append(Object.assign(document.createElement('div'), { textContent: e.cat }), Object.assign(document.createElement('small'), { textContent: e.d.slice(5) + (e.note ? '　' + e.note : '') }));
                if (e.cur) main.append(Object.assign(document.createElement('small'), { className: 'fxline', textContent: fmtFx(e) }));
                const a = Object.assign(document.createElement('b'), { className: 'amt ' + e.type, textContent: (e.type === 'in' ? '+' : '−') + money(e.amt) });
                const x = Object.assign(document.createElement('button'), { className: 'sm del', textContent: '刪除' });
                x.setAttribute('aria-label', '刪除 ' + e.cat + ' ' + money(e.amt));
                x.onclick = () => { entries = entries.filter(y => y.id !== e.id); save(); render(); };
                r.append(main, a, x);
                return r;
            }) : [Object.assign(document.createElement('p'), { className: 'muted', textContent: '本月沒有紀錄' })]));
        }

        // 幣別：選外幣時顯示匯率欄，預設帶 unit-converter 存的 fx_cache（不另外連網）；沒有 / 太舊就要手動輸入
        function fillCur() { $('#cur').replaceChildren(...Object.entries(CURRENCIES).map(([c, [n]]) => new Option(`${c} ${n}`, c))); }
        function onCur() {
            const cur = $('#cur').value, fx = cur !== 'TWD';
            $('#fxRow').hidden = !fx; $('#amt').placeholder = fx ? '外幣金額' : '金額';
            if (!fx) return;
            const r = fxRate(store.get('fx_cache', null), cur, Date.now());
            $('#rate').value = r ? Number(r.toPrecision(4)) : '';
            $('#fxNote').textContent = r ? '取自匯率換算器的快取，可手動修改；記帳後匯率就鎖定' : '離線無匯率，請手動輸入';
            showTwd();
        }
        function showTwd() {
            if ($('#cur').value === 'TWD') return;
            const t = toTwd(parseFloat($('#amt').value), parseFloat($('#rate').value));
            if (t !== null) $('#fxNote').textContent = `≈ NT$${money(t)}（記帳後匯率鎖定）`;
        }
        $('#cur').onchange = onCur; $('#amt').addEventListener('input', showTwd); $('#rate').addEventListener('input', showTwd);

        $('#add').onclick = () => {
            const e = { id: Date.now().toString(36) + rnd(1e6).toString(36), d: $('#date').value, type: $('#type').value, cat: $('#cat').value, amt: parseFloat($('#amt').value), note: $('#note').value.trim() };
            const cur = $('#cur').value;
            if (cur !== 'TWD') {
                const rate = parseFloat($('#rate').value), twd = toTwd(e.amt, rate);
                if (!validRate(rate)) { warn('離線無匯率，請手動輸入匯率（1 外幣 = 多少台幣）'); $('#rate').focus(); return; }
                if (twd === null) { $('#amt').focus(); return; }
                Object.assign(e, { fx: e.amt, amt: twd, cur, rate });
            }
            if (!validEntry(e)) { $('#amt').focus(); return; }
            if (entries.length >= MAX_ENTRIES) return warn(`明細已達 ${MAX_ENTRIES} 筆上限，請先匯出並用「刪除一年前的紀錄」清理`);
            entries.push(e); save();
            $('#amt').value = ''; $('#note').value = ''; if (cur !== 'TWD') onCur();
            ym = e.d.slice(0, 7); render(); $('#amt').focus();
        };
        $('#fadd').onclick = () => {
            const f = { id: Date.now().toString(36) + rnd(1e6).toString(36), name: $('#fname').value.trim(), amt: parseFloat($('#famt').value), cycle: $('#fcycle').value, start: $('#fstart').value };
            if (!validFixed(f)) { $('#fname').focus(); return; }
            if (fixed.length >= MAX_FIXED) return warn(`固定支出最多 ${MAX_FIXED} 項`);
            fixed.push(f); saveFixed(); $('#fname').value = ''; $('#famt').value = ''; renderFixed();
        };
        $('#fpost').onclick = postFixed;
        $('#amt').onkeydown = $('#note').onkeydown = (e) => { if (e.key === 'Enter') $('#add').click(); };
        $('#type').onchange = fillCats;
        $('#prev').onclick = () => { ym = shiftMonth(ym, -1); render(); };
        $('#next').onclick = () => { ym = shiftMonth(ym, 1); render(); };
        $('#export').onclick = () => download(new Blob(['﻿' + toCSV(entries, true)], { type: 'text/csv;charset=utf-8' }), `expenses-${day.today()}.csv`);
        $('#prune').onclick = () => {
            const cut = day.addMonths(day.today(), -12), n = entries.length - pruneBefore(entries, cut).length;
            if (!n) return warn('沒有一年前的紀錄');
            if (confirm(`刪除 ${cut} 以前的 ${n} 筆紀錄？無法復原，建議先匯出 CSV。`)) { entries = pruneBefore(entries, cut); save(); render(); }
        };
        $('#clear').onclick = () => { if (entries.length && confirm(`確定刪除全部 ${entries.length} 筆紀錄？無法復原（固定支出清單不受影響）。`)) { entries = []; save(); render(); } };
        fillCur(); $('#cur').value = 'TWD'; fillCats(); render(); renderFixed();
    </script>
</body>

</html>
