<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="薪資 / 加班費試算：月薪換算時薪、依勞基法倍率算平日 / 休息日 / 假日加班費，並概算實領薪資與年薪。">
    <meta property="og:title" content="薪資 / 加班費試算" />
    <meta property="og:description" content="月薪換時薪，依勞基法倍率算加班費與實領概算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/salary-calc.html" />
    <title>薪資 / 加班費試算</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>薪資 / 加班費試算</h1>
        <p class="sub">台灣月薪制。時薪 = 月薪 ÷ 240。結果為概算，實際以勞動部規定與公司制度為準。</p>

        <div class="card">
            <div class="fgrid">
                <div><label for="salary">月薪（元）</label><input id="salary" type="number" min="0" value="45000"></div>
                <div><label for="bonus">年終 / 獎金月數</label><input id="bonus" type="number" min="0" step="0.5" value="2"></div>
            </div>
            <div id="base"></div>
        </div>

        <div class="card">
            <h2>加班時數（本月合計）</h2>
            <div class="fgrid">
                <div><label for="h-weekday">平日（每天最多 4 小時）</label><input id="h-weekday" type="number" min="0" step="0.5" value="10"></div>
                <div><label for="h-rest">休息日（最多 12 小時）</label><input id="h-rest" type="number" min="0" step="0.5" value="0"></div>
                <div><label for="h-holiday">國定假日 / 例假日出勤（最多 12 小時）</label><input id="h-holiday" type="number" min="0" step="0.5" value="0"></div>
            </div>
            <p class="note">倍率依「單日」計：平日前 2 小時 1.34、後 2 小時 1.67；休息日前 2 小時 1.34、第 3–8 小時 1.67、第 9–12 小時 2.67；假日出勤前 8 小時加發 1 倍、第 9–10 小時 1.34、第 11–12 小時 1.67。請同時填「總時數」與「天數」，程式會平均分配到每一天再套用分段倍率。</p>
            <div class="fgrid" style="margin-top:10px">
                <div><label for="d-weekday">平日加班天數</label><input id="d-weekday" type="number" min="0" value="5"></div>
                <div><label for="d-rest">休息日天數</label><input id="d-rest" type="number" min="0" value="0"></div>
                <div><label for="d-holiday">假日出勤天數</label><input id="d-holiday" type="number" min="0" value="0"></div>
            </div>
            <div id="ot"></div>
        </div>

        <div class="card">
            <h2>實領概算</h2>
            <div class="fgrid">
                <div><label for="r-labor">勞保自付 %</label><input id="r-labor" type="number" min="0" step="0.01" value="2.5"></div>
                <div><label for="r-health">健保自付 %</label><input id="r-health" type="number" min="0" step="0.01" value="1.55"></div>
                <div><label for="r-pension">勞退自提 %</label><input id="r-pension" type="number" min="0" max="6" step="0.5" value="0"></div>
            </div>
            <p class="note">直接以月薪乘上費率，未使用投保級距、未計所得稅與眷屬健保費，費率請自行依最新公告調整。</p>
            <div id="net"></div>
        </div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        const { statRow, store } = Util;

        // --- pure ---
        const HOURS_PER_MONTH = 240;
        // 每個區間 [小時數, 倍率]
        const TIERS = {
            weekday: [[2, 1.34], [2, 1.67]],
            rest: [[2, 1.34], [6, 1.67], [4, 2.67]],
            holiday: [[8, 1], [2, 1.34], [2, 1.67]],
        };
        const hourly = (monthly) => monthly / HOURS_PER_MONTH;
        const maxHours = (kind) => TIERS[kind].reduce((a, [h]) => a + h, 0);

        // 單日加班 hours 小時的加班費；超過上限的部分不計（回傳 capped）
        function otPay(rate, kind, hours) {
            let left = Math.max(0, hours), pay = 0;
            for (const [h, mult] of TIERS[kind]) { const t = Math.min(left, h); pay += t * mult * rate; left -= t; }
            return { pay, capped: left };
        }

        // 概算實領：rates 為百分比
        const netPay = (gross, { labor, health, pension }) => gross * (1 - (labor + health + pension) / 100);
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const num = (id) => Math.max(0, parseFloat($('#' + id).value) || 0);
        const money = (n) => Math.round(n).toLocaleString('zh-TW');
        const ids = ['salary', 'bonus', 'h-weekday', 'h-rest', 'h-holiday', 'd-weekday', 'd-rest', 'd-holiday', 'r-labor', 'r-health', 'r-pension'];
        const saved = store.get('salary_calc', {});
        ids.forEach(i => { if (saved[i] !== undefined) $('#' + i).value = saved[i]; });

        function render() {
            const monthly = num('salary'), rate = hourly(monthly), warn = [];
            const rows = [['平日加班', 'weekday'], ['休息日出勤', 'rest'], ['假日出勤', 'holiday']].map(([label, kind]) => {
                const days = Math.floor(num('d-' + kind)), total = num('h-' + kind), per = days ? total / days : 0;
                const r = otPay(rate, kind, per);
                if (r.capped > 0) warn.push(`${label}每天 ${per.toFixed(1)} 小時超過上限 ${maxHours(kind)} 小時，超出部分未計`);
                return [label, r.pay * days];
            });
            const ot = rows.reduce((a, [, v]) => a + v, 0), gross = monthly + ot;
            $('#base').replaceChildren(statRow('時薪', `${money(rate)} 元`), statRow('日薪（÷30）', `${money(monthly / 30)} 元`), statRow('年薪（含獎金）', `${money(monthly * (12 + num('bonus')))} 元`));
            $('#ot').replaceChildren(...rows.map(([l, v]) => statRow(l, `${money(v)} 元`)), statRow('加班費合計', `${money(ot)} 元`, 'ok'), ...warn.map(w => Object.assign(document.createElement('p'), { className: 'note', textContent: '⚠ ' + w })));
            const net = netPay(gross, { labor: num('r-labor'), health: num('r-health'), pension: num('r-pension') });
            $('#net').replaceChildren(statRow('本月應領（月薪 + 加班費）', `${money(gross)} 元`), statRow('扣除後實領概算', `${money(net)} 元`, 'ok'));
            store.set('salary_calc', Object.fromEntries(ids.map(i => [i, $('#' + i).value])));
        }
        ids.forEach(i => { $('#' + i).oninput = render; });
        render();
    </script>
</body>

</html>
