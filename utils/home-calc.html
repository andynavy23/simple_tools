<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>居家計算</h1>
        <p class="sub">園藝、水族、室內環境、冷氣燈光、搬家具、寵物與寶寶的居家小算式。數值多為經驗值或範例，欄位都可改；輸入內容只存在這個瀏覽器。</p>

        <div class="tabs" id="tabs"></div>
        <div id="panes"></div>

        <button id="reset">重置所有輸入</button>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>七個分頁的居家小計算：園藝（肥料稀釋、盆栽土量、堆肥碳氮比）、水族（水量換水、藥劑劑量）、室內環境（體感溫度、露點結露、PM2.5 與 AQI、二氧化碳通風）、冷氣與燈光、家具尺寸檢查、寵物餵食量、尿布用量。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>買肥料 / 盆土 / 冷氣 / 燈具前先估份量。</li>
        <li>要搬大型家具，想先確認過得了門、電梯與樓梯轉角。</li>
        <li>想知道今天出門的體感、房間會不會結露、空氣品質該不該運動。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>選分頁，在欄位填數字，結果即時更新；空白欄位視為未填，選填欄位可不填。</li>
        <li>預設值只是範例（例如肥料 20-20-20、冷氣每坪 0.6 kW、AQI 門檻），請改成你實際的產品標示或官方公告。</li>
        <li>家具：填家具長 / 寬 / 高與各通道尺寸，會檢查可否直放或斜放通過；樓梯轉角以「走廊轉彎」公式估算。</li>
        <li>「重置所有輸入」會清掉記住的輸入並恢復預設值。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">肥料 20-20-20、稀釋 1000 倍 → 每公升水 1 g，氮 / 磷 / 鉀 約 200 / 200 / 200 ppm（P2O5、K2O 計）
        濕度 60%、氣溫 25 °C → 露點 16.7 °C
        -10 °C 風速 20 km/h → 風寒約 -18 °C
        6 坪、一般樓層、2 人 → 冷氣約需 3.6 kW
        10 kg 絕育成犬、飼料 350 kcal/100g → 每日約 180 g</div>
        <h3>小提醒</h3>
        <ul>
        <li>只記住上次的分頁與各欄位輸入（鍵 homec_opts），沒有其他資料與成長問題；壞資料或舊版資料載入時會被忽略並使用預設值。存不下時會顯示共用的儲存失敗提示；「重置」前會先確認，無法復原。</li>
        <li>肥料與藥劑只做濃度換算，實際用量請以產品說明為準；寵物餵食量只是依體重與熱量的估算起點，請以獸醫建議為準；水族藥劑請依標示與魚種。</li>
        <li>AQI 採「台灣環境部」或「美國 EPA（2024 修訂）」的 PM2.5 分段，門檻僅為範例，以官方公告為準。體感溫度的風寒適用氣溫 10 °C 以下且風速 4.8 km/h 以上，熱指數適用 26.7 °C（80 °F）以上。</li>
        <li>冷氣、照度、家具搬運、堆肥碳氮比都是粗估：冷氣請以專業評估為準；樓梯是斜的、家具有突出物，搬運請多留餘裕並實測。</li>
        <li>CO2 速查為居家參考值，不是診斷；通風量以一般成人安靜活動估算。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const SQ = 3.305785;                       // 1 坪 = 3.305785 m²
        const fin = (...a) => a.every(x => typeof x === 'number' && isFinite(x));

        // ===== 園藝 =====
        // 肥料：N、P2O5、K2O 百分比；dil = 稀釋倍數（1 份肥料兌 dil 份水）；vol = 水量 L。targetN（ppm）有填則反推倍數
        function fertMix(n, p, k, dil, vol, targetN) {
            if (!fin(n, p, k) || n < 0 || p < 0 || k < 0 || n + p + k <= 0 || n > 100 || p > 100 || k > 100) return null;
            if (fin(targetN) && targetN > 0) { if (!(n > 0)) return null; dil = n * 1e4 / targetN; }
            if (!(dil > 0) || !isFinite(dil)) return null;
            const ppm = (x) => x * 1e4 / dil, mn = Math.min(...[n, p, k].filter(x => x > 0));
            return { dil, perL: 1000 / dil, total: fin(vol) && vol > 0 ? vol * 1000 / dil : NaN, ppm: [ppm(n), ppm(p), ppm(k)], ratio: [n, p, k].map(x => x / mn) };
        }
        // 盆土：圓盆（a = 上緣直徑、b = 底徑）或方盆（a 長、b 寬，上下一樣）；h 高；drain 排水層厚；gap 土面離盆緣；單位 cm
        function potSoil(shape, a, b, h, drain, gap, bag) {
            if (!fin(a, b, h, drain, gap) || a <= 0 || b <= 0 || h <= 0 || drain < 0 || gap < 0 || drain + gap >= h) return null;
            const slice = (y1, y2) => {
                if (shape === 'rect') return a * b * (y2 - y1);
                const R = a / 2, r = b / 2, rad = (y) => r + (R - r) * y / h, r1 = rad(y1), r2 = rad(y2);
                return Math.PI * (y2 - y1) / 3 * (r1 * r1 + r1 * r2 + r2 * r2);
            };
            const total = slice(0, h) / 1000, drainL = slice(0, drain) / 1000, soil = slice(drain, h - gap) / 1000;
            return { total, drain: drainL, soil, bags: fin(bag) && bag > 0 ? soil / bag : NaN };
        }
        // 堆肥：每行「名稱,碳氮比,重量」。混合碳氮比 = 總重 ÷ Σ(重量 ÷ 碳氮比)（假設各材料單位重量含碳量相近，粗估）
        function compostMix(text) {
            const rows = [];
            for (const ln of String(text ?? '').split('\n').slice(0, 30)) {
                const t = ln.split(/[,，\t]/).map(s => s.trim());
                if (t.length < 3 || !t[0]) continue;
                const r = +t[1], w = +t[2];
                if (r > 0 && w > 0 && isFinite(r) && isFinite(w)) rows.push({ name: t[0], r, w });
            }
            if (!rows.length) return null;
            const W = rows.reduce((s, x) => s + x.w, 0), N = rows.reduce((s, x) => s + x.w / x.r, 0);
            return { rows, cn: W / N, weight: W };
        }
        // 已知青料碳氮比 g、褐料碳氮比 b、目標 t：每 1 份青料要幾份褐料（重量比）
        function compostRatio(g, b, t) {
            if (!fin(g, b, t) || !(g > 0 && b > 0 && t > 0) || !(g < t && t < b)) return null;
            return (t / g - 1) / (1 - t / b);
        }

        // ===== 水族 =====
        // 缸：l w h cm；gap 水面離缸緣 cm；ded 底砂 / 器材佔體積 %；pct 每次換水 %
        function tankWater(l, w, h, gap, ded, pct) {
            if (!fin(l, w, h, gap, ded) || l <= 0 || w <= 0 || h <= 0 || gap < 0 || gap >= h || ded < 0 || ded >= 100) return null;
            const full = l * w * h / 1000, water = l * w * (h - gap) / 1000 * (1 - ded / 100), c = fin(pct) && pct > 0 && pct <= 100 ? water * pct / 100 : NaN;
            return { full, water, change: c };
        }
        // 藥劑：標示「每 per L 加 amt」；或目標 ppm（mg/L）與藥水濃度 str（mg/mL）→ mL
        function dose(vol, per, amt, ppm, str) {
            if (!fin(vol) || vol <= 0) return null;
            return { label: fin(per, amt) && per > 0 && amt >= 0 ? vol / per * amt : NaN, byPpm: fin(ppm, str) && ppm > 0 && str > 0 ? ppm * vol / str : NaN };
        }

        // ===== 室內環境 =====
        // 風寒（加拿大 / NWS 公式）：t °C、v km/h；適用 t ≤ 10 且 v > 4.8，否則 NaN
        function windChill(t, v) {
            if (!fin(t, v) || t > 10 || v <= 4.8) return NaN;
            const p = Math.pow(v, 0.16);
            return 13.12 + 0.6215 * t - 11.37 * p + 0.3965 * t * p;
        }
        // 熱指數（NWS Rothfusz + 修正）：t °C、rh %；t < 26.7 °C（80 °F）回傳 NaN
        function heatIndex(tc, rh) {
            if (!fin(tc, rh) || rh < 0 || rh > 100) return NaN;
            const T = tc * 9 / 5 + 32;
            if (T < 80) return NaN;
            const R = rh;
            let hi = -42.379 + 2.04901523 * T + 10.14333127 * R - 0.22475541 * T * R - 0.00683783 * T * T - 0.05481717 * R * R + 0.00122874 * T * T * R + 0.00085282 * T * R * R - 0.00000199 * T * T * R * R;
            if (R < 13 && T <= 112) hi -= (13 - R) / 4 * Math.sqrt((17 - Math.abs(T - 95)) / 17);
            else if (R > 85 && T <= 87) hi += (R - 85) / 10 * (87 - T) / 5;
            return (hi - 32) * 5 / 9;
        }
        const heatLevel = (hic) => !isFinite(hic) ? '' : hic < 26.7 ? '' : hic < 32.2 ? '注意（久站活動可能疲勞）' : hic < 39.4 ? '特別注意（可能中暑痙攣、熱衰竭）' : hic < 51.7 ? '危險（易中暑）' : '極度危險（高度中暑風險）';
        // 露點（Magnus，a=17.62 b=243.12）與絕對濕度 g/m³
        function dewPoint(t, rh) {
            if (!fin(t, rh) || rh <= 0 || rh > 100) return NaN;
            const g = Math.log(rh / 100) + 17.62 * t / (243.12 + t);
            return 243.12 * g / (17.62 - g);
        }
        function absHumidity(t, rh) {
            if (!fin(t, rh) || rh < 0 || rh > 100) return NaN;
            const e = 6.112 * Math.exp(17.67 * t / (t + 243.5)) * rh / 100;
            return 216.74 * e / (273.15 + t);
        }
        // 結露風險：表面溫度（窗 / 牆）與露點比較
        function condRisk(td, surf) {
            if (!fin(td, surf)) return '';
            return surf <= td ? '會結露（表面溫度 ≤ 露點）' : surf - td <= 2 ? '接近結露（差 ≤ 2 °C）' : '暫無結露風險';
        }
        // PM2.5（µg/m³，24 小時值）AQI 分段 [濃度下限, 濃度上限, AQI 下限, AQI 上限]（範例門檻，以官方公告為準）
        const AQI_TW = [[0, 15.4, 0, 50], [15.5, 35.4, 51, 100], [35.5, 54.4, 101, 150], [54.5, 150.4, 151, 200], [150.5, 250.4, 201, 300], [250.5, 350.4, 301, 400], [350.5, 500.4, 401, 500]];
        const AQI_US = [[0, 9.0, 0, 50], [9.1, 35.4, 51, 100], [35.5, 55.4, 101, 150], [55.5, 125.4, 151, 200], [125.5, 225.4, 201, 300], [225.5, 325.4, 301, 500]];
        const AQI_LEVELS = [['良好', '各種活動不受限'], ['普通', '極少數敏感族群留意'], ['對敏感族群不健康', '氣喘、心肺疾病者、老人小孩減少戶外劇烈活動'], ['對所有族群不健康', '減少戶外活動，外出戴 N95 / 口罩'], ['非常不健康', '避免戶外活動，室內開空氣清淨機'], ['危害', '留在室內，盡量避免外出']];
        const aqiLevel = (aqi) => aqi <= 50 ? 0 : aqi <= 100 ? 1 : aqi <= 150 ? 2 : aqi <= 200 ? 3 : aqi <= 300 ? 4 : 5;
        // 濃度 → AQI（先截到 0.1），超出表尾回傳 NaN
        function pmToAqi(c, table) {
            if (!fin(c) || c < 0) return NaN;
            c = Math.floor(c * 10 + 1e-9) / 10;
            const row = table.find(r => c <= r[1] + 1e-9);
            return row ? Math.round((row[3] - row[2]) / (row[1] - row[0]) * (c - row[0]) + row[2]) : NaN;
        }
        function aqiToPm(a, table) {
            if (!fin(a) || a < 0) return NaN;
            const row = table.find(r => a <= r[3]);
            return row ? Math.round(((row[1] - row[0]) / (row[3] - row[2]) * (a - row[2]) + row[0]) * 10) / 10 : NaN;
        }
        // CO2（ppm）分級（居家參考值）
        const co2Level = (c) => !fin(c) ? '' : c < 800 ? '良好' : c < 1000 ? '尚可' : c < 1500 ? '偏高，建議通風' : c < 2500 ? '不佳，請開窗 / 換氣' : '很差，請立即換氣離開';
        // 人 n、體積 vol m³、室外 out、目標 tgt（ppm）：每人 CO2 產生量 0.0052 L/s（一般成人安靜）
        function co2Vent(n, vol, out, tgt) {
            if (!fin(n, vol, out, tgt) || n <= 0 || vol <= 0 || tgt <= out) return null;
            const gen = n * 0.0052e-3 * 3600, flow = gen / ((tgt - out) * 1e-6), rate = gen / vol * 1e6;
            return { flow, ach: flow / vol, rate, hours: (tgt - out) / rate };
        }

        // ===== 冷氣與燈光 =====
        const AC_MODELS = [2.2, 2.8, 3.6, 4.1, 5.0, 6.3, 7.1, 8.0, 9.0, 10.0, 12.5];
        // 粗估冷房能力 kW：坪 × 0.6 ×（1 + 日照加成）×（1 + 樓層加成）+ 超過 2 人每人 0.1 + 電器熱源 W
        function acNeed(ping, sun, floor, people, appW) {
            if (!fin(ping) || ping <= 0) return null;
            const s = { low: 0, mid: 0.1, high: 0.2 }[sun] ?? 0.1, f = { mid: 0, top: 0.15 }[floor] ?? 0, p = fin(people) && people > 2 ? (people - 2) * 0.1 : 0, a = fin(appW) && appW > 0 ? appW / 1000 : 0;
            const kw = ping * 0.6 * (1 + s) * (1 + f) + p + a;
            return { kw, tons: kw / 3.517, model: AC_MODELS.find(m => m >= kw - 1e-9) ?? null };
        }
        // 居家照度參考（lux，常見建議值，非法規）
        const ROOM_LUX = { living: ['客廳', 150], bed: ['臥室', 100], study: ['書房 / 閱讀', 500], kitchen: ['廚房', 300], bath: ['浴室', 200], dining: ['餐廳', 200], entry: ['玄關', 100], hall: ['走廊', 75] };
        // 所需總流明 = lux × 面積 ÷ 利用係數
        function lightNeed(lux, ping, uf, perLamp) {
            if (!fin(lux, ping, uf) || lux <= 0 || ping <= 0 || uf <= 0 || uf > 1) return null;
            const m2 = ping * SQ, lm = lux * m2 / uf;
            return { m2, lm, lamps: fin(perLamp) && perLamp > 0 ? Math.ceil(lm / perLamp - 1e-9) : NaN };
        }

        // ===== 家具尺寸 =====
        // 長方形 p×q 能否放進長方形 a×b（允許斜放，Carver 1956）
        function rectFits(p, q, a, b) {
            if (!fin(p, q, a, b) || p <= 0 || q <= 0 || a <= 0 || b <= 0) return false;
            if (p < q) [p, q] = [q, p];
            if (a < b) [a, b] = [b, a];
            if (q > b) return false;
            if (p <= a) return true;
            return b >= (2 * p * q * a + (p * p - q * q) * Math.sqrt(p * p + q * q - a * a)) / (p * p + q * q);
        }
        const others = (d, i) => d.filter((_, j) => j !== i);
        // 門框：沿哪個尺寸前進都試，橫斷面（另兩邊）過得了框就行；tilt = 必須斜放
        function doorCheck(dims, W, H, m = 0) {
            if (!fin(...dims, W, H, m)) return null;
            W -= m; H -= m;
            let best = { ok: false };
            for (let i = 0; i < 3; i++) {
                const [x, y] = others(dims, i);
                if (!rectFits(x, y, W, H)) continue;
                const tilt = !((x <= W && y <= H) || (y <= W && x <= H));
                if (!best.ok || (best.tilt && !tilt)) best = { ok: true, tilt, pass: i };
            }
            return best;
        }
        // 直角轉彎（走廊 / 樓梯平台）：寬 w 的長方形最長可過多長（最小化 L(θ) = a/sinθ + b/cosθ − w/(sinθcosθ)）
        function cornerMax(a, b, w) {
            if (!fin(a, b, w) || a <= 0 || b <= 0 || w < 0 || w >= Math.min(a, b)) return NaN;
            let m = Infinity;
            for (let d = 0.05; d < 90; d += 0.05) {
                const t = d * Math.PI / 180, s = Math.sin(t), c = Math.cos(t), L = a / s + b / c - w / (s * c);
                if (L < m) m = L;
            }
            return m;
        }
        // 轉角：三種擺法（高度方向 = 某一邊，需 ≤ 天花板高）都試，取最能過的
        function cornerCheck(dims, a, b, ceil, m = 0) {
            if (!fin(...dims, a, b, ceil, m)) return null;
            let best = null;
            for (let i = 0; i < 3; i++) {
                if (dims[i] > ceil - m) continue;
                const [x, y] = others(dims, i), L = Math.max(x, y), w = Math.min(x, y), mx = cornerMax(a - m, b - m, w);
                if (!(mx >= 0)) continue;
                if (!best || mx - L > best.mx - best.L) best = { mx, L, w, h: dims[i], ok: mx >= L };
            }
            return best;
        }
        // 電梯：門框 + 車廂內（任一邊當高度 ≤ 車廂高，另兩邊放得進車廂地板）
        function elevCheck(dims, dw, dh, cw, cd, ch, m = 0) {
            const door = doorCheck(dims, dw, dh, m);
            if (!door || !fin(cw, cd, ch)) return null;
            const car = [0, 1, 2].some(i => dims[i] <= ch - m && rectFits(...others(dims, i), cw - m, cd - m));
            return { door, car, ok: door.ok && car };
        }

        // ===== 寵物 / 嬰兒 =====
        // 每日熱量 = RER × 係數；RER = 70 × 體重^0.75（kcal）。係數為常見經驗值，個體差異大
        const PET_K = { dog: { y1: 3.0, y2: 2.0, neuter: 1.6, intact: 1.8, senior: 1.4, diet: 1.0 }, cat: { y1: 2.5, y2: 2.0, neuter: 1.2, intact: 1.4, senior: 1.1, diet: 0.8 } };
        function petFeed(sp, kg, stage, kcal100, meals) {
            const k = PET_K[sp]?.[stage];
            if (!k || !fin(kg, kcal100) || kg <= 0 || kg > 100 || kcal100 <= 0) return null;
            const rer = 70 * Math.pow(kg, 0.75), der = rer * k, g = der / (kcal100 / 100);
            return { rer, k, der, grams: g, perMeal: fin(meals) && meals >= 1 ? g / Math.floor(meals) : NaN };
        }

            show('g_ac', !ac ? '請填坪數' : [['估算冷房能力', nf(ac.kw, 2) + ' kW', 'ok'], ['約等於', nf(ac.tons, 2) + ' 噸（1 冷凍噸 = 3.517 kW）'], ['建議機型（常見規格）', ac.model ? ac.model + ' kW 以上' : '超出常見分離式規格，請找專業評估', 'ok']]);
            const lux = num('li_lux') > 0 ? num('li_lux') : ROOM_LUX[val('li_r')][1], ln = lightNeed(lux, num('li_p'), num('li_uf'), num('li_lm'));
            show('g_light', !ln ? '坪數需大於 0，利用係數需介於 0–1' : [['目標照度', nf(lux, 0) + ' lux'], ['面積', nf(ln.m2, 1) + ' m²'], ['所需總流明', nf(ln.lm, 0) + ' lm', 'ok'], ...(isFinite(ln.lamps) ? [['燈具顆數', ln.lamps + ' 顆'] ] : [])]);
            // 家具
            const dims = [num('fu_a'), num('fu_b'), num('fu_c')], mg = num('fu_m') || 0, ok3 = dims.every(x => x > 0);
            if (!ok3) ['g_door', 'g_elev', 'g_corner'].forEach(g => show(g, '請先填家具三個尺寸')); else {
                const d = doorCheck(dims, num('dr_w'), num('dr_h'), mg), df = fit(d);
                show('g_door', !d ? NEED : [['結果', df[0], df[1]]]);
                const e = elevCheck(dims, num('el_dw'), num('el_dh'), num('el_cw'), num('el_cd'), num('el_ch'), mg), ef = e && fit(e.door);
                show('g_elev', !e ? NEED : [['電梯門', ef[0], ef[1]], ['車廂內', e.car ? '放得進去' : '放不進去', e.car ? 'ok' : 'bad'], ['整體', e.ok ? '可搬入' : '無法搬入', e.ok ? 'ok' : 'bad']]);
                const c = cornerCheck(dims, num('cn_a'), num('cn_b'), num('cn_h'), mg);
                show('g_corner', !c ? '尺寸需為有效數字；家具太寬或太高時無法轉彎' : [['最佳擺法', `平面 ${nf(c.L, 0)} × ${nf(c.w, 0)} cm、直立高 ${nf(c.h, 0)} cm`], ['轉彎可過最長', nf(c.mx, 0) + ' cm'], ['結果', c.ok ? '可轉過' : '轉不過去（太長）', c.ok ? 'ok' : 'bad']]);
            }
            // 寵物 / 尿布
            const pf = petFeed(val('pe_sp'), num('pe_kg'), val('pe_st'), num('pe_kcal'), num('pe_m'));
            show('g_pet', !pf ? '體重與熱量需為有效數字' : [['基礎代謝 RER', nf(pf.rer, 0) + ' kcal/天'], ['活動係數', pf.k + '（經驗值）'], ['每日熱量', nf(pf.der, 0) + ' kcal', 'ok'], ['每日餵食量', nf(pf.grams, 0) + ' g', 'ok'], ...(isFinite(pf.perMeal) ? [['每餐', nf(pf.perMeal, 0) + ' g']] : []), ['提醒', '以產品說明與獸醫建議為準']]);
            const dp2 = diaperPlan(num('di_a'), num('di_to'), num('di_day'), num('di_pk'), num('di_pr'));
            show('g_dia', !dp2 ? '月齡需在 0–72 之間且預計月齡要大於目前月齡；包裝片數需大於 0' : [['目前每日片數', nf(dp2.nowDay, 1) + ' 片'], ['每月用量', nf(dp2.monthPcs, 0) + ' 片（約 ' + dp2.monthPacks + ' 包）', 'ok'], ['每片單價', nf(dp2.unit, 2) + ' 元'], ['每月花費', nf(dp2.monthCost, 0) + ' 元', 'ok'], ['到預計月齡共', `${nf(dp2.pieces, 0)} 片（約 ${dp2.packs} 包）・${nf(dp2.cost, 0)} 元`]]);
        }

        function save() {
            const v = {}; document.querySelectorAll('[data-s]').forEach(e => { v[e.id] = e.value; });
            store.set(KEY, { tab, v });
        }
        document.addEventListener('input', () => { calc(); save(); });
        document.addEventListener('change', () => { calc(); save(); });
        $('#reset').onclick = () => {
            if (!confirm('確定要清除所有輸入並恢復預設值嗎？頁面會重新載入，無法復原。')) return;
            try { localStorage.removeItem(KEY); } catch (e) { /* 無法清除也照常重新載入 */ }
            location.reload();
        };
        const opts = normOpts(store.get(KEY, null), IDS);
        for (const id of IDS) { const e = document.getElementById(id), v = id in opts.v ? opts.v[id] : DEFS[id]; e.value = v; if (e.value !== v) e.value = DEFS[id]; }
        calc(); showTab(opts.tab);
    </script>
</body>

</html>
