<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="圖片壓縮 / 縮圖 / 轉檔：縮小尺寸、調整品質、轉成 JPEG / PNG / WebP，也能把 SVG 轉成指定尺寸的 PNG，全程在瀏覽器完成，圖片不會上傳。">
    <meta property="og:title" content="圖片壓縮 / 縮圖 / 轉檔" />
    <meta property="og:description" content="本機縮圖、壓縮、轉檔與 SVG 轉 PNG，圖片不上傳。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/image-resize.html" />
    <title>圖片壓縮 / 縮圖 / 轉檔</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 680px;
        }

        .drop {
            display: block;
            border: 2px dashed var(--line);
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            color: var(--muted);
            cursor: pointer;
        }

        .drop.over {
            border-color: var(--blue);
            color: var(--blue);
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .row label {
            color: var(--muted);
            font-size: 14px;
        }

        .row input[type=number] {
            width: 100px;
        }

        .row input[type=range] {
            flex: 1 1 140px;
            accent-color: var(--blue);
        }

        #preview {
            max-width: 100%;
            max-height: 360px;
            display: block;
            margin: 10px auto;
            border-radius: 10px;
            background: repeating-conic-gradient(var(--fill) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
        }

        .err {
            color: var(--bad);
            min-height: 1.4em;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>圖片壓縮 / 縮圖 / 轉檔</h1>
        <p class="sub">選一張圖片，調整尺寸與品質後下載。處理全部在你的瀏覽器完成，圖片不會上傳；重新編碼也會移除 EXIF（拍攝地點等）資訊。</p>

        <div class="card">
            <label class="drop" id="drop" for="file" tabindex="0">點這裡選擇圖片，或把圖片拖進來<br><small>JPEG、PNG、WebP、GIF、BMP、AVIF（瀏覽器能開啟的格式）</small></label>
            <input type="file" id="file" accept="image/*,.svg" hidden>
            <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;padding:10px 0">或貼上 SVG 程式碼</summary>
                <textarea id="svgText" spellcheck="false" placeholder="&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;&gt;…&lt;/svg&gt;" style="width:100%;min-height:90px;margin-top:8px;font:13px ui-monospace,monospace"></textarea>
                <button class="sm" id="svgGo" style="margin-top:6px">用這段 SVG</button>
            </details>
            <div class="err" id="err" role="alert"></div>
        </div>

        <div class="card" id="panel" hidden>
            <div class="row">
                <label for="maxw">最大寬</label><input type="number" id="maxw" min="1" max="16384" aria-label="最大寬度">
                <label for="maxh">最大高</label><input type="number" id="maxh" min="1" max="16384" aria-label="最大高度">
                <span class="muted">等比例縮放，不放大；留空表示不限</span>
            </div>
            <div class="row">
                <label for="fmt">格式</label>
                <select id="fmt"><option value="image/jpeg">JPEG（照片，體積小）</option><option value="image/webp">WebP（更小，較新）</option><option value="image/png">PNG（無損，可透明）</option></select>
                <label for="q">品質</label><input type="range" id="q" min="10" max="100" value="80"><b id="qv">80</b>
            </div>
            <div class="row" id="bgRow"><label for="bg">透明背景填色（JPEG 不支援透明）</label><input type="color" id="bg" value="#ffffff"></div>
            <img id="preview" alt="處理後預覽" hidden>
            <div id="stats"></div>
            <div class="row" style="margin-top:10px"><button class="primary" id="save">下載</button><button id="reset">換一張</button></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>在瀏覽器內縮小圖片尺寸、調整品質、轉換格式，圖片不會上傳到任何地方。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>照片太大，傳 LINE、email 或上傳網站被擋。</li>
        <li>要把 PNG 轉成較小的 JPEG 或 WebP。</li>
        <li>發佈照片前想移除 EXIF（拍攝地點等）資訊。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點虛線框選擇圖片，或把圖片拖進來；也可展開「或貼上 SVG 程式碼」。</li>
        <li>設定「最大寬」「最大高」（等比例縮放，不會放大；留空表示不限）。</li>
        <li>選「格式」（JPEG / WebP / PNG），用「品質」滑桿調整（PNG 無損，不受品質影響）。</li>
        <li>下方預覽與「原始 / 處理後」大小會即時更新，看到「縮小 xx%」就是省下的比例。</li>
        <li>滿意後按「下載」；想處理別張按「換一張」。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">原圖 1600 × 900 的截圖，格式選 JPEG、品質 80、最大寬留 1600
        → 處理後 1600 × 900，體積約縮小一半以上（實際依圖片內容而定）</div>
        <h3>小提醒</h3>
        <ul>
        <li>輸出為 JPEG 時，透明部分會填上「透明背景填色」選的顏色。</li>
        <li>重新編碼會移除 EXIF；GIF 動圖只會取第一格。</li>
        <li>太大的圖片（超過瀏覽器記憶體上限）可能處理失敗。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { statRow, download } = Util;

        // --- pure ---
        const MAX_DIM = 16384, MAX_PIXELS = 100e6;
        const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };

        // 等比例縮到 maxW × maxH 之內（null 表示不限）；預設不放大，up = true（向量圖）時可以放大到剛好塞進去。回傳整數寬高（至少 1）
        function fitSize(w, h, maxW, maxH, up = false) {
            let k = up ? Infinity : 1;
            if (maxW && (up || w > maxW)) k = Math.min(k, maxW / w);
            if (maxH && (up || h > maxH)) k = Math.min(k, maxH / h);
            if (!Number.isFinite(k)) k = 1;
            return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) };
        }

        // SVG 的自然尺寸：width / height 屬性（只接受 px 或無單位），沒有就用 viewBox，再沒有用 300×150（瀏覽器預設）
        function svgSize(text) {
            const root = /<svg\b[^>]*>/i.exec(text);
            if (!root) return null;
            const num = (name) => { const m = new RegExp('\\s' + name + '\\s*=\\s*["\']\\s*([\\d.]+)\\s*(?:px)?\\s*["\']', 'i').exec(root[0]); return m ? parseFloat(m[1]) : NaN; };
            let w = num('width'), h = num('height');
            const vb = /viewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)\s*["']/i.exec(root[0]);
            if (!(w > 0) || !(h > 0)) { if (vb && +vb[1] > 0 && +vb[2] > 0) { w = +vb[1]; h = +vb[2]; } else { w = w > 0 ? w : 300; h = h > 0 ? h : 150; } }
            return { w, h };
        }
        // SVG 一定要有 xmlns 才能被 <img> 當圖片載入；沒有的話補上
        const withNamespace = (t) => (/<svg\b[^>]*\sxmlns\s*=/i.test(t) ? t : t.replace(/<svg\b/i, '<svg xmlns="http://www.w3.org/2000/svg"'));

        const fmtBytes = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB');
        const ratioText = (before, after) => (before ? `${after <= before ? '縮小' : '增加'} ${Math.abs(Math.round((1 - after / before) * 100))}%` : '');
        // 下載檔名：原檔名去副檔名 + 尺寸 + 新副檔名
        const outName = (name, w, h, mime) => `${(name || 'image').replace(/\.[^.]*$/, '').replace(/[\\/:*?"<>|]/g, '_')}-${w}x${h}.${EXT[mime] || 'jpg'}`;
        const sizeOk = (w, h) => w > 0 && h > 0 && w <= MAX_DIM && h <= MAX_DIM && w * h <= MAX_PIXELS;
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let src = null, srcFile = null, result = null, timer = null, token = 0;

        function showErr(t) { $('#err').textContent = t; }

        async function load(file) {
            showErr('');
            if (!file) return;
            if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) { if (file.size > 5e6) return showErr('SVG 檔案太大（上限 5 MB）'); return loadSvg(await file.text(), file); }
            if (!file.type.startsWith('image/')) return showErr('這不是圖片檔');
            try {
                const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
                if (!sizeOk(bmp.width, bmp.height)) { bmp.close(); return showErr('圖片太大（單邊上限 16384 像素、總像素上限 1 億）'); }
                if (src && src.close) src.close();
                src = bmp; srcFile = file;
                $('#panel').hidden = false; $('#maxw').value = Math.min(bmp.width, 1920); $('#maxh').value = '';
                process();
            } catch (e) { showErr('無法讀取這張圖片（格式不支援或檔案損毀）'); }
        }

        // SVG：用 <img> 載入（不會執行裡面的腳本）；向量圖可以輸出任意尺寸，所以預設輸出寬 1024 並允許放大
        function loadSvg(text, file) {
            const sz = svgSize(text); if (!sz) return showErr('這看起來不是 SVG（找不到 <svg> 標籤）');
            const url = URL.createObjectURL(new Blob([withNamespace(text)], { type: 'image/svg+xml' })), im = new Image();
            im.onload = () => {
                URL.revokeObjectURL(url); if (src && src.close) src.close();
                src = { isSvg: true, img: im, width: sz.w, height: sz.h }; srcFile = file || new File([text], 'image.svg', { type: 'image/svg+xml' });
                $('#panel').hidden = false; $('#maxw').value = 1024; $('#maxh').value = ''; $('#fmt').value = 'image/png'; process();
            };
            im.onerror = () => { URL.revokeObjectURL(url); showErr('SVG 內容有誤，瀏覽器無法繪製'); };
            im.src = url;
        }
        $('#svgGo').onclick = () => { showErr(''); const t = $('#svgText').value.trim(); if (!t) return showErr('請先貼上 SVG 程式碼'); if (t.length > 5e6) return showErr('SVG 太大'); loadSvg(t, null); };

        async function process() {
            if (!src) return;
            const my = ++token;
            const maxW = parseInt($('#maxw').value, 10) || null, maxH = parseInt($('#maxh').value, 10) || null, mime = $('#fmt').value, q = $('#q').value / 100;
            const { w, h } = fitSize(src.width, src.height, maxW, maxH, !!src.isSvg);
            if (!sizeOk(w, h)) return showErr('輸出尺寸太大（單邊上限 16384 像素、總像素上限 1 億）');
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            const g = cv.getContext('2d');
            if (mime === 'image/jpeg') { g.fillStyle = $('#bg').value; g.fillRect(0, 0, w, h); }              // JPEG 沒有透明：先填背景色
            g.imageSmoothingQuality = 'high'; g.drawImage(src.isSvg ? src.img : src, 0, 0, w, h);
            const blob = await new Promise(res => cv.toBlob(res, mime, mime === 'image/png' ? undefined : q));
            if (my !== token) return;                                                                          // 期間又改了設定：丟掉舊結果
            if (!blob) return showErr('這個瀏覽器無法輸出這種格式，請改選 JPEG 或 PNG');
            showErr('');
            if (result) URL.revokeObjectURL(result.url);
            result = { blob, w, h, mime, url: URL.createObjectURL(blob) };
            $('#preview').src = result.url; $('#preview').hidden = false;
            const actual = blob.type === mime ? '' : `（瀏覽器改用 ${blob.type}）`;
            $('#stats').replaceChildren(statRow('原始', `${src.width} × ${src.height}・${fmtBytes(srcFile.size)}`), statRow('處理後' + actual, `${w} × ${h}・${fmtBytes(blob.size)}`), statRow('體積', ratioText(srcFile.size, blob.size), blob.size <= srcFile.size ? 'ok' : 'bad'));
            $('#qv').textContent = $('#q').value; $('#q').disabled = mime === 'image/png'; $('#bgRow').hidden = mime !== 'image/jpeg';
        }
        const later = () => { clearTimeout(timer); timer = setTimeout(process, 150); };

        $('#file').onchange = (e) => load(e.target.files[0]);
        ['maxw', 'maxh', 'fmt', 'q', 'bg'].forEach(id => { $('#' + id).oninput = later; });
        $('#save').onclick = () => { if (result) download(result.blob, outName(srcFile.name, result.w, result.h, result.blob.type)); };
        $('#reset').onclick = () => { $('#panel').hidden = true; $('#preview').hidden = true; $('#file').value = ''; if (src && src.close) src.close(); src = null; };
        const drop = $('#drop');
        ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
        drop.addEventListener('drop', (e) => load(e.dataTransfer.files[0]));
        drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } });
    </script>
</body>

</html>
