        :root {
            --wrap-w: 680px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tabs button {
            flex: 1 1 28%;
        }

        .btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .fgrid select,

            align-items: center;
            margin: 0;

            word-break: break-all;
        }

        .it.done label span {
            text-decoration: line-through;
            color: var(--muted);
        }

        .it .note {
            width: 100%;
            margin-top: 6px;
        }

        .it .top {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .it .top label {

        .meta {

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>居家管理</h1>
        <p class="sub">檢查表、效期、家事、抄表、垃圾收運。資料只存在這個瀏覽器。</p>

        <div class="tabs" role="tablist">
            <button data-tab="lists" aria-pressed="true">檢查表</button>
            <button data-tab="expiry" aria-pressed="false">效期提醒</button>
            <button data-tab="chores" aria-pressed="false">家事月曆</button>
            <button data-tab="meters" aria-pressed="false">抄表記錄</button>
            <button data-tab="trash" aria-pressed="false">垃圾收運</button>
        </div>

        <!-- 檢查表 -->

            <div class="card">

                <div class="row">
                    <select id="l_tpl" aria-label="範本"></select>
                    <input id="l_name" type="text" maxlength="40" placeholder="清單名稱（可留白用範本名）" aria-label="清單名稱">
                    <button class="primary" id="l_create">建立</button>
                </div>
                <p class="msg">範本只是一般參考，法規 / 契約請自行確認。</p>
                <p class="msg" id="l_msg"></p>
            </div>
            <div class="card">
                <label for="l_sel">我的清單</label>
                <select id="l_sel" style="width:100%"></select>
                <div class="btns"><button id="l_copy">複製為新清單</button><button id="l_del" class="danger">刪除這份</button></div>
            </div>
            <div class="card" id="l_cur" hidden>
                <h2 id="l_title"></h2>
                <div class="bar"><i id="l_bar"></i></div>
                <p class="meta" id="l_prog"></p>
                <div id="l_items"></div>
                <div class="row" style="margin-top:10px">
                    <input id="l_new" type="text" maxlength="80" placeholder="新增項目" aria-label="新增項目">
                    <button id="l_add">新增</button>
                </div>
                <p class="msg" id="l_imsg"></p>
            </div>
            <div class="card" id="l_cmpCard" hidden>
                <h2>多筆比較（同範本，依達成率）</h2>
                <div id="l_cmp"></div>
            </div>
            <div class="btns"><button id="l_clear" class="danger">清除全部檢查表</button></div>
        </section>

        <!-- 效期提醒 -->
        <section id="p_expiry" hidden>
            <div class="card">
                <h2>新增效期</h2>
                <div class="fgrid">
                    <div class="full"><label for="e_name">名稱</label><input id="e_name" type="text" maxlength="40" placeholder="例如：護照、感冒藥、濾水器濾心"></div>
                    <div><label for="e_cat">類別</label><select id="e_cat"></select></div>
                    <div><label for="e_date">到期日</label><input id="e_date" type="date"></div>
                    <div><label for="e_warn">提前幾天提醒</label><input id="e_warn" type="number" min="0" max="365" value="30" inputmode="numeric"></div>
                    <div id="e_needBox"><label for="e_need">需有幾個月效期（0 = 不檢查）</label><input id="e_need" type="number" min="0" max="60" value="0" inputmode="numeric"></div>
                </div>
                <div class="btns"><button class="primary" id="e_add">新增</button></div>
                <p class="msg" id="e_msg"></p>
            </div>
            <div class="card"><div id="e_sum" class="meta"></div></div>

            </div>
            <div class="btns"><button id="c_reset" class="danger">重置為預設家事</button></div>

                <h2>記錄度數</h2>

                    <div><label for="m_ym">月份</label><input id="m_ym" type="month"></div>
                    <div><label for="m_k">種類</label><select id="m_k"></select></div>
                    <div><label for="m_v">表上度數</label><input id="m_v" type="number" min="0" step="any" inputmode="decimal"></div>
                    <div><label for="m_th">異常門檻（高於近 3 期平均 %）</label><input id="m_th" type="number" min="1" max="500" inputmode="numeric"></div>
                </div>

                <p class="msg" id="m_msg"></p>

            <div id="m_out"></div>
            <div class="btns"><button id="m_clear" class="danger">清除全部抄表</button></div>

        <!-- 垃圾收運 -->

            <div class="card">

            </div>
            <div class="btns"><button id="t_clear" class="danger">清除收運設定</button></div>

        <div class="card" style="margin-top:16px">
            <h2>資料管理</h2>
            <p class="msg" style="margin:0 0 8px">各分頁底下可單獨清除；單筆刪除在各項目旁。</p>
            <div class="btns" style="margin-top:0"><button id="allClear" class="danger">清除居家管理全部資料</button></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把居家瑣事集中在一頁：檢查表、效期提醒、每月家事、水電瓦斯抄表、垃圾收運。全部離線，只存在這個瀏覽器。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>租房、看房、買中古車前，想照清單逐項檢查並比較。</li>
        <li>藥箱、證件、濾心之類有效期限的東西，想在過期前被提醒。</li>
        <li>想知道這個月該做哪些家事、電費水費是不是異常偏高、明天要不要倒垃圾。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>檢查表：選範本（租約 簽約前 / 入住 / 退租、看屋、中古車、居家安全、防災包）建立清單，逐項勾選並寫備註，可新增或刪除項目。「複製為新清單」會保留項目、清掉勾選與備註。看屋與中古車建立兩份以上，會依達成率比較。</li>
        <li>效期提醒：填名稱、類別、到期日與提前提醒天數；清單依到期日排序並標示已過期 / 即將到期。證件類可設「需有 N 個月效期」（例如出國前護照要求），效期不足會標警示；N 由你自己決定，這裡不內建任何國家規定。</li>
        <li>家事月曆：每月一份建議家事，勾選代表今年這個月做完了；進入新的一年自動全部重置。可自行增減。</li>
        <li>抄表記錄：每月填電 / 水 / 瓦斯表上的度數，自動算與上一筆的用量差；比近 3 期平均高出門檻（預設 30%）的月份會標示異常。同月同種類再填會覆蓋。</li>
        <li>垃圾收運：勾選每週哪幾天有垃圾車與資源回收（可填時間），頁面上方會顯示今天與明天。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">電表 9 月 1200、10 月 1300、11 月 1390、12 月 1480 → 用量 100、90、90；
        下一筆 1 月填 1700 → 用量 220，比近 3 期平均 93 高約 136%，標「異常」。
        護照 2027-03-01 到期，設需有 6 個月：2026-10-28 時效期不足 6 個月，標警示。</div>
        <h3>小提醒</h3>
        <ul>
        <li>範本內容只是一般參考，法規與契約請自行確認；本頁不提供法律期限，也不給用藥建議（藥品只記名稱與效期）。</li>
        <li>日期以台灣時間（UTC+8）判斷；加月份遇到月底取該月最後一天。</li>
        <li>上限：檢查表 40 份、每份 200 項、項目 80 字、備註 200 字；效期 500 筆；每月家事 30 項；抄表 240 筆。滿了會拒絕新增並提示，不會默默刪舊資料。</li>
        <li>刪除：每個項目都有單筆刪除（需確認）；各分頁底下可單獨清除，最底下可清除全部，皆需確認且無法復原。家事月曆的「重置」會回到預設家事。</li>
        <li>抄表用量以前一筆（依月份排序）為準；度數倒退（換表）會標示且不列入平均。</li>
        <li>載入到壞掉或舊版資料會自動略過或補預設值；右上角「💾」可匯出備份。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day, store } = Util;

        // --- pure ---
        const HK = { LISTS: 40, ITEMS: 200, ITEM: 80, NOTE: 200, LNAME: 40, EXP: 500, ENAME: 40, CHORE_M: 30, CHORE: 40, METERS: 240, TH_DEF: 30 };
        const twToday = (ms = Date.now()) => new Date(ms + 8 * 36e5).toISOString().slice(0, 10);
        function validDate(s) {
            if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const p = day.parse(s);
            return p.y >= 1990 && p.y <= 2100 && p.m >= 1 && p.m <= 12 && p.d >= 1 && p.d <= day.daysInMonth(p.y, p.m);
        }
        const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
        let seq = 0;
        const newId = () => Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
        const intIn = (v, lo, hi, d) => { const n = typeof v === 'string' && v.trim() === '' ? NaN : Number(v); return Number.isInteger(n) && n >= lo && n <= hi ? n : d; };
        // 逐筆驗證、id 去重、截斷到上限
        function normArr(raw, fn, max) {
            if (!Array.isArray(raw)) return [];
            const seen = new Set(), out = [];
            for (const r of raw) { const x = fn(r); if (!x || seen.has(x.id)) continue; seen.add(x.id); out.push(x); if (out.length >= max) break; }
            return out;
        }

        // ===== 檢查表（內容只是一般參考，法規 / 契約請自行確認）=====
        const TPLS = [
            { k: 'lease-sign', name: '租約檢查：簽約前', items: ['確認出租人身分與房屋所有權人是否相符', '核對租期、租金、押金金額與繳費方式', '確認租金是否含管理費、水電瓦斯、網路', '確認可否開伙、養寵物、轉租', '確認設籍或申報租金補貼是否允許', '確認修繕責任由誰負擔', '確認提前解約與違約的處理方式', '口頭承諾都寫進契約並保留副本'] },
            { k: 'lease-in', name: '租約檢查：入住', items: ['拍照記錄牆面、地板、天花板現況', '測試水龍頭、排水、馬桶', '測試電燈、插座、開關', '測試冷氣、熱水器、瓦斯爐', '檢查門鎖與窗戶', '記下水電瓦斯起始度數', '點交家具家電清單並簽認', '確認鑰匙與門禁卡數量', '留意漏水、壁癌痕跡並拍照'] },
            { k: 'lease-out', name: '租約檢查：退租', items: ['清潔並恢復原狀', '拍照留存退租時現況', '抄水電瓦斯結束度數並結清費用', '歸還所有鑰匙與門禁卡', '與房東逐項點交', '確認押金退還方式與日期', '辦理地址與郵件變更', '結清網路、第四台等服務'] },
            { k: 'house', name: '看屋檢查', cmp: 1, items: ['採光：各房間白天自然光是否足夠', '通風：是否有對流窗', '漏水：天花板、牆角、浴室廚房有無水漬壁癌', '管線：水壓、排水、配電箱與電線狀況', '噪音：白天夜間、鄰近道路、樓上樓下', '管委會：管理費、公設、修繕基金、住戶規約', '格局：實際動線與坪數是否符合', '結構：裂縫、傾斜、門窗開關順暢', '周邊：交通、採買、嫌惡設施', '停車位：形式與尺寸'] },
            { k: 'car', name: '中古車檢查', cmp: 1, items: ['外觀：烤漆色差、鈑金、縫隙是否均勻', '泡水：座椅下鏽蝕、泥沙、異味', '輪胎與車燈玻璃狀況', '引擎：冷車啟動、異音、漏油', '變速箱換檔是否順暢', '底盤：鏽蝕、防塵套、懸吊異音', '煞車踩感與異音', '內裝：冷氣、電子配件、儀表警示燈', '里程與保養紀錄是否吻合', '文件：行照、車主、保養與事故紀錄、有無貸款', '試駕：直行是否跑偏'] },
            { k: 'safety', name: '居家安全檢查', items: ['消防：住警器有電、定期測試', '消防：滅火器位置與有效日期', '消防：逃生通道與安全門暢通', '電線：延長線不過載、插座無焦黑', '電線：電線無破皮老化、漏電斷路器可跳脫', '瓦斯：瓦斯軟管無龜裂', '瓦斯：熱水器通風良好', '一氧化碳警報器有電', '防跌倒：浴室防滑、樓梯扶手', '防跌倒：夜燈與地板雜物'] },
            { k: 'kit-quake', name: '防災包：地震', items: ['飲用水與乾糧（可撐數日）', '手電筒與備用電池', '哨子', '收音機與行動電源', '急救包與個人常備藥', '證件影本與少量現金', '保暖衣物 / 毛毯 / 口罩', '家人聯絡方式與集合地點', '避難路線與避難收容處所已確認'] },
            { k: 'kit-typhoon', name: '防災包：颱風', items: ['門窗加固，清理陽台排水孔', '室外物品收進室內', '備水備糧', '手機與行動電源充飽', '知道瓦斯與電源總開關位置', '低窪處準備擋水板 / 沙包', '車輛移到安全處'] },
            { k: 'kit-outage', name: '防災包：停電', items: ['手電筒 / LED 燈', '行動電源充飽', '少開冰箱門', '備用現金', '離線聯絡電話', '使用爐具注意通風', '電器先拔插頭避免復電突波'] },
        ];
        const BLANK = '__blank';
        const mkItem = (t, id = newId()) => ({ id, t: str(t, HK.ITEM), c: false, n: '' });
        const normItem = (r) => r && typeof r === 'object' && str(r.t, HK.ITEM) ? { id: str(r.id, 40) || newId(), t: str(r.t, HK.ITEM), c: r.c === true, n: str(r.n, HK.NOTE) } : null;
        const normList = (r) => r && typeof r === 'object' && str(r.name, HK.LNAME)
            ? { id: str(r.id, 40) || newId(), name: str(r.name, HK.LNAME), tpl: TPLS.some(t => t.k === r.tpl) ? r.tpl : '', items: normArr(r.items, normItem, HK.ITEMS) } : null;
        const normLists = (raw) => normArr(raw, normList, HK.LISTS);
        // 建立：範本或空白；滿 40 份拒絕
        function createList(lists, tplKey, name, id = newId()) {
            if (lists.length >= HK.LISTS) return { lists, err: `最多 ${HK.LISTS} 份清單，請先刪除不用的` };
            const t = TPLS.find(x => x.k === tplKey), nm = str(name, HK.LNAME) || (t ? t.name : '');
            if (!nm) return { lists, err: '空白清單請填名稱' };
            return { lists: [...lists, { id, name: nm, tpl: t ? t.k : '', items: t ? t.items.map(x => mkItem(x)) : [] }], err: '' };
        }
        // 複製：保留項目，清掉勾選與備註，名稱加「（複製）」
        function copyList(lists, id, newid = newId()) {
            const l = lists.find(x => x.id === id);
            if (!l) return { lists, err: '找不到清單' };
            if (lists.length >= HK.LISTS) return { lists, err: `最多 ${HK.LISTS} 份清單，請先刪除不用的` };
            return { lists: [...lists, { ...l, id: newid, name: (l.name + '（複製）').slice(0, HK.LNAME), items: l.items.map(i => mkItem(i.t)) }], err: '' };
        }
        function addListItem(lists, id, text, iid = newId()) {
            const t = str(text, 1e4);
            if (!t) return { lists, err: '請填項目內容' };
            if (t.length > HK.ITEM) return { lists, err: `項目最長 ${HK.ITEM} 字` };
            const l = lists.find(x => x.id === id);
            if (!l) return { lists, err: '找不到清單' };
            if (l.items.length >= HK.ITEMS) return { lists, err: `每份最多 ${HK.ITEMS} 項，請先刪除不用的` };
            return { lists: lists.map(x => x.id === id ? { ...x, items: [...x.items, mkItem(t, iid)] } : x), err: '' };
        }
        const mapItem = (lists, id, iid, fn) => lists.map(l => l.id === id ? { ...l, items: l.items.map(i => i.id === iid ? fn(i) : i) } : l);
        const removeListItem = (lists, id, iid) => lists.map(l => l.id === id ? { ...l, items: l.items.filter(i => i.id !== iid) } : l);
        const removeList = (lists, id) => lists.filter(l => l.id !== id);
        const listScore = (l) => { const total = l.items.length, done = l.items.filter(i => i.c).length; return { done, total, pct: total ? Math.round(done * 100 / total) : 0 }; };
        // 同範本（只有看屋 / 中古車這類可比較者）依達成率由高到低
        function compareLists(lists, tplKey) {
            const t = TPLS.find(x => x.k === tplKey);
            if (!t || !t.cmp) return [];
            return lists.filter(l => l.tpl === tplKey).map(l => ({ id: l.id, name: l.name, ...listScore(l) })).sort((a, b) => b.pct - a.pct || a.name.localeCompare(b.name));
        }

        // ===== 效期提醒 =====
        const ECATS = ['藥箱', '證件', '家用品', '其他'];
        const normExp = (r) => {
            if (!r || typeof r !== 'object' || !str(r.name, HK.ENAME) || !validDate(r.date)) return null;
            const cat = ECATS.includes(r.cat) ? r.cat : '其他';
            return { id: str(r.id, 40) || newId(), name: str(r.name, HK.ENAME), cat, date: r.date, warn: intIn(r.warn, 0, 365, 30), need: cat === '證件' ? intIn(r.need, 0, 60, 0) : 0 };
        };
        const normExpiry = (raw) => normArr(raw, normExp, HK.EXP);
        // 到期當天仍有效；剩餘天數 <= 提前天數 為 soon
        function expStatus(it, today) {
            const left = day.between(today, it.date);
            return { key: left < 0 ? 'expired' : left <= it.warn ? 'soon' : 'ok', left };
        }
        // 證件：今天起算 N 個月後，是否已超過到期日（效期不足）
        const needShort = (it, today) => it.need > 0 && day.addMonths(today, it.need) > it.date;
        const sortExpiry = (list) => [...list].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.name.localeCompare(b.name) || (a.id < b.id ? -1 : 1));
        function addExpiry(list, r, id = newId()) {
            const s = (v) => String(v ?? '').trim();
            if (!s(r.name)) return { list, err: '請填名稱' };
            if (s(r.name).length > HK.ENAME) return { list, err: `名稱最長 ${HK.ENAME} 字` };
            if (!validDate(s(r.date))) return { list, err: '請選擇有效的到期日（1990–2100）' };
            if (intIn(s(r.warn), 0, 365, -1) < 0) return { list, err: '提前天數請填 0 到 365 的整數' };
            if (s(r.need) !== '' && intIn(s(r.need), 0, 60, -1) < 0) return { list, err: '效期月數請填 0 到 60 的整數' };
            if (list.length >= HK.EXP) return { list, err: `最多 ${HK.EXP} 筆，請先刪除不用的` };
            return { list: [...list, normExp({ id, name: r.name, cat: r.cat, date: s(r.date), warn: s(r.warn), need: s(r.need) })], err: '' };
        }
        const removeExpiry = (list, id) => list.filter(x => x.id !== id);

        // ===== 家事月曆：每月一份，y = 最後完成的年份，今年 = y 等於今年（跨年自動重置）=====
        const DEF_CHORES = [
            ['年前大掃除', '清洗窗簾', '整理冰箱'], ['清洗除濕機濾網', '整理衣櫥'], ['清洗冷氣濾網', '清理浴室發霉', '清理排水孔'],
            ['清冷氣（內部或請人）', '檢查紗窗', '換季整理衣物'], ['清洗洗衣機槽', '檢查漏水痕跡', '清水塔 / 水箱'], ['除濕機保養', '清理排水孔', '檢查電風扇'],
            ['清洗冷氣濾網', '檢查颱風防護', '床墊曬太陽'], ['檢查防災包', '清理陽台排水孔', '清洗抽油煙機'], ['清洗窗簾', '檢查電暖器', '冬被曬太陽'],
            ['換季整理衣物', '清洗抽油煙機', '檢查瓦斯管'], ['檢查滅火器與住警器', '檢查熱水器', '擦窗戶'], ['年終大掃除', '檢查證件與保險效期', '整理文件'],
        ];
        const defMonth = (m) => DEF_CHORES[m].map((t, i) => ({ id: `d${m + 1}_${i}`, t, y: 0 }));
        const normChore = (r) => r && typeof r === 'object' && str(r.t, HK.CHORE) ? { id: str(r.id, 40) || newId(), t: str(r.t, HK.CHORE), y: intIn(r.y, 0, 2100, 0) } : null;
        // 固定 12 個月；缺的或壞的月份補預設，傳入的月份截斷到 30 項
        function normChores(raw) {
            const a = Array.isArray(raw) ? raw : [];
            return Array.from({ length: 12 }, (_, m) => Array.isArray(a[m]) ? normArr(a[m], normChore, HK.CHORE_M) : defMonth(m));
        }
        const choreDone = (c, year) => c.y === year;
        function toggleChore(ch, m, id, year) { return ch.map((arr, i) => i !== m ? arr : arr.map(c => c.id === id ? { ...c, y: c.y === year ? 0 : year } : c)); }
        function addChore(ch, m, text, id = newId()) {
            const t = str(text, 1e4);
            if (!t) return { ch, err: '請填家事內容' };
            if (t.length > HK.CHORE) return { ch, err: `家事最長 ${HK.CHORE} 字` };
            if (ch[m].length >= HK.CHORE_M) return { ch, err: `每月最多 ${HK.CHORE_M} 項，請先刪除不用的` };
            return { ch: ch.map((arr, i) => i === m ? [...arr, { id, t, y: 0 }] : arr), err: '' };
        }
        const removeChore = (ch, m, id) => ch.map((arr, i) => i === m ? arr.filter(c => c.id !== id) : arr);

        // ===== 抄表 =====
        const MK = { e: '電', w: '水', g: '瓦斯' };
        const validYm = (s) => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s) && +s.slice(0, 4) >= 1990 && +s.slice(0, 4) <= 2100;
        const normMeter = (r) => {
            if (!r || typeof r !== 'object' || !validYm(r.ym) || !MK[r.k]) return null;
            const v = Number(r.v);
            return Number.isFinite(v) && v >= 0 && v <= 1e8 ? { id: str(r.id, 40) || newId(), ym: r.ym, k: r.k, v: Math.round(v * 100) / 100 } : null;
        };
        // 儲存格式 { th, rows }；舊版 / 手改成純陣列也能讀；同月同種類只留第一筆
        function normMeters(raw) {
            const o = Array.isArray(raw) ? { rows: raw } : raw && typeof raw === 'object' ? raw : {};
            const keys = new Set(), rows = normArr(o.rows, (r) => { const x = normMeter(r); if (!x || keys.has(x.ym + x.k)) return null; keys.add(x.ym + x.k); return x; }, HK.METERS);
            return { th: intIn(o.th, 1, 500, HK.TH_DEF), rows };
        }
        // 同月同種類再填 = 覆蓋；新增才檢查上限
        function putMeter(rows, r, id = newId()) {
            const s = (v) => String(v ?? '').trim();
            if (!validYm(s(r.ym))) return { rows, err: '請選擇月份' };
            if (!MK[r.k]) return { rows, err: '請選擇種類' };
            const v = s(r.v) === '' ? NaN : Number(s(r.v));
            if (!(Number.isFinite(v) && v >= 0 && v <= 1e8)) return { rows, err: '度數請填 0 以上的數字' };

            return { rows: [...rows, { id, ym: s(r.ym), k: r.k, v: vv }], err: '' };
        }
        const removeMeter = (rows, id) => rows.filter(x => x.id !== id);
        // 某種類由舊到新：use = 與前一筆的差（第一筆為 null）；負數 = 度數倒退（換表）；
        // avg = 之前最多 3 期有效用量的平均（至少 2 期才算）；flag = 用量高出平均超過 th%
        function meterUsage(rows, k, th) {
            const a = rows.filter(r => r.k === k).sort((x, y) => x.ym < y.ym ? -1 : 1), out = [];

                const prior = out.map(o => o.use).filter(u => u !== null && u >= 0).slice(-3);

                const over = avg && use !== null && use >= 0 ? Math.round((use / avg - 1) * 100) : null;
                out.push({ ...r, use, back: use !== null && use < 0, avg: avg === null ? null : Math.round(avg * 100) / 100, over, flag: over !== null && over > th });
            });
            return out;
        }

        // ===== 垃圾收運：固定 7 天（0 = 週日）=====
        const normTrash = (raw) => Array.from({ length: 7 }, (_, i) => {
            const r = Array.isArray(raw) && raw[i] && typeof raw[i] === 'object' ? raw[i] : {};
            return { g: r.g === true, r: r.r === true, t: str(r.t, 20) };
        });
        const weekdayOf = (ymd) => (day.num(ymd) + 4) % 7;
        const trashOn = (trash, ymd) => ({ ymd, wd: weekdayOf(ymd), ...trash[weekdayOf(ymd)] });
        const trashSoon = (trash, today) => [trashOn(trash, today), trashOn(trash, day.shift(today, 1))];
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const h = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids); return e; };
        const WD = ['日', '一', '二', '三', '四', '五', '六'];
        const K = { lists: 'homek_lists', expiry: 'homek_expiry', chores: 'homek_chores', meters: 'homek_meters', trash: 'homek_trash' };
        let lists = normLists(store.get(K.lists, [])), expiry = normExpiry(store.get(K.expiry, [])), chores = normChores(store.get(K.chores, null));
        let meters = normMeters(store.get(K.meters, null)), trash = normTrash(store.get(K.trash, null));
        let selId = '', cm = +twToday().slice(5, 7) - 1, showAll = false;
        const say = (id, t, bad) => { const m = $(id); m.textContent = t; m.className = 'msg' + (bad ? ' bad' : ''); };
        const ask = (what) => confirm(`${what}？無法復原。`);

        // ---- 分頁 ----
        document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
            document.querySelectorAll('[data-tab]').forEach(x => { x.setAttribute('aria-pressed', x === b); $('#p_' + x.dataset.tab).hidden = x !== b; });
        });

        // ---- 檢查表 ----
        const saveL = () => store.set(K.lists, lists);
        TPLS.forEach(t => $('#l_tpl').append(new Option(t.name, t.k))); $('#l_tpl').append(new Option('空白清單', BLANK));
        function renderLists() {
            if (!lists.some(l => l.id === selId)) selId = lists.length ? lists[0].id : '';
            $('#l_sel').replaceChildren(...lists.map(l => { const s = listScore(l); return new Option(`${l.name}（${s.done}/${s.total}）`, l.id); }));
            $('#l_sel').value = selId; $('#l_sel').hidden = $('#l_copy').hidden = $('#l_del').hidden = !lists.length;
            const l = lists.find(x => x.id === selId); $('#l_cur').hidden = !l;
            if (l) {
                const s = listScore(l);
                $('#l_title').textContent = l.name; $('#l_bar').style.width = s.pct + '%'; $('#l_prog').textContent = `已完成 ${s.done} / ${s.total}（${s.pct}%）`;
                $('#l_items').replaceChildren(...l.items.map(i => {
                    const cb = h('input'); cb.type = 'checkbox'; cb.checked = i.c;
                    cb.onchange = () => { lists = mapItem(lists, l.id, i.id, x => ({ ...x, c: cb.checked })); saveL(); renderLists(); };
                    const del = h('button', 'sm danger', '×'); del.setAttribute('aria-label', '刪除項目 ' + i.t);
                    del.onclick = () => { if (ask(`刪除項目「${i.t}」`)) { lists = removeListItem(lists, l.id, i.id); saveL(); renderLists(); } };
                    const n = h('input', 'note'); n.type = 'text'; n.maxLength = HK.NOTE; n.placeholder = '備註'; n.value = i.n; n.setAttribute('aria-label', '備註 ' + i.t);
                    n.onchange = () => { lists = mapItem(lists, l.id, i.id, x => ({ ...x, n: str(n.value, HK.NOTE) })); saveL(); };
                    return h('div', 'it' + (i.c ? ' done' : ''), h('div', 'top', h('label', '', cb, h('span', '', i.t)), del), n);
                }));
            }
            const cmps = TPLS.filter(t => t.cmp).map(t => [t, compareLists(lists, t.k)]).filter(([, c]) => c.length >= 2);
            $('#l_cmpCard').hidden = !cmps.length;
            $('#l_cmp').replaceChildren(...cmps.flatMap(([t, c]) => [h('p', 'meta', t.name), ...c.map(x => h('div', 'urow', h('span', '', x.name), h('b', '', `${x.pct}%`), h('span', 'meta', `${x.done}/${x.total}`)))]));
        }
        $('#l_sel').onchange = () => { selId = $('#l_sel').value; renderLists(); };
        $('#l_create').onclick = () => {
            const r = createList(lists, $('#l_tpl').value, $('#l_name').value);
            if (r.err) return say('#l_msg', r.err, true);
            lists = r.lists; selId = lists.at(-1).id; $('#l_name').value = ''; saveL(); say('#l_msg', '已建立'); renderLists();
        };
        $('#l_copy').onclick = () => { const r = copyList(lists, selId); if (r.err) return say('#l_msg', r.err, true); lists = r.lists; selId = lists.at(-1).id; saveL(); say('#l_msg', '已複製（勾選與備註已清空）'); renderLists(); };
        $('#l_del').onclick = () => { const l = lists.find(x => x.id === selId); if (l && ask(`刪除清單「${l.name}」`)) { lists = removeList(lists, selId); saveL(); renderLists(); } };
        $('#l_add').onclick = () => { const r = addListItem(lists, selId, $('#l_new').value); if (r.err) return say('#l_imsg', r.err, true); lists = r.lists; $('#l_new').value = ''; say('#l_imsg', ''); saveL(); renderLists(); };
        $('#l_new').onkeydown = (e) => { if (e.key === 'Enter') $('#l_add').click(); };
        $('#l_clear').onclick = () => { if (lists.length && ask(`清除全部 ${lists.length} 份檢查表`)) { lists = []; saveL(); renderLists(); } };

        // ---- 效期 ----
        const saveE = () => store.set(K.expiry, expiry);
        ECATS.forEach(c => $('#e_cat').append(new Option(c, c)));
        const needVis = () => { $('#e_needBox').hidden = $('#e_cat').value !== '證件'; };
        $('#e_cat').onchange = needVis; needVis(); $('#e_date').value = twToday();
        function renderExpiry() {
            const today = twToday(), all = sortExpiry(expiry).map(it => ({ it, s: expStatus(it, today) }));
            const nExp = all.filter(x => x.s.key === 'expired').length, nSoon = all.filter(x => x.s.key === 'soon').length;
            $('#e_sum').textContent = all.length ? `共 ${all.length} 筆：已過期 ${nExp}、即將到期 ${nSoon}` : '還沒有記錄，從上面新增第一筆吧';
            $('#e_list').replaceChildren(...all.map(({ it, s }) => {
                const lab = { expired: '已過期', soon: '即將到期', ok: '未到期' }[s.key];
                const when = s.left < 0 ? `已過 ${-s.left} 天` : s.left === 0 ? '今天到期' : `還有 ${s.left} 天`;
                const del = h('button', 'sm danger', '刪除'); del.setAttribute('aria-label', '刪除 ' + it.name);
                del.onclick = () => { if (ask(`刪除「${it.name}」`)) { expiry = removeExpiry(expiry, it.id); saveE(); renderExpiry(); } };
                const c = h('div', 'card', h('h2', '', it.name, h('span', 'badge ' + s.key, lab)), h('div', 'meta', `${it.cat} ・ ${it.date}（${when}）・ 提前 ${it.warn} 天提醒`));
                if (it.need) c.append(h('div', 'meta', `需有 ${it.need} 個月效期：`, h('span', 'badge ' + (needShort(it, today) ? 'warn' : 'ok'), needShort(it, today) ? '效期不足' : '足夠')));
                c.append(h('div', 'btns', del)); return c;
            }));
        }
        $('#e_add').onclick = () => {
            const r = addExpiry(expiry, { name: $('#e_name').value, cat: $('#e_cat').value, date: $('#e_date').value, warn: $('#e_warn').value, need: $('#e_cat').value === '證件' ? $('#e_need').value : '' });
            if (r.err) return say('#e_msg', r.err, true);
            expiry = r.list; $('#e_name').value = ''; saveE(); say('#e_msg', '已新增'); renderExpiry();
        };
        $('#e_clear').onclick = () => { if (expiry.length && ask(`清除全部 ${expiry.length} 筆效期`)) { expiry = []; saveE(); renderExpiry(); } };

        // ---- 家事月曆 ----
        const saveC = () => store.set(K.chores, chores);
        for (let m = 0; m < 12; m++) $('#c_m').append(new Option(`${m + 1} 月`, m)); $('#c_m').value = cm;
        function renderChores() {
            const year = +twToday().slice(0, 4), arr = chores[cm], n = arr.filter(c => choreDone(c, year)).length;
            $('#c_prog').textContent = arr.length ? `${year} 年 ${cm + 1} 月：已完成 ${n} / ${arr.length}` : '這個月沒有家事，可以在下面新增';
            $('#c_items').replaceChildren(...arr.map(c => {
                const cb = h('input'); cb.type = 'checkbox'; cb.checked = choreDone(c, year);
                cb.onchange = () => { chores = toggleChore(chores, cm, c.id, year); saveC(); renderChores(); };
                const del = h('button', 'sm danger', '×'); del.setAttribute('aria-label', '刪除家事 ' + c.t);
                del.onclick = () => { if (ask(`刪除家事「${c.t}」`)) { chores = removeChore(chores, cm, c.id); saveC(); renderChores(); } };
                return h('div', 'it' + (choreDone(c, year) ? ' done' : ''), h('div', 'top', h('label', '', cb, h('span', '', c.t)), del));
            }));
        }
        $('#c_m').onchange = () => { cm = +$('#c_m').value; say('#c_msg', ''); renderChores(); };
        $('#c_add').onclick = () => { const r = addChore(chores, cm, $('#c_new').value); if (r.err) return say('#c_msg', r.err, true); chores = r.ch; $('#c_new').value = ''; say('#c_msg', ''); saveC(); renderChores(); };
        $('#c_new').onkeydown = (e) => { if (e.key === 'Enter') $('#c_add').click(); };
        $('#c_reset').onclick = () => { if (ask('把 12 個月的家事全部重置為預設（你新增的家事與完成勾選都會消失）')) { chores = normChores(null); saveC(); renderChores(); } };

        // ---- 抄表 ----
        const saveM = () => store.set(K.meters, meters);
        Object.entries(MK).forEach(([k, v]) => $('#m_k').append(new Option(v, k)));
        $('#m_ym').value = twToday().slice(0, 7); $('#m_th').value = meters.th;
        function renderMeters() {
            const box = $('#m_out'); box.replaceChildren();
            for (const [k, name] of Object.entries(MK)) {
                const us = meterUsage(meters.rows, k, meters.th); if (!us.length) continue;
                const last = us.at(-1), card = h('div', 'card', h('h2', '', name + '表'));
                if (last.flag) card.append(h('div', 'alert', `最新 ${last.ym} 用量 ${last.use}，比近 3 期平均 ${last.avg} 高 ${last.over}%（門檻 ${meters.th}%）`));
                else if (last.use !== null) card.append(h('div', 'meta', `最新 ${last.ym} 用量 ${last.use}` + (last.avg !== null ? `，近 3 期平均 ${last.avg}（${last.over >= 0 ? '+' : ''}${last.over}%）` : '，資料不足 2 期，暫不判斷異常')));
                const rev = us.slice().reverse(), shown = showAll ? rev : rev.slice(0, 12);
                shown.forEach(u => {
                    const del = h('button', 'sm danger', '刪除'); del.setAttribute('aria-label', `刪除 ${u.ym} ${name}表`);
                    del.onclick = () => { if (ask(`刪除 ${u.ym} ${name}表 ${u.v} 度的記錄`)) { meters = { ...meters, rows: removeMeter(meters.rows, u.id) }; saveM(); renderMeters(); } };
                    card.append(h('div', 'urow', h('span', '', `${u.ym}　表 ${u.v}　`, u.use === null ? '（首筆）' : u.back ? '度數倒退（換表？）' : `用量 ${u.use}`), u.flag ? h('span', 'badge warn', '異常') : '', del));
                });
                if (rev.length > 12) { const t = h('button', 'sm', showAll ? '只看最近 12 筆' : `顯示全部 ${rev.length} 筆`); t.onclick = () => { showAll = !showAll; renderMeters(); }; card.append(h('div', 'btns', t)); }
                box.append(card);
            }
            if (!box.children.length) box.append(h('div', 'card meta', '還沒有記錄，從上面填第一筆（至少填 2 期才有用量）'));
        }
        $('#m_add').onclick = () => {
            const th = intIn($('#m_th').value, 1, 500, 0); if (!th) return say('#m_msg', '異常門檻請填 1 到 500 的整數', true);
            const r = putMeter(meters.rows, { ym: $('#m_ym').value, k: $('#m_k').value, v: $('#m_v').value });
            if (r.err) return say('#m_msg', r.err, true);
            meters = { th, rows: r.rows }; $('#m_v').value = ''; saveM(); say('#m_msg', '已記錄'); renderMeters();
        };
        $('#m_th').onchange = () => { const th = intIn($('#m_th').value, 1, 500, 0); if (th) { meters = { ...meters, th }; saveM(); renderMeters(); } };
        $('#m_clear').onclick = () => { if (meters.rows.length && ask(`清除全部 ${meters.rows.length} 筆抄表（異常門檻保留）`)) { meters = { ...meters, rows: [] }; saveM(); renderMeters(); } };

        // ---- 垃圾收運 ----
        const saveT = () => store.set(K.trash, trash);
        function renderTrash() {
            const today = twToday();
            $('#t_sum').replaceChildren(...trashSoon(trash, today).map((d, i) => {
                const what = [d.g && '垃圾車', d.r && '資源回收'].filter(Boolean).join('、');
                return h('div', 'alert', `${i ? '明天' : '今天'}（週${WD[d.wd]}）：` + (what ? what + (d.t ? `（${d.t}）` : '') : '沒有收運'));
            }));
        }
        $('#t_days').replaceChildren(...[1, 2, 3, 4, 5, 6, 0].map(i => {
            const mk = (key, label) => { const cb = h('input'); cb.type = 'checkbox'; cb.checked = trash[i][key]; cb.onchange = () => { trash[i][key] = cb.checked; saveT(); renderTrash(); }; return h('label', '', cb, label); };
            const t = h('input'); t.type = 'text'; t.maxLength = 20; t.placeholder = '時間'; t.value = trash[i].t; t.setAttribute('aria-label', `週${WD[i]}時間`);
            t.onchange = () => { trash[i].t = str(t.value, 20); saveT(); renderTrash(); };
            return h('div', 'dw', h('b', '', '週' + WD[i]), mk('g', '垃圾'), mk('r', '回收'), t);
        }));
        $('#t_clear').onclick = () => { if (ask('清除收運設定')) { trash = normTrash(null); saveT(); $('#t_days').querySelectorAll('input').forEach(x => { x.type === 'checkbox' ? x.checked = false : x.value = ''; }); renderTrash(); } };

        $('#allClear').onclick = () => {
            if (!confirm('清除居家管理的全部資料（檢查表、效期、家事、抄表、收運）？無法復原。')) return;
            lists = []; expiry = []; chores = normChores(null); meters = { th: HK.TH_DEF, rows: [] }; trash = normTrash(null);
            saveL(); saveE(); saveC(); saveM(); saveT();
            $('#m_th').value = HK.TH_DEF; $('#t_days').querySelectorAll('input').forEach(x => { x.type === 'checkbox' ? x.checked = false : x.value = ''; });
            renderAll();
        };
        function renderAll() { renderLists(); renderExpiry(); renderChores(); renderMeters(); renderTrash(); }
        renderAll();
    </script>
</body>

</html>
