    <template id="help">
        <h3>這是什麼</h3>
        <p>十二個運動與戶外小計算放在同一頁：跑步訓練計畫、馬拉松補給、槓鈴配重、徒手訓練、自行車、游泳、登山時間、健走、ELO、賽事籤表、背包重量、露營食物份量。配速與 Riegel 預測請用「跑步配速計算」。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>報名了比賽，想倒推每週跑量與減量週。</li>
            <li>要上槓前算每側該放哪些槓片；排班或比賽要抽籤表。</li>
            <li>規劃登山、露營前估時間、背包與食物飲水量。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li>點上方分頁，填欄位，結果即時更新。</li>
            <li>按「複製結果」貼到筆記或訊息；籤表分頁可按「列印」。</li>
            <li>時間可輸入 <kbd>mm:ss</kbd> 或 <kbd>h:mm:ss</kbd>。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">槓鈴：目標 100 kg、桿 20 kg、片 25/20/15/10/5/2.5/1.25 → 每側 25 + 15（共 2 片）
登山：10 公里、爬升 600 m、下降 0、體能係數 1 → 行走 3:00（不含休息）
ELO：1500 對 1500、A 勝、K = 32 → A 1516、B 1484</div>
        <h3>小提醒</h3>
        <ul>
            <li>一般參考，非醫療 / 教練建議；有身體狀況、傷病或心肺疑慮請先諮詢專業。</li>
            <li>訓練計畫是通行原則（約每週增 10%、每 4 週減量、賽前減量），不是個人化處方；補給量為範圍，實際請訓練時試吃，誤差約 ±20%。</li>
            <li>Naismith：每 5 公里 1 小時，每爬升 600 m 加 1 小時；下降本頁保守地每 300 m 加 10 分鐘；體能係數 &lt; 1 較快、&gt; 1 較慢。</li>
            <li>自行車估速用簡化物理模型（滾阻 0.005、風阻 CdA 0.32、傳動效率 97.5%、無風），實際差異可達 10% 以上。</li>
            <li>健走熱量用 MET 粗估（總消耗，含基礎代謝），誤差約 ±20%。SWOLF 只能在相同池長下比較。</li>
            <li>只存上次分頁與數字輸入這一份小資料，可用最下方按鈕清除，也能用右上角 💾 備份；壞資料會自動還原預設。籤表名單與裝備清單只在記憶體，重新整理就消失；人數最多 64 人、裝備最多 200 項。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store, seeded } = Util;

        // --- pure ---
        const fmtNum = (n, d = 1) => Number.isFinite(n) ? String(+n.toFixed(d)) : '—';
        const parseNum = (s) => { const t = String(s == null ? '' : s).trim(); return /^\d+(\.\d+)?$|^\.\d+$/.test(t) ? Number(t) : NaN; };
        function parseTime(s) {
            const t = String(s == null ? '' : s).trim().replace(/：/g, ':');
            if (!t) return NaN;
            if (!t.includes(':')) return /^\d+(\.\d+)?$/.test(t) ? Number(t) * 60 : NaN;
            const p = t.split(':');
            if (p.length > 3 || p.some(x => !/^\d+(\.\d+)?$/.test(x))) return NaN;
            const n = p.map(Number);
            if (n.slice(1).some(x => x >= 60)) return NaN;
            return n.reduce((a, x) => a * 60 + x, 0);
        }
        function fmtTime(sec) {
            if (!Number.isFinite(sec) || sec < 0) return '—';
            const t = Math.round(sec), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60, P = (n) => String(n).padStart(2, '0');
            return h ? `${h}:${P(m)}:${P(s)}` : `${m}:${P(s)}`;
        }

        // ===== 1 跑步訓練計畫 =====
        const TRAIN = { '5k': { name: '5K', cap: 40, long: .3, lcap: 12, taper: 1, km: 5 }, '10k': { name: '10K', cap: 50, long: .3, lcap: 16, taper: 1, km: 10 }, half: { name: '半馬', cap: 65, long: .33, lcap: 22, taper: 2, km: 21.0975 }, full: { name: '全馬', cap: 80, long: .35, lcap: 32, taper: 3, km: 42.195 } };
        const TAPER_F = { 1: [.5], 2: [.7, .5], 3: [.8, .65, .5] };
        // 目標日期（YYYY-MM-DD）到今天還有幾週（進位）；日期不合法或已過回傳 NaN
        function weeksUntil(dateStr, todayStr) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !/^\d{4}-\d{2}-\d{2}$/.test(todayStr)) return NaN;
            const d = (Date.parse(dateStr + 'T00:00:00Z') - Date.parse(todayStr + 'T00:00:00Z')) / 864e5;
            return d > 0 ? Math.ceil(d / 7) : NaN;
        }
        // 每週約 +10%、每 4 週一次減量週（×0.7）、最後 1–3 週賽前減量；長跑佔週量比例並有上限
        function trainPlan(dist, cur, weeks) {
            const c = TRAIN[dist];
            if (!c) return { err: '未知的距離' };
            if (!(cur >= 0 && cur <= 300)) return { err: '目前每週跑量請輸入 0–300 公里' };
            if (!(Number.isInteger(weeks) && weeks >= 4 && weeks <= 30)) return { err: '距離比賽需 4–30 週（請改目標日期或週數）' };
            const build = weeks - c.taper, out = [];
            let last = Math.max(cur, 5);
            for (let i = 1; i <= build; i++) {
                let km, type;
                if (i % 4 === 0 && i < build) { km = last * .7; type = '減量週'; }
                else { km = i === 1 ? last : Math.min(c.cap, last * 1.1); last = km; type = '增量週'; }
                out.push({ wk: i, type, km: Math.round(km) });
            }
            const peak = Math.max(...out.map(w => w.km));
            TAPER_F[c.taper].forEach((f, j) => out.push({ wk: build + j + 1, type: j === c.taper - 1 ? '比賽週' : '賽前減量', km: Math.round(peak * f) }));
            out.forEach(w => { w.long = w.type === '比賽週' ? 0 : Math.min(c.lcap, Math.round(w.km * c.long)); });
            const warn = (cur < c.cap * .25 && weeks < 8) ? '目前跑量偏低而剩餘週數不多，建議評估是否改報較短距離或延後。' : '';
            return { weeks: out, peak, warn };
        }

        // ===== 2 馬拉松補給 =====
        // 第一支能量膠 40 分鐘後，之後每 gelCarb/carbPerHr 小時一支（結束前 15 分鐘不再吃）；水與電解質每 15 分鐘一次
        function fuelPlan({ distKm, timeSec, carbPerHr, gelCarb, waterPerHr, sodiumPerHr }) {
            if (!(distKm > 0 && distKm <= 250 && timeSec >= 600 && timeSec <= 86400)) return { err: '距離或時間不合理' };
            if (!(carbPerHr >= 0 && carbPerHr <= 120 && gelCarb > 0 && gelCarb <= 100 && waterPerHr >= 0 && waterPerHr <= 1500 && sodiumPerHr >= 0 && sodiumPerHr <= 2000)) return { err: '補給量超出合理範圍' };
            const gels = [], step = carbPerHr > 0 ? gelCarb / carbPerHr * 3600 : Infinity;
            for (let t = 2400; carbPerHr > 0 && t <= timeSec - 900; t += step) gels.push(Math.round(t));
            const drinks = []; for (let t = 900; t < timeSec; t += 900) drinks.push(t);
            const times = [...new Set([...drinks, ...gels])].sort((a, b) => a - b);
            const rows = times.map(t => ({ t, km: distKm * t / timeSec, gel: gels.includes(t), drink: drinks.includes(t) }));
            return { rows, gels: gels.length, carbs: gels.length * gelCarb, water: drinks.length * waterPerHr / 4, sodium: drinks.length * sodiumPerHr / 4, drinkMl: waterPerHr / 4, drinkNa: sodiumPerHr / 4 };
        }

        // ===== 3 槓鈴配重 =====
        const PLATE_DEF = { kg: { bar: 20, plates: '25, 20, 15, 10, 5, 2.5, 1.25' }, lb: { bar: 45, plates: '45, 35, 25, 10, 5, 2.5' } };
        // 每側最少片數（硬幣找零 DP，單位 0.25）；湊不到時取「不超過目標」中最接近的重量
        function plateCombo(target, bar, plates) {
            const ps = [...new Set(plates.map(p => Math.round(p * 4)))].filter(p => p > 0).sort((a, b) => b - a);
            if (!(target > 0 && target <= 1000) || !(bar >= 0 && bar <= 100) || !ps.length || ps.length > 12) return { err: '重量或槓片設定不合理' };
            if (target < bar) return { err: '目標重量小於槓鈴自重' };
            const want = Math.floor((target - bar) / 2 * 4 + 1e-9);
            const best = [0], from = [0];
            for (let i = 1; i <= want; i++) { best[i] = Infinity; for (const p of ps) if (p <= i && best[i - p] + 1 < best[i]) { best[i] = best[i - p] + 1; from[i] = p; } }
            let s = want; while (best[s] === Infinity) s--;
            const side = {}; for (let r = s; r > 0; r -= from[r]) side[from[r]] = (side[from[r]] || 0) + 1;
            const list = Object.keys(side).map(Number).sort((a, b) => b - a).map(p => ({ w: p / 4, n: side[p] }));
            const total = bar + s / 4 * 2;
            return { side: list, count: best[s], total, diff: target - total };
        }

        // ===== 4 徒手訓練 =====
        const CALI = {
            beg: { push: ['跪姿 / 斜板伏地挺身', '3 × 6–10'], pull: ['桌下反向划船（腳著地）', '3 × 6–10'], legs: ['徒手深蹲', '3 × 10–15'], core: ['棒式 / 臀橋', '3 × 20–30 秒'] },
            mid: { push: ['標準伏地挺身', '4 × 8–12'], pull: ['反向划船 / 負重引體輔助', '4 × 6–10'], legs: ['保加利亞分腿蹲', '3 × 8–12 每腳'], core: ['懸空抬腿 / 側棒式', '3 × 10–15 / 30 秒'] },
            adv: { push: ['鑽石 / 下斜伏地挺身', '4 × 10–15'], pull: ['引體向上', '4 × 6–10'], legs: ['手槍蹲（可扶物）', '3 × 5–8 每腳'], core: ['L 坐 / 懸空舉腿', '3 × 8–12'] }
        };
        const CALI_DAYS = {
            2: [['push', 'pull', 'legs', 'core'], ['push', 'pull', 'legs', 'core']],
            3: [['push', 'pull', 'legs', 'core'], ['push', 'pull', 'legs', 'core'], ['push', 'pull', 'legs', 'core']],
            4: [['push', 'pull'], ['legs', 'core'], ['push', 'pull'], ['legs', 'core']],
            5: [['push', 'core'], ['pull'], ['legs'], ['push', 'pull'], ['legs', 'core']],
            6: [['push', 'core'], ['pull'], ['legs'], ['push'], ['pull', 'core'], ['legs']]
        };
        const CAT_NAME = { push: '推', pull: '拉', legs: '腿', core: '核心' };
        function caliPlan(level, days) {
            const L = CALI[level], D = CALI_DAYS[days];
            if (!L || !D) return { err: '程度或天數不合法' };
            return {
                days: D.map((cats, i) => ({ day: i + 1, items: cats.map(c => ({ cat: CAT_NAME[c], name: L[c][0], rx: L[c][1] })) })),
                rules: ['雙重漸進：每組都做到次數上限、連續兩次訓練都達標，就加一組或換更難的變化式。', '每週總量增加不超過約 10%，動作品質（全幅度、不代償）優先於次數。', '每 4–6 週安排一週減量（組數減半）。', '訓練日之間至少休息一天讓同一肌群恢復；痠痛與疼痛要分清楚，疼痛就停。']
            };
        }

        // ===== 5 自行車 =====
        // 時速 km/h = 踏頻 × 齒比 × 輪周(mm) × 60 / 1e6
        function gearSpeed(cad, front, rear, circMm) {
            if (!(cad > 0 && cad <= 250 && front > 0 && front <= 100 && rear > 0 && rear <= 100 && circMm >= 1000 && circMm <= 3000)) return NaN;
            return cad * (front / rear) * circMm * 60 / 1e6;
        }
        // 功率 × 效率 = (滾阻 + 坡度力) × v + ½ρ·CdA·v³，二分法求 v（km/h）
        function powerSpeed(power, massKg, gradePct, o = {}) {
            const { crr = .005, cda = .32, rho = 1.226, eff = .975 } = o;
            if (!(power > 0 && power <= 2500 && massKg > 20 && massKg <= 300 && gradePct >= -15 && gradePct <= 25)) return NaN;
            const th = Math.atan(gradePct / 100), g = 9.80665, f1 = massKg * g * (crr * Math.cos(th) + Math.sin(th)), Pe = power * eff;
            let lo = 0, hi = 60;
            for (let i = 0; i < 60; i++) { const v = (lo + hi) / 2; (Pe - f1 * v - .5 * rho * cda * v ** 3 > 0 ? lo = v : hi = v); }
            return lo * 3.6;
        }

        // ===== 6 游泳 =====
        // 池長、單程趟數、總時間(秒)、每趟平均划手數 → 距離、每 100m 配速、SWOLF（划數 + 每趟秒數）
        function swimCalc(poolM, lengths, timeSec, strokes) {
            if (!(poolM >= 10 && poolM <= 100 && Number.isInteger(lengths) && lengths >= 1 && lengths <= 1000 && timeSec > 0 && timeSec <= 86400)) return { err: '池長、趟數或時間不合理' };
            const dist = poolM * lengths, pace = timeSec / dist * 100, perLen = timeSec / lengths;
            return { dist, pace, perLen, swolf: strokes >= 0 ? strokes + perLen : NaN };
        }

        // ===== 7 登山（Naismith + 保守下降修正）=====
        // 時數 = (距離/5 + 爬升/600 + 下降/1800) × 體能係數；休息 = 行走時數 × 每小時休息分鐘
        function hikeTime(distKm, upM, downM, factor, restMinPerHr) {
            if (!(distKm >= 0 && distKm <= 500 && upM >= 0 && upM <= 20000 && downM >= 0 && downM <= 20000 && factor >= .5 && factor <= 3 && restMinPerHr >= 0 && restMinPerHr <= 30) || distKm + upM + downM === 0) return { err: '請輸入合理的距離與爬升下降，體能係數 0.5–3、休息 0–30 分 / 小時' };
            const walk = (distKm / 5 + upM / 600 + downM / 1800) * factor;
            return { walkH: walk, restH: walk * restMinPerHr / 60, totalH: walk * (1 + restMinPerHr / 60) };
        }
        const fmtH = (h) => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
        const addClock = (hhmm, h) => { const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm); if (!m || +m[1] > 23 || +m[2] > 59) return ''; const t = (+m[1] * 60 + +m[2] + Math.round(h * 60)) % 1440; return fmtH(t / 60); };

        // ===== 8 健走 =====
        const walkMet = (kmh) => kmh < 4 ? 3 : kmh < 5.5 ? 3.5 : kmh < 6.5 ? 4.3 : 5;
        // 步幅 ≈ 身高 × 0.415（可自填）；熱量 = MET × 體重 × 小時（總消耗）
        function walkCalc(heightCm, steps, weightKg, kmh, strideCm) {
            if (!(heightCm >= 80 && heightCm <= 250 && steps > 0 && steps <= 200000 && weightKg >= 20 && weightKg <= 300 && kmh >= 2 && kmh <= 8)) return { err: '身高、步數、體重或時速不合理' };
            const stride = strideCm > 0 ? strideCm : heightCm * .415, km = steps * stride / 100000, h = km / kmh;
            return { stride, km, h, kcal: walkMet(kmh) * weightKg * h, stepsPerKm: 100000 / stride };
        }

        // ===== 9 ELO =====
        const eloExpect = (ra, rb) => 1 / (1 + Math.pow(10, (rb - ra) / 400));
        // result：1 = A 勝、0.5 = 和、0 = A 敗
        function eloUpdate(ra, rb, result, k) {
            if (!(Number.isFinite(ra) && Number.isFinite(rb) && ra >= 0 && rb >= 0 && ra <= 5000 && rb <= 5000 && [0, .5, 1].includes(result) && k > 0 && k <= 200)) return { err: '評分 0–5000、K 值 1–200' };
            const ea = eloExpect(ra, rb), d = k * (result - ea);
            return { ea, eb: 1 - ea, na: ra + d, nb: rb - d, d };
        }

        // ===== 10 賽事籤表 =====
        function parseNameList(text) {
            const seen = new Set(), out = [];
            for (const l of String(text || '').split(/\r?\n/)) { const n = l.trim(); if (n && !seen.has(n)) { seen.add(n); out.push(n); } }
            return out;
        }
        function shuffleSeeded(list, seed) { const a = list.slice(), r = seeded(seed); for (let i = a.length - 1; i > 0; i--) { const j = r.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        // 循環賽（圓圈法）：奇數人補輪空；n 隊 → n−1 輪（奇數為 n 輪），每輪每隊一場
        function roundRobin(names) {
            const t = names.slice(); if (t.length < 2) return [];
            if (t.length % 2) t.push(null);
            const n = t.length, rounds = [];
            for (let r = 0; r < n - 1; r++) {
                const m = []; for (let i = 0; i < n / 2; i++) m.push([t[i], t[n - 1 - i]]);
                rounds.push(m); t.splice(1, 0, t.pop());
            }
            return rounds;
        }
        const seedOrder = (size) => { let a = [1]; while (a.length < size) a = a.flatMap(x => [x, a.length * 2 + 1 - x]); return a; };
        // 單淘汰：補到 2 的冪，輪空給前面的種子；names 順序即種子順位
        function singleElim(names) {
            const n = names.length; if (n < 2) return { err: '至少 2 人' };
            let size = 1; while (size < n) size *= 2;
            const ord = seedOrder(size), pick = (s) => s <= n ? names[s - 1] : null, r1 = [];
            for (let i = 0; i < size; i += 2) r1.push([pick(ord[i]), pick(ord[i + 1])]);
            const rounds = Math.log2(size), counts = Array.from({ length: rounds }, (_, i) => size / 2 ** (i + 1));
            return { size, byes: size - n, r1, rounds, counts, realMatches: n - 1 };

        // 雙淘汰：勝者組同單淘汰；敗者組輪數 2×(log2 size − 1)；總場數 2n−2（決賽若敗者組出身者贏需加賽 +1）
        function doubleElim(names) {

            return { ...s, lbRounds: Math.max(0, 2 * (s.rounds - 1)), total: 2 * names.length - 2 };
        }

        // ===== 11 背包重量 =====
        function parseGear(text) {
            const items = [], bad = [];
            for (const l of String(text || '').split(/\r?\n/)) {
                const t = l.trim(); if (!t) continue;
                const m = /^(.*?)[\s,，:：]+(\d+(?:\.\d+)?)\s*(kg|公斤|g|克)?$/i.exec(t);
                if (!m || !m[1].trim()) { bad.push(t); continue; }
                const w = Number(m[2]) * (/^(kg|公斤)$/i.test(m[3] || '') ? 1000 : 1);

            const top = items.slice().sort((a, b) => b.g - a.g).slice(0, 3);
            return { total, ratio, level, top };

        // ===== 12 露營食物份量 =====

            TABS.find(t => t[0] === o.tab)[2].forEach(([k, label, kind, , opts]) => {
                const id = 'f_' + k, lb = Object.assign(document.createElement('label'), { className: 'f', textContent: label, htmlFor: id });
                const el = document.createElement(kind === 's' ? 'select' : kind === 't' ? 'textarea' : 'input');
                el.id = id; el.className = 'w'; el.setAttribute('aria-label', label);
                if (kind === 's') opts.forEach(([v, n]) => el.append(new Option(n, v)));
                else if (kind === 'd') el.type = 'date';
                else if (kind === 'n') { el.inputMode = 'text'; el.autocomplete = 'off'; }
                el.value = V(k);
                el.addEventListener('input', () => { o.v[o.tab + '_' + k] = el.value; save(); render(); });
                f.append(lb, el);
            });
        }
        $('#copy').onclick = () => Util.copyWithFeedback($('#copy'), last);
        $('#print').onclick = () => window.print();
        $('#reset').onclick = () => {
            if (!confirm('要清除記住的輸入並還原預設嗎？（無法復原）')) return;
            try { localStorage.removeItem(KEY); } catch (e) { }
            o = loadOpts(null); buildForm(); render();
        };
        buildForm(); render();
    </script>
</body>

</html>
