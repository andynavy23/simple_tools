<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="倒數日 / 紀念日：記下重要日期，顯示還有幾天或已經幾天，可設定每年重複，並提供今日下班倒數。">
    <meta property="og:title" content="倒數日 / 紀念日" />
    <meta property="og:description" content="重要日期倒數與今日下班倒數。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/countdown.html" />
    <meta name="st-keys" content="countdown_today,countdown_events">
    <title>倒數日 / 紀念日</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>
        :root {
            --wrap-w: 600px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row>input[type=text] {
            flex: 1 1 160px;
        }

        .row label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        #name {
            flex: 1 1 100%;
        }

        .ev {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
        }

        .ev>div:first-child {
            display: contents;
        }

        .ev .name,
        .ev>div:first-child>small {
            grid-column: 1;
        }

        .ev>div:last-child {
            grid-column: 2;
            grid-row: 1 / 3;
        }

        .ev details {
            grid-column: 1 / -1;
            grid-row: 3;
        }

        .ev .name {
            font-weight: 600;
            word-break: break-all;
        }

        .ev small {
            display: block;
            color: var(--muted);
        }

        .ev .big {
            text-align: right;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .ev .big small {
            font-size: 12px;
            font-weight: 400;
        }

        .future .big {
            color: var(--blue);
        }

        .today .big {
            color: var(--ok);
        }

        .today-big {
            text-align: center;
            font-size: 52px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
            margin: 6px 0 2px;
        }

        .today-sub {
            text-align: center;
            color: var(--muted);
            margin-bottom: 12px;
        }

        progress {
            width: 100%;
            height: 10px;
            accent-color: var(--blue);
        }

        .del {
            background: none;
            color: var(--muted);
            padding: 0 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>倒數日 / 紀念日</h1>
        <p class="sub">記下重要的日子，也能倒數今天的下班時間；每個日期可附清單（例如出發前的行李）。資料只存在這個瀏覽器。</p>

        <div class="card" id="todayCard">
            <h2>今日倒數</h2>
            <div class="row" style="margin-bottom:10px">
                <input type="text" id="tLabel" maxlength="12" placeholder="目標名稱" aria-label="目標名稱" style="max-width:130px">
                <label>開始 <input type="time" id="tStart" aria-label="開始時間"></label>
                <label>目標 <input type="time" id="tEnd" aria-label="目標時間"></label>
            </div>
            <div class="today-big" id="tBig" aria-live="off">--:--:--</div>
            <div class="today-sub" id="tSub"></div>
            <progress id="tProg" value="0" max="1" aria-label="今天的進度"></progress>
        </div>

        <div class="card">
            <div class="row">
                <input type="text" id="name" maxlength="30" placeholder="名稱（例如：旅行出發）" aria-label="名稱">
                <input type="date" id="date" aria-label="日期">
            </div>
            <div class="row" style="margin-top:10px">
                <label><input type="checkbox" id="yearly"> 每年重複（紀念日）</label>
                <button class="primary" id="add" style="margin-left:auto">新增</button>
            </div>
            <p class="note" id="msg"></p>
        </div>

        <div class="card" id="quitCard">
            <h2>戒除計數</h2>
            <p class="note" style="margin-top:0">戒菸 / 戒酒 / 戒糖已持續幾天、省下多少錢。依你填的「每天花費」估算，非醫療建議；有成癮或戒斷症狀請洽醫師。</p>
            <div class="row">
                <input type="text" id="qName" maxlength="30" placeholder="名稱（例如：戒菸）" aria-label="戒除名稱" style="flex:1 1 100%">
                <label>起算日 <input type="date" id="qDate" aria-label="起算日"></label>
                <label>每天花費 NT$ <input type="number" id="qCost" min="0" max="100000" step="1" inputmode="numeric" placeholder="例如 100" aria-label="每天花費" style="width:100px"></label>
            </div>
            <div class="row" style="margin-top:10px"><button class="primary" id="qAdd" style="margin-left:auto">開始計數</button></div>
            <p class="note" id="qMsg"></p>
        </div>

        <div class="card" id="list"></div>
        <div style="text-align:center"><button class="sm" id="ics">匯出成行事曆檔（.ics）</button></div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>倒數日與紀念日記事本，另外有「今日倒數」（例如倒數下班），每個日期還可以附一份清單（行李、出發前待辦）。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>旅行、考試、演唱會，想知道還剩幾天</li>
        <li>生日、結婚紀念日這類每年都會來的日子</li>
        <li>出國前要檢查行李有沒有帶齊</li>
        <li>想看今天距離下班還有多久</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>上方「今日倒數」填目標名稱、開始與目標時間，會即時倒數並顯示進度條</li>
        <li>下方輸入名稱與日期，要每年重複就勾「每年重複（紀念日）」，按「新增」</li>
        <li>列表依距離排序，每筆右邊的 × 可以刪除</li>
        <li>每筆展開「清單」可新增項目（Enter）、勾選完成，或按「加入旅行行李範本」「加入行前待辦範本」一次補上常用項目</li>
        <li>按「匯出成行事曆檔（.ics）」可匯入手機或電腦的行事曆</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">假設今天是 2026-10-03，新增「聖誕節」、日期 2026-12-25：列表顯示「還有 83 天」。勾選「每年重複」後，過了 12/25 會自動算下一次。<br>今日倒數 09:00～18:00，在中午 12:00 看會顯示 06:00:00。</div>
        <h3>小提醒</h3>
        <ul>
        <li>資料只存在這個瀏覽器，換裝置或清除資料就沒了，重要的可先匯出 .ics</li>
        <li>每年重複的 2/29 在非閏年算 2/28</li>
        <li>戒除計數：在「戒除計數」填名稱、起算日與每天花費（0 也可），會在下方列表顯示已持續天數（起算日當天為 0 天，每過一天加 1）、估算省下的金額與下一個里程碑；起算日若在未來則照一般倒數。復發要重來可展開該筆的「清單」按「重新起算（今天）」，不要了按 × 刪除。非醫療建議。</li>
        <li>旅遊倒數：新增旅行出發日，展開「清單」可「加入旅行行李範本」與「加入行前待辦範本」，一邊倒數一邊勾選。</li>
        <li>清單每個日期最多 60 項，同名項目不會重複加入；日期最多 200 個，過期的請按 × 刪除</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { day } = Util;

        // --- pure ---
        const parseYMD = day.parse, daysBetween = day.between; // 兩日期相差幾天（to - from）
        const ymd = ({ y, m, d }) => day.ymd(y, m, d);
        const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

        // 2/29 在非閏年算 2/28
        const anniv = (y, m, d) => ({ y, m, d: m === 2 && d === 29 && !isLeap(y) ? 28 : d });

        // 今天（含）起的下一個紀念日
        function nextAnniversary(todayStr, dateStr) {
            const t = parseYMD(todayStr), e = parseYMD(dateStr);
            let c = anniv(t.y, e.m, e.d);
            if (daysBetween(todayStr, ymd(c)) < 0) c = anniv(t.y + 1, e.m, e.d);
            return ymd(c);
        }

        // 回傳顯示用資訊：{ kind: 'future'|'today'|'past', days, big, label, sub, sort }
        function describe(todayStr, ev) {
            if (!ev.yearly) {
                const diff = daysBetween(todayStr, ev.date);
                if (diff > 0) return { kind: 'future', days: diff, big: diff, label: '還有', sub: ev.date, sort: diff };
                if (diff === 0) return { kind: 'today', days: 0, big: 0, label: '就是今天', sub: ev.date, sort: 0 };
                return { kind: 'past', days: -diff, big: -diff, label: '已經', sub: ev.date, sort: 1e9 - diff };
            }
            const next = nextAnniversary(todayStr, ev.date), diff = daysBetween(todayStr, next);
            const years = parseYMD(next).y - parseYMD(ev.date).y;
            const sinceStart = daysBetween(ev.date, todayStr);
            const nth = years > 0 ? `第 ${years} 週年` : '當天';
            const sub = `${ev.date} 起${sinceStart >= 0 ? `，已 ${sinceStart} 天` : ''} ・ 每年`;
            if (diff === 0) return { kind: 'today', days: 0, big: 0, label: `今天是${nth}`, sub, sort: 0 };
            return { kind: 'future', days: diff, big: diff, label: `距離${nth}還有`, sub, sort: diff };
        }

        // 今日倒數：以「一天中的第幾秒」計算。start / end 為秒數（0–86399），now 為目前秒數
        // 回傳 { state: 'before' | 'during' | 'after' | 'invalid', remaining（秒）, elapsedAfter（秒）, fraction（0–1）}
        function todayProgress(now, start, end) {
            if (!(end > start)) return { state: 'invalid', remaining: 0, elapsedAfter: 0, fraction: 0 };
            if (now < start) return { state: 'before', remaining: end - now, elapsedAfter: 0, fraction: 0 };
            if (now >= end) return { state: 'after', remaining: 0, elapsedAfter: now - end, fraction: 1 };
            return { state: 'during', remaining: end - now, elapsedAfter: 0, fraction: (now - start) / (end - start) };
        }
        const hms = (sec) => [Math.floor(sec / 3600), Math.floor(sec % 3600 / 60), sec % 60].map(v => String(v).padStart(2, '0')).join(':');
        const toSec = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 3600 + +m[2] * 60 : NaN; };

        // 匯出成 iCalendar（.ics）：全天事件；每年重複的用 RRULE。2/29 的週年在非閏年落在 2/28（與畫面上的規則一致）
        const icsEscape = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
        // 每行最多 75 位元組，超過要折行（下一行開頭加一個空白）；以 UTF-8 位元組計算，不切斷多位元組字元
        function icsFold(line) {
            const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
            const out = []; let cur = '', len = 0;
            for (const ch of line) { const n = enc.encode(ch).length, limit = out.length ? 74 : 75; if (len + n > limit) { out.push(cur); cur = ''; len = 0; } cur += ch; len += n; }
            out.push(cur); return out.join('\r\n ');
        }
        const ymdCompact = (s) => s.replace(/-/g, '');
        function buildICS(events, nowIso, uid = (e, i) => `countdown-${i}-${ymdCompact(e.date)}@simple-tools`) {
            const stamp = nowIso.replace(/[-:]/g, '').replace(/\.\d+/, ''), lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//simple_tools//countdown//ZH', 'CALSCALE:GREGORIAN'];
            events.forEach((e, i) => {
                const end = day.shift(e.date, 1), p = parseYMD(e.date);
                lines.push('BEGIN:VEVENT', `UID:${uid(e, i)}`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymdCompact(e.date)}`, `DTEND;VALUE=DATE:${ymdCompact(end)}`, `SUMMARY:${icsEscape(e.name)}`);
                if (e.yearly) lines.push(p.m === 2 && p.d === 29 ? 'RRULE:FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=-1' : 'RRULE:FREQ=YEARLY');
                lines.push('TRANSP:TRANSPARENT', 'END:VEVENT');
            });
            lines.push('END:VCALENDAR');
            return lines.map(icsFold).join('\r\n') + '\r\n';
        }

        // ---------- 每個日期附的清單（旅行行李、出發前待辦…）----------
        // items = [{ t: 文字, done: 布林 }]
        const MAX_ITEMS = 60;
        const PACKING = ['護照 / 證件', '簽證 / 機票 / 訂房憑證', '錢包與現金 / 外幣', '信用卡', '手機與充電線', '行動電源', '轉接頭', '網路卡 / 漫遊', '換洗衣物', '盥洗用品', '常備藥品', '雨具', '太陽眼鏡 / 防曬', '拖鞋', '保險資料'];
        const validItems = (a) => Array.isArray(a) && a.length <= MAX_ITEMS && a.every(x => x && typeof x.t === 'string' && x.t.length >= 1 && x.t.length <= 30 && typeof x.done === 'boolean');
        const itemProgress = (items) => ({ done: items.filter(x => x.done).length, total: items.length });
        const MAX_EVENTS = 200;
        const validEvent = (e) => !!e && typeof e.name === 'string' && e.name.length >= 1 && /^\d{4}-\d{2}-\d{2}$/.test(e.date);
        // 新增一項：去前後空白、不重複、最多 MAX_ITEMS 項；回傳新陣列（不合法就原樣回傳）
        function addItem(items, text) {
            const t = String(text).trim().slice(0, 30);
            return !t || items.length >= MAX_ITEMS || items.some(x => x.t === t) ? items : [...items, { t, done: false }];
        }
        const toggleItem = (items, i) => items.map((x, k) => (k === i ? { ...x, done: !x.done } : x));
        // 把範本中還沒有的項目補進來
        const mergeTemplate = (items, tpl) => tpl.reduce((acc, t) => addItem(acc, t), items);
        const TRIP_TODO = ['訂機票', '訂住宿', '確認護照效期（6 個月以上）', '辦理簽證 / 入境登記', '購買旅平險 / 旅遊保險', '換匯 / 確認信用卡海外額度', '申請網卡 / eSIM / 漫遊', '預辦登機 / 選位', '確認行李額度與違禁品', '下載離線地圖', '安排家中事務（鑰匙 / 寵物 / 垃圾）', '列印 / 截圖各種憑證', '查當地天氣、電壓與插頭'];

        // ---------- 戒除計數（存成一般日期的 quit: { perDay } 欄位，date 為起算日）----------
        const QUIT_MILESTONES = [1, 3, 7, 14, 30, 60, 100, 180, 365, 730, 1000, 1825, 3650];
        const validPerDay = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 100000;
        // 載入時清理：quit 不合法就拿掉（變成一般日期），合法則取整數花費
        function cleanEvent(e) {
            if (!validEvent(e)) return null;
            const out = { ...e };
            if ('quit' in out) { if (out.quit && validPerDay(out.quit.perDay)) out.quit = { perDay: Math.round(out.quit.perDay) }; else delete out.quit; }
            return out;
        }
        const nextMilestone = (days) => QUIT_MILESTONES.find(m => m > days) || null;
        // 已持續天數（起算日當天 = 0）與省下金額；起算日在未來回傳 { pending: 還有幾天 }
        function quitStats(todayStr, e) {
            const days = daysBetween(e.date, todayStr);
            if (days < 0) return { pending: -days };
            const nm = nextMilestone(days);
            return { days, saved: days * e.quit.perDay, next: nm, toNext: nm === null ? null : nm - days };
        }
        function describeQuit(todayStr, e) {
            const q = quitStats(todayStr, e);
            if (q.pending) return { kind: 'future', days: q.pending, big: q.pending, label: '距離開始還有', sub: e.date + ' 起算 ・ 戒除', sort: q.pending, text: q.pending + ' 天' };
            const ms = q.next === null ? '' : ` ・ 下個里程碑 ${q.next} 天（還有 ${q.toNext} 天）`;
            return { kind: 'today', days: q.days, big: q.days, label: '已持續', sub: `${e.date} 起算 ・ 省下約 NT$ ${q.saved.toLocaleString('zh-TW')}${ms}`, sort: 1e9 - q.days, text: q.days + ' 天' };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const KEY = 'countdown_events';
        let events = (Array.isArray(Util.store.get(KEY, [])) ? Util.store.get(KEY, []) : []).map(cleanEvent).filter(Boolean).slice(0, MAX_EVENTS);
        const todayStr = day.today;
        $('#date').value = todayStr();

        const openKeys = new Set();                                        // 重畫時保持「清單」展開的狀態
        const save = () => Util.store.set(KEY, events);

        function checklist(e) {
            e.items = validItems(e.items) ? e.items : [];
            const key = e.name + '|' + e.date, { done, total } = itemProgress(e.items);
            const det = document.createElement('details'); det.open = openKeys.has(key);
            det.ontoggle = () => { det.open ? openKeys.add(key) : openKeys.delete(key); };
            const sum = document.createElement('summary'); sum.textContent = (total ? `清單 ${done}/${total}` : '清單') + (e.quit ? '・重新起算' : ''); sum.style.cssText = 'cursor:pointer;font-size:13px;color:var(--muted)';
            det.append(sum);
            e.items.forEach((x, i) => {
                const lab = document.createElement('label'); lab.style.cssText = 'display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px';
                const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: x.done });
                cb.onchange = () => { e.items = toggleItem(e.items, i); save(); render(); };
                const del = Object.assign(document.createElement('button'), { className: 'sm', textContent: '×' }); del.setAttribute('aria-label', '移除 ' + x.t); del.style.marginLeft = 'auto';
                del.onclick = (ev) => { ev.preventDefault(); e.items = e.items.filter((_, k) => k !== i); save(); render(); };
                lab.append(cb, Object.assign(document.createElement('span'), { textContent: x.t, style: x.done ? 'text-decoration:line-through;opacity:.55' : '' }), del);
                det.append(lab);
            });
            const add = Object.assign(document.createElement('input'), { type: 'text', maxLength: 30, placeholder: '新增項目（Enter）' }); add.setAttribute('aria-label', '新增清單項目'); add.style.cssText = 'width:100%;margin-top:6px';
            add.onkeydown = (ev) => { if (ev.key === 'Enter' && add.value.trim()) { openKeys.add(key); e.items = addItem(e.items, add.value); save(); render(); } };
            const tpl = Object.assign(document.createElement('button'), { className: 'sm', textContent: '加入旅行行李範本' }); tpl.style.marginTop = '6px';
            tpl.onclick = () => { openKeys.add(key); e.items = mergeTemplate(e.items, PACKING); save(); render(); };
            const todo = Object.assign(document.createElement('button'), { className: 'sm', textContent: '加入行前待辦範本' }); todo.style.cssText = 'margin:6px 0 0 6px';
            todo.onclick = () => { openKeys.add(key); e.items = mergeTemplate(e.items, TRIP_TODO); save(); render(); };
            det.append(add, tpl, todo);
            if (e.quit) {
                const rs = Object.assign(document.createElement('button'), { className: 'sm', textContent: '重新起算（今天）' }); rs.style.cssText = 'margin:6px 0 0 6px';
                rs.onclick = () => { if (confirm(`把「${e.name}」的起算日改成今天？已持續天數會歸零，無法復原。`)) { e.date = todayStr(); save(); render(); } };
                det.append(rs);
            }
            return det;
        }

        function render() {
            const box = $('#list');
            box.replaceChildren();
            if (!events.length) { box.append(Object.assign(document.createElement('div'), { className: 'muted', textContent: '還沒有任何日期，從上面新增一個吧' })); return; }
            const today = todayStr();
            events.map((e, i) => ({ e, i, d: e.quit ? describeQuit(today, e) : describe(today, e) })).sort((a, b) => a.d.sort - b.d.sort).forEach(({ e, i, d }) => {
                const row = document.createElement('div');
                row.className = 'li ev ' + d.kind;
                const left = document.createElement('div');
                const name = document.createElement('div'), sub = document.createElement('small');
                name.className = 'name'; name.textContent = e.name;
                sub.textContent = d.sub;
                left.append(name, sub, checklist(e));
                const right = document.createElement('div');
                right.className = 'big';
                right.innerHTML = '<small></small><span></span>';
                right.firstChild.textContent = d.label;
                right.lastChild.textContent = d.text || (d.kind === 'today' ? '🎉' : `${d.big} 天`);
                right.firstChild.style.display = 'block';
                const del = document.createElement('button');
                del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '刪除 ' + e.name);
                del.onclick = () => { events.splice(i, 1); save(); render(); };
                const wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex;align-items:center;gap:6px';
                wrap.append(right, del);
                row.append(left, wrap);
                box.append(row);
            });
        }

        $('#add').onclick = () => {
            const name = $('#name').value.trim(), date = $('#date').value;
            if (!name) { $('#msg').textContent = '請輸入名稱'; return; }
            if (!date) { $('#msg').textContent = '請選擇日期'; return; }
            if (events.length >= MAX_EVENTS) { $('#msg').textContent = `最多 ${MAX_EVENTS} 個日期，請先刪除不用的`; return; }
            events.push({ name, date, yearly: $('#yearly').checked, items: [] });
            save();
            $('#name').value = ''; $('#msg').textContent = '';
            render();
        };
        $('#qDate').value = todayStr();
        $('#qAdd').onclick = () => {
            const name = $('#qName').value.trim(), date = $('#qDate').value, cost = $('#qCost').value.trim() === '' ? 0 : Number($('#qCost').value), m = $('#qMsg');
            if (!name) { m.textContent = '請輸入名稱'; return; }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { m.textContent = '請選擇起算日'; return; }
            if (!validPerDay(cost)) { m.textContent = '每天花費請輸入 0–100000'; return; }
            if (events.length >= MAX_EVENTS) { m.textContent = `最多 ${MAX_EVENTS} 個日期，請先刪除不用的`; return; }
            events.push({ name, date, yearly: false, items: [], quit: { perDay: Math.round(cost) } }); save();
            $('#qName').value = ''; m.textContent = '已開始計數'; render();
        };
        // ---------- 今日倒數 ----------
        const cfg = { label: '下班', start: '09:00', end: '18:00', ...(Util.store.get('countdown_today', null) || {}) };
        $('#tLabel').value = cfg.label; $('#tStart').value = cfg.start; $('#tEnd').value = cfg.end;
        function tickToday() {
            const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(), label = $('#tLabel').value.trim() || '目標';
            const r = todayProgress(now, toSec($('#tStart').value), toSec($('#tEnd').value));
            $('#tProg').value = r.fraction;
            if (r.state === 'invalid') { $('#tBig').textContent = '--:--:--'; $('#tSub').textContent = '請設定開始與目標時間（目標要晚於開始）'; return; }
            $('#tBig').textContent = r.state === 'after' ? '🎉' : hms(r.remaining);
            $('#tSub').textContent = r.state === 'before' ? `距離${label}還有，今天還沒開始（${$('#tStart').value} 開始）` : r.state === 'during' ? `距離${label}還有 ・ 已過 ${Math.round(r.fraction * 100)}%` : `已經${label}了 ${Math.floor(r.elapsedAfter / 60)} 分鐘`;
        }
        ['tLabel', 'tStart', 'tEnd'].forEach(id => { $('#' + id).oninput = () => { Util.store.set('countdown_today', { label: $('#tLabel').value, start: $('#tStart').value, end: $('#tEnd').value }); tickToday(); }; });
        setInterval(tickToday, 1000); tickToday();

        $('#ics').onclick = () => { if (!events.length) { $('#msg').textContent = '還沒有日期可以匯出'; return; } Util.download(new Blob([buildICS(events, new Date().toISOString())], { type: 'text/calendar;charset=utf-8' }), 'countdown.ics'); };
        $('#name').onkeydown = (e) => { if (e.key === 'Enter') $('#add').click(); };
        render();
    </script>
</body>

</html>
