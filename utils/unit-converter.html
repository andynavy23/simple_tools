<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="單位與匯率換算：長度、重量、面積（含坪）、體積、溫度、速度、資料量、烹飪（杯 / 匙 / 公克，依食材），以及即時匯率。">
    <meta property="og:title" content="單位與匯率換算" />
    <meta property="og:description" content="常用單位（含台尺、台斤、坪）、烹飪用量與即時匯率一次換算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/unit-converter.html" />
    <meta name="st-keys" content="fx_cache">
    <title>單位與匯率換算</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <script src="../shared/js/chrome.js"></script>
    <style>

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .in {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
        }
    
        .me {
            color: var(--blue);
        }
</style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>單位與匯率換算</h1>
        <p class="sub">輸入數字，所有單位一次列出；烹飪類別可依食材換算杯、匙與公克。</p>

        <div class="card">
            <div class="chips" id="cats"></div>
            <div class="in">
                <input id="val" type="number" inputmode="decimal" value="1" step="any" aria-label="數值">
                <select id="from" aria-label="單位"></select>
            </div>
            <select id="ing" aria-label="食材" hidden style="margin-top:8px"></select>
            <p class="note" id="note"></p>
        </div>

        <div class="card" id="out"></div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>輸入一個數字，一次列出同類別所有單位的換算結果，包含台尺、台斤、坪，也有烹飪（杯 / 匙 / 公克）與即時匯率。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>看房子的坪數換成平方公尺。</li>
        <li>食譜是美制杯，手邊只有電子秤。</li>
        <li>出國前估算外幣換多少新台幣。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>點上方分類：長度、重量、面積、體積、速度、資料量、烹飪、溫度、匯率。</li>
        <li>在輸入框填數值，並選右邊的單位。</li>
        <li>下方列出所有單位的結果，你選的單位會以強調色標示。</li>
        <li>烹飪類別要另外選「食材」，體積與重量才會依密度互換。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">面積、輸入 10、單位「坪」→ 33.05785124 平方公尺
        溫度、輸入 100、單位 °C → 212 °F</div>
        <h3>小提醒</h3>
        <ul>
        <li>烹飪換算是一般舀法的近似值，實際依品牌與緊實度而不同。</li>
        <li>匯率需要網路，會快取 6 小時；離線時顯示快取並註明；僅供參考，不是實際交易價。</li>
        <li>極大或極小的數字會用科學記號顯示。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 一般類別：每個單位對應「基準單位」的倍率
        const CATS = {
            長度: { 公釐: 0.001, 公分: 0.01, 公尺: 1, 公里: 1000, 英寸: 0.0254, 英尺: 0.3048, 碼: 0.9144, 英里: 1609.344, 海里: 1852, 台尺: 10 / 33 },
            重量: { 公克: 0.001, 公斤: 1, 公噸: 1000, 磅: 0.45359237, 盎司: 0.028349523125, 台兩: 0.0375, 台斤: 0.6 },
            面積: { 平方公尺: 1, 平方公里: 1e6, 公頃: 1e4, 坪: 400 / 121, 甲: 9699.17, 平方英尺: 0.09290304, 英畝: 4046.8564224 },
            體積: { 毫升: 0.001, 公升: 1, 立方公尺: 1000, 美制杯: 0.2365882365, 美制品脫: 0.473176473, 美制加侖: 3.785411784, 美制液體盎司: 0.0295735295625 },
            速度: { '公尺/秒': 1, '公里/小時': 1 / 3.6, '英里/小時': 0.44704, 節: 1852 / 3600 },
            資料量: { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824 },
        };
        // 溫度不是倍率關係：先轉成攝氏，再轉出
        const TEMP = {
            '°C': { to: v => v, from: c => c },
            '°F': { to: v => (v - 32) * 5 / 9, from: c => c * 9 / 5 + 32 },
            'K': { to: v => v - 273.15, from: c => c + 273.15 },
        };
        // 匯率：rates 以新台幣為基準（1 TWD = rates[code] 單位外幣）
        const CURRENCIES = { TWD: '新台幣', USD: '美元', JPY: '日圓', EUR: '歐元', CNY: '人民幣', HKD: '港幣', KRW: '韓元', GBP: '英鎊', AUD: '澳幣', CAD: '加幣', SGD: '新加坡幣', THB: '泰銖', VND: '越南盾' };

        // 烹飪：體積與重量互換需要「密度」（每毫升幾公克）。數值為常見食譜換算的近似值（杯量依一般舀法），實際會因品牌與緊實度不同
        const COOK_VOL = { 毫升: 1, 茶匙: 5, 湯匙: 15, 公制杯: 250, 美制杯: 236.5882365, 美制液體盎司: 29.5735295625 };
        const COOK_MASS = { 公克: 1, 公斤: 1000, 盎司: 28.349523125, 磅: 453.59237, 台兩: 37.5 };
        const INGREDIENTS = { 水: 1, 牛奶: 1.03, 鮮奶油: 0.99, 食用油: 0.92, 蜂蜜: 1.42, 醬油: 1.15, 細鹽: 1.2, 砂糖: 0.85, 糖粉: 0.51, 黑糖: 0.9, 低筋麵粉: 0.53, 奶油: 0.96, 可可粉: 0.46, 生米: 0.85, 燕麥片: 0.37 };

        function unitsOf(cat) {
            if (cat === '烹飪') return [...Object.keys(COOK_VOL), ...Object.keys(COOK_MASS)];
            if (cat === '溫度') return Object.keys(TEMP);
            if (cat === '匯率') return Object.keys(CURRENCIES);
            return Object.keys(CATS[cat]);
        }

        // 回傳 [{ unit, value }]，涵蓋該類別全部單位
        function convertAll(cat, value, from, rates, ingredient = '水') {
            const units = unitsOf(cat);
            if (cat === '烹飪') {
                const d = INGREDIENTS[ingredient];
                const ml = from in COOK_VOL ? value * COOK_VOL[from] : value * COOK_MASS[from] / d;
                return units.map(u => ({ unit: u, value: u in COOK_VOL ? ml / COOK_VOL[u] : ml * d / COOK_MASS[u] }));
            }
            if (cat === '溫度') {
                const c = TEMP[from].to(value);
                return units.map(u => ({ unit: u, value: TEMP[u].from(c) }));
            }
            if (cat === '匯率') {
                const twd = value / rates[from];
                return units.map(u => ({ unit: u, value: twd * rates[u] }));
            }
            const base = value * CATS[cat][from];
            return units.map(u => ({ unit: u, value: base / CATS[cat][u] }));
        }

        function fmt(v) {
            if (!isFinite(v)) return '—';
            const a = Math.abs(v);
            if (a !== 0 && (a >= 1e12 || a < 1e-6)) return v.toExponential(4);
            return Number(v.toPrecision(10)).toLocaleString('zh-TW', { maximumFractionDigits: 8 });
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const ALL = [...Object.keys(CATS), '烹飪', '溫度', '匯率'];
        let cat = '長度', fx = null, fxLoading = false; // fx: { rates, time, stale } | null

        async function loadRates() {
            const KEY = 'fx_cache';
            let cache = Util.store.get(KEY, null);
            if (cache && Date.now() - cache.fetched < 6 * 3600e3) return { ...cache, stale: false };
            try {
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), 8000);
                const res = await fetch('https://open.er-api.com/v6/latest/TWD', { signal: ctl.signal });
                clearTimeout(timer);
                const j = await res.json();
                if (j.result !== 'success') throw new Error('bad response');
                cache = { rates: j.rates, time: j.time_last_update_utc, fetched: Date.now() };
                Util.store.set(KEY, cache);
                return { ...cache, stale: false };
            } catch (e) {
                return cache ? { ...cache, stale: true } : null;
            }
        }

        function fillUnits() {
            const sel = $('#from');
            sel.replaceChildren();
            unitsOf(cat).forEach(u => {
                const o = document.createElement('option');
                o.value = u;
                o.textContent = cat === '匯率' ? `${u} ${CURRENCIES[u]}` : u;
                sel.append(o);
            });
        }

        function render() {
            const out = $('#out'), note = $('#note');
            out.replaceChildren();
            note.replaceChildren();
            if (cat === '烹飪') note.textContent = '體積與重量互換依食材密度估算（一般舀法），不同品牌、篩過與否、壓緊程度會有差異，食譜請以實際為準。';
            if (cat === '匯率') {
                if (fxLoading) { out.textContent = '載入匯率中…'; return; }
                if (!fx) { out.textContent = '目前無法取得匯率，請確認網路後重新整理。'; return; }
                const a = document.createElement('a');
                a.href = 'https://www.exchangerate-api.com';
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Rates By Exchange Rate API';
                note.append(`匯率更新時間：${new Date(fx.time).toLocaleString('zh-TW')}${fx.stale ? '（離線快取，可能不是最新）' : ''} ・ `, a, '。匯率僅供參考，不代表實際交易價格。');
            }
            const v = parseFloat($('#val').value);
            if (isNaN(v)) { out.textContent = '請輸入數字'; return; }
            const from = $('#from').value;
            convertAll(cat, v, from, fx?.rates, $('#ing').value).forEach(({ unit, value }) => {
                out.append(Util.statRow(cat === '匯率' ? `${unit} ${CURRENCIES[unit]}` : unit, fmt(value), unit === from ? 'me' : ''));
            });
        }

        function setCat(c) {
            cat = c;
            document.querySelectorAll('#cats button').forEach(b => b.setAttribute('aria-pressed', b.textContent === c));
            fillUnits(); $('#ing').hidden = c !== '烹飪';
            if (c === '匯率' && !fx && !fxLoading) {
                fxLoading = true;
                loadRates().then(r => { fx = r; fxLoading = false; if (cat === '匯率') render(); });
            }
            render();
        }

        ALL.forEach(c => {
            const b = document.createElement('button');
            b.className = 'sm';
            b.textContent = c;
            b.onclick = () => setCat(c);
            $('#cats').append(b);
        });
        $('#ing').replaceChildren(...Object.keys(INGREDIENTS).map(k => new Option(k, k)));
        $('#ing').onchange = render;
        $('#val').oninput = render;
        $('#from').onchange = render;
        setCat('長度');
    </script>
</body>

</html>
