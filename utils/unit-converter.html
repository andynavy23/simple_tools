<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="單位與匯率換算：長度、重量、面積（含坪）、體積、溫度、速度、資料量，以及即時匯率。">
    <meta property="og:title" content="單位與匯率換算" />
    <meta property="og:description" content="常用單位（含台尺、台斤、坪）與即時匯率一次換算。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/utils/unit-converter.html" />
    <title>單位與匯率換算</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #fff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --fill: rgba(118, 118, 128, .12);
            --blue: #0071e3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --muted: #98989d;
                --fill: rgba(118, 118, 128, .24);
                --blue: #2997ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 20px;
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 0 48px;
        }

        a {
            color: var(--blue);
        }

        a.back {
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            font-size: 32px;
            margin: 12px 0 4px;
            letter-spacing: -.02em;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }

        .chip {
            font: inherit;
            font-size: 14px;
            white-space: nowrap;
            border: 0;
            border-radius: 980px;
            padding: 6px 14px;
            background: var(--fill);
            color: var(--text);
            cursor: pointer;
        }

        .chip[aria-pressed=true] {
            background: var(--text);
            color: var(--bg);
        }

        .in {
            display: flex;
            gap: 10px;
        }

        input,
        select {
            font: inherit;
            color: var(--text);
            background: var(--fill);
            border: 0;
            border-radius: 12px;
            padding: 10px 12px;
        }

        input {
            flex: 1;
            min-width: 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid var(--fill);
        }

        .row:last-child {
            border: 0;
        }

        .row span:first-child {
            color: var(--muted);
        }

        .row b {
            font-variant-numeric: tabular-nums;
            text-align: right;
            word-break: break-all;
        }

        .row.me b {
            color: var(--blue);
        }

        .note {
            color: var(--muted);
            font-size: 13px;
            margin: 10px 0 0;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>單位與匯率換算</h1>
        <p class="sub">輸入數字，所有單位一次列出。</p>

        <div class="card">
            <div class="chips" id="cats"></div>
            <div class="in">
                <input id="val" type="number" inputmode="decimal" value="1" step="any" aria-label="數值">
                <select id="from" aria-label="單位"></select>
            </div>
            <p class="note" id="note"></p>
        </div>

        <div class="card" id="out"></div>
    </div>

    <script>
        // --- pure ---
        // 一般類別：每個單位對應「基準單位」的倍率
        const CATS = {
            長度: { 公釐: 0.001, 公分: 0.01, 公尺: 1, 公里: 1000, 英寸: 0.0254, 英尺: 0.3048, 碼: 0.9144, 英里: 1609.344, 海里: 1852, 台尺: 10 / 33 },
            重量: { 公克: 0.001, 公斤: 1, 公噸: 1000, 磅: 0.45359237, 盎司: 0.028349523125, 台兩: 0.0375, 台斤: 0.6 },
            面積: { 平方公尺: 1, 平方公里: 1e6, 公頃: 1e4, 坪: 400 / 121, 甲: 9699.17, 平方英尺: 0.09290304, 英畝: 4046.8564224 },
            體積: { 毫升: 0.001, 公升: 1, 立方公尺: 1000, 美制杯: 0.2365882365, 美制品脫: 0.473176473, 美制加侖: 3.785411784, 美制液體盎司: 0.0295735295625 },
            速度: { '公尺/秒': 1, '公里/小時': 1 / 3.6, '英里/小時': 0.44704, 節: 1852 / 3600 },
            資料量: { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824 },
        };
        // 溫度不是倍率關係：先轉成攝氏，再轉出
        const TEMP = {
            '°C': { to: v => v, from: c => c },
            '°F': { to: v => (v - 32) * 5 / 9, from: c => c * 9 / 5 + 32 },
            'K': { to: v => v - 273.15, from: c => c + 273.15 },
        };
        // 匯率：rates 以新台幣為基準（1 TWD = rates[code] 單位外幣）
        const CURRENCIES = { TWD: '新台幣', USD: '美元', JPY: '日圓', EUR: '歐元', CNY: '人民幣', HKD: '港幣', KRW: '韓元', GBP: '英鎊', AUD: '澳幣', CAD: '加幣', SGD: '新加坡幣', THB: '泰銖', VND: '越南盾' };

        function unitsOf(cat) {
            if (cat === '溫度') return Object.keys(TEMP);
            if (cat === '匯率') return Object.keys(CURRENCIES);
            return Object.keys(CATS[cat]);
        }

        // 回傳 [{ unit, value }]，涵蓋該類別全部單位
        function convertAll(cat, value, from, rates) {
            const units = unitsOf(cat);
            if (cat === '溫度') {
                const c = TEMP[from].to(value);
                return units.map(u => ({ unit: u, value: TEMP[u].from(c) }));
            }
            if (cat === '匯率') {
                const twd = value / rates[from];
                return units.map(u => ({ unit: u, value: twd * rates[u] }));
            }
            const base = value * CATS[cat][from];
            return units.map(u => ({ unit: u, value: base / CATS[cat][u] }));
        }

        function fmt(v) {
            if (!isFinite(v)) return '—';
            const a = Math.abs(v);
            if (a !== 0 && (a >= 1e12 || a < 1e-6)) return v.toExponential(4);
            return Number(v.toPrecision(10)).toLocaleString('zh-TW', { maximumFractionDigits: 8 });
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const ALL = [...Object.keys(CATS), '溫度', '匯率'];
        let cat = '長度', fx = null, fxLoading = false; // fx: { rates, time, stale } | null

        async function loadRates() {
            const KEY = 'fx_cache';
            let cache = null;
            try { cache = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
            if (cache && Date.now() - cache.fetched < 6 * 3600e3) return { ...cache, stale: false };
            try {
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), 8000);
                const res = await fetch('https://open.er-api.com/v6/latest/TWD', { signal: ctl.signal });
                clearTimeout(timer);
                const j = await res.json();
                if (j.result !== 'success') throw new Error('bad response');
                cache = { rates: j.rates, time: j.time_last_update_utc, fetched: Date.now() };
                try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) { }
                return { ...cache, stale: false };
            } catch (e) {
                return cache ? { ...cache, stale: true } : null;
            }
        }

        function fillUnits() {
            const sel = $('#from');
            sel.replaceChildren();
            unitsOf(cat).forEach(u => {
                const o = document.createElement('option');
                o.value = u;
                o.textContent = cat === '匯率' ? `${u} ${CURRENCIES[u]}` : u;
                sel.append(o);
            });
        }

        function render() {
            const out = $('#out'), note = $('#note');
            out.replaceChildren();
            note.replaceChildren();
            if (cat === '匯率') {
                if (fxLoading) { out.textContent = '載入匯率中…'; return; }
                if (!fx) { out.textContent = '目前無法取得匯率，請確認網路後重新整理。'; return; }
                const a = document.createElement('a');
                a.href = 'https://www.exchangerate-api.com';
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Rates By Exchange Rate API';
                note.append(`匯率更新時間：${new Date(fx.time).toLocaleString('zh-TW')}${fx.stale ? '（離線快取，可能不是最新）' : ''} ・ `, a, '。匯率僅供參考，不代表實際交易價格。');
            }
            const v = parseFloat($('#val').value);
            if (isNaN(v)) { out.textContent = '請輸入數字'; return; }
            const from = $('#from').value;
            convertAll(cat, v, from, fx?.rates).forEach(({ unit, value }) => {
                const row = document.createElement('div');
                row.className = 'row' + (unit === from ? ' me' : '');
                const l = document.createElement('span'), r = document.createElement('b');
                l.textContent = cat === '匯率' ? `${unit} ${CURRENCIES[unit]}` : unit;
                r.textContent = fmt(value);
                row.append(l, r);
                out.append(row);
            });
        }

        function setCat(c) {
            cat = c;
            document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.textContent === c));
            fillUnits();
            if (c === '匯率' && !fx && !fxLoading) {
                fxLoading = true;
                loadRates().then(r => { fx = r; fxLoading = false; if (cat === '匯率') render(); });
            }
            render();
        }

        ALL.forEach(c => {
            const b = document.createElement('button');
            b.className = 'chip';
            b.textContent = c;
            b.onclick = () => setCat(c);
            $('#cats').append(b);
        });
        $('#val').oninput = render;
        $('#from').onchange = render;
        setCat('長度');
    </script>
</body>

</html>
