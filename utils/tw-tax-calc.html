        <h1>台灣稅費試算</h1>
        <p class="sub">房屋土地、遺產贈與、進口免稅、營業稅的粗估，全部在本機計算。</p>
        <div class="banner" id="banner">本頁所有數字都是「粗估」，稅率與金額每年或各縣市可能不同，不構成稅務建議；每個分頁頂端的稅制常數表可自行修改，正式金額請以稅單、財政部與地方稅務局公告為準。</div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>把常見的台灣稅費集中成四個分頁的粗估工具：房屋與土地（房屋稅、地價稅、契稅、土地增值稅、買賣各自成本）、遺產稅與贈與稅、進口與免稅額（海外網購進口稅、出國菸酒與行李免稅）、營業稅（含稅未稅換算、發票拆分、小規模營業人、營利事業所得稅）。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>買賣房屋前，先抓契稅、印花稅、土增稅與仲介代書費大概多少。</li>
            <li>規劃贈與或估算遺產時，看免稅額、扣除額與累進稅率的影響。</li>
            <li>海外網購、出國購物前，判斷會不會被課稅、菸酒帶多少算超量。</li>
            <li>開發票、報價時換算含稅 / 未稅，或粗估小店的營業稅與營所稅。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li>點上方分頁；每個分頁最上面是「稅制常數表」，標示適用年度與來源，數字可直接改（改了會一起記住）。</li>
            <li>往下填金額（元）；結果在每個區塊下方即時更新。</li>
            <li>標「範例值」的稅率是各縣市或各商品不同的數字，請換成你自己的。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">遺產稅（遺產總額 3,000 萬、有配偶、子女 2 人、父母 0、含喪葬費）
免稅額 1,333 萬 + 配偶 553 萬 + 子女 2 × 56 萬 + 喪葬費 138 萬
→ 課稅遺產淨額 864 萬，適用 10%，稅額 864,000

進口：貨價 1,500 + 運費 600 = 完稅價格 2,100，超過 2,000 免稅門檻
關稅 10%（範例）210、營業稅 (2,100 + 210) × 5% = 116</div>
        <h3>小提醒</h3>
        <ul>
            <li><b>這是粗估，不構成稅務建議</b>。房屋稅、地價稅的稅率與累進起點因縣市而異；土增稅的免稅、重購退稅、課稅現值、特殊減免都未納入；遺產稅的剩餘財產差額分配、死亡前兩年贈與併計、不計入遺產項目都未納入。</li>
            <li>進口稅：關稅與貨物稅稅率依商品而定（稅則），請自行填；菸酒不適用小額免稅，菸酒稅 / 健康福利捐未計算。行李免稅額、菸酒量以海關最新公告為準；加熱菸的新制請自行向海關確認。</li>
            <li>營所稅只適用公司 / 有限公司等營利事業；獨資、合夥的所得是併入負責人綜合所得稅（可用「年度綜合所得稅概算」）。小規模營業人的起徵點與是否需開立發票可能再調整。</li>
            <li>只記住上次分頁、各欄輸入與你改過的常數（存在這台裝置，可用右上角 💾 備份）；按「清除已記住的輸入與常數」會刪除並還原預設，無法復原。輸入有上限，超過會被截斷；壞掉或被改過的記憶資料會被忽略並用預設值。</li>
        </ul>

            if (v.bAmt > 0) {
                const a = calcVat(v.bAmt, v.bMode, rate, v.bRound);
                r.push(['h', '含稅 / 未稅'], ['未稅金額', fmt(a.net)], [`營業稅（${rate}%）`, fmt(a.tax)], ['含稅金額', fmt(a.gross), 1]);
            }
            const lines = parseLines(v.bLines);
            if (lines.length) {
                const a = calcInvoice(lines, v.bLineMode, rate, v.bRound);
                r.push(['h', `發票拆分（${a.n} 筆）`], ['各筆稅額加總', fmt(a.eachTax)], ['合計後算稅額', fmt(a.total.tax)], ['差異', (a.diff > 0 ? '+' : '') + a.diff + ' 元', 1], ['合計：未稅 / 稅額 / 含稅', `${fmt(a.total.net)} / ${fmt(a.total.tax)} / ${fmt(a.total.gross)}`]);
                r.push(['n', '一張發票的稅額通常以整張合計計算，逐筆各自進位的加總可能差幾元。']);
            }
            if (v.mGoods > 0 || v.mSvc > 0) {
                const s = calcSmall(v, c);
                r.push(['h', '小規模營業人'], ['合計占起徵點比例', pct(s.ratio, 1)], ['是否達起徵點', s.taxable ? '達（需課稅）' : '未達（免稅）']);
                r.push([`查定營業稅（${v.mMonths} 個月）`, fmt(s.total) + ' 元', 1]);
            }
            if (v.yRev > 0 || v.yIncome > 0) {
                const y = calcCorp(v, c);
                r.push(['h', '營利事業所得稅'], ['課稅所得額', fmt(y.income)], ['營所稅（概算）', fmt(y.tax) + ' 元', 1]);
                if (y.bookOver) r.push(['n', `全年收入超過 ${fmt(c.ceBook)} 元，可能不適用擴大書審，純益率請以實際帳務為準。`]);
                r.push(['n', '僅適用公司 / 有限公司等營利事業；獨資、合夥併入負責人綜合所得稅。未計未分配盈餘加徵、虧損扣除與各項減免。']);
            }
            if (!r.length) r.push(['n', '填入金額後即顯示結果。']);
            return r;
        }
        const ROWS = { house: rowsHouse, estate: rowsEstate, import: rowsImport, vat: rowsVat };

        function render(save) {
            S = read();
            for (const t of TABS) { $('#p_' + t.id).hidden = t.id !== S.tab; $('#t_' + t.id).setAttribute('aria-pressed', t.id === S.tab); }
            const out = $('#o_' + S.tab); out.replaceChildren();
            for (const x of ROWS[S.tab](S.v, S.c)) {
                if (x[0] === 'h') out.append(el('div', 'sec', x[1]));
                else if (x[0] === 'n') out.append(el('p', 'note', x[1]));
                else out.append(li(x[0], x[1], x[2]));
            }
            if (save) store.set(KEY, S);
        }
        $('#panels').addEventListener('input', () => render(true));
        $('#panels').addEventListener('change', () => render(true));
        $('#reset').onclick = () => {
            if (!confirm('要清除已記住的輸入與你改過的稅制常數，並還原預設嗎？\n只會刪除本頁記住的內容，無法復原。')) return;
            try { localStorage.removeItem(KEY); } catch (e) { }
            S = sanitize(null); write(S); render(false);
        };
        S = sanitize(store.get(KEY, null)); write(S); render(false);
    </script>
</body>

</html>
