        <h1>發票 / 樂透對獎</h1>
        <p class="sub">開獎號碼請自行到財政部或台灣彩券官網查詢後貼上，這個頁面只負責核對，不會上網查資料。結果僅供參考，以官方公告為準。</p>

        <div class="card">

                    <div><label for="sp">特別獎 <small>8 碼・1000 萬</small></label><input id="sp" inputmode="numeric" maxlength="8" placeholder="8 碼"></div>

                    <div style="grid-column:1/-1"><label for="fi">頭獎（最多 3 組，空白或逗號分隔）<small>末 8 碼 20 萬；末 7 碼二獎 4 萬、6 碼三獎 1 萬、5 碼四獎 4 千、4 碼五獎 1 千、3 碼六獎 200</small></label><input id="fi" placeholder="例如：12345678 23456789 34567890" style="width:100%"></div>
                    <div style="grid-column:1/-1"><label for="ex">增開六獎（末 3 碼，可多組）<small>200 元</small></label><input id="ex" placeholder="例如：123 456" style="width:100%"></div>
                </div>
                <label for="tix" style="display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)">要對的發票（一行一張，可連字軌一起貼，如 AB-12345678）</label>

            <div class="pane" data-t="big" hidden>

                </div>
                <label for="bt" style="display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)">你的號碼（一行一注，6 個號碼）</label>
                <textarea id="bt" spellcheck="false" placeholder="03 12 18 25 33 47"></textarea>
            </div>

            <div class="pane" data-t="pw" hidden>
                <div class="fgrid">
                    <div style="grid-column:1/-1"><label for="pwW">第一區開獎號碼（6 個）<small>1–38</small></label><input id="pwW" placeholder="例如：05 11 20 27 33 38" style="width:100%"></div>
                    <div><label for="pwS">第二區號碼</label><input id="pwS" inputmode="numeric" placeholder="1–8"></div>
                </div>
                <label for="pwT" style="display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)">你的號碼（一行一注：第一區 6 個，最後一個是第二區，可用「/」或「+」隔開）</label>

    <template id="help">
        <h3>這是什麼</h3>
        <p>幫你核對統一發票、大樂透、威力彩、今彩 539 有沒有中獎。開獎號碼要自己貼上，這個頁面不會上網查。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>手上一疊發票想一次對完。</li>
        <li>買了好幾注樂透，想快速看各注中幾個號碼。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>先到財政部或台灣彩券官網查到本期開獎號碼。</li>
        <li>統一發票：填特別獎、特獎、頭獎（最多 3 組）與增開六獎，再把要對的發票一行一張貼進去（連字軌如 AB-12345678 也可以）。</li>
        <li>大樂透：填 6 個開獎號碼與特別號，再貼你的號碼，一行一注。</li>
        <li>威力彩：填第一區 6 個與第二區號碼；你的號碼最後一個是第二區，可用「/」或「+」隔開。</li>
        <li>今彩 539：填 5 個開獎號碼（1–39），再貼你的號碼，一行一注 5 個。中 5 個頭獎（800 萬）、4 個貳獎（2 萬）、3 個參獎（300）、2 個肆獎（50）；金額依台灣彩券官網（查證日 2026-11-22），每期頭獎總額上限 2,400 萬、超過時由中獎者均分，仍以官方公告為準。號碼重複或超出 1–39 會提示錯誤。</li>
        <li>開獎模擬：切到「開獎模擬」分頁，選遊戲、模擬期數（上限 1,000,000，每期 1 注）、可填固定號碼（留空 = 每期隨機選號）與亂數種子（相同種子可重現同一組結果；留空則隨機並顯示在結果旁）。大樂透與威力彩的頭獎等浮動獎金是假設值（頭獎可調整），其餘固定獎金依官方。按「開始模擬」會分批執行，不會卡住頁面，可隨時「中止」並看目前的部分結果。結果列出各獎項中獎次數與理論次數 / 機率、總投入、總獎金、淨損益與報酬率（附理論報酬率）；統一發票免費，改看平均每張獎金。</li>
        <li>按「對獎」，下方列出每張 / 每注的結果。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">統一發票頭獎填 12345678
        要對的發票：
        AB-12345678
        99345678
        → 第一張末 8 碼全中：頭獎 20 萬
        → 第二張末 6 碼相同（345678）：三獎 1 萬</div>
        <h3>小提醒</h3>
        <ul>
        <li>結果僅供參考，以官方公告為準。</li>
        <li>號碼只在本機核對，不會上傳。</li>
        <li>模擬的長期報酬率遠低於 100%（長期必虧），僅供娛樂，請理性購買；模擬不能預測或提高中獎機率。模擬結果不存檔、不佔本機資料，離開或重新整理頁面就消失。</li>
        <li>獎金依官網（統一發票特別獎 1,000 萬 / 特獎 200 萬 / 頭獎 20 萬 / 二至六獎 4 萬至 200 元，來源財政部統一發票給獎辦法與公告，查證日 2026-11-22）；大樂透各獎固定獎金出自新聞整理，官網頁面無法讀取，請以官方公告為準。</li>
            <li>只記住上次停留的分頁，固定只有一筆，不會累積；沒有單獨的清除按鈕，清除網站資料即可重置，也可用右上角 💾 備份。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        const { store } = Util;

        // --- pure ---
        // 一串文字拆成數字字串（空白、逗號、頓號、斜線、加號都可以分隔）
        const tokens = (s) => String(s).split(/[\s,，、/+|]+/).filter(Boolean);

        // ---------- 統一發票 ----------
        const SUFFIX_PRIZES = [[8, '頭獎', 200000], [7, '二獎', 40000], [6, '三獎', 10000], [5, '四獎', 4000], [4, '五獎', 1000], [3, '六獎', 200]];
        // 發票字串 → 8 位數字；可含兩碼字軌與連字號；不是 8 位數字回傳 null
        function invoiceDigits(s) { const d = String(s).replace(/[A-Za-z\s-]/g, ''); return /^\d{8}$/.test(d) ? d : null; }
        // win = { special: '8碼'|'', grand: '8碼'|'', first: ['8碼',…], extra: ['3碼',…] }。回傳最高的一個獎 { name, amount } 或 null
        function checkInvoice(num, win) {
            if (win.special && win.special === num) return { name: '特別獎', amount: 10000000 };
            if (win.grand && win.grand === num) return { name: '特獎', amount: 2000000 };
            let best = null;
            for (const f of win.first) for (const [n, name, amount] of SUFFIX_PRIZES) if (f.slice(-n) === num.slice(-n) && (!best || amount > best.amount)) best = { name, amount };
            if (win.extra.some(e => num.endsWith(e)) && (!best || best.amount < 200)) best = { name: '增開六獎', amount: 200 };
            return best;
        }
        // 檢查開獎號碼欄位：回傳錯誤訊息或 ''
        function validateInvoiceWin(win) {
            if (win.special && !/^\d{8}$/.test(win.special)) return '特別獎要 8 位數字';
            if (win.grand && !/^\d{8}$/.test(win.grand)) return '特獎要 8 位數字';
            if (win.first.some(f => !/^\d{8}$/.test(f)) || win.first.length > 3) return '頭獎要 8 位數字，最多 3 組';
            if (win.extra.some(e => !/^\d{3}$/.test(e))) return '增開六獎要 3 位數字';
            if (!win.special && !win.grand && !win.first.length && !win.extra.length) return '請至少輸入一組開獎號碼';
            return '';
        }

        // ---------- 樂透 ----------
        const parseNums = (s, max) => { const t = tokens(s).map(Number); return t.every(n => Number.isInteger(n) && n >= 1 && n <= max) ? t : null; };
        // 大樂透：6 個號碼 + 特別號。回傳獎項名稱或 null
        function bigPrize(mine, win, special) { return bigTier(mine.filter(n => win.includes(n)).length, mine.includes(special)); }
        // 命中數（m 個開獎號碼、sp 是否含特別號）→ 獎項名稱
        function bigTier(m, sp) {
            if (m === 6) return '頭獎'; if (m === 5 && sp) return '貳獎'; if (m === 5) return '參獎'; if (m === 4 && sp) return '肆獎'; if (m === 4) return '伍獎'; if (m === 3 && sp) return '陸獎'; if (m === 2 && sp) return '柒獎'; if (m === 3) return '普獎';
            return null;
        }
        // 威力彩：第一區 6 個（1–38）+ 第二區 1 個（1–8）
        function powerPrize(mine, second, win, winSecond) { return powerTier(mine.filter(n => win.includes(n)).length, second === winSecond); }
        function powerTier(m, s) {
            if (m === 6 && s) return '頭獎'; if (m === 6) return '貳獎'; if (m === 5 && s) return '參獎'; if (m === 5) return '肆獎'; if (m === 4 && s) return '伍獎'; if (m === 4) return '陸獎'; if (m === 3 && s) return '柒獎'; if (m === 2 && s) return '捌獎'; if (m === 3) return '玖獎'; if (m === 1 && s) return '普獎';
            return null;
        }
        // 今彩 539：5 個號碼（1–39）。中幾個號碼 → [個數, 獎項, 獎金]。
        // 來源：台灣彩券官網今彩 539 玩法（頭獎 800 萬、貳獎 2 萬、參獎 300、肆獎 50；每期頭獎總額上限 2,400 萬，超過時由中獎者均分），查證日 2026-11-22；實際以官方公告為準
        const D539 = [[5, '頭獎', 8000000], [4, '貳獎', 20000], [3, '參獎', 300], [2, '肆獎', 50]];
        function prize539(mine, win) { const m = mine.filter(n => win.includes(n)).length, p = D539.find(x => x[0] === m); return p ? { name: p[1], amount: p[2], hit: m } : null; }
        // 一注 539 號碼字串 → { nums } 或 { err }（5 個、不重複、1–39）
        function parse539(s) {
            const t = tokens(s).map(Number);
            if (!t.length || t.some(n => !Number.isInteger(n))) return { err: '格式不對（只能是數字）' };
            if (t.some(n => n < 1 || n > 39)) return { err: '號碼要在 1–39' };
            if (t.length !== 5) return { err: '要剛好 5 個號碼' };
            if (new Set(t).size !== 5) return { err: '號碼不能重複' };
            return { nums: t };
        }
        const noDup = (a) => new Set(a).size === a.length;

        // ---------- 開獎模擬 ----------
        const tier539 = (m) => { const p = D539.find(x => x[0] === m); return p ? p[1] : null; };
        // 各遊戲：單注售價、號碼範圍與個數、獎金表。固定獎金來源：台灣彩券（威力彩參～普獎固定 150000 / 20000 / 4000 / 800 / 400 / 200 / 100 / 100；
        // 大樂透伍～普獎固定 2000 / 1000 / 400 / 400，查證日 2026-11-22，大樂透固定獎金出自新聞整理）；浮動獎項（頭獎～肆獎等）隨每期銷售與中獎注數變動，這裡用「假設平均值」，頭獎可在畫面調整。
        const SIM_GAMES = {
            big: { name: '大樂透', price: 50, pool: 49, k: 6, float: ['頭獎', '貳獎', '參獎', '肆獎'], amt: { 頭獎: 100000000, 貳獎: 1000000, 參獎: 20000, 肆獎: 4500, 伍獎: 2000, 陸獎: 1000, 柒獎: 400, 普獎: 400 } },
            pw: { name: '威力彩', price: 100, pool: 38, k: 6, float: ['頭獎', '貳獎'], amt: { 頭獎: 200000000, 貳獎: 3000000, 參獎: 150000, 肆獎: 20000, 伍獎: 4000, 陸獎: 800, 柒獎: 400, 捌獎: 200, 玖獎: 100, 普獎: 100 } },
            d5: { name: '今彩 539', price: 50, pool: 39, k: 5, float: [], amt: Object.fromEntries(D539.map(x => [x[1], x[2]])) },
            inv: { name: '統一發票（每張獨立對一組隨機開獎）', price: 0, float: [], amt: { 特別獎: 10000000, 特獎: 2000000, 頭獎: 200000, 二獎: 40000, 三獎: 10000, 四獎: 4000, 五獎: 1000, 六獎: 200 } },
        };
        const choose = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
        // 各獎項的理論機率（每注、只計最高獎）。發票為近似：3 組頭獎、特別獎 / 特獎各 1 組，忽略重疊與增開六獎
        function simProbs(key) {
            const out = {}, add = (name, p) => { if (name) out[name] = (out[name] || 0) + p; };
            if (key === 'big') {
                for (let m = 0; m <= 6; m++) for (let s = 0; s <= 1; s++) if (m + s <= 6) add(bigTier(m, !!s), choose(6, m) * choose(42, 6 - m - s) / choose(49, 6));
            } else if (key === 'pw') {
                for (let m = 0; m <= 6; m++) for (let z = 0; z <= 1; z++) add(powerTier(m, !!z), choose(6, m) * choose(32, 6 - m) / choose(38, 6) * (z ? 1 / 8 : 7 / 8));
            } else if (key === 'd5') {
                for (let m = 0; m <= 5; m++) add(tier539(m), choose(5, m) * choose(34, 5 - m) / choose(39, 5));
            } else {
                add('特別獎', 1e-8); add('特獎', 1e-8); add('頭獎', 3e-8);
                [['二獎', 7], ['三獎', 6], ['四獎', 5], ['五獎', 4], ['六獎', 3]].forEach(([nm, d]) => add(nm, 3 * (10 ** -d - 10 ** -(d + 1))));
            }
            return out;
        }
        // 從 1..n 取 k 個不重複號碼
        function sampleK(rand, n, k) { const a = []; while (a.length < k) { const x = 1 + rand.int(n); if (a.indexOf(x) < 0) a.push(x); } return a; }
        // 固定號碼字串 → { nums, z } 或 null（大樂透 6 個 1–49、威力彩 6 個 1–38 + 第二區 1–8、539 5 個 1–39）
        function parseTicket(key, s) {
            if (key === 'big') { const n = parseNums(s, 49); return n && n.length === 6 && noDup(n) ? { nums: n } : null; }
            if (key === 'pw') { const t = tokens(s).map(Number); const n = t.slice(0, 6), z = t[6]; return t.length === 7 && n.every(x => Number.isInteger(x) && x >= 1 && x <= 38) && noDup(n) && Number.isInteger(z) && z >= 1 && z <= 8 ? { nums: n, z } : null; }
            if (key === 'd5') { const r = parse539(s); return r.nums ? { nums: r.nums } : null; }
            return null;
        }
        // 模擬一期：回傳獎項名稱或 null。rand 為 Util.seeded 的函式；fixed 為固定號碼（可為 null = 隨機選號）
        function simOnce(key, rand, fixed) {
            if (key === 'inv') {
                const s8 = () => String(rand.int(1e8)).padStart(8, '0');
                const r = checkInvoice(s8(), { special: s8(), grand: s8(), first: [s8(), s8(), s8()], extra: [] });
                return r ? r.name : null;
            }
            const g = SIM_GAMES[key], win = sampleK(rand, g.pool, g.k + (key === 'big' ? 1 : 0)), mine = fixed ? fixed.nums : sampleK(rand, g.pool, g.k);
            let m = 0; for (const x of mine) { const i = win.indexOf(x); if (i >= 0 && i < g.k) m++; }
            if (key === 'big') return bigTier(m, mine.includes(win[6]));
            if (key === 'pw') return powerTier(m, (fixed ? fixed.z : 1 + rand.int(8)) === 1 + rand.int(8));
            return tier539(m);
        }
        // 建立模擬：s.step(c) 再模擬 c 期（可分批呼叫）；head 為頭獎金額假設（只對浮動頭獎的遊戲有效）
        function newSim(key, rand, fixed, head) {
            const g = SIM_GAMES[key], amt = { ...g.amt };
            if (g.float.includes('頭獎') && Number.isFinite(head) && head >= 0) amt['頭獎'] = head;
            const s = { key, n: 0, counts: {}, prize: 0, amt };
            s.step = (c) => { for (let i = 0; i < c; i++) { const t = simOnce(key, rand, fixed); s.n++; if (t) { s.counts[t] = (s.counts[t] || 0) + 1; s.prize += amt[t]; } } };
            return s;
        }
        // 模擬結果整理：各獎項次數 / 理論次數 / 理論機率，總投入、總獎金、報酬率（發票免費，沒有投入）
        function simSummary(s) {
            const g = SIM_GAMES[s.key], pr = simProbs(s.key), cost = s.n * g.price;
            const rows = Object.keys(s.amt).map(name => ({ name, amount: s.amt[name], float: g.float.includes(name), count: s.counts[name] || 0, p: pr[name] || 0, expected: s.n * (pr[name] || 0) }));
            const theoryPerBet = rows.reduce((a, r) => a + r.p * r.amount, 0);
            return { rows, n: s.n, cost, prize: s.prize, net: s.prize - cost, rtp: cost ? s.prize / cost : null, theoryPerBet, theoryRtp: g.price ? theoryPerBet / g.price : null };
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        let tab = store.get('lc_tab', 'inv'); if (!['inv', 'big', 'pw', 'd5', 'sim'].includes(tab)) tab = 'inv';
        const money = (n) => n.toLocaleString('zh-TW');
        const row = (text, res, cls) => { const r = document.createElement('div'); r.className = 'res ' + cls; r.append(Object.assign(document.createElement('span'), { textContent: text }), Object.assign(document.createElement('b'), { textContent: res })); return r; };

        function run() {
            $('#err').textContent = ''; const rows = []; let wins = 0, total = 0;
            if (tab === 'inv') {
                const win = { special: $('#sp').value.trim(), grand: $('#gr').value.trim(), first: tokens($('#fi').value), extra: tokens($('#ex').value) }, bad = validateInvoiceWin(win);
                if (bad) { $('#err').textContent = bad; return; }
                for (const line of $('#tix').value.split('\n').map(l => l.trim()).filter(Boolean)) {
                    const d = invoiceDigits(line); if (!d) { rows.push(row(line, '格式不對（要 8 位數字）', 'bad')); continue; }
                    const r = checkInvoice(d, win); if (r) { wins++; total += r.amount; }
                    rows.push(row(line, r ? `🎉 ${r.name}　${money(r.amount)} 元` : '沒中', r ? 'win' : ''));
                }
            } else if (tab === 'd5') {
                const w = parse539($('#d5W').value);
                if (w.err) { $('#err').textContent = '開獎號碼：' + w.err; return; }
                for (const line of $('#d5T').value.split('\n').map(l => l.trim()).filter(Boolean)) {
                    const m = parse539(line); if (m.err) { rows.push(row(line, m.err, 'bad')); continue; }
                    const r = prize539(m.nums, w.nums); if (r) { wins++; total += r.amount; }
                    rows.push(row(line, r ? `🎉 ${r.name}（中 ${r.hit} 個）　${money(r.amount)} 元` : '沒中', r ? 'win' : ''));
                }
            } else {
                const big = tab === 'big', max = big ? 49 : 38, win = parseNums($(big ? '#bw' : '#pwW').value, max), sp = parseInt($(big ? '#bs' : '#pwS').value, 10);
                if (!win || win.length !== 6 || !noDup(win)) { $('#err').textContent = `開獎號碼要 6 個不重複的數字（1–${max}）`; return; }
                if (!(sp >= 1 && sp <= (big ? 49 : 8)) || (big && win.includes(sp))) { $('#err').textContent = big ? '特別號要是 1–49 且不能和開獎號碼重複' : '第二區號碼要是 1–8'; return; }
                for (const line of $(big ? '#bt' : '#pwT').value.split('\n').map(l => l.trim()).filter(Boolean)) {
                    let mine, second;
                    if (big) mine = parseNums(line, 49); else { const t = tokens(line).map(Number); second = t[6]; mine = t.slice(0, 6); if (t.length !== 7 || mine.some(n => !(n >= 1 && n <= 38)) || !(second >= 1 && second <= 8)) mine = null; }
                    if (!mine || mine.length !== 6 || !noDup(mine)) { rows.push(row(line, '格式不對', 'bad')); continue; }
                    const r = big ? bigPrize(mine, win, sp) : powerPrize(mine, second, win, sp); if (r) wins++;
                    rows.push(row(line, r ? `🎉 ${r}` : '沒中', r ? 'win' : ''));
                }
            }
            $('#outCard').hidden = !rows.length; $('#out').replaceChildren(...rows);
            $('#sum').textContent = rows.length ? `${rows.length} 筆・中 ${wins} 筆${tab !== 'big' && tab !== 'pw' && total ? `・合計 ${money(total)} 元` : ''}${(tab === 'big' || tab === 'pw') && wins ? '（獎金依當期公告）' : ''}` : '';
        }
        function render() { document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tab)); document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.t !== tab; }); $('#outCard').hidden = true; $('#err').textContent = ''; $('#check').hidden = tab === 'sim'; $('#simCard').hidden = tab !== 'sim' || !$('#smOut').children.length; }

        // ---------- 模擬畫面（結果不存檔，離開頁面即消失）----------
        let simRun = null;
        const SIM_HOLD = { big: '例如 03 12 18 25 33 47', pw: '例如 05 11 20 27 33 38 / 04', d5: '例如 01 05 12 20 38', inv: '發票每張獨立隨機，不用填' };
        function simSetup() {
            const k = $('#smG').value, fl = SIM_GAMES[k].float.includes('頭獎');
            $('#smHead').disabled = !fl; $('#smHead').value = fl ? SIM_GAMES[k].amt['頭獎'] : '';
            $('#smFix').disabled = k === 'inv'; $('#smFix').value = ''; $('#smFix').placeholder = SIM_HOLD[k];
        }
        function simShow(s, state, seed) {
            const r = simSummary(s), pct = (v) => (v * 100).toFixed(2) + '%', rows = [];
            for (const x of r.rows) rows.push(row(`${x.name}（${money(x.amount)} 元${x.float ? '・假設' : ''}）`, `${money(x.count)} 次　理論 ${x.expected < 10 ? x.expected.toFixed(3) : money(Math.round(x.expected))} 次（1/${x.p ? money(Math.round(1 / x.p)) : '—'}）`, x.count ? 'win' : ''));
            rows.push(row('總投入', r.cost ? money(r.cost) + ' 元' : '免費（發票）', ''));
            rows.push(row('總獎金', money(r.prize) + ' 元', ''));
            if (r.cost) {
                rows.push(row('淨損益', (r.net >= 0 ? '+' : '') + money(r.net) + ' 元', r.net < 0 ? 'bad' : 'win'));
                rows.push(row('報酬率（獎金 ÷ 投入）', `${pct(r.rtp)}　理論約 ${pct(r.theoryRtp)}`, ''));
            } else rows.push(row('平均每張獎金', `${(r.n ? r.prize / r.n : 0).toFixed(3)} 元　理論約 ${r.theoryPerBet.toFixed(3)} 元`, ''));
            const note = document.createElement('p'); note.className = 'note warn'; note.textContent = '長期必虧，僅供娛樂，請理性購買。頭獎等浮動獎金是假設值，實際每期不同；模擬的次數越少，結果越靠運氣。';
            $('#smOut').replaceChildren(...rows, note); $('#simCard').hidden = false;
            $('#smSum').textContent = `${state}・${money(r.n)} 期・種子 ${seed}`;
        }
        $('#smG').onchange = simSetup; simSetup();
        $('#smStop').onclick = () => { if (simRun) simRun.cancel(); };
        $('#smGo').onclick = () => {
            if (simRun) return;
            const k = $('#smG').value, n = Math.floor(Number($('#smN').value)), f = $('#smFix').value.trim(), err = $('#err');
            err.textContent = '';
            if (!(n >= 1 && n <= 1000000)) { err.textContent = '模擬期數要是 1–1,000,000'; return; }
            const fixed = f && k !== 'inv' ? parseTicket(k, f) : null;
            if (f && k !== 'inv' && !fixed) { err.textContent = '固定號碼格式不對：' + SIM_HOLD[k]; return; }
            const seed = $('#smSeed').value.trim() || Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const s = newSim(k, Util.seeded(seed), fixed, Number($('#smHead').value));
            $('#smGo').hidden = true; $('#smStop').hidden = false;
            simRun = Util.runChunks(n, (a, b) => s.step(b - a), {
                onProgress: (d, t) => { $('#smProg').textContent = `模擬中… ${money(d)} / ${money(t)}`; },
                onDone: (cancelled) => { simRun = null; $('#smGo').hidden = false; $('#smStop').hidden = true; $('#smProg').textContent = ''; simShow(s, cancelled ? '已中止（部分結果）' : '完成', seed); },
            });
        };
        document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { tab = b.dataset.t; store.set('lc_tab', tab); render(); }; });
        $('#check').onclick = run; render();
    </script>
</body>
