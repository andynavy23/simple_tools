    <template id="help">
        <h3>這是什麼</h3>
        <p>把開發常查的東西收在一頁：命令列工具（Vim、tmux、SSH、Bash、PowerShell…）、語言與框架（Python、TypeScript、Go、Rust、React…）、網路與 Web、資料庫、安全。每個主題是一張可展開的卡片，內容是「指令或語法 / 說明」列。</p>
        <h3>什麼時候用</h3>
        <ul>
        <li>忘了 <kbd>tar</kbd>、<kbd>awk</kbd>、<kbd>openssl</kbd> 的參數，或 Vim 怎麼離開。</li>
        <li>要對照不同語言 / 資料庫的寫法（日期格式、SQL 方言、語法對照）。</li>
        <li>面試或寫文件時快速確認 Big-O、OWASP、OAuth 流程。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
        <li>用上方分類鈕縮小範圍，或直接在搜尋欄輸入（可多個詞，空白分隔，須全部符合）。</li>
        <li>搜尋會比對主題標題、關鍵字與每一列內容；標題 / 關鍵字符合就列出整張卡，否則只列出符合的那幾列。</li>
        <li>點卡片標題展開；每列右邊「複製」帶走指令或語法。</li>
        <li>Linux 指令卡的列首有風險標示：🟢 唯讀安全、🟡 會改動但可復原、🔴 會永久遺失資料或影響系統。其他卡片裡標紅的列也是破壞性指令，貼上前請先確認。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">搜尋 tunnel → SSH 卡的 -L / -R / -D 埠轉發
搜尋 dd → Linux 指令卡的 dd（🔴 會覆寫整顆磁碟）
搜尋 yyyy → 日期格式卡：strftime / Java / .NET / moment 對照</div>
        <h3>小提醒</h3>
        <ul>
        <li>內容是精簡速查，版本差異多的細節（如各資料庫的方言、框架新版 API）請以官方文件為準。</li>
        <li>「XSS 與注入測試字串」只供測試<b>自己擁有或已獲授權</b>的系統；對他人系統測試可能違法。字串只會以純文字顯示，不會被執行。</li>
        <li>複製的內容不會自動執行任何東西，但標紅的指令貼進終端機前務必看清楚路徑與目標。</li>
        <li>不儲存任何資料，也不會連線。</li>
        </ul>
    </template>

            const m = /^(!!|!)?/.exec(s)[1] || '';
            const body = s.slice(m.length), i = body.indexOf(' ~~ ');
            return { cmd: i < 0 ? body : body.slice(0, i), desc: i < 0 ? '' : body.slice(i + 4), lv: m === '!!' ? 2 : m === '!' ? 1 : 0 };
        };
        // 搜尋：每個詞都必須出現；標題 / 關鍵字 / 分類符合 → 整張卡；否則只留符合的列。排序：標題完全 < 開頭 < 包含 < 關鍵字 < 內容列；同分維持原順序
        function searchTopics(topics, q, cat = '') {
            const terms = String(q ?? '').trim().toLowerCase().split(/\s+/).filter(Boolean);
            const out = [];
            topics.forEach((t, i) => {
                if (cat && t.cat !== cat) return;
                const rows = t.rows.map(parseRow);
                if (!terms.length) { out.push({ t, rows, sc: 0, i, byRows: false }); return; }
                const title = t.title.toLowerCase(), head = (title + ' ' + t.id + ' ' + t.kw + ' ' + t.cat).toLowerCase();
                if (terms.every(w => head.includes(w))) {
                    const w0 = terms.join(' ');
                    out.push({ t, rows, sc: title === w0 || t.id === w0 ? 0 : title.startsWith(w0) ? 1 : title.includes(w0) ? 2 : 3, i, byRows: false });
                    return;
                }
                const hit = rows.filter(r => { const x = (head + ' ' + r.cmd + ' ' + r.desc).toLowerCase(); return terms.every(w => x.includes(w)); });
                if (hit.length) out.push({ t, rows: hit, sc: 4, i, byRows: true });
            });
            return out.sort((a, b) => a.sc - b.sc || a.i - b.i);
        }
        // 資料完整性：回傳問題清單（空 = 正常）。含：標題 / 分類 / id 唯一 / 至少一列 / 危險指令必須標紅
        const DANGER = /\brm -rf|\bmkfs|\bdd if=|DROP (TABLE|DATABASE)|TRUNCATE TABLE|DELETE FROM 表名$|chmod -R 777|iptables -F|shutdown -h|Remove-Item.*-Force|\bformat [A-Z]:|rd \/s|del \/f|robocopy .*\/MIR|kill-session|DROP DATABASE/;
        function checkTopics(topics) {
            const bad = [], ids = new Set();
            for (const t of topics) {
                if (!t.id || ids.has(t.id)) bad.push('id 重複或空白：' + t.id); ids.add(t.id);
                if (!t.title) bad.push('缺標題：' + t.id);
                if (!CATS.includes(t.cat)) bad.push('分類不存在：' + t.id);
                if (!t.rows || !t.rows.length) bad.push('沒有內容列：' + t.id);
                for (const s of t.rows || []) {
                    const r = parseRow(s);
                    if (!r.cmd || !r.desc) bad.push(`列格式錯誤：${t.id} / ${s.slice(0, 30)}`);
                    if (DANGER.test(r.cmd) && r.lv !== 2) bad.push(`危險指令未標紅：${t.id} / ${r.cmd.slice(0, 30)}`);
                }
            }
            return bad;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        let cat = '';
        function render() {
            const q = $('#q').value, res = searchTopics(TOPICS, q, cat);
            $('#count').textContent = `${res.length} 個主題`;
            const LV = ['🟢', '🟡', '🔴'];
            $('#list').replaceChildren(...res.map(({ t, rows, byRows }) => {
                const d = el('details', 't'); d.dataset.id = t.id;
                d.open = byRows || (!!q.trim() && res.length <= 3);
                const sm = el('summary'); sm.append(el('span', 'n', t.title), el('span', 'c', `${t.cat} · ${rows.length} 列`));
                d.append(sm);
                if (t.note) d.append(el('p', 'tn', t.note));
                for (const r of rows) {
                    const ln = el('div', 'ln' + (r.lv === 2 ? ' d' : ''));
                    const lv = el('span', 'lv', t.risk || r.lv === 2 ? LV[r.lv] : ''); lv.title = ['安全', '小心', '危險'][r.lv];
                    const tx = el('div', 'tx'); tx.append(el('code', '', r.cmd), el('div', 'ds', r.desc));
                    const b = el('button', 'sm', '複製'); b.onclick = () => copyWithFeedback(b, r.cmd);
                    ln.append(lv, tx, b); d.append(ln);
                }
                return d;
            }));
            if (!res.length) $('#list').append(el('p', 'muted', '沒有符合的主題'));
        }
        const bar = $('#cats');
        for (const c of ['', ...CATS]) { const b = el('button', 'sm', c || '全部'); b.dataset.c = c; b.setAttribute('aria-pressed', c === ''); bar.append(b); }
        bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; [...bar.children].forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
        $('#q').oninput = render;
        render();
    </script>
</body>
