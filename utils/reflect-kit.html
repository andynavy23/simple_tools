<!DOCTYPE html>

    <meta property="og:title" content="目標與回顧" />

            gap: 8px;

            align-items: center;
        }

        .row>input[type=text],

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>目標與回顧</h1>
        <p class="sub">OKR 追蹤目標、每週寫回顧、用加權矩陣做決定。資料只存在這台裝置。</p>

        <div class="tabs" id="tabs" role="group" aria-label="功能">
            <button data-t="okr" aria-pressed="true">OKR</button>
            <button data-t="weekly" aria-pressed="false">每週回顧</button>
            <button data-t="dec" aria-pressed="false">決策矩陣</button>
        </div>

        <!-- ===== OKR ===== -->
        <div id="tab-okr">
            <div class="card">
                <h2>新增目標</h2>
                <div class="row">
                    <input type="text" id="oTitle" placeholder="目標（Objective），例如：把體能練好" maxlength="60" aria-label="目標名稱">
                    <button class="primary" id="oAdd">新增目標</button>
                </div>
                <div class="row" style="margin-top:8px">
                    <label class="small"><input type="checkbox" id="oArch"> 顯示已封存</label>
                    <button class="sm" id="oClear">清除全部 OKR</button>
                </div>
                <p class="small" id="oUsage"></p>
            </div>
            <div id="oList"></div>
        </div>

        <!-- ===== 每週回顧 ===== -->
        <div id="tab-weekly" hidden>
            <div class="card">
                <div class="row" style="justify-content:space-between">
                    <button class="sm" id="wPrev" aria-label="上一週">‹ 上一週</button>
                    <b id="wTitle" style="text-align:center"></b>
                    <button class="sm" id="wNext" aria-label="下一週">下一週 ›</button>
                </div>
                <div class="row" style="margin-top:6px"><button class="sm" id="wNow">回到本週</button></div>
                <div id="wForm"></div>
                <div class="row" style="margin-top:12px">
                    <button class="primary" id="wSave">儲存本週回顧</button>
                    <button class="sm" id="wDel">刪除本週</button>
                    <button class="sm" id="wCopy">複製 Markdown</button>
                </div>
                <div class="small" id="wMsg" role="status"></div>
                <details style="margin-top:10px">
                    <summary>自訂問題（開 / 關）</summary>
                    <div id="wQs"></div>
                </details>
            </div>
            <div class="card">
                <h2>歷史</h2>
                <div class="row"><input type="search" id="wQ" placeholder="全文搜尋" aria-label="搜尋回顧"></div>
                <div id="wHist"></div>
                <div class="row" style="margin-top:8px">
                    <button class="sm" id="wExport">匯出全部（Markdown）</button>
                    <button class="sm" id="wClear">清除全部回顧</button>
                </div>
                <p class="small" id="wUsage"></p>
            </div>
        </div>

        <!-- ===== 決策矩陣 ===== -->
        <div id="tab-dec" hidden>
            <div class="card">
                <h2>我的決策</h2>
                <div class="row">
                    <select id="dSel" aria-label="選擇決策"></select>
                    <button class="sm" id="dNew">新決策</button>
                    <button class="sm" id="dDel">刪除這個</button>
                </div>
                <div class="row" style="margin-top:8px">
                    <input type="text" id="dName" maxlength="40" placeholder="決策名稱，例如：選哪份工作" aria-label="決策名稱">
                </div>
                <p class="small" id="dUsage"></p>
            </div>
            <div class="card" id="dBox">
                <h2>選項與準則</h2>
                <div class="row">
                    <input type="text" id="dOpt" maxlength="30" placeholder="新增選項" aria-label="新增選項"><button class="sm" id="dOptAdd">加選項</button>
                </div>
                <div class="row" style="margin-top:8px">
                    <input type="text" id="dCrit" maxlength="30" placeholder="新增準則（如：薪水）" aria-label="新增準則"><button class="sm" id="dCritAdd">加準則</button>
                </div>
                <p class="small">權重 1–10（越大越重要）；格子填 1–10 分。可輸入名稱直接修改，× 刪除。</p>
                <div class="scroll" id="dMx"></div>
            </div>
            <div class="card" id="dRes"></div>
            <div class="row"><button class="sm" id="dCopy">複製結果</button><button class="sm" id="dClear">清除全部決策</button></div>
        </div>
    </div>

    <template id="help">
        <h3>這是什麼</h3>
        <p>三個幫你「想清楚」的小工具：OKR 追蹤目標、每週回顧、加權決策矩陣。資料只存在這台裝置。</p>
        <h3>什麼時候用</h3>
        <ul>
            <li>想把一季的目標拆成可量化的關鍵結果，每週回報進度。</li>
            <li>每週日花五分鐘回顧：完成什麼、學到什麼、卡在哪、下週重點。</li>
            <li>在幾個選項之間猶豫（租房、工作、買哪台），想用分數比較。</li>
        </ul>
        <h3>怎麼用</h3>
        <ol>
            <li><b>OKR</b>：新增目標，在目標裡加關鍵結果（名稱、目標值、單位）。按 KR 的「更新」填目前值，會記錄日期與數值的簡短歷史。目標進度 = 各 KR 達成率（目前 ÷ 目標，最多 100%）的平均。結束時按「完成回顧」寫總結與評分（0–1.0），再「封存」。</li>
            <li><b>每週回顧</b>：週一為一週起點（台灣時間）。填完按「儲存」，同一週再存會覆蓋。可用 ‹ › 翻週、搜尋歷史、複製 / 匯出 Markdown。「自訂問題」可關掉不想回答的題目。</li>
            <li><b>決策矩陣</b>：加選項與準則，設準則權重，在格子填 1–10 分。系統算加權總分並排序、標出最佳選項；「敏感度」顯示某準則權重 ±1 後最佳選項是否改變，改變就表示結果不穩，值得再想想。</li>
        </ol>
        <h3>範例</h3>
        <div class="eg">目標「體能變好」：KR1 每週跑步 3 次（目標 12 次/月，目前 6）→ 50%；KR2 體脂降到 20%（只看達成率，請用「已完成量」當目前值）。<br>決策「選租屋」：準則「租金」權重 9、「通勤」權重 7；A 房租金 6 分、通勤 9 分 → 6×9+9×7 = 117。</div>
        <h3>小提醒</h3>
        <ul>
            <li>上限：目標 20 個（含封存）、每個目標 8 個 KR、每個 KR 歷史 60 筆（超過時淘汰最舊的）；每週回顧 260 週、單篇 5000 字；決策 30 個，每個決策選項 10、準則 10。滿了會拒絕新增並提示。</li>
            <li>刪除：目標 / KR / 決策可單筆刪除（刪目標連同它的 KR 與歷史），每個分頁也有「清除全部」；一律先確認、無法復原，建議先匯出。</li>
            <li>KR 達成率只算「越大越好」的目標；想降低的數字（如體重）請改寫成「已減幾公斤」。</li>
            <li>備份資料的鍵：OKR、每週回顧、決策矩陣；壞掉的資料載入時會自動略過或補預設。</li>
            <li>決策矩陣只是整理想法的輔助，分數是你主觀給的，結果僅供參考。</li>
        </ul>
    </template>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        const RK = { OBJ_MAX: 20, KR_MAX: 8, HIST_MAX: 60, WEEK_MAX: 260, TEXT_MAX: 5000, FIELD_MAX: 1000, OPT_MAX: 10, CRIT_MAX: 10, DEC_MAX: 30 };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const str = (v, n) => (typeof v === 'string' ? v.trim().slice(0, n) : '');
        const num = (v, lo = -1e9, hi = 1e9) => {
            if (!(typeof v === 'number' || (typeof v === 'string' && v.trim() !== ''))) return null;
            v = Number(v); return Number.isFinite(v) && v >= lo && v <= hi ? v : null;
        };
        const okDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && Util.day.shift(s, 0) === s;
        const arr = (v) => (Array.isArray(v) ? v : []);

        // ---------- OKR ----------
        function cleanOkr(raw) {
            const seen = new Set(), out = [];
            for (const o of arr(raw)) {
                if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.id || seen.has(o.id)) continue;
                const title = str(o.title, 60); if (!title) continue;
                seen.add(o.id);
                const ks = new Set(), krs = [];
                for (const k of arr(o.krs)) {
                    if (!k || typeof k !== 'object' || typeof k.id !== 'string' || !k.id || ks.has(k.id)) continue;
                    const name = str(k.name, 60), target = num(k.target, 1e-9); if (!name || target === null) continue;
                    ks.add(k.id);
                    const hist = [];
                    for (const h of arr(k.hist)) if (h && okDate(h.d) && num(h.v) !== null) hist.push({ d: h.d, v: Number(h.v) });
                    krs.push({ id: k.id, name, target, cur: num(k.cur) ?? 0, unit: str(k.unit, 10), hist: hist.slice(-RK.HIST_MAX) });
                    if (krs.length >= RK.KR_MAX) break;
                }
                const r = o.review && typeof o.review === 'object' ? o.review : null, sc = r ? num(r.score, 0, 1) : null;
                out.push({ id: o.id, title, from: okDate(o.from) ? o.from : '', archived: o.archived === true, krs,
                    review: sc === null ? null : { score: Math.round(sc * 10) / 10, text: str(r.text, RK.FIELD_MAX), d: okDate(r.d) ? r.d : '' } });
                if (out.length >= RK.OBJ_MAX) break;
            }
            return out;
        }
        const krPct = (k) => (k.target > 0 ? Math.min(1, Math.max(0, k.cur / k.target)) : 0);
        const objPct = (o) => (o.krs.length ? Math.round(o.krs.reduce((x, k) => x + krPct(k), 0) / o.krs.length * 100) : 0);
        function addObj(list, title, today) {
            title = str(title, 60);
            if (!title) return { list, err: '請輸入目標名稱' };
            if (list.length >= RK.OBJ_MAX) return { list, err: `目標最多 ${RK.OBJ_MAX} 個（含封存），請先刪除不用的` };
            return { list: [...list, { id: uid(), title, from: today, archived: false, review: null, krs: [] }] };
        }
        function addKr(list, oid, name, target, unit) {
            const o = list.find(x => x.id === oid); if (!o) return { list, err: '找不到目標' };
            name = str(name, 60); const t = num(target, 1e-9);
            if (!name) return { list, err: '請輸入關鍵結果名稱' };
            if (t === null) return { list, err: '目標值要是大於 0 的數字' };
            if (o.krs.length >= RK.KR_MAX) return { list, err: `每個目標最多 ${RK.KR_MAX} 個關鍵結果` };
            return { list: list.map(x => (x === o ? { ...x, krs: [...x.krs, { id: uid(), name, target: t, cur: 0, unit: str(unit, 10), hist: [] }] } : x)) };
        }
        // 更新 KR 目前值：同一天覆蓋當天那筆；歷史只留最近 60 筆（淘汰最舊）
        function setKr(list, oid, kid, v, date) {
            const n = num(v); if (n === null) return { list, err: '請填數字' };
            return { list: list.map(o => (o.id !== oid ? o : { ...o, krs: o.krs.map(k => {
                if (k.id !== kid) return k;
                const h = k.hist.filter(x => x.d !== date); h.push({ d: date, v: n }); h.sort((a, b) => (a.d < b.d ? -1 : 1));
                return { ...k, cur: n, hist: h.slice(-RK.HIST_MAX) };
            }) })) };
        }

        // ---------- 每週回顧 ----------
        const QS = [{ id: 'done', t: '本週完成了什麼' }, { id: 'learn', t: '學到什麼' }, { id: 'stuck', t: '卡住什麼' }, { id: 'next', t: '下週最重要的三件事' }, { id: 'thanks', t: '感謝' }];
        const twToday = (ms = Date.now()) => new Date(ms + 8 * 36e5).toISOString().slice(0, 10); // 台灣時間 UTC+8
        const weekMonday = (s) => Util.day.shift(s, -((Util.day.num(s) + 3) % 7)); // 1970-01-01 是週四
        function isoWeek(s) { // ISO 年週次：週四所在的年份決定歸屬年
            const th = Util.day.shift(weekMonday(s), 3), y = Util.day.parse(th).y;
            return { year: y, week: Math.floor(Util.day.between(Util.day.ymd(y, 1, 1), th) / 7) + 1 };
        }
        const entryLen = (e) => QS.reduce((x, q) => x + (e.a[q.id] || '').length, 0);
        function cleanWeekly(raw) {
            const r = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}, seen = new Set(), entries = [];
            for (const e of arr(r.entries)) {
                if (!e || typeof e !== 'object' || !okDate(e.wk) || weekMonday(e.wk) !== e.wk || seen.has(e.wk)) continue;
                seen.add(e.wk);
                const a = {}; let left = RK.TEXT_MAX;
                for (const q of QS) { const t = typeof e.a?.[q.id] === 'string' ? e.a[q.id].slice(0, Math.min(RK.FIELD_MAX, left)) : ''; if (t.trim()) { a[q.id] = t; left -= t.length; } }
                const ri = (v) => { const n = num(v, 1, 5); return n === null ? 0 : Math.round(n); };
                entries.push({ wk: e.wk, a, energy: ri(e.energy), mood: ri(e.mood) });
            }
            entries.sort((x, y) => (x.wk < y.wk ? -1 : 1));
            return { off: arr(r.off).filter(id => QS.some(q => q.id === id)), entries: entries.slice(-RK.WEEK_MAX) };
        }
        // 儲存一週：同週覆蓋；新週滿 260 筆拒絕；單篇 ≤ 5000 字
        function saveWeek(entries, e) {
            if (!okDate(e.wk) || weekMonday(e.wk) !== e.wk) return { list: entries, err: '週次不正確' };
            if (entryLen(e) > RK.TEXT_MAX) return { list: entries, err: `單篇最多 ${RK.TEXT_MAX} 字` };
            if (!entryLen(e) && !e.energy && !e.mood) return { list: entries, err: '還沒填任何內容' };
            const i = entries.findIndex(x => x.wk === e.wk);
            if (i < 0 && entries.length >= RK.WEEK_MAX) return { list: entries, err: `回顧最多 ${RK.WEEK_MAX} 週，請先刪除舊的` };
            const list = i < 0 ? [...entries, e] : entries.map((x, k) => (k === i ? e : x));
            return { list: list.sort((x, y) => (x.wk < y.wk ? -1 : 1)) };
        }
        const searchWeeks = (entries, q) => { q = String(q || '').trim().toLowerCase(); return q ? entries.filter(e => QS.some(s => (e.a[s.id] || '').toLowerCase().includes(q))) : entries; };
        function weekMd(e, off = []) {
            const w = isoWeek(e.wk), end = Util.day.shift(e.wk, 6);
            let s = `# ${w.year} 第 ${w.week} 週回顧（${e.wk} ~ ${end}）\n\n`;
            for (const q of QS) if (!off.includes(q.id) && e.a[q.id]) s += `## ${q.t}\n${e.a[q.id]}\n\n`;
            if (e.energy) s += `能量：${e.energy} / 5\n`;
            if (e.mood) s += `心情：${e.mood} / 5\n`;
            return s.trim() + '\n';
        }

        // ---------- 加權決策矩陣 ----------
        function cleanDecisions(raw) {
            const seen = new Set(), out = [];
            for (const d of arr(raw)) {
                if (!d || typeof d !== 'object' || typeof d.id !== 'string' || !d.id || seen.has(d.id)) continue;
                seen.add(d.id);
                const opts = [], crits = [], ids = new Set();
                for (const o of arr(d.opts)) { const n = str(o?.n, 30); if (n && typeof o.id === 'string' && o.id && !ids.has(o.id) && opts.length < RK.OPT_MAX) { ids.add(o.id); opts.push({ id: o.id, n }); } }
                for (const c of arr(d.crits)) { const n = str(c?.n, 30); if (n && typeof c.id === 'string' && c.id && !ids.has(c.id) && crits.length < RK.CRIT_MAX) { ids.add(c.id); crits.push({ id: c.id, n, w: Math.round(num(c.w, 1, 10) ?? 5) }); } }
                const sc = {};
                for (const o of opts) for (const c of crits) { const v = num(d.sc?.[o.id + '|' + c.id], 1, 10); if (v !== null) sc[o.id + '|' + c.id] = Math.round(v); }
                out.push({ id: d.id, name: str(d.name, 40) || '未命名決策', opts, crits, sc });
                if (out.length >= RK.DEC_MAX) break;
            }
            return out;
        }
        function addDec(list, name) {
            if (list.length >= RK.DEC_MAX) return { list, err: `決策最多 ${RK.DEC_MAX} 個，請先刪除不用的` };
            const d = { id: uid(), name: str(name, 40) || '未命名決策', opts: [], crits: [], sc: {} };
            return { list: [...list, d], id: d.id };
        }
        // 各選項加權總分（未填的格子算 0）；w 可覆蓋部分準則權重（敏感度用）。pct = 總分 / 滿分 × 100
        function decRank(d, w) {
            const wt = (c) => (w && w[c.id] != null ? w[c.id] : c.w), full = d.crits.reduce((x, c) => x + wt(c) * 10, 0);
            return d.opts.map(o => {
                let total = 0, miss = 0;
                for (const c of d.crits) { const s = d.sc[o.id + '|' + c.id]; if (s) total += wt(c) * s; else miss++; }
                return { id: o.id, name: o.n, total, miss, pct: full ? Math.round(total / full * 1000) / 10 : 0 };
            }).sort((a, b) => b.total - a.total);
        }
        const decBest = (rows) => (rows.length && rows[0].total > 0 ? rows.filter(r => r.total === rows[0].total).map(r => r.id) : []);
        // 敏感度：每個準則權重 ±1（超出 1–10 略過）後，最佳選項是否與原本不同
        function sensitivity(d) {
            const rows = decRank(d), base = decBest(rows).join(), name = (id) => d.opts.find(o => o.id === id).n, out = [];
            if (!base) return out;
            for (const c of d.crits) for (const delta of [-1, 1]) {
                const w = c.w + delta; if (w < 1 || w > 10) continue;
                const b = decBest(decRank(d, { [c.id]: w }));
                out.push({ crit: c.n, delta, best: b.map(name).join('、') || '—', changed: b.join() !== base });
            }
            return out;
        }
        function decText(d) {
            const rows = decRank(d), best = decBest(rows), sens = sensitivity(d);
            let s = `決策：${d.name}\n準則：${d.crits.map(c => `${c.n}(權重${c.w})`).join('、')}\n`;
            rows.forEach((r, i) => { s += `${i + 1}. ${r.name}：${r.total} 分（${r.pct}%）\n`; });
            if (best.length) s += `最佳：${rows.filter(r => best.includes(r.id)).map(r => r.name).join('、')}\n`;
            const ch = sens.filter(x => x.changed);
            if (sens.length) s += ch.length ? `敏感度：${ch.map(x => `${x.crit}${x.delta > 0 ? '+' : '-'}1 → ${x.best}`).join('；')}\n` : '敏感度：權重 ±1 後最佳不變\n';
            return s;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const say = (t) => { if (window.Chrome && Chrome.toast) Chrome.toast(t, 2500); };
        const E = Util.esc;
        const fmt = (n) => (Math.round(n * 100) / 100).toLocaleString('zh-TW');

        // ---------- 分頁 ----------
        $('#tabs').onclick = (e) => {
            const b = e.target.closest('button[data-t]'); if (!b) return;
            for (const x of $('#tabs').children) { x.setAttribute('aria-pressed', x === b); $('#tab-' + x.dataset.t).hidden = x !== b; }
        };

        // ---------- OKR ----------
        let okr = cleanOkr(Util.store.get('reflect_okr', []));
        const saveO = () => Util.store.set('reflect_okr', okr);
        function renderOkr() {
            const showA = $('#oArch').checked, list = okr.filter(o => showA || !o.archived);
            $('#oUsage').textContent = `目標 ${okr.length} / ${RK.OBJ_MAX}（每個目標最多 ${RK.KR_MAX} 個關鍵結果）`;
            $('#oList').innerHTML = list.length ? list.map(o => {
                const p = objPct(o);
                return `<div class="card" data-oid="${o.id}"><div class="row" style="justify-content:space-between"><b>${E(o.title)}${o.archived ? '（已封存）' : ''}</b><b>${p}%</b></div>
                <div class="bar" role="img" aria-label="進度 ${p}%"><i class="${p >= 100 ? 'done' : ''}" style="width:${p}%"></i></div>
                ${o.krs.map(k => { const kp = Math.round(krPct(k) * 100); return `<div class="kr" data-kid="${k.id}"><div class="row" style="justify-content:space-between"><span>${E(k.name)}</span><span>${fmt(k.cur)} / ${fmt(k.target)} ${E(k.unit)}（${kp}%）</span></div>
                <div class="bar"><i class="${kp >= 100 ? 'done' : ''}" style="width:${kp}%"></i></div>
                ${k.hist.length ? `<details><summary class="small">歷史 ${k.hist.length} 筆</summary><div class="small">${k.hist.slice().reverse().map(h => `${h.d}：${fmt(h.v)}`).join('　')}</div></details>` : ''}
                <div class="acts"><button class="sm" data-act="upd">更新</button><button class="sm" data-act="krdel" aria-label="刪除關鍵結果 ${E(k.name)}">刪除</button></div></div>`; }).join('')}
                ${o.review ? `<div class="kr"><b>完成回顧</b>　評分 ${o.review.score.toFixed(1)}${o.review.d ? '（' + o.review.d + '）' : ''}<div class="small">${E(o.review.text)}</div></div>` : ''}
                <div class="row" style="margin-top:8px"><input type="text" class="kn" placeholder="關鍵結果" maxlength="60" aria-label="關鍵結果名稱"><input type="number" class="kt" placeholder="目標值" min="0" step="any" inputmode="decimal" aria-label="目標值" style="max-width:100px"><input type="text" class="ku" placeholder="單位" maxlength="10" aria-label="單位" style="max-width:80px"><button class="sm" data-act="kradd">加 KR</button></div>
                <div class="acts" style="margin-top:8px"><button class="sm" data-act="rev">完成回顧</button><button class="sm" data-act="arch">${o.archived ? '取消封存' : '封存'}</button><button class="sm" data-act="odel" aria-label="刪除目標 ${E(o.title)}">刪除目標</button></div></div>`;
            }).join('') : '<div class="card"><p class="muted">還沒有目標。先在上面新增一個。</p></div>';
        }
        $('#oAdd').onclick = () => {
            const r = addObj(okr, $('#oTitle').value, twToday()); if (r.err) { say(r.err); return; }
            okr = r.list; saveO(); $('#oTitle').value = ''; renderOkr();
        };
        $('#oTitle').onkeydown = (e) => { if (e.key === 'Enter') $('#oAdd').click(); };
        $('#oArch').onchange = renderOkr;
        $('#oClear').onclick = () => {
            if (!okr.length) { say('沒有 OKR'); return; }
            if (!confirm(`清除全部 ${okr.length} 個目標（含關鍵結果、歷史與回顧）？無法復原。`)) return;
            okr = []; saveO(); renderOkr();
        };
        $('#oList').onclick = (e) => {
            const b = e.target.closest('button[data-act]'); if (!b) return;
            const card = b.closest('[data-oid]'), oid = card.dataset.oid, o = okr.find(x => x.id === oid); if (!o) return;
            const kid = b.closest('[data-kid]')?.dataset.kid, k = kid && o.krs.find(x => x.id === kid), act = b.dataset.act;
            let r;
            if (act === 'kradd') r = addKr(okr, oid, card.querySelector('.kn').value, card.querySelector('.kt').value, card.querySelector('.ku').value);
            else if (act === 'upd') {
                const v = prompt(`「${k.name}」目前值（${k.unit || '數字'}）？`, k.cur); if (v === null) return;
                r = setKr(okr, oid, kid, v, twToday());
            } else if (act === 'krdel') {
                if (!confirm(`刪除關鍵結果「${k.name}」與它的歷史？無法復原。`)) return;
                r = { list: okr.map(x => (x.id === oid ? { ...x, krs: x.krs.filter(y => y.id !== kid) } : x)) };
            } else if (act === 'odel') {
                if (!confirm(`刪除目標「${o.title}」與它的 ${o.krs.length} 個關鍵結果、歷史、回顧？無法復原。`)) return;
                r = { list: okr.filter(x => x.id !== oid) };
            } else if (act === 'arch') r = { list: okr.map(x => (x.id === oid ? { ...x, archived: !x.archived } : x)) };
            else if (act === 'rev') {
                const sc = prompt(`「${o.title}」評分（0–1.0）？`, o.review ? o.review.score : String(objPct(o) / 100)); if (sc === null) return;
                const s = num(sc, 0, 1); if (s === null) { say('評分請填 0 到 1 之間'); return; }
                const t = prompt('總結（做到什麼、學到什麼，1000 字內）', o.review ? o.review.text : ''); if (t === null) return;
                r = { list: okr.map(x => (x.id === oid ? { ...x, review: { score: Math.round(s * 10) / 10, text: str(t, RK.FIELD_MAX), d: twToday() } } : x)) };
            }
            if (!r) return;
            if (r.err) { say(r.err); return; }
            okr = r.list; saveO(); renderOkr();
        };

        // ---------- 每週回顧 ----------
        let wk = cleanWeekly(Util.store.get('reflect_weekly', null)), curWk = weekMonday(twToday());
        const saveW = () => Util.store.set('reflect_weekly', wk);
        const wEntry = (w) => wk.entries.find(e => e.wk === w);
        const wLabel = (w) => { const i = isoWeek(w); return `${i.year} 第 ${i.week} 週（${w.slice(5)} ~ ${Util.day.shift(w, 6).slice(5)}）`; };
        function renderWeekForm() {
            const e = wEntry(curWk) || { a: {}, energy: 0, mood: 0 };
            $('#wTitle').textContent = wLabel(curWk) + (curWk === weekMonday(twToday()) ? '・本週' : '');
            const sel = (id, v) => `<select id="${id}" aria-label="${id === 'wEn' ? '能量' : '心情'}"><option value="0">未填</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${v === n ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
            $('#wForm').innerHTML = QS.filter(q => !wk.off.includes(q.id)).map(q => `<label class="q" for="wq-${q.id}">${q.t}</label><textarea id="wq-${q.id}" maxlength="${RK.FIELD_MAX}" data-q="${q.id}">${E(e.a[q.id] || '')}</textarea>`).join('')
                + `<div class="row" style="margin-top:12px"><label>能量（1–5）${sel('wEn', e.energy)}</label><label>心情（1–5）${sel('wMo', e.mood)}</label></div>`;
            $('#wMsg').textContent = wEntry(curWk) ? '這週已有回顧，儲存會覆蓋。' : '';
            $('#wDel').hidden = !wEntry(curWk);
        }
        function renderWeekly() {
            renderWeekForm();
            $('#wQs').innerHTML = QS.map(q => `<label class="small" style="display:block"><input type="checkbox" data-q="${q.id}"${wk.off.includes(q.id) ? '' : ' checked'}> ${q.t}</label>`).join('');
            renderHist();
        }
        function renderHist() {
            const list = searchWeeks(wk.entries, $('#wQ').value).slice().reverse();
            $('#wHist').innerHTML = list.length ? list.map(e => `<div class="li" data-wk="${e.wk}"><div class="grow"><b>${wLabel(e.wk)}</b><div class="small">${E(QS.map(q => e.a[q.id]).find(Boolean) || '').slice(0, 60)}${e.energy ? `　能量 ${e.energy}` : ''}${e.mood ? `　心情 ${e.mood}` : ''}</div></div><div class="acts"><button class="sm" data-act="open">開啟</button></div></div>`).join('') : '<p class="muted">沒有符合的回顧。</p>';
            $('#wUsage').textContent = `回顧 ${wk.entries.length} / ${RK.WEEK_MAX} 週，單篇 ≤ ${RK.TEXT_MAX} 字`;
        }
        const readWeek = () => {
            const a = {};
            for (const t of $('#wForm').querySelectorAll('textarea')) if (t.value.trim()) a[t.dataset.q] = t.value.slice(0, RK.FIELD_MAX);
            const old = wEntry(curWk);
            for (const q of wk.off) if (old && old.a[q]) a[q] = old.a[q]; // 關掉的題目保留舊答案
            return { wk: curWk, a, energy: +$('#wEn').value, mood: +$('#wMo').value };
        };
        $('#wSave').onclick = () => {
            const r = saveWeek(wk.entries, readWeek()); if (r.err) { say(r.err); return; }
            wk.entries = r.list; saveW(); renderWeekly(); say('已儲存');
        };
        $('#wDel').onclick = () => {
            if (!confirm(`刪除 ${wLabel(curWk)} 的回顧？無法復原。`)) return;
            wk.entries = wk.entries.filter(e => e.wk !== curWk); saveW(); renderWeekly();
        };
        $('#wPrev').onclick = () => { curWk = Util.day.shift(curWk, -7); renderWeekForm(); };
        $('#wNext').onclick = () => { curWk = Util.day.shift(curWk, 7); renderWeekForm(); };
        $('#wNow').onclick = () => { curWk = weekMonday(twToday()); renderWeekForm(); };
        $('#wCopy').onclick = () => { const e = wEntry(curWk); if (!e) { say('這週還沒儲存'); return; } Util.copyWithFeedback($('#wCopy'), weekMd(e, wk.off)); };
        $('#wQs').onchange = (e) => {
            const id = e.target.dataset.q; if (!id) return;
            wk.off = e.target.checked ? wk.off.filter(x => x !== id) : [...wk.off, id]; saveW(); renderWeekForm();
        };
        $('#wQ').oninput = renderHist;
        $('#wHist').onclick = (e) => { const b = e.target.closest('button[data-act]'); if (!b) return; curWk = b.closest('[data-wk]').dataset.wk; renderWeekForm(); window.scrollTo(0, 0); };
        $('#wExport').onclick = () => {
            if (!wk.entries.length) { say('沒有回顧可匯出'); return; }
            const md = wk.entries.slice().reverse().map(e => weekMd(e)).join('\n---\n\n');
            Util.download(new Blob([md], { type: 'text/markdown;charset=utf-8' }), `每週回顧_${twToday()}.md`);
        };
        $('#wClear').onclick = () => {
            if (!wk.entries.length) { say('沒有回顧'); return; }
            if (!confirm(`清除全部 ${wk.entries.length} 週的回顧？問題開關會保留。無法復原（建議先匯出）。`)) return;
            wk.entries = []; saveW(); renderWeekly();
        };

        // ---------- 決策矩陣 ----------
        let decs = cleanDecisions(Util.store.get('reflect_decision', [])), curDec = decs[0] ? decs[0].id : null;
        const saveD = () => Util.store.set('reflect_decision', decs);
        const dCur = () => decs.find(d => d.id === curDec);
        function renderDecRes() {
            const d = dCur(); if (!d) { $('#dRes').innerHTML = ''; return; }
            const rows = decRank(d), best = decBest(rows), sens = sensitivity(d), ch = sens.filter(x => x.changed);
            $('#dRes').innerHTML = `<h2>結果</h2>` + (rows.length && d.crits.length ? rows.map((r, i) => `<div class="li stat"><span class="${best.includes(r.id) ? 'win' : ''}">${i + 1}. ${E(r.name)}${best.includes(r.id) ? '（最佳）' : ''}${r.miss ? `<span class="small">　${r.miss} 格未填</span>` : ''}</span><b>${r.total} 分・${r.pct}%</b></div>`).join('')
                + (sens.length ? `<p class="small" style="margin-top:8px">敏感度：${ch.length ? `<span class="st-warn">結果不穩</span>，${ch.map(x => `${E(x.crit)} 權重${x.delta > 0 ? '+' : '−'}1 → ${E(x.best)}`).join('；')}` : '各準則權重 ±1 後最佳選項都不變，結果穩定。'}</p>` : '<p class="small">填入分數後顯示最佳選項與敏感度。</p>') : '<p class="muted">加入至少一個選項與一個準則。</p>');
        }
        function renderDec() {
            $('#dSel').innerHTML = decs.map(d => `<option value="${d.id}"${d.id === curDec ? ' selected' : ''}>${E(d.name)}</option>`).join('') || '<option value="">（尚無決策）</option>';
            $('#dUsage').textContent = `決策 ${decs.length} / ${RK.DEC_MAX}　每個決策選項 ≤ ${RK.OPT_MAX}、準則 ≤ ${RK.CRIT_MAX}`;
            const d = dCur();
            $('#dBox').hidden = $('#dRes').hidden = !d; $('#dDel').disabled = !d;
            if (!d) { $('#dName').value = ''; $('#dName').disabled = true; return; }
            $('#dName').disabled = false; $('#dName').value = d.name;
            $('#dMx').innerHTML = d.opts.length && d.crits.length ? `<table class="mx"><thead><tr><th></th>${d.crits.map(c => `<th data-cid="${c.id}"><input type="text" class="nm" data-f="cn" value="${E(c.n)}" maxlength="30" aria-label="準則名稱"><br><input type="number" data-f="cw" value="${c.w}" min="1" max="10" inputmode="numeric" aria-label="權重 ${E(c.n)}"><button class="sm" data-act="cdel" aria-label="刪除準則 ${E(c.n)}">×</button></th>`).join('')}</tr></thead><tbody>${d.opts.map(o => `<tr data-oid="${o.id}"><th><input type="text" class="nm" data-f="on" value="${E(o.n)}" maxlength="30" aria-label="選項名稱"><button class="sm" data-act="odel" aria-label="刪除選項 ${E(o.n)}">×</button></th>${d.crits.map(c => `<td><input type="number" data-f="s" data-cid="${c.id}" value="${d.sc[o.id + '|' + c.id] || ''}" min="1" max="10" inputmode="numeric" aria-label="${E(o.n)} ${E(c.n)} 分數"></td>`).join('')}</tr>`).join('')}</tbody></table>`
                : `<p class="muted">已有 ${d.opts.length} 個選項、${d.crits.length} 個準則；兩者都至少要有一個才會出現矩陣。${d.opts.length ? '<br>' + d.opts.map(o => `${E(o.n)} <button class="sm" data-act="odel" data-oid="${o.id}">×</button>`).join('　') : ''}${d.crits.length ? '<br>' + d.crits.map(c => `${E(c.n)} <button class="sm" data-act="cdel" data-cid="${c.id}">×</button>`).join('　') : ''}</p>`;
            renderDecRes();
        }
        $('#dSel').onchange = () => { curDec = $('#dSel').value; renderDec(); };
        $('#dNew').onclick = () => { const r = addDec(decs, ''); if (r.err) { say(r.err); return; } decs = r.list; curDec = r.id; saveD(); renderDec(); $('#dName').focus(); };
        $('#dName').oninput = () => { const d = dCur(); if (!d) return; d.name = str($('#dName').value, 40) || '未命名決策'; saveD(); const op = $('#dSel').selectedOptions[0]; if (op) op.textContent = d.name; renderDecRes(); };
        $('#dDel').onclick = () => {
            const d = dCur(); if (!d || !confirm(`刪除決策「${d.name}」？無法復原。`)) return;
            decs = decs.filter(x => x.id !== d.id); curDec = decs[0] ? decs[0].id : null; saveD(); renderDec();
        };
        $('#dClear').onclick = () => {
            if (!decs.length) { say('沒有決策'); return; }
            if (!confirm(`清除全部 ${decs.length} 個決策？無法復原。`)) return;
            decs = []; curDec = null; saveD(); renderDec();
        };
        const addTo = (kind) => {
            const d = dCur(); if (!d) return;
            const inp = kind === 'o' ? $('#dOpt') : $('#dCrit'), n = str(inp.value, 30), arr2 = kind === 'o' ? d.opts : d.crits, max = kind === 'o' ? RK.OPT_MAX : RK.CRIT_MAX;
            if (!n) { say('請輸入名稱'); return; }
            if (arr2.length >= max) { say(`${kind === 'o' ? '選項' : '準則'}最多 ${max} 個`); return; }
            arr2.push(kind === 'o' ? { id: uid(), n } : { id: uid(), n, w: 5 });
            inp.value = ''; saveD(); renderDec();
        };
        $('#dOptAdd').onclick = () => addTo('o'); $('#dCritAdd').onclick = () => addTo('c');
        $('#dOpt').onkeydown = (e) => { if (e.key === 'Enter') addTo('o'); };
        $('#dCrit').onkeydown = (e) => { if (e.key === 'Enter') addTo('c'); };
        // 輸入時只更新資料與結果區，不重畫矩陣（否則手機輸入會失去焦點）
        $('#dMx').oninput = (e) => {
            const d = dCur(), f = e.target.dataset.f; if (!d || !f) return;
            const oid = e.target.closest('tr[data-oid]')?.dataset.oid, cid = e.target.closest('th[data-cid]')?.dataset.cid || e.target.dataset.cid;
            if (f === 'on') { const o = d.opts.find(x => x.id === oid); if (o) o.n = str(e.target.value, 30) || o.n; }
            else if (f === 'cn') { const c = d.crits.find(x => x.id === cid); if (c) c.n = str(e.target.value, 30) || c.n; }
            else if (f === 'cw') { const c = d.crits.find(x => x.id === cid), v = num(e.target.value, 1, 10); if (c && v !== null) c.w = Math.round(v); }
            else if (f === 's') { const v = num(e.target.value, 1, 10), k = oid + '|' + cid; if (v !== null) d.sc[k] = Math.round(v); else delete d.sc[k]; }
            saveD(); renderDecRes();
        };
        $('#dMx').onclick = (e) => {
            const b = e.target.closest('button[data-act]'), d = dCur(); if (!b || !d) return;
            const oid = b.closest('tr[data-oid]')?.dataset.oid || b.dataset.oid, cid = b.closest('th[data-cid]')?.dataset.cid || b.dataset.cid;
            if (b.dataset.act === 'odel') {
                if (!confirm('刪除這個選項與它的分數？無法復原。')) return;
                d.opts = d.opts.filter(o => o.id !== oid); for (const k of Object.keys(d.sc)) if (k.startsWith(oid + '|')) delete d.sc[k];
            } else {
                if (!confirm('刪除這個準則與各選項在它上面的分數？無法復原。')) return;
                d.crits = d.crits.filter(c => c.id !== cid); for (const k of Object.keys(d.sc)) if (k.endsWith('|' + cid)) delete d.sc[k];
            }
            saveD(); renderDec();
        };
        $('#dCopy').onclick = () => { const d = dCur(); if (!d) return; Util.copyWithFeedback($('#dCopy'), decText(d)); };

        renderOkr(); renderWeekly(); renderDec();
    </script>
</body>

</html>
