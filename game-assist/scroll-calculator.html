<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="捲軸期望值計算機：輸入成功率與花費，算出平均要用幾張、花多少，以及各把握度需要的次數。">
    <meta property="og:title" content="捲軸期望值計算機" />
    <meta property="og:description" content="算出衝捲平均要花多少、要用幾張才有把握。" />
    <meta property="og:image" content="https://andynavy23.github.io/simple_tools/assets/og-image.png" />
    <meta property="og:url" content="https://andynavy23.github.io/simple_tools/game-assist/scroll-calculator.html" />
    <title>捲軸期望值計算機</title>
    <link rel="stylesheet" href="../shared/css/theme.css">
    <style>

        .big {
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html">‹ 工具箱</a>
        <h1>捲軸期望值計算機</h1>
        <p class="sub">不內建任何遊戲數值，成功率與價格都由你填，適用任何「成功率 × 花費」的強化。</p>

        <div class="card">
            <div class="fgrid">
                <div><label for="k">需要成功幾次</label><input id="k" type="number" min="1" max="50" value="1"></div>
                <div><label for="p">單次成功率 (%)</label><input id="p" type="number" min="0.01" max="100" step="any" value="60"></div>
                <div><label for="c">每張捲軸價格</label><input id="c" type="number" min="0" step="any" value="100"></div>
                <div><label for="d">失敗時裝備損毀機率 (%)</label><input id="d" type="number" min="0" max="100" step="any" value="0"></div>
                <div><label for="price">裝備本身價格（損毀時重買）</label><input id="price" type="number" min="0" step="any" value="0"></div>
            </div>
        </div>

        <div class="card" id="out"></div>
    </div>

    <script src="../shared/js/util.js"></script>
    <script>
        // --- pure ---
        // 期望總花費：要累積 k 次成功；每次嘗試花 c，成功機率 p；
        // 失敗時有 d 的機率裝備損毀，損毀要重買 price 並從 0 次成功重來。
        // 設 E[s] = a_s + b_s * E[0]（s = 目前已成功次數），由 E[k] = 0 往回推，再解出 E[0]。
        function expected(k, p, d, c, price) {
            const q = 1 - (1 - p) * (1 - d); // 每次嘗試後「狀態有變化」的機率
            let a = 0, b = 0;
            for (let s = k - 1; s >= 0; s--) {
                a = (c + p * a + (1 - p) * d * price) / q;
                b = (p * b + (1 - p) * d) / q;
            }
            return a / (1 - b);
        }

        // d = 0 時：需要的嘗試次數 N 滿足 P(N 次內成功 >= k) >= level 的最小值
        function attemptsFor(k, p, level, cap = 200000) {
            const dist = new Array(k).fill(0); // dist[j] = 目前恰好 j 次成功的機率（j < k）
            dist[0] = 1;
            for (let n = 1; n <= cap; n++) {
                for (let j = k - 1; j >= 0; j--) {
                    const stay = dist[j] * (1 - p);
                    dist[j] = stay + (j > 0 ? dist[j - 1] * p : 0);
                }
                // 從 k-1 成功的機率質量，移走成功的那一份
                const done = 1 - dist.reduce((s, x) => s + x, 0);
                if (done >= level) return n;
            }
            return null;
        }
        // --- /pure ---

        const $ = (s) => document.querySelector(s);
        const num = (id) => parseFloat($('#' + id).value);
        const money = (v) => v.toLocaleString('zh-TW', { maximumFractionDigits: 2 });

        const row = Util.statRow;

        function render() {
            const out = $('#out');
            out.replaceChildren();
            const k = Math.floor(num('k')), p = num('p') / 100, d = num('d') / 100, c = num('c'), price = num('price');
            if (!(k >= 1 && k <= 50) || !(p > 0 && p <= 1) || !(d >= 0 && d <= 1) || !(c >= 0) || !(price >= 0)) {
                out.textContent = '請檢查輸入：成功次數 1–50、成功率 0.01–100%、損毀機率 0–100%、價格不可為負';
                return;
            }
            const uses = expected(k, p, d, 1, 0);
            const items = expected(k, p, d, 0, 1);
            const h = document.createElement('h2');
            h.textContent = '期望值';
            out.append(h,
                row('平均要用捲軸', `${money(uses)} 張`),
                row('平均總花費', money(expected(k, p, d, c, price)), 'big'));
            if (d > 0) out.append(row('平均損毀裝備', `${money(items)} 件`));

            if (d === 0) {
                const h2 = document.createElement('h2');
                h2.style.marginTop = '16px';
                h2.textContent = '要用幾張才有把握';
                out.append(h2);
                for (const lv of [0.5, 0.8, 0.95, 0.99]) {
                    const n = attemptsFor(k, p, lv);
                    out.append(row(`${lv * 100}% 機率完成`, n ? `${n} 張（約 ${money(n * c)}）` : '次數過多，無法估算'));
                }
            } else {
                const n = document.createElement('p');
                n.className = 'note';
                n.textContent = '有損毀機率時，「幾張才有把握」的分佈較複雜，這裡只提供平均值。';
                out.append(n);
            }
            const note = document.createElement('p');
            note.className = 'note';
            note.textContent = '期望值是長期平均，單次可能遠高於或低於這個數字。';
            out.append(note);
        }

        document.querySelectorAll('input').forEach(i => i.oninput = render);
        render();
    </script>
</body>

</html>
